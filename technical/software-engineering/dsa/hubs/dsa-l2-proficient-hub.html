<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DSA L2 Proficient Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}
.seq .arrow{position:relative;align-self:center;height:0;border-top:2px solid var(--accent);margin-inline:10%}
.seq .arrow.dash{border-top-style:dashed}
.seq .arrow::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.seq .arrow.r::after{right:-2px;border-left:8px solid var(--accent);border-right:0}
.seq .arrow.l::after{left:-2px;border-right:8px solid var(--accent);border-left:0}
.seq .arrow .t{position:absolute;left:0;right:0;bottom:3px;text-align:center;color:var(--fg);line-height:1.2;padding-inline:2px}
.seq .self{align-self:center;justify-self:center;border:1.5px dashed var(--accent);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--fg)}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1.5px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{position:relative;padding:4px 0 4px 10px;font-size:.88rem}
.tree li::before{content:"";position:absolute;left:-18px;top:16px;width:22px;border-top:1.5px solid var(--line)}
.tree>ul>li::before{display:none}
.tree .q{display:inline-block;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.tree .br{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.tree .leaf{display:inline-block;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:2px 8px}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;font-size:.86rem}
.quad .ax{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center;justify-self:center}
.quad .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px}
.quad .cell b{display:block;font-family:var(--f-display)}

/* Questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;min-width:0}
.q .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.q .stem{font-weight:700;margin-bottom:10px;white-space:pre-wrap}
.q .hint{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.yn{display:grid;gap:6px}
.yn .st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.yn .st.right{border-color:var(--good);background:var(--good-soft)} .yn .st.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord{display:grid;gap:6px;counter-reset:o}
.ord .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ord .it .pos{font-family:var(--f-mono);font-weight:600;color:var(--muted);width:1.6em}
.ord .it.right{border-color:var(--good);background:var(--good-soft)} .ord .it.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord .mv{display:flex;gap:4px}
.ord .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700}
.match{display:grid;gap:6px}
.match .pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.match .pr.right{border-color:var(--good);background:var(--good-soft)} .match .pr.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match select{width:100%;min-width:0}
pre.dropcode{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:var(--r);overflow-x:auto;line-height:2;margin:0 0 6px;font-size:.82rem;white-space:pre}
pre.dropcode select{font-family:var(--f-mono);font-size:.78rem;padding:1px 4px;border-radius:5px;background:#1d2a38;color:#e7eef6;border:1px solid #3d5168}
pre.dropcode select.right{border-color:#4fc98d;box-shadow:0 0 0 1px #4fc98d}
pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}
.expl{margin-top:9px;font-size:.93rem;border-top:1px solid var(--line);padding-top:9px}
.expl .v{font-weight:700}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Practice / mock / cases */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.mock-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);display:grid;gap:12px}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 0;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--fg)}
.navgrid button.flag::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--trap)}
.navgrid button.cs{border-style:dashed}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.82rem;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.dbars{display:grid;gap:8px;margin-top:10px}
.dbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:.86rem}
.dbar .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.dbar .tr i{display:block;height:100%}
.dbar b{text-align:right;font-variant-numeric:tabular-nums}
.verdict{padding:12px 14px;border-radius:8px;font-weight:700;margin-top:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.mid{background:var(--trap-soft);color:var(--trap)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.na{background:var(--surface-2);color:var(--muted)}
.case-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.case-doc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 126px);overflow:auto}
.case-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.case-tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:.82rem;font-weight:700;cursor:pointer}
.case-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scenario{font-size:.93rem}
.scenario ul{padding-left:20px;margin:6px 0}
details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}
details.scen summary{cursor:pointer;font-weight:700;color:var(--info)}

/* Flashcards */
.fc{max-width:660px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}
.card .side{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .txt{font-size:1.1rem}
.card.back{background:var(--accent-soft)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--surface-2);border-radius:7px;padding:6px;text-align:center;font-size:.76rem}
.boxes b{display:block;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}

/* Labs, interview, cheat */
details.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.lab+details.lab{margin-top:10px}
details.lab summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.lab summary::-webkit-details-marker{display:none}
details.lab summary h3{font-size:1.02rem}
details.lab .body{display:grid;gap:12px;margin-top:12px}
.cost{font-size:.88rem}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.cs-grid .panel h3{font-size:.98rem;margin-bottom:8px}
.cs-grid ul{margin:0;padding-left:18px;font-size:.9rem} .cs-grid li{margin-bottom:4px}
.gloss{display:grid;gap:0}
.gloss div{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.gloss b{font-family:var(--f-display)}

/* AI tutor */
.ai-only{display:none!important}
body.has-ai .ai-only{display:revert!important}
body.has-ai .no-ai{display:none!important}
.ai-box{border:1px solid color-mix(in srgb,var(--info) 35%,var(--line));background:var(--surface);border-radius:var(--r);padding:14px 16px}
.ai-out{margin-top:10px;font-size:.95rem;min-height:1em}
.ai-out:empty{display:none}
.ai-out p:last-child{margin-bottom:0}
.ai-out pre{background:var(--surface-2);padding:10px;border-radius:8px;overflow-x:auto}
.ai-note{font-size:.78rem;color:var(--muted)}
.chat{display:grid;gap:8px;margin-top:10px}
.bub{border-radius:10px;padding:9px 12px;max-width:92%;font-size:.94rem}
.bub.me{justify-self:end;background:var(--accent-soft)}
.bub.ai{justify-self:start;background:var(--surface-2)}
.bub p:last-child{margin-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ===== hub engine v2 additions ===== */
:root{--d6:#8a5a00;--d6-soft:#f6ead2;--d7:#2b6f99;--d7-soft:#dcebf5;--d8:#7a3f9e;--d8-soft:#efe1f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d6:#e6b85c;--d6-soft:#2e2410;--d7:#7cc0ec;--d7-soft:#10283a;--d8:#d4a2f2;--d8-soft:#2c1838}}
:root[data-theme="dark"]{--d6:#e6b85c;--d6-soft:#2e2410;--d7:#7cc0ec;--d7-soft:#10283a;--d8:#d4a2f2;--d8-soft:#2c1838}
.chip.d6{background:var(--d6-soft);color:var(--d6)} .chip.d7{background:var(--d7-soft);color:var(--d7)} .chip.d8{background:var(--d8-soft);color:var(--d8)}

/* code tabs (Python | JavaScript …) */
.ctabs .ttl{justify-content:space-between}
.ctab-btns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}

.out{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;overflow-x:auto;margin:0}
.out-l{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.langpick{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
/* array / string cells */
.cells-wrap{display:grid;gap:4px}
.cells-row{display:flex;gap:10px;align-items:center;min-width:0}

window.HUB = {"id":"dsa-l2","code":"DSA · L2","title":"DSA L2 Proficient Hub","brand":"Proficient Hub","cert":"Data Structures & Algorithms · L2 Proficient","eyebrow":"Level L2 Proficient · Data Structures & Algorithms · Python + JavaScript","pace":6,"accessed":"9 October 2026","hero":{"title":"Trees, graphs and dynamic programming, the medium-problem toolkit","sub":"Level L2 takes you from easy problems to the medium ones most interviews are made of. Twelve topics, from tree recursion to bitmasks, each told first as a toy-room story and then properly, with every example in **Python and JavaScript** side by side. You finish with six working builds, a 150-problem log and four timed mock interviews."},"facts":[["12","topics, each a 90–120 minute module"],["120–150 h","to finish L2 at your own pace, about half of it practice problems"],["2","languages for every example: Python + JavaScript"],["150","curated problems in the milestone (NeetCode 150)"],["4","timed mock interviews"],["6 + 1","labs plus the capstone"]],"notices":[{"k":"info","t":"Start after L1","x":"L2 assumes Big-O, hash maps, two pointers, stacks and queues, recursion and binary search from the L1 hub. If the L1 hub's quizzes (or a quick self-check) show gaps in those, spend a few days there first: every L2 pattern is built on them."},{"k":"info","t":"Python and JavaScript side by side","x":"Every code block has a **Python | JavaScript** switch, remembered across modules. All examples were run against tests on 9 Oct 2026 (Python 3.13, Node.js 22). JavaScript has no built-in heap, so module 03 gives you a small one to reuse."},{"k":"info","t":"Proven by evidence, not a certificate","x":"No widely recognised DSA certification exists. L2 is complete when every module quiz is at 80%+, the six labs and the capstone library pass their tests in both languages, your 150-problem log names a pattern for each problem, and you've done four timed mock interviews."}],"howto":["Take the **diagnostic** first (15 minutes  you to name the pattern quickly, code it cleanly and explain the trade-offs. Answer each question out loud in about 90 seconds, then compare with the model answer. State complexity every time.","interviewEyebrow":"From practice to interview","interviewSkills":"trees, graphs, dynamic programming and other medium-level data structures and algorithms","interviewTopics":"DSA L2 (trees, BSTs, heaps, tries, BFS/DFS, topological sort, union-find, backtracking, dynamic programming, greedy, bit manipulation)","roles":["Software engineer","Backend developer","Data engineer (coding round)"],"domains":[{"id":"d1","short":"A","name":"Trees, heaps & tries","w":[30,30]},{"id":"d2","short":"B","name":"Graphs & union-find","w":[25,25]},{"id":"d3","short":"C","name":"Backtracking & dynamic programming","w":[30,30]},{"id":"d4","short":"D","name":"Greedy & bit manipulation","w":[15,15]}],"groups":[{"id":"g1","t":"Trees, heaps & tries","mods":["m01","m02","m03","m04"]},{"id":"g2","t":"Graphs","mods":["m05","m06","m07"]},{"id":"g3","t":"Search & DP","mods":["m08","m09","m10"]},{"id":"g4","t":"Greedy & bits","mods":["m11","m12"]}],"modules":[{"id":"m01","d":"d1","t":"Binary trees: traversals and tree recursion","min":100,"hook":"Trees are everywhere: file systems, web pages, org charts, database indexes, and a large share of medium interview problems. Almost every tree problem is solved by one idea: ask each child for its answer, then combine.","pre":{"q":"A tree's height is 1 + the taller child's height. Using only that rule, what's the height of a single node with no children (counting nodes, not edges)?","a":"1. An empty child has height 0, so the node's height is 1 + max(0, 0) = 1. Deciding what the *empty* tree returns (0) is the base case that makes the recursion work."},"kid":{"t":"The family tree","x":"Ben draws the family tree on a big sheet: Grandma at the top, her two children under her, and their children under them. To count everyone, he doesn't run around the whole sheet. He asks Grandma: “How many people are in your branch?” She asks each of her children the same question, and they ask theirs, all the way down. A person with no children answers “just me: 1”. Everyone else adds up their children's answers, plus 1 for themselves, and passes the total back up, until Grandma tells Ben the size of the whole family.","map":[["Grandma at the top","The root node"],["Asking each child “how many in your branch?”","Recursive calls on the left and right subtrees"],["“Just me: 1” from someone with no children","A leaf: 1 + 0 + 0, because its empty children (None / null) count 0"],["Adding the children's answers, plus 1 for yourself","The combine step, 1 + left + right: a postorder traversal"]],"brk":"In a binary tree each node has at most two children, and every child has exactly one parent. Real families have two parents per child, which makes them graphs, not trees. Code also needs the “empty child” case (None / null) that a family drawing never shows."},"keys":["**Binary tree**: each node has a value and up to two children, `left` and `right`. The top node is the **root**; nodes with no children are **leaves**. Height is the longest root-to-leaf path, counted in nodes or in edges: say which.","**Depth-first traversals** order the node and its two subtrees differently: **preorder** (node, left, right), **inorder** (left, node, right), **postorder** (left, right, node). Each is O(n) time and O(h) stack space, where h is the height.","**Breadth-first (level order)** uses a queue and visits the tree level by level. It's the natural fit for “per level” questions: averages, the right-side view, minimum depth.","**The tree-recursion template**: handle the empty tree (base case), recurse on `left` and `right`, then combine. Height, size, sum, mirror and “is it balanced?” all follow it.","**Return one thing, track another**: when the answer isn't what the recursion returns (diameter, maximum path sum), return what the parent needs (a height, or the best downward path sum) and update a separate best answer as you go.","**h ranges from about log₂ n to n**: a balanced tree is shallow, but a skewed one is a chain, so recursion depth can pass Python's 1,000-call limit. An explicit stack avoids that.","**LeetCode's input format** lists nodes level by level with gaps: `[3, 9, 20, null, null, 15, 7]`. This module's helpers convert between that list and a tree."],"dia":[{"type":"btree","cap":"The tree [3, 9, 20, null, null, 15, 7]","nodes":[3,9,20,null,null,15,7],"note":"Preorder 3 9 20 15 7 · Inorder 9 3 15 20 7 · Postorder 9 15 7 20 3 · Level order 3 | 9 20 | 15 7"},{"type":"tree","cap":"Which traversal does the question need?","root":{"q":"What must happen first?","c":[["the node before its children (copy, serialise)","Preorder"],["left subtree, node, right subtree (BST sorted order)","Inorder"],["children's answers before the node (height, size, delete)","Postorder"],["everything on one level before the next","Level order (BFS with a queue)"]]}}],"cmp":[{"cap":"Recursive or iterative traversal?","head":["","Recursive","Iterative (explicit stack or queue)"],"rows":[["Code length","3–5 lines","10–15 lines"],["Extra space","O(h) call stack","O(h) stack for DFS, O(widest level) queue for BFS"],["Very deep trees","Python stops near 1,000 levels; Node.js after roughly 8,000–10,000 frames, depending on the function","Fine: the stack is an ordinary list in memory"],["Use it for","Most interview problems","Very deep trees, iterators that pause and resume"]]}],"code":[{"t":"Helpers used by this module's code (run these first)","tabs":[{"lang":"python","src":"from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(level):                      # [3, 9, 20, None, None, 15, 7] -> tree\n    if not level or level[0] is None:\n        return None\n    root = TreeNode(level[0])\n    q, i = deque([root]), 1\n    while q and i < len(level):\n        node = q.popleft()\n        for side in (\"left\", \"right\"):\n            if i < len(level) and level[i] is not None:\n                child = TreeNode(level[i])\n                setattr(node, side, child)\n                q.append(child)\n            i += 1\n    return root\n\ndef to_list(root):                     # tree -> level-order list, None for gaps\n    out, q = [], deque([root])\n    while q:\n        node = q.popleft()\n        if node:\n            out.append(node.val)\n            q.append(node.left)\n            q.append(node.right)\n        else:\n            out.append(None)\n    while out and out[-1] is None:     # trim trailing gaps\n        out.pop()\n    return out\n"},{"lang":"javascript","src":"class TreeNode {\n  constructor(val = 0, left = null, right = null) { this.val = val; this.left = left; this.right = right; }\n}\n\nfunction build(level) {                // [3, 9, 20, null, null, 15, 7] -> tree\n  if (!level.length || level[0] === null) return null;\n  const root = new TreeNode(level[0]);\n  const q = [root];\n  let head = 0, i = 1;\n  while (head < q.length && i < level.length) {\n    const node = q[head++];\n    for (const side of [\"left\", \"right\"]) {\n      if (i < level.length && level[i] !== null) {\n        node[side] = new TreeNode(level[i]);\n        q.push(node[side]);\n      }\n      i++;\n    }\n  }\n  return root;\n}\n\nfunction toList(root) {                // tree -> level-order list, null for gaps\n  const out = [], q = [root];\n  for (let head = 0; head < q.length; head++) {\n    const node = q[head];\n    if (node) { out.push(node.val); q.push(node.left, node.right); }\n    else out.push(null);\n  }\n  while (out.length && out[out.length - 1] === null) out.pop();   // trim trailing gaps\n  return out;\n}\n"}]},{"t":"Four traversals on one tree","tabs":[{"lang":"python","src":"def preorder(node, out):\n    if node:\n        out.append(node.val)          # the node first\n        preorder(node.left, out)\n        preorder(node.right, out)\n    return out\n\ndef inorder(node, out):\n    if node:\n        inorder(node.left, out)\n        out.append(node.val)          # the node in the middle\n        inorder(node.right, out)\n    return out\n\ndef postorder(node, out):\n    if node:\n        postorder(node.left, out)\n        postorder(node.right, out)\n        out.append(node.val)          # the node last\n    return out\n\ndef level_order(root):\n    levels, q = [], deque([root] if root else [])\n    while q:\n        level = []\n        for _ in range(len(q)):       # exactly the nodes of this level\n            node = q.popleft()\n            level.append(node.val)\n            for child in (node.left, node.right):\n                if child:\n                    q.append(child)\n        levels.append(level)\n    return levels\n\nroot = build([3, 9, 20, None, None, 15, 7])\nprint(*preorder(root, []))\nprint(*inorder(root, []))\nprint(*postorder(root, []))\nprint(\" | \".join(\" \".join(map(str, lvl)) for lvl in level_order(root)))\n","out":"3 9 20 15 7\n9 3 15 20 7\n9 15 7 20 3\n3 | 9 20 | 15 7\n","notes":[[3,"The only difference between the three depth-first orders is where this line sits."],[26,"`len(q)` is taken once, before the loop, so the round covers exactly one level."]]},{"lang":"javascript","src":"function preorder(node, out = []) {\n  if (node) {\n    out.push(node.val);                 // the node first\n    preorder(node.left, out);\n    preorder(node.right, out);\n  }\n  return out;\n}\n\nfunction inorder(node, out = []) {\n  if (node) {\n    inorder(node.left, out);\n    out.push(node.val);                 // the node in the middle\n    inorder(node.right, out);\n  }\n  return out;\n}\n\nfunction postorder(node, out = []) {\n  if (node) {\n    postorder(node.left, out);\n    postorder(node.right, out);\n    out.push(node.val);                 // the node last\n  }\n  return out;\n}\n\nfunction levelOrder(root) {\n  const levels = [];\n  let q = root ? [root] : [];\n  while (q.length) {\n    levels.push(q.map(n => n.val));     // every node of this level\n    const next = [];\n    for (const n of q) {\n      if (n.left) next.push(n.left);\n      if (n.right) next.push(n.right);\n    }\n    q = next;                           // a fresh array per level: no shift() needed\n  }\n  return levels;\n}\n\nconst root = build([3, 9, 20, null, null, 15, 7]);\nconsole.log(...preorder(root));\nconsole.log(...inorder(root));\nconsole.log(...postorder(root));\nconsole.log(levelOrder(root).map(l => l.join(\" \")).join(\" | \"));\n","out":"3 9 20 15 7\n9 3 15 20 7\n9 15 7 20 3\n3 | 9 20 | 15 7\n","notes":[[3,"The only difference between the three depth-first orders is where this line sits."],[38,"Swapping in a new array per level avoids `shift()` on a long queue."]]}]},{"t":"The tree-recursion template: height, size, mirror","tabs":[{"lang":"python","src":"def height(node):                       # nodes on the longest root-to-leaf path\n    if node is None:\n        return 0                        # base case: the empty tree\n    return 1 + max(height(node.left), height(node.right))\n\ndef size(node):\n    if node is None:\n        return 0\n    return 1 + size(node.left) + size(node.right)\n\ndef mirror(node):                       # swap every left and right child\n    if node is None:\n        return None\n    node.left, node.right = mirror(node.right), mirror(node.left)\n    return node\n\nroot = build([4, 2, 7, 1, 3, 6, 9])\nprint(height(root), size(root))\nprint(*to_list(mirror(root)))\n","out":"3 7\n4 7 2 9 6 3 1\n","notes":[[3,"The empty tree's answer is the base case. Pick it so the combine step works for leaves too."],[14,"Both recursive calls finish before the swap, so this is a postorder step."]]},{"lang":"javascript","src":"function height(node) {                 // nodes on the longest root-to-leaf path\n  if (node === null) return 0;          // base case: the empty tree\n  return 1 + Math.max(height(node.left), height(node.right));\n}\n\nfunction size(node) {\n  if (node === null) return 0;\n  return 1 + size(node.left) + size(node.right);\n}\n\nfunction mirror(node) {                 // swap every left and right child\n  if (node === null) return null;\n  [node.left, node.right] = [mirror(node.right), mirror(node.left)];\n  return node;\n}\n\nconst root = build([4, 2, 7, 1, 3, 6, 9]);\nconsole.log(height(root), size(root));\nconsole.log(...toList(mirror(root)));\n","out":"3 7\n4 7 2 9 6 3 1\n","notes":[[2,"The empty tree's answer is the base case. Pick it so the combine step works for leaves too."]]}]},{"t":"Iterative inorder: no recursion limit","tabs":[{"lang":"python","src":"def inorder_iterative(root):\n    out, stack, node = [], [], root\n    while stack or node:\n        while node:                     # go as far left as possible\n            stack.append(node)\n            node = node.left\n        node = stack.pop()              # the leftmost node not yet visited\n        out.append(node.val)\n        node = node.right               # then its right subtree\n    return out\n\nprint(*inorder_iterative(build([3, 9, 20, None, None, 15, 7])))\n\ndeep = TreeNode(0)                      # a chain 50,000 nodes deep\ncur = deep\nfor v in range(1, 50_000):\n    cur.right = TreeNode(v)\n    cur = cur.right\nvals = inorder_iterative(deep)\nprint(len(vals), *vals[:3], vals[-1])\n","out":"9 3 15 20 7\n50000 0 1 2 49999\n","notes":[[5,"The explicit stack plays the role of the call stack, but it's an ordinary list, so depth isn't limited."],[19,"A recursive inorder would raise RecursionError on this chain."]]},{"lang":"javascript","src":"function inorderIterative(root) {\n  const out = [], stack = [];\n  let node = root;\n  while (stack.length || node) {\n    while (node) {                      // go as far left as possible\n      stack.push(node);\n      node = node.left;\n    }\n    node = stack.pop();                 // the leftmost node not yet visited\n    out.push(node.val);\n    node = node.right;                  // then its right subtree\n  }\n  return out;\n}\n\nconsole.log(...inorderIterative(build([3, 9, 20, null, null, 15, 7])));\n\nconst deep = new TreeNode(0);           // a chain 50,000 nodes deep\nlet cur = deep;\nfor (let v = 1; v < 50000; v++) {\n  cur.right = new TreeNode(v);\n  cur = cur.right;\n}\nconst vals = inorderIterative(deep);\nconsole.log(vals.length, ...vals.slice(0, 3), vals.at(-1));\n","out":"9 3 15 20 7\n50000 0 1 2 49999\n","notes":[[6,"The explicit stack plays the role of the call stack, and an array can grow far past the call-stack limit."]]}]}],"ex":{"q":"Is a binary tree height-balanced, meaning that at *every* node the left and right subtree heights differ by at most 1?","steps":["Balanced must hold at every node, not just the root.","Naive: call `height` at every node and compare. Each call costs the size of its subtree, so a chain costs O(n²) (O(n log n) when the tree really is balanced).","Better: one postorder pass. Each call returns its height, or −1 as a signal that something below is already unbalanced.","Every node is visited once: O(n) time and O(h) stack space. The −1 sentinel lets the answer bubble up without a second pass."],"code":{"t":"One pass with a sentinel","tabs":[{"lang":"python","src":"def is_balanced(root):\n    def check(node):                    # height, or -1 if unbalanced below\n        if node is None:\n            return 0\n        lh = check(node.left)\n        if lh == -1:\n            return -1                   # stop early\n        rh = check(node.right)\n        if rh == -1 or abs(lh - rh) > 1:\n            return -1\n        return 1 + max(lh, rh)\n    return check(root) != -1\n\nfor level in ([3, 9, 20, None, None, 15, 7], [1, 2, 2, 3, 3, None, None, 4, 4], []):\n    print(\"balanced\" if is_balanced(build(level)) else \"not balanced\")\n","out":"balanced\nnot balanced\nbalanced\n"},{"lang":"javascript","src":"function isBalanced(root) {\n  function check(node) {                // height, or -1 if unbalanced below\n    if (node === null) return 0;\n    const lh = check(node.left);\n    if (lh === -1) return -1;           // stop early\n    const rh = check(node.right);\n    if (rh === -1 || Math.abs(lh - rh) > 1) return -1;\n    return 1 + Math.max(lh, rh);\n  }\n  return check(root) !== -1;\n}\n\nfor (const level of [[3, 9, 20, null, null, 15, 7], [1, 2, 2, 3, 3, null, null, 4, 4], []])\n  console.log(isBalanced(build(level)) ? \"balanced\" : \"not balanced\");\n","out":"balanced\nnot balanced\nbalanced\n"}]},"a":"balanced, not balanced, balanced. In the second tree the root's left side is 3 levels deep and its right side 1 level, so the root fails. O(n) time, O(h) stack."},"fade":{"q":"Count the “good” nodes: a node is good if no node on the path from the root down to it has a bigger value.","steps":["This time information flows *down*: each call needs the biggest value seen so far on its path.",{"ask":"What extra parameter does the recursive helper need?","a":"`best`: the largest value on the path from the root to this node's parent."},{"ask":"When is a node good, and what do you pass to its children?","a":"It's good when `node.val >= best`. Pass `max(best, node.val)` to both children."},{"ask":"Time and space?","a":"O(n) time, since each node is visited once, and O(h) stack space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def good_nodes(root):\n    def walk(node, best):\n        if node is None:\n            return 0\n        good = 1 if node.val >= best else 0\n        # TODO: add the good nodes of both children, passing the new best down\n        return good\n    return walk(root, float(\"-inf\"))\n\nprint(good_nodes(build([3, 1, 4, 3, None, 1, 5])))   # expect 4\n"},{"lang":"javascript","src":"function goodNodes(root) {\n  function walk(node, best) {\n    if (node === null) return 0;\n    const good = node.val >= best ? 1 : 0;\n    // TODO: add the good nodes of both children, passing the new best down\n    return good;\n  }\n  return walk(root, -Infinity);\n}\n\nconsole.log(goodNodes(build([3, 1, 4, 3, null, 1, 5])));   // expect 4\n"}]},"solution":{"t":"Solution: pass the path maximum down","tabs":[{"lang":"python","src":"def good_nodes(root):\n    def walk(node, best):\n        if node is None:\n            return 0\n        good = 1 if node.val >= best else 0\n        best = max(best, node.val)          # what the children must beat\n        return good + walk(node.left, best) + walk(node.right, best)\n    return walk(root, float(\"-inf\"))\n\nprint(good_nodes(build([3, 1, 4, 3, None, 1, 5])), good_nodes(build([3, 3, None, 4, 2])), good_nodes(build([1])))\n","out":"4 3 1"},{"lang":"javascript","src":"function goodNodes(root) {\n  function walk(node, best) {\n    if (node === null) return 0;\n    const good = node.val >= best ? 1 : 0;\n    best = Math.max(best, node.val);        // what the children must beat\n    return good + walk(node.left, best) + walk(node.right, best);\n  }\n  return walk(root, -Infinity);\n}\n\nconsole.log(goodNodes(build([3, 1, 4, 3, null, 1, 5])), goodNodes(build([3, 3, null, 4, 2])), goodNodes(build([1])));\n","out":"4 3 1"}]}},"traps":[["“Height always counts edges.”","Some books count edges (a single node has height 0); LeetCode's “maximum depth” counts nodes (a single node has depth 1). Either is fine: say which you use and keep the base case consistent."],["“Inorder gives sorted output for any binary tree.”","Only for a binary *search* tree. For a general binary tree, inorder is just one visiting order."],["“Tree recursion uses O(log n) space.”","It uses O(h). A balanced tree has h ≈ log n, but a skewed tree has h = n: a 100,000-node chain crashes default recursion in both Python and Node.js."],["“Level order needs recursion.”","Breadth-first order uses a queue. Process `len(q)` nodes per round (or swap in a fresh array) to know where each level ends."],["“Looking at a node's two children is enough to judge ‘balanced’ or ‘valid’.”","Many tree properties depend on whole subtrees. Return the summary the parent needs (height, min and max) from each call."],["“A list works as the BFS queue.”","`list.pop(0)` is O(n) per call. Use `collections.deque.popleft()`; in JavaScript use a head index or a fresh array per level."]],"disc":[["Top-down or bottom-up: how do you decide which way information flows in a tree recursion?","If a node needs facts about its ancestors (the largest value on the path, the current depth), pass them down as parameters. If it needs facts about its descendants (height, size, whether a subtree is valid), return them up. Some problems need both."],["When would you use an iterative traversal in real code?","When trees can be very deep (degenerate or user-generated data), when you need an iterator that yields one node at a time, or when the runtime's stack is small."]],"teach":{"prompt":"Explain to a junior colleague the tree-recursion template and how it computes the height of a binary tree.","rubric":["Base case: the empty tree returns a neutral answer (0 for height)","Recurse on the left and right subtrees","Combine: 1 + max(left, right) for height","Each node is visited once: O(n) time, O(h) stack space","Mentions that h can be n for a skewed tree"],"model":"Most tree problems follow one template: handle the empty tree, ask the left and right subtrees for their answers by calling the same function, then combine those answers at the current node. For height, the empty tree has height 0, and any other node's height is 1 plus the larger of its children's heights. Each node is visited once, so it's O(n) time, and the call stack holds at most one frame per level, so O(h) space. h is about log n for a balanced tree but can be n for a skewed one, which is when an iterative version is safer."},"qa":[["Preorder, inorder, postorder: where does the node go?","Preorder: node, left, right. Inorder: left, node, right. Postorder: left, right, node."],["Which structure drives level-order traversal?","A queue (BFS): process one level's nodes and enqueue their children for the next level."],["Time and space of a recursive traversal?","O(n) time and O(h) stack space, where h is the height (about log n balanced, n worst case)."],["Height of the empty tree when you count nodes?","0, so a single node has height 1 + max(0, 0) = 1."],["Find a tree's diameter in one pass?","Return each subtree's height; at every node, update best = max(best, left height + right height)."],["When should information be passed down instead of returned up?","When a node needs facts about its ancestors, such as the largest value on its path or its depth."]],"quiz":[{"q":"What does this print? (`build` turns the level-order list into a tree.)","snip":{"t":"Trace the traversal","tabs":[{"lang":"python","src":"def walk(node, out):\n    if node:\n        walk(node.left, out)\n        walk(node.right, out)\n        out.append(node.val)\n    return out\n\nprint(*walk(build([1, 2, 3, 4, 5]), []))\n"},{"lang":"javascript","src":"function walk(node, out = []) {\n  if (node) {\n    walk(node.left, out);\n    walk(node.right, out);\n    out.push(node.val);\n  }\n  return out;\n}\n\nconsole.log(...walk(build([1, 2, 3, 4, 5])));\n"}]},"o":["4 5 2 3 1","1 2 4 5 3","4 2 5 1 3","1 2 3 4 5"],"a":0,"e":"The node is added after both subtrees: postorder. The tree is 1 with children 2 and 3, and 2 has children 4 and 5. The other options are preorder, inorder and level order."},{"q":"What does this print?","snip":{"t":"Height of a lopsided tree","tabs":[{"lang":"python","src":"def height(node):\n    return 0 if node is None else 1 + max(height(node.left), height(node.right))\n\nprint(height(build([1, 2, None, 3, None, 4])))\n"},{"lang":"javascript","src":"const height = node => (node === null ? 0 : 1 + Math.max(height(node.left), height(node.right)));\n\nconsole.log(height(build([1, 2, null, 3, null, 4])));\n"}]},"o":["4","3","6","2"],"a":0,"e":"Each node has only a left child: 1 → 2 → 3 → 4, a chain of 4 nodes. Skewed trees like this have height n."},{"q":"You need the average value on each level of a tree. Which approach fits best?","o":["Breadth-first search with a queue, one level per round","An inorder traversal","A postorder traversal that returns heights","Sort all the values first"],"a":0,"e":"Level order visits exactly one level per round, so each level's sum and count are at hand. Depth-first orders mix levels together."},{"q":"Which of these need only facts about descendants, with nothing passed down from the parent? (choose 3)","t":"ms","o":["The height of a tree","Whether the tree is balanced","The diameter of a tree","Counting nodes that are the largest on their root path","Printing each node's depth"],"a":[0,1,2],"e":"Height, balance and diameter need facts about descendants. “Largest on the path” and depth need facts about ancestors, so they pass values down."},{"q":"Judge each statement.","t":"yn","s":[["A recursive traversal of a 100,000-node chain can crash in Python with default settings.",true],["Inorder traversal of any binary tree visits the values in sorted order.",false],["Level-order traversal visits every node once: O(n) time.",true],["A tree with n nodes always has a height of about log₂ n.",false]],"e":"The default recursion limit is about 1,000. Sorted inorder only holds for BSTs. Skewed trees have height n."},{"q":"Put the tree-recursion template in order.","t":"ord","items":["Check for the empty tree and return the base answer","Call the function on the left and right children","Combine their answers with the current node's value","Return the combined answer to the caller"],"e":"Base case, recurse, combine, return. Almost every tree function has this shape."},{"q":"Complete the Python level-order traversal.","t":"drop","lang":"python","code":"def level_order(root):\n    levels, q = [], deque([root] if root else [])\n    while q:\n        level = []\n        for _ in range({{0}}):\n            node = q.{{1}}()\n            level.append(node.val)\n            for child in (node.left, node.right):\n                if child:\n                    q.{{2}}(child)\n        levels.append(level)\n    return levels\n","blanks":[{"o":["len(q)","len(levels)","len(level)","2"],"a":0},{"o":["popleft","pop","appendleft","append"],"a":0},{"o":["append","extend","insert","remove"],"a":0}],"e":"Take `len(q)` once to fix the size of this level, remove from the front with `popleft`, and add children at the back with `append`: first in, first out."},{"q":"Match each job to the traversal that fits.","t":"match","pairs":[["Copy or serialise a tree, parent before children","Preorder"],["List a BST's values in sorted order","Inorder"],["Delete every node, children first","Postorder"],["Find the rightmost node on each level","Level order"]],"extra":["Binary search"],"e":"Where the node sits relative to its subtrees decides the job each traversal is good at."}],"probs":[["LC 104 · Maximum Depth of Binary Tree","https://leetcode.com/problems/maximum-depth-of-binary-tree/","Easy","the height template"],["LC 226 · Invert Binary Tree","https://leetcode.com/problems/invert-binary-tree/","Easy","mirror: swap children recursively"],["LC 101 · Symmetric Tree","https://leetcode.com/problems/symmetric-tree/","Easy","compare two subtrees as mirror images"],["LC 543 · Diameter of Binary Tree","https://leetcode.com/problems/diameter-of-binary-tree/","Easy","return heights, track the best left + right"],["LC 112 · Path Sum","https://leetcode.com/problems/path-sum/","Easy","pass the remaining sum down"],["LC 102 · Binary Tree Level Order Traversal","https://leetcode.com/problems/binary-tree-level-order-traversal/","Medium","BFS, one level per round"],["LC 105 · Construct Binary Tree from Preorder and Inorder Traversal","https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/","Medium","preorder gives the root; inorder splits left from right"],["LC 124 · Binary Tree Maximum Path Sum","https://leetcode.com/problems/binary-tree-maximum-path-sum/","Hard","like diameter, but with values; drop negative branches"],["LC 297 · Serialize and Deserialize Binary Tree","https://leetcode.com/problems/serialize-and-deserialize-binary-tree/","Hard","preorder with null markers"]],"src":[["Python docs: collections.deque","https://docs.python.org/3/library/collections.html#collections.deque"],["MIT 6.006 Introduction to Algorithms (Spring 2020): binary trees","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["USACO Guide: Introduction to tree algorithms","https://usaco.guide/silver/intro-tree"],["Open Data Structures (Pat Morin): binary trees","https://opendatastructures.org/ods-python/6_Binary_Trees.html"]]},{"id":"m02","d":"d1","t":"Binary search trees and lowest common ancestor","min":95,"hook":"A binary search tree keeps data sorted while still allowing fast inserts and deletes: the idea behind ordered maps and database indexes. Interviews love it because one rule (left smaller, right bigger) answers so many questions.","pre":{"q":"In a tree where every left subtree holds smaller values and every right subtree bigger ones, how would you find 37 starting from a root of 50?","a":"37 < 50, so go left and ignore the whole right side. Keep comparing and turning left or right, like binary search, until you find 37 or reach an empty spot."},"kid":{"t":"The cushion path","x":"Tara sets up a game on the floor: a cushion with the number 50 at the top of the room. Every new number card walks down from the top cushion: smaller numbers step left, bigger numbers step right, until they find an empty spot and sit there. To check whether card 37 is in the game, Ben follows the same path: 37 is less than 50, so left; more than 30, so right… He never looks at the other side of the room. But when Tara adds cards that are already in order, 51, 52, 53, 54, they all step right and make one long, slow line.","map":[["The top cushion (50)","The root of the BST"],["Smaller cards step left, bigger cards step right","The BST rule: left subtree < node < right subtree"],["Following the path to check for 37","Search in O(h), ruling out one side at every step"],["Cards added in order forming one long line","A degenerate BST: height n, so every operation becomes O(n)"]],"brk":"Real BST libraries rebalance themselves (red-black and AVL trees; B-trees in databases), so the line never gets long. Neither Python nor JavaScript ships a BST in its standard library."},"keys":["**The BST rule**: for every node, all values in its left subtree are smaller and all values in its right subtree are larger. Decide where duplicates go (not allowed, or always right) and say so.","**Search, insert and delete cost O(h)**: compare with the node and go one way. Balanced → O(log n). Inserting sorted data into a plain BST builds a chain → O(n).","**Inorder traversal of a BST visits values in sorted order.** That gives you the k-th smallest value, a validity check (each value bigger than the last) and range listings.","**Validate with bounds, not just children**: pass `(low, high)` down the recursion; every node must satisfy low < val < high. Comparing a node only with its own children misses deeper mistakes.","**Delete has three cases**: a leaf (just remove it), one child (lift the child into its place), two children (copy in the inorder successor's value, then delete the successor from the right subtree).","**Lowest common ancestor (LCA)**: the deepest node with both p and q in its subtree (a node counts as its own descendant). In a BST, walk down: both smaller → left, both bigger → right, otherwise you're at the LCA. O(h).","**LCA in a general binary tree**: recurse; return the node if it is p or q; if both sides return something, this node is the LCA; otherwise pass up whichever side found something. O(n).","**Self-balancing trees** (AVL, red-black) and B-trees keep h = O(log n) by rotating or splitting nodes. You won't code them in interviews, but mention them when asked about the worst case."],"dia":[{"type":"btree","cap":"A BST, with the search path for 4 highlighted","nodes":[8,3,10,1,6,null,14,null,null,4,7,null,null,13],"hl":["8","3","6","4"],"note":"4 < 8 → left; 4 > 3 → right; 4 < 6 → left; found in 4 steps. Inorder gives 1 3 4 6 7 8 10 13 14."},{"type":"flow","cap":"Deleting a node with two children (delete 3 above)","steps":[["Find the node","3 has two children"],["Find its inorder successor","the smallest value in its right subtree: 4"],["Copy 4 into the node","every other value still fits; the old 4 below is now a duplicate"],["Delete the old 4 from the right subtree","it has at most one child: an easy case"]]}],"cmp":[{"cap":"Where a BST fits","head":["Need","Hash map","Sorted array + binary search","Balanced BST"],"rows":[["Look up a key","O(1) average","O(log n)","O(log n)"],["Insert or delete","O(1) average","O(n): items shift","O(log n)"],["Smallest or largest key","O(n)","O(1)","O(log n)"],["Next bigger key, all keys in a range","O(n)","O(log n + k)","O(log n + k)"],["In Python / JavaScript","`dict` / `Map`","`list` + `bisect` / array + a lower-bound function","Nothing built in; Python's third-party `sortedcontainers` offers the same operations"]]}],"code":[{"t":"Helpers used by this module's code (run these first)","tabs":[{"lang":"python","src":"from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(level):                      # LeetCode level order, None for gaps\n    if not level or level[0] is None:\n        return None\n    root = TreeNode(level[0])\n    q, i = deque([root]), 1\n    while q and i < len(level):\n        node = q.popleft()\n        for side in (\"left\", \"right\"):\n            if i < len(level) and level[i] is not None:\n                child = TreeNode(level[i])\n                setattr(node, side, child)\n                q.append(child)\n            i += 1\n    return root\n\ndef inorder(node, out=None):           # sorted values of a BST\n    out = [] if out is None else out\n    if node:\n        inorder(node.left, out)\n        out.append(node.val)\n        inorder(node.right, out)\n    return out\n"},{"lang":"javascript","src":"class TreeNode {\n  constructor(val = 0, left = null, right = null) { this.val = val; this.left = left; this.right = right; }\n}\n\nfunction build(level) {                // LeetCode level order, null for gaps\n  if (!level.length || level[0] === null) return null;\n  const root = new TreeNode(level[0]);\n  const q = [root];\n  let head = 0, i = 1;\n  while (head < q.length && i < level.length) {\n    const node = q[head++];\n    for (const side of [\"left\", \"right\"]) {\n      if (i < level.length && level[i] !== null) {\n        node[side] = new TreeNode(level[i]);\n        q.push(node[side]);\n      }\n      i++;\n    }\n  }\n  return root;\n}\n\nfunction inorder(node, out = []) {     // sorted values of a BST\n  if (node) {\n    inorder(node.left, out);\n    out.push(node.val);\n    inorder(node.right, out);\n  }\n  return out;\n}\n"}]},{"t":"Search and insert, and why insert order matters","tabs":[{"lang":"python","src":"def search(root, target):                # O(h)\n    node = root\n    while node and node.val != target:\n        node = node.left if target < node.val else node.right\n    return node\n\ndef insert(root, val):                   # O(h); returns the (possibly new) root\n    if root is None:\n        return TreeNode(val)\n    if val < root.val:\n        root.left = insert(root.left, val)\n    elif val > root.val:\n        root.right = insert(root.right, val)\n    return root                          # duplicates are ignored\n\ndef height(node):\n    return 0 if node is None else 1 + max(height(node.left), height(node.right))\n\nroot = None\nfor v in [8, 3, 10, 1, 6, 14, 4, 7, 13]:\n    root = insert(root, v)\nprint(*inorder(root))                    # sorted\nprint(search(root, 6).val, \"found\" if search(root, 5) else \"missing\")\n\nchain = None\nfor v in range(1, 256):                  # sorted input: every value goes right\n    chain = insert(chain, v)\n\ndef middle_first(lo, hi, out):           # medians first gives a balanced tree\n    if lo <= hi:\n        mid = (lo + hi) // 2\n        out.append(mid)\n        middle_first(lo, mid - 1, out)\n        middle_first(mid + 1, hi, out)\n    return out\n\nbalanced = None\nfor v in middle_first(1, 255, []):\n    balanced = insert(balanced, v)\nprint(height(chain), height(balanced))\n","out":"1 3 4 6 7 8 10 13 14\n6 missing\n255 8\n","notes":[[4,"One comparison decides which subtree to ignore."],[40,"The same 255 values: a chain 255 levels tall versus a tree 8 levels tall (2⁸ − 1 = 255)."]]},{"lang":"javascript","src":"function search(root, target) {          // O(h)\n  let node = root;\n  while (node && node.val !== target) node = target < node.val ? node.left : node.right;\n  return node;\n}\n\nfunction insert(root, val) {             // O(h); returns the (possibly new) root\n  if (root === null) return new TreeNode(val);\n  if (val < root.val) root.left = insert(root.left, val);\n  else if (val > root.val) root.right = insert(root.right, val);\n  return root;                           // duplicates are ignored\n}\n\nconst height = node => (node === null ? 0 : 1 + Math.max(height(node.left), height(node.right)));\n\nlet root = null;\nfor (const v of [8, 3, 10, 1, 6, 14, 4, 7, 13]) root = insert(root, v);\nconsole.log(...inorder(root));           // sorted\nconsole.log(search(root, 6).val, search(root, 5) ? \"found\" : \"missing\");\n\nlet chain = null;\nfor (let v = 1; v < 256; v++) chain = insert(chain, v);   // sorted input: every value goes right\n\nfunction middleFirst(lo, hi, out = []) { // medians first gives a balanced tree\n  if (lo <= hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    out.push(mid);\n    middleFirst(lo, mid - 1, out);\n    middleFirst(mid + 1, hi, out);\n  }\n  return out;\n}\n\nlet balanced = null;\nfor (const v of middleFirst(1, 255)) balanced = insert(balanced, v);\nconsole.log(height(chain), height(balanced));\n","out":"1 3 4 6 7 8 10 13 14\n6 missing\n255 8\n","notes":[[3,"One comparison decides which subtree to ignore."],[36,"The same 255 values: a chain 255 levels tall versus a tree 8 levels tall."]]}]},{"t":"Validate a BST with bounds (and the check that fails)","tabs":[{"lang":"python","src":"def is_valid_bst(root):\n    def ok(node, low, high):             # every value strictly between low and high\n        if node is None:\n            return True\n        if not (low < node.val < high):\n            return False\n        return ok(node.left, low, node.val) and ok(node.right, node.val, high)\n    return ok(root, float(\"-inf\"), float(\"inf\"))\n\ndef children_only(node):                 # WRONG: compares a node with its children only\n    if node is None:\n        return True\n    if node.left and node.left.val >= node.val:\n        return False\n    if node.right and node.right.val <= node.val:\n        return False\n    return children_only(node.left) and children_only(node.right)\n\ntrees = ([2, 1, 3], [5, 1, 4, None, None, 3, 6], [5, 1, 6, None, None, 3, 7])\nprint(*(\"valid\" if is_valid_bst(build(t)) else \"invalid\" for t in trees))\nprint(\"children-only check says:\", \"valid\" if children_only(build(trees[2])) else \"invalid\")\n","out":"valid invalid invalid\nchildren-only check says: valid\n","notes":[[7,"Going left, the node's value becomes the new upper bound; going right, the new lower bound."],[21,"In [5, 1, 6, null, null, 3, 7], 3 sits in 5's right subtree, but every parent–child pair looks fine."]]},{"lang":"javascript","src":"function isValidBST(root) {\n  function ok(node, low, high) {         // every value strictly between low and high\n    if (node === null) return true;\n    if (!(low < node.val && node.val < high)) return false;\n    return ok(node.left, low, node.val) && ok(node.right, node.val, high);\n  }\n  return ok(root, -Infinity, Infinity);\n}\n\nfunction childrenOnly(node) {            // WRONG: compares a node with its children only\n  if (node === null) return true;\n  if (node.left && node.left.val >= node.val) return false;\n  if (node.right && node.right.val <= node.val) return false;\n  return childrenOnly(node.left) && childrenOnly(node.right);\n}\n\nconst trees = [[2, 1, 3], [5, 1, 4, null, null, 3, 6], [5, 1, 6, null, null, 3, 7]];\nconsole.log(...trees.map(t => (isValidBST(build(t)) ? \"valid\" : \"invalid\")));\nconsole.log(\"children-only check says:\", childrenOnly(build(trees[2])) ? \"valid\" : \"invalid\");\n","out":"valid invalid invalid\nchildren-only check says: valid\n","notes":[[5,"Going left, the node's value becomes the new upper bound; going right, the new lower bound."]]}]},{"t":"Delete: the three cases","tabs":[{"lang":"python","src":"def delete(root, key):                   # O(h); returns the new root\n    if root is None:\n        return None\n    if key < root.val:\n        root.left = delete(root.left, key)\n    elif key > root.val:\n        root.right = delete(root.right, key)\n    else:\n        if root.left is None:            # 0 or 1 child: lift the other side up\n            return root.right\n        if root.right is None:\n            return root.left\n        succ = root.right                # 2 children: the inorder successor is\n        while succ.left:                 # the smallest value in the right subtree\n            succ = succ.left\n        root.val = succ.val\n        root.right = delete(root.right, succ.val)\n    return root\n\nroot = build([8, 3, 10, 1, 6, None, 14, None, None, 4, 7, 13])\nfor key in (3, 14, 1):                   # two children, one child, a leaf\n    root = delete(root, key)\n    print(*inorder(root))\n","out":"1 4 6 7 8 10 13 14\n1 4 6 7 8 10 13\n4 6 7 8 10 13\n","notes":[[9,"A leaf has no children, so this line also handles it: it returns None."],[16,"Copy the successor's value, then delete the successor, which has no left child."]]},{"lang":"javascript","src":"function deleteNode(root, key) {         // O(h); returns the new root\n  if (root === null) return null;\n  if (key < root.val) root.left = deleteNode(root.left, key);\n  else if (key > root.val) root.right = deleteNode(root.right, key);\n  else {\n    if (root.left === null) return root.right;   // 0 or 1 child: lift the other side up\n    if (root.right === null) return root.left;\n    let succ = root.right;               // 2 children: the inorder successor is\n    while (succ.left) succ = succ.left;  // the smallest value in the right subtree\n    root.val = succ.val;\n    root.right = deleteNode(root.right, succ.val);\n  }\n  return root;\n}\n\nlet root = build([8, 3, 10, 1, 6, null, 14, null, null, 4, 7, 13]);\nfor (const key of [3, 14, 1]) {          // two children, one child, a leaf\n  root = deleteNode(root, key);\n  console.log(...inorder(root));\n}\n","out":"1 4 6 7 8 10 13 14\n1 4 6 7 8 10 13\n4 6 7 8 10 13\n","notes":[[1,"Named `deleteNode` because `delete` is a reserved word in JavaScript."]]}]}],"ex":{"q":"Find the lowest common ancestor of two values p and q in a general binary tree (not a BST). Both values are in the tree and all values are unique.","steps":["LCA(p, q) is the deepest node whose subtree contains both p and q, and a node counts as being in its own subtree.","Base case: if the node is empty, or is p or q, return it.","Ask both children. If both return a node, p and q are on different sides, so this node is the LCA. Otherwise, pass up whichever side found something.","Each node is visited at most once: O(n) time and O(h) stack space. In a BST you'd use the ordering instead and walk a single path: O(h)."],"code":{"t":"LCA in a general binary tree","tabs":[{"lang":"python","src":"def lca(root, p, q):                     # p and q are values present in the tree\n    if root is None or root.val in (p, q):\n        return root\n    left = lca(root.left, p, q)\n    right = lca(root.right, p, q)\n    if left and right:                   # found on both sides: this is the split point\n        return root\n    return left or right                 # pass up whichever side found something\n\nroot = build([3, 5, 1, 6, 2, 0, 8, None, None, 7, 4])\nprint(lca(root, 5, 1).val, lca(root, 5, 4).val, lca(root, 7, 8).val)\n","out":"3 5 3"},{"lang":"javascript","src":"function lca(root, p, q) {               // p and q are values present in the tree\n  if (root === null || root.val === p || root.val === q) return root;\n  const left = lca(root.left, p, q);\n  const right = lca(root.right, p, q);\n  if (left && right) return root;        // found on both sides: this is the split point\n  return left ?? right;                  // pass up whichever side found something\n}\n\nconst root = build([3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]);\nconsole.log(lca(root, 5, 1).val, lca(root, 5, 4).val, lca(root, 7, 8).val);\n","out":"3 5 3"}]},"a":"3, 5 and 3. For (5, 4), 4 is inside 5's subtree, so the recursion returns 5 as soon as it reaches it, and 5 is the answer. O(n) time, O(h) stack."},"fade":{"q":"Add up every value between `low` and `high` (inclusive) in a BST, skipping subtrees that can't hold any of them.","steps":["Visiting every node is O(n). The BST rule lets you skip whole subtrees.",{"ask":"If `node.val < low`, which subtree can you skip?","a":"The left one: everything there is even smaller. Only the right subtree can hold values in range."},{"ask":"And if `node.val > high`?","a":"Skip the right subtree; only the left subtree can hold values in range."},{"ask":"What happens when low ≤ node.val ≤ high?","a":"Count `node.val` and search both subtrees."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def range_sum(node, low, high):\n    if node is None:\n        return 0\n    if node.val < low:\n        return ...                      # TODO: only the right side can help\n    if node.val
