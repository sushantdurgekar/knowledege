  t[i] += d\n        i = {{0}}\n\ndef prefix(t, i):                    # a[1] + ... + a[i]\n    s = 0\n    while i > 0:\n        s += t[i]\n        i = {{1}}\n    return s\n\ndef range_sum(t, l, r):              # a[l] + ... + a[r]\n    return prefix(t, r) - prefix(t, {{2}})\n","blanks":[{"o":["i + (i & -i)","i + 1","i * 2","i + 2"],"a":0},{"o":["i - (i & -i)","i - 1","i // 2","i + (i & -i)"],"a":0},{"o":["l - 1","l","l + 1","r - l"],"a":0}],"e":"An update climbs with i + (i & −i) to the next slot whose block contains i; a query falls with i − (i & −i), clearing the lowest set bit. The range sum subtracts prefix(l − 1), so a[l] stays in."},{"q":"Match each problem to its Fenwick technique.","t":"match","pairs":[["Count of Smaller Numbers After Self","Right to left: query(rank − 1), then add the value"],["Reverse Pairs","Rank the values and the doubled values together"],["Add v to a[l..r], read any a[i] at any time","A Fenwick tree over the difference array"],["Range Sum Query - Mutable","update(i + 1, val − nums[i]) and two prefix queries"]],"extra":["A monotonic deque of indexes"],"e":"Each pattern changes what the tree stores or which way you walk; a monotonic deque answers sliding-window maxima, not these."}],"probs":[["LC 307 · Range Sum Query - Mutable","https://leetcode.com/problems/range-sum-query-mutable/","Medium","code block 1: update(i + 1, val − nums[i]); keep nums to know the old value"],["LC 315 · Count of Smaller Numbers After Self","https://leetcode.com/problems/count-of-smaller-numbers-after-self/","Hard","code block 2: compress to ranks, walk right to left, query(rank − 1)"],["LC 493 · Reverse Pairs","https://leetcode.com/problems/reverse-pairs/","Hard","the worked example: rank the values and the doubled values together"],["LC 327 · Count of Range Sum","https://leetcode.com/problems/count-of-range-sum/","Hard","count earlier prefix sums in [P[j] − upper, P[j] − lower]; compress P, P − lower and P − upper together"],["LC 1649 · Create Sorted Array through Instructions","https://leetcode.com/problems/create-sorted-array-through-instructions/","Hard","the faded example: min(query(x − 1), seen − query(x)); the values index the tree directly"],["LC 2179 · Count Good Triplets in an Array","https://leetcode.com/problems/count-good-triplets-in-an-array/","Hard","re-index nums1 by positions in nums2, then for each middle element multiply (smaller before) × (greater after)"]],"src":[["cp-algorithms: Fenwick tree","https://cp-algorithms.com/data_structures/fenwick.html"],["Wikipedia: Fenwick tree","https://en.wikipedia.org/wiki/Fenwick_tree"],["USACO Guide: Point update range sum","https://usaco.guide/gold/PURS"]]},{"id":"m09","d":"d3","t":"Segment trees and lazy propagation","min":120,"hook":"Range minimum with updates, “add 5 to this whole range” mixed with “what's the maximum here?”, calendars that count overlapping bookings: a segment tree answers all of them in O(log n) per operation. It's the most flexible range structure in interviews and contests, and lazy propagation is the idea that makes range updates cheap.","pre":{"q":"You must add 3 to every element of a[2..900], then ask for the maximum of a[0..1000]. A Fenwick tree can't give a range maximum. How could a tree of ranges do the update without touching 899 elements?","a":"Split [2, 900] into O(log n) nodes whose ranges fit inside it. Add 3 to each one's stored maximum and leave a note (a lazy tag) saying “my children still owe +3”. The note is passed down only when a later operation needs to go below that node."},"kid":{"t":"Tara's labelled toy-car boxes","x":"Tara keeps her toy cars in eight small boxes. Two small boxes sit in each medium box, two medium boxes in each large box, and both large boxes in one crate. Every box has a label showing its fastest car's speed, so “fastest in boxes 3–8?” needs just two labels: the medium box for 3–4 and the large box for 5–8. When Ben gives every car in boxes 5–8 a turbo sticker worth +2, Tara doesn't open anything. She adds 2 to the large box's label and clips on a note: “+2 owed inside.” Only when she later opens that box does she pass the note to the two boxes inside it.","map":[["Each box's label: the fastest car inside","Each node stores the max (or sum, min, gcd) of its range"],["“Fastest in 3–8?” read from two labels","A range query combines the O(log n) nodes that exactly cover the range"],["Adding 2 to the large box's label without opening it","A range update changes a fully covered node's value in O(1): max + v"],["The note “+2 owed inside”","A lazy tag: an update the node's children haven't received yet"],["Passing the note on when she opens the box","Push-down: apply the tag to both children before going below the node"]],"brk":"Tara's eight boxes nest perfectly, but real arrays rarely have a power-of-two length, so the recursive tree may need up to 4n slots (the bottom-up layout uses exactly 2n). And her note works only because “+2 for everyone” changes a label in a way she can work out from the label alone (max + 2, or total + 2 × the number of cars); an update without that property can't simply wait on a note."},"keys":["**What a node stores**: the combined value of its range under an associative operation, such as sum, min, max or gcd. The root covers [0, n − 1], and a node covering [lo, hi] splits at mid = (lo + hi) // 2 into [lo, mid] and [mid + 1, hi]. The height is ⌈log₂ n⌉.","**Recursive layout**: the root is node 1 and node x's children are 2x and 2x + 1. When n isn't a power of two the indexes leave gaps, so allocate 4n slots. The recursion is only ⌈log₂ n⌉ + 1 calls deep (18 for n = 10⁵), so recursion is fine here even in Python.","**Bottom-up layout (2n slots)**: leaves at t[n .. 2n − 1], and t[i] combines t[2i] and t[2i + 1] for i from n − 1 down to 1. An update rewrites one leaf and climbs with i //= 2; a query on the half-open [l, r) moves both ends up a level at a time, taking t[l] when l is a right child and t[r − 1] when r − 1 is a left child. It works for any n, with no recursion.","**Costs**: build O(n); point update and range query O(log n), because a query visits at most four nodes per level. Space: exactly 2n slots bottom-up, up to 4n recursive.","**Lazy propagation**: when an update covers a node's whole range, change the node's value at once (max + v, or sum + v × length) and record a pending tag. Before any later operation goes below that node, push the tag to both children and clear it. Range add with range sum or range max then costs O(log n) per operation, using 4n more slots for the tags.","**Tags must compose**: two pending adds combine by adding, and a new assignment replaces whatever was pending. Assignment needs a “no tag” marker, either a flag or a value that is never assigned: heights in LeetCode 699 are at least 1, so 0 works there.","**Huge coordinates (up to 10⁹)**: if every query is known in advance, compress the coordinates to ranks first (LeetCode 699, 850). If they arrive online (LeetCode 732), use a dynamic segment tree that creates a node only when an update first needs it: O(log C) time and at most O(log C) new nodes per operation, with C the coordinate range.","**Add + max without push-down**: for range add with max, a tag can stay on its node for good. The node's max is its own tag plus the larger child max, and a query adds up the tags on its way down. No children are made just to hold a tag, which keeps a dynamic tree small (code block 3)."],"dia":[{"type":"btree","cap":"A sum segment tree over a = [5, 8, 6, 3, 2, 7, 2, 6]","nodes":[39,22,17,13,9,9,8,5,8,6,3,2,7,2,6],"hl":["#8","#4","#5","#13"],"note":"sum(a[1..6]) = 8 + 9 + 9 + 2 = 28 comes from the four highlighted nodes instead of six leaves. Each node holds the sum of its two children: 22 = 13 + 9 covers a[0..3]."},{"type":"cells","cap":"The same tree as a bottom-up array: t[i] = t[2i] + t[2i + 1], with the leaves at t[8..15]","rows":[{"label":"t","vals":["–",39,22,17,13,9,9,8,5,8,6,3,2,7,2,6],"dim":[0],"hl":[8,9,10,11,12,13,14,15]}],"note":"With n = 8, a power of two, the array matches the recursive numbering exactly (root at 1, the children of i at 2i and 2i + 1). For other n, the bottom-up array still needs exactly 2n slots, while the recursive layout may need up to 4n."},{"type":"flow","cap":"A lazy add of +3 on a[4..7] in the tree above, then a query on a[6..7]","steps":[["add 3 to [4, 7]","node [4..7] is fully covered: its sum 17 becomes 17 + 3 × 4 = 29, and its tag becomes 3"],["stop there","the root becomes 22 + 29 = 51; the four leaves aren't touched"],["query [6, 7]","it must go below [4..7], so push first"],["push","each child: sum += 3 × 2 and tag += 3; then [4..7]'s tag goes back to 0"],["answer","node [6..7] now holds 8 + 6 = 14"]]}],"cmp":[{"cap":"Range structures compared","head":["","Prefix sums","Fenwick tree","Segment tree","Lazy segment tree"],"rows":[["Point update","O(n)","O(log n)","O(log n)","O(log n)"],["Range add","O(n)","O(log n) with point reads; two trees give range sums","One point at a time","O(log n)"],["Range sum","O(1)","O(log n)","O(log n)","O(log n)"],["Range min or max","No","No (with arbitrary updates)","O(log n)","O(log n)"],["Range assign","No","No","One point at a time","O(log n)"],["Space","n + 1","n + 1","2n bottom-up, up to 4n recursive","4n values + 4n tags"]]},{"cap":"Huge coordinates: two ways","head":["","Coordinate compression","Dynamic segment tree"],"rows":[["Needs every query in advance","Yes","No: works online"],["Tree size","O(m) for m distinct coordinates","O(q log C) nodes after q operations"],["Time per operation","O(log m)","O(log C)"],["Typical problems","LeetCode 699, 850, 218","LeetCode 732, 731, 715"]]}],"code":[{"t":"Bottom-up segment tree: range minimum with point updates","tabs":[{"lang":"python","src":"class MinSegTree:                                # bottom-up: leaves at t[n .. 2n - 1]\n    def __init__(self, a):\n        self.n = len(a)\n        self.t = [0] * self.n + list(a)\n        for i in range(self.n - 1, 0, -1):       # parents, from the bottom up: O(n)\n            self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])\n\n    def update(self, i, value):                  # a[i] = value: O(log n)\n        i += self.n\n        self.t[i] = value\n        while i > 1:\n            i //= 2                              # climb to the parent and recompute it\n            self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])\n\n    def query(self, l, r):                       # min of a[l..r], inclusive: O(log n)\n        res = float(\"inf\")\n        l, r = l + self.n, r + self.n + 1        # half-open [l, r) over the leaves\n        while l < r:\n            if l & 1:                            # l is a right child: its parent sticks out left\n                res = min(res, self.t[l])\n                l += 1\n            if r & 1:                            # r - 1 is a left child: its parent sticks out right\n                r -= 1\n                res = min(res, self.t[r])\n            l //= 2\n            r //= 2\n        return res\n\nst = MinSegTree([5, 3, 8, 6, 1, 4, 7])           # n = 7: not a power of two\nprint(st.query(0, 6), st.query(0, 3), st.query(5, 6))\nst.update(4, 9)\nst.update(1, 10)\nprint(st.query(0, 6), st.query(2, 4), st.query(0, 2))\n","out":"1 3 4\n4 6 5\n","notes":[[4,"The leaves fill the second half and slot 0 is never used, so the tree takes exactly 2n slots for any n."],[5,"Node i's children are 2i and 2i + 1, so building every parent from the bottom up costs O(n)."],[17,"Both ends move to the leaf level and r becomes exclusive, so the loop works on [l, r)."],[19,"At each level the loop takes at most one node from each end, so a query touches at most about 2 log₂ n nodes."]]},{"lang":"javascript","src":"class MinSegTree {                               // bottom-up: leaves at t[n .. 2n - 1]\n  constructor(a) {\n    this.n = a.length;\n    this.t = [...new Array(this.n).fill(0), ...a];\n    for (let i = this.n - 1; i > 0; i--)         // parents, from the bottom up: O(n)\n      this.t[i] = Math.min(this.t[2 * i], this.t[2 * i + 1]);\n  }\n  update(i, value) {                             // a[i] = value: O(log n)\n    i += this.n;\n    this.t[i] = value;\n    while (i > 1) {\n      i >>= 1;                                   // climb to the parent and recompute it\n      this.t[i] = Math.min(this.t[2 * i], this.t[2 * i + 1]);\n    }\n  }\n  query(l, r) {                                  // min of a[l..r], inclusive: O(log n)\n    let res = Infinity;\n    for (l += this.n, r += this.n + 1; l < r; l >>= 1, r >>= 1) {   // half-open [l, r) over the leaves\n      if (l & 1) res = Math.min(res, this.t[l++]);   // l is a right child: its parent sticks out left\n      if (r & 1) res = Math.min(res, this.t[--r]);   // r - 1 is a left child: its parent sticks out right\n    }\n    return res;\n  }\n}\n\nconst st = new MinSegTree([5, 3, 8, 6, 1, 4, 7]);   // n = 7: not a power of two\nconsole.log(st.query(0, 6), st.query(0, 3), st.query(5, 6));\nst.update(4, 9);\nst.update(1, 10);\nconsole.log(st.query(0, 6), st.query(2, 4), st.query(0, 2));\n","out":"1 3 4\n4 6 5\n","notes":[[4,"The leaves fill the second half and slot 0 is never used, so the tree takes exactly 2n slots for any n."],[5,"Node i's children are 2i and 2i + 1, so building every parent from the bottom up costs O(n)."],[18,"Both ends move to the leaf level and r becomes exclusive, so the loop works on [l, r)."],[19,"At each level the loop takes at most one node from each end, so a query touches at most about 2 log₂ n nodes."]]}]},{"t":"Lazy propagation: range add and range sum","tabs":[{"lang":"python","src":"def apply(x, lo, hi, v):                         # every element of x's range += v\n    s[x] += v * (hi - lo + 1)                    # the sum grows by v times the length\n    tag[x] += v                                  # and x's children still owe v\n\ndef push(x, lo, mid, hi):                        # before going below x: hand the tag down\n    apply(2 * x, lo, mid, tag[x])\n    apply(2 * x + 1, mid + 1, hi, tag[x])\n    tag[x] = 0\n\ndef add(x, lo, hi, l, r, v):                     # a[l..r] += v\n    if r < lo or hi < l: return                  # no overlap\n    if l <= lo and hi <= r:                      # fully covered: apply here and stop\n        apply(x, lo, hi, v)\n        return\n    mid = (lo + hi) // 2\n    push(x, lo, mid, hi)\n    add(2 * x, lo, mid, l, r, v)\n    add(2 * x + 1, mid + 1, hi, l, r, v)\n    s[x] = s[2 * x] + s[2 * x + 1]\n\ndef total(x, lo, hi, l, r):                      # a[l] + ... + a[r]\n    if r < lo or hi < l: return 0                # no overlap\n    if l <= lo and hi <= r: return s[x]          # fully covered\n    mid = (lo + hi) // 2\n    push(x, lo, mid, hi)\n    return total(2 * x, lo, mid, l, r) + total(2 * x + 1, mid + 1, hi, l, r)\n\nn = 8\ns, tag = [0] * (4 * n), [0] * (4 * n)            # 4n sums and 4n pending adds; a starts as zeros\nfor l, r, v in [(0, 7, 2), (2, 5, 3), (4, 4, -1)]:\n    add(1, 0, n - 1, l, r, v)                    # a becomes [2, 2, 5, 5, 4, 5, 2, 2]\nprint(*(total(1, 0, n - 1, l, r) for l, r in [(0, 7), (2, 3), (4, 6), (7, 7)]))\n","out":"27 10 11 2","notes":[[2,"Every element in the range rises by v, so the sum rises by v × (hi − lo + 1): the node's own value is right at once."],[3,"The tag records what the children still owe; they get it only when a later call needs them."],[16,"Push before going below x, so both children are correct before they are read or changed. Pushing a zero tag changes nothing."],[29,"4n slots: with children at 2x and 2x + 1, the indexes can reach almost 4n when n isn't a power of two."]]},{"lang":"javascript","src":"function apply(x, lo, hi, v) {                   // every element of x's range += v\n  s[x] += v * (hi - lo + 1);                     // the sum grows by v times the length\n  tag[x] += v;                                   // and x's children still owe v\n}\n\nfunction push(x, lo, mid, hi) {                  // before going below x: hand the tag down\n  apply(2 * x, lo, mid, tag[x]);\n  apply(2 * x + 1, mid + 1, hi, tag[x]);\n  tag[x] = 0;\n}\n\nfunction add(x, lo, hi, l, r, v) {               // a[l..r] += v\n  if (r < lo || hi < l) return;                  // no overlap\n  if (l <= lo && hi <= r) { apply(x, lo, hi, v); return; }   // fully covered: apply here and stop\n  const mid = (lo + hi) >> 1;\n  push(x, lo, mid, hi);\n  add(2 * x, lo, mid, l, r, v);\n  add(2 * x + 1, mid + 1, hi, l, r, v);\n  s[x] = s[2 * x] + s[2 * x + 1];\n}\n\nfunction total(x, lo, hi, l, r) {                // a[l] + ... + a[r]\n  if (r < lo || hi < l) return 0;                // no overlap\n  if (l <= lo && hi <= r) return s[x];           // fully covered\n  const mid = (lo + hi) >> 1;\n  push(x, lo, mid, hi);\n  return total(2 * x, lo, mid, l, r) + total(2 * x + 1, mid + 1, hi, l, r);\n}\n\nconst n = 8;\nlet s = new Array(4 * n).fill(0), tag = new Array(4 * n).fill(0);   // 4n sums and 4n pending adds\nfor (const [l, r, v] of [[0, 7, 2], [2, 5, 3], [4, 4, -1]])\n  add(1, 0, n - 1, l, r, v);                     // a becomes [2, 2, 5, 5, 4, 5, 2, 2]\nconsole.log(...[[0, 7], [2, 3], [4, 6], [7, 7]].map(([l, r]) => total(1, 0, n - 1, l, r)));\n","out":"27 10 11 2","notes":[[2,"Every element in the range rises by v, so the sum rises by v × (hi − lo + 1): the node's own value is right at once."],[3,"The tag records what the children still owe; they get it only when a later call needs them."],[16,"Push before going below x, so both children are correct before they are read or changed. Pushing a zero tag changes nothing."],[31,"4n slots: with children at 2x and 2x + 1, the indexes can reach almost 4n when n isn't a power of two."]]}]},{"t":"A dynamic segment tree for My Calendar III (LeetCode 732)","tabs":[{"lang":"python","src":"class MyCalendarThree:                           # LeetCode 732: a dynamic segment tree\n    def __init__(self):\n        self.left, self.right = [0], [0]         # child ids; 0 means \"not created yet\"\n        self.mx, self.tag = [0], [0]             # node 0 is the root, covering [0, 10**9)\n\n    def _node(self):                             # a new node, made only when needed\n        for arr in (self.left, self.right, self.mx, self.tag):\n            arr.append(0)\n        return len(self.mx) - 1\n\n    def _add(self, x, lo, hi, l, r):             # +1 on [l, r); node x covers [lo, hi)\n        if r <= lo or hi <= l:\n            return\n        if l <= lo and hi <= r:                  # fully covered: tag it and stop\n            self.mx[x] += 1\n            self.tag[x] += 1\n            return\n        if not self.left[x]:                     # first visit below x: create both children\n            self.left[x], self.right[x] = self._node(), self._node()\n        a, b, mid = self.left[x], self.right[x], (lo + hi) // 2\n        self._add(a, lo, mid, l, r)\n        self._add(b, mid, hi, l, r)\n        self.mx[x] = self.tag[x] + max(self.mx[a], self.mx[b])   # the tag stays on x\n\n    def book(self, start, end):\n        self._add(0, 0, 10**9, start, end)\n        return self.mx[0]                        # the root's max: the most overlaps anywhere\n\ncal = MyCalendarThree()\nprint(*(cal.book(s, e) for s, e in [(10, 20), (50, 60), (10, 40), (5, 15), (5, 10), (25, 55)]))\n","out":"1 1 2 3 3 3","notes":[[4,"Nothing is allocated for the 10⁹ positions up front: the tree starts as a single node."],[18,"Nodes appear only along the paths a booking visits: O(log C) new nodes per booking, with C = 10⁹."],[23,"With add and max, the tag can stay on its node: the node's max is its own tag plus the larger child max, so nothing is pushed and no children are made just to hold a tag."],[27,"Only the overall maximum is asked for, so the root answers it directly. The recursion is about 31 calls deep, far below Python's limit."]]},{"lang":"javascript","src":"class MyCalendarThree {                          // LeetCode 732: a dynamic segment tree\n  constructor() {\n    this.left = [0]; this.right = [0];           // child ids; 0 means \"not created yet\"\n    this.mx = [0]; this.tag = [0];               // node 0 is the root, covering [0, 1e9)\n  }\n  _node() {                                      // a new node, made only when needed\n    for (const arr of [this.left, this.right, this.mx, this.tag]) arr.push(0);\n    return this.mx.length - 1;\n  }\n  _add(x, lo, hi, l, r) {                        // +1 on [l, r); node x covers [lo, hi)\n    if (r <= lo || hi <= l) return;\n    if (l <= lo && hi <= r) {                    // fully covered: tag it and stop\n      this.mx[x]++;\n      this.tag[x]++;\n      return;\n    }\n    if (!this.left[x]) {                         // first visit below x: create both children\n      this.left[x] = this._node();\n      this.right[x] = this._node();\n    }\n    const a = this.left[x], b = this.right[x], mid = Math.floor((lo + hi) / 2);\n    this._add(a, lo, mid, l, r);\n    this._add(b, mid, hi, l, r);\n    this.mx[x] = this.tag[x] + Math.max(this.mx[a], this.mx[b]);   // the tag stays on x\n  }\n  book(start, end) {\n    this._add(0, 0, 1e9, start, end);\n    return this.mx[0];                           // the root's max: the most overlaps anywhere\n  }\n}\n\nconst cal = new MyCalendarThree();\nconsole.log(...[[10, 20], [50, 60], [10, 40], [5, 15], [5, 10], [25, 55]].map(([s, e]) => cal.book(s, e)));\n","out":"1 1 2 3 3 3","notes":[[4,"Nothing is allocated for the 10⁹ positions up front: the tree starts as a single node."],[17,"Nodes appear only along the paths a booking visits: O(log C) new nodes per booking, with C = 10⁹."],[21,"`Math.floor((lo + hi) / 2)` is safe for any size; `>> 1` would also work here, but only because lo + hi stays below 2³¹."],[24,"With add and max, the tag can stay on its node: the node's max is its own tag plus the larger child max, so nothing is pushed and no children are made just to hold a tag."]]}]}],"ex":{"q":"Squares fall one at a time onto the x-axis. Square i has its left edge at positions[i][0] and side positions[i][1]; it lands on the highest square below it that it overlaps by a positive length (touching edges don't count), or on the ground. After each drop, report the height of the tallest stack so far. There are up to 1,000 squares, with left edges up to 10⁸ (LeetCode 699, Falling Squares).","steps":["Each square lands on the tallest thing under its base, so its top is the maximum height on [left, left + side) plus side; then that whole stretch becomes exactly that height. That's a range maximum followed by a range assignment.","Coordinates reach 10⁸ but every square is known in advance, so compress: sort the distinct edges and work on the gaps between neighbours. A square on [L, R) covers gaps idx[L] .. idx[R] − 1, so squares that only touch share no gap.","A segment tree over the gaps stores the maximum height, and a lazy tag means “every height here is h”. A new assignment overwrites an older tag, and heights are at least 1, so 0 can mean “no tag”.","After each square, the root holds the tallest stack. O(n log n) time and O(n) space for n squares; checking every earlier square instead is O(n²)."],"code":{"t":"Compressed edges with range max and range assign","tabs":[{"lang":"python","src":"def falling_squares(positions):\n    edges = sorted({x for left, side in positions for x in (left, left + side)})\n    idx, m = {x: i for i, x in enumerate(edges)}, len(edges) - 1   # gap i is [edges[i], edges[i + 1])\n    mx, tag = [0] * (4 * m), [0] * (4 * m)       # tag 0 = nothing pending (heights are >= 1)\n    def push(x):                                 # an assignment overwrites both children\n        if tag[x]:\n            mx[2 * x] = tag[2 * x] = mx[2 * x + 1] = tag[2 * x + 1] = tag[x]\n        tag[x] = 0\n    def query(x, lo, hi, l, r):                  # the max height on gaps l..r\n        if r < lo or hi < l: return 0\n        if l <= lo and hi <= r: return mx[x]\n        push(x)\n        mid = (lo + hi) // 2\n        return max(query(2 * x, lo, mid, l, r), query(2 * x + 1, mid + 1, hi, l, r))\n    def assign(x, lo, hi, l, r, h):              # set every height on gaps l..r to h\n        if r < lo or hi < l: return\n        if l <= lo and hi <= r:\n            mx[x] = tag[x] = h\n            return\n        push(x)\n        mid = (lo + hi) // 2\n        assign(2 * x, lo, mid, l, r, h)\n        assign(2 * x + 1, mid + 1, hi, l, r, h)\n        mx[x] = max(mx[2 * x], mx[2 * x + 1])\n\n    out = []\n    for left, side in positions:\n        l, r = idx[left], idx[left + side] - 1   # the gaps under this square\n        assign(1, 0, m - 1, l, r, query(1, 0, m - 1, l, r) + side)   # land on the tallest thing below\n        out.append(mx[1])                        # the root holds the tallest stack\n    return out\n\nprint(*falling_squares([[1, 2], [2, 3], [6, 1]]), \"|\", *falling_squares([[100, 100], [200, 100]]))\n","out":"2 5 5 | 100 100"},{"lang":"javascript","src":"function fallingSquares(positions) {\n  const edges = [...new Set(positions.flatMap(([left, side]) => [left, left + side]))].sort((a, b) => a - b);\n  const idx = new Map(edges.map((x, i) => [x, i])), m = edges.length - 1;   // gap i is [edges[i], edges[i + 1])\n  const mx = new Array(4 * m).fill(0), tag = new Array(4 * m).fill(0);   // tag 0 = nothing pending\n  const push = x => {                            // an assignment overwrites both children\n    if (tag[x]) mx[2 * x] = tag[2 * x] = mx[2 * x + 1] = tag[2 * x + 1] = tag[x];\n    tag[x] = 0;\n  };\n  const query = (x, lo, hi, l, r) => {           // the max height on gaps l..r\n    if (r < lo || hi < l) return 0;\n    if (l <= lo && hi <= r) return mx[x];\n    push(x);\n    const mid = (lo + hi) >> 1;\n    return Math.max(query(2 * x, lo, mid, l, r), query(2 * x + 1, mid + 1, hi, l, r));\n  };\n  const assign = (x, lo, hi, l, r, h) => {       // set every height on gaps l..r to h\n    if (r < lo || hi < l) return;\n    if (l <= lo && hi <= r) { mx[x] = tag[x] = h; return; }\n    push(x);\n    const mid = (lo + hi) >> 1;\n    assign(2 * x, lo, mid, l, r, h);\n    assign(2 * x + 1, mid + 1, hi, l, r, h);\n    mx[x] = Math.max(mx[2 * x], mx[2 * x + 1]);\n  };\n\n  const out = [];\n  for (const [left, side] of positions) {\n    const l = idx.get(left), r = idx.get(left + side) - 1;   // the gaps under this square\n    assign(1, 0, m - 1, l, r, query(1, 0, m - 1, l, r) + side);   // land on the tallest thing below\n    out.push(mx[1]);                             // the root holds the tallest stack\n  }\n  return out;\n}\n\nconsole.log(...fallingSquares([[1, 2], [2, 3], [6, 1]]), \"|\", ...fallingSquares([[100, 100], [200, 100]]));\n","out":"2 5 5 | 100 100"}]},"a":"2 5 5 | 100 100. The first square lands on the ground (height 2). The second overlaps it on [2, 3) and lands on top (2 + 3 = 5). The third, on [6, 7), touches nothing, so the tallest stack stays 5. In the second call the squares only touch at x = 200, so they share no gap and both stand on the ground. O(n log n) time, O(n) space."},"fade":{"q":"Finish a segment tree for range add and range maximum on a small array: `add(l, r, v)` adds v to a[l..r], and `range_max(l, r)` returns max(a[l..r]). Everything is written except the push-down step.","steps":["Each node stores the max of its range (mx) and a pending add (tag). A fully covered node gets mx += v and tag += v, because a maximum rises by exactly v when every element does.",{"ask":"When must a tag be pushed down?","a":"Before an update or a query goes below the node, that is, whenever the range only partly overlaps it, so the children are up to date before they're used."},{"ask":"What does push-down do to each child?","a":"Adds the parent's tag to the child's mx and to the child's own tag; then the parent's tag goes back to 0."},{"ask":"Time and space?","a":"O(log n) per update and per query, O(n log n) to load the array with point adds (O(n) with a proper build), and O(n) space: 4n maxima and 4n tags."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def push(x):                                     # hand tag[x] down to both children\n    ...                                          # TODO: add tag[x] to each child's mx and tag, then clear tag[x]\n\ndef add(x, lo, hi, l, r, v):                     # a[l..r] += v\n    if r < lo or hi < l: return                  # no overlap\n    if l <= lo and hi <= r:                      # covered: the max rises by exactly v\n        mx[x] += v\n        tag[x] += v\n        return\n    push(x)\n    mid = (lo + hi) // 2\n    add(2 * x, lo, mid, l, r, v)\n    add(2 * x + 1, mid + 1, hi, l, r, v)\n    mx[x] = max(mx[2 * x], mx[2 * x + 1])\n\ndef range_max(x, lo, hi, l, r):                  # max(a[l..r])\n    if r < lo or hi < l: return float(\"-inf\")    # no overlap\n    if l <= lo and hi <= r: return mx[x]         # fully covered\n    push(x)\n    mid = (lo + hi) // 2\n    return max(range_max(2 * x, lo, mid, l, r), range_max(2 * x + 1, mid + 1, hi, l, r))\n\na = [1, 3, 2, 5, 4]\nn = len(a)\nmx, tag = [0] * (4 * n), [0] * (4 * n)\nfor i, v in enumerate(a):\n    add(1, 0, n - 1, i, i, v)                    # load the array with point adds\nadd(1, 0, n - 1, 0, 2, 4)                        # now [5, 7, 6, 5, 4]\nadd(1, 0, n - 1, 3, 4, 3)                        # now [5, 7, 6, 8, 7]\nprint(*(range_max(1, 0, n - 1, l, r) for l, r in [(0, 2), (2, 2), (4, 4), (0, 4)]))   # expect 7 6 7 8\n"},{"lang":"javascript","src":"function push(x) {                               // hand tag[x] down to both children\n  // TODO: add tag[x] to each child's mx and tag, then clear tag[x]\n}\n\nfunction add(x, lo, hi, l, r, v) {               // a[l..r] += v\n  if (r < lo || hi < l) return;                  // no overlap\n  if (l <= lo && hi <= r) { mx[x] += v; tag[x] += v; return; }   // covered: the max rises by exactly v\n  push(x);\n  const mid = (lo + hi) >> 1;\n  add(2 * x, lo, mid, l, r, v);\n  add(2 * x + 1, mid + 1, hi, l, r, v);\n  mx[x] = Math.max(mx[2 * x], mx[2 * x + 1]);\n}\n\nfunction rangeMax(x, lo, hi, l, r) {             // max(a[l..r])\n  if (r < lo || hi < l) return -Infinity;        // no overlap\n  if (l <= lo && hi <= r) return mx[x];          // fully covered\n  push(x);\n  const mid = (lo + hi) >> 1;\n  return Math.max(rangeMax(2 * x, lo, mid, l, r), rangeMax(2 * x + 1, mid + 1, hi, l, r));\n}\n\nconst a = [1, 3, 2, 5, 4], n = a.length;\nlet mx = new Array(4 * n).fill(0), tag = new Array(4 * n).fill(0);\na.forEach((v, i) => add(1, 0, n - 1, i, i, v));  // load the array with point adds\nadd(1, 0, n - 1, 0, 2, 4);                       // now [5, 7, 6, 5, 4]\nadd(1, 0, n - 1, 3, 4, 3);                       // now [5, 7, 6, 8, 7]\nconsole.log(...[[0, 2], [2, 2], [4, 4], [0, 4]].map(([l, r]) => rangeMax(1, 0, n - 1, l, r)));   // expect 7 6 7 8\n"}]},"solution":{"t":"Solution: push the pending add into both children","tabs":[{"lang":"python","src":"def push(x):                                     # hand tag[x] down to both children\n    for c in (2 * x, 2 * x + 1):\n        mx[c] += tag[x]                          # every element below c rose by tag[x]\n        tag[c] += tag[x]                         # and c's own children still owe it\n    tag[x] = 0\n\ndef add(x, lo, hi, l, r, v):                     # a[l..r] += v\n    if r < lo or hi < l: return                  # no overlap\n    if l <= lo and hi <= r:                      # covered: the max rises by exactly v\n        mx[x] += v\n        tag[x] += v\n        return\n    push(x)\n    mid = (lo + hi) // 2\n    add(2 * x, lo, mid, l, r, v)\n    add(2 * x + 1, mid + 1, hi, l, r, v)\n    mx[x] = max(mx[2 * x], mx[2 * x + 1])\n\ndef range_max(x, lo, hi, l, r):                  # max(a[l..r])\n    if r < lo or hi < l: return float(\"-inf\")    # no overlap\n    if l <= lo and hi <= r: return mx[x]         # fully covered\n    push(x)\n    mid = (lo + hi) // 2\n    return max(range_max(2 * x, lo, mid, l, r), range_max(2 * x + 1, mid + 1, hi, l, r))\n\na = [1, 3, 2, 5, 4]\nn = len(a)\nmx, tag = [0] * (4 * n), [0] * (4 * n)\nfor i, v in enumerate(a):\n    add(1, 0, n - 1, i, i, v)                    # load the array with point adds\nadd(1, 0, n - 1, 0, 2, 4)                        # now [5, 7, 6, 5, 4]\nadd(1, 0, n - 1, 3, 4, 3)                        # now [5, 7, 6, 8, 7]\nprint(*(range_max(1, 0, n - 1, l, r) for l, r in [(0, 2), (2, 2), (4, 4), (0, 4)]))\n","out":"7 6 7 8"},{"lang":"javascript","src":"function push(x) {                               // hand tag[x] down to both children\n  for (const c of [2 * x, 2 * x + 1]) {\n    mx[c] += tag[x];                             // every element below c rose by tag[x]\n    tag[c] += tag[x];                            // and c's own children still owe it\n  }\n  tag[x] = 0;\n}\n\nfunction add(x, lo, hi, l, r, v) {               // a[l..r] += v\n  if (r < lo || hi < l) return;                  // no overlap\n  if (l <= lo && hi <= r) { mx[x] += v; tag[x] += v; return; }   // covered: the max rises by exactly v\n  push(x);\n  const mid = (lo + hi) >> 1;\n  add(2 * x, lo, mid, l, r, v);\n  add(2 * x + 1, mid + 1, hi, l, r, v);\n  mx[x] = Math.max(mx[2 * x], mx[2 * x + 1]);\n}\n\nfunction rangeMax(x, lo, hi, l, r) {             // max(a[l..r])\n  if (r < lo || hi < l) return -Infinity;        // no overlap\n  if (l <= lo && hi <= r) return mx[x];          // fully covered\n  push(x);\n  const mid = (lo + hi) >> 1;\n  return Math.max(rangeMax(2 * x, lo, mid, l, r), rangeMax(2 * x + 1, mid + 1, hi, l, r));\n}\n\nconst a = [1, 3, 2, 5, 4], n = a.length;\nlet mx = new Array(4 * n).fill(0), tag = new Array(4 * n).fill(0);\na.forEach((v, i) => add(1, 0, n - 1, i, i, v));  // load the array with point adds\nadd(1, 0, n - 1, 0, 2, 4);                       // now [5, 7, 6, 5, 4]\nadd(1, 0, n - 1, 3, 4, 3);                       // now [5, 7, 6, 8, 7]\nconsole.log(...[[0, 2], [2, 2], [4, 4], [0, 4]].map(([l, r]) => rangeMax(1, 0, n - 1, l, r)));\n","out":"7 6 7 8"}]}},"traps":[["“A segment tree has 2n − 1 nodes, so 2n slots are always enough.”","In the recursive layout (children at 2x and 2x + 1), an n that isn't a power of two leaves gaps, and the indexes can reach almost 4n. Allocate 4n, or use the bottom-up layout, which needs exactly 2n."],["“Recursion is too deep for Python on a segment tree.”","The depth is about log₂ n: around 18 calls for n = 10⁵, and about 31 for a dynamic tree over [0, 10⁹). Python's limit of 1,000 frames is far away. (Recursion is slower than a loop in Python, which is one reason the bottom-up tree is popular.)"],["“A lazy tag means the node's own value is out of date.”","The node's value is always right; the tag records what its children still owe. Push it down before visiting them."],["“With a lazy range add, a node's sum goes up by v.”","Every element in the node's range goes up by v, so the sum goes up by v × (hi − lo + 1). The max (or min) goes up by just v."],["“Pending tags always combine by adding.”","Adds combine by adding, but an assignment replaces everything below it, so a new assignment overwrites the old tag. Pushing an empty assignment tag must change nothing, which is why it needs a “no tag” marker."],["“Coordinates up to 10⁹ need an array of 4 × 10⁹ slots.”","Compress the coordinates when every query is known in advance, or create nodes only when they are needed (a dynamic segment tree): O(log C) new nodes per operation."]],"disc":[["Why does a range query visit only O(log n) nodes?","At each level, at most two visited nodes are only partly covered: the ones that contain the range's two ends. Every other visited node is either completely inside the range, so the query takes its value and stops, or completely outside, so it returns at once. That limits the work to at most four nodes per level, and there are about log₂ n levels."],["When would you pick the bottom-up 2n tree over the recursive one?","For point updates and range queries with an associative operation: it's shorter, uses exactly 2n slots and avoids recursion, which helps in Python. The recursive version is easier to extend with lazy tags, dynamic nodes, and searches such as “the first index where the prefix sum reaches x”."]],"teach":{"prompt":"Explain to a junior colleague how a segment tree with lazy propagation adds v to a whole range and answers range sums, both in O(log n).","rubric":["Each node stores the sum of its range, and its two children split the range in half","Any range splits into O(log n) fully covered nodes","A covered node's sum grows by v × its length and it keeps a pending tag","The tag is pushed to both children before any operation goes below the node","O(log n) per operation, with about 4n sums plus 4n tags of space"],"model":"A segment tree stores, for each node, the sum of a range of the array; the root covers everything and each node's two children split its range in half, so the height is about log₂ n. Any range [l, r] splits into O(log n) nodes that lie completely inside it, so a query combines just those. For a range add, when the update covers a node's whole range, I add v × its length to the node's sum and add v to its pending tag, and I stop there instead of visiting the elements below. The tag means “every element below still needs + v”. Whenever a later update or query has to go below that node, I first push the tag down: each child's sum grows by v × its own length, each child's tag grows by v, and the parent's tag is cleared. Every operation visits only O(log n) nodes and each push is O(1), so both range add and range sum cost O(log n). The arrays take about 4n sums and 4n tags, and the recursion is only about log₂ n deep, so it's fine even in Python."},"qa":[["Children of node x in the recursive layout?","2x and 2x + 1, with the root at 1."],["Slots for a recursive segment tree, and for the bottom-up one?","Up to 4n for the recursive one; exactly 2n for the bottom-up one."],["What does a lazy tag mean?","An update applied to the node's whole range that its children haven't received yet."],["Range add v on a sum node covering [lo, hi]?","sum += v × (hi − lo + 1) and tag += v."],["Coordinates up to 10⁹, queries arriving online: which tree?","A dynamic segment tree that creates nodes only when needed: O(log C) per operation."],["Recursion depth of a segment tree on 10⁵ elements?","About 18 calls, since the height is ⌈log₂ 10⁵⌉ = 17: safe even in Python."]],"quiz":[{"q":"What does this print?","snip":{"t":"A bottom-up build","tabs":[{"lang":"python","src":"a = [4, 1, 3, 2]\nn = len(a)\nt = [0] * n + a\nfor i in range(n - 1, 0, -1):\n    t[i] = min(t[2 * i], t[2 * i + 1])\nprint(*t[1:])\n"},{"lang":"javascript","src":"const a = [4, 1, 3, 2];\nconst n = a.length;\nconst t = [...new Array(n).fill(0), ...a];\nfor (let i = n - 1; i > 0; i--) t[i] = Math.min(t[2 * i], t[2 * i + 1]);\nconsole.log(...t.slice(1));\n"}]},"o":["1 1 2 4 1 3 2","4 1 3 2 1 2 1","1 2 1 4 1 3 2","1 1 2 1 4 2 3"],"a":0,"e":"The leaves sit at t[4..7] = 4 1 3 2. Then t[3] = min(3, 2) = 2, t[2] = min(4, 1) = 1 and t[1] = min(1, 2) = 1, so slots 1 to 7 read 1 1 2 4 1 3 2. Slot 0 is unused."},{"q":"What does this print? The tags here never move down.","snip":{"t":"A tag that stays on its node","tabs":[{"lang":"python","src":"mx, tag = [0] * 8, [0] * 8           # node 1 = [0, 3]; nodes 2 = [0, 1] and 3 = [2, 3]\n\ndef add(x, lo, hi, l, r, v):          # the tag stays on its node: no push-down\n    if r < lo or hi < l:\n        return\n    if l <= lo and hi <= r:\n        mx[x] += v\n        tag[x] += v\n        return\n    mid = (lo + hi) // 2\n    add(2 * x, lo, mid, l, r, v)\n    add(2 * x + 1, mid + 1, hi, l, r, v)\n    mx[x] = tag[x] + max(mx[2 * x], mx[2 * x + 1])\n\nadd(1, 0, 3, 0, 3, 5)\nadd(1, 0, 3, 2, 2, 1)\nprint(mx[1], mx[3], tag[1])\n"},{"lang":"javascript","src":"const mx = new Array(8).fill(0), tag = new Array(8).fill(0);   // node 1 = [0, 3]; nodes 2 = [0, 1] and 3 = [2, 3]\n\nfunction add(x, lo, hi, l, r, v) {    // the tag stays on its node: no push-down\n  if (r < lo || hi < l) return;\n  if (l <= lo && hi <= r) {\n    mx[x] += v;\n    tag[x] += v;\n    return;\n  }\n  const mid = (lo + hi) >> 1;\n  add(2 * x, lo, mid, l, r, v);\n  add(2 * x + 1, mid + 1, hi, l, r, v);\n  mx[x] = tag[x] + Math.max(mx[2 * x], mx[2 * x + 1]);\n}\n\nadd(1, 0, 3, 0, 3, 5);\nadd(1, 0, 3, 2, 2, 1);\nconsole.log(mx[1], mx[3], tag[1]);\n"}]},"o":["6 1 5","6 6 5","6 6 0","1 1 5"],"a":0,"e":"The first add covers node 1 completely, so only node 1 changes: mx[1] = 5 and tag[1] = 5. The second add reaches leaf [2, 2] and rebuilds on the way up: mx[3] = 0 + 1 = 1, which doesn't include the parent's 5, and mx[1] = tag[1] + max(0, 1) = 6, the true maximum (a[2] = 5 + 1). The tag never moves."},{"q":"Coordinates go up to 10⁹, bookings arrive one at a time, and each `book(start, end)` must return the largest overlap so far (LeetCode 732). Which structure fits?","o":["A dynamic segment tree that creates nodes only along the paths it visits","A difference array over all 10⁹ positions","A Fenwick tree over all 10⁹ positions","A bottom-up segment tree with 2 × 10⁹ slots"],"a":0,"e":"The other three allocate memory for every position: gigabytes. Coordinate compression needs every booking in advance, but each answer is needed at once. The dynamic tree creates O(log C) nodes per booking."},{"q":"Which statements about lazy propagation are true? (choose 3)","t":"ms","o":["A fully covered node gets the update applied to its own value straight away","A tag is pushed to the children only when an operation needs to go below the node","Range add with range sum costs O(log n) per operation","After a range update, every leaf in the range is up to date","Any update can be made lazy, even “replace each value by its square root” with range sums"],"a":[0,1,2],"e":"A lazy update stops at covered nodes, so the leaves below them stay stale until a push reaches them. Square roots don't distribute over a sum, so a node's new sum can't be computed from its old one: that update can't simply be stored as a tag."},{"q":"Judge each statement.","t":"yn","s":[["With the root at 1, node x's children are 2x and 2x + 1.",true],["The bottom-up segment tree only works when n is a power of two.",false],["On 10⁵ elements, a recursive segment tree recurses only about 18 calls deep.",true],["A range query visits O(n) nodes in the worst case.",false]],"e":"That indexing is the binary-heap layout. The bottom-up tree works for any n with exactly 2n slots. The height is ⌈log₂ 10⁵⌉ = 17, so the recursion goes about 18 calls deep. A query visits at most four nodes per level, so O(log n)."},{"q":"Put the steps for one square of Falling Squares (LeetCode 699) in order.","t":"ord","items":["Find the compressed gaps l..r under the square","Query the maximum height on gaps l..r","Add the side length to get the square's top, h","Assign h to every gap in l..r","Read the root's maximum as the tallest stack so far"],"e":"Each step needs the one before: the query needs the gaps, the top needs the query, the assignment needs h, and the root is only right after the assignment. Querying after assigning would read the square's own height."},{"q":"Complete this JavaScript range-minimum query on a bottom-up tree (leaves at t[n .. 2n − 1]).","t":"drop","lang":"javascript","code":"function rangeMin(t, n, l, r) {           // min of a[l..r], inclusive\n  let res = Infinity;\n  for (l += {{0}}, r += n + 1; l < r; l >>= 1, r >>= 1) {\n    if (l & 1) res = Math.min(res, t[{{1}}]);\n    if (r & 1) res = Math.min(res, t[{{2}}]);\n  }\n  return res;\n}\n","blanks":[{"o":["n","n + 1","n - 1","1"],"a":0},{"o":["l++","++l","l","l--"],"a":0},{"o":["--r","r--","r","r + 1"],"a":0}],"e":"Leaf i sits at t[i + n]. An odd l is a right child, so take t[l] and then step right (l++). An odd r means r − 1 is a left child, so step left first and take it (--r); `r--` would read t[r], which is outside the half-open range."},{"q":"Match each problem to its segment-tree technique.","t":"match","pairs":[["My Calendar III","A dynamic tree with range add, reading the root's max"],["Falling Squares","Compressed edges with range max and range assign"],["Range minimum with point updates","A bottom-up tree with 2n slots"],["Range adds mixed with range-sum queries","Lazy tags with sum += v × length"]],"extra":["A difference array with one final pass"],"e":"A difference array can't answer queries mixed in with the updates. Each of the other techniques is one of this module's code blocks or its worked example."}],"probs":[["LC 731 · My Calendar II","https://leetcode.com/problems/my-calendar-ii/","Medium","before booking, check that the max overlap on [start, end) is below 2: range max, then range add, on a dynamic tree (or keep a list of double-booked intervals)"],["LC 732 · My Calendar III","https://leetcode.com/problems/my-calendar-iii/","Hard","code block 3: a dynamic tree with add tags; the root's max is the answer"],["LC 715 · Range Module","https://leetcode.com/problems/range-module/","Hard","a dynamic tree with assign tags (tracked or not) and an “all tracked?” query, or a sorted list of disjoint intervals"],["LC 699 · Falling Squares","https://leetcode.com/problems/falling-squares/","Hard","the worked example: compress the edges, then range max and range assign"],["LC 218 · The Skyline Problem","https://leetcode.com/problems/the-skyline-problem/","Hard","compress the x's and assign heights in increasing order so taller buildings overwrite, then emit each change; or sweep with a max-heap"],["LC 850 · Rectangle Area II","https://leetcode.com/problems/rectangle-area-ii/","Hard","sweep along x; over compressed y keep a cover count and the covered length per node (no push needed); use BigInt in JavaScript for the area products"],["LC 2286 · Booking Concert Tickets in Groups","https://leetcode.com/problems/booking-concert-tickets-in-groups/","Hard","store the max and the total of free seats per node; gather walks down to the first row with k free, scatter fills rows from the first non-full one"]],"src":[["cp-algorithms: Segment tree","https://cp-algorithms.com/data_structures/segment_tree.html"],["USACO Guide: Range update range query","https://usaco.guide/plat/RURQ"],["Codeforces blog: Efficient and easy segment trees","https://codeforces.com/blog/entry/18051"]]},{"id":"m10","d":"d4","t":"String matching: KMP, the Z-function and rolling hashes","min":110,"hook":"Find in an editor, `grep`, DNA search and duplicate detection all look for a pattern in a long text. The naive search can take n × m steps on unlucky input; KMP and the Z-function never need more than O(n + m), and rolling hashes compare substrings in O(1), with a small chance of a false match. The same tools answer interview favourites about repeats, periods and palindromes.","pre":{"q":"A text is a million letter a's. You search it for a pattern of 1,000 a's followed by one b, trying every start position in turn. About how many character comparisons is that, and what does the search keep forgetting?","a":"About a billion: at each of the 999,000 start positions it matches 1,000 a's before the b fails. After each failure it throws away what it has just read. Those characters were all a's, so the first 1,000 comparisons of the next attempt are bound to succeed. KMP keeps that knowledge in the prefix function and never moves backwards in the text."},"kid":{"t":"The car-colour game","x":"On the motorway, Ben plays a spotting game. He must see a red car, a blue car, a red car, a blue car and then a green car, one straight after another. He counts on his fingers how much of the pattern he has seen so far. He has four fingers up (red, blue, red, blue) when a red car passes instead of a green one. He starts to put all his fingers down, but Tara stops him: “Your last two cars were red then blue. That's the start of the pattern too. Keep two fingers up, and this red makes three.” Ben never needs to look back at cars that have gone.","map":[["The cars going past, one at a time","The text, read once from left to right"],["The fingers Ben has up","k: how many characters of the pattern match so far"],["“Your last two cars are also the start of the pattern”","The fallback k = π[k − 1], the longest border of the part already matched: π[3] = 2 for red, blue, red, blue"],["Never looking back at cars that have gone","The text pointer never moves backwards, so the search is O(n + m)"],["Five fingers up","k = m: a match ends at this character"]],"brk":"Here one fallback was enough. Sometimes the next car doesn't fit even after falling back, so KMP falls back again (k = π[k − 1]) until it fits or k is 0. One car can cost several fallbacks, but k rises by at most one per car, so all the fallbacks together cost O(n)."},"keys":["**The naive search is O(n · m) in the worst case**: it tries each of the n − m + 1 start positions and compares up to m characters. On text aaaa…a with pattern aa…ab every attempt fails only at the last character. On everyday text most attempts fail after a character or two, which is why it's usually fast.","**The prefix function**: π[i] is the length of the longest proper prefix of s[0..i] that is also a suffix of it (its longest *border*); for “abacabab”, π = 0 0 1 0 1 2 3 2. To compute π[i], start from k = π[i − 1]; while k > 0 and s[i] ≠ s[k], fall back to k = π[k − 1]; then add 1 if s[i] = s[k]. k rises by at most 1 per step and every fallback lowers it, so there are at most n fallbacks in all: O(n) time, O(n) space.","**KMP search**: compute π of pattern + “#” + text, with a separator that appears in neither string. The separator stops π from passing m, and each index i with π[i] = m ends a match that starts at i − 2m in the text. O(n + m) time and space; the streaming version keeps only the pattern's π, O(m) extra space.","**The Z-function**: z[i] is the length of the longest common prefix of s and s[i:] (z[0] is set to 0 here; some books use n). Keep the box [l, r), the rightmost segment found so far that equals a prefix of s. For i inside it, start from min(r − i, z[i − l]) and extend by comparing. Every successful comparison pushes r to the right, so it's O(n) time and space. On pattern + “#” + text, z[i] = m marks a match.","**What π answers besides search**: the shortest period of s is p = n − π[n − 1], and s is one block repeated two or more times exactly when p < n and p divides n (LC 459). The longest happy prefix is s[:π[n − 1]] (LC 1392). The last π value of s + “#” + reverse(s) is the length of the longest palindromic prefix of s (LC 214).","**Rolling hash (Rabin–Karp)**: h = (s₀·Bᵐ⁻¹ + s₁·Bᵐ⁻² + … + sₘ₋₁) mod M, for a base B and a prime M. Sliding the window drops the first term and adds a new one in O(1). Different strings can share a hash (a collision), so confirm each hit character by character, or use two independent moduli (double hashing). That's O(n + m), plus O(m) for each hit you confirm. Binary search on the length plus hashing finds the longest repeated substring (LC 1044) in O(n log n) on average.","**JavaScript precision**: the hash code below keeps every value below M = 1,000,000,007 and only ever multiplies a value by the base (131) or by a character code (below 2¹⁶ from `charCodeAt`). So every intermediate value is below 2¹⁶ × M ≈ 6.6 × 10¹³, far under 2⁵³ ≈ 9.0 × 10¹⁵, and plain Numbers stay exact. Multiplying two hash values (up to about 10¹⁸) would not be exact: that needs BigInt.","**The built-ins**: Python's `str.find` and JavaScript's `indexOf` are fast in practice and fine for LC 28, but neither language promises O(n + m) in the worst case. When the bound matters, or the interviewer asks for it, write KMP or Z."],"dia":[{"type":"cells","cap":"The prefix function of “abacabab”","rows":[{"label":"s","vals":["a","b","a","c","a","b","a","b"]},{"label":"π","vals":[0,0,1,0,1,2,3,2],"hl":[6],"ok":[7]}],"note":"At i = 7, k starts at π[6] = 3, but s[7] = b ≠ s[3] = c, so k falls back to π[2] = 1. Now s[7] = s[1] = b, so π[7] = 2: the border “ab”."},{"type":"cells","cap":"The Z-function of “abacaba”","rows":[{"label":"s","vals":["a","b","a","c","a","b","a"]},{"label":"z","vals":[0,0,1,0,3,0,1],"hl":[4],"ok":[6]}],"note":"z[4] = 3: s[4:] = “aba” matches the first 3 characters, so the box becomes [4, 7). At i = 6, inside the box, z[6 − 4] = z[2] = 1 is copied; that already reaches the end of the string, so no comparison is needed."},{"type":"cells","cap":"A rolling hash of the 3-digit windows of 31415 (base 10, M = 13)","rows":[{"label":"314 → 2","vals":[3,1,4,1,5],"hl":[0,1,2]},{"label":"141 → 11","vals":[3,1,4,1,5],"hl":[1,2,3]},{"label":"415 → 12","vals":[3,1,4,1,5],"hl":[2,3,4]}],"note":"The first digit of a window weighs 10² mod 13 = 9. Sliding from 314 to 141: ((2 − 3 × 9) × 10 + 1) mod 13 = 11, without re-reading the window. The string 115 also hashes to 11 (115 = 8 × 13 + 11): a collision, which is why every hit is confirmed."}],"cmp":[{"cap":"Four ways to find a pattern (text length n, pattern length m)","head":["","Naive","KMP (prefix function)","Z-function","Rabin–Karp"],"rows":[["Worst-case time","O(n · m)","O(n + m)","O(n + m)","O(n · m): each hit costs O(m) to confirm"],["Usual time","fast when mismatches come early","O(n + m)","O(n + m)","O(n + m), plus O(m) per hit"],["Extra space","O(1)","O(m) streaming; O(n + m) on pattern + “#” + text","O(n + m)","O(1)"],["Also gives","nothing more","borders and periods","the prefix-match length at every position","O(1) substring comparisons (with prefix hashes)"]]},{"cap":"The same jobs in Python and JavaScript","head":["Task","Python","JavaScript"],"rows":[["First match, or −1","`text.find(p)`","`text.indexOf(p)`"],["Does p start at index i?","`text.startswith(p, i)`","`text.startsWith(p, i)`"],["A character's code","`ord(c)`","`s.charCodeAt(i)`: a UTF-16 unit, below 2¹⁶"],["Reverse a string","`s[::-1]`","`[...s].reverse().join(\"\")`"],["Hash arithmetic mod 10⁹ + 7","exact at any size","exact while every intermediate value stays below 2⁵³"]]}],"code":[{"t":"The prefix function and KMP: every match","tabs":[{"lang":"python","src":"def prefix_function(s):\n    pi = [0] * len(s)\n    for i in range(1, len(s)):\n        k = pi[i - 1]                        # the longest border of s[:i]\n        while k > 0 and s[i] != s[k]:\n            k = pi[k - 1]                    # fall back to the next shorter border\n        if s[i] == s[k]:\n            k += 1                           # the border grows by one\n        pi[i] = k\n    return pi\n\ndef kmp_search(text, pattern):               # every start index of pattern in text\n    m = len(pattern)\n    if m == 0:\n        return list(range(len(text) + 1))\n    pi = prefix_function(pattern + \"#\" + text)   # \"#\" must appear in neither string\n    return [i - 2 * m for i in range(2 * m, len(pi)) if pi[i] == m]\n\nprint(*prefix_function(\"abacabab\"))\nprint(*kmp_search(\"abababcab\", \"abab\"))\nprint(*kmp_search(\"aaaaa\", \"aa\"))\n","out":"0 0 1 0 1 2 3 2\n0 2\n0 1 2 3\n","notes":[[6,"Each π[k − 1] is smaller than k, and k rises by at most 1 per i, so this line runs at most n times in total: O(n) amortised."],[15,"The empty pattern matches at every index from 0 to len(text), the end included."],[16,"The separator stops a border from running past the pattern, so no π value is bigger than m."],[17,"A match ending at index i of the combined string starts at i − m + 1, and the text begins at index m + 1, so its start in the text is i − 2m."]]},{"lang":"javascript","src":"function prefixFunction(s) {\n  const pi = new Array(s.length).fill(0);\n  for (let i = 1; i < s.length; i++) {\n    let k = pi[i - 1];                       // the longest border of s.slice(0, i)\n    while (k > 0 && s[i] !== s[k]) k = pi[k - 1];   // fall back to the next shorter border\n    if (s[i] === s[k]) k++;                  // the border grows by one\n    pi[i] = k;\n  }\n  return pi;\n}\n\nfunction kmpSearch(text, pattern) {          // every start index of pattern in text\n  const m = pattern.length;\n  if (m === 0) return Array.from({ length: text.length + 1 }, (_, i) => i);\n  const pi = prefixFunction(pattern + \"#\" + text);   // \"#\" must appear in neither string\n  const starts = [];\n  for (let i = 2 * m; i < pi.length; i++) if (pi[i] === m) starts.push(i - 2 * m);\n  return starts;\n}\n\nconsole.log(...prefixFunction(\"abacabab\"));\nconsole.log(...kmpSearch(\"abababcab\", \"abab\"));\nconsole.log(...kmpSearch(\"aaaaa\", \"aa\"));\n","out":"0 0 1 0 1 2 3 2\n0 2\n0 1 2 3\n","notes":[[5,"Each π[k − 1] is smaller than k, and k rises by at most 1 per i, so the fallbacks total at most n: O(n) amortised."],[15,"The separator stops a border from running past the pattern, so no π value is bigger than m."],[17,"A match ending at index i of the combined string starts at i − m + 1, and the text begins at index m + 1, so its start in the text is i − 2m."]]}]},{"t":"The Z-function, and matching with it","tabs":[{"lang":"python","src":"def z_function(s):\n    n = len(s)\n    z = [0] * n                              # z[0] stays 0 by convention\n    l = r = 0                                # the box [l, r): s[l:r] == s[:r - l]\n    for i in range(1, n):\n        if i < r:\n            z[i] = min(r - i, z[i - l])      # copy what the box already knows\n        while i + z[i] < n and s[z[i]] == s[i + z[i]]:\n            z[i] += 1                        # then extend by comparing\n        if i + z[i] > r:\n            l, r = i, i + z[i]               # the new rightmost box\n    return z\n\ndef z_search(text, pattern):                 # every start index of pattern in text\n    m = len(pattern)\n    if m == 0:\n        return list(range(len(text) + 1))\n    z = z_function(pattern + \"#\" + text)     # \"#\" must appear in neither string\n    return [i - m - 1 for i in range(m + 1, len(z)) if z[i] == m]\n\nprint(*z_function(\"abacaba\"))\nprint(*z_function(\"aaaaa\"))\nprint(*z_search(\"abababcab\", \"abab\"))\n","out":"0 0 1 0 3 0 1\n0 4 3 2 1\n0 2\n","notes":[[7,"s[i:r] is a copy of s[i − l:r − l], whose z value is already known. It can only be trusted up to r, the end of what the box has checked."],[9,"A comparison that succeeds always looks past the old r, and r only moves right, so there are at most n of them in all: O(n) time."],[19,"The text starts at index m + 1 of the combined string, so z[i] = m means a match at i − m − 1."]]},{"lang":"javascript","src":"function zFunction(s) {\n  const n = s.length;\n  const z = new Array(n).fill(0);            // z[0] stays 0 by convention\n  let l = 0, r = 0;                          // the box [l, r): s.slice(l, r) === s.slice(0, r - l)\n  for (let i = 1; i < n; i++) {\n    if (i < r) z[i] = Math.min(r - i, z[i - l]);   // copy what the box already knows\n    while (i + z[i] < n && s[z[i]] === s[i + z[i]]) z[i]++;   // then extend by comparing\n    if (i + z[i] > r) { l = i; r = i + z[i]; }     // the new rightmost box\n  }\n  return z;\n}\n\nfunction zSearch(text, pattern) {            // every start index of pattern in text\n  const m = pattern.length;\n  if (m === 0) return Array.from({ length: text.length + 1 }, (_, i) => i);\n  const z = zFunction(pattern + \"#\" + text);  // \"#\" must appear in neither string\n  const starts = [];\n  for (let i = m + 1; i < z.length; i++) if (z[i] === m) starts.push(i - m - 1);\n  return starts;\n}\n\nconsole.log(...zFunction(\"abacaba\"));\nconsole.log(...zFunction(\"aaaaa\"));\nconsole.log(...zSearch(\"abababcab\", \"abab\"));\n","out":"0 0 1 0 3 0 1\n0 4 3 2 1\n0 2\n","notes":[[6,"s.slice(i, r) is a copy of s.slice(i − l, r − l), whose z value is already known. It can only be trusted up to r, the end of what the box has checked."],[7,"A comparison that succeeds always looks past the old r, and r only moves right, so there are at most n of them in all: O(n) time."],[18,"The text starts at index m + 1 of the combined string, so z[i] = m means a match at i − m − 1."]]}]},{"t":"Rabin–Karp with one modulus, confirming every hit","tabs":[{"lang":"python","src":"def rabin_karp(text, pattern, base=131, mod=1_000_000_007):\n    n, m = len(text), len(pattern)\n    if m == 0:\n        return list(range(n + 1))\n    if m > n:\n        return []\n    power = pow(base, m - 1, mod)            # the weight of the window's first character\n    hp = ht = 0\n    for i in range(m):                       # hash the pattern and the first window\n        hp = (hp * base + ord(pattern[i])) % mod\n        ht = (ht * base + ord(text[i])) % mod\n    found = []\n    for i in range(n - m + 1):\n        if hp == ht and text.startswith(pattern, i):   # equal hashes: confirm\n            found.append(i)\n        if i + m < n:                        # slide: drop text[i], add text[i + m]\n            ht = ((ht - ord(text[i]) * power) * base + ord(text[i + m])) % mod\n    return found\n\nprint(*rabin_karp(\"abracadabra\", \"abra\"))\nprint(*rabin_karp(\"abracadabra\", \"abra\", mod=3))   # many collisions, same answer\nprint(*rabin_karp(\"aaaaaa\", \"aaa\"))\n","out":"0 7\n0 7\n0 1 2 3\n","notes":[[7,"`pow` with three arguments is fast modular power: O(log m) multiplications."],[14,"Different strings can share a hash, so compare the characters before reporting a match. That costs O(m) per hit."],[17,"Python's `%` always gives 0 to mod − 1, even when the left side is negative, and its ints never overflow."],[21,"With mod = 3 there are only three possible hash values, so false hits are common. The check keeps the answer right; only the speed suffers."]]},{"lang":"javascript","src":"function rabinKarp(text, pattern, base = 131, mod = 1_000_000_007) {\n  const n = text.length, m = pattern.length;\n  if (m === 0) return Array.from({ length: n + 1 }, (_, i) => i);\n  if (m > n) return [];\n  let power = 1;                             // the weight of the window's first character\n  for (let i = 1; i < m; i++) power = (power * base) % mod;\n  let hp = 0, ht = 0;\n  for (let i = 0; i < m; i++) {              // hash the pattern and the first window\n    hp = (hp * base + pattern.charCodeAt(i)) % mod;\n    ht = (ht * base + text.charCodeAt(i)) % mod;\n  }\n  const found = [];\n  for (let i = 0; i + m <= n; i++) {\n    if (hp === ht && text.startsWith(pattern, i)) found.push(i);   // equal hashes: confirm\n    if (i + m < n) {                         // slide: drop text[i], add text[i + m]\n      ht = (ht - ((text.charCodeAt(i) * power) % mod) + mod) % mod;\n      ht = (ht * base + text.charCodeAt(i + m)) % mod;\n    }\n  }\n  return found;\n}\n\nconsole.log(...rabinKarp(\"abracadabra\", \"abra\"));\nconsole.log(...rabinKarp(\"abracadabra\", \"abra\", 131, 3));   // many collisions, same answer\nconsole.log(...rabinKarp(\"aaaaaa\", \"aaa\"));\n","out":"0 7\n0 7\n0 1 2 3\n","notes":[[14,"Different strings can share a hash, so compare the characters before reporting a match. That costs O(m) per hit."],[16,"A code unit is below 2¹⁶ and power is below mod, so the product is under 2¹⁶ × mod ≈ 6.6 × 10¹³: exact. `+ mod` keeps the result non-negative, because JavaScript's `%` keeps the sign of the left side."],[17,"ht × base (131 here) + a code unit is below 1.4 × 10¹¹, far under 2⁵³, so this is exact too."],[24,"With mod = 3 there are only three possible hash values, so false hits are common. The check keeps the answer right; only the speed suffers."]]}]}],"ex":{"q":"Given a string s, add as few characters as possible in front of it to make it a palindrome, and return that palindrome (LeetCode 214, Shortest Palindrome). s can have 5 × 10⁴ characters.","steps":["Whatever goes in front must mirror the end of s. If the longest prefix of s that is a palindrome has length L, the answer is reverse(s[L:]) + s, and nothing shorter works.","A palindromic prefix reads the same backwards, so it's a prefix of s that is also a suffix of reverse(s).","So build u = s + “#” + reverse(s). The last π value of u is the length of the longest prefix of u that is also its suffix. The “#” stops it from crossing the middle, so it's exactly L.","Return reverse(s[L:]) + s: O(n) time and O(n) space, where testing every prefix for being a palindrome would be O(n²)."],"code":{"t":"Shortest palindrome with the prefix function","tabs":[{"lang":"python","src":"def prefix_function(s):\n    pi = [0] * len(s)\n    for i in range(1, len(s)):\n        k = pi[i - 1]\n        while k > 0 and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\ndef shortest_palindrome(s):\n    longest = prefix_function(s + \"#\" + s[::-1])[-1]   # the longest palindromic prefix\n    return s[longest:][::-1] + s                        # mirror the rest in front\n\nprint(shortest_palindrome(\"aacecaaa\"))\nprint(shortest_palindrome(\"abcd\"))\nprint(shortest_palindrome(\"abab\"))\n","out":"aaacecaaa\ndcbabcd\nbabab\n"},{"lang":"javascript","src":"function prefixFunction(s) {\n  const pi = new Array(s.length).fill(0);\n  for (let i = 1; i < s.length; i++) {\n    let k = pi[i - 1];\n    while (k > 0 && s[i] !== s[k]) k = pi[k - 1];\n    if (s[i] === s[k]) k++;\n    pi[i] = k;\n  }\n  return pi;\n}\n\nconst reverse = s => [...s].reverse().join(\"\");\n\nfunction shortestPalindrome(s) {\n  const longest = prefixFunction(s + \"#\" + reverse(s)).at(-1);   // the longest palindromic prefix\n  return reverse(s.slice(longest)) + s;                          // mirror the rest in front\n}\n\nconsole.log(shortestPalindrome(\"aacecaaa\"));\nconsole.log(shortestPalindrome(\"abcd\"));\nconsole.log(shortestPalindrome(\"abab\"));\n","out":"aaacecaaa\ndcbabcd\nbabab\n"}]},"a":"aaacecaaa, dcbabcd and babab. For “aacecaaa”, the last π value of “aacecaaa#aaacecaa” is 7: the palindrome “aacecaa”, so only the final “a” is mirrored in front. For “abcd” the longest palindromic prefix is just “a”, so “dcb” goes in front; for “abab” it's “aba”, so one “b” does."},"fade":{"q":"Can s be built by repeating one of its substrings two or more times (LeetCode 459, Repeated Substring Pattern)? Answer it with the prefix function.","steps":["π[n − 1] is the longest border of s: the longest proper prefix that is also a suffix.",{"ask":"Why is p = n − π[n − 1] a period of s, that is, s[i] = s[i + p] for every valid i?","a":"The prefix and the suffix of length π[n − 1] are equal, and the suffix starts p places later, so s[i] = s[i + p] for every i < n − p. The longest border gives the smallest such p."},{"ask":"Is s always a repetition when p < n? Try “abaab”.","a":"No. “abaab” has π[4] = 2, so p = 3, but 3 doesn't divide 5. s is a repetition exactly when p < n and n % p == 0, and then it's n / p copies of s[:p]."},{"ask":"Time and space?","a":"O(n) time for the prefix function and O(n) space for π."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def repeated_substring_pattern(s):       # prefix_function is the one from code block 1\n    n = len(s)\n    period = ...                         # TODO: the shortest period, from the last π value\n    return ...                           # TODO: is s two or more whole copies of s[:period]?\n"},{"lang":"javascript","src":"function repeatedSubstringPattern(s) {   // prefixFunction is the one from code block 1\n  const n = s.length;\n  // TODO: the shortest period, from the last pi value\n  // TODO: return whether s is two or more whole copies of s.slice(0, period)\n}\n"}]},"solution":{"t":"Solution: the period must divide n","tabs":[{"lang":"python","src":"def prefix_function(s):\n    pi = [0] * len(s)\n    for i in range(1, len(s)):\n        k = pi[i - 1]\n        while k > 0 and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\ndef repeated_substring_pattern(s):\n    n = len(s)\n    period = n - prefix_function(s)[-1]      # the shortest period of s\n    return period < n and n % period == 0    # at least two whole copies\n\nfor s in [\"abab\", \"aba\", \"abcabcabcabc\", \"abaab\", \"a\", \"zzz\"]:\n    print(s, \"yes\" if repeated_substring_pattern(s) else \"no\")\n","out":"abab yes\naba no\nabcabcabcabc yes\nabaab no\na no\nzzz yes\n"},{"lang":"javascript","src":"function prefixFunction(s) {\n  const pi = new Array(s.length).fill(0);\n  for (let i = 1; i < s.length; i++) {\n    let k = pi[i - 1];\n    while (k > 0 && s[i] !== s[k]) k = pi[k - 1];\n    if (s[i] === s[k]) k++;\n    pi[i] = k;\n  }\n  return pi;\n}\n\nfunction repeatedSubstringPattern(s) {\n  const n = s.length;\n  const period = n - prefixFunction(s).at(-1);   // the shortest period of s\n  return period < n && n % period === 0;         // at least two whole copies\n}\n\nfor (const s of [\"abab\", \"aba\", \"abcabcabcabc\", \"abaab\", \"a\", \"zzz\"])\n  console.log(s, repeatedSubstringPattern(s) ? \"yes\" : \"no\");\n","out":"abab yes\naba no\nabcabcabcabc yes\nabaab no\na no\nzzz yes\n"}]}},"traps":[["“KMP restarts at the next start position after a mismatch, just more cleverly.”","That's the naive search. KMP never moves backwards in the text: it keeps k, the length still matched, and falls back through π. That's why it stays O(n + m) even on aaaa…ab."],["“The `while` loop inside the prefix function makes it O(n²).”","Each fallback lowers k, and k rises by at most 1 per character, so all the fallbacks together number at most n: O(n) amortised, like a stack where each item is popped at most once."],["“Any separator works in pattern + “#” + text.”","It must appear in neither string. With pattern “a” and text “a#a”, the combined string “a#a#a” has π = 0 0 1 2 3, so the second match is missed: π at its end is 3, not 1. Pick a character outside the alphabet, or use the streaming KMP, which needs no separator."],["“Equal rolling hashes mean equal strings.”","Different strings can share a hash: with base 10 and M = 13, “141” and “115” both hash to 11. Confirm every hit character by character, or use two independent moduli so that a false match becomes very unlikely (but not impossible)."],["“In JavaScript, `(h * base + c) % mod` is fine for any modulus.”","Only while every intermediate value stays below 2⁵³. With mod ≈ 10⁹ and base 131 the largest is about 1.3 × 10¹¹, which is fine. Multiplying two hash values, or porting C++ code that hashes modulo a number near 2⁶¹, produces values above 2⁵³ that are silently rounded. Use BigInt for those."],["“`str.find` and `indexOf` are guaranteed O(n + m).”","Neither Python nor JavaScript promises a worst-case bound for its built-in search. Both are fast in practice and fine for LC 28, but when the bound matters, or the interviewer asks for it, write KMP or Z."]],"disc":[["KMP, Z or a rolling hash: how do you choose?","For one pattern, KMP and Z are deterministic O(n + m), and π also answers border and period questions; many people find Z easier to reason about for “how much of the prefix matches here?”. Rolling hashes shine when you compare many substrings: after O(n) prefix hashes, any two substrings compare in O(1), which is what binary search on the answer needs (LC 1044), or a set of windows (LC 187). The price is a small chance of a false match, so confirm hits or use double hashing. On contest sites that allow hacks, a fixed base and modulus can be broken by a crafted input, so pick the base at random when the program starts."],["Should you hand-write KMP when `find` and `indexOf` exist?","In product code, usually not: the built-ins are fast and well tested. Hand-write it when you need what they don't give: every match in a stream you read only once, a guaranteed bound on hostile input, or the prefix function itself for periods, borders and palindromic prefixes. In an interview, say you'd use the built-in and ask whether they want the algorithm."]],"teach":{"prompt":"Explain to a junior colleague how the prefix function makes KMP search linear, and one other question π can answer.","rubric":["π[i] is the length of the longest proper prefix of s[0..i] that is also a suffix","On a mismatch, fall back with k = π[k − 1] instead of restarting; the text pointer never moves back","k rises by at most 1 per character, so all the fallbacks total at most n: O(n)","Search: π of pattern + “#” + text, where π = m ends a match: O(n + m)","Another use: the shortest period n − π[n − 1], or the longest palindromic prefix"],"model":"The prefix function π[i] is the length of the longest proper prefix of s[0..i] that is also a suffix of it. KMP uses it to avoid re-reading the text. Suppose k characters of the pattern match and the next one doesn't. The naive search would restart one place later, but KMP already knows the last k characters, so it falls back to k = π[k − 1], the longest border of the matched part, and compares again, until a character matches or k is 0. k rises by at most one per character and every fallback lowers it, so there are at most n fallbacks in total and the whole search is O(n + m). The simplest way to code it is to compute π of pattern + “#” + text: every position where π equals m ends a match. The same table answers other questions: n − π[n − 1] is the shortest period, so s is a repeated block exactly when that period is smaller than n and divides it."},"qa":[["What is π[i], the prefix function?","The length of the longest proper prefix of s[0..i] that is also a suffix of s[0..i]."],["What does KMP do on a mismatch?","Falls back to k = π[k − 1] and compares again; it never moves backwards in the text."],["What is z[i], the Z-function?","The length of the longest common prefix of s and s[i:]."],["The shortest period of s, from π?","p = n − π[n − 1]. s is a repeated block exactly when p < n and p divides n."],["The rolling-hash update when the window slides one step?","h′ = ((h − out · Bᵐ⁻¹) · B + in) mod M."],["Why are a modulus near 10⁹ and a small base safe in JavaScript?","Every intermediate value, such as h · B + c, stays far below 2⁵³, so it is an exact integer."]],"quiz":[{"q":"What does this print?","snip":{"t":"The prefix function of “aabaaab”","tabs":[{"lang":"python","src":"s = \"aabaaab\"\npi = [0] * len(s)\nfor i in range(1, len(s)):\n    k = pi[i - 1]\n    while k > 0 and s[i] != s[k]:\n        k = pi[k - 1]\n    if s[i] == s[k]:\n        k += 1\n    pi[i] = k\nprint(*pi)\n"},{"lang":"javascript","src":"const s = \"aabaaab\";\nconst pi = new Array(s.length).fill(0);\nfor (let i = 1; i < s.length; i++) {\n  let k = pi[i - 1];\n  while (k > 0 && s[i] !== s[k]) k = pi[k - 1];\n  if (s[i] === s[k]) k++;\n  pi[i] = k;\n}\nconsole.log(...pi);\n"}]},"o":["0 1 0 1 2 2 3","0 1 0 1 2 3 3","0 1 0 1 2 1 0","0 0 0 1 2 2 3"],"a":0,"e":"π[1] is 1 because “aa” has the border “a”. At i = 5, k = π[4] = 2, but s[5] = a ≠ s[2] = b, so k falls back to π[1] = 1, and s[5] = s[1] gives π[5] = 2 (the border “aa”). At i = 6, s[6] = b = s[2] extends it to 3 (“aab”)."},{"q":"What does this print?","snip":{"t":"The Z-function of “aaabaab”","tabs":[{"lang":"python","src":"s = \"aaabaab\"\nn = len(s)\nz = [0] * n\nl = r = 0\nfor i in range(1, n):\n    if i < r:\n        z[i] = min(r - i, z[i - l])\n    while i + z[i] < n and s[z[i]] == s[i + z[i]]:\n        z[i] += 1\n    if i + z[i] > r:\n        l, r = i, i + z[i]\nprint(*z)\n"},{"lang":"javascript","src":"const s = \"aaabaab\", n = s.length;\nconst z = new Array(n).fill(0);\nlet l = 0, r = 0;\nfor (let i = 1; i < n; i++) {\n  if (i < r) z[i] = Math.min(r - i, z[i - l]);\n  while (i + z[i] < n && s[z[i]] === s[i + z[i]]) z[i]++;\n  if (i + z[i] > r) { l = i; r = i + z[i]; }\n}\nconsole.log(...z);\n"}]},"o":["0 2 1 0 2 1 0","7 2 1 0 2 1 0","0 2 1 0 3 2 1","0 1 2 0 1 2 0"],"a":0,"e":"z[1] = 2: s[1:] = “aabaab” shares “aa” with s, then b ≠ a. z[4] = 2: “aab” shares “aa”. This code leaves z[0] at 0 (some books set it to n), and “0 1 2 0 1 2 0” is the prefix function of the same string, not its Z-function."},{"q":"What is the worst-case time of the naive search (try every start, compare left to right) for a pattern of length m in a text of length n, and which input shows it?","o":["O(n · m), on text aaaa…a with pattern aa…ab","O(n + m), because every attempt stops at the first mismatch","O(n log m), on text aaaa…a with pattern aa…ab","O(n · m), but only when the pattern is longer than the text"],"a":0,"e":"Each attempt matches m − 1 a's before the b fails, so it does about (n − m + 1) · m comparisons. Mismatches do stop attempts early on everyday text, but not on this input. A pattern longer than the text has no start positions at all. KMP and Z guarantee O(n + m)."},{"q":"Which statements about Rabin–Karp rolling hashes are true? (choose 2)","t":"ms","o":["Sliding the window by one character costs O(1)","Two different strings can have the same hash, so a hit must be confirmed or made very unlikely with two moduli","Two equal strings can have different hashes when the modulus is small","With mod 1,000,000,007 and base 131, JavaScript needs BigInt for `h * base`","Rabin–Karp is O(n + m) in the worst case, even when every window matches"],"a":[0,1],"e":"Equal strings always hash alike. h × 131 stays below about 1.3 × 10¹¹, far under 2⁵³, so plain Numbers are exact. If every window matches (text aaaa…, pattern aaa), each hit costs O(m) to confirm, so the worst case is O(n · m)."},{"q":"Judge each statement.","t":"yn","s":[["z[i] is the length of the longest common prefix of s and s[i:].",true],["n − π[n − 1] is the shortest period of s.",true],["If the shortest period p of s is less than n, then s is a repetition of s[:p].",false],["Python's `str.find` is guaranteed to run in O(n + m) time.",false]],"e":"The first two are the definitions to rely on. “abaab” has period 3 but isn't a repetition, because 3 doesn't divide 5. Neither Python nor JavaScript promises a worst-case bound for its built-in search."},{"q":"Put the steps for computing π[i] in order.","t":"ord","items":["Set k = π[i − 1], the longest border of the previous prefix","While k > 0 and s[i] ≠ s[k], fall back: k = π[k − 1]","If s[i] = s[k], extend the border: k = k + 1","Store π[i] = k"],"e":"You need the previous border before you can test it; you can only extend once the fallbacks have found a border whose next character matches (or reached 0); and π[i] is whatever k is at the end."},{"q":"Complete the JavaScript Z-function.","t":"drop","lang":"javascript","code":"function zFunction(s) {\n  const n = s.length, z = new Array(n).fill(0);\n  let l = 0, r = 0;\n  for (let i = 1; i < n; i++) {\n    if (i < r) z[i] = Math.min(r - i, z[{{0}}]);\n    while (i + z[i] < n && s[z[i]] === s[{{1}}]) z[i]++;\n    if (i + z[i] > r) { l = i; r = {{2}}; }\n  }\n  return z;\n}\n","blanks":[{"o":["i - l","l","r - i","i - 1"],"a":0},{"o":["i + z[i]","z[i]","i","l + z[i]"],"a":0},{"o":["i + z[i]","n","i + z[i] + 1","r + z[i]"],"a":0}],"e":"Inside the box, s[i..r) copies s[i − l..r − l), so z[i − l] is known. The extension compares the next unmatched pair, s[z[i]] with s[i + z[i]]. The new box ends where this match ends, at i + z[i]; ending it any later would let a later copy claim characters nobody has checked."},{"q":"Match each task to its tool.","t":"match","pairs":[["Every occurrence of one pattern, O(n + m) in the worst case","π of pattern + “#” + text"],["The shortest period of s","n − π[n − 1]"],["The longest palindromic prefix of s","The last π value of s + “#” + reverse(s)"],["The longest substring that appears at least twice","Binary search on the length, with rolling hashes"]],"extra":["A monotonic stack of the character codes"],"e":"KMP gives guaranteed linear search; the period and the palindromic prefix come from π too; LC 1044 needs many substring comparisons, which hashing makes O(1) each."}],"probs":[["LC 28 · Find the Index of the First Occurrence in a String","https://leetcode.com/problems/find-the-index-of-the-first-occurrence-in-a-string/","Easy","KMP from memory: the first i with π[i] = m in needle + “#” + haystack gives i − 2m"],["LC 796 · Rotate String","https://leetcode.com/problems/rotate-string/","Easy","goal is a rotation of s exactly when the lengths matc
