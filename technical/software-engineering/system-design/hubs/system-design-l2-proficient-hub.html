 a comparison cost?","a":"O(k) time and O(k) space per version for k replicas: cheap for a handful of replicas, which is why the counters are per replica rather than per client."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def compare(a, b):\n    \"\"\"a, b: version vectors {replica: count}. Returns 'equal', 'before', 'after' or 'concurrent'.\"\"\"\n    ...                                       # TODO: compare every replica's count, treating missing as 0\n"},{"lang":"javascript","src":"function compare(a, b) {\n  // a, b: version vectors {replica: count}. Returns \"equal\", \"before\", \"after\" or \"concurrent\"\n  // TODO: compare every replica's count, treating missing as 0\n}\n"}]},"solution":{"t":"Solution: two “≤ everywhere” checks","tabs":[{"lang":"python","src":"def compare(a, b):\n    \"\"\"a, b: version vectors {replica: count}. Returns 'equal', 'before', 'after' or 'concurrent'.\"\"\"\n    keys = set(a) | set(b)\n    a_le_b = all(a.get(k, 0) <= b.get(k, 0) for k in keys)\n    b_le_a = all(b.get(k, 0) <= a.get(k, 0) for k in keys)\n    if a_le_b and b_le_a:\n        return \"equal\"\n    if a_le_b:\n        return \"before\"\n    if b_le_a:\n        return \"after\"\n    return \"concurrent\"                       # each has seen something the other hasn't\n\nv1 = {\"eu\": 1}                                # the first version, written in the EU\nv2 = {\"eu\": 2}                                # the EU edits it again\nv3 = {\"eu\": 1, \"us\": 1}                       # the US edits v1 without seeing v2\nprint(compare(v1, v2), compare(v2, v3), compare(v3, v3), compare(v2, v1))\n","out":"before concurrent equal after"},{"lang":"javascript","src":"function compare(a, b) {\n  // a, b: version vectors {replica: count}. Returns \"equal\", \"before\", \"after\" or \"concurrent\"\n  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);\n  const aLeB = [...keys].every(k => (a[k] ?? 0) <= (b[k] ?? 0));\n  const bLeA = [...keys].every(k => (b[k] ?? 0) <= (a[k] ?? 0));\n  if (aLeB && bLeA) return \"equal\";\n  if (aLeB) return \"before\";\n  if (bLeA) return \"after\";\n  return \"concurrent\";                        // each has seen something the other hasn't\n}\n\nconst v1 = { eu: 1 };                         // the first version, written in the EU\nconst v2 = { eu: 2 };                         // the EU edits it again\nconst v3 = { eu: 1, us: 1 };                  // the US edits v1 without seeing v2\nconsole.log(compare(v1, v2), compare(v2, v3), compare(v3, v3), compare(v2, v1));\n","out":"before concurrent equal after"}]}},"traps":[["“A replica is a backup.”","A replica copies every change, mistakes included: a bad DELETE reaches every replica within milliseconds. You still need backups and point-in-time recovery to undo errors."],["“Asynchronous replication never loses a confirmed write.”","If the leader dies before the followers receive a write it has already confirmed, the promoted follower doesn't have it. Use semi-synchronous replication or quorum writes where losing a confirmed write is unacceptable."],["“W + R > N makes a leaderless store strongly consistent.”","It guarantees overlap with the latest successful write, but concurrent writes, writes that fail halfway and sloppy quorums can still give stale or conflicting reads. Quorums alone aren't linearizable."],["“Multi-leader is just a faster leader-follower.”","Every leader accepts writes, so the same item can change in two places at once. Without a conflict strategy (a merge, last-writer-wins, or asking the user), data is silently lost."],["“Last-writer-wins uses real time.”","It uses timestamps from clocks that drift and jump, so a server whose clock runs a few seconds slow can lose every conflict, even for later writes. Prefer version vectors or merges for data that matters."],["“Automatic failover is always safer than manual.”","An over-eager failover on a slow network can promote a follower while the old leader is still alive (split brain), or drop recent writes. Use timeouts that fit your network, fencing, and leader election by consensus (L3)."]],"disc":[["How would you replicate a database for an app with users in Europe and the US?","If each piece of data has a natural home, such as a user's account, keep a single leader per user in their region and asynchronous followers elsewhere for reads: writes stay local for most users and can't conflict. If both regions must accept writes to the same data, use multi-leader with a clear conflict strategy, or a leaderless store with per-key merges. Either way, measure replication lag, give each user read-your-writes, and practise a regional failover."],["What can go wrong during a leader failover, and how do you make it safe?","The new leader may lack writes the old one confirmed, the old leader may come back still thinking it's in charge and accept writes (split brain), and clients may keep writing to it. Make it safe with semi-synchronous replication for important data, fencing (each new leader gets a higher term, and storage rejects writes from older terms), one source of truth for who leads (a consensus service), and failover timeouts long enough not to fire on a short network blip."]],"teach":{"prompt":"Explain to a junior colleague the three ways to replicate data, and what quorums do.","rubric":["Leader-follower: one writer, a log to followers, failover risks","Synchronous, asynchronous and semi-synchronous replication","Multi-leader: local writes, and conflicts to resolve","Leaderless: write W of N, read R of N, and W + R > N","Replication lag, and hiding it with session guarantees"],"model":"With leader-follower replication one node takes every write and streams its change log to followers, which can serve reads a little behind; it's simple and conflict-free, but if replication is asynchronous a failover can lose writes the leader had already confirmed, so important data waits for at least one follower. Multi-leader puts a leader in each region so writes stay local, but two regions can change the same thing at once, so you need a conflict strategy such as a merge, and last-writer-wins only if losing an edit is acceptable. Leaderless stores let the client write to W of N replicas and read from R of them, keeping the newest version; when W + R > N every read overlaps the latest successful write, and read repair fixes stale copies. A majority for both is the usual choice. Whatever the method, followers lag, so I measure the lag and give users read-your-writes."},"qa":[["What is leader-follower replication?","One leader takes all writes and streams them to followers, which can serve reads."],["Synchronous or asynchronous replication?","Synchronous waits for followers before confirming (no loss, slower); asynchronous confirms at once (fast, can lose writes on failover)."],["The quorum rule?","W + R > N, so every read set overlaps every write set."],["The usual quorum for N = 3?","W = 2 and R = 2."],["What is split brain?","Two nodes both acting as the leader and accepting conflicting writes."],["Concurrent writes, in version-vector terms?","Neither vector is ≤ the other everywhere: the writes were made without seeing each other."]],"quiz":[{"q":"What does this print? (`QuorumStore` is this module's helper.)","snip":{"t":"Reads, a stale copy and read repair","tabs":[{"lang":"python","src":"q = QuorumStore(3)\nq.write(\"a\", reached=[0, 1, 2])\nq.write(\"b\", reached=[0, 1])\nprint(q.read([1, 2])[1], q.read([2])[1], q.read([2, 0], repair=True)[1], q.read([2])[1])\n"},{"lang":"javascript","src":"const q = new QuorumStore(3);\nq.write(\"a\", [0, 1, 2]);\nq.write(\"b\", [0, 1]);\nconsole.log(q.read([1, 2])[1], q.read([2])[1], q.read([2, 0], true)[1], q.read([2])[1]);\n"}]},"o":["b a b b","b a b a","b b b b","a a b b"],"a":0,"e":"Replica 2 missed the write of “b”. Asking replicas 1 and 2 finds “b”; asking replica 2 alone finds the stale “a”. The read that asks 2 and 0 finds “b” and repairs replica 2, so the last read sees “b”."},{"q":"What does this print?","snip":{"t":"Two version vectors","tabs":[{"lang":"python","src":"a, b = {\"eu\": 2, \"us\": 1}, {\"eu\": 1, \"us\": 3}\nle = lambda x, y: all(x.get(k, 0) <= y.get(k, 0) for k in set(x) | set(y))\nprint(\"yes\" if le(a, b) else \"no\", \"yes\" if le(b, a) else \"no\",\n      \"concurrent\" if not le(a, b) and not le(b, a) else \"ordered\")\n"},{"lang":"javascript","src":"const a = { eu: 2, us: 1 }, b = { eu: 1, us: 3 };\nconst le = (x, y) => [...new Set([...Object.keys(x), ...Object.keys(y)])].every(k => (x[k] ?? 0) <= (y[k] ?? 0));\nconsole.log(le(a, b) ? \"yes\" : \"no\", le(b, a) ? \"yes\" : \"no\", !le(a, b) && !le(b, a) ? \"concurrent\" : \"ordered\");\n"}]},"o":["no no concurrent","yes no ordered","no yes ordered","yes yes ordered"],"a":0,"e":"a has more EU writes (2 > 1) and b has more US writes (3 > 1), so neither has seen everything the other has: the versions are concurrent and must be merged."},{"q":"A leader confirms a write and crashes 50 ms later. Replication is asynchronous and the followers lag by 200 ms. A follower is promoted. What happens to the write?","o":["It's lost: the new leader never received it, though the client was told it succeeded","It's safe, because confirmed writes are always durable","The new leader receives it when the old one restarts","It's applied twice"],"a":0,"e":"The followers were 200 ms behind, so none had the write. When the old leader rejoins it becomes a follower of the new leader, and its unreplicated writes are typically discarded rather than merged."},{"q":"Which settings for N = 3 guarantee that a read overlaps the latest successful write? (choose 2)","t":"ms","o":["W = 2, R = 2","W = 3, R = 1","W = 1, R = 1","W = 1, R = 2","W = 2, R = 1"],"a":[0,1],"e":"Overlap needs W + R > N: 2 + 2 and 3 + 1 are 4 > 3. The others total 2 or 3, which isn't more than 3."},{"q":"Judge each statement.","t":"yn","s":[["A replica protects you from an accidental DELETE.",false],["Multi-leader replication needs a strategy for conflicting writes.",true],["With N = 5, W = 3 and R = 3, every read overlaps every write.",true],["Semi-synchronous replication waits for at least one follower before confirming a write.",true]],"e":"The DELETE replicates like any other change, so only backups undo it. Two leaders can change the same item at once. 3 + 3 = 6 > 5. And waiting for one follower is exactly what “semi-synchronous” means."},{"q":"Put the steps of a safe leader failover in order.","t":"ord","items":["Detect that the leader hasn't responded for longer than the timeout","Choose the follower with the most recent data","Give it a new, higher leadership term","Point clients at it, and make storage reject writes from older terms"],"e":"You can only pick a successor after detecting the failure, the term belongs to the chosen follower, and fencing by term needs the new term to exist."},{"q":"Complete the Python check for quorum overlap.","t":"drop","lang":"python","code":"def always_overlaps(n, w, r):\n    return {{0}} > {{1}}\n","blanks":[{"o":["w + r","w * r","max(w, r)","w - r"],"a":0},{"o":["n","n // 2","2 * n","0"],"a":0}],"e":"Two sets of sizes W and R inside N replicas must share a member exactly when W + R > N (the pigeonhole principle)."},{"q":"Match each description to its name.","t":"match","pairs":[["One node takes every write; the others copy its log","Leader-follower"],["Each region's leader accepts writes and syncs with the others","Multi-leader"],["Clients write to W replicas and read from R","Leaderless"],["Stale replicas found during a read are fixed","Read repair"]],"extra":["Sharding"],"e":"Sharding splits data into parts (module 3); it doesn't copy the same data."}],"probs":[["Reading · Amazon's Dynamo paper","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","","read the sections on sloppy quorums, hinted handoff and anti-entropy, and map them to this module"],["Exercise · Consistency levels in a leaderless store","https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html","","find the replication factor and the consistency levels ONE, QUORUM and ALL, and translate each into N, W and R"],["Exercise · Synchronous replication in PostgreSQL","https://www.postgresql.org/docs/current/warm-standby.html","","find streaming replication and synchronous_commit, and say which settings behave like semi-synchronous replication"],["Exercise · Design a failover","https://www.postgresql.org/docs/current/high-availability.html","","sketch how you'd promote a standby safely: detection, choosing the most recent standby, fencing the old leader"]],"src":[["Amazon's Dynamo paper (SOSP 2007)","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"],["PostgreSQL docs: High availability, load balancing and replication","https://www.postgresql.org/docs/current/high-availability.html"],["Apache Cassandra docs: Dynamo","https://cassandra.apache.org/doc/latest/cassandra/architecture/dynamo.html"],["Designing Data-Intensive Applications, 2nd edition (2026)","https://martin.kleppmann.com/2026/03/24/designing-data-intensive-applications-2e.html"]]},{"id":"m03","d":"d1","t":"Partitioning: splitting data across machines","min":105,"hook":"When one machine can't hold the data or take the writes, the data is split into partitions (shards), each owned by a different machine. How you split it decides which queries stay on one machine, whether the load spreads evenly, and how much data moves when you add a machine. Range splits keep order, hash splits spread load, and consistent hashing keeps the moves small.","pre":{"q":"You split 1 billion user records across 10 machines by user_id mod 10. Six months later you add an 11th machine. Roughly what share of the records must move, and what would you do differently from the start?","a":"A record stays only if user_id mod 10 equals user_id mod 11, about 1 in 11 of them, so roughly 90% move (L1 module 4 measured the same effect). Instead, use consistent hashing, so only about 1/11 of the data moves, all of it to the new machine, or create many more partitions than machines from the start (say 1,000) and move whole partitions."},"kid":{"t":"Sharing out the deliveries","x":"Luigi's drivers split the town by street name: Ana takes streets from A to F, Bo from G to M, Cy from N to Z. Finding every order on Abbey Road is easy, but when a huge new estate opens on Mill Lane, Bo is swamped. So Luigi tries a clock face: each address gets a time from a secret rule, and goes to the next driver round the clock. When a fourth driver joins, she only takes the addresses between her and the driver before her. On match day the stadium orders 300 pizzas at one address, so Luigi shares that single address between three drivers.","map":[["Streets A–F, G–M and N–Z","Range partitioning: each machine owns a range of keys"],["All the orders on Abbey Road with one driver","Range scans stay on one partition"],["A huge new estate on Mill Lane swamping Bo","A hot range: skewed data or traffic on one partition"],["Addresses placed round a clock face, each going to the next driver","Consistent hashing: a hash ring"],["The stadium's 300 orders shared by three drivers","Splitting a hot key across several partitions"]],"brk":"Drivers can see who's overloaded and help each other; partitions can't. Real systems must measure the load per partition and move partitions deliberately, because moving data costs bandwidth and time while traffic carries on."},"keys":["**Why partition**: when the data or the write traffic outgrows one machine, split the data into partitions (shards), each owned by one node, usually with replicas (module 2). Each node then holds and serves only its share. The cost: queries that span partitions get harder.","**Range partitioning**: each partition owns a contiguous range of keys (A–F, G–M and so on). Range scans and sorted queries stay on one or a few partitions, but skewed keys, such as all of today's timestamps or one popular prefix, pile onto one partition.","**Hash partitioning**: hash the key and assign partitions by hash, so even similar keys spread evenly. The load spreads well, but a range query must ask every partition, and hash mod N moves almost every key when N changes.","**Consistent hashing**: put nodes on a ring of hash values; a key belongs to the first node clockwise from its own hash. Adding a node moves only the keys between it and the node before it, about 1/N of the data. Virtual nodes, many points per machine, even out the shares.","**Fixed partitions**: create many more partitions than nodes (say 1,000 for 10 nodes) and give whole partitions to nodes. The key-to-partition mapping never changes; adding a node just moves some whole partitions to it.","**Hot keys and skew**: even with a perfect hash, one key can get a huge share of the traffic (a celebrity's posts, a viral product). Cache it, split it into sub-keys (key#0 … key#9) that are merged on read, or give it its own capacity.","**Rebalancing**: moving a partition costs bandwidth and disk while traffic continues. Copy a snapshot, stream the changes until the copy catches up, switch routing, then delete the old copy, a few partitions at a time with throttling. Automatic rebalancing can make an overloaded cluster worse, so many teams require approval.","**Routing and secondary indexes**: something must map a key to its node: the client with a copy of the partition map, a routing tier, or any node that forwards. Secondary indexes are local (each partition indexes its own rows: writes stay local, queries ask every partition) or global (partitioned by the indexed value: queries go to one place, writes touch several)."],"dia":[{"type":"graph","cap":"A hash ring: nodes A to E, keys k1 to k4; each key belongs to the first node clockwise","directed":true,"h":260,"nodes":[["A",50,6],["k1",76,13],["E",88,21],["B",92,30],["k2",76,47],["C",50,53],["k3",24,47],["D",8,30],["k4",24,13]],"edges":[["k1","E"],["k2","C"],["k3","D"],["k4","A"]],"hl":["E"],"hle":[["k1","E"]],"note":"E is the new node. Before it joined, k1 belonged to B; E took only the keys on the arc between A and E, and every other key stayed where it was."},{"type":"flow","cap":"Moving one partition without downtime","steps":[["Snapshot","copy the partition's data to the new node, throttled"],["Catch up","stream the writes made during the copy until it's current"],["Switch","update the routing so requests go to the new node"],["Clean up","delete the old copy once nothing reads it"]],"note":"Throughout, the old owner keeps serving, so users see no gap. Move a few partitions at a time: every copy competes with live traffic."}],"cmp":[{"cap":"Ways to split the data","head":["","Range","Hash mod N","Consistent hashing","Fixed partitions"],"rows":[["Range scans","On one or a few partitions","Ask every partition","Ask every partition","Ask every partition (if hashed)"],["Load spread","Uneven if keys are skewed","Even","Even with virtual nodes","Even if partitions are hashed"],["Adding a node","Split or move ranges","Almost every key moves","About 1/N of the keys move","A few whole partitions move"],["Typical use","Time series, sorted data, wide-column stores","Small, fixed clusters","Caches, Dynamo-style stores","Many databases and search engines"]]},{"cap":"Secondary indexes on partitioned data","head":["","Local index","Global index"],"rows":[["Partitioned by","The same key as the data","The indexed value"],["A write","Updates one partition","May update index entries on other partitions"],["A query by the indexed value","Asks every partition (scatter-gather)","Asks one index partition"],["Freshness","In step with the data","Often updated asynchronously"]]}],"code":[{"t":"A well-mixed string hash and a consistent-hashing ring with virtual nodes","tabs":[{"lang":"python","src":"def ring_hash(key):                             # FNV-1a, then a mixing step so similar strings spread well\n    h = 0x811C9DC5\n    for byte in key.encode():\n        h = ((h ^ byte) * 0x01000193) & 0xFFFFFFFF\n    h ^= h >> 16\n    h = (h * 0x85EBCA6B) & 0xFFFFFFFF\n    h ^= h >> 13\n    h = (h * 0xC2B2AE35) & 0xFFFFFFFF\n    return h ^ (h >> 16)\n\nclass HashRing:\n    \"\"\"Consistent hashing: each node gets `vnodes` points on a ring of 32-bit hash values.\"\"\"\n    def __init__(self, nodes, vnodes=1):\n        self.points = sorted((ring_hash(f\"{n}#{i}\"), n) for n in nodes for i in range(vnodes))\n\n    def index(self, key):                       # the first point at or after the key's hash (wrapping round)\n        h, lo, hi = ring_hash(key), 0, len(self.points)\n        while lo < hi:\n            mid = (lo + hi) // 2\n            if self.points[mid][0] < h:\n                lo = mid + 1\n            else:\n                hi = mid\n        return lo % len(self.points)\n\n    def owner(self, key):\n        return self.points[self.index(key)][1]\n"},{"lang":"javascript","src":"function ringHash(key) {                        // FNV-1a, then a mixing step so similar strings spread well\n  let h = 0x811c9dc5;\n  for (const byte of Buffer.from(key)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;\n  h ^= h >>> 16;\n  h = Math.imul(h, 0x85ebca6b) >>> 0;\n  h ^= h >>> 13;\n  h = Math.imul(h, 0xc2b2ae35) >>> 0;\n  return (h ^ (h >>> 16)) >>> 0;\n}\n\nclass HashRing {\n  // consistent hashing: each node gets `vnodes` points on a ring of 32-bit hash values\n  constructor(nodes, vnodes = 1) {\n    this.points = nodes.flatMap(n => Array.from({ length: vnodes }, (_, i) => [ringHash(`${n}#${i}`), n]))\n      .sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0));\n  }\n  index(key) {                                  // the first point at or after the key's hash (wrapping round)\n    const h = ringHash(key);\n    let lo = 0, hi = this.points.length;\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1;\n      if (this.points[mid][0] < h) lo = mid + 1; else hi = mid;\n    }\n    return lo % this.points.length;\n  }\n  owner(key) { return this.points[this.index(key)][1]; }\n}\n"}]},{"t":"Range or hash: where today's writes and an October scan go","tabs":[{"lang":"python","src":"RANGES = [(\"2026-01\", \"2026-05\"), (\"2026-05\", \"2026-09\"), (\"2026-09\", \"2027-01\")]   # [start, end) per partition\n\ndef by_range(key):\n    return next(i for i, (lo, hi) in enumerate(RANGES) if lo <= key < hi)\n\ndef by_hash(key):\n    return ring_hash(key) % len(RANGES)\n\ntodays = [f\"2026-10-12T{i // 60:02d}:{i % 60:02d}#{i}\" for i in range(1000)]   # 1,000 events written today\nfor name, part in ((\"range\", by_range), (\"hash\", by_hash)):\n    load = [0] * len(RANGES)\n    for key in todays:\n        load[part(key)] += 1\n    scan = sum(1 for lo, hi in RANGES if lo < \"2026-11\" and \"2026-10\" < hi) if name == \"range\" else len(RANGES)\n    print(f\"{name}: today's writes per partition\", *load, f\"| partitions an October scan asks: {scan}\")\n","out":"range: today's writes per partition 0 0 1000 | partitions an October scan asks: 1\nhash: today's writes per partition 334 345 321 | partitions an October scan asks: 3\n","notes":[[1,"Range partitioning by month: each partition owns a span of time."],[14,"A time-range scan touches only the partitions whose ranges overlap it; with hashing it must ask all of them."],[15,"Range partitioning sends every one of today's writes to the newest partition, a hot spot; hashing spreads them evenly."]]},{"lang":"javascript","src":"const RANGES = [[\"2026-01\", \"2026-05\"], [\"2026-05\", \"2026-09\"], [\"2026-09\", \"2027-01\"]];   // [start, end) per partition\n\nconst byRange = key => RANGES.findIndex(([lo, hi]) => lo <= key && key < hi);\nconst byHash = key => ringHash(key) % RANGES.length;\n\nconst todays = Array.from({ length: 1000 }, (_, i) => `2026-10-12T${String(Math.floor(i / 60)).padStart(2, \"0\")}:${String(i % 60).padStart(2, \"0\")}#${i}`);   // 1,000 events written today\nfor (const [name, part] of [[\"range\", byRange], [\"hash\", byHash]]) {\n  const load = new Array(RANGES.length).fill(0);\n  for (const key of todays) load[part(key)]++;\n  const scan = name === \"range\" ? RANGES.filter(([lo, hi]) => lo < \"2026-11\" && \"2026-10\" < hi).length : RANGES.length;\n  console.log(`${name}: today's writes per partition`, ...load, `| partitions an October scan asks: ${scan}`);\n}\n","out":"range: today's writes per partition 0 0 1000 | partitions an October scan asks: 1\nhash: today's writes per partition 334 345 321 | partitions an October scan asks: 3\n","notes":[[1,"Range partitioning by month: each partition owns a span of time."],[10,"A time-range scan touches only the partitions whose ranges overlap it; with hashing it must ask all of them."],[11,"Range partitioning sends every one of today's writes to the newest partition, a hot spot; hashing spreads them evenly."]]}]},{"t":"Consistent hashing: virtual nodes for balance, small moves when a node joins","tabs":[{"lang":"python","src":"keys = [f\"user-{i}\" for i in range(20_000)]\nnodes = [\"node-a\", \"node-b\", \"node-c\", \"node-d\"]\nfor vnodes in (1, 10, 100):\n    ring = HashRing(nodes, vnodes)\n    counts = {n: 0 for n in nodes}\n    for k in keys:\n        counts[ring.owner(k)] += 1\n    print(f\"{vnodes} point(s) per node: the busiest node holds {max(counts.values()) * 100 // len(keys)}% (fair share 25%)\")\n\nbefore, after = HashRing(nodes, 100), HashRing(nodes + [\"node-e\"], 100)\nmoved = [k for k in keys if before.owner(k) != after.owner(k)]\nmod_n = sum(ring_hash(k) % 4 != ring_hash(k) % 5 for k in keys)\nprint(f\"adding node-e moves {len(moved) * 100 // len(keys)}% of keys on the ring\",\n      f\"(all to node-e: {'yes' if all(after.owner(k) == 'node-e' for k in moved) else 'no'}), {mod_n * 100 // len(keys)}% with mod N\")\n","out":"1 point(s) per node: the busiest node holds 41% (fair share 25%)\n10 point(s) per node: the busiest node holds 31% (fair share 25%)\n100 point(s) per node: the busiest node holds 28% (fair share 25%)\nadding node-e moves 19% of keys on the ring (all to node-e: yes), 80% with mod N\n","notes":[[8,"With one point per node the shares are lopsided; with 100 points each, every node is close to its fair 25%."],[11,"A key moves only if node-e's points land between it and its old owner, and then it moves to node-e."],[14,"About a fifth of the keys move, the minimum for going from 4 to 5 nodes, against about 80% with mod N."]]},{"lang":"javascript","src":"const keys = Array.from({ length: 20000 }, (_, i) => `user-${i}`);\nconst nodes = [\"node-a\", \"node-b\", \"node-c\", \"node-d\"];\nfor (const vnodes of [1, 10, 100]) {\n  const ring = new HashRing(nodes, vnodes);\n  const counts = Object.fromEntries(nodes.map(n => [n, 0]));\n  for (const k of keys) counts[ring.owner(k)]++;\n  console.log(`${vnodes} point(s) per node: the busiest node holds ${Math.floor((Math.max(...Object.values(counts)) * 100) / keys.length)}% (fair share 25%)`);\n}\n\nconst before = new HashRing(nodes, 100), after = new HashRing([...nodes, \"node-e\"], 100);\nconst moved = keys.filter(k => before.owner(k) !== after.owner(k));\nconst modN = keys.filter(k => ringHash(k) % 4 !== ringHash(k) % 5).length;\nconsole.log(`adding node-e moves ${Math.floor((moved.length * 100) / keys.length)}% of keys on the ring`,\n  `(all to node-e: ${moved.every(k => after.owner(k) === \"node-e\") ? \"yes\" : \"no\"}), ${Math.floor((modN * 100) / keys.length)}% with mod N`);\n","out":"1 point(s) per node: the busiest node holds 41% (fair share 25%)\n10 point(s) per node: the busiest node holds 31% (fair share 25%)\n100 point(s) per node: the busiest node holds 28% (fair share 25%)\nadding node-e moves 19% of keys on the ring (all to node-e: yes), 80% with mod N\n","notes":[[7,"With one point per node the shares are lopsided; with 100 points each, every node is close to its fair 25%."],[11,"A key moves only if node-e's points land between it and its old owner, and then it moves to node-e."],[13,"About a fifth of the keys move, the minimum for going from 4 to 5 nodes, against about 80% with mod N."]]}]},{"t":"A hot key: one key's traffic, before and after salting","tabs":[{"lang":"python","src":"def busiest_share(keys, partitions=8):\n    counts = [0] * partitions\n    for k in keys:\n        counts[ring_hash(k) % partitions] += 1\n    return max(counts) * 1000 // len(keys) / 10   # percent, one decimal place\n\nrequests = [\"celebrity\" if i % 10 < 3 else f\"user-{i}\" for i in range(10_000)]   # 30% of requests hit one key\nsalted = [f\"celebrity#{i % 10}\" if k == \"celebrity\" else k for i, k in enumerate(requests)]   # 10 sub-keys\nfor name, ks in ((\"one hot key\", requests), (\"salted into 10 sub-keys\", salted)):\n    print(f\"{name}: the busiest partition takes {busiest_share(ks)}% of requests (fair share 12.5%)\")\n","out":"one hot key: the busiest partition takes 38.7% of requests (fair share 12.5%)\nsalted into 10 sub-keys: the busiest partition takes 18.9% of requests (fair share 12.5%)\n","notes":[[7,"However good the hash, every request for one key goes to the same partition."],[8,"Salting spreads the key's writes over 10 sub-keys; reads must now fetch all 10 and merge them."]]},{"lang":"javascript","src":"function busiestShare(keys, partitions = 8) {\n  const counts = new Array(partitions).fill(0);\n  for (const k of keys) counts[ringHash(k) % partitions]++;\n  return (Math.floor((Math.max(...counts) * 1000) / keys.length) / 10).toFixed(1);   // percent, one decimal place\n}\n\nconst requests = Array.from({ length: 10000 }, (_, i) => (i % 10 < 3 ? \"celebrity\" : `user-${i}`));   // 30% of requests hit one key\nconst salted = requests.map((k, i) => (k === \"celebrity\" ? `celebrity#${i % 10}` : k));   // 10 sub-keys\nfor (const [name, ks] of [[\"one hot key\", requests], [\"salted into 10 sub-keys\", salted]]) {\n  console.log(`${name}: the busiest partition takes ${busiestShare(ks)}% of requests (fair share 12.5%)`);\n}\n","out":"one hot key: the busiest partition takes 38.7% of requests (fair share 12.5%)\nsalted into 10 sub-keys: the busiest partition takes 18.9% of requests (fair share 12.5%)\n","notes":[[7,"However good the hash, every request for one key goes to the same partition."],[8,"Salting spreads the key's writes over 10 sub-keys; reads must now fetch all 10 and merge them."]]}]}],"ex":{"q":"A cluster has 1,000 fixed partitions spread over 10 nodes (100 each), 1 GB per partition. You add 2 nodes. Plan the move so that every node ends with 83 or 84 partitions and as few partitions as possible move, then estimate the copy time at a throttled 100 MB/s.","steps":["With fixed partitions a key's partition never changes (hash(key) mod 1,000); only the partition-to-node map does.","1,000 ÷ 12 ≈ 83.3, so four nodes keep 84 and eight hold 83, the two new nodes among them.","Each new node takes 83 partitions from the most loaded old nodes: 166 partitions move (16.6% of the data), the minimum possible, and nothing else changes.","166 GB at 100 MB/s is 1,660 seconds, about 28 minutes, while the old owners keep serving. Planning takes O(moves × nodes) time; the care goes into throttling, catching up and switching."],"code":{"t":"Rebalancing whole partitions onto new nodes","tabs":[{"lang":"python","src":"def rebalance(assignment, new_nodes):\n    \"\"\"assignment: node -> list of partition ids (changed in place). Returns the moves made.\"\"\"\n    nodes = list(assignment) + new_nodes\n    for n in new_nodes:\n        assignment[n] = []\n    total = sum(len(parts) for parts in assignment.values())\n    base, extra = divmod(total, len(nodes))\n    target = {n: base + (1 if i < extra else 0) for i, n in enumerate(nodes)}   # the first `extra` nodes keep one more\n    moves = []\n    for n in new_nodes:\n        while len(assignment[n]) < target[n]:\n            donor = max(nodes, key=lambda m: len(assignment[m]) - target[m])   # the most over-full node\n            part = assignment[donor].pop()\n            assignment[n].append(part)\n            moves.append((part, donor, n))\n    return moves\n\nassignment = {f\"n{i}\": list(range(i * 100, i * 100 + 100)) for i in range(10)}\nmoves = rebalance(assignment, [\"n10\", \"n11\"])\nsizes = sorted({len(p) for p in assignment.values()})\nprint(f\"moved {len(moves)} of 1000 partitions ({len(moves) / 10:.1f}%); nodes now hold {sizes[0]}–{sizes[-1]}\")\nprint(f\"copying {len(moves)} GB at 100 MB/s takes about {(len(moves) * 1000 // 100 + 30) // 60} minutes\")\n","out":"moved 166 of 1000 partitions (16.6%); nodes now hold 83–84\ncopying 166 GB at 100 MB/s takes about 28 minutes\n"},{"lang":"javascript","src":"function rebalance(assignment, newNodes) {\n  // assignment: node -> array of partition ids (changed in place). Returns the moves made\n  const nodes = [...Object.keys(assignment), ...newNodes];\n  for (const n of newNodes) assignment[n] = [];\n  const total = Object.values(assignment).reduce((s, p) => s + p.length, 0);\n  const base = Math.floor(total / nodes.length), extra = total % nodes.length;\n  const target = Object.fromEntries(nodes.map((n, i) => [n, base + (i < extra ? 1 : 0)]));   // the first `extra` nodes keep one more\n  const moves = [];\n  for (const n of newNodes) {\n    while (assignment[n].length < target[n]) {\n      let donor = nodes[0];                   // the most over-full node (the first one on a tie)\n      for (const m of nodes) if (assignment[m].length - target[m] > assignment[donor].length - target[donor]) donor = m;\n      const part = assignment[donor].pop();\n      assignment[n].push(part);\n      moves.push([part, donor, n]);\n    }\n  }\n  return moves;\n}\n\nconst assignment = Object.fromEntries(Array.from({ length: 10 }, (_, i) => [`n${i}`, Array.from({ length: 100 }, (_, j) => i * 100 + j)]));\nconst moves = rebalance(assignment, [\"n10\", \"n11\"]);\nconst sizes = [...new Set(Object.values(assignment).map(p => p.length))].sort((a, b) => a - b);\nconsole.log(`moved ${moves.length} of 1000 partitions (${(moves.length / 10).toFixed(1)}%); nodes now hold ${sizes[0]}–${sizes.at(-1)}`);\nconsole.log(`copying ${moves.length} GB at 100 MB/s takes about ${Math.floor((Math.floor((moves.length * 1000) / 100) + 30) / 60)} minutes`);\n","out":"moved 166 of 1000 partitions (16.6%); nodes now hold 83–84\ncopying 166 GB at 100 MB/s takes about 28 minutes\n"}]},"a":"166 partitions move, 16.6% of the data, and every node ends with 83 or 84. Throttled to 100 MB/s, the copy takes about 28 minutes, with the old owners serving until each partition switches."},"fade":{"q":"Dynamo-style stores keep each key on R different machines: the owner plus the next distinct nodes clockwise on the ring. Finish `preference_list(ring, key, r)` so it walks clockwise from the key's position and returns the first r distinct physical nodes.","steps":["Start at the key's position on the ring (`ring.index(key)`) and walk round, wrapping at the end.",{"ask":"Why skip points that belong to a node already in the list?","a":"With virtual nodes, the next few points often belong to the same machine; two replicas on one machine would defeat the point of replicating."},{"ask":"What happens when a node in the list is down?","a":"Keep walking: the next distinct node holds the data for it (Dynamo calls this a sloppy quorum with hinted handoff) and hands it back when the node returns."},{"ask":"What does it cost?","a":"O(log P) to find the start among P points, then usually only a few steps round the ring, and O(r) memory for the list."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def preference_list(ring, key, r):\n    \"\"\"The first r distinct nodes clockwise from the key's position on `ring` (a HashRing).\"\"\"\n    ...                                       # TODO: walk ring.points from ring.index(key), wrapping, skipping repeats\n"},{"lang":"javascript","src":"function preferenceList(ring, key, r) {\n  // the first r distinct nodes clockwise from the key's position on `ring` (a HashRing)\n  // TODO: walk ring.points from ring.index(key), wrapping, skipping repeats\n}\n"}]},"solution":{"t":"Solution: walk the ring, skipping repeats","tabs":[{"lang":"python","src":"def preference_list(ring, key, r):\n    \"\"\"The first r distinct nodes clockwise from the key's position on `ring` (a HashRing).\"\"\"\n    start, nodes = ring.index(key), []\n    for step in range(len(ring.points)):\n        node = ring.points[(start + step) % len(ring.points)][1]\n        if node not in nodes:                 # the same machine twice would not be a real replica\n            nodes.append(node)\n            if len(nodes) == r:\n                break\n    return nodes\n\nring = HashRing([\"node-a\", \"node-b\", \"node-c\", \"node-d\"], vnodes=10)\nfor key in (\"cart:tara\", \"cart:ben\", \"cart:ana\"):\n    print(key, \"->\", *preference_list(ring, key, 3))\n","out":"cart:tara -> node-b node-c node-d\ncart:ben -> node-c node-d node-a\ncart:ana -> node-b node-c node-d\n"},{"lang":"javascript","src":"function preferenceList(ring, key, r) {\n  // the first r distinct nodes clockwise from the key's position on `ring` (a HashRing)\n  const start = ring.index(key), nodes = [];\n  for (let step = 0; step < ring.points.length && nodes.length < r; step++) {\n    const node = ring.points[(start + step) % ring.points.length][1];\n    if (!nodes.includes(node)) nodes.push(node);   // the same machine twice would not be a real replica\n  }\n  return nodes;\n}\n\nconst ring = new HashRing([\"node-a\", \"node-b\", \"node-c\", \"node-d\"], 10);\nfor (const key of [\"cart:tara\", \"cart:ben\", \"cart:ana\"]) console.log(key, \"->\", ...preferenceList(ring, key, 3));\n","out":"cart:tara -> node-b node-c node-d\ncart:ben -> node-c node-d node-a\ncart:ana -> node-b node-c node-d\n"}]}},"traps":[["“hash(key) mod N is fine for sharding.”","Changing N moves almost every key: about 80% going from 4 nodes to 5, and 90% from 10 to 11. Use consistent hashing or many fixed partitions so that growth moves only a small share."],["“Range partitioning by timestamp spreads the writes.”","All of today's writes land in the newest range, so one partition takes everything. Put a well-spread value (a bucket of the user or device id) before the timestamp, or hash."],["“A good hash removes hot spots.”","A hash spreads different keys, but one key with enormous traffic still lands on one partition. Cache it, salt it into sub-keys, or give it its own capacity."],["“Cross-partition queries are just a bit slower.”","They ask every partition and wait for the slowest, so tail latency grows with the number of partitions, and joins or transactions across partitions need extra machinery. Pick the partition key so that the common queries stay on one partition."],["“Consistent hashing balances the load on its own.”","With one point per node, shares can differ several-fold. Virtual nodes, dozens to hundreds of points per node, bring every node close to its fair share."],["“Rebalance automatically as soon as the load is uneven.”","Moving data costs bandwidth and disk on nodes that are already busy, and an automatic rebalance during an overload or a brief failure can make things worse. Rebalance deliberately, a few partitions at a time, with throttling."]],"disc":[["How would you choose the partition key for a chat app's messages?","The commonest query is “the latest messages in this conversation”, so partition by conversation id and sort by time within it: one partition answers each read, in order. A huge group chat becomes a hot key, so cap group size, split very large conversations into time buckets (conversation#2026-10), or give them their own partitions. If you need per-user inboxes, they're a second table partitioned by user id."],["Range or hash partitioning for an analytics events table?","Analytics mostly scans time ranges, so a range on time looks natural, but then every new event lands on the newest partition. A common compromise is a compound key: hash a well-spread field (the device or user id) into a bucket, then order by time within the bucket. Writes spread across the buckets, and a time-range scan asks every bucket for its slice, in parallel."]],"teach":{"prompt":"Explain to a junior colleague how you'd split a large table across machines, and what consistent hashing buys you.","rubric":["Range partitioning keeps scans local but risks hot ranges; hashing spreads load but scatters scans","hash mod N moves almost everything when N changes","Consistent hashing moves about 1/N of the keys; virtual nodes balance the shares","Fixed partitions as an alternative: move whole partitions","Hot keys need caching or salting; rebalancing needs care"],"model":"I'd start from the queries. If most reads scan ranges, such as a conversation's messages by time, range partitioning keeps them on one partition, but skewed keys like today's timestamps can overload one partition. If the load must spread evenly, I'd hash the key, accepting that range scans then ask every partition. I'd avoid hash mod N, because adding a node moves almost every key. Consistent hashing puts nodes on a ring and gives each key to the next node clockwise, so a new node takes only the keys just before it, about 1/N of the data, and virtual nodes even out the shares. Another option is a fixed set of many partitions, moved whole when nodes join. Either way I'd watch for hot keys, caching or salting them, and rebalance slowly and deliberately."},"qa":[["Range partitioning?","Each partition owns a contiguous range of keys: good for scans, risky for skewed keys."],["Hash partitioning?","Keys go to partitions by hash: the load spreads evenly, but range scans ask every partition."],["What moves when a node joins a consistent-hashing ring?","Only the keys between the new node and the node before it: about 1/N of the data."],["Why virtual nodes?","Many points per machine on the ring even out each machine's share."],["How do you handle a hot key?","Cache it, or salt it into several sub-keys and merge them on read."],["What are fixed partitions?","Many more partitions than nodes, moved whole when nodes join, so a key's partition never changes."]],"quiz":[{"q":"What does this print?","snip":{"t":"Owners on a small ring","tabs":[{"lang":"python","src":"points = [(100, \"A\"), (400, \"B\"), (700, \"C\")]   # positions on a ring of 0–999\nowner = lambda pos: next((n for p, n in points if p >= pos), points[0][1])   # first node clockwise, wrapping\nprint(owner(50), owner(400), owner(650), owner(900))\n"},{"lang":"javascript","src":"const points = [[100, \"A\"], [400, \"B\"], [700, \"C\"]];   // positions on a ring of 0–999\nconst owner = pos => (points.find(([p]) => p >= pos) ?? points[0])[1];   // first node clockwise, wrapping\nconsole.log(owner(50), owner(400), owner(650), owner(900));\n"}]},"o":["A B C A","A C C A","A B C C","B B C A"],"a":0,"e":"50 goes to the first node at or after it (A at 100), 400 sits exactly on B, 650 goes on to C at 700, and 900 is past every node, so it wraps round to A."},{"q":"What does this print?","snip":{"t":"mod 3 to mod 4","tabs":[{"lang":"python","src":"moved = [k for k in range(12) if k % 3 != k % 4]\nprint(len(moved), *moved[:4])\n"},{"lang":"javascript","src":"const moved = [...Array(12).keys()].filter(k => k % 3 !== k % 4);\nconsole.log(moved.length, ...moved.slice(0, 4));\n"}]},"o":["9 3 4 5 6","3 3 6 9","4 3 4 5 6","9 1 2 3 4"],"a":0,"e":"Only 0, 1 and 2 leave the same remainder for 3 and 4, so 9 of the 12 keys move when the cluster grows from 3 nodes to 4: the reason not to shard with mod N."},{"q":"Writes are range-partitioned by timestamp, and all of today's writes hit one node. What's the best fix?","o":["Put a well-spread value first in the key (for example a bucket of the device id), then the timestamp","Add more nodes to the cluster","Switch to monthly ranges","Add an index on the timestamp"],"a":0,"e":"The newest range takes every write however many nodes there are, and bigger ranges make it worse. A spread-out prefix sends today's writes to many partitions while keeping time order within each."},{"q":"Which reduce the data moved when you add nodes? (choose 2)","t":"ms","o":["Consistent hashing","Many fixed partitions assigned to nodes","hash(key) mod N","Recomputing range boundaries from scratch","Rehashing every key with a new hash function"],"a":[0,1],"e":"Consistent hashing moves about 1/N of the keys, and fixed partitions move only whole partitions to the new node. Mod N, recomputed ranges and new hash functions move most of the data."},{"q":"Judge each statement.","t":"yn","s":[["Range partitioning keeps a range scan on few partitions.",true],["A perfect hash function prevents hot keys.",false],["With consistent hashing, adding a node moves keys only to the new node.",true],["A query by something other than the partition key may have to ask every partition.",true]],"e":"Neighbouring keys share a range. One key's traffic still goes to one partition. Only keys on the new node's arcs change owner, and their new owner is the new node. Without a global index, a query by another field must scatter."},{"q":"Put the steps of moving a partition to a new node in order.","t":"ord","items":["Copy a snapshot of the partition to the new node","Stream the writes made during the copy until it has caught up","Switch routing so requests go to the new node","Delete the partition from the old node"],"e":"Catching up needs the snapshot first, switching before the copy is current would lose writes, and the old copy can only go once nothing routes to it."},{"q":"Complete the JavaScript ring lookup (points are sorted by position).","t":"drop","lang":"javascript","code":"function ownerOf(points, pos) {               // points: [position, node], sorted by position\n  for (const [p, node] of points) if ({{0}}) return node;\n  return {{1}};\n}\n","blanks":[{"o":["p >= pos","p <= pos","p > pos + 1","p === pos"],"a":0},{"o":["points[0][1]","points.at(-1)[1]","null","pos"],"a":0}],"e":"The owner is the first point at or after the key's position; a key past the last point wraps round to the first point."},{"q":"Match each description to its name.","t":"match","pairs":[["Each partition owns a contiguous range of keys","Range partitioning"],["A key goes to the first node clockwise on a ring","Consistent hashing"],["Many points per machine on the ring","Virtual nodes"],["One busy key split into key#0 … key#9","Salting a hot key"]],"extra":["Read repair"],"e":"Read repair fixes stale replicas (module 2); it has nothing to do with where keys live."}],"probs":[["Reading · Consistent hashing","https://en.wikipedia.org/wiki/Consistent_hashing","","read how the ring works and why virtual nodes help, then compare with this module's HashRing"],["Exercise · Spread a hot key's writes","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html","","read the write-sharding pattern, then design sub-keys for a celebrity's follower counter and the read that sums them"],["Exercise · Ranges that split themselves","https://docs.cockroachlabs.com/docs/stable/architecture/distribution-layer","","find how ranges split when they grow or get busy, and how a node finds which range holds a key"],["Exercise · Fixed shard counts","https://www.elastic.co/guide/en/elasticsearch/reference/current/scalability.html","","find why the number of primary shards is set when an index is created, and how shards move between nodes"]],"src":[["Wikipedia: Consistent hashing","https://en.wikipedia.org/wiki/Consistent_hashing"],["Amazon's Dynamo paper (SOSP 2007)","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"],["CockroachDB docs: Distribution layer","https://docs.cockroachlabs.com/docs/stable/architecture/distribution-layer"],["Designing Data-Intensive Applications, 2nd edition (2026)","https://martin.kleppmann.com/2026/03/24/designing-data-intensive-applications-2e.html"]]},{"id":"m04","d":"d2","t":"Caching strategies: writes, invalidation and stampedes","min":105,"hook":"At L1 a cache was a fast copy in front of a database. At scale the hard parts are the writes and the edges: how writes reach the cache, how stale copies get removed, and what happens when thousands of requests miss the same key at once. Redis, the most common shared cache, adds data structures that turn the cache into a toolbox for counters, leaderboards, queues and rate limiters.","pre":{"q":"A product's price changes. Your code updates the database and then deletes the cache key. Five minutes later some users still see the old price. How can that happen?","a":"A race: a reader missed the cache and read the old price from the database; then the writer updated the database and deleted the key; and only then did the slow reader store its old value in the cache, where it stays until the TTL runs out. Short TTLs, a second delete a moment later, or only accepting cache writes whose version is newest (leases) prevent it."},"kid":{"t":"Today's specials on the whiteboard","x":"Luigi keeps today's specials on a little whiteboard by the till, copied from his big recipe book. Sometimes he changes the book and the board together. Sometimes, in a rush, he changes only the board and copies it into the book at closing, but one evening the board got wiped first and a change was lost. Sometimes he changes only the book and rubs the special off the board, so the next customer makes him look it up. At opening time fifty customers ask about the special while the board is blank, so Luigi looks it up once and tells them all. Now he rewrites the board a little before it goes out of date.","map":[["Changing the book and the board together","Write-through: update the cache and the database in one operation"],["Changing only the board, copying to the book at closing","Write-back: write to the cache now, flush to the database later, and risk losing it"],["Changing only the book and rubbing the board clean","Write-around with invalidation: writes skip the cache; the next read reloads it"],["Looking it up once for fifty customers","Coalescing misses (single flight) to stop a stampede"],["Rewriting the board a little before it goes out of date","Early refresh: recompute before expiry, at a randomised moment"]],"brk":"Luigi is one person, so nobody can sneak an old special onto the board between his steps. In a real system many servers read and write at once, so an old value can be stored after an invalidation; versions or leases stop that."},"keys":["**Write-through**: every write updates the database and the cache before replying. Reads straight after a write find fresh data; writes are slower, and the cache fills with data that may never be read.","**Write-back (write-behind)**: writes go to the cache and are flushed to the database later, often in batches. Writes are fast and bursts are absorbed, but anything not yet flushed is lost if the cache node dies, and the database lags behind.","**Write-around**: writes go only to the database (and invalidate the cached copy); the cache fills only on reads. Good when new data is rarely read soon; the first read after each write is a miss.","**Invalidation**: TTLs bound staleness; deleting the key after a write keeps it short; versioned keys (product:42:v7) make old entries unreachable without deleting them; change-data-capture can invalidate caches from the database's own log. Prefer deleting cached values to updating them, because concurrent updates can land in the wrong order.","**The stale-set race**: a reader misses and reads the old value; the writer updates the database and deletes the key; then the reader stores its old value, which survives until the TTL ends. Fixes: short TTLs, a second delete a moment later, or versions and leases that reject anything older than the last invalidation.","**Stampede protection**: when a hot key expires, let one request recompute while others wait (single flight), serve the stale value while one refresh runs (stale-while-revalidate), add jitter to TTLs, or refresh early with a probability that rises as expiry approaches (probabilistic early expiration, as in the XFetch algorithm).","**Redis basics**: an in-memory key-value server with data structures (strings, hashes, lists, sets, sorted sets, streams), a TTL per key, and atomic commands such as INCR; scripts and transactions group several steps. Commands are executed one at a time, so each single command is atomic. Persistence and replication exist, but treat a cache as disposable.","**Redis as a toolbox**: INCR with EXPIRE gives counters and simple rate limits, sorted sets give leaderboards and time-ordered feeds, sets track who's online, and SET with NX and a TTL gives a short-lived lock. Each replaces code you'd otherwise write, and each makes Redis more critical: plan its memory, eviction and failover."],"dia":[{"type":"seq","cap":"The stale-set race","actors":["Reader A","Cache","Database","Writer"],"msgs":[["Reader A","Cache","get price"],["Cache","Reader A","miss",true],["Reader A","Database","read price: 10 (A is slow)"],["Writer","Database","update price to 12"],["Writer","Cache","delete price"],["Reader A","Cache","set price = 10: stale until the TTL ends"]],"note":"The delete came before A's late write, so it removed nothing. If the delete leaves a marker with the new version, the cache can reject A's older value."},{"type":"tree","cap":"Choosing a write strategy","root":{"q":"Is new data usually read soon after it's written?","c":[["Yes",{"q":"Can you lose the last few seconds of writes in a crash?","c":[["Yes","Write-back: fast writes, batched flushes (view counts, metrics)"],["No","Write-through: fresh reads, slower writes (profiles, posts)"]]}],["No","Write-around: database only, delete the cached copy (logs, bulk imports)"]]}},{"type":"hub","cap":"Redis data structures and what they're for","core":"Redis","spokes":[["Strings + INCR / EXPIRE","counters, per-minute rate limits"],["Sorted sets","leaderboards, time-ordered feeds"],["Hashes","objects such as sessions"],["Sets","who's online, tags"],["Lists and streams","queues, activity logs"],["SET NX with a TTL","short-lived locks"]]}],"cmp":[{"cap":"Three write strategies","head":["","Write-through","Write-back","Write-around"],"rows":[["A write goes to","The database and the cache","The cache; the database later","The database; the cached copy is deleted"],["A read right after a write","Hit, fresh","Hit, fresh","Miss, then cached"],["Write latency","Database + cache","Cache only","Database only"],["If the cache node dies","Nothing lost","Unflushed writes lost","Nothing lost"],["Good for","Data read soon after writing","Counters, metrics, bursts","Data rarely re-read soon"]]},{"cap":"Defences against stampedes","head":["Technique","How it works","What it costs"],"rows":[["Single flight (or a lock)","One request recomputes; the others wait for its result","Waiting requests are slow; a stuck holder needs a timeout"],["Stale-while-revalidate","Serve the old value while one background refresh runs","Users may see data a little older than the TTL"],["Probabilistic early refresh","Each request may refresh early, more likely near expiry","A few extra recomputes"],["TTL jitter","Spread expiry times randomly","Doesn't help a single very hot key"]]}],"code":[{"t":"The seeded random generator used by the stampede simulation","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Write-through, write-back and write-around side by side","tabs":[{"lang":"python","src":"def run(policy, ops, flush_every=8, crash_at=None):\n    cache, db, dirty = {}, {}, set()\n    hits = reads = db_writes = 0\n    for i, (op, key, value) in enumerate(ops):\n        if i == crash_at:\n            return hits, reads, db_writes, len(dirty)   # write-back: changes never flushed are gone\n        if op == \"write\":\n            if policy == \"write-back\":\n                cache[key] = value\n                dirty.add(key)\n            else:\n                db[key] = value\n                db_writes += 1\n                if policy == \"write-through\":\n                    cache[key] = value\n                else:\n                    cache.pop(key, None)      # write-around: drop the cached copy\n        else:\n            reads += 1\n            hits += key in cache\n            cache.setdefault(key, db.get(key))\n        if policy == \"write-back\" and (i + 1) % flush_every == 0:\n            db_writes += len(dirty)           # one batched flush per changed key\n            db.update({k: cache[k] for k in dirty})\n            dirty.clear()\n    return hits, reads, db_writes, len(dirty)\n\nops = [op for p in range(50) for op in ((\"write\", p, \"draft\"), (\"write\", p, \"final\"), (\"read\", p, None), (\"read\", p, None))]\nfor policy in (\"write-through\", \"write-back\", \"write-around\"):\n    hits, reads, writes, _ = run(policy, ops)\n    lost = run(policy, ops, crash_at=198)[3]\n    print(f\"{policy}: read hits {hits}/{reads}, database writes {writes}, lost in a crash {lost}\")\n","out":"write-through: read hits 100/100, database writes 100, lost in a crash 0\nwrite-back: read hits 100/100, database writes 50, lost in a crash 2\nwrite-around: read hits 50/100, database writes 100, lost in a crash 0\n","notes":[[5,"A crash ends the run: any change still only in the write-back cache never reaches the database."],[17,"Write-around keeps the database correct and simply drops the cached copy, so the next read is a miss."],[23,"Write-back turns a draft and its final version into one database write per flush."],[31,"Same reads, different costs: write-around halves the hits, write-back halves the database writes but can lose recent changes."]]},{"lang":"javascript","src":"function run(policy, ops, flushEvery = 8, crashAt = null) {\n  const cache = new Map(), db = new Map(), dirty = new Set();\n  let hits = 0, reads = 0, dbWrites = 0;\n  for (let i = 0; i < ops.length; i++) {\n    const [op, key, value] = ops[i];\n    if (i === crashAt) return [hits, reads, dbWrites, dirty.size];   // write-back: changes never flushed are gone\n    if (op === \"write\") {\n      if (policy === \"write-back\") { cache.set(key, value); dirty.add(key); }\n      else {\n        db.set(key, value);\n        dbWrites++;\n        if (policy === \"write-through\") cache.set(key, value);\n        else cache.delete(key);               // write-around: drop the cached copy\n      }\n    } else {\n      reads++;\n      if (cache.has(key)) hits++; else cache.set(key, db.get(key));\n    }\n    if (policy === \"write-back\" && (i + 1) % flushEvery === 0) {\n      dbWrites += dirty.size;                 // one batched flush per changed key\n      for (const k of dirty) db.set(k, cache.get(k));\n      dirty.clear();\n    }\n  }\n  return [hits, reads, dbWrites, dirty.size];\n}\n\nconst ops = Array.from({ length: 50 }, (_, p) => [[\"write\", p, \"draft\"], [\"write\", p, \"final\"], [\"read\", p, null], [\"read\", p, null]]).flat();\nfor (const policy of [\"write-through\", \"write-back\", \"write-around\"]) {\n  const [hits, reads, writes] = run(policy, ops);\n  const lost = run(policy, ops, 8, 198)[3];\n  console.log(`${policy}: read hits ${hits}/${reads}, database writes ${writes}, lost in a crash ${lost}`);\n}\n","out":"write-through: read hits 100/100, database writes 100, lost in a crash 0\nwrite-back: read hits 100/100, database writes 50, lost in a crash 2\nwrite-around: read hits 50/100, database writes 100, lost in a crash 0\n","notes":[[6,"A crash ends the run: any change still only in the write-back cache never reaches the database."],[13,"Write-around keeps the database correct and simply drops the cached copy, so the next read is a miss."],[20,"Write-back turns a draft and its final version into one database write per flush."],[31,"Same reads, different costs: write-around halves the hits, write-back halves the database writes but can lose recent changes."]]}]},{"t":"The stale-set race, and a version check that stops it","tabs":[{"lang":"python","src":"db = {\"price\": (1, 10)}                       # key -> (version, value)\n\ndef scenario(guarded):\n    cache = {}\n\n    def cache_set(key, version, value):\n        if guarded and key in cache and cache[key][0] >= version:\n            return                            # an older value arriving late is ignored\n        cache[key] = (version, value)\n\n    def invalidate(key, version):\n        if guarded:\n            cache[key] = (version, None)      # a marker that remembers the newest version\n        else:\n            cache.pop(key, None)\n\n    db[\"price\"] = (1, 10)\n    slow_read = db[\"price\"]                   # reader A misses and reads the old row...\n    db[\"price\"] = (2, 12)                     # ...a writer updates the database\n    invalidate(\"price\", 2)                    # ...and invalidates the cache\n    cache_set(\"price\", *slow_read)            # reader A finally stores what it read: the OLD price\n    hit = cache.get(\"price\")\n    if hit is None or hit[1] is None:         # a miss (or only a marker): read the database\n        hit = db[\"price\"]\n        cache_set(\"price\", *hit)\n    return hit[1]\n\nprint(\"plain delete:\", scenario(False), \"| with versions:\", scenario(True))\n","out":"plain delete: 10 | with versions: 12","notes":[[7,"The guard: a value whose version is not newer than what the cache already knows is dropped."],[13,"Instead of forgetting the key, the invalidation leaves a marker carrying version 2."],[21,"Without the guard, the late write puts the old price back after the delete; with it, the write is rejected."],[28,"The plain delete serves 10 until the TTL ends; the versioned cache reloads and serves 12."]]},{"lang":"javascript","src":"const db = new Map([[\"price\", [1, 10]]]);     // key -> [version, value]\n\nfunction scenario(guarded) {\n  const cache = new Map();\n  const cacheSet = (key, version, value) => {\n    if (guarded && cache.has(key) && cache.get(key)[0] >= version) return;   // an older value arriving late is ignored\n    cache.set(key, [version, value]);\n  };\n  const invalidate = (key, version) => {\n    if (guarded) cache.set(key, [version, null]);   // a marker that remembers the newest version\n    else cache.delete(key);\n  };\n\n  db.set(\"price\", [1, 10]);\n  const slowRead = db.get(\"price\");           // reader A misses and reads the old row...\n  db.set(\"price\", [2, 12]);                   // ...a writer updates the database\n  invalidate(\"price\", 2);                     // ...and invalidates the cache\n  cacheSet(\"price\", ...slowRead);             // reader A finally stores what it read: the OLD price\n  let hit = cache.get(\"price\");\n  if (hit === undefined || hit[1] === null) { // a miss (or only a marker): read the database\n    hit = db.get(\"price\");\n    cacheSet(\"price\", ...hit);\n  }\n  return hit[1];\n}\n\nconsole.log(\"plain delete:\", scenario(false), \"| with versions:\", scenario(true));\n","out":"plain delete: 10 | with versions: 12","notes":[[6,"The guard: a value whose version is not newer than what the cache already knows is dropped."],[10,"Instead of forgetting the key, the invalidation leaves a marker carrying version 2."],[18,"Without the guard, the late write puts the old price back after the delete; with it, the write is rejected."],[27,"The plain delete serves 10 until the TTL ends; the versioned cache reloads and serves 12."]]}]},{"t":"A stampede on a hot key: plain misses, single flight, and early refresh","tabs":[{"lang":"python","src":"def simulate(policy, seconds=300, rate=100, ttl=60, compute=2, window=10, seed=5):\n    rand = mulberry32(seed)\n    expires, ready_at = ttl, None             # the cached value is valid until `expires`; a refresh may finish at `ready_at`\n    recomputes = waited = 0\n    for i in range(seconds * rate):\n        now = i / rate\n        if ready_at is not None and now >= ready_at:\n            expires, ready_at = ready_at + ttl, None    # a refresh finished: fresh again\n        fresh = now < expires\n        if policy == \"early refresh\" and fresh and ready_at is None:\n            if rand() < (now - (expires - window)) / window:   # 0 until the last 10 s, then rising to 1\n                ready_at = now + compute      # refresh in the background; keep serving the old value\n                recomputes += 1\n        if fresh:\n            continue\n        waited += 1                           # a miss: this request has to wait for a value\n        if policy == \"plain misses\" or ready_at is None:\n            recomputes += 1                   # plain: every miss recomputes; otherwise only the first\n            if ready_at is None:\n                ready_at = now + compute\n    return recomputes, waited\n\nfor policy in (\"plain misses\", \"single flight\", \"early refresh\"):\n    recomputes, waited = simulate(policy)\n    print(f\"{policy}: {recomputes} recomputes, {waited} requests waited\")\n","out":"plain misses: 800 recomputes, 800 requests waited\nsingle flight: 4 recomputes, 800 requests waited\nearly refresh: 5 recomputes, 0 requests waited\n","notes":[[11,"Early refresh: in the last 10 seconds before expiry, each request may start a refresh, more likely the closer expiry is."],[18,"Plain misses: every request that finds the key expired recomputes it, hundreds at once."],[25,"Single flight cuts the recomputes to one per expiry but still makes every request in the gap wait; early refresh avoids the gap altogether."]]},{"lang":"javascript","src":"function simulate(policy, seconds = 300, rate = 100, ttl = 60, compute = 2, window = 10, seed = 5) {\n  const rand = mulberry32(seed);\n  let expires = ttl, readyAt = null;          // the cached value is valid until `expires`; a refresh may finish at `readyAt`\n  let recomputes = 0, waited = 0;\n  for (let i = 0; i < seconds * rate; i++) {\n    const now = i / rate;\n    if (readyAt !== null && now >= readyAt) { expires = readyAt + ttl; readyAt = null; }   // a refresh finished: fresh again\n    const fresh = now < expires;\n    if (policy === \"early refresh\" && fresh && readyAt === null) {\n      if (rand() < (now - (expires - window)) / window) {   // 0 until the last 10 s, then rising to 1\n        readyAt = now + compute;              // refresh in the background; keep serving the old value\n        recomputes++;\n      }\n    }\n    if (fresh) continue;\n    waited++;                                 // a miss: this request has to wait for a value\n    if (policy === \"plain misses\" || readyAt === null) {\n      recomputes++;                           // plain: every miss recomputes; otherwise only the first\n      if (readyAt === null) readyAt = now + compute;\n    }\n  }\n  return [recomputes, waited];\n}\n\nfor (const policy of [\"plain misses\", \"single flight\", \"early refresh\"]) {\n  const [recomputes, waited] = simulate(policy);\n  console.log(`${policy}: ${recomputes} recomputes, ${waited} requests waited`);\n}\n","out":"plain misses: 800 recomputes, 800 requests waited\nsingle flight: 4 recomputes, 800 requests waited\nearly refresh: 5 recomputes, 0 requests waited\n","notes":[[10,"Early refresh: in the last 10 seconds before expiry, each request may start a refresh, more likely the closer expiry is."],[18,"Plain misses: every request that finds the key expired recomputes it, hundreds at once."],[27,"Single flight cuts the recomputes to one per expiry but still makes every request in the gap wait; early refresh avoids the gap altogether."]]}]}],"ex":{"q":"Design a game leaderboard that shows the top 3 players and any player's rank while scores change thousands of times a second. Use Redis-style sorted sets: ZADD to set a score, ZREVRANGE for the top, ZREVRANK for a rank, plus INCR and EXPIRE for a per-minute request counter.","steps":["A sorted set keeps members ordered by score: Redis uses a skip list plus a hash table, so ZADD, ZREVRANK and fetching the top k cost O(log n) (plus k), with millions of members in one set.","Each score update is one ZADD (it moves the member if it already exists); the top 3 is ZREVRANGE leaderboard 0 2; a rank is ZREVRANK plus one.","INCR on a key like rate:tara:minute-1 counts requests, and EXPIRE makes the counter vanish after the minute: a simple rate limiter (module 6 does better).","This emulation uses a sorted list, so an update that moves a member costs O(n); Redis's skip list makes it O(log n). For one game a single sorted set is enough; for many games or regions, one set each (partitioned by key)."],"code":{"t":"A tiny Redis emulation: sorted sets and expiring counters","tabs":[{"lang":"python","src":"import bisect\n\nclass MiniRedis:\n    \"\"\"A few Redis commands in memory: INCR and EXPIRE for counters, ZADD / ZREVRANGE / ZREVRANK for sorted sets.\"\"\"\n    def __init__(self):\n        self.data, self.expiry, self.zsets = {}, {}, {}\n\n    def incr(self, key, now):\n        if self.expiry.get(key, now + 1) <= now:  # an expired key reads as missing\n            self.data.pop(key, None)\n            del self.expiry[key]\n        self.data[key] = self.data.get(key, 0) + 1\n        return self.data[key]\n\n    def expire(self, key, seconds, now):\n        self.expiry[key] = now + seconds\n\n    def zadd(self, key, member, score):\n        scores, order = self.zsets.setdefault(key, ({}, []))\n        if member in scores:\n            order.remove((-scores[member], member))   # O(n) here; Redis's skip list makes it O(log n)\n        scores[member] = score\n        bisect.insort(order, (-score, member))    # highest score first\n\n    def zrevrange(self, key, start, stop):\n        return [m for _, m in self.zsets[key][1][start:stop + 1]]\n\n    def zrevrank(self, key, member):\n        scores, order = self.zsets[key]\n        return bisect.bisect_left(order, (-scores[member], member))\n\nr = MiniRedis()\nfor player, score in ((\"tara\", 1200), (\"ben\", 950), (\"ana\", 1500), (\"cy\", 700)):\n    r.zadd(\"leaderboard\", player, score)\nr.zadd(\"leaderboard\", \"ben\", 1600)            # ben's new score moves him up\nprint(\"top 3:\", *r.zrevrange(\"leaderboard\", 0, 2), \"| tara's rank:\", r.zrevrank(\"leaderboard\", \"tara\") + 1)\ncounts = [r.incr(\"rate:tara:minute-1\", now) for now in (0, 10, 20)]\nr.expire(\"rate:tara:minute-1\", 60, 0)\nprint(\"requests this minute:\", counts[-1], \"| after the minute:\", r.incr(\"rate:tara:minute-1\", 61))\n","out":"top 3: ben ana tara | tara's rank: 3\nrequests this minute: 3 | after the minute: 1\n"},{"lang":"javascript","src":"class MiniRedis {\n  // a few Redis commands in memory: INCR and EXPIRE for counters, ZADD / ZREVRANGE / ZREVRANK for sorted sets\n  constructor() { this.data = new Map(); this.expiry = new Map(); this.zsets = new Map(); }\n  incr(key, now) {\n    if (this.expiry.has(key) && this.expiry.get(key) <= now) { this.data.delete(key); this.expiry.delete(key); }   // an expired key reads as missing\n    this.data.set(key, (this.data.get(key) ?? 0) + 1);\n    return this.data.get(key);\n  }\n  expire(key, seconds, now) { this.expiry.set(key, now + seconds); }\n  static before(a, b) { return a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]); }   // order by -score, then name\n  position(order, item) {                     // binary search: the first index not before `item`\n    let lo = 0, hi = order.length;\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1;\n      if (MiniRedis.before(order[mid], item)) lo = mid + 1; else hi = mid;\n    }\n    return lo;\n  }\n  zadd(key, member, score) {\n    if (!this.zsets.has(key)) this.zsets.set(key, [new Map(), []]);\n    const [scores, order] = this.zsets.get(key);\n    if (scores.has(member)) order.splice(this.position(order, [-scores.get(member), member]), 1);   // O(n) here; Redis's skip list makes it O(log n)\n    scores.set(member, score);\n    const item = [-score, member];\n    order.splice(this.position(order, item), 0, item);   // highest score first\n  }\n  zrevrange(key, start, stop) { return this.zsets.get(key)[1].slice(start, stop + 1).map(([, m]) => m); }\n  zrevrank(key, member) {\n    const [scores, order] = this.zsets.get(key);\n    return this.position(order, [-scores.get(member), member]);\n  }\n}\n\nconst r = new MiniRedis();\nfor (const [player, score] of [[\"tara\", 1200], [\"ben\", 950], [\"ana\", 1500], [\"cy\", 700]]) r.zadd(\"leaderboard\", player, score);\nr.zadd(\"leaderboard\", \"ben\", 1600);           // ben's new score moves him up\nconsole.log(\"top 3:\", ...r.zrevrange(\"leaderboard\", 0, 2), \"| tara's rank:\", r.zrevrank(\"leaderboard\", \"tara\") + 1);\nconst counts = [0, 10, 20].map(now => r.incr(\"rate:tara:minute-1\", now));\nr.expire(\"rate:tara:minute-1\", 60, 0);\nconsole.log(\"requests this minute:\", counts.at(-1), \"| after the minute:\", r.incr(\"rate:tara:minute-1\", 61));\n","out":"top 3: ben ana tara | tara's rank: 3\nrequests this minute: 3 | after the minute: 1\n"}]},"a":"After Ben's update the top three are Ben (1,600), Ana (1,500) and Tara (1,200), so Tara is third. The counter reaches 3 within the minute and starts again at 1 once the key has expired."},"fade":{"q":"Finish `get(key, now)` for a stale-while-revalidate cache: return fresh values directly; for values older than the TTL but younger than TTL + `stale_for`, return the stale value and start one background refresh (only one per key at a time); otherwise load the value synchronously. `finish_refresh(key, now)` is called when a background refresh completes.","steps":["Each entry remembers when it was fetched. Fresh: younger than the TTL. Acceptably stale: younger than TTL + stale_for.",{"ask":"What happens to a request that finds an acceptably stale entry?","a":"It gets the stale value at once, and if no refresh is running for that key, it starts one; later requests don't start another."},{"ask":"When must a request wait?","a":"When there's no entry, or it's older than TTL + stale_for: serving it would be too wrong, so the request loads the value itself."},{"ask":"What does it cost, and what's the risk?","a":"O(1) per get and O(keys) memory. Users may see data up to TTL + stale_for old, so set stale_for from what the product can tolerate; in return, hot keys never make users wait for a refresh. HTTP has the same idea: Cache-Control: stale-while-revalidate."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class SWRCache:\n    def __init__(self, loader, ttl, stale_for):\n        self.loader, self.ttl, self.stale_for = loader, ttl, stale_for\n        self.items = {}                       # key -> (value, fetched_at)\n        self.refreshing = set()\n        self.sync_loads = self.background = 0\n\n    def get(self, key, now):\n        ...                                   # TODO: fresh / acceptably stale (start one refresh) / load and wait\n\n    def finish_refresh(self, key, now):       # a background refresh has completed\n        if key in self.refreshing:\n            self.refreshing.discard(key)\n            self.items[key] = (self.loader(key), now)\n"},{"lang":"javascript","src":"class SWRCache {\n  constructor(loader, ttl, staleFor) {\n    this.loader = loader; this.ttl = ttl; this.staleFor = staleFor;\n    this.items = new Map();                   // key -> [value, fetchedAt]\n    this.refreshing = new Set();\n    this.syncLoads = 0; this.background = 0;\n  }\n  get(key, now) {\n    // TODO: fresh / acceptably stale (start one refresh) / load and wait\n  }\n  finishRefresh(key, now) {                   // a background refresh has completed\n    if (this.refreshing.has(key)) { this.refreshing.delete(key); this.items.set(key, [this.loader(key), now]); }\n  }\n}\n"}]},"solution":{"t":"Solution: three ages, three answers","tabs":[{"lang":"python","src":"class SWRCache:\n    def __init__(self, loader, ttl, stale_for):\n        self.loader, self.ttl, self.stale_for = loader, ttl, stale_for\n        self.items = {}                       # key -> (value, fetched_at)\n        self.refreshing = set()\n        self.sync_loads = self.background = 0\n\n    def get(self, key, now):\n        item = self.items.get(key)\n        if item and now < item[1] + self.ttl:\n            return item[0]                    # fresh\n        if item and now < item[1] + self.ttl + self.stale_for:\n            if key not in self.refreshing:\n                self.refreshing.add(key)      # start one background refresh; nobody waits\n                self.background += 1\n            return item[0]                    # stale, but acceptable\n        self.sync_loads += 1                  # missing or too old: this caller waits\n        self.items[key] = (self.loader(key), now)\n        self.refreshing.discard(key)\n        return self.items[key][0]\n\n    def finish_refresh(self, key, now):       # a background refresh has completed\n        if key in self.refreshing:\n            self.refreshing.discard(key)\n            self.items[key] = (self.loader(key), now)\n\nloads = []\ncache = SWRCache(lambda key: loads.append(key) or f\"v{len(loads)}\", ttl=10, stale_for=20)\nseen = [cache.get(\"menu\", t) for t in (0, 5, 12, 13)]\ncache.finish_refresh(\"menu\", 14)\nseen += [cache.get(\"menu\", t) for t in (20, 60)]\nprint(\"values:\", *seen, \"| waited for a load:\", cache.sync_loads, \"| background refreshes:\", cache.background)\n","out":"values: v1 v1 v1 v1 v2 v3 | waited for a load: 2 | background refreshes: 1"},{"lang":"javascript","src":"class SWRCache {\n  constructor(loader, ttl, staleFor) {\n    this.loader = loader; this.ttl = ttl; this.staleFor = staleFor;\n    this.items = new Map();                   // key -> [value, fetchedAt]\n    this.refreshing = new Set();\n    this.syncLoads = 0; this.background = 0;\n  }\n  get(key, now) {\n    const item = this.items.get(key);\n    if (item && now < item[1] + this.ttl) return item[0];   // fresh\n    if (item && now < item[1] + this.ttl + this.staleFor) {\n      if (!this.refreshing.has(key)) { this.refreshing.add(key); this.background++; }   // start one background refresh; nobody waits\n      return item[0];                         // stale, but acceptable\n    }\n    this.syncLoads++;                         // missing or too old: this caller waits\n    this.items.set(key, [this.loader(key), now]);\n    this.refreshing.delete(key);\n    return this.items.get(key)[0];\n  }\n  finishRefresh(key, now) {                   // a background refresh has completed\n    if (this.refreshing.has(key)) { this.refreshing.delete(key); this.items.set(key, [this.loader(key), now]); }\n  }\n}\n\nconst loads = [];\nconst cache = new SWRCache(key => { loads.push(key); return `v${loads.length}`; }, 10, 20);\nconst seen = [0, 5, 12, 13].map(t => cache.get(\"menu\", t));\ncache.finishRefresh(\"menu\", 14);\nseen.push(...[20, 60].map(t => cache.get(\"menu\", t)));\nconsole.log(\"values:\", ...seen, \"| waited for a load:\", cache.syncLoads, \"| background refreshes:\", cache.background);\n","out":"values: v1 v1 v1 v1 v2 v3 | waited for a load: 2 | background refreshes: 1"}]}},"traps":[["“Write-back is just a faster write-through.”","Writes that haven't been flushed exist only in the cache; if that node dies, t
