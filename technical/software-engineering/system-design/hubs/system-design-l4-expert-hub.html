            # von Neumann's method, as in the capacity lab\n\nSTEP_MS, PER_SEQUENCE_MS, PREFILL_MS_PER_TOKEN = 15, 0.25, 0.05\nBLOCK, BLOCKS, MAX_BATCH, SHARED = 16, 2_000, 64, 512\n\ndef run(rate, prefix_cache, count=400, seed=7): ...   # TODO: (p95 first token, p95 per token, tokens/s, preemptions, done)\n"},{"lang":"javascript","src":"function mulberry32(seed) { /* copy the seeded generator from module 6 */ }\nfunction exponential(rand) { /* von Neumann's method, as in the capacity lab */ }\n\nconst STEP_MS = 15, PER_SEQUENCE_MS = 0.25, PREFILL_MS_PER_TOKEN = 0.05;\nconst BLOCK = 16, BLOCKS = 2000, MAX_BATCH = 64, SHARED = 512;\nfunction run(rate, prefixCache, count = 400, seed = 7) { /* TODO: [p95 first token, p95 per token, tokens/s, preemptions, done] */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"An LLM serving simulator: continuous batching, a paged KV cache with preemption, and prefix caching, against SLOs.\"\"\"\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef exponential(rand):                              # von Neumann's method: exact, and needs no logarithms\n    k = 0\n    while True:\n        first = low = rand()\n        n = 1\n        while True:\n            u = rand()\n            if u >= low:\n                break\n            low, n = u, n + 1\n        if n % 2 == 1:\n            return k + first\n        k += 1\n\nSTEP_MS, PER_SEQUENCE_MS, PREFILL_MS_PER_TOKEN = 15, 0.25, 0.05   # an illustrative accelerator\nBLOCK, BLOCKS, MAX_BATCH, SHARED = 16, 2_000, 64, 512   # KV blocks of 16 tokens; a 512-token shared system prompt\n\ndef blocks_for(tokens):\n    return -(-tokens // BLOCK)\n\ndef p95(values):\n    ordered = sorted(values)\n    return ordered[(len(ordered) * 95 + 99) // 100 - 1]\n\ndef run(rate, prefix_cache, count=400, seed=7):    # rate in requests a second; returns the measurements\n    rand = mulberry32(seed)\n    waiting, t = [], 0.0\n    for i in range(count):\n        t += exponential(rand) * 1000 / rate        # random (Poisson) arrivals\n        waiting.append({\"id\": i, \"arrive\": t, \"prompt\": SHARED + 50 + int(rand() * 450),\n                        \"out\": 50 + int(rand() * 350), \"made\": 0})\n    free = BLOCKS - (blocks_for(SHARED) if prefix_cache else 0)   # cached prefix blocks stay resident, shared by all\n    clock, queue, active, done, preemptions = 0.0, [], [], [], 0\n    while waiting or queue or active:\n        while waiting and waiting[0][\"arrive\"] <= clock:\n            queue.append(waiting.pop(0))\n        if not queue and not active:\n            clock = waiting[0][\"arrive\"]            # idle until the next request arrives\n            continue\n        prefill = 0\n        while queue and len(active) < MAX_BATCH:\n            r = queue[0]\n            r[\"own\"] = r[\"prompt\"] - (SHARED if prefix_cache else 0)   # tokens it must prefill and keep itself\n            if blocks_for(r[\"own\"] + r[\"made\"]) + 1 > free:\n                break                               # not enough KV memory: it waits at the head of the queue\n            queue.pop(0)\n            r[\"held\"] = blocks_for(r[\"own\"] + r[\"made\"])\n            free -= r[\"held\"]\n            prefill += r[\"own\"] + r[\"made\"]         # a preempted request recomputes what it had\n            active.append(r)\n        clock += STEP_MS + PER_SEQUENCE_MS * len(active) + PREFILL_MS_PER_TOKEN * prefill\n        gone = set()\n        for r in list(active):\n            if r[\"id\"] in gone:\n                continue                            # preempted earlier in this step\n            r[\"made\"] += 1\n            if r[\"made\"] == 1:\n                r[\"first\"] = clock                  # time to first token ends with the step that prefilled it\n            if blocks_for(r[\"own\"] + r[\"made\"]) > r[\"held\"]:\n                if free == 0:                       # out of KV memory: preempt the newest request\n                    victim = active.pop()\n                    free += victim[\"held\"]\n                    queue.insert(0, victim)\n                    gone.add(victim[\"id\"])\n                    preemptions += 1\n                    if victim is r:\n                        r[\"made\"] -= 1              # this step's token is recomputed later\n                        continue\n                free -= 1\n                r[\"held\"] += 1\n            if r[\"made\"] == r[\"out\"]:\n                active = [x for x in active if x[\"id\"] != r[\"id\"]]\n                free += r[\"held\"]\n                r[\"finish\"] = clock\n                done.append(r)\n    tokens = sum(r[\"out\"] for r in done)\n    ttft = p95([r[\"first\"] - r[\"arrive\"] for r in done])\n    tpot = p95([(r[\"finish\"] - r[\"first\"]) / (r[\"out\"] - 1) for r in done])\n    return ttft, tpot, tokens * 1000 // int(clock), preemptions, len(done)\n\ndef ms(x):\n    return f\"{int(x + 0.5):,} ms\"\n\nTTFT_SLO, TPOT_SLO = 1_000, 60                      # p95 targets: first token within 1 s, then 60 ms a token\nfor cache in (False, True):\n    ttft, tpot, per_second, preempted, finished = run(4, cache)\n    print(f\"prefix caching {'on' if cache else 'off'}, 4 requests a second: first token p95 {ms(ttft)}, \"\n          f\"time per token p95 {ms(tpot)}, {per_second:,} tokens/s, {preempted} preemptions\")\nbest = {}\nfor cache in (False, True):\n    best[cache] = 0\n    for rate in range(2, 21, 2):                    # raise the load until a target is missed\n        ttft, tpot = run(rate, cache)[:2]\n        if ttft > TTFT_SLO or tpot > TPOT_SLO:\n            break\n        best[cache] = rate\nprint(f\"highest rate meeting both p95 targets: {best[False]} requests a second without prefix caching, \"\n      f\"{best[True]} with it\")\n\nassert run(4, True)[4] == 400 and run(4, False)[4] == 400       # every request finishes\nassert best[True] >= best[False] > 0\nprint(\"serving lab OK\")\n","out":"prefix caching off, 4 requests a second: first token p95 840 ms, time per token p95 29 ms, 863 tokens/s, 9 preemptions\nprefix caching on, 4 requests a second: first token p95 69 ms, time per token p95 24 ms, 864 tokens/s, 0 preemptions\nhighest rate meeting both p95 targets: 4 requests a second without prefix caching, 8 with it\nserving lab OK\n"},{"lang":"javascript","src":"// An LLM serving simulator: continuous batching, a paged KV cache with preemption, and prefix caching, against SLOs.\n\nfunction mulberry32(seed) {                            // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction exponential(rand) {                           // von Neumann's method: exact, and needs no logarithms\n  let k = 0;\n  for (;;) {\n    const first = rand();\n    let low = first, n = 1;\n    for (;;) {\n      const u = rand();\n      if (u >= low) break;\n      low = u;\n      n++;\n    }\n    if (n % 2 === 1) return k + first;\n    k++;\n  }\n}\n\nconst STEP_MS = 15, PER_SEQUENCE_MS = 0.25, PREFILL_MS_PER_TOKEN = 0.05;   // an illustrative accelerator\nconst BLOCK = 16, BLOCKS = 2000, MAX_BATCH = 64, SHARED = 512;   // KV blocks of 16 tokens; a 512-token shared system prompt\n\nconst blocksFor = tokens => Math.ceil(tokens / BLOCK);\n\nfunction p95(values) {\n  const ordered = [...values].sort((a, b) => a - b);\n  return ordered[Math.floor((ordered.length * 95 + 99) / 100) - 1];\n}\n\nfunction run(rate, prefixCache, count = 400, seed = 7) {   // rate in requests a second; returns the measurements\n  const rand = mulberry32(seed);\n  const waiting = [];\n  let t = 0;\n  for (let i = 0; i < count; i++) {\n    t += exponential(rand) * 1000 / rate;              // random (Poisson) arrivals\n    waiting.push({ id: i, arrive: t, prompt: SHARED + 50 + Math.floor(rand() * 450), out: 50 + Math.floor(rand() * 350), made: 0 });\n  }\n  let free = BLOCKS - (prefixCache ? blocksFor(SHARED) : 0);   // cached prefix blocks stay resident, shared by all\n  let clock = 0, active = [], preemptions = 0;\n  const queue = [], done = [];\n  while (waiting.length || queue.length || active.length) {\n    while (waiting.length && waiting[0].arrive <= clock) queue.push(waiting.shift());\n    if (!queue.length && !active.length) {\n      clock = waiting[0].arrive;                       // idle until the next request arrives\n      continue;\n    }\n    let prefill = 0;\n    while (queue.length && active.length < MAX_BATCH) {\n      const r = queue[0];\n      r.own = r.prompt - (prefixCache ? SHARED : 0);   // tokens it must prefill and keep itself\n      if (blocksFor(r.own + r.made) + 1 > free) break; // not enough KV memory: it waits at the head of the queue\n      queue.shift();\n      r.held = blocksFor(r.own + r.made);\n      free -= r.held;\n      prefill += r.own + r.made;                       // a preempted request recomputes what it had\n      active.push(r);\n    }\n    clock += STEP_MS + PER_SEQUENCE_MS * active.length + PREFILL_MS_PER_TOKEN * prefill;\n    const gone = new Set();\n    for (const r of [...active]) {\n      if (gone.has(r.id)) continue;                    // preempted earlier in this step\n      r.made++;\n      if (r.made === 1) r.first = clock;               // time to first token ends with the step that prefilled it\n      if (blocksFor(r.own + r.made) > r.held) {\n        if (free === 0) {                              // out of KV memory: preempt the newest request\n          const victim = active.pop();\n          free += victim.held;\n          queue.unshift(victim);\n          gone.add(victim.id);\n          preemptions++;\n          if (victim === r) {\n            r.made--;                                  // this step's token is recomputed later\n            continue;\n          }\n        }\n        free--;\n        r.held++;\n      }\n      if (r.made === r.out) {\n        active = active.filter(x => x.id !== r.id);\n        free += r.held;\n        r.finish = clock;\n        done.push(r);\n      }\n    }\n  }\n  const tokens = done.reduce((sum, r) => sum + r.out, 0);\n  const ttft = p95(done.map(r => r.first - r.arrive));\n  const tpot = p95(done.map(r => (r.finish - r.first) / (r.out - 1)));\n  return [ttft, tpot, Math.floor(tokens * 1000 / Math.floor(clock)), preemptions, done.length];\n}\n\nconst ms = x => `${Math.floor(x + 0.5).toLocaleString(\"en-US\")} ms`;\n\nconst TTFT_SLO = 1000, TPOT_SLO = 60;                  // p95 targets: first token within 1 s, then 60 ms a token\nfor (const cache of [false, true]) {\n  const [ttft, tpot, perSecond, preempted] = run(4, cache);\n  console.log(`prefix caching ${cache ? \"on\" : \"off\"}, 4 requests a second: first token p95 ${ms(ttft)}, ` +\n              `time per token p95 ${ms(tpot)}, ${perSecond.toLocaleString(\"en-US\")} tokens/s, ${preempted} preemptions`);\n}\nconst best = new Map();\nfor (const cache of [false, true]) {\n  best.set(cache, 0);\n  for (let rate = 2; rate <= 20; rate += 2) {          // raise the load until a target is missed\n    const [ttft, tpot] = run(rate, cache);\n    if (ttft > TTFT_SLO || tpot > TPOT_SLO) break;\n    best.set(cache, rate);\n  }\n}\nconsole.log(`highest rate meeting both p95 targets: ${best.get(false)} requests a second without prefix caching, ` +\n            `${best.get(true)} with it`);\n\nif (run(4, true)[4] !== 400 || run(4, false)[4] !== 400) throw new Error(\"every request must finish\");\nif (!(best.get(true) >= best.get(false) && best.get(false) > 0)) throw new Error(\"prefix caching should not hurt\");\nconsole.log(\"serving lab OK\");\n","out":"prefix caching off, 4 requests a second: first token p95 840 ms, time per token p95 29 ms, 863 tokens/s, 9 preemptions\nprefix caching on, 4 requests a second: first token p95 69 ms, time per token p95 24 ms, 864 tokens/s, 0 preemptions\nhighest rate meeting both p95 targets: 4 requests a second without prefix caching, 8 with it\nserving lab OK\n"}]},"breakit":["Switch to static batching (admit only when the batch is empty) and compare throughput and time to first token at 4 requests a second.","Reserve each request's maximum length up front instead of allocating blocks as it grows, and count how many fit.","Halve BLOCKS and watch the preemptions climb: what happens to the p95 time per token, and why?"]},{"id":"capstone","capstone":true,"t":"An architecture review pack for a real system","min":1800,"mods":["m01","m02","m03","m04","m05","m06"],"goal":"Review a system you know well, such as one from work, an open-source project, or your own anomaly-detection or data platform project, the way a principal engineer would for an architecture review board. Write down its context and drivers, run a well-architected review, model its capacity and cost, decide its most important open questions as ADRs, plan its next big change as an incremental migration, propose the team structure that would support it, and review any AI components. Then present the pack to someone else and answer their questions.","deliver":["Context and drivers (one page): what the system does, who depends on it, its constraints and its quality attributes, ranked with the stakeholders, plus a C4-style context and container diagram.","A well-architected review: each pillar's questions answered honestly, the high- and medium-risk issues, and an improvement plan ordered by risk removed per day of effort, with owners and dates.","Five ADRs in the repository's format, for the system's most consequential open decisions, each with drivers, at least three options, a weighted matrix where it helps, the sensitivity point, consequences, and the fitness function or metric that will show whether it's working.","A capacity and cost model: today's peak and a twelve-month forecast with growth and known events, capacity per instance from a load test plan with an open (arrival-rate) model, headroom for a zone loss, a monthly cost with the commitment level justified, and the unit cost per request or per customer.","A migration roadmap for the biggest change the system needs: strangler fig or expand-and-contract steps, the data migration with dual writes, backfill and verification, rollback at each step, and the success metrics that move it on.","A socio-technical view: today's teams and their interactions, where changes cross team boundaries, and a target team structure using Team Topologies' types and interaction modes.","If the system has AI components: serving, cost and latency targets, retrieval and permissions, guardrails for any actions, and the evaluation set. If it doesn't, a one-page proposal for where AI would help and what it would need."],"rubric":["Every recommendation traces back to a stated driver, a risk or a number; nothing rests on fashion or preference.","The ADRs record real alternatives and their trade-offs, including the sensitivity point and what would make you revisit the decision.","The capacity and cost model states its assumptions, survives a zone loss, and would be checked by a load test that measures from intended send times.","Every migration step has a way back except the last one, which is explicitly the one-way door, with verification before it.","The pack was presented to someone else, their questions and challenges are recorded, and the pack was revised in response."],"steps":["Pick the system and the audience; agree the scope and the decision-makers; collect diagrams, metrics, incident history and costs.","Write the context and drivers, and run the well-architected review with someone who knows the system.","Build the capacity and cost model from real metrics and prices, and write the load test plan.","Draft the five ADRs and the migration roadmap; review them with an engineer from the team that owns the system.","Add the team view and the AI review, assemble the pack, present it, record the questions, and revise."],"stretch":["Run the load test for real against a staging copy, and compare the measured capacity per instance with your model.","Turn two of the ADRs' fitness functions into automated checks in the system's pipeline.","Price the design at ten times today's traffic and identify which part breaks first, technically and financially.","Run a second review of someone else's system with the same template, and compare what each review found."]}],"interview":[{"c":"Decisions and reviews","q":"How do you make, and record, a significant architecture decision?","a":"I start by agreeing the decision drivers with the stakeholders, the quality attributes that matter and how much each counts, before anyone argues for a technology. Then I write at least three options, including doing nothing, score them against the drivers, and look for the sensitivity points where a small change in a weight would flip the answer; those are where the real disagreement is. How reversible the decision is sets how much evidence I want first. I record it as an ADR in the repository: context, options, decision, consequences, and what would make us revisit it.","f":["What would you do if the team's favourite option loses the matrix?","How do you stop ADRs from becoming bureaucracy?"]},{"c":"Decisions and reviews","q":"How do you decide how quickly to make a decision?","a":"By how expensive it is to undo. One-way doors, such as a primary database, a public API contract or a data model shared by many teams, deserve slow, careful decisions: written options, a spike or prototype, and a review. Two-way doors, such as a library choice inside one service or a feature-flagged experiment, should be made quickly by the people closest to them, because being slow costs more than being occasionally wrong. Many big decisions can be turned into two-way doors by adding a seam, an abstraction or an expand-and-contract path.","f":["Give an example of turning a one-way door into a two-way door.","Who should make two-way-door decisions?"]},{"c":"Decisions and reviews","q":"How do you run an architecture review of another team's design?","a":"As a conversation about risk rather than an exam. I ask for the context and drivers first, then walk the design through the scenarios that matter: peak load, a zone or region failure, a bad deploy, a security incident, ten times the data. I look for single points of failure, unclear ownership, missing numbers and one-way doors taken lightly. The output is a short list of risks with suggested mitigations, agreed with the team, plus any decisions that need ADRs, and a follow-up date. The team owns the design; the review makes its risks visible.","f":["What do you do if the team disagrees with a high-risk finding?","How do you scale reviews across 50 teams?"]},{"c":"Well-architected and reliability","q":"How do you decide how much reliability to buy?","a":"From the cost of downtime. I estimate what a minute of unavailability costs the business, in lost revenue, penalties and trust, and compare designs by total cost: infrastructure plus expected downtime cost. A single zone might be right for an internal tool, three zones for most customer-facing services, and active-active regions only where downtime costs thousands a minute. Then I set the availability target and error budget from that, rather than defaulting to as many nines as possible.","f":["How do you estimate downtime cost for a service with no direct revenue?","What does an error budget change in practice?"]},{"c":"Capacity and cost","q":"How do you plan capacity for next year?","a":"I forecast the peak hour forward: organic growth from the trend, plus inorganic events such as launches, campaigns and seasonal peaks, far enough ahead to cover the lead time for getting capacity. I convert demand into instances using a load test that measures requests per second within the latency target, because CPU percentages don't scale linearly and the first bottleneck may be the database or a quota. I add headroom for the latency target and for losing a zone, check quotas and lead times, and compare actual demand with the forecast every month.","f":["What if the forecast is badly wrong in month two?","Which parts of a system can't scale on demand, and how do you plan for them?"]},{"c":"Capacity and cost","q":"Why does latency rise so sharply as a service approaches full utilisation?","a":"Because requests arrive randomly, so queues form whenever arrivals bunch up, and the closer the servers are to busy all the time, the longer those queues take to drain. For a single server with random arrivals the mean time in the system is the service time divided by one minus the utilisation: twice the service time at 50%, ten times at 90%, and the tail grows faster still. Pooling servers behind one queue helps, and so does reducing variability, but latency-sensitive services still keep headroom.","f":["What does Little's law tell you about a thread pool?","Why can adding nodes stop increasing throughput?"]},{"c":"Capacity and cost","q":"How do you design a load test you can trust?","a":"I decide the question first: average load, stress above the expected peak, a soak over hours, a spike, or a breakpoint search. I use an open model, a fixed arrival rate, so that the test keeps sending when the system slows, and measure latency from the intended send time; otherwise coordinated omission hides the stalls. I use production-like data and request mixes, test the whole path including databases and third parties or realistic stand-ins, watch every resource to find the first bottleneck, and check the tool by pausing the system mid-test.","f":["How would you load-test a service that calls a partner with a strict rate limit?","What's the difference between a stress test and a breakpoint test?"]},{"c":"Capacity and cost","q":"The CFO asks you to cut the cloud bill by 20% without hurting reliability. What do you do?","a":"First make the spending visible: allocate every cost to a team and service with tags and accounts, and track unit costs such as cost per order, so growth that isn't explained by the business stands out. Then go after waste: idle and oversized resources rightsized from p95 utilisation, non-production environments off outside working hours, storage moved to cheaper tiers, and data transfer reduced. Commit to the steady baseline for the discount, keep peaks on demand, and put interruptible work on spot. Budgets and anomaly alerts per team keep it from creeping back.","f":["Showback or chargeback: which would you start with?","How do you stop teams from rightsizing into an outage?"]},{"c":"Evolution and migration","q":"How would you replace a legacy monolith that the business depends on?","a":"Incrementally, with the strangler fig pattern. I'd agree the outcomes first, find the seams, and put a routing layer such as a gateway in front of the monolith. Then I'd rebuild one capability at a time, starting with one that's valuable but small, move its traffic across in slices with a way back, and give the new service its own data through change data capture and then dual writes, verified before switching. The monolith keeps shipping throughout, each step delivers value, and team ownership moves with the boundaries.","f":["How do you pick the first capability to move?","What do you do about the shared database?"]},{"c":"Evolution and migration","q":"How do you migrate data to a new store without downtime?","a":"In reversible steps. Turn on dual writes so every change reaches both stores, then backfill existing records in throttled, resumable batches, writing conditionally by version so the backfill never overwrites newer data. Verify with counts, checksums by range and sampled comparisons, and repair differences, because dual writes can fail halfway. Then move reads, comparing old and new results in a parallel run, then move writes so the new store is the source of truth, and only after a quiet period remove the old data. Each step is checked before the next.","f":["What's the failure mode of dual writes, and what are the alternatives?","How would you migrate a table with billions of rows?"]},{"c":"Evolution and migration","q":"How do you change an API or event schema without breaking clients?","a":"Additive changes first: new optional fields, new endpoints or event types. Removing, renaming or changing the type or meaning of a field is breaking, so I'd do it by expand and contract: add the new field, migrate the clients, and remove the old one only when measurements show nobody uses it. For events, a schema registry enforces a compatibility mode, backward or full, so incompatible schemas are rejected at publish time. Breaking changes get a new major version run alongside the old one, with deprecation dates announced and enforced.","f":["Backward or forward compatibility: which would you choose for events, and why?","How do you find clients who haven't migrated?"]},{"c":"Socio-technical design","q":"What does Conway's law mean for an architect?","a":"That the system will end up mirroring how the teams communicate, whether I plan for it or not. If teams are organised by layer, every feature crosses several teams and the architecture fills with hand-offs. So I design boundaries and teams together: mostly stream-aligned teams that own a business area end to end, a platform team offering self-service, enabling teams for new skills, and specialists only for genuinely hard parts, each team within its cognitive load. Reshaping teams to get the architecture I want is the inverse Conway maneuver, and it only works if the code boundaries move with the teams.","f":["How would you tell that team and system boundaries have drifted apart?","What's a reasonable size for a team, and why?"]},{"c":"Socio-technical design","q":"How do you set up a platform team that speeds others up instead of becoming a bottleneck?","a":"Run it as a product. The users are the stream-aligned teams, so I'd start by measuring their biggest sources of toil and build the thinnest viable platform that removes the top one, sometimes just documentation and templates. Capabilities are self-service, with golden paths rather than tickets, optional and composable, and secure by default. Early on the platform team collaborates closely with a few adopters, then moves to X-as-a-Service. I'd measure adoption, time for a new service to reach production and developer satisfaction, and treat a growing ticket queue as a product failure.","f":["Should using the platform be mandatory?","How do you decide what the platform should not do?"]},{"c":"AI systems design","q":"How would you design LLM serving for a feature with tight latency and cost targets?","a":"I'd set targets for time to first token and time per output token, and measure the request mix. On the serving side, continuous batching keeps the accelerators busy, paged KV-cache allocation fits more requests in memory, and prompt caching removes the prefill for shared prefixes. On the request side, I'd route simple requests to a smaller model, escalating when a check fails, keep prompts short with retrieval, cap output lengths, and stream tokens. Then I'd load-test with an open model to find the highest rate that meets both targets, and add capacity, or degrade gracefully, before it.","f":["What limits concurrency on an LLM server?","How would you choose the threshold for escalating to the large model?"]},{"c":"AI systems design","q":"How would you design retrieval-augmented generation over millions of documents with permissions?","a":"An ingestion pipeline with connectors per source that parses, chunks and embeds documents incrementally, so edits and deletions arrive within an agreed time, with each chunk carrying its document's access list. At query time, hybrid search, keyword plus vectors fused with reciprocal rank fusion, filtered by the user's identity inside the index, then reranking, so restricted text never reaches the model, and answers cite their sources. I'd evaluate retrieval recall and answer groundedness separately on a labelled set, and monitor freshness, cost and latency.","f":["How do you handle a document whose permissions change?","Why combine keyword and vector search?"]},{"c":"AI systems design","q":"How do you make an agent that takes real actions safe?","a":"By putting the rules outside the model. Tools are allow-listed with narrow scopes and per-user credentials; irreversible or high-value actions need a person's approval; and once the agent has read untrusted content, such as an email or a web page, any action that writes or sends data needs approval too, because injected text could be steering it. Every run has budgets for steps, tokens and money, runs in a sandbox where possible, and leaves a full trace. Before it acts for real, it runs in shadow mode against an evaluation set.","f":["What is the lethal trifecta?","Why isn't a better system prompt enough?"]}],"cheat":[{"t":"Decisions, reviews and reliability","items":["ADR: title, status (proposed, accepted, superseded), context, decision, consequences · numbered, in the repo, append-only · MADR adds drivers and options","Decision matrix: weights agreed first · sensitivity point = the smallest weight change that flips the winner · one-way doors slow, two-way doors fast","ATAM-lite: quality attribute scenarios → risks, sensitivity points, trade-off points · output: risks and decisions, not a grade","Well-architected: AWS six pillars (operational excellence, security, reliability, performance efficiency, cost optimization, sustainability) · Azure five · review → HRIs and MRIs → improvement plan → milestone","How much reliability: infrastructure cost + expected downtime × cost per minute · guardrails: preventive, detective, exemptions with expiry"]},{"t":"Capacity, cost and migration","items":["Capacity plan: organic forecast beyond the lead time + inorganic events + load tests that turn servers into service capacity · plan the peak hour · zone-safe: n zones → each carries 1/(n − 1)","Little's law L = λW · M/M/1: W = S ÷ (1 − ρ) · Erlang C for c servers · pooling beats separate queues · USL: X(N) = γN ÷ (1 + α(N − 1) + βN(N − 1)), peak at √((1 − α) ÷ β)","Load tests: smoke, average-load, stress, soak, spike, breakpoint · open model (arrival rate) · measure from the intended send time · whole path","Paying: commitments for the baseline (pay off when needed more than price ÷ on-demand price of hours) · on-demand for peaks · spot for interruptible work · unit costs · FinOps: Inform, Optimize, Operate","Migrations: strangler fig (route one capability at a time) · branch by abstraction · expand → migrate → contract · dual write → backfill (conditional, resumable) → verify → move reads → move writes → remove · parallel run returns the old result","Compatibility: adding is safe; rename = delete + add · protobuf: never reuse field numbers · registry modes: backward (consumers first), forward (producers first), full"]},{"t":"Teams and AI systems","items":["Conway's law: systems copy communication structures · inverse Conway maneuver: shape teams for the architecture you want, and move the code with them","Team Topologies: stream-aligned, platform, enabling, complicated-subsystem · interactions: collaboration (temporary), X-as-a-Service, facilitating · cognitive load caps what a team owns","Platform as a product: self-service, golden paths, optional and composable, thinnest viable platform, adoption earned and measured","LLM serving: prefill → time to first token; decode → time per token · continuous batching · KV cache = 2 × layers × KV heads × head size × bytes per token · paged blocks · prefix caching","Routing: small model first, escalate when a check fails · RAG: hybrid search + RRF (1 ÷ (60 + rank)) + rerank + permission filter inside retrieval · evaluate retrieval and answers separately","Agents: workflows before agents · policy layer outside the model: allow-list, approvals, budgets, traces · lethal trifecta: private data + untrusted content + a way out"]}],"glossary":[["ADR (architecture decision record)","A short, numbered document recording one significant decision: its context, the decision, its status and its consequences."],["Amdahl's law","The limit on speed-up from parallelism set by the part of the work that can't be parallelised; the USL without coherency costs."],["ATAM","The Architecture Tradeoff Analysis Method: walking a design through quality-attribute scenarios to find risks, sensitivity points and trade-off points."],["Backfill","Copying existing records into a new store or shape, in batches, while the system keeps running."],["Branch by abstraction","Replacing a component inside a codebase by putting an abstraction in front of it, building the new implementation behind it and switching callers over."],["Change data capture (CDC)","Reading a database's change log to stream its inserts, updates and deletes to other systems."],["Chargeback","Billing each team for the cloud costs it causes; showback reports them without billing."],["Cognitive load","The amount a team must understand to own its work; Team Topologies treats it as a limit on what a team should own."],["Commitment discount","A lower price for capacity committed for one or three years (savings plans, reservations, committed-use discounts), paid whether used or not."],["Continuous batching","Scheduling LLM inference per decode step, so requests join and leave a running batch; also called iteration-level scheduling."],["Conway's law","Melvin Conway's observation that organisations design systems copying their own communication structures."],["Coordinated omission","A measurement flaw where the load generator waits for slow replies and so under-samples the slow periods."],["Decision driver","A quality attribute or constraint that a decision must satisfy, weighted with the stakeholders."],["Dual write","Writing every change to both the old and the new store during a migration; not atomic across stores, so it needs verification."],["Enabling team","A team that helps other teams adopt new skills and practices for a while, then moves on."],["Erlang C","The formula for the probability of waiting, and the mean wait, in a queue with several servers and random arrivals."],["Expand and contract","Changing an interface or schema by supporting old and new, migrating every client, then removing the old; also called parallel change."],["FinOps","The practice of managing cloud spending, with engineers owning their costs, in three phases: Inform, Optimize and Operate."],["Fitness function","An automated check or metric that shows whether an architectural characteristic still holds."],["Grouped-query attention","Sharing key and value heads among several query heads, shrinking the KV cache."],["Guardrail","An automated policy that prevents or detects risky changes, such as public storage or untagged resources."],["HRI (high-risk issue)","A finding in a well-architected review that could significantly hurt the business."],["Hybrid search","Combining keyword and vector retrieval, often with reciprocal rank fusion and a reranker."],["Inverse Conway maneuver","Shaping team structure deliberately so the organisation produces the architecture you want."],["KV cache","The keys and values an LLM keeps for every token of every active request, so it doesn't recompute them at each step."],["Lethal trifecta","An agent combining access to private data, exposure to untrusted content, and a way to send data out."],["Little's law","L = λW: the average number in a system equals the arrival rate times the average time each spends there."],["Model cascade","Trying a cheaper model first and escalating to a stronger one when a confidence check or validator fails."],["One-way door","A decision that is expensive or impossible to reverse, and deserves a slower, more careful process."],["Open model","A load test that sends requests at a fixed arrival rate, whatever the replies are doing."],["PagedAttention","vLLM's technique of storing the KV cache in small fixed-size blocks allocated on demand, like virtual memory pages."],["Parallel run","Executing old and new code paths side by side, returning the old result and reporting mismatches."],["Platform team","A team providing internal products, as self-service, that let stream-aligned teams deliver faster."],["Prefill","The phase of LLM inference that processes the whole prompt, which sets the time to first token."],["Prefix caching","Reusing the KV cache of a prompt prefix seen recently, such as fixed instructions, to skip its prefill."],["Prompt injection","Text in a model's input, often from an untrusted source, that tries to override its instructions."],["Reciprocal rank fusion (RRF)","Combining rankings by summing 1 ÷ (k + rank) for each document, with k = 60 in the original paper."],["Schema registry","A service that stores event schemas and rejects new versions that break the configured compatibility mode."],["Sensitivity point","A parameter, such as a decision weight or a cache setting, where a small change has a large effect on the outcome."],["Strangler fig","Replacing a legacy system gradually by routing one capability at a time to a new system and retiring the old code."],["Stream-aligned team","A team that owns a flow of change for one part of the business, end to end."],["Thinnest viable platform","The smallest platform, sometimes only documentation and templates, that speeds up stream-aligned teams."],["Time to first token (TTFT)","How long an LLM request waits before its first output token: queueing plus prefill."],["Two-way door","A decision that is cheap to reverse, and should be made quickly by the people closest to it."],["Universal Scalability Law (USL)","Neil Gunther's model of throughput with contention and coherency costs, which predicts a peak beyond which more nodes reduce throughput."],["X-as-a-Service","A Team Topologies interaction mode where one team consumes what another provides through a clear interface, with little coordination."]],"aiCtx":"The learner is at System Design level L4 Expert: architecture decision-making (architecture decision records, ATAM-style trade-off analysis, reversible and irreversible decisions), well-architected frameworks (the AWS and Azure pillars: reliability, security, cost, operations, performance and sustainability), capacity and cost (capacity planning, queueing, load testing at scale, FinOps), evolution and migration (the strangler fig pattern, data migrations, expand and contract, backwards compatibility), socio-technical design (Conway's law, Team Topologies, platform teams, cognitive load) and AI systems design (LLM serving, batching and caching, RAG at scale, agent platforms and their guardrails). They have finished System Design L1 to L3 and code in Python 3.12+ and JavaScript (Node.js 22). Use concrete numbers and small models, name the trade-off behind every decision, and say when a number is a rule of thumb. Never invent product limits or prices; if unsure, say so.","storyWorld":"Pizza Town and the family road trip","kidMapHead":"In a real organisation","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the model before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps in order.","**Code drop-downs**: complete Python or JavaScript. Each was checked so only one combination works.","**Matching**: map techniques to the problems they solve."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to pick the right approach for a scenario. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is an organisation with real numbers and real constraints. Read the scenario tabs, then choose the decision and justify it.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Frameworks, books, official documentation and well-known free references, all checked on 12 Oct 2026.","sourcesTab":"Resources","freshStyle":"in the style of an architecture review (a short scenario with numbers and constraints, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Networking and latency, scaling, availability, load balancing, caching, CDNs, storage, APIs, estimation","x":"done first"},{"k":"L2 Proficient","t":"Design common products (feed, chat, rate limiter) with sound trade-offs","x":"done"},{"k":"L3 Specialist","t":"Distributed, data-intensive systems: payments, streaming, search, geo","x":"done"},{"k":"L4 Expert","t":"Architecture leadership: decisions, reviews, capacity and cost, organisation-level design","x":"this hub","cur":true}],"ladderTitle":"Your system design ladder","ladderNote":"Each level is its own hub","deck":"system-design-l4","examinerRole":"principal engineer chairing an architecture review board","aiCheck":"Written by Claude for this hub. Check surprising claims against the linked frameworks, books and official documentation, and run the code yourself."};

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";

let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {

if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */

}

/* ===== items: Microsoft-style question types =====

function prepItem(it) {

  if (b.k === "lab") { const l = (H.labs || []).find(x => x.id === b.ref); return { label: (l && l.capstone ? "Capstone: " : "Lab: ") + (l ? l.t : b.ref), min: l ? l.min : 60, done: !!S.labs[b.ref], kind: l && l.capstone ? "Capstone" : "Lab" }; }
  if (b.k === "mock") { const mk = (H.mocks || []).find(x => x.id === b.ref); return { label: `Mock ${b.ref} (timed) + review`, min: (mk ? mk.min : 100) + 40, done: MOCKS.some(x => x.set === b.ref), kind: "Mock" }; }
  if (b.k === "case") { const c = CASE[b.ref]; return { label: "Case study: " + (c ? c.title : b.ref), min: c ? c.min : 30, done: !!S.cases[b.ref], kind: "Case" }; }

}
function planBlocks() { const out = []; (H.plan || []).forEach(ph => ph.blocks.forEach(b => out.push(Object.assign({ phase: ph.t }, b, blockInfo(b))))); return out; }
function nextBlock() { return planBlocks().find(b => !b.done) || null; }

   <div id="misTable"></div></div>
  <div class="panel" style="margin-top:14px"><h3>Accuracy by domain (all quizzes and drills)</h3><div class="dbars">${DOM.map(d => { const a = domainAccuracy(d.id); const n = S.dstat[d.id] ? S.dstat[d.id][1] : 0; return `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${a == null ? 0 : Math.round(a * 100)}%;background:${a == null ? "var(--line)" : a >= 0.7 ? "var(--good)" : "var(--bad)"}"></i></div><b>${a == null ? "–" : Math.round(a * 100) + "%"}</b></div><div class="muted small" style="margin:-4px 0 2px">${n} answered</div>`; }).join("")}</div></div>`;

  const misTable = () => {
    const ids = Object.keys(S.mis).filter(k => ITEMS[k] && (showFixed || !S.mis[k].fx)).sort((a, b) => (S.mis[a].at < S.mis[b].at ? 1 : -1));
    $("#misTable").innerHTML = ids.length ? `<div class="tbl"><table><thead><tr><th>Where</th><th>Question</th><th class="num">Missed</th><th>Last</th><th>Status</th></tr></thead><tbody>${ids.map(k => { const it = ITEMS[k], x = S.mis[k]; return `<tr><td>${esc(it.src || "")}</td><td>${inl(it.q.length > 160 ? it.q.slice(0, 157) + "…" : it.q)}</td><td class="num">${x.n}</td><td>${esc(fmtDate(x.at))}</td><td>${x.fx ? `<span class="pill ok">fixed ${esc(fmtDate(x.fx))}</span>` : `<span class="pill no">open</span>`}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">No mistakes recorded yet. They appear when you miss a question anywhere in the hub.</p>`;

};

let CASERUN = null;
RENDER.cases = function () {
  CASERUN = null;
  const v = $("#v-cases");
  v.innerHTML = `<div class="eyebrow">Long scenarios · several questions each</div><h2 class="h-view">Case studies</h2>
  <p class="lede">${inl(H.casesIntro || "Read the scenario tabs first, then answer. Requirements and constraints decide every answer, so keep the scenario open next to the questions. In the real exam each case study is its own section: once you leave it, you can't go back.")}</p>
  <div class="grid2">${(H.cases || []).filter(c => !c.mockOnly).map(c => { const s = S.cases[c.id]; return `<div class="panel"><div class="row between"><h3>${esc(c.title)}</h3>${s && s.pct != null ? `<span class="pill ${s.pct >= 70 ? "ok" : "no"}">${s.pct}%</span>` : ""}</div><p class="small muted" style="margin:.2em 0 .6em">${esc(c.org || "")} · ${c.items.length} questions · about ${c.min} min</p><p class="small">${inl(c.blurb || "")}</p><button type="button" class="btn primary" data-case="${c.id}">${s ? "Retake" : "Start"} case study</button></div>`; }).join("")}</div>`;
  $$("[data-case]", v).forEach(b => b.addEventListener("click", () => openCase(b.dataset.case)));

function caseDoc(c, tab) {
  return `<div class="case-tabs" role="tablist">${c.sections.map((s, i) => `<button type="button" data-ct="${i}" aria-pressed="${i === tab}">${esc(s[0])}</button>`).join("")}</div><div class="scenario">${(() => { const s = c.sections[tab]; return Array.isArray(s[1]) ? `<ul>${s[1].map(x => `<li>${inl(x)}</li>`).join("")}</ul>` : paras(s[1]); })()}</div>`;
}
function openCase(id) {
  const c = CASE[id]; if (!c) return;
  if (CURVIEW !== "cases") show("cases");
  const vs = c.items.map(prepItem);
  CASERUN = { c, vs, R: vs.map(() => null), tab: 0, done: false };
  const v = $("#v-cases");
  const paint = () => {
    const X = CASERUN;
    v.innerHTML = `<div class="row between" style="margin-bottom:10px"><div><div class="eyebrow">Case study · ${esc(c.org || "")}</div><h2 class="h-view" style="margin:0">${esc(c.title)}</h2></div><button type="button" class="btn small" id="caseBack">← All case studies</button></div>
    <div class="case-shell"><aside class="panel case-doc" aria-label="Scenario">${caseDoc(c, X.tab)}</aside><div style="min-width:0">
    ${X.vs.map((vv, i) => `<div class="q" data-k="${i}">${X.done ? reviewHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }) : itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) })}</div>`).join("")}
    ${X.done ? `<div class="panel"><b>Score: ${S.cases[c.id].pct}%</b> <span class="muted small">Missed items are in your mistake list.</span><div class="row" style="margin-top:8px"><button type="button" class="btn" id="caseAgain">Retake</button></div></div>` : `<button type="button" class="btn primary" id="caseSubmit">Submit case study</button>`}</div></div>`;
    const bindTabs = () => $$("[data-ct]", v).forEach(b => b.addEventListener("click", () => { X.tab = +b.dataset.ct; $(".case-doc", v).innerHTML = caseDoc(c, X.tab); bindTabs(); }));
    bindTabs();
    $("#caseBack").addEventListener("click", () => RENDER.cases());
    if (!X.done) {
      X.vs.forEach((vv, i) => { const el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); });
      $("#caseSubmit").addEventListener("click", e => {
        const un = X.vs.filter((vv, i) => !isAnswered(vv, X.R[i])).length;
        if (un && !e.currentTarget.dataset.sure) { e.currentTarget.dataset.sure = "1"; e.currentTarget.textContent = `Submit with ${un} unanswered?`; return; }
        let got = 0; X.vs.forEach((vv, i) => { const sc = gradeItem(vv.it, X.R[i]); got += sc; recordAnswer(vv.it, sc, givenText(vv.it, X.R[i])); });
        S.cases[c.id] = { at: today(), pct: pct(got, X.vs.length) }; touch("main"); X.done = true; paint(); window.scrollTo(0, 0);
      });
    } else { $("#caseAgain").addEventListener("click", () => openCase(id)); bindExplain(v); }
  };
  const rebind = i => { const X = CASERUN, vv = X.vs[i], el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); };
  paint(); window.scrollTo(0, 0);
}

   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
