n        out.append(length - most)\n    return out\n\nprint(*min_operations_queries(7, [[0, 1, 1], [1, 2, 1], [2, 3, 1], [3, 4, 2], [4, 5, 2], [5, 6, 2]], [[0, 3], [3, 6], [2, 6], [0, 6]]))\nprint(*min_operations_queries(8, [[1, 2, 6], [1, 3, 4], [2, 4, 6], [2, 5, 3], [3, 6, 6], [3, 0, 8], [7, 0, 2]], [[4, 6], [0, 4], [6, 5], [7, 4]]))\n","out":"0 0 1 3\n1 2 2 3\n"},{"lang":"javascript","src":"function minOperationsQueries(n, edges, queries) {\n  const t = new Tree(n, edges.map(([u, v]) => [u, v]));\n  const weight = new Map();\n  for (const [u, v, w] of edges) { weight.set(u * n + v, w); weight.set(v * n + u, w); }\n  const cnt = Array.from({ length: n }, () => new Array(27).fill(0));   // cnt[v][w]: edges of weight w from the root to v\n  const order = [...Array(n).keys()].sort((x, y) => t.tin[x] - t.tin[y]);   // preorder: parents before children\n  for (const v of order) {\n    if (v === 0) continue;\n    const p = t.up[0][v];\n    cnt[v] = [...cnt[p]];\n    cnt[v][weight.get(p * n + v)]++;\n  }\n  return queries.map(([a, b]) => {\n    const c = t.lca(a, b);\n    const length = t.depth[a] + t.depth[b] - 2 * t.depth[c];\n    let most = 0;\n    for (let w = 1; w <= 26; w++) most = Math.max(most, cnt[a][w] + cnt[b][w] - 2 * cnt[c][w]);\n    return length - most;\n  });\n}\n\nconsole.log(...minOperationsQueries(7, [[0, 1, 1], [1, 2, 1], [2, 3, 1], [3, 4, 2], [4, 5, 2], [5, 6, 2]], [[0, 3], [3, 6], [2, 6], [0, 6]]));\nconsole.log(...minOperationsQueries(8, [[1, 2, 6], [1, 3, 4], [2, 4, 6], [2, 5, 3], [3, 6, 6], [3, 0, 8], [7, 0, 2]], [[4, 6], [0, 4], [6, 5], [7, 4]]));\n","out":"0 0 1 3\n1 2 2 3\n"}]},"a":"0 0 1 3, then 1 2 2 3. In the first tree, 0 → 3 uses three weight-1 edges and 3 → 6 three weight-2 edges, so nothing changes; 2 → 6 has one 1 and three 2s (change 1), and 0 → 6 has three of each (change 3)."},"fade":{"q":"Design a class for a tree of n nodes given as a parent array (parent[0] = −1 for the root) that answers “the k-th ancestor of node, or −1” quickly, for up to 5 × 10⁴ queries. (LeetCode 1483, Kth Ancestor of a Tree Node)","steps":["Store every node's 2^j-th ancestor for each j. Level 0 is the parent array, and −1 means “no such ancestor”.",{"ask":"How do you build level j from level j − 1?","a":"Two jumps of 2^(j−1): up[j][v] = up[j − 1][up[j − 1][v]], keeping −1 when the first jump already left the tree. Check for −1 before indexing: in Python, up[j − 1][−1] would quietly read the last node."},{"ask":"How does a query use the table?","a":"Write k in binary and make one jump per 1 bit, lowest bit first; stop with −1 as soon as you fall off the root, or straight away if k needs more levels than the table has."},{"ask":"Time and space?","a":"O(n log n) to build and store the table, then O(log k) per query: at most 16 jumps for n ≤ 5 × 10⁴, since 2¹⁶ > 5 × 10⁴."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class TreeAncestor:\n    def __init__(self, n, parent):                # parent[0] == -1\n        self.up = [parent[:]]                     # up[j][v]: v's 2^j-th ancestor, or -1\n        for j in range(1, max(1, n.bit_length())):\n            ...                                   # TODO: build level j from level j - 1\n\n    def get_kth_ancestor(self, node, k):\n        ...                                       # TODO: one jump per 1 bit of k\n"},{"lang":"javascript","src":"class TreeAncestor {\n  constructor(n, parent) {                        // parent[0] === -1\n    this.up = [[...parent]];                      // up[j][v]: v's 2^j-th ancestor, or -1\n    for (let j = 1; j < Math.max(1, 32 - Math.clz32(n)); j++) {\n      // TODO: build level j from level j - 1\n    }\n  }\n  getKthAncestor(node, k) {\n    // TODO: one jump per 1 bit of k\n  }\n}\n"}]},"solution":{"t":"Solution: the table with −1 for “off the tree”","tabs":[{"lang":"python","src":"class TreeAncestor:\n    def __init__(self, n, parent):                # parent[0] == -1\n        self.up = [parent[:]]                     # up[j][v]: v's 2^j-th ancestor, or -1\n        for j in range(1, max(1, n.bit_length())):\n            prev = self.up[-1]\n            self.up.append([-1 if prev[v] == -1 else prev[prev[v]] for v in range(n)])\n\n    def get_kth_ancestor(self, node, k):\n        if k >= 1 << len(self.up):                # more ancestors than any node has\n            return -1\n        j = 0\n        while k and node != -1:\n            if k & 1:\n                node = self.up[j][node]\n            k >>= 1\n            j += 1\n        return node\n\nta = TreeAncestor(7, [-1, 0, 0, 1, 1, 2, 2])\nprint(ta.get_kth_ancestor(3, 1), ta.get_kth_ancestor(5, 2), ta.get_kth_ancestor(6, 3))\n","out":"1 0 -1"},{"lang":"javascript","src":"class TreeAncestor {\n  constructor(n, parent) {                        // parent[0] === -1\n    this.up = [[...parent]];                      // up[j][v]: v's 2^j-th ancestor, or -1\n    for (let j = 1; j < Math.max(1, 32 - Math.clz32(n)); j++) {\n      const prev = this.up[j - 1];\n      this.up.push(prev.map(p => (p === -1 ? -1 : prev[p])));\n    }\n  }\n  getKthAncestor(node, k) {\n    if (k >= 2 ** this.up.length) return -1;      // more ancestors than any node has\n    for (let j = 0; k > 0 && node !== -1; j++, k >>= 1) if (k & 1) node = this.up[j][node];\n    return node;\n  }\n}\n\nconst ta = new TreeAncestor(7, [-1, 0, 0, 1, 1, 2, 2]);\nconsole.log(ta.getKthAncestor(3, 1), ta.getKthAncestor(5, 2), ta.getKthAncestor(6, 3));\n","out":"1 0 -1"}]}},"traps":[["“Recursion is fine for the depths and the Euler tour.”","A path-shaped tree of 2 × 10⁵ vertices is 2 × 10⁵ calls deep, far past Python's limit and risky in Node.js. Use an explicit stack, as the prelude does, or BFS order."],["“⌊log₂ n⌋ levels are always enough.”","Depths reach n − 1, and k = n − 1 needs bit ⌊log₂(n − 1)⌋. For n = 9, ⌊log₂ 9⌋ = 3 levels can't make a jump of 8. Use the bit length of n − 1 (and at least 1)."],["“In the LCA loop, jump while the two ancestors are equal.”","Equal ancestors only mean the jump reached some common ancestor, maybe far above the lowest one. Jump only while they differ; then the LCA is one parent step above either vertex."],["“dist(a, b) = depth[a] + depth[b] − depth[LCA].”","Both depths include the path from the root to the LCA, so subtract it twice: depth[a] + depth[b] − 2 · depth[LCA]."],["“A subtree isn't a range, so subtree sums need a walk of the subtree.”","In preorder every subtree is the contiguous block [tin[v], tout[v]), so any range structure applies: O(log n) per update or query."],["“Marking the root's parent as −1 is safe in the jump table.”","Then a careless up[j − 1][−1] in Python reads the last vertex without any error. Point the root at itself, as the prelude does, or test for −1 before every jump, as the faded example does."]],"disc":[["Why does the LCA loop work?","After lifting, a and b are at the same depth, and their ancestors at any given height are equal at or above the LCA and different below it. Going from the biggest jump down and taking a jump only when the ancestors differ is a binary search for the highest pair of different ancestors, and their common parent is the LCA."],["What other ways are there to answer LCA queries?","An Euler tour that records a vertex each time the search passes it (2n − 1 entries) turns LCA into a range minimum over depths, which a sparse table answers in O(1) after O(n log n) preparation (module 6). Tarjan's offline algorithm answers all queries together with union–find in near-linear time. And heavy–light decomposition splits paths into O(log n) ranges, which supports path updates as well."]],"teach":{"prompt":"Explain to a junior colleague how binary lifting finds the k-th ancestor and the lowest common ancestor, and how an Euler tour turns subtree questions into range questions.","rubric":["up[j][v] is the 2^j-th ancestor, built from the level below in O(n log n)","k-th ancestor: one jump per 1 bit of k","LCA: match the depths, jump both while the ancestors differ, then one parent step","dist = depth[a] + depth[b] − 2 · depth[LCA]","Euler tour: a subtree is the range [tin, tout), so Fenwick and segment trees apply"],"model":"Binary lifting stores, for every vertex, its parent, its grandparent, its 4th ancestor and so on: up[j][v] is the 2^j-th ancestor, and each level is two jumps of the level below, so the whole table takes O(n log n). To go up k steps, I write k in binary and make one jump per 1 bit, which is O(log k). For the lowest common ancestor I first lift the deeper vertex to the same depth; if they meet, that's the answer. Otherwise I try jumps from the biggest down and take one only when it lands the two vertices on different ancestors, and at the end the LCA is the parent of either. With depths, the distance is depth[a] + depth[b] − 2 · depth[LCA]. For subtree questions I number vertices in DFS preorder: each subtree becomes one contiguous range [tin, tout), so a Fenwick tree gives subtree sums with point updates in O(log n). Everything is iterative, because a tree can be a path 10⁵ deep."},"qa":[["What does up[j][v] store, and how is it built?","v's 2^j-th ancestor: up[j][v] = up[j − 1][up[j − 1][v]]."],["How do you find the k-th ancestor with binary lifting?","Jump 2^j for every 1 bit j of k: O(log k)."],["How do you get the distance between two tree nodes?","depth[a] + depth[b] − 2 · depth[LCA(a, b)]."],["What does a subtree look like in an Euler tour?","The contiguous range [tin[v], tout[v])."],["What do binary lifting's preparation and queries cost?","O(n log n) time and memory to build; O(log n) per query."],["How do you get root-to-v path sums with point updates?","Add val[v] over [tin[v], tout[v]) in a Fenwick tree; the path sum is the value at tin[v]."]],"quiz":[{"q":"What does this print? (`Tree` is this module's helper, built on the tree in the diagram.)","snip":{"t":"Ancestors, LCAs and a distance","tabs":[{"lang":"python","src":"t = Tree(10, [(0, 1), (0, 2), (1, 3), (1, 4), (2, 5), (4, 6), (4, 7), (5, 8), (5, 9)])\nprint(t.kth_ancestor(8, 2), t.lca(6, 7), t.lca(3, 9), t.dist(6, 9))\n"},{"lang":"javascript","src":"const t = new Tree(10, [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [4, 6], [4, 7], [5, 8], [5, 9]]);\nconsole.log(t.kthAncestor(8, 2), t.lca(6, 7), t.lca(3, 9), t.dist(6, 9));\n"}]},"o":["2 4 0 6","5 4 0 6","2 1 0 5","2 4 1 6"],"a":0,"e":"8's parent is 5 and its grandparent 2. 6 and 7 are both children of 4. 3 and 9 sit in different subtrees of the root, so their LCA is 0, and dist(6, 9) = 3 + 3 − 2 × 0 = 6."},{"q":"What does this print?","snip":{"t":"Reading the Euler tour","tabs":[{"lang":"python","src":"t = Tree(10, [(0, 1), (0, 2), (1, 3), (1, 4), (2, 5), (4, 6), (4, 7), (5, 8), (5, 9)])\nyn = lambda b: \"yes\" if b else \"no\"\nprint(t.tin[4], t.tout[4], yn(t.is_ancestor(1, 7)), yn(t.is_ancestor(2, 7)))\n"},{"lang":"javascript","src":"const t = new Tree(10, [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [4, 6], [4, 7], [5, 8], [5, 9]]);\nconst yn = b => (b ? \"yes\" : \"no\");\nconsole.log(t.tin[4], t.tout[4], yn(t.isAncestor(1, 7)), yn(t.isAncestor(2, 7)));\n"}]},"o":["3 6 yes no","3 5 yes no","4 6 yes yes","3 6 no no"],"a":0,"e":"The preorder is 0, 1, 3, 4, 6, 7, 2, 5, 8, 9, so 4 is at position 3 and its subtree {4, 6, 7} fills positions 3, 4 and 5: tout[4] = 6. 7's position 5 lies inside 1's range [1, 6) but not inside 2's range [6, 10)."},{"q":"How much memory does a binary lifting table need for a tree with n vertices?","o":["O(n log n)","O(n)","O(n²)","O(log n)"],"a":0,"e":"There are about log₂ n levels, each with one entry per vertex. O(n) is only the parent array, and O(n²) would be a full ancestor matrix."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["In an Euler tour (preorder), every subtree is a contiguous range of positions","After O(n log n) preparation, binary lifting answers each LCA query in O(log n)","Binary lifting only works on binary trees","The LCA of a and b is always a or b","dist(a, b) = depth[a] + depth[b] − depth[LCA(a, b)]"],"a":[0,1],"e":"Preorder makes each subtree one block, and binary lifting is O(n log n) to build and O(log n) per query. The “binary” is about jump sizes, not the tree; the LCA is a or b only when one is an ancestor of the other; and the depth of the LCA must be subtracted twice."},{"q":"Judge each statement.","t":"yn","s":[["up[j][v] = up[j − 1][up[j − 1][v]].",true],["To find the k-th ancestor, make one jump for each 1 bit of k.",true],["In the LCA loop, jump both vertices whenever their 2^j-th ancestors are equal.",false],["With an Euler tour, a Fenwick tree can change one vertex and sum a whole subtree in O(log n) each.",true]],"e":"A 2^j jump is two 2^(j−1) jumps. The bits of k say which powers of two add up to k. Equal ancestors may be far above the LCA, so you jump only while they differ. And a subtree is a range in the tour, which suits a Fenwick tree."},{"q":"Put the steps for answering LCA queries in order.","t":"ord","items":["Find every vertex's parent and depth with one search from the root","Build up[j] for j = 1, 2, … from the level below","For a query, lift the deeper vertex to the other's depth","Jump both up, biggest jumps first, while their ancestors differ, then take one parent step"],"e":"The table needs the parents, the lifting needs the table, and the final jumps need both vertices at the same depth."},{"q":"Complete the Python LCA function (`up` and `depth` come from this module's `Tree`).","t":"drop","lang":"python","code":"def lca(up, depth, a, b):\n    if depth[a] < depth[b]:\n        a, b = b, a\n    diff = depth[a] - depth[b]\n    for j in range(len(up)):\n        if diff >> j & 1:\n            a = {{0}}\n    if a == b:\n        return a\n    for j in range(len(up) - 1, -1, -1):\n        if {{1}}:\n            a, b = up[j][a], up[j][b]\n    return {{2}}\n","blanks":[{"o":["up[j][a]","up[j][b]","up[0][a]","up[diff][a]"],"a":0},{"o":["up[j][a] != up[j][b]","up[j][a] == up[j][b]","depth[a] != depth[b]","a != b"],"a":0},{"o":["up[0][a]","a","b","up[len(up) - 1][a]"],"a":0}],"e":"Lifting uses a's own jumps, one per 1 bit of the depth difference. Both vertices jump only while their ancestors differ, so they stop just below the LCA, which is then a's parent."},{"q":"Match each question to the technique that answers it.","t":"match","pairs":[["The k-th boss of an employee, for many queries","Binary lifting: one jump per 1 bit of k"],["The distance between two tree nodes, for many queries","depth[a] + depth[b] − 2 · depth[LCA]"],["The total in a subtree, with point updates","An Euler tour plus a Fenwick tree"],["The heaviest edge on a tree path","Binary lifting with a maximum stored per jump"]],"extra":["Dijkstra from every node"],"e":"Ancestors are jumps, distances come from depths and the LCA, subtrees become ranges in the tour, and a path maximum rides along with the jumps. Dijkstra from every node would be far slower and isn't needed in a tree."}],"probs":[["LC 1483 · Kth Ancestor of a Tree Node","https://leetcode.com/problems/kth-ancestor-of-a-tree-node/","Hard","the faded example: a jump table with −1 for “off the tree”"],["LC 2846 · Minimum Edge Weight Equilibrium Queries in a Tree","https://leetcode.com/problems/minimum-edge-weight-equilibrium-queries-in-a-tree/","Hard","the worked example: per-weight counts from the root, combined at the LCA"],["CSES 1687 · Company Queries I","https://cses.fi/problemset/task/1687","","the k-th boss: binary lifting, −1 if the chain is too short"],["CSES 1688 · Company Queries II","https://cses.fi/problemset/task/1688","","the lowest common boss: LCA by binary lifting"],["CSES 1135 · Distance Queries","https://cses.fi/problemset/task/1135","","depth[a] + depth[b] − 2 · depth[LCA]"],["CSES 1137 · Subtree Queries","https://cses.fi/problemset/task/1137","","Euler tour + Fenwick tree (code block 2); sums need 64-bit integers, fine in Python and below 2⁵³ in JavaScript"],["CSES 1138 · Path Queries","https://cses.fi/problemset/task/1138","","root-to-node sums: add each value over its subtree range (code block 2)"],["CSES 1139 · Distinct Colors","https://cses.fi/problemset/task/1139","","flatten with the Euler tour, then count distinct values per range offline (module 6), or merge small sets into large ones"],["CSES 1750 · Planets Queries I","https://cses.fi/problemset/task/1750","","one successor per planet: the same jump table answers “where after k steps?” in O(log k)"]],"src":[["cp-algorithms: Lowest common ancestor with binary lifting","https://cp-algorithms.com/graph/lca_binary_lifting.html"],["cp-algorithms: Lowest common ancestor via an Euler tour and range minimum","https://cp-algorithms.com/graph/lca.html"],["USACO Guide: Euler tour technique","https://usaco.guide/gold/tree-euler"],["USACO Guide: Binary jumping","https://usaco.guide/plat/binary-jump"],["CSES Problem Set (tree algorithms section)","https://cses.fi/problemset/"]]},{"id":"m05","d":"d2","t":"Suffix arrays and the LCP array","min":115,"hook":"Genome search tools, full-text indexes and compressors (the Burrows–Wheeler transform behind bzip2) all start by sorting every suffix of a text. A suffix array does that, and with its LCP array one structure answers “how many distinct substrings?”, “what's the longest repeat?”, “where does this pattern occur?” and “what do these two texts have in common?”.","pre":{"q":"Write down every suffix of “banana” (banana, anana, nana, ana, na, a) and sort them alphabetically. Which two neighbours in the sorted list share the longest start, and what does that shared start tell you about the word?","a":"“ana” and “anana” share “ana”, the longest start shared by any two neighbours. A substring that occurs twice is a shared start of two suffixes, and the longest such start always turns up between neighbours, so “ana” is the longest repeated substring."},"kid":{"t":"Tara's word-tail cards","x":"Tara writes “banana” on a strip and cuts off one letter at a time from the front, keeping every tail: banana, anana, nana, ana, na and a. Then she sorts the cards like a dictionary. Now cards that start the same way sit next to each other, so Ben only compares neighbours: “ana” and “anana” share three letters, so “ana” must appear in the word twice. To find a word in the pile, they open it in the middle and keep halving it, just like looking something up in a dictionary.","map":[["The tail cards of “banana”","The suffixes s[i:], one for each start position i"],["Sorting the cards like a dictionary","The suffix array: the start positions in sorted order"],["Letters shared by neighbouring cards","The LCP array: the longest common prefix of sorted neighbours"],["“ana” and “anana” share three letters","A repeated substring is a common prefix of two suffixes"],["Halving the pile to find a word","Binary search over the suffix array: O(m log n) for a pattern of length m"]],"brk":"Tara sorts six short cards letter by letter, but a text of 10⁵ letters has 10⁵ suffixes averaging 5 × 10⁴ letters, so comparing whole suffixes is far too slow. The algorithms below sort by ranks of doubling prefix lengths, comparing two numbers instead of two strings."},"keys":["**Suffix array**: sa lists the start positions of all n suffixes in sorted order. Every substring is a prefix of some suffix, so substring questions become questions about neighbouring suffixes. The array is unique, because no two suffixes are equal.","**Prefix doubling**: rank suffixes by their first character, then repeatedly sort by the pair (rank of the first k items, rank of the next k items), which ranks the first 2k items. After at most ⌈log₂ n⌉ rounds every rank differs. With a comparison sort that's O(n log² n); counting sort makes it O(n log n), and SA-IS builds it in O(n).","**LCP array**: lcp[i] is the length of the longest common prefix of the suffixes at sa[i − 1] and sa[i]. For two suffixes further apart in sa, the common prefix is the minimum of the lcp values between them, so the closest pairs are always neighbours.","**Kasai's algorithm**: visit suffixes in text order. If suffix p shares h characters with its sorted predecessor, suffix p + 1 shares at least h − 1 with its own, so h never restarts from 0: it rises at most 2n times in total, O(n) time and space.","**Counting and repeats**: there are n(n + 1)/2 substring positions, and suffix sa[i] repeats lcp[i] prefixes already seen, so the number of distinct substrings is n(n + 1)/2 − Σ lcp. The longest repeated substring has length max(lcp); one that occurs at least k times is the best minimum over k − 1 neighbouring lcp values.","**Pattern search**: the suffixes starting with a pattern p form one contiguous block of sa. Two binary searches find its ends in O(m log n) for |p| = m, and the block's size is the number of occurrences.","**Several strings at once**: join a + # + b with a separator that occurs in neither. The longest common substring is the best lcp between neighbours that come from different strings; for many strings, slide a window over sa that contains every string (LeetCode 1923).","**Language notes**: Python compares strings by code point and JavaScript by UTF-16 unit, which differ only beyond the Basic Multilingual Plane (emoji). Both work on lists of integers too: the prelude accepts either."],"dia":[{"type":"layers","cap":"The sorted suffixes of “banana”: the suffix array and the LCP array","rows":[["sa[0] = 5","a"],["sa[1] = 3","ana · lcp 1: shares “a” with the row above"],["sa[2] = 1","anana · lcp 3: shares “ana”, the longest repeat"],["sa[3] = 0","banana · lcp 0"],["sa[4] = 4","na · lcp 0"],["sa[5] = 2","nana · lcp 2: shares “na”"]]},{"type":"cells","cap":"Prefix doubling on “banana”: each round ranks twice as many characters","rows":[{"label":"s","vals":["b","a","n","a","n","a"],"dim":[0,1,2,3,4,5]},{"label":"1 char","vals":[1,0,2,0,2,0]},{"label":"2 chars","vals":[2,1,3,1,3,0]},{"label":"4 chars","vals":[3,2,5,1,4,0],"ok":[0,1,2,3,4,5]}],"note":"Each round sorts the pairs (rank now, rank k places later): suffix 1's 4-character rank comes from the pair (rank of “an”, rank of “an”). After the 4-character round all six ranks differ, so they're final, and listing positions by rank gives sa = 5 3 1 0 4 2."}],"cmp":[{"cap":"Suffix array, suffix automaton or rolling hash?","head":["","Suffix array + LCP","Suffix automaton","Rolling hash (L3)"],"rows":[["Build time","O(n log² n) here; O(n log n) with radix sort; O(n) with SA-IS","O(n) for a fixed alphabet","O(n)"],["Memory","Two integer arrays","Up to 2n states with their transitions","One prefix-hash array"],["Exact?","Yes","Yes","No: collisions are possible, though rare"],["Best for","Distinct substrings, repeats, k-th substring, pattern blocks","Counting occurrences, building online","Equality checks and binary search on a length"]]},{"cap":"What the suffix array and LCP array answer","head":["Question","How","Cost after building"],"rows":[["Number of distinct substrings","n(n + 1)/2 − Σ lcp","O(n)"],["Longest repeated substring","The largest lcp value","O(n)"],["All occurrences of a pattern of length m","Two binary searches for its block of suffixes","O(m log n), plus one step per occurrence"],["Longest common substring of a and b","A suffix array of a + # + b; best lcp between neighbours from different strings","O(n + m)"],["k-th smallest distinct substring","Walk sa: suffix sa[i] adds n − sa[i] − lcp[i] new ones","O(n)"],["Longest substring occurring at least k times","Sliding-window minimum over k − 1 neighbouring lcp values","O(n)"]]}],"code":[{"t":"The suffix array (prefix doubling) and the LCP array (Kasai), used by every example below","tabs":[{"lang":"python","src":"def suffix_array(s):                            # s: a str, or a list of non-negative ints\n    n = len(s)\n    if n == 0:\n        return []\n    rank = [ord(c) for c in s] if isinstance(s, str) else list(s)\n    sa, k = list(range(n)), 1\n    while True:\n        key = lambda i: (rank[i], rank[i + k] if i + k < n else -1)   # (first k items, next k items)\n        sa.sort(key=key)\n        new = [0] * n\n        for j in range(1, n):\n            new[sa[j]] = new[sa[j - 1]] + (key(sa[j]) != key(sa[j - 1]))\n        rank = new                              # ranks now describe the first 2k items\n        if rank[sa[-1]] == n - 1:               # every rank differs: fully sorted\n            return sa\n        k *= 2\n\ndef lcp_array(s, sa):                           # Kasai: lcp[i] = LCP of suffixes sa[i - 1] and sa[i]; lcp[0] = 0\n    n = len(s)\n    rank = [0] * n\n    for i, p in enumerate(sa):\n        rank[p] = i\n    lcp, h = [0] * n, 0\n    for p in range(n):                          # suffixes in text order, so h falls by at most 1 per step\n        if rank[p] == 0:\n            h = 0\n            continue\n        q = sa[rank[p] - 1]                     # the suffix just before p in sorted order\n        while p + h < n and q + h < n and s[p + h] == s[q + h]:\n            h += 1\n        lcp[rank[p]] = h\n        h = max(h - 1, 0)\n    return lcp\n"},{"lang":"javascript","src":"function suffixArray(s) {                       // s: a string, or an array of non-negative integers\n  const n = s.length;\n  if (n === 0) return [];\n  let rank = typeof s === \"string\" ? Array.from({ length: n }, (_, i) => s.charCodeAt(i)) : [...s];\n  const sa = [...Array(n).keys()];\n  for (let k = 1; ; k *= 2) {\n    const second = i => (i + k < n ? rank[i + k] : -1);\n    const cmp = (a, b) => rank[a] - rank[b] || second(a) - second(b);   // (first k items, next k items)\n    sa.sort(cmp);\n    const next = new Array(n).fill(0);\n    for (let j = 1; j < n; j++) next[sa[j]] = next[sa[j - 1]] + (cmp(sa[j - 1], sa[j]) < 0 ? 1 : 0);\n    rank = next;                                // ranks now describe the first 2k items\n    if (rank[sa[n - 1]] === n - 1) return sa;   // every rank differs: fully sorted\n  }\n}\n\nfunction lcpArray(s, sa) {                      // Kasai: lcp[i] = LCP of suffixes sa[i - 1] and sa[i]; lcp[0] = 0\n  const n = s.length, rank = new Array(n).fill(0), lcp = new Array(n).fill(0);\n  sa.forEach((p, i) => { rank[p] = i; });\n  let h = 0;\n  for (let p = 0; p < n; p++) {                 // suffixes in text order, so h falls by at most 1 per step\n    if (rank[p] === 0) { h = 0; continue; }\n    const q = sa[rank[p] - 1];                  // the suffix just before p in sorted order\n    while (p + h < n && q + h < n && s[p + h] === s[q + h]) h++;\n    lcp[rank[p]] = h;\n    h = Math.max(h - 1, 0);\n  }\n  return lcp;\n}\n"}]},{"t":"The suffix array and LCP array of “banana”, and what they tell you","tabs":[{"lang":"python","src":"s = \"banana\"\nsa = suffix_array(s)\nlcp = lcp_array(s, sa)\nprint(*sa)\nprint(*lcp)\nn = len(s)\nprint(n * (n + 1) // 2 - sum(lcp))              # distinct substrings\ni = max(range(n), key=lambda i: lcp[i])\nprint(s[sa[i]:sa[i] + lcp[i]])                  # the longest repeated substring\n","out":"5 3 1 0 4 2\n0 1 3 0 0 2\n15\nana\n","notes":[[4,"a, ana, anana, banana, na, nana: the starts of the suffixes in that order."],[5,"lcp[2] = 3: “ana” (from 3) and “anana” (from 1) share three letters."],[7,"21 substring positions minus 6 repeats: suffix sa[i] repeats exactly lcp[i] prefixes of earlier suffixes."]]},{"lang":"javascript","src":"const s = \"banana\";\nconst sa = suffixArray(s);\nconst lcp = lcpArray(s, sa);\nconsole.log(...sa);\nconsole.log(...lcp);\nconst n = s.length;\nconsole.log(n * (n + 1) / 2 - lcp.reduce((a, b) => a + b, 0));   // distinct substrings\nconst i = lcp.indexOf(Math.max(...lcp));\nconsole.log(s.slice(sa[i], sa[i] + lcp[i]));    // the longest repeated substring\n","out":"5 3 1 0 4 2\n0 1 3 0 0 2\n15\nana\n","notes":[[4,"a, ana, anana, banana, na, nana: the starts of the suffixes in that order."],[5,"lcp[2] = 3: “ana” (from 3) and “anana” (from 1) share three letters."],[7,"21 substring positions minus 6 repeats: suffix sa[i] repeats exactly lcp[i] prefixes of earlier suffixes."]]}]},{"t":"Every occurrence of a pattern: two binary searches over the suffix array","tabs":[{"lang":"python","src":"def find_all(s, sa, p):                         # every start of p in s, in O(|p| log n)\n    def first(strict):                          # the first suffix whose first |p| letters are >= p (> p if strict)\n        lo, hi = 0, len(sa)\n        while lo < hi:\n            mid = (lo + hi) // 2\n            head = s[sa[mid]:sa[mid] + len(p)]\n            if head < p or (strict and head == p):\n                lo = mid + 1\n            else:\n                hi = mid\n        return lo\n    return sorted(sa[first(False):first(True)])\n\ns = \"abracadabra\"\nsa = suffix_array(s)\nfor p in [\"abra\", \"a\", \"cad\", \"bad\"]:\n    hits = find_all(s, sa, p)\n    print(p, len(hits), *hits)\n","out":"abra 2 0 7\na 5 0 3 5 7 10\ncad 1 4\nbad 0\n","notes":[[6,"Cutting each suffix to |p| letters makes every suffix that starts with p compare equal to p: they form one block."],[12,"The block runs from the first suffix ≥ p to the first suffix > p. Its size is the number of occurrences."],[18,"“bad” isn't in the text: both searches stop at the same place, an empty block."]]},{"lang":"javascript","src":"function findAll(s, sa, p) {                    // every start of p in s, in O(|p| log n)\n  const first = strict => {                     // the first suffix whose first |p| letters are >= p (> p if strict)\n    let lo = 0, hi = sa.length;\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1, head = s.slice(sa[mid], sa[mid] + p.length);\n      if (head < p || (strict && head === p)) lo = mid + 1;\n      else hi = mid;\n    }\n    return lo;\n  };\n  return sa.slice(first(false), first(true)).sort((a, b) => a - b);\n}\n\nconst s = \"abracadabra\";\nconst sa = suffixArray(s);\nfor (const p of [\"abra\", \"a\", \"cad\", \"bad\"]) {\n  const hits = findAll(s, sa, p);\n  console.log(p, hits.length, ...hits);\n}\n","out":"abra 2 0 7\na 5 0 3 5 7 10\ncad 1 4\nbad 0\n","notes":[[5,"Cutting each suffix to |p| letters makes every suffix that starts with p compare equal to p: they form one block."],[11,"The block runs from the first suffix ≥ p to the first suffix > p. Its size is the number of occurrences."],[18,"“bad” isn't in the text: both searches stop at the same place, an empty block."]]}]},{"t":"The longest common substring of two strings (or two arrays)","tabs":[{"lang":"python","src":"def longest_common(a, b, sep):                  # a, b: strs or lists; sep (same type) occurs in neither\n    s = a + sep + b\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    best, at = 0, 0\n    for i in range(1, len(s)):\n        if (sa[i] < len(a)) != (sa[i - 1] < len(a)) and lcp[i] > best:   # neighbours from different inputs\n            best, at = lcp[i], sa[i]\n    return s[at:at + best]\n\nprint(longest_common(\"xabxac\", \"abcabxabcd\", \"#\"))\nprint(*longest_common([1, 2, 3, 2, 1], [3, 2, 1, 4, 7], [8]))   # LeetCode 718's first example\n","out":"abxa\n3 2 1\n","notes":[[2,"The separator can't be part of a common prefix of a suffix from a and one from b, so no match runs across the join."],[7,"Two suffixes from different inputs share a common substring of length lcp[i]; the best such pair is always adjacent in sa."],[12,"For integer arrays, a separator bigger than every value works, like 8 here."]]},{"lang":"javascript","src":"function longestCommon(a, b, sep) {             // a, b: strings or arrays; sep (same type) occurs in neither\n  const s = typeof a === \"string\" ? a + sep + b : [...a, ...sep, ...b];\n  const sa = suffixArray(s), lcp = lcpArray(s, sa);\n  let best = 0, at = 0;\n  for (let i = 1; i < s.length; i++) {\n    if ((sa[i] < a.length) !== (sa[i - 1] < a.length) && lcp[i] > best) { best = lcp[i]; at = sa[i]; }   // neighbours from different inputs\n  }\n  return s.slice(at, at + best);\n}\n\nconsole.log(longestCommon(\"xabxac\", \"abcabxabcd\", \"#\"));\nconsole.log(...longestCommon([1, 2, 3, 2, 1], [3, 2, 1, 4, 7], [8]));   // LeetCode 718's first example\n","out":"abxa\n3 2 1\n","notes":[[2,"The separator can't be part of a common prefix of a suffix from a and one from b, so no match runs across the join."],[6,"Two suffixes from different inputs share a common substring of length lcp[i]; the best such pair is always adjacent in sa."],[12,"For integer arrays, a separator bigger than every value works, like 8 here."]]}]}],"ex":{"q":"List the distinct substrings of a string in alphabetical order. Which one is k-th? (CSES 2108, Substring Order I: n ≤ 10⁵, so listing all O(n²) substrings is out.)","steps":["Every substring is a prefix of a suffix, and walking the suffixes in sorted order meets the substrings in sorted order too: a suffix's prefixes come in order of length.","Suffix sa[i] shares its first lcp[i] prefixes with the suffix before it, so only lengths lcp[i] + 1 up to n − sa[i] are new: n − sa[i] − lcp[i] new substrings.","Walk sa, subtracting each suffix's count of new substrings from k. When k fits inside a suffix's new ones, the answer is that suffix's prefix of length lcp[i] + k.","O(n log² n) for the suffix array here, then O(n) for the walk; O(n) extra space."],"code":{"t":"Count the new prefixes of each suffix in sorted order","tabs":[{"lang":"python","src":"def kth_distinct(s, k):                         # the k-th smallest distinct substring (k from 1)\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    for i, p in enumerate(sa):\n        new = len(s) - p - lcp[i]               # prefixes of this suffix not seen in an earlier one\n        if k <= new:\n            return s[p:p + lcp[i] + k]\n        k -= new\n    return \"\"                                   # fewer than k distinct substrings\n\nprint(kth_distinct(\"babaacbaab\", 10), kth_distinct(\"banana\", 1), kth_distinct(\"banana\", 15))\n","out":"aba a nana"},{"lang":"javascript","src":"function kthDistinct(s, k) {                    // the k-th smallest distinct substring (k from 1)\n  const sa = suffixArray(s), lcp = lcpArray(s, sa);\n  for (let i = 0; i < sa.length; i++) {\n    const fresh = s.length - sa[i] - lcp[i];    // prefixes of this suffix not seen in an earlier one\n    if (k <= fresh) return s.slice(sa[i], sa[i] + lcp[i] + k);\n    k -= fresh;\n  }\n  return \"\";                                    // fewer than k distinct substrings\n}\n\nconsole.log(kthDistinct(\"babaacbaab\", 10), kthDistinct(\"banana\", 1), kthDistinct(\"banana\", 15));\n","out":"aba a nana"}]},"a":"“aba” for CSES's sample (“babaacbaab” has 43 distinct substrings, and the 10th in order is “aba”), then “a” and “nana” for “banana”: “a” comes first, and “nana” is the last of its 15."},"fade":{"q":"Find the longest substring that occurs at least k times (k ≥ 2), counting overlapping occurrences. For example, “abab” occurs three times in “abababab”.","steps":["The k suffixes that start with a repeated substring are k neighbours in the suffix array, and what they all share is the minimum of the k − 1 lcp values between them.",{"ask":"So what are you maximising?","a":"The minimum of every window of k − 1 consecutive lcp values, lcp[i − k + 2 .. i], over all i. For k = 2 that's just max(lcp)."},{"ask":"How do you get every window's minimum in O(n)?","a":"A monotonic deque of indexes (L3's sliding-window minimum): drop from the back while the new value is no bigger, drop from the front when an index leaves the window, and read the minimum at the front."},{"ask":"Time and space?","a":"O(n log² n) for the suffix array here, then O(n) for the window pass; O(n) extra space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"from collections import deque\n\ndef longest_k_times(s, k):                      # the longest substring occurring at least k times (k >= 2)\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    best, at = 0, 0\n    ...                                         # TODO: the minimum of every window lcp[i - k + 2 .. i]\n    return s[at:at + best]\n"},{"lang":"javascript","src":"function longestKTimes(s, k) {                  // the longest substring occurring at least k times (k >= 2)\n  const sa = suffixArray(s), lcp = lcpArray(s, sa);\n  let best = 0, at = 0;\n  // TODO: the minimum of every window lcp[i - k + 2 .. i]\n  return s.slice(at, at + best);\n}\n"}]},"solution":{"t":"Solution: a sliding-window minimum over the LCP array","tabs":[{"lang":"python","src":"from collections import deque\n\ndef longest_k_times(s, k):                      # the longest substring occurring at least k times (k >= 2)\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    best, at = 0, 0\n    dq = deque()                                # indexes into lcp with rising values: the minimum is at dq[0]\n    for i in range(1, len(s)):\n        while dq and lcp[dq[-1]] >= lcp[i]:\n            dq.pop()\n        dq.append(i)\n        if dq[0] <= i - (k - 1):\n            dq.popleft()                        # it left the window lcp[i - k + 2 .. i]\n        if i >= k - 1 and lcp[dq[0]] > best:\n            best, at = lcp[dq[0]], sa[i]\n    return s[at:at + best]\n\nprint(longest_k_times(\"banana\", 2), longest_k_times(\"banana\", 3), longest_k_times(\"abababab\", 3))\n","out":"ana a abab"},{"lang":"javascript","src":"function longestKTimes(s, k) {                  // the longest substring occurring at least k times (k >= 2)\n  const sa = suffixArray(s), lcp = lcpArray(s, sa);\n  let best = 0, at = 0;\n  const dq = [];                                // indexes into lcp with rising values: the minimum is at dq[head]\n  let head = 0;\n  for (let i = 1; i < s.length; i++) {\n    while (dq.length > head && lcp[dq[dq.length - 1]] >= lcp[i]) dq.pop();\n    dq.push(i);\n    if (dq[head] <= i - (k - 1)) head++;        // it left the window lcp[i - k + 2 .. i]\n    if (i >= k - 1 && lcp[dq[head]] > best) { best = lcp[dq[head]]; at = sa[i]; }\n  }\n  return s.slice(at, at + best);\n}\n\nconsole.log(longestKTimes(\"banana\", 2), longestKTimes(\"banana\", 3), longestKTimes(\"abababab\", 3));\n","out":"ana a abab"}]}},"traps":[["“Sorting the suffixes with an ordinary string sort is fine.”","One comparison can cost O(n), so the sort costs O(n² log n) in the worst case (try “aaaa…”), and storing every suffix takes O(n²) memory. Prefix doubling compares two ranks in O(1) instead."],["“The LCP array compares each suffix with the next one in the text.”","lcp[i] compares sa[i − 1] and sa[i], neighbours in sorted order. Kasai only visits the suffixes in text order, which is what keeps the work linear."],["“The longest repeat needs every pair of suffixes compared.”","Two suffixes share at most what every neighbouring pair between them shares, so the best pair is always adjacent: the answer is max(lcp)."],["“Any separator will do when joining two strings.”","It must occur in neither string, or a common prefix can run across the join. Use a character outside the alphabet, or, for arrays of numbers, a value bigger than any element."],["“The k-th distinct substring needs every substring listed and sorted.”","There are O(n²) of them. Walking the suffix array instead, suffix sa[i] adds exactly n − sa[i] − lcp[i] new ones, already in sorted order."],["“Python and JavaScript always sort strings the same way.”","Python compares code points and JavaScript compares UTF-16 units. They agree on ASCII and on most text, but characters such as emoji can sort differently; arrays of code points behave the same in both."]],"disc":[["Why can Kasai's algorithm start from h − 1 when it moves from suffix p to suffix p + 1?","If suffix p shares h ≥ 1 characters with the suffix q just before it in sorted order, then dropping the first character, suffix p + 1 shares h − 1 characters with suffix q + 1, and q + 1 sorts before p + 1. Whatever sits just before p + 1 in sorted order lies between them, so it shares at least h − 1 characters as well. So h never restarts from 0, and in total it rises at most 2n times."],["Suffix array, suffix automaton or hashing: which should you reach for?","Rolling hashes are quickest to write and pair well with binary search on a length (L3), but carry a small chance of collision. A suffix array with its LCP array is exact and compact, and one structure answers distinct counts, repeats, k-th substrings and pattern blocks. A suffix automaton is linear and strong at counting occurrences online, but harder to get right. In an interview, explain the suffix array; in a contest, use whichever you can type correctly from memory."]],"teach":{"prompt":"Explain to a junior colleague what a suffix array and an LCP array are, how you'd build them, and two questions they answer.","rubric":["The suffix array lists suffix starts in sorted order","Prefix doubling sorts by pairs of ranks: O(n log² n), or O(n log n) with radix sort","lcp[i] is the common prefix of sorted neighbours; Kasai builds it in O(n)","Distinct substrings = n(n + 1)/2 − Σ lcp","Longest repeat = max lcp; a pattern's occurrences are one block, found by binary search"],"model":"Take every suffix of a string and sort them: the suffix array is just their start positions in sorted order. I'd build it by prefix doubling: rank each suffix by its first character, then repeatedly sort by the pair of ranks of the first k and the next k characters, which ranks 2k characters, until every rank differs; that's O(n log² n) with a normal sort. The LCP array stores, for each pair of neighbours in that order, how many characters they share, and Kasai's algorithm fills it in O(n) because the shared length drops by at most one as you move along the text. Since every substring is a prefix of some suffix, these two arrays answer a lot: the number of distinct substrings is n(n + 1)/2 minus the sum of the LCP array, the longest repeated substring has length max(lcp), and all occurrences of a pattern form one block of the suffix array that two binary searches find in O(m log n)."},"qa":[["What is a suffix array?","The start positions of all suffixes, in sorted order."],["What does lcp[i] hold?","The length of the longest common prefix of the suffixes at sa[i − 1] and sa[i]."],["How many distinct substrings does a string have?","n(n + 1)/2 minus the sum of its LCP array."],["How fast is Kasai's algorithm, and why?","O(n): the shared length h falls by at most 1 per step, so it rises at most 2n times."],["How do you find every occurrence of a pattern with a suffix array?","Binary search for the block of suffixes that start with it: O(m log n)."],["How do you find the longest common substring of a and b?","Build the suffix array of a + # + b and take the best lcp between neighbours from different strings."]],"quiz":[{"q":"What does this print? (`suffix_array` / `suffixArray` and `lcp_array` / `lcpArray` are this module's helpers.)","snip":{"t":"The two arrays for “abab”","tabs":[{"lang":"python","src":"s = \"abab\"\nsa = suffix_array(s)\nprint(*sa, \"|\", *lcp_array(s, sa))\n"},{"lang":"javascript","src":"const s = \"abab\";\nconst sa = suffixArray(s);\nconsole.log(...sa, \"|\", ...lcpArray(s, sa));\n"}]},"o":["2 0 3 1 | 0 2 0 1","0 2 1 3 | 0 2 0 1","2 0 3 1 | 0 2 1 0","2 0 1 3 | 0 2 0 1"],"a":0,"e":"The sorted suffixes are ab (2), abab (0), b (3) and bab (1). Neighbours share 2 (ab / abab), 0 (abab / b) and 1 (b / bab), and lcp[0] is 0 by definition."},{"q":"What does this print?","snip":{"t":"Distinct substrings from the LCP array","tabs":[{"lang":"python","src":"def distinct(s):\n    sa = suffix_array(s)\n    n = len(s)\n    return n * (n + 1) // 2 - sum(lcp_array(s, sa))\n\nprint(distinct(\"aaaa\"), distinct(\"abcd\"))\n"},{"lang":"javascript","src":"function distinct(s) {\n  const sa = suffixArray(s), n = s.length;\n  return n * (n + 1) / 2 - lcpArray(s, sa).reduce((a, b) => a + b, 0);\n}\n\nconsole.log(distinct(\"aaaa\"), distinct(\"abcd\"));\n"}]},"o":["4 10","10 10","4 4","6 10"],"a":0,"e":"“aaaa” has only a, aa, aaa and aaaa: its LCP array is 0 1 2 3, and 10 − 6 = 4. In “abcd” no two suffixes share a first letter, so all 10 substrings differ."},{"q":"Why does Kasai's algorithm run in O(n) time?","o":["The match length h falls by at most 1 between consecutive text positions, so it rises at most 2n times in total","It compares each suffix only with the next suffix in the text","It compares suffixes in O(1) with hashing","The LCP array is always sorted"],"a":0,"e":"h starts each step at least at the previous value minus 1 and never exceeds n, so the total number of increases is at most 2n. Kasai compares sorted neighbours, not text neighbours, uses no hashing, and the LCP array isn't sorted."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["The number of distinct substrings is n(n + 1)/2 minus the sum of the LCP array","The longest repeated substring has length max(lcp)","A string can have more than one suffix array","Plain binary search over the suffix array finds a pattern of length m in O(m + log n)","Neighbours in the suffix array always start at neighbouring positions in the text"],"a":[0,1],"e":"Each suffix repeats lcp[i] earlier prefixes, and the best pair of suffixes is adjacent. Suffixes are all different, so the order is unique; plain binary search costs O(m log n) (O(m + log n) needs extra LCP tables); and “a” and “ana” are neighbours in banana's array but start at 5 and 3."},{"q":"Judge each statement.","t":"yn","s":[["Every substring is a prefix of some suffix.",true],["For two suffixes that aren't neighbours in sa, the common prefix is the minimum lcp value between them.",true],["Kasai's algorithm must visit the suffixes in suffix-array order to stay linear.",false],["Prefix doubling with a comparison sort takes O(n log² n) time.",true]],"e":"s[i:j] is the start of the suffix s[i:]. Between two sorted suffixes, every neighbouring pair shares at least their common prefix, and one pair shares no more. Kasai visits suffixes in text order: that's what lets h carry over. And ⌈log₂ n⌉ rounds of an O(n log n) sort give O(n log² n)."},{"q":"Put the steps of building a suffix array by prefix doubling in order.","t":"ord","items":["Rank every suffix by its first character","Sort the suffixes by the pair (rank of the first k characters, rank of the next k)","Give equal pairs equal new ranks, so ranks now describe the first 2k characters","Double k and repeat until every rank is different"],"e":"Each round sorts by pairs of the previous round's ranks, so the starting ranks come first, and the stopping test needs the new ranks."},{"q":"Complete the Python version of Kasai's algorithm.","t":"drop","lang":"python","code":"def kasai(s, sa):\n    n = len(s)\n    rank = [0] * n\n    for i, p in enumerate(sa):\n        rank[p] = i\n    lcp, h = [0] * n, 0\n    for p in range(n):\n        if rank[p] == 0:\n            h = 0\n            continue\n        q = {{0}}\n        while p + h < n and q + h < n and s[p + h] == s[q + h]:\n            h += 1\n        lcp[rank[p]] = h\n        {{1}}\n    return lcp\n","blanks":[{"o":["sa[rank[p] - 1]","sa[rank[p] + 1]","rank[p - 1]","p - 1"],"a":0},{"o":["h = max(h - 1, 0)","h += 1","h = n - p","pass"],"a":0}],"e":"Each suffix is compared with the suffix just before it in sorted order, and the next text position can start from one less than the match just found (never below 0)."},{"q":"Match each question to how the suffix array answers it.","t":"match","pairs":[["How many different substrings does s have?","n(n + 1)/2 − the sum of the LCP array"],["The longest substring that appears twice","The largest LCP value"],["Every place a pattern occurs","Two binary searches for its block of suffixes"],["The longest substring common to two strings","The suffix array of a + # + b, neighbours from different strings"]],"extra":["Sorting the characters of s"],"e":"Distinct substrings subtract the repeats, a repeat is a shared prefix of neighbours, a pattern's occurrences are one sorted block, and a common substring is a shared prefix of a suffix from each string. Sorting the characters loses their order."}],"probs":[["CSES 2105 · Distinct Substrings","https://cses.fi/problemset/task/2105","","n(n + 1)/2 minus the sum of the LCP array (code block 1)"],["CSES 2106 · Repeating Substring","https://cses.fi/problemset/task/2106","","the largest LCP value and where it occurs; print −1 when it is 0"],["CSES 2108 · Substring Order I","https://cses.fi/problemset/task/2108","","the worked example: suffix sa[i] adds n − sa[i] − lcp[i] new substrings, in order"],["CSES 2109 · Substring Order II","https://cses.fi/problemset/task/2109","","now repeats count: each new prefix in suffix-array order occurs once per suffix in the block that shares it, a block the LCP array bounds"],["CSES 2110 · Substring Distribution","https://cses.fi/problemset/task/2110","","suffix sa[i] adds one new substring of each length from lcp[i] + 1 to n − sa[i]: a difference array over lengths"],["CSES 1110 · Minimal Rotation","https://cses.fi/problemset/task/1110","","the smallest suffix of s + s that starts in the first half, cut to n letters (or Booth's algorithm in O(n))"],["LC 1163 · Last Substring in Lexicographical Order","https://leetcode.com/problems/last-substring-in-lexicographical-order/","Hard","the answer is the largest suffix, the last entry of the suffix array (an O(n) two-pointer method also exists)"],["LC 718 · Maximum Length of Repeated Subarray","https://leetcode.com/problems/maximum-length-of-repeated-subarray/","Medium","the longest common subarray: a suffix array over a + [separator] + b (code block 3); O(nm) DP also works"],["LC 1923 · Longest Common Subpath","https://leetcode.com/problems/longest-common-subpath/","Hard","many paths: join them with distinct separators, then slide a window over the suffix array that covers every path and take its minimum LCP; or binary search with rolling hashes"]],"src":[["cp-algorithms: Suffix array","https://cp-algorithms.com/string/suffix-array.html"],["cp-algorithms: Suffix automaton","https://cp-algorithms.com/string/suffix-automaton.html"],["Wikipedia: LCP array (with Kasai's algorithm)","https://en.wikipedia.org/wiki/LCP_array"],["USACO Guide: Suffix array","https://usaco.guide/adv/suffix-array"],["CSES Problem Set (string algorithms section)","https://cses.fi/problemset/"]]},{"id":"m06","d":"d2","t":"Sparse tables, square-root tricks and skip lists","min":120,"hook":"Not every range question needs a segment tree. When the data never changes, a sparse table answers a range minimum in O(1). When the operation doesn't merge neatly, blocks of √n elements keep the code short. When all the queries are known up front, Mo's algorithm reorders them so that one sliding window answers them all. And when you need a sorted set without rotations, the skip list behind Redis's sorted sets and many databases' in-memory write buffers does it with coin flips.","pre":{"q":"You must answer a million “minimum of a[l..r]?” questions on an array that never changes. Is there a way to answer each one by looking at just two stored numbers?","a":"Yes. Store the minimum of every block whose length is a power of two. Any range [l, r] is covered by two such blocks of the same length, one starting at l and one ending at r. They may overlap, but an element counted twice can't change a minimum, so min(block 1, block 2) is the answer. That table is a sparse table."},"kid":{"t":"Ben's express lanes","x":"Ben lines his toy cars up in number order along the bottom shelf. Finding car 70 means walking past every car, so he flips a coin for each car: heads, a copy goes up on the shelf above too, and he flips again for the shelf above that. Now the top shelf has only a few cars, the next one twice as many, and so on. To find a car, he walks along the top shelf until the next car is too big, then drops a shelf and carries on. Every drop halves what's left to search.","map":[["Cars in number order on the bottom shelf","Level 0: a sorted linked list of every value"],["A coin flip sends a copy up a shelf","Each node joins the next level with probability 1/2"],["Each shelf has about half the cars of the one below","Level i holds about n / 2^i nodes, so there are about log₂ n levels"],["Walk right until the next car is too big, then drop","Search: move right while next < target, then go down a level"],["Every drop halves what's left","Expected O(log n) steps for search, insert and delete"]],"brk":"Ben's shelves are lucky or unlucky by chance, and so are a skip list's levels: the O(log n) is an expected cost, not a guarantee, although a really bad run is vanishingly unlikely. And Ben copies whole cars, while a skip list stores each value once with a tower of pointers, about two per value on average."},"keys":["**Sparse table**: t[j][i] holds the answer for a[i .. i + 2^j − 1], built level by level from two halves in O(n log n) time and memory. A query on [l, r] takes the largest 2^j that fits and combines the block starting at l with the block ending at r: O(1).","**Idempotent operations only**: the two blocks may overlap, which is harmless when op(x, x) = x (min, max, gcd, bitwise and/or) but double-counts for sums. And the table is static: one change would touch O(n) entries.","**Square-root decomposition**: cut the array into blocks of about √n and keep a summary per block. A range query handles O(√n) whole blocks by their summaries and O(√n) loose elements one by one, and an update fixes one block: O(√n) per operation, more with a log factor if blocks are binary searched.","**Why use blocks at all**: the summary only has to work for a block, not merge with its neighbours. Sorted copies of each block answer “how many values ≤ x in [l, r]?” with point updates, which a plain segment tree can't do with O(1) summaries.","**Mo's algorithm (offline)**: read every query first, sort them by (block of l, then r), and slide one window [lo, hi] from query to query, adding or removing one element at a time. With block size B ≈ n / √q, the ends move O(n √q) steps in total, so anything you can update in O(1) per element (distinct counts, frequencies) costs O(n √q + q log q).","**Mo's needs**: all queries in advance (no online or encoded queries), O(1) add and remove, and no updates in the basic form. Alternating the direction of r between blocks (snake order) roughly halves the right end's travel.","**Skip list**: a sorted linked list with “express lanes”: each node also joins the level above with probability 1/2, so level i has about n / 2^i nodes. Search moves right while the next value is smaller, then drops a level. Search, insert and delete take expected O(log n) time and expected O(n) space, with no rotations; Redis sorted sets and LevelDB/RocksDB in-memory tables use them.","**Choosing**: static data and min/max/gcd → sparse table; static sums → prefix sums; updates with a mergeable operation → Fenwick or segment tree (L3); awkward operations → square-root blocks; many offline add/remove-style queries → Mo's; a sorted set you build yourself → skip list or a balanced tree."],"dia":[{"type":"cells","cap":"A sparse table for min over a = [5, 2, 8, 6, 3, 7, 4, 9]","rows":[{"label":"len 1","vals":[5,2,8,6,3,7,4,9]},{"label":"len 2","vals":[2,2,6,3,3,4,4]},{"label":"len 4","vals":[2,2,3,3,3],"hl":[2,3]},{"label":"len 8","vals":[2]}],"note":"min(a[2..6]) covers 5 elements, so it uses two length-4 blocks: the one starting at 2 (8, 6, 3, 7) and the one ending at 6 (6, 3, 7, 4). They overlap on a[3..5], which can't change a minimum: the answer is min(3, 3) = 3."},{"type":"cells","cap":"A skip list holding 1 2 3 4 6 7 9: searching for 7","idx":false,"rows":[{"label":"level 3","vals":["·","·","·",4,"·","·","·"],"dim":[0,1,2,4,5,6],"hl":[3]},{"label":"level 2","vals":["·","·","·",4,"·","·",9],"dim":[0,1,2,4,5],"hl":[3]},{"label":"level 1","vals":["·",2,"·",4,"·",7,9],"dim":[0,2,4],"hl":[3]},{"label":"level 0","vals":[1,2,3,4,6,7,9],"hl":[3,4],"ok":[5]}],"note":"Start at the top: 4 < 7, so move to 4. On levels 3, 2 and 1 the next node is missing or not smaller than 7 (nothing, then 9, then 7), so drop down. On level 0, move to 6; the next node is 7, the target. Two moves to the right instead of five along the bottom level."}],"cmp":[{"cap":"Range-query structures: which one?","head":["Structure","Build","Query","Update","Best for"],"rows":[["Prefix sums","O(n)","O(1)","O(n)","Static sums"],["Sparse table","O(n log n)","O(1)","Not supported","Static min, max, gcd"],["Fenwick or segment tree (L3)","O(n)","O(log n)","O(log n)","Mergeable operations with updates"],["Square-root blocks","O(n), or O(n log n) with sorted blocks","O(√n), or O(√n log n)","O(√n)","Operations that don't merge neatly"],["Mo's algorithm","Sort the queries: O(q log q)","O(n √q) for all of them together","Not in the basic form","Distinct counts, frequencies, other add/remove answers"]]},{"cap":"Balanced search tree or skip list?","head":["","Red-black or AVL tree","Skip list"],"rows":[["Search, insert, delete","O(log n) in the worst case","O(log n) expected"],["Staying balanced","Rotations and colour or height rules","Coin flips: no rebalancing at all"],["Ordered scan","In-order traversal","Walk level 0"],["Concurrent versions","Hard to write","Simpler, including lock-free designs"],["Seen in","Java's TreeMap, C++'s std::map","Redis sorted sets, LevelDB and RocksDB memtables"]]}],"code":[{"t":"The sparse table used by the first example and the quiz","tabs":[{"lang":"python","src":"class SparseTable:                              # O(n log n) build, O(1) query for idempotent operations\n    def __init__(self, a, op):\n        self.op, self.t = op, [a[:]]            # t[j][i] = op over a[i .. i + 2^j - 1]\n        j = 1\n        while 1 << j <= len(a):\n            prev, half = self.t[-1], 1 << (j - 1)\n            self.t.append([op(prev[i], prev[i + half]) for i in range(len(a) - (1 << j) + 1)])\n            j += 1\n\n    def query(self, l, r):                      # op over a[l .. r], both ends included\n        j = (r - l + 1).bit_length() - 1        # the largest power of two that fits in the range\n        return self.op(self.t[j][l], self.t[j][r - (1 << j) + 1])   # two overlapping blocks cover [l, r]\n"},{"lang":"javascript","src":"class SparseTable {                             // O(n log n) build, O(1) query for idempotent operations\n  constructor(a, op) {\n    this.op = op;\n    this.t = [[...a]];                          // t[j][i] = op over a[i .. i + 2^j - 1]\n    for (let j = 1; 1 << j <= a.length; j++) {\n      const prev = this.t[j - 1], half = 1 << (j - 1);\n      this.t.push(Array.from({ length: a.length - (1 << j) + 1 }, (_, i) => op(prev[i], prev[i + half])));\n    }\n  }\n  query(l, r) {                                 // op over a[l .. r], both ends included\n    const j = 31 - Math.clz32(r - l + 1);       // the largest power of two that fits in the range\n    return this.op(this.t[j][l], this.t[j][r - (1 << j) + 1]);   // two overlapping blocks cover [l, r]\n  }\n}\n"}]},{"t":"Sparse tables: O(1) range minimum, range gcd, and 100,000 elements","tabs":[{"lang":"python","src":"from math import gcd\n\na = [5, 2, 8, 6, 3, 7, 4, 9]\nmn = SparseTable(a, min)\nprint(mn.query(0, 7), mn.query(2, 6), mn.query(3, 3), mn.query(5, 7))\ng = SparseTable([12, 18, 24, 9, 15], gcd)\nprint(g.query(0, 2), g.query(1, 4), g.query(3, 4))\nbig = SparseTable(list(range(100_000, 0, -1)), max)\nprint(len(big.t), big.query(10, 99_999))\n","out":"2 3 6 4\n6 3 3\n17 99990\n","notes":[[5,"query(2, 6) covers 5 elements: blocks of 4 at 2 and at 3 overlap, and min(3, 3) = 3."],[7,"gcd is idempotent too: gcd(x, x) = x, so overlapping blocks are fine. gcd(18, 24, 9, 15) = 3."],[8,"100,000 elements need 17 levels, since 2¹⁶ ≤ 100,000 < 2¹⁷: about 1.6 million stored values for O(1) queries."]]},{"lang":"javascript","src":"const gcd = (x, y) => (y === 0 ? x : gcd(y, x % y));\n\nconst a = [5, 2, 8, 6, 3, 7, 4, 9];\nconst mn = new SparseTable(a, Math.min);\nconsole.log(mn.query(0, 7), mn.query(2, 6), mn.query(3, 3), mn.query(5, 7));\nconst g = new SparseTable([12, 18, 24, 9, 15], gcd);\nconsole.log(g.query(0, 2), g.query(1, 4), g.query(3, 4));\nconst big = new SparseTable(Array.from({ length: 100000 }, (_, i) => 100000 - i), Math.max);\nconsole.log(big.t.length, big.query(10, 99999));\n","out":"2 3 6 4\n6 3 3\n17 99990\n","notes":[[5,"query(2, 6) covers 5 elements: blocks of 4 at 2 and at 3 overlap, and min(3, 3) = 3."],[7,"gcd is idempotent too: gcd(x, x) = x, so overlapping blocks are fine. gcd(18, 24, 9, 15) = 3."],[8,"100,000 elements need 17 levels, since 2¹⁶ ≤ 100,000 < 2¹⁷: about 1.6 million stored values for O(1) queries."]]}]},{"t":"Square-root blocks: count values ≤ x in a range, with point updates","tabs":[{"lang":"python","src":"from bisect import bisect_right, insort\n\nclass BlockCounter:                           # count values <= x in a[l..r], with point updates\n    def __init__(self, a):\n        self.a = a[:]\n        self.B = max(1, int(len(a) ** 0.5))   # block size about sqrt(n)\n        self.blocks = [sorted(a[i:i + self.B]) for i in range(0, len(a), self.B)]\n\n    def update(self, i, x):                   # O(B): fix one sorted block\n        blk = self.blocks[i // self.B]\n        blk.pop(bisect_right(blk, self.a[i]) - 1)   # remove the old value\n        insort(blk, x)\n        self.a[i] = x\n\n    def count_le(self, l, r, x):              # O(B + (n / B) log B)\n        total = 0\n        while l <= r and l % self.B:          # the loose elements before the first whole block\n            total += self.a[l] <= x\n            l += 1\n        while l + self.B - 1 <= r:            # whole blocks: binary search their sorted copies\n            total += bisect_right(self.blocks[l // self.B], x)\n            l += self.B\n        while l <= r:                         # the loose elements after the last whole block\n            total += self.a[l] <= x\n            l += 1\n        return total\n\nbc = BlockCounter([7, 2, 9, 4, 4, 8, 1, 6, 3, 5])\nprint(bc.count_le(0, 9, 4), bc.count_le(2, 7, 6))\nbc.update(3, 10)\nprint(bc.count_le(2, 7, 6), bc.count_le(0, 9, 10) - bc.count_le(0, 9, 5))\n","out":"5 4\n3 5\n","notes":[[7,"√10 rounds down to 3: blocks [7, 2, 9], [4, 4, 8], [1, 6, 3] and [5], each kept sorted."],[17,"Loose elements at the edges are checked one by one: at most 2B of them."],[20,"A whole block answers with one binary search over its sorted copy instead of B comparisons."],[31,"Values in (5, 10] are a difference of two counts, as in CSES 1144 (Salary Queries)."]]},{"lang":"javascript","src":"const upperBound = (arr, x) => {              // how many values in sorted arr are <= x\n  let lo = 0, hi = arr.length;\n  while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] <= x) lo = mid + 1; else hi = mid; }\n  return lo;\n};\n\nclass BlockCounter {                          // count values <= x in a[l..r], with point updates\n  constructor(a) {\n    this.a = [...a];\n    this.B = Math.max(1, Math.floor(Math.sqrt(a.length)));   // block size about sqrt(n)\n    this.blocks = [];\n    for (let i = 0; i < a.length; i += this.B) this.blocks.push(a.slice(i, i + this.B).sort((x, y) => x - y));\n  }\n  update(i, x) {                              // O(B): fix one sorted block\n    const blk = this.blocks[Math.floor(i / this.B)];\n    blk.splice(upperBound(blk, this.a[i]) - 1, 1);   // remove the old value\n    blk.splice(upperBound(blk, x), 0, x);\n    this.a[i] = x;\n  }\n  countLe(l, r, x) {                          // O(B + (n / B) log B)\n    let total = 0;\n    for (; l <= r && l % this.B !== 0; l++) total += this.a[l] <= x ? 1 : 0;   // loose elements first\n    for (; l + this.B - 1 <= r; l += this.B) total += upperBound(this.blocks[l / this.B], x);   // whole blocks\n    for (; l <= r; l++) total += this.a[l] <= x ? 1 : 0;   // loose elements last\n    return total;\n  }\n}\n\nconst bc = new BlockCounter([7, 2, 9, 4, 4, 8, 1, 6, 3, 5]);\nconsole.log(bc.countLe(0, 9, 4), bc.countLe(2, 7, 6));\nbc.update(3, 10);\nconsole.log(bc.countLe(2, 7, 6), bc.countLe(0, 9, 10) - bc.countLe(0, 9, 5));\n","out":"5 4\n3 5\n","notes":[[10,"√10 rounds down to 3: blocks [7, 2, 9], [4, 4, 8], [1, 6, 3] and [5], each kept sorted."],[22,"Loose elements at the edges are checked one by one: at most 2B of them."],[23,"A whole block answers with one binary search over its sorted copy instead of B comparisons."],[32,"Values in (5, 10] are a difference of two counts, as in CSES 1144 (Salary Queries)."]]}]},{"t":"Mo's algorithm: distinct values in many ranges, answered offline","tabs":[{"lang":"python","src":"def distinct_queries(a, queries):             # offline: the number of distinct values in each a[l..r]\n    n, q = len(a), len(queries)\n    B = max(1, int(n / max(1, q) ** 0.5))     # block size about n / sqrt(q)\n    def key(i):\n        b = queries[i][0] // B\n        return (b, queries[i][1] if b % 2 == 0 else -queries[i][1])   # snake order: r alternates by block\n    cnt, ans = [0] * (max(a, default=0) + 1), [0] * q\n    distinct, lo, hi = 0, 0, -1               # the window a[lo..hi], empty at first\n    def add(i):\n        nonlocal distinct\n        cnt[a[i]] += 1\n        distinct += cnt[a[i]] == 1\n    def remove(i):\n        nonlocal distinct\n        cnt[a[i]] -= 1\n        distinct -= cnt[a[i]] == 0\n    for i in sorted(range(q), key=key):\n        l, r = queries[i]\n        while hi < r:                         # grow first, then shrink, so the window stays valid\n            hi += 1\n            add(hi)\n        while lo > l:\n            lo -= 1\n            add(lo)\n        while hi > r:\n            remove(hi)\n            hi -= 1\n        while lo < l:\n            remove(lo)\n            lo += 1\n        ans[i] = distinct\n    return ans\n\nprint(*distinct_queries([2, 1, 3, 2, 3, 1, 4, 2], [(0, 3), (1, 6), (4, 7), (2, 2), (0, 7)]))\n","out":"3 4 4 1 4","notes":[[3,"With q = 5 queries on n = 8 elements, B = int(8 / √5) = 3. Bigger inputs balance q × B steps of the left end against n² / B steps of the right end."],[6,"Within even blocks r rises and within odd blocks it falls, so the right end sweeps back and forth instead of jumping back to the start."],[19,"Each step adds or removes one element in O(1), which is all Mo's algorithm needs from the answer."],[31,"The answers come back in the queries' original order, although they were computed in Mo's order."]]},{"lang":"javascript","src":"function distinctQueries(a, queries) {        // offline: the number of distinct values in each a[l..r]\n  const n = a.length, q = queries.length;\n  const B = Math.max(1, Math.floor(n / Math.sqrt(Math.max(1, q))));   // block size about n / sqrt(q)\n  const order = [...Array(q).keys()].sort((i, j) => {\n    const bi = Math.floor(queries[i][0] / B), bj = Math.floor(queries[j][0] / B);\n    if (bi !== bj) return bi - bj;\n    return bi % 2 === 0 ? queries[i][1] - queries[j][1] : queries[j][1] - queries[i][1];   // snake order\n  });\n  const cnt = new Array(a.reduce((m, x) => Math.max(m, x), 0) + 1).fill(0), ans = new Array(q).fill(0);\n  let distinct = 0, lo = 0, hi = -1;          // the window a[lo..hi], empty at first\n  const add = i => { if (cnt[a[i]]++ === 0) distinct++; };\n  const remove = i => { if (--cnt[a[i]] === 0) distinct--; };\n  for (const i of order) {\n    const [l, r] = queries[i];\n    while (hi < r) add(++hi);                 // grow first, then shrink, so the window stays valid\n    while (lo > l) add(--lo);\n    while (hi > r) remove(hi--);\n    while (lo < l) remove(lo++);\n    ans[i] = distinct;\n  }\n  return ans;\n}\n\nconsole.log(...distinctQueries([2, 1, 3, 2, 3, 1, 4, 2], [[0, 3], [1, 6], [4, 7], [2, 2], [0, 7]]));\n","out":"3 4 4 1 4","notes":[[3,"With q = 5 queries on n = 8 elements, B = int(8 / √5) = 3. Bigger inputs balance q × B steps of the left end against n² / B steps of the right end."],[7,"Within even blocks r rises and within odd blocks it falls, so the right end sweeps back and forth instead of jumping back to the start."],[15,"Each step adds or removes one element in O(1), which is all Mo's algorithm needs from the answer."],[19,"The answers come back in the queries' original order, although they were computed in Mo's order."]]}]}],"ex":{"q":"Design a class that, given an array, answers queries (left, right, threshold): return the element that occurs at least threshold times in arr[left..right], or −1. It's guaranteed that 2 × threshold > right − left + 1. (LeetCode 1157, Online Majority Element In Subarray)","steps":["2 × threshold > length means any qualifying element is a strict majority of the range, so at most one element can qualify.","Boyer–Moore voting finds the only possible candidate: pair up different values and cancel them, and whatever survives is the candidate. Two pieces' summaries (candidate, votes) merge the same way, so a segment tree can hold one summary per node.","A query merges the O(log n) nodes covering the range to get a candidate, then counts the candidate's occurrences with two binary searches in its sorted list of positions.","Build: O(n) time and space for the tree and the position lists. Each query: O(log n) for the candidate and O(log n) for the count."],"code":{"t":"A segment tree of Boyer–Moore summaries, checked with position lists","tabs":[{"lang":"python","src":"from bisect import bisect_left, bisect_right\n\ndef merge(x, y):                              # Boyer-Moore: equal candidates add votes, different ones cancel\n    if x[0] == y[0]:\n        return (x[0], x[1] + y[1])\n    return (x[0], x[1] - y[1]) if x[1] >= y[1] else (y[0], y[1] - x[1])\n\nclass MajorityChecker:\n    def __init__(self, arr):\n        self.n = n = len(arr)\n        self.pos = {}                         # value -> its positions, in order\n        for i, v in enumerate(arr):\n            self.pos.setdefault(v, []).append(i)\n        self.t = [(0, 0)] * n + [(v, 1) for v in arr]   # bottom-up segment tree of (candidate, votes)\n        for i in range(n - 1, 0, -1):\n            self.t[i] = merge(self.t[2 * i], self.t[2 * i + 1])\n\n    def query(self, left, right, threshold):\n        res, l, r = (0, 0), left + self.n, right + self.n + 1\n        while l < r:                          # merge the O(log n) nodes that cover [left, right]\n            if l & 1:\n                res, l = merge(res, self.t[l]), l + 1\n            if r & 1:\n                r -= 1\n                res = merge(res, self.t[r])\n            l, r = l // 2, r // 2\n        p = self.pos.get(res[0], [])\n        count = bisect_right(p, right) - bisect_left(p, left)\n        return res[0] if count >= threshold else -1\n\nmc = MajorityChecker([1, 1, 2, 2, 1, 1])\nprint(mc.query(0, 5, 4), mc.query(0, 3, 3), mc.query(2, 3, 2))\n","out":"1 -1 2"},{"lang":"javascript","src":"const lowerBound = (arr, x) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; } return lo; };\nconst upperBound = (arr, x) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] <= x) lo = m + 1; else hi = m; } return lo; };\n\nconst merge = ([c1, v1], [c2, v2]) => {       // Boyer-Moore: equal candidates add votes, different ones cancel\n  if (c1 === c2) return [c1, v1 + v2];\n  return v1 >= v2 ? [c1, v1 - v2] : [c2, v2 - v1];\n};\n\nclass MajorityChecker {\n  constructor(arr) {\n    const n = (this.n = arr.length);\n    this.pos = new Map();                     // value -> its positions, in order\n    arr.forEach((v, i) => { if (!this.pos.has(v)) this.pos.set(v, []); this.pos.get(v).push(i); });\n    this.t = new Array(2 * n);                // bottom-up segment tree of [candidate, votes]\n    for (let i = 0; i < n; i++) this.t[n + i] = [arr[i], 1];\n    for (let i = n - 1; i > 0; i--) this.t[i] = merge(this.t[2 * i], this.t[2 * i + 1]);\n  }\n  query(left, right, threshold) {\n    let res = [0, 0];\n    for (let l = left + this.n, r = right + this.n + 1; l < r; l >>= 1, r >>= 1) {   // merge the covering nodes\n      if (l & 1) res = merge(res, this.t[l++]);\n      if (r & 1) res = merge(res, this.t[--r]);\n    }\n    const p = this.pos.get(res[0]) || [];\n    const count = upperBound(p, right) - lowerBound(p, left);\n    return count >= threshold ? res[0] : -1;\n  }\n}\n\nconst mc = new MajorityChecker([1, 1, 2, 2, 1, 1]);\nconsole.log(mc.query(0, 5, 4), mc.query(0, 3, 3), mc.query(2, 3, 2));\n","out":"1 -1 2"}]},"a":"1, −1 and 2. The whole array has four 1s, enough for threshold 4. arr[0..3] = 1 1 2 2 has no value three times. arr[2..3] = 2 2 meets threshold 2."},"fade":{"q":"Design a skip list without any library sorted structure: search(target) says whether target is present, add(num) inserts it (duplicates allowed), and erase(num) removes one copy and says whether it found one. Each call should take O(log n) expected time. (LeetCode 1206, Design Skiplist)","steps":["Keep a sorted linked list on level 0 and “express lanes” above it: each node also joins the next level up with probability 1/2, so level i holds about n / 2^i nodes.",{"ask":"How does a search move through the levels?","a":"Start at the head on the top level in use. Move right while the next value is smaller than the target, then drop a level. On level 0, the next node is the first value ≥ target."},{"ask":"What must add and erase remember on the way down?","a":"The last node before the target on every level (an update array). add splices the new node in after those nodes on its lowest lvl levels; erase unlinks the first matching node on every level it's on."},{"ask":"Time and space?","a":"Expected O(log n) per search, add and erase, and expected O(n) space (about two pointers per value), because each level holds about half the nodes of the one below. The worst case is O(n), but it's vanishingly unlikely."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"import random\n\nclass Node:\n    def __init__(self, val, level):\n        self.val, self.next = val, [None] * level\n\nclass Skiplist:\n    MAX = 16                                  # enough levels for about 2^16 values\n\n    def __init__(self):\n        self.head, self.level = Node(-1, self.MAX), 1\n\n    def _before(self, target):                # the last node < target on every level\n        update, x = [self.head] * self.MAX, self.head\n        for i in range(self.level - 1, -1, -1):\n            while x.next[i] and x.next[i].val < target:\n                x = x.next[i]\n            update[i] = x\n        return update\n\n    def search(self, target):\n        nxt = self._before(target)[0].next[0]\n        return nxt is not None and nxt.val == target\n\n    def add(self, num):\n        ...                                   # TODO: pick a random level, then splice in on each level\n\n    def erase(self, num):\n        ...                                   # TODO: unlink the first copy on every level it is on\n"},{"lang":"javascript","src":"class SkipNode {\n  constructor(val, level) { this.val = val; this.next = new Array(level).fill(null); }\n}\n\nclass Skiplist {\n  constructor() { this.MAX = 16; this.head = new SkipNode(-1, this.MAX); this.level = 1; }\n  before(target) {                            // the last node < target on every level\n    const update = new Array(this.MAX).fill(this.head);\n    let x = this.head;\n    for (let i = this.level - 1; i >= 0; i--) {\n      while (x.next[i] && x.next[i].val < target) x = x.next[i];\n      update[i] = x;\n    }\n    return update;\n  }\n  search(target) {\n    const nxt = this.before(target)[0].next[0];\n    return nxt !== null && nxt.val === target;\n  }\n  add(num) {\n    // TODO: pick a random level, then splice in on each level\n  }\n  erase(num) {\n    // TODO: unlink the first copy on every level it is on\n  }\n}\n"}]},"solution":{"t":"Solution: random levels, spliced in and out level by level","tabs":[{"lang":"python","src":"import random\n\nclass Node:\n    def __init__(self, val, level):\n        self.val, self.next = val, [None] * level\n\nclass Skiplist:\n    MAX = 16                                  # enough levels for about 2^16 values\n\n    def __init__(self):\n        self.head, self.level = Node(-1, self.MAX), 1\n\n    def _before(self, target):                # the last node < target on every level\n        update, x = [self.head] * self.MAX, self.head\n        for i in range(self.level - 1, -1, -1):\n            while x.next[i] and x.next[i].val < target:\n                x = x.next[i]                 # move right while the next value is smaller\n            update[i] = x                     # then drop a level\n        return update\n\n    def search(self, target):\n        nxt = self._before(target)[0].next[0]\n        return nxt is not None and nxt.val == target\n\n    def add(self, num):\n        update, lvl = self._before(num), 1\n        while lvl < self.MAX and random.random() < 0.5:\n            lvl += 1                          # each extra level with probability 1/2\n        self.level = max(self.level, lvl)\n        node = Node(num, lvl)\n        for i in range(lvl):                  # splice in after the last smaller node on each level\n            node.next[i], update[i].next[i] = update[i].next[i], node\n\n    def erase(self, num):\n        update = self._before(num)\n        node = update[0].next[0]\n        if node is None or node.val != num:\n            return False\n        for i in range(len(node.next)):       # it's the first copy, so it follows update[i] on every level\n            update[i].next[i] = node.next[i]\n        return True\n\nsl = Skiplist()\nfor x in (1, 2, 3):\n    sl.add(x)\nout = [sl.search(0)]\nsl.add(4)\nout += [sl.search(1), sl.erase(0), sl.erase(1), sl.search(1)]\nprint(*(\"yes\" if b else \"no\" for b in out))\n","out":"no yes no yes no"},{"lang":"javascript","src":"class SkipNode {\n  constructor(val, level) { this.val = val; this.next = new Array(level).fill(null); }\n}\n\nclass Skiplist {\n  constructor() { this.MAX = 16; this.head = new SkipNode(-1, this.MAX); this.level = 1; }\n  before(target) {                            // the last node < target on every level\n    const update = new Array(this.MAX).fill(this.head);\n    let x = this.head;\n    for (let i = this.level - 1; i >= 0; i--) {\n      while (x.next[i] && x.next[i].val < target) x = x.next[i];   // move right while the next value is smaller\n      update[i] = x;                          // then drop a level\n    }\n    return update;\n  }\n  search(target) {\n    const nxt = this.before(target)[0].next[0];\n    return nxt !== null && nxt.val === target;\n  }\n  add(num) {\n    const update = this.before(num);\n    let lvl = 1;\n    while (lvl < this.MAX && Math.random() < 0.5) lvl++;   // each extra level with probability 1/2\n    this.level = Math.max(this.level, lvl);\n    const node = new SkipNode(num, lvl);\n    for (let i = 0; i < lvl; i++) { node.next[i] = update[i].next[i]; update[i].next[i] = node; }   // splice in\n  }\n  erase(num) {\n    const update = this.before(num), node = update[0].next[0];\n    if (node === null || node.val !== num) return false;\n    for (let i = 0; i < node.next.length; i++) update[i].next[i] = node.next[i];   // the first copy follows update[i]\n    return true;\n  }\n}\n\nconst sl = new Skiplist();\nfor (const x of [1, 2, 3]) sl.add(x);\nconst out = [sl.search(0)];\nsl.add(4);\nout.push(sl.search(1), sl.erase(0), sl.erase(1), sl.search(1));\nconsole.log(...out.map(b => (b ? \"yes\" : \"no\")));\n","out":"no yes no yes no"}]}},"traps":[["“A sparse table does range sums in O(1) too.”","Its two blocks overlap, which is harmless for min, max or gcd but counts the overlap twice in a sum. For static sums use prefix sums."],["“A sparse table can take updates.”","One changed element sits in O(n) of its blocks (one per start position and level), so an update costs O(n). With updates, use a Fenwick or segment tree."],["“Mo's algorithm works online.”","It reorders the queries, so it needs all of them first. If each query depends on the previous answer, as in encoded online queries, Mo's can't
