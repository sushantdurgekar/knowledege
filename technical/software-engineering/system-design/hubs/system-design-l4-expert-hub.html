<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Design L4 Expert Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

window.HUB = {"id":"system-design-l4","code":"SD · L4","title":"System Design L4 Expert Hub","brand":"Expert Hub","cert":"System Design · L4 Expert","eyebrow":"Level L4 Expert · System Design · Python + JavaScript","pace":5,"accessed":"12 October 2026","hero":{"title":"Architecture that scales with the organisation","sub":"Level L4 is about leading design rather than drawing it: deciding well and writing it down, reviewing systems against well-architected pillars, sizing them and putting a price on them, changing them safely while they run, shaping teams so the architecture you want is the one you get, and designing the AI platforms every organisation is now building. Six topics, each told first as a Pizza Town story, then properly, with small runnable models in **Python and JavaScript** side by side. You finish with four tested builds and a capstone: an architecture review pack for a real system."},"facts":[["6","topics, each a 110–130 minute module"],["50–70 h","to finish L4 at your own pace"],["2","languages for every example: Python + JavaScript"],["4 + 1","labs plus the architecture review pack capstone"],["Optional","cloud architect certification: AWS SAP-C02, becoming SAP-C03 on 17 Nov 2026, or Microsoft AZ-305"],["~30","practice problems and exercises"]],"notices":[{"k":"info","t":"Certification is optional at this level","x":"No system-design certification exists. A cloud architect exam is an optional proxy: AWS Certified Solutions Architect – Professional (exam SAP-C02 until 16 Nov 2026; its replacement, SAP-C03, opens for registration on 27 Oct 2026 and is delivered from 17 Nov 2026) or Microsoft's Azure Solutions Architect Expert (exam AZ-305, which also needs the Azure Administrator Associate). Facts checked on 12 Oct 2026. This hub teaches architecture, not either exam's objectives; if you choose one, it gets its own exam-prep track. L4 is complete when every module quiz is at 80%+, the four labs pass in both languages, and your review pack has been presented to and reviewed by someone else."},{"k":"info","t":"Python and JavaScript side by side","x":"Every code block has a **Python | JavaScript** switch, remembered across modules. The examples are small, deterministic models, run against tests on 12 Oct 2026 (Python 3.13, Node.js 22.22). The labs use only the standard libraries."},{"k":"info","t":"Numbers and prices are illustrative","x":"Latencies, throughputs, failure rates and prices in this hub are round numbers for teaching, not quotes for any product. Cloud prices change and vary by region: real cost models start from the provider's current pricing pages and your own measurements, and every estimate states its assumptions."}],"howto":["Take the **diagnostic** first (15 minutes). It ranks the three topic areas by *weight × gap*.","Open **Roadmap**, set your hours per week and start date, and tick blocks off as you go.","In each module: guess the pre-question, read the **🍎 story**, then the key ideas, diagram and code. Do the worked example, then finish the faded one yourself.","Run every model and change one input at a time: a growth rate, a utilisation target, a team boundary, a cache hit rate. Predict the result before you run it.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","For every decision, write the drivers and at least three options before choosing, and record it as an ADR.","Finish with the capstone: review a system you know, then present the pack and take questions."],"tactics":["**Context and drivers**: the business goal, the constraints, and the quality attributes that matter most, ranked.","**Options**: at least three, including doing nothing; each with a sketch and its rough cost.","**Trade-offs**: score the options against the drivers, and find the sensitivity points where a small change flips the answer.","**Reversibility**: one-way doors get slow, careful decisions; two-way doors get fast ones and an experiment.","**Risks**: what could fail, how likely, how bad, and what you'd watch to see it coming.","**Cost**: build cost and run cost, now and at ten times the scale, with the assumptions written down.","**Decision and record**: an ADR with status, context, decision and consequences, plus the fitness functions that keep it true."],"tacticsTitle":"Architecture review routine (use it on every decision)","labsIntro":"Four builds feed the capstone. Write each one yourself in Python **and** JavaScript, run the tests, then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"The labs need only Python 3.12+ and Node.js 22.13+, using their standard libraries. The capstone is a written review pack about a system you know, with a cost model and a load-test plan. No cloud account and no cost."},"labsTab":"Build","interviewIntro":"At L4 the questions move from 'how would you build it' to 'how would you decide, and how would you get the organisation there'. Answer each question out loud in about three minutes, then compare with the model answer.","interviewEyebrow":"From practice to interview","interviewSkills":"architecture decision-making, well-architected reviews, capacity planning and cost modelling, migrations, socio-technical design, AI platform design","interviewTopics":"System Design L4 (architecture decisions and ADRs, well-architected frameworks, capacity and cost, evolution and migration, socio-technical design, AI systems design)","roles":["Staff or principal engineer","Solutions or enterprise architect","Head of platform or engineering manager"],"domains":[{"id":"d1","short":"A","name":"Decisions and frameworks","w":[30,30]},{"id":"d2","short":"B","name":"Capacity, cost and evolution","w":[35,35]},{"id":"d3","short":"C","name":"Organisations and AI systems","w":[35,35]}],"groups":[{"id":"g1","t":"Deciding well","mods":["m01","m02"]},{"id":"g2","t":"Running it, and changing it","mods":["m03","m04"]},{"id":"g3","t":"People and AI platforms","mods":["m05","m06"]}],"modules":[{"id":"m01","d":"d1","t":"Architecture decision-making: ADRs, trade-off analysis and reversibility","min":120,"hook":"Senior engineers are judged less by the systems they draw than by the decisions they make and how well those decisions age. An architecture decision record captures one decision with its context, options and consequences, so the next person knows why. A lightweight version of ATAM walks the options through the quality-attribute scenarios that matter and finds the sensitivity points where a small change flips the answer. And telling one-way doors from two-way doors decides how slowly, and with how much evidence, each decision should be made.","pre":{"q":"Your team must choose between PostgreSQL and DynamoDB for a new order service, and two senior engineers have argued about it for a week. What would make the decision faster and better, and what should be written down?","a":"Agree the decision drivers and their weights first (consistency, query patterns, operations effort, cost at scale, team skills, lock-in), then score both options against them and check how far the weights would have to move to change the answer. Judge how reversible the choice is: a database is costly to undo, so it earns a short spike. Then record the decision as an ADR with the context, the options, the consequences and what would make you revisit it."},"kid":{"t":"Choosing the family car","x":"Luigi's family must choose a car for the road trip. Instead of arguing, they list what matters (room for four, fuel cost, the steep hill to Grandma's) and agree how much each counts. They score three cars, and notice that if the hill counted a little more, the answer would change, so they test-drive up the hill. Buying a car is hard to undo, so they take their time; choosing the lunch stop is easy to change, so they just pick one. Then Luigi writes the decision in the trip diary: what they chose, why, and what would make them change their minds next year.","map":[["What matters, and how much each counts","Decision drivers: the quality attributes, ranked or weighted with the stakeholders"],["Scoring three cars","A decision matrix: each option scored against each driver"],["If the hill counted a little more","A sensitivity point: a small change in one weight flips the answer"],["Taking time over the car, not the lunch stop","One-way and two-way doors: match the effort to the reversibility"],["The trip diary entry","An architecture decision record (ADR)"]],"brk":"Luigi's family can test-drive the car. Many architecture decisions can't be fully tested before they're made, so a good record also says what you'll watch afterwards, and when you'll look at the decision again."},"keys":["**Decisions are the architecture**: the significant choices are the ones that are costly to change: data stores, service boundaries, protocols, build or buy, and the platforms you depend on. Name them explicitly, and give each an owner and a date by which it must be made.","**Architecture decision records**: one short document per decision, in Michael Nygard's format: title, status (proposed, accepted, superseded), context, decision and consequences. Kept in the repository, numbered, and never rewritten after acceptance (a later ADR supersedes an old one), they explain why the system looks the way it does. MADR adds the decision drivers and the options considered.","**Decision drivers**: the quality attributes that matter (performance, availability, security, cost, modifiability, time to market, team skills) ranked or weighted with the stakeholders before the options are compared, so the debate is about priorities rather than favourite technologies.","**Trade-off analysis, ATAM-lite**: write quality-attribute scenarios with response measures ('a region fails at the peak: checkout is back within 5 minutes'), walk each option through them, and record the risks (scenarios an option misses), the sensitivity points (a parameter that strongly affects one attribute) and the trade-off points (a parameter that helps one attribute and hurts another).","**Decision matrices and sensitivity**: weighted scores make the reasoning visible, but they're only as good as the weights. Find how far each weight must move to change the winner: a fragile winner needs more evidence, such as a spike, a prototype or a benchmark; a robust one can be decided now.","**One-way and two-way doors**: reversible decisions should be made quickly, close to the team, and treated as experiments; irreversible or very expensive ones deserve more analysis, more voices and a written record. Make decisions more reversible where you can: an interface in front of a vendor, portable data formats, feature flags, a pilot.","**When to decide**: deciding too early locks in ignorance, and deciding too late blocks the work. Aim for the last responsible moment, when waiting starts to cost more than the information it buys, and buy information cheaply in the meantime; its value is the expected cost it saves.","**Keeping decisions true**: turn a decision's key properties into automated fitness functions (latency budgets, dependency rules, cost alerts) so drift is caught, and record the signals that should trigger a review. A superseded ADR isn't a failure: the context changed, and the record shows how."],"dia":[{"type":"flow","cap":"From a question to a recorded decision","steps":[["Frame","the question, its owner and the date it's needed by"],["Drivers","rank the quality attributes with the stakeholders"],["Options","at least three, including doing nothing"],["Analyse","scenarios, scores, sensitivity and reversibility"],["Decide and record","an ADR, with fitness functions and triggers for a review"]],"note":"Most of the value is in the first two steps: agreeing what matters ends most arguments before they start."},{"type":"layers","cap":"The sections of an ADR","rows":[["Title and status","ADR-012: Use PostgreSQL for orders · accepted, 12 Oct 2026"],["Context","the forces at play: requirements, constraints, what we know"],["Drivers and options","what mattered and what was considered (MADR)"],["Decision","what we will do, in a sentence or two"],["Consequences","what gets easier, what gets harder, what we'll watch"]],"note":"Short is the point: one or two pages, written when the decision is made, and kept in the repository beside the code."},{"type":"tree","cap":"How much process does a decision need?","root":{"q":"Can it be undone cheaply, within a sprint?","c":[["yes","A two-way door: the team decides quickly, as an experiment"],["no",{"q":"Can it be made reversible (an interface, a flag, a pilot)?","c":[["yes","Do that first, then decide quickly"],["no","A one-way door: drivers, options, a spike, a review and an ADR"]]}]]}}],"cmp":[{"cap":"One-way and two-way doors","head":["","Two-way door","One-way door"],"rows":[["Examples","A library, a feature flag's default, a dashboard, an API field behind a version","A primary database, a cloud provider, a public API contract, a data model in many services"],["Who decides","The team that owns it","The team, with the people affected and a review"],["How fast","Hours or days","Weeks, with a spike or prototype if the winner is fragile"],["Record","A line in the changelog or a short ADR","A full ADR with options, drivers and consequences"]]},{"cap":"Three ways to compare options","head":["Technique","Answers","Watch out for"],"rows":[["Weighted decision matrix","Which option best fits the agreed priorities?","Weights are opinions: check how sensitive the winner is"],["ATAM-style scenarios","Does each option meet the response measures that matter, and where are the risks?","Scenarios need numbers, or every option passes"],["Expected value and value of information","What does each option cost across possible futures, and is it worth learning more first?","Probabilities are estimates: test several"]]}],"code":[{"t":"A weighted decision matrix: the weights are the decision","tabs":[{"lang":"python","src":"scores = {                                             # 1 (poor) to 5 (excellent), agreed with the team\n    \"PostgreSQL\": {\"consistency\": 5, \"query flexibility\": 5, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 5, \"lock-in\": 5},\n    \"DynamoDB\":   {\"consistency\": 3, \"query flexibility\": 2, \"operations effort\": 5, \"cost at 10x\": 4, \"team skills\": 2, \"lock-in\": 2},\n    \"MongoDB\":    {\"consistency\": 3, \"query flexibility\": 4, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 3, \"lock-in\": 4},\n}\nours = {\"consistency\": 30, \"query flexibility\": 20, \"operations effort\": 15, \"cost at 10x\": 15, \"team skills\": 10, \"lock-in\": 10}\nplatform = {\"consistency\": 10, \"query flexibility\": 10, \"operations effort\": 40, \"cost at 10x\": 30, \"team skills\": 5, \"lock-in\": 5}\n\ndef ranking(weights):\n    totals = {option: sum(w * s[d] for d, w in weights.items()) for option, s in scores.items()}\n    return sorted(totals.items(), key=lambda item: -item[1])   # out of 500: weights sum to 100, scores reach 5\n\nfor label, weights in ((\"our weights\", ours), (\"the platform team's weights\", platform)):\n    print(f\"{label}:\", \" | \".join(f\"{option} {total}\" for option, total in ranking(weights)))\nbest = {d: max(scores, key=lambda o: scores[o][d]) for d in ours}\nprint(\"best on each driver:\", \", \".join(f\"{d}: {o}\" for d, o in best.items()))\n","out":"our weights: PostgreSQL 440 | MongoDB 330 | DynamoDB 305\nthe platform team's weights: DynamoDB 390 | PostgreSQL 360 | MongoDB 315\nbest on each driver: consistency: PostgreSQL, query flexibility: PostgreSQL, operations effort: DynamoDB, cost at 10x: DynamoDB, team skills: PostgreSQL, lock-in: PostgreSQL\n","notes":[[6,"Agree the weights before anyone sees the totals: that's where the real disagreement lives."],[10,"Each total is the sum of weight × score: with weights summing to 100 and scores up to 5, the best possible is 500."],[14,"Same scores, the platform team's weights, and DynamoDB wins: the argument was about priorities, not facts."],[16,"No option is best at everything, and the matrix shows what each choice gives up."]]},{"lang":"javascript","src":"const scores = {                                       // 1 (poor) to 5 (excellent), agreed with the team\n  PostgreSQL: { \"consistency\": 5, \"query flexibility\": 5, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 5, \"lock-in\": 5 },\n  DynamoDB:   { \"consistency\": 3, \"query flexibility\": 2, \"operations effort\": 5, \"cost at 10x\": 4, \"team skills\": 2, \"lock-in\": 2 },\n  MongoDB:    { \"consistency\": 3, \"query flexibility\": 4, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 3, \"lock-in\": 4 },\n};\nconst ours = { \"consistency\": 30, \"query flexibility\": 20, \"operations effort\": 15, \"cost at 10x\": 15, \"team skills\": 10, \"lock-in\": 10 };\nconst platform = { \"consistency\": 10, \"query flexibility\": 10, \"operations effort\": 40, \"cost at 10x\": 30, \"team skills\": 5, \"lock-in\": 5 };\n\nfunction ranking(weights) {\n  const totals = Object.entries(scores).map(([option, s]) => [option, Object.entries(weights).reduce((sum, [d, w]) => sum + w * s[d], 0)]);\n  return totals.sort((a, b) => b[1] - a[1]);           // out of 500: weights sum to 100, scores reach 5\n}\n\nfor (const [label, weights] of [[\"our weights\", ours], [\"the platform team's weights\", platform]]) {\n  console.log(`${label}:`, ranking(weights).map(([option, total]) => `${option} ${total}`).join(\" | \"));\n}\nconst best = Object.keys(ours).map(d => [d, Object.keys(scores).reduce((a, b) => (scores[b][d] > scores[a][d] ? b : a))]);\nconsole.log(\"best on each driver:\", best.map(([d, o]) => `${d}: ${o}`).join(\", \"));\n","out":"our weights: PostgreSQL 440 | MongoDB 330 | DynamoDB 305\nthe platform team's weights: DynamoDB 390 | PostgreSQL 360 | MongoDB 315\nbest on each driver: consistency: PostgreSQL, query flexibility: PostgreSQL, operations effort: DynamoDB, cost at 10x: DynamoDB, team skills: PostgreSQL, lock-in: PostgreSQL\n","notes":[[6,"Agree the weights before anyone sees the totals: that's where the real disagreement lives."],[10,"Each total is the sum of weight × score: with weights summing to 100 and scores up to 5, the best possible is 500."],[15,"Same scores, the platform team's weights, and DynamoDB wins: the argument was about priorities, not facts."],[18,"No option is best at everything, and the matrix shows what each choice gives up."]]}]},{"t":"Is it worth finding out more before deciding?","tabs":[{"lang":"python","src":"P_GROWTH = 0.3                                         # chance that traffic grows tenfold within the three years\ncost = {                                               # three-year cost in thousands of dollars: (no growth, growth)\n    \"managed queue\": (120, 900),                       # cheap now, but per-message prices explode with growth\n    \"self-hosted Kafka\": (400, 500),                   # a fixed cluster: dear now, cheap at scale\n    \"managed now, switch if growth comes\": (120, 150 + 250 + 400),   # a year on managed, a migration, then Kafka\n}\n\ndef expected(p_growth):\n    return {option: (1 - p_growth) * low + p_growth * high for option, (low, high) in cost.items()}\n\ndef best(p_growth):\n    return min(expected(p_growth).items(), key=lambda item: item[1])\n\nk = lambda x: int(x + 0.5)                             # whole thousands\nprint(\"expected cost, k$:\", \" | \".join(f\"{o} {k(v)}\" for o, v in expected(P_GROWTH).items()))\nchoice, without = best(P_GROWTH)\nperfect = (1 - P_GROWTH) * min(lo for lo, _ in cost.values()) + P_GROWTH * min(hi for _, hi in cost.values())\nprint(f\"best without more information: {choice} ({k(without)}); with perfect foresight {k(perfect)}, \"\n      f\"so information is worth at most {k(without - perfect)}\")\n\nACCURACY = 0.8                                         # a pilot that predicts growth correctly 80% of the time\np_signal = P_GROWTH * ACCURACY + (1 - P_GROWTH) * (1 - ACCURACY)\nafter_yes = best(P_GROWTH * ACCURACY / p_signal)[1]    # Bayes: the chance of growth after each result\nafter_no = best(P_GROWTH * (1 - ACCURACY) / (1 - p_signal))[1]\nwith_pilot = p_signal * after_yes + (1 - p_signal) * after_no\nprint(f\"with an 80%-accurate pilot {k(with_pilot)}: the pilot is worth up to {k(without - with_pilot)}, \"\n      f\"so run it if it costs less\")\n","out":"expected cost, k$: managed queue 354 | self-hosted Kafka 430 | managed now, switch if growth comes 324\nbest without more information: managed now, switch if growth comes (324); with perfect foresight 234, so information is worth at most 90\nwith an 80%-accurate pilot 291: the pilot is worth up to 33, so run it if it costs less\n","notes":[[5,"The reversible option: start cheap and pay to switch only if growth comes. Keeping a decision reversible is often the best decision."],[17,"Perfect foresight picks the best option in each future; the gap to the best plan without it is the most any information can be worth."],[23,"Bayes' rule: after a 'growth' signal, growth is 63% likely; after a 'no growth' signal, under 10%."],[26,"An imperfect pilot is worth less than perfect information, but still about 33 k$: run it if it costs less than that."]]},{"lang":"javascript","src":"const P_GROWTH = 0.3;                                  // chance that traffic grows tenfold within the three years\nconst cost = {                                         // three-year cost in thousands of dollars: [no growth, growth]\n  \"managed queue\": [120, 900],                         // cheap now, but per-message prices explode with growth\n  \"self-hosted Kafka\": [400, 500],                     // a fixed cluster: dear now, cheap at scale\n  \"managed now, switch if growth comes\": [120, 150 + 250 + 400],   // a year on managed, a migration, then Kafka\n};\n\nconst expected = pGrowth => Object.entries(cost).map(([option, [low, high]]) => [option, (1 - pGrowth) * low + pGrowth * high]);\nconst best = pGrowth => expected(pGrowth).reduce((a, b) => (b[1] < a[1] ? b : a));\nconst k = x => Math.floor(x + 0.5);                    // whole thousands\n\nconsole.log(\"expected cost, k$:\", expected(P_GROWTH).map(([o, v]) => `${o} ${k(v)}`).join(\" | \"));\nconst [choice, without] = best(P_GROWTH);\nconst lows = Object.values(cost).map(([lo]) => lo), highs = Object.values(cost).map(([, hi]) => hi);\nconst perfect = (1 - P_GROWTH) * Math.min(...lows) + P_GROWTH * Math.min(...highs);\nconsole.log(`best without more information: ${choice} (${k(without)}); with perfect foresight ${k(perfect)}, ` +\n            `so information is worth at most ${k(without - perfect)}`);\n\nconst ACCURACY = 0.8;                                  // a pilot that predicts growth correctly 80% of the time\nconst pSignal = P_GROWTH * ACCURACY + (1 - P_GROWTH) * (1 - ACCURACY);\nconst afterYes = best(P_GROWTH * ACCURACY / pSignal)[1];   // Bayes: the chance of growth after each result\nconst afterNo = best(P_GROWTH * (1 - ACCURACY) / (1 - pSignal))[1];\nconst withPilot = pSignal * afterYes + (1 - pSignal) * afterNo;\nconsole.log(`with an 80%-accurate pilot ${k(withPilot)}: the pilot is worth up to ${k(without - withPilot)}, ` +\n            `so run it if it costs less`);\n","out":"expected cost, k$: managed queue 354 | self-hosted Kafka 430 | managed now, switch if growth comes 324\nbest without more information: managed now, switch if growth comes (324); with perfect foresight 234, so information is worth at most 90\nwith an 80%-accurate pilot 291: the pilot is worth up to 33, so run it if it costs less\n","notes":[[5,"The reversible option: start cheap and pay to switch only if growth comes. Keeping a decision reversible is often the best decision."],[15,"Perfect foresight picks the best option in each future; the gap to the best plan without it is the most any information can be worth."],[21,"Bayes' rule: after a 'growth' signal, growth is 63% likely; after a 'no growth' signal, under 10%."],[24,"An imperfect pilot is worth less than perfect information, but still about 33 k$: run it if it costs less than that."]]}]},{"t":"An ADR log: what's in force, what's waiting, what needs a review","tabs":[{"lang":"python","src":"from datetime import date\n\nLOG = \"\"\"\n# ADR-001: Use PostgreSQL for orders\nStatus: superseded\nDate: 2024-03-02\nReview: 2025-03-01\n\n# ADR-004: Publish domain events through an outbox\nStatus: accepted\nDate: 2024-09-14\nReview: 2026-09-01\n\n# ADR-007: Move orders to Aurora PostgreSQL\nStatus: accepted\nSupersedes: ADR-001\nDate: 2025-06-20\nReview: 2026-12-01\n\n# ADR-009: Adopt OpenTelemetry for tracing\nStatus: proposed\nDate: 2026-09-30\n\"\"\"\n\ndef parse(text):\n    adrs = []\n    for block in text.strip().split(\"\\n\\n\"):\n        lines = block.splitlines()\n        number, title = lines[0][2:].split(\": \", 1)  # \"# ADR-007: Move orders ...\"\n        record = {\"id\": number, \"title\": title}\n        for line in lines[1:]:\n            key, value = line.split(\": \", 1)\n            record[key.lower()] = value\n        adrs.append(record)\n    return adrs\n\nadrs, today = parse(LOG), date(2026, 10, 12)\nreplaced = {a[\"supersedes\"]: a[\"id\"] for a in adrs if \"supersedes\" in a}\ncurrent = [a for a in adrs if a[\"status\"] == \"accepted\" and a[\"id\"] not in replaced]\nprint(\"in force:\", \", \".join(f\"{a['id']} {a['title']}\" for a in current))\nfor a in adrs:\n    if a[\"status\"] == \"proposed\":\n        print(f\"waiting for a decision: {a['id']}, open {(today - date.fromisoformat(a['date'])).days} days\")\n    if a in current and date.fromisoformat(a[\"review\"]) < today:\n        print(f\"overdue for review: {a['id']} (due {a['review']})\")\nfor old, new in replaced.items():\n    status = next(a[\"status\"] for a in adrs if a[\"id\"] == old)\n    print(f\"history: {old} -> {new}; {old} marked superseded: {'yes' if status == 'superseded' else 'no, fix it'}\")\n","out":"in force: ADR-004 Publish domain events through an outbox, ADR-007 Move orders to Aurora PostgreSQL\noverdue for review: ADR-004 (due 2026-09-01)\nwaiting for a decision: ADR-009, open 12 days\nhistory: ADR-001 -> ADR-007; ADR-001 marked superseded: yes\n","notes":[[16,"A new ADR supersedes the old one instead of rewriting it, so the history of why stays readable."],[39,"In force means accepted and not superseded by a later record."],[44,"Each decision carries a review date: the moment to check whether its context still holds."],[48,"Supersession is recorded on both sides; a check like this keeps the log honest."]]},{"lang":"javascript","src":"const LOG = `\n# ADR-001: Use PostgreSQL for orders\nStatus: superseded\nDate: 2024-03-02\nReview: 2025-03-01\n\n# ADR-004: Publish domain events through an outbox\nStatus: accepted\nDate: 2024-09-14\nReview: 2026-09-01\n\n# ADR-007: Move orders to Aurora PostgreSQL\nStatus: accepted\nSupersedes: ADR-001\nDate: 2025-06-20\nReview: 2026-12-01\n\n# ADR-009: Adopt OpenTelemetry for tracing\nStatus: proposed\nDate: 2026-09-30\n`;\n\nfunction parse(text) {\n  return text.trim().split(\"\\n\\n\").map(block => {\n    const [head, ...lines] = block.split(\"\\n\");\n    const [id, title] = head.slice(2).split(/: (.*)/s);   // \"# ADR-007: Move orders ...\"\n    const record = { id, title };\n    for (const line of lines) {\n      const [key, value] = line.split(/: (.*)/s);\n      record[key.toLowerCase()] = value;\n    }\n    return record;\n  });\n}\n\nconst adrs = parse(LOG), today = Date.UTC(2026, 9, 12);\nconst days = iso => Math.round((today - Date.parse(iso)) / 86400000);\nconst replaced = new Map(adrs.filter(a => a.supersedes).map(a => [a.supersedes, a.id]));\nconst current = adrs.filter(a => a.status === \"accepted\" && !replaced.has(a.id));\nconsole.log(\"in force:\", current.map(a => `${a.id} ${a.title}`).join(\", \"));\nfor (const a of adrs) {\n  if (a.status === \"proposed\") console.log(`waiting for a decision: ${a.id}, open ${days(a.date)} days`);\n  if (current.includes(a) && a.review < \"2026-10-12\") console.log(`overdue for review: ${a.id} (due ${a.review})`);\n}\nfor (const [old, next] of replaced) {\n  const status = adrs.find(a => a.id === old).status;\n  console.log(`history: ${old} -> ${next}; ${old} marked superseded: ${status === \"superseded\" ? \"yes\" : \"no, fix it\"}`);\n}\n","out":"in force: ADR-004 Publish domain events through an outbox, ADR-007 Move orders to Aurora PostgreSQL\noverdue for review: ADR-004 (due 2026-09-01)\nwaiting for a decision: ADR-009, open 12 days\nhistory: ADR-001 -> ADR-007; ADR-001 marked superseded: yes\n","notes":[[14,"A new ADR supersedes the old one instead of rewriting it, so the history of why stays readable."],[39,"In force means accepted and not superseded by a later record."],[43,"Each decision carries a review date: the moment to check whether its context still holds."],[47,"Supersession is recorded on both sides; a check like this keeps the log honest."]]}]}],"ex":{"q":"A checkout service is proposed with asynchronous replication, a cache and two regions. Four quality-attribute scenarios matter: p99 latency at the peak of at most 300 ms, checkout back within 5 minutes after a region fails, no committed order lost in that failover, and a cost of at most 30 k$ a month. Using a simple model of each choice, find the risks, the sensitivity points and the trade-off points, and say whether any design meets all four.","steps":["Write each scenario as a measurable response, so an option can pass or fail it: 'fast enough' can't be checked; 'p99 at most 300 ms at the peak' can.","Model how each architectural choice moves the responses: synchronous replication adds latency and cost but removes data loss; turning the cache off adds latency and saves money; one region halves the cost and makes recovery an hour long.","Evaluate the proposal: the scenarios it misses are risks. Then change one choice at a time: a change that flips one scenario marks a sensitivity point; a change that fixes one and breaks another marks a trade-off point.","Finally, check every combination. If none passes everything, the decision belongs to the stakeholders: which scenario gives way, or which constraint moves."],"code":{"t":"ATAM-lite: scenarios, risks, sensitivity and trade-off points","tabs":[{"lang":"python","src":"from itertools import product\n\ndef measure(replication, cache, regions):\n    \"\"\"A rough model of the checkout service: the four responses the scenarios care about.\"\"\"\n    latency = 150 + (60 if replication == \"sync\" else 0) + (60 if replication == \"sync\" and regions == 2 else 0)\n    latency += 0 if cache == \"on\" else 170             # every read goes to the database\n    rto = 2 if regions == 2 else 60                    # minutes to restore checkout after a region fails\n    rpo = 0 if replication == \"sync\" else 2            # seconds of committed orders lost in that failover\n    cost = 12 * regions + (4 if cache == \"on\" else 0) + (3 if replication == \"sync\" else 0)   # k$ a month\n    return {\"latency\": latency, \"rto\": rto, \"rpo\": rpo, \"cost\": cost}\n\nSCENARIOS = {                                          # quality-attribute scenarios and their response measures\n    \"peak checkout p99 <= 300 ms\": lambda m: m[\"latency\"] <= 300,\n    \"region outage: back within 5 min\": lambda m: m[\"rto\"] <= 5,\n    \"failover loses no committed order\": lambda m: m[\"rpo\"] == 0,\n    \"runs within 30 k$ a month\": lambda m: m[\"cost\"] <= 30,\n}\nCHOICES = {\"replication\": [\"async\", \"sync\"], \"cache\": [\"on\", \"off\"], \"regions\": [2, 1]}\n\ndef verdicts(design):\n    m = measure(**design)\n    return {name: ok(m) for name, ok in SCENARIOS.items()}\n\ndef analyse(design):\n    base = verdicts(design)\n    risks = [name for name, ok in base.items() if not ok]\n    sensitivity, tradeoffs = [], []\n    for param, values in CHOICES.items():\n        for value in values:\n            if value == design[param]:\n                continue\n            after = verdicts({**design, param: value})\n            gained = [n for n in base if after[n] and not base[n]]\n            lost = [n for n in base if base[n] and not after[n]]\n            if gained and lost:\n                tradeoffs.append(f\"{param}={value}: gains '{gained[0]}', loses '{lost[0]}'\")\n            elif gained or lost:\n                sensitivity.append(f\"{param}={value} flips '{(gained or lost)[0]}'\")\n    return risks, sensitivity, tradeoffs\n\nproposed = {\"replication\": \"async\", \"cache\": \"on\", \"regions\": 2}\nrisks, sensitivity, tradeoffs = analyse(proposed)\nprint(\"risks:\", \"; \".join(risks) or \"none\")\nprint(\"sensitivity points:\", \"; \".join(sensitivity))\nprint(\"trade-off points:\", \"; \".join(tradeoffs))\ndesigns = [dict(zip(CHOICES, combo)) for combo in product(*CHOICES.values())]\nprint(\"designs meeting every scenario:\", sum(all(verdicts(d).values()) for d in designs), \"of\", len(designs))\n","out":"risks: failover loses no committed order\nsensitivity points: cache=off flips 'peak checkout p99 <= 300 ms'; regions=1 flips 'region outage: back within 5 min'\ntrade-off points: replication=sync: gains 'failover loses no committed order', loses 'runs within 30 k$ a month'\ndesigns meeting every scenario: 0 of 8\n"},{"lang":"javascript","src":"function measure({ replication, cache, regions }) {\n  // a rough model of the checkout service: the four responses the scenarios care about\n  let latency = 150 + (replication === \"sync\" ? 60 : 0) + (replication === \"sync\" && regions === 2 ? 60 : 0);\n  latency += cache === \"on\" ? 0 : 170;                 // every read goes to the database\n  const rto = regions === 2 ? 2 : 60;                  // minutes to restore checkout after a region fails\n  const rpo = replication === \"sync\" ? 0 : 2;          // seconds of committed orders lost in that failover\n  const cost = 12 * regions + (cache === \"on\" ? 4 : 0) + (replication === \"sync\" ? 3 : 0);   // k$ a month\n  return { latency, rto, rpo, cost };\n}\n\nconst SCENARIOS = {                                    // quality-attribute scenarios and their response measures\n  \"peak checkout p99 <= 300 ms\": m => m.latency <= 300,\n  \"region outage: back within 5 min\": m => m.rto <= 5,\n  \"failover loses no committed order\": m => m.rpo === 0,\n  \"runs within 30 k$ a month\": m => m.cost <= 30,\n};\nconst CHOICES = { replication: [\"async\", \"sync\"], cache: [\"on\", \"off\"], regions: [2, 1] };\n\nfunction verdicts(design) {\n  const m = measure(design);\n  return Object.fromEntries(Object.entries(SCENARIOS).map(([name, ok]) => [name, ok(m)]));\n}\n\nfunction analyse(design) {\n  const base = verdicts(design);\n  const risks = Object.keys(base).filter(n => !base[n]);\n  const sensitivity = [], tradeoffs = [];\n  for (const [param, values] of Object.entries(CHOICES)) {\n    for (const value of values) {\n      if (value === design[param]) continue;\n      const after = verdicts({ ...design, [param]: value });\n      const gained = Object.keys(base).filter(n => after[n] && !base[n]);\n      const lost = Object.keys(base).filter(n => base[n] && !after[n]);\n      if (gained.length && lost.length) tradeoffs.push(`${param}=${value}: gains '${gained[0]}', loses '${lost[0]}'`);\n      else if (gained.length || lost.length) sensitivity.push(`${param}=${value} flips '${(gained.length ? gained : lost)[0]}'`);\n    }\n  }\n  return [risks, sensitivity, tradeoffs];\n}\n\nconst proposed = { replication: \"async\", cache: \"on\", regions: 2 };\nconst [risks, sensitivity, tradeoffs] = analyse(proposed);\nconsole.log(\"risks:\", risks.join(\"; \") || \"none\");\nconsole.log(\"sensitivity points:\", sensitivity.join(\"; \"));\nconsole.log(\"trade-off points:\", tradeoffs.join(\"; \"));\nconst designs = Object.entries(CHOICES).reduce((acc, [param, values]) => acc.flatMap(d => values.map(v => ({ ...d, [param]: v }))), [{}]);\nconsole.log(\"designs meeting every scenario:\", designs.filter(d => Object.values(verdicts(d)).every(Boolean)).length, \"of\", designs.length);\n","out":"risks: failover loses no committed order\nsensitivity points: cache=off flips 'peak checkout p99 <= 300 ms'; regions=1 flips 'region outage: back within 5 min'\ntrade-off points: replication=sync: gains 'failover loses no committed order', loses 'runs within 30 k$ a month'\ndesigns meeting every scenario: 0 of 8\n"}]},"a":"The proposal misses one scenario: with asynchronous replication a regional failover loses about 2 seconds of committed orders, so that's the risk. The cache is a sensitivity point (without it, latency breaks its 300 ms budget) and so is the number of regions (one region turns a 2-minute recovery into an hour). Replication is the trade-off point: synchronous replication saves every order but pushes the cost to 31 k$, past the budget. No combination meets all four scenarios, so this isn't an engineering call: the stakeholders must either raise the budget by about 3 k$ a month or accept 2 seconds of exposure, and the ADR should record which, and why."},"fade":{"q":"Finish `smallest_flip(weights, scores, driver)`: the smallest change to one driver's weight, with the other weights fixed, that changes the winning option. Return (change, new winner), or None if nothing within `limit` points does it.","steps":["Compute today's winner once. Then try changes of growing size, +1, −1, +2, −2 and so on, skipping weights that would go below zero.",{"ask":"Why search outward from zero rather than scanning every weight?","a":"The question is how close the decision is to flipping. The first change that flips it is the answer, so searching by size stops as early as possible."},{"ask":"What do you do with the result?","a":"A winner that flips with a few points of weight is fragile: get evidence before deciding, such as a spike or a benchmark on the driver concerned. A winner that survives large changes can be decided now and recorded."},{"ask":"What does it cost?","a":"Up to 2 × limit re-scorings of every option, each O(options × drivers): trivial for a decision matrix, and cheap enough to run for every driver."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def total(weights, option_scores):\n    return sum(w * option_scores[d] for d, w in weights.items())\n\ndef winner(weights, scores):\n    return max(scores, key=lambda o: (total(weights, scores[o]), o))   # ties broken by name, the same every time\n\ndef smallest_flip(weights, scores, driver, limit=100):\n    \"\"\"The smallest change to one driver's weight (the others fixed) that changes the winner, or None.\"\"\"\n    now = winner(weights, scores)\n    ...                                            # TODO: try +1, -1, +2, -2 ... up to limit\n    return None\n"},{"lang":"javascript","src":"const total = (weights, optionScores) => Object.entries(weights).reduce((sum, [d, w]) => sum + w * optionScores[d], 0);\n\nfunction winner(weights, scores) {                     // ties broken by name, the same every time\n  return Object.keys(scores).reduce((a, b) => {\n    const ta = total(weights, scores[a]), tb = total(weights, scores[b]);\n    return tb > ta || (tb === ta && b > a) ? b : a;\n  });\n}\n\nfunction smallestFlip(weights, scores, driver, limit = 100) {\n  // the smallest change to one driver's weight (the others fixed) that changes the winner, or null\n  const now = winner(weights, scores);\n  // TODO: try +1, -1, +2, -2 ... up to limit\n  return null;\n}\n"}]},"solution":{"t":"Solution: search outward from today's weight","tabs":[{"lang":"python","src":"def total(weights, option_scores):\n    return sum(w * option_scores[d] for d, w in weights.items())\n\ndef winner(weights, scores):\n    return max(scores, key=lambda o: (total(weights, scores[o]), o))   # ties broken by name, the same every time\n\ndef smallest_flip(weights, scores, driver, limit=100):\n    \"\"\"The smallest change to one driver's weight (the others fixed) that changes the winner, or None.\"\"\"\n    now = winner(weights, scores)\n    for size in range(1, limit + 1):\n        for delta in (size, -size):                    # try +n before -n at each size\n            w = weights[driver] + delta\n            if w < 0:\n                continue\n            other = winner({**weights, driver: w}, scores)\n            if other != now:\n                return delta, other\n    return None\n\nscores = {\n    \"PostgreSQL\": {\"consistency\": 5, \"query flexibility\": 5, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 5, \"lock-in\": 5},\n    \"DynamoDB\": {\"consistency\": 3, \"query flexibility\": 2, \"operations effort\": 5, \"cost at 10x\": 4, \"team skills\": 2, \"lock-in\": 2},\n    \"MongoDB\": {\"consistency\": 3, \"query flexibility\": 4, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 3, \"lock-in\": 4},\n}\nours = {\"consistency\": 30, \"query flexibility\": 20, \"operations effort\": 15, \"cost at 10x\": 15, \"team skills\": 10, \"lock-in\": 10}\nplatform = {\"consistency\": 10, \"query flexibility\": 10, \"operations effort\": 40, \"cost at 10x\": 30, \"team skills\": 5, \"lock-in\": 5}\nfor label, weights in ((\"our weights\", ours), (\"the platform team's weights\", platform)):\n    flips = sorted((abs(f[0]), d, f) for d in weights if (f := smallest_flip(weights, scores, d)))\n    _, driver, (delta, other) = flips[0]\n    print(f\"{label}: {winner(weights, scores)} wins; the smallest flip is {driver} {delta:+d} points, and {other} wins\")\n","out":"our weights: PostgreSQL wins; the smallest flip is operations effort +68 points, and DynamoDB wins\nthe platform team's weights: DynamoDB wins; the smallest flip is lock-in +10 points, and PostgreSQL wins\n"},{"lang":"javascript","src":"const total = (weights, optionScores) => Object.entries(weights).reduce((sum, [d, w]) => sum + w * optionScores[d], 0);\n\nfunction winner(weights, scores) {                     // ties broken by name, the same every time\n  return Object.keys(scores).reduce((a, b) => {\n    const ta = total(weights, scores[a]), tb = total(weights, scores[b]);\n    return tb > ta || (tb === ta && b > a) ? b : a;\n  });\n}\n\nfunction smallestFlip(weights, scores, driver, limit = 100) {\n  // the smallest change to one driver's weight (the others fixed) that changes the winner, or null\n  const now = winner(weights, scores);\n  for (let size = 1; size <= limit; size++) {\n    for (const delta of [size, -size]) {               // try +n before -n at each size\n      const w = weights[driver] + delta;\n      if (w < 0) continue;\n      const other = winner({ ...weights, [driver]: w }, scores);\n      if (other !== now) return [delta, other];\n    }\n  }\n  return null;\n}\n\nconst scores = {\n  PostgreSQL: { \"consistency\": 5, \"query flexibility\": 5, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 5, \"lock-in\": 5 },\n  DynamoDB: { \"consistency\": 3, \"query flexibility\": 2, \"operations effort\": 5, \"cost at 10x\": 4, \"team skills\": 2, \"lock-in\": 2 },\n  MongoDB: { \"consistency\": 3, \"query flexibility\": 4, \"operations effort\": 3, \"cost at 10x\": 3, \"team skills\": 3, \"lock-in\": 4 },\n};\nconst ours = { \"consistency\": 30, \"query flexibility\": 20, \"operations effort\": 15, \"cost at 10x\": 15, \"team skills\": 10, \"lock-in\": 10 };\nconst platform = { \"consistency\": 10, \"query flexibility\": 10, \"operations effort\": 40, \"cost at 10x\": 30, \"team skills\": 5, \"lock-in\": 5 };\nfor (const [label, weights] of [[\"our weights\", ours], [\"the platform team's weights\", platform]]) {\n  const flips = Object.keys(weights).map(d => [d, smallestFlip(weights, scores, d)]).filter(([, f]) => f)\n    .sort((a, b) => Math.abs(a[1][0]) - Math.abs(b[1][0]) || (a[0] < b[0] ? -1 : 1));\n  const [driver, [delta, other]] = flips[0];\n  console.log(`${label}: ${winner(weights, scores)} wins; the smallest flip is ${driver} ${delta > 0 ? \"+\" : \"\"}${delta} points, and ${other} wins`);\n}\n","out":"our weights: PostgreSQL wins; the smallest flip is operations effort +68 points, and DynamoDB wins\nthe platform team's weights: DynamoDB wins; the smallest flip is lock-in +10 points, and PostgreSQL wins\n"}]}},"traps":[["“We'll decide once we have all the facts.”","You never will. Decide at the last responsible moment, when waiting starts to cost more than it teaches, and buy cheap information (spikes, prototypes) in the meantime."],["“The decision matrix chose it.”","The weights chose it, and weights are opinions. Agree them first, show how sensitive the winner is, and get evidence where it's fragile."],["“We'll write the ADR afterwards, for the documentation.”","Written later, it becomes a justification: the options that were rejected, and why, are forgotten. Write it while deciding, and let it shape the discussion."],["“Every decision should go through the architecture review board.”","That turns the board into a queue and teams into ticket writers. Let teams make two-way-door decisions themselves; save reviews for one-way doors and cross-team impact."],["“Update the old ADR when the decision changes.”","Rewriting history hides why things were done. Write a new ADR that supersedes the old one, and mark the old one superseded."],["“A good architecture is one that meets today's requirements.”","Requirements change. Treat modifiability and reversibility as drivers in their own right, and prefer designs that keep options open where it's cheap."]],"disc":[["Every change in your organisation waits two weeks for an architecture review board. How would you change that without losing the oversight?","Publish the principles and the decisions that already exist (ADRs, a technology radar), let teams decide two-way doors themselves with a lightweight ADR, and keep the board for one-way doors and cross-team impact. Make reviews advisory and fast: a weekly slot, a written proposal, a decision within days. Track the lead time of decisions as a metric, and run occasional retrospective reviews of decisions already made to see whether the guidance works."],["Two senior engineers disagree strongly about event sourcing for a billing system. How do you run the decision?","Separate the people from the positions: agree the drivers and their weights first (auditability, query patterns, team experience, operational load, time to market), then have each side write the strongest case for the other option. Score both, find the sensitivity points, and if the result is fragile run a short spike on the riskiest assumption. Decide by a set date, record the ADR with the dissent and the review triggers, and commit together."]],"teach":{"prompt":"Explain to a junior colleague how you'd make and record an important architecture decision.","rubric":["Frame the question, its owner and its deadline","Agree the drivers and weights before comparing options","At least three options, scenarios or a matrix, and a sensitivity check","Reversibility decides how much process; the value of information decides whether to spike","An ADR with context, decision and consequences, plus fitness functions and review triggers"],"model":"I start by framing the question: what exactly are we deciding, who owns it and when it must be decided. Then I agree with the people affected what matters most, the quality attributes and how much each counts, before anyone compares technologies, because most arguments are really about priorities. I look at at least three options, including doing nothing, and either score them against the weighted drivers or walk them through concrete scenarios with response measures. I check how fragile the result is: if a small change in a weight flips it, I buy evidence with a spike first. How reversible the decision is sets how much of this I do. Then I write an ADR with the context, the decision and its consequences, add fitness functions that keep it true, and note what would make us revisit it."},"qa":[["What are the classic sections of an ADR?","Title, status, context, decision and consequences."],["What do you do when an accepted ADR turns out to be wrong?","Write a new ADR that supersedes it, and mark the old one superseded."],["What is a sensitivity point?","A parameter that strongly affects one quality attribute."],["What is a trade-off point?","A parameter that improves one quality attribute while worsening another."],["How should a two-way-door decision be made?","Quickly, by the team that owns it, treated as an experiment."],["What is information worth before a decision?","At most the expected cost it would save, the gap between deciding now and deciding with it."]],"quiz":[{"q":"What does this print?","snip":{"t":"Two options in a weighted matrix","tabs":[{"lang":"python","src":"weights = {\"latency\": 50, \"cost\": 30, \"skills\": 20}\na = {\"latency\": 5, \"cost\": 2, \"skills\": 4}\nb = {\"latency\": 3, \"cost\": 5, \"skills\": 3}\nprint(*(sum(w * opt[d] for d, w in weights.items()) for opt in (a, b)))\n"},{"lang":"javascript","src":"const weights = { latency: 50, cost: 30, skills: 20 };\nconst a = { latency: 5, cost: 2, skills: 4 }, b = { latency: 3, cost: 5, skills: 3 };\nconsole.log(...[a, b].map(opt => Object.entries(weights).reduce((s, [d, w]) => s + w * opt[d], 0)));\n"}]},"o":["390 360","360 390","11 11","390 300"],"a":0,"e":"A scores 250 + 60 + 80 = 390 and B scores 150 + 150 + 60 = 360. Shift 10 points of weight from latency to cost and B wins, so this is close enough to deserve a sensitivity check."},{"q":"What does this print?","snip":{"t":"Expected cost over two futures (probabilities in percent)","tabs":[{"lang":"python","src":"p, managed, kafka = 30, (120, 900), (400, 500)\nprint(*((100 - p) * lo // 100 + p * hi // 100 for lo, hi in (managed, kafka)))\n"},{"lang":"javascript","src":"const p = 30, managed = [120, 900], kafka = [400, 500];\nconsole.log(...[managed, kafka].map(([lo, hi]) => Math.floor((100 - p) * lo / 100) + Math.floor(p * hi / 100)));\n"}]},"o":["354 430","430 354","510 900","120 400"],"a":0,"e":"0.7 × 120 + 0.3 × 900 = 84 + 270 = 354, and 0.7 × 400 + 0.3 × 500 = 280 + 150 = 430. The cheap option wins on average while carrying a big risk in the growth case: the reversible middle path was cheaper still."},{"q":"Which decision is most clearly a one-way door?","o":["Choosing the database that will hold every customer's orders across twelve services","Choosing a logging library for one service","The default value of a feature flag","The colour of the status dashboard"],"a":0,"e":"A shared primary database is expensive to undo: data migrations, every service's queries and the team's skills depend on it. The others can be changed within a sprint."},{"q":"An accepted ADR from last year turns out to be wrong. What should the team do?","o":["Write a new ADR that supersedes it, explain what changed, and mark the old one superseded","Edit the old ADR so it describes the current decision","Delete the old ADR","Leave both as they are"],"a":0,"e":"ADRs are a history of reasoning. Superseding keeps that history and points readers to the current decision."},{"q":"What belongs in an ADR? (choose 3)","t":"ms","o":["The context: the forces and constraints at the time","The decision, stated plainly","The consequences: what gets easier, what gets harder","A transcript of every meeting about it","The full implementation code"],"a":[0,1,2],"e":"Nygard's format is title, status, context, decision and consequences, kept to a page or two; MADR adds drivers and options. Transcripts and code belong elsewhere."},{"q":"Judge each statement.","t":"yn","s":[["A trade-off point is a parameter that helps one quality attribute and hurts another.",true],["A winner that flips when one weight changes by a few points should be decided without further evidence.",false],["Making a decision reversible, for example with an interface in front of a vendor, can be worth paying for.",true],["The value of perfect information is the cost of the best option.",false]],"e":"Fragile winners need evidence. Reversibility has value because it lets you switch when the future arrives. The value of information is the gap between the best expected cost without it and with it."},{"q":"Put the steps of a significant architecture decision in order.","t":"ord","items":["Frame the question, its owner and its deadline","Agree the decision drivers and their weights","Develop at least three options, including doing nothing","Analyse them with scenarios or a weighted matrix, and check sensitivity","Decide, write the ADR, and add fitness functions and review triggers"],"e":"Drivers come before options so the comparison is fair, and the record and its checks come last, when there's something to keep true."},{"q":"Complete the Python function that lists the ADRs currently in force.","t":"drop","lang":"python","code":"def in_force(adrs):\n    replaced = {a[\"supersedes\"] for a in adrs if a.get(\"supersedes\")}\n    return [a[\"id\"] for a in adrs if a[\"status\"] == {{0}} and a[\"id\"] not in {{1}}]\n","blanks":[{"o":["'accepted'","'proposed'","'superseded'","None"],"a":0},{"o":["replaced","adrs","set()","a"],"a":0}],"e":"A decision is in force when it was accepted and no later ADR supersedes it, even if someone forgot to update the old record's status."}],"probs":[["Reading · Documenting Architecture Decisions (Nygard, 2011)","https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions","","write ADRs for two decisions your team made this year, in this format"],["Reference · MADR: Markdown Architectural Decision Records","https://adr.github.io/madr/","","compare MADR's template with Nygard's, and pick one for your repository"],["Reading · ATAM: Method for Architecture Evaluation (SEI)","https://www.sei.cmu.edu/library/atam-method-for-architecture-evaluation/","","build a small utility tree of quality-attribute scenarios for a system you know"],["Reading · Amazon's 2015 letter to shareholders (Type 1 and Type 2 decisions)","https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm","","classify five recent decisions in your team as one-way or two-way doors, and say whether the process matched"]],"src":[["Michael Nygard: Documenting Architecture Decisions (2011)","https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions"],["MADR: Markdown Architectural Decision Records","https://adr.github.io/madr/"],["Software Engineering Institute: ATAM, Method for Architecture Evaluation","https://www.sei.cmu.edu/library/atam-method-for-architecture-evaluation/"],["Amazon.com 2015 letter to shareholders (SEC filing, exhibit 99.1)","https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm"],["Thoughtworks Technology Radar: Lightweight Architecture Decision Records","https://www.thoughtworks.com/radar/techniques/lightweight-architecture-decision-records"]]},{"id":"m02","d":"d1","t":"Well-architected frameworks: the pillars, reviews and trade-offs","min":115,"hook":"The cloud providers' well-architected frameworks distil thousands of architecture reviews into a set of pillars and questions: six pillars for AWS, five for Azure. Their real value isn't the checklist but the habit it builds: review every important workload against every pillar, find the high-risk issues, fix them in a sensible order, and trade the pillars off on purpose (reliability against cost, security against speed) with numbers the business agrees with.","pre":{"q":"An online shop runs in one availability zone and loses about $300 for every minute it's down. A colleague proposes going straight to two regions, active-active, 'to be safe'. How would you decide?","a":"Put a price on both sides. Expected downtime per month times $300 is the cost of unavailability; the extra infrastructure is the cost of reliability. For a shop at that loss rate, three zones in one region usually cut downtime from hours to tens of minutes for less than twice the cost, while two active-active regions cost far more and save only a few more minutes. Reliability is a business decision with a price, not a default to maximise."},"kid":{"t":"The mechanic's checklist","x":"Luigi's mechanic friend checks the family car before every long trip with the same six-part list: will it get there, is it locked and safe, what will fuel and tolls cost, does everyone know who drives when and what to do in a breakdown, will it climb the hills fully loaded, and how much fuel does it waste idling. The list doesn't fix anything itself; it finds the worst problems first. A bigger engine helps on the hills but burns more fuel, so they choose deliberately. And they check again before every trip, not just once.","map":[["The same six-part list before every trip","A well-architected review: the same pillar questions for every workload"],["Finding the worst problems first","High-risk issues, then an improvement plan in priority order"],["A bigger engine helps on hills but burns fuel","Pillar trade-offs, such as reliability against cost, made deliberately"],["Checking again before every trip","Reviews repeated at milestones, with automated guardrails in between"]],"brk":"The mechanic's list is the same for every car. Real reviews add lenses for the kind of workload (serverless, SaaS, machine learning), and need the business's numbers: a checklist can't tell you what a minute of downtime costs."},"keys":["**The frameworks**: the AWS Well-Architected Framework has six pillars: operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. Microsoft's Azure Well-Architected Framework has five: reliability, security, cost optimization, operational excellence and performance efficiency, with sustainability covered in separate guidance. Both are distilled from many customer reviews and come with review tools.","**The review**: the team answers each pillar's questions for one workload; answers that miss best practices become high- or medium-risk issues (HRIs and MRIs); the output is an improvement plan, and the review is repeated at milestones. AWS's Well-Architected Tool records answers, risks and milestones. It's a conversation that surfaces risk, not an audit to pass.","**Reliability**: AWS's design principles are to recover from failure automatically, test recovery procedures, scale horizontally to raise aggregate availability, stop guessing capacity, and manage change through automation. Set the availability target from what downtime costs the business, not by default.","**Security and operational excellence**: a strong identity foundation with least privilege, traceability, security at every layer, data protected in transit and at rest, and preparation for incidents. Operations as code, small frequent reversible changes, anticipating failure with game days, and learning from every incident.","**Performance, cost and sustainability**: choose resource types and sizes from measurements and prefer managed services; pay for what you use, measure efficiency, and attribute every cost with tags; maximise utilisation, scale with demand and remove idle resources, which serves both the bill and the carbon footprint.","**Trade-offs between pillars**: more replicas raise reliability and cost; encryption and inspection cost some performance; shipping faster can raise operational risk. Azure publishes a trade-offs page for each pillar. The architect's job is to choose with the business, using numbers such as the cost of a minute of downtime.","**Lenses**: in the AWS Well-Architected Tool a lens is a set of questions and best practices for a kind of workload or industry, such as serverless, SaaS or machine learning. Use the general framework plus the lenses that fit.","**From review to guardrails**: findings become a backlog ordered by risk removed
