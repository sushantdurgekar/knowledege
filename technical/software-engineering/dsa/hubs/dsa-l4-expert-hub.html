west?\n    (m1, c1), (m2, c2), (m3, c3) = l1, l2, l3\n    return (c3 - c1) * (m1 - m2) <= (c2 - c1) * (m1 - m3)   # l3 overtakes l1 no later than l2 does\n\nclass MonotoneCHT:                              # minimum of lines; slopes added in decreasing order, queries rising\n    def __init__(self):\n        self.q = deque()\n\n    def add(self, m, c):\n        if self.q and self.q[-1][0] == m:       # same slope: keep only the lower line\n            if self.q[-1][1] <= c:\n                return\n            self.q.pop()\n        while len(self.q) >= 2 and bad(self.q[-2], self.q[-1], (m, c)):\n            self.q.pop()\n        self.q.append((m, c))\n\n    def query(self, x):                         # x must not decrease between calls\n        q = self.q\n        while len(q) >= 2 and q[1][0] * x + q[1][1] <= q[0][0] * x + q[0][1]:\n            q.popleft()                         # the front line will never be lowest again\n        return q[0][0] * x + q[0][1]\n"},{"lang":"javascript","src":"const bad = ([m1, c1], [m2, c2], [m3, c3]) => (c3 - c1) * (m1 - m2) <= (c2 - c1) * (m1 - m3);   // slopes m1 > m2 > m3\n\nclass MonotoneCHT {                             // minimum of lines; slopes added in decreasing order, queries rising\n  constructor() { this.q = []; this.head = 0; } // an array used as a deque; every value is a BigInt\n  add(m, c) {\n    const q = this.q;\n    if (q.length > this.head && q[q.length - 1][0] === m) {   // same slope: keep only the lower line\n      if (q[q.length - 1][1] <= c) return;\n      q.pop();\n    }\n    while (q.length - this.head >= 2 && bad(q[q.length - 2], q[q.length - 1], [m, c])) q.pop();\n    q.push([m, c]);\n  }\n  query(x) {                                    // x must not decrease between calls\n    const q = this.q, val = L => L[0] * x + L[1];\n    while (q.length - this.head >= 2 && val(q[this.head + 1]) <= val(q[this.head])) this.head++;   // never lowest again\n    return val(q[this.head]);\n  }\n}\n"}]},{"t":"The monotone convex hull trick on CSES 2084 (Monster Game I)","tabs":[{"lang":"python","src":"def monster_game(x, s, f):                    # CSES 2084: s rises, and x >= f[0] >= f[1] >= ...\n    cht = MonotoneCHT()\n    cht.add(x, 0)                             # the start: skill x and no time spent yet\n    for i in range(len(s)):\n        best = cht.query(s[i])                # min over the last kill j of time[j] + s[i] * f[j]\n        if i == len(s) - 1:\n            return best                       # the last monster must be killed\n        cht.add(f[i], best)                   # killing monster i adds a line with slope f[i]\n\nprint(monster_game(100, [20, 30, 30, 50, 90], [90, 60, 20, 20, 10]))\n","out":"4800","notes":[[3,"The start is a line too: slope x, height 0. Every later line has a smaller or equal slope f[i]."],[5,"Queries s[i] never decrease, so a front line that has been overtaken can be dropped for good."],[8,"Each monster's best time becomes the height of a new line: the DP feeds the hull as it goes."],[10,"Kill monster 3 (30 × 100 = 3000), then monster 5 (90 × 20 = 1800): 4800."]]},{"lang":"javascript","src":"function monsterGame(x, s, f) {               // CSES 2084: s rises, and x >= f[0] >= f[1] >= ...; BigInt throughout\n  const cht = new MonotoneCHT();\n  cht.add(BigInt(x), 0n);                     // the start: skill x and no time spent yet\n  for (let i = 0; i < s.length; i++) {\n    const best = cht.query(BigInt(s[i]));     // min over the last kill j of time[j] + s[i] * f[j]\n    if (i === s.length - 1) return best;      // the last monster must be killed\n    cht.add(BigInt(f[i]), best);              // killing monster i adds a line with slope f[i]\n  }\n}\n\nconsole.log(String(monsterGame(100, [20, 30, 30, 50, 90], [90, 60, 20, 20, 10])));\n","out":"4800","notes":[[3,"The start is a line too: slope x, height 0. Every later line has a smaller or equal slope f[i]."],[5,"Queries s[i] never decrease, so a front line that has been overtaken can be dropped for good."],[7,"Each monster's best time becomes the height of a new line: the DP feeds the hull as it goes."],[11,"Kill monster 3 (30 × 100 = 3000), then monster 5 (90 × 20 = 1800): 4800."]]}]},{"t":"A Li Chao tree: lines in any order, queries anywhere","tabs":[{"lang":"python","src":"class LiChao:                                 # minimum of lines at integer x in [lo, hi], lines in any order\n    def __init__(self, lo, hi):\n        self.lo, self.hi, self.node = lo, hi, {}   # node i covers a range; its children are 2i and 2i + 1\n\n    def add(self, m, c):\n        line, i, lo, hi = (m, c), 1, self.lo, self.hi\n        at = lambda L, x: L[0] * x + L[1]\n        while True:\n            cur = self.node.get(i)\n            if cur is None:\n                self.node[i] = line\n                return\n            mid = (lo + hi) // 2\n            if at(line, mid) < at(cur, mid):  # the node keeps whichever line is lower at mid\n                self.node[i], line, cur = line, cur, line\n            if lo == hi:\n                return\n            if at(line, lo) < at(cur, lo):    # the other line can only still win on one side\n                i, hi = 2 * i, mid\n            elif at(line, hi) < at(cur, hi):\n                i, lo = 2 * i + 1, mid + 1\n            else:\n                return\n\n    def query(self, x):                       # walk from the root towards x: O(log(hi - lo))\n        i, lo, hi, best = 1, self.lo, self.hi, None\n        while i in self.node:\n            m, c = self.node[i]\n            best = m * x + c if best is None else min(best, m * x + c)\n            if lo == hi:\n                break\n            mid = (lo + hi) // 2\n            i, lo, hi = (2 * i, lo, mid) if x <= mid else (2 * i + 1, mid + 1, hi)\n        return best\n\nlc = LiChao(-10, 10)\nlines, xs = [(2, 3), (-1, 10), (0, 5), (3, -4), (-2, 20)], [-3, 0, 2, 5, 7]\nfor m, c in lines[:2]:\n    lc.add(m, c)\nprint(*(lc.query(x) for x in xs))\nfor m, c in lines[2:]:\n    lc.add(m, c)\nprint(*(lc.query(x) for x in xs))\n","out":"-3 3 7 5 3\n-13 -4 2 5 3\n","notes":[[14,"Whichever line is lower at the midpoint stays in this node; the other one is the candidate to push down."],[18,"Two lines cross at most once. If the pushed line is lower at the left end, the crossing is in the left half, so only that half can need it."],[25,"A query checks one node per level on the way to x, and the best line for x is on that path."],[43,"After all five lines, 3x − 4 is lowest at small x and 20 − 2x takes over on the right."]]},{"lang":"javascript","src":"class LiChao {                                // minimum of lines at integer x in [lo, hi], lines in any order\n  constructor(lo, hi) { this.lo = lo; this.hi = hi; this.node = new Map(); }   // lines are [m, c] BigInt pairs\n  add(m, c) {\n    let line = [m, c], i = 1, lo = this.lo, hi = this.hi;\n    const at = (L, x) => L[0] * BigInt(x) + L[1];\n    for (;;) {\n      let cur = this.node.get(i);\n      if (cur === undefined) { this.node.set(i, line); return; }\n      const mid = Math.floor((lo + hi) / 2);\n      if (at(line, mid) < at(cur, mid)) { this.node.set(i, line); [line, cur] = [cur, line]; }   // keep the lower at mid\n      if (lo === hi) return;\n      if (at(line, lo) < at(cur, lo)) { i = 2 * i; hi = mid; }   // the other line can only still win on one side\n      else if (at(line, hi) < at(cur, hi)) { i = 2 * i + 1; lo = mid + 1; }\n      else return;\n    }\n  }\n  query(x) {                                  // walk from the root towards x: O(log(hi - lo))\n    let i = 1, lo = this.lo, hi = this.hi, best = null;\n    while (this.node.has(i)) {\n      const [m, c] = this.node.get(i), v = m * BigInt(x) + c;\n      if (best === null || v < best) best = v;\n      if (lo === hi) break;\n      const mid = Math.floor((lo + hi) / 2);\n      if (x <= mid) { i = 2 * i; hi = mid; } else { i = 2 * i + 1; lo = mid + 1; }\n    }\n    return best;\n  }\n}\n\nconst lc = new LiChao(-10, 10);\nconst lines = [[2, 3], [-1, 10], [0, 5], [3, -4], [-2, 20]], xs = [-3, 0, 2, 5, 7];\nfor (const [m, c] of lines.slice(0, 2)) lc.add(BigInt(m), BigInt(c));\nconsole.log(...xs.map(x => String(lc.query(x))));\nfor (const [m, c] of lines.slice(2)) lc.add(BigInt(m), BigInt(c));\nconsole.log(...xs.map(x => String(lc.query(x))));\n","out":"-3 3 7 5 3\n-13 -4 2 5 3\n","notes":[[10,"Whichever line is lower at the midpoint stays in this node; the other one is the candidate to push down."],[12,"Two lines cross at most once. If the pushed line is lower at the left end, the crossing is in the left half, so only that half can need it."],[17,"A query checks one node per level on the way to x, and the best line for x is on that path."],[35,"After all five lines, 3x − 4 is lowest at small x and 20 − 2x takes over on the right."]]}]},{"t":"SOS DP: subset and superset counts for every mask (CSES 1654)","tabs":[{"lang":"python","src":"def sos_counts(values, bits):                 # per mask: how many values are subsets of it, and supersets\n    sub = [0] * (1 << bits)\n    for v in values:\n        sub[v] += 1\n    sup = sub[:]\n    for b in range(bits):                     # one bit at a time: O(2^bits * bits)\n        for mask in range(1 << bits):\n            if mask >> b & 1:\n                sub[mask] += sub[mask ^ (1 << b)]   # the subsets of mask that lack bit b\n            else:\n                sup[mask] += sup[mask | (1 << b)]   # the supersets of mask that have bit b\n    return sub, sup\n\nvals = [3, 7, 2, 9, 2]                        # CSES 1654's sample\nsub, sup = sos_counts(vals, 4)\nfull = (1 << 4) - 1\nfor x in vals:                                # y inside x, y containing x, y sharing a bit with x\n    print(sub[x], sup[x], len(vals) - sub[full ^ x])\n","out":"3 2 5\n4 1 5\n2 4 4\n1 1 3\n2 4 4\n","notes":[[9,"After the passes for bits 0..b, sub[mask] counts the values that match mask outside those bits and fit inside it on them."],[11,"Supersets run the same loop the other way: a mask without bit b collects the counts of the mask with it."],[18,"x and y share a bit unless y fits inside the complement of x, so subtract those from n."]]},{"lang":"javascript","src":"function sosCounts(values, bits) {            // per mask: how many values are subsets of it, and supersets\n  const sub = new Array(1 << bits).fill(0);\n  for (const v of values) sub[v]++;\n  const sup = [...sub];\n  for (let b = 0; b < bits; b++) {            // one bit at a time: O(2^bits * bits)\n    for (let mask = 0; mask < 1 << bits; mask++) {\n      if ((mask >> b) & 1) sub[mask] += sub[mask ^ (1 << b)];   // the subsets of mask that lack bit b\n      else sup[mask] += sup[mask | (1 << b)];  // the supersets of mask that have bit b\n    }\n  }\n  return [sub, sup];\n}\n\nconst vals = [3, 7, 2, 9, 2];                 // CSES 1654's sample\nconst [sub, sup] = sosCounts(vals, 4), full = (1 << 4) - 1;\nfor (const x of vals) console.log(sub[x], sup[x], vals.length - sub[full ^ x]);   // inside x, containing x, sharing a bit\n","out":"3 2 5\n4 1 5\n2 4 4\n1 1 3\n2 4 4\n","notes":[[7,"After the passes for bits 0..b, sub[mask] counts the values that match mask outside those bits and fit inside it on them."],[8,"Supersets run the same loop the other way: a mask without bit b collects the counts of the mask with it."],[16,"x and y share a bit unless y fits inside the complement of x, so subtract those from n."]]}]}],"ex":{"q":"Split an array of n positive numbers into k contiguous parts so that the sum of the squares of the parts' sums is as small as possible (n ≤ 3000). (CSES 2086, Subarray Squares)","steps":["With prefix sums P, dp_c[i] = min over j < i of dp_(c−1)[j] + (P[i] − P[j])²: the best way to cut the first i numbers into c parts. Done plainly, that's O(k n²), about 2.7 × 10¹⁰ steps.","For positive numbers, the best last cut j never moves left as i grows: a longer prefix never wants a shorter last part. So the best j's of one layer are sorted.","Divide and conquer: find the middle i's best j by scanning its allowed window, then the left half only needs j up to that point and the right half only from it. Each recursion level scans O(n) values in total, and there are O(log n) levels.","O(k n log n) time and O(n) space per layer. A convex hull trick also works here, since the cost expands into lines in P[j]."],"code":{"t":"Divide and conquer optimisation, one layer at a time","tabs":[{"lang":"python","src":"def subarray_squares(a, k):                   # CSES 2086: k parts, least sum of squared part sums\n    n = len(a)\n    P = [0] * (n + 1)\n    for i, v in enumerate(a):\n        P[i + 1] = P[i] + v\n    INF = float(\"inf\")\n    prev = [0] + [INF] * n                    # 0 parts: only the empty prefix costs nothing\n    for _ in range(k):\n        cur = [INF] * (n + 1)\n        stack = [(1, n, 0, n - 1)]            # fill cur[lo..hi], knowing their best j lies in [opt_lo, opt_hi]\n        while stack:\n            lo, hi, opt_lo, opt_hi = stack.pop()\n            if lo > hi:\n                continue\n            mid = (lo + hi) // 2\n            best, arg = INF, opt_lo\n            for j in range(opt_lo, min(mid - 1, opt_hi) + 1):\n                v = prev[j] + (P[mid] - P[j]) ** 2\n                if v < best:\n                    best, arg = v, j\n            cur[mid] = best\n            stack += [(lo, mid - 1, opt_lo, arg), (mid + 1, hi, arg, opt_hi)]   # the best j only moves right\n        prev = cur\n    return prev[n]\n\nprint(subarray_squares([2, 3, 1, 2, 2, 3, 4, 1], 3), subarray_squares([5, 5, 5, 5], 2), subarray_squares([1] * 2000, 10))\n","out":"110 200 400000"},{"lang":"javascript","src":"function subarraySquares(a, k) {              // CSES 2086; BigInt, since squared sums can pass 2^53\n  const n = a.length, P = [0n];\n  for (const v of a) P.push(P[P.length - 1] + BigInt(v));\n  const INF = 1n << 62n;\n  let prev = [0n, ...new Array(n).fill(INF)]; // 0 parts: only the empty prefix costs nothing\n  for (let layer = 0; layer < k; layer++) {\n    const cur = new Array(n + 1).fill(INF);\n    const stack = [[1, n, 0, n - 1]];         // fill cur[lo..hi], knowing their best j lies in [optLo, optHi]\n    while (stack.length) {\n      const [lo, hi, optLo, optHi] = stack.pop();\n      if (lo > hi) continue;\n      const mid = (lo + hi) >> 1;\n      let best = INF, arg = optLo;\n      for (let j = optLo; j <= Math.min(mid - 1, optHi); j++) {\n        const v = prev[j] + (P[mid] - P[j]) ** 2n;\n        if (v < best) { best = v; arg = j; }\n      }\n      cur[mid] = best;\n      stack.push([lo, mid - 1, optLo, arg], [mid + 1, hi, arg, optHi]);   // the best j only moves right\n    }\n    prev = cur;\n  }\n  return prev[n];\n}\n\nconsole.log(String(subarraySquares([2, 3, 1, 2, 2, 3, 4, 1], 3)), String(subarraySquares([5, 5, 5, 5], 2)), String(subarraySquares(new Array(2000).fill(1), 10)));\n","out":"110 200 400000"}]},"a":"110, 200 and 400,000. CSES's sample splits into [2, 3, 1], [2, 2, 3], [4, 1] with sums 6, 7 and 5: 36 + 49 + 25 = 110. Four 5s in two parts are best as 10 and 10, and 2,000 ones in ten parts as ten parts of 200."},"fade":{"q":"A word is valid for a 7-letter puzzle (all letters different) if it contains the puzzle's first letter and every letter of the word appears in the puzzle. For each puzzle, count the valid words among up to 10⁵ words. (LeetCode 1178, Number of Valid Words for Each Puzzle)","steps":["A word matters only through its set of letters: a 26-bit mask. Count how many words have each mask.",{"ask":"Which masks can a valid word have for one puzzle?","a":"The first letter's bit plus any subset of the other six letters: only 2⁶ = 64 masks per puzzle."},{"ask":"How do you visit every subset of a mask?","a":"Start at sub = rest and step sub = (sub − 1) & rest until you reach 0, visiting 0 too: that walks every submask in decreasing order."},{"ask":"Time and space?","a":"O(total letters in the words) to build the counts, then 64 lookups per puzzle: O(W · L + 64 P) time and O(W) space for the counter."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"from collections import Counter\n\ndef find_num_of_valid_words(words, puzzles):\n    count = Counter()\n    for w in words:\n        m = 0\n        for ch in w:\n            m |= 1 << (ord(ch) - 97)\n        count[m] += 1                         # words with the same set of letters share one mask\n    ...                                       # TODO: per puzzle, add count[first | sub] over every sub of the other letters\n"},{"lang":"javascript","src":"function findNumOfValidWords(words, puzzles) {\n  const count = new Map();\n  for (const w of words) {\n    let m = 0;\n    for (const ch of w) m |= 1 << (ch.charCodeAt(0) - 97);\n    count.set(m, (count.get(m) || 0) + 1);    // words with the same set of letters share one mask\n  }\n  // TODO: per puzzle, add count[first | sub] over every sub of the other letters\n}\n"}]},"solution":{"t":"Solution: count word masks, then walk the 64 submasks of each puzzle","tabs":[{"lang":"python","src":"from collections import Counter\n\ndef find_num_of_valid_words(words, puzzles):\n    count = Counter()\n    for w in words:\n        m = 0\n        for ch in w:\n            m |= 1 << (ord(ch) - 97)\n        count[m] += 1                         # words with the same set of letters share one mask\n    out = []\n    for p in puzzles:\n        first, rest = 1 << (ord(p[0]) - 97), 0\n        for ch in p[1:]:\n            rest |= 1 << (ord(ch) - 97)\n        total, sub = 0, rest\n        while True:                           # every subset of the other six letters\n            total += count[first | sub]\n            if sub == 0:\n                break\n            sub = (sub - 1) & rest\n        out.append(total)\n    return out\n\nprint(*find_num_of_valid_words([\"aaaa\", \"asas\", \"able\", \"ability\", \"actt\", \"actor\", \"access\"],\n                               [\"aboveyz\", \"abrodyz\", \"abslute\", \"absoryz\", \"actresz\", \"gaswxyz\"]))\nprint(*find_num_of_valid_words([\"apple\", \"pleas\", \"please\"], [\"aelwxyz\", \"aelpxyz\", \"aelpsxy\", \"saelpxy\", \"xaelpsy\"]))\n","out":"1 1 3 2 4 0\n0 1 3 2 0\n"},{"lang":"javascript","src":"function findNumOfValidWords(words, puzzles) {\n  const count = new Map();\n  for (const w of words) {\n    let m = 0;\n    for (const ch of w) m |= 1 << (ch.charCodeAt(0) - 97);\n    count.set(m, (count.get(m) || 0) + 1);    // words with the same set of letters share one mask\n  }\n  return puzzles.map(p => {\n    const first = 1 << (p.charCodeAt(0) - 97);\n    let rest = 0;\n    for (const ch of p.slice(1)) rest |= 1 << (ch.charCodeAt(0) - 97);\n    let total = 0;\n    for (let sub = rest; ; sub = (sub - 1) & rest) {   // every subset of the other six letters\n      total += count.get(first | sub) || 0;\n      if (sub === 0) break;\n    }\n    return total;\n  });\n}\n\nconsole.log(...findNumOfValidWords([\"aaaa\", \"asas\", \"able\", \"ability\", \"actt\", \"actor\", \"access\"],\n  [\"aboveyz\", \"abrodyz\", \"abslute\", \"absoryz\", \"actresz\", \"gaswxyz\"]));\nconsole.log(...findNumOfValidWords([\"apple\", \"pleas\", \"please\"], [\"aelwxyz\", \"aelpxyz\", \"aelpsxy\", \"saelpxy\", \"xaelpsy\"]));\n","out":"1 1 3 2 4 0\n0 1 3 2 0\n"}]}},"traps":[["“The convex hull trick speeds up any O(n²) DP.”","Only when the transition is a minimum or maximum of linear functions: dp[j] + cost(j, i) must split into (something of j) × (something of i) + (something of j). Expand the cost and check first."],["“Comparing crossing points with division is fine.”","Floating-point crossing points can misorder nearly-parallel lines. Compare fractions by cross-multiplying, in exact integers (BigInt in JavaScript once products pass 2⁵³)."],["“A Li Chao tree needs its lines sorted by slope.”","It takes lines in any order and queries anywhere in its range, at O(log C) each. Sorted slopes are what the deque needs, and sorted queries too for O(1) amortised queries."],["“The divide and conquer optimisation works for every layered DP.”","It needs the best split point to move one way only (opt(i) ≤ opt(i + 1)), which follows from the quadrangle inequality, as for squared sums of positive numbers. Check it against a brute force before trusting it."],["“Enumerating the submasks of every mask is 2^b × 2^b work.”","Each bit is either in neither, in the mask only, or in both, so the total is 3^b steps; SOS DP gets the sums in 2^b · b."],["“DP values always fit in a JavaScript Number.”","Monster Game times reach about 2 × 10¹⁷ and squared sums about 9 × 10¹⁶, past 2⁵³. Use BigInt in JavaScript; Python's integers are exact."]],"disc":[["Why can a line that's never lowest be removed for good?","With slopes decreasing, each newer line beats the older ones for large enough x. If the newest line overtakes the second-to-last before that one ever overtakes the line before it, the middle line is never below both neighbours anywhere, so it can never be the answer again. That's one cross-multiplied comparison, and each line is added and removed at most once."],["How do you choose between these optimisations?","Write the plain DP and a brute force first. Then read the transition: linear in some quantity of i means the convex hull trick (a deque if slopes and queries are sorted, a Li Chao tree otherwise); a layered minimum with a monotone best split means divide and conquer; an interval DP whose split points nest means Knuth; sums over submasks mean SOS DP. Confirm the speed-up against the slow version on random tests (module 10)."]],"teach":{"prompt":"Explain to a junior colleague when the convex hull trick, the divide and conquer optimisation and SOS DP apply, and what each one costs.","rubric":["Convex hull trick: dp[i] is the lowest of lines at x_i; deque O(n) when sorted, Li Chao O(log C) otherwise","Crossing points are compared exactly, by cross-multiplying","Divide and conquer: a monotone best split gives O(n log n) per layer","SOS DP: subset sums in O(2^b · b), not O(3^b)","Always check the faster version against a slow brute force"],"model":"I start by writing the slow DP and looking at its transition. If the candidate for each earlier state j is a straight line in some quantity of i, like dp[j] + s[i] × f[j], then dp[i] is the lowest line at s[i], and I keep the lower envelope: with sorted slopes and sorted queries a deque does it in O(n) amortised, otherwise a Li Chao tree does each insert and query in O(log C), and I compare crossing points by cross-multiplying so nothing is rounded. If the DP has layers and the best split point only moves right as i grows, I use divide and conquer: solve the middle i by a scan, then each half only searches its side of that split, for O(n log n) per layer. For sums over all subsets of every mask, SOS DP adds one bit at a time in O(2^b · b) instead of enumerating every submask. Whatever I pick, I test it against the slow version on random inputs before trusting it."},"qa":[["When does the convex hull trick apply?","When dp[i] is a minimum (or maximum) over j of linear functions m_j · x_i + c_j."],["What does a Li Chao tree cost?","O(log C) per line insert and per query, with lines in any order."],["What does the divide and conquer optimisation need?","A monotone best split point: opt(i) ≤ opt(i + 1)."],["How fast is SOS DP?","O(2^b · b) for all masks of b bits."],["How many (mask, submask) pairs are there over b bits?","3^b."],["How do you step through the submasks of mask?","sub = mask, then sub = (sub − 1) & mask until 0 (visiting 0 too)."]],"quiz":[{"q":"What does this print? (`MonotoneCHT` is this module's helper; in JavaScript its values are BigInts.)","snip":{"t":"Three lines, five queries","tabs":[{"lang":"python","src":"cht = MonotoneCHT()\nfor m, c in [(3, 0), (1, 4), (-1, 12)]:     # slopes in decreasing order\n    cht.add(m, c)\nprint(*(cht.query(x) for x in [0, 2, 3, 5, 9]))\n"},{"lang":"javascript","src":"const cht = new MonotoneCHT();\nfor (const [m, c] of [[3n, 0n], [1n, 4n], [-1n, 12n]]) cht.add(m, c);   // slopes in decreasing order\nconsole.log(...[0n, 2n, 3n, 5n, 9n].map(x => String(cht.query(x))));\n"}]},"o":["0 6 7 7 3","0 6 9 7 3","0 4 7 7 3","0 6 7 9 3"],"a":0,"e":"At x = 0 the lines give 0, 4 and 12; at 2: 6, 6 and 10; at 3: 9, 7 and 9; at 5: 15, 9 and 7; at 9: 27, 13 and 3. The minimum at each point is 0, 6, 7, 7 and 3."},{"q":"What does this print?","snip":{"t":"Walking the submasks","tabs":[{"lang":"python","src":"mask, out, sub = 0b101, [], 0b101\nwhile True:\n    out.append(sub)\n    if sub == 0:\n        break\n    sub = (sub - 1) & mask\nprint(*out)\n"},{"lang":"javascript","src":"const mask = 0b101, out = [];\nfor (let sub = mask; ; sub = (sub - 1) & mask) {\n  out.push(sub);\n  if (sub === 0) break;\n}\nconsole.log(...out);\n"}]},"o":["5 4 1 0","5 4 3 2 1 0","0 1 4 5","5 1 4 0"],"a":0,"e":"(sub − 1) & mask jumps to the next smaller submask: 5 (101), 4 (100), 1 (001), then 0. Numbers like 3 or 2 aren't submasks of 101, so they never appear."},{"q":"When does the divide and conquer optimisation apply to dp[i] = min over j < i of (prev[j] + C(j, i))?","o":["When the best j for i never decreases as i increases (opt(i) ≤ opt(i + 1))","Whenever C(j, i) is positive","Only when the DP has a single layer","When n is a power of two"],"a":0,"e":"The method relies on each half's best j being on one side of the middle's best j. Positive costs alone don't guarantee that, the number of layers doesn't matter, and n can be anything."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["The convex hull trick needs each candidate to be a linear function of some quantity of i","SOS DP finds, for every mask, the sum over its subsets in O(2^b · b)","A Li Chao tree needs its lines inserted in order of slope","Knuth's optimisation turns every O(n³) interval DP into O(n²)","Enumerating the submasks of every b-bit mask takes O(2^b) steps in total"],"a":[0,1],"e":"Lines in i and one-bit-at-a-time subset sums are the two true statements. A Li Chao tree takes lines in any order, Knuth needs nested split points, and enumerating all submasks of all masks is 3^b."},{"q":"Judge each statement.","t":"yn","s":[["With slopes added in decreasing order and rising queries, each line enters and leaves the deque at most once.",true],["Over all masks of b bits, there are 3^b (mask, submask) pairs.",true],["A Li Chao tree answers a query in O(1).",false],["The divide and conquer optimisation cuts one layer from O(n²) to O(n log n).",true]],"e":"That's why the deque is O(n) amortised. Each bit is in neither, the mask only, or both. A Li Chao query walks one root-to-leaf path, O(log C). And divide and conquer scans O(n) per recursion level over O(log n) levels."},{"q":"Put the steps of one layer of the divide and conquer optimisation in order.","t":"ord","items":["Finish the previous layer's values prev[0..n]","Take the middle index mid of the current range","Scan j in the allowed window to find mid's best split, opt","Solve both halves, the left with j ≤ opt and the right with j ≥ opt"],"e":"Each value of this layer needs the previous layer, the halves need mid's best split, and that split needs the scan."},{"q":"Complete the Python SOS DP that computes f[mask] = Σ a[sub] over every sub ⊆ mask.","t":"drop","lang":"python","code":"def subset_sums(a, bits):\n    f = a[:]\n    for b in range(bits):\n        for mask in range(1 << bits):\n            if {{0}}:\n                f[mask] += f[{{1}}]\n    return f\n","blanks":[{"o":["mask >> b & 1","not mask >> b & 1","mask & b","mask > b"],"a":0},{"o":["mask ^ (1 << b)","mask | (1 << b)","mask - 1","mask >> 1"],"a":0}],"e":"A mask that has bit b adds the value of the same mask without b. Using masks without b and adding mask | (1 << b) gives superset sums instead."},{"q":"Match each transition to the technique that speeds it up.","t":"match","pairs":[["dp[i] = min over j of m_j · x_i + c_j, slopes and queries sorted","The convex hull trick with a deque"],["Lines added in any order, queries anywhere","A Li Chao tree"],["A layered DP where the best split moves right as i grows","The divide and conquer optimisation"],["For every mask, a sum over all its subsets","SOS DP, one bit at a time"]],"extra":["Floyd–Warshall"],"e":"Sorted lines suit the deque, unsorted ones the Li Chao tree, monotone splits divide and conquer, and subset sums SOS DP. Floyd–Warshall computes all-pairs shortest paths."}],"probs":[["LC 1235 · Maximum Profit in Job Scheduling","https://leetcode.com/problems/maximum-profit-in-job-scheduling/","Hard","sort jobs by end time; a DP over jobs with a binary search for the last one that fits: O(n log n) instead of O(n²)"],["LC 1178 · Number of Valid Words for Each Puzzle","https://leetcode.com/problems/number-of-valid-words-for-each-puzzle/","Hard","the faded example: count word masks, then walk the 64 submasks of each puzzle's other six letters"],["CSES 2084 · Monster Game I","https://cses.fi/problemset/task/2084","","the monotone convex hull trick: slopes f fall and queries s rise (code block 1)"],["CSES 2085 · Monster Game II","https://cses.fi/problemset/task/2085","","the same DP without the ordering: a Li Chao tree over the strengths (code block 2)"],["CSES 2086 · Subarray Squares","https://cses.fi/problemset/task/2086","","the worked example: divide and conquer per layer"],["CSES 2087 · Houses and Schools","https://cses.fi/problemset/task/2087","","divide and conquer again; first precompute the cost of serving a range of houses from one school"],["CSES 2088 · Knuth Division","https://cses.fi/problemset/task/2088","","Knuth's optimisation: the best split of [l, r] lies between those of [l, r − 1] and [l + 1, r], O(n²) in total"],["CSES 1654 · SOS Bit Problem","https://cses.fi/problemset/task/1654","","code block 3: subset and superset counts over 20 bits"]],"src":[["cp-algorithms: Convex hull trick and Li Chao tree","https://cp-algorithms.com/geometry/convex_hull_trick.html"],["cp-algorithms: Divide and conquer DP","https://cp-algorithms.com/dynamic_programming/divide-and-conquer-dp.html"],["cp-algorithms: Knuth's optimization","https://cp-algorithms.com/dynamic_programming/knuth-optimization.html"],["cp-algorithms: Enumerating submasks of a bitmask","https://cp-algorithms.com/algebra/all-submasks.html"],["USACO Guide: Sum over subsets DP","https://usaco.guide/plat/dp-sos"]]},{"id":"m10","d":"d4","t":"Stress testing, problem setting and teaching","min":110,"hook":"At expert level a clever idea is worth nothing if one edge case breaks it, and a wrong answer on a hidden test scores zero. Stress testing (a slow but obviously correct brute force, a seeded random generator and a loop that compares them) finds those bugs in seconds. Setting a problem turns the same discipline around, and teaching is the final test of whether you really own an idea.","pre":{"q":"Your fast solution passes all the examples, but the judge says “Wrong answer on test 17” and won't show the test. How could you find a failing input yourself, quickly, without guessing?","a":"Write a slow solution that is obviously correct, generate thousands of small random inputs, and run both until they disagree. The first disagreement is a failing input you can read; shrink it to the smallest version that still fails, and the bug usually becomes obvious."},"kid":{"t":"Ben's answer checker","x":"Ben has a quick way to add up big piles of numbers in his head, and Tara doesn't trust it. So she writes out a hundred little sums on cards, using small numbers she can check slowly on her fingers. They race through the cards: Ben answers fast, Tara checks slowly. On card 37 the answers differ. Tara crosses out numbers one by one while the answers still disagree, until only two numbers are left, and now Ben can see exactly where his trick goes wrong.","map":[["Ben's quick way of adding","The fast solution under test"],["Tara checking slowly on her fingers","The brute force: slow but obviously correct"],["A hundred little sums with small numbers","A generator of small random inputs"],["Racing through the cards until card 37 differs","Comparing both solutions until the first disagreement"],["Crossing out numbers while they still disagree","Shrinking the failing input to a minimal one"]],"brk":"Tara picks her cards by hand, but code uses a seeded random generator, so the same cards come back every run and a failure can be replayed exactly. And small cards miss some bugs: overflow and time limits only show up with huge values and huge sizes, so those need their own tests."},"keys":["**Stress testing**: run the fast solution and an obviously correct brute force on thousands of small random inputs and stop at the first disagreement. It finds most wrong-answer bugs in seconds, long before a judge or an interviewer does.","**The brute force is the oracle**: write it straight from the definition, sharing no helpers with the fast code, and don't worry about speed: O(n³) or exponential is fine for n ≤ 8. For tiny sizes you can even test every input exhaustively.","**Generators**: tiny sizes and tiny value ranges (0 to 3) make duplicates, ties and edge cases common, and a failing case stays readable. Add special shapes on purpose: empty, n = 1, all equal, sorted, reversed, and values at the limits.","**Reproducibility**: seed the generator and print the seed or the input of every failure. Python's random module takes a seed, but JavaScript's Math.random can't be seeded, so the helper ports mulberry32 to both languages: the same seed gives the same tests in each.","**Shrinking**: a failing input is easiest to debug when it's minimal. Keep dropping an element or moving a value towards 0 while the test still fails (delta debugging). Property-based testing libraries such as Hypothesis (Python) and fast-check (JavaScript) do this automatically.","**Small tests miss some bugs**: overflow and precision errors need values at the top of the range (a JavaScript Number loses digits past 2⁵³), and time-limit or recursion-depth problems need inputs at the maximum size. Give those their own generators.","**Problem setting**: a statement, exact constraints, a model solution, a brute force, a validator that checks every input file, generators, edge and anti-heuristic tests, a checker when several answers are accepted, and an editorial that proves the solution. Run the wrong solutions you can think of to make sure the tests reject them.","**Teaching and practice**: explain the idea in one sentence, work a small example, say why it's correct and what it costs, then hand over a faded example and name the first trap. Practise on your own code too: stress test your L3 answers to LeetCode 862 and 1044 and this level's templates (Dinic, the suffix array, the convex hull trick) before relying on them."],"dia":[{"type":"flow","cap":"The stress-testing loop","steps":[["Generate","a small random input from a seeded generator"],["Run both","the fast solution and the brute force"],["Compare","repeat until they disagree"],["Shrink","drop elements and move values towards 0 while it still fails"],["Debug, fix, rerun","until thousands of tests pass"]]},{"type":"layers","cap":"What a problem setter ships","rows":[["Statement and constraints","precise, with every limit stated"],["Model solution and brute force","two independent solutions that must agree on every small test"],["Validator","checks that every input file obeys the constraints exactly"],["Tests","hand-made edge cases, random tests at several sizes, anti-heuristic cases, maximum sizes"],["Checker","only if several outputs are correct"],["Editorial","the idea, a proof sketch and the complexity"]]}],"cmp":[{"cap":"Which tests catch which bugs?","head":["Kind of test","Catches","Example"],"rows":[["Tiny random inputs with tiny values","Logic errors, off-by-one, ties","Arrays of length ≤ 8 with values 0 to 3"],["Every input up to a small size","Rare small patterns that random tests skip","All arrays of length ≤ 3 over {0, 1, 2}"],["Hand-made edge cases","Forgotten special cases","n = 1, empty, all equal, sorted, reversed"],["Extreme values","Overflow and precision","Values near 10⁹ or 10¹⁸; products past 2⁵³ in JavaScript"],["Large inputs","Time limits and recursion depth","n at the maximum, a path-shaped tree"],["Anti-heuristic cases","Plausible but wrong ideas","A case built so that the greedy choice fails"]]}],"code":[{"t":"A seeded random generator (identical in Python and JavaScript) and a shrinker, used below","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded generator of floats in [0, 1), same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef make_randint(seed):                         # randint(lo, hi), both ends included\n    rand = mulberry32(seed)\n    return lambda lo, hi: lo + int(rand() * (hi - lo + 1))\n\ndef shrink(a, fails):                           # simplify a failing list while it keeps failing\n    while True:\n        drops = [a[:i] + a[i + 1:] for i in range(len(a))]\n        moves = [a[:i] + [a[i] - (1 if a[i] > 0 else -1)] + a[i + 1:] for i in range(len(a)) if a[i] != 0]\n        nxt = next((b for b in drops + moves if b and fails(b)), None)   # drop an element, or move a value towards 0\n        if nxt is None:\n            return a                            # nothing simpler still fails: a is minimal\n        a = nxt\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded generator of floats in [0, 1), same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction makeRandint(seed) {                    // randint(lo, hi), both ends included\n  const rand = mulberry32(seed);\n  return (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));\n}\n\nfunction shrink(a, fails) {                     // simplify a failing array while it keeps failing\n  for (;;) {\n    const drops = a.map((_, i) => [...a.slice(0, i), ...a.slice(i + 1)]);\n    const moves = a.flatMap((x, i) => (x === 0 ? [] : [[...a.slice(0, i), x - Math.sign(x), ...a.slice(i + 1)]]));\n    const next = [...drops, ...moves].find(b => b.length > 0 && fails(b));   // drop an element, or move a value towards 0\n    if (next === undefined) return a;           // nothing simpler still fails: a is minimal\n    a = next;\n  }\n}\n"}]},{"t":"A stress test finds a bug, and shrinking makes it obvious","tabs":[{"lang":"python","src":"def max_subarray_buggy(a):                    # Kadane, but best starts at 0: wrong when every value is negative\n    best = cur = 0\n    for x in a:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best\n\ndef brute(a):                                 # the definition: try every subarray\n    return max(sum(a[i:j]) for i in range(len(a)) for j in range(i + 1, len(a) + 1))\n\nrandint = make_randint(42)\nfor test in range(1, 1001):\n    a = [randint(-5, 5) for _ in range(randint(1, 6))]\n    if max_subarray_buggy(a) != brute(a):\n        print(\"test\", test, \"fails on\", *a)\n        print(\"fast says\", max_subarray_buggy(a), \"but the brute force says\", brute(a))\n        print(\"shrunk to\", *shrink(a, lambda b: max_subarray_buggy(b) != brute(b)))\n        break\n","out":"test 6 fails on -5 -3 -5 -3\nfast says 0 but the brute force says -3\nshrunk to -1\n","notes":[[2,"The bug: best starts at 0, so an array of negative numbers reports 0, the sum of an empty subarray the problem doesn't allow."],[11,"Seed 42 gives the same 1,000 tests every run, and the same tests in both languages."],[13,"Small sizes (1 to 6) and small values (−5 to 5) make an all-negative array likely within a few tests."],[17,"Shrinking drops elements and moves values towards 0 while the test still fails: [−1] is the smallest failing input."]]},{"lang":"javascript","src":"function maxSubarrayBuggy(a) {                // Kadane, but best starts at 0: wrong when every value is negative\n  let best = 0, cur = 0;\n  for (const x of a) {\n    cur = Math.max(x, cur + x);\n    best = Math.max(best, cur);\n  }\n  return best;\n}\n\nfunction brute(a) {                           // the definition: try every subarray\n  let best = -Infinity;\n  for (let i = 0; i < a.length; i++) for (let j = i + 1; j <= a.length; j++) best = Math.max(best, a.slice(i, j).reduce((s, x) => s + x, 0));\n  return best;\n}\n\nconst randint = makeRandint(42);\nfor (let test = 1; test <= 1000; test++) {\n  const a = Array.from({ length: randint(1, 6) }, () => randint(-5, 5));\n  if (maxSubarrayBuggy(a) !== brute(a)) {\n    console.log(\"test\", test, \"fails on\", ...a);\n    console.log(\"fast says\", maxSubarrayBuggy(a), \"but the brute force says\", brute(a));\n    console.log(\"shrunk to\", ...shrink(a, b => maxSubarrayBuggy(b) !== brute(b)));\n    break;\n  }\n}\n","out":"test 6 fails on -5 -3 -5 -3\nfast says 0 but the brute force says -3\nshrunk to -1\n","notes":[[2,"The bug: best starts at 0, so an array of negative numbers reports 0, the sum of an empty subarray the problem doesn't allow."],[16,"Seed 42 gives the same 1,000 tests every run, and the same tests in both languages."],[18,"Small sizes (1 to 6) and small values (−5 to 5) make an all-negative array likely within a few tests."],[22,"Shrinking drops elements and moves values towards 0 while the test still fails: [−1] is the smallest failing input."]]}]},{"t":"Extreme values catch what small tests miss: a precision bug","tabs":[{"lang":"python","src":"def mulmod_double(a, b, m):                   # what (a * b) % m computes with JavaScript Numbers (doubles)\n    return int(float(a) * float(b) % m)\n\nrandint = make_randint(2026)\nm = 10**9 + 7\nfor test in range(1, 1001):\n    big = randint(0, 1)                       # half the tests use values near the top of the range\n    a = randint(10**9 - 1000, m - 1) if big else randint(0, 1000)\n    b = randint(10**9 - 1000, m - 1) if big else randint(0, 1000)\n    if mulmod_double(a, b, m) != a * b % m:\n        print(\"test\", test, \"fails:\", a, \"*\", b, \"gives\", mulmod_double(a, b, m), \"instead of\", a * b % m)\n        break\n","out":"test 2 fails: 999999153 * 999999223 gives 669593 instead of 669536\n","notes":[[2,"float(a) * float(b) is the same rounded double a JavaScript Number gives, so Python can reproduce the bug exactly."],[7,"With values only up to 1,000 the products stay below 2⁵³ and every test passes, hiding the bug."],[10,"The product is about 10¹⁸, where doubles are 128 apart, so the remainder comes out wrong by 57."]]},{"lang":"javascript","src":"const mulmodDouble = (a, b, m) => (a * b) % m;   // plain Numbers: the product is rounded above 2^53\n\nconst randint = makeRandint(2026);\nconst m = 1000000007;\nfor (let test = 1; test <= 1000; test++) {\n  const big = randint(0, 1);                  // half the tests use values near the top of the range\n  const a = big ? randint(1e9 - 1000, m - 1) : randint(0, 1000);\n  const b = big ? randint(1e9 - 1000, m - 1) : randint(0, 1000);\n  const exact = Number((BigInt(a) * BigInt(b)) % BigInt(m));\n  if (mulmodDouble(a, b, m) !== exact) {\n    console.log(\"test\", test, \"fails:\", a, \"*\", b, \"gives\", mulmodDouble(a, b, m), \"instead of\", exact);\n    break;\n  }\n}\n","out":"test 2 fails: 999999153 * 999999223 gives 669593 instead of 669536\n","notes":[[1,"a * b is rounded to the nearest double before % runs, so the low digits are already gone."],[6,"With values only up to 1,000 the products stay below 2⁵³ and every test passes, hiding the bug."],[9,"BigInt gives the exact remainder to compare against."]]}]},{"t":"A validator for a problem you set","tabs":[{"lang":"python","src":"import re\n\nINT = re.compile(r\"-?(0|[1-9][0-9]*)\")        # a plain integer: no plus sign, no leading zeros\n\ndef validate(text, n_max=200_000, v_max=10**9):   # \"OK\", or the first broken rule\n    if not text.endswith(\"\\n\"):\n        return \"the file must end with a newline\"\n    lines = text[:-1].split(\"\\n\")\n    if len(lines) != 2:\n        return f\"expected 2 lines, found {len(lines)}\"\n    if not INT.fullmatch(lines[0]):\n        return \"line 1: n is not a plain integer\"\n    n = int(lines[0])\n    if not 1 <= n <= n_max:\n        return f\"n = {n} is out of [1, {n_max}]\"\n    parts = lines[1].split(\" \")\n    if \"\" in parts:\n        return \"line 2: extra or missing spaces\"\n    if len(parts) != n:\n        return f\"line 2: expected {n} numbers, found {len(parts)}\"\n    for i, p in enumerate(parts, 1):\n        if not INT.fullmatch(p):\n            return f'a[{i}] = \"{p}\" is not a plain integer'\n        if not 1 <= int(p) <= v_max:\n            return f\"a[{i}] = {p} is out of [1, {v_max}]\"\n    return \"OK\"\n\nfor t in [\"3\\n1 2 3\\n\", \"3\\n1 2\\n\", \"2\\n5 1000000001\\n\", \"0\\n\\n\", \"2\\n1  2\\n\", \"2\\n01 2\\n\", \"2\\n1 2\"]:\n    print(validate(t))\n","out":"OK\nline 2: expected 3 numbers, found 2\na[2] = 1000000001 is out of [1, 1000000000]\nn = 0 is out of [1, 200000]\nline 2: extra or missing spaces\na[1] = \"01\" is not a plain integer\nthe file must end with a newline\n","notes":[[3,"Plain integers only: “+5”, “05” and “5.0” are rejected, because some contestants' parsers would read them differently."],[8,"Splitting on newlines and counting lines catches extra blank lines as well as missing ones."],[17,"An empty piece means two spaces in a row, or a space at the start or end of the line."],[28,"Each input breaks one rule, and the validator names the first rule it breaks."]]},{"lang":"javascript","src":"const INT = /^-?(0|[1-9][0-9]*)$/;            // a plain integer: no plus sign, no leading zeros\n\nfunction validate(text, nMax = 200000, vMax = 1e9) {   // \"OK\", or the first broken rule\n  if (!text.endsWith(\"\\n\")) return \"the file must end with a newline\";\n  const lines = text.slice(0, -1).split(\"\\n\");\n  if (lines.length !== 2) return `expected 2 lines, found ${lines.length}`;\n  if (!INT.test(lines[0])) return \"line 1: n is not a plain integer\";\n  const n = Number(lines[0]);\n  if (n < 1 || n > nMax) return `n = ${n} is out of [1, ${nMax}]`;\n  const parts = lines[1].split(\" \");\n  if (parts.includes(\"\")) return \"line 2: extra or missing spaces\";\n  if (parts.length !== n) return `line 2: expected ${n} numbers, found ${parts.length}`;\n  for (let i = 0; i < n; i++) {\n    if (!INT.test(parts[i])) return `a[${i + 1}] = \"${parts[i]}\" is not a plain integer`;\n    const v = Number(parts[i]);\n    if (v < 1 || v > vMax) return `a[${i + 1}] = ${parts[i]} is out of [1, ${vMax}]`;\n  }\n  return \"OK\";\n}\n\nfor (const t of [\"3\\n1 2 3\\n\", \"3\\n1 2\\n\", \"2\\n5 1000000001\\n\", \"0\\n\\n\", \"2\\n1  2\\n\", \"2\\n01 2\\n\", \"2\\n1 2\"]) console.log(validate(t));\n","out":"OK\nline 2: expected 3 numbers, found 2\na[2] = 1000000001 is out of [1, 1000000000]\nn = 0 is out of [1, 200000]\nline 2: extra or missing spaces\na[1] = \"01\" is not a plain integer\nthe file must end with a newline\n","notes":[[1,"Plain integers only: “+5”, “05” and “5.0” are rejected, because some contestants' parsers would read them differently."],[5,"Splitting on newlines and counting lines catches extra blank lines as well as missing ones."],[11,"An empty piece means two spaces in a row, or a space at the start or end of the line."],[21,"Each input breaks one rule, and the validator names the first rule it breaks."]]}]}],"ex":{"q":"Implement atoi: skip leading spaces, read an optional + or −, then digits until the first non-digit, and clamp the result to the 32-bit range [−2³¹, 2³¹ − 1]; anything else gives 0. Then prove your parser right by stress testing it. (LeetCode 8, String to Integer (atoi))","steps":["Write the rules down in order: spaces, at most one sign, digits, then clamp. Most wrong answers break exactly one rule, often silently (a second sign, a space after the sign, a leading zero).","Implement each rule as one small loop or check, and cap the value at 2³¹ while reading, so it never grows without limit (a JavaScript Number would start losing digits past 2⁵³).","Write an independent reference: the regular expression ^ *([+-]?[0-9]+) captures exactly the text the rules read, and an exact integer conversion does the rest.","Stress test with random strings over a tiny alphabet (space, +, −, digits, a letter, a dot) plus long digit runs for overflow. The parser is O(n) time and O(1) space."],"code":{"t":"A rule-by-rule parser, checked against a regular expression","tabs":[{"lang":"python","src":"def my_atoi(s):                               # LeetCode 8, following the rules literally\n    i, n = 0, len(s)\n    while i < n and s[i] == \" \":\n        i += 1                                # 1. skip leading spaces (spaces only)\n    sign = 1\n    if i < n and s[i] in \"+-\":\n        sign = -1 if s[i] == \"-\" else 1       # 2. at most one sign\n        i += 1\n    num = 0\n    while i < n and \"0\" <= s[i] <= \"9\":       # 3. digits until the first non-digit\n        num = min(num * 10 + ord(s[i]) - 48, 2**31)   # cap at 2^31 so the number never runs away\n        i += 1\n    return max(-2**31, min(2**31 - 1, sign * num))   # 4. clamp to the 32-bit range\n\nprint(*(my_atoi(s) for s in [\"42\", \"   -042\", \"1337c0d3\", \"0-1\", \"words and 987\", \"-91283472332\", \"+-12\", \"   +0 123\"]))\n","out":"42 -42 1337 0 0 -2147483648 0 0"},{"lang":"javascript","src":"function myAtoi(s) {                          // LeetCode 8, following the rules literally\n  let i = 0;\n  const n = s.length;\n  while (i < n && s[i] === \" \") i++;          // 1. skip leading spaces (spaces only)\n  let sign = 1;\n  if (i < n && (s[i] === \"+\" || s[i] === \"-\")) { sign = s[i] === \"-\" ? -1 : 1; i++; }   // 2. at most one sign\n  let num = 0;\n  while (i < n && s[i] >= \"0\" && s[i] <= \"9\") {   // 3. digits until the first non-digit\n    num = Math.min(num * 10 + (s.charCodeAt(i) - 48), 2 ** 31);   // cap at 2^31 so the number never runs away\n    i++;\n  }\n  return Math.max(-(2 ** 31), Math.min(2 ** 31 - 1, sign * num));   // 4. clamp to the 32-bit range\n}\n\nconsole.log(...[\"42\", \"   -042\", \"1337c0d3\", \"0-1\", \"words and 987\", \"-91283472332\", \"+-12\", \"   +0 123\"].map(myAtoi));\n","out":"42 -42 1337 0 0 -2147483648 0 0"}]},"a":"42, −42 (the leading zero is just a digit), 1337 (reading stops at “c”), 0 (stops at the “−”), 0 (no number at the start), −2147483648 (clamped), 0 (two signs) and 0 (“+0”, then the space ends the number)."},"fade":{"q":"A fast inversion counter (merge sort, O(n log n)) is given. Write the brute force and the stress test that would catch a bug in it, and run 500 tests.","steps":["The fast code counts pairs i < j with a[i] > a[j] while merging. Your job is the test, not a new algorithm.",{"ask":"What should the brute force be?","a":"The definition itself: two nested loops counting every pair i < j with a[i] > a[j]. O(n²) is fine for arrays of length ≤ 8; being obviously right matters more than speed."},{"ask":"Which inputs find bugs fastest?","a":"Many tiny arrays (length 0 to 8) with tiny values (0 to 3), so equal values, sorted runs and reversed runs turn up constantly. Equal values are where a < versus ≤ mistake in the merge would hide."},{"ask":"What should the loop print?","a":"Nothing until something fails; then the test number and the exact input, so the failure can be replayed and shrunk. If all pass, one summary line."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def count_inversions(a):                      # merge sort: (pairs i < j with a[i] > a[j], sorted copy)\n    if len(a) <= 1:\n        return 0, a\n    mid = len(a) // 2\n    inv_l, left = count_inversions(a[:mid])\n    inv_r, right = count_inversions(a[mid:])\n    merged, i, j, inv = [], 0, 0, inv_l + inv_r\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            merged.append(left[i])\n            i += 1\n        else:\n            merged.append(right[j])\n            j += 1\n            inv += len(left) - i              # right[j] jumps ahead of every left value still waiting\n    return inv, merged + left[i:] + right[j:]\n\ndef brute(a):\n    ...                                       # TODO: count the pairs straight from the definition\n\nrandint = make_randint(7)\n...                                           # TODO: 500 tiny random arrays; print the first failure, or a summary\n"},{"lang":"javascript","src":"function countInversions(a) {                 // merge sort: [pairs i < j with a[i] > a[j], sorted copy]\n  if (a.length <= 1) return [0, a];\n  const mid = a.length >> 1;\n  const [invL, left] = countInversions(a.slice(0, mid)), [invR, right] = countInversions(a.slice(mid));\n  const merged = [];\n  let i = 0, j = 0, inv = invL + invR;\n  while (i < left.length && j < right.length) {\n    if (left[i] <= right[j]) merged.push(left[i++]);\n    else { merged.push(right[j++]); inv += left.length - i; }   // right[j] jumps ahead of every left value still waiting\n  }\n  return [inv, [...merged, ...left.slice(i), ...right.slice(j)]];\n}\n\nfunction brute(a) {\n  // TODO: count the pairs straight from the definition\n}\n\nconst randint = makeRandint(7);\n// TODO: 500 tiny random arrays; print the first failure, or a summary\n"}]},"solution":{"t":"Solution: the definition as the oracle, and tiny random arrays","tabs":[{"lang":"python","src":"def count_inversions(a):                      # merge sort: (pairs i < j with a[i] > a[j], sorted copy)\n    if len(a) <= 1:\n        return 0, a\n    mid = len(a) // 2\n    inv_l, left = count_inversions(a[:mid])\n    inv_r, right = count_inversions(a[mid:])\n    merged, i, j, inv = [], 0, 0, inv_l + inv_r\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            merged.append(left[i])\n            i += 1\n        else:\n            merged.append(right[j])\n            j += 1\n            inv += len(left) - i              # right[j] jumps ahead of every left value still waiting\n    return inv, merged + left[i:] + right[j:]\n\ndef brute(a):                                 # the definition, nothing clever\n    return sum(1 for i in range(len(a)) for j in range(i + 1, len(a)) if a[i] > a[j])\n\nrandint = make_randint(7)\nfor test in range(1, 501):\n    a = [randint(0, 3) for _ in range(randint(0, 8))]\n    if count_inversions(a)[0] != brute(a):\n        print(\"test\", test, \"fails on\", *a)\n        break\nelse:\n    print(\"500 tests passed\")\n","out":"500 tests passed"},{"lang":"javascript","src":"function countInversions(a) {                 // merge sort: [pairs i < j with a[i] > a[j], sorted copy]\n  if (a.length <= 1) return [0, a];\n  const mid = a.length >> 1;\n  const [invL, left] = countInversions(a.slice(0, mid)), [invR, right] = countInversions(a.slice(mid));\n  const merged = [];\n  let i = 0, j = 0, inv = invL + invR;\n  while (i < left.length && j < right.length) {\n    if (left[i] <= right[j]) merged.push(left[i++]);\n    else { merged.push(right[j++]); inv += left.length - i; }   // right[j] jumps ahead of every left value still waiting\n  }\n  return [inv, [...merged, ...left.slice(i), ...right.slice(j)]];\n}\n\nfunction brute(a) {                           // the definition, nothing clever\n  let count = 0;\n  for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) if (a[i] > a[j]) count++;\n  return count;\n}\n\nconst randint = makeRandint(7);\nlet failed = false;\nfor (let test = 1; test <= 500 && !failed; test++) {\n  const a = Array.from({ length: randint(0, 8) }, () => randint(0, 3));\n  if (countInversions(a)[0] !== brute(a)) { console.log(\"test\", test, \"fails on\", ...a); failed = true; }\n}\nif (!failed) console.log(\"500 tests passed\");\n","out":"500 tests passed"}]}},"traps":[["“It passes the examples, so it's right.”","Examples are chosen to explain the problem, not to break solutions. Stress test against a brute force on thousands of small inputs, and add hand-made edge cases."],["“Big random tests are the best tests.”","Big inputs find time-limit problems, but a wrong answer on a 10⁵-element input is nearly impossible to debug. Tiny sizes and tiny value ranges hit edge cases far more often, and the failing case is readable."],["“The brute force can reuse the fast solution's helpers.”","Then a bug in a shared helper appears in both and the test passes anyway. The oracle must be independent and obviously correct, even if it's O(n³) or exponential."],["“Math.random is fine for reproducible tests.”","It can't be seeded. Use a small seeded generator, such as the helper's mulberry32, and print the seed or the input of every failure."],["“10,000 passing random tests prove the solution correct.”","They're evidence, not proof: some bugs need huge values (code block 2) or rare structures. Combine stress tests with a written proof idea and hand-made edge cases."],["“A problem's tests only need random inputs.”","Setters add edge cases (n = 1, all equal, maximum values), anti-heuristic cases that break plausible wrong ideas, maximum-size tests, and a validator run on every input file."]],"disc":[["What makes a good test set when you set a problem?","Hand-made edge cases (the smallest sizes, all values equal, sorted and reversed, the maximum values for overflow), random tests at several sizes, cases designed to defeat each plausible wrong idea (a greedy, a missing modulo, deep recursion), and maximum-size tests for timing. A validator checks every input, the model solution and the brute force agree on everything small, and known wrong solutions are run to confirm the tests reject them."],["Why does teaching a topic improve your own understanding?","Explaining forces you to recall the idea without notes, put the steps in order and notice the gaps, which are exactly the parts you'd fumble in an interview. A good explanation states the idea in one sentence, works a small example, says why it's correct and what it costs, and names the trap a beginner hits first."]],"teach":{"prompt":"Explain to a junior colleague how to stress test a solution, and how to turn a failing random test into something they can debug.","rubric":["An independent, obviously correct brute force","A seeded generator of small random inputs with tiny value ranges","Compare on thousands of inputs and stop at the first difference","Shrink the failing case to a minimal one","Extreme-value and edge-case tests too; passing tests is evidence, not proof"],"model":"First I write a brute force straight from the problem's definition, sharing nothing with my fast solution, and I don't care how slow it is. Then I write a generator that makes small random inputs, say up to eight elements with values from 0 to 3, so duplicates and edge cases come up all the time, and I seed it so every run produces the same tests. A loop runs both solutions on thousands of inputs and stops at the first disagreement, printing the input. I shrink that input, dropping elements and moving values towards zero while it still fails, until I have a tiny case I can trace by hand. Small tests miss overflow and timing problems, so I also run a few tests at the largest values and sizes. Passing all of that is strong evidence, not a proof, so I still write down why the solution is correct."},"qa":[["What are the parts of a stress test?","A brute force, a seeded random generator, the fast solution, and a loop that compares them."],["Why use small inputs in stress tests?","Small sizes and value ranges hit edge cases often, and a failing case stays readable."],["How do you make random tests reproducible?","Seed the generator and print the seed or the input of every failure."],["What does shrinking do?","It keeps simplifying a failing input while it still fails, leaving a minimal counterexample."],["What does a validator do?","It checks that every test input obeys the problem's constraints exactly."],["How do you check that you really understand an algorithm?","Explain it to someone: the idea, an example, why it's correct and what it costs."]],"quiz":[{"q":"What does this print?","snip":{"t":"Exhaustive testing of every tiny input","tabs":[{"lang":"python","src":"from itertools import product\nbuggy = lambda a: all(a[i] < a[i + 1] for i in range(len(a) - 1))    # \"is it sorted?\"\nright = lambda a: all(a[i] <= a[i + 1] for i in range(len(a) - 1))\nfirst = next(a for n in range(4) for a in product(range(3), repeat=n) if buggy(a) != right(a))\nprint(*first)\n"},{"lang":"javascript","src":"const buggy = a => a.every((x, i) => i === 0 || a[i - 1] < x);   // \"is it sorted?\"\nconst right = a => a.every((x, i) => i === 0 || a[i - 1] <= x);\nlet first = null;\nfor (let n = 0; n < 4 && !first; n++) {\n  for (let code = 0; code < 3 ** n && !first; code++) {\n    const a = Array.from({ length: n }, (_, i) => Math.floor(code / 3 ** (n - 1 - i)) % 3);\n    if (buggy(a) !== right(a)) first = a;\n  }\n}\nconsole.log(...first);\n"}]},"o":["0 0","0 1","1 0","0 0 0"],"a":0,"e":"Inputs are tried by length, then in order: (), (0), (1), (2), then (0, 0). For (0, 0) the buggy check says “not sorted” because 0 < 0 is false, while the right one says “sorted”. Every shorter input agrees."},{"q":"What does this print? (`shrink` is this module's helper: it tries dropping an element first, then moving a value one step towards 0.)","snip":{"t":"Shrinking a failing input","tabs":[{"lang":"python","src":"print(*shrink([4, 9, 2], lambda b: sum(b) >= 10))\n"},{"lang":"javascript","src":"console.log(...shrink([4, 9, 2], b => b.reduce((s, x) => s + x, 0) >= 10));\n"}]},"o":["8 2","9 2","10","4 9 2"],"a":0,"e":"Dropping 4 leaves [9, 2] (sum 11, still failing). Dropping either of those no longer fails, so values move: [8, 2] still sums to 10. From there [7, 2] and [8, 1] both sum to 9, so [8, 2] is minimal."},{"q":"What matters most about the brute force in a stress test?","o":["It's obviously correct, even if it's very slow","It's fast enough for the full constraints","It shares helper functions with the fast solution","It uses random numbers"],"a":0,"e":"The brute force is the oracle, so trust is everything and speed doesn't matter on tiny inputs. Sharing helpers would hide shared bugs, and the randomness belongs in the generator."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["Small random inputs with small value ranges find most wrong-answer bugs quickly","Printing the seed or the input of a failing test makes it reproducible","A stress test that passes 10,000 cases proves the solution correct","The brute force should reuse the fast solution's helpers to save time","Math.random can be seeded in JavaScript"],"a":[0,1],"e":"Tiny inputs hit edge cases often, and a seed lets you replay a failure. Passing tests is evidence, not proof; shared helpers hide shared bugs; and Math.random takes no seed."},{"q":"Judge each statement.","t":"yn","s":[["Shrinking keeps simplifying a failing input while it still fails.",true],["A validator checks that test inputs obey the problem's constraints.",true],["If the fast and slow solutions agree on random tests, n = 1 needs no separate test.",false],["The same seeded generator produces the same tests every run.",true]],"e":"Shrinking stops at a minimal failing case. A validator guards the test files themselves. Random tests may never produce n = 1 or other special shapes, so add them by hand. And a fixed seed means a fixed sequence."},{"q":"Put the steps of stress testing in order.","t":"ord","items":["Write an obviously correct brute force","Write a seeded generator of small random inputs","Run both solutions on thousands of inputs until they disagree","Shrink the failing input, then debug the fast solution on it"],"e":"The loop needs the oracle and the generator, and only a failure gives you something to shrink and debug."},{"q":"Complete the Python stress-test loop.","t":"drop","lang":"python","code":"def first_failure(fast, slow, gen, tries):\n    for t in range(1, tries + 1):\n        case = {{0}}\n        if {{1}}:\n            return t, case\n    return None\n","blanks":[{"o":["gen()","gen","slow(gen())","fast(gen())"],"a":0},{"o":["fast(case) != slow(case)","fast(case) == slow(case)","fast(case)","not slow(case)"],"a":0}],"e":"Each try needs a fresh input from the generator, and a test fails when the two answers differ."},{"q":"Match each part of a testing setup to its job.","t":"match","pairs":[["An obviously correct but slow solution","The brute force, used as the oracle"],["Small random inputs, replayable from a seed","The generator"],["Checks that every test input obeys the constraints","The validator"],["Turns a long failing input into a minimal one","Shrinking"]],"extra":["The time limit"],"e":"The oracle judges answers, the generator supplies inputs, the validator guards the inputs, and shrinking simplifies a failure. The time limit is a constraint, not a testing tool."}],"probs":[["LC 8 · String to Integer (atoi)","https://leetcode.com/problems/string-to-integer-atoi/","Medium","the worked example: a rule-by-rule parser, stress tested against a regular expression"],["LC 65 · Valid Number","https://leetcode.com/problems/valid-number/","Hard","a small state machine for numbers like “-1.5e+10”; stress test it against a regular expression on random strings"],["LC 468 · Validate IP Address","https://leetcode.com/problems/validate-ip-address/","Medium","edge cases galore (leading zeros, empty groups, “::”): write the rules out, then stress test them"],["LC 227 · Basic Calculator II","https://leetcode.com/problems/basic-calculator-ii/","Medium","a stack of terms; stress test against Python's eval with // on random expressions (all operands are non-negative, so // truncates like the problem asks)"],["LC 10 · Regular Expression Matching","https://leetcode.com/problems/regular-expression-matching/","Hard","DP over (i, j); stress test against Python's re.fullmatch or a JavaScript RegExp on random short patterns"]],"src":[["Hypothesis: property-based testing for Python","https://hypothesis.readthedocs.io/"],["fast-check: property-based testing for JavaScript","https://fast-check.dev/"],["Codeforces Polygon: the problem-preparation system (validators, generators, checkers)","https://polygon.codeforces.com/"],["Python documentation: the random module (seeding)","https://docs.python.org/3/library/random.html"]]}],"plan":[{"t":"Flows, matching & graph structure","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a dsa-l4/ folder with python/ and js/; pytest and node --test; accounts on CSES and Codeforces; a stress-test script you can reuse (module 10)","min":45,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"lab","ref":"lab-scc"},{"k":"mod","ref":"m02"},{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-flow"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Trees, strings & structures","blocks":[{"k":"mod","ref":"m04"},{"k":"lab","ref":"lab-lca"},{"k":"mod","ref":"m05"},{"k":"mod","ref":"m06"},{"k":"lab","ref":"lab-suffix"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Geometry & maths","blocks":[{"k":"mod","ref":"m07"},{"k":"lab","ref":"lab-geometry"},{"k":"mod","ref":"m08"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Expert technique","blocks":[{"k":"mod","ref":"m09"},{"k":"mod","ref":"m10"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L4","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-contests","label":"Eight contests (rated or virtual, Codeforces Div. 2 or LeetCode weekly); upsolve the first problem you missed and write a five-line review each time","min":960,"kind":"Milestone"},{"id":"t-problem","label":"Set one original problem: statement, constraints, brute force, model solution, random generator, stress test and a short editorial (the capstone)","min":600,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the module problems solved and logged with the technique and the proof idea for each (about an hour a problem)","min":4200,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L4: your technique map from L1 to L4, the 5 problems that taught you most, and how you'd teach one technique to an L2 learner; save it to the vault","min":90,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Tara's exam-week planner","org":"A planner for a school's exam week","min":25,"blurb":"Flows, matching, assignment, 2-SAT and SCCs inside one scheduling tool.","sections":[["Overview","Tara's school runs an exam week for 1,200 students, 40 rooms and 60 invigilators. She is building the planner."],["Features",["Seating: each student lists the rooms they can get to, and each room has a number of seats. Seat as many students as possible.","Invigilators: 60 invigilators and 60 sessions, a travel cost for every invigilator–session pair, and each session needs exactly one invigilator. Cover every session at the least total cost.","Morning or afternoon: every exam goes in the morning or the afternoon, and two exams that share students must be in different halves of the day.","Network: the school's network is a graph of switches and cables. Find the fewest cables an outage would have to cut to separate the server room from the exam hall.","Loops: find the groups of exams that all depend on each other through results (A needs B's marks, B needs C's, C needs A's)."]],["Constraints",["Every answer must be exact, not a heuristic.","Tara wants the algorithm and its cost for each feature."]]],"items":[{"d":"d1","q":"Which model fits the seating feature?","o":["Max flow: s → student (capacity 1), student → room (1), room → t (its seats)","Kuhn's matching, using every room once","Dijkstra from each student","Seat each student in the first free room on their list"],"a":0,"e":"Rooms take many students, so it's a capacitated matching: one unit of flow per seated student, with integer capacities giving a whole-number plan. Plain matching allows one student per room, and the greedy can block later students."},{"d":"d1","q":"Which algorithm fits the invigilator feature?","o":["The Hungarian algorithm on the 60 × 60 cost matrix, O(n³)","Kuhn's algorithm, O(V E)","Kruskal's algorithm","Bellman–Ford from each invigilator"],"a":0,"e":"A perfect pairing at least total cost is the assignment problem; 60³ is about 2 × 10⁵ steps. Kuhn ignores costs, and the other two solve tree and path problems."},{"d":"d1","q":"How should the planner handle “exams a and b must be in different halves of the day”?","o":["2-SAT, with the clauses (a ∨ b) and (¬a ∨ ¬b) for each pair","Colouring the clash graph with three colours","A minimum cut between morning and afternoon","A topological sort of the exams"],"a":0,"e":"x = “morning” for each exam, and the two clauses say exactly one of a and b is in the morning. On its own that's a two-colouring check, but 2-SAT also handles one-sided rules such as “if a is in the morning, c must be too”."},{"d":"d1","t":"ms","q":"Which statements about the network feature are true? (choose 2)","o":["Give every cable capacity 1 in both directions and run max flow from the server room to the hall","The answer equals the most cable-disjoint routes between them (Menger's theorem)","Finding the bridges answers it","The length of the shortest route is the answer","The answer is always 1"],"a":[0,1],"e":"A minimum cut with unit capacities counts the fewest cables, and max flow equals it. Bridges only find single cables whose loss disconnects the network, and route length is unrelated."},{"d":"d1","q":"Which algorithm finds the groups of exams that depend on each other?","o":["Strongly connected components (Tarjan or Kosaraju)","Union–find over the dependency pairs","Bipartite matching","A minimum spanning tree"],"a":0,"e":"Mutual dependence in a directed graph is exactly an SCC, found in O(V + E). Union–find ignores direction, so it would merge exams that depend one way only."}]},{"id":"cs2","title":"Ben's map-and-search service","org":"A delivery start-up's map and catalogue search","min":25,"blurb":"Exact geometry, suffix arrays, LCA and stress testing in one product.","sections":[["Overview","Ben runs a small delivery start-up. Its product has a map service and a search box for the product catalogue."],["Features",["Zones: for each of 10⁵ delivery addresses (integer coordinates up to 10⁹), decide whether it is inside, outside or on the border of a zone given as a simple polygon.","Fence: find the smallest convex region that contains every depot, listing the depots on its border, including those on straight stretches.","Search: for 10⁵ queries, count how many times each query string occurs in a 10⁶-character catalogue.","Org chart: answer 10⁵ questions “who is the lowest common manager of these two people?” on a company tree of 2 × 10⁵ people.","Quality: a colleague wrote a clever O(n log n) pricing routine, and Ben wants confidence it's right before launch."]],["Constraints",["JavaScript on the server and Python for batch jobs: both must give identical answers.","No floating-point surprises in the geometry."]]],"items":[{"d":"d3","q":"Which approach fits the zones feature?","o":["Exact integer orientation tests: an on-edge check, then ray casting with the half-open rule (BigInt in JavaScript)","Adding up floating-point angles around the address","Checking the address against the polygon's bounding box","Triangulating the polygon with floating-point coordinates"],"a":0,"e":"Orientation tests are exact with integers, and BigInt keeps JavaScript exact at 10⁹. Angle sums and floating point can misjudge points near the border, and a bounding box is only a quick filter."},{"d":"d3","q":"Which algorithm fits the fence feature?","o":["Andrew's monotone chain, popping only on right turns so border depots stay","Gift wrapping with floating-point angles","Sorting depots by distance from the centre","A minimum spanning tree of the depots"],"a":0,"e":"The monotone chain is O(n log n) and exact; popping on cross < 0 keeps collinear depots, as LeetCode 587 does. The other methods don't produce a convex boundary reliably."},{"d":"d2","q":"Which structure fits the search feature?","o":["A suffix array of the catalogue: each query's occurrences form one block, found by two binary searches","KMP over the whole catalogue for every query","A hash set of every substring of the catalogue","Sorting the queries alphabetically"],"a":0,"e":"After one O(n log n)-ish build, each query costs O(m log n). KMP per query is about 10⁶ × 10⁵ = 10¹¹ steps, and storing every substring is O(n²)."},{"d":"d2","q":"Which technique fits the org chart?","o":["Binary lifting (or an Euler tour with a sparse table) after O(n log n) preparation","A BFS from both people for every question","Floyd–Warshall on the company tree","Union–find over the reporting lines"],"a":0,"e":"LCA queries cost O(log n) each with binary lifting, or O(1) with a sparse table over the Euler tour. BFS per question is O(n) each, and Floyd–Warshall is O(n³)."},{"d":"d4","t":"yn","q":"Judge each statement about the quality feature.","s":[["A stress test compares the routine with an obviously correct brute force on thousands of small random inputs.",true],["If the routine passes 10,000 random tests, it is proven correct.",false],["A seeded generator lets Ben replay any failure exactly, in both languages.",true],["The brute force should reuse the routine's helper functions.",false]],"e":"Stress tests find most bugs quickly, but they're evidence, not proof. A shared seeded generator (mulberry32) gives identical tests in Python and JavaScript, and the brute force must stay independent of the code it checks."}]}],"diag":[{"d":"d1","q":"Which algorithm finds all the strongly connected components of a directed graph in O(V + E)?","o":["Tarjan's algorithm: one depth-first search with low-link values","Prim's algorithm","A topological sort on its own","Dijkstra's algorithm from every vertex"],"a":0,"e":"Kosaraju's two-pass algorithm also works. A topological sort needs a DAG to begin with, and Prim and Dijkstra solve different problems."},{"d":"d1","q":"When does a 2-SAT formula have no solution?","o":["When some variable x lies in the same SCC as ¬x in the implication graph","Whenever x can reach ¬x","Whenever the implication graph has a cycle","When there are more clauses than variables"],"a":0,"e":"x → ¬x alone only forces x to be false; the contradiction needs both directions. Cycles are normal in implication graphs, and the clause count doesn't decide it."},{"d":"d1","q":"After computing a maximum flow, how do you find a minimum cut?","o":["Take the vertices s still reaches in the residual graph; the cut is the edges leaving them","Take every edge whose flow equals its capacity","Take the edges of the last augmenting path","Take the smallest-capacity edges until s and t are separated"],"a":0,"e":"The residual search gives a cut whose edges are all full, so its capacity equals the flow. Full edges in general are too many, and the other two have nothing to do with the cut."},{"d":"d1","q":"In a bipartite graph, a maximum matching has 7 edges. How many vertices are in a minimum vertex cover?","o":["7","14","It depends on the number of vertices","6"],"a":0,"e":"Kőnig's theorem: in a bipartite graph the two numbers are equal. 14 would take both ends of every matched edge."},{"d":"d1","q":"Which algorithm assigns n workers to n jobs at the least total cost in O(n³)?","o":["The Hungarian algorithm","Kuhn's algorithm","Kruskal's algorithm","Giving each worker their cheapest free job"],"a":0,"e":"Kuhn's algorithm ignores costs, Kruskal builds spanning trees, and the greedy choice can be far from optimal."},{"d":"d2","q":"With binary lifting, what does up[j][v] hold?","o":["v's 2^j-th ancestor","v's j-th child","the depth of v's j-th ancestor","the j-th vertex on the path from the root to v"],"a":0,"e":"Each level doubles the jump: up[j][v] = up[j − 1][up[j − 1][v]]."},{"d":"d2","q":"In a DFS preorder numbering with entry time tin[v] and exit marker tout[v], which positions hold v's subtree?","o":["The contiguous block [tin[v], tout[v])","tin[v] up to tin[v] + depth[v]","Every position after tin[v]","Positions 0 up to tout[v]"],"a":0,"e":"A preorder visits a whole subtree before leaving it, so the subtree is one block, and range structures apply to it."},{"d":"d2","q":"Given the LCP array of a string of length n, how many distinct substrings does it have?","o":["n(n + 1)/2 − Σ lcp","Σ lcp","n² − max(lcp)","n(n + 1)/2 − max(lcp)"],"a":0,"e":"There are n(n + 1)/2 substring positions, and suffix sa[i] repeats exactly lcp[i] prefixes of earlier suffixes."},{"d":"d2","q":"Why can a sparse table answer a range minimum in O(1) but not a range sum?","o":["Its two blocks overlap, which a minimum ignores but a sum counts twice","Sums need more memory than minimums","Minimums are never bigger than sums","The table can't store negative numbers"],"a":0,"e":"min(x, x) = x, while x + x ≠ x. Memory and signs don't come into it."},{"d":"d3","q":"With integer coordinates, what does the sign of cross(o, a, b) tell you?","o":["Whether o
