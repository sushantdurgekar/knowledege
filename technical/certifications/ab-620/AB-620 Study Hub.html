{
  id: "e02", d: "d3", t: "Solutions, existing agents and environment variables", min: 80,
  hook: "ALM questions are common and often **build lists**: put the steps in order. This module covers the solution half: publishers, preferred solutions, adding existing agents with their required objects, environment variables and connection references, and what doesn't travel.",
  pre: { q: "You export a solution containing your agent and import it into test. The agent runs, but it isn't in Teams and the Application Insights logging is gone. Bug?", a: "No. **Channels**, **sharing**, **manual authentication settings**, **Application Insights** and web channel security aren't solution-aware. Reconfigure them in each environment after import." },
  story: [
    "Asha's agent works in her developer environment. Now it must move to **test** and **production** without anyone rebuilding it by hand. The vehicle is a **solution**.",
    "She created one on day one: a **publisher** called *Contoso* with prefix `cr5`, and a solution *Customer Support Assistant*, set as the **preferred solution** so every new component landed in it. But two flows were built before that, outside the solution. In the solution she uses **Add existing > Agent**, then on the agent's menu **Advanced > Add required objects**, which pulls in the topics, flows, connection references, environment variables and tables the agent depends on.",
    "Environment-specific values move out of the agent. The carrier API base URL becomes an **environment variable** (`cr5_CarrierBaseUrl`, text), and the API key a **secret** environment variable that points to **Azure Key Vault**. Topics read them as `Env.cr5_CarrierBaseUrl`. In Copilot Studio they're read-only, and changing a value means **republishing** the agent, except secrets, which are fetched at run time.",
    "Each connector in each flow uses a **connection reference**, so test can bind a test mailbox and production the real one. Asha exports the solution as **managed** for test and production (and keeps it **unmanaged** in dev, where she edits).",
    "After the first import she writes a *post-deployment checklist*: add the Teams channel and availability, share the agent with the right security group, set manual authentication values for the production app registration, reconnect Application Insights, and configure web channel security. None of these travel in the solution."
  ],
  breaks: "Solutions move *definitions*, not *data* or *everything around the agent*. Dataverse rows (sample returns), connections themselves (credentials), channel registrations and environment-level settings stay behind, and some knowledge sources point at environment-specific locations that need checking.",
  dia: [
    { type: "nest", cap: "What a Copilot Studio solution can carry", levels: [["Solution (publisher prefix cr5)", "unmanaged in dev, managed downstream"], ["Agent + components", "topics, child agents, knowledge definitions, tools, prompts, component collections"], ["Dependencies", "agent flows, custom connectors, Dataverse tables, AI prompts"], ["Configuration objects", "environment variables (incl. secrets → Key Vault), connection references"]] },
    { type: "layers", cap: "Not solution-aware: redo after import", rows: [["Channels", "Teams + Microsoft 365, website, others; availability and admin approval"], ["Sharing", "editors, viewers, security groups"], ["Manual authentication", "client IDs, secrets, scopes per environment"], ["Web channel / Direct Line security", "secrets and require secured access"], ["Application Insights", "connection string and logging options"]] }
  ],
  keys: [
    "**Publisher** sets the customisation **prefix** (e.g., `cr5_`). Create your own instead of using the default publisher.",
    "**Preferred solution**: new components created in Copilot Studio land in it automatically.",
    "Add an existing agent: solution > **Add existing > Agent**; then agent ⋮ > **Advanced > Add required objects** to include dependencies (flows, connection references, environment variables, tables).",
    "**Unmanaged** in development (editable); **managed** in test/production (locked, clean uninstall, layering).",
    "**Environment variables**: types Text, Decimal number, Yes/No, JSON, Data source, **Secret** (Azure Key Vault). Default value vs current value; set current values per environment at import or in the pipeline.",
    "In Copilot Studio, environment variables are **read-only** (`Env.` prefix). After changing a value, **republish** the agent; **secrets** are read at run time.",
    "Secret environment variables reference **Key Vault** secrets: the Key Vault must allow the Dataverse/Power Platform service to read it.",
    "**Connection references** decouple flows and tools from specific connections; each environment binds its own connection.",
    "Not solution-aware: **channels**, **sharing**, **manual authentication**, **web/Direct Line security**, **Application Insights** settings → post-deployment steps.",
    "**Component collections** (shared topics, knowledge, tools, entities) also move through solutions.",
    "**Model choice** is an agent property that travels with the solution: change the model in dev and re-promote, rather than editing production."
  ],
  cmp: [{ cap: "Managed vs unmanaged solutions", head: ["", "Unmanaged", "Managed"], rows: [["Where", "Development", "Test and production"], ["Editable", "Yes", "No (locked, except allowed layers)"], ["Uninstall", "Removes the container, leaves components", "Removes components cleanly"], ["Source control", "Exported and unpacked for Git", "Built artifact deployed"]] }],
  code: [{ t: "Deployment settings file: environment variables and connection references per target", lang: "json", src: `{
  "EnvironmentVariables": [
    { "SchemaName": "cr5_CarrierBaseUrl", "Value": "https://api.carrier.example/v2" },
    { "SchemaName": "cr5_CarrierApiKey",
      "Value": "/subscriptions/<sub>/resourceGroups/rg-prod/providers/Microsoft.KeyVault/vaults/kv-contoso/secrets/carrier-key" }
  ],
  "ConnectionReferences": [
    { "LogicalName": "cr5_sharedoffice365_returns", "ConnectionId": "<prod connection id>",
      "ConnectorId": "/providers/Microsoft.PowerApps/apis/shared_office365" }
  ]
}`, notes: [[1, "Generated with `pac solution create-settings`; used by pipelines and CI/CD to set values per environment."], [3, "A text environment variable: the value differs per environment."], [5, "A **secret** variable stores a Key Vault secret reference, not the secret itself."], [8, "Each connection reference is bound to an existing connection in the target environment."]] }],
  portal: [
    { t: "Put an existing agent in a solution with its dependencies", path: "Copilot Studio > Solutions > (solution) > Add existing > Agent", steps: ["Select the agent and add it.", "On the agent's ⋮ menu: **Advanced > Add required objects**.", "Check the solution now lists topics, flows, connection references, environment variables and tables.", "Set the solution as **preferred** for future work."] },
    { t: "Create an environment variable (new UI)", path: "Solution objects > + New > More > Environment variable", steps: ["Display name, schema name (prefix added), data type (Text, Secret...).", "Default and/or current value; for Secret, point to the Key Vault secret.", "Use it in topics as `Env.<schema name>`.", "After changing a non-secret value, **republish** the agent."] }
  ],
  ex: { q: "Your agent calls a pricing API whose URL and key differ between test and production. Make it portable.", steps: ["URL differs → text environment variable.", "Key is a secret → secret environment variable in Azure Key Vault.", "Topics/HTTP nodes read `Env.` values; deployment sets values per environment."], a: "Create `cr5_PricingBaseUrl` (Text) and `cr5_PricingApiKey` (**Secret**, Key Vault reference) in the solution; use `Env.cr5_PricingBaseUrl` in the HTTP URL and the secret in the header; set values per environment at import or through the pipeline; republish after changing non-secret values." },
  fade: { q: "After importing to test, a tool fails with a connection error.", steps: ["Connections aren't moved; references are.", { ask: "What must exist in test?", a: "A **connection** for that connector, bound to the solution's **connection reference** (set during import or in the pipeline's deployment settings)." }, { ask: "And if the tool uses end-user credentials?", a: "Users create their own connections at runtime; the reference still needs to resolve, and the connector must be allowed by test's DLP policy." }] },
  traps: [
    ["Expecting channels and Teams availability to come with the import.", "Not solution-aware; reconfigure after import."],
    ["Editing environment variable values in production and expecting the agent to pick them up instantly.", "Republish (secrets are the exception)."],
    ["Putting a real API key in a text environment variable.", "Use a **secret** environment variable backed by Azure Key Vault."],
    ["Adding only the agent to the solution.", "Use **Add required objects** so flows, references and variables come too."],
    ["Importing unmanaged solutions into production.", "Use managed downstream; unmanaged is for development."]
  ],
  disc: [
    ["Why bother with a custom publisher?", "The prefix identifies your components, avoids collisions with other teams and ISVs, and keeps ownership clear across environments."],
    ["What belongs on a post-deployment checklist for Copilot Studio?", "Channels and availability (Teams admin approval), sharing with security groups, manual auth values (client IDs/secrets), web channel security, App Insights, connection bindings, DLP compatibility, a smoke test and publish."]
  ],
  teach: { prompt: "Explain how you'd package an agent for ALM: solution, required objects, environment variables, connection references and post-deployment steps.", rubric: ["Custom publisher + preferred solution", "Add existing > Agent + Add required objects", "Env vars (secret via Key Vault), read-only, republish", "Connection references per environment", "Managed downstream", "Post-deploy: channels, sharing, manual auth, App Insights, web security"], model: "I create a publisher and solution, set it as preferred, and if the agent already exists I add it with Add existing and then Add required objects so flows, connection references, variables and tables come along. Environment-specific values become environment variables, with secrets in Key Vault; they're read-only in Copilot Studio and need a republish after changes, except secrets. Connection references let each environment bind its own connections. I deploy managed solutions to test and production, then redo channels, sharing, manual auth, web security and Application Insights, which don't travel." },
  qa: [["Pull in an agent's dependencies?", "Agent ⋮ > Advanced > **Add required objects**."], ["Environment variable prefix in topics?", "`Env.`"], ["Change a non-secret env var value — then?", "**Republish** the agent."], ["Where do secret env vars live?", "**Azure Key Vault**."], ["Five things not in solutions?", "Channels, sharing, manual auth, web/Direct Line security, App Insights."], ["Managed or unmanaged in production?", "**Managed**."]],
  quiz: [
    { t: "ord", q: "Order the steps to move an existing agent (built outside any solution) into ALM.", items: ["Create a publisher with your prefix", "Create a solution and set it as preferred", "Add existing > Agent", "Agent ⋮ > Advanced > Add required objects", "Export the solution as managed for test"], e: "Publisher → solution → add agent → dependencies → export.", tp: "Solutions" },
    { t: "yn", q: "Evaluate each statement about environment variables in Copilot Studio.", s: [["Topics can change an environment variable's value at run time.", false], ["After changing a text environment variable's value, you republish the agent.", true], ["Secret environment variables store a reference to an Azure Key Vault secret.", true]], e: "Env vars are read-only; republish after changes; secrets reference Key Vault.", tp: "Environment variables" },
    { t: "ms", q: "After importing a managed solution into production, which TWO settings must you configure again?", o: ["The Teams + Microsoft 365 channel and availability", "Application Insights connection string", "The agent's topics", "The agent's knowledge source definitions", "The agent flows"], a: [0, 1], e: "Channels and App Insights aren't solution-aware; topics, knowledge definitions and flows travel.", tp: "Post-deployment" },
    { q: "An agent's flow must send email from different mailboxes in test and production without editing the flow. What makes this possible?", o: ["A global variable", "A connection reference bound to a different connection in each environment", "Two copies of the flow", "Maker-provided credentials"], a: 1, e: "Connection references decouple flows from specific connections.", tp: "Connection references" },
    { t: "match", q: "Match each requirement to the ALM feature.", pairs: [["API key different per environment, kept secret", "Secret environment variable (Key Vault)"], ["Base URL different per environment", "Text environment variable"], ["Production components locked against edits", "Managed solution"], ["New components automatically added to your solution", "Preferred solution"]], extra: ["Component collection"], e: "Secrets → secret env var; config → env var; locked → managed; auto-add → preferred.", tp: "ALM features" },
    { q: "The team wants production on a newer model. What's the recommended approach?", o: ["Change the model directly in production", "Change the model in development, evaluate, and promote the solution", "Create a new agent in production", "Use an environment variable for the model"], a: 1, e: "The model is an agent property that flows with the solution; change in dev and re-promote.", tp: "Model changes" }
  ],
  src: [["Export and import agents using solutions", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-solutions-import-export"], ["Variables overview: environment variables (Copilot Studio)", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-variables-about#environment-variables"], ["Environment variables overview (Power Apps)", "https://learn.microsoft.com/en-us/power-apps/maker/data-platform/environmentvariables"], ["AB-620T00 lab 5.4: ALM and model candidates", "https://github.com/MicrosoftLearning/AB-620T00_build_integrated_ai_agents_in_copilot_studio/blob/main/Instructions/Labs/lab-5-evaluate-publish-and-manage/exercise-4-alm-and-model-candidates.md"]]

{
  id: "e03", d: "d3", t: "Power Platform pipelines (implement and extend)", min: 75,
  hook: "*Implement and extend Microsoft Power Platform Pipelines* is the last D3 skill, and the one that most rewards precise facts: managed environment targets, stages, delegated deployments, gated extensions with their trigger and action names, and what pipelines can't do.",
  pre: { q: "Makers should deploy to production without having any permissions in production, and the release manager must approve first. Which pipeline feature?", a: "**Delegated deployment** (*Is Delegated Deployment* on the stage): the deployment runs as a **service principal** or the **pipeline stage owner**, and needs approval from an authorised identity." },
  story: [
    "Contoso used to move solutions by exporting zip files and emailing them. After one wrong file reached production, IT set up **Power Platform pipelines**.",
    "For her own project Asha could have used a **personal pipeline** from the Pipelines page (the **platform host**): one development environment and up to two targets. Contoso instead runs a **custom host** environment with the **Deployment Pipeline Configuration** app, where admins define pipelines, link environments and assign the **Deployment Pipeline Administrator** and **Deployment Pipeline User** roles.",
    "The *Customer Support Assistant* pipeline has stages **Test** then **Production**. Every environment has **Dataverse**, and every **target** is a **Managed Environment**. Stages run in order: you can't skip Test. The pipeline exports a **managed** artifact once and reuses the same artifact for each stage, with **pre-deployment validation** catching missing dependencies early.",
    "At **Deploy here**, Asha supplies the stage's **environment variable** values and picks **connection references** for the target, which the lab warns is the most common friction point. Production uses **delegated deployment**: a service principal deploys, so makers need no production rights, and the release manager approves.",
    "IT also **extends** the pipeline. The Production stage has **Pre-deployment Step Required** ticked: a Power Automate flow triggered by **OnPreDeploymentStarted** runs checks, posts an approval to Teams, and then calls the **UpdatePreDeploymentStepStatus** action with **20** (complete) or **30** (reject). Another flow on **OnDeploymentCompleted** posts release notes. For deeper needs (Git, complex branching), teams go to **Azure DevOps** or **GitHub Actions** with the Power Platform build tools."
  ],
  breaks: "Pipelines deploy solutions; they don't fix what solutions can't carry. Post-deployment steps (channels, sharing, manual auth, App Insights) still need a checklist or automation, and pipelines don't roll back by themselves: you redeploy a previous version.",
  dia: [
    { type: "flow", cap: "A pipeline run", steps: [["Request", "maker selects Deploy here; OnDeploymentRequested"], ["Pre-export step", "optional gate (first stage): UpdatePreExportStepStatus"], ["Export + validate", "managed artifact, dependency checks"], ["Approval", "delegated deployment: OnApprovalStarted / Completed"], ["Pre-deployment step", "optional gate: UpdatePreDeploymentStepStatus (20 complete, 30 reject)"], ["Deploy", "OnDeploymentStarted → OnDeploymentCompleted"]] },
    { type: "seq", cap: "Gated pre-deployment step with Power Automate", actors: ["Pipeline", "Cloud flow", "Approver"], msgs: [["Pipeline", "Cloud flow", "OnPreDeploymentStarted"], ["Cloud flow", "Approver", "Teams/Outlook approval with details"], ["Approver", "Cloud flow", "Approve", true], ["Cloud flow", "Pipeline", "UpdatePreDeploymentStepStatus = 20"], ["Pipeline", "Pipeline", "Deploy to target; OnDeploymentCompleted"]] }
  ],
  keys: [
    "**Platform host**: available to everyone from the Pipelines page; **personal pipelines** with one dev environment and up to **two targets**. **Custom host**: a dedicated host environment with the **Deployment Pipeline Configuration** app for centrally managed pipelines.",
    "Requirements: all pipeline environments have **Dataverse**; **target environments must be Managed Environments**; default and Teams environments can't be targets for personal pipelines.",
    "Stages run **in order** (dev → test → prod); one managed artifact is exported once and reused across stages; **pre-deployment validation** checks dependencies.",
    "At deployment: set **environment variable** values and **connection references** for the target (most common friction point).",
    "Roles: **Deployment Pipeline Administrator** (configure), **Deployment Pipeline User** (run pipelines they're granted).",
    "Gated extensions on a stage: **Pre-export Step Required** (first stage only; `UpdatePreExportStepStatus`), **Is Delegated Deployment** (service principal or stage owner; approval required), **Pre-deployment Step Required** (`UpdatePreDeploymentStepStatus`).",
    "Gate status values: **10** pending (system), **20** complete, **30** reject (deployment fails).",
    "Power Automate triggers: **OnDeploymentRequested** (fires for all deployments), OnApprovalStarted, OnApprovalCompleted, OnPreDeploymentStarted, OnPreDeploymentCompleted, OnDeploymentStarted, OnDeploymentCompleted.",
    "Comments: ApprovalComments / pre-deployment comments are visible to makers in run history; PreExportProperties / ApprovalProperties are admin-only.",
    "Limits/notes: one solution per deployment run; no automatic rollback (redeploy a previous version); for Git-based CI/CD use **Azure DevOps** or **GitHub Actions** with Power Platform build tools / `pac` CLI (`pac pipeline` commands exist)."
  ],
  cmp: [{ cap: "Platform host vs custom host", head: ["", "Platform host", "Custom host"], rows: [["Setup", "None: open Pipelines and create", "Admin creates host environment + configuration app"], ["Scope", "Personal pipelines (dev + 2 targets)", "Any number of pipelines and stages"], ["Governance", "Tenant admin manages", "Deployment Pipeline Administrator role; central control"], ["Extensions", "Limited", "Gated extensions, delegated deployments, flows on triggers"], ["Best for", "Small teams, quick start", "Enterprise ALM"]] }],
  code: [{ t: "Approving a gated pre-deployment step from a cloud flow (action inputs)", lang: "json", src: `{
  "trigger": "OnPreDeploymentStarted",
  "action": "Perform an unbound action (Dataverse)",
  "inputs": {
    "Action Name": "UpdatePreDeploymentStepStatus",
    "PreDeploymentStepStatus": 20,
    "StageRunId": "<StageRunId from the trigger's outputs>",
    "PreDeploymentComments": "Approved by release manager after smoke-test sign-off."
  }
}`, notes: [[2, "The flow starts when the stage's pre-deployment gate begins."], [5, "Gates are completed by calling a Dataverse **unbound action** in the pipelines host."], [6, "**20** completes the step; **30** rejects (deployment fails); **10** is the system's pending status."], [8, "Comments are shown to the maker in run history (shape simplified)."]] }],
  portal: [
    { t: "Deploy with a pipeline (maker)", path: "Copilot Studio / Power Apps > Solutions > (solution) > Pipelines", steps: ["Choose the pipeline and select **Deploy here** for the next stage.", "Review pre-deployment validation results.", "Provide **environment variable** values and map **connection references**.", "Add deployment notes; deploy (or wait for approval if delegated).", "After success: run post-deployment steps (channels, sharing, auth, App Insights) and smoke-test."] },
    { t: "Configure a custom-host pipeline (admin)", path: "Host environment > Deployment Pipeline Configuration app", steps: ["Register development and target environments (targets must be Managed Environments).", "Create the pipeline and its stages in order (Test, then Production).", "Set gated options per stage: pre-export, delegated deployment, pre-deployment step.", "Grant Deployment Pipeline User to makers; build flows on the pipeline triggers."] }
  ],
  ex: { q: "A regulated company needs: makers can't touch production; every production deployment is approved by a release manager in Teams; a ServiceNow change record must be created automatically.", steps: ["No maker rights in prod + approval → delegated deployment.", "Extra Teams approval and checks after approval → pre-deployment step with a flow.", "Change record → a flow on the deployment triggers."], a: "Custom-host pipeline; Production stage with **Is Delegated Deployment** (service principal) and **Pre-deployment Step Required**; a flow on **OnPreDeploymentStarted** sends the Teams approval and calls **UpdatePreDeploymentStepStatus** (20/30); a flow on **OnDeploymentRequested** (or OnDeploymentStarted) creates the ServiceNow change record; makers hold only Deployment Pipeline User." },
  fade: { q: "A pipeline can't add the new production environment as a target.", steps: ["Targets have prerequisites.", { ask: "What do you check first?", a: "That the environment has **Dataverse** and is a **Managed Environment**." }, { ask: "And for personal pipelines on the platform host?", a: "Default and Teams environments can't be targets, and there's a limit of one dev plus two targets." }] },
  traps: [
    ["Using a non-managed environment as a pipeline target.", "Targets must be Managed Environments (with Dataverse)."],
    ["Expecting to skip the Test stage for a hotfix.", "Stages run in order."],
    ["Setting Pre-export Step Required on the production stage.", "It's meant for the **first** stage; production uses pre-deployment steps."],
    ["Using status 30 to mark a gate complete.", "**20** completes; **30** rejects."],
    ["Assuming pipelines roll back automatically.", "Redeploy a previous version; plan rollback."]
  ],
  disc: [
    ["When would you choose Azure DevOps or GitHub Actions over pipelines?", "When you need source control as the system of record, branching strategies, automated tests in CI, multi-solution orchestration, or integration with an existing enterprise release process. Pipelines are simpler and built in; many teams combine them (pipelines + Git export extensions)."],
    ["How would you automate post-deployment steps that solutions can't carry?", "Use a flow on OnDeploymentCompleted or a CI/CD stage with `pac`/APIs where available, plus a checklist for steps that still need a person (Teams admin approval, app registrations)."]
  ],
  teach: { prompt: "Explain how Power Platform pipelines work and how you'd extend them for approvals and automation.", rubric: ["Platform vs custom host", "Targets: Dataverse + Managed Environments; ordered stages; managed artifact", "Env var values and connection references at deploy", "Delegated deployment (service principal/stage owner)", "Gated pre-export/pre-deployment steps with UpdatePre...StepStatus 20/30", "Triggers: OnDeploymentRequested etc."], model: "Pipelines deploy a managed artifact through ordered stages to targets that must have Dataverse and be Managed Environments. The platform host gives personal pipelines; a custom host gives central control. At deployment I set environment variable values and connection references. To extend, delegated deployments run as a service principal or stage owner with approval, and gated pre-export or pre-deployment steps pause the run until a flow calls UpdatePreExportStepStatus or UpdatePreDeploymentStepStatus with 20 to complete or 30 to reject. Flows can also react to triggers like OnDeploymentRequested and OnDeploymentCompleted." },
  qa: [["Target environment requirement?", "**Managed Environment** with Dataverse."], ["Personal pipeline size?", "One dev + **two** targets."], ["Deploy without maker rights in prod?", "**Delegated deployment**."], ["Gate status to complete / reject?", "**20** / **30**."], ["Action for pre-deployment gate?", "`UpdatePreDeploymentStepStatus`."], ["Trigger that fires for all deployments?", "**OnDeploymentRequested**."], ["Can stages be skipped?", "**No**; they run in order."]],
  quiz: [
    { q: "A pipeline must pause after approval so a flow can run security checks and then continue or fail. Which stage setting?", o: ["Pre-export Step Required", "Pre-deployment Step Required", "Is Delegated Deployment", "Managed Environment"], a: 1, e: "Pre-deployment step inserts a custom step after approval.", tp: "Gated extensions" },
    { t: "drop", q: "Complete the flow action that rejects a gated pre-deployment step.", code: `Action Name: {{0}}

HUB.interview = [
{ c: "Architecture and design", q: "Walk me through how you'd design a Copilot Studio agent that answers HR questions and files leave requests.", a: "I start from requirements: audience (employees in Teams), data (HR policies in SharePoint, leave balances in the HR system), actions (submit leave), and risks (personal data, approvals).\n\nDesign: Microsoft sign-in; SharePoint knowledge (users' own permissions); a custom connector or agent flow for leave requests with an approval for long leave; instructions with scope and escalation; a topic only where wording is mandated. Then evaluation sets, Application Insights, a solution with environment variables, and a pipeline to production.", f: ["How would you handle a question the agent can't answer?", "Where would you need a human?"] },
{ c: "Architecture and design", q: "How do you choose between a connector, custom connector, REST API tool, HTTP node, agent flow, MCP and computer use?", a: "I climb a ladder: prebuilt connector first; custom connector if the API must be reused across apps and flows; REST API tool if only this agent needs it; HTTP node for a one-off call in a topic; agent flow for multi-step logic, approvals or parallel work; MCP when many agents and clients share a tool server (needs generative orchestration); computer use only when there's no API. Identity, DLP and licensing can move the choice.", f: ["What's the downside of MCP for deterministic steps?"] },
{ c: "Architecture and design", q: "When do you use topics if generative orchestration can figure things out?", a: "When the conversation must be predictable: mandated wording (legal disclaimers), a fixed sequence (confirm, then act), structured input with adaptive cards, or specific error handling. Generative orchestration chooses *when* to run the topic; the topic decides *exactly what happens*.", f: ["How do you stop a topic and the knowledge base competing?"] },
{ c: "Integration", q: "Copilot connectors vs real-time Power Platform connectors as knowledge: how do you choose?", a: "Copilot connectors index external content into Microsoft Graph (admin-configured, ACLs, citations, reused by Microsoft 365 Copilot) — great for large article bases. Real-time connectors query live systems under the user's identity with no data movement — right when data can't be copied or must be current. Many solutions use both.", f: ["What breaks if you use manual authentication with Copilot connectors?"] },
{ c: "Integration", q: "Explain agent flows and their limits.", a: "An agent flow starts with *When an agent calls the flow*, runs Power Automate actions and returns outputs with *Respond to the agent*. As a tool it must be published, synchronous and respond within about 100 seconds, so slow work goes after the response. They're billed in Copilot Credits, live in the solution and use connection references for ALM.", f: ["How would you handle an approval that takes days?"] },
{ c: "Multi-agent", q: "Child agent or connected agent?", a: "Child agents live inside the parent: own instructions and tools, shared context, same solution and release. Connected agents are separately published and owned, reusable by other agents, with their own lifecycle; you enable *let other agents connect*, share them, and decide whether to pass conversation history. I start with one agent and split only on real seams.", f: ["What are the hidden costs of multi-agent designs?"] },
{ c: "Multi-agent", q: "How would you bring a Foundry agent, a Fabric data agent and a partner's agent into one Copilot Studio solution?", a: "Foundry: connect with the project endpoint and agent ID; the agent needs the Activity endpoint and must be from the new portal. Fabric: a published data agent on F2+/P1+ in the same tenant, user authentication for row-level access, generative orchestration, Teams rather than Microsoft 365 Copilot. Partner: A2A with the endpoint URL and OAuth; review that the full chat history is sent.", f: ["How do you correlate transcripts across these agents?"] },
{ c: "Governance and safety", q: "How do you decide whose credentials a tool uses?", a: "If users should only see their own data or act as themselves, end-user credentials (default) with signed-in users. If users have no account in the target system or the data is the same for everyone, maker-provided credentials with a dedicated least-privilege account, confirmation for side-effects and auditing. Anonymous users can't use end-user credentials.", f: ["Why might an admin block maker-provided credentials?"] },
{ c: "Governance and safety", q: "What's your responsible-AI checklist before launching an external agent?", a: "Curated knowledge with citations; general knowledge decision; strict content moderation and a friendly On Error path; AI disclosure; scope and refusals in instructions, tested with a Custom grader; human escalation; approvals for high-impact actions; privacy (minimal data, retention, DLP); evaluation with content safety; monitoring and a feedback loop.", f: ["How do you test for fairness?"] },
{ c: "Governance and safety", q: "How would you lock down a production environment for agents?", a: "DLP that allows only needed connectors (Business group), blocks unneeded channels and knowledge sources, restricts HTTP with endpoint filtering, keeps App Insights allowed; Managed Environments for sharing limits; separate dev/test/prod; delegated pipeline deployments so makers have no prod rights; Purview audit.", f: ["What happens if a maker mixes Business and Non-business connectors?"] },
{ c: "Testing and ALM", q: "How do you evaluate an agent before release?", a: "Test sets from real questions, generated sets and a CSV with expected answers (up to 100 per set). Methods per goal: General quality, Compare meaning, Tool use, Keyword match, Content safety, Custom for refusals. Run as a realistic test user, review failures, fix, re-run the same set, export results (kept 89 days), and gate releases on agreed thresholds.", f: ["Which methods work for multi-turn sets?"] },
{ c: "Testing and ALM", q: "Walk me through promoting an agent from dev to prod.", a: "Everything is in a solution with our publisher; Add required objects pulls in flows, connection references and environment variables (secrets in Key Vault). A pipeline deploys a managed artifact through test to production (Managed Environments), mapping variable values and connection references. Production uses delegated deployment and a pre-deployment gate. Afterwards I redo channels, sharing, manual auth, web security and App Insights, then smoke-test.", f: ["How would you roll back?"] },
{ c: "Operations", q: "Users say the agent got worse last week. How do you investigate?", a: "Check what changed (model, instructions, knowledge, tools, connector versions). Look at analytics/Monitor for resolution and escalation trends, transcripts for failing conversations, Application Insights for errors and tool failures (excluding designMode traffic), and flow Activity for failed runs. Re-run the evaluation set to quantify the regression, fix, and add the failing cases to the set.", f: ["What alert would have caught it earlier?"] },
{ c: "Behavioural (STAR)", q: "Tell me about a time an automation or agent you built failed in production.", a: "Use STAR. *Situation*: e.g., a returns agent created duplicate records. *Task*: stop the impact and fix the cause. *Action*: disabled the tool, traced the runs in flow Activity (a retry on a non-idempotent write), added an idempotency check and confirmation before running, added the case to the evaluation set. *Result*: no duplicates since; a regression test guards it.", f: ["What would you do differently from the start?"] }
];

HUB.glossary = [
["A2A (Agent2Agent)", "Open protocol for one agent to delegate tasks to another agent on any platform; discovered through an agent card."],
["Activity map", "Test-pane view showing which topics, tools, knowledge and agents ran for a message."],
["Activity protocol endpoint", "Endpoint a Foundry agent must expose before Copilot Studio can connect to it."],
["Adaptive Card", "JSON-defined card with text, images, inputs and actions rendered by channels such as Teams."],
["Agent card", "A2A JSON document (at /.well-known/agent.json) describing an agent's name, skills, endpoint and auth."],
["Agent flow", "Power Automate-based flow native to Copilot Studio, triggered by an agent and returning outputs; called Workflow in the newest UI."],
["Allow all (MCP)", "Toggle that enables all current and future tools on an MCP server."],
["Application Insights", "Azure Monitor service that can receive Copilot Studio telemetry in the customEvents table."],
["Ask with adaptive card", "Topic node that shows an interactive card and saves each input into an output variable."],
["Authenticate manually", "Agent sign-in using your own Entra ID app registration or generic OAuth 2 provider; exposes the user's access token."],
["Authenticate with Microsoft", "Agent sign-in with Microsoft Entra ID handled automatically in Teams and Microsoft 365 surfaces."],
["Child agent", "Specialist agent built inside a parent agent; shares context and lifecycle."],
["Component collection", "Reusable set of topics, knowledge, tools and entities shared across agents."],
["Computer use", "Tool that lets an agent operate websites and desktop apps through the user interface."],
["Connected agent", "Separately published agent (Copilot Studio, Foundry, Fabric, A2A, Agents SDK) that another agent delegates to."],
["Connection reference", "Solution component pointing to a connection, so each environment can bind its own."],
["Content moderation", "Setting that controls how strictly generative responses are filtered for harmful content."],
["Conversational boosting", "System topic that falls back to generative answers when no topic matches (classic orchestration)."],
["Copilot connector", "Formerly Microsoft Graph connector: indexes external content into Microsoft Graph for agents and Microsoft 365 Copilot."],
["Copilot Credits", "Consumption unit for Copilot Studio usage such as generative answers, tools, flows and evaluations."],
["Custom connector", "Power Platform wrapper around your API (OpenAPI), reusable by apps, flows and agents."],
["Custom data", "Power Fx table (Content, ContentLocation, Title) given to a generative answers node; first 3 rows used."],
["Delegated deployment", "Pipeline deployment run as a service principal or stage owner instead of the maker, after approval."],
["designMode", "Telemetry dimension that is True for test-canvas conversations."],
["Direct Line", "Bot Framework channel API used by websites and apps; secrets exchanged for tokens server-side."],
["DLP policy", "Data loss prevention policy grouping connectors (and Copilot Studio features) as Business, Non-business or Blocked."],
["Environment variable", "Solution component holding environment-specific values; read-only in agents (Env.)."],
["Event trigger", "Trigger that starts an autonomous agent run from an event such as a new email or Dataverse row."],
["Fabric data agent", "Microsoft Fabric agent that answers questions over lakehouses, warehouses and semantic models."],
["Foundry IQ", "Managed knowledge bases over Azure AI Search; connected as a tool to GitHub Copilot harness agents."],
["Gated extension", "Pipeline stage setting that pauses a deployment until a flow completes or rejects a step."],
["Generative answers node", "Topic node that searches selected knowledge and summarises an answer with citations."],
["Generative orchestration", "Mode where the agent plans with descriptions of topics, tools, knowledge and agents."],
["GitHub Copilot harness", "Copilot Studio runtime for reasoning-heavy agents with skills, memory and file handling."],
["Harness", "The runtime between agent design and the model that decides calls and tools."],
["Managed Environment", "Power Platform environment with extra governance; required for pipeline targets."],
["Managed solution", "Locked solution package deployed to test and production."],
["MCP (Model Context Protocol)", "Open protocol for exposing tools and resources from a server to AI clients."],
["Memory", "GitHub Copilot harness feature letting an agent remember per-user information across sessions."],
["Microsoft Entra ID", "Microsoft's identity service used for sign-in, SSO and service principals."],
["Parse value", "Topic node that converts JSON text into a typed record or table."],
["Pipelines (Power Platform)", "Built-in ALM feature that deploys solutions through ordered stages."],
["Preferred solution", "Solution that new components are automatically added to."],
["Prompt (prompt tool)", "Reusable instructions with inputs run by a chosen model; returns text or JSON."],
["Publisher", "Solution owner record that defines the customisation prefix."],
["Real-time connector (knowledge)", "Power Platform connector used as live knowledge without copying data."],
["Request for information", "Agent flow action that asks a person to provide values through an Outlook actionable message."],
["REST API tool", "Copilot Studio tool created from an OpenAPI specification for agent-only use."],
["Send HTTP request", "Topic node that calls an HTTP endpoint with headers, body and response schema."],
["Skill", "Reusable SKILL.md guidance (name, description, instructions) applied by the GitHub Copilot harness."],
["Solution", "Package of Power Platform components moved between environments."],
["Standard harness", "Copilot Studio runtime for rule-based agents built with topics and defined paths."],
["Streamable HTTP", "MCP transport required by Copilot Studio."],
["System topic", "Built-in topic for conversation events (Conversation Start, On Error, Escalate, Fallback...)."],
["Test set", "Collection of up to 100 test cases used for agent evaluation."],
["Topic", "Authored conversation path made of nodes, variables and conditions."],
["Web channel security", "Setting that requires secrets/tokens to embed an agent on websites."],
["Work IQ", "Microsoft MCP-based tool giving agents workplace context across Microsoft 365."],
["Workflow", "Newest UI name for an agent flow."]
];

<script>
(function () {

DOM.forEach((d, i) => { DMAP[d.id] = d; d._i = i; d.cls = "d" + (i + 1); });
const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);

/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));

const CASE = {}; (H.cases || []).forEach(c => { CASE[c.id] = c; });

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {

    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }

function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {

  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }

    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }

}
async function pullRemote() {

    try {

}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }

}
function domainAccuracy(did) { const ds = S.dstat[did]; return ds && ds[1] ? ds[0] / ds[1] : null; }

  if (last.weighted >= 75) return { cls: "mid", label: "Readiness: almost", verdict: "mid", text: `Almost: last mock ${last.weighted}% weighted, weakest domain ${minDom}%, confident-wrong ${last.cwPct}%. ${prev ? "" : "One mock isn't enough evidence: take the second mock after fixing your weak topics. "}Ready means 85%+ on two consecutive mocks, every domain at 70%+, and confident-wrong at 10% or less.` };
  return { cls: "no", label: "Readiness: not yet", verdict: "no", text: `Not yet: last mock ${last.weighted}% weighted (weakest domain ${minDom}%). Work through the weakest modules (story, key points, quiz), redo your mistakes, then retake.` };
}

/* ---------- tabs + header ---------- */
const VIEWS = [["start", "Start"], ["plan", "Roadmap"], ["learn", "Learn"], ["practice", "Practice"], ["cases", "Case studies"], ["mock", "Mock exams"], ["labs", "Labs"], ["cards", "Flashcards"], ["interview", "Interview"], ["cheat", "Cheat sheet"], ["sources", "Sources"]];

/* ===== items: Microsoft-style question types =====
   mc  single answer         {q,o,a:int,e}
   ms  multiple answers      {q,o,a:[int],e}                partial credit
   yn  yes/no statements     {q,s:[[text,bool]],e}          partial credit (hot-area style)
   ord build list / order    {q,items:[in correct order],e} all-or-nothing
   drop code/hot-area blanks {q,code:"..{{0}}..",blanks:[{o:[..],a:int}],e} partial credit
   match drag-drop matching  {q,pairs:[[left,right]],extra:[right distractors],e} partial credit */
function prepItem(it) {
  const v = { it, t: it.t };
  if (v.t === "mc" || v.t === "ms") v.order = it.fix ? it.o.map((_, i) => i) : shuffle(it.o.map((_, i) => i));
  if (v.t === "ord") { let s = shuffle(it.items.map((_, i) => i)); if (s.every((x, i) => x === i) && s.length > 1) s = s.slice(1).concat(s[0]); v.start = s; }
  if (v.t === "match") { const n = it.pairs.length + (it.extra || []).length; v.rorder = shuffle(Array.from({ length: n }, (_, i) => i)); }
  if (v.t === "drop") v.dorder = it.blanks.map(b => (it.fix ? b.o.map((_, j) => j) : shuffle(b.o.map((_, j) => j))));
  if (v.t === "yn") v.sorder = it.fix ? it.s.map((_, i) => i) : shuffle(it.s.map((_, i) => i));
  return v;
}
function rightText(it, i) { return i < it.pairs.length ? it.pairs[i][1] : (it.extra || [])[i - it.pairs.length]; }
function isAnswered(v, r) {
  if (r == null) return false;
  switch (v.t) {
    case "mc": return typeof r === "number";
    case "ms": return r.length > 0;
    case "yn": case "drop": case "match": return r.some(x => x != null);
    case "ord": return true;
  }
  return false;
}
function gradeItem(it, r) {
  if (r == null) return 0;
  switch (it.t) {
    case "mc": return r === it.a ? 1 : 0;
    case "ms": { const C = new Set(it.a); let g = 0, b = 0; r.forEach(x => (C.has(x) ? g++ : b++)); return Math.max(0, (g - b) / C.size); }
    case "yn": return it.s.reduce((a, s, i) => a + (r[i] === s[1] ? 1 : 0), 0) / it.s.length;
    case "ord": return r.every((x, i) => x === i) ? 1 : 0;
    case "drop": return it.blanks.reduce((a, b, i) => a + (r[i] === b.a ? 1 : 0), 0) / it.blanks.length;
    case "match": return it.pairs.reduce((a, p, i) => a + (r[i] === i ? 1 : 0), 0) / it.pairs.length;
  }
  return 0;
}
function givenText(it, r) {
  if (r == null) return "(no answer)";
  try {
    switch (it.t) {
      case "mc": return LET[r] + ". " + it.o[r];
      case "ms": return r.map(x => it.o[x]).join(" | ");
      case "yn": return r.map(x => (x == null ? "-" : x ? "Y" : "N")).join("");
      case "ord": return r.map(x => it.items[x]).join(" > ");
      case "drop": return r.map((x, i) => (x == null ? "-" : it.blanks[i].o[x])).join(" | ");
      case "match": return r.map((x, i) => it.pairs[i][0] + "=" + (x == null ? "-" : rightText(it, x))).join("; ");
    }
  } catch (e) { }
  return "";
}
function correctText(it) {
  switch (it.t) {
    case "mc": return it.o[it.a];
    case "ms": return it.a.map(x => it.o[x]).join(" | ");
    case "yn": return it.s.map(s => s[0] + ": " + (s[1] ? "Yes" : "No")).join("; ");
    case "ord": return it.items.join(" > ");
    case "drop": return it.blanks.map(b => b.o[b.a]).join(" | ");
    case "match": return it.pairs.map(p => p[0] + " = " + p[1]).join("; ");
  }
  return "";
}
function typeHint(it) {
  switch (it.t) {
    case "ms": return `Choose ${it.a.length}. Each correct choice earns partial credit.`;
    case "yn": return "For each statement, select Yes if it is true. Otherwise, select No.";
    case "ord": return "Arrange the actions in the correct order (use the arrows).";
    case "drop": return "Complete the code by selecting the correct option in each drop-down.";
    case "match": return "Match each item to the correct answer. Not every answer is used.";
  }
  return "";
}
/* interactive rendering (used by quizzes before checking, and by mocks/cases throughout) */
function itemHTML(v, r, num, opt) {
  const it = v.it; opt = opt || {};
  let h = `<div class="meta">${opt.meta || ""}</div><div class="stem">${num ? num + ". " : ""}${inl(it.q)}</div>`;
  const hint = typeHint(it); if (hint) h += `<div class="hint">${hint}</div>`;
  if (v.t === "mc" || v.t === "ms") {
    const sel = v.t === "mc" ? (r == null ? [] : [r]) : (r || []);
    h += v.order.map((oi, k) => `<button type="button" class="opt ${sel.includes(oi) ? "sel" : ""}" data-oi="${oi}" aria-pressed="${sel.includes(oi)}"><span class="k">${LET[k]}</span><span>${inl(it.o[oi])}</span></button>`).join("");
  } else if (v.t === "yn") {
    h += `<div class="yn">` + (v.sorder || it.s.map((_, i) => i)).map((i, k) => { const s = it.s[i]; const x = r ? r[i] : null; return `<div class="st"><span>${inl(s[0])}</span><span class="seg" role="group" aria-label="Statement ${k + 1}"><button type="button" data-yi="${i}" data-yv="1" aria-pressed="${x === true}" class="${x === true ? "r2" : ""}">Yes</button><button type="button" data-yi="${i}" data-yv="0" aria-pressed="${x === false}" class="${x === false ? "r0" : ""}">No</button></span></div>`; }).join("") + `</div>`;
  } else if (v.t === "ord") {
    const cur = r || v.start;
    h += `<div class="ord">` + cur.map((x, k) => `<div class="it"><span class="pos">${k + 1}</span><span>${inl(it.items[x])}</span><span class="mv"><button type="button" data-mv="${k}" data-dir="-1" aria-label="Move up" ${k === 0 ? "disabled" : ""}>↑</button><button type="button" data-mv="${k}" data-dir="1" aria-label="Move down" ${k === cur.length - 1 ? "disabled" : ""}>↓</button></span></div>`).join("") + `</div>`;
  } else if (v.t === "drop") {
    const parts = it.code.split(/\{\{(\d+)\}\}/);
    h += `<pre class="dropcode">` + parts.map((p, i) => {
      if (i % 2 === 0) return esc(p);

  const scoreEl = $("[data-score]", host);

/* small safe markdown renderer for Claude's answers */
function mdBlock(src) {

    if (/^```/.test(ln)) { if (inCode) { out += `<pre><code>${esc(code.join("\n"))}</code></pre>`; code = []; inCode = false; } else { closeList(); inCode = true; } continue; }

    const ul = ln.match(/^\s*[-*•]\s+(.*)$/); if (ul) { if (list !== "ul") { closeList(); out += "<ul>"; list = "ul"; } out += `<li>${inl(ul[1].replace(/(^|\s)\*([^*]+)\*/g, "$1$2"))}</li>`; continue; }

    closeList(); out += `<p>${inl(ln)}</p>`;

    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
