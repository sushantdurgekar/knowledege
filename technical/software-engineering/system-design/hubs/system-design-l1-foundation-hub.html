04 with no body if the ETag matches, else 200 with the body\n"},{"lang":"javascript","src":"const crypto = require(\"node:crypto\");\n\nfunction etagOf(body) {                       // a validator: a short hash of the exact content\n  return '\"' + crypto.createHash(\"sha256\").update(body).digest(\"hex\").slice(0, 16) + '\"';\n}\n\nfunction handle(headers, body) {\n  // answer a GET for `body`, honouring If-None-Match; returns [status, response headers, body sent]\n  // TODO: 304 with no body if the ETag matches, else 200 with the body\n}\n"}]},"solution":{"t":"Solution: compare the ETag, send no body if it matches","tabs":[{"lang":"python","src":"import hashlib\n\ndef etag_of(body):                            # a validator: a short hash of the exact content\n    return '\"' + hashlib.sha256(body.encode()).hexdigest()[:16] + '\"'\n\ndef handle(headers, body):\n    \"\"\"Answer a GET for `body`, honouring If-None-Match. Returns (status, response headers, body sent).\"\"\"\n    tag = etag_of(body)\n    sent = headers.get(\"if-none-match\", \"\")\n    if sent.strip() == \"*\" or tag in [t.strip() for t in sent.split(\",\")]:\n        return 304, {\"etag\": tag}, \"\"         # unchanged: no body at all\n    return 200, {\"etag\": tag, \"cache-control\": \"max-age=60\"}, body\n\npage = \"<h1>Menu<\/h1>\" * 1000                 # a 13,000-character page\nstatus, hdrs, sent = handle({}, page)\nprint(status, len(sent), \"bytes\")\nstatus, _, sent = handle({\"if-none-match\": hdrs[\"etag\"]}, page)\nprint(status, len(sent), \"bytes\")\nstatus, _, sent = handle({\"if-none-match\": hdrs[\"etag\"]}, page.replace(\"Menu\", \"Menu!\"))\nprint(status, len(sent), \"bytes\")\n","out":"200 13000 bytes\n304 0 bytes\n200 14000 bytes\n"},{"lang":"javascript","src":"const crypto = require(\"node:crypto\");\n\nfunction etagOf(body) {                       // a validator: a short hash of the exact content\n  return '\"' + crypto.createHash(\"sha256\").update(body).digest(\"hex\").slice(0, 16) + '\"';\n}\n\nfunction handle(headers, body) {\n  // answer a GET for `body`, honouring If-None-Match; returns [status, response headers, body sent]\n  const tag = etagOf(body);\n  const sent = headers[\"if-none-match\"] ?? \"\";\n  if (sent.trim() === \"*\" || sent.split(\",\").map(t => t.trim()).includes(tag)) {\n    return [304, { etag: tag }, \"\"];          // unchanged: no body at all\n  }\n  return [200, { etag: tag, \"cache-control\": \"max-age=60\" }, body];\n}\n\nconst page = \"<h1>Menu<\/h1>\".repeat(1000);    // a 13,000-character page\nlet [status, hdrs, sent] = handle({}, page);\nconsole.log(status, sent.length, \"bytes\");\n[status, , sent] = handle({ \"if-none-match\": hdrs.etag }, page);\nconsole.log(status, sent.length, \"bytes\");\n[status, , sent] = handle({ \"if-none-match\": hdrs.etag }, page.replaceAll(\"Menu\", \"Menu!\"));\nconsole.log(status, sent.length, \"bytes\");\n","out":"200 13000 bytes\n304 0 bytes\n200 14000 bytes\n"}]}},"traps":[["“A CDN is only for images.”","Anything that's the same for many users can be served from the edge: scripts, styles, video segments, whole pages and public API responses. The trick is to separate personal data from shared data so the shared part can be cached."],["“no-cache means don't cache.”","no-cache allows storing the response but requires a check with the origin before each reuse. no-store is the directive that forbids storing it at all."],["“Purging the CDN is how to ship a new version.”","Purges take time to reach every edge and are easy to get wrong. Put a content hash in static file names and cache them for a year; a release then points at new names, and old copies are simply never asked for again."],["“A 304 is free.”","It saves the body, not the round trip: the request still travels to the origin and back. For small files that are requested often, a longer max-age saves more than revalidation does."],["“A personal page can be cached at the CDN if its URL is the same for everyone.”","Then the edge serves one user's page to the next user who asks for that URL. Mark personal responses private or no-store, and keep personal data out of shared caches."],["“A reverse proxy is just a forward proxy pointing the other way.”","They serve different owners. A forward proxy acts for clients going out (filtering, logging); a reverse proxy acts for servers (routing, TLS, caching, rate limits). Clients choose to use a forward proxy; they usually don't know a reverse proxy is there."]],"disc":[["What would you put behind a CDN for an online shop, and with what cache settings?","Versioned static files (scripts, styles, images) with public, a max-age of a year and immutable. Product and category pages, which are the same for everyone, with a short shared lifetime (an s-maxage of a minute or a few), deleted from the cache when a product changes, and stale-while-revalidate to hide the refreshes. Basket, account and checkout responses as private or no-store, straight to the origin. Then watch the CDN hit ratio and the origin's load after every change to the headers."],["Why put a reverse proxy in front of app servers, even without a CDN?","It gives one public entry point that terminates TLS, routes paths to different services, balances load, compresses responses and enforces timeouts, request-size limits and rate limits, and it can cache. The app servers stay private, can move or split without clients noticing, and don't each need their own certificates and protections."]],"teach":{"prompt":"Explain to a junior colleague how a CDN decides whether it can answer a request itself, and what happens when its copy is old.","rubric":["Edge servers near users hold copies, which cuts latency and origin load","Cache-Control (max-age, s-maxage, private, no-store) says what may be cached and for how long","A stale copy is revalidated with If-None-Match and an ETag, getting 304 if unchanged","Versioned file names avoid stale mixes and purges","Personal responses stay out of shared caches"],"model":"A CDN has servers in many cities, and each user is sent to a nearby one. When a request arrives, the edge looks for a stored copy; if there isn't one, it fetches the response from the origin and keeps it if the Cache-Control header allows. While the copy is younger than its s-maxage, or max-age, the edge answers by itself, which is fast for the user and costs the origin nothing. Once it's stale, the edge asks the origin with If-None-Match and the ETag it holds; if nothing changed, the origin answers 304 with no body and the copy is good for another lifetime, otherwise a fresh 200 replaces it. For static files the best trick is a content hash in the file name with a year-long lifetime, so a new release simply uses new names. Anything personal is marked private or no-store, so a shared cache never hands one user's page to another."},"qa":[["What does a CDN do?","Serves cached copies of the origin's responses from edge servers near the users."],["max-age or s-maxage?","max-age applies to every cache; s-maxage overrides it for shared caches such as CDNs."],["no-cache or no-store?","no-cache: may be stored, but must be revalidated before each reuse. no-store: never stored."],["What does 304 Not Modified mean?","The cached copy is still current: no body is sent, and the cache reuses what it has."],["Why put a hash in static file names?","Each version gets its own URL, so it can be cached for a year without anyone seeing a stale copy."],["Forward or reverse proxy?","A forward proxy acts for clients going out; a reverse proxy sits in front of servers and acts for them."]],"quiz":[{"q":"What does this print? (`shared_cache_ttl` / `sharedCacheTtl` is this module's helper.)","snip":{"t":"How long may a CDN keep each one?","tabs":[{"lang":"python","src":"print(shared_cache_ttl(\"public, max-age=300\"), shared_cache_ttl(\"public, max-age=300, s-maxage=30\"),\n      shared_cache_ttl(\"private, max-age=300\"), shared_cache_ttl(\"max-age=0\"))\n"},{"lang":"javascript","src":"console.log(sharedCacheTtl(\"public, max-age=300\"), sharedCacheTtl(\"public, max-age=300, s-maxage=30\"),\n  sharedCacheTtl(\"private, max-age=300\"), sharedCacheTtl(\"max-age=0\"));\n"}]},"o":["300 30 0 0","300 300 300 0","300 30 300 0","300 300 0 0"],"a":0,"e":"max-age applies when there's no s-maxage; s-maxage overrides it for shared caches, even when it's shorter; private keeps the response out of shared caches altogether; and max-age=0 means it's stale at once."},{"q":"What does this print?","snip":{"t":"Trips to the origin with a 60-second lifetime","tabs":[{"lang":"python","src":"ttl, fresh_until, trips = 60, 0, 0\nfor now in (0, 30, 59, 60, 61, 119, 120):\n    if now >= fresh_until:                  # missing or stale: ask the origin\n        trips += 1\n        fresh_until = now + ttl\nprint(trips, fresh_until)\n"},{"lang":"javascript","src":"let ttl = 60, freshUntil = 0, trips = 0;\nfor (const now of [0, 30, 59, 60, 61, 119, 120]) {\n  if (now >= freshUntil) {                  // missing or stale: ask the origin\n    trips++;\n    freshUntil = now + ttl;\n  }\n}\nconsole.log(trips, freshUntil);\n"}]},"o":["3 180","2 120","4 180","3 181"],"a":0,"e":"The origin is asked at 0 (nothing stored), at 60 (fresh only while now < 60) and at 120, and after the last trip the copy is fresh until 180. The requests at 30, 59, 61 and 119 are hits."},{"q":"A shop serves each user's basket page with `Cache-Control: public, max-age=600`. What's the risk?","o":["A shared cache such as the CDN may serve one shopper's basket to another for up to 10 minutes; it should be private or no-store","Browsers will refuse to show the page","The page will be revalidated with the origin on every request","There's none: public only affects browsers"],"a":0,"e":"public allows any cache, including shared ones, to store the response and reuse it for anyone asking for that URL. Browsers show it fine, max-age=600 means no revalidation for 10 minutes, and public is exactly what lets shared caches keep it."},{"q":"Which responses are good candidates for long caching at the CDN? (choose 2)","t":"ms","o":["/static/app.3f9a1c.js, whose name changes with every release","A product photo whose URL includes its version number","/account/orders for the signed-in user","/checkout/payment","An API response with a stock level that changes every second"],"a":[0,1],"e":"Versioned URLs never change their content, so they can be cached for a year. Account and checkout pages are personal, and a stock level that changes every second would be stale almost at once."},{"q":"Judge each statement.","t":"yn","s":[["s-maxage overrides max-age for shared caches such as a CDN.",true],["no-cache forbids a cache from storing the response.",false],["A 304 Not Modified response carries no body.",true],["With a 60-second lifetime, some users can see an old version for up to a minute after a change.",true]],"e":"s-maxage exists exactly to give shared caches their own lifetime. no-cache allows storing but forces revalidation; no-store forbids storing. A 304 says “use what you have”, so it has no body. And a copy fetched just before a change stays fresh for its whole lifetime."},{"q":"Put the steps of a CDN revalidation in order.","t":"ord","items":["A request arrives for a copy whose max-age has run out","The edge asks the origin, sending If-None-Match with its stored ETag","The origin compares the ETag and answers 304 Not Modified","The edge marks its copy fresh again and serves it"],"e":"Revalidation only starts once a stale copy is requested; the origin can only compare an ETag it has been sent; and the edge can only renew its copy after the 304 arrives."},{"q":"Complete the Python routing function: the longest matching prefix wins.","t":"drop","lang":"python","code":"def route(path, routes):\n    best = \"\"\n    for prefix in routes:\n        if (path == prefix or path.startswith(prefix.rstrip(\"/\") + \"/\")) and {{0}}:\n            best = prefix\n    return {{1}}\n","blanks":[{"o":["len(prefix) > len(best)","len(prefix) < len(best)","len(prefix) == len(best)","True"],"a":0},{"o":["routes[best] if best else None","routes[prefix]","best","routes.get(path)"],"a":0}],"e":"Keep a matching prefix only if it's longer than the best so far, and return the backend for the best prefix (or None if nothing matched). Taking every match in turn would depend on the order of the table."},{"q":"Match each description to its name.","t":"match","pairs":[["Acts for clients going out to the internet","Forward proxy"],["Sits in front of servers and routes requests to them","Reverse proxy"],["Serves cached copies from servers near users","CDN edge"],["Tells caches how long a response stays fresh","Cache-Control: max-age"]],"extra":["ETag"],"e":"An ETag identifies a version so that a stale copy can be revalidated; it doesn't say how long a copy stays fresh."}],"probs":[["Exercise · Read the cache headers of a real site","https://developer.chrome.com/docs/devtools/network/reference","","open a big site, find a versioned script, a page and an API call, and note each one's Cache-Control and whether it came from a cache"],["Exercise · HTTP caching, step by step","https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching","","work through freshness, validation and cache busting, then choose headers for a shop's static files, product pages and basket"],["Exercise · What a CDN caches by default","https://developers.cloudflare.com/cache/concepts/default-cache-behavior/","","list which files are cached by default and what decides it, then say what you'd change for a news site"],["Exercise · Route by path with a real reverse proxy","https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/","","find proxy_pass and how location blocks pick a backend, and compare them with this module's route()"]],"src":[["RFC 9111: HTTP Caching","https://www.rfc-editor.org/rfc/rfc9111"],["MDN: HTTP caching","https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching"],["MDN: Cache-Control","https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control"],["Cloudflare: What is a CDN?","https://www.cloudflare.com/learning/cdn/what-is-a-cdn/"],["NGINX: Reverse proxy","https://docs.nginx.com/nginx/admin-guide/web-server/reverse-proxy/"]]},{"id":"m07","d":"d3","t":"Choosing storage: SQL, NoSQL and object storage","min":100,"hook":"Every design needs somewhere to keep its data, and that choice shapes everything after it. Relational databases give you queries, joins and transactions; key-value and document stores trade some of that for simple, predictable scaling; object storage keeps files cheaply and almost without limit. Choosing well starts from the access patterns: what you read, by which key, and how often.","pre":{"q":"A food-delivery app stores users, restaurants, orders, drivers' live positions and menu photos. Which would you put in a relational database, which in a key-value store and which in object storage? And what question do you ask first?","a":"First ask how each kind of data is read and written. Users, restaurants and orders need transactions and many kinds of query, so a relational database suits them. Live positions are written and read by one key at high volume, which suits a key-value store. Photos are large files: put them in object storage, keep only their key and details in the database, and serve them through a CDN."},"kid":{"t":"Luigi's three kinds of records","x":"Luigi keeps three kinds of records. The order book has neat columns: who ordered, what, when, and whether they've paid. He can add up a whole day or find every order from Tara. Each recipe lives on its own card in a box, filed under the pizza's name, so he can grab one in a second, though he can't easily ask “which recipes use olives?”. Photos of every pizza go in a big storeroom, each box with a number, and the order book only notes the box number. The drivers get a copy of the order book every few minutes, so their copy is sometimes a little behind.","map":[["The order book with neat columns","A relational database: tables, rows and columns, queried with SQL"],["Adding up a day, or finding every order from Tara","Queries with filters, grouping and joins, made fast by indexes"],["Recipe cards filed under the pizza's name","A key-value or document store: fast lookups by key, few other queries"],["Photos in numbered storeroom boxes","Object storage, with only each object's key kept in the database"],["The drivers' copy, a few minutes behind","A read replica, and its replication lag"]],"brk":"Luigi copies his book by hand every few minutes; a real replica follows the primary continuously and is usually well under a second behind. But it can still lag, so someone who has just written something may not see it there."},"keys":["**Start from the access patterns**: before choosing a store, list the reads and writes: which data, looked up by which key, filtered or sorted how, how often, and how much of it. The store that serves the most important patterns cheaply wins, not the most fashionable one.","**Relational databases (SQL)**: tables with a fixed schema, joins across them, and ACID transactions, in which a group of changes happens completely or not at all and sees a consistent state. They suit users, orders, payments and anything you'll query in many ways. One primary scales up a long way, and caches and read replicas take it further.","**Indexes**: an index (usually a B-tree) lets the database find rows by a column without scanning the whole table: about O(log n) per lookup instead of O(n). Every index speeds up some reads but slows writes, which must update it too, and takes space, so index what your frequent queries filter, join and sort on.","**Key-value and wide-column stores**: you get, put and delete by key. A partition key decides which machine holds an item, and a sort key orders the items within one partition key, so “a user's orders by date” is one fast range read. Lookups stay fast at any scale, but a query the keys don't support needs another table or index that you maintain.","**Document stores**: each record is a JSON-like document, so data that's read together (an order and its lines) can live in one document. A flexible schema suits products that change fast; joins across documents are weaker, so design documents around how they're read.","**Object storage**: files such as images, videos and backups go in an object store (Amazon S3, Azure Blob Storage, Google Cloud Storage): cheap, durable, almost unlimited, and read or written whole, by key, over HTTP. Keep each object's key and details in the database, and serve popular objects through a CDN.","**Read replicas and replication lag**: a replica copies the primary's changes and serves reads, multiplying read capacity. Copying is usually asynchronous, so a replica can be behind and a user who has just saved something may not see it there. Read a user's own recent writes from the primary.","**More than one store**: large systems use several stores, each for what it does best: a relational database for orders, a cache for sessions, a search index for text search, object storage for files. Every extra store is one more thing to run, secure and keep in step, so add one only for a clear need."],"dia":[{"type":"tiers","cap":"Several stores behind one food-delivery app","tiers":[["App servers",["api 1","api 2","api 3"]],["Stores",["Relational: users, restaurants, orders","Key-value: sessions, drivers' live positions","Object storage: menu photos","Search index: restaurant search"],"each request uses the store that fits it"]],"note":"Orders need transactions and flexible queries; positions need huge volumes of simple writes by key; photos need cheap space; search needs text matching. One store rarely does all four well."},{"type":"seq","cap":"Replication lag: a user reads from a replica just after writing","actors":["Tara","Primary","Replica"],"msgs":[["Tara","Primary","UPDATE her name to “Tara B.”"],["Primary","Tara","OK",true],["Tara","Replica","SELECT her name (1 s later)"],["Replica","Tara","“Tara”: the change hasn't arrived yet",true],["Primary","Replica","the change, applied 2 s after the write"]],"note":"The replica is still correct, just behind. Sending a user's reads to the primary for a few seconds after they write (read your own writes) hides the lag from the one person who would notice it."},{"type":"quad","cap":"A rough first guess, before you check the access patterns","x0":"few, known queries","x1":"many, changing queries","y1":"huge scale","y0":"moderate scale","cells":[["Key-value or wide-column","partitioned by key; plan every query up front"],["Sharded or distributed SQL","queries and transactions at scale, at a price in complexity"],["Almost anything works","often a key-value store, or a table in the main database"],["Relational database","the safe default; add caches and read replicas as you grow"]]}],"cmp":[{"cap":"Four kinds of store","head":["","Relational","Key-value / wide-column","Document","Object storage"],"rows":[["Data","Tables with a fixed schema","Items under a key, plus a sort key","JSON-like documents","Files of any size"],["Queries","Any SQL: filters, joins, grouping","By key, or a key and a sort-key range","By key, and by indexed fields","By key, and listing by prefix"],["Transactions","Across tables (ACID)","Usually per item; some across a few","Per document; some across documents","None: objects are replaced whole"],["Grows by","Bigger machine, replicas, then sharding","More partitions","More shards","Practically without limit"],["Typical use","Users, orders, payments","Sessions, carts, events, feeds","Catalogues, profiles","Images, video, backups"]]}],"code":[{"t":"The stable string hash used to pick a partition","tabs":[{"lang":"python","src":"def fnv1a(key):                                 # a small, stable 32-bit string hash, same in both languages\n    h = 0x811C9DC5\n    for byte in key.encode():\n        h = ((h ^ byte) * 0x01000193) & 0xFFFFFFFF\n    return h\n"},{"lang":"javascript","src":"function fnv1a(key) {                           // a small, stable 32-bit string hash, same in both languages\n  let h = 0x811c9dc5;\n  for (const byte of Buffer.from(key)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;\n  return h;\n}\n"}]},{"t":"A relational table: grouping, an index and a transaction (SQLite)","tabs":[{"lang":"python","src":"import sqlite3\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE orders (id INTEGER PRIMARY KEY, customer TEXT, pizza TEXT, price INTEGER)\")\nrows = [(\"tara\", \"margherita\", 9), (\"ben\", \"pepperoni\", 11), (\"tara\", \"veggie\", 10), (\"ana\", \"margherita\", 9)]\ndb.executemany(\"INSERT INTO orders (customer, pizza, price) VALUES (?, ?, ?)\", rows)\ndb.commit()\nfor customer, n, total in db.execute(\"SELECT customer, COUNT(*), SUM(price) FROM orders GROUP BY customer ORDER BY customer\"):\n    print(customer, n, total)\n\ndef plan(sql):                                # does SQLite use an index for this query?\n    steps = \" \".join(row[3] for row in db.execute(\"EXPLAIN QUERY PLAN \" + sql))\n    return \"uses the index\" if \"INDEX\" in steps else \"scans the whole table\"\n\nquery = \"SELECT * FROM orders WHERE customer = 'tara'\"\nprint(\"before:\", plan(query))\ndb.execute(\"CREATE INDEX orders_by_customer ON orders (customer)\")\nprint(\"after:\", plan(query))\n\ntry:\n    with db:                                  # a transaction: all of it or none of it\n        db.execute(\"UPDATE orders SET price = price - 2 WHERE customer = 'tara'\")\n        raise RuntimeError(\"payment failed\")  # something goes wrong half way\nexcept RuntimeError:\n    pass\nprint(\"tara still pays\", db.execute(\"SELECT SUM(price) FROM orders WHERE customer = 'tara'\").fetchone()[0])\n","out":"ana 1 9\nben 1 11\ntara 2 19\nbefore: scans the whole table\nafter: uses the index\ntara still pays 19\n","notes":[[8,"One query groups the rows by customer and adds them up: the kind of question a relational database answers well."],[16,"Without an index, finding Tara's orders means reading every row: fine for 4 rows, slow for 40 million."],[18,"With the index, SQLite jumps straight to Tara's rows, at the cost of updating the index on every insert."],[21,"`with db` runs the block as one transaction: the error rolls the update back, so Tara's total is untouched."]]},{"lang":"javascript","src":"const { DatabaseSync } = require(\"node:sqlite\");   // built in from Node.js 22.13 (with an experimental warning)\n\nconst db = new DatabaseSync(\":memory:\");\ndb.exec(\"CREATE TABLE orders (id INTEGER PRIMARY KEY, customer TEXT, pizza TEXT, price INTEGER)\");\nconst insert = db.prepare(\"INSERT INTO orders (customer, pizza, price) VALUES (?, ?, ?)\");\nfor (const row of [[\"tara\", \"margherita\", 9], [\"ben\", \"pepperoni\", 11], [\"tara\", \"veggie\", 10], [\"ana\", \"margherita\", 9]]) insert.run(...row);\nfor (const r of db.prepare(\"SELECT customer, COUNT(*) AS n, SUM(price) AS total FROM orders GROUP BY customer ORDER BY customer\").all()) {\n  console.log(r.customer, r.n, r.total);\n}\n\nfunction plan(sql) {                          // does SQLite use an index for this query?\n  const steps = db.prepare(\"EXPLAIN QUERY PLAN \" + sql).all().map(row => row.detail).join(\" \");\n  return steps.includes(\"INDEX\") ? \"uses the index\" : \"scans the whole table\";\n}\n\nconst query = \"SELECT * FROM orders WHERE customer = 'tara'\";\nconsole.log(\"before:\", plan(query));\ndb.exec(\"CREATE INDEX orders_by_customer ON orders (customer)\");\nconsole.log(\"after:\", plan(query));\n\ntry {\n  db.exec(\"BEGIN\");                           // a transaction: all of it or none of it\n  db.exec(\"UPDATE orders SET price = price - 2 WHERE customer = 'tara'\");\n  throw new Error(\"payment failed\");          // something goes wrong half way\n} catch (err) {\n  db.exec(\"ROLLBACK\");\n}\nconsole.log(\"tara still pays\", db.prepare(\"SELECT SUM(price) AS s FROM orders WHERE customer = 'tara'\").get().s);\n","out":"ana 1 9\nben 1 11\ntara 2 19\nbefore: scans the whole table\nafter: uses the index\ntara still pays 19\n","notes":[[7,"One query groups the rows by customer and adds them up: the kind of question a relational database answers well."],[17,"Without an index, finding Tara's orders means reading every row: fine for 4 rows, slow for 40 million."],[19,"With the index, SQLite jumps straight to Tara's rows, at the cost of updating the index on every insert."],[26,"ROLLBACK undoes everything since BEGIN, so the failed payment leaves Tara's total untouched."]]}]},{"t":"Partition keys, sort keys and a hot key","tabs":[{"lang":"python","src":"class KVTable:\n    \"\"\"Items live on partition hash(pk) % N; within one partition key they're read in sort-key order.\"\"\"\n    def __init__(self, partitions):\n        self.parts = [{} for _ in range(partitions)]\n\n    def _home(self, pk):\n        return self.parts[fnv1a(pk) % len(self.parts)]\n\n    def put(self, pk, sk, value):\n        self._home(pk).setdefault(pk, {})[sk] = value\n\n    def query(self, pk, start, end):          # one partition key, a range of sort keys\n        items = self._home(pk).get(pk, {})\n        return [items[sk] for sk in sorted(items) if start <= sk < end]\n\ntable = KVTable(4)\nfor user, when, pizza in [(\"tara\", \"2026-10-01T12:30\", \"margherita\"), (\"tara\", \"2026-10-03T19:05\", \"veggie\"),\n                          (\"ben\", \"2026-10-02T18:00\", \"pepperoni\"), (\"tara\", \"2026-09-28T13:10\", \"hawaiian\")]:\n    table.put(user, when, pizza)\nprint(\"tara in October:\", *table.query(\"tara\", \"2026-10-01\", \"2026-11-01\"))\n\nloads = [0] * 4\nfor i in range(10_000):                       # 30% of requests are for one very popular key\n    key = \"celebrity\" if i % 10 < 3 else f\"user-{i}\"\n    loads[fnv1a(key) % 4] += 1\nprint(\"requests per partition:\", *loads)\n","out":"tara in October: margherita veggie\nrequests per partition: 1751 1750 4749 1750\n","notes":[[7,"The partition key alone decides where an item lives, so all of one user's orders sit together."],[14,"A real store keeps each partition sorted on disk; sorting here keeps the example short."],[20,"ISO dates sort as text in time order, so “Tara's October orders” is one range on one partition."],[26,"Every request for one key goes to one partition, however many there are: that partition does far more work than the others."]]},{"lang":"javascript","src":"class KVTable {\n  // items live on partition hash(pk) % N; within one partition key they're read in sort-key order\n  constructor(partitions) { this.parts = Array.from({ length: partitions }, () => new Map()); }\n  home(pk) { return this.parts[fnv1a(pk) % this.parts.length]; }\n  put(pk, sk, value) {\n    const part = this.home(pk);\n    if (!part.has(pk)) part.set(pk, new Map());\n    part.get(pk).set(sk, value);\n  }\n  query(pk, start, end) {                     // one partition key, a range of sort keys\n    const items = this.home(pk).get(pk) ?? new Map();\n    return [...items.keys()].sort().filter(sk => start <= sk && sk < end).map(sk => items.get(sk));\n  }\n}\n\nconst table = new KVTable(4);\nfor (const [user, when, pizza] of [[\"tara\", \"2026-10-01T12:30\", \"margherita\"], [\"tara\", \"2026-10-03T19:05\", \"veggie\"],\n  [\"ben\", \"2026-10-02T18:00\", \"pepperoni\"], [\"tara\", \"2026-09-28T13:10\", \"hawaiian\"]]) {\n  table.put(user, when, pizza);\n}\nconsole.log(\"tara in October:\", ...table.query(\"tara\", \"2026-10-01\", \"2026-11-01\"));\n\nconst loads = [0, 0, 0, 0];\nfor (let i = 0; i < 10000; i++) {             // 30% of requests are for one very popular key\n  const key = i % 10 < 3 ? \"celebrity\" : `user-${i}`;\n  loads[fnv1a(key) % 4]++;\n}\nconsole.log(\"requests per partition:\", ...loads);\n","out":"tara in October: margherita veggie\nrequests per partition: 1751 1750 4749 1750\n","notes":[[4,"The partition key alone decides where an item lives, so all of one user's orders sit together."],[12,"A real store keeps each partition sorted on disk; sorting here keeps the example short."],[21,"ISO dates sort as text in time order, so “Tara's October orders” is one range on one partition."],[28,"Every request for one key goes to one partition, however many there are: that partition does far more work than the others."]]}]},{"t":"Replication lag, and reading your own writes","tabs":[{"lang":"python","src":"class ReplicatedStore:\n    \"\"\"One primary, and a replica that applies each write `lag` seconds after it happened.\"\"\"\n    def __init__(self, lag):\n        self.lag, self.primary, self.log = lag, {}, []   # log: (time, key, value) in write order\n\n    def write(self, now, key, value):\n        self.primary[key] = value\n        self.log.append((now, key, value))\n\n    def read_replica(self, now, key):\n        value = None\n        for t, k, v in self.log:              # the replica has applied every write at least `lag` old\n            if k == key and t + self.lag <= now:\n                value = v\n        return value\n\nstore = ReplicatedStore(lag=2)\nstore.write(0, \"tara:name\", \"Tara\")\nstore.write(10, \"tara:name\", \"Tara B.\")       # she edits her profile at t = 10\nfor now in (10, 11, 12):\n    print(now, \"replica:\", store.read_replica(now, \"tara:name\"), \"| primary:\", store.primary[\"tara:name\"])\n\nlast_write = {\"tara\": 10}                     # when each user last wrote\ndef read_for(user, now, key, window=5):\n    if now - last_write.get(user, -10**9) < window:\n        return store.primary[key]             # a recent writer reads from the primary\n    return store.read_replica(now, key)       # everyone else reads the replica\nprint(\"at 11, tara sees:\", read_for(\"tara\", 11, \"tara:name\"), \"| ben sees:\", read_for(\"ben\", 11, \"tara:name\"))\n","out":"10 replica: Tara | primary: Tara B.\n11 replica: Tara | primary: Tara B.\n12 replica: Tara B. | primary: Tara B.\nat 11, tara sees: Tara B. | ben sees: Tara\n","notes":[[13,"The replica only knows writes that are at least `lag` seconds old: it's behind, not wrong."],[21,"For two seconds after the edit, anyone reading the replica still sees the old name."],[25,"Read your own writes: for a few seconds after writing, a user's reads go to the primary."],[28,"Tara sees her change at once; Ben sees the old name for another second, which nobody will notice."]]},{"lang":"javascript","src":"class ReplicatedStore {\n  // one primary, and a replica that applies each write `lag` seconds after it happened\n  constructor(lag) { this.lag = lag; this.primary = new Map(); this.log = []; }   // log: [time, key, value] in write order\n  write(now, key, value) {\n    this.primary.set(key, value);\n    this.log.push([now, key, value]);\n  }\n  readReplica(now, key) {\n    let value = null;\n    for (const [t, k, v] of this.log) {       // the replica has applied every write at least `lag` old\n      if (k === key && t + this.lag <= now) value = v;\n    }\n    return value;\n  }\n}\n\nconst store = new ReplicatedStore(2);\nstore.write(0, \"tara:name\", \"Tara\");\nstore.write(10, \"tara:name\", \"Tara B.\");      // she edits her profile at t = 10\nfor (const now of [10, 11, 12]) {\n  console.log(now, \"replica:\", store.readReplica(now, \"tara:name\"), \"| primary:\", store.primary.get(\"tara:name\"));\n}\n\nconst lastWrite = new Map([[\"tara\", 10]]);    // when each user last wrote\nfunction readFor(user, now, key, window = 5) {\n  if (now - (lastWrite.get(user) ?? -1e9) < window) return store.primary.get(key);   // a recent writer reads from the primary\n  return store.readReplica(now, key);         // everyone else reads the replica\n}\nconsole.log(\"at 11, tara sees:\", readFor(\"tara\", 11, \"tara:name\"), \"| ben sees:\", readFor(\"ben\", 11, \"tara:name\"));\n","out":"10 replica: Tara | primary: Tara B.\n11 replica: Tara | primary: Tara B.\n12 replica: Tara B. | primary: Tara B.\nat 11, tara sees: Tara B. | ben sees: Tara\n","notes":[[11,"The replica only knows writes that are at least `lag` seconds old: it's behind, not wrong."],[21,"For two seconds after the edit, anyone reading the replica still sees the old name."],[26,"Read your own writes: for a few seconds after writing, a user's reads go to the primary."],[29,"Tara sees her change at once; Ben sees the old name for another second, which nobody will notice."]]}]}],"ex":{"q":"(LeetCode 981, Time Based Key-Value Store) `set(key, value, timestamp)` stores a version (timestamps for set only increase), and `get(key, timestamp)` returns the value of the latest version at or before that time, or an empty string if there's none. Run: set foo = bar at 1; get foo at 1 and at 3; set foo = bar2 at 4; get foo at 4, at 5 and at 0.","steps":["Keep every version of each key with its timestamp. Because set is called with increasing timestamps, appending keeps each key's list sorted, just like a sort key in a key-value store.","get(key, t) wants the latest version at or before t: the last timestamp ≤ t, which a binary search finds.","bisect_right (or the hand-written search in JavaScript) gives the first position whose timestamp is greater than t; the answer is just before it, and there's none if that position is 0.","set is O(1) amortised and get is O(log v) for v versions of the key, with O(total sets) memory. Stores that keep history, and databases that keep several versions of a row for consistent reads, answer “as of time t” in a similar way."],"code":{"t":"Versioned values with a binary search","tabs":[{"lang":"python","src":"import bisect\n\nclass TimeMap:                                # each key keeps its history, oldest first\n    def __init__(self):\n        self.times, self.values = {}, {}      # key -> timestamps, key -> values, in step\n\n    def set(self, key, value, timestamp):     # timestamps only increase, so appending keeps them sorted\n        self.times.setdefault(key, []).append(timestamp)\n        self.values.setdefault(key, []).append(value)\n\n    def get(self, key, timestamp):\n        i = bisect.bisect_right(self.times.get(key, []), timestamp)   # first version after `timestamp`\n        return self.values[key][i - 1] if i else \"\"                  # the latest at or before it\n\ntm = TimeMap()\ntm.set(\"foo\", \"bar\", 1)\nanswers = [tm.get(\"foo\", 1), tm.get(\"foo\", 3)]\ntm.set(\"foo\", \"bar2\", 4)\nanswers += [tm.get(\"foo\", 4), tm.get(\"foo\", 5), tm.get(\"foo\", 0) or \"(none)\"]\nprint(*answers)\n","out":"bar bar bar2 bar2 (none)"},{"lang":"javascript","src":"class TimeMap {                               // each key keeps its history, oldest first\n  constructor() { this.times = new Map(); this.values = new Map(); }   // key -> timestamps, key -> values, in step\n  set(key, value, timestamp) {                // timestamps only increase, so pushing keeps them sorted\n    if (!this.times.has(key)) { this.times.set(key, []); this.values.set(key, []); }\n    this.times.get(key).push(timestamp);\n    this.values.get(key).push(value);\n  }\n  get(key, timestamp) {\n    const ts = this.times.get(key) ?? [];\n    let lo = 0, hi = ts.length;               // find the first version after `timestamp`\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1;\n      if (ts[mid] <= timestamp) lo = mid + 1; else hi = mid;\n    }\n    return lo ? this.values.get(key)[lo - 1] : \"\";   // the latest at or before it\n  }\n}\n\nconst tm = new TimeMap();\ntm.set(\"foo\", \"bar\", 1);\nconst answers = [tm.get(\"foo\", 1), tm.get(\"foo\", 3)];\ntm.set(\"foo\", \"bar2\", 4);\nanswers.push(tm.get(\"foo\", 4), tm.get(\"foo\", 5), tm.get(\"foo\", 0) || \"(none)\");\nconsole.log(...answers);\n","out":"bar bar bar2 bar2 (none)"}]},"a":"It prints bar bar bar2 bar2 (none). At 1 and 3 the latest version is bar (set at 1); at 4 and 5 it's bar2 (set at 4); and at 0 there's no version yet, so get returns an empty string."},"fade":{"q":"(LeetCode 706, Design HashMap) A key-value store is a hash table spread over machines. Build the single-machine version without a built-in dictionary: `put(key, value)`, `get(key)` (−1 if missing) and `remove(key)`, for integer keys from 0 to 1,000,000, using an array of buckets.","steps":["Pick a bucket from the key (key mod the number of buckets). Keys that collide share a bucket, kept as a short list of [key, value] pairs.",{"ask":"What does put do when the key is already there?","a":"It overwrites that pair's value in place; otherwise it appends a new pair to the bucket."},{"ask":"How does a distributed key-value store use the same idea?","a":"The bucket becomes a partition on its own machine: hash the key to find the machine, then look inside it. That's why keys must spread evenly, and why one very hot key overloads one partition."},{"ask":"What does each operation cost?","a":"O(1 + n/b) on average for n keys in b buckets, so O(1) while buckets stay short, with O(n + b) memory. With 1,009 buckets and LeetCode's at most 10,000 calls, a bucket holds about 10 pairs at worst on average."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class MyHashMap:\n    def __init__(self, buckets=1009):\n        self.buckets = [[] for _ in range(buckets)]   # each bucket: a short list of [key, value] pairs\n\n    def _bucket(self, key):\n        return self.buckets[key % len(self.buckets)]\n\n    def put(self, key, value):\n        ...                                   # TODO: overwrite the pair if the key is there, else append it\n\n    def get(self, key):\n        ...                                   # TODO: the value, or -1\n\n    def remove(self, key):\n        ...                                   # TODO: drop the pair if it's there\n"},{"lang":"javascript","src":"class MyHashMap {\n  constructor(buckets = 1009) { this.buckets = Array.from({ length: buckets }, () => []); }   // each bucket: [key, value] pairs\n  bucket(key) { return this.buckets[key % this.buckets.length]; }\n  put(key, value) {\n    // TODO: overwrite the pair if the key is there, else append it\n  }\n  get(key) {\n    // TODO: the value, or -1\n  }\n  remove(key) {\n    // TODO: drop the pair if it's there\n  }\n}\n"}]},"solution":{"t":"Solution: buckets of short lists","tabs":[{"lang":"python","src":"class MyHashMap:\n    def __init__(self, buckets=1009):\n        self.buckets = [[] for _ in range(buckets)]   # each bucket: a short list of [key, value] pairs\n\n    def _bucket(self, key):\n        return self.buckets[key % len(self.buckets)]\n\n    def put(self, key, value):\n        bucket = self._bucket(key)\n        for pair in bucket:\n            if pair[0] == key:\n                pair[1] = value               # an existing key: overwrite\n                return\n        bucket.append([key, value])\n\n    def get(self, key):\n        for k, v in self._bucket(key):\n            if k == key:\n                return v\n        return -1\n\n    def remove(self, key):\n        bucket = self._bucket(key)\n        for i, pair in enumerate(bucket):\n            if pair[0] == key:\n                bucket[i] = bucket[-1]        # move the last pair into the gap: O(1)\n                bucket.pop()\n                return\n\nm = MyHashMap()\nm.put(1, 1)\nm.put(2, 2)\nanswers = [m.get(1), m.get(3)]\nm.put(2, 1)\nanswers.append(m.get(2))\nm.remove(2)\nanswers.append(m.get(2))\nprint(*answers)\n","out":"1 -1 1 -1"},{"lang":"javascript","src":"class MyHashMap {\n  constructor(buckets = 1009) { this.buckets = Array.from({ length: buckets }, () => []); }   // each bucket: [key, value] pairs\n  bucket(key) { return this.buckets[key % this.buckets.length]; }\n  put(key, value) {\n    const bucket = this.bucket(key);\n    for (const pair of bucket) {\n      if (pair[0] === key) { pair[1] = value; return; }   // an existing key: overwrite\n    }\n    bucket.push([key, value]);\n  }\n  get(key) {\n    for (const [k, v] of this.bucket(key)) if (k === key) return v;\n    return -1;\n  }\n  remove(key) {\n    const bucket = this.bucket(key);\n    const i = bucket.findIndex(pair => pair[0] === key);\n    if (i >= 0) { bucket[i] = bucket.at(-1); bucket.pop(); }   // move the last pair into the gap: O(1)\n  }\n}\n\nconst m = new MyHashMap();\nm.put(1, 1);\nm.put(2, 2);\nconst answers = [m.get(1), m.get(3)];\nm.put(2, 1);\nanswers.push(m.get(2));\nm.remove(2);\nanswers.push(m.get(2));\nconsole.log(...answers);\n","out":"1 -1 1 -1"}]}},"traps":[["“NoSQL scales and SQL doesn't.”","One relational primary on good hardware handles a lot, caches and read replicas take it further, and many relational databases can be sharded. NoSQL stores scale out more easily for simple key lookups, in exchange for fewer kinds of query and weaker transactions."],["“Keep images in the database, so everything's in one place.”","Large files bloat the database, its backups and its replicas, and every image read ties up a database connection streaming bytes. Put files in object storage and keep only their key and details in the database."],["“Add an index on every column.”","Each index speeds up the queries that use it but slows every insert and update, which must maintain it too, and takes space. Index what your frequent queries filter, join and sort on, and check the query plan."],["“A read replica always has the latest data.”","Copying is usually asynchronous, so a replica can lag behind the primary, from milliseconds to much longer under heavy load. Read a user's own recent writes from the primary."],["“A document store means no schema to think about.”","The schema moves into the application: every reader must cope with every shape a document has ever had. Design documents around how they're read, and version them."],["“More partitions fix a hot key.”","Every request for one partition key lands on the same partition, however many there are. Cache the hot key, spread it across several keys (for example with a numbered suffix), or redesign the key."]],"disc":[["SQL or NoSQL for a new product?","Start from the access patterns and the consistency you need. If the data is relational (users, orders, payments), needs transactions, and will be queried in ways you can't predict yet, a relational database is the safe default, and it scales further than most products ever need. Choose a key-value or wide-column store when the access patterns are few, known and huge in volume (sessions, events, a feed per user), and a document store when records are read and written whole and their shape changes often. Many systems end up with more than one."],["How do you keep large files out of the request path?","Let clients upload them straight to object storage, usually with a short-lived signed URL that the API hands out. Store only the object's key and details in the database, and serve the files through a CDN. The app servers never stream the bytes, the database stays small, and the object store's durability and capacity do the heavy lifting."]],"teach":{"prompt":"Explain to a junior colleague how you'd choose where to store the data for a photo-sharing app.","rubric":["List the access patterns first","Relational database for users, follows and comments, with transactions and indexes","Object storage for the photos, with keys and details in the database and a CDN in front","A key-value store or cache for sessions and per-user feeds","Read replicas for read load, with reads of your own writes going to the primary"],"model":"I'd start by listing how the data is used: users sign up and log in, follow each other, upload photos, read a feed, and comment. Users, follows and comments are related and need transactions and flexible queries, so they go in a relational database, with indexes on what the common queries filter by, such as a photo's comments by time. The photos themselves go in object storage, uploaded straight from the app with a signed URL, with only their key and details in the database and a CDN in front for reads. Sessions and ready-made feeds are read by one key at high volume, so a key-value store or cache suits them. As reads grow, read replicas take load off the primary, but a user's reads just after they post go to the primary so they see their own photo. Each extra store has to earn its place."},"qa":[["First question when choosing a database?","What are the access patterns: which data, looked up how, how often, and how much of it?"],["What does an index cost?","Faster reads on its columns, but slower writes and extra space."],["Partition key and sort key?","The partition key picks where an item lives; the sort key orders the items within one partition key."],["Where should images and videos live?","In object storage, with the key and details in the database and a CDN in front."],["What is replication lag?","How far a replica is behind the primary; reads from it can be out of date."],["What does the A in ACID mean?","Atomicity: a transaction's changes happen completely or not at all."]],"quiz":[{"q":"What does this print?","snip":{"t":"A sort-key range","tabs":[{"lang":"python","src":"rows = {\"2026-10-03\": \"veggie\", \"2026-09-28\": \"hawaiian\", \"2026-10-01\": \"margherita\", \"2026-10-31\": \"pepperoni\"}\nprint(*(rows[k] for k in sorted(rows) if \"2026-10-01\" <= k < \"2026-10-31\"))\n"},{"lang":"javascript","src":"const rows = { \"2026-10-03\": \"veggie\", \"2026-09-28\": \"hawaiian\", \"2026-10-01\": \"margherita\", \"2026-10-31\": \"pepperoni\" };\nconsole.log(...Object.keys(rows).sort().filter(k => \"2026-10-01\" <= k && k < \"2026-10-31\").map(k => rows[k]));\n"}]},"o":["margherita veggie","margherita veggie pepperoni","veggie margherita","hawaiian margherita veggie"],"a":0,"e":"Sorted, the keys run 09-28, 10-01, 10-03, 10-31. The range includes its start and excludes its end, so only 10-01 and 10-03 qualify, in date order."},{"q":"What does this print?","snip":{"t":"A replica 3 seconds behind","tabs":[{"lang":"python","src":"log = [(0, \"v1\"), (10, \"v2\"), (14, \"v3\")]   # (time written on the primary, value)\nlag = 3\nprint(*(next(v for t, v in reversed(log) if t + lag <= now) for now in (11, 13, 17)))\n"},{"lang":"javascript","src":"const log = [[0, \"v1\"], [10, \"v2\"], [14, \"v3\"]];   // [time written on the primary, value]\nconst lag = 3;\nconsole.log(...[11, 13, 17].map(now => [...log].reverse().find(([t]) => t + lag <= now)[1]));\n"}]},"o":["v1 v2 v3","v2 v2 v3","v2 v3 v3","v1 v1 v3"],"a":0,"e":"At 11 the replica has applied writes up to time 8, so it still shows v1. At 13 it has the write from 10 (v2), and at 17 the one from 14 (v3)."},{"q":"Users of a social app upload 5 MB photos. Where should the photo bytes go?","o":["Object storage, with each photo's key and details in the database and a CDN in front","A binary column in the main relational database","The cache, so reads are fast","The local disk of whichever app server received the upload"],"a":0,"e":"Object storage is built for large, durable files and the CDN serves them near users. In the database they bloat backups and replicas; a cache can evict them at any time; and a local disk ties each photo to one server, which breaks statelessness."},{"q":"When is a relational database the better fit? (choose 2)","t":"ms","o":["Orders and payments that must change together in one transaction","Data you'll query in many ways, including ways you can't predict yet","Billions of session lookups by one key, with no other queries","Storing 4K video files","A cache of rendered pages"],"a":[0,1],"e":"Transactions across tables and flexible SQL queries are a relational database's strengths. Simple lookups at huge volume suit a key-value store, video belongs in object storage, and rendered pages in a cache or CDN."},{"q":"Judge each statement.","t":"yn","s":[["An index can turn a full table scan into a lookup of about O(log n).",true],["Every extra index makes writes faster.",false],["All items with the same partition key live on the same partition.",true],["An asynchronous replica can return data that's slightly out of date.",true]],"e":"A B-tree index finds rows without reading the whole table. Indexes slow writes, which must update them. The partition key alone decides placement. And an asynchronous replica can be behind the primary."},{"q":"Put the steps of a photo upload in order.","t":"ord","items":["The app asks the API for an upload URL","The app uploads the bytes straight to object storage","The API records the photo's key and details in the database","Other users load the photo through the CDN, using the key from the database"],"e":"The upload needs the URL first; the API records the photo only once its bytes are stored, so it never points at a missing object; and other users can only find it through the database record."},{"q":"Complete the JavaScript function that sends recent writers to the primary (read your own writes).","t":"drop","lang":"javascript","code":"function chooseServer(user, now, lastWrite, windowSeconds) {\n  return {{0}} < windowSeconds ? {{1}} : \"replica\";\n}\n","blanks":[{"o":["now - (lastWrite.get(user) ?? -Infinity)","(lastWrite.get(user) ?? 0) - now","now","windowSeconds - now"],"a":0},{"o":["\"primary\"","\"replica\"","user","\"cache\""],"a":0}],"e":"The time since the user's last write decides: within the window, read from the primary so they see their own change. A user who has never written gets −Infinity as the last write, so the gap is infinite and they read the replica."},{"q":"Match each kind of store to what it's best at.","t":"match","pairs":[["Tables, joins and transactions","Relational database"],["Get and put by key, at huge scale","Key-value store"],["JSON-like records read and written whole","Document store"],["Large files read and written whole over HTTP","Object storage"]],"extra":["Read replica"],"e":"A read replica isn't a kind of store: it's a copy of a database that serves reads."}],"probs":[["LC 981 · Time Based Key-Value Store","https://leetcode.com/problems/time-based-key-value-store/","Medium","the worked example: each key's history, and a binary search on timestamps"],["LC 706 · Design HashMap","https://leetcode.com/problems/design-hashmap/","Easy","the faded example: buckets of short lists, chosen by key mod the bucket count"],["LC 1146 · Snapshot Array","https://leetcode.com/problems/snapshot-array/","Medium","Snapshot Array: keep each index's history and binary-search the snapshot id, like reading “as of” a time"],["Exercise · Read a query plan","https://www.sqlite.org/eqp.html","","run EXPLAIN QUERY PLAN on this module's orders table with and without the index, then add one for a query on pizza and price"],["Exercise · Design keys for a key-value table","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html","","choose partition and sort keys for “a user's orders by date” and “today's orders for a restaurant”, and find the hot key"],["Reading · What object storage is","https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html","","find buckets, keys, the size limit for one object, and how presigned URLs let clients upload directly"]],"src":[["SQLite: EXPLAIN QUERY PLAN","https://www.sqlite.org/eqp.html"],["Python docs: sqlite3","https://docs.python.org/3/library/sqlite3.html"],["Node.js docs: SQLite (node:sqlite)","https://nodejs.org/api/sqlite.html"],["PostgreSQL docs: Indexes","https://www.postgresql.org/docs/current/indexes.html"],["AWS: Designing partition keys in DynamoDB","https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-design.html"]]},{"id":"m08","d":"d1","t":"APIs: REST, pagination and idempotency","min":95,"hook":"An API is the contract between your system and everyone who uses it, and it's hard to change once clients depend on it. Good APIs name resources clearly, use HTTP methods and status codes the way clients expect, page through large results safely and make retries harmless. Those four habits come up in almost every design interview.","pre":{"q":"A payment API times out after the client sends “charge Tara £20”, and the client retries. How do you make sure Tara is charged once, not twice?","a":"The client creates an idempotency key, a unique ID for this one payment, and sends it with the request and with every retry. The server stores the key with the result of the first attempt, and a retry with the same key gets that stored result instead of a second charge."},"kid":{"t":"Order slips at Luigi's","x":"Luigi's takes orders on paper slips. Each slip says what you want: “GET me the menu”, “POST a new order”, “DELETE order 12”. Luigi answers with a number everyone knows: 200 means “here you go”, 404 means “no such order”. One day Tara hands in her order, but the shop is noisy and she isn't sure Luigi heard, so she hands in the same slip again. Because she wrote her own slip number at the top, Luigi sees he's already cooking slip 57 and doesn't make a second pizza. When Ben asks for all the orders from last year, Luigi gives him one page at a time with a bookmark in it.","map":[["Slips saying GET, POST or DELETE","HTTP methods acting on resources: GET reads, POST creates, DELETE removes"],["200 for “here you go”, 404 for “no such order”","Status codes that clients can act on without reading the message"],["Handing in the same slip twice","A client retrying after a timeout"],["Tara's own slip number at the top","An idempotency key: a retry gets the first result, not a second order"],["One page at a time, with a bookmark","Cursor pagination: each page says where the next one starts"]],"brk":"Luigi recognises Tara's slip by eye; a server must store every idempotency key with its result, long enough to cover retries. And two copies can arrive at the same moment, so it must also cope with a key whose first request is still being processed."},"keys":["**Resources and methods**: a REST-style API names things with nouns in the path (/orders, /orders/42) and uses HTTP methods as the verbs: GET reads, POST creates, PUT replaces, PATCH changes part, DELETE removes. GET must never change anything, so caches, crawlers and retries can call it freely.","**Status codes**: 2xx means success (200 OK, 201 Created with a Location header, 204 No Content); 4xx means the client must change something (400 Bad Request, 401 not signed in, 403 not allowed, 404 Not Found, 409 Conflict, 429 Too Many Requests); 5xx means the server failed (500, 503 Service Unavailable). Clients, retries and monitoring all depend on them, so be exact.","**Idempotent methods**: an operation is idempotent if doing it twice leaves the server in the same state as doing it once. GET, PUT and DELETE are idempotent by definition, so they're safe to retry; POST isn't, which is why create endpoints need idempotency keys.","**Idempotency keys**: the client creates a unique key for each logical operation and sends it with the request and every retry, often in an Idempotency-Key header. The server stores the key with the first result and replays that result for any repeat, so a timeout followed by a retry can't create or charge twice.","**Offset pagination**: ?limit=20&offset=40 is simple and lets users jump to page 3. But the database still reads and throws away every earlier row, so deep pages get slow, and rows added or removed between requests shift the pages, so items repeat or go missing.","**Cursor pagination**: each page returns an opaque cursor that encodes where it ended (the last item's sort key), and the next request asks for the items after it. Deep pages are as fast as the first (an index seek), and new rows don't disturb what's been read. The price: no jumping straight to page 50.","**Versioning and compatibility**: clients can't all update at once, so only add to a published API: new optional fields and new endpoints are safe; removing, renaming or retyping fields isn't. Breaking changes get a new version (/v2/ or a header), and the old one is retired slowly.","**REST, gRPC and GraphQL**: REST over JSON is the common default for public APIs. gRPC (binary Protocol Buffers over HTTP/2) suits fast, typed calls between your own services. GraphQL lets a client ask for exactly the fields it needs in one request, at the cost of harder caching and more work on the server."],"dia":[{"type":"seq","cap":"A retried payment with an idempotency key: charged once","actors":["Client","Payments API","Database"],"msgs":[["Client","Payments API","POST /payments, Idempotency-Key: 7f3e, £20"],["Payments API","Database","charge £20 and store key 7f3e with the result"],["Payments API","Client","201 Created (the reply is lost on the way)",true],["Client","Payments API","retry: the same request, the same key"],["Payments API","Database","look up key 7f3e: already done"],["Payments API","Client","201 Created: the stored result, no second charge",true]],"note":"The key must be stored with the result before the reply goes out, and keys are kept for long enough to cover every retry (often a day)."},{"type":"cells","cap":"A newest-first feed, paged 3 at a time, while a new post (11) arrives","idx":false,"rows":[{"label":"page 1","vals":[10,9,8]},{"label":"new post","vals":[11],"hl":[0]},{"label":"offset = 3","vals":[8,7,6],"hl":[0]},{"label":"after cursor 8","vals":[7,6,5],"ok":[0,1,2]}],"note":"The new post pushes everything down one place, so offset 3 now starts at 8, which the reader has already seen. The cursor asks for posts older than 8, which is unaffected."}],"cmp":[{"cap":"HTTP methods","head":["Method","Does","Idempotent","Typical status codes"],"rows":[["GET","Reads a resource","Yes, and safe: changes nothing","200, 404"],["POST","Creates a resource or runs an action","No","201 with a Location header, 400"],["PUT","Replaces the resource at that path","Yes","200 or 204; 201 if it created it"],["PATCH","Changes part of a resource","Not guaranteed","200, 409"],["DELETE","Removes it","Yes","204, 404"]]},{"cap":"Offset or cursor pagination","head":["","Offset (?offset=40&limit=20)","Cursor (?after=<token>&limit=20)"],"rows":[["Jump to page 50","Yes","No: only the next page (sometimes the previous)"],["Cost of a deep page","Reads and skips every earlier row","An index seek: as fast as page 1"],["New rows while paging","Items repeat or go missing","No repeats or gaps"],["Good for","Small lists that rarely change, admin tables","Feeds, timelines, big exports"]]}],"code":[{"t":"A tiny REST API and its status codes","tabs":[{"lang":"python","src":"import itertools, re\n\norders, ids = {}, itertools.count(1)\n\ndef handle(method, path, body=None):\n    \"\"\"A tiny REST API over a dict: returns the status code and the response body.\"\"\"\n    m = re.fullmatch(r\"/orders(?:/(\\d+))?\", path)\n    if not m:\n        return 404, None                      # no such resource\n    oid = int(m.group(1)) if m.group(1) else None\n    if oid is None and method == \"POST\":\n        if not body or \"pizza\" not in body:\n            return 400, None                  # the client must fix the request\n        oid = next(ids)\n        orders[oid] = {\"id\": oid, **body}\n        return 201, orders[oid]               # Created (with Location: /orders/<id>)\n    if oid is None and method == \"GET\":\n        return 200, list(orders.values())\n    if oid is not None and method == \"GET\":\n        return (200, orders[oid]) if oid in orders else (404, None)\n    if oid is not None and method == \"DELETE\":\n        return (204, None) if orders.pop(oid, None) else (404, None)\n    return 405, None                          # this path doesn't support that method\n\ncalls = [(\"POST\", \"/orders\", {\"pizza\": \"margherita\"}), (\"POST\", \"/orders\", {\"pizza\": \"veggie\"}),\n         (\"GET\", \"/orders/1\", None), (\"GET\", \"/orders/9\", None), (\"DELETE\", \"/orders/1\", None),\n         (\"DELETE\", \"/orders/1\", None), (\"PATCH\", \"/orders\", None), (\"POST\", \"/orders\", {}), (\"GET\", \"/menu\", None)]\nprint(*(handle(method, path, body)[0] for method, path, body in calls))\n","out":"201 201 200 404 204 404 405 400 404","notes":[[7,"One pattern covers the collection (/orders) and one item (/orders/42): nouns in the path, the method as the verb."],[13,"A bad request is the client's problem: 400 tells it to fix the request rather than retry it."],[16,"201 Created, with the new order; a real API also sends a Location header pointing at /orders/<id>."],[22,"Deleting twice gives 204 then 404, yet DELETE is still idempotent: the server ends in the same state, the order gone."]]},{"lang":"javascript","src":"const orders = new Map();\nlet nextId = 1;\n\nfunction handle(method, path, body = null) {\n  // a tiny REST API over a Map: returns [status code, response body]\n  const m = /^\\/orders(?:\\/(\\d+))?$/.exec(path);\n  if (!m) return [404, null];                 // no such resource\n  const id = m[1] ? Number(m[1]) : null;\n  if (id === null && method === \"POST\") {\n    if (!body || !(\"pizza\" in body)) return [400, null];   // the client must fix the request\n    const order = { id: nextId++, ...body };\n    orders.set(order.id, order);\n    return [201, order];                      // Created (with Location: /orders/<id>)\n  }\n  if (id === null && method === \"GET\") return [200, [...orders.values()]];\n  if (id !== null && method === \"GET\") return orders.has(id) ? [200, orders.get(id)] : [404, null];\n  if (id !== null && method === \"DELETE\") return orders.delete(id) ? [204, null] : [404, null];\n  return [405, null];                         // this path doesn't support that method\n}\n\nconst calls = [[\"POST\", \"/orders\", { pizza: \"margherita\" }], [\"POST\", \"/orders\", { pizza: \"veggie\" }],\n  [\"GET\", \"/orders/1\", null], [\"GET\", \"/orders/9\", null], [\"DELETE\", \"/orders/1\", null],\n  [\"DELETE\", \"/orders/1\", null], [\"PATCH\", \"/orders\", null], [\"POST\", \"/orders\", {}], [\"GET\", \"/menu\", null]];\nconsole.log(...calls.map(([method, path, body]) => handle(method, path, body)[0]));\n","out":"201 201 200 404 204 404 405 400 404","notes":[[6,"One pattern covers the collection (/orders) and one item (/orders/42): nouns in the path, the method as the verb."],[10,"A bad request is the client's problem: 400 tells it to fix the request rather than retry it."],[13,"201 Created, with the new order; a real API also sends a Location header pointing at /orders/<id>."],[17,"Deleting twice gives 204 then 404, yet DELETE is still idempotent: the server ends in the same state, the order gone."]]}]},{"t":"Offset or cursor pagination while new posts arrive","tabs":[{"lang":"python","src":"posts = list(range(1, 11))                    # post ids; a bigger id is newer\n\ndef newest_first():\n    return sorted(posts, reverse=True)\n\ndef page_by_offset(offset, limit=3):\n    return newest_first()[offset:offset + limit]\n\ndef page_by_cursor(after=None, limit=3):      # after: the last id the client has seen\n    page = [p for p in newest_first() if after is None or p < after][:limit]\n    return page, page[-1] if page else None   # the next cursor: where this page ended\n\nfirst = page_by_offset(0)\nposts.append(11)                              # someone posts while we read\nprint(\"offset:\", *first, \"|\", *page_by_offset(3))\n\nposts.remove(11)\npage1, cursor = page_by_cursor()\nposts.append(11)\npage2, cursor = page_by_cursor(cursor)\nprint(\"cursor:\", *page1, \"|\", *page2)\n\nfor offset in (0, 9_000):                     # rows the database reads to serve one page of 20\n    print(f\"page at offset {offset}: offset reads {offset + 20} rows, cursor reads 20\")\n","out":"offset: 10 9 8 | 8 7 6\ncursor: 10 9 8 | 7 6 5\npage at offset 0: offset reads 20 rows, cursor reads 20\npage at offset 9000: offset reads 9020 rows, cursor reads 20\n","notes":[[10,"The cursor query asks for posts older than the last one seen, which new posts can't disturb."],[15,"Post 11 pushed everything down a place, so offset 3 starts at 8 again: the reader sees 8 twice."],[21,"The cursor carries on from 8 whatever was added in between: 7, 6, 5."],[24,"Offset 9,000 makes the database step over 9,000 rows first; with an index, a cursor seeks straight to its place."]]},{"lang":"javascript","src":"const posts = Array.from({ length: 10 }, (_, i) => i + 1);   // post ids; a bigger id is newer\n\nconst newestFirst = () => [...posts].sort((a, b) => b - a);\nconst pageByOffset = (offset, limit = 3) => newestFirst().slice(offset, offset + limit);\n\nfunction pageByCursor(after = null, limit = 3) {   // after: the last id the client has seen\n  const page = newestFirst().filter(p => after === null || p < after).slice(0, limit);\n  return [page, page.length ? page.at(-1) : null];   // the next cursor: where this page ended\n}\n\nconst first = pageByOffset(0);\nposts.push(11);                               // someone posts while we read\nconsole.log(\"offset:\", ...first, \"|\", ...pageByOffset(3));\n\nposts.pop();\nlet [page1, cursor] = pageByCursor();\nposts.push(11);\nlet page2;\n[page2, cursor] = pageByCursor(cursor);\nconsole.log(\"cursor:\", ...page1, \"|\", ...page2);\n\nfor (const offset of [0, 9000]) {             // rows the database reads to serve one page of 20\n  console.log(`page at offset ${offset}: offset reads ${offset + 20} rows, cursor reads 20`);\n}\n","out":"offset: 10 9 8 | 8 7 6\ncursor: 10 9 8 | 7 6 5\npage at offset 0: offset reads 20 rows, cursor reads 20\npage at offset 9000: offset reads 9020 rows, cursor reads 20\n","notes":[[7,"The cursor query asks for posts older than the last one seen, which new posts can't disturb."],[13,"Post 11 pushed everything down a place, so offset 3 starts at 8 again: the reader sees 8 twice."],[20,"The cursor carries on from 8 whatever was added in between: 7, 6, 5."],[23,"Offset 9,000 makes the database step over 9,000 rows first; with an index, a cursor seeks straight to its place."]]}]},{"t":"Idempotency keys make a retried POST safe","tabs":[{"lang":"python","src":"class PaymentsAPI:\n    def __init__(self):\n        self.charges, self.seen = [], {}      # seen: idempotency key -> the first response\n\n    def charge(self, key, user, amount, lose_reply=False):\n        if key is not None and key in self.seen:\n            return self.seen[key]             # a repeat: replay the first answer, charge nothing\n        self.charges.append((user, amount))\n        response = (201, f\"charge {len(self.charges)}\")\n        if key is not None:\n            self.seen[key] = response         # stored before the reply goes out\n        if lose_reply:\n            raise TimeoutError(\"the reply was lost on the way back\")\n        return response\n\ndef pay_with_retry(api, key):                 # the first reply is lost, so the client retries once\n    for attempt in range(2):\n        try:\n            return api.charge(key, \"tara\", 20, lose_reply=(attempt == 0))\n        except TimeoutError:\n            pass\n\nfor label, key in ((\"without a key\", None), (\"with a key\", \"7f3e-0042\")):\n    api = PaymentsAPI()\n    status, body = pay_with_retry(api, key)\n    print(f\"{label}: {status} {body}, charges made: {len(api.charges)}\")\n","out":"without a key: 201 charge 2, charges made: 2\nwith a key: 201 charge 1, charges made: 1\n","notes":[[7,"A key seen before means this is a retry: send back exactly what the first attempt answered."],[11,"The result is saved before replying, so even a lost reply leaves a record the retry can find."],[26,"Without a key the server can't tell a retry from a new payment, so Tara pays twice."]]},{"lang":"javascript","src":"class TimeoutError extends Error {}\n\nclass PaymentsAPI {\n  constructor() { this.charges = []; this.seen = new Map(); }   // seen: idempotency key -> the first response\n  charge(key, user, amount, loseReply = false) {\n    if (key !== null && this.seen.has(key)) return this.seen.get(key);   // a repeat: replay the first answer, charge nothing\n    this.charges.push([user, amount]);\n    const response = [201, `charge ${this.charges.length}`];\n    if (key !== null) this.seen.set(key, response);   // stored before the reply goes out\n    if (loseReply) throw new TimeoutError(\"the reply was lost on the way back\");\n    return response;\n  }\n}\n\nfunction payWithRetry(api, key) {             // the first reply is lost, so the client retries once\n  for (let attempt = 0; attempt < 2; attempt++) {\n    try { return api.charge(key, \"tara\", 20, attempt === 0); }\n    catch (err) { if (!(err instanceof TimeoutError)) throw err; }\n  }\n}\n\nfor (const [label, key] of [[\"without a key\", null], [\"with a key\", \"7f3e-0042\"]]) {\n  const api = new PaymentsAPI();\n  const [status, body] = payWithRetry(api, key);\n  console.log(`${label}: ${status} ${body}, charges made: ${api.charges.length}`);\n}\n","out":"without a key: 201 charge 2, charges made: 2\nwith a key: 201 charge 1, charges made: 1\n","notes":[[6,"A key seen before means this is a retry: send back exactly what the first attempt answered."],[9,"The result is saved before replying, so even a lost reply leaves a record the retry can find."],[25,"Without a key the server can't tell a retry from a new payment, so Tara pays twice."]]}]}],"ex":{"q":"(LeetCode 535, Encode and Decode TinyURL) Design `encode(long_url)`, which returns a short URL, and `decode(short_url)`, which returns the original. Use a counter written in base 62, give the same long URL the same code, and work out how many URLs codes of up to six characters can cover.","steps":["Each long URL needs a short, unique code, and a redirect needs to look the code up again (LeetCode only checks that decode(encode(url)) returns url).","Give each new URL the next number from a counter and write the number in base 62 (ten digits and both cases of letters). Codes of up to six characters cover 62⁶ ≈ 56.8 billion URLs.","Keep two maps: code → long URL for decoding, and long URL → code so the same URL gets the same code (optional, but it saves space).","encode and decode take O(L) for a URL of L characters (hashing it), plus O(log₆₂ n) to write a code, with O(n·L) memory for n URLs. At scale, servers need a shared counter (or blocks of numbers handed out in advance), and sequential codes are easy to guess; the capstone deals with both."],"code":{"t":"A counter in base 62","tabs":[{"lang":"python","src":"ALPHABET = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\"\n\ndef base62(n):\n    digits = \"\"\n    while True:\n        n, r = divmod(n, 62)\n        digits = ALPHABET[r] + digits\n        if n == 0:\n            return digits\n\nclass Codec:\n    def __init__(self):\n        self.long_by_code, self.code_by_long, self.count = {}, {}, 0\n\n    def encode(self, long_url):\n        if long_url not in self.code_by_long:     # the same long URL keeps its code\n            code = base62(self.count)\n            self.count += 1\n            self.long_by_code[code], self.code_by_long[long_url] = long_url, code\n        return \"https://tiny.example/\" + self.code_by_long[long_url]\n\n    def decode(self, short_url):\n        return self.long_by_code[short_url.rsplit(\"/\", 1)[1]]\n\ncodec = Codec()\na = codec.encode(\"https://example.com/menu/margherita\")\nb = codec.encode(\"https://example.com/menu/veggie\")\nagain = codec.encode(\"https://example.com/menu/margherita\")\nprint(a, b, \"same code again:\", \"yes\" if again == a else \"no\")\nprint(\"decodes back:\", codec.decode(b))\nprint(base62(61), base62(62), base62(62 ** 6 - 1), \"->\", 62 ** 6, \"codes of up to 6 characters\")\n","out":"https://tiny.example/0 https://tiny.example/1 same code again: yes\ndecodes back: https://example.com/menu/veggie\nZ 10 ZZZZZZ -> 56800235584 codes of up to 6 characters\n"},{"lang":"javascript","src":"const ALPHABET = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\";\n\nfunction base62(n) {\n  let digits = \"\";\n  do {\n    digits = ALPHABET[n % 62] + digits;\n    n = Math.floor(n / 62);\n  } while (n > 0);\n  return digits;\n}\n\nclass Codec {\n  constructor() { this.longByCode = new Map(); this.codeByLong = new Map(); this.count = 0; }\n  encode(longUrl) {\n    if (!this.codeByLong.has(longUrl)) {      // the same long URL keeps its code\n      const code = base62(this.count++);\n      this.longByCode.set(code, longUrl);\n      this.codeByLong.set(longUrl, code);\n    }\n    return \"https://tiny.example/\" + this.codeByLong.get(longUrl);\n  }\n  decode(shortUrl) { return this.longByCode.get(shortUrl.slice(shortUrl.lastIndexOf(\"/\") + 1)); }\n}\n\nconst codec = new Codec();\nconst a = codec.encode(\"https://example.com/menu/margherita\");\nconst b = codec.encode(\"https://example.com/menu/veggie\");\nconst again = codec.encode(\"https://example.com/menu/margherita\");\nconsole.log(a, b, \"same code again:\", again === a ? \"yes\" : \"no\");\nconsole.log(\"decodes back:\", codec.decode(b));\nconsole.log(base62(61), base62(62), base62(62 ** 6 - 1), \"->\", 62 ** 6, \"codes of up to 6 characters\");\n","out":"https://tiny.example/0 https://tiny.example/1 same code again: yes\ndecodes back: https://example.com/menu/veggie\nZ 10 ZZZZZZ -> 56800235584 codes of up to 6 characters\n"}]},"a":"The first two URLs get codes 0 and 1, and encoding the first URL again returns its existing code. Decoding the second short URL gives back the veggie page. 61 is “Z”, 62 needs two characters (“10”), and six characters go up to “ZZZZZZ”: 56,800,235,584 codes in all."},"fade":{"q":"Make cursors opaque and safe when items share a timestamp. Items are listed newest first by (created_at, id). Finish `next_page(items, cursor, limit)`: return the next `limit` items after the cursor, and a new cursor (base64url-encoded JSON of the last item's created_at and id), or None when there are no more items.","steps":["Clients treat a cursor as an opaque token that they send back. Encoding it (here, base64url of JSON) lets the server change what's inside later without breaking anyone.",{"ask":"Why put both the time and the id in the cursor?","a":"Several items can share a timestamp. Ordering by (time, id) is a total order, so “strictly after the cursor” never skips or repeats an item that ties with the last one shown."},{"ask":"How can you tell whether another page exists without counting everything?","a":"Ask for limit + 1 items. If the extra one comes back there's more, and the cursor points at the last item actually returned; otherwise there's no next cursor."},{"ask":"What does a page cost?","a":"With an index on (created_at, id), the database seeks straight to the cursor: about O(log n + limit) per page however deep, against O(offset + limit) for offset paging. This list version scans, O(n), to keep it short."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"import base64, json\n\ndef encode_cursor(created_at, item_id):       # opaque to clients: they just send it back\n    raw = json.dumps([created_at, item_id], separators=(\",\", \":\")).encode()\n    return base64.urlsafe_b64encode(raw).decode().rstrip(\"=\")\n\ndef decode_cursor(cursor):\n    raw = base64.urlsafe_b64decode(cursor + \"=\" * (-len(cursor) % 4))\n    return tuple(json.loads(raw))\n\ndef next_page(items, cursor=None, limit=2):\n    \"\"\"items: (created_at, id, text), newest first. Returns (page, cursor for the next page or None).\"\"\"\n    ...                                       # TODO: items after the cursor; fetch limit + 1 to see if there's more\n"},{"lang":"javascript","src":"function encodeCursor(createdAt, itemId) {    // opaque to clients: they just send it back\n  return Buffer.from(JSON.stringify([createdAt, itemId])).toString(\"base64url\");\n}\nfunction decodeCursor(cursor) {\n  return JSON.parse(Buffer.from(cursor, \"base64url\").toString());\n}\n\nfunction nextPage(items, cursor = null, limit = 2) {\n  // items: [createdAt, id, text], newest first; returns [page, cursor for the next page or null]\n  // TODO: items after the cursor; fetch limit + 1 to see if there's more\n}\n"}]},"solution":{"t":"Solution: compare (time, id) pairs and fetch one extra item","tabs":[{"lang":"python","src":"import base64, json\n\ndef encode_cursor(created_at, item_id):       # opaque to clients: they just send it back\n    raw = json.dumps([created_at, item_id], separators=(\",\", \":\")).encode()\n    return base64.urlsafe_b64encode(raw).decode().rstrip(\"=\")\n\ndef decode_cursor(cursor):\n    raw = base64.urlsafe_b64decode(cursor + \"=\" * (-len(cursor) % 4))\n    return tuple(json.loads(raw))\n\ndef next_page(items, cursor=None, limit=2):\n    \"\"\"items: (created_at, id, text), newest first. Returns (page, cursor for the next page or None).\"\"\"\n    after = decode_cursor(cursor) if cursor else None\n    rows = [it for it in items if after is None or (it[0], it[1]) < after][:limit + 1]   # one extra says \"more\"\n    page = rows[:limit]\n    return page, encode_cursor(page[-1][0], page[-1][1]) if len(rows) > limit else None\n\nitems = [(1700000300, 7, \"g\"), (1700000300, 6, \"f\"), (1700000200, 5, \"e\"),\n         (1700000100, 4, \"d\"), (1700000100, 3, \"c\"), (1700000000, 2, \"b\")]\ncursor, pages = None, []\nwhile True:\n    page, cursor = next_page(items, cursor)\n    pages.append(\"\".join(text for _, _, text in page))\n    if cursor is None:\n        break\nprint(*pages, \"| first cursor:\", encode_cursor(1700000300, 6))\n","out":"gf ed cb | first cursor: WzE3MDAwMDAzMDAsNl0"},{"lang":"javascript","src":"function encodeCursor(createdAt, itemId) {    // opaque to clients: they just send it back\n  return Buffer.from(JSON.stringify([createdAt, itemId])).toString(\"base64url\");\n}\nfunction decodeCursor(cursor) {\n  return JSON.parse(Buffer.from(cursor, \"base64url\").toString());\n}\nconst isAfter = (it, c) => it[0] < c[0] || (it[0] === c[0] && it[1] < c[1]);   // later in newest-first order\n\nfunction nextPage(items, cursor = null, limit = 2) {\n  // items: [createdAt, id, text], newest first; returns [page, cursor for the next page or null]\n  const after = cursor ? decodeCursor(cursor) : null;
