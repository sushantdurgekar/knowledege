egate's events","Check the rules, append new events with the expected version"],"validate"],["Event log",["Append-only, partitioned by aggregate id"],"append"],["Projections",["Orders by status (SQL)","Order history (documents)","Search index","Analytics"],"consume, track offsets"],["Queries",["Screens and APIs read the projections"],"read"]],"note":"Writes and reads scale and change separately. A new read model is built by replaying the log from the start, without touching the write side."},{"type":"flow","cap":"Changing an event schema safely","steps":[["Add an optional field","with a default, so old and new readers both cope"],["Deploy readers first","they understand version 2 before anyone writes it"],["Then deploy writers","they start producing version 2"],["Upcast old events","convert version 1 to version 2 as it's read; never rewrite the log"]],"note":"A schema registry can enforce the compatibility rule on every change, so a breaking schema never reaches production."},{"type":"cells","cap":"Six partitions, before and after a third consumer joins","idx":false,"rows":[{"label":"partition","vals":[0,1,2,3,4,5]},{"label":"2 consumers","vals":["A","A","A","B","B","B"]},{"label":"3, sticky","vals":["A","A","C","B","B","C"]}],"note":"A sticky, cooperative rebalance moves only partitions 2 and 5 to the new consumer C; an eager rebalance pauses all six while it reassigns them."}],"cmp":[{"cap":"Storing state, or storing events","head":["","Current state only","Event sourcing"],"rows":[["What's stored","The latest row per entity","Every change, as an immutable event"],["History and audit","Only if you add it separately","Built in"],["Reading current state","One lookup","A replay, a snapshot plus newer events, or a projection"],["Fixing a mistake","Update the row","Append a correcting event"],["Hard parts","Lost history, ad hoc audit tables","Lagging read models, schema evolution, erasure"]]},{"cap":"Schema changes and compatibility","head":["Change","Backward: new readers, old events","Forward: old readers, new events"],"rows":[["Add an optional field with a default","Yes","Yes"],["Add a required field without a default","No","Yes: old readers ignore it"],["Remove an optional field","Yes","Yes, if old readers have a default"],["Rename or retype a field","No","No"]]}],"code":[{"t":"A small 32-bit hash (FNV-1a) for picking partitions, the same in both languages","tabs":[{"lang":"python","src":"def fnv1a(text):\n    h = 0x811C9DC5\n    for byte in text.encode():\n        h = ((h ^ byte) * 0x01000193) & 0xFFFFFFFF\n    return h\n"},{"lang":"javascript","src":"function fnv1a(text) {\n  let h = 0x811c9dc5;\n  for (const byte of Buffer.from(text)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;\n  return h;\n}\n"}]},{"t":"An event-sourced account: state is a fold over events","tabs":[{"lang":"python","src":"def apply(state, event):\n    kind, amount = event\n    if kind == \"opened\":\n        return {\"balance\": 0, \"open\": True}\n    if kind == \"deposited\":\n        return {**state, \"balance\": state[\"balance\"] + amount}\n    if kind == \"withdrawn\":\n        return {**state, \"balance\": state[\"balance\"] - amount}\n    if kind == \"closed\":\n        return {**state, \"open\": False}\n    raise ValueError(kind)\n\ndef replay(events):\n    state = None\n    for event in events:\n        state = apply(state, event)            # current state = fold(apply, events)\n    return state\n\ndef withdraw(events, amount):\n    \"\"\"A command: check it against the current state, then return the new events, or refuse.\"\"\"\n    state = replay(events)\n    if not state[\"open\"] or state[\"balance\"] < amount:\n        return None                            # refused: nothing is written\n    return [(\"withdrawn\", amount)]\n\nlog = [(\"opened\", 0), (\"deposited\", 5000), (\"withdrawn\", 1200), (\"deposited\", 300)]   # amounts in cents\nprint(\"balance now:\", replay(log)[\"balance\"], \"| after the first two events:\", replay(log[:2])[\"balance\"])\nfor amount in (3000, 9000):\n    new = withdraw(log, amount)\n    if new:\n        log += new\n    print(f\"withdraw {amount}: {'accepted' if new else 'refused'} | balance {replay(log)['balance']} | events {len(log)}\")\nsnapshot = (len(log), replay(log))             # a snapshot: the state as of event 5\nlog += [(\"deposited\", 700)]\nstate = snapshot[1]\nfor event in log[snapshot[0]:]:\n    state = apply(state, event)                # only the events after the snapshot\nprint(\"from the snapshot:\", state[\"balance\"], \"| from a full replay:\", replay(log)[\"balance\"])\n","out":"balance now: 4100 | after the first two events: 5000\nwithdraw 3000: accepted | balance 1100 | events 5\nwithdraw 9000: refused | balance 1100 | events 5\nfrom the snapshot: 1800 | from a full replay: 1800\n","notes":[[1,"Each event type knows how it changes the state; the state itself is never stored as the truth."],[16,"Replaying the stream rebuilds the state, and replaying a prefix gives the state at any earlier moment."],[22,"A command checks the rules against the current state; if it passes it becomes a new event, otherwise nothing is written."],[33,"A snapshot saves replaying the whole stream: start from it and apply only the newer events."]]},{"lang":"javascript","src":"function apply(state, [kind, amount]) {\n  if (kind === \"opened\") return { balance: 0, open: true };\n  if (kind === \"deposited\") return { ...state, balance: state.balance + amount };\n  if (kind === \"withdrawn\") return { ...state, balance: state.balance - amount };\n  if (kind === \"closed\") return { ...state, open: false };\n  throw new Error(kind);\n}\n\nfunction replay(events) {\n  return events.reduce(apply, null);           // current state = fold(apply, events)\n}\n\nfunction withdraw(events, amount) {\n  // a command: check it against the current state, then return the new events, or refuse\n  const state = replay(events);\n  if (!state.open || state.balance < amount) return null;   // refused: nothing is written\n  return [[\"withdrawn\", amount]];\n}\n\nlet log = [[\"opened\", 0], [\"deposited\", 5000], [\"withdrawn\", 1200], [\"deposited\", 300]];   // amounts in cents\nconsole.log(\"balance now:\", replay(log).balance, \"| after the first two events:\", replay(log.slice(0, 2)).balance);\nfor (const amount of [3000, 9000]) {\n  const fresh = withdraw(log, amount);\n  if (fresh) log = log.concat(fresh);\n  console.log(`withdraw ${amount}: ${fresh ? \"accepted\" : \"refused\"} | balance ${replay(log).balance} | events ${log.length}`);\n}\nconst snapshot = [log.length, replay(log)];    // a snapshot: the state as of event 5\nlog.push([\"deposited\", 700]);\nlet state = snapshot[1];\nfor (const event of log.slice(snapshot[0])) state = apply(state, event);   // only the events after the snapshot\nconsole.log(\"from the snapshot:\", state.balance, \"| from a full replay:\", replay(log).balance);\n","out":"balance now: 4100 | after the first two events: 5000\nwithdraw 3000: accepted | balance 1100 | events 5\nwithdraw 9000: refused | balance 1100 | events 5\nfrom the snapshot: 1800 | from a full replay: 1800\n","notes":[[1,"Each event type knows how it changes the state; the state itself is never stored as the truth."],[10,"Replaying the stream rebuilds the state, and replaying a prefix gives the state at any earlier moment."],[16,"A command checks the rules against the current state; if it passes it becomes a new event, otherwise nothing is written."],[27,"A snapshot saves replaying the whole stream: start from it and apply only the newer events."]]}]},{"t":"CQRS: two projections from one log, and a third built later by replaying it","tabs":[{"lang":"python","src":"events = [                                     # (offset, order, event, amount in cents, day)\n    (0, \"o1\", \"placed\", 2400, \"Mon\"), (1, \"o2\", \"placed\", 1800, \"Mon\"), (2, \"o1\", \"paid\", 2400, \"Mon\"),\n    (3, \"o3\", \"placed\", 3100, \"Tue\"), (4, \"o2\", \"cancelled\", 0, \"Tue\"), (5, \"o3\", \"paid\", 3100, \"Tue\"),\n    (6, \"o4\", \"placed\", 900, \"Wed\"), (7, \"o1\", \"shipped\", 0, \"Wed\"),\n]\n\nclass Projection:\n    \"\"\"A read model: consumes events in order, remembers its offset, can be rebuilt from zero.\"\"\"\n    def __init__(self, handle):\n        self.handle, self.offset, self.view = handle, 0, {}\n\n    def catch_up(self, log, upto=None):\n        for offset, *event in log[self.offset:upto]:\n            self.handle(self.view, *event)\n            self.offset = offset + 1           # stored with the view, so a restart resumes here\n\ndef by_status(view, order, event, amount, day):\n    view[order] = event                        # the latest status of each order\n\ndef revenue_per_day(view, order, event, amount, day):\n    if event == \"paid\":\n        view[day] = view.get(day, 0) + amount\n\nstatus = Projection(by_status)\nstatus.catch_up(events, upto=5)                # this one is lagging: it has read only 5 events\ncounts = {}\nfor s in status.view.values():\n    counts[s] = counts.get(s, 0) + 1\nprint(\"status view at offset\", status.offset, \"->\", \", \".join(f\"{k} {v}\" for k, v in sorted(counts.items())))\nstatus.catch_up(events)\nprint(\"caught up to offset\", status.offset, \"-> o1\", status.view[\"o1\"], \"| o3\", status.view[\"o3\"])\nrevenue = Projection(revenue_per_day)          # a new question next month: replay the whole log\nrevenue.catch_up(events)\nprint(\"revenue per day, built from offset 0:\", \", \".join(f\"{d} {c}\" for d, c in revenue.view.items()))\n","out":"status view at offset 5 -> cancelled 1, paid 1, placed 1\ncaught up to offset 8 -> o1 shipped | o3 paid\nrevenue per day, built from offset 0: Mon 2400, Tue 3100\n","notes":[[15,"The projection's offset is saved with its view, so after a restart it carries on where it stopped, and replaying from zero rebuilds it."],[18,"A read model is shaped for one question; the write side never has to change for it."],[29,"A lagging projection shows older states: o3 still looks unpaid until it catches up. That's the eventual consistency of CQRS."],[32,"A question nobody planned for gets its own projection by replaying the whole log."]]},{"lang":"javascript","src":"const events = [                               // [offset, order, event, amount in cents, day]\n  [0, \"o1\", \"placed\", 2400, \"Mon\"], [1, \"o2\", \"placed\", 1800, \"Mon\"], [2, \"o1\", \"paid\", 2400, \"Mon\"],\n  [3, \"o3\", \"placed\", 3100, \"Tue\"], [4, \"o2\", \"cancelled\", 0, \"Tue\"], [5, \"o3\", \"paid\", 3100, \"Tue\"],\n  [6, \"o4\", \"placed\", 900, \"Wed\"], [7, \"o1\", \"shipped\", 0, \"Wed\"],\n];\n\nclass Projection {\n  // a read model: consumes events in order, remembers its offset, can be rebuilt from zero\n  constructor(handle) { this.handle = handle; this.offset = 0; this.view = new Map(); }\n  catchUp(log, upto = log.length) {\n    for (const [offset, ...event] of log.slice(this.offset, upto)) {\n      this.handle(this.view, ...event);\n      this.offset = offset + 1;                // stored with the view, so a restart resumes here\n    }\n  }\n}\n\nconst byStatus = (view, order, event) => view.set(order, event);   // the latest status of each order\nconst revenuePerDay = (view, order, event, amount, day) => {\n  if (event === \"paid\") view.set(day, (view.get(day) ?? 0) + amount);\n};\n\nconst status = new Projection(byStatus);\nstatus.catchUp(events, 5);                     // this one is lagging: it has read only 5 events\nconst counts = new Map();\nfor (const s of status.view.values()) counts.set(s, (counts.get(s) ?? 0) + 1);\nconsole.log(\"status view at offset\", status.offset, \"->\", [...counts].sort().map(([k, v]) => `${k} ${v}`).join(\", \"));\nstatus.catchUp(events);\nconsole.log(\"caught up to offset\", status.offset, \"-> o1\", status.view.get(\"o1\"), \"| o3\", status.view.get(\"o3\"));\nconst revenue = new Projection(revenuePerDay); // a new question next month: replay the whole log\nrevenue.catchUp(events);\nconsole.log(\"revenue per day, built from offset 0:\", [...revenue.view].map(([d, c]) => `${d} ${c}`).join(\", \"));\n","out":"status view at offset 5 -> cancelled 1, paid 1, placed 1\ncaught up to offset 8 -> o1 shipped | o3 paid\nrevenue per day, built from offset 0: Mon 2400, Tue 3100\n","notes":[[13,"The projection's offset is saved with its view, so after a restart it carries on where it stopped, and replaying from zero rebuilds it."],[18,"A read model is shaped for one question; the write side never has to change for it."],[27,"A lagging projection shows older states: o3 still looks unpaid until it catches up. That's the eventual consistency of CQRS."],[30,"A question nobody planned for gets its own projection by replaying the whole log."]]}]},{"t":"Partitions: keys, a rebalance, and the cost of adding partitions later","tabs":[{"lang":"python","src":"def partition_of(key, partitions):\n    return fnv1a(key) % partitions             # the same key always lands in the same partition\n\ndef range_assign(partitions, consumers):\n    \"\"\"Eager style: split the partitions into contiguous ranges, one per consumer, from scratch.\"\"\"\n    size, extra = divmod(partitions, len(consumers))\n    out, p = {}, 0\n    for i, c in enumerate(consumers):\n        for _ in range(size + (1 if i < extra else 0)):\n            out[p] = c\n            p += 1\n    return out\n\ndef sticky_assign(old, consumers):\n    \"\"\"Cooperative style: keep every partition where it is unless a consumer has more than its share.\"\"\"\n    share = -(-len(old) // len(consumers))     # ceiling division\n    load = {c: 0 for c in consumers}\n    out, moving = {}, []\n    for p, c in sorted(old.items()):\n        if c in load and load[c] < share:     # still within its share: stays put\n            out[p] = c\n            load[c] += 1\n        else:\n            moving.append(p)\n    for p in moving:                           # hand the spare partitions to the least loaded consumers\n        c = min(consumers, key=lambda x: (load[x], x))\n        out[p] = c\n        load[c] += 1\n    return out\n\nbefore = range_assign(6, [\"A\", \"B\"])\neager = range_assign(6, [\"A\", \"B\", \"C\"])\nsticky = sticky_assign(before, [\"A\", \"B\", \"C\"])\nmoved = lambda new: sum(1 for p in before if before[p] != new[p])\nprint(\"2 consumers:\", \"\".join(before[p] for p in range(6)), \"| eager with 3:\", \"\".join(eager[p] for p in range(6)),\n      f\"(all 6 paused, {moved(eager)} moved) | sticky with 3:\", \"\".join(sticky[p] for p in range(6)), f\"({moved(sticky)} moved)\")\nkeys = [f\"customer-{i}\" for i in range(1000)]\nchanged = sum(1 for k in keys if partition_of(k, 6) != partition_of(k, 8))\nprint(f\"growing from 6 to 8 partitions moves {changed} of 1000 keys to a different partition\")\n","out":"2 consumers: AAABBB | eager with 3: AABBCC (all 6 paused, 3 moved) | sticky with 3: AACBBC (2 moved)\ngrowing from 6 to 8 partitions moves 749 of 1000 keys to a different partition\n","notes":[[2,"Key, hash, modulo: so all of one customer's events share a partition and stay in order."],[4,"An eager rebalance revokes every partition and assigns from scratch, so the whole group stops while it happens."],[14,"A cooperative, sticky rebalance keeps partitions where they are and moves only the few the new member needs."],[38,"Changing the partition count changes hash modulo n for most keys: their new events land in a new partition while old ones sit in the old, so per-key order is broken across the change."]]},{"lang":"javascript","src":"const partitionOf = (key, partitions) => fnv1a(key) % partitions;   // the same key always lands in the same partition\n\nfunction rangeAssign(partitions, consumers) {\n  // eager style: split the partitions into contiguous ranges, one per consumer, from scratch\n  const size = Math.floor(partitions / consumers.length), extra = partitions % consumers.length;\n  const out = new Map();\n  let p = 0;\n  consumers.forEach((c, i) => { for (let k = 0; k < size + (i < extra ? 1 : 0); k++) out.set(p++, c); });\n  return out;\n}\n\nfunction stickyAssign(old, consumers) {\n  // cooperative style: keep every partition where it is unless a consumer has more than its share\n  const share = Math.ceil(old.size / consumers.length);\n  const load = new Map(consumers.map(c => [c, 0]));\n  const out = new Map(), moving = [];\n  for (const [p, c] of [...old].sort((a, b) => a[0] - b[0])) {\n    if (load.has(c) && load.get(c) < share) {  // still within its share: stays put\n      out.set(p, c);\n      load.set(c, load.get(c) + 1);\n    } else moving.push(p);\n  }\n  for (const p of moving) {                    // hand the spare partitions to the least loaded consumers\n    const c = [...consumers].sort((x, y) => load.get(x) - load.get(y) || (x < y ? -1 : 1))[0];\n    out.set(p, c);\n    load.set(c, load.get(c) + 1);\n  }\n  return out;\n}\n\nconst before = rangeAssign(6, [\"A\", \"B\"]);\nconst eager = rangeAssign(6, [\"A\", \"B\", \"C\"]);\nconst sticky = stickyAssign(before, [\"A\", \"B\", \"C\"]);\nconst moved = fresh => [...before.keys()].filter(p => before.get(p) !== fresh.get(p)).length;\nconst show = m => [0, 1, 2, 3, 4, 5].map(p => m.get(p)).join(\"\");\nconsole.log(\"2 consumers:\", show(before), \"| eager with 3:\", show(eager), `(all 6 paused, ${moved(eager)} moved) | sticky with 3:`, show(sticky), `(${moved(sticky)} moved)`);\nconst keys = Array.from({ length: 1000 }, (_, i) => `customer-${i}`);\nconst changed = keys.filter(k => partitionOf(k, 6) !== partitionOf(k, 8)).length;\nconsole.log(`growing from 6 to 8 partitions moves ${changed} of 1000 keys to a different partition`);\n","out":"2 consumers: AAABBB | eager with 3: AABBCC (all 6 paused, 3 moved) | sticky with 3: AACBBC (2 moved)\ngrowing from 6 to 8 partitions moves 749 of 1000 keys to a different partition\n","notes":[[1,"Key, hash, modulo: so all of one customer's events share a partition and stay in order."],[3,"An eager rebalance revokes every partition and assigns from scratch, so the whole group stops while it happens."],[12,"A cooperative, sticky rebalance keeps partitions where they are and moves only the few the new member needs."],[38,"Changing the partition count changes hash modulo n for most keys: their new events land in a new partition while old ones sit in the old, so per-key order is broken across the change."]]}]}],"ex":{"q":"OrderPlaced events have been written as version 1 for two years: {order, total} with the total in cents. Version 2 adds the currency and a coupon. Make the change without breaking any reader, and show which kinds of schema change would have been breaking.","steps":["Version 2 adds currency (default \"EUR\", since every old order was in euros) and coupon (optional, default none). Both have defaults, so new readers can read old events (backward compatible) and old readers simply ignore the new fields (forward compatible).","Deploy the readers first, so they understand version 2 before any appears; then the writers. Old events are never rewritten: an upcaster turns version 1 into version 2 as each is read.","A compatibility check catches mistakes before deploy: a new required field without a default breaks backward compatibility, and removing a field that old readers require breaks forward compatibility. A schema registry runs this check on every change.","Cost: upcasting is O(fields) per event read. Chains of upcasters (v1 → v2 → v3) keep each step small; after a few versions, teams sometimes copy the stream into a new topic in the latest version."],"code":{"t":"Upcasting old events, and checking schema changes for compatibility","tabs":[{"lang":"python","src":"import json\n\nV2_DEFAULTS = {\"currency\": \"EUR\", \"coupon\": None}\n\ndef upcast(raw):\n    \"\"\"Read any version and return the latest shape; old events are never rewritten in the log.\"\"\"\n    event = json.loads(raw)\n    if event.get(\"v\", 1) == 1:\n        event = {**event, \"v\": 2, **V2_DEFAULTS}   # version 1 had no currency or coupon\n    return event\n\ndef compatible(old, new):\n    \"\"\"Schemas map field -> (required, has_default). Return (backward, forward).\"\"\"\n    backward = all(not req or has_default or f in old for f, (req, has_default) in new.items())\n    forward = all(not req or f in new or has_default for f, (req, has_default) in old.items())\n    return backward, forward\n\nlog = ['{\"v\": 1, \"order\": \"o1\", \"total\": 2400}',\n       '{\"v\": 2, \"order\": \"o2\", \"total\": 1800, \"currency\": \"GBP\", \"coupon\": \"SPRING\"}']\nfor raw in log:\n    e = upcast(raw)\n    print(f\"{e['order']}: {e['total']} {e['currency']}, coupon {e['coupon'] or 'none'}\")\n\nv1 = {\"order\": (True, False), \"total\": (True, False)}\nchanges = {\n    \"add currency and coupon with defaults\": {**v1, \"currency\": (True, True), \"coupon\": (False, True)},\n    \"add a required channel with no default\": {**v1, \"channel\": (True, False)},\n    \"drop total\": {\"order\": (True, False)},\n}\nfor label, v2 in changes.items():\n    backward, forward = compatible(v1, v2)\n    print(f\"{label}: backward {'yes' if backward else 'NO'}, forward {'yes' if forward else 'NO'}\")\n","out":"o1: 2400 EUR, coupon none\no2: 1800 GBP, coupon SPRING\nadd currency and coupon with defaults: backward yes, forward yes\nadd a required channel with no default: backward NO, forward yes\ndrop total: backward yes, forward NO\n"},{"lang":"javascript","src":"const V2_DEFAULTS = { currency: \"EUR\", coupon: null };\n\nfunction upcast(raw) {\n  // read any version and return the latest shape; old events are never rewritten in the log\n  let event = JSON.parse(raw);\n  if ((event.v ?? 1) === 1) event = { ...event, v: 2, ...V2_DEFAULTS };   // version 1 had no currency or coupon\n  return event;\n}\n\nfunction compatible(oldSchema, newSchema) {\n  // schemas map field -> [required, hasDefault]; return [backward, forward]\n  const backward = Object.entries(newSchema).every(([f, [req, hasDefault]]) => !req || hasDefault || f in oldSchema);\n  const forward = Object.entries(oldSchema).every(([f, [req, hasDefault]]) => !req || f in newSchema || hasDefault);\n  return [backward, forward];\n}\n\nconst log = ['{\"v\": 1, \"order\": \"o1\", \"total\": 2400}',\n             '{\"v\": 2, \"order\": \"o2\", \"total\": 1800, \"currency\": \"GBP\", \"coupon\": \"SPRING\"}'];\nfor (const raw of log) {\n  const e = upcast(raw);\n  console.log(`${e.order}: ${e.total} ${e.currency}, coupon ${e.coupon ?? \"none\"}`);\n}\n\nconst v1 = { order: [true, false], total: [true, false] };\nconst changes = {\n  \"add currency and coupon with defaults\": { ...v1, currency: [true, true], coupon: [false, true] },\n  \"add a required channel with no default\": { ...v1, channel: [true, false] },\n  \"drop total\": { order: [true, false] },\n};\nfor (const [label, v2] of Object.entries(changes)) {\n  const [backward, forward] = compatible(v1, v2);\n  console.log(`${label}: backward ${backward ? \"yes\" : \"NO\"}, forward ${forward ? \"yes\" : \"NO\"}`);\n}\n","out":"o1: 2400 EUR, coupon none\no2: 1800 GBP, coupon SPRING\nadd currency and coupon with defaults: backward yes, forward yes\nadd a required channel with no default: backward NO, forward yes\ndrop total: backward yes, forward NO\n"}]},"a":"The old order reads as 2,400 EUR with no coupon, filled in by the upcaster, and the new one keeps its GBP and coupon. Adding fields with defaults is compatible both ways; a new required field without a default would break new readers of old events (backward), and dropping a field old readers require would break them on new events (forward)."},"fade":{"q":"Finish `EventStore.append(stream, expected_version, events)`: append the events only if the stream's current version (its number of events) equals `expected_version`; otherwise raise a concurrency error. Then two writers who loaded the same version both try to withdraw: the second must reload, check the balance again, and either succeed or refuse.","steps":["The version is the number of events in the stream. An append that names the wrong version means someone else wrote in between.",{"ask":"Why not just lock the account while deciding?","a":"Locks held across a read, a decision and a write across a network hurt throughput and need timeouts. Optimistic concurrency assumes conflicts are rare: nobody waits, and the rare loser simply reloads and decides again."},{"ask":"What must the losing writer do?","a":"Reload the stream, rebuild the state and re-check the business rule with the new events, since the other writer may have changed the outcome (here, the balance), and only then append with the new expected version."},{"ask":"What does it cost?","a":"O(1) for the version check, plus a reload on conflict. Event stores do this check atomically: an append with an expected version in EventStoreDB, a conditional write in DynamoDB, or a unique (stream, version) index in SQL."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class ConcurrencyError(Exception):\n    pass\n\nclass EventStore:\n    def __init__(self):\n        self.streams = {}\n\n    def load(self, stream):\n        events = self.streams.get(stream, [])\n        return list(events), len(events)       # the events and the version they represent\n\n    def append(self, stream, expected_version, events):\n        ...                                    # TODO: refuse a stale version, otherwise append\n"},{"lang":"javascript","src":"class ConcurrencyError extends Error {}\n\nclass EventStore {\n  constructor() { this.streams = new Map(); }\n  load(stream) {\n    const events = this.streams.get(stream) ?? [];\n    return [[...events], events.length];       // the events and the version they represent\n  }\n  append(stream, expectedVersion, events) {\n    // TODO: refuse a stale version, otherwise append\n  }\n}\n"}]},"solution":{"t":"Solution: compare versions, then append; the loser reloads and decides again","tabs":[{"lang":"python","src":"class ConcurrencyError(Exception):\n    pass\n\nclass EventStore:\n    def __init__(self):\n        self.streams = {}\n\n    def load(self, stream):\n        events = self.streams.get(stream, [])\n        return list(events), len(events)       # the events and the version they represent\n\n    def append(self, stream, expected_version, events):\n        current = self.streams.setdefault(stream, [])\n        if len(current) != expected_version:\n            raise ConcurrencyError(f\"expected version {expected_version}, stream is at {len(current)}\")\n        current.extend(events)                 # in a real store, the check and the append are one atomic step\n        return len(current)\n\ndef balance(events):\n    return sum(a if k == \"deposited\" else -a for k, a in events)\n\ndef withdraw(store, stream, amount, loaded):\n    events, version = loaded\n    while True:\n        if balance(events) < amount:\n            return f\"refused at version {version} (balance {balance(events)})\"\n        try:\n            return f\"accepted, now at version {store.append(stream, version, [('withdrawn', amount)])}\"\n        except ConcurrencyError as err:\n            print(\"  conflict:\", err)\n            events, version = store.load(stream)   # reload, then check the rule again\n\nstore = EventStore()\nstore.append(\"acct-7\", 0, [(\"deposited\", 5000)])\nfirst, second = store.load(\"acct-7\"), store.load(\"acct-7\")   # two writers read version 1 at the same time\nprint(\"writer 1:\", withdraw(store, \"acct-7\", 3000, first))\nprint(\"writer 2:\", withdraw(store, \"acct-7\", 3000, second))\nprint(\"writer 3:\", withdraw(store, \"acct-7\", 1500, store.load(\"acct-7\")))\n","out":"writer 1: accepted, now at version 2\n  conflict: expected version 1, stream is at 2\nwriter 2: refused at version 2 (balance 2000)\nwriter 3: accepted, now at version 3\n"},{"lang":"javascript","src":"class ConcurrencyError extends Error {}\n\nclass EventStore {\n  constructor() { this.streams = new Map(); }\n  load(stream) {\n    const events = this.streams.get(stream) ?? [];\n    return [[...events], events.length];       // the events and the version they represent\n  }\n  append(stream, expectedVersion, events) {\n    if (!this.streams.has(stream)) this.streams.set(stream, []);\n    const current = this.streams.get(stream);\n    if (current.length !== expectedVersion) throw new ConcurrencyError(`expected version ${expectedVersion}, stream is at ${current.length}`);\n    current.push(...events);                   // in a real store, the check and the append are one atomic step\n    return current.length;\n  }\n}\n\nconst balance = events => events.reduce((s, [k, a]) => s + (k === \"deposited\" ? a : -a), 0);\n\nfunction withdraw(store, stream, amount, loaded) {\n  let [events, version] = loaded;\n  while (true) {\n    if (balance(events) < amount) return `refused at version ${version} (balance ${balance(events)})`;\n    try {\n      return `accepted, now at version ${store.append(stream, version, [[\"withdrawn\", amount]])}`;\n    } catch (err) {\n      if (!(err instanceof ConcurrencyError)) throw err;\n      console.log(\"  conflict:\", err.message);\n      [events, version] = store.load(stream);  // reload, then check the rule again\n    }\n  }\n}\n\nconst store = new EventStore();\nstore.append(\"acct-7\", 0, [[\"deposited\", 5000]]);\nconst first = store.load(\"acct-7\"), second = store.load(\"acct-7\");   // two writers read version 1 at the same time\nconsole.log(\"writer 1:\", withdraw(store, \"acct-7\", 3000, first));\nconsole.log(\"writer 2:\", withdraw(store, \"acct-7\", 3000, second));\nconsole.log(\"writer 3:\", withdraw(store, \"acct-7\", 1500, store.load(\"acct-7\")));\n","out":"writer 1: accepted, now at version 2\n  conflict: expected version 1, stream is at 2\nwriter 2: refused at version 2 (balance 2000)\nwriter 3: accepted, now at version 3\n"}]}},"traps":[["“With event sourcing we can delete the database and just keep events.”","Replaying everything on every read is too slow. Keep snapshots and projections for reading; the log is the source of truth, not the only store."],["“Events are just our database rows, sent out.”","Rows describe current state and change shape with every refactor. Events are business facts, in the past tense, designed as a stable contract that other teams build on."],["“CQRS means the read side is always up to date.”","Projections lag behind the log, by milliseconds or minutes. Design screens for it: show what was just submitted from the command's result, or wait for the projection's offset to pass the write."],["“We can rename a field in the new version; consumers will update.”","Old events in the log keep the old name forever, and consumers update at different times. Add a new field with a default, keep reading the old one, and upcast."],["“Start with a few partitions; we can add more later.”","Adding partitions remaps most keys, so a key's new events land in a different partition from its old ones and per-key order breaks. Size for growth from the start, or plan a migration to a new topic."],["“Immutable logs and the right to be forgotten don't mix, so ignore it.”","Regulations still apply. Keep personal data out of events where you can, reference it by id, or encrypt it per person and delete that person's key (crypto-shredding)."]],"disc":[["When is event sourcing worth it, and when is it overkill?","Worth it when the history is the product or the law: ledgers, orders, bookings, anything needing an audit trail, temporal queries or many read models fed from one source. Overkill for simple CRUD data where nobody asks what happened, such as user preferences; there, a table plus an outbox for change events is simpler."],["How would you choose the number of partitions for an orders topic?","From throughput and consumers: if the peak is 30,000 events a second and one consumer handles about 3,000, you need at least 10 partitions to run 10 consumers, then add headroom for growth and rebalancing, say 24 or 30. Partitions cost memory, file handles and longer rebalances, so not thousands. Choose the key for ordering (the order id) and check that no single key is hot."]],"teach":{"prompt":"Explain to a junior colleague what event sourcing and CQRS are, and how you'd change an event's schema without breaking consumers.","rubric":["Event sourcing: immutable events as the source of truth; state is a fold; snapshots","Commands validated against state; optimistic concurrency with expected versions","CQRS: projections per query, tracking offsets, eventually consistent, rebuildable","Schema evolution: optional fields with defaults, readers first, upcasting, a registry","Partitions: per-key order, sized for throughput, adding them later remaps keys"],"model":"With event sourcing we store every change as an immutable event, like MoneyDeposited, and treat the log as the source of truth; the current state is a fold over the events, with snapshots so we don't replay everything. A command is checked against the current state and becomes new events, appended with the version the writer saw, so a concurrent writer gets a conflict and decides again. CQRS separates that write side from read models, projections that consume the events, remember their offset and can be rebuilt from the start, at the price of lagging a little. To change an event schema, I only add optional fields with defaults, deploy readers before writers, and upcast old events as they're read; a schema registry checks every change. On Kafka, I key events by the entity so they stay in order within a partition, and choose the partition count up front, because adding partitions later remaps keys."},"qa":[["What is the source of truth in event sourcing?","The append-only log of immutable events; state is computed from it."],["Why take snapshots?","To rebuild state without replaying the whole stream: start from the snapshot and apply newer events."],["What does an expected version protect against?","Two writers deciding on the same old state: the second append is rejected and retried after a reload."],["What is a projection in CQRS?","A read model built by consuming events, tracking its offset, and rebuildable from zero."],["Backward or forward compatibility: which lets new readers read old events?","Backward compatibility."],["Why is adding Kafka partitions later risky?","It changes most keys' partition, breaking per-key ordering across the change."]],"quiz":[{"q":"What does this print?","snip":{"t":"State as a fold over events","tabs":[{"lang":"python","src":"events = [(\"deposited\", 50), (\"withdrawn\", 20), (\"deposited\", 5), (\"withdrawn\", 10)]\nbalance = 0\nfor kind, amount in events:\n    balance += amount if kind == \"deposited\" else -amount\nprint(balance, len(events))\n"},{"lang":"javascript","src":"const events = [[\"deposited\", 50], [\"withdrawn\", 20], [\"deposited\", 5], [\"withdrawn\", 10]];\nlet balance = 0;\nfor (const [kind, amount] of events) balance += kind === \"deposited\" ? amount : -amount;\nconsole.log(balance, events.length);\n"}]},"o":["25 4","85 4","35 4","25 2"],"a":0,"e":"50 − 20 + 5 − 10 = 25, computed from all four events: the balance itself was never stored."},{"q":"What does this print?","snip":{"t":"Partitions before and after growing a topic","tabs":[{"lang":"python","src":"keys = [10, 11, 12, 13, 14, 15]\nsame = [k for k in keys if k % 4 == k % 6]\nprint(len(same), *same)\n"},{"lang":"javascript","src":"const keys = [10, 11, 12, 13, 14, 15];\nconst same = keys.filter(k => k % 4 === k % 6);\nconsole.log(same.length, ...same);\n"}]},"o":["4 12 13 14 15","6 10 11 12 13 14 15","1 12","2 10 11"],"a":0,"e":"12 to 15 give the same remainder modulo 4 and modulo 6 (they're 0 to 3 past a multiple of 12), so they'd stay put if the topic grew from 4 to 6 partitions; 10 and 11 would move."},{"q":"Why does an event-sourced system take snapshots?","o":["So it can rebuild an entity's state without replaying its whole history","Because events expire after a few days","To avoid storing events at all","So projections don't need offsets"],"a":0,"e":"A snapshot is a cached fold: start from it and apply only the events after it. The events are still the source of truth."},{"q":"Two services write events for the same account at the same moment. What stops one of them from deciding on stale state?","o":["Appending with the expected version, so the store rejects the second append and that writer reloads","A projection that lags behind the log","Adding more partitions","Log compaction"],"a":0,"e":"Optimistic concurrency: the append names the version the writer saw. Lag, partitions and compaction don't detect a conflicting decision."},{"q":"Which schema changes keep both backward and forward compatibility? (choose 2)","t":"ms","o":["Adding an optional field with a default","Removing an optional field that old readers default","Renaming a field","Adding a required field without a default","Changing a field from a number to a string"],"a":[0,1],"e":"Optional fields with defaults can come and go safely. Renames and type changes break both directions, and a new required field without a default breaks new readers of old events."},{"q":"Judge each statement.","t":"yn","s":[["In event sourcing, a mistake is corrected by appending a new event.",true],["CQRS read models always show the latest write.",false],["Records with the same key go to the same Kafka partition, as long as the partition count doesn't change.",true],["A cooperative rebalance pauses every partition in the group.",false]],"e":"Events are immutable, read models lag, keys map to partitions by hash modulo the count, and cooperative rebalancing moves only the partitions that must move."},{"q":"Put the CQRS flow in order, from a user's command to their next screen.","t":"ord","items":["The command is validated against the aggregate's current state","New events are appended with the expected version","A projection consumes the events and updates its read model","The projection stores its new offset with the view","A query reads the updated read model"],"e":"The write side decides and appends; read models follow asynchronously and record how far they've read."},{"q":"Complete the Python fold that rebuilds a shopping cart from its events.","t":"drop","lang":"python","code":"def cart(events):\n    items = {}\n    for kind, sku, qty in events:\n        if kind == \"added\":\n            items[sku] = items.get(sku, 0) {{0}} qty\n        elif kind == \"removed\":\n            items[sku] = items.get(sku, 0) - qty\n            if items[sku] {{1}} 0:\n                del items[sku]\n    return items\n","blanks":[{"o":["+","-","*","="],"a":0},{"o":["<=",">=","==",">"],"a":0}],"e":"Adding increases the quantity; removing decreases it and drops the item once nothing (or less than nothing) is left."}],"probs":[["Reading · Event sourcing","https://martinfowler.com/eaaDev/EventSourcing.html","","list what Fowler says event sourcing enables, and which of those your current system can't do"],["Reference · CQRS pattern","https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs","","design read models for an order screen and a sales dashboard from one stream of order events"],["Reference · Schema evolution and compatibility","https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html","","for each compatibility mode, say whether readers or writers must be upgraded first"],["Reading · Kafka's design","https://kafka.apache.org/43/design/design/","","read the log compaction section, and decide which of your topics should be compacted"]],"src":[["Martin Fowler: Event Sourcing","https://martinfowler.com/eaaDev/EventSourcing.html"],["Azure Architecture Center: CQRS pattern","https://learn.microsoft.com/en-us/azure/architecture/patterns/cqrs"],["Azure Architecture Center: Event Sourcing pattern","https://learn.microsoft.com/en-us/azure/architecture/patterns/event-sourcing"],["Confluent docs: Schema evolution and compatibility","https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html"],["Apache Kafka 4.3 docs: Design","https://kafka.apache.org/43/design/design/"]]},{"id":"m03","d":"d1","t":"Stream and batch processing: windows, watermarks and exactly-once","min":120,"hook":"Batch jobs answer questions about yesterday; stream processors answer them while events are still arriving. Streams are harder: events arrive late and out of order, machines crash halfway through, and every result must count each event exactly once. The tools are event-time windows, watermarks, checkpoints, and idempotent or transactional sinks. The architecture follows from them: Lambda runs a batch path beside a fast one, Kappa runs one streaming path and replays the log to reprocess.","pre":{"q":"A dashboard counts taxi rides per minute. A phone that was in a tunnel uploads 40 rides from 12:01 at 12:06. Which minute should they count in, and what happens to the 12:01 total that's already on the screen?","a":"They belong to 12:01, the event time, not 12:06, when they arrived. The processor must either wait a little before finalising 12:01 (a watermark with some allowed lateness) or update the 12:01 result when late rides arrive, and decide how late is too late. Counting by arrival time would make 12:06 spike and 12:01 dip."},"kid":{"t":"Luigi's pizzas per hour","x":"Luigi counts pizzas per hour from the tickets his riders hand in, but some riders are late. So each ticket is counted in the hour the pizza was made, not the hour it reached him. He closes each hour's tally ten minutes after the hour ends; a ticket later than that goes in a \"late\" tray and gets added as a correction. If the lights go out, he starts again from the last page he bookmarked, and he crosses off ticket numbers as he counts them, so nothing is counted twice. On Sundays he recounts the whole week from the ticket box, which once caught a mistake in his tallies.","map":[["Counting by when the pizza was made","Event time: group events by when they happened, not when they arrived"],["Closing each tally ten minutes after the hour","A watermark with allowed lateness: a window's result is emitted when the watermark passes its end"],["The late tray and its corrections","Late data: dropped, sent to a side output, or used to update a result already emitted"],["Starting again from the bookmarked page, crossing off tickets","Checkpoints of state and input position, plus idempotent output: exactly-once results"],["The Sunday recount from the ticket box","Reprocessing: a batch recount (Lambda) or a replay of the log (Kappa)"]],"brk":"Luigi can see when every rider has come home. A stream processor never knows for sure that no more old events will arrive: a watermark is only an estimate, so the choice is always between waiting longer and being wrong more often."},"keys":["**Batch and stream**: batch jobs process bounded data (yesterday's files) completely and simply, with hours of latency. Stream processors handle unbounded data continuously, with seconds of latency, but must cope with disorder, late data, state and failures. Engines such as Apache Flink and Spark treat a batch as a stream that happens to end.","**Lambda architecture**: a batch layer periodically recomputes accurate views from all the raw data, a speed layer covers the most recent data quickly and approximately, and queries merge the two. The cost: the same logic written twice, in two systems, which drift apart.","**Kappa architecture**: one streaming pipeline over a log that can be replayed (Kafka with long retention). To reprocess, run a new version of the job from the start of the log beside the old one, and switch readers to its output once it catches up. It needs a long enough log and a job that replays fast.","**Event time and processing time**: each event carries the time it happened; the processor sees it later, and not in order (network delays, offline phones, retries). Group by event time to get right answers; processing time is simpler, but its results depend on delays.","**Windows**: tumbling windows are fixed and back to back (rides per minute); sliding or hopping windows are fixed and overlapping (the last 5 minutes, every minute); session windows are per key and end after a gap of inactivity (one user's visit). State is kept per key per window until the window is final.","**Watermarks and late data**: a watermark is the processor's estimate that no events older than T are still coming, often the newest event time seen minus an allowed lateness. A window's result is emitted when the watermark passes its end. Events later than that are dropped, sent to a side output, or used to update the result already emitted. More lateness means more complete results but later ones.","**Exactly-once processing**: the processor periodically checkpoints every operator's state together with the input offsets (Flink sends barriers through the pipeline, after the Chandy–Lamport snapshot algorithm). After a crash it restores the checkpoint and replays from those offsets. Inside the pipeline that's exactly once; outputs need idempotent writes (upserts by key) or transactional sinks that commit with each checkpoint.","**Running it**: slow sinks push back up the pipeline through bounded buffers (backpressure); large state lives in an embedded store such as RocksDB with incremental checkpoints; scale by partitioning on the key; and watch consumer lag, checkpoint duration and late-event counts."],"dia":[{"type":"layers","cap":"Three kinds of window","rows":[["Tumbling","fixed size, back to back, each event in exactly one window: rides per minute"],["Sliding (hopping)","fixed size, overlapping, each event in size ÷ slide windows: the last 5 minutes, every minute"],["Session","per key, ends after a gap of inactivity: one user's visit to the site"]],"note":"Windows are defined in event time; the watermark decides when each one's result can be emitted."},{"type":"seq","cap":"A checkpoint barrier flowing through a pipeline","actors":["Source","Parse","Count per window","Sink"],"msgs":[["Source","Parse","barrier 7, after offset 1,000"],["Parse","Count per window","barrier 7 (Parse has saved its state)"],["Count per window","Sink","barrier 7 (counts saved)"],["Sink","Source","checkpoint 7 complete; commit the sink's transaction",true]],"note":"After a crash, every operator restores checkpoint 7 and the source rewinds to offset 1,000. State and input agree, so nothing inside the pipeline is lost or counted twice."},{"type":"flow","cap":"Reprocessing in a Kappa architecture","steps":[["Keep the log","retain the raw events long enough to replay (weeks, or forever with tiered storage)"],["Start job version 2","from offset 0, beside version 1, writing to a new output table"],["Catch up","version 2 replays history, then keeps up with live events"],["Switch readers","point the dashboards at the new table, then retire version 1"]],"note":"One codebase does both live processing and reprocessing, which is the main thing Kappa saves over Lambda."}],"cmp":[{"cap":"Lambda or Kappa","head":["","Lambda","Kappa"],"rows":[["Paths","A batch layer and a speed layer","One streaming path"],["Reprocessing","Rerun the batch job","Replay the log through a new version of the job"],["Code","Two implementations to keep in step","One"],["Needs","A batch store and a stream processor","A replayable, long-retention log and a job that replays fast"],["Fits","Heavy batch analytics beside quick approximations","Most new pipelines"]]},{"cap":"Delivery guarantees in stream processing","head":["Guarantee","How","Cost"],"rows":[["At-most-once","Commit offsets before processing; never replay","Events lost on failure"],["At-least-once","Replay from the last committed offsets","Duplicates in state or outputs"],["Exactly-once (effectively once)","Checkpoint state and offsets together; idempotent or transactional sinks","Checkpoint overhead, and output delayed until each commit"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Event time against processing time: rides per minute","tabs":[{"lang":"python","src":"rand = mulberry32(2)\nrides = []\nfor _ in range(200):\n    event_time = 600 + int(rand() * 300)       # rides between 12:10:00 and 12:14:59, in seconds after 12:00\n    delay = 2 if rand() < 0.9 else 60 + int(rand() * 240)   # most arrive in 2 s; phones in tunnels up to 5 min late\n    rides.append((event_time, event_time + delay))\n\ndef minute(t):\n    return f\"12:{t // 60:02d}\"\n\nby_event, by_arrival = {}, {}\nfor event_time, arrival in rides:\n    by_event[minute(event_time)] = by_event.get(minute(event_time), 0) + 1       # when it happened\n    by_arrival[minute(arrival)] = by_arrival.get(minute(arrival), 0) + 1         # when we saw it\nminutes = sorted(set(by_event) | set(by_arrival))\nprint(\"by event time:  \", \" \".join(f\"{m}={by_event.get(m, 0)}\" for m in minutes))\nprint(\"by arrival time:\", \" \".join(f\"{m}={by_arrival.get(m, 0)}\" for m in minutes))\n","out":"by event time:   12:10=38 12:11=38 12:12=43 12:13=41 12:14=40 12:15=0 12:16=0 12:17=0\nby arrival time: 12:10=30 12:11=33 12:12=44 12:13=43 12:14=42 12:15=3 12:16=3 12:17=2\n","notes":[[5,"Most events arrive within seconds, but one in ten is delayed by minutes, as phones reconnect."],[13,"Grouping by event time puts each ride in the minute it happened, whenever it arrives."],[17,"By arrival time, rides leak out of 12:10–12:14 into the following minutes, which never had any rides at all."]]},{"lang":"javascript","src":"const rand = mulberry32(2);\nconst rides = [];\nfor (let i = 0; i < 200; i++) {\n  const eventTime = 600 + Math.floor(rand() * 300);   // rides between 12:10:00 and 12:14:59, in seconds after 12:00\n  const delay = rand() < 0.9 ? 2 : 60 + Math.floor(rand() * 240);   // most arrive in 2 s; phones in tunnels up to 5 min late\n  rides.push([eventTime, eventTime + delay]);\n}\n\nconst minute = t => `12:${String(Math.floor(t / 60)).padStart(2, \"0\")}`;\n\nconst byEvent = new Map(), byArrival = new Map();\nfor (const [eventTime, arrival] of rides) {\n  byEvent.set(minute(eventTime), (byEvent.get(minute(eventTime)) ?? 0) + 1);       // when it happened\n  byArrival.set(minute(arrival), (byArrival.get(minute(arrival)) ?? 0) + 1);       // when we saw it\n}\nconst minutes = [...new Set([...byEvent.keys(), ...byArrival.keys()])].sort();\nconsole.log(\"by event time:  \", minutes.map(m => `${m}=${byEvent.get(m) ?? 0}`).join(\" \"));\nconsole.log(\"by arrival time:\", minutes.map(m => `${m}=${byArrival.get(m) ?? 0}`).join(\" \"));\n","out":"by event time:   12:10=38 12:11=38 12:12=43 12:13=41 12:14=40 12:15=0 12:16=0 12:17=0\nby arrival time: 12:10=30 12:11=33 12:12=44 12:13=43 12:14=42 12:15=3 12:16=3 12:17=2\n","notes":[[5,"Most events arrive within seconds, but one in ten is delayed by minutes, as phones reconnect."],[13,"Grouping by event time puts each ride in the minute it happened, whenever it arrives."],[18,"By arrival time, rides leak out of 12:10–12:14 into the following minutes, which never had any rides at all."]]}]},{"t":"Tumbling and sliding windows","tabs":[{"lang":"python","src":"clicks = [(5, \"ana\"), (12, \"ben\"), (40, \"ana\"), (61, \"ana\"), (95, \"ben\"), (130, \"ana\"), (170, \"ana\"), (178, \"ben\")]\n\ndef tumbling(events, size):\n    out = {}\n    for t, _ in events:\n        start = t - t % size                   # each event falls in exactly one window\n        out[start] = out.get(start, 0) + 1\n    return out\n\ndef sliding(events, size, slide):\n    out = {}\n    for t, _ in events:\n        first = (t - size) // slide * slide + slide   # the earliest window start that still covers t\n        for start in range(max(0, first), t + 1, slide):\n            out[start] = out.get(start, 0) + 1    # an event counts in every window that covers it\n    return out\n\nshow = lambda windows, size: \" | \".join(f\"{s}-{s + size - 1}: {n}\" for s, n in sorted(windows.items()))\nprint(\"tumbling, 60 s:\", show(tumbling(clicks, 60), 60))\nprint(\"sliding, 120 s every 60 s:\", show(sliding(clicks, 120, 60), 120))\n","out":"tumbling, 60 s: 0-59: 3 | 60-119: 2 | 120-179: 3\nsliding, 120 s every 60 s: 0-119: 5 | 60-179: 5 | 120-239: 3\n","notes":[[6,"A tumbling window's start is the time rounded down to the window size."],[13,"The first sliding window that can still contain t starts just after t minus the size, rounded up to the slide."],[15,"With a 120-second window every 60 seconds, each event is counted twice: once in each window that covers it."]]},{"lang":"javascript","src":"const clicks = [[5, \"ana\"], [12, \"ben\"], [40, \"ana\"], [61, \"ana\"], [95, \"ben\"], [130, \"ana\"], [170, \"ana\"], [178, \"ben\"]];\n\nfunction tumbling(events, size) {\n  const out = new Map();\n  for (const [t] of events) {\n    const start = t - (t % size);              // each event falls in exactly one window\n    out.set(start, (out.get(start) ?? 0) + 1);\n  }\n  return out;\n}\n\nfunction sliding(events, size, slide) {\n  const out = new Map();\n  for (const [t] of events) {\n    const first = Math.floor((t - size) / slide) * slide + slide;   // the earliest window start that still covers t\n    for (let start = Math.max(0, first); start <= t; start += slide) out.set(start, (out.get(start) ?? 0) + 1);   // an event counts in every window that covers it\n  }\n  return out;\n}\n\nconst show = (windows, size) => [...windows].sort((a, b) => a[0] - b[0]).map(([s, n]) => `${s}-${s + size - 1}: ${n}`).join(\" | \");\nconsole.log(\"tumbling, 60 s:\", show(tumbling(clicks, 60), 60));\nconsole.log(\"sliding, 120 s every 60 s:\", show(sliding(clicks, 120, 60), 120));\n","out":"tumbling, 60 s: 0-59: 3 | 60-119: 2 | 120-179: 3\nsliding, 120 s every 60 s: 0-119: 5 | 60-179: 5 | 120-239: 3\n","notes":[[6,"A tumbling window's start is the time rounded down to the window size."],[15,"The first sliding window that can still contain t starts just after t minus the size, rounded up to the slide."],[16,"With a 120-second window every 60 seconds, each event is counted twice: once in each window that covers it."]]}]},{"t":"Watermarks: how long to wait for late events","tabs":[{"lang":"python","src":"rand = mulberry32(9)\nevents = []\nfor _ in range(600):\n    t = int(rand() * 600)                      # ten minutes of events\n    late = rand() < 0.08\n    events.append((t, t + (20 + int(rand() * 100) if late else int(rand() * 3))))   # 8% arrive 20–119 s late\nevents.sort(key=lambda e: (e[1], e[0]))        # the processor sees them in arrival order\n\ndef run(lateness, size=60):\n    counts, emitted, delays = {}, set(), []\n    dropped = newest = 0\n    for event_time, arrival in events:\n        start = event_time - event_time % size\n        if start in emitted:\n            dropped += 1                       # its window's result has already gone out\n        else:\n            counts[start] = counts.get(start, 0) + 1\n        newest = max(newest, event_time)\n        watermark = newest - lateness          # \"no events older than this are still coming\"\n        for s in sorted(counts):\n            if s not in emitted and s + size <= watermark:\n                emitted.add(s)                 # emit the window's final result now\n                delays.append(arrival - (s + size))\n    return len(delays), sum(delays) // len(delays), dropped\n\nfor lateness in (0, 30, 120):\n    windows, delay, dropped = run(lateness)\n    print(f\"allowed lateness {lateness} s: {windows} windows emitted, about {delay} s after each ends, {dropped} late events dropped\")\n","out":"allowed lateness 0 s: 9 windows emitted, about 1 s after each ends, 41 late events dropped\nallowed lateness 30 s: 9 windows emitted, about 31 s after each ends, 30 late events dropped\nallowed lateness 120 s: 7 windows emitted, about 121 s after each ends, 0 late events dropped\n","notes":[[7,"Sorting by arrival time is what the processor actually experiences: later event times often arrive before earlier ones."],[14,"An event for a window that has already been emitted is late: this version drops it; others send it to a side output or update the result."],[19,"The watermark trails the newest event time by the allowed lateness: the longer it trails, the more stragglers each window waits for."],[28,"Waiting longer drops fewer late events but makes every result later. With 120 s, the last two windows are still waiting when the input stops."]]},{"lang":"javascript","src":"const rand = mulberry32(9);\nconst events = [];\nfor (let i = 0; i < 600; i++) {\n  const t = Math.floor(rand() * 600);         // ten minutes of events\n  const late = rand() < 0.08;\n  events.push([t, t + (late ? 20 + Math.floor(rand() * 100) : Math.floor(rand() * 3))]);   // 8% arrive 20–119 s late\n}\nevents.sort((a, b) => a[1] - b[1] || a[0] - b[0]);   // the processor sees them in arrival order\n\nfunction run(lateness, size = 60) {\n  const counts = new Map(), emitted = new Set(), delays = [];\n  let dropped = 0, newest = 0;\n  for (const [eventTime, arrival] of events) {\n    const start = eventTime - (eventTime % size);\n    if (emitted.has(start)) dropped++;         // its window's result has already gone out\n    else counts.set(start, (counts.get(start) ?? 0) + 1);\n    newest = Math.max(newest, eventTime);\n    const watermark = newest - lateness;      // \"no events older than this are still coming\"\n    for (const s of [...counts.keys()].sort((a, b) => a - b)) {\n      if (!emitted.has(s) && s + size <= watermark) {\n        emitted.add(s);                        // emit the window's final result now\n        delays.push(arrival - (s + size));\n      }\n    }\n  }\n  return [delays.length, Math.floor(delays.reduce((a, b) => a + b, 0) / delays.length), dropped];\n}\n\nfor (const lateness of [0, 30, 120]) {\n  const [windows, delay, dropped] = run(lateness);\n  console.log(`allowed lateness ${lateness} s: ${windows} windows emitted, about ${delay} s after each ends, ${dropped} late events dropped`);\n}\n","out":"allowed lateness 0 s: 9 windows emitted, about 1 s after each ends, 41 late events dropped\nallowed lateness 30 s: 9 windows emitted, about 31 s after each ends, 30 late events dropped\nallowed lateness 120 s: 7 windows emitted, about 121 s after each ends, 0 late events dropped\n","notes":[[8,"Sorting by arrival time is what the processor actually experiences: later event times often arrive before earlier ones."],[15,"An event for a window that has already been emitted is late: this version drops it; others send it to a side output or update the result."],[18,"The watermark trails the newest event time by the allowed lateness: the longer it trails, the more stragglers each window waits for."],[31,"Waiting longer drops fewer late events but makes every result later. With 120 s, the last two windows are still waiting when the input stops."]]}]}],"ex":{"q":"A stream job counts rides per city and writes one output row per ride processed. It checkpoints every 100 events and crashes twice, at offsets 250 and 470. Show what three kinds of sink end up holding: an append-only sink, an idempotent sink that upserts by ride id, and a transactional sink that commits its output with each checkpoint.","steps":["A checkpoint stores the operator state (counts per city) together with the input offset. After a crash the job restores the latest checkpoint and replays from its offset, so the events since that checkpoint are processed twice.","Inside the job that's harmless: the state was restored to before those events, so the counts come out exact. The outputs are the problem: rows written after the checkpoint were already sent.","An append-only sink keeps both copies. An idempotent sink overwrites a row with the same key (the ride id), so a replay rewrites identical rows. A transactional sink holds output in an open transaction and commits it only when the checkpoint completes, so a crash discards the uncommitted rows.","Costs: replays redo work since the last checkpoint (checkpoint more often: more overhead, less replay); transactional sinks delay output until each commit; idempotent sinks need a stable key per output row."],"code":{"t":"Checkpoints, a replay after each crash, and three kinds of sink","tabs":[{"lang":"python","src":"rand = mulberry32(4)\ncities = [\"lyon\", \"nice\", \"paris\"]\nevents = [(f\"ride-{i}\", cities[int(rand() * 3)]) for i in range(600)]\ntrue_counts = {c: sum(1 for _, city in events if city == c) for c in cities}\n\ndef run(sink_kind, checkpoint_every=100, crash_at=(250, 470)):\n    crashes = set(crash_at)\n    offset, state, checkpoint = 0, {}, (0, {})\n    sink, pending, processed = ([] if sink_kind != \"idempotent\" else {}), [], 0\n    while offset < len(events):\n        if offset in crashes:                  # a crash: restore the last checkpoint and rewind the input\n            crashes.discard(offset)\n            offset, state = checkpoint[0], dict(checkpoint[1])\n            pending = []                       # an open sink transaction dies with the job\n            continue\n        ride, city = events[offset]\n        state[city] = state.get(city, 0) + 1\n        processed += 1\n        if sink_kind == \"append\":\n            sink.append((ride, city))\n        elif sink_kind == \"idempotent\":\n            sink[ride] = city                  # an upsert: a replayed ride rewrites the same row\n        else:\n            pending.append((ride, city))\n        offset += 1\n        if offset % checkpoint_every == 0:\n            checkpoint = (offset, dict(state)) # state and offset saved together\n            if sink_kind == \"transactional\":\n                sink += pending                # commit the output with the checkpoint\n                pending = []\n    if sink_kind == \"transactional\":\n        sink += pending\n    return processed, len(sink), state == true_counts\n\nfor kind in (\"append\", \"idempotent\", \"transactional\"):\n    processed, rows, state_ok = run(kind)\n    print(f\"{kind} sink: {processed} events processed, {rows} output rows, state correct: {'yes' if state_ok else 'no'}\")\n","out":"append sink: 720 events processed, 720 output rows, state correct: yes\nidempotent sink: 720 events processed, 600 output rows, state correct: yes\ntransactional sink: 720 events processed, 600 output rows, state correct: yes\n"},{"lang":"javascript","src":"const rand = mulberry32(4);\nconst cities = [\"lyon\", \"nice\", \"paris\"];\nconst events = Array.from({ length: 600 }, (_, i) => [`ride-${i}`, cities[Math.floor(rand() * 3)]]);\nconst trueCounts = Object.fromEntries(cities.map(c => [c, events.filter(([, city]) => city === c).length]));\n\nfunction run(sinkKind, checkpointEvery = 100, crashAt = [250, 470]) {\n  const crashes = new Set(crashAt);\n  let offset = 0, state = {}, checkpoint = [0, {}];\n  let sink = sinkKind === \"idempotent\" ? new Map() : [], pending = [], processed = 0;\n  while (offset < events.length) {\n    if (crashes.has(offset)) {                 // a crash: restore the last checkpoint and rewind the input\n      crashes.delete(offset);\n      offset = checkpoint[0]; state = { ...checkpoint[1] };\n      pending = [];                            // an open sink transaction dies with the job\n      continue;\n    }\n    const [ride, city] = events[offset];\n    state[city] = (state[city] ?? 0) + 1;\n    processed++;\n    if (sinkKind === \"append\") sink.push([ride, city]);\n    else if (sinkKind === \"idempotent\") sink.set(ride, city);   // an upsert: a replayed ride rewrites the same row\n    else pending.push([ride, city]);\n    offset++;\n    if (offset % checkpointEvery === 0) {\n      checkpoint = [offset, { ...state }];     // state and offset saved together\n      if (sinkKind === \"transactional\") { sink.push(...pending); pending = []; }   // commit the output with the checkpoint\n    }\n  }\n  if (sinkKind === \"transactional\") sink.push(...pending);\n  const rows = sinkKind === \"idempotent\" ? sink.size : sink.length;\n  const stateOk = cities.every(c => state[c] === trueCounts[c]);\n  return [processed, rows, stateOk];\n}\n\nfor (const kind of [\"append\", \"idempotent\", \"transactional\"]) {\n  const [processed, rows, stateOk] = run(kind);\n  console.log(`${kind} sink: ${processed} events processed, ${rows} output rows, state correct: ${stateOk ? \"yes\" : \"no\"}`);\n}\n","out":"append sink: 720 events processed, 720 output rows, state correct: yes\nidempotent sink: 720 events processed, 600 output rows, state correct: yes\ntransactional sink: 720 events processed, 600 output rows, state correct: yes\n"}]},"a":"All three process 720 events: the crash at offset 250 replays the 50 events since the checkpoint at 200, and the crash at 470 replays the 70 since 400. The counts per city are exact every time, because the state was restored together with the offsets. Only the sinks differ. The append-only sink holds 720 rows, 120 of them duplicates. The idempotent sink holds 600, because each replayed ride overwrote its own row. The transactional sink holds 600, because the rows written after each checkpoint died with the open transaction and were written once on replay. That is exactly-once in practice: processing may repeat, but the outputs are idempotent or committed atomically with the checkpoint."},"fade":{"q":"Finish `sessions(events, gap)`: group each user's clicks into session windows, where a session ends when the user is quiet for more than `gap` seconds. Return, per user, a list of [start, end, clicks].","steps":["Sort each user's clicks by time, then walk them, keeping the current session open.",{"ask":"When does a click join the current session, and when does it start a new one?","a":"It joins if it comes within gap seconds of the session's last click, extending the session's end; otherwise the session is closed and the click starts a new one."},{"ask":"How does a streaming engine know a session is over, when more clicks could still come?","a":"It can't know from the clicks alone: it waits until the watermark passes the session's last click plus the gap. A late click inside the gap can even merge two sessions into one, which engines support but outputs must handle."},{"ask":"What does it cost?","a":"O(n log n) to sort, O(n) to walk. In a streaming engine the state is one open session per active user, which is why session gaps must be bounded."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def sessions(events, gap):\n    out = {}\n    for t, user in sorted(events, key=lambda e: (e[1], e[0])):   # by user, then by time\n        ...                                    # TODO: extend the user's current session, or start a new one\n    return out\n"},{"lang":"javascript","src":"function sessions(events, gap) {\n  const out = new Map();\n  for (const [t, user] of [...events].sort((a, b) => (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[0] - b[0]))) {   // by user, then by time\n    // TODO: extend the user's current session, or start a new one\n  }\n  return out;\n}\n"}]},"solution":{"t":"Solution: extend while the gap is small, otherwise start again","tabs":[{"lang":"python","src":"def sessions(events, gap):\n    out = {}\n    for t, user in sorted(events, key=lambda e: (e[1], e[0])):   # by user, then by time\n        user_sessions = out.setdefault(user, [])\n        if user_sessions and t - user_sessions[-1][1] <= gap:\n            user_sessions[-1][1] = t            # close enough: the session goes on\n            user_sessions[-1][2] += 1\n        else:\n            user_sessions.append([t, t, 1])     # a long silence: a new session starts\n    return out\n\nclicks = [(5, \"ana\"), (12, \"ben\"), (40, \"ana\"), (61, \"ana\"), (95, \"ben\"), (130, \"ana\"), (170, \"ana\"), (178, \"ben\")]\nfor user, found in sessions(clicks, 45).items():\n    print(f\"{user}:\", \", \".join(f\"{s}-{e} ({n} clicks)\" for s, e, n in found))\n","out":"ana: 5-61 (3 clicks), 130-170 (2 clicks)\nben: 12-12 (1 clicks), 95-95 (1 clicks), 178-178 (1 clicks)\n"},{"lang":"javascript","src":"function sessions(events, gap) {\n  const out = new Map();\n  for (const [t, user] of [...events].sort((a, b) => (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[0] - b[0]))) {   // by user, then by time\n    if (!out.has(user)) out.set(user, []);\n    const userSessions = out.get(user);\n    const last = userSessions.at(-1);\n    if (last && t - last[1] <= gap) { last[1] = t; last[2]++; }   // close enough: the session goes on\n    else userSessions.push([t, t, 1]);         // a long silence: a new session starts\n  }\n  return out;\n}\n\nconst clicks = [[5, \"ana\"], [12, \"ben\"], [40, \"ana\"], [61, \"ana\"], [95, \"ben\"], [130, \"ana\"], [170, \"ana\"], [178, \"ben\"]];\nfor (const [user, found] of sessions(clicks, 45)) {\n  console.log(`${user}:`, found.map(([s, e, n]) => `${s}-${e} (${n} clicks)`).join(\", \"));\n}\n","out":"ana: 5-61 (3 clicks), 130-170 (2 clicks)\nben: 12-12 (1 clicks), 95-95 (1 clicks), 178-178 (1 clicks)\n"}]}},"traps":[["“Window by processing time; it's simpler.”","Results then depend on network delays and outages: a backlog after an outage piles into the minute it's processed. Window by event time, and use processing time only where arrival time really is the question."],["“A watermark guarantees no older events will come.”","It's an estimate. Decide what happens to events behind it: drop them and count them, send them to a side output, or update results already emitted, and make downstream consumers handle updates."],["“Exactly-once processing means my emails are sent exactly once.”","Checkpoints make state and transactional or idempotent sinks exact. A side effect outside them, such as an email or an API call, can still repeat after a replay unless it carries an idempotency key."],["“Lambda is the safe choice because the batch layer fixes everything.”","It doubles the logic and the bugs: two codebases computing the same metric drift, and their results disagree. With a replayable log, one streaming job that can reprocess (Kappa) is usually simpler."],["“Checkpoint as rarely as possible to save overhead.”","Rarely checkpointed jobs replay a lot after every failure, and transactional sinks hold their output longer. Choose the interval from the recovery time you can accept."],["“State grows; we'll just add memory.”","Windows and sessions keep state per key until the watermark passes them; unbounded keys or no allowed-lateness limit means unbounded state. Bound lateness, expire state with TTLs, and keep large state in RocksDB with incremental checkpoints."]],"disc":[["A fraud-detection team wants alerts within 2 seconds and accurate daily reports. Lambda or Kappa?","Kappa, if the events are in a replayable log: one stream job computes features and alerts in real time, and the daily report is a window over the same stream, or a batch query on the job's output. Reprocessing after a model change means replaying the log through the new job. Lambda only earns its second codebase if the daily report needs heavy batch computations that the streaming engine can't do."],["How would you choose the allowed lateness for a per-minute ride count?","Measure the delay distribution: if 99.9% of events arrive within 20 seconds, allow 30, so results come out about half a minute after each minute ends. Send later events to a side output and either update the stored count or reconcile in a nightly batch, and alert if the late fraction suddenly grows, since that usually means a broken client or a network problem."]],"teach":{"prompt":"Explain to a junior colleague why stream processors use event time and watermarks, and how they give exactly-once results despite crashes.","rubric":["Event time versus processing time, and why disorder breaks processing-time results","Tumbling, sliding and session windows","Watermarks with allowed lateness: the latency and completeness trade-off; late-data policies","Checkpoints of state with input offsets, and replay after a crash","Idempotent or transactional sinks; Lambda versus Kappa"],"model":"Events carry the time they happened, but they reach us late and out of order, so we group them into windows by event time: tumbling for per-minute counts, sliding for rolling totals, sessions for user visits. Because we never know that every event has arrived, the processor keeps a watermark, roughly the newest event time minus an allowed lateness, and emits a window's result once the watermark passes its end; later events are dropped, sent aside, or used to update the result. Waiting longer means more complete results, but later ones. For exactly-once results, the processor checkpoints every operator's state together with the input offsets; after a crash it restores the checkpoint and replays from there, and the sinks are idempotent upserts or transactions committed with each checkpoint. With a replayable log, one streaming job can also reprocess history, which is the Kappa architecture."},"qa":[["Event time or processing time: which should windows use?","Event time, so results don't depend on delays."],["Tumbling or sliding window?","Tumbling windows are back to back and don't overlap; sliding windows overlap, so each event counts in several."],["What is a watermark?","The processor's estimate that no events older than a given time are still coming."],["What does allowed lateness trade?","Completeness against latency: waiting longer catches more late events but emits results later."],["What goes into a stream-processing checkpoint?","Every operator's state together with the input offsets."],["Kappa's way to reprocess?","Replay the log from the start through a new version of the streaming job."]],"quiz":[{"q":"What does this print?","snip":{"t":"Tumbling window starts","tabs":[{"lang":"python","src":"print(*(t - t % 60 for t in (59, 60, 61, 125)))\n"},{"lang":"javascript","src":"console.log(...[59, 60, 61, 125].map(t => t - (t % 60)));\n"}]},"o":["0 60 60 120","60 60 60 120","0 0 60 120","59 60 61 125"],"a":0,"e":"Each time is rounded down to a multiple of 60: 59 is in the window starting at 0, 60 and 61 in the one starting at 60, and 125 in the one starting at 120."},{"q":"What does this print?","snip":{"t":"A watermark with 30 seconds of allowed lateness","tabs":[{"lang":"python","src":"newest, lateness = 0, 30\nfor event_time in (100, 130, 120, 170):\n    newest = max(newest, event_time)\nwatermark = newest - lateness\nprint(watermark, \"window [60, 120) is final\" if watermark >= 120 else \"window [60, 120) is still open\")\n"},{"lang":"javascript","src":"let newest = 0;\nconst lateness = 30;\nfor (const eventTime of [100, 130, 120, 170]) newest = Math.max(newest, eventTime);\nconst watermark = newest - lateness;\nconsole.log(watermark, watermark >= 120 ? \"window [60, 120) is final\" : \"window [60, 120) is still open\");\n"}]},"o":["140 window [60, 120) is final","140 window [60, 120) is still open","90 window [60, 120) is still open","170 window [60, 120) is final"],"a":0,"e":"The watermark follows the newest event time seen, 170, minus 30 seconds of lateness: 140, which is past the window's end at 120, so its result can be emitted."},{"q":"What is the main cost of the Lambda architecture?","o":["The same logic implemented twice, for batch and for streaming, which must be kept in step","It can't reprocess history","It has no low-latency path","It needs exactly-once sinks"],"a":0,"e":"Lambda reprocesses with its batch layer and serves recent data from its speed layer; the price is two codebases whose results drift apart."},{"q":"In a Kappa architecture, how do you fix a bug in last month's results?","o":["Run a corrected version of the streaming job from the start of the retained log, then switch readers to its output","Run a separate batch job over a data warehouse","Edit the results by hand","Delete the topic and start again"],"a":0,"e":"Kappa keeps one codebase: reprocessing is the same job replaying the log, which is why the log must be retained long enough."},{"q":"What does exactly-once processing in a stream processor rely on? (choose 3)","t":"ms","o":["Checkpoints that save operator state together with the input offsets","A source that can replay from those offsets","Idempotent or transactional sinks","Processing-time windows","Dropping every late event"],"a":[0,1,2],"e":"State, input position and output must all move together: restore the state, rewind the input, and make the outputs either overwrite themselves or commit with the checkpoint. Window type and late-data policy are separate choices."},{"q":"Judge each statement.","t":"yn","s":[["Event time is when the event happened; processing time is when the system sees it.",true],["With 1-minute tumbling windows, each event is counted in exactly one window.",true],["A watermark guarantees that no older event will ever arrive.",false],["A 10-minute window sliding every minute counts each event in 10 windows.",true]],"e":"A watermark is only an estimate, so late data needs a policy. A sliding window of size 10 and slide 1 covers each moment ten times."},{"q":"Put a checkpointed stream job's failure and recovery in order.","t":"ord","items":["Each operator snapshots its state when the checkpoint barrier reaches it","The checkpoint completes once every operator has snapshotted","A worker crashes","Every operator restores the last completed checkpoint, and the sources rewind to its offsets","The events since that checkpoint are processed again"],"e":"Only a completed checkpoint is restored, which is why state and input positions always match after recovery."},{"q":"Complete the Python function that lists the sliding windows (size and slide in seconds) that contain time t.","t":"drop","lang":"python","code":"def windows_for(t, size, slide):\n    first = (t - size) // slide * slide + {{0}}\n    return list(range(max(0, first), t + 1, {{1}}))\n","blanks":[{"o":["slide","size","0","1"],"a":0},{"o":["slide","size","1","t"],"a":0}],"e":"Rounding t − size down to the slide and adding one slide gives the earliest start that still covers t; from there, windows start every slide up to t."}],"probs":[["Reading · Questioning the Lambda Architecture","https://www.oreilly.com/radar/questioning-the-lambda-architecture/","","summarise Kreps's argument, then name one case where a separate batch layer still earns its keep"],["Reading · The Dataflow Model (VLDB 2015)","https://www.vldb.org/pvldb/vol8/p1792-Akidau.pdf","","explain windows, triggers and watermarks in the paper's terms, and map them onto this module's code"],["Reference · Flink: Timely stream processing","https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/","","find how Flink generates watermarks from sources, and what idle sources do to them"],["Reference · Flink: Stateful stream processing","https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/","","draw how checkpoint barriers align across two inputs, and what unaligned checkpoints change"]],"src":[["Jay Kreps: Questioning the Lambda Architecture (O'Reilly, 2014)","https:
