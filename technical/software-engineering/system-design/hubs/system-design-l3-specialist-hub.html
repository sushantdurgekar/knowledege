//www.oreilly.com/radar/questioning-the-lambda-architecture/"],["Akidau et al.: The Dataflow Model (VLDB 2015)","https://www.vldb.org/pvldb/vol8/p1792-Akidau.pdf"],["Apache Flink docs: Timely stream processing","https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"],["Apache Flink docs: Stateful stream processing","https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/"]]},{"id":"m04","d":"d2","t":"Consensus and coordination: Raft, fencing tokens and logical clocks","min":120,"hook":"Servers often have to agree on one thing, such as who leads, which write came first, or who holds a lock, while messages get lost and machines pause. Raft gets a majority of servers to agree on one ordered log, so the cluster survives a minority of failures. Locks also need fencing tokens, because a paused holder can wake up still believing it holds the lock. And because wall clocks drift, ordering events across machines takes logical clocks: Lamport, vector or hybrid.","pre":{"q":"A worker takes a lock with a 10-second lease, then stops for 15 seconds in a garbage-collection pause. The lease runs out and a second worker takes the lock. When the first worker wakes up, it writes to the shared file. What went wrong, and what would stop that write?","a":"Both workers believed they held the lock, and a lease can't stop a paused process from acting afterwards. The fix is a fencing token: the lock service hands out a larger number with every grant, each write carries it, and the file's storage rejects any token lower than one it has already seen."},"kid":{"t":"Luigi's recipe book committee","x":"Luigi's five branch managers keep the same recipe book. A change is official once three of the five have written it down, so the book survives two managers being away. One manager chairs; if the chair goes quiet, each manager waits a different, random while before asking for votes, so usually one asks first and wins. Each manager votes only once per election. The storeroom key comes with a numbered ticket, and the storeroom refuses any ticket lower than the last it saw, in case an old holder wanders back. And since every branch's clock is a bit off, notes are numbered by a counter that each manager bumps past any number they've heard.","map":[["Three of five managers writing a change down","A majority quorum: an entry is committed once most servers store it, so 2f+1 servers survive f failures"],["Random waits before asking for votes, one vote each","Leader election: randomized election timeouts, and one vote per server per term"],["The numbered storeroom ticket","A fencing token: the resource rejects requests from an older lock holder"],["Notes numbered by a counter, not the clock","Logical clocks: Lamport timestamps follow cause and effect even when wall clocks disagree"]],"brk":"Luigi's managers are honest. Raft and its relatives assume servers crash or go quiet, but never lie. Tolerating servers that lie (Byzantine faults) takes more servers, more messages and different algorithms."},"keys":["**Consensus**: getting servers to agree on a value, or on an ordered log of values, despite crashes and lost messages. A cluster of 2f+1 servers tolerates f failures, because any two majorities share at least one server. It underpins leader election, configuration, locks and replicated state machines: etcd, ZooKeeper, Consul and Kafka's KRaft all run on it.","**Raft terms and elections**: each server is a follower, a candidate or the leader. Time is divided into numbered terms with at most one leader each. A follower that hears no heartbeat within its election timeout, randomized between roughly 150 and 300 ms, becomes a candidate: it increments the term, votes for itself and asks the others. Each server grants one vote per term, so at most one candidate can win a majority.","**Log replication**: the leader appends each command to its log and sends it to the followers in AppendEntries messages, which name the previous entry's index and term; a follower accepts only if it has that entry, so accepted logs agree up to it. An entry from the current term is committed once a majority stores it, and every server applies committed entries in order.","**Election safety**: servers refuse to vote for a candidate whose log is less up to date than their own (compare the last entry's term, then the log's length). Any majority contains a server with every committed entry, so a new leader has them all. A leader commits older-term entries only indirectly, by committing an entry from its own term.","**Limits**: in a fully asynchronous network, no algorithm can guarantee to reach agreement if even one server may crash (the FLP result). Raft is always safe and makes progress whenever the network behaves long enough for an election to finish. A minority partition can't commit anything: consensus chooses consistency over availability.","**Reads from the leader**: a leader cut off by a partition may not know it has been replaced. For linearizable reads it either sends the read through the log, confirms with a round of heartbeats that it still leads (ReadIndex), or relies on a lease that is only safe if clock drift is bounded.","**Locks and fencing tokens**: a lease can run out while its holder is paused by garbage collection, a VM migration or a slow network, and the holder can't notice. The lock service returns a larger fencing token with each grant (an etcd revision, a ZooKeeper zxid), and the protected resource rejects tokens lower than the highest it has seen. A lock that only saves duplicate work can be a simple lease; a lock that protects correctness needs consensus and fencing.","**Clocks**: machine clocks drift, and NTP corrections can step them backwards, so timestamps from different machines can't reliably order events; last-write-wins with skewed clocks silently drops writes. Lamport clocks give an order consistent with causality, vector clocks also detect concurrent events, and hybrid logical clocks (HLC) stay close to wall time while respecting causality. Spanner instead bounds clock uncertainty with TrueTime and waits it out."],"dia":[{"type":"seq","cap":"A Raft election after the leader crashes","actors":["S2","S3","S4"],"msgs":[["S3","S2","RequestVote, term 6 (S3's timer ran out first)"],["S3","S4","RequestVote, term 6"],["S2","S3","vote granted for term 6",true],["S4","S3","vote granted for term 6",true],["S3","S2","AppendEntries heartbeat: S3 leads term 6"]],"note":"S3 has three votes, its own included: a majority of five, even with S1 down and S5 slow. Each server votes once per term, so no other candidate can also win term 6."},{"type":"flow","cap":"Replicating one entry","steps":[["Client","sends a command to the leader"],["Leader appends","writes it to its own log at index 8, term 6"],["AppendEntries","to every follower, naming the previous entry's index and term"],["Majority stored","3 of 5 servers have it: the entry is committed"],["Apply and reply","the leader applies it and answers; followers apply it once they learn the new commit index"]],"note":"Every server applies the same committed commands in the same order, so their state machines stay identical."},{"type":"seq","cap":"A fencing token stops a paused lock holder","actors":["Client 1","Lock service","Client 2","Storage"],"msgs":[["Client 1","Lock service","acquire"],["Lock service","Client 1","lease granted, token 33",true],["Client 2","Lock service","acquire, after client 1's lease ran out during its pause"],["Lock service","Client 2","lease granted, token 34",true],["Client 2","Storage","write with token 34: accepted"],["Client 1","Storage","write with token 33, after the pause: rejected, 33 < 34"]],"note":"The paused client can't tell that its lease ran out, but the storage can: it remembers the highest token it has accepted."}],"cmp":[{"cap":"Lamport, vector and hybrid logical clocks","head":["","Lamport clock","Vector clock","Hybrid logical clock"],"rows":[["Timestamp","One counter","One counter per node","Physical time plus a small counter"],["If a happened before b","L(a) < L(b)","V(a) < V(b)","H(a) < H(b)"],["Detects concurrent events","No","Yes: neither vector is ≤ the other","No"],["Close to wall-clock time","No","No","Yes, within the clock skew"],["Used by","Total-order broadcast, tie-breaking","Dynamo-style conflict detection (Riak)","CockroachDB, MongoDB, YugabyteDB"]]},{"cap":"A lock for efficiency or for correctness","head":["","For efficiency","For correctness"],"rows":[["If two clients hold it at once","Some duplicate work, such as a report emailed twice","Corrupted data, such as a lost update"],["Good enough","A lease in Redis or a database row","A consensus-backed service such as etcd or ZooKeeper"],["Also needs","Idempotent work where possible","Fencing tokens checked by the protected resource"]]}],"code":[{"t":"The seeded random generator used by the election simulation","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Why Raft randomizes election timeouts","tabs":[{"lang":"python","src":"rand = mulberry32(7)\n\ndef elect(randomized):\n    nodes = [{\"term\": 1, \"voted\": None, \"votes\": set(), \"state\": \"follower\"} for _ in range(5)]\n    timeout = (lambda: 150 + int(rand() * 150)) if randomized else (lambda: 150)\n    deadline = [None] + [int(rand() * 5) + timeout() for _ in range(4)]   # node 0, the old leader, has crashed\n    inbox, elections = [], 0\n    for now in range(5000):\n        for _, kind, term, sender, to in [m for m in inbox if m[0] == now]:   # this millisecond's messages\n            node = nodes[to]\n            if term > node[\"term\"]:\n                node.update(term=term, voted=None, state=\"follower\")   # a newer term: step down\n            if kind == \"vote?\" and term == node[\"term\"] and node[\"voted\"] in (None, sender):\n                node[\"voted\"] = sender                         # one vote per term\n                deadline[to] = now + timeout()                 # granting a vote resets the timer\n                inbox.append((now + 2 + int(rand() * 8), \"yes\", term, to, sender))\n            elif kind == \"yes\" and term == node[\"term\"] and node[\"state\"] == \"candidate\":\n                node[\"votes\"].add(sender)\n                if len(node[\"votes\"]) >= 3:                     # a majority of all five\n                    return now, elections\n        inbox = [m for m in inbox if m[0] > now]\n        for i in range(1, 5):\n            if deadline[i] == now:                             # no heartbeat in time: stand for election\n                node = nodes[i]\n                node.update(term=node[\"term\"] + 1, voted=i, votes={i}, state=\"candidate\")\n                elections += 1\n                deadline[i] = now + timeout()\n                for j in range(1, 5):\n                    if j != i:\n                        inbox.append((now + 2 + int(rand() * 8), \"vote?\", node[\"term\"], i, j))\n    return None, elections\n\nfor randomized in (False, True):\n    times, elections = [], 0\n    for _ in range(200):\n        took, started = elect(randomized)\n        elections += started\n        if took is not None:\n            times.append(took)\n    label = \"random 150-299 ms timeouts\" if randomized else \"fixed 150 ms timeouts\"\n    per_trial = elections * 10 // 200\n    print(f\"{label}: a leader within 5 s in {len(times)} of 200 trials, after about {sum(times) // len(times)} ms;\",\n          f\"{per_trial // 10}.{per_trial % 10} elections per trial\")\n","out":"fixed 150 ms timeouts: a leader within 5 s in 100 of 200 trials, after about 1730 ms; 82.2 elections per trial\nrandom 150-299 ms timeouts: a leader within 5 s in 200 of 200 trials, after about 202 ms; 1.2 elections per trial\n","notes":[[6,"With fixed timeouts, the four survivors time out within a few milliseconds of each other, because only network jitter separates them."],[14,"Each server votes at most once per term, for the first candidate that asks: this is what makes two leaders in one term impossible."],[19,"Three votes out of five servers, counting the candidate's own: still a majority with the old leader dead."],[25,"A candidate whose election fails just waits for its timer again, and starts a new term."],[42,"Fixed timeouts give split votes again and again, often for longer than 5 seconds; random ones elect a leader in about one try."]]},{"lang":"javascript","src":"const rand = mulberry32(7);\n\nfunction elect(randomized) {\n  const nodes = Array.from({ length: 5 }, () => ({ term: 1, voted: null, votes: new Set(), state: \"follower\" }));\n  const timeout = randomized ? () => 150 + Math.floor(rand() * 150) : () => 150;\n  const deadline = [null];                                   // node 0, the old leader, has crashed\n  for (let i = 1; i < 5; i++) deadline.push(Math.floor(rand() * 5) + timeout());\n  let inbox = [], elections = 0;\n  for (let now = 0; now < 5000; now++) {\n    for (const [, kind, term, sender, to] of inbox.filter(m => m[0] === now)) {   // this millisecond's messages\n      const node = nodes[to];\n      if (term > node.term) Object.assign(node, { term, voted: null, state: \"follower\" });   // a newer term: step down\n      if (kind === \"vote?\" && term === node.term && (node.voted === null || node.voted === sender)) {\n        node.voted = sender;                                 // one vote per term\n        deadline[to] = now + timeout();                      // granting a vote resets the timer\n        inbox.push([now + 2 + Math.floor(rand() * 8), \"yes\", term, to, sender]);\n      } else if (kind === \"yes\" && term === node.term && node.state === \"candidate\") {\n        node.votes.add(sender);\n        if (node.votes.size >= 3) return [now, elections];   // a majority of all five\n      }\n    }\n    inbox = inbox.filter(m => m[0] > now);\n    for (let i = 1; i < 5; i++) {\n      if (deadline[i] === now) {                             // no heartbeat in time: stand for election\n        const node = nodes[i];\n        Object.assign(node, { term: node.term + 1, voted: i, votes: new Set([i]), state: \"candidate\" });\n        elections++;\n        deadline[i] = now + timeout();\n        for (let j = 1; j < 5; j++) if (j !== i) inbox.push([now + 2 + Math.floor(rand() * 8), \"vote?\", node.term, i, j]);\n      }\n    }\n  }\n  return [null, elections];\n}\n\nfor (const randomized of [false, true]) {\n  const times = [];\n  let elections = 0;\n  for (let trial = 0; trial < 200; trial++) {\n    const [took, started] = elect(randomized);\n    elections += started;\n    if (took !== null) times.push(took);\n  }\n  const label = randomized ? \"random 150-299 ms timeouts\" : \"fixed 150 ms timeouts\";\n  const perTrial = Math.floor(elections * 10 / 200);\n  console.log(`${label}: a leader within 5 s in ${times.length} of 200 trials, after about ${Math.floor(times.reduce((a, b) => a + b, 0) / times.length)} ms;`,\n    `${Math.floor(perTrial / 10)}.${perTrial % 10} elections per trial`);\n}\n","out":"fixed 150 ms timeouts: a leader within 5 s in 100 of 200 trials, after about 1730 ms; 82.2 elections per trial\nrandom 150-299 ms timeouts: a leader within 5 s in 200 of 200 trials, after about 202 ms; 1.2 elections per trial\n","notes":[[7,"With fixed timeouts, the four survivors time out within a few milliseconds of each other, because only network jitter separates them."],[14,"Each server votes at most once per term, for the first candidate that asks: this is what makes two leaders in one term impossible."],[19,"Three votes out of five servers, counting the candidate's own: still a majority with the old leader dead."],[26,"A candidate whose election fails just waits for its timer again, and starts a new term."],[46,"Fixed timeouts give split votes again and again, often for longer than 5 seconds; random ones elect a leader in about one try."]]}]},{"t":"Lamport and vector clocks on three replicas","tabs":[{"lang":"python","src":"class Process:\n    def __init__(self, name, index, n=3):\n        self.name, self.index = name, index\n        self.lamport, self.vector = 0, [0] * n\n\n    def tick(self, what):\n        self.lamport += 1                              # every event moves both clocks on\n        self.vector[self.index] += 1\n        return (f\"{self.name}: {what}\", self.lamport, list(self.vector))\n\n    def send(self, what):\n        event = self.tick(what)\n        return event, (self.lamport, list(self.vector))   # the message carries both clocks\n\n    def receive(self, message, what):\n        lamport, vector = message\n        self.lamport = max(self.lamport, lamport)      # catch up with the sender, then tick\n        self.vector = [max(mine, theirs) for mine, theirs in zip(self.vector, vector)]\n        return self.tick(what)\n\na, b, c = Process(\"A\", 0), Process(\"B\", 1), Process(\"C\", 2)\nevents = {}\nevents[\"a1\"] = a.tick(\"price = 10\")\nevents[\"a2\"], to_b = a.send(\"send to B\")\nevents[\"c1\"] = c.tick(\"price = 11\")\nevents[\"b1\"] = b.receive(to_b, \"receive from A\")\nevents[\"b2\"] = b.tick(\"price = 12\")\nevents[\"b3\"], to_c = b.send(\"send to C\")\nevents[\"c2\"] = c.receive(to_c, \"receive from B\")\nfor key, (label, lamport, vector) in events.items():\n    print(f\"{key} {label:<20} lamport {lamport}  vector {','.join(map(str, vector))}\")\n\ndef before(v, w):                                       # every entry <= and not equal\n    return all(x <= y for x, y in zip(v, w)) and v != w\n\nfor e, f in ((\"a1\", \"b2\"), (\"c1\", \"b2\"), (\"a1\", \"c1\")):\n    v, w = events[e][2], events[f][2]\n    relation = \"happened before\" if before(v, w) else \"happened after\" if before(w, v) else \"is concurrent with\"\n    print(f\"{e} {relation} {f} (lamport {events[e][1]} and {events[f][1]})\")\n","out":"a1 A: price = 10        lamport 1  vector 1,0,0\na2 A: send to B         lamport 2  vector 2,0,0\nc1 C: price = 11        lamport 1  vector 0,0,1\nb1 B: receive from A    lamport 3  vector 2,1,0\nb2 B: price = 12        lamport 4  vector 2,2,0\nb3 B: send to C         lamport 5  vector 2,3,0\nc2 C: receive from B    lamport 6  vector 2,3,2\na1 happened before b2 (lamport 1 and 4)\nc1 is concurrent with b2 (lamport 1 and 4)\na1 is concurrent with c1 (lamport 1 and 1)\n","notes":[[8,"Each process counts its own events in its own slot of the vector; the Lamport clock is a single counter."],[17,"On receipt, jump past the sender's Lamport time and take the element-wise maximum of the vectors: the receiver now knows everything the sender knew."],[33,"One event happened before another only if its vector is less than or equal in every slot and not identical."],[39,"Lamport says c1 (1) comes before b2 (4), but neither could have caused the other: only the vectors reveal that the two price writes conflict."]]},{"lang":"javascript","src":"class Process {\n  constructor(name, index, n = 3) {\n    this.name = name; this.index = index;\n    this.lamport = 0; this.vector = new Array(n).fill(0);\n  }\n\n  tick(what) {\n    this.lamport++;                                  // every event moves both clocks on\n    this.vector[this.index]++;\n    return [`${this.name}: ${what}`, this.lamport, [...this.vector]];\n  }\n\n  send(what) {\n    const event = this.tick(what);\n    return [event, [this.lamport, [...this.vector]]];   // the message carries both clocks\n  }\n\n  receive([lamport, vector], what) {\n    this.lamport = Math.max(this.lamport, lamport);  // catch up with the sender, then tick\n    this.vector = this.vector.map((mine, i) => Math.max(mine, vector[i]));\n    return this.tick(what);\n  }\n}\n\nconst a = new Process(\"A\", 0), b = new Process(\"B\", 1), c = new Process(\"C\", 2);\nconst events = {};\nevents.a1 = a.tick(\"price = 10\");\nconst [a2, toB] = a.send(\"send to B\"); events.a2 = a2;\nevents.c1 = c.tick(\"price = 11\");\nevents.b1 = b.receive(toB, \"receive from A\");\nevents.b2 = b.tick(\"price = 12\");\nconst [b3, toC] = b.send(\"send to C\"); events.b3 = b3;\nevents.c2 = c.receive(toC, \"receive from B\");\nfor (const [key, [label, lamport, vector]] of Object.entries(events)) {\n  console.log(`${key} ${label.padEnd(20)} lamport ${lamport}  vector ${vector.join(\",\")}`);\n}\n\nconst before = (v, w) => v.every((x, i) => x <= w[i]) && v.some((x, i) => x !== w[i]);   // every entry <= and not equal\n\nfor (const [e, f] of [[\"a1\", \"b2\"], [\"c1\", \"b2\"], [\"a1\", \"c1\"]]) {\n  const v = events[e][2], w = events[f][2];\n  const relation = before(v, w) ? \"happened before\" : before(w, v) ? \"happened after\" : \"is concurrent with\";\n  console.log(`${e} ${relation} ${f} (lamport ${events[e][1]} and ${events[f][1]})`);\n}\n","out":"a1 A: price = 10        lamport 1  vector 1,0,0\na2 A: send to B         lamport 2  vector 2,0,0\nc1 C: price = 11        lamport 1  vector 0,0,1\nb1 B: receive from A    lamport 3  vector 2,1,0\nb2 B: price = 12        lamport 4  vector 2,2,0\nb3 B: send to C         lamport 5  vector 2,3,0\nc2 C: receive from B    lamport 6  vector 2,3,2\na1 happened before b2 (lamport 1 and 4)\nc1 is concurrent with b2 (lamport 1 and 4)\na1 is concurrent with c1 (lamport 1 and 1)\n","notes":[[9,"Each process counts its own events in its own slot of the vector; the Lamport clock is a single counter."],[19,"On receipt, jump past the sender's Lamport time and take the element-wise maximum of the vectors: the receiver now knows everything the sender knew."],[38,"One event happened before another only if its vector is less than or equal in every slot and not identical."],[43,"Lamport says c1 (1) comes before b2 (4), but neither could have caused the other: only the vectors reveal that the two price writes conflict."]]}]},{"t":"A lease alone, then fencing tokens","tabs":[{"lang":"python","src":"class LockService:\n    def __init__(self, lease):\n        self.lease, self.expires, self.token = lease, 0, 0\n\n    def acquire(self, now):\n        if now < self.expires:\n            return None                                # someone else's lease is still running\n        self.expires = now + self.lease\n        self.token += 1                                # every grant gets a larger token\n        return self.token\n\nclass Storage:\n    def __init__(self, fencing):\n        self.fencing, self.highest, self.value = fencing, 0, None\n\n    def write(self, value, token):\n        if self.fencing and token < self.highest:\n            return f\"rejected (token {token} < {self.highest})\"\n        self.highest = max(self.highest, token)\n        self.value = value\n        return \"accepted\"\n\nfor fencing in (False, True):\n    locks, storage = LockService(lease=10), Storage(fencing)\n    print(\"with fencing tokens:\" if fencing else \"without fencing:\")\n    first = locks.acquire(now=0)\n    print(f\"  t=0  client-1 gets token {first} and writes: {storage.write('part 1 by client-1', first)}\")\n    # client-1 now stops for 15 s in a garbage-collection pause; its lease ends at t=10\n    second = locks.acquire(now=12)\n    print(f\"  t=12 client-2 gets token {second} and writes: {storage.write('report by client-2', second)}\")\n    print(f\"  t=15 client-1 wakes up and writes: {storage.write('part 2 by client-1', first)}\")\n    print(f\"  stored: {storage.value}\")\n","out":"without fencing:\n  t=0  client-1 gets token 1 and writes: accepted\n  t=12 client-2 gets token 2 and writes: accepted\n  t=15 client-1 wakes up and writes: accepted\n  stored: part 2 by client-1\nwith fencing tokens:\n  t=0  client-1 gets token 1 and writes: accepted\n  t=12 client-2 gets token 2 and writes: accepted\n  t=15 client-1 wakes up and writes: rejected (token 1 < 2)\n  stored: report by client-2\n","notes":[[9,"The token only ever grows; in etcd it's the key's revision, in ZooKeeper the zxid."],[17,"The check happens at the resource, where the write lands; only there can a stale holder be stopped."],[28,"Client-1 still believes it holds the lock: nothing inside a paused process can notice that its lease ran out."],[31,"Without fencing, the stale write silently replaces client-2's report; with fencing it's rejected."]]},{"lang":"javascript","src":"class LockService {\n  constructor(lease) { this.lease = lease; this.expires = 0; this.token = 0; }\n\n  acquire(now) {\n    if (now < this.expires) return null;             // someone else's lease is still running\n    this.expires = now + this.lease;\n    return ++this.token;                             // every grant gets a larger token\n  }\n}\n\nclass Storage {\n  constructor(fencing) { this.fencing = fencing; this.highest = 0; this.value = null; }\n\n  write(value, token) {\n    if (this.fencing && token < this.highest) return `rejected (token ${token} < ${this.highest})`;\n    this.highest = Math.max(this.highest, token);\n    this.value = value;\n    return \"accepted\";\n  }\n}\n\nfor (const fencing of [false, true]) {\n  const locks = new LockService(10), storage = new Storage(fencing);\n  console.log(fencing ? \"with fencing tokens:\" : \"without fencing:\");\n  const first = locks.acquire(0);\n  console.log(`  t=0  client-1 gets token ${first} and writes: ${storage.write(\"part 1 by client-1\", first)}`);\n  // client-1 now stops for 15 s in a garbage-collection pause; its lease ends at t=10\n  const second = locks.acquire(12);\n  console.log(`  t=12 client-2 gets token ${second} and writes: ${storage.write(\"report by client-2\", second)}`);\n  console.log(`  t=15 client-1 wakes up and writes: ${storage.write(\"part 2 by client-1\", first)}`);\n  console.log(`  stored: ${storage.value}`);\n}\n","out":"without fencing:\n  t=0  client-1 gets token 1 and writes: accepted\n  t=12 client-2 gets token 2 and writes: accepted\n  t=15 client-1 wakes up and writes: accepted\n  stored: part 2 by client-1\nwith fencing tokens:\n  t=0  client-1 gets token 1 and writes: accepted\n  t=12 client-2 gets token 2 and writes: accepted\n  t=15 client-1 wakes up and writes: rejected (token 1 < 2)\n  stored: report by client-2\n","notes":[[7,"The token only ever grows; in etcd it's the key's revision, in ZooKeeper the zxid."],[15,"The check happens at the resource, where the write lands; only there can a stale holder be stopped."],[27,"Client-1 still believes it holds the lock: nothing inside a paused process can notice that its lease ran out."],[30,"Without fencing, the stale write silently replaces client-2's report; with fencing it's rejected."]]}]}],"ex":{"q":"Server S1 has just become leader for term 5. Its log holds entries from terms 1 1 2 4 4 5 5, and it knows entries up to index 5 are committed. The followers' logs are S2: 1 1 2 4 4 5; S3: 1 1 2; S4: 1 1 2 3 3 3, written by a term-3 leader that never replicated them; and S5: 1 1 2 4 4. Simulate AppendEntries rounds with Raft's consistency check, and say when index 7 is committed.","steps":["Each AppendEntries names the entry just before the new ones, by index and term. A follower accepts only if its own log has that entry, so a follower that accepts agrees with the leader on everything up to it: Raft's Log Matching property.","The leader starts optimistic, with each follower's nextIndex just past its own log. Each refusal moves that follower's nextIndex back by one, until the logs agree; then the follower deletes from the first conflicting entry onwards and appends the leader's entries.","The leader commits index N once a majority stores it and entry N is from the current term; everything before N is committed with it. Counting replicas of an older term's entry isn't enough, because a later leader could still overwrite it.","Cost: one round trip per entry of disagreement. Real implementations reply with the conflicting term and its first index, so the leader can skip back a whole term at a time."],"code":{"t":"AppendEntries with the consistency check, and the commit rule","tabs":[{"lang":"python","src":"def append_entries(log, prev_index, prev_term, entries):\n    if prev_index > len(log) or (prev_index > 0 and log[prev_index - 1] != prev_term):\n        return False                           # no matching entry at prev_index: refuse\n    for i, entry_term in enumerate(entries, start=prev_index):\n        if i < len(log) and log[i] != entry_term:\n            del log[i:]                        # the first conflict: drop it and everything after\n        if i >= len(log):\n            log.append(entry_term)\n    return True\n\ndef commit_index(match, log, term):\n    for n in range(len(log), 0, -1):\n        if sum(m >= n for m in match) * 2 > len(match) and log[n - 1] == term:\n            return n                           # stored on a majority, and from the current term\n    return 0\n\ndef replicate(leader, term, commit, followers):\n    next_index = {name: len(leader) + 1 for name in followers}   # start optimistic\n    match = {name: 0 for name in followers}\n    lines = []\n    while any(m < len(leader) for m in match.values()):\n        results = []\n        for name, log in followers.items():\n            if match[name] == len(leader):\n                continue\n            prev = next_index[name] - 1\n            if append_entries(log, prev, leader[prev - 1] if prev else 0, leader[prev:]):\n                match[name], next_index[name] = len(leader), len(leader) + 1\n                results.append(f\"{name} ok\")\n            else:\n                next_index[name] -= 1          # refused: back up one entry and try again\n                results.append(f\"{name} no\")\n        commit = max(commit, commit_index([len(leader)] + list(match.values()), leader, term))\n        lines.append(f\"round {len(lines) + 1}: {', '.join(results)} | commit index {commit}\")\n    return lines, commit\n\nfollowers = {\"S2\": [1, 1, 2, 4, 4, 5], \"S3\": [1, 1, 2], \"S4\": [1, 1, 2, 3, 3, 3], \"S5\": [1, 1, 2, 4, 4]}\nlines, commit = replicate([1, 1, 2, 4, 4, 5, 5], term=5, commit=5, followers=followers)\nprint(*lines, sep=\"\\n\")\nprint(\"S4 now:\", *followers[\"S4\"])\n","out":"round 1: S2 no, S3 no, S4 no, S5 no | commit index 5\nround 2: S2 ok, S3 no, S4 no, S5 no | commit index 5\nround 3: S3 no, S4 no, S5 ok | commit index 7\nround 4: S3 no, S4 no | commit index 7\nround 5: S3 ok, S4 ok | commit index 7\nS4 now: 1 1 2 4 4 5 5\n"},{"lang":"javascript","src":"function appendEntries(log, prevIndex, prevTerm, entries) {\n  if (prevIndex > log.length || (prevIndex > 0 && log[prevIndex - 1] !== prevTerm)) return false;   // no matching entry at prevIndex: refuse\n  entries.forEach((entryTerm, k) => {\n    const i = prevIndex + k;\n    if (i < log.length && log[i] !== entryTerm) log.length = i;   // the first conflict: drop it and everything after\n    if (i >= log.length) log.push(entryTerm);\n  });\n  return true;\n}\n\nfunction commitIndex(match, log, term) {\n  for (let n = log.length; n > 0; n--) {\n    if (match.filter(m => m >= n).length * 2 > match.length && log[n - 1] === term) return n;   // stored on a majority, and from the current term\n  }\n  return 0;\n}\n\nfunction replicate(leader, term, commit, followers) {\n  const nextIndex = {}, match = {};\n  for (const name of Object.keys(followers)) { nextIndex[name] = leader.length + 1; match[name] = 0; }   // start optimistic\n  const lines = [];\n  while (Object.values(match).some(m => m < leader.length)) {\n    const results = [];\n    for (const [name, log] of Object.entries(followers)) {\n      if (match[name] === leader.length) continue;\n      const prev = nextIndex[name] - 1;\n      if (appendEntries(log, prev, prev ? leader[prev - 1] : 0, leader.slice(prev))) {\n        match[name] = leader.length; nextIndex[name] = leader.length + 1;\n        results.push(`${name} ok`);\n      } else {\n        nextIndex[name]--;                             // refused: back up one entry and try again\n        results.push(`${name} no`);\n      }\n    }\n    commit = Math.max(commit, commitIndex([leader.length, ...Object.values(match)], leader, term));\n    lines.push(`round ${lines.length + 1}: ${results.join(\", \")} | commit index ${commit}`);\n  }\n  return [lines, commit];\n}\n\nconst followers = { S2: [1, 1, 2, 4, 4, 5], S3: [1, 1, 2], S4: [1, 1, 2, 3, 3, 3], S5: [1, 1, 2, 4, 4] };\nconst [lines, commit] = replicate([1, 1, 2, 4, 4, 5, 5], 5, 5, followers);\nconsole.log(lines.join(\"\\n\"));\nconsole.log(\"S4 now:\", ...followers.S4);\n","out":"round 1: S2 no, S3 no, S4 no, S5 no | commit index 5\nround 2: S2 ok, S3 no, S4 no, S5 no | commit index 5\nround 3: S3 no, S4 no, S5 ok | commit index 7\nround 4: S3 no, S4 no | commit index 7\nround 5: S3 ok, S4 ok | commit index 7\nS4 now: 1 1 2 4 4 5 5\n"}]},"a":"Round 1 is refused everywhere, because no follower has entry 7. In round 2, S2 has entry 6 from term 5 and accepts. In round 3, S5 accepts from index 5. Now S1, S2 and S5 hold index 7, a majority, and entry 7 is from term 5, so the commit index jumps from 5 to 7. S3 and S4 catch up in round 5: S3 was simply behind, while S4's term-3 entries conflicted at index 4, so entries 4 to 6 were deleted and replaced. Those entries were only ever on S4, never on a majority, so they were never committed and it's safe to throw them away."},"fade":{"q":"Finish the hybrid logical clock's `receive(msg_l, msg_c, physical)`: the node's new timestamp (l, c) must come after both its own previous timestamp and the message's, with l as close to physical time as possible.","steps":["An HLC timestamp is a pair (l, c): l is the largest physical time the node has heard of, and c counts events while l stays the same. Pairs compare by l, then by c.",{"ask":"On a receive, what should the new l be?","a":"The largest of the node's own l, the message's l and the local physical clock: it must never go backwards, and never fall behind a timestamp the node has seen."},{"ask":"How is c set?","a":"If the new l equals both the old l and the message's l, c becomes the larger counter plus one. If it equals only the old l, c goes up by one; if only the message's l, it becomes the message's c plus one; if the physical clock is ahead of both, c resets to 0."},{"ask":"Why not just timestamp with the physical clock?","a":"Clocks are skewed: a message from a node whose clock runs fast would arrive 'before' it was sent, breaking cause and effect. HLC stays within the clock skew of physical time yet still orders causally related events."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class HybridClock:\n    def __init__(self):\n        self.l, self.c = 0, 0                  # the largest physical time seen, and a counter\n\n    def now(self, physical):                   # a local event or a send\n        if physical > self.l:\n            self.l, self.c = physical, 0       # the wall clock has moved on: use it\n        else:\n            self.c += 1                        # it hasn't: count instead\n        return (self.l, self.c)\n\n    def receive(self, msg_l, msg_c, physical):\n        ...                                    # TODO: end up after both timestamps, close to physical time\n        return (self.l, self.c)\n"},{"lang":"javascript","src":"class HybridClock {\n  constructor() { this.l = 0; this.c = 0; }       // the largest physical time seen, and a counter\n\n  now(physical) {                                 // a local event or a send\n    if (physical > this.l) { this.l = physical; this.c = 0; }   // the wall clock has moved on: use it\n    else this.c++;                                // it hasn't: count instead\n    return [this.l, this.c];\n  }\n\n  receive(msgL, msgC, physical) {\n    // TODO: end up after both timestamps, close to physical time\n    return [this.l, this.c];\n  }\n}\n"}]},"solution":{"t":"Solution: take the largest l, then set the counter by where it came from","tabs":[{"lang":"python","src":"class HybridClock:\n    def __init__(self):\n        self.l, self.c = 0, 0                  # the largest physical time seen, and a counter\n\n    def now(self, physical):                   # a local event or a send\n        if physical > self.l:\n            self.l, self.c = physical, 0       # the wall clock has moved on: use it\n        else:\n            self.c += 1                        # it hasn't: count instead\n        return (self.l, self.c)\n\n    def receive(self, msg_l, msg_c, physical):\n        l = max(self.l, msg_l, physical)\n        if l == self.l == msg_l:\n            self.c = max(self.c, msg_c) + 1    # both at the same time: count past both\n        elif l == self.l:\n            self.c += 1\n        elif l == msg_l:\n            self.c = msg_c + 1                 # the sender is ahead: adopt its time, count past it\n        else:\n            self.c = 0                         # the local wall clock is ahead of both\n        self.l = l\n        return (self.l, self.c)\n\nshow = lambda stamp: f\"({stamp[0]},{stamp[1]})\"\na, b = HybridClock(), HybridClock()\nsent = a.now(1050)                             # A's clock runs 50 ms fast\ngot = b.receive(*sent, physical=1003)          # B's clock reads 1003 when the message lands\nafter = b.now(1004)\nlater = b.now(1060)\nprint(\"A sends\", show(sent), \"| B receives\", show(got), \"| B's next event\", show(after), \"| B at 1060 ms\", show(later))\n","out":"A sends (1050,0) | B receives (1050,1) | B's next event (1050,2) | B at 1060 ms (1060,0)\n"},{"lang":"javascript","src":"class HybridClock {\n  constructor() { this.l = 0; this.c = 0; }       // the largest physical time seen, and a counter\n\n  now(physical) {                                 // a local event or a send\n    if (physical > this.l) { this.l = physical; this.c = 0; }   // the wall clock has moved on: use it\n    else this.c++;                                // it hasn't: count instead\n    return [this.l, this.c];\n  }\n\n  receive(msgL, msgC, physical) {\n    const l = Math.max(this.l, msgL, physical);\n    if (l === this.l && l === msgL) this.c = Math.max(this.c, msgC) + 1;   // both at the same time: count past both\n    else if (l === this.l) this.c++;\n    else if (l === msgL) this.c = msgC + 1;       // the sender is ahead: adopt its time, count past it\n    else this.c = 0;                              // the local wall clock is ahead of both\n    this.l = l;\n    return [this.l, this.c];\n  }\n}\n\nconst show = ([l, c]) => `(${l},${c})`;\nconst a = new HybridClock(), b = new HybridClock();\nconst sent = a.now(1050);                         // A's clock runs 50 ms fast\nconst got = b.receive(...sent, 1003);             // B's clock reads 1003 when the message lands\nconst after = b.now(1004);\nconst later = b.now(1060);\nconsole.log(\"A sends\", show(sent), \"| B receives\", show(got), \"| B's next event\", show(after), \"| B at 1060 ms\", show(later));\n","out":"A sends (1050,0) | B receives (1050,1) | B's next event (1050,2) | B at 1060 ms (1060,0)\n"}]}},"traps":[["“Two nodes are enough for a highly available consensus cluster.”","A majority of two is two, so losing either one stops all progress. Use three servers to survive one failure, or five to survive two; an even number adds cost without adding tolerance."],["“A lock with a lease is safe: the lease expires before anyone else can get it.”","The holder can pause past its lease (garbage collection, a VM migration, a slow disk) and then act as if it still holds it. Locks that protect correctness need fencing tokens checked by the resource."],["“Check that we still hold the lock just before writing.”","The pause can come between the check and the write. Only the resource receiving the write can reliably reject a stale holder, by comparing tokens."],["“Order writes from different machines by their timestamps.”","Clock skew and NTP steps make cross-machine timestamps unreliable, and last-write-wins with skewed clocks silently drops writes. Order through a consensus log, or use logical or hybrid clocks."],["“Lamport timestamps tell me which events were concurrent.”","They give an order consistent with causality, but L(a) < L(b) doesn't mean a caused b. Use vector clocks to detect concurrent updates."],["“Five members across two data centres, three in one and two in the other, survive a data-centre outage.”","Losing the three-member site leaves two of five: no majority, so the cluster stops. Spread members over three failure domains, such as 2 + 2 + 1, so any one can fail."]],"disc":[["Your batch scheduler runs on three instances and must start each nightly job once. How do you coordinate them?","Elect a leader through a coordination service, such as an etcd lease or a ZooKeeper ephemeral node, so only the leader schedules. Leadership can change mid-job, so give each run an idempotency key and pass the leader's fencing token (the lease revision) to the job store, which rejects writes from older leaders. A plain Redis lock is fine only if an occasional duplicate run is harmless."],["Why do etcd and ZooKeeper clusters usually have three or five members rather than seven or nine?","Each write waits for a majority, so more voting members add latency and replication traffic, and five already survive two failures. To scale reads, add non-voting members (etcd learners, ZooKeeper observers) instead of voters."]],"teach":{"prompt":"Explain to a junior colleague how Raft keeps a replicated log consistent, and why distributed locks need fencing tokens.","rubric":["Majority quorums: 2f+1 servers survive f failures, and two majorities always overlap","Terms, randomized election timeouts and one vote per server per term","Log replication: the consistency check, commit on a majority, and the up-to-date rule for votes","Leases can expire during a pause; fencing tokens are checked by the resource","Why wall clocks can't order events across machines, and what logical clocks give"],"model":"Raft keeps one log of commands identical on every server. Time is split into terms; if followers stop hearing the leader's heartbeats, the first whose randomized timeout runs out becomes a candidate for a new term, and wins if a majority votes for it. Each server votes once per term, so there's at most one leader per term, and only for candidates whose log is at least as up to date as its own, so a new leader has every committed entry. The leader sends entries with the index and term of the entry before them; followers accept only if they match, and the leader backs up until they do. An entry is committed once a majority stores it, so five servers survive two failures. Locks are different: a holder can pause past its lease without noticing, so the lock service hands out increasing fencing tokens and the storage rejects any write with an older token. And we never trust wall clocks to order events across machines; we use the log, or logical clocks."},"qa":[["How many failures does a five-server Raft cluster tolerate?","Two: the remaining three are still a majority."],["Why are Raft election timeouts randomized?","So one follower usually times out first and wins before others compete, avoiding repeated split votes."],["When does a Raft leader consider an entry committed?","When a majority stores it and it's from the leader's current term."],["What does a fencing token protect against?","A former lock holder that paused past its lease and then writes: the resource rejects tokens older than the newest it has seen."],["What can vector clocks tell that Lamport clocks can't?","Whether two events are concurrent."],["What is a hybrid logical clock?","Physical time plus a logical counter: close to wall time, yet consistent with causality."]],"quiz":[{"q":"What does this print?","snip":{"t":"Failures each cluster size tolerates","tabs":[{"lang":"python","src":"print(*(f\"{n}:{(n - 1) // 2}\" for n in (3, 4, 5, 7)))\n"},{"lang":"javascript","src":"console.log(...[3, 4, 5, 7].map(n => `${n}:${Math.floor((n - 1) / 2)}`));\n"}]},"o":["3:1 4:1 5:2 7:3","3:1 4:2 5:2 7:3","3:2 4:2 5:3 7:4","3:1 4:1 5:2 7:4"],"a":0,"e":"A cluster of n servers tolerates (n − 1) // 2 failures, because the rest must still be a majority. A fourth server adds no tolerance over three."},{"q":"What does this print?","snip":{"t":"A Lamport clock receiving messages","tabs":[{"lang":"python","src":"clock, seen = 0, []\nfor kind, stamp in [(\"local\", 0), (\"receive\", 5), (\"local\", 0), (\"receive\", 3)]:\n    clock = max(clock, stamp) + 1 if kind == \"receive\" else clock + 1\n    seen.append(clock)\nprint(*seen)\n"},{"lang":"javascript","src":"let clock = 0;\nconst seen = [];\nfor (const [kind, stamp] of [[\"local\", 0], [\"receive\", 5], [\"local\", 0], [\"receive\", 3]]) {\n  clock = kind === \"receive\" ? Math.max(clock, stamp) + 1 : clock + 1;\n  seen.push(clock);\n}\nconsole.log(...seen);\n"}]},"o":["1 6 7 8","1 6 7 4","1 5 6 7","1 2 3 4"],"a":0,"e":"A local event adds one; a receive jumps past the message's timestamp first. The message stamped 3 arrives when the clock is already at 7, so the clock just moves on to 8."},{"q":"A partition splits a five-server Raft cluster into groups of three and two, with the old leader among the two. What happens?","o":["The three elect a new leader and keep committing; the old leader commits nothing until the partition heals","Both sides keep committing and merge their logs later","The whole cluster stops until the partition heals","The old leader keeps committing because it has the latest term"],"a":0,"e":"Only a majority can commit. The old leader may still accept requests, but none of them commit; when it hears the higher term it steps down, and its uncommitted entries are overwritten."},{"q":"A worker's lock lease ran out during a 20-second garbage-collection pause, and another worker now holds the lock. What stops the first worker's late write from corrupting data?","o":["The storage rejects writes whose fencing token is lower than the highest it has seen","A longer lease","Checking the lock just before writing","Synchronizing clocks with NTP"],"a":0,"e":"Any lease can be outlived by a long enough pause, and a check before the write can be followed by a pause. Only the resource, comparing tokens, can reject the stale writer."},{"q":"Which are true of Raft? (choose 3)","t":"ms","o":["A server votes for at most one candidate per term","A candidate needs votes from a majority of the whole cluster","Servers refuse to vote for a candidate whose log is less up to date than their own","A follower can commit entries on its own","Raft tolerates servers that lie about their logs"],"a":[0,1,2],"e":"One vote per term plus majorities give at most one leader per term, and the up-to-date rule makes sure the winner has every committed entry. Followers never commit on their own, and Raft assumes crashes, not lies; that needs Byzantine fault tolerance."},{"q":"Judge each statement.","t":"yn","s":[["If event a happened before event b, a's Lamport timestamp is smaller than b's.",true],["If a's Lamport timestamp is smaller than b's, a happened before b.",false],["Events with vector clocks 2,1,0 and 1,2,0 are concurrent.",true],["NTP keeps clocks close enough to order writes from different machines.",false]],"e":"Lamport timestamps respect causality in one direction only. Neither of those vectors is less than or equal to the other in every slot, so the events are concurrent. NTP keeps clocks within milliseconds and can step them backwards: enough to reorder close writes."},{"q":"Put a Raft leader election in order.","t":"ord","items":["A follower hears no heartbeat before its election timeout runs out","It increments its term, becomes a candidate and votes for itself","It sends RequestVote to every other server","A majority grant it their vote for this term","It becomes leader and sends heartbeats, which stop new elections"],"e":"Heartbeats keep resetting every follower's timer; the randomized timeout makes it likely that one follower starts and wins before the others time out."},{"q":"Complete the Python function that decides whether a Raft server grants its vote.","t":"drop","lang":"python","code":"def grant_vote(me, term, candidate, cand_last_term, cand_last_index):\n    if term < me[\"term\"]:\n        return False                           # a stale candidate\n    if term > me[\"term\"]:\n        me[\"term\"], me[\"voted\"] = term, None   # a new term: free to vote again\n    my_last_term = me[\"log\"][-1] if me[\"log\"] else 0\n    up_to_date = (cand_last_term, cand_last_index) >= (my_last_term, {{0}})\n    if me[\"voted\"] in (None, candidate) and up_to_date:\n        me[\"voted\"] = {{1}}\n        return True\n    return False\n","blanks":[{"o":["len(me['log'])","me['term']","cand_last_index","0"],"a":0},{"o":["candidate","term","True","me"],"a":0}],"e":"Logs compare by their last entry's term, then by length, and the vote is recorded against the candidate, so a repeated request from the same candidate in the same term is granted again but no one else's is."}],"probs":[["Reading · The Raft paper","https://raft.github.io/raft.pdf","","read sections 5.1 to 5.4, then explain in your own words why a leader may not commit an older term's entry by counting replicas"],["Visualization · RaftScope on the Raft site","https://raft.github.io/","","stop the leader in the visualization, and narrate each message until a new leader is elected"],["Reading · How to do distributed locking","https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html","","list the timing assumptions a lease-based lock depends on, and where fencing tokens remove them"],["Reading · Time, Clocks, and the Ordering of Events","https://lamport.azurewebsites.net/pubs/time-clocks.pdf","","define happened-before in your own words, and say why Lamport timestamps can't detect concurrency"]],"src":[["Ongaro and Ousterhout: In Search of an Understandable Consensus Algorithm (Raft, extended version)","https://raft.github.io/raft.pdf"],["The Raft Consensus Algorithm site, with RaftScope","https://raft.github.io/"],["Martin Kleppmann: How to do distributed locking (2016)","https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"],["Leslie Lamport: Time, Clocks, and the Ordering of Events in a Distributed System (1978)","https://lamport.azurewebsites.net/pubs/time-clocks.pdf"],["Kulkarni et al.: Logical Physical Clocks and Consistent Snapshots in Globally Distributed Databases (HLC, 2014)","https://cse.buffalo.edu/tech-reports/2014-04.pdf"]]},{"id":"m05","d":"d2","t":"Storage engines: B-trees, LSM trees and the write-ahead log","min":110,"hook":"Every database sits on a storage engine, and the engine decides what's cheap. B-trees update sorted pages in place: quick, predictable reads, but scattered writes. LSM trees buffer writes in memory, flush them as sorted files and merge those files in the background: fast writes, paid for with reads that may check several files and with compaction work. Both use a write-ahead log for durability. The trade-offs between read, write and space amplification tell you when PostgreSQL's B-trees fit a workload and when Cassandra's or RocksDB's LSM trees do.","pre":{"q":"A metrics service ingests 500,000 small writes a second and mostly reads the last hour. Should its storage engine update records in place on disk, or append them and sort later? Why?","a":"Append and sort later, which is what an LSM tree does. Writes become sequential appends to a log plus sorted flushes from memory, which disks and SSDs handle far better than random in-place updates. Reads of recent data hit memory or the newest files. The costs are background compaction and reads that may check several files, which Bloom filters keep cheap."},"kid":{"t":"Luigi's order books","x":"Luigi used to keep one alphabetical ledger of customers, rubbing out and rewriting each entry in place, flipping to the right page for every change. Now orders pour in too fast, so he jots each one on a notepad, and when it's full he copies it out, sorted, into a fresh booklet. Each night an apprentice merges booklets into one, dropping crossed-out lines. To look a customer up, Luigi checks the notepad, then the booklets from newest to oldest; a coded sticker on each cover can tell him a name is definitely not inside. And before any change, he writes it in a diary, so a spilt coffee never loses an order.","map":[["The alphabetical ledger rewritten in place","A B-tree: sorted pages updated in place, one place to look for each key"],["Notepad, sorted booklets, nightly merge","An LSM tree: an in-memory memtable, immutable sorted SSTables, background compaction"],["The coded sticker on each booklet","A Bloom filter per SSTable: skip files that can't contain the key"],["The diary written before any change","The write-ahead log, replayed after a crash"]],"brk":"Luigi's apprentice merges at night, when the shop is shut. A database never shuts: compaction competes with live traffic for disk bandwidth, and when it falls behind, reads slow down and disk use grows."},"keys":["**Storage engines**: the part of a database that lays data out on disk and finds it again. Two families dominate: B-trees (PostgreSQL, MySQL's InnoDB, SQL Server and most relational databases) and log-structured merge trees (RocksDB, LevelDB, Cassandra, ScyllaDB, HBase, and the engines under CockroachDB and TiKV). This module is about choosing between them; the SQL L4 hub covers their internals.","**B-trees**: keys live in sorted, fixed-size pages (often 8 or 16 KB) that form a shallow tree; with hundreds of keys per page, three or four levels index billions of rows. A read follows one root-to-leaf path. A write changes its leaf page in place and splits it when full, so a small change still rewrites a whole page, and random keys scatter writes across the index.","**The write-ahead log (WAL)**: every change is appended to a sequential log and flushed (fsync) before the write is acknowledged, so after a crash the engine replays the log onto the last checkpoint. Group commit lets many transactions share one fsync. The same log feeds replication and change data capture.","**LSM trees**: a write goes to the WAL and into a sorted in-memory memtable; a full memtable is flushed as an immutable sorted file, an SSTable. Reads check the memtable, then SSTables from newest to oldest. A delete writes a tombstone. Background compaction merges SSTables, dropping overwritten values, and tombstones once nothing older can remain.","**Amplification**: write amplification is the bytes written to disk per byte of data (whole-page rewrites in a B-tree, repeated compaction in an LSM tree); read amplification is the pages or files touched per read; space amplification is the disk used per byte of live data (half-empty pages, obsolete versions awaiting compaction). The RUM conjecture: no design minimises all three at once.","**Bloom filters and caches**: each SSTable carries a Bloom filter that answers 'definitely not here' or 'maybe', so point reads skip most files; about 10 bits per key gives roughly 1% false positives. A block cache keeps hot blocks in memory. Range scans can't use Bloom filters and must merge across files.","**Compaction strategies**: leveled compaction (RocksDB's default) keeps each level about ten times the size of the previous one, with no overlapping files within a level: lower read and space amplification, more write amplification. Size-tiered compaction (Cassandra's long-time default) merges files of similar size: cheaper writes, more files per read, and temporary space for big merges. Time-window compaction suits time series.","**Choosing**: read-heavy work with updates, range scans and a need for steady latency suits a B-tree; heavy ingestion of events, metrics, logs or messages suits an LSM tree. Prefer time-ordered keys (UUIDv7, ULIDs) over random ones in B-tree indexes. Then measure your own workload, and watch compaction backlog, tombstone counts and checkpoint I/O."],"dia":[{"type":"flow","cap":"An LSM write, and what happens to it later","steps":[["Append to the WAL","sequential, flushed before the ack: survives a crash"],["Insert into the memtable","a sorted structure in memory"],["Flush","the full memtable becomes an immutable sorted SSTable"],["Compact","background merges drop overwritten values and old tombstones"]],"note":"Every step writes sequentially, which is why LSM trees ingest so quickly; compaction rewrites the same data several times, which is the price."},{"type":"layers","cap":"Where an LSM point read looks, in order","rows":[["Memtable","the newest writes, in memory"],["Level 0 SSTables","recent flushes, which may overlap each other: check each, newest first"],["Level 1","about ten times larger, files don't overlap: at most one file to check"],["Level 2 and below","each about ten times larger again, one file per level"]],"note":"The read stops at the first version it finds. Bloom filters let it skip files that can't hold the key, so most reads touch one file on disk."},{"type":"tiers","cap":"A B-tree lookup","tiers":[["Root page",["splits the whole key range about 500 ways"]],["Internal pages",["about 500 pages","each splits its range 500 ways"],"follow the child covering the key"],["Leaf pages",["about 250,000 pages","rows or row pointers in key order","linked for range scans"],"follow the child covering the key"]],"note":"Three levels of about 500 keys per page index 125 million rows. The upper levels stay cached, so a lookup costs about one disk read."}],"cmp":[{"cap":"B-tree or LSM tree","head":["","B-tree","LSM tree"],"rows":[["Writes","In place, scattered; a whole page rewritten per change","Sequential appends and flushes, rewritten later by compaction"],["Point reads","One root-to-leaf path, predictable","Memtable, then SSTables; Bloom filters skip most"],["Range scans","Excellent: leaves are in key order","Good, but merges several files"],["Space","Half-empty pages after splits","Old versions and tombstones until compaction"],["Latency risks","Page splits, checkpoint I/O bursts","Compaction backlog, tombstone build-up"],["Examples","PostgreSQL, MySQL InnoDB, SQL Server","RocksDB, Cassandra, ScyllaDB, HBase"]]},{"cap":"Leveled or size-tiered compaction","head":["","Leveled","Size-tiered"],"rows":[["How","Each level about 10× the previous; files in a level don't overlap","Merge several similar-sized files into a bigger one"],["Write amplification","Higher","Lower"],["Read and space amplification","Lower","Higher, with spare space needed for big merges"],["Fits","Read-heavy and update-heavy tables","Write-heavy, mostly-append tables"]]}],"code":[{"t":"The seeded random generator and a string hash used by the examples","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef fnv1a(text, seed=2166136261):               # the 32-bit FNV-1a hash, same as the JavaScript one\n    h = seed\n    for ch in text:\n        h = ((h ^ ord(ch)) * 16777619) & 0xFFFFFFFF\n    return h\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction fnv1a(text, seed = 2166136261) {       // the 32-bit FNV-1a hash, same as the Python one\n  let h = seed >>> 0;\n  for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;\n  return h;\n}\n"}]},{"t":"An LSM tree: reads search more files until compaction","tabs":[{"lang":"python","src":"from bisect import bisect_left\n\nclass LSMTree:\n    def __init__(self, memtable_limit=100):\n        self.memtable, self.sstables, self.limit = {}, [], memtable_limit   # sstables: newest first\n        self.written = 0                               # entries written to disk\n\n    def put(self, key, value):\n        self.memtable[key] = value\n        if len(self.memtable) >= self.limit:\n            self.flush()\n\n    def flush(self):\n        table = sorted(self.memtable.items())          # one sorted, immutable file\n        self.sstables.insert(0, table)\n        self.written += len(table)\n        self.memtable = {}\n\n    def get(self, key):\n        if key in self.memtable:\n            return self.memtable[key], 0\n        for searched, table in enumerate(self.sstables, start=1):\n            i = bisect_left(table, (key,))             # binary search inside the file\n            if i < len(table) and table[i][0] == key:\n                return table[i][1], searched           # the newest file holding the key wins\n        return None, len(self.sstables)\n\n    def compact(self):\n        merged = {}\n        for table in reversed(self.sstables):          # oldest first, so newer values overwrite older ones\n            merged.update(table)\n        self.sstables = [sorted(merged.items())]\n        self.written += len(self.sstables[0])\n\nrand = mulberry32(5)\ndb = LSMTree()\nfor _ in range(5000):\n    db.put(f\"user-{int(rand() * 2000):04d}\", int(rand() * 100))\ndb.flush()\nlookups = [f\"user-{int(rand() * 2000):04d}\" for _ in range(1000)]\n\ndef average_searched():\n    total = sum(db.get(key)[1] for key in lookups) * 10 // len(lookups)\n    return f\"{total // 10}.{total % 10}\"\n\nprint(f\"5000 writes: {len(db.sstables)} sstables holding {db.written} entries; reads search {average_searched()} sstables on average\")\ndb.compact()\nprint(f\"after compaction: 1 sstable of {len(db.sstables[0])} live keys; reads search {average_searched()}; {db.written} entries written in all\")\n","out":"5000 writes: 49 sstables holding 4874 entries; reads search 19.0 sstables on average\nafter compaction: 1 sstable of 1833 live keys; reads search 1.0; 6707 entries written in all\n","notes":[[9,"Writes only touch memory; repeated updates to a key in the memtable cost nothing on disk until the flush."],[14,"A flush writes one sorted file sequentially, never modifying an older file."],[22,"A read walks the files from newest to oldest, so an old version never hides a newer one; a missing key searches them all."],[28,"Compaction keeps only the newest version of each key. The fade at the end builds the streaming merge real engines use."],[48,"Reads drop from about 19 files to 1, but the disk has now been written 6,707 entries for 5,000 writes: write amplification."]]},{"lang":"javascript","src":"class LSMTree {\n  constructor(memtableLimit = 100) {\n    this.memtable = new Map(); this.sstables = []; this.limit = memtableLimit;   // sstables: newest first\n    this.written = 0;                                // entries written to disk\n  }\n\n  put(key, value) {\n    this.memtable.set(key, value);\n    if (this.memtable.size >= this.limit) this.flush();\n  }\n\n  flush() {\n    const table = [...this.memtable].sort((a, b) => (a[0] < b[0] ? -1 : 1));   // one sorted, immutable file\n    this.sstables.unshift(table);\n    this.written += table.length;\n    this.memtable = new Map();\n  }\n\n  get(key) {\n    if (this.memtable.has(key)) return [this.memtable.get(key), 0];\n    for (let n = 0; n < this.sstables.length; n++) {\n      const table = this.sstables[n];\n      let lo = 0, hi = table.length;\n      while (lo < hi) { const mid = (lo + hi) >> 1; if (table[mid][0] < key) lo = mid + 1; else hi = mid; }   // binary search inside the file\n      if (lo < table.length && table[lo][0] === key) return [table[lo][1], n + 1];   // the newest file holding the key wins\n    }\n    return [null, this.sstables.length];\n  }\n\n  compact() {\n    const merged = new Map();\n    for (const table of [...this.sstables].reverse()) for (const [k, v] of table) merged.set(k, v);   // oldest first, so newer values overwrite older ones\n    this.sstables = [[...merged].sort((a, b) => (a[0] < b[0] ? -1 : 1))];\n    this.written += this.sstables[0].length;\n  }\n}\n\nconst rand = mulberry32(5);\nconst db = new LSMTree();\nconst userKey = () => `user-${String(Math.floor(rand() * 2000)).padStart(4, \"0\")}`;\nfor (let i = 0; i < 5000; i++) { const key = userKey(); db.put(key, Math.floor(rand() * 100)); }\ndb.flush();\nconst lookups = Array.from({ length: 1000 }, userKey);\n\nfunction averageSearched() {\n  const total = Math.floor(lookups.reduce((sum, key) => sum + db.get(key)[1], 0) * 10 / lookups.length);\n  return `${Math.floor(total / 10)}.${total % 10}`;\n}\n\nconsole.log(`5000 writes: ${db.sstables.length} sstables holding ${db.written} entries; reads search ${averageSearched()} sstables on average`);\ndb.compact();\nconsole.log(`after compaction: 1 sstable of ${db.sstables[0].length} live keys; reads search ${averageSearched()}; ${db.written} entries written in all`);\n","out":"5000 writes: 49 sstables holding 4874 entries; reads search 19.0 sstables on average\nafter compaction: 1 sstable of 1833 live keys; reads search 1.0; 6707 entries written in all\n","notes":[[8,"Writes only touch memory; repeated updates to a key in the memtable cost nothing on disk until the flush."],[13,"A flush writes one sorted file sequentially, never modifying an older file."],[21,"A read walks the files from newest to oldest, so an old version never hides a newer one; a missing key searches them all."],[30,"Compaction keeps only the newest version of each key. The fade at the end builds the streaming merge real engines use."],[52,"Reads drop from about 19 files to 1, but the disk has now been written 6,707 entries for 5,000 writes: write amplification."]]}]},{"t":"Bloom filters: skipping SSTables that can't hold the key","tabs":[{"lang":"python","src":"class BloomFilter:\n    def __init__(self, keys, bits_per_key, k):\n        self.m, self.k = len(keys) * bits_per_key, k\n        self.bits = bytearray(self.m)\n        for key in keys:\n            for p in self.positions(key):\n                self.bits[p] = 1\n\n    def positions(self, key):\n        h1, h2 = fnv1a(key), fnv1a(key, 0x9747B28C) | 1   # two hashes combine into k positions\n        return [(h1 + i * h2) % self.m for i in range(self.k)]\n\n    def might_contain(self, key):\n        return all(self.bits[p] for p in self.positions(key))   # any 0 bit: definitely absent\n\nrand = mulberry32(21)\ntables = [[f\"user-{int(rand() * 1_000_000):06d}\" for _ in range(100)] for _ in range(50)]\nstored = {key for table in tables for key in table}\nmissing = []\nwhile len(missing) < 1000:\n    key = f\"user-{int(rand() * 1_000_000):06d}\"\n    if key not in stored:\n        missing.append(key)                            # keys that are in no sstable at all\n\nfor bits_per_key, k in ((5, 3), (10, 7), (15, 10)):\n    filters = [BloomFilter(table, bits_per_key, k) for table in tables]\n    searched = sum(f.might_contain(key) for key in missing for f in filters)\n    rate = searched * 1000 // (len(missing) * len(filters))\n    print(f\"{bits_per_key} bits per key: {searched} of 50000 sstable searches still needed ({rate // 10}.{rate % 10}% false positives)\")\n","out":"5 bits per key: 5007 of 50000 sstable searches still needed (10.0% false positives)\n10 bits per key: 453 of 50000 sstable searches still needed (0.9% false positives)\n15 bits per key: 67 of 50000 sstable searches still needed (0.1% false positives)\n","notes":[[7,"Adding a key sets k bits; bits are never cleared, which is why SSTables, being immutable, suit Bloom filters so well."],[10,"Double hashing: two hash values generate all k positions, as RocksDB and Cassandra do, instead of k separate hash functions."],[14,"Any zero bit proves the key was never added. All ones means only 'maybe': another key may have set them."],[29,"Each extra 5 bits per key cuts false positives roughly tenfold; 10 bits is the usual default, about 1.2 MB per million keys."]]},{"lang":"javascript","src":"class BloomFilter {\n  constructor(keys, bitsPerKey, k) {\n    this.m = keys.length * bitsPerKey; this.k = k;\n    this.bits = new Uint8Array(this.m);\n    for (const key of keys) for (const p of this.positions(key)) this.bits[p] = 1;\n  }\n\n  positions(key) {\n    const h1 = fnv1a(key), h2 = (fnv1a(key, 0x9747B28C) | 1) >>> 0;   // two hashes combine into k positions\n    return Array.from({ length: this.k }, (_, i) => (h1 + i * h2) % this.m);\n  }\n\n  mightContain(key) {\n    return this.positions(key).every(p => this.bits[p] === 1);   // any 0 bit: definitely absent\n  }\n}\n\nconst rand = mulberry32(21);\nconst userKey = () => `user-${String(Math.floor(rand() * 1000000)).padStart(6, \"0\")}`;\nconst tables = Array.from({ length: 50 }, () => Array.from({ length: 100 }, userKey));\nconst stored = new Set(tables.flat());\nconst missing = [];\nwhile (missing.length < 1000) {\n  const key = userKey();\n  if (!stored.has(key)) missing.push(key);           // keys that are in no sstable at all\n}\n\nfor (const [bitsPerKey, k] of [[5, 3], [10, 7], [15, 10]]) {\n  const filters = tables.map(table => new BloomFilter(table, bitsPerKey, k));\n  let searched = 0;\n  for (const key of missing) for (const f of filters) if (f.mightContain(key)) searched++;\n  const rate = Math.floor(searched * 1000 / (missing.length * filters.length));\n  console.log(`${bitsPerKey} bits per key: ${searched} of 50000 sstable searches still needed (${Math.floor(rate / 10)}.${rate % 10}% false positives)`);\n}\n","out":"5 bits per key: 5007 of 50000 sstable searches still needed (10.0% false positives)\n10 bits per key: 453 of 50000 sstable searches still needed (0.9% false positives)\n15 bits per key: 67 of 50000 sstable searches still needed (0.1% false positives)\n","notes":[[5,"Adding a key sets k bits; bits are never cleared, which is why SSTables, being immutable, suit Bloom filters so well."],[9,"Double hashing: two hash values generate all k positions, as RocksDB and Cassandra do, instead of k separate hash functions."],[14,"Any zero bit proves the key was never added. All ones means only 'maybe': another key may have set them."],[33,"Each extra 5 bits per key cuts false positives roughly tenfold; 10 bits is the usual default, about 1.2 MB per million keys."]]}]},{"t":"B-tree inserts: random keys against time-ordered keys","tabs":[{"lang":"python","src":"rand = mulberry32(3)\nROWS_PER_PAGE, PAGE_BYTES, ROW_BYTES = 64, 8192, 128\nEXISTING_ROWS = 1_000_000                          # an index of 15,625 full leaf pages\n\ndef page_writes(next_key, inserts=10_000, checkpoint_every=1_000):\n    dirty, written = set(), 0\n    for n in range(1, inserts + 1):\n        dirty.add(next_key(n) // ROWS_PER_PAGE)       # the leaf page this key belongs in\n        if n % checkpoint_every == 0:\n            written += len(dirty)                      # a checkpoint writes each dirty page once\n            dirty = set()\n    return written\n\nfor label, next_key in ((\"random keys (UUIDv4)\", lambda n: int(rand() * EXISTING_ROWS)),\n                        (\"time-ordered keys (UUIDv7)\", lambda n: EXISTING_ROWS + n)):\n    pages = page_writes(next_key)\n    print(f\"{label}: 10000 inserts dirtied {pages} pages, {pages * PAGE_BYTES // (10_000 * ROW_BYTES)}x the bytes inserted\")\n","out":"random keys (UUIDv4): 10000 inserts dirtied 9692 pages, 62x the bytes inserted\ntime-ordered keys (UUIDv7): 10000 inserts dirtied 166 pages, 1x the bytes inserted\n","notes":[[8,"A random key lands on a random leaf page; a time-ordered key always lands on the rightmost one."],[10,"Between checkpoints, a page changed many times is written once, so locality decides how much is written."],[17,"Random keys rewrite a whole 8 KB page for almost every 128-byte row; if the index is bigger than memory, each insert also needs a random read."]]},{"lang":"javascript","src":"const rand = mulberry32(3);\nconst ROWS_PER_PAGE = 64, PAGE_BYTES = 8192, ROW_BYTES = 128;\nconst EXISTING_ROWS = 1000000;                     // an index of 15,625 full leaf pages\n\nfunction pageWrites(nextKey, inserts = 10000, checkpointEvery = 1000) {\n  let dirty = new Set(), written = 0;\n  for (let n = 1; n <= inserts; n++) {\n    dirty.add(Math.floor(nextKey(n) / ROWS_PER_PAGE));   // the leaf page this key belongs in\n    if (n % checkpointEvery === 0) {\n      written += dirty.size;                         // a checkpoint writes each dirty page once\n      dirty = new Set();\n    }\n  }\n  return written;\n}\n\nfor (const [label, nextKey] of [[\"random keys (UUIDv4)\", n => Math.floor(rand() * EXISTING_ROWS)],\n                                [\"time-ordered keys (UUIDv7)\", n => EXISTING_ROWS + n]]) {\n  const pages = pageWrites(nextKey);\n  console.log(`${label}: 10000 inserts dirtied ${pages} pages, ${Math.floor(pages * PAGE_BYTES / (10000 * ROW_BYTES))}x the bytes inserted`);\n}\n","out":"random keys (UUIDv4): 10000 inserts dirtied 9692 pages, 62x the bytes inserted\ntime-ordered keys (UUIDv7): 10000 inserts dirtied 166 pages, 1x the bytes inserted\n","notes":[[8,"A random key lands on a random leaf page; a time-ordered key always lands on the rightmost one."],[10,"Between checkpoints, a page changed many times is written once, so locality decides how much is written."],[20,"Random keys rewrite a whole 8 KB page for almost every 128-byte row; if the index is bigger than memory, each insert also needs a random read."]]}]}],"ex":{"q":"A key-value service receives 2,000 writes within one second, and each fsync of its write-ahead log takes 2 ms. Compare three ways to acknowledge a write: straight away, before any fsync; after an fsync for that write alone; and with group commit, where every write waiting for the log shares the next fsync. Count the fsyncs, the average time a client waits, and the acknowledged writes lost if the power fails at 777 ms.","steps":["An acknowledgement promises the client its write is durable. Data in the operating system's cache isn't: a power cut loses it. So a durable engine fsyncs its log before acknowledging.","The log device does one fsync at a time, so an fsync per write caps throughput at 1 ÷ 2 ms = 500 writes a second. At 2,000 a second, a queue builds and waits grow without limit.","Group commit lets every write that arrived during one fsync share the next. Under load, batches grow and the fsync count stays near 500 a second, while each write waits at most about two fsync times.","What remains is a choice of latency against durability. Systems that acknowledge before the fsync, such as PostgreSQL with synchronous_commit off, accept losing the last moments of acknowledged writes in exchange for speed."],"code":{"t":"Three ways to acknowledge a write, and a power cut","tabs":[{"lang":"python","src":"rand = mulberry32(12)\narrivals = sorted(int(rand() * 1000) for _ in range(2000))   # 2,000 writes within one second, in ms\nFSYNC_MS = 2                                                  # one fsync of the log takes 2 ms\n\ndef run(mode):\n    acks, durable, fsyncs, now, i = [], [], 0, 0, 0\n    if mode == \"ack before fsync\":\n        for t in arrivals:\n            acks.append(t)                                    # acknowledged at once, from the OS cache\n            durable.append((t // 500 + 1) * 500)              # the OS writes its cache back every 500 ms\n        return acks, durable, fsyncs\n    while i < len(arrivals):\n        now = max(now, arrivals[i])                           # the log device idles until a write arrives\n        j = i + 1\n        if mode == \"group commit\":\n            while j < len(arrivals) and arrivals[j] <= now:\n                j += 1                                        # every waiting write joins this fsync\n        now += FSYNC_MS\n        fsyncs += 1\n        acks += [now] * (j - i)                               # acknowledged once the fsync completes\n        durable += [now] * (j - i)\n        i = j\n    return acks, durable, fsyncs\n\ncrash = 777\nfor mode in (\"ack before fsync\", \"fsync per write\", \"group commit\"):\n    acks, durable, fsyncs = run(mode)\n    wait = sum(a - t for a, t in zip(acks, arrivals)) * 10 // len(arrivals)\n    lost = sum(1 for a, d in zip(acks, durable) if a <= crash < d)   # acknowledged, but not yet on disk\n    print(f\"{mode}: {fsyncs} fsyncs, average wait {wait // 10}.{wait % 10} ms, acknowledged writes lost in a crash at {crash} ms: {lost}\")\n","out":"ack before fsync: 0 fsyncs, average wait 0.0 ms, acknowledged writes lost in a crash at 777 ms: 532\nfsync per write: 2000 fsyncs, average wait 1518.4 ms, acknowledged writes lost in a crash at 777 ms: 0\ngroup commit: 494 fsyncs, average wait 2.4 ms, acknowledged writes lost in a crash at 777 ms: 0\n"},{"lang":"javascript","src":"const rand = mulberry32(12);\nconst arrivals = Array.from({ length: 2000 }, () => Math.floor(rand() * 1000)).sort((a, b) => a - b);   // 2,000 writes within one second, in ms\nconst FSYNC_MS = 2;                                           // one fsync of the log takes 2 ms\n\nfunction run(mode) {\n  const acks = [], durable = [];\n  let fsyncs = 0, now = 0, i = 0;\n  if (mode === \"ack before fsync\") {\n    for (const t of arrivals) {\n      acks.push(t);                                           // acknowledged at once, from the OS cache\n      durable.push((Math.floor(t / 500) + 1) * 500);          // the OS writes its cache back every 500 ms\n    }\n    return [acks, durable, fsyncs];\n  }\n  while (i < arrivals.length) {\n    now = Math.max(now, arrivals[i]);                         // the log device idles until a write arrives\n    let j = i + 1;\n    if (mode === \"group commit\") {\n      while (j < arrivals.length && arrivals[j] <= now) j++;  // every waiting write joins this fsync\n    }\n    now += FSYNC_MS;\n    fsyncs++;\n    for (let w = i; w < j; w++) { acks.push(now); durable.push(now); }   // acknowledged once the fsync completes\n    i = j;\n  }\n  return [acks, durable, fsyncs];\n}\n\nconst crash = 777;\nfor (const mode of [\"ack before fsync\", \"fsync per write\", \"group commit\"]) {\n  const [acks, durable, fsyncs] = run(mode);\n  const wait = Math.floor(acks.reduce((sum, a, w) => sum + a - arrivals[w], 0) * 10 / arrivals.length);\n  const lost = acks.filter((a, w) => a <= crash && crash < durable[w]).length;   // acknowledged, but not yet on disk\n  console.log(`${mode}: ${fsyncs} fsyncs, average wait ${Math.floor(wait / 10)}.${wait % 10} ms, acknowledged writes lost in a crash at ${crash} ms: ${lost}`);\n}\n","out":"ack before fsync: 0 fsyncs, average wait 0.0 ms, acknowledged writes lost in a crash at 777 ms: 532\nfsync per write: 2000 fsyncs, average wait 1518.4 ms, acknowledged writes lost in a crash at 777 ms: 0\ngroup commit: 494 fsyncs, average wait 2.4 ms, acknowledged writes lost in a crash at 777 ms: 0\n"}]},"a":"Acknowledging before the fsync answers instantly, but the power cut at 777 ms loses 532 writes the clients were told were safe: everything since the operating system's last write-back at 500 ms. An
