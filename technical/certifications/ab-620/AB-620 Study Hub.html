HUB.modules.push(
{
  id: "k01", d: "d2", t: "Enterprise knowledge: Copilot connectors, real-time connectors, Azure AI Search", min: 85,
  hook: "D2 is the largest domain, and it opens with knowledge. The exam wants you to pick between **indexed** knowledge (Copilot connectors), **live** knowledge (real-time Power Platform connectors) and **your own index** (Azure AI Search), and to know the setup gotchas of each.",
  pre: { q: "ServiceNow holds 40,000 knowledge articles and also live incident tickets. Users ask both \"how do I reset MFA?\" and \"what's the status of INC0012345?\". Same knowledge option for both?", a: "No. Articles suit a **Copilot connector** (indexed into Microsoft Graph, semantic search, citations). Live ticket status suits a **real-time Power Platform connector** (knowledge, preview) or a connector **tool**: queried at question time under the user's identity, no copy of the data." },
  story: [
    "Contoso's IT service desk wants an agent that knows everything in ServiceNow, Confluence and the HR SharePoint, plus live order data. Daniel sketches three kinds of shelf.",
    "The first shelf is a **library index**. A Microsoft 365 admin sets up **Copilot connectors** (formerly Graph connectors) in the Microsoft 365 admin center for ServiceNow's knowledge base and Confluence. Content is copied into **Microsoft Graph**, semantically indexed, labelled, and kept with each item's permissions. In Copilot Studio, Asha simply adds the connection as knowledge, and answers come back with **citations**. The same index also serves Microsoft 365 Copilot and Microsoft Search.",
    "The second shelf is a **telephone**. For order status and live tickets, copying data isn't allowed or makes no sense, so she adds a **real-time Power Platform connector** as knowledge (preview): at question time the agent calls Salesforce, ServiceNow or Azure SQL with the **user's connection**, under DLP rules. Nothing is replicated; latency depends on the API; citations aren't built in.",
    "The third shelf is the data team's **own search engine**. They already run **Azure AI Search** with a vectorised index of 2 million product documents. Asha adds it as knowledge with *Create new connection* (Microsoft Entra ID auth recommended), confirms the index uses **integrated vectorization** and has the **semantic ranker** enabled, and maps a URL field for citations.",
    "Everything else is familiar: the SharePoint site (searched with the user's permissions), a few uploaded PDFs, the public returns page, and a couple of Dataverse tables. The agent's job is to search the right shelf and say where the answer came from."
  ],
  breaks: "The shelves blur in practice: real-time connectors are also tools, Copilot connectors can be custom-built against the Graph API, and Azure AI Search can index the same SharePoint content. The exam's deciding words are usually *copy/index vs no data movement*, *who configures it*, and *citations*.",
  dia: [
    { type: "tree", cap: "Which enterprise knowledge option?", root: { q: "What's the content and what are the constraints?", c: [["Large bodies of documents/articles in external systems; citations; reuse in Microsoft 365 Copilot", "Copilot connector (admin-indexed into Microsoft Graph)"], ["Live records; data must not be copied; user's own access", "Real-time Power Platform connector as knowledge (preview)"], ["An existing vector index the data team runs, custom chunking", "Azure AI Search knowledge source"], ["Microsoft 365 files and sites", "SharePoint / OneDrive knowledge"], ["A few static files", "Uploaded files (stored in Dataverse)"], ["Business tables", "Dataverse knowledge"]] } },
    { type: "seq", cap: "Copilot connector vs real-time connector at question time", actors: ["User", "Agent", "Microsoft Graph index", "Live system API"], msgs: [["User", "Agent", "\"How do I reset MFA?\""], ["Agent", "Microsoft Graph index", "Semantic search (user's ACLs)"], ["Microsoft Graph index", "Agent", "Articles + citations", true], ["User", "Agent", "\"Status of INC0012345?\""], ["Agent", "Live system API", "Live query with the user's connection"], ["Live system API", "Agent", "Current record (no copy kept)", true]] }
  ],
  keys: [
    "**Copilot connectors** (formerly Microsoft Graph connectors): set up by an admin in the **Microsoft 365 admin center**; content **indexed into Microsoft Graph** with source ACLs and semantic labels; low-latency retrieval; **citations**; indexing quota and Microsoft 365/Copilot licensing apply; examples: ServiceNow KB, Confluence, Jira, GitHub, Azure DevOps, enterprise websites, file shares.",
    "In Copilot Studio, add a Copilot connector via **Add knowledge** and pick the connection. Users must be signed in; with manual authentication add the Graph scope **`ExternalItem.Read.All`** before publishing, or answers return nothing.",
    "**Real-time Power Platform connectors** as knowledge (preview): **Add knowledge > Advanced >** e.g. Salesforce, ServiceNow, Azure SQL; select tables/entities; **no data movement**; runs **under the user's connection and identity**; governed by DLP; standard vs premium; citations not inherent.",
    "Rule of thumb (Microsoft): *knowledge discovery and grounded Q&A at scale → Copilot connectors; real-time grounding without copying, or transactions → Power Platform connectors.*",
    "**Azure AI Search** knowledge: add with **Create new connection** (don't hand-type endpoint/key into the wrong place); auth options access key, client certificate, service principal, or **Microsoft Entra ID integrated** (recommended).",
    "Azure AI Search requirements: the index should be a **vector index built with integrated vectorization**, the **semantic ranker** enabled on the service, and a field with a full URL (e.g., `metadata_storage_path`) for **citations**. One index per knowledge source; add more sources for more indexes.",
    "Private networking for Azure AI Search: configure VNet support for the Power Platform environment (admin center) before connecting.",
    "Other knowledge: **SharePoint/OneDrive** (user permissions), **uploaded files** (stored in Dataverse), **public websites** (Bing), **Dataverse** tables (add synonyms and glossary to improve results).",
    "Knowledge quality depends on **descriptions** too: describe each source so the orchestrator searches the right one.",
    "Real-time knowledge vs tools: the same connector can be **knowledge** (agent grounds answers on live data) or a **tool** (agent fetches or changes specific records)."
  ],
  cmp: [{ cap: "Copilot connectors vs Power Platform connectors (knowledge)", head: ["Dimension", "Copilot connectors", "Power Platform connectors"], rows: [
    ["Data movement", "Yes: indexed into Microsoft Graph", "No: live API calls at runtime"],
    ["Set up by", "Admin, Microsoft 365 admin center", "Makers/admins, Power Platform connections"],
    ["Identity", "Source ACLs honoured in the index", "User's connection and identity at runtime"],
    ["Freshness / latency", "As fresh as the last crawl; fast retrieval", "Up to the minute; depends on the API"],
    ["Citations", "Yes", "Not inherent"],
    ["Governance", "Indexing quota; Microsoft 365 licensing", "DLP; standard vs premium connectors"],
    ["Best for", "Articles, wikis, tickets at scale", "Live status, no-replication rules, transactions (as tools)"]] }],
  code: [{ t: "Azure AI Search index fields Copilot Studio can use (simplified index definition)", lang: "json", src: `{
  "name": "products-idx",
  "fields": [
    { "name": "chunk_id", "type": "Edm.String", "key": true },
    { "name": "chunk", "type": "Edm.String", "searchable": true },
    { "name": "title", "type": "Edm.String", "searchable": true },
    { "name": "metadata_storage_path", "type": "Edm.String", "retrievable": true },
    { "name": "text_vector", "type": "Collection(Edm.Single)", "dimensions": 1536,
      "vectorSearchProfile": "vector-profile" }
  ],
  "vectorSearch": { "vectorizers": [ { "name": "aoai-vectorizer", "kind": "azureOpenAI" } ] },
  "semantic": { "configurations": [ { "name": "default" } ] }
}`, notes: [[5, "The chunk text the agent reads."], [7, "A full URL field such as `metadata_storage_path` becomes the citation link."], [8, "Vector field for similarity search."], [11, "A **vectorizer** = integrated vectorization, so queries can be vectorised at search time."], [12, "Semantic configuration: the semantic ranker must be enabled on the service."]] }],
  portal: [
    { t: "Add a Copilot connector as knowledge", path: "Copilot Studio > (agent) > Knowledge > Add knowledge > Copilot connectors", steps: ["Admin first creates and indexes the connection in the Microsoft 365 admin center.", "Select the connection; describe what it contains.", "Authentication: Microsoft sign-in, or manual auth with the `ExternalItem.Read.All` scope added.", "Publish and test with users who have and don't have access to items."] },
    { t: "Add Azure AI Search", path: "(agent) > Knowledge > Add knowledge > Azure AI Search", steps: ["**Create new connection**: endpoint and authentication (Entra ID integrated recommended).", "Pick the index (vectorised with integrated vectorization).", "Confirm semantic ranker is enabled; choose the citation URL field.", "Write a description of the index for the orchestrator; test with questions that need citations."] }
  ],
  ex: { q: "A bank wants its agent to answer from 15,000 Confluence policy pages (citations required, reused by Microsoft 365 Copilot), and to give account managers the live credit limit of a customer from a core-banking system whose data must never be copied.", steps: ["Confluence at scale + citations + reuse in Microsoft 365 → indexed knowledge.", "Live data + no copying + user's own access → live query under the user's identity.", "Different shelves for different needs."], a: "A **Copilot connector** for Confluence (admin-configured, indexed into Graph, citations, also available to Microsoft 365 Copilot) and a **real-time Power Platform connector** (as knowledge or as a tool) for the credit limit, running under each account manager's connection and governed by DLP." },
  fade: { q: "An agent's Azure AI Search knowledge returns answers without clickable citations.", steps: ["Citations need a URL to link to.", { ask: "What do you check in the index?", a: "That a retrievable field holds a full URL (e.g., `metadata_storage_path`) and it's selected for citations." }, { ask: "And if relevance is also poor?", a: "Check that the semantic ranker is enabled and the index uses integrated vectorization; improve chunking and the knowledge description." }] },
  traps: [
    ["Choosing a Copilot connector when data must not leave the source system.", "Copilot connectors **copy and index** content. Use a real-time connector."],
    ["Expecting makers to create Copilot connectors in Copilot Studio.", "They're configured by an **admin** in the Microsoft 365 admin center; makers add them as knowledge."],
    ["Publishing with manual auth and getting no Copilot connector results.", "Add the `ExternalItem.Read.All` Graph scope before publishing."],
    ["Pointing Azure AI Search knowledge at a keyword-only index.", "Use a vector index with integrated vectorization and enable semantic ranker."],
    ["Assuming real-time connector knowledge gives citations like documents.", "Citations aren't inherent for real-time connectors."]
  ],
  disc: [
    ["Why might an organisation prefer Azure AI Search over a Copilot connector for the same documents?", "Custom chunking and enrichment (OCR, skillsets), hybrid and vector tuning, data that isn't in Microsoft 365, existing investment, private networking needs, or using the same index from Foundry apps and agents."],
    ["How do you keep answers correct when the same fact lives in two sources?", "Pick a source of truth, remove or narrow duplicate sources, write descriptions that say which source wins, and test with evaluation sets that include conflicting cases."]
  ],
  teach: { prompt: "Compare Copilot connectors, real-time Power Platform connectors and Azure AI Search as knowledge sources.", rubric: ["Copilot connectors: admin, M365 admin center, indexed in Graph, ACLs, citations", "ExternalItem.Read.All for manual auth", "Real-time: no data movement, user identity, DLP, preview, no inherent citations", "Azure AI Search: create new connection, Entra auth, integrated vectorization, semantic ranker, URL field for citations"], model: "Copilot connectors are set up by admins in the Microsoft 365 admin center and index external content into Microsoft Graph with permissions, so they're great for large article bases with citations; with manual auth you need the ExternalItem.Read.All scope. Real-time Power Platform connectors query live systems under the user's identity without copying data, governed by DLP, but citations aren't built in. Azure AI Search plugs in an existing vector index: create a new connection with Entra ID auth, use integrated vectorization and the semantic ranker, and map a URL field for citations." },
  qa: [["Where are Copilot connectors configured?", "Microsoft 365 admin center (by an admin)."], ["Graph scope needed with manual auth?", "`ExternalItem.Read.All`."], ["Real-time connectors copy data?", "**No**; live calls under the user's identity."], ["Azure AI Search auth recommended?", "Microsoft Entra ID integrated."], ["Index requirement for Azure AI Search knowledge?", "Vector index with integrated vectorization; semantic ranker enabled."], ["Field used for citation links?", "A full-URL field such as `metadata_storage_path`."]],
  quiz: [
    { q: "A company must ground answers on 50,000 Jira and Confluence pages, reuse the same content in Microsoft 365 Copilot, and show citations. What should the admin set up?", o: ["A real-time Power Platform connector", "Copilot connectors in the Microsoft 365 admin center", "An agent flow that copies pages into Dataverse", "A REST API tool"], a: 1, e: "Copilot connectors index external content into Microsoft Graph with citations and reuse across Microsoft 365.", tp: "Copilot connectors" },
    { t: "yn", q: "Evaluate each statement about real-time Power Platform connectors used as knowledge.", s: [["They copy the source data into Microsoft Graph.", false], ["Calls run under the user's connection and identity.", true], ["Power Platform DLP policies govern them.", true]], e: "No data movement; user identity; DLP applies.", tp: "Real-time knowledge" },
    { t: "ms", q: "An agent uses Azure AI Search knowledge, but relevance is poor and citations are missing. Which TWO actions address this?", o: ["Enable the semantic ranker and use a vector index with integrated vectorization", "Map a field containing a full URL (e.g., metadata_storage_path) for citations", "Switch the agent to classic orchestration", "Add more trigger phrases", "Lower content moderation"], a: [0, 1], e: "Semantic ranker + integrated vectorization improve retrieval; a URL field enables citations.", tp: "Azure AI Search" },
    { q: "An agent with manual authentication returns no results from a Copilot connector after publishing, though it works for admins in testing. What's the MOST likely fix?", o: ["Recreate the connector as a custom connector", "Add the ExternalItem.Read.All Graph scope to the authentication settings and republish", "Turn off authentication", "Move the agent to the default environment"], a: 1, e: "Copilot connector results need the ExternalItem.Read.All scope when using manual auth.", tp: "Copilot connectors" },
    { t: "match", q: "Match each requirement to the knowledge option.", pairs: [["Data must never be replicated; live order status", "Real-time Power Platform connector"], ["Existing vector index with custom chunking", "Azure AI Search"], ["Indexed ServiceNow KB with citations across Microsoft 365", "Copilot connector"], ["Team site where users should only see pages they can open", "SharePoint"]], extra: ["Send HTTP request"], e: "Live/no copy → real-time; your index → Azure AI Search; indexed external KB → Copilot connector; Microsoft 365 files → SharePoint.", tp: "Knowledge choice" },
    { q: "Who typically creates a Copilot connector connection to Confluence?", o: ["Any maker in Copilot Studio", "A Microsoft 365 administrator in the Microsoft 365 admin center", "The Confluence end users", "Azure subscription owners in the Azure portal"], a: 1, e: "Copilot connectors are configured by admins in the Microsoft 365 admin center.", tp: "Copilot connectors" }
  ],
  src: [["Copilot connectors vs Power Platform connectors as knowledge", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-graph-vs-power-platform-connectors"], ["Knowledge sources summary", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-copilot-studio"], ["Add Azure AI Search as a knowledge source", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/knowledge-azure-ai-search"], ["Troubleshoot enterprise knowledge sources", "https://learn.microsoft.com/en-us/troubleshoot/power-platform/copilot-studio/knowledge/enterprise-data"]]
},
{
  id: "k02", d: "d2", t: "Connector tools, custom connectors and REST APIs", min: 85,
  hook: "Tools are how agents *act*. The exam names two skills here: **add a tool by using an existing custom connector** and **add REST APIs to an agent**. Behind both sit the same tool settings: description, inputs, credentials, confirmation and completion.",
  pre: { q: "A tool's input is set to *Dynamically fill with AI*. What does that mean, and when would you override it?", a: "The orchestrator extracts the value from the conversation (or asks the user). Override with a **custom value** (fixed value, variable or Power Fx) when the value must not come from the user, e.g., the signed-in user's email or a fixed region code." },
  story: [
    "Contoso's warehouse system has an OpenAPI description. The Power Apps team already built a **custom connector** for it last year, used by a stock app and two flows. Asha doesn't build anything new: in the agent she opens **Tools > Add a tool**, filters by **Custom connector**, picks *Get stock level*, and the existing connector becomes a tool.",
    "She tunes the tool. The **name** and **description** say exactly when to use it (\"Use to check current stock of a product at a store; needs product SKU and store ID\"), because generative orchestration chooses tools by description. Inputs: SKU is *dynamically filled with AI*; store ID is a **custom value** from `Global.StoreId`, so users can't ask about other stores. Credentials: **maker-provided**, a read-only service account, because store staff don't have their own warehouse logins.",
    "For *Reserve stock*, which changes data, she turns on **Ask the end user before running**, so the agent confirms before acting. Under **Completion** she chooses *Write the response with generative AI* for friendly replies, and exposes only the output fields the agent needs.",
    "A month later the carrier team gives her an OpenAPI file for their tracking API, used by nobody else. Building a custom connector would be overkill. She adds a **REST API** tool: uploads the specification, chooses **OAuth 2.0** authentication, and selects only the two endpoints the agent needs. Each selected operation becomes a tool with its own description.",
    "The custom connector itself still matters for ALM: it's in the solution, shared with the makers who need it (*Can use*/*Can edit*), and DLP has it in the Business group. The REST API tool lives inside the agent and moves with the agent's solution."
  ],
  breaks: "Tool descriptions aren't documentation for humans; they're instructions for a model. Ten tools with overlapping descriptions route worse than five precise ones, and too many tools in one agent hurts accuracy long before the hard limit.",
  dia: [
    { type: "layers", cap: "Tool settings that matter", rows: [["Name + description", "the orchestrator's main routing signal: what it does, when to use it, what it needs"], ["Allow agent to decide dynamically", "on = orchestrator may call it; off = only when a topic calls it"], ["Inputs", "Dynamically fill with AI (default), Customize (description, entity, retries, validation), or Custom value (value, variable, Power Fx)"], ["Credentials", "End user (default) or Maker-provided"], ["Ask the end user before running", "confirmation before acting (default No)"], ["Completion", "Don't respond (default), write the response with generative AI, send specific response, send an adaptive card; choose outputs"]] },
    { type: "tree", cap: "Custom connector or REST API tool?", root: { q: "Who else needs this API?", c: [["Apps, flows or other agents too", "Custom connector (Power Platform asset, shareable, DLP-governed)"], ["Only this Copilot Studio agent", { q: "Do you have an OpenAPI description?", c: [["Yes", "REST API tool (select only needed endpoints)"], ["No, one call in one topic", "Send HTTP request node"]] }]] } }
  ],
  keys: [
    "Tool types at agent level: **prebuilt connector**, **custom connector**, **REST API**, **agent flow**, **prompt**, **Model Context Protocol**, **computer use** (plus Azure Bot Service skills and client tools).",
    "Add: agent > **Tools > Add a tool** > type > configure > Save > *Add and configure*. Topic level: **Add node > Add a tool**.",
    "**Description** drives selection under generative orchestration: say what it does, when to use it and what it needs.",
    "**Allow agent to decide dynamically when to use this tool**: off means topic-only (useful when a tool exists on both a parent and a child agent).",
    "Inputs: **Dynamically fill with AI** (default) → extracted from context or asked; **Customize** (display name/description, *Identify as* entity, retry logic, validation); **Custom value** (value, variable, Power Fx) to lock values.",
    "Credentials: **End user** (default) or **Maker-provided**. Premium connectors need licences; admins can block maker credentials.",
    "**Ask the end user before running** (default No): confirmation before side-effects.",
    "**Completion**: Don't respond (default), Write the response with generative AI, Send specific response, Send an adaptive card; choose which outputs are available.",
    "Limits: up to **128 tools** per agent with generative orchestration; Microsoft recommends **25–30** for best results (child agents have their own 128).",
    "**Custom connectors**: built from an OpenAPI file/URL, Postman collection or from blank; auth: no auth, basic, API key, OAuth 2.0; optional code transforms; share (Can use / Can edit), connections shared separately; include in a **solution** to move between environments.",
    "**REST API tool**: Copilot Studio only; OpenAPI v2 (Swagger) JSON, v3 converted; auth None, API key or OAuth 2.0; select only the endpoints the agent needs; each operation's summary/description guides the orchestrator."
  ],
  cmp: [{ cap: "Custom connector vs REST API tool", head: ["", "Custom connector", "REST API tool"], rows: [["Lives in", "Power Platform (environment/solution)", "The Copilot Studio agent"], ["Reused by apps, flows, other agents", "Yes", "No"], ["Definition", "OpenAPI / Postman / blank; policies; code", "OpenAPI spec upload"], ["Auth", "None, Basic, API key, OAuth 2.0", "None, API key, OAuth 2.0"], ["Governance", "DLP connector policy; sharing", "Agent's solution and DLP for HTTP/connectors"], ["Choose when", "Shared enterprise API", "Quick, agent-only integration"]] }],
  code: [{ t: "OpenAPI operation that becomes a good tool (Swagger 2.0 excerpt)", lang: "yaml", src: `paths:
  /stock/{sku}:
    get:
      operationId: GetStockLevel
      summary: Get stock level for a product at a store
      description: Use when the user asks if a product is in stock or how many units a store has. Needs the product SKU and the store ID.
      parameters:
        - name: sku
          in: path
          required: true
          type: string
          description: Product SKU, e.g. KET-1042
        - name: storeId
          in: query
          required: true
          type: string
          description: Store identifier such as STR-07
      responses:
        '200':
          description: Stock level
          schema:
            type: object
            properties:

{
  id: "k03", d: "d2", t: "MCP tools", min: 70,
  hook: "**Model Context Protocol (MCP)** lets one server offer a catalogue of tools to many agents and clients. The exam tests how to connect a server, which transport and auth options work, which tools to allow, and what MCP can't do in Copilot Studio.",
  pre: { q: "You connect an MCP server with 14 tools, including *send_email* and *delete_file*. Your agent must be read-only. What do you change?", a: "Turn off **Allow all** for the server and enable only the read tools (or disable the action-shaped ones individually). Otherwise new and risky tools are available to the orchestrator automatically." },
  story: [
    "Contoso's platform team runs an **MCP server** that wraps their inventory, pricing and promotions systems. The store agent, a VS Code coding assistant and a Foundry agent all use it. When the team adds a tool, every client sees it without anyone editing their agents. That's the appeal: **one server, many clients, tools discovered automatically**.",
    "Asha connects it from **Tools > Add a tool > New tool > Model Context Protocol**: a name, a **description** (the orchestrator reads it), the **server URL**, and authentication: none for the public demo, **API key** for test, **OAuth 2.0** for production. The server must speak **Streamable HTTP**; old SSE-only servers won't connect.",
    "Copilot Studio lists the server's **tools** (and resources). Their names and descriptions come from the server and are read-only in Copilot Studio; if a description is bad, the platform team fixes it on the server. Asha turns off **Allow all**, which would auto-enable future tools, and enables only *get_stock*, *get_price* and *list_promotions*.",
    "She also tries Microsoft's prebuilt MCP connectors: **Work IQ** (cross-source workplace context from Microsoft 365) and Dataverse. In Preview the first call asks for consent (*Permission required*) and she approves.",
    "One limitation surprises her: she wanted to call *get_price* from inside a topic at a fixed step. Topics can't call MCP tools; MCP tools are selected by **generative orchestration**. For that fixed step she uses the pricing **connector** instead."
  ],
  breaks: "MCP standardises *how* tools are described and called, not whether they're safe. A malicious or careless server can expose dangerous tools or poisoned descriptions. Treat MCP servers like any third-party integration: trusted sources, least privilege, allow-listed tools, monitoring.",
  dia: [
    { type: "hub", cap: "One MCP server, many clients", core: "MCP server (Streamable HTTP)", spokes: [["Copilot Studio agent", "tools selected by generative orchestration"], ["Foundry agent", "MCP tool with approvals"], ["VS Code / GitHub Copilot", "developer tools"], ["Microsoft 365 Copilot", "via agents and connectors"], ["Server owns", "tool names, descriptions, schemas, auth"]] },
    { type: "seq", cap: "Connecting and using an MCP server in Copilot Studio", actors: ["Maker", "Copilot Studio", "MCP server", "User"], msgs: [["Maker", "Copilot Studio", "Add tool: name, description, URL, auth"], ["Copilot Studio", "MCP server", "Discover tools (and resources)"], ["MCP server", "Copilot Studio", "Tool list with descriptions", true], ["Maker", "Copilot Studio", "Allow all off; enable selected tools"], ["User", "Copilot Studio", "\"Is SKU KET-1042 in stock at STR-07?\""], ["Copilot Studio", "MCP server", "Call get_stock(sku, store)"], ["MCP server", "Copilot Studio", "Result", true]] }
  ],
  keys: [
    "MCP = open protocol for exposing **tools** (and **resources**) to AI clients. In Copilot Studio: tools and resources supported; **prompts** are not.",
    "Transport: **Streamable HTTP** only (SSE isn't supported).",
    "Add: **Tools > Add a tool > New tool > Model Context Protocol**: server name, **description**, server URL, authentication. Behind the scenes this creates a connector (custom connector) for the server.",
    "Authentication: **None**, **API key** (header preferred, or query; each user may supply their own key), **OAuth 2.0**: *Dynamic discovery* (DCR + discovery), *Dynamic* (DCR with manual auth/token URLs) or *Manual* (client ID/secret, authorization, token and refresh URLs, scopes; register the callback URL).",
    "Tool names and descriptions are **read-only** in Copilot Studio (the server owns them).",
    "**Allow all** toggle: on = all current *and future* server tools are enabled; off = choose tools individually. For governance, turn it off and enable only what's needed.",
    "MCP tools need **generative orchestration**; **topics can't call MCP tools**.",
    "Prebuilt MCP connectors include Dataverse, Dynamics 365 (Sales, Service, Finance), Outlook, Teams, GitHub and **Work IQ** (preview; needs Microsoft 365 Copilot licensing).",
    "Runtime consent: users may see a *Permission required* prompt the first time a connection is used.",
    "MCP vs others: MCP = orchestrator controls tools from a shared server; A2A = delegate a whole task to another agent; connector = governed access to one system's operations."
  ],
  cmp: [{ cap: "MCP vs connector vs A2A", head: ["", "MCP server", "Connector tool", "A2A agent"], rows: [["Unit of reuse", "A server's tool catalogue", "One connector's actions", "A whole agent"], ["Who reasons", "Your agent's orchestrator", "Your agent's orchestrator", "The remote agent"], ["Discovery", "Automatic from server", "Defined in connector", "Agent card"], ["Callable from topics", "No", "Yes", "Via agent connection (orchestration)"], ["Owner of descriptions", "Server team", "You (tool settings)", "Remote agent (card)"]] }],
  code: [{ t: "Custom connector definition for an MCP server (Swagger 2.0)", lang: "yaml", src: `swagger: '2.0'
info:
  title: Contoso Inventory MCP
  description: Inventory, pricing and promotions tools for store agents.
  version: 1.0.0
host: mcp.contoso.com
basePath: /
schemes:
  - https
paths:
  /mcp:
    post:
      summary: Contoso Inventory MCP server
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      responses:
        '200':
          description: Success`, notes: [[4, "The description helps the orchestrator decide when to use this server."], [6, "The server's host; HTTPS only."], [14, "This extension marks the operation as an MCP endpoint using **Streamable HTTP**."], [15, "One operation represents the whole server; individual tools are discovered at run time."]] }],
  portal: [{ t: "Connect an MCP server", path: "(agent) > Tools > Add a tool > New tool > Model Context Protocol", steps: ["Enter server name, **description** and server URL (Streamable HTTP).", "Choose authentication: None / API key / OAuth 2.0 (dynamic discovery, dynamic or manual).", "Create the connection (consent if prompted).", "Review discovered tools; turn **Allow all** off and enable only the tools you need.", "Test in the test pane / Preview; approve *Permission required* if shown."] }],
  ex: { q: "A read-only HR assistant must use Work IQ for meeting and document context, but must never send email or schedule meetings, and should stay safe when Microsoft adds new Work IQ tools.", steps: ["Work IQ exposes many tools, some of which act.", "New tools could appear later.", "Read-only must be enforced, not just requested."], a: "Add **Work IQ** as an MCP tool, turn **Allow all** off, enable only read/search tools, leave action-shaped tools (send, schedule, delete) off, state read-only scope in instructions, and re-audit the tool inventory after updates." },
  fade: { q: "A maker wants a topic node to call an MCP tool at step 3 of a scripted flow.", steps: ["Topics can't call MCP tools.", { ask: "What are the options?", a: "Call the same capability through a connector, REST API tool or agent flow from the topic; or redesign so the orchestrator chooses the MCP tool (generative orchestration)." }, { ask: "What would you tell the server team?", a: "If a step must be deterministic, consider also exposing it as a connector/API; MCP suits orchestrator-driven use." }] },
  traps: [
    ["Connecting an SSE-only MCP server.", "Copilot Studio needs **Streamable HTTP**."],
    ["Editing MCP tool descriptions in Copilot Studio.", "They're read-only; change them on the server."],
    ["Leaving **Allow all** on for a governed agent.", "Future tools are enabled automatically; turn it off and pick tools."],
    ["Calling MCP from a topic.", "Not supported; MCP needs generative orchestration."],
    ["Expecting MCP **prompts** to appear.", "Tools and resources are supported; prompts aren't."]
  ],
  disc: [
    ["What makes an MCP server trustworthy enough for production?", "Known owner and hosting, HTTPS with OAuth, least-privilege tools, versioned and reviewed descriptions (to avoid tool poisoning), logging, rate limits, and a change process so new tools are reviewed before you enable them."],
    ["Why might a platform team prefer MCP over publishing 20 connectors?", "One server serves Copilot Studio, Foundry, IDEs and other clients; tools are discovered automatically; and the team controls descriptions centrally. Connectors still win for deterministic topic steps and Power Platform reuse."]
  ],
  teach: { prompt: "Explain how to add an MCP server to a Copilot Studio agent and how to keep it governed.", rubric: ["Tools > Add a tool > MCP: name, description, URL", "Streamable HTTP", "Auth: none / API key / OAuth 2.0 variants", "Tools discovered; descriptions read-only", "Allow all off; enable selected tools", "Generative orchestration required; no topic calls"], model: "I add a new Model Context Protocol tool with a name, a clear description and the server URL, which must use Streamable HTTP. I choose authentication: none, an API key, or OAuth 2.0 with dynamic discovery, dynamic or manual settings. Copilot Studio discovers the server's tools and resources, whose descriptions are owned by the server. For governance I turn Allow all off and enable only the tools the agent needs. MCP tools are chosen by generative orchestration, so topics can't call them." },
  qa: [["Supported transport?", "**Streamable HTTP**."], ["MCP features supported?", "Tools and resources (not prompts)."], ["Can topics call MCP tools?", "**No**."], ["Allow all on means?", "All current and future server tools enabled."], ["Who owns MCP tool descriptions?", "The **server** (read-only in Copilot Studio)."], ["OAuth 2.0 variants?", "Dynamic discovery, Dynamic, Manual."], ["Connector extension marking an MCP endpoint?", "`x-ms-agentic-protocol: mcp-streamable-1.0`."]],
  quiz: [
    { q: "An MCP server works with another client but fails to connect in Copilot Studio. It only offers Server-Sent Events (SSE). What's needed?", o: ["Use API key authentication", "Expose the server over Streamable HTTP", "Turn on classic orchestration", "Add the server as knowledge"], a: 1, e: "Copilot Studio supports Streamable HTTP for MCP.", tp: "Transport" },
    { t: "yn", q: "Evaluate each statement about MCP in Copilot Studio.", s: [["MCP tools can be called from a topic's Add a tool node.", false], ["Tool descriptions from the server can be edited in Copilot Studio.", false], ["With Allow all on, new tools added to the server become available automatically.", true]], e: "No topic calls; descriptions are read-only; Allow all includes future tools.", tp: "MCP behaviour" },
    { t: "ms", q: "A governed, read-only agent uses a vendor MCP server with 25 tools. Which TWO actions should you take?", o: ["Turn off Allow all", "Enable only the read/search tools individually", "Enable classic orchestration", "Rename the tools in Copilot Studio", "Use SSE transport"], a: [0, 1], e: "Disable Allow all and enable only needed tools.", tp: "Governance" },
    { t: "drop", q: "Complete the connector definition so Copilot Studio treats the endpoint as an MCP server.", code: `paths:
  /mcp:
    {{0}}:
      operationId: InvokeMCP
      x-ms-agentic-protocol: {{1}}`, blanks: [{ o: ["post", "get", "delete"], a: 0 }, { o: ["mcp-streamable-1.0", "mcp-sse-1.0", "a2a-1.0"], a: 0 }], e: "The MCP operation is a POST marked with `x-ms-agentic-protocol: mcp-streamable-1.0`.", tp: "MCP connector" },
    { t: "match", q: "Match each MCP authentication option to its description.", pairs: [["User or maker supplies a key in a header", "API key"], ["Client registers itself and discovers endpoints automatically", "OAuth 2.0 – Dynamic discovery"], ["You enter client ID, secret, auth and token URLs, scopes", "OAuth 2.0 – Manual"], ["Public demo server", "None"]], extra: ["Certificate pinning"], e: "Copilot Studio offers None, API key and three OAuth 2.0 modes.", tp: "MCP auth" },
    { q: "Which is TRUE about choosing MCP vs A2A?", o: ["MCP delegates a whole task to another agent's reasoning", "MCP exposes tools your orchestrator calls; A2A delegates a task to another agent", "A2A is required for any tool call", "MCP only works for knowledge"], a: 1, e: "MCP = tools under your orchestrator; A2A = delegate to an opaque agent.", tp: "Protocols" }
  ],
  src: [["Extend your agent with Model Context Protocol", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/agent-extend-action-mcp"], ["Work IQ in Copilot Studio (preview)", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/add-work-iq"], ["Model Context Protocol specification", "https://modelcontextprotocol.io/"], ["AB-620T00 lab 3.2: MCP as a tool", "https://github.com/MicrosoftLearning/AB-620T00_build_integrated_ai_agents_in_copilot_studio/blob/main/Instructions/Labs/lab-3-integrate-knowledge-and-tools/exercise-2-mcp-as-tool.md"]]
},
{
  id: "k04", d: "d2", t: "Computer use", min: 60,
  hook: "Some systems have no API at all, just a screen. **Computer use** lets an agent operate websites and Windows apps like a person. The exam asks how to configure it safely (credentials, allowed sites, supervision), where it runs, and how to monitor runs.",
  pre: { q: "A computer use tool must enter invoices into a supplier portal that needs a login. Where should the password live, and how do you stop the agent wandering to other websites?", a: "In **stored credentials** (in Copilot Studio or **Azure Key Vault**), not in instructions. Restrict navigation with **allowed websites/apps**, and add **human supervision** for risky steps." },
  story: [
    "Contoso's oldest supplier only offers a web portal from 2009. Every day someone copies 40 delivery notes into it by hand. No API, no connector, no export. Asha adds a **computer use** tool.",
    "The tool gets **instructions** like a job aid for a temp worker: the full portal URL, then explicit steps (\"Select *New delivery*, enter the PO number in *Reference*, ...\"). **Inputs** carry the data for each run (PO number, quantity, date). The portal password goes into **stored credentials**, kept in Copilot Studio or **Azure Key Vault**, never in the prompt.",
    "She restricts **allowed websites** to the portal's domain, so the agent can't interact with anything else. She also enables **human supervision**, so the agent can email a named reviewer for confirmation and stops if nobody answers before the timeout. Because supervision is triggered by the model (it may not fire every time), the £10,000 rule itself is enforced by a deterministic approval in the agent flow before the computer use step runs.",
    "Where does it run? For a prototype, the **hosted browser** (preview; not Entra joined, not for production). For production the GA option is **bring-your-own machine**: register a machine with **Power Automate desktop** and the machine runtime app; runs on one machine are queued one at a time. A **Cloud PC pool** (Windows 365 for Agents) is Entra joined, Intune enrolled and auto-scales, but it's still **preview** (checked 2 Oct 2026).",
    "Every run leaves a trail: in the agent's **Activity**, Asha opens a run and replays **screenshots** with the agent's reasoning for each step. Logs are stored in **Dataverse** (with configurable retention and verbosity), and Purview captures audit events. When the portal's layout changes, the replay shows exactly where the agent got confused."
  ],
  breaks: "Computer use is powerful but slow, costly per step and brittle to UI changes. It's the last rung of the integration ladder, used when there is genuinely no API, connector or RPA flow, and it shouldn't run unsupervised on high-impact actions.",
  dia: [
    { type: "flow", cap: "A computer use run", steps: [["Tool called", "by the orchestrator with inputs"], ["Observe", "screenshot of the screen"], ["Reason", "CUA model decides the next action"], ["Act", "click, type, scroll on allowed sites/apps"], ["Supervise", "optional human approval at risky steps"], ["Finish", "outputs back to the agent; run logged"]], loop: "Observe → reason → act repeats until the task is done or stopped" },
    { type: "layers", cap: "Where computer use runs", rows: [["Hosted browser (preview)", "Microsoft-hosted; quick prototyping; not Entra joined; not for production"], ["Cloud PC pool (preview)", "Windows 365 for Agents; Entra joined + Intune enrolled; auto-scales"], ["Bring your own machine (GA)", "Power Automate desktop (2.61+) + machine runtime app; registered; enable for computer use; runs queued"]] }
  ],
  keys: [
    "Add: **Tools > Add a tool > New tool > Computer use**. Requires **generative orchestration**.",
    "Configure: **instructions** (full URLs, explicit steps, what *done* looks like), **inputs**, model choice (computer-using agent models), **stored credentials** (in Copilot Studio or **Azure Key Vault**; maker or end-user credentials), **allowed websites and apps**, **enforce HTTPS**, **human supervision** (reviewer by email, timeout; model-triggered and probabilistic, so not a fail-safe).",
    "Allowed websites/apps restrict what the agent can **interact with**; they're a key guardrail.",
    "Runtime: **hosted browser** (preview; prototyping only), **Cloud PC pool** (preview; Windows 365 for Agents; Entra joined, Intune enrolled, auto-scales), **bring-your-own machine** (GA; Power Automate desktop + machine runtime app; register and enable for computer use; runs queue sequentially per machine).",
    "Monitoring: agent **Activity** > run > activity map/transcript, **session replay screenshots** with reasoning and coordinates; logs stored in **Dataverse** (retention default 7 days; verbosity: all data, without screenshots, minimal); **Microsoft Purview** audit events.",
    "Billing per step in Copilot Credits; slower than API calls.",
    "Unsupported/poor targets include Electron apps, Java apps, Citrix sessions, command-line tools and games.",
    "Use only when there's no API/connector; prefer APIs, connectors or desktop flows (RPA) for stable, high-volume work."
  ],
  cmp: [{ cap: "Computer use vs desktop flow (RPA) vs connector", head: ["", "Connector / API", "Desktop flow (RPA)", "Computer use"], rows: [["Needs an API", "Yes", "No", "No"], ["Handles UI changes", "N/A", "Breaks (scripted selectors)", "Adapts (vision + reasoning), but can err"], ["Speed and cost", "Fast, cheap", "Fast once built", "Slow, credits per step"], ["Best for", "Anything with an API", "Stable, repetitive UI tasks", "Variable UI tasks without APIs"]] }],
  code: [{ t: "Computer use instructions (good pattern)", lang: "text", src: `Goal: record a delivery in the supplier portal.

1. Go to https://portal.supplier.example/deliveries (sign in with the stored credential "SupplierPortal").
2. Select "New delivery".
3. Enter {poNumber} in "Reference", {quantity} in "Units", {deliveryDate} in "Date" (format DD/MM/YYYY).
4. Select "Save". Wait for the confirmation banner.
5. Return the confirmation number shown in the banner as output "confirmationNumber".

Stop and report an error if the PO number is not found. Never change existing deliveries.`, notes: [[3, "Full URL and the name of the stored credential, never the password itself."], [5, "Inputs inserted by name; specify formats the site expects."], [7, "Say how to recognise success."], [9, "Boundaries: what to do on failure, what never to touch."]] }],
  portal: [
    { t: "Configure a computer use tool", path: "(agent) > Tools > Add a tool > New tool > Computer use", steps: ["Write instructions with full URLs and explicit steps; define inputs and outputs.", "Choose where it runs: hosted browser (prototype), Cloud PC pool, or your registered machine.", "Add stored credentials (Copilot Studio or Azure Key Vault).", "Set **allowed websites/apps**, enforce HTTPS, and human supervision (reviewer, timeout).", "Test, then review the run's screenshots in Activity."] },
    { t: "Monitor runs", path: "(agent) > Activity > (session) > computer use step", steps: ["Open the run's activity map and transcript.", "Replay screenshots step by step with reasoning and coordinates.", "Check logs stored in Dataverse (retention/verbosity settings) and Purview audit for compliance."] }
  ],
  ex: { q: "Finance wants the agent to update vendor bank details in a legacy web app with no API. Design computer use safely.", steps: ["High-impact change → supervision and tight scope.", "Credentials and sites must be controlled.", "Production needs managed machines and auditability."], a: "Computer use with explicit instructions, **stored credentials in Azure Key Vault**, **allowed websites** limited to the app's domain, a **deterministic approval** before every bank-detail change (plus **human supervision**, which is model-triggered), running on a **registered machine** (GA) or a **Cloud PC pool** (preview; Entra joined, Intune enrolled), with logs in Dataverse and Purview audit; evaluate with test runs before go-live." },
  fade: { q: "Computer use runs fail when the portal adds a cookie banner.", steps: ["The agent stops at an unexpected screen.", { ask: "Where do you see what happened?", a: "Session replay screenshots in the run's Activity details." }, { ask: "How do you fix it?", a: "Update instructions: \"If a cookie banner appears, select *Accept necessary cookies* and continue,\" and keep the domain in allowed websites; retest." }] },
  traps: [
    ["Putting passwords in computer use instructions.", "Use stored credentials (Copilot Studio or Key Vault)."],
    ["Using the hosted browser for production with corporate identity.", "It's for prototyping and isn't Entra-joined; use a Cloud PC pool or registered machine."],
    ["Picking computer use when a connector exists.", "APIs/connectors are faster, cheaper and more reliable."],
    ["Expecting topics with classic orchestration to run computer use.", "Computer use needs generative orchestration."],
    ["Relying on human supervision alone for irreversible actions.", "It's model-triggered and not a fail-safe; put a deterministic approval before high-impact steps."]
  ],

{
  id: "m01", d: "d2", t: "Multi-agent design: child and connected agents", min: 85,
  hook: "*Design multi-agent solutions* and *integrate an existing agent* are core D2 skills. Most questions hinge on one distinction: a **child agent** lives inside its parent and ships with it; a **connected agent** is published separately, owned separately and reused by others.",
  pre: { q: "The warehouse team owns a *Fulfilment* agent with its own release schedule. The store agent must hand shipment questions to it. Child or connected?", a: "**Connected**: it's separately published and owned, with its own lifecycle, and other agents can reuse it. A child agent would live inside the store agent's solution and release with it." },
  story: [
    "Asha's store agent has grown to 34 tools and keeps picking the wrong one for returns versus shipments. Daniel's advice: \"Don't add more instructions. **Split** it, but only along real seams.\"",
    "The returns logic belongs to Asha's team and changes with every release of the store agent, so she creates a **child agent** *Returns specialist* inside the store agent: its own instructions, its own tools (the three returns flows) and knowledge, but the **same conversation context** and the **same solution**. It can't be published on its own. The parent invokes it when *the agent chooses based on description*; she writes that description carefully so it doesn't overlap with others.",
    "Shipments are different. The warehouse team already runs a published **Fulfilment agent** with its own environment roles, model settings and release cadence. They turn on *Let other agents connect to and use this one*, share it with Asha, and she adds it as a **connected agent**. Copilot Studio copies its description locally (it won't auto-update if the warehouse team changes theirs), and by default **passes the conversation history** so the specialist has context.",
    "The first end-to-end test shows a subtle bug: the parent agent still has its own copy of the *Create return* tool, and sometimes calls it directly instead of delegating. Asha clears **Allow agent to decide dynamically when to use this tool** on the parent's copy. The activity map now shows: orchestrator → Returns specialist → *Create return* flow.",
    "Daniel adds one more lesson: multi-agent isn't free. Each hop adds **latency**, **cost**, another **governance surface**, more **testing**, and separate transcripts to correlate. And the parent's maker stays **accountable** for what delegated agents do, so approvals still guard anything that writes or deletes."
  ],
  breaks: "Org charts are a poor template for agents. Splitting by department can create overlapping descriptions and endless hand-offs. Split by **capability boundaries** that really differ (ownership, security, data, release cycle, tool sets), and keep a single agent when one will do.",
  dia: [
    { type: "nest", cap: "Child agent: inside the parent", levels: [["Parent agent (one solution, one publish)", "orchestrator routes by descriptions"], ["Child agent", "own instructions, tools (up to 128), knowledge; shares conversation context"], ["Tools of the child", "only the child calls them (unless the parent also has them enabled)"]] },
    { type: "seq", cap: "Delegating to a connected agent", actors: ["User", "Store agent", "Fulfilment agent", "Shipment flow"], msgs: [["User", "Store agent", "\"Ship the replacement kettle to my new address\""], ["Store agent", "Fulfilment agent", "Delegate (description match) + conversation history"], ["Fulfilment agent", "Shipment flow", "Create shipment request"], ["Shipment flow", "Fulfilment agent", "Shipment ID", true], ["Fulfilment agent", "Store agent", "Result", true], ["Store agent", "User", "Reply with shipment ID"]] },
    { type: "tree", cap: "Child or connected?", root: { q: "Does the specialist need its own lifecycle, owner or reuse by other agents?", c: [["No: same team, same release, used only here", "Child agent"], ["Yes: separately published, owned and reused", { q: "Where does it live?", c: [["Copilot Studio, same environment", "Connected Copilot Studio agent"], ["Microsoft Foundry", "Connected Foundry agent"], ["Microsoft Fabric", "Fabric data agent"], ["Another platform/vendor", "A2A agent (or Microsoft 365 Agents SDK agent)"]] }]] } }
  ],
  keys: [
    "Start with **one agent**. Split when routing degrades (too many tools: max 128, best 25–30), when parts have **different owners, release cycles, security or model configuration**, or when a capability must be **reused** by several agents or channels.",
    "**Child agents**: Agents > Add an agent > *New child agent* (or Add node > Add an agent in a topic). Own instructions, tools, knowledge; **shared conversation context**; **same solution and lifecycle**; can't be published alone.",
    "Child agent invocation: *The agent chooses – based on description* (dynamic) or explicit triggers with conditions and priority; inputs (with descriptions, prompting rules) and outputs (become variables for the parent).",
    "After a child agent runs: **Don't respond** (default), Write the response with generative AI, Send specific response, Send an adaptive card.",
    "**Connected agents**: separately published, own orchestration and lifecycle, reusable. Copilot Studio agents must be in the **same environment**, **published**, with *Let other agents connect to and use this one* turned **on**, and shared with you.",
    "Connected agent settings: description (a **local copy**, not auto-synced), **Pass conversation history to this agent** (on by default; review privacy).",
    "Other connected agent types: **Microsoft Foundry agent**, **Fabric data agent**, **Microsoft 365 Agents SDK agent**, **A2A agent** (module m02).",
    "Patterns: **orchestrator/sub-agent** (dynamic delegation by description) vs **workflow-oriented** (deterministic serial or parallel steps through topics/flows) for compliance and audit.",
    "Avoid double routing: if a tool exists on both parent and child, clear *Allow agent to decide dynamically* on the parent's copy, or remove it.",
    "Instructions can reference tools, agents and variables with **/**; test with the **activity map**; **Disable** (keeps configuration) vs **Delete/Disconnect** (removes it; breaks redirects)."
  ],
  cmp: [{ cap: "Child vs connected agents", head: ["", "Child agent", "Connected agent"], rows: [["Where it's built", "Inside the parent agent", "Separate agent (or external platform)"], ["Publishing", "With the parent only", "Independently"], ["Lifecycle / ownership", "Same solution and team", "Own solution, team, release cadence"], ["Context", "Shares the conversation", "Receives conversation history if enabled"], ["Reuse by other agents", "No", "Yes"], ["Settings to enable", "None", "Target: *Let other agents connect*; caller: access + connection"], ["Typical use", "Split a big agent's tools and instructions", "Specialists owned by other teams; external agents"]] }],
  code: [{ t: "Parent instructions that delegate cleanly", lang: "text", src: `You are the Contoso store assistant for store staff.

Delegation:
- Returns, refunds and damaged items: use /Returns specialist. Do not call return tools yourself.
- Shipments, deliveries and address changes: use /Fulfilment agent.
- Store policies: answer from knowledge and cite the policy.

After a specialist responds, summarise the outcome in one or two sentences
and include any reference number it returned.

If a request involves both a return and a shipment, handle the return first.`, notes: [[4, "The `/` reference points at a specific child agent; be explicit about ownership."], [5, "Connected agents are referenced the same way."], [8, "Tell the orchestrator how to present delegated results."], [11, "Multi-intent ordering rules reduce surprises."]] }],
  portal: [
    { t: "Add a child agent", path: "(parent agent) > Agents > Add an agent > New child agent", steps: ["Name and **description** (when the parent should use it).", "Instructions; add the child's tools and knowledge.", "Invocation: *The agent chooses* or explicit triggers; define inputs/outputs if needed.", "Completion: choose what happens after it runs.", "Test; check the activity map; fix overlapping descriptions."] },
    { t: "Connect an existing Copilot Studio agent", path: "(target) Settings > Generative AI > let other agents connect; (caller) Agents > Add an agent > Copilot Studio", steps: ["On the target agent: turn on *Let other agents connect to and use this one*, publish, share with the caller's makers.", "On the caller: add the agent, review/adjust the description (local copy), keep or turn off *Pass conversation history*.", "Reinforce delegation in the caller's instructions.", "Test end-to-end; republish the caller."] }
  ],
  ex: { q: "A bank's main agent must handle mortgages (owned by the mortgage team, monthly releases, different security roles) and simple FAQ about branch hours (owned by the main team). Design it.", steps: ["Mortgages: different owner, cadence and security → separate agent.", "Reuse is likely (the mortgage agent could serve other channels).", "Branch FAQ: same team, trivial, no reason to split."], a: "Main agent with branch FAQ as knowledge/topics; the **mortgage agent** published separately and added as a **connected agent** (target setting on, shared, clear description, conversation history reviewed for privacy). No child agent needed unless the main agent's own tool list grows too large." },
  fade: { q: "After connecting the Fulfilment agent, the orchestrator still answers shipment questions itself.", steps: ["The orchestrator routes by description and instructions.", { ask: "What do you check first?", a: "The connected agent's **local description** (specific, non-overlapping) and the parent's instructions (explicit delegation)." }, { ask: "What if the warehouse team improved their description last week?", a: "It won't sync automatically: update the local copy in the caller (or reconnect)." }] },
  traps: [
    ["Using a child agent for a capability another team owns and releases.", "That's a connected agent."],
    ["Expecting connected agent description changes to sync.", "The caller keeps a local copy; update it manually."],
    ["Forgetting *Let other agents connect to and use this one* on the target.", "Without it (and publishing and sharing) the agent can't be connected."],
    ["Leaving the same tool enabled on parent and child.", "Clear the parent's dynamic-use toggle so the child owns it."],
    ["Splitting every department into its own agent on day one.", "Each hop adds latency, cost and governance work; split only on real seams."]
  ],
  disc: [
    ["What are the hidden costs of multi-agent designs?", "Latency per hop, more model calls and credits, more descriptions to keep non-overlapping, more surfaces to secure and govern, harder testing, and transcripts split across agents that must be correlated."],
    ["Should conversation history always be passed to connected agents?", "No. It gives context but may share personal or sensitive data with an agent owned by another team. Review data processing, minimise what's needed, and turn it off where context isn't required."]
  ],
  teach: { prompt: "Explain when to use a child agent versus a connected agent, and how to set each up.", rubric: ["Start with one agent; split on real seams", "Child: inside parent, shared context, same solution, no separate publish", "Connected: separately published, owned, reusable", "Target setting + publish + share; local description; pass history", "Avoid duplicate tools; test with activity map"], model: "I start with one agent. If it gets too many tools or needs separate instructions for one area, I add a child agent inside it: it has its own instructions and tools but shares the conversation and ships with the parent. If a capability is owned and released by another team or must be reused, I use a connected agent: the target is published with 'let other agents connect' on and shared with me; I add it, adjust its local description and decide whether to pass conversation history. Then I make sure tools aren't duplicated and test with the activity map." },
  qa: [["Can a child agent be published alone?", "**No**; it ships with its parent."], ["Target setting for connected agents?", "*Let other agents connect to and use this one*."], ["Does a connected agent's description auto-sync?", "**No**; local copy."], ["Default for passing conversation history?", "**On**."], ["Default completion after a child runs?", "**Don't respond**."], ["Recommended tools per agent?", "About **25–30** (max 128)."], ["Disable vs delete a child agent?", "Disable keeps configuration; delete removes it and breaks redirects."]],
  quiz: [
    { q: "A compliance team owns a *Policy checker* agent that three business agents must use. It's released on the compliance team's schedule. How should the business agents use it?", o: ["Copy it as a child agent into each business agent", "Add it as a connected agent in each business agent", "Merge it into one giant agent", "Call it through a Send HTTP request node"], a: 1, e: "Separately owned, released and reused → connected agent.", tp: "Child vs connected" },
    { t: "yn", q: "Evaluate each statement about child agents.", s: [["A child agent shares the parent's conversation context.", true], ["A child agent can be published independently of its parent.", false], ["Each child agent can have its own set of tools.", true]], e: "Children share context and lifecycle, with their own tools and instructions.", tp: "Child agents" },
    { t: "ord", q: "Order the steps to connect a Copilot Studio agent owned by another team.", items: ["Target team turns on *Let other agents connect to and use this one*", "Target team publishes the agent and shares it with your makers", "In your agent, add it from Agents > Add an agent", "Review its description and the conversation-history setting", "Update your instructions to delegate, test and publish"], e: "Enable, publish and share on the target; then add, configure, instruct and test on the caller.", tp: "Connected agents" },
    { t: "ms", q: "A parent agent keeps calling the *Create return* tool directly instead of delegating to its *Returns* child agent, which also has the tool. Which TWO changes fix this?", o: ["Clear *Allow agent to decide dynamically when to use this tool* on the parent's copy (or remove it)", "Make the child agent's description clearly own returns and reference it in the parent's instructions", "Turn off generative orchestration", "Publish the child agent separately", "Add trigger phrases to the tool"], a: [0, 1], e: "Stop the parent using its own copy and make delegation explicit.", tp: "Routing" },
    { q: "The Fulfilment agent's owners improved its description last week, but your orchestrator still routes poorly. Why?", o: ["Connected agents can't have descriptions", "Your agent keeps a local copy of the description that doesn't sync automatically", "Descriptions only matter for child agents", "You must enable classic orchestration"], a: 1, e: "Update the local description in your agent.", tp: "Connected agents" },
    { t: "match", q: "Match each signal to the design choice.", pairs: [["Agent has 60 tools and routes poorly", "Split into child agents"], ["Capability owned and released by another team", "Connected agent"], ["Steps must run in a fixed, auditable order", "Workflow-oriented design (topics/flows)"], ["A small FAQ addition", "Keep it in the single agent"]], extra: ["Increase temperature"], e: "Split for routing, connect for ownership, script for compliance, don't split trivially.", tp: "Multi-agent design" }
  ],
  src: [["Add other agents overview", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-add-other-agents"], ["Multi-agent orchestration patterns and best practices", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/guidance/multi-agent-patterns"], ["AB-620T00 lab 4: multi-agent solution", "https://github.com/MicrosoftLearning/AB-620T00_build_integrated_ai_agents_in_copilot_studio/tree/main/Instructions/Labs/lab-4-configure-multi-agent-solution"]]

{

  story: [

    "Finance analysts want sales figures. The BI team has a **Fabric data agent** over the sales lakehouse and a Power BI semantic model. It runs on an **F64** capacity (anything **F2 or above, or P1+**, works), is **published** with a detailed description, and lives in the same tenant. Asha adds it from **Agents > Add > Microsoft Fabric**, and chooses **User authentication** so each analyst only sees data they're allowed to read. Generative orchestration must be on, and the agent isn't supported in Microsoft 365 Copilot (validated for Teams).",

    { type: "seq", cap: "A2A call from Copilot Studio", actors: ["Copilot Studio", "Agent card", "Remote agent"], msgs: [["Copilot Studio", "Agent card", "GET {endpoint}/.well-known/agent.json"], ["Agent card", "Copilot Studio", "Name, description, skills, auth", true], ["Copilot Studio", "Remote agent", "Message: contextId, parts, full chat history"], ["Remote agent", "Copilot Studio", "Task/result (reasons with its own tools)", true]] }
  ],
  keys: [
    "**Foundry agent** (standard harness; preview): Agents > Add an agent > *Connect to an external agent* > **Microsoft Foundry** > connection with the **Foundry project endpoint URL** > **Agent ID** > name and description.",
    "The Foundry agent must have the **Activity protocol endpoint** enabled (only via REST API or Python SDK); otherwise runtime **400** errors. Only agents from the **new Foundry portal** connect (classic → *404 – Version not found*).",
    "**Fabric data agent**: needs a paid **F2+ Fabric capacity** or **Power BI Premium P1+** with Fabric enabled; data in a warehouse, lakehouse, semantic model, KQL database, mirrored database or ontology; the data agent **published** with a rich description; **same tenant**.",

{
  id: "e01", d: "d3", t: "Evaluate agents: test sets, methods, results", min: 80,
  hook: "D3 starts with **evaluation**: create a test set, choose an evaluation method, review results. The exam checks that you match the method to what you're measuring, and know the limits that make a run *invalid* or misleading.",
  pre: { q: "Your test set has questions but no expected answers. You select **Compare meaning** and every result says *Invalid*. Why?", a: "Compare meaning (like text similarity and exact match) needs an **expected response** to compare against. Without one the result is invalid. **General quality** doesn't need expected answers." },
  story: [
    "Before going live, Asha's manager asks the question every agent owner dreads: *How do you know it's good?* Asha opens the **Evaluation** page (**Evaluate** tab in the newest UI) and builds a **test set**.",
    "She starts with a **quick question set**: Copilot Studio reads the agent's description and instructions and generates 10 questions. Then a **full question set** from the returns-policy knowledge, a few questions copied from her last **test chat**, and a CSV from the support team's top real questions with **Question** and **Expected response** columns. A test set holds up to **100** cases.",
    "Now the methods. **General quality** (the default) scores each answer for qualities such as relevance, groundedness and completeness without needing expected answers. For policy questions with known answers she adds **Compare meaning** (does the answer *mean* the same?). For *\"Create a return for order 1042\"* she uses **Tool use** to check the *Create return* flow actually ran. **Keyword match** checks that refund answers mention \"14 days\". A **Custom** grader with labels *Declines appropriately* / *Answers anyway* tests that medical questions are refused, because General quality tends to penalise correct refusals. **Content safety** checks for harmful content.",
    "The agent calls tools with the user's credentials, so she sets the evaluation's **user profile** to a test account with realistic permissions. She runs it (this costs Copilot Credits, so she keeps sets focused), then drills into each failed case: the answer, the score, the reason, and the activity that produced it.",
    "Two failures share a cause: a vague knowledge description. She fixes it, re-runs the same test set, and compares runs. Results stay for **89 days**, so she exports the CSV for the release record."
  ],
  breaks: "A high score on 30 questions you wrote yourself proves little. Good test sets include real user phrasing, edge cases, adversarial and out-of-scope questions, multi-turn conversations, and cases for every tool, and they grow every time production reveals a new failure.",
  dia: [
    { type: "tree", cap: "Choosing an evaluation method", root: { q: "What are you checking?", c: [["Overall answer quality, no expected answers", "General quality (default)"], ["Same meaning as a reference answer", "Compare meaning"], ["Close wording to a reference", "Text similarity"], ["Exact value (ID, code)", "Exact match"], ["Specific words or phrases present", "Keyword match (any / all)"], ["The right tool or topic was used", "Tool use"], ["Harmful content", "Content safety"], ["Your own criterion (e.g., declines legal advice)", "Custom (instructions + pass/fail labels)"]] } },
    { type: "flow", cap: "Evaluation loop", steps: [["Build test set", "quick, full, test chat, CSV/TXT import, manual, production themes"], ["Configure", "methods per case; user profile for auth"], ["Run", "consumes Copilot Credits"], ["Review", "scores, pass/fail, reasons, activity"], ["Fix", "descriptions, instructions, knowledge, tools"], ["Re-run and compare", "export results (kept 89 days)"]], loop: "Repeat before every release and after model or knowledge changes" }
  ],
  keys: [
    "Create a test set by: **quick question set** (10 AI-generated questions from description, instructions and capabilities), **full question set** (from knowledge or topics, you choose how many), **test chat** (questions from your latest test conversation), **import** (.csv or .txt, up to 5 MB; columns *Question*, *Expected response*), **manual**, **production themes** (preview).",
    "Limits: **100 test cases** per set; **1,000 characters** per question.",
    "Methods: **General quality** (scored out of 100%; no expected answer needed), **Content safety** (pass/fail), **Compare meaning** (scored; needs expected answer), **Tool use** (pass/fail; expected tools/topics), **Keyword match** (pass/fail; any or all keywords), **Text similarity** (scored; needs expected answer), **Exact match** (pass/fail), **Custom** (your instructions and pass/fail labels).",
    "**Conversation (multi-turn) test sets** support General quality, Content safety, Keyword match and Custom; Compare meaning, Tool use, Text similarity and Exact match are single-response only.",
    "Match-type methods without expected answers → **Invalid** results.",
    "General quality can penalise appropriate refusals; use **Custom** with labels like *declines correctly* for refusal tests.",
    "Set the **user profile** (Manage profile and connections > User) so evaluations access knowledge and tools with a realistic account.",
    "Results are kept **89 days**; export to CSV for records.",
    "Evaluations consume **Copilot Credits**: keep sets focused and re-run deliberately.",
    "Use evaluations to compare **model** choices and changes: run the same set before and after; in the newest labs, evaluate a candidate model on a small subset before switching."
  ],
  cmp: [{ cap: "Evaluation methods at a glance", head: ["Method", "Needs expected answer?", "Result", "Multi-turn?"], rows: [["General quality", "No", "Score (100%)", "Yes"], ["Content safety", "No", "Pass/fail", "Yes"], ["Compare meaning", "Yes", "Score", "No"], ["Text similarity", "Yes", "Score", "No"], ["Exact match", "Yes", "Pass/fail", "No"], ["Keyword match", "Keywords", "Pass/fail", "Yes"], ["Tool use", "Expected tools/topics", "Pass/fail", "No"], ["Custom", "Your criteria + labels", "Pass/fail", "Yes"]] }],
  code: [
    { t: "Single-response test set import (CSV)", lang: "text", src: `Question,Expected response

"Do you price match competitors?","No, Contoso doesn't price match, but you can check current promotions."`, notes: [[1, "The two columns Copilot Studio expects for single-response sets."], [2, "Expected responses enable Compare meaning, Text similarity and Exact match."], [4, "Include out-of-policy questions too, so you test what the agent should *not* promise."]] },

  portal: [{ t: "Create and run an evaluation", path: "(agent) > Evaluation (new UI: Evaluate tab) > + New evaluation / test set", steps: ["Choose how to create cases: quick, full, test chat, import file, manual or themes.", "Pick methods (General quality is default); add expected answers, keywords or expected tools where needed.", "Manage profile and connections > **User**: select the test account.", "Run; review the aggregate score, then each case's result and reasoning.", "Fix issues, re-run, compare; export results (kept 89 days)."] }],

  fade: { q: "After switching the agent's model, the team wants to know if quality changed.", steps: ["Comparisons need the same inputs.", { ask: "What do you run?", a: "The same test set (same methods, same user profile) before and after the change." }, { ask: "What do you look at beyond the average?", a: "Per-case regressions (cases that passed before and fail now), tool-use failures, and refusal behaviour; then decide or roll back." }] },

  disc: [

  teach: { prompt: "Explain how you'd evaluate an agent in Copilot Studio before release.", rubric: ["Test set sources and 100-case limit", "Method choice: General quality vs match methods vs Tool use vs Custom vs Content safety", "Expected answers needed for match methods", "User profile for auth", "Review, fix, re-run; 89-day retention/export"], model: "I build test sets from generated questions, real user questions and an imported CSV with expected answers, up to 100 cases per set. I use General quality for overall answers, Compare meaning or exact/text match where I have reference answers, Tool use to check the right flow ran, Keyword match for must-have phrases, Content safety, and a Custom grader for refusals. I run it as a realistic test user, review each failure, fix descriptions or knowledge, re-run the same set, and export results because they're kept 89 days." },
  qa: [["Max cases per test set?", "**100**."], ["CSV columns for import?", "*Question*, *Expected response*."], ["Default method?", "**General quality**."], ["Methods needing expected answers?", "Compare meaning, Text similarity, Exact match."], ["Multi-turn methods?", "General quality, Content safety, Keyword match, Custom."], ["How long are results kept?", "**89 days**."], ["Where to set the test account?", "Manage profile and connections > User."]],

    { t: "match", q: "Match each goal to the evaluation method.", pairs: [["Answer must contain the phrase \"14 days\"", "Keyword match"], ["Answer must mean the same as the policy text", "Compare meaning"], ["Agent must decline legal advice", "Custom"], ["No hateful or violent content", "Content safety"]], extra: ["Exact match on every answer"], e: "Keywords → keyword match; meaning → compare meaning; refusal criteria → custom; harm → content safety.", tp: "Methods" },
    { t: "yn", q: "Evaluate each statement about test sets.", s: [["A test set can contain up to 100 test cases.", true], ["Tool use can be applied to multi-turn conversation test sets.", false], ["A quick question set generates 10 questions from the agent's description, instructions and capabilities.", true]], e: "100 max; Tool use is single-response only; quick sets generate 10.", tp: "Test sets" },
    { t: "ms", q: "Your evaluation shows many *Invalid* results and some knowledge answers fail because the evaluator can't open SharePoint. Which TWO actions fix this?", o: ["Add expected responses for cases using Compare meaning", "Select a test user account with SharePoint access in Manage profile and connections", "Switch all cases to Exact match", "Delete the knowledge source", "Increase the 1,000-character limit"], a: [0, 1], e: "Match methods need expected answers; the evaluation runs with the selected user's access.", tp: "Troubleshooting" },
