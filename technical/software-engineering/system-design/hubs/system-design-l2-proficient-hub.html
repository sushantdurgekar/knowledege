s' keys disappear. Every server checks the same key, so the limit holds across the fleet.","Refill, check and spend must be one step. With separate GET and SET calls, two servers can read the same count and both spend the same token. A Lua script (EVAL) or Redis function runs the whole thing atomically, because Redis runs one command or script at a time.","Reply 429 Too Many Requests with Retry-After when the bucket is empty. Decide what happens when Redis is unreachable: usually fail open (allow) for ordinary APIs, and fail closed for abuse-sensitive ones such as logins.","The cost is one Redis round trip per request, under a millisecond inside one zone. At very high volume, give each server a small local allowance that it syncs in batches, trading a little accuracy for fewer calls, and spread clients' keys across a Redis cluster."],"code":{"t":"Shared token count: GET then SET against one atomic step","tabs":[{"lang":"python","src":"def run(atomic, servers=3, per_server=10, tokens=10, seed=1):\n    \"\"\"Three API servers share one token count in a store such as Redis; each has 10 requests to check.\"\"\"\n    rand = mulberry32(seed)\n    store = {\"tokens\": tokens}\n    pending = [per_server] * servers              # requests each server still has to check\n    read = [None] * servers                       # a value a server has read but not yet written back\n    allowed = 0\n    while any(pending):\n        live = [s for s in range(servers) if pending[s]]\n        s = live[int(rand() * len(live))]         # the servers' steps interleave unpredictably\n        if atomic:                                # one script: read, check and write, nothing in between\n            if store[\"tokens\"] > 0:\n                store[\"tokens\"] -= 1\n                allowed += 1\n            pending[s] -= 1\n        elif read[s] is None:\n            read[s] = store[\"tokens\"]             # step 1: GET tokens\n        else:\n            if read[s] > 0:                       # step 2: decide on the value read earlier, then SET\n                store[\"tokens\"] = read[s] - 1\n                allowed += 1\n            read[s] = None\n            pending[s] -= 1\n    return allowed\n\nprint(\"GET, then SET:\", run(atomic=False), \"of 30 allowed | one atomic script:\", run(atomic=True), \"of 30 allowed | limit: 10\")\n","out":"GET, then SET: 20 of 30 allowed | one atomic script: 10 of 30 allowed | limit: 10\n"},{"lang":"javascript","src":"function run(atomic, servers = 3, perServer = 10, tokens = 10, seed = 1) {\n  // three API servers share one token count in a store such as Redis; each has 10 requests to check\n  const rand = mulberry32(seed);\n  const store = { tokens };\n  const pending = new Array(servers).fill(perServer);   // requests each server still has to check\n  const read = new Array(servers).fill(null);   // a value a server has read but not yet written back\n  let allowed = 0;\n  while (pending.some(p => p > 0)) {\n    const live = pending.map((p, s) => s).filter(s => pending[s] > 0);\n    const s = live[Math.floor(rand() * live.length)];   // the servers' steps interleave unpredictably\n    if (atomic) {                               // one script: read, check and write, nothing in between\n      if (store.tokens > 0) { store.tokens--; allowed++; }\n      pending[s]--;\n    } else if (read[s] === null) {\n      read[s] = store.tokens;                   // step 1: GET tokens\n    } else {\n      if (read[s] > 0) { store.tokens = read[s] - 1; allowed++; }   // step 2: decide on the value read earlier, then SET\n      read[s] = null;\n      pending[s]--;\n    }\n  }\n  return allowed;\n}\n\nconsole.log(\"GET, then SET:\", run(false), \"of 30 allowed | one atomic script:\", run(true), \"of 30 allowed | limit: 10\");\n","out":"GET, then SET: 20 of 30 allowed | one atomic script: 10 of 30 allowed | limit: 10\n"}]},"a":"With GET and SET as separate steps, 20 of the 30 requests get through a limit of 10: servers read the same count and each writes back the same decrement, so spent tokens are lost. Running the read, the check and the write as one atomic step, as a Redis Lua script does, allows exactly 10."},"fade":{"q":"Finish `retry(fn, rand, sleep, max_attempts, base, cap)`: call `fn`; if it raises a `TransientError`, wait a random time between 0 and min(cap, base × 2^attempt) milliseconds (full jitter) and try again, up to `max_attempts` calls in all. Any other error goes straight back to the caller, and so does the last transient one.","steps":["Loop over the attempts, and return as soon as `fn` succeeds.",{"ask":"Which errors deserve a retry?","a":"Only transient ones (TransientError here: timeouts, 503s, dropped connections). A 400 or a validation error will fail the same way again, so it goes straight back to the caller."},{"ask":"How long should each wait be?","a":"Full jitter: a random time between 0 and min(cap, base × 2^attempt), so up to 100 ms, then 200, then 400. Randomizing spreads out clients that failed together, and the cap bounds the longest wait."},{"ask":"What's the cost, and what else does production code need?","a":"At most max_attempts calls and a bounded total wait. Real code also stops when the request's deadline would pass, honours Retry-After, keeps a retry budget across requests, and retries only idempotent operations."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class TransientError(Exception):\n    \"\"\"A failure worth retrying: a timeout, a 503, a dropped connection.\"\"\"\n\ndef retry(fn, rand, sleep, max_attempts=4, base=100, cap=2000):\n    for attempt in range(max_attempts):\n        ...                                       # TODO: call fn; on TransientError wait (full jitter) and loop, or re-raise\n"},{"lang":"javascript","src":"class TransientError extends Error {}         // a failure worth retrying: a timeout, a 503, a dropped connection\n\nfunction retry(fn, rand, sleep, maxAttempts = 4, base = 100, cap = 2000) {\n  for (let attempt = 0; ; attempt++) {\n    // TODO: call fn; on TransientError wait (full jitter) and loop, or rethrow\n  }\n}\n"}]},"solution":{"t":"Solution: transient errors only, full jitter, a cap on attempts","tabs":[{"lang":"python","src":"class TransientError(Exception):\n    \"\"\"A failure worth retrying: a timeout, a 503, a dropped connection.\"\"\"\n\ndef retry(fn, rand, sleep, max_attempts=4, base=100, cap=2000):\n    for attempt in range(max_attempts):\n        try:\n            return fn()\n        except TransientError:                    # anything else isn't caught, so it isn't retried\n            if attempt == max_attempts - 1:\n                raise                             # out of attempts: let the caller see the error\n            sleep(int(rand() * min(cap, base * 2 ** attempt)))   # full jitter, in milliseconds\n\nreplies = iter([\"timeout\", \"timeout\", \"ok\"])\ndef flaky():\n    reply = next(replies)\n    if reply == \"timeout\":\n        raise TransientError(reply)\n    return reply\n\nwaits = []\nprint(\"result:\", retry(flaky, mulberry32(5), waits.append), \"| waited (ms):\", *waits)\n\ndef bad_request():\n    raise ValueError(\"400 bad request\")\ntry:\n    retry(bad_request, mulberry32(5), waits.append)\nexcept ValueError as err:\n    print(\"not retried:\", err, \"| waits so far:\", len(waits))\n\ncalls = []\ndef down():\n    calls.append(1)\n    raise TransientError(\"503\")\ntry:\n    retry(down, mulberry32(5), waits.append)\nexcept TransientError as err:\n    print(\"gave up after\", len(calls), \"attempts:\", err)\n","out":"result: ok | waited (ms): 68 154\nnot retried: 400 bad request | waits so far: 2\ngave up after 4 attempts: 503\n"},{"lang":"javascript","src":"class TransientError extends Error {}         // a failure worth retrying: a timeout, a 503, a dropped connection\n\nfunction retry(fn, rand, sleep, maxAttempts = 4, base = 100, cap = 2000) {\n  for (let attempt = 0; ; attempt++) {\n    try {\n      return fn();\n    } catch (err) {\n      if (!(err instanceof TransientError)) throw err;   // not worth retrying: fail at once\n      if (attempt === maxAttempts - 1) throw err;          // out of attempts: let the caller see the error\n      sleep(Math.floor(rand() * Math.min(cap, base * 2 ** attempt)));   // full jitter, in milliseconds\n    }\n  }\n}\n\nconst replies = [\"timeout\", \"timeout\", \"ok\"];\nfunction flaky() {\n  const reply = replies.shift();\n  if (reply === \"timeout\") throw new TransientError(reply);\n  return reply;\n}\n\nconst waits = [];\nconsole.log(\"result:\", retry(flaky, mulberry32(5), w => waits.push(w)), \"| waited (ms):\", ...waits);\ntry {\n  retry(() => { throw new Error(\"400 bad request\"); }, mulberry32(5), w => waits.push(w));\n} catch (err) {\n  console.log(\"not retried:\", err.message, \"| waits so far:\", waits.length);\n}\nlet calls = 0;\ntry {\n  retry(() => { calls++; throw new TransientError(\"503\"); }, mulberry32(5), w => waits.push(w));\n} catch (err) {\n  console.log(\"gave up after\", calls, \"attempts:\", err.message);\n}\n","out":"result: ok | waited (ms): 68 154\nnot retried: 400 bad request | waits so far: 2\ngave up after 4 attempts: 503\n"}]}},"traps":[["“Rate limit by IP address.”","Many users can share one IP (offices, mobile carriers), and one attacker can use thousands. Limit by API key or user where you can, and keep IP limits as a coarse outer layer."],["“Just retry on errors.”","Retrying a non-idempotent call can double a payment, a 400 will never succeed, and retries at every layer multiply the load on a struggling service. Retry transient errors only, with backoff, jitter and a budget, at one layer."],["“Exponential backoff is enough.”","Clients that failed together back off by the same amounts and come back together, in synchronized waves. Jitter, a random part in each wait, spreads them out."],["“Long timeouts are safer: the call will succeed eventually.”","While it waits, the caller holds a thread, a connection and memory; enough slow calls exhaust them and the caller fails too. Set timeouts from the dependency's real latency, and pass deadlines down the call chain."],["“A circuit breaker fixes the failing service.”","It protects the caller and gives the dependency room to recover, but users still see errors unless there's a fallback: a cached result, a default, or a feature that degrades gracefully."],["“Each server can keep its own counter.”","With N servers behind a load balancer, a client gets up to N times the limit. Share the counters (Redis, updated atomically), give each server limit/N as an approximation, or route each client to one server."]],"disc":[["Where would you put rate limiting in a system with an API gateway, ten services and a database?","At the edge (the gateway or load balancer) for per-client limits and abuse protection, so excess requests are rejected cheaply before any work is done. Inside, each service protects itself with concurrency limits and load shedding, because internal callers can overload it too. In front of the database, connection pools are a natural limit. Edge limits are about fairness; the inner ones are about survival."],["Your product page calls a recommendations API that sometimes slows to 10 seconds. The page can live without recommendations. How do you design the call?","A short timeout (say 300 ms, from its normal p99), no retries or a single one with jitter, a circuit breaker that opens after a run of failures, and a fallback: popular items from a cache, or no recommendations section at all. Run the call on its own bounded pool (a bulkhead) so that slow recommendations can't hold up the rest of the page, and monitor how often the fallback is used."]],"teach":{"prompt":"Explain to a junior colleague how a token bucket works, and how timeouts, retries and a circuit breaker protect a service from a failing dependency.","rubric":["Token bucket: a refill rate, a capacity for bursts, 429 when empty","Limits across servers need shared, atomic counters","Timeouts set from real latency, with deadlines passed down","Retries: transient and idempotent only, backoff with jitter, a budget, one layer","Circuit breaker: closed, open, half-open; bulkheads isolate pools"],"model":"A token bucket gives each client a bucket that refills at a steady rate up to a capacity; each request spends a token, so short bursts pass, and when the bucket is empty we reply 429 with Retry-After. With several servers the bucket lives in Redis and the check runs as one atomic script, or servers race and let too much through. For calls to other services, every call gets a timeout based on that service's real latency, and the request's deadline is passed down. I retry only transient errors on idempotent calls, with exponential backoff and jitter, a small budget, and at one layer, because retries multiply. A circuit breaker stops calling a dependency that keeps failing, fails fast while it's open, and lets a trial call through after a cool-down. Bulkheads give each dependency its own pool, so one slow service can't use up every thread."},"qa":[["Token bucket?","Tokens refill at a steady rate up to a capacity; each request spends one, so bursts up to the capacity pass."],["Leaky bucket?","Requests queue and leave at a fixed rate; a full queue rejects."],["The fixed window's weakness?","Up to twice the limit can pass around a window boundary."],["Why add jitter to backoff?","So clients that failed together don't retry together."],["A circuit breaker's three states?","Closed (calls pass), open (fail fast), half-open (one trial call)."],["A bulkhead?","A separate pool of threads or connections per dependency, so one slow dependency can't starve the rest."]],"quiz":[{"q":"What does this print?","snip":{"t":"A fixed window of 3 requests a minute","tabs":[{"lang":"python","src":"limit, counts, allowed = 3, {}, []\nfor t in [58, 59, 59, 60, 60, 61]:\n    w = t // 60\n    if counts.get(w, 0) < limit:\n        counts[w] = counts.get(w, 0) + 1\n        allowed.append(t)\nprint(len(allowed), *allowed)\n"},{"lang":"javascript","src":"const limit = 3, counts = new Map(), allowed = [];\nfor (const t of [58, 59, 59, 60, 60, 61]) {\n  const w = Math.floor(t / 60);\n  if ((counts.get(w) ?? 0) < limit) {\n    counts.set(w, (counts.get(w) ?? 0) + 1);\n    allowed.push(t);\n  }\n}\nconsole.log(allowed.length, ...allowed);\n"}]},"o":["6 58 59 59 60 60 61","3 58 59 59","4 58 59 59 60","3 60 60 61"],"a":0,"e":"Seconds 58 and 59 fall in window 0 and seconds 60 and 61 in window 1, each with its own count of 3, so all six pass within four seconds: twice the limit."},{"q":"What does this print?","snip":{"t":"A token bucket with 4 tokens, refilling 1 a second","tabs":[{"lang":"python","src":"capacity, rate = 4, 1\ntokens, last, out = capacity, 0, []\nfor t in [0, 0, 0, 0, 0, 2, 2, 2]:\n    tokens = min(capacity, tokens + (t - last) * rate)\n    last = t\n    if tokens >= 1:\n        tokens -= 1\n        out.append(\"ok\")\n    else:\n        out.append(\"429\")\nprint(\" \".join(out))\n"},{"lang":"javascript","src":"const capacity = 4, rate = 1;\nlet tokens = capacity, last = 0;\nconst out = [];\nfor (const t of [0, 0, 0, 0, 0, 2, 2, 2]) {\n  tokens = Math.min(capacity, tokens + (t - last) * rate);\n  last = t;\n  if (tokens >= 1) { tokens--; out.push(\"ok\"); } else out.push(\"429\");\n}\nconsole.log(out.join(\" \"));\n"}]},"o":["ok ok ok ok 429 ok ok 429","ok ok ok ok ok ok ok ok","ok ok ok ok 429 ok 429 429","ok ok ok ok 429 429 429 429"],"a":0,"e":"The full bucket lets the first 4 requests at second 0 through and rejects the fifth. Two seconds later 2 tokens have refilled, so two more pass and the third is rejected."},{"q":"Three layers of services each make up to 4 attempts (1 call plus 3 retries), and the database at the bottom fails every call. How many database calls can one user request cause?","o":["64","12","4","27"],"a":0,"e":"Attempts multiply: each of the top layer's 4 attempts makes 4 calls to the middle layer, and each of those makes 4 database calls, 4 × 4 × 4 = 64. Retry at one layer, and keep a retry budget."},{"q":"When should a client retry a failed request?","o":["After a timeout or a 503, if the operation is idempotent or carries an idempotency key","After a 400 Bad Request","After any error, immediately and without limit","Never: retries always make overload worse"],"a":0,"e":"Transient errors on safe-to-repeat operations are what retries are for. A 400 will fail again, unlimited immediate retries cause storms, and well-behaved retries (backoff, jitter, budgets) do help with brief failures."},{"q":"Which stop a slow payment provider from taking down the whole checkout service? (choose 3)","t":"ms","o":["A timeout a little above the provider's normal p99.9 latency","A circuit breaker that fails fast while the provider keeps failing","A separate connection pool (a bulkhead) for payment calls","Retrying every failed call immediately, up to 10 times","Raising the provider timeout to 60 seconds"],"a":[0,1,2],"e":"Timeouts bound each wait, the breaker stops waiting on a provider that's down, and the bulkhead keeps payment calls from using up the connections everything else needs. Immediate retries multiply the load, and a longer timeout holds resources longer."},{"q":"Judge each statement.","t":"yn","s":[["A token bucket allows short bursts, up to its capacity.",true],["A fixed window limiter can let through twice the limit around a window boundary.",true],["In the half-open state, a circuit breaker lets a trial call through.",true],["Exponential backoff without jitter stops clients from retrying in sync.",false]],"e":"Bursts up to the capacity are the token bucket's design. Fixed windows reset at the boundary. Half-open is the trial state. And without jitter, clients that failed together keep retrying together."},{"q":"Put a circuit breaker's states in the order it moves through them during an outage and recovery.","t":"ord","items":["Closed: calls go through and failures are counted","Open: calls fail fast for a cool-down period","Half-open: one trial call is let through","Closed again: the trial succeeded, so calls flow and the count resets"],"e":"Failures past the threshold open the breaker; after the cool-down a trial decides whether to close it or open it again."},{"q":"Complete the Python token bucket: refill for the time that has passed, then spend one token if there is one.","t":"drop","lang":"python","code":"def allow(bucket, now, capacity, rate):\n    bucket[\"tokens\"] = min(capacity, bucket[\"tokens\"] + {{0}})\n    bucket[\"last\"] = now\n    if bucket[\"tokens\"] >= {{1}}:\n        bucket[\"tokens\"] -= 1\n        return True\n    return False\n","blanks":[{"o":["(now - bucket[\"last\"]) * rate","rate","(now - bucket[\"last\"]) / rate","now * rate"],"a":0},{"o":["1","0","capacity","rate"],"a":0}],"e":"Tokens grow by the elapsed time multiplied by the rate, capped at the capacity, and a request needs one whole token."}],"probs":[["Reading · Exponential backoff and jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/","","compare full, equal and decorrelated jitter, and match the findings to this module's simulation"],["Reading · Scaling your API with rate limiters","https://stripe.com/blog/rate-limiters","","list Stripe's four kinds of limiter and say which one protects against what"],["Exercise · Counting at scale","https://blog.cloudflare.com/counting-things-a-lot-of-different-things/","","with a limit of 50 a minute, a client made 42 requests last minute and 18 so far, 15 seconds into this one: does the sliding window counter allow the next request?"],["Pattern · Circuit Breaker","https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker","","choose the thresholds, cool-down and fallback for a payment call, and decide how many trial calls half-open allows"]],"src":[["AWS Architecture Blog: Exponential backoff and jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/"],["Amazon Builders' Library: Timeouts, retries, and backoff with jitter","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"],["Stripe: Scaling your API with rate limiters","https://stripe.com/blog/rate-limiters"],["Cloudflare: How we built rate limiting capable of scaling to millions of domains","https://blog.cloudflare.com/counting-things-a-lot-of-different-things/"],["Google SRE book: Handling overload","https://sre.google/sre-book/handling-overload/"],["Martin Fowler: CircuitBreaker","https://martinfowler.com/bliki/CircuitBreaker.html"]]},{"id":"m07","d":"d3","t":"Service architecture: monoliths, microservices, gateways and discovery","min":100,"hook":"How you split a system into deployable pieces shapes how fast teams ship, how it fails and what it costs, more than any single technology choice. Microservices turn function calls into network calls, so they need an API gateway at the edge, service discovery inside and often a backend for each kind of client. Most systems should start as a well-structured monolith and split only where a boundary has earned it.","pre":{"q":"A six-person startup splits its new app into twelve microservices from day one. Six months later, most features touch four services and every release needs coordinating. What went wrong?","a":"The services were split before anyone knew where the real boundaries were, so features cut across them and every change became a distributed change: several deploys, API versions to agree, network failures to handle. For one small team, a modular monolith with clear internal boundaries would have shipped faster. Services pay off when separate teams need to deploy independently, or when parts need to scale or fail separately."},"kid":{"t":"From one kitchen to a food court","x":"Luigi's restaurant had one big kitchen that made everything: easy to plan, but when the oven broke, nothing came out. The new food court has a stall for each kind of food, each with its own cooks, so the juice stall can change its menu without asking the burger stall. A burger and a juice now come from two stalls, so a front desk takes your whole order and passes it on. Stalls move around, so the desk checks a board showing where each one is today. Children order at a low counter with a picture menu, and delivery riders at a side window with a short list.","map":[["One big kitchen that makes everything","A monolith: one deployable unit; simple calls, but a shared fate"],["A stall for each kind of food, with its own cooks","Microservices: owned by separate teams, deployed and scaled independently"],["The front desk that takes your whole order","An API gateway: one entry point that routes, authenticates and limits"],["The board showing where each stall is today","Service discovery: a registry of where each service's instances are running"],["The children's counter and the riders' window","Backends for frontends: an API tailored to each kind of client"]],"brk":"Walking between stalls takes seconds and never fails. Calls between services cross a network: they can be slow, fail or arrive twice, and data that once sat in one database now has to stay consistent across several."},"keys":["**Monolith**: one codebase and one deployable unit, usually with one database. Calls are function calls and transactions are local, so it's simple to build, test and debug. The pain grows with the number of teams: one shared release train, one bug that can take everything down, and scaling only as a whole.","**Modular monolith**: still one deployable, but split into modules with enforced boundaries: separate packages, a public interface per module, and no reaching into another module's tables. It keeps the monolith's simplicity while preparing clean seams, and it's usually the best start.","**Microservices**: small services, each owned by one team, deployed independently and owning its data (no shared database). The gains: independent deploys and scaling, fault isolation, a technology choice per service. The costs: network calls (latency, partial failure), distributed data (no transactions across services, so sagas and eventual consistency), and much more to operate: pipelines, monitoring, tracing, discovery.","**Finding boundaries**: split by business capability (orders, payments, catalogue: a bounded context in domain-driven design), not by technical layer. A good boundary has high cohesion inside and few, coarse calls across it. Conway's law says systems mirror the communication structure of the organisations that build them, so align services with teams. Extract from a monolith gradually, with the strangler fig pattern.","**API gateway**: one entry point in front of the services. It routes requests, terminates TLS, authenticates, rate-limits and can combine several calls into one response. Keep business logic out of it, and run it highly available, because every request passes through it.","**Backends for frontends (BFF)**: a separate backend for each kind of client (web, mobile, partner API), usually owned by that client's team, which shapes and combines data for exactly what the client shows. It avoids one bloated general-purpose API, at the price of some duplication.","**Service discovery**: instances come and go with autoscaling, deploys and failures, so callers look up current addresses. Client-side: the caller asks a registry (Consul, Eureka) and balances the load itself. Server-side: the caller uses a stable name or load balancer that knows the instances (a Kubernetes Service, a cloud load balancer). Health checks and heartbeats remove dead instances, after a delay.","**Calls between services**: synchronous calls (REST, gRPC) are simple but tie availability together: when every call is needed, availabilities multiply, and in a chain the latencies add. Asynchronous events (module 5) decouple services. Keep synchronous chains short, fan out in parallel, and consider a service mesh (sidecar proxies such as Envoy) for retries, mutual TLS and metrics on every call."],"dia":[{"type":"tiers","cap":"A gateway with backends for frontends","tiers":[["Clients",["Web app","Mobile app","Partners"]],["API gateway",["TLS, authentication, rate limits, routing"],"HTTPS"],["Backends for frontends",["Web BFF","Mobile BFF","Public API"],"by client type"],["Services",["users","orders","catalogue","payments"],"found through service discovery"]],"note":"The gateway handles what every request needs; each BFF shapes data for one kind of client; the services own the business logic and their own data."},{"type":"seq","cap":"Client-side service discovery","actors":["Orders service","Registry","Payments 10.0.0.1","Payments 10.0.0.3"],"msgs":[["Payments 10.0.0.1","Registry","heartbeat, every 5 s"],["Payments 10.0.0.3","Registry","heartbeat, every 5 s"],["Orders service","Registry","where is payments?"],["Registry","Orders service","10.0.0.1 and 10.0.0.3",true],["Orders service","Payments 10.0.0.1","charge (round robin)"],["Orders service","Payments 10.0.0.3","the next charge"]],"note":"An instance that stops sending heartbeats is dropped once its TTL passes. With server-side discovery, the orders service would call one stable name, such as a Kubernetes Service, instead."},{"type":"quad","cap":"Which shape fits? A rough first guess","x0":"one team","x1":"many teams","y1":"stable domain","y0":"changing domain","cells":[["Modular monolith","clear modules; extract one only if it needs its own scaling or isolation"],["Microservices","one per bounded context, each owned by one team, with its own data"],["Monolith","move fast; the boundaries will become clear"],["Modular monolith, then extract","find the seams first; split off the most stable parts as teams grow"]]}],"cmp":[{"cap":"Monolith, modular monolith and microservices","head":["","Monolith","Modular monolith","Microservices"],"rows":[["Deploys","Everything together","Everything together","Each service on its own"],["Calls between parts","Function calls","Function calls through module interfaces","Network calls (REST, gRPC, events)"],["Data","One database, shared freely","One database; each module owns its tables","A database per service"],["Failures","One bug can take down everything","The same, but easier to reason about","Isolated, if calls have timeouts and fallbacks"],["Operations","Simple","Simple","Pipelines, discovery, tracing and monitoring per service"],["Fits","Small teams, new products","Most teams, as the default","Many teams, stable boundaries, different scaling needs"]]},{"cap":"Client-side and server-side discovery","head":["","Client-side","Server-side"],"rows":[["Who picks the instance","The calling service, using a registry","A load balancer or the platform's proxy"],["Examples","Consul or Eureka with a client library","Kubernetes Services, cloud load balancers"],["Strengths","No extra hop; each caller can balance cleverly","Callers stay simple, in any language"],["Weaknesses","A discovery library in every language you use","An extra hop, and another component to run"]]}],"code":[{"t":"The seeded random generator used by the latency simulation","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"What a call chain costs: latency and availability","tabs":[{"lang":"python","src":"def percentile(sorted_ms, p):\n    return sorted_ms[len(sorted_ms) * p // 100 - 1]   # nearest rank; p is a whole percent\n\ndef call_ms(rand):\n    \"\"\"One backend call: usually 10 to 29 ms, but 1 call in 50 hits a slow path of 200 to 499 ms.\"\"\"\n    if rand() < 0.02:\n        return 200 + int(rand() * 300)\n    return 10 + int(rand() * 20)\n\ndef page_loads(n_calls, parallel, trials=10_000, seed=3):\n    rand = mulberry32(seed)\n    totals = []\n    for _ in range(trials):\n        times = [call_ms(rand) for _ in range(n_calls)]\n        totals.append(max(times) if parallel else sum(times))   # parallel: wait for the slowest; chain: add them up\n    totals.sort()\n    return percentile(totals, 50), percentile(totals, 99)\n\ndef availability_ppm(n, each_ppm=999_000):         # in parts per million: 999,000 is 99.9%\n    ppm = 1_000_000\n    for _ in range(n):\n        ppm = (ppm * each_ppm + 500_000) // 1_000_000   # every call must succeed, so the chances multiply\n    return ppm\n\nfor label, n, parallel in ((\"1 call\", 1, True), (\"10 calls in parallel\", 10, True), (\"10 calls in a chain\", 10, False)):\n    p50, p99 = page_loads(n, parallel)\n    ppm = availability_ppm(n)\n    print(f\"{label}: p50 {p50} ms, p99 {p99} ms, available {ppm // 10_000}.{ppm % 10_000:04d}%\")\n","out":"1 call: p50 20 ms, p99 352 ms, available 99.9000%\n10 calls in parallel: p50 29 ms, p99 484 ms, available 99.0045%\n10 calls in a chain: p50 200 ms, p99 773 ms, available 99.0045%\n","notes":[[7,"The rare slow path is the tail: 2% of calls. With one call, it barely shows at p99; with ten calls per page, about 18% of pages hit it."],[15,"In parallel the page waits for its slowest call; in a chain the times add up."],[22,"Availabilities multiply when every call is needed: ten services at 99.9% give about 99.0%, ten times the downtime."],[28,"Fanning out barely moves the median but drags the p99 towards the slow path; the chain is slow even at the median."]]},{"lang":"javascript","src":"function percentile(sortedMs, p) {\n  return sortedMs[Math.floor(sortedMs.length * p / 100) - 1];   // nearest rank; p is a whole percent\n}\n\nfunction callMs(rand) {\n  // one backend call: usually 10 to 29 ms, but 1 call in 50 hits a slow path of 200 to 499 ms\n  if (rand() < 0.02) return 200 + Math.floor(rand() * 300);\n  return 10 + Math.floor(rand() * 20);\n}\n\nfunction pageLoads(nCalls, parallel, trials = 10_000, seed = 3) {\n  const rand = mulberry32(seed);\n  const totals = [];\n  for (let i = 0; i < trials; i++) {\n    const times = Array.from({ length: nCalls }, () => callMs(rand));\n    totals.push(parallel ? Math.max(...times) : times.reduce((a, b) => a + b, 0));   // parallel: wait for the slowest; chain: add them up\n  }\n  totals.sort((a, b) => a - b);\n  return [percentile(totals, 50), percentile(totals, 99)];\n}\n\nfunction availabilityPpm(n, eachPpm = 999_000) {   // in parts per million: 999,000 is 99.9%\n  let ppm = 1_000_000;\n  for (let i = 0; i < n; i++) ppm = Math.floor((ppm * eachPpm + 500_000) / 1_000_000);   // every call must succeed, so the chances multiply\n  return ppm;\n}\n\nfor (const [label, n, parallel] of [[\"1 call\", 1, true], [\"10 calls in parallel\", 10, true], [\"10 calls in a chain\", 10, false]]) {\n  const [p50, p99] = pageLoads(n, parallel);\n  const ppm = availabilityPpm(n);\n  console.log(`${label}: p50 ${p50} ms, p99 ${p99} ms, available ${Math.floor(ppm / 10_000)}.${String(ppm % 10_000).padStart(4, \"0\")}%`);\n}\n","out":"1 call: p50 20 ms, p99 352 ms, available 99.9000%\n10 calls in parallel: p50 29 ms, p99 484 ms, available 99.0045%\n10 calls in a chain: p50 200 ms, p99 773 ms, available 99.0045%\n","notes":[[7,"The rare slow path is the tail: 2% of calls. With one call, it barely shows at p99; with ten calls per page, about 18% of pages hit it."],[16,"In parallel the page waits for its slowest call; in a chain the times add up."],[24,"Availabilities multiply when every call is needed: ten services at 99.9% give about 99.0%, ten times the downtime."],[31,"Fanning out barely moves the median but drags the p99 towards the slow path; the chain is slow even at the median."]]}]},{"t":"A service registry with heartbeats, and the window when it's wrong","tabs":[{"lang":"python","src":"class Registry:\n    def __init__(self, ttl):\n        self.ttl, self.last_seen = ttl, {}        # (service, address) -> time of the last heartbeat\n\n    def heartbeat(self, service, address, now):\n        self.last_seen[(service, address)] = now  # registering is just the first heartbeat\n\n    def lookup(self, service, now):\n        return sorted(addr for (svc, addr), seen in self.last_seen.items()\n                      if svc == service and now - seen <= self.ttl)   # silent for longer than the TTL: gone\n\nregistry = Registry(ttl=10)\nalive = {\"10.0.0.1\": (0, 99), \"10.0.0.2\": (0, 20), \"10.0.0.3\": (0, 99), \"10.0.0.4\": (25, 99)}   # running from, until\nsent_to_dead = 0\nfor now in range(40):                             # one request a second, for 40 seconds\n    for addr, (start, stop) in alive.items():\n        if start <= now <= stop and now % 5 == 0:\n            registry.heartbeat(\"payments\", addr, now)   # running instances check in every 5 seconds\n    targets = registry.lookup(\"payments\", now)\n    target = targets[now % len(targets)]          # client-side round robin\n    start, stop = alive[target]\n    if not start <= now <= stop:\n        sent_to_dead += 1\n    if now in (0, 25, 31):\n        print(f\"t={now}: {' '.join(targets)}\")\nprint(f\"requests sent to an instance that had crashed: {sent_to_dead} of 40\")\n","out":"t=0: 10.0.0.1 10.0.0.2 10.0.0.3\nt=25: 10.0.0.1 10.0.0.2 10.0.0.3 10.0.0.4\nt=31: 10.0.0.1 10.0.0.3 10.0.0.4\nrequests sent to an instance that had crashed: 3 of 40\n","notes":[[10,"An instance that hasn't checked in within the TTL is left out. A crash is noticed only after the TTL passes."],[18,"New instances appear as soon as they send their first heartbeat; 10.0.0.4 joins at t=25."],[20,"The caller balances the load itself: that's client-side discovery."],[26,"10.0.0.2 died just after t=20 but stayed listed until t=30, so 3 requests went to it. Callers should retry on another instance, and shorter TTLs shrink the window at the cost of more heartbeats."]]},{"lang":"javascript","src":"class Registry {\n  constructor(ttl) { this.ttl = ttl; this.lastSeen = new Map(); }   // \"service|address\" -> time of the last heartbeat\n  heartbeat(service, address, now) {\n    this.lastSeen.set(`${service}|${address}`, now);   // registering is just the first heartbeat\n  }\n  lookup(service, now) {\n    return [...this.lastSeen]\n      .filter(([key, seen]) => key.split(\"|\")[0] === service && now - seen <= this.ttl)   // silent for longer than the TTL: gone\n      .map(([key]) => key.split(\"|\")[1])\n      .sort();\n  }\n}\n\nconst registry = new Registry(10);\nconst alive = new Map([[\"10.0.0.1\", [0, 99]], [\"10.0.0.2\", [0, 20]], [\"10.0.0.3\", [0, 99]], [\"10.0.0.4\", [25, 99]]]);   // running from, until\nlet sentToDead = 0;\nfor (let now = 0; now < 40; now++) {              // one request a second, for 40 seconds\n  for (const [addr, [start, stop]] of alive) {\n    if (start <= now && now <= stop && now % 5 === 0) registry.heartbeat(\"payments\", addr, now);   // running instances check in every 5 seconds\n  }\n  const targets = registry.lookup(\"payments\", now);\n  const target = targets[now % targets.length];   // client-side round robin\n  const [start, stop] = alive.get(target);\n  if (!(start <= now && now <= stop)) sentToDead++;\n  if ([0, 25, 31].includes(now)) console.log(`t=${now}: ${targets.join(\" \")}`);\n}\nconsole.log(`requests sent to an instance that had crashed: ${sentToDead} of 40`);\n","out":"t=0: 10.0.0.1 10.0.0.2 10.0.0.3\nt=25: 10.0.0.1 10.0.0.2 10.0.0.3 10.0.0.4\nt=31: 10.0.0.1 10.0.0.3 10.0.0.4\nrequests sent to an instance that had crashed: 3 of 40\n","notes":[[8,"An instance that hasn't checked in within the TTL is left out. A crash is noticed only after the TTL passes."],[19,"New instances appear as soon as they send their first heartbeat; 10.0.0.4 joins at t=25."],[22,"The caller balances the load itself: that's client-side discovery."],[27,"10.0.0.2 died just after t=20 but stayed listed until t=30, so 3 requests went to it. Callers should retry on another instance, and shorter TTLs shrink the window at the cost of more heartbeats."]]}]},{"t":"A gateway in front of two backends for frontends","tabs":[{"lang":"python","src":"import json\n\nBACKEND_MS = {\"users\": 12, \"orders\": 25, \"recs\": 18}   # each service's time inside the data centre\nPHONE_RTT_MS = 150                                # one round trip over a mobile network\n\ndef users(uid):\n    return {\"id\": uid, \"name\": \"Ana\", \"email\": \"ana@example.com\", \"tier\": \"gold\", \"joined\": \"2021-04-02\"}\n\ndef orders(uid):\n    return [{\"id\": f\"o{i}\", \"total\": 20 * i, \"items\": i, \"status\": \"delivered\"} for i in range(1, 6)]\n\ndef recs(uid):\n    return [\"tea\", \"mug\", \"kettle\", \"honey\", \"scones\", \"jam\"]\n\ndef web_home(uid):                                # the web BFF: a big screen, so everything\n    return {\"user\": users(uid), \"orders\": orders(uid), \"recommended\": recs(uid)}\n\ndef mobile_home(uid):                             # the mobile BFF: only what the phone's home screen shows\n    return {\"name\": users(uid)[\"name\"], \"last_order\": orders(uid)[-1][\"id\"], \"recommended\": recs(uid)[:2]}\n\nROUTES = {\"/web/home\": web_home, \"/mobile/home\": mobile_home}\n\ndef gateway(path, token):\n    if token != \"valid\":                          # authenticate once, at the edge\n        return 401, \"\"\n    if path not in ROUTES:\n        return 404, \"\"\n    return 200, json.dumps(ROUTES[path](\"u42\"), separators=(\",\", \":\"))\n\nfor path, token in ((\"/web/home\", \"valid\"), (\"/mobile/home\", \"valid\"), (\"/mobile/home\", \"stolen\"), (\"/admin\", \"valid\")):\n    status, body = gateway(path, token)\n    print(f\"{path} ({token} token): {status}, {len(body)} bytes\")\nchatty = len(BACKEND_MS) * PHONE_RTT_MS + sum(BACKEND_MS.values())\nbff = PHONE_RTT_MS + max(BACKEND_MS.values())     # one trip from the phone; the BFF calls the services in parallel\nprint(f\"phone calling the 3 services one after another: {chatty} ms | one call to the mobile BFF: {bff} ms\")\n","out":"/web/home (valid token): 200, 438 bytes\n/mobile/home (valid token): 200, 60 bytes\n/mobile/home (stolen token): 401, 0 bytes\n/admin (valid token): 404, 0 bytes\nphone calling the 3 services one after another: 505 ms | one call to the mobile BFF: 175 ms\n","notes":[[16,"The web BFF returns everything, because a big screen shows it all."],[19,"The mobile BFF trims the same data to what the phone actually shows: about a seventh of the bytes."],[24,"Cross-cutting checks such as authentication happen once at the gateway, not in every service."],[35,"The phone pays one slow mobile round trip instead of three, while the BFF's calls inside the data centre are fast and parallel."]]},{"lang":"javascript","src":"const BACKEND_MS = { users: 12, orders: 25, recs: 18 };   // each service's time inside the data centre\nconst PHONE_RTT_MS = 150;                         // one round trip over a mobile network\n\nconst users = uid => ({ id: uid, name: \"Ana\", email: \"ana@example.com\", tier: \"gold\", joined: \"2021-04-02\" });\nconst orders = uid => Array.from({ length: 5 }, (_, k) => ({ id: `o${k + 1}`, total: 20 * (k + 1), items: k + 1, status: \"delivered\" }));\nconst recs = uid => [\"tea\", \"mug\", \"kettle\", \"honey\", \"scones\", \"jam\"];\n\nfunction webHome(uid) {                           // the web BFF: a big screen, so everything\n  return { user: users(uid), orders: orders(uid), recommended: recs(uid) };\n}\n\nfunction mobileHome(uid) {                        // the mobile BFF: only what the phone's home screen shows\n  return { name: users(uid).name, last_order: orders(uid).at(-1).id, recommended: recs(uid).slice(0, 2) };\n}\n\nconst ROUTES = new Map([[\"/web/home\", webHome], [\"/mobile/home\", mobileHome]]);\n\nfunction gateway(path, token) {\n  if (token !== \"valid\") return [401, \"\"];        // authenticate once, at the edge\n  if (!ROUTES.has(path)) return [404, \"\"];\n  return [200, JSON.stringify(ROUTES.get(path)(\"u42\"))];\n}\n\nfor (const [path, token] of [[\"/web/home\", \"valid\"], [\"/mobile/home\", \"valid\"], [\"/mobile/home\", \"stolen\"], [\"/admin\", \"valid\"]]) {\n  const [status, body] = gateway(path, token);\n  console.log(`${path} (${token} token): ${status}, ${body.length} bytes`);\n}\nconst chatty = Object.keys(BACKEND_MS).length * PHONE_RTT_MS + Object.values(BACKEND_MS).reduce((a, b) => a + b, 0);\nconst bff = PHONE_RTT_MS + Math.max(...Object.values(BACKEND_MS));   // one trip from the phone; the BFF calls the services in parallel\nconsole.log(`phone calling the 3 services one after another: ${chatty} ms | one call to the mobile BFF: ${bff} ms`);\n","out":"/web/home (valid token): 200, 438 bytes\n/mobile/home (valid token): 200, 60 bytes\n/mobile/home (stolen token): 401, 0 bytes\n/admin (valid token): 404, 0 bytes\nphone calling the 3 services one after another: 505 ms | one call to the mobile BFF: 175 ms\n","notes":[[9,"The web BFF returns everything, because a big screen shows it all."],[13,"The mobile BFF trims the same data to what the phone actually shows: about a seventh of the bytes."],[19,"Cross-cutting checks such as authentication happen once at the gateway, not in every service."],[30,"The phone pays one slow mobile round trip instead of three, while the BFF's calls inside the data centre are fast and parallel."]]}]}],"ex":{"q":"The pricing logic lives inside a monolith, and the team wants to move it into its own service without breaking checkout. Plan a strangler fig migration, and show how shadow traffic catches a difference before users see it.","steps":["Put a routing layer (the gateway, or a proxy) in front of the monolith, so each route can be sent elsewhere without clients noticing.","Build the pricing service for one bounded context, with its own data: copy it, or read through the monolith's API at first, but never share tables.","Shadow first: send real requests to both, answer from the monolith, and compare. Mismatches reveal undocumented rules, like the 10% discount below, before any user sees a difference.","Cut over gradually (a percentage of traffic, then all of it), keep a switch to route back, then delete the old code. The monolith shrinks route by route until it's gone, or small enough to keep."],"code":{"t":"A strangler router: monolith, shadow, then cut over","tabs":[{"lang":"python","src":"PRICES = {1: 1200, 2: 450, 3: 9900, 4: 15000}    # item -> price in cents\n\ndef monolith_price(item):                         # the old code inside the monolith\n    price = PRICES[item]\n    return price - price // 10 if price >= 10000 else price   # 10% off big-ticket items: a rule nobody documented\n\ndef new_price_v1(item):                           # the new pricing service, first version\n    return PRICES[item]\n\ndef new_price_v2(item):                           # after shadowing revealed the missing rule\n    price = PRICES[item]\n    return price - price // 10 if price >= 10000 else price\n\nclass StranglerRouter:\n    \"\"\"Sends pricing requests to the monolith, the new service, or both (shadow mode).\"\"\"\n    def __init__(self, new_service):\n        self.new, self.mode, self.mismatches = new_service, \"monolith\", []\n\n    def price(self, item):\n        if self.mode == \"new\":\n            return self.new(item)\n        old = monolith_price(item)\n        if self.mode == \"shadow\":                 # call both, answer with the monolith, compare quietly\n            new = self.new(item)\n            if new != old:\n                self.mismatches.append(f\"item {item}: monolith {old}, new {new}\")\n        return old\n\nrouter = StranglerRouter(new_price_v1)\nrouter.mode = \"shadow\"\nserved = [router.price(item) for item in PRICES]\nprint(\"shadow v1: mismatches\", len(router.mismatches), \"|\", *router.mismatches)\nrouter.new, router.mismatches = new_price_v2, []\nserved = [router.price(item) for item in PRICES]\nprint(\"shadow v2: mismatches\", len(router.mismatches), \"| users were served\", *served)\nrouter.mode = \"new\"                               # cut over: the monolith's pricing code can now be deleted\nprint(\"cut over:\", *(router.price(item) for item in PRICES))\n","out":"shadow v1: mismatches 1 | item 4: monolith 13500, new 15000\nshadow v2: mismatches 0 | users were served 1200 450 9900 13500\ncut over: 1200 450 9900 13500\n"},{"lang":"javascript","src":"const PRICES = new Map([[1, 1200], [2, 450], [3, 9900], [4, 15000]]);   // item -> price in cents\n\nfunction monolithPrice(item) {                    // the old code inside the monolith\n  const price = PRICES.get(item);\n  return price >= 10000 ? price - Math.floor(price / 10) : price;   // 10% off big-ticket items: a rule nobody documented\n}\n\nfunction newPriceV1(item) {                       // the new pricing service, first version\n  return PRICES.get(item);\n}\n\nfunction newPriceV2(item) {                       // after shadowing revealed the missing rule\n  const price = PRICES.get(item);\n  return price >= 10000 ? price - Math.floor(price / 10) : price;\n}\n\nclass StranglerRouter {\n  // sends pricing requests to the monolith, the new service, or both (shadow mode)\n  constructor(newService) { this.new = newService; this.mode = \"monolith\"; this.mismatches = []; }\n  price(item) {\n    if (this.mode === \"new\") return this.new(item);\n    const old = monolithPrice(item);\n    if (this.mode === \"shadow\") {                 // call both, answer with the monolith, compare quietly\n      const fresh = this.new(item);\n      if (fresh !== old) this.mismatches.push(`item ${item}: monolith ${old}, new ${fresh}`);\n    }\n    return old;\n  }\n}\n\nconst router = new StranglerRouter(newPriceV1);\nrouter.mode = \"shadow\";\nlet served = [...PRICES.keys()].map(item => router.price(item));\nconsole.log(\"shadow v1: mismatches\", router.mismatches.length, \"|\", ...router.mismatches);\nrouter.new = newPriceV2; router.mismatches = [];\nserved = [...PRICES.keys()].map(item => router.price(item));\nconsole.log(\"shadow v2: mismatches\", router.mismatches.length, \"| users were served\", ...served);\nrouter.mode = \"new\";                              // cut over: the monolith's pricing code can now be deleted\nconsole.log(\"cut over:\", ...[...PRICES.keys()].map(item => router.price(item)));\n","out":"shadow v1: mismatches 1 | item 4: monolith 13500, new 15000\nshadow v2: mismatches 0 | users were served 1200 450 9900 13500\ncut over: 1200 450 9900 13500\n"}]},"a":"In shadow mode users are always served the monolith's prices, so the missing discount on item 4 (13,500 against 15,000 cents) shows up only as a logged mismatch. After the fix there are no mismatches, so the cut-over changes nothing users can see, and the monolith's pricing code can be deleted."},"fade":{"q":"Finish `home(calls, deadline_ms)` for a mobile BFF that calls three services in parallel. `calls` maps each service to (latency in ms, result, or None if it failed). User and orders are required: if either fails or misses the deadline, return 503. Recommendations are optional: use a cached fallback instead. Return the status, the sections served, and how long the BFF waited.","steps":["The calls run in parallel, so the BFF waits for the slowest one, but never past the deadline: that wait is min(deadline, the largest latency).",{"ask":"What happens when a required section fails?","a":"The page can't be built without it, so the whole response is a 503, and the client can retry or show an error screen."},{"ask":"And when an optional one fails or is too slow?","a":"Serve the rest of the page, with a cached fallback for that section (or leave it out). Users get a slightly worse page instead of an error."},{"ask":"What does it cost, and what would you monitor?","a":"One pass over the calls, O(number of services). Monitor how often each fallback is used and how often the deadline is hit: a fallback rate that creeps up means a dependency is getting slower."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"REQUIRED = (\"user\", \"orders\")                     # the page is useless without these\nFALLBACKS = {\"recs\": [\"tea\", \"mug\"]}              # a cached answer for optional sections\n\ndef home(calls, deadline_ms=200):\n    waited = ...                                  # TODO: the calls run in parallel, but the deadline caps the wait\n    sections = []\n    for name, (ms, result) in calls.items():\n        ...                                       # TODO: serve it, fail the page (503), or use the fallback\n    return 200, sections, waited\n"},{"lang":"javascript","src":"const REQUIRED = [\"user\", \"orders\"];              // the page is useless without these\nconst FALLBACKS = { recs: [\"tea\", \"mug\"] };       // a cached answer for optional sections\n\nfunction home(calls, deadlineMs = 200) {\n  const waited = 0;                               // TODO: the calls run in parallel, but the deadline caps the wait\n  const sections = [];\n  for (const [name, [ms, result]] of Object.entries(calls)) {\n    // TODO: serve it, fail the page (503), or use the fallback\n  }\n  return [200, sections, waited];\n}\n"}]},"solution":{"t":"Solution: wait for the slowest up to the deadline, then decide per section","tabs":[{"lang":"python","src":"REQUIRED = (\"user\", \"orders\")                     # the page is useless without these\nFALLBACKS = {\"recs\": [\"tea\", \"mug\"]}              # a cached answer for optional sections\n\ndef home(calls, deadline_ms=200):\n    waited = min(deadline_ms, max(ms for ms, _ in calls.values()))   # parallel calls: the slowest, capped by the deadline\n    sections = []\n    for name, (ms, result) in calls.items():\n        if result is not None and ms <= deadline_ms:\n            sections.append(name)                 # arrived in time\n        elif name in REQUIRED:\n            return 503, [], waited                # a required section is missing: fail the page\n        elif name in FALLBACKS:\n            sections.append(name + \" (cached)\")   # optional: degrade instead of failing\n    return 200, sections, waited\n\nscenarios = {\n    \"all healthy\": {\"user\": (30, \"Ana\"), \"orders\": (45, [\"o5\"]), \"recs\": (60, [\"tea\"])},\n    \"slow recommendations\": {\"user\": (30, \"Ana\"), \"orders\": (45, [\"o5\"]), \"recs\": (900, [\"tea\"])},\n    \"orders down\": {\"user\": (30, \"Ana\"), \"orders\": (20, None), \"recs\": (60, [\"tea\"])},\n}\nfor label, calls in scenarios.items():\n    status, sections, waited = home(calls)\n    print(f\"{label}: {status} | {' '.join(sections) or '-'} | waited {waited} ms\")\n","out":"all healthy: 200 | user orders recs | waited 60 ms\nslow recommendations: 200 | user orders recs (cached) | waited 200 ms\norders down: 503 | - | waited 60 ms\n"},{"lang":"javascript","src":"const REQUIRED = [\"user\", \"orders\"];              // the page is useless without these\nconst FALLBACKS = { recs: [\"tea\", \"mug\"] };       // a cached answer for optional sections\n\nfunction home(calls, deadlineMs = 200) {\n  const waited = Math.min(deadlineMs, Math.max(...Object.values(calls).map(([ms]) => ms)));   // parallel calls: the slowest, capped by the deadline\n  const sections = [];\n  for (const [name, [ms, result]] of Object.entries(calls)) {\n    if (result !== null && ms <= deadlineMs) sections.push(name);   // arrived in time\n    else if (REQUIRED.includes(name)) return [503, [], waited];     // a required section is missing: fail the page\n    else if (name in FALLBACKS) sections.push(`${name} (cached)`);  // optional: degrade instead of failing\n  }\n  return [200, sections, waited];\n}\n\nconst scenarios = {\n  \"all healthy\": { user: [30, \"Ana\"], orders: [45, [\"o5\"]], recs: [60, [\"tea\"]] },\n  \"slow recommendations\": { user: [30, \"Ana\"], orders: [45, [\"o5\"]], recs: [900, [\"tea\"]] },\n  \"orders down\": { user: [30, \"Ana\"], orders: [20, null], recs: [60, [\"tea\"]] },\n};\nfor (const [label, calls] of Object.entries(scenarios)) {\n  const [status, sections, waited] = home(calls);\n  console.log(`${label}: ${status} | ${sections.join(\" \") || \"-\"} | waited ${waited} ms`);\n}\n","out":"all healthy: 200 | user orders recs | waited 60 ms\nslow recommendations: 200 | user orders recs (cached) | waited 200 ms\norders down: 503 | - | waited 60 ms\n"}]}},"traps":[["“Microservices will make us faster.”","Only when separate teams are blocking each other. For a small team they add network calls, distributed data and operational work, and slow everything down. Start with a modular monolith and split where a boundary has earned it."],["“Split by layer: a UI service, a logic service, a data service.”","Then every feature touches every service. Split by business capability (orders, payments, catalogue), so most changes stay inside one service."],["“The services can share one database; it's simpler.”","Shared tables couple the services: a schema change needs every team, and one service's heavy query slows the others. Each service owns its data and shares it through its API or events."],["“Put business logic in the gateway, since every request passes through it.”","The gateway becomes a bottleneck every team must change, and a single point of failure for that logic. Keep it to cross-cutting concerns: routing, authentication, limits, TLS."],["“A long chain of synchronous calls is fine; each service is 99.9% available.”","Availabilities multiply and latencies add: ten services in a chain at 99.9% each give about 99.0%, and the chain is as slow as all of them together. Prefer events for workflows, and keep chains short."],["“Service discovery means hard-coding the load balancer's address.”","Instances change constantly with autoscaling and deploys. Callers need a registry kept current by health checks (or a platform such as Kubernetes that provides one), and should retry on another instance when one fails."]],"disc":[["Checkout in your monolith is slowed down by a reporting feature that runs heavy queries. Would you extract a service, and which one?","Extract reporting first: it's a clear bounded context, it can read from its own copy of the data (a replica, or a stream of events), and moving it takes the load off checkout. Checkout itself is riskier to move and gains less. Use the strangler fig: route the reporting endpoints through a facade, build the service with its own read model, shadow, then cut over."],["When does a BFF help, and when is it overkill?","It helps when clients differ a lot (a web app with rich pages, a mobile app on slow networks, a partner API with stability promises) and one general API forces each of them to over-fetch or make many calls. It's overkill with a single client, or clients that need the same data; then one well-designed API, perhaps with field selection (GraphQL or sparse fieldsets), is simpler."]],"teach":{"prompt":"Explain to a junior colleague when you'd choose microservices over a monolith, and what an API gateway, a BFF and service discovery each do.","rubric":["A modular monolith first; microservices when teams need independent deploys, or parts need separate scaling or isolation","Split by business capability, each service owning its data","The costs: network calls, distributed data, operations","Gateway: one entry point for routing, auth and limits; BFF: an API per client type","Discovery: a registry kept current by health checks, client-side or server-side"],"model":"I'd start with a modular monolith: one deployable with enforced module boundaries, which is simple to build and debug. I'd move to microservices when several teams keep blocking each other's releases, or a part needs its own scaling or failure isolation, splitting by business capability, with each service owning its data. The price is network calls that can be slow or fail, no transactions across services, and much more to operate. An API gateway is the single entry point that routes requests and handles TLS, authentication and rate limits. A backend for frontend is an API shaped for one kind of client, such as mobile, so the phone makes one small call instead of several big ones. Service discovery keeps track of where each service's instances are running, using heartbeats or health checks; either the caller looks them up and balances itself, or a load balancer or Kubernetes does it."},"qa":[["Modular monolith?","One deployable unit, split into modules with enforced boundaries."],["Conway's law?","Systems mirror the communication structure of the organisation that builds them."],["API gateway?","One entry point that routes requests and handles TLS, authentication and rate limits."],["Backend for frontend?","A separate backend for each kind of client, shaping data for exactly what that client shows."],["Client-side or server-side discovery?","The caller looks up instances in a registry and picks one, or it calls a stable name or load balancer that does that."],["The strangler fig pattern?","Replace a monolith piece by piece behind a routing facade, until the old code can be removed."]],"quiz":[{"q":"What does this print?","snip":{"t":"Three services called in a chain","tabs":[{"lang":"python","src":"ppm = 1_000_000                                 # availability in parts per million\nfor each in [999_000, 999_000, 995_000]:\n    ppm = ppm * each // 1_000_000               # rounded down\nprint(f\"{ppm // 10_000}.{ppm % 10_000:04d}%\")\n"},{"lang":"javascript","src":"let ppm = 1_000_000;                            // availability in parts per million\nfor (const each of [999_000, 999_000, 995_000]) ppm = Math.floor(ppm * each / 1_000_000);   // rounded down\nconsole.log(`${Math.floor(ppm / 10_000)}.${String(ppm % 10_000).padStart(4, \"0\")}%`);\n"}]},"o":["99.3010%","99.9000%","99.5000%","97.3010%"],"a":0,"e":"Every call must succeed, so the availabilities multiply: 0.999 × 0.999 × 0.995 ≈ 0.99301. The chain is less available than its weakest member."},{"q":"A team of five is building a new product whose domain still changes every week. Which architecture fits best?","o":["A modular monolith with clear internal boundaries","Twenty microservices, one per database table","A microservice per developer","Serverless functions for every endpoint, all sharing one database"],"a":0,"e":"One small team gains nothing from independent deploys, and a changing domain means boundaries drawn now will be wrong. A modular monolith keeps changes cheap while the seams become clear."},{"q":"Why should each microservice own its data, rather than all of them sharing one database?","o":["So a team can change its schema and deploy without coordinating with other teams","Because one database can't serve more than one service","To make queries across services faster","So that transactions can span services"],"a":0,"e":"Shared tables couple the services: any schema change needs every team. Separate data costs fast cross-service queries and transactions, which is the trade-off you accept."},{"q":"Which belong in an API gateway? (choose 3)","t":"ms","o":["Routing requests to the right service","Authentication and TLS termination","Per-client rate limiting","Pricing and discount rules","Writing orders to the database"],"a":[0,1,2],"e":"Cross-cutting concerns that every request needs belong at the edge. Business rules and data belong in the services that own them."},{"q":"Judge each statement.","t":"yn","s":[["Conway's law says a system tends to mirror the communication structure of the organisation that builds it.",true],["In client-side discovery, the caller looks up instances in a registry and picks one itself.",true],["A backend for frontend is a single API shared by every kind of client.",false],["Splitting a monolith into microservices makes transactions across services easy.",false]],"e":"A BFF is one backend per kind of client. And splitting the data removes local transactions: work that spans services needs sagas and eventual consistency."},{"q":"Put a strangler fig migration of one feature in order.","t":"ord","items":["Route all traffic through a facade in front of the monolith","Build the new service for one bounded context, with its own data","Shadow traffic to both and compare the answers","Shift traffic to the new service gradually","Delete the old code from the monolith"],"e":"The facade makes routing changes invisible to clients, shadowing catches differences safely, and the gradual shift keeps a way back until the old code is removed."},{"q":"Complete the Python registry lookup: the addresses of one service's instances that have sent a heartbeat within the TTL, sorted.","t":"drop","lang":"python","code":"def lookup(last_seen, service, now, ttl):\n    return {{0}}(addr for (svc, addr), seen in last_seen.items()\n                 if svc == service and {{1}})\n","blanks":[{"o":["sorted","list","set","max"],"a":0},{"o":["now - seen <= ttl","seen - now <= ttl","now - seen > ttl","seen <= ttl"],"a":0}],"e":"An instance counts as alive if its last heartbeat is no older than the TTL, and sorting gives callers a stable list to balance over."},{"q":"Match each description to its name.","t":"match","pairs":[["One entry point that routes, authenticates and limits","API gateway"],["An API tailored to one kind of client","Backend for frontend"],["A registry of where each service's instances run","Service discovery"],["Replacing a monolith piece by piece behind a facade","Strangler fig"]],"extra":["Write-around"],"e":"Write-around is a caching strategy (module 4)."}],"probs":[["Reading · Microservices","https://martinfowler.com/articles/microservices.html","","list the nine characteristics Lewis and Fowler describe, and mark which ones your current system has"],["Reading · Monolith first","https://martinfowler.com/bliki/MonolithFirst.html","","summarise the argument, then find one case where starting with services was justified"],["Pattern · Backends for frontends","https://samnewman.io/patterns/architectural/bff/","","design the BFFs for an app with a web site, an iOS app and a partner API, and decide who owns each"],["Exercise · Strangler fig","https://martinfowler.com/bliki/StranglerFigApplication.html","","plan the order in which you'd extract three features from a monolith, and the shadowing check for each"]],"src":[["James Lewis and Martin Fowler: Microservices","https://martinfowler.com/articles/microservices.html"],["Martin Fowler: MonolithFirst","https://martinfowler.com/bliki/MonolithFirst.html"],["Sam Newman: Backends for frontends","https://samnewman.io/patterns/architectural/bff/"],["Martin Fowler: StranglerFigApplication","https://martinfowler.com/bliki/StranglerFigApplication.html"],["Kubernetes documentation: Service","https://kubernetes.io/docs/concepts/services-networking/service/"],["Melvin Conway: How do committees invent?","https://www.melconway.com/Home/Committees_Paper.html"]]},{"id":"m08","d":"d3","t":"Real-time communication: polling, long polling, SSE and WebSockets","min":100,"hook":"Chat messages, live scores, delivery tracking and shared documents all need the server to tell the client something the moment it happens. HTTP was built for the client to ask, so there are four ways around that, with different costs in requests, delay, open connections and complexity. At scale the hard part isn't the protocol: it's holding millions of long-lived connections and getting each message to the server that holds the right one.","pre":{"q":"A chat app polls the server every 2 seconds for new messages, with 1 million users online. How many requests per second is that, and how many of them return anything if a typical user gets a message every 2 minutes?","a":"500,000 requests per second, and only about 1 in 60 returns something new (one message every 120 seconds, a poll every 2 seconds), so roughly 98% of the work is wasted, and a message can still wait up to 2 seconds. Long polling, Server-Sent Events or WebSockets let the server answer only when there's something to say."},"kid":{"t":"Is my pizza ready?","x":"At Luigi's, Mia runs to the counter every minute to ask whether her pizza is ready; mostly the answer is no. Her brother just waits at the counter until the cook hands one over, then waits again for the next. Later, Luigi put up a speaker that announces each pizza the moment it's ready, so everyone simply listens. The big birthday table got a walkie-talkie: they can ask for extra cheese, and the cook can answer back. With three counters, Luigi keeps a list of who's waiting at which one, so each announcement reaches the right place.","map":[["Running to ask every minute","Polling: the client asks on a timer; simple, but mostly empty answers and up to a full interval late"],["Waiting at the counter until a pizza comes","Long polling: the server holds the request until there's news, then the client asks again"],["The speaker announcing each pizza","Server-Sent Events: one long HTTP response streaming events from server to client"],["The walkie-talkie","WebSocket: one long-lived, two-way connection"],["The list of who waits at which counter","A connection registry or pub/sub, so a message reaches the server holding the right connection"]],"brk":"Luigi's speaker reaches everyone in one room. Real users are spread over many servers, each holding its own connections, and mobile connections drop all the time, so clients must reconnect and catch up on what they missed."},"keys":["**Polling**: the client asks every N seconds. It's simple, stateless, cacheable and works everywhere, but most responses are empty, the load is clients × frequency whatever is happening, and updates arrive up to N seconds late. Fine for data that changes slowly, such as a dashboard refreshed every minute.","**Long polling**: the server holds the request until it has news or a timeout passes (often 20 to 30 seconds), replies, and the client asks again at once. Near-real-time over plain HTTP, without empty answers for every interval; but each message costs a full request and response, and the server holds one open request per client.","**Server-Sent Events (SSE)**: the client makes one HTTP request and the server keeps writing events to the response (Content-Type text/event-stream). One-way and text only, with automatic reconnection and a Last-Event-ID header so the server can resend what was missed. Good for feeds, notifications, live scores and streaming model output. Over HTTP/1.1 browsers allow only about 6 connections per site, so serve SSE over HTTP/2 when users open many tabs.","**WebSockets**: an HTTP request upgraded (101 Switching Protocols) to a persistent, full-duplex connection carrying small frames both ways. The lowest overhead per message and true two-way traffic: chat, multiplayer games, collaborative editing. Reconnection, heartbeats (ping and pong), ordering and re-authentication are yours to build, and proxies and load balancers may need configuring for long-lived connections.","**Choosing**: if the client sends often, WebSockets. If only the server pushes, SSE. If updates are rare, or the network blocks long-lived connections, polling or long polling. Many products mix them: WebSockets for chat, SSE for notifications, polling as a fallback.","**Holding connections**: an idle open connection costs memory and a file descriptor, not CPU, so one tuned server can hold a very large number. The load balancer must support long-lived connections and balance them by count; deploys must drain connections gently, because restarting a server disconnects everyone on it at once, and their reconnects need jitter.","**Routing messages**: users connect to different gateway servers, so a message for Bob must reach the server holding Bob's connection. Keep a registry (user to server, in Redis) and send there, or publish on a pub/sub channel per user or room that the right gateways subscribe to. Fan-out to very large rooms is the expensive case.","**Missed messages**: connections drop, so push is a fast path, not a guarantee. Store each message first, with a sequence number per conversation; clients that see a gap fetch the missing numbers, ignore duplicates, and on reconnect ask for everything after the last number they saw."],"dia":[{"type":"seq","cap":"Long polling","actors":["Client","Server","Message store"],"msgs":[["Client","Server","GET /updates?after=41 (held open)"],["Server","Message store","wait for anything after 41"],["Message store","Server","message 42, 25 s later",true],["Server","Client","200: message 42",true],["Client","Server","GET /updates?after=42 (held open)"],["Server","Client","204 after 30 s with no news",true]],"note":"No empty answers every few seconds, but each message still costs a full request and response, and the server holds one open request per client."},{"type":"tiers","cap":"The real-time layer of a chat system","tiers":[["Clients",["Phones and browsers, one WebSocket each"]],["Gateway servers",["gw-1","gw-2","gw-3","each holds many connections"],"WebSocket"],["Chat service",["Stores each message with the next sequence number","Finds where recipients are connected"],"messages in"],["Shared state",["Message store, partitioned by conversation","Connection registry (Redis)","Pub/sub to the gateways","Push notifications for offline devices"],"reads and writes"]],"note":"Store first, then push: the store is the source of truth, and the push is a fast path that clients back up with gap detection and catch-up on reconnect."},{"type":"tree","cap":"Choosing a technique","root":{"q":"Does the client send messages often (chat, games, shared editing)?","c":[["Yes","WebSockets"],["No",{"q":"Must updates arrive within a second or two?","c":[["No","Polling: simple, cacheable, cheap when updates are rare"],["Yes",{"q":"Can the network carry long-lived streaming responses?","c":[["Yes","Server-Sent Events"],["No","Long polling"]]}]]}]]}}],"cmp":[{"cap":"Four ways to get updates","head":["","Polling","Long polling","SSE","WebSocket"],"rows":[["Direction","The client asks","The client asks; the server waits","Server to client","Both ways"],["Delay","Up to one interval","Near zero","Near zero","Near zero"],["Cost per message","Many empty requests","One request per message","A few bytes on an open stream","A few bytes on an open connection"],["Reconnection","Not needed","Every reply ends the request","Automatic, resuming with Last-Event-ID","Yours to build"],["Good for","Slowly changing data","A fallback where streaming is blocked","Feeds, notifications, live scores","Chat, games, collaborative editing"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Ten messages in ten minutes: polling, long polling and push","tabs":[{"lang":"python","src":"def tenths(total, count):                          # an average, rounded to one decimal place, in whole numbers\n    t = (20 * total + count) // (2 * count)\n    return f\"{t // 10}.{t % 10}\"\n\ndef polling(arrivals, every, duration):\n    requests = empty = delay = 0\n    for t in range(every, duration + 1, every):    # a request every `every` seconds\n        requests += 1\n        new = [a for a in arrivals if t - every < a <= t]\n        if not new:\n            empty += 1                             # nothing happened since the last poll\n        delay += sum(t - a for a in new)           # each message waited until this poll\n    return requests, empty, delay\n\ndef long_polling(arrivals, timeout, duration):\n    requests = empty = 0\n    t = 0                                          # a request is open from time t\n    while t < duration:\n        upcoming = [a for a in arrivals if a > t]\n        if upcoming and upcoming[0] - t <= timeout:\n            t = upcoming[0]                        # the server answers the moment a message arrives\n        else:\n            t += timeout                           # nothing within the timeout: an empty answer\n            empty += 1\n        requests += 1\n    return requests, empty, 0\n\nrand = mulberry32(1)\narrivals = sorted(1 + int(rand() * 600) for _ in range(10))   # message times, in seconds\nfor label, (requests, empty, delay) in ((\"poll every 5 s\", polling(arrivals, 5, 600)),\n                                        (\"poll every 30 s\", polling(arrivals, 30, 600)),\n                                        (\"long polling, 30 s timeout\", long_polling(arrivals, 30, 600))):\n    print(f\"{label}: {requests} requests, {empty} empty, average delay {tenths(delay, len(arrivals))} s\")\nprint(\"push (SSE or WebSocket): 1 connection, 0 empty, average delay 0.0 s\")\n","out":"poll every 5 s: 120 requests, 110 empty, average delay 2.5 s\npoll every 30 s: 20 requests, 13 empty, average delay 15.0 s\nlong polling, 30 s timeout: 26 requests, 16 empty, average delay 0.0 s\npush (SSE or WebSocket): 1 connection, 0 empty, average delay 0.0 s\n","notes":[[11,"Most polls find nothing: 110 of 120 at a 5-second interval, and that cost grows with every connected client."],[12,"A message waits until the next poll, so the average delay is about half the interval: polling trades load for freshness."],[21,"Long polling answers the moment a message arrives (plus one network trip, ignored here), and sends one empty answer per quiet timeout."],[34,"Push keeps one connection open and sends only when there's news: no empty answers and no polling delay."]]},{"lang":"javascript","src":"function tenths(total, count) {                    // an average, rounded to one decimal place, in whole numbers\n  const t = Math.floor((20 * total + count) / (2 * count));\n  return `${Math.floor(t / 10)}.${t % 10}`;\n}\n\nfunction polling(arrivals, every, duration) {\n  let requests = 0, empty = 0, delay = 0;\n  for (let t = every; t <= duration; t += every) { // a request every `every` seconds\n    requests++;\n    const fresh = arrivals.filter(a => t - every < a && a <= t);\n    if (fresh.length === 0) empty++;               // nothing happened since the last poll\n    delay += fresh.reduce((sum, a) => sum + (t - a), 0);   // each message waited until this poll\n  }\n  return [requests, empty, delay];\n}\n\nfunction longPolling(arrivals, timeout, duration) {\n  let requests = 0, empty = 0, t = 0;              // a request is open from time t\n  while (t < duration) {\n    const upcoming = arrivals.filter(a => a > t);\n    if (upcoming.length && upcoming[0] - t <= timeout) {\n      t = upcoming[0];                             // the server answers the moment a message arrives\n    } else {\n      t += timeout;                                // nothing within the timeout: an empty answer\n      empty++;\n    }\n    requests++;\n  }\n  return [requests, empty, 0];\n}\n\nconst rand = mulberry32(1);\nconst arrivals = Array.from({ length: 10 }, () => 1 + Math.floor(rand() * 600)).sort((a, b) => a - b);   // message times, in seconds\nfor (const [label, [requests, empty, delay]] of [[\"poll every 5 s\", polling(arrivals, 5, 600)],\n                                                 [\"poll every 30 s\", polling(arrivals, 30, 600)],\n                                                 [\"long polling, 30 s timeout\", longPolling(arrivals, 30, 600)]]) {\n  console.log(`${label}: ${requests} requests, ${empty} empty, average delay ${tenths(delay, arrivals.length)} s`);\n}\nconsole.log(\"push (SSE or WebSocket): 1 connection, 0 empty, average delay 0.0 s\");\n","out":"poll every 5 s: 120 requests, 110 empty, average delay 2.5 s\npoll every 30 s: 20 requests, 13 empty, average delay 15.0 s\nlong polling, 30 s timeout: 26 requests, 16 empty, average delay 0.0 s\npush (SSE or WebSocket): 1 connection, 0 empty, average delay 0.0 s\n","notes":[[11,"Most polls find nothing: 110 of 120 at a 5-second interval, and that cost grows with every connected client."],[12,"A message waits until the next poll, so the average delay is about half the interval: polling trades load for freshness."],[22,"Long polling answers the moment a message arrives (plus one network trip, ignored here), and sends one empty answer per quiet timeout."],[39,"Push keeps one connection open and sends only when there's news: no empty answers and no polling delay."]]}]},{"t":"Server-Sent Events: the wire format, and resuming after a drop","tabs":[{"lang":"python","src":"EVENTS = [(1, \"score\", \"1-0\"), (2, \"score\", \"1-1\"), (3, \"card\", \"yellow: #4\"), (4, \"score\", \"2-1\")]   # id, type, data\n\ndef stream(last_event_id=0):\n    \"\"\"What the server writes on a text/event-stream response.\"\"\"\n    out = \"retry: 3000\\n\\n\"                        # ask the browser to wait 3 s before reconnecting\n    for eid, kind, data in EVENTS:\n        if eid > last_event_id:
