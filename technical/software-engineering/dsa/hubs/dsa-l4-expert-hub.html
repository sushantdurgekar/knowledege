<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DSA L4 Expert Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}

pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}

.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.scenario{font-size:.93rem}

details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}

/* Flashcards */

.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}

complete when every module quiz is at 80%+, the five labs and the capstone pass their tests in both languages, you have set and stress-tested one original problem with an editorial, and your contest record (for example a Codeforces rating of about 1900, or consistent upsolving) shows the techniques under time pressure."}],"howto":["Take the **diagnostic** first (15 minutes). It ranks the four topic areas by *weight × gap*.","Open **Roadmap**, set your hours per week and start date, and tick blocks off as you go.","In each module: guess the pre-question, read the **🍎 story**, then the key ideas, diagram and code. Do the worked example, then finish the faded one yourself.","Type each template (Tarjan SCC, Dinic, Kuhn matching, binary lifting, suffix array + LCP, monotone-chain hull, matrix power, Li Chao tree) from memory in both languages.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","Solve the module's problems (LeetCode and CSES), and stress-test every hard solution against a brute force before you trust it.","Enter a contest every two weeks (rated or virtual), upsolve the first problem you missed, and write a short review."],"tactics":["**Read the constraints and the shape**: directed reachability → SCCs; pairing → matching or flow; many tree path queries → LCA; many substring questions → a suffix array; points and lines → exact geometry.","**Prove before you code**: state why the greedy, the DP state or the reduction is correct, in two sentences.","**Check the numbers**: will values pass 2⁵³ (JavaScript) or 2⁶³ (other languages)? Will recursion pass 1,000 levels (Python)? Use exact integers for geometry.","**Write the brute force too**: a slow, obviously-correct version for tiny inputs is your test oracle.","**Stress-test**: generate thousands of small random inputs, compare, and shrink any failing case before debugging.","**Explain it**: if you can't explain the solution to a junior in five minutes, you don't own it yet."],"tacticsTitle":"Expert routine (use it on every hard problem)","labsIntro":"Five builds feed the capstone library. Write each one yourself in Python **and** JavaScript, run the tests (each one checks your code against a brute force), then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"These labs need only Python 3.12+ (plus pytest) and Node.js 22+. No cloud account and no cost. Keep each lab in its own folder with its tests."},"labsTab":"Build","interviewIntro":"At L4 the interviewer expects you to recognise reductions (to flow, to 2-SAT, to a suffix array), argue correctness, and test like a professional. Answer each question out loud in about two minutes, then compare with the model answer. State complexity every time.","interviewEyebrow":"From practice to interview","interviewSkills":"advanced graph algorithms, string data structures, computational geometry, algorithm design and testing","interviewTopics":"DSA L4 (SCCs and 2-SAT, max flow and min cut, bipartite matching, binary lifting and LCA, suffix arrays, square-root decomposition and Mo's algorithm, computational geometry, matrix exponentiation, DP optimisations, stress testing and problem setting)","roles":["Staff / senior software engineer","Algorithm or infrastructure engineer","Competitive programmer and problem setter"],"domains":[{"id":"d1","short":"A","name":"Flows, matching & graph structure","w":[30,30]},{"id":"d2","short":"B","name":"Trees, strings & advanced structures","w":[25,25]},{"id":"d3","short":"C","name":"Geometry & mathematics","w":[25,25]},{"id":"d4","short":"D","name":"Expert technique & teaching","w":[20,20]}],"groups":[{"id":"g1","t":"Flows, matching & graph structure","mods":["m01","m02","m03"]},{"id":"g2","t":"Trees, strings & structures","mods":["m04","m05","m06"]},{"id":"g3","t":"Geometry & maths","mods":["m07","m08"]},{"id":"g4","t":"Expert technique","mods":["m09","m10"]}],"modules":[{"id":"m01","d":"d1","t":"Strongly connected components and 2-SAT","min":110,"hook":"In a directed graph, “can A reach B and B reach A?” splits the vertices into strongly connected components. Collapsing each one to a single node turns any directed graph into a DAG: the first step in deadlock detection, compiler call-graph analysis and web crawling, and the engine behind a surprisingly powerful logic solver, 2-SAT.","pre":{"q":"In a one-way road network, call a group of towns “mutually reachable” if you can drive from any of them to any other. If you shrink each group to a single dot, can the shrunk map contain a cycle?","a":"No. If two shrunk dots sat on a cycle, every town in both groups could reach every other, so they would have been one group all along. The shrunk map, the condensation, is always a DAG."},"kid":{"t":"Ben's one-way slides","x":"In the playground every slide and ladder goes only one way. Ben finds he can get from the red tower to the blue tower and climb back again, so he paints them the same colour: they're one club. The green tower can be reached from the club, but there's no way back up, so it gets its own colour. Once every tower is painted, Tara draws one dot per colour, with arrows between colours. Her drawing never has a loop: a loop would have joined those colours into one club.","map":[["One-way slides and ladders","Directed edges"],["Towers you can reach and climb back from","A strongly connected component: every vertex reaches every other"],["Painting each club one colour","Labelling every vertex with its component"],["One dot per colour, arrows between colours","The condensation graph"],["Tara's drawing never loops","The condensation is always a DAG"]],"brk":"Ben looks at the whole playground at once, but code finds the clubs with depth-first search and low-link values (or a second search on the reversed graph). And 2-SAT uses the same clubs on true/false statements, where the bad sign is a statement and its opposite landing in the same club."},"keys":["**Strongly connected component (SCC)**: a maximal set of vertices in which every vertex can reach every other. Every directed graph splits into SCCs in exactly one way; a vertex on no cycle is an SCC on its own.","**The condensation** has one node per SCC and an edge between two SCCs whenever any edge joins them. It is always a DAG, so DAG tools apply: topological order, DP along that order, reachability counts.","**Kosaraju's algorithm**: DFS the graph and record each vertex when it finishes; then DFS the reversed graph, taking vertices in decreasing finishing time. Each tree of the second pass is one SCC, and they come out in topological order of the condensation. Two passes, O(V + E).","**Tarjan's algorithm**: one DFS with discovery times and low-link values, as for L3's bridges, plus a stack of vertices. Only edges to vertices still on the stack lower low[u]. When a vertex finishes with low[u] = tin[u], it's the root of an SCC: pop the stack down to it. O(V + E), and the SCCs come out in reverse topological order.","**Stay iterative**: both algorithms are depth-first, and a path of 10⁵ vertices is 10⁵ calls deep, past Python's 1,000-frame limit and Node's stack. Keep an explicit stack of [vertex, next edge index], as the prelude does.","**2-SAT**: a formula of clauses (a ∨ b), each with two literals. Each clause becomes two implications, ¬a → b and ¬b → a. The formula can be satisfied exactly when no variable x lands in the same SCC as ¬x. Encode literal x as 2x and ¬x as 2x + 1, so negation is `^ 1`.","**Reading off a solution**: set x true when x's component comes later than ¬x's in topological order. With Tarjan's numbering (sinks first) that is comp[x] < comp[¬x]. The whole solve is O(n + m) for n variables and m clauses.","**Functional graphs**: when every vertex has at most one outgoing edge (LeetCode 2360, 2127), each component holds at most one cycle with trees hanging into it. A walk that timestamps each vertex finds every cycle in O(n), with no general SCC algorithm."],"dia":[{"type":"graph","cap":"Four SCCs: {0, 1, 2}, {3, 4}, {5} and {6, 7}","directed":true,"h":200,"nodes":[["0",8,12],["1",26,12],["2",17,46],["3",40,46],["4",58,46],["5",76,46],["6",76,12],["7",94,12]],"edges":[["0","1"],["1","2"],["2","0"],["2","3"],["3","4"],["4","3"],["4","5"],["6","5"],["6","7"],["7","6"]],"hle":[["2","3"],["4","5"],["6","5"]],"note":"The highlighted edges join different SCCs. Shrinking each SCC to one node leaves the DAG {0, 1, 2} → {3, 4} → {5} ← {6, 7}: no cycle can run between components."},{"type":"flow","cap":"2-SAT on (x ∨ y) ∧ (¬x ∨ y) ∧ (¬y ∨ z)","steps":[["Each clause (a ∨ b) gives ¬a → b and ¬b → a","¬x → y, ¬y → x · x → y, ¬y → ¬x · y → z, ¬z → ¬y"],["Find the SCCs of the implication graph","No variable shares an SCC with its negation"],["So the formula can be satisfied","y and z must be true (¬y implies both x and ¬x); x may be either"]]}],"cmp":[{"cap":"Kosaraju or Tarjan?","head":["","Kosaraju","Tarjan"],"rows":[["Passes","Two: the graph, then the reversed graph","One"],["Extra memory","The reversed graph: O(V + E)","A vertex stack and low values: O(V)"],["Order of the SCCs it outputs","Topological order of the condensation","Reverse topological order"],["Easiest to get right","Yes: two plain DFS passes","Trickier: the on-stack check"],["Time","O(V + E)","O(V + E)"]]},{"cap":"Where SCCs and 2-SAT show up","head":["Problem shape","Technique","Cost"],"rows":[["Which vertices can all reach each other?","SCCs (Tarjan or Kosaraju)","O(V + E)"],["The best path value in a graph with cycles (collect every coin in a room)","SCCs, then DP over the condensation","O(V + E)"],["Can every vertex reach every other?","One SCC, or two BFS runs from vertex 0 (graph and reversed graph)","O(V + E)"],["Choose one of two options per item under pairwise rules","2-SAT","O(n + m)"],["Every vertex has at most one outgoing edge","Walk and timestamp: each component has at most one cycle","O(n)"]]}],"code":[{"t":"The SCC finder used by every example below (Tarjan, with an explicit stack)","tabs":[{"lang":"python","src":"def tarjan_scc(n, edges):                 # (count, comp); components numbered in reverse topological order\n    graph = [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n    tin, low, comp = [-1] * n, [0] * n, [-1] * n\n    on_stack, stack = [False] * n, []\n    timer = count = 0\n    for s in range(n):\n        if tin[s] != -1:\n            continue\n        tin[s] = low[s] = timer\n        timer += 1\n        stack.append(s)\n        on_stack[s] = True\n        work = [[s, 0]]                   # [vertex, next edge index]: an explicit call stack\n        while work:\n            u, i = work[-1]\n            if i < len(graph[u]):\n                work[-1][1] += 1\n                v = graph[u][i]\n                if tin[v] == -1:          # tree edge: \"call\" v\n                    tin[v] = low[v] = timer\n                    timer += 1\n                    stack.append(v)\n                    on_stack[v] = True\n                    work.append([v, 0])\n                elif on_stack[v]:         # an edge back into the current component\n                    low[u] = min(low[u], tin[v])\n            else:                         # u is finished: \"return\" to its parent\n                work.pop()\n                if work:\n                    p = work[-1][0]\n                    low[p] = min(low[p], low[u])\n                if low[u] == tin[u]:      # u is the root of an SCC: pop the whole SCC\n                    while True:\n                        w = stack.pop()\n                        on_stack[w] = False\n                        comp[w] = count\n                        if w == u:\n                            break\n                    count += 1\n    return count, comp\n"},{"lang":"javascript","src":"function tarjanScc(n, edges) {            // [count, comp]; components numbered in reverse topological order\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) graph[u].push(v);\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), comp = new Array(n).fill(-1);\n  const onStack = new Array(n).fill(false), stack = [];\n  let timer = 0, count = 0;\n  for (let s = 0; s < n; s++) {\n    if (tin[s] !== -1) continue;\n    tin[s] = low[s] = timer++;\n    stack.push(s);\n    onStack[s] = true;\n    const work = [[s, 0]];                // [vertex, next edge index]: an explicit call stack\n    while (work.length) {\n      const top = work[work.length - 1], u = top[0];\n      if (top[1] < graph[u].length) {\n        const v = graph[u][top[1]++];\n        if (tin[v] === -1) {              // tree edge: \"call\" v\n          tin[v] = low[v] = timer++;\n          stack.push(v);\n          onStack[v] = true;\n          work.push([v, 0]);\n        } else if (onStack[v]) low[u] = Math.min(low[u], tin[v]);   // an edge back into the current component\n      } else {                            // u is finished: \"return\" to its parent\n        work.pop();\n        if (work.length) {\n          const p = work[work.length - 1][0];\n          low[p] = Math.min(low[p], low[u]);\n        }\n        if (low[u] === tin[u]) {          // u is the root of an SCC: pop the whole SCC\n          let w;\n          do {\n            w = stack.pop();\n            onStack[w] = false;\n            comp[w] = count;\n          } while (w !== u);\n          count++;\n        }\n      }\n    }\n  }\n  return [count, comp];\n}\n"}]},{"t":"Tarjan in action: SCC labels, the condensation, and a 100,000-vertex cycle","tabs":[{"lang":"python","src":"edges = [(0, 1), (1, 2), (2, 0), (2, 3), (3, 4), (4, 3), (4, 5), (6, 5), (6, 7), (7, 6)]\ncount, comp = tarjan_scc(8, edges)\nprint(count, *comp)\ndag = sorted({(comp[u], comp[v]) for u, v in edges if comp[u] != comp[v]})\nprint(*(f\"{a}->{b}\" for a, b in dag))\n\nn = 100_000\nring = [(i, i + 1) for i in range(n - 1)] + [(n - 1, 0)]   # one huge cycle\nprint(tarjan_scc(n, ring)[0])\n","out":"4 2 2 2 1 1 0 3 3\n1->0 2->1 3->0\n1\n","notes":[[3,"{5} is found first (it's a sink), then {3, 4}, then {0, 1, 2}, then {6, 7}: reverse topological order."],[4,"Every edge of the condensation goes from a bigger component number to a smaller one, which is what reverse topological numbering means."],[9,"100,000 levels deep, yet no recursion: the prelude's explicit stack does the work."]]},{"lang":"javascript","src":"const edges = [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4], [4, 3], [4, 5], [6, 5], [6, 7], [7, 6]];\nconst [count, comp] = tarjanScc(8, edges);\nconsole.log(count, ...comp);\nconst dag = [...new Set(edges.filter(([u, v]) => comp[u] !== comp[v]).map(([u, v]) => `${comp[u]}->${comp[v]}`))].sort();\nconsole.log(...dag);\n\nconst n = 100000;\nconst ring = Array.from({ length: n - 1 }, (_, i) => [i, i + 1]).concat([[n - 1, 0]]);   // one huge cycle\nconsole.log(tarjanScc(n, ring)[0]);\n","out":"4 2 2 2 1 1 0 3 3\n1->0 2->1 3->0\n1\n","notes":[[3,"{5} is found first (it's a sink), then {3, 4}, then {0, 1, 2}, then {6, 7}: reverse topological order."],[4,"A Set of strings removes the duplicate component edges; the sort puts them in a fixed order."],[9,"100,000 levels deep, yet no recursion: the prelude's explicit stack does the work."]]}]},{"t":"Kosaraju: two passes, components in topological order","tabs":[{"lang":"python","src":"def kosaraju(n, edges):\n    graph, rev = [[] for _ in range(n)], [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n        rev[v].append(u)\n    order, seen = [], [False] * n\n    for s in range(n):                    # pass 1: record vertices by finishing time\n        if seen[s]:\n            continue\n        seen[s] = True\n        work = [[s, 0]]\n        while work:\n            u, i = work[-1]\n            if i < len(graph[u]):\n                work[-1][1] += 1\n                v = graph[u][i]\n                if not seen[v]:\n                    seen[v] = True\n                    work.append([v, 0])\n            else:\n                work.pop()\n                order.append(u)           # u's search is done: record it\n    comp, count = [-1] * n, 0\n    for s in reversed(order):             # pass 2: the reversed graph, latest finisher first\n        if comp[s] != -1:\n            continue\n        comp[s] = count\n        stack = [s]\n        while stack:\n            u = stack.pop()\n            for v in rev[u]:\n                if comp[v] == -1:\n                    comp[v] = count\n                    stack.append(v)\n        count += 1\n    return count, comp\n\nedges = [(0, 1), (1, 2), (2, 0), (2, 3), (3, 4), (4, 3), (4, 5), (6, 5), (6, 7), (7, 6)]\nprint(*kosaraju(8, edges)[1])\n","out":"1 1 1 2 2 3 0 0","notes":[[22,"A vertex is recorded when its search is done. Each component's last-recorded vertex comes after every vertex of the components it can reach, so the very last one lies in a source component."],[24,"The latest finisher sits in a source component of the condensation. In the reversed graph that component is a sink, so this search stays inside it."]]},{"lang":"javascript","src":"function kosaraju(n, edges) {\n  const graph = Array.from({ length: n }, () => []), rev = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    graph[u].push(v);\n    rev[v].push(u);\n  }\n  const order = [], seen = new Array(n).fill(false);\n  for (let s = 0; s < n; s++) {           // pass 1: record vertices by finishing time\n    if (seen[s]) continue;\n    seen[s] = true;\n    const work = [[s, 0]];\n    while (work.length) {\n      const top = work[work.length - 1], u = top[0];\n      if (top[1] < graph[u].length) {\n        const v = graph[u][top[1]++];\n        if (!seen[v]) {\n          seen[v] = true;\n          work.push([v, 0]);\n        }\n      } else {\n        work.pop();\n        order.push(u);                    // u's search is done: record it\n      }\n    }\n  }\n  const comp = new Array(n).fill(-1);\n  let count = 0;\n  for (let k = order.length - 1; k >= 0; k--) {   // pass 2: the reversed graph, latest finisher first\n    const s = order[k];\n    if (comp[s] !== -1) continue;\n    comp[s] = count;\n    const stack = [s];\n    while (stack.length) {\n      const u = stack.pop();\n      for (const v of rev[u]) if (comp[v] === -1) { comp[v] = count; stack.push(v); }\n    }\n    count++;\n  }\n  return [count, comp];\n}\n\nconst edges = [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4], [4, 3], [4, 5], [6, 5], [6, 7], [7, 6]];\nconsole.log(...kosaraju(8, edges)[1]);\n","out":"1 1 1 2 2 3 0 0","notes":[[22,"A vertex is recorded when its search is done. Each component's last-recorded vertex comes after every vertex of the components it can reach, so the very last one lies in a source component."],[28,"The latest finisher sits in a source component of the condensation. In the reversed graph that component is a sink, so this search stays inside it."]]}]},{"t":"2-SAT with the SCC finder","tabs":[{"lang":"python","src":"def two_sat(n, clauses):                  # literal 2*x means x, 2*x + 1 means not x\n    edges = []\n    for a, b in clauses:                  # (a or b) gives: not a -> b, and not b -> a\n        edges.append((a ^ 1, b))\n        edges.append((b ^ 1, a))\n    _, comp = tarjan_scc(2 * n, edges)\n    result = []\n    for x in range(n):\n        if comp[2 * x] == comp[2 * x + 1]:\n            return None                   # x and not x imply each other\n        result.append(comp[2 * x] < comp[2 * x + 1])\n    return result\n\nX, NOT_X, Y, NOT_Y, Z, NOT_Z = 0, 1, 2, 3, 4, 5\nsol = two_sat(3, [(X, Y), (NOT_X, Y), (NOT_Y, Z)])\nprint(*(\"T\" if v else \"F\" for v in sol))\nprint(two_sat(1, [(X, X), (NOT_X, NOT_X)]) is None)\n","out":"T T T\nTrue\n","notes":[[4,"If a is false, the clause forces b, and if b is false it forces a: two implications per clause."],[11,"Tarjan numbers sinks first, so a smaller number means later in topological order. Choosing the later of x and ¬x as true never lets a true literal imply a false one."],[17,"(x ∨ x) forces x and (¬x ∨ ¬x) forces ¬x, so x and ¬x end up in one SCC: no assignment exists."]]},{"lang":"javascript","src":"function twoSat(n, clauses) {             // literal 2*x means x, 2*x + 1 means not x\n  const edges = [];\n  for (const [a, b] of clauses) {         // (a or b) gives: not a -> b, and not b -> a\n    edges.push([a ^ 1, b]);\n    edges.push([b ^ 1, a]);\n  }\n  const [, comp] = tarjanScc(2 * n, edges);\n  const result = [];\n  for (let x = 0; x < n; x++) {\n    if (comp[2 * x] === comp[2 * x + 1]) return null;   // x and not x imply each other\n    result.push(comp[2 * x] < comp[2 * x + 1]);\n  }\n  return result;\n}\n\nconst [X, NOT_X, Y, NOT_Y, Z, NOT_Z] = [0, 1, 2, 3, 4, 5];\nconst sol = twoSat(3, [[X, Y], [NOT_X, Y], [NOT_Y, Z]]);\nconsole.log(...sol.map(v => (v ? \"T\" : \"F\")));\nconsole.log(twoSat(1, [[X, X], [NOT_X, NOT_X]]) === null ? \"True\" : \"False\");\n","out":"T T T\nTrue\n","notes":[[4,"If a is false, the clause forces b, and if b is false it forces a: two implications per clause."],[11,"Tarjan numbers sinks first, so a smaller number means later in topological order. Choosing the later of x and ¬x as true never lets a true literal imply a false one."],[19,"(x ∨ x) forces x and (¬x ∨ ¬x) forces ¬x, so x and ¬x end up in one SCC: no assignment exists."]]}]}],"ex":{"q":"Rooms joined by one-way tunnels each hold some coins. You may start anywhere, walk through tunnels as long as you like, and collect each room's coins the first time you enter it. What is the most you can collect? (CSES 1686, Coin Collector)","steps":["Inside an SCC you can visit every room and come back, so one SCC behaves like one big room worth the sum of its coins.","Shrink the SCCs: the condensation is a DAG, so the walk becomes a path in a DAG and no room is entered twice by accident.","DP in reverse topological order: best[c] = value[c] + the largest best[d] over the components d that c points to (or just value[c]).","The answer is the largest best[c]. Tarjan plus one pass over the edges: O(V + E)."],"code":{"t":"SCCs, then DP over the condensation","tabs":[{"lang":"python","src":"def max_coins(n, edges, coins):\n    count, comp = tarjan_scc(n, edges)\n    value = [0] * count\n    for v in range(n):\n        value[comp[v]] += coins[v]\n    out = [[] for _ in range(count)]\n    for u, v in edges:\n        if comp[u] != comp[v]:\n            out[comp[u]].append(comp[v])\n    best = value[:]\n    for c in range(count):                # Tarjan's order: every successor has a smaller number\n        for d in out[c]:\n            best[c] = max(best[c], value[c] + best[d])\n    return max(best)\n\nedges = [(0, 1), (1, 2), (2, 0), (2, 3), (3, 4), (4, 3), (4, 5), (6, 5), (6, 7), (7, 6)]\nprint(max_coins(8, edges, [1, 2, 3, 4, 5, 6, 7, 8]), max_coins(4, [(0, 1), (2, 3)], [5, 1, 2, 9]))\n","out":"21 11"},{"lang":"javascript","src":"function maxCoins(n, edges, coins) {\n  const [count, comp] = tarjanScc(n, edges);\n  const value = new Array(count).fill(0);\n  for (let v = 0; v < n; v++) value[comp[v]] += coins[v];\n  const out = Array.from({ length: count }, () => []);\n  for (const [u, v] of edges) if (comp[u] !== comp[v]) out[comp[u]].push(comp[v]);\n  const best = [...value];\n  for (let c = 0; c < count; c++)         // Tarjan's order: every successor has a smaller number\n    for (const d of out[c]) best[c] = Math.max(best[c], value[c] + best[d]);\n  return Math.max(...best);\n}\n\nconst edges = [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4], [4, 3], [4, 5], [6, 5], [6, 7], [7, 6]];\nconsole.log(maxCoins(8, edges, [1, 2, 3, 4, 5, 6, 7, 8]), maxCoins(4, [[0, 1], [2, 3]], [5, 1, 2, 9]));\n","out":"21 11"}]},"a":"21 and 11. In the first graph, {0, 1, 2} (6 coins) → {3, 4} (9) → {5} (6) gives 21, and so does {6, 7} (15) → {5} (6). In the second, the best is room 2 then room 3: 2 + 9 = 11."},"fade":{"q":"Every node has at most one outgoing edge: edges[i] is the node i points to, or −1. Return the length of the longest cycle, or −1 if there's none (LeetCode 2360, Longest Cycle in a Graph).","steps":["With at most one way out of each node, a walk from a node never branches: it either stops at −1, runs into a node seen on an earlier walk, or comes back to a node seen on this walk.",{"ask":"What should you store for each node the first time any walk reaches it?","a":"The global step number at that moment (a timestamp). Steps keep counting across walks, so a stamp at or after this walk's first step means the node was reached on this walk, and meeting it again closes a cycle."},{"ask":"When the walk returns to a node it saw earlier on this walk, how long is the cycle?","a":"The current step number minus that node's timestamp."},{"ask":"Time and space?","a":"O(n) time, because every node is stamped once and each walk stops at the first stamped node, and O(n) space for the stamps."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def longest_cycle(edges):\n    n = len(edges)\n    stamp = [-1] * n                      # the step at which a node was first reached\n    step, best = 0, -1\n    for s in range(n):\n        start = step                      # steps from here on belong to this walk\n        u = s\n        while u != -1 and stamp[u] == -1:\n            stamp[u] = step\n            step += 1\n            u = edges[u]\n        ...                               # TODO: did the walk stop at a node from this walk?\n    return best\n"},{"lang":"javascript","src":"function longestCycle(edges) {\n  const n = edges.length, stamp = new Array(n).fill(-1);   // the step at which a node was first reached\n  let step = 0, best = -1;\n  for (let s = 0; s < n; s++) {\n    const start = step;                   // steps from here on belong to this walk\n    let u = s;\n    while (u !== -1 && stamp[u] === -1) {\n      stamp[u] = step++;\n      u = edges[u];\n    }\n    // TODO: did the walk stop at a node from this walk?\n  }\n  return best;\n}\n"}]},"solution":{"t":"Solution: timestamps reveal the cycle","tabs":[{"lang":"python","src":"def longest_cycle(edges):\n    n = len(edges)\n    stamp = [-1] * n                      # the step at which a node was first reached\n    step, best = 0, -1\n    for s in range(n):\n        start = step                      # steps from here on belong to this walk\n        u = s\n        while u != -1 and stamp[u] == -1:\n            stamp[u] = step\n            step += 1\n            u = edges[u]\n        if u != -1 and stamp[u] >= start:  # back to a node from this same walk\n            best = max(best, step - stamp[u])\n    return best\n\nprint(longest_cycle([3, 3, 4, 2, 3]), longest_cycle([2, -1, 3, 1]), longest_cycle([1, 0, 0, 4, 5, 6, 3]))\n","out":"3 -1 4"},{"lang":"javascript","src":"function longestCycle(edges) {\n  const n = edges.length, stamp = new Array(n).fill(-1);   // the step at which a node was first reached\n  let step = 0, best = -1;\n  for (let s = 0; s < n; s++) {\n    const start = step;                   // steps from here on belong to this walk\n    let u = s;\n    while (u !== -1 && stamp[u] === -1) {\n      stamp[u] = step++;\n      u = edges[u];\n    }\n    if (u !== -1 && stamp[u] >= start) best = Math.max(best, step - stamp[u]);   // back to a node from this walk\n  }\n  return best;\n}\n\nconsole.log(longestCycle([3, 3, 4, 2, 3]), longestCycle([2, -1, 3, 1]), longestCycle([1, 0, 0, 4, 5, 6, 3]));\n","out":"3 -1 4"}]}},"traps":[["“Any edge to a visited vertex can lower low[u] in Tarjan's algorithm.”","Only edges to vertices still on the stack count. An edge into a component that's already finished is a cross edge between components; letting it lower low[u] would merge SCCs that aren't mutually reachable."],["“The condensation can contain a cycle.”","Never: a cycle through two components would make every vertex in them mutually reachable, so they would be one SCC."],["“Kosaraju's second pass runs on the original graph.”","It runs on the reversed graph, taking vertices in decreasing finishing time. On the original graph the search would spill out of a source component into everything it reaches."],["“A recursive SCC algorithm is fine for 10⁵ vertices.”","A path of 10⁵ vertices recurses 10⁵ deep: RecursionError in Python and a stack overflow in Node.js. Keep an explicit stack of [vertex, next edge index]."],["“2-SAT has no solution as soon as x can reach ¬x.”","x → ¬x alone only forces x to be false. There's no solution only when x and ¬x are in the same SCC, so each forces the other."],["“3-SAT can be solved the same way.”","A clause of three literals doesn't turn into implications between single literals, and 3-SAT is NP-complete. The SCC trick works only when every clause has at most two literals."]],"disc":[["Why does the 2-SAT rule “make true whichever of x and ¬x comes later in topological order” work?","Implications only point forwards in topological order. If x comes after ¬x, then x, which we make true, can only imply literals even later, and ¬x, which is false, sits earlier, where it can't be implied by a true literal. Doing this for every variable at once stays consistent because the implication graph is symmetric: whenever a → b, also ¬b → ¬a."],["Where do SCCs show up outside contests?","Deadlock detection (processes waiting on each other form a cycle, an SCC of the wait-for graph), compilers (mutually recursive functions form an SCC of the call graph and are analysed together), package managers (dependency cycles), and the web graph, which has a giant strongly connected core."]],"teach":{"prompt":"Explain to a junior colleague what a strongly connected component is, and how 2-SAT uses SCCs to decide whether a set of either-or rules can all be satisfied.","rubric":["In an SCC every vertex reaches every other; the SCCs split the vertices","The condensation of the SCCs is a DAG","Tarjan or Kosaraju finds them in O(V + E)","Each clause (a ∨ b) becomes ¬a → b and ¬b → a","No solution exactly when some x and ¬x share an SCC"],"model":"In a directed graph, an SCC is a largest group of vertices that can all reach each other. Every vertex belongs to exactly one, and if you shrink each SCC to a single node you get the condensation, which is always a DAG, because a cycle between two groups would have merged them. Tarjan's algorithm finds all SCCs in one depth-first search with low-link values, and Kosaraju's in two, both in O(V + E). 2-SAT asks whether you can satisfy rules of the form “a or b”. Each rule becomes two implications: if a is false then b must be true, and if b is false then a must be. Build that implication graph over the literals and find its SCCs. If some variable and its negation land in the same SCC, each forces the other, so there's no solution. Otherwise you can read a solution off the topological order: make true whichever of x and ¬x comes later. The whole thing is linear in the number of variables and rules."},"qa":[["What is a strongly connected component?","A maximal set of vertices in a directed graph where every vertex can reach every other."],["What shape is the condensation of a directed graph?","Always a DAG: one node per SCC."],["In Tarjan's algorithm, which edges lower low[u]?","Tree edges (through the child's low) and edges to vertices still on the stack; edges into finished components don't."],["How does Kosaraju's algorithm find the SCCs?","DFS for finishing times, then DFS on the reversed graph in decreasing finishing time; each tree is an SCC."],["How does 2-SAT turn a clause (a ∨ b) into edges?","¬a → b and ¬b → a."],["When does a 2-SAT formula have no solution?","When some variable x is in the same SCC as ¬x."]],"quiz":[{"q":"What does this print? (`tarjan_scc` / `tarjanScc` is this module's helper.)","snip":{"t":"Count the components","tabs":[{"lang":"python","src":"count, comp = tarjan_scc(5, [(0, 1), (1, 0), (1, 2), (2, 3), (3, 2), (3, 4)])\nsame = lambda a, b: \"yes\" if comp[a] == comp[b] else \"no\"\nprint(count, same(0, 1), same(1, 2), same(2, 3))\n"},{"lang":"javascript","src":"const [count, comp] = tarjanScc(5, [[0, 1], [1, 0], [1, 2], [2, 3], [3, 2], [3, 4]]);\nconst same = (a, b) => (comp[a] === comp[b] ? \"yes\" : \"no\");\nconsole.log(count, same(0, 1), same(1, 2), same(2, 3));\n"}]},"o":["3 yes no yes","2 yes yes yes","5 no no no","3 yes yes no"],"a":0,"e":"{0, 1} and {2, 3} are 2-cycles, and 4 is alone: 3 SCCs. 1 reaches 2, but 2 can't get back to 1, so they're in different components."},{"q":"What does this print?","snip":{"t":"Encoding a clause","tabs":[{"lang":"python","src":"lit = lambda v, neg=False: 2 * v + (1 if neg else 0)\na, b = lit(0), lit(1, neg=True)          # the clause (x0 or not x1)\nprint(a ^ 1, b, b ^ 1, a)                # the edges: (not a) -> b and (not b) -> a\n"},{"lang":"javascript","src":"const lit = (v, neg = false) => 2 * v + (neg ? 1 : 0);\nconst a = lit(0), b = lit(1, true);       // the clause (x0 or not x1)\nconsole.log(a ^ 1, b, b ^ 1, a);          // the edges: (not a) -> b and (not b) -> a\n"}]},"o":["1 3 2 0","0 3 2 1","1 2 3 0","1 3 0 2"],"a":0,"e":"x0 is literal 0 and ¬x1 is literal 3. Negation flips the last bit: ¬x0 is 1 and x1 is 2. So the edges are 1 → 3 (¬x0 → ¬x1) and 2 → 0 (x1 → x0)."},{"q":"Which statement about the condensation of a directed graph is always true?","o":["It's a DAG","It's a tree","It has one node per cycle of the graph","It's strongly connected"],"a":0,"e":"A cycle between components would merge them, so there's none. It needn't be a tree (two components can both point to a third), and one SCC can contain many cycles."},{"q":"Which statements about Tarjan's algorithm are true? (choose 2)","t":"ms","o":["It finds every SCC in one depth-first search, in O(V + E)","It outputs the SCCs in reverse topological order of the condensation","It needs the reversed graph","Any edge to an already-visited vertex lowers low[u]","It works only on acyclic graphs"],"a":[0,1],"e":"Kosaraju is the one that needs the reversed graph. Only edges to vertices still on the stack lower low[u]. And a DAG is the dull case: every SCC is a single vertex."},{"q":"Judge each statement.","t":"yn","s":[["In 2-SAT, the clause (a ∨ b) becomes the implications ¬a → b and ¬b → a.",true],["A 2-SAT formula has no solution whenever x can reach ¬x.",false],["Kosaraju's algorithm needs two depth-first passes.",true],["If every vertex has exactly one outgoing edge, every weakly connected component contains exactly one cycle.",true]],"e":"Each clause forbids both literals being false, which is exactly those two implications. x → ¬x only forces x false; the contradiction needs both directions. Kosaraju runs once on the graph and once on its reverse. With exactly one way out of each vertex, every walk ends in a cycle, and a component can't hold two."},{"q":"Put the steps of solving 2-SAT in order.","t":"ord","items":["Turn each clause (a ∨ b) into the implications ¬a → b and ¬b → a","Find the SCCs of the implication graph","If some x shares an SCC with ¬x, report that there's no solution","Otherwise set each x from the order of the components of x and ¬x"],"e":"The SCCs need the graph, the check needs the SCCs, and the assignment is only safe once the check has passed."},{"q":"Complete the Python 2-SAT solver (`tarjan_scc` is this module's helper).","t":"drop","lang":"python","code":"def solve(n, clauses):                     # literal 2*x means x, 2*x + 1 means not x\n    edges = []\n    for a, b in clauses:\n        edges.append((a ^ 1, {{0}}))\n        edges.append(({{1}}, a))\n    count, comp = tarjan_scc(2 * n, edges)\n    if any(comp[2 * x] == comp[2 * x + 1] for x in range(n)):\n        return None\n    return [comp[2 * x] {{2}} comp[2 * x + 1] for x in range(n)]\n","blanks":[{"o":["b","b ^ 1","a","a ^ 1"],"a":0},{"o":["b ^ 1","b","a ^ 1","a"],"a":0},{"o":["<",">","==","!="],"a":0}],"e":"(a ∨ b) means ¬a → b and ¬b → a. Tarjan numbers sinks first, so x is true when its component number is smaller than ¬x's."},{"q":"Match each problem to its technique.","t":"match","pairs":[["Which vertices can all reach each other?","Strongly connected components"],["Collect the most coins in a graph with cycles","SCCs, then DP over the condensation"],["Pick one of two options per item under pairwise rules","2-SAT on the implication graph"],["Every node has at most one outgoing edge","A walk with timestamps finds each cycle"]],"extra":["Prim's algorithm"],"e":"SCCs answer mutual reachability, the condensation turns cycles into a DAG for DP, 2-SAT is SCCs on literals, and a functional graph needs only a timestamped walk."}],"probs":[["LC 802 · Find Eventual Safe States","https://leetcode.com/problems/find-eventual-safe-states/","Medium","a node is safe if it can't reach a cycle: peel nodes with no way out on the reversed graph, or use SCCs"],["LC 2360 · Longest Cycle in a Graph","https://leetcode.com/problems/longest-cycle-in-a-graph/","Hard","the faded example: one outgoing edge per node, so a timestamped walk finds every cycle"],["LC 2127 · Maximum Employees to Be Invited to a Meeting","https://leetcode.com/problems/maximum-employees-to-be-invited-to-a-meeting/","Hard","a functional graph: take the longest cycle, or the sum over 2-cycles of each pair plus its two longest arms"],["CSES 1682 · Flight Routes Check","https://cses.fi/problemset/task/1682","","BFS from city 1 in the graph and in the reversed graph; print the first city either one misses"],["CSES 1683 · Planets and Kingdoms","https://cses.fi/problemset/task/1683","","label the SCCs: the prelude's Tarjan, numbered from 1"],["CSES 1686 · Coin Collector","https://cses.fi/problemset/task/1686","","the worked example: SCCs, then DP over the condensation"],["CSES 1684 · Giant Pizza","https://cses.fi/problemset/task/1684","","2-SAT: each family member's two wishes form one clause"]],"src":[["cp-algorithms: Strongly connected components and the condensation graph","https://cp-algorithms.com/graph/strongly-connected-components.html"],["cp-algorithms: 2-SAT","https://cp-algorithms.com/graph/2SAT.html"],["Wikipedia: Tarjan's strongly connected components algorithm","https://en.wikipedia.org/wiki/Tarjan%27s_strongly_connected_components_algorithm"],["CSES Problem Set (graph algorithms section)","https://cses.fi/problemset/"]]},{"id":"m02","d":"d1","t":"Maximum flow and minimum cut","min":120,"hook":"How much data can a network push from a server to a client, and which few links would an attacker have to cut to stop it? Those are one question, maximum flow, and its mirror image, the minimum cut. Problems that look nothing like pipes (disjoint routes, seating plans, choosing projects that need costly tools) are solved by building the right network and running one flow algorithm.","pre":{"q":"Pipes carry water from a reservoir to a town, each up to some litres a second. You could also close pipes to cut the town off. How does the most water you can send compare with the smallest total capacity of pipes you'd have to close?","a":"They're equal. Every litre has to cross any set of pipes that cuts the town off, so the flow can't beat the cheapest cut, and the max-flow min-cut theorem says the best flow always reaches it. Finding one gives you the other."},"kid":{"t":"Tara's marble run","x":"Tara builds a marble run from a top bucket to a bottom bucket, and each tube fits only so many marbles a minute. Ben keeps finding routes with room to spare and pours more marbles down them. When he gets stuck, he takes back part of an earlier choice: fewer marbles down one tube frees room to send them a better way. When no route has space left, Tara points to a few full tubes. Block just those and nothing reaches the bottom, and their sizes add up to exactly the marbles a minute Ben is sending.","map":[["Tubes, each fitting so many marbles a minute","Directed edges with capacities"],["The top and bottom buckets","The source s and the sink t"],["A route with room to spare","An augmenting path in the residual graph"],["Taking back marbles from an earlier tube","Pushing flow along a reverse residual edge, which cancels earlier flow"],["The full tubes Tara would block","A minimum cut, whose capacity equals the maximum flow"]],"brk":"Ben picks routes by luck, but fast algorithms pick shortest routes first, and that choice is what bounds their running time. And “taking back” is only bookkeeping: a reverse residual edge isn't a real tube running uphill, just a record that earlier flow may be cancelled."},"keys":["**Flow network**: a directed graph with a capacity c(u, v) ≥ 0 on each edge, a source s and a sink t. A flow puts 0 ≤ f(u, v) ≤ c(u, v) on every edge, and each vertex except s and t passes on exactly what it receives. The flow's value is the net amount leaving s.","**Residual graph**: an edge with flow f can take c − f more, and it can also give back up to f, which is a reverse edge with capacity f. Store each edge beside its reverse (indexes e and e ^ 1), so pushing x units is cap[e] −= x and cap[e ^ 1] += x.","**Augmenting paths (Ford–Fulkerson)**: while the residual graph has an s–t path, push its bottleneck along it. Reverse edges let a later path undo an earlier bad choice. With integer capacities each push adds at least 1, so there are at most F pushes for a maximum flow F, each O(V + E).","**Edmonds–Karp and Dinic**: augmenting along shortest paths (by edge count) caps the number of rounds whatever the capacities. Edmonds–Karp takes one BFS path at a time, O(V E²). Dinic sets BFS levels, then saturates every shortest path at once (a blocking flow) with current-arc pointers: O(V² E) in general and O(E √V) for unit-capacity bipartite matching.","**Max-flow min-cut theorem**: an s–t cut splits the vertices into S, containing s, and T, containing t; its capacity is the total capacity of edges from S to T. Every flow is at most every cut, and the maximum flow equals the minimum cut. After a maximum flow, the vertices s still reaches in the residual graph are the S side of a minimum cut.","**Integer capacities give integer flows**: then a maximum flow exists with a whole number on every edge, and augmenting-path algorithms find one. That's what lets flow count things: disjoint routes, seated students, matched pairs.","**Modelling tricks**: an undirected edge becomes two directed edges; a vertex capacity splits v into v_in → v_out; several sources or sinks hang off a super source and a super sink; edge-disjoint paths are a max flow with every capacity 1 (Menger's theorem).","**Min cut as a model (project selection)**: to choose items with profits, costs and “a needs b” rules, add s → item for each profit, item → t for each cost and a → b with an infinite capacity. The best total is the sum of all profits minus the minimum cut, and the chosen items are the cut's S side."],"dia":[{"type":"graph","cap":"Why reverse edges matter (every capacity is 1)","directed":true,"h":200,"nodes":[["s",8,30],["a",50,6],["b",50,54],["t",92,30]],"edges":[["s","a","1"],["s","b","1"],["a","b","1"],["a","t","1"],["b","t","1"]],"hle":[["s","a"],["a","b"],["b","t"]],"note":"If the first path is s → a → b → t (highlighted), no second path uses forward edges alone. The residual graph has a reverse edge b → a, so s → b → a → t cancels the flow on a → b and the total reaches 2. Dinic avoids this path from the start: a → b doesn't lead to the next BFS level."},{"type":"graph","cap":"Maximum flow 19 (s = 0, t = 5) and the minimum cut that proves it","directed":true,"h":230,"nodes":[["0",6,30,"s"],["1",34,8],["2",34,52],["3",66,8],["4",66,52],["5",94,30,"t"]],"edges":[["0","1","10"],["0","2","10"],["1","2","2"],["1","3","4"],["1","4","8"],["2","4","9"],["4","3","6"],["3","5","10"],["4","5","10"]],"hl":["0","2"],"hle":[["0","1"],["2","4"]],"note":"After the maximum flow, s still reaches only vertex 2 in the residual graph, so S = {s, 2}. The edges leaving S are s → 1 (10) and 2 → 4 (9): 19 in total, so no flow can beat 19. Cutting just before t (3 → t and 4 → t) costs 20, one more than the minimum."}],"cmp":[{"cap":"Which max-flow algorithm?","head":["","Ford–Fulkerson (any path)","Edmonds–Karp","Dinic"],"rows":[["Path choice","Any augmenting path, often by DFS","A shortest path (BFS), one per round","All shortest paths per round: a blocking flow"],["Time","O(E · F) with integer capacities, F the flow value","O(V E²)","O(V² E); O(E √V) for unit-capacity matching"],["Use it when","The flow value is small","You want short, safe code","Graphs are large or the flow is big"]]},{"cap":"Modelling tricks","head":["Need","Build","Why it works"],"rows":[["An undirected edge {u, v} of capacity c","u → v and v → u, each of capacity c","Opposite flows cancel, so an optimal flow never needs both"],["Vertex v carries at most c","v_in → v_out with capacity c","All flow through v must cross that one edge"],["Several sources or sinks","A super source → each source, each sink → a super sink","One s–t flow now covers them all"],["Count routes that share no edge","Capacity 1 on every edge","An integer flow of k splits into k such routes (Menger)"],["Choose items with profits, costs and “a needs b” rules","s → profit item, cost item → t, a → b with ∞","Each finite cut is a valid choice, and its capacity is the profit lost"]]}],"code":[{"t":"The max-flow solver used by every example below (Dinic's algorithm, no recursion)","tabs":[{"lang":"python","src":"class MaxFlow:                                  # Dinic's algorithm\n    def __init__(self, n):\n        self.n, self.adj = n, [[] for _ in range(n)]\n        self.to, self.cap = [], []              # edge e and its reverse e ^ 1 sit side by side\n\n    def add_edge(self, u, v, c):\n        self.adj[u].append(len(self.to)); self.to.append(v); self.cap.append(c)\n        self.adj[v].append(len(self.to)); self.to.append(u); self.cap.append(0)\n\n    def _levels(self, s):                       # BFS distances from s using edges with spare capacity\n        level = [-1] * self.n\n        level[s], q = 0, [s]\n        for u in q:\n            for e in self.adj[u]:\n                if self.cap[e] > 0 and level[self.to[e]] < 0:\n                    level[self.to[e]] = level[u] + 1\n                    q.append(self.to[e])\n        return level\n\n    def _next_edge(self, u, level, it):         # first usable edge out of u, or -1\n        while it[u] < len(self.adj[u]):\n            e = self.adj[u][it[u]]\n            if self.cap[e] > 0 and level[self.to[e]] == level[u] + 1:\n                return e\n            it[u] += 1\n        return -1\n\n    def max_flow(self, s, t):\n        flow = 0\n        while (level := self._levels(s))[t] >= 0:\n            it = [0] * self.n                   # current-arc pointers: dead edges stay skipped\n            while True:                         # one shortest augmenting path per pass\n                path, u = [], s\n                while u != t:\n                    e = self._next_edge(u, level, it)\n                    if e >= 0:\n                        path.append(e)\n                        u = self.to[e]\n                    elif u == s:\n                        break                   # s is stuck: this level graph is used up\n                    else:\n                        u = self.to[path.pop() ^ 1]   # back to the tail of the last edge\n                        it[u] += 1                    # and never try that edge again this round\n                if u != t:\n                    break\n                f = min(self.cap[e] for e in path)\n                for e in path:\n                    self.cap[e] -= f\n                    self.cap[e ^ 1] += f\n                flow += f\n        return flow\n\n    def source_side(self, s):                   # after max_flow: what s still reaches is a min cut's side\n        return [d >= 0 for d in self._levels(s)]\n"},{"lang":"javascript","src":"class MaxFlow {                                 // Dinic's algorithm\n  constructor(n) {\n    this.n = n;\n    this.adj = Array.from({ length: n }, () => []);\n    this.to = []; this.cap = [];                // edge e and its reverse e ^ 1 sit side by side\n  }\n  addEdge(u, v, c) {\n    this.adj[u].push(this.to.length); this.to.push(v); this.cap.push(c);\n    this.adj[v].push(this.to.length); this.to.push(u); this.cap.push(0);\n  }\n  levels(s) {                                   // BFS distances from s using edges with spare capacity\n    const level = new Array(this.n).fill(-1), q = [s];\n    level[s] = 0;\n    for (let h = 0; h < q.length; h++) {\n      const u = q[h];\n      for (const e of this.adj[u]) {\n        if (this.cap[e] > 0 && level[this.to[e]] < 0) {\n          level[this.to[e]] = level[u] + 1;\n          q.push(this.to[e]);\n        }\n      }\n    }\n    return level;\n  }\n  nextEdge(u, level, it) {                      // first usable edge out of u, or -1\n    for (; it[u] < this.adj[u].length; it[u]++) {\n      const e = this.adj[u][it[u]];\n      if (this.cap[e] > 0 && level[this.to[e]] === level[u] + 1) return e;\n    }\n    return -1;\n  }\n  maxFlow(s, t) {\n    let flow = 0, level;\n    while ((level = this.levels(s))[t] >= 0) {\n      const it = new Array(this.n).fill(0);     // current-arc pointers: dead edges stay skipped\n      for (;;) {                                // one shortest augmenting path per pass\n        const path = [];\n        let u = s;\n        while (u !== t) {\n          const e = this.nextEdge(u, level, it);\n          if (e >= 0) { path.push(e); u = this.to[e]; continue; }\n          if (u === s) break;                   // s is stuck: this level graph is used up\n          u = this.to[path.pop() ^ 1];          // back to the tail of the last edge\n          it[u]++;                              // and never try that edge again this round\n        }\n        if (u !== t) break;\n        let f = Infinity;\n        for (const e of path) f = Math.min(f, this.cap[e]);\n        for (const e of path) { this.cap[e] -= f; this.cap[e ^ 1] += f; }\n        flow += f;\n      }\n    }\n    return flow;\n  }\n  sourceSide(s) {                               // after maxFlow: what s still reaches is a min cut's side\n    return this.levels(s).map(d => d >= 0);\n  }\n}\n"}]},{"t":"Dinic on a small network, and the minimum cut that proves the answer","tabs":[{"lang":"python","src":"edges = [(0, 1, 10), (0, 2, 10), (1, 2, 2), (1, 3, 4), (1, 4, 8), (2, 4, 9), (4, 3, 6), (3, 5, 10), (4, 5, 10)]\ng = MaxFlow(6)\nfor u, v, c in edges:\n    g.add_edge(u, v, c)\nprint(g.max_flow(0, 5))\nside = g.source_side(0)\nprint(*(v for v in range(6) if side[v]))\ncut = [(u, v, c) for u, v, c in edges if side[u] and not side[v]]\nprint(*(f\"{u}->{v}\" for u, v, c in cut), \"=\", sum(c for u, v, c in cut))\n","out":"19\n0 2\n0->1 2->4 = 19\n","notes":[[5,"Two Dinic rounds (BFS levels, then a blocking flow) reach 19; a third BFS finds no path to t."],[6,"One more BFS on the residual graph: s reaches only vertex 2, because s → 1 and 2 → 4 are full."],[9,"The edges from S to the rest add up to the flow. That equality is the proof that 19 is the maximum."]]},{"lang":"javascript","src":"const edges = [[0, 1, 10], [0, 2, 10], [1, 2, 2], [1, 3, 4], [1, 4, 8], [2, 4, 9], [4, 3, 6], [3, 5, 10], [4, 5, 10]];\nconst g = new MaxFlow(6);\nfor (const [u, v, c] of edges) g.addEdge(u, v, c);\nconsole.log(g.maxFlow(0, 5));\nconst side = g.sourceSide(0);\nconsole.log(...[0, 1, 2, 3, 4, 5].filter(v => side[v]));\nconst cut = edges.filter(([u, v]) => side[u] && !side[v]);\nconsole.log(...cut.map(([u, v]) => `${u}->${v}`), \"=\", cut.reduce((sum, [, , c]) => sum + c, 0));\n","out":"19\n0 2\n0->1 2->4 = 19\n","notes":[[4,"Two Dinic rounds (BFS levels, then a blocking flow) reach 19; a third BFS finds no path to t."],[5,"One more BFS on the residual graph: s reaches only vertex 2, because s → 1 and 2 → 4 are full."],[8,"The edges from S to the rest add up to the flow. That equality is the proof that 19 is the maximum."]]}]},{"t":"Disjoint routes: unit capacities, recovering the routes, and splitting vertices","tabs":[{"lang":"python","src":"def disjoint_routes(n, edges, s, t):          # routes that share no edge\n    g = MaxFlow(n)\n    for u, v in edges:\n        g.add_edge(u, v, 1)\n    k = g.max_flow(s, t)\n    out = [[] for _ in range(n)]\n    for i, (u, v) in enumerate(edges):\n        if g.cap[2 * i] == 0:                 # a full unit edge carries one route\n            out[u].append(v)\n    routes = []\n    for _ in range(k):\n        route = [s]\n        while route[-1] != t:\n            route.append(out[route[-1]].pop())   # follow a used edge and spend it\n        routes.append(route)\n    return routes\n\ndef vertex_disjoint(n, edges, s, t):          # routes that share no vertex except s and t\n    g = MaxFlow(2 * n)                        # v_in = v, v_out = v + n\n    for v in range(n):\n        g.add_edge(v, v + n, 1)               # each vertex can carry one route\n    for u, v in edges:\n        g.add_edge(u + n, v, 1)\n    return g.max_flow(s + n, t)\n\nedges = [(0, 1), (0, 2), (1, 3), (2, 3), (3, 4), (3, 5), (4, 6), (5, 6)]\nroutes = disjoint_routes(7, edges, 0, 6)\nprint(len(routes))\nfor r in routes:\n    print(*r)\nprint(vertex_disjoint(7, edges, 0, 6))\n","out":"2\n0 2 3 5 6\n0 1 3 4 6\n1\n","notes":[[8,"With capacity 1, an original edge with no capacity left carries exactly one unit of flow."],[14,"Every vertex but s and t has as many used edges in as out, so a walk from s can't get stuck before t."],[21,"Splitting v into v_in → v_out with capacity 1 lets at most one route pass through v."],[24,"Start at s's out-copy and stop at t's in-copy, so s and t themselves have no limit."]]},{"lang":"javascript","src":"function disjointRoutes(n, edges, s, t) {     // routes that share no edge\n  const g = new MaxFlow(n);\n  for (const [u, v] of edges) g.addEdge(u, v, 1);\n  const k = g.maxFlow(s, t);\n  const out = Array.from({ length: n }, () => []);\n  edges.forEach(([u, v], i) => {\n    if (g.cap[2 * i] === 0) out[u].push(v);   // a full unit edge carries one route\n  });\n  const routes = [];\n  for (let r = 0; r < k; r++) {\n    const route = [s];\n    while (route.at(-1) !== t) route.push(out[route.at(-1)].pop());   // follow a used edge and spend it\n    routes.push(route);\n  }\n  return routes;\n}\n\nfunction vertexDisjoint(n, edges, s, t) {     // routes that share no vertex except s and t\n  const g = new MaxFlow(2 * n);               // v_in = v, v_out = v + n\n  for (let v = 0; v < n; v++) g.addEdge(v, v + n, 1);   // each vertex can carry one route\n  for (const [u, v] of edges) g.addEdge(u + n, v, 1);\n  return g.maxFlow(s + n, t);\n}\n\nconst edges = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [3, 5], [4, 6], [5, 6]];\nconst routes = disjointRoutes(7, edges, 0, 6);\nconsole.log(routes.length);\nfor (const r of routes) console.log(...r);\nconsole.log(vertexDisjoint(7, edges, 0, 6));\n","out":"2\n0 2 3 5 6\n0 1 3 4 6\n1\n","notes":[[7,"With capacity 1, an original edge with no capacity left carries exactly one unit of flow."],[12,"Every vertex but s and t has as many used edges in as out, so a walk from s can't get stuck before t."],[20,"Splitting v into v_in → v_out with capacity 1 lets at most one route pass through v."],[22,"Start at s's out-copy and stop at t's in-copy, so s and t themselves have no limit."]]}]},{"t":"Min cut as a model: choosing projects that need tools","tabs":[{"lang":"python","src":"def best_selection(weights, needs):           # needs (a, b): choosing a forces b\n    n = len(weights)\n    s, t = n, n + 1\n    big = sum(abs(w) for w in weights) + 1    # more than any finite cut: an exact \"infinity\"\n    g = MaxFlow(n + 2)\n    for i, w in enumerate(weights):\n        if w > 0:\n            g.add_edge(s, i, w)               # cut it = give up this profit\n        elif w < 0:\n            g.add_edge(i, t, -w)              # cut it = pay this cost\n    for a, b in needs:\n        g.add_edge(a, b, big)                 # never cut: a on the chosen side drags b along\n    best = sum(w for w in weights if w > 0) - g.max_flow(s, t)\n    side = g.source_side(s)\n    return best, [i for i in range(n) if side[i]]\n\nnames = [\"A\", \"B\", \"C\", \"X\", \"Y\", \"Z\"]         # projects A, B, C; tools X, Y, Z\nbest, chosen = best_selection([10, 6, 2, -5, -8, -3], [(0, 3), (0, 4), (1, 4), (2, 5)])\nprint(best, *(names[i] for i in chosen))\n","out":"3 A B X Y","notes":[[4,"Any number bigger than every finite cut works as infinity. Cutting a “needs” edge would then cost more than cutting every profit and cost edge, so no minimum cut does it."],[12,"If a is chosen (on s's side) and b isn't, this edge crosses the cut and the cut can't be minimum."],[13,"The cut counts profits given up plus costs paid, so subtracting it from all profits leaves the best total."]]},{"lang":"javascript","src":"function bestSelection(weights, needs) {      // needs [a, b]: choosing a forces b\n  const n = weights.length, s = n, t = n + 1;\n  const big = weights.reduce((sum, w) => sum + Math.abs(w), 0) + 1;   // more than any finite cut: an exact \"infinity\"\n  const g = new MaxFlow(n + 2);\n  weights.forEach((w, i) => {\n    if (w > 0) g.addEdge(s, i, w);            // cut it = give up this profit\n    else if (w < 0) g.addEdge(i, t, -w);      // cut it = pay this cost\n  });\n  for (const [a, b] of needs) g.addEdge(a, b, big);   // never cut: a on the chosen side drags b along\n  const profit = weights.filter(w => w > 0).reduce((sum, w) => sum + w, 0);\n  const best = profit - g.maxFlow(s, t);\n  const side = g.sourceSide(s);\n  return [best, weights.map((w, i) => i).filter(i => side[i])];\n}\n\nconst names = [\"A\", \"B\", \"C\", \"X\", \"Y\", \"Z\"];  // projects A, B, C; tools X, Y, Z\nconst [best, chosen] = bestSelection([10, 6, 2, -5, -8, -3], [[0, 3], [0, 4], [1, 4], [2, 5]]);\nconsole.log(best, ...chosen.map(i => names[i]));\n","out":"3 A B X Y","notes":
