hput)\nfor target in (8_000, 12_000, 15_000):\n    n = nodes_for(target)\n    print(f\"{target:,} req/s: \" + (f\"{n} nodes\" if n else f\"out of reach, the curve peaks at {int(throughput(best)):,} with {best} nodes\"))\n","out":"nodes → req/s: 1 → 1,000, 2 → 1,939, 4 → 3,649, 8 → 6,462, 16 → 10,191, 32 → 13,190, 64 → 13,045\n8,000 req/s: 11 nodes\n12,000 req/s: 23 nodes\n15,000 req/s: out of reach, the curve peaks at 13,597 with 44 nodes\n"},{"lang":"javascript","src":"const MODEL = [1000, 0.03, 0.0005];                    // fitted from load tests: one node's req/s, contention, coherency\n\nfunction throughput(n, model = MODEL) {                // the Universal Scalability Law: requests a second with n nodes\n  const [gamma, alpha, beta] = model;\n  return gamma * n / (1 + alpha * (n - 1) + beta * n * (n - 1));\n}\n\nfunction nodesFor(target, model = MODEL) {\n  let n = 1;\n  while (throughput(n, model) < target) {\n    if (throughput(n + 1, model) <= throughput(n, model)) return null;   // past the peak: another node adds more coordination than work\n    n++;\n  }\n  return n;\n}\n\nconsole.log(\"nodes → req/s: \" + [1, 2, 4, 8, 16, 32, 64].map(n => `${n} → ${Math.floor(throughput(n)).toLocaleString(\"en-US\")}`).join(\", \"));\nlet best = 1;\nfor (let n = 2; n <= 200; n++) if (throughput(n) > throughput(best)) best = n;\nfor (const target of [8000, 12000, 15000]) {\n  const n = nodesFor(target);\n  console.log(`${target.toLocaleString(\"en-US\")} req/s: ` +\n              (n ? `${n} nodes` : `out of reach, the curve peaks at ${Math.floor(throughput(best)).toLocaleString(\"en-US\")} with ${best} nodes`));\n}\n","out":"nodes → req/s: 1 → 1,000, 2 → 1,939, 4 → 3,649, 8 → 6,462, 16 → 10,191, 32 → 13,190, 64 → 13,045\n8,000 req/s: 11 nodes\n12,000 req/s: 23 nodes\n15,000 req/s: out of reach, the curve peaks at 13,597 with 44 nodes\n"}]}},"traps":[["“Size for the average load.”","Users arrive in peaks. Plan for the peak hour of the peak day, then add headroom for the latency target and for losing a zone."],["“CPU is at 50%, so we can double the traffic.”","Latency rises steeply long before 100%, and something else may run out first: connections, locks, quotas, a partner's rate limit. Only a load test of the whole path tells you."],["“The load test passed with 100 virtual users.”","Closed-model users send less when the system slows, so stalls go unmeasured. Specify an arrival rate, use production-like data and request mixes, and measure from the intended send time."],["“If we need more throughput, we'll add nodes.”","Contention and coherency make throughput flatten and then fall. Past the peak, more nodes make it slower: share less state, or partition the work instead."],["“Commit to everything for the biggest discount.”","Commitments are paid whether used or not. Commit to the capacity that's needed in most hours (more than the price ratio), and rent the peaks."],["“FinOps is the finance team's job.”","Engineers make most of the spending decisions. FinOps gives each team timely cost data and ownership of it, with a central team enabling the practice."]],"disc":[["Marketing plans a TV advert that could bring ten times the normal traffic for an hour. How do you prepare?","Treat it as inorganic demand with a date. Estimate the arrival rate from past campaigns, then load-test the whole path with an open model at that rate and above, to find which part breaks first (often the database or a third party, not the web tier). Scale up before the advert rather than relying on autoscaling's reaction time, warm the caches, raise quotas, and agree what to switch off or degrade under overload (recommendations, search suggestions) and where to shed load. Watch it live, and compare the real curve with the forecast afterwards."],["The cloud bill grew 40% this year while traffic grew 15%. How do you find out why, and stop it happening again?","Inform first: allocate every cost to a team and service with tags and accounts, and track unit costs such as the cost per thousand orders, to see whose unit costs rose. The usual causes are idle or oversized resources, non-production environments running all week, growing storage and logs, data transfer between zones and regions, and new services nobody priced. Optimize: rightsize from p95 utilisation, schedule non-production, tier storage and commit to the steady baseline. Operate: per-team budgets with anomaly alerts, showback reviews, and a cost estimate in every design review."]],"teach":{"prompt":"Explain to a junior colleague how you'd work out how many servers a service needs next year, and how you'd keep the cost under control.","rubric":["Forecast: organic growth beyond the lead time, plus launches and seasonal peaks","Capacity per server from load tests, not CPU guesses, and the first bottleneck on the whole path","Headroom: a utilisation target, because latency grows like 1 ÷ (1 − ρ), and surviving the loss of a zone","Open-model load tests, and why closed models hide stalls","Cost: commitments for the baseline, on-demand peaks, spot for interruptible work, unit costs and FinOps ownership"],"model":"I'd start from today's peak hour and forecast it forward: compounding organic growth, plus the launches and seasonal peaks we know about, far enough ahead to cover the time it takes to get capacity. Then I'd turn demand into servers with a load test, which tells me how many requests a second one server handles within our latency target, because CPU percentages don't scale in a straight line and something else, such as the database, may run out first. I'd keep headroom: latency grows like 1 ÷ (1 − utilisation), so we stay well below 100% at peak, and with three zones each zone must carry half the peak so we survive losing one. The load tests use a fixed arrival rate, because testers that wait for replies hide stalls. For cost, I'd commit to the capacity we need most hours, rent the peaks on demand, put batch work on spot, and track a unit cost such as the cost per order, with each team owning its own spending."},"qa":[["State Little's law.","L = λW: the average number in a system equals the arrival rate times the average time each spends in it."],["Mean time in a single-server (M/M/1) queue at utilisation ρ?","The service time ÷ (1 − ρ): 2× at 50% busy, 10× at 90%."],["What is coordinated omission?","A load tester that waits for replies sends less when the system slows, so slow periods are under-measured and the percentiles look too good."],["What does the Universal Scalability Law add to Amdahl's law?","A coherency term (β), so throughput peaks and then falls as nodes are added."],["What are the FinOps phases?","Inform, Optimize and Operate, repeated continuously."],["When does a capacity commitment pay off?","When the committed capacity is needed in a larger share of hours than the committed price ÷ the on-demand price."]],"quiz":[{"q":"What does this print?","snip":{"t":"Little's law","tabs":[{"lang":"python","src":"rate, time_ms = 200, 50                      # requests a second, and the time each one spends in the service\nprint(rate * time_ms // 1000)\n"},{"lang":"javascript","src":"const rate = 200, timeMs = 50;               // requests a second, and the time each one spends in the service\nconsole.log(Math.floor(rate * timeMs / 1000));\n"}]},"o":["10","4","250","10000"],"a":0,"e":"L = λW = 200 × 0.05 s = 10 requests in the service on average. A pool of exactly 10 connections would be busy all the time, so size it with headroom."},{"q":"What does this print?","snip":{"t":"Mean time in a single-server queue","tabs":[{"lang":"python","src":"service_ms = 10\nprint(\" \".join(str(service_ms * 100 // (100 - busy)) for busy in (50, 75, 90)))\n"},{"lang":"javascript","src":"const serviceMs = 10;\nconsole.log([50, 75, 90].map(busy => Math.floor(serviceMs * 100 / (100 - busy))).join(\" \"));\n"}]},"o":["20 40 100","15 17 19","20 30 40","10 10 10"],"a":0,"e":"S ÷ (1 − ρ): two, four and ten times the service time. Going from 75% to 90% busy more than doubles the mean, and the tail grows faster still."},{"q":"Which test would find a memory leak that only shows after hours of normal traffic?","o":["A soak test","A spike test","A smoke test","A breakpoint test"],"a":0,"e":"A soak test holds normal load for hours, long enough for leaks, growing queues and filling disks to show. Spike tests check sudden surges, and breakpoint tests find the limit."},{"q":"A load test with 50 virtual users, each waiting for its reply before sending again, reports a p99 of 12 ms. Users complain of two-second freezes every few minutes. What's the most likely explanation?","o":["The test's users stop sending while they wait, so the freezes are barely measured; rerun it with a fixed arrival rate","The p99 is right; the users' own networks are slow","50 users is too few; add more virtual users of the same kind","Percentiles hide freezes; report the average instead"],"a":0,"e":"Coordinated omission: a closed-model tester slows down exactly when the system does. An open model keeps sending during the freeze, so the backlog shows up in the percentiles. More closed-model users would help a little but keep the flaw."},{"q":"Which belong in a capacity plan? (choose 3)","t":"ms","o":["An organic demand forecast that reaches beyond the lead time for getting capacity","Inorganic demand: launches, campaigns and seasonal peaks","Regular load tests that turn servers into requests a second within the latency target","Last year's average CPU utilisation as the sizing target","One fixed server count for the whole year"],"a":[0,1,2],"e":"These are the three mandatory steps in Google's SRE book. Averages hide the peak hour, and a fixed count ignores growth and seasons."},{"q":"Judge each statement.","t":"yn","s":[["Doubling a server's utilisation from 45% to 90% roughly doubles its mean latency.",false],["At the same utilisation, one queue shared by four servers gives lower latency than four separate queues.",true],["Committing to the peak capacity gives the lowest total cost.",false],["Showback reports each team's cloud costs to it; chargeback bills the team for them.",true]],"e":"Latency follows 1 ÷ (1 − ρ): from about 1.8× to 10× the service time, more than five times worse. Pooling cuts waiting. Commitments are paid every hour, so committing to the peak pays for idle servers most of the week."},{"q":"Put a capacity plan in order.","t":"ord","items":["Measure today's peak, and each server's capacity with a load test","Forecast organic growth beyond the lead time","Add launches, campaigns and seasonal peaks","Add headroom for the utilisation target and the loss of a zone","Order capacity before the lead time runs out","Compare actual demand with the forecast, and plan again"],"e":"Measure, forecast, add events, add headroom, provision in time, and close the loop: the forecast is always wrong, so the comparison keeps the plan honest."},{"q":"Complete the Python cost model for committed and on-demand servers.","t":"drop","lang":"python","code":"ON_DEMAND_CENTS, COMMITTED_CENTS = 40, 24              # per server-hour; a commitment is paid whether used or not\n\ndef weekly_cost(demand, committed):                    # demand: servers needed in each hour of the week\n    on_demand_hours = sum(max(0, d - committed) for d in demand)\n    return committed * len(demand) * {{0}} + on_demand_hours * {{1}}\n","blanks":[{"o":["COMMITTED_CENTS","ON_DEMAND_CENTS","committed","1"],"a":0},{"o":["ON_DEMAND_CENTS","COMMITTED_CENTS","len(demand)","committed"],"a":0}],"e":"Committed servers are paid at the committed price in every hour of the week; only the demand above them is bought on demand."}],"probs":[["Reading · Google SRE book: Introduction (demand forecasting and capacity planning)","https://sre.google/sre-book/introduction/","","write a one-page capacity plan for a service you know: organic growth, events, lead time and headroom"],["Reference · Grafana k6: load test types","https://grafana.com/docs/k6/latest/testing-guides/test-types/","","design an average-load, a stress and a soak test for that service, each with its pass criteria"],["Reading · Tyler Treat: Everything you know about latency is wrong","https://bravenewgeek.com/everything-you-know-about-latency-is-wrong/","","find out whether your load-testing tool uses a closed or an open model, and pause the system mid-test to check"],["Reference · FinOps Foundation: FinOps principles","https://www.finops.org/framework/principles/","","score your organisation from 1 to 5 against each of the six principles, and pick one to improve"]],"src":[["Google SRE book: Introduction (demand forecasting and capacity planning)","https://sre.google/sre-book/introduction/"],["Grafana k6 documentation: Load test types","https://grafana.com/docs/k6/latest/testing-guides/test-types/"],["Grafana k6 documentation: Open and closed models","https://grafana.com/docs/k6/latest/using-k6/scenarios/concepts/open-vs-closed/"],["Tyler Treat (2015): Everything You Know About Latency Is Wrong","https://bravenewgeek.com/everything-you-know-about-latency-is-wrong/"],["Gil Tene: How NOT to Measure Latency (InfoQ talk)","https://www.infoq.com/presentations/latency-response-time/"],["Neil Gunther: The Universal Scalability Law","http://www.perfdynamics.com/Manifesto/USLscalability.html"],["FinOps Foundation: FinOps principles","https://www.finops.org/framework/principles/"],["FinOps Foundation: FinOps phases","https://www.finops.org/framework/phases/"],["AWS EC2 user guide: Spot Instance interruption notices","https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-instance-termination-notices.html"]]},{"id":"m04","d":"d2","t":"Evolution and migration: the strangler fig, data migrations and backwards compatibility","min":125,"hook":"Most architecture work changes a system that's already running. You replace a legacy system piece by piece while the business depends on it, move data to a new schema or store without downtime, and change APIs and events without breaking clients you can't see. Big-bang rewrites tend to fail; migrations that move in small, verified, reversible steps succeed, and they deliver value long before they finish.","pre":{"q":"You must split a `name` column into `first_name` and `last_name` in a table used by four services that deploy independently. Why can't you rename the column and change the code in one release, and how would you do it instead?","a":"The services deploy at different times, so for a while old and new code run side by side, and a rollback brings old code back. Any single step that changes the schema and the code together breaks whichever version isn't ready. Use expand and contract: add the new columns, deploy code that writes both and reads the new ones with a fallback, backfill the old rows, move everything to the new columns, and only then drop `name`. Every step works with both the previous and the next release, and every step can be undone except the last one."},"kid":{"t":"Moving Grandma's recipes","x":"Luigi's family is moving its recipes from Grandma's old notebook into a new folder. They don't copy the whole notebook in one weekend. Every new recipe goes straight into the folder; whenever someone cooks from the notebook, they copy that page across; on rainy days they copy pages in bulk. While both exist, any change is written in both places. For a few weeks they cook from the folder but check it against the notebook. When Luigi renames \"tomato sauce\" to \"marinara\", the label says both for a while. Only when nobody has opened the notebook for a month does it go on the shelf.","map":[["New recipes go straight into the folder","The strangler fig: new and moved features live in the new system"],["Copying pages when they're used, and in bulk on rainy days","Lazy migration on access, plus a batch backfill"],["Writing every change in both places","Dual writes while two stores are live"],["Cooking from the folder, checking the notebook","Parallel run: compare the new path with the old before trusting it"],["A label with both names, then the notebook on the shelf","Expand and contract: support old and new, then remove the old"]],"brk":"In a family, everyone hears about the change. A public API's clients may be programs that nobody has looked at for years, so an old field or version may have to stay for a long time, and you measure who still uses it before you remove anything."},"keys":["**Evolve rather than rewrite**: a big-bang rewrite has to match years of behaviour while the old system keeps changing, and it delivers value only at the end, if at all. Incremental migration ships value early, can pause or stop at any point, and keeps a way back at every step.","**The strangler fig**: put a routing layer (a proxy, an API gateway or the front end) in front of the legacy system, rebuild one capability at a time, move its traffic across in slices, and retire the old code once nothing calls it. Martin Fowler's advice: be clear about the outcomes you want, find the seams, replace small pieces first to deliver value early, and accept transitional architecture (temporary code that lets old and new coexist) as the price of lower risk.","**Branch by abstraction**: to replace a component inside one codebase, put an abstraction in front of the old implementation, build the new one behind it, switch callers over gradually (often with feature flags), then delete the old implementation.","**Expand and contract**: parallel change, as Danilo Sato named it: expand the interface or schema so it supports old and new, migrate the clients, then contract by removing the old. Every intermediate state works with both versions of the code, so services can deploy independently and each step can be rolled back. The contract step, which deletes things, is the one-way door.","**Online data migrations**: Stripe's four steps: dual write to the old and new stores; move reads to the new store once comparisons show they match; move writes so the new store becomes the source of truth; then remove the old data and code. Backfill existing records in batches that are idempotent, resumable and throttled, write them conditionally so they never overwrite newer data, and verify with counts, checksums and sampled comparisons. A parallel run, such as GitHub's Scientist library, executes both code paths, returns the old result, and reports any mismatch.","**Backwards-compatible APIs**: adding is usually safe; removing or renaming, changing a type, a default or a value's format all break clients. Google's AIP-180 distinguishes source, wire and semantic compatibility. Break only in a new major version run alongside the old one, announce deprecation with dates (the Deprecation and Sunset HTTP headers), and measure who still calls the old version before you remove it.","**Schema evolution for events**: events outlive the code that wrote them, and consumers replay old ones. In Protocol Buffers, never change or reuse a field number, reserve deleted ones, and add fields freely. A schema registry enforces a compatibility mode: backward (new consumers read old data; upgrade consumers first), forward (old consumers read new data; upgrade producers first) or full (both).","**A way back at every step**: feature flags separate deploying code from releasing a feature; canaries and percentage rollouts limit the blast radius; and success metrics and rollback triggers are agreed before each step starts. Keep every step reversible for as long as possible, and treat deleting data as the final, deliberate decision."],"dia":[{"type":"flow","cap":"The strangler fig, one capability at a time","steps":[["Intercept","a proxy or gateway in front of the legacy system"],["Rebuild","one capability in the new system"],["Shift","its traffic in slices: 1%, 10%, 50%, 100%"],["Retire","the legacy code, once nothing calls it"]],"loop":"next capability","note":"The legacy system shrinks while the business keeps running. You can stop at any point, and you've already delivered value."},{"type":"flow","cap":"Expand and contract: splitting a column","steps":[["Expand","add first and last; nothing reads them yet"],["Dual write","new code writes name, first and last"],["Backfill","fill old rows in batches, then verify"],["Switch","read and write only the new columns"],["Contract","drop name once no code uses it"]],"note":"Each step works with both the previous and the next release of every service, so each can be rolled back, except the last."},{"type":"seq","cap":"A parallel run: trust the new path by comparing it in production","actors":["Caller","Experiment","Old path","New path","Mismatch log"],"msgs":[["Caller","Experiment","request"],["Experiment","Old path","run (control)"],["Old path","Experiment","result",true],["Experiment","New path","run (candidate)"],["New path","Experiment","result",true],["Experiment","Mismatch log","record any difference"],["Experiment","Caller","the old path's result",true]],"note":"Users always get the old result, and errors in the new path are caught and logged. Once mismatches stop, switch over."}],"cmp":[{"cap":"Ways to migrate","head":["Approach","Use it for","The way back"],"rows":[["Strangler fig","Replacing a legacy system behind a routing layer","Route the capability back to the legacy system"],["Branch by abstraction","Replacing a component inside one codebase","Switch callers back to the old implementation"],["Expand and contract","Schema and interface changes with independent deploys","Any step except the final contract"],["Dual write and backfill","Moving data to a new store or model","Reads stay on the old store until verified"],["Parallel run","Proving new logic matches the old","Users only ever see the old result"]]},{"cap":"Schema registry compatibility modes","head":["Mode","Guarantees","Typical safe changes","Upgrade first"],"rows":[["Backward","New consumers read data written with the old schema","Delete fields; add optional fields","Consumers"],["Forward","Old consumers read data written with the new schema","Add fields; delete optional fields","Producers"],["Full","Both","Add or delete optional fields","Either, in any order"]]}],"code":[{"t":"The seeded random generator used by the backfill simulation","tabs":[{"lang":"python","src":"def mulberry32(seed):\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Strangler fig routing: shift a capability in slices, with an instant way back","tabs":[{"lang":"python","src":"def bucket(user):                                      # a stable number from 0 to 99 for each user (FNV-1a hash)\n    h = 2166136261\n    for byte in user.encode():\n        h = ((h ^ byte) * 16777619) & 0xFFFFFFFF\n    return h % 100\n\ndef backend(path, user, routes):\n    for prefix, share in routes:\n        if path.startswith(prefix):\n            return \"new\" if bucket(user) < share else \"legacy\"\n    return \"legacy\"                                    # anything not yet migrated stays where it was\n\nUSERS = [f\"user-{i}\" for i in range(1000)]\nroutes = [(\"/search\", 100), (\"/catalog\", 100), (\"/orders\", 0)]   # search and catalog have moved; orders is next\nprint(f\"/account/settings goes to {backend('/account/settings', 'user-1', routes)}: not migrated yet\")\nbefore = {u: \"legacy\" for u in USERS}\nfirst_25 = None\nfor stage, share in ((\"canary\", 1), (\"widen\", 10), (\"widen\", 25), (\"errors up, roll back\", 0),\n                     (\"fixed, resume\", 25), (\"widen\", 50), (\"finish\", 100)):\n    routes[2] = (\"/orders\", share)\n    now = {u: backend(\"/orders/42\", u, routes) for u in USERS}\n    on_new = [u for u in USERS if now[u] == \"new\"]\n    switched = sum(before[u] != now[u] for u in USERS)\n    print(f\"{stage} ({share}%): {len(on_new):,} of 1,000 users on the new orders service, {switched} switched\")\n    if share == 25:\n        first_25 = first_25 or on_new\n        same = on_new == first_25\n    before = now\nprint(f\"after the rollback, 25% brought back exactly the same users: {'yes' if same else 'no'}\")\n","out":"/account/settings goes to legacy: not migrated yet\ncanary (1%): 9 of 1,000 users on the new orders service, 9 switched\nwiden (10%): 102 of 1,000 users on the new orders service, 93 switched\nwiden (25%): 246 of 1,000 users on the new orders service, 144 switched\nerrors up, roll back (0%): 0 of 1,000 users on the new orders service, 246 switched\nfixed, resume (25%): 246 of 1,000 users on the new orders service, 246 switched\nwiden (50%): 492 of 1,000 users on the new orders service, 246 switched\nfinish (100%): 1,000 of 1,000 users on the new orders service, 508 switched\nafter the rollback, 25% brought back exactly the same users: yes\n","notes":[[1,"Hashing the user id gives each user a fixed bucket, so a user stays on the same side between requests."],[11,"Paths without a route stay on the legacy system: the routing table only lists what has moved."],[19,"A rollback is a one-line routing change, not a redeploy: the legacy code is still there."],[29,"Raising the share only adds users, and returning to 25% brings back the same ones, so nobody flips between systems."]]},{"lang":"javascript","src":"function bucket(user) {                                // a stable number from 0 to 99 for each user (FNV-1a hash)\n  let h = 2166136261;\n  for (const byte of Buffer.from(user)) h = Math.imul(h ^ byte, 16777619) >>> 0;\n  return h % 100;\n}\n\nfunction backend(path, user, routes) {\n  for (const [prefix, share] of routes) {\n    if (path.startsWith(prefix)) return bucket(user) < share ? \"new\" : \"legacy\";\n  }\n  return \"legacy\";                                     // anything not yet migrated stays where it was\n}\n\nconst USERS = Array.from({ length: 1000 }, (_, i) => `user-${i}`);\nconst routes = [[\"/search\", 100], [\"/catalog\", 100], [\"/orders\", 0]];   // search and catalog have moved; orders is next\nconsole.log(`/account/settings goes to ${backend(\"/account/settings\", \"user-1\", routes)}: not migrated yet`);\nlet before = new Map(USERS.map(u => [u, \"legacy\"]));\nlet first25 = null, same = false;\nfor (const [stage, share] of [[\"canary\", 1], [\"widen\", 10], [\"widen\", 25], [\"errors up, roll back\", 0],\n                              [\"fixed, resume\", 25], [\"widen\", 50], [\"finish\", 100]]) {\n  routes[2] = [\"/orders\", share];\n  const now = new Map(USERS.map(u => [u, backend(\"/orders/42\", u, routes)]));\n  const onNew = USERS.filter(u => now.get(u) === \"new\");\n  const switched = USERS.filter(u => before.get(u) !== now.get(u)).length;\n  console.log(`${stage} (${share}%): ${onNew.length.toLocaleString(\"en-US\")} of 1,000 users on the new orders service, ${switched} switched`);\n  if (share === 25) {\n    first25 = first25 ?? onNew;\n    same = onNew.join() === first25.join();\n  }\n  before = now;\n}\nconsole.log(`after the rollback, 25% brought back exactly the same users: ${same ? \"yes\" : \"no\"}`);\n","out":"/account/settings goes to legacy: not migrated yet\ncanary (1%): 9 of 1,000 users on the new orders service, 9 switched\nwiden (10%): 102 of 1,000 users on the new orders service, 93 switched\nwiden (25%): 246 of 1,000 users on the new orders service, 144 switched\nerrors up, roll back (0%): 0 of 1,000 users on the new orders service, 246 switched\nfixed, resume (25%): 246 of 1,000 users on the new orders service, 246 switched\nwiden (50%): 492 of 1,000 users on the new orders service, 246 switched\nfinish (100%): 1,000 of 1,000 users on the new orders service, 508 switched\nafter the rollback, 25% brought back exactly the same users: yes\n","notes":[[1,"Hashing the user id gives each user a fixed bucket, so a user stays on the same side between requests."],[11,"Paths without a route stay on the legacy system: the routing table only lists what has moved."],[20,"A rollback is a one-line routing change, not a redeploy: the legacy code is still there."],[32,"Raising the share only adds users, and returning to 25% brings back the same ones, so nobody flips between systems."]]}]},{"t":"Expand and contract: which steps are safe with two versions running","tabs":[{"lang":"python","src":"def write(version, schema, first, last):               # the row a service version inserts\n    if version == \"v1\":\n        values = {\"name\": f\"{first} {last}\"}\n    elif version == \"v2\":                              # the transition release writes both\n        values = {\"name\": f\"{first} {last}\", \"first\": first, \"last\": last}\n    else:\n        values = {\"first\": first, \"last\": last}        # v3 writes the new columns only\n    for column in values:\n        if column not in schema:\n            raise ValueError(f\"{version} writes {column}: no such column\")\n    return {c: values.get(c) for c in schema}          # columns it doesn't write are left empty\n\ndef read(version, schema, row):\n    if version == \"v1\" or (version == \"v2\" and row.get(\"first\") is None):\n        if \"name\" not in schema:                       # v2 falls back to name for rows not yet backfilled\n            raise ValueError(f\"{version} reads name: no such column\")\n        return row[\"name\"]\n    if row.get(\"first\") is None:\n        raise ValueError(f\"{version} reads an old row: first is empty\")\n    return f\"{row['first']} {row['last']}\"\n\ndef check(schema, versions, rows):                     # every running version writes, then reads every row\n    rows = [{c: r.get(c) for c in schema} for r in rows]\n    try:\n        rows += [write(v, schema, \"Ada\", \"Lovelace\") for v in versions]\n        for v in versions:\n            for row in rows:\n                if read(v, schema, row) != \"Ada Lovelace\":\n                    return f\"breaks ({v} reads the wrong name)\"\n    except ValueError as error:\n        return f\"breaks ({error})\"\n    return \"ok\"\n\nEXPANDED, CONTRACTED = [\"name\", \"first\", \"last\"], [\"first\", \"last\"]\nOLD = [{\"name\": \"Ada Lovelace\"}]                       # a row written before the migration\nBACKFILLED = [{\"name\": \"Ada Lovelace\", \"first\": \"Ada\", \"last\": \"Lovelace\"}]\nfor label, schema, versions, rows in (\n        (\"expand: add first and last\", EXPANDED, [\"v1\"], OLD),\n        (\"roll out v2: write both, read new or fall back\", EXPANDED, [\"v1\", \"v2\"], OLD),\n        (\"backfill first and last for old rows\", EXPANDED, [\"v2\"], BACKFILLED),\n        (\"roll out v3: new columns only\", EXPANDED, [\"v2\", \"v3\"], BACKFILLED),\n        (\"contract: drop name\", CONTRACTED, [\"v3\"], BACKFILLED),\n        (\"shortcut: rename in one release while v1 still runs\", CONTRACTED, [\"v1\", \"v3\"], BACKFILLED),\n        (\"shortcut: roll out v3 before the backfill\", EXPANDED, [\"v2\", \"v3\"], OLD),\n        (\"shortcut: roll back to v2 after the contract\", CONTRACTED, [\"v2\", \"v3\"], BACKFILLED)):\n    print(f\"{label}: {check(schema, versions, rows)}\")\n","out":"expand: add first and last: ok\nroll out v2: write both, read new or fall back: ok\nbackfill first and last for old rows: ok\nroll out v3: new columns only: ok\ncontract: drop name: ok\nshortcut: rename in one release while v1 still runs: breaks (v1 writes name: no such column)\nshortcut: roll out v3 before the backfill: breaks (v3 reads an old row: first is empty)\nshortcut: roll back to v2 after the contract: breaks (v2 writes name: no such column)\n","notes":[[4,"The transition release writes both shapes, so old readers still work and new readers find the new columns."],[14,"v2 reads the new columns but falls back to name for rows nobody has backfilled yet."],[22,"During a rolling deploy two versions run at once, so each must read what the other writes, old rows included."],[43,"The shortcuts break because some running code, or a rollback, still expects a column that's gone or empty."]]},{"lang":"javascript","src":"function write(version, schema, first, last) {         // the row a service version inserts\n  let values;\n  if (version === \"v1\") values = { name: `${first} ${last}` };\n  else if (version === \"v2\") values = { name: `${first} ${last}`, first, last };   // the transition release writes both\n  else values = { first, last };                       // v3 writes the new columns only\n  for (const column of Object.keys(values)) {\n    if (!schema.includes(column)) throw new Error(`${version} writes ${column}: no such column`);\n  }\n  return Object.fromEntries(schema.map(c => [c, values[c] ?? null]));   // columns it doesn't write are left empty\n}\n\nfunction read(version, schema, row) {\n  if (version === \"v1\" || (version === \"v2\" && (row.first ?? null) === null)) {\n    if (!schema.includes(\"name\")) throw new Error(`${version} reads name: no such column`);   // v2 falls back to name for rows not yet backfilled\n    return row.name;\n  }\n  if ((row.first ?? null) === null) throw new Error(`${version} reads an old row: first is empty`);\n  return `${row.first} ${row.last}`;\n}\n\nfunction check(schema, versions, rows) {               // every running version writes, then reads every row\n  rows = rows.map(r => Object.fromEntries(schema.map(c => [c, r[c] ?? null])));\n  try {\n    rows.push(...versions.map(v => write(v, schema, \"Ada\", \"Lovelace\")));\n    for (const v of versions) {\n      for (const row of rows) {\n        if (read(v, schema, row) !== \"Ada Lovelace\") return `breaks (${v} reads the wrong name)`;\n      }\n    }\n  } catch (error) {\n    return `breaks (${error.message})`;\n  }\n  return \"ok\";\n}\n\nconst EXPANDED = [\"name\", \"first\", \"last\"], CONTRACTED = [\"first\", \"last\"];\nconst OLD = [{ name: \"Ada Lovelace\" }];                // a row written before the migration\nconst BACKFILLED = [{ name: \"Ada Lovelace\", first: \"Ada\", last: \"Lovelace\" }];\nfor (const [label, schema, versions, rows] of [\n  [\"expand: add first and last\", EXPANDED, [\"v1\"], OLD],\n  [\"roll out v2: write both, read new or fall back\", EXPANDED, [\"v1\", \"v2\"], OLD],\n  [\"backfill first and last for old rows\", EXPANDED, [\"v2\"], BACKFILLED],\n  [\"roll out v3: new columns only\", EXPANDED, [\"v2\", \"v3\"], BACKFILLED],\n  [\"contract: drop name\", CONTRACTED, [\"v3\"], BACKFILLED],\n  [\"shortcut: rename in one release while v1 still runs\", CONTRACTED, [\"v1\", \"v3\"], BACKFILLED],\n  [\"shortcut: roll out v3 before the backfill\", EXPANDED, [\"v2\", \"v3\"], OLD],\n  [\"shortcut: roll back to v2 after the contract\", CONTRACTED, [\"v2\", \"v3\"], BACKFILLED],\n]) {\n  console.log(`${label}: ${check(schema, versions, rows)}`);\n}\n","out":"expand: add first and last: ok\nroll out v2: write both, read new or fall back: ok\nbackfill first and last for old rows: ok\nroll out v3: new columns only: ok\ncontract: drop name: ok\nshortcut: rename in one release while v1 still runs: breaks (v1 writes name: no such column)\nshortcut: roll out v3 before the backfill: breaks (v3 reads an old row: first is empty)\nshortcut: roll back to v2 after the contract: breaks (v2 writes name: no such column)\n","notes":[[4,"The transition release writes both shapes, so old readers still work and new readers find the new columns."],[13,"v2 reads the new columns but falls back to name for rows nobody has backfilled yet."],[21,"During a rolling deploy two versions run at once, so each must read what the other writes, old rows included."],[45,"The shortcuts break because some running code, or a rollback, still expects a column that's gone or empty."]]}]},{"t":"Event schemas: which changes are compatible, and who upgrades first","tabs":[{"lang":"python","src":"OLD = {                                                # field -> (type, default); None means required, no default\n    \"order_id\": (\"string\", None),\n    \"amount_cents\": (\"int\", None),\n    \"currency\": (\"string\", \"EUR\"),\n    \"coupon\": (\"string\", \"\"),\n}\n\ndef readable(reader, writer):                          # can code built on `reader` read data written with `writer`?\n    for field, (kind, default) in reader.items():\n        if field in writer:\n            if writer[field][0] != kind:\n                return False                           # same name, different type\n        elif default is None:\n            return False                               # the reader needs a field the data doesn't have\n    return True                                        # fields the reader doesn't know are skipped\n\ndef mode(old, new):\n    backward, forward = readable(new, old), readable(old, new)\n    if backward and forward:\n        return \"full: upgrade in any order\"\n    if backward:\n        return \"backward: upgrade consumers first\"\n    if forward:\n        return \"forward: upgrade producers first, and new consumers can't read old events\"\n    return \"breaking: publish a new event type or topic\"\n\ndef without(schema, field):\n    return {k: v for k, v in schema.items() if k != field}\n\nfor label, new in (\n        (\"add channel with a default\", {**OLD, \"channel\": (\"string\", \"web\")}),\n        (\"add customer_id, required\", {**OLD, \"customer_id\": (\"string\", None)}),\n        (\"remove coupon, which has a default\", without(OLD, \"coupon\")),\n        (\"remove amount_cents, which is required\", without(OLD, \"amount_cents\")),\n        (\"change amount_cents to a string\", {**OLD, \"amount_cents\": (\"string\", None)}),\n        (\"rename order_id to id\", {**without(OLD, \"order_id\"), \"id\": (\"string\", None)})):\n    print(f\"{label}: {mode(OLD, new)}\")\n","out":"add channel with a default: full: upgrade in any order\nadd customer_id, required: forward: upgrade producers first, and new consumers can't read old events\nremove coupon, which has a default: full: upgrade in any order\nremove amount_cents, which is required: backward: upgrade consumers first\nchange amount_cents to a string: breaking: publish a new event type or topic\nrename order_id to id: breaking: publish a new event type or topic\n","notes":[[8,"Avro-style resolution: the reader's fields are matched by name, a missing field takes the reader's default, and unknown fields are skipped."],[18,"Backward: new code reads old events. Forward: old code reads new events. Full: both."],[32,"A new required field breaks replays: new consumers can't read the events written before it existed."],[36,"A rename is a delete plus an add, so it breaks both directions: keep the old name, or publish a new event type."]]},{"lang":"javascript","src":"const OLD = {                                          // field -> [type, default]; null means required, no default\n  order_id: [\"string\", null],\n  amount_cents: [\"int\", null],\n  currency: [\"string\", \"EUR\"],\n  coupon: [\"string\", \"\"],\n};\n\nfunction readable(reader, writer) {                    // can code built on `reader` read data written with `writer`?\n  for (const [field, [kind, fallback]] of Object.entries(reader)) {\n    if (field in writer) {\n      if (writer[field][0] !== kind) return false;     // same name, different type\n    } else if (fallback === null) {\n      return false;                                    // the reader needs a field the data doesn't have\n    }\n  }\n  return true;                                         // fields the reader doesn't know are skipped\n}\n\nfunction mode(oldSchema, newSchema) {\n  const backward = readable(newSchema, oldSchema), forward = readable(oldSchema, newSchema);\n  if (backward && forward) return \"full: upgrade in any order\";\n  if (backward) return \"backward: upgrade consumers first\";\n  if (forward) return \"forward: upgrade producers first, and new consumers can't read old events\";\n  return \"breaking: publish a new event type or topic\";\n}\n\nconst without = (schema, field) => Object.fromEntries(Object.entries(schema).filter(([k]) => k !== field));\n\nfor (const [label, newSchema] of [\n  [\"add channel with a default\", { ...OLD, channel: [\"string\", \"web\"] }],\n  [\"add customer_id, required\", { ...OLD, customer_id: [\"string\", null] }],\n  [\"remove coupon, which has a default\", without(OLD, \"coupon\")],\n  [\"remove amount_cents, which is required\", without(OLD, \"amount_cents\")],\n  [\"change amount_cents to a string\", { ...OLD, amount_cents: [\"string\", null] }],\n  [\"rename order_id to id\", { ...without(OLD, \"order_id\"), id: [\"string\", null] }],\n]) {\n  console.log(`${label}: ${mode(OLD, newSchema)}`);\n}\n","out":"add channel with a default: full: upgrade in any order\nadd customer_id, required: forward: upgrade producers first, and new consumers can't read old events\nremove coupon, which has a default: full: upgrade in any order\nremove amount_cents, which is required: backward: upgrade consumers first\nchange amount_cents to a string: breaking: publish a new event type or topic\nrename order_id to id: breaking: publish a new event type or topic\n","notes":[[8,"Avro-style resolution: the reader's fields are matched by name, a missing field takes the reader's default, and unknown fields are skipped."],[20,"Backward: new code reads old events. Forward: old code reads new events. Full: both."],[31,"A new required field breaks replays: new consumers can't read the events written before it existed."],[35,"A rename is a delete plus an add, so it breaks both directions: keep the old name, or publish a new event type."]]}]}],"ex":{"q":"You're moving 10,000 records to a new store while the application keeps updating them. Dual writes are already on: every update goes to both stores. A backfill copies the old store in batches of 500, and about 40 updates land while each batch is between its read and its write. Compare a plain copy with a copy that writes only if the record is missing or older, by version, and verify both.","steps":["Turn dual writes on first, so every change from now on reaches the new store (Stripe's step 1).","The backfill reads a batch from the old store, then writes it to the new one. Live updates can land in between, and they're dual-written straight away.","A plain copy then puts the older snapshot over the newer dual-written record. A conditional write (in a real database, a compare-and-set on the version) never goes backwards.","Verify before moving reads: compare every record, or checksums by range, and count the differences."],"code":{"t":"The backfill race, and the conditional write that fixes it","tabs":[{"lang":"python","src":"N, BATCH, UPDATES = 10_000, 500, 40                    # records; backfill batch size; live updates while a batch is in flight\n\ndef migrate(conditional):\n    rand = mulberry32(11)                              # the same live traffic for both runs\n    old = [(1, i * 7 % 1000) for i in range(N)]        # each record is (version, value)\n    new = [None] * N                                   # the new store starts empty\n    dual_writes = 0\n    for start in range(0, N, BATCH):\n        snapshot = old[start:start + BATCH]            # the backfill reads a batch from the old store...\n        for _ in range(UPDATES):                       # ...live traffic keeps updating records meanwhile...\n            i = int(rand() * N)\n            old[i] = (old[i][0] + 1, int(rand() * 1000))\n            new[i] = old[i]                            # dual write: every update goes to both stores\n            dual_writes += 1\n        for offset, record in enumerate(snapshot):     # ...then the backfill writes the batch\n            i = start + offset\n            if not conditional or new[i] is None or new[i][0] < record[0]:\n                new[i] = record\n    stale = sum(new[i] != old[i] for i in range(N))    # verification: compare every record\n    return dual_writes, stale\n\nfor label, conditional in ((\"plain copy\", False), (\"copy only if newer, by version\", True)):\n    writes, stale = migrate(conditional)\n    print(f\"{label}: {writes} dual writes during the backfill, {stale} records stale in the new store\")\n","out":"plain copy: 800 dual writes during the backfill, 40 records stale in the new store\ncopy only if newer, by version: 800 dual writes during the backfill, 0 records stale in the new store\n"},{"lang":"javascript","src":"const N = 10000, BATCH = 500, UPDATES = 40;            // records; backfill batch size; live updates while a batch is in flight\n\nfunction migrate(conditional) {\n  const rand = mulberry32(11);                         // the same live traffic for both runs\n  const old = Array.from({ length: N }, (_, i) => [1, (i * 7) % 1000]);   // each record is [version, value]\n  const fresh = new Array(N).fill(null);               // the new store starts empty\n  let dualWrites = 0;\n  for (let start = 0; start < N; start += BATCH) {\n    const snapshot = old.slice(start, start + BATCH);  // the backfill reads a batch from the old store...\n    for (let u = 0; u < UPDATES; u++) {                // ...live traffic keeps updating records meanwhile...\n      const i = Math.floor(rand() * N);\n      old[i] = [old[i][0] + 1, Math.floor(rand() * 1000)];\n      fresh[i] = old[i];                               // dual write: every update goes to both stores\n      dualWrites++;\n    }\n    snapshot.forEach((record, offset) => {             // ...then the backfill writes the batch\n      const i = start + offset;\n      if (!conditional || fresh[i] === null || fresh[i][0] < record[0]) fresh[i] = record;\n    });\n  }\n  let stale = 0;                                       // verification: compare every record\n  for (let i = 0; i < N; i++) if (fresh[i] === null || fresh[i][0] !== old[i][0] || fresh[i][1] !== old[i][1]) stale++;\n  return [dualWrites, stale];\n}\n\nfor (const [label, conditional] of [[\"plain copy\", false], [\"copy only if newer, by version\", true]]) {\n  const [writes, stale] = migrate(conditional);\n  console.log(`${label}: ${writes} dual writes during the backfill, ${stale} records stale in the new store`);\n}\n","out":"plain copy: 800 dual writes during the backfill, 40 records stale in the new store\ncopy only if newer, by version: 800 dual writes during the backfill, 0 records stale in the new store\n"}]},"a":"The plain copy leaves 40 records stale: each was updated, and dual-written, after the backfill read its batch, and the backfill then put the older version back. Nothing failed and nothing logged an error, so only verification finds it. Writing only when the record is missing or older makes the backfill safe to run alongside live traffic, and idempotent, so it can be stopped, throttled and resumed. Verify before moving reads, keep comparing during the switch, and remember that dual writes have their own failure mode: one of the two writes can fail, which is why continuous verification, or a single write plus change data capture, is worth the effort."},"fade":{"q":"Finish `differences(old, new, n, size)`: compare the two stores range by range (ids 0 to size − 1, then size to 2 × size − 1, and so on; the last range may be shorter) using `checksum`, and only where a range's checksums differ, compare its records one by one. Return the differing ids in order, and how many records you compared one by one.","steps":["For each range, ask both stores for a checksum; if they match, skip the range.",{"ask":"Why compare checksums first?","a":"Each store computes one number per range where the data lives, so only numbers cross the network. Records are fetched only where the numbers differ: with a few differences, that's a small fraction of the data."},{"ask":"What can a checksum miss?","a":"Two different ranges can, rarely, produce the same checksum. Plain FNV hashes added together cancel surprisingly often for one-character edits, which is why each hash goes through a finaliser first. Real tools use stronger hashes and still sample records directly; Merkle trees apply the same idea recursively."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def fnv(text):                                         # FNV-1a, 32 bits\n    h = 2166136261\n    for byte in text.encode():\n        h = ((h ^ byte) * 16777619) & 0xFFFFFFFF\n    return h\n\ndef mix(h):                                             # MurmurHash3's finaliser: every input bit moves every output bit,\n    h ^= h >> 16                                       # so small edits can't cancel out when hashes are added up\n    h = (h * 0x85EBCA6B) & 0xFFFFFFFF\n    h ^= h >> 13\n    h = (h * 0xC2B2AE35) & 0xFFFFFFFF\n    return h ^ (h >> 16)\n\ndef checksum(store, start, end):                       # one number for ids start .. end - 1; each store computes its own\n    total = 0\n    for i in range(start, end):\n        record = store.get(i)\n        total += mix(fnv(f\"{i}:{record[0]}:{record[1]}\" if record else f\"{i}:missing\"))\n    return total % 2**32\n\ndef differences(old, new, n, size):\n    ids, compared = [], 0\n    ...                                                # TODO: compare checksums per range; records only where they differ\n    return ids, compared\n"},{"lang":"javascript","src":"function fnv(text) {                                   // FNV-1a, 32 bits\n  let h = 2166136261;\n  for (const byte of Buffer.from(text)) h = Math.imul(h ^ byte, 16777619) >>> 0;\n  return h;\n}\n\nfunction mix(h) {                                      // MurmurHash3's finaliser: every input bit moves every output bit,\n  h ^= h >>> 16;                                       // so small edits can't cancel out when hashes are added up\n  h = Math.imul(h, 0x85ebca6b);\n  h ^= h >>> 13;\n  h = Math.imul(h, 0xc2b2ae35);\n  return (h ^ (h >>> 16)) >>> 0;\n}\n\nfunction checksum(store, start, end) {                 // one number for ids start .. end - 1; each store computes its own\n  let total = 0;\n  for (let i = start; i < end; i++) {\n    const record = store.get(i);\n    total += mix(fnv(record ? `${i}:${record[0]}:${record[1]}` : `${i}:missing`));\n  }\n  return total % 2 ** 32;\n}\n\nconst same = (a, b) => (a && b ? a[0] === b[0] && a[1] === b[1] : a === b);\n\nfunction differences(oldStore, newStore, n, size) {\n  const ids = [];\n  let compared = 0;\n  // TODO: compare checksums per range; records only where they differ\n  return [ids, compared];\n}\n"}]},"solution":{"t":"Solution: skip matching ranges, then compare records only where the checksums differ","tabs":[{"lang":"python","src":"def fnv(text):                                         # FNV-1a, 32 bits\n    h = 2166136261\n    for byte in text.encode():\n        h = ((h ^ byte) * 16777619) & 0xFFFFFFFF\n    return h\n\ndef mix(h):                                             # MurmurHash3's finaliser: every input bit moves every output bit,\n    h ^= h >> 16                                       # so small edits can't cancel out when hashes are added up\n    h = (h * 0x85EBCA6B) & 0xFFFFFFFF\n    h ^= h >> 13\n    h = (h * 0xC2B2AE35) & 0xFFFFFFFF\n    return h ^ (h >> 16)\n\ndef checksum(store, start, end):                       # one number for ids start .. end - 1; each store computes its own\n    total = 0\n    for i in range(start, end):\n        record = store.get(i)\n        total += mix(fnv(f\"{i}:{record[0]}:{record[1]}\" if record else f\"{i}:missing\"))\n    return total % 2**32\n\ndef differences(old, new, n, size):\n    ids, compared = [], 0\n    for start in range(0, n, size):\n        end = min(start + size, n)\n        if checksum(old, start, end) == checksum(new, start, end):\n            continue                                   # one number per range crossed the network, not size records\n        for i in range(start, end):\n            compared += 1\n            if old.get(i) != new.get(i):\n                ids.append(i)\n    return ids, compared\n\nold = {i: (1, i * 7 % 1000) for i in range(10_000)}\nnew = dict(old)\nnew[1234] = (2, 99)                                    # an update the new store missed\ndel new[1300]                                          # a record the backfill skipped\nnew[7777] = (1, 0)                                     # a corrupted value\nids, compared = differences(old, new, 10_000, 500)\nprint(f\"{len(ids)} records differ: {', '.join(map(str, ids))}\")\nprint(f\"compared 20 checksums, then {compared:,} records one by one instead of 10,000\")\n","out":"3 records differ: 1234, 1300, 7777\ncompared 20 checksums, then 1,000 records one by one instead of 10,000\n"},{"lang":"javascript","src":"function fnv(text) {                                   // FNV-1a, 32 bits\n  let h = 2166136261;\n  for (const byte of Buffer.from(text)) h = Math.imul(h ^ byte, 16777619) >>> 0;\n  return h;\n}\n\nfunction mix(h) {                                      // MurmurHash3's finaliser: every input bit moves every output bit,\n  h ^= h >>> 16;                                       // so small edits can't cancel out when hashes are added up\n  h = Math.imul(h, 0x85ebca6b);\n  h ^= h >>> 13;\n  h = Math.imul(h, 0xc2b2ae35);\n  return (h ^ (h >>> 16)) >>> 0;\n}\n\nfunction checksum(store, start, end) {                 // one number for ids start .. end - 1; each store computes its own\n  let total = 0;\n  for (let i = start; i < end; i++) {\n    const record = store.get(i);\n    total += mix(fnv(record ? `${i}:${record[0]}:${record[1]}` : `${i}:missing`));\n  }\n  return total % 2 ** 32;\n}\n\nconst same = (a, b) => (a && b ? a[0] === b[0] && a[1] === b[1] : a === b);\n\nfunction differences(oldStore, newStore, n, size) {\n  const ids = [];\n  let compared = 0;\n  for (let start = 0; start < n; start += size) {\n    const end = Math.min(start + size, n);\n    if (checksum(oldStore, start, end) === checksum(newStore, start, end)) continue;   // one number per range crossed the network, not size records\n    for (let i = start; i < end; i++) {\n      compared++;\n      if (!same(oldStore.get(i), newStore.get(i))) ids.push(i);\n    }\n  }\n  return [ids, compared];\n}\n\nconst oldStore = new Map(Array.from({ length: 10000 }, (_, i) => [i, [1, (i * 7) % 1000]]));\nconst newStore = new Map(oldStore);\nnewStore.set(1234, [2, 99]);                           // an update the new store missed\nnewStore.delete(1300);                                 // a record the backfill skipped\nnewStore.set(7777, [1, 0]);                            // a corrupted value\nconst [ids, compared] = differences(oldStore, newStore, 10000, 500);\nconsole.log(`${ids.length} records differ: ${ids.join(\", \")}`);\nconsole.log(`compared 20 checksums, then ${compared.toLocaleString(\"en-US\")} records one by one instead of 10,000`);\n","out":"3 records differ: 1234, 1300, 7777\ncompared 20 checksums, then 1,000 records one by one instead of 10,000\n"}]}},"traps":[["“We'll rewrite it from scratch; it'll take a year.”","The old system keeps changing, the new one must match years of behaviour, and nothing ships until the end. Strangle it instead: one capability at a time, each delivering value."],["“Rename the column in the same release as the code.”","Services deploy at different times and rollbacks bring old code back. Expand, migrate, then contract, so every step works with both versions."],["“Dual writes keep the two stores in sync.”","One write can succeed while the other fails, and concurrent writes can arrive in different orders. Verify continuously, repair differences, or write once and propagate with change data capture or an outbox."],["“The backfill just copies the rows.”","A live update can land between the backfill's read and its write. Write conditionally by version, and make the backfill idempotent, resumable and throttled."],["“Adding a field is always safe.”","Not if it's a required field in a request, if it changes a default, or if clients treat an unknown enum value as an error. Check source, wire and semantic compatibility."],["“We announced the deprecation, so we can switch v1 off.”","Announcements don't reach every caller. Measure traffic by client, contact the remaining callers, and switch off only when usage is gone or the agreed date has passed."]],"disc":[["Your company wants to move from a monolith with one shared database to services that own their data. Where do you start, and how do you avoid a two-year freeze?","Start from outcomes, then pick a first capability with a clear seam and visible value. Put a gateway in front of the monolith and route that capability to a new service, which first gets its data from the monolith's tables through change data capture, then takes over the writes with dual writes or an outbox, verified before the switch. Keep the monolith working and shipping throughout, move one capability at a time, measure the results, and stop when the value is captured. Change team ownership to match the new boundaries, or the old structure will grow back."],["A partner integration uses v1 of your public API, and v2 changes the order format. How do you retire v1 safely?","Run v1 and v2 side by side, with v1 as a thin adapter over v2's implementation so there's one codebase to maintain. Announce the deprecation with a date in the docs and with Deprecation and Sunset headers, and publish a migration guide. Measure v1 traffic by client key, contact the remaining callers directly, and consider short, announced brownouts near the end to flush out forgotten integrations. Switch v1 off only when traffic is gone or the contractual date has passed."]],"teach":{"prompt":"Explain to a junior colleague how you'd split a database column used by several services, without downtime.","rubric":["Why one release can't do it: independent deploys and rollbacks mean two versions run at once","Expand: add the new columns; release code that writes both and reads new with a fallback","Backfill old rows in idempotent, conditional batches, and verify","Switch reads and writes to the new columns, then contract by dropping the old one","Every step reversible except the last; feature flags and metrics decide each step"],"model":"Services deploy independently, and a rollback brings old code back, so for a while two versions of the code run against the same table. Any single step that changes the schema and the code together breaks one of them. So I'd expand first: add the new columns, then release code that writes both the old and the new columns and reads the new ones, falling back to the old column for rows that haven't been backfilled. Next, a backfill fills the new columns for old rows in small, resumable batches, writing only where the values are still missing so it never overwrites newer data, and I'd verify with counts and comparisons. Once every service reads and writes the new columns, and nothing has used the old one for a while, I'd contract by dropping it. Each step can be rolled back except the drop, which is why it comes last."},"qa":[["What is the strangler fig pattern?","Replacing a legacy system gradually: route one capability at a time to a new system behind a proxy, and retire the old code once nothing calls it."],["The three phases of parallel change?","Expand (support old and new), migrate (move the clients), contract (remove the old)."],["Stripe's four steps for an online data migration?","Dual write, move reads, move writes, then remove the old data."],["Why must a backfill write be conditional?","A live update can land between the backfill's read and its write; writing only if newer, by version, stops it overwriting newer data."],["Under BACKWARD compatibility, which side upgrades first?","Consumers, because the new schema must read data written with the old one."],["Why reserve a deleted protobuf field number?","So it's never reused: old data and old clients would read the new field as the old one."]],"quiz":[{"q":"What does this print?","snip":{"t":"Semantic versioning for an API release","tabs":[{"lang":"python","src":"version = (2, 4, 1)\nchanges = [\"fix a typo\", \"add an optional field\"]\nmajor, minor, patch = version\nif \"remove a field\" in changes:\n    major, minor, patch = major + 1, 0, 0\nelif \"add an optional field\" in changes:\n    minor, patch = minor + 1, 0\nelse:\n    patch += 1\nprint(f\"{major}.{minor}.{patch}\")\n"},{"lang":"javascript","src":"const version = [2, 4, 1];\nconst changes = [\"fix a typo\", \"add an optional field\"];\nlet [major, minor, patch] = version;\nif (changes.includes(\"remove a field\")) [major, minor, patch] = [major + 1, 0, 0];\nelse if (changes.includes(\"add an optional field\")) [minor, patch] = [minor + 1, 0];\nelse patch++;\nconsole.log(`${major}.${minor}.${patch}`);\n"}]},"o":["2.5.0","2.4.2","3.0.0","2.5.1"],"a":0,"e":"A backwards-compatible addition raises the minor version and resets the patch. Only a breaking change, such as removing a field, raises the major version."},{"q":"What does this print?","snip":{"t":"A backfill write that arrives late","tabs":[{"lang":"python","src":"store = {\"a\": (3, \"blue\")}                   # (version, value), already dual-written\nsnapshot = (2, \"green\")                      # what the backfill read a moment earlier\nif store.get(\"a\", (0, None))[0] < snapshot[0]:\n    store[\"a\"] = snapshot\nprint(store[\"a\"][1])\n"},{"lang":"javascript","src":"const store = { a: [3, \"blue\"] };            // [version, value], already dual-written\nconst snapshot = [2, \"green\"];               // what the backfill read a moment earlier\nif ((store.a ?? [0, null])[0] < snapshot[0]) store.a = snapshot;\nconsole.log(store.a[1]);\n"}]},"o":["blue","green","None or null","an error"],"a":0,"e":"The store already holds version 3, newer than the snapshot's version 2, so the conditional write leaves it alone. A plain copy would have put the stale green back."},{"q":"In an expand-and-contract migration, which step is the one-way door?","o":["Dropping the old column in the contract step","Adding the new columns in the expand step","Releasing code that writes both columns","Running the backfill"],"a":0,"e":"Every earlier step can be undone by deploying the previous release. Once the old column and its data are gone, a rollback to code that needs it fails, so the drop comes last, after a quiet period."},{"q":"You're replacing a legacy monolith's order handling with a new service. What does the strangler fig pattern suggest?","o":["Route order requests through a proxy to the new service, a slice of traffic at a time, while the monolith keeps everything else","Freeze the monolith, rewrite all of it, then switch over in one weekend","Copy the monolith's code into the new service and delete the original","Give the new service the same database tables and let both write to them indefinitely"],"a":0,"e":"The routing layer moves one capability at a time and can send traffic back instantly. A shared database forever would keep the two coupled, so data ownership moves too, with change data capture or dual writes on the way."},{"q":"Which changes are backwards compatible within one major version of an API? (choose 2)","t":"ms","o":["Adding an optional field to a response","Adding a new method","Renaming a field","Changing a field's default value","Adding a required field to a request"],"a":[0,1],"e":"Google's AIP-180 treats renames, changed defaults and new required request fields as breaking: existing clients would fail or quietly behave differently."},{"q":"Judge each statement.","t":"yn","s":[["Under a schema registry's BACKWARD mode, consumers are upgraded before producers.",true],["A deleted protobuf field number can be reused once every client has upgraded.",false],["A parallel run returns the new path's result once the two usually match.",false],["Feature flags let you deploy code without releasing the feature.",true]],"e":"Backward means new readers handle old data, so consumers go first. Protobuf field numbers must never be reused; reserve them. Scientist-style experiments always return the old (control) result, and flags decouple deploy from release."},{"q":"Put an online data migration in order.","t":"ord","items":["Start dual writing to the old and new stores","Backfill existing records, then verify","Move reads to the new store, comparing results","Move writes so the new store is the source of truth","Remove the old data and the code that wrote it"],"e":"This is Stripe's four-step pattern with the backfill made explicit. Each step is verified before the next, and only the last can't be undone."},{"q":"Complete the Python backfill write so it never overwrites newer data.","t":"drop","lang":"python","code":"def backfill_write(new, record_id, snapshot):         # snapshot: (version, value) read from the old store earlier\n    current = new.get(record_id)\n    if current is None or current[0] {{0}} snapshot[0]:\n        new[record_id] = {{1}}\n","blanks":[{"o":["<",">",">=","=="],"a":0},{"o":["snapshot","current","None","(snapshot[0] + 1, snapshot[1])"],"a":0}],"e":"Write only when the record is missing or older than the snapshot. A record with the same or a newer version was already copied or dual-written, so the backfill leaves it alone."}],"probs":[["Reading · Martin Fowler: Strangler Fig Application","https://martinfowler.com/bliki/StranglerFigApplication.html","","find the seams in a legacy system you know, and choose the first capability to move and why"],["Reading · Stripe: Online migrations at scale","https://stripe.com/blog/online-migrations","","write a four-step plan for a migration you've done or will do, with the verification for each step"],["Reference · Confluent: Schema evolution and compatibility","https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html","","classify five recent changes to your events by compatibility mode, and say who had to upgrade first"],["Reference · Google AIP-180: Backwards compatibility","https://google.aip.dev/180","","check your last three API changes against its list of breaking changes"]],"src":[["Martin Fowler: Strangler Fig Application (updated August 2024)","https://martinfowler.com/bliki/StranglerFigApplication.html"],["Danilo Sato (2014): Parallel Change","https://martinfowler.com/bliki/ParallelChange.html"],["Martin Fowler (2014): Branch By Abstraction","https://martinfowler.com/bliki/BranchByAbstraction.html"],["Jacqueline Xu, Stripe (2017): Online migrations at scale","https://stripe.com/blog/online-migrations"],["GitHub Scientist: a library for carefully refactoring critical paths","https://github.com/github/scientist"],["Protocol Buffers: Language guide (proto 3), updating a message type","https://protobuf.dev/programming-guides/proto3/"],["Confluent: Schema evolution and compatibility","https://docs.confluent.io/platform/current/schema-registry/fundamentals/schema-evolution.html"],["Google AIP-180: Backwards compatibility","https://google.aip.dev/180"],["RFC 9745: The Deprecation HTTP Response Header Field (2025)","https://www.rfc-editor.org/rfc/rfc9745.html"]]},{"id":"m05","d":"d3","t":"Socio-technical design: Conway's law, Team Topologies and platform teams","min":120,"hook":"Every architecture is built by an organisation, and the organisation leaves its fingerprints on it. Melvin Conway noticed in 1968 that systems copy the communication structures of the groups that design them. So an architect who ignores team boundaries gets an architecture shaped by accident. This module covers designing teams and systems together: Conway's law and its inverse, Team Topologies' team types and interaction modes, cognitive load, and platform teams that speed others up instead of becoming a queue.","pre":{"q":"In your company, every feature needs changes from the frontend, backend and data teams, and features take six weeks to ship though the work itself takes two. What does Conway's law suggest, and what would you look at first?","a":"The architecture mirrors the layer-based teams, so every feature crosses three team boundaries, and the time goes into hand-offs and waiting in each team's queue, not into the work. Look at the data first: how often changes need more than one team, and where features wait. Then consider teams aligned to streams of business change, each owning its slice from user interface to database, with the architecture's boundaries moved to match: the inverse Conway maneuver."},"kid":{"t":"Who bakes which pizza","x":"At first Luigi's family splits the kitchen by job: one makes the dough, one the sauce, one the toppings, one works the oven. Every pizza passes through four pairs of hands, and when the sauce-maker is busy, everyone waits. So they change: each person makes whole pizzas for one kind of order, start to finish. Grandma, who knows the wood-fired oven's secrets, keeps the tricky oven running for everyone. Uncle Marco spends a week teaching the cousins his dough trick, then goes back to his own pizzas. And nobody is given more recipes than they can remember.","map":[["Splitting by job: dough, sauce, toppings, oven","Teams by technical layer: every feature needs several teams"],["Each person making whole pizzas for one kind of order","Stream-aligned teams that own a flow of change end to end"],["Grandma keeping the tricky oven running for everyone","A platform or complicated-subsystem team, offering its work as a service"],["Uncle Marco teaching for a week, then leaving","An enabling team, facilitating for a while"],["Nobody gets more recipes than they can remember","Cognitive load: a team owns only what it can understand"]],"brk":"A family kitchen can reorganise in an afternoon. Real reorganisations take months, and the code doesn't move just because the teams did, so team boundaries and module boundaries have to change together, in small steps."},"keys":["**Conway's law**: in his 1968 paper, Melvin Conway argued that organisations that design systems are constrained to produce designs that copy their communication structures. Teams that talk easily build tightly coupled code; teams that rarely talk build components with narrow interfaces. Teams organised by layer (frontend, backend, database) therefore produce features that need every layer's team to ship.","**The inverse Conway maneuver**: since the organisation shapes the architecture, shape the organisation on purpose: decide the boundaries you want, then form teams around them. Martin Fowler's caution: it isn't magic. A reorganisation alone won't untangle a rigid legacy system, so team boundaries and code boundaries are changed together, in small steps, watching for friction.","**Team Topologies' four team types**: stream-aligned teams own a flow of change for a part of the business, end to end, and should be most of your teams; enabling teams help them adopt new skills and practices, then move on; complicated-subsystem teams own parts that need deep specialist knowledge; platform teams provide internal products that let stream-aligned teams deliver faster, as a self-service.","**Three interaction modes**: collaboration (two teams working closely for a defined period, to discover something new), X-as-a-Service (one team consumes what another provides, through a clear interface, with little talking) and facilitating (one team helps and mentors another). Interactions should be explicit, and they change over time: a collaboration that discovers an API often ends as X-as-a-Service.","**Cognitive load**: a team can only own well what it can understand. Overloaded teams, like overloaded CPUs, slow down and make poor decisions. Size each team's responsibilities to fit it, reduce the complexity that doesn't add value, and keep teams small and long-lived, often five to nine people (a rule of thumb: communication paths grow with the square of team size).","**Platforms as products**: the CNCF's platforms white paper describes a good internal platform as a product designed around its users' needs, with self-service interfaces, good documentation and golden paths, reduced cognitive load, optional and composable parts, and security by default. Start with the thinnest viable platform, sometimes only documentation and templates, and earn adoption rather than mandating it.","**Measuring the socio-technical system**: track flow (deployment frequency, lead time for changes, change failure rate and time to restore, the DORA measures), how often changes need more than one team, how long work waits between teams, platform adoption and developer satisfaction. Rising cross-team change and waiting time are signs that team and system boundaries have drifted apart.","**Design them together**: when you draw service boundaries, say which team will own each one and how it will interact with its neighbours. Domain-driven design's bounded contexts are good candidates for both, because each groups the people, the language and the code around one area of the business."],"dia":[{"type":"hub","cap":"Team Topologies: four team types","core":"The flow of change to users","spokes":[["Stream-aligned","own a business stream end to end; most teams should be these"],["Platform","internal products, self-service, that speed the streams up"],["Enabling","coach teams in new skills for a while, then move on"],["Complicated-subsystem","specialists owning a genuinely hard part"]]},{"type":"flow","cap":"How two teams' interaction typically evolves","steps":[["Collaboration","work closely for a few weeks to discover a new API or practice"],["X-as-a-Service","the API is stable: consume it with little talking"],["Facilitating","when it changes again, one team helps the other adopt it"]],"note":"Collaboration is expensive and meant to be temporary; most interactions should settle into X-as-a-Service."},{"type":"layers","cap":"The same product, organised two ways","rows":[["By layer","frontend, backend and data teams: most changes need all three"],["By stream","orders and billing teams, each owning its web pages, API and data: most changes stay inside one team"],["Platform","deployment, observability and templates, offered as a self-service product"],["Specialists","a payments team owning a complicated subsystem, offered as a service"]],"note":"Moving from the first row to the other three is the inverse Conway maneuver."}],"cmp":[{"cap":"Team Topologies' interaction modes","head":["Mode","What it looks like","When to use it","Watch for"],"rows":[["Collaboration","Two teams work closely, sharing goals","Discovering something new, for a defined period","It never ends, and both teams slow down"],["X-as-a-Service","One team consumes what another provides","The interface is understood and fairly stable","A ticket queue in place of real self-service"],["Facilitating","One team coaches another","Adopting a new skill, tool or practice","The enabling team doing the work itself"]]},{"cap":"Signs that teams and architecture have drifted apart","head":["Signal","What it usually means"],"rows":[["Most changes need two or more teams","Boundaries follow layers or history, not the flow of change"],["Work waits days for another team","Hand-offs and queues dominate lead time"],["One team owns far more than the others","Cognitive overload: slow, risky changes"],["Dependencies nobody declared","Hidden coupling; outages and surprise breakages"],["The platform has a long ticket queue","It's a service desk, not a self-service product"]]}],"code":[{"t":"The seeded random generator used to simulate a year of changes","tabs":[{"lang":"python","src":"def mulberry32(seed):\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Conway's law in the commit log: how often a change needs more than one team","tabs":[{"lang":"python","src":"STREAMS = [                                            # (business stream, % of changes, [(module, % of its changes touching it)])\n    (\"orders\", 45, [(\"web-orders\", 70), (\"orders-api\", 100), (\"orders-db\", 40), (\"design-system\", 10)]),\n    (\"billing\", 35, [(\"web-billing\", 60), (\"billing-api\", 100), (\"billing-db\", 50), (\"orders-api\", 15)]),\n    (\"search\", 20, [(\"web-search\", 60), (\"search-api\", 100), (\"search-index\", 50)]),\n]\nrand = mulberry32(7)\nCHANGES = []                                           # 200 changes, each the list of modules it touched\nfor _ in range(200):\n    r = int(rand() * 100)\n    for stream, share, modules in STREAMS:\n        if r < share:\n            break\n        r -= share\n    CHANGES.append([m for m, chance in modules if int(rand() * 100) < chance])\n\nBY_LAYER = {\"web-orders\": \"Frontend\", \"web-billing\": \"Frontend\", \"web-search\": \"Frontend\", \"design-system\": \"Frontend\",\n            \"orders-api\": \"Backend\", \"billing-api\": \"Backend\", \"search-api\": \"Backend\",\n            \"orders-db\": \"Data\", \"billing-db\": \"Data\", \"search-index\": \"Data\"}\nBY_STREAM = {\"web-orders\": \"Orders\", \"orders-api\": \"Orders\", \"orders-db\": \"Orders\",\n             \"web-billing\": \"Billing\", \"billing-api\": \"Billing\", \"billing-db\": \"Billing\",\n             \"web-search\": \"Search\", \"search-api\": \"Search\", \"search-index\": \"Search\", \"design-system\": \"Platform\"}\n\ndef analyse(owner):\n    crossing, pairs = 0, {}\n    for modules in CHANGES:\n        teams = sorted({owner[m] for m in modules})\n        if len(teams) > 1:\n            crossing += 1\n            for i in range(len(teams)):\n                for j in range(i + 1, len(teams)):\n                    pair = f\"{teams[i]} + {teams[j]}\"\n                    pairs[pair] = pairs.get(pair, 0) + 1\n    top = sorted(pairs.items(), key=lambda kv: (-kv[1], kv[0]))[:2]\n    return crossing, top\n\nfor label, owner in ((\"teams by layer\", BY_LAYER), (\"teams by stream\", BY_STREAM)):\n    crossing, top = analyse(owner)\n    print(f\"{label}: {crossing} of {len(CHANGES)} changes need more than one team ({crossing * 100 // len(CHANGES)}%)\")\n    print(\"  most often changed together: \" + \", \".join(f\"{pair} ({n})\" for pair, n in top))\n","out":"teams by layer: 163 of 200 changes need more than one team (81%)\n  most often changed together: Backend + Frontend (122), Backend + Data (95)\nteams by stream: 17 of 200 changes need more than one team (8%)\n  most often changed together: Billing + Orders (9), Orders + Platform (8)\n","notes":[[1,"Changes follow the business: most orders work touches the orders pages, API and data together."],[16,"Today's teams are organised by layer, the way the code was first split."],[26,"A change that touches modules owned by two teams needs both teams: a conversation, a hand-off or a wait."],[36,"The same changes, owned by stream-aligned teams, rarely cross a boundary; the pairs that remain show where team APIs are needed."]]},{"lang":"javascript","src":"const STREAMS = [                                      // [business stream, % of changes, [[module, % of its changes touching it]]]\n  [\"orders\", 45, [[\"web-orders\", 70], [\"orders-api\", 100], [\"orders-db\", 40], [\"design-system\", 10]]],\n  [\"billing\", 35, [[\"web-billing\", 60], [\"billing-api\", 100], [\"bill
