he missing number","tabs":[{"lang":"python","src":"from functools import reduce\nfrom operator import xor\n\ndef single_number(nums):          # every value appears twice except one\n    return reduce(xor, nums, 0)\n\ndef missing_number(nums):         # nums holds n distinct values from 0..n\n    result = len(nums)\n    for i, v in enumerate(nums):\n        result ^= i ^ v           # XOR in each index and each value\n    return result\n\nprint(single_number([4, 1, 2, 1, 2]), single_number([7]),\n      missing_number([3, 0, 1]), missing_number([9, 6, 4, 2, 3, 5, 7, 0, 1]))\n","out":"4 7 2 8","notes":[[5,"Pairs cancel (x ^ x = 0) and order doesn't matter, so only the single value survives."],[10,"Each number 0..n appears once as an index (or as len(nums)) and once as a value, except the missing one, which appears only once."]]},{"lang":"javascript","src":"const singleNumber = nums => nums.reduce((acc, v) => acc ^ v, 0);   // every value twice except one\n\nfunction missingNumber(nums) {    // nums holds n distinct values from 0..n\n  let result = nums.length;\n  nums.forEach((v, i) => { result ^= i ^ v; });   // XOR in each index and each value\n  return result;\n}\n\nconsole.log(singleNumber([4, 1, 2, 1, 2]), singleNumber([7]),\n            missingNumber([3, 0, 1]), missingNumber([9, 6, 4, 2, 3, 5, 7, 0, 1]));\n","out":"4 7 2 8","notes":[[1,"Pairs cancel (x ^ x = 0) and order doesn't matter, so only the single value survives."],[5,"Each number 0..n appears once as an index (or as nums.length) and once as a value, except the missing one, which appears only once."]]}]},{"t":"Integer width: the same expressions, two answers","tabs":[{"lang":"python","src":"def to_int32(x):                          # wrap to 32 bits, like JavaScript's  x | 0\n    x &= 0xFFFFFFFF                       # keep the low 32 bits: now 0 .. 2**32 - 1\n    return x - (1 << 32) if x >> 31 else x   # bit 31 set: the value is negative\n\nprint(\"1 << 31   \", 1 << 31)\nprint(\"1 << 32   \", 1 << 32)\nprint(\"~5        \", ~5)\nprint(\"-7 >> 1   \", -7 >> 1)\nprint(\"2**32 | 0 \", 2**32 | 0)\nprint(\"wrapped   \", to_int32(2**31), to_int32(2**32 + 5))\nprint(\"-1 as u32 \", -1 & 0xFFFFFFFF)\nprint(\"1 << 40   \", 1 << 40)\n","out":"1 << 31    2147483648\n1 << 32    4294967296\n~5         -6\n-7 >> 1    -4\n2**32 | 0  4294967296\nwrapped    -2147483648 5\n-1 as u32  4294967295\n1 << 40    1099511627776\n","notes":[[1,"This is the wrap JavaScript applies to the operands of `& | ^ ~` and the left side of `<<` and `>>` (its ToInt32 step), written out in Python for whole numbers."],[5,"Python ints grow as needed, so nothing ever wraps."]]},{"lang":"javascript","src":"console.log(\"1 << 31   \", 1 << 31);\nconsole.log(\"1 << 32   \", 1 << 32);\nconsole.log(\"~5        \", ~5);\nconsole.log(\"-7 >> 1   \", -7 >> 1);\nconsole.log(\"2**32 | 0 \", 2 ** 32 | 0);\nconsole.log(\"wrapped   \", 2 ** 31 | 0, (2 ** 32 + 5) | 0);\nconsole.log(\"-1 as u32 \", -1 >>> 0);\nconsole.log(\"1n << 40n \", 1n << 40n);\n","out":"1 << 31    -2147483648\n1 << 32    1\n~5         -6\n-7 >> 1    -4\n2**32 | 0  0\nwrapped    -2147483648 5\n-1 as u32  4294967295\n1n << 40n  1099511627776n\n","notes":[[1,"The results of `& | ^ ~ << >>` are 32-bit signed, and bit 31 is the sign bit (`>>>` is the exception)."],[2,"The shift count is taken mod 32, so this is 1 << 0."],[7,"`>>>` is the unsigned right shift: `x >>> 0` reads the same 32 bits as an unsigned number."],[8,"BigInt has no width limit, but mixing it with a Number (`1n << 3`) throws a TypeError."]]}]}],"ex":{"q":"Every value in `nums` appears three times except one, which appears once. Find it in O(n) time and O(1) extra space (LeetCode 137, Single Number II). Values can be negative.","steps":["Plain XOR fails: a value XOR-ed three times is itself, not 0.","Look at one bit position at a time. Each tripled value adds 0 or 3 ones to that position, and the single value adds 0 or 1. So the count of ones mod 3 is the single value's bit.","Repeat for all 32 positions: O(32 · n) = O(n) time and O(1) extra space.","Negatives: in JavaScript, `1 << 31` sets the sign bit, so the result comes out negative by itself. In Python the result is just a big positive number, so if bit 31 is set, subtract 2³²."],"code":{"t":"Count each bit mod 3","tabs":[{"lang":"python","src":"def single_number_ii(nums):                     # every value appears 3 times except one\n    result = 0\n    for i in range(32):\n        ones = sum((x >> i) & 1 for x in nums)   # how many values have bit i set\n        if ones % 3:                             # so the single value has bit i set\n            result |= 1 << i\n    return result - (1 << 32) if result >> 31 else result   # bit 31 is the sign\n\nprint(single_number_ii([2, 2, 3, 2]), single_number_ii([0, 1, 0, 1, 0, 1, 99]),\n      single_number_ii([-4, -4, 7, -4]), single_number_ii([5, -2, 5, 5]))\n","out":"3 99 7 -2"},{"lang":"javascript","src":"function singleNumberII(nums) {                 // every value appears 3 times except one\n  let result = 0;\n  for (let i = 0; i < 32; i++) {\n    let ones = 0;\n    for (const x of nums) ones += (x >> i) & 1;   // how many values have bit i set\n    if (ones % 3) result |= 1 << i;              // 1 << 31 sets the sign bit itself\n  }\n  return result;\n}\n\nconsole.log(singleNumberII([2, 2, 3, 2]), singleNumberII([0, 1, 0, 1, 0, 1, 99]),\n            singleNumberII([-4, -4, 7, -4]), singleNumberII([5, -2, 5, 5]));\n","out":"3 99 7 -2"}]},"a":"3 99 7 −2. In the last call the answer, −2, has bit 31 set. JavaScript's `1 << 31` makes the result negative directly; Python builds 4294967294 and subtracts 2³² to get −2."},"fade":{"q":"Count the subsets of `nums` whose sum equals `target` by trying every subset as a bitmask. Each item counts separately, even if values repeat.","steps":["Number the items 0 to n − 1. Each mask from 0 to 2ⁿ − 1 picks a subset: bit i set means item i is in it.",{"ask":"How do you test whether item i is in the subset?","a":"`(mask >> i) & 1` is 1 when bit i is set (or check that `mask & (1 << i)` isn't 0)."},{"ask":"Which mask is the empty subset, and does it count when the target is 0?","a":"Mask 0. Its sum is 0, so it counts: [1, 2] with target 0 gives 1."},{"ask":"Time, and the largest practical n?","a":"O(n · 2ⁿ), fine up to about n = 20. In JavaScript, `1 << n` also turns negative at n = 31."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def count_subsets_with_sum(nums, target):\n    n, count = len(nums), 0\n    for mask in range(1 << n):              # every subset, as an n-bit number\n        total = 0\n        for i in range(n):\n            ...                             # TODO: add nums[i] if bit i of mask is set\n        if total == target:\n            count += 1\n    return count\n"},{"lang":"javascript","src":"function countSubsetsWithSum(nums, target) {\n  const n = nums.length;\n  let count = 0;\n  for (let mask = 0; mask < 1 << n; mask++) {   // every subset, as an n-bit number\n    let total = 0;\n    for (let i = 0; i < n; i++) {\n      // TODO: add nums[i] if bit i of mask is set\n    }\n    if (total === target) count++;\n  }\n  return count;\n}\n"}]},"solution":{"t":"Solution: test bit i of the mask","tabs":[{"lang":"python","src":"def count_subsets_with_sum(nums, target):\n    n, count = len(nums), 0\n    for mask in range(1 << n):              # every subset, as an n-bit number\n        total = 0\n        for i in range(n):\n            if (mask >> i) & 1:             # is item i in this subset?\n                total += nums[i]\n        if total == target:\n            count += 1\n    return count\n\nprint(count_subsets_with_sum([1, 2, 3, 4], 5), count_subsets_with_sum([2, 2, 2], 4), count_subsets_with_sum([1, 2], 0))\n","out":"2 3 1"},{"lang":"javascript","src":"function countSubsetsWithSum(nums, target) {\n  const n = nums.length;\n  let count = 0;\n  for (let mask = 0; mask < 1 << n; mask++) {   // every subset, as an n-bit number\n    let total = 0;\n    for (let i = 0; i < n; i++) {\n      if ((mask >> i) & 1) total += nums[i];    // is item i in this subset?\n    }\n    if (total === target) count++;\n  }\n  return count;\n}\n\nconsole.log(countSubsetsWithSum([1, 2, 3, 4], 5), countSubsetsWithSum([2, 2, 2], 4), countSubsetsWithSum([1, 2], 0));\n","out":"2 3 1"}]}},"traps":[["“`x & (x - 1) === 0` tests for a power of two in JavaScript.”","In JavaScript, `===` binds tighter than `&` (as `==` does in C and Java), so that's `x & ((x - 1) === 0)`. Write `(x & (x - 1)) === 0`. Python's precedence is the other way round, so the bug only bites in JS: put the parentheses in everywhere."],["“Python's `~5` is a huge positive number, like in a 32-bit language.”","Python ints have no width, so `~x` is always −x − 1: `~5` is −6. JavaScript gives −6 too, because its 32-bit integers are signed. Unsigned values like 4294967290 appear only if you mask (`& 0xFFFFFFFF`) or use `>>> 0`."],["“Shifting left can't change the sign.”","In JavaScript, `1 << 31` is −2147483648 and `1 << 32` is 1 (the shift count is taken mod 32). Python just keeps growing: `1 << 32` is 4294967296."],["“Kernighan's loop works on any int.”","A negative Python int has infinitely many 1 bits, so `while x: x &= x - 1` never ends. Mask first (`x & 0xFFFFFFFF`) to look at the 32-bit pattern. In JavaScript the 32-bit conversion stops it after at most 32 steps."],["“Bitwise operators are safe on any JavaScript number.”","They cut values to 32 bits: `2 ** 32 | 0` is 0 and `2 ** 40 >> 1` is 0. For bigger values use arithmetic (`Math.floor(x / 2)`) or BigInt (`1n << 40n`), and don't mix BigInt with Number."],["“XOR finds the odd one out whatever the counts are.”","XOR cancels pairs only. If the other values appear three times, count each bit position mod 3 (LeetCode 137)."]],"disc":[["Where do bit tricks show up in real code, not just interviews?","Permission and feature flags packed into one integer, bitsets and Bloom filters, hashing and checksums, compression, graphics, and IP subnet masks. Readable code hides them behind well-named helpers or constants (`READ | WRITE`) rather than bare numbers."],["Should you write `x & 1` instead of `x % 2` because it's faster?","Not for speed: compilers and JITs make both fast, so pick the clearer one. They also differ on negatives in JavaScript: `-3 % 2` is −1 but `-3 & 1` is 1. In Python, both give 1, because `%` takes the sign of the divisor."]],"teach":{"prompt":"Explain to a junior colleague how XOR finds the one number that appears once when every other number appears twice, and when the trick stops working.","rubric":["x ^ x = 0 and x ^ 0 = x","XOR is commutative and associative, so the order doesn't matter","The pairs cancel, leaving the single number","O(n) time and O(1) space","Fails when the others appear three times; count the bits mod 3 instead"],"model":"XOR compares two numbers bit by bit and gives 1 where the bits differ. So any number XOR itself is 0, and any number XOR 0 is itself. XOR is also commutative and associative, so you can rearrange a long XOR chain freely: put each pair side by side, each pair becomes 0, and what's left is the single number. That's one pass with one variable: O(n) time and O(1) space. The trick depends on pairs. If the other numbers appear three times, a value XOR-ed three times is itself rather than 0, so instead you count how many numbers have each bit set and take that count mod 3."},"qa":[["What does `x & (x - 1)` do?","Clears the lowest set bit of x. For x > 0, the result is 0 exactly when x is a power of two."],["What does `x & -x` give?","Only the lowest set bit of x, e.g. 12 & −12 = 4."],["Why does XOR-ing a list find the one unpaired number?","x ^ x = 0, x ^ 0 = x, and XOR ignores order, so every pair cancels."],["How wide are JavaScript's bitwise operations?","32-bit signed integers (`>>>` gives an unsigned result). Use BigInt for wider values."],["How do you get JavaScript-style 32-bit behaviour in Python?","Mask with `& 0xFFFFFFFF`; if bit 31 is then set, subtract 2³² to get the signed value."],["How do you count the set bits of every number from 0 to n in O(n)?","`bits[i] = bits[i >> 1] + (i & 1)`."]],"quiz":[{"q":"What does this print?","snip":{"t":"Count the steps","tabs":[{"lang":"python","src":"x, steps = 0b101100, 0\nwhile x:\n    x &= x - 1\n    steps += 1\nprint(steps, 0b101100 & -0b101100)\n"},{"lang":"javascript","src":"let x = 0b101100, steps = 0;\nwhile (x) {\n  x &= x - 1;\n  steps++;\n}\nconsole.log(steps, 0b101100 & -0b101100);\n"}]},"o":["3 4","6 4","3 2","2 8"],"a":0,"e":"0b101100 is 44, with three 1 bits, so Kernighan's loop runs 3 times. 44 & −44 keeps only the lowest set bit, which is 4."},{"q":"What does this JavaScript print?","snip":{"t":"A power-of-two test","lang":"javascript","src":"const x = 8;\nconsole.log(x & (x - 1) === 0, (x & (x - 1)) === 0);\n"},"o":["0 true","true true","false true","8 true"],"a":0,"e":"`===` binds tighter than `&`, so the first test is `8 & ((8 - 1) === 0)`, which is `8 & false`, which is 0. Only the second, fully parenthesised test is right. In Python, `&` binds tighter than `==`, so both forms would work there."},{"q":"Which expression clears the lowest set bit of x?","o":["`x & (x - 1)`","`x & -x`","`x | (x + 1)`","`x ^ (x >> 1)`"],"a":0,"e":"x − 1 flips the lowest 1 and the 0s below it, and AND keeps everything above. `x & -x` *keeps* only the lowest set bit, and `x | (x + 1)` sets the lowest 0 bit."},{"q":"Which statements about JavaScript's bitwise operators are true? (choose 2)","t":"ms","o":["They convert Number operands to 32-bit integers","`>>>` returns an unsigned 32-bit value, so its result is never negative","`1 << 31` is 2147483648","You can mix BigInt and Number operands, as in `1n << 3`","`~x` equals −x + 1"],"a":[0,1],"e":"`1 << 31` is −2147483648 because bit 31 is the sign. Mixing BigInt and Number throws a TypeError. `~x` is −x − 1."},{"q":"Judge each statement.","t":"yn","s":[["`x ^ x` is 0 for every integer x.",true],["In Python, `~5` is 4294967290.",false],["In Python, `(x & (x - 1)) == 0` on its own is a correct power-of-two test.",false],["Kernighan's loop (`x &= x - 1`) runs once per set bit of a non-negative x.",true]],"e":"XOR of equal values is 0. `~5` is −6, since Python has no 32-bit wrap. 0 passes that test, so you also need `x > 0`. Each step removes exactly one set bit."},{"q":"Put the steps for finding the two numbers that appear once, when every other number appears twice (LeetCode 260), in order.","t":"ord","items":["XOR every number: the pairs cancel, leaving a ^ b","Take the lowest set bit of a ^ b: a bit where a and b differ","Split the numbers into two groups by that bit","XOR each group on its own: one gives a, the other gives b"],"e":"a ^ b isn't 0 because a ≠ b, so it has a set bit. Every pair lands in the same group and cancels, while a and b land in different groups."},{"q":"Complete the JavaScript that counts the set bits of every number from 0 to n.","t":"drop","lang":"javascript","code":"function countBits(n) {\n  const bits = new Array(n + 1).fill(0);\n  for (let i = 1; i <= n; i++) bits[i] = bits[i {{0}} 1] + (i {{1}} 1);\n  return bits;\n}\n","blanks":[{"o":[">>","<<","-","+"],"a":0},{"o":["&","|","^","%"],"a":0}],"e":"i >> 1 drops the last bit, and that smaller number's count is already known; i & 1 adds the last bit back."},{"q":"Match each goal to its expression.","t":"match","pairs":[["Test bit i","`(x >> i) & 1`"],["Set bit i","`x | (1 << i)`"],["Clear bit i","`x & ~(1 << i)`"],["Toggle bit i","`x ^ (1 << i)`"]],"extra":["`x & (x - 1)`"],"e":"OR turns a bit on, AND with the inverted mask turns it off, and XOR flips it."}],"probs":[["LC 191 · Number of 1 Bits","https://leetcode.com/problems/number-of-1-bits/","Easy","Kernighan's loop: x &= x − 1 until it's 0"],["LC 338 · Counting Bits","https://leetcode.com/problems/counting-bits/","Easy","bits[i] = bits[i >> 1] + (i & 1)"],["LC 190 · Reverse Bits","https://leetcode.com/problems/reverse-bits/","Easy","32 times: shift the result left and add the lowest bit of n; in JS finish with >>> 0"],["LC 371 · Sum of Two Integers","https://leetcode.com/problems/sum-of-two-integers/","Medium","XOR adds without carries, (a & b) << 1 is the carry; Python needs a 32-bit mask"],["LC 137 · Single Number II","https://leetcode.com/problems/single-number-ii/","Medium","the worked example, from memory: count each bit mod 3"],["LC 260 · Single Number III","https://leetcode.com/problems/single-number-iii/","Medium","XOR everything, then split by the lowest set bit of a ^ b"],["LC 201 · Bitwise AND of Numbers Range","https://leetcode.com/problems/bitwise-and-of-numbers-range/","Medium","the common prefix of left and right: shift both until they match"],["LC 421 · Maximum XOR of Two Numbers in an Array","https://leetcode.com/problems/maximum-xor-of-two-numbers-in-an-array/","Medium","a binary trie of the bits, greedy from the top bit (see Tries)"]],"src":[["MDN: Bitwise operators (JavaScript guide)","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Expressions_and_operators#bitwise_operators"],["MDN: Operator precedence","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Operator_precedence"],["Python docs: Bitwise operations on integer types","https://docs.python.org/3/library/stdtypes.html#bitwise-operations-on-integer-types"],["Sean Eron Anderson: Bit Twiddling Hacks","https://graphics.stanford.edu/~seander/bithacks.html"],["cp-algorithms: Bit manipulation","https://cp-algorithms.com/algebra/bit-manipulation.html"]]}],"plan":[{"t":"Trees, heaps & tries","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a dsa-l2/ folder with python/ and js/; pytest for Python, node --test for JavaScript; open the NeetCode 150 list","min":30,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-traversals"},{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-heap"},{"k":"mod","ref":"m04"},{"k":"lab","ref":"lab-trie"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Graphs","blocks":[{"k":"mod","ref":"m05"},{"k":"mod","ref":"m06"},{"k":"lab","ref":"lab-graph"},{"k":"mod","ref":"m07"},{"k":"lab","ref":"lab-dsu"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Search & DP","blocks":[{"k":"mod","ref":"m08"},{"k":"mod","ref":"m09"},{"k":"mod","ref":"m10"},{"k":"lab","ref":"lab-dp"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Greedy & bits","blocks":[{"k":"mod","ref":"m11"},{"k":"mod","ref":"m12"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L2","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-mocks","label":"Four timed mock interviews (45 minutes each, one medium problem, think aloud); write a short review after each","min":300,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the 150-problem list solved and logged with a pattern for each (about 30 minutes a problem)","min":4500,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L2: your pattern cheat sheet, the 5 problems that taught you most, and what you'd tell an L1 learner; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Ben's road-trip planner","org":"A route-planning app for the family's summer trip","min":25,"blurb":"Graphs, union-find, greedy and DP inside one trip-planning app.","sections":[["Overview","Ben is building an app for the family's summer road trip. It knows about 2,000 towns and 6,000 roads, plans routes, orders activities, schedules stops and shares out the budget."],["Features",["Fewest stops: the route from home to the beach through the fewest towns (every road counts the same).","Day order: some activities must happen before others (buy the tickets before the theme park), so the app needs a valid order, or a warning when there isn't one.","Open roads: as the family confirms that roads are open, one at a time, the app says whether two towns are connected yet.","Stop planner: each attraction is a timed session with a fixed start and end (a boat tour from 10:00 to 11:30), and the family stays for the whole session; fit as many sessions as possible into one day.","Budget: choose activities to get the most fun points without going over $200, each activity at most once."]],["Constraints",["Everything runs on a phone, so each feature must answer within a second.","Ben wants to name the algorithm and its cost for each feature."]]],"items":[{"d":"d2","q":"Which algorithm finds the route through the fewest towns?","o":["BFS from home, stopping when it reaches the beach","DFS from home, taking the first path it finds","Sorting the roads by length","A max-heap of towns"],"a":0,"e":"Every road counts the same, so BFS finds a fewest-edges route in O(V + E). DFS finds *a* route, not necessarily the shortest."},{"d":"d2","q":"Activities have “must happen before” rules. What does the app run, and how does it spot an impossible plan?","o":["A topological sort (Kahn's algorithm); if some activities never reach in-degree 0, the rules contain a cycle","BFS in alphabetical order; impossible plans never finish","Union-find; a failed union means the plan is impossible","Binary search over the activities"],"a":0,"e":"Kahn's algorithm outputs a valid order in O(V + E). Activities left over when the queue empties are on a cycle of rules or wait on one."},{"d":"d2","q":"Open roads arrive one at a time, and after each one the app must answer “are towns A and B connected yet?” Which structure fits?","o":["Union-find with path compression and union by size","A fresh BFS after every road","A trie of town names","A min-heap of roads"],"a":0,"e":"Each road is one union and each question two finds, all nearly O(1). A fresh BFS per question costs O(V + E) every time."},{"d":"d4","q":"How should the stop planner choose sessions to fit the most into one day?","o":["Sort by end time, and take each session that starts at or after the last chosen one ends","Sort by start time, and take each session that fits","Take the shortest sessions first","Take the sessions with the most fun points first"],"a":0,"e":"Earliest end first is the provably safe greedy choice for the most non-overlapping intervals."},{"d":"d3","t":"ms","q":"Which TWO statements about the $200 budget feature are true?","o":["It's a 0/1 knapsack: DP over (activities considered, budget left)","With 40 activities and whole-dollar prices, the table has about 40 × 200 cells","Choosing by fun points per dollar always gives the best plan","It needs a topological sort first","Union-find can choose the activities"],"a":[0,1],"e":"Each activity is taken at most once, so it's a 0/1 knapsack in O(n × budget). Choosing by ratio can miss the best combination."}]},{"id":"cs2","title":"Tara's spelling app","org":"A spelling game for Tara's class","min":25,"blurb":"Tries, edit distance, heaps and backtracking inside one word game.","sections":[["Overview","Tara is making a spelling game for her class with a 50,000-word dictionary. Kids type words, the app suggests completions and corrections, and a leaderboard shows the best scores."],["Features",["Autocomplete: as a kid types, show up to 5 dictionary words that start with the letters so far.","Did you mean? For a misspelled word, suggest dictionary words one or two edits away (insert, delete or replace a letter).","Leaderboard: show the top 10 scores out of thousands, updated after every game.","Word builder: from 7 letter tiles, list every dictionary word you can make."]],["Constraints",["The app must feel instant on a school laptop.","Tara's teacher wants a one-line explanation of each feature's cost."]]],"items":[{"d":"d1","q":"Which structure makes autocomplete fast?","o":["A trie: walk the typed prefix, then list the words below that node","Scanning the whole word list on every keystroke","A hash set of all the words","A min-heap of words"],"a":0,"e":"Walking the prefix costs O(prefix length), and then only matching words are visited. (A sorted list with binary search also works.)"},{"d":"d3","q":"What's the edit distance from “kitten” to “sitting”?","o":["3","2","4","6"],"a":0,"e":"Replace k with s, replace e with i, and insert g: 3 edits. The DP table has (6 + 1) × (7 + 1) cells."},{"d":"d3","q":"What does the edit-distance table cost for two words of lengths m and n?","o":["O(m × n) time, and O(min(m, n)) memory if you keep only two rows","O(m + n) time and memory","O(2^(m + n)) time","O(log(m × n)) time"],"a":0,"e":"Each of the (m + 1) × (n + 1) cells takes O(1), and each cell reads only the row above and the cell to its left, so two rows are enough."},{"d":"d1","q":"The leaderboard keeps the top 10 of thousands of scores and updates after every game. What fits best?","o":["A min-heap of size 10: push the new score, then pop the smallest if there are 11","Sort every score after every game","A trie of scores","A queue of the last 10 games"],"a":0,"e":"Each update costs O(log 10), effectively constant. Re-sorting everything costs O(n log n) per game."},{"d":"d3","t":"yn","q":"Judge each statement about the word builder.","s":[["All the arrangements of 1 to 7 tiles add up to fewer than 14,000 strings, so trying them all is fine.",true],["Stopping as soon as the letters so far aren't the prefix of any word can miss valid words.",false],["With two E tiles, the same word can be found twice unless you skip a repeated letter at the same depth.",true],["The word builder needs a topological sort before it starts.",false]],"e":"7 + 42 + 210 + 840 + 2,520 + 5,040 + 5,040 = 13,699 arrangements. Trie pruning only cuts branches that can't lead to a word. Skipping a repeated letter at the same depth, as in Permutations II, removes duplicates. Nothing here has an ordering rule."}]}],"diag":[{"d":"d1","q":"A recursive function visits every node of a binary tree with n nodes and height h. What are its time and extra space?","o":["O(n) time and O(h) space for the call stack","O(log n) time and O(1) space","O(n log n) time and O(n) space","O(n²) time and O(h) space"],"a":0,"e":"Each node is visited once. The call stack holds one frame per level of the current path: O(h), which is O(log n) when balanced and O(n) for a chain."},{"d":"d1","q":"An inorder traversal of a binary search tree visits its values in…","o":["Ascending (sorted) order","Level order","The order they were inserted","Descending order"],"a":0,"e":"Left subtree, node, right subtree: every smaller value comes before the node and every bigger one after it."},{"d":"d1","q":"You need the 10 largest values from a stream of a million numbers, using little memory. What do you keep?","o":["A min-heap of size 10","A max-heap of every number","A sorted array of every number","A hash set of size 10"],"a":0,"e":"Push each number and pop the smallest whenever the heap passes 10 items: O(n log k) time and O(k) memory, with k = 10."},{"d":"d1","q":"What do Python and JavaScript give you for heaps?","o":["Python's `heapq` works on a list as a min-heap; JavaScript has no built-in heap","Both have a built-in PriorityQueue class","Python's `heapq` is a max-heap; JavaScript's is a min-heap","Neither language's standard library has one, so you must use sorting"],"a":0,"e":"heapq keeps a plain list in min-heap order. In JavaScript you write a small heap yourself (module 03 gives you one)."},{"d":"d1","q":"Autocomplete over 100,000 words must list the words that start with what the user typed. Which structure finds them without scanning every word?","o":["A trie","A hash set of words","A min-heap of words","A queue of words"],"a":0,"e":"Walk the typed prefix (O(prefix length)), then visit only the words below that node."},{"d":"d2","q":"Which algorithm finds the fewest-edges path in an unweighted graph?","o":["Breadth-first search","Depth-first search","Sorting the edges","Binary search"],"a":0,"e":"BFS visits nodes in order of distance, so the first time it reaches the goal is along a shortest path."},{"d":"d2","q":"Courses have prerequisites. How do you find a valid order, or show that none exists?","o":["Topological sort (for example Kahn's algorithm); a cycle means there's no valid order","BFS from every course, keeping the longest path","Sort the courses alphabetically","A min-heap of course names"],"a":0,"e":"Kahn's algorithm repeatedly takes courses with no remaining prerequisites. If some courses never become free, they're on a cycle or depend on one."},{"d":"d2","q":"Network links are added one at a time, and after each one you're asked whether two computers are connected. What fits best?","o":["Union-find (disjoint-set union) with path compression and union by size","A fresh BFS after every link","A trie of computer names","A sorted list of links"],"a":0,"e":"Each union and find is nearly O(1) amortised; a fresh BFS each time costs O(V + E)."},{"d":"d2","q":"To count the islands in a grid of land and water cells, what's the usual approach and its time?","o":["Flood-fill each unvisited land cell with DFS or BFS: O(rows × cols)","Sort the cells: O(n log n)","Binary search each row: O(rows × log cols)","Try every subset of cells"],"a":0,"e":"Every cell is visited a constant number of times; each flood fill marks one whole island."},{"d":"d3","q":"How many subsets do n distinct items have, and which technique lists them?","o":["2ⁿ, using backtracking (include or skip each item)","n², using two nested loops","n!, using sorting","n log n, using binary search"],"a":0,"e":"Each item is in or out: 2 × 2 × … × 2 = 2ⁿ. Backtracking (or bitmasks) generates them."},{"d":"d3","q":"Which two properties make a problem a good fit for dynamic programming?","o":["Overlapping subproblems and optimal substructure","Sorted input and unique values","No cycles and positive weights","A small input and a greedy choice"],"a":0,"e":"The same subproblems repeat (so caching pays off), and the best answer is built from the best answers to subproblems."},{"d":"d3","q":"Plain recursion for climbing stairs (1 or 2 steps at a time) repeats work. What does memoisation change?","o":["Exponential time becomes O(n), because each step count is solved once","O(n) time becomes O(1)","Nothing except memory use","O(n²) time becomes O(n log n)"],"a":0,"e":"Without a cache the calls form a tree of exponential size; with one there are only n + 1 distinct calls."},{"d":"d3","q":"What's the time cost of the longest-common-subsequence table for strings of lengths m and n?","o":["O(m × n)","O(m + n)","O(2^(m + n))","O(log(m × n))"],"a":0,"e":"There are (m + 1) × (n + 1) cells, each filled in O(1)."},{"d":"d4","q":"To fit as many non-overlapping meetings as possible into one room, which meeting should you choose first?","o":["The one that ends earliest","The one that starts earliest","The shortest one","The longest one"],"a":0,"e":"Ending earliest leaves the most room for the rest; an exchange argument proves it's always safe."},{"d":"d4","q":"What does `x & (x - 1)` do?","o":["Clears the lowest set bit of x","Doubles x","Sets every bit of x","Keeps only the highest set bit of x"],"a":0,"e":"x − 1 flips the lowest 1 and the 0s below it, and the AND removes that 1."},{"d":"d4","q":"In JavaScript, what is `1 << 31`?","o":["−2147483648","2147483648","0","Infinity"],"a":0,"e":"JavaScript's bitwise operators work on 32-bit signed integers, and bit 31 is the sign bit. Python would give 2147483648."}],"labs":[{"id":"lab-traversals","t":"Tree toolkit: every traversal and a BST check","min":75,"mods":["m01","m02"],"goal":"Build trees from LeetCode-style lists and write every traversal in both languages: pre-, in- and post-order from one recursive walk, an iterative inorder, level order, height and a BST check. Then find out how deep a recursive walk can go in Python and in Node.js.","pre":["Python 3.12+ and Node.js 22+","Modules 01 and 02"],"steps":["Write `TreeNode` and `build(values)`, which turns a level-order list with None / null gaps into a tree.","Write one recursive walk that fills the pre-, in- and post-order lists at once. Where each `append` sits decides the order.","Write an iterative inorder with an explicit stack, and a level order that returns one list per level.","Write `height(root)` (an empty tree has height 0) and `is_bst(root)` that passes a (low, high) range down the tree.","Test the empty tree, the sample tree, a tree that only *looks* like a BST locally, and a 2,000-node left-only chain."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"from collections import deque\n\nclass TreeNode:\n    def __init__(self, val, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(values):                        # level order, None for a missing child\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    queue, i = deque([root]), 1\n    while queue and i < len(values):\n        node = queue.popleft()\n        for side in (\"left\", \"right\"):\n            if i < len(values) and values[i] is not None:\n                child = TreeNode(values[i])\n                setattr(node, side, child)\n                queue.append(child)\n            i += 1\n    return root\n\ndef dfs_orders(root):                     # one recursive walk, three orders: O(n)\n    pre, ino, post = [], [], []\n    def go(node):\n        if node is None:\n            return\n        pre.append(node.val)              # before the children\n        go(node.left)\n        ino.append(node.val)              # between them\n        go(node.right)\n        post.append(node.val)             # after them\n    go(root)\n    return pre, ino, post\n\ndef inorder_iterative(root):              # an explicit stack instead of recursion\n    out, stack, node = [], [], root\n    while stack or node:\n        while node:                       # go as far left as possible\n            stack.append(node)\n            node = node.left\n        node = stack.pop()\n        out.append(node.val)\n        node = node.right\n    return out\n\ndef level_order(root):\n    levels, queue = [], deque([root] if root else [])\n    while queue:\n        level = []\n        for _ in range(len(queue)):       # exactly the nodes of this level\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left:\n                queue.append(node.left)\n            if node.right:\n                queue.append(node.right)\n        levels.append(level)\n    return levels\n\ndef height(root):                         # the number of levels; no recursion\n    return len(level_order(root))\n\ndef is_bst(root):                         # every node must sit inside (low, high)\n    stack = [(root, float(\"-inf\"), float(\"inf\"))]\n    while stack:\n        node, low, high = stack.pop()\n        if node is None:\n            continue\n        if not low < node.val < high:\n            return False\n        stack.append((node.left, low, node.val))\n        stack.append((node.right, node.val, high))\n    return True\n\nt = build([5, 3, 8, 1, 4, None, 9])\npre, ino, post = dfs_orders(t)\nassert pre == [5, 3, 1, 4, 8, 9] and ino == [1, 3, 4, 5, 8, 9] and post == [1, 4, 3, 9, 8, 5]\nassert inorder_iterative(t) == ino and level_order(t) == [[5], [3, 8], [1, 4, 9]]\nassert height(t) == 3 and height(None) == 0 and is_bst(t)\nassert not is_bst(build([5, 3, 8, 1, 6]))     # 6 is in 5's left subtree\nassert dfs_orders(None) == ([], [], []) and level_order(None) == []\n\nchain = None\nfor v in range(2000, 0, -1):                  # a left-only chain, 2,000 nodes deep\n    chain = TreeNode(v, left=chain)\nassert height(chain) == 2000 and inorder_iterative(chain)[0] == 2000\ntry:\n    dfs_orders(chain)\n    print(\"recursion at depth 2000: fine\")\nexcept RecursionError:\n    print(\"recursion at depth 2000: too deep (RecursionError)\")\nprint(\"all traversal tests passed\")\n","out":"recursion at depth 2000: too deep (RecursionError)\nall traversal tests passed\n"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass TreeNode {\n  constructor(val, left = null, right = null) {\n    this.val = val;\n    this.left = left;\n    this.right = right;\n  }\n}\n\nfunction build(values) {                  // level order, null for a missing child\n  if (!values.length || values[0] === null) return null;\n  const root = new TreeNode(values[0]);\n  const queue = [root];\n  let head = 0, i = 1;\n  while (head < queue.length && i < values.length) {\n    const node = queue[head++];\n    for (const side of [\"left\", \"right\"]) {\n      if (i < values.length && values[i] !== null) {\n        node[side] = new TreeNode(values[i]);\n        queue.push(node[side]);\n      }\n      i++;\n    }\n  }\n  return root;\n}\n\nfunction dfsOrders(root) {                // one recursive walk, three orders: O(n)\n  const pre = [], ino = [], post = [];\n  const go = node => {\n    if (node === null) return;\n    pre.push(node.val);                   // before the children\n    go(node.left);\n    ino.push(node.val);                   // between them\n    go(node.right);\n    post.push(node.val);                  // after them\n  };\n  go(root);\n  return [pre, ino, post];\n}\n\nfunction inorderIterative(root) {         // an explicit stack instead of recursion\n  const out = [], stack = [];\n  let node = root;\n  while (stack.length || node) {\n    while (node) {                        // go as far left as possible\n      stack.push(node);\n      node = node.left;\n    }\n    node = stack.pop();\n    out.push(node.val);\n    node = node.right;\n  }\n  return out;\n}\n\nfunction levelOrder(root) {\n  const levels = [];\n  let level = root ? [root] : [];\n  while (level.length) {\n    levels.push(level.map(n => n.val));\n    level = level.flatMap(n => [n.left, n.right].filter(c => c !== null));   // the next level\n  }\n  return levels;\n}\n\nconst height = root => levelOrder(root).length;   // the number of levels; no recursion\n\nfunction isBST(root) {                    // every node must sit inside (low, high)\n  const stack = [[root, -Infinity, Infinity]];\n  while (stack.length) {\n    const [node, low, high] = stack.pop();\n    if (node === null) continue;\n    if (!(low < node.val && node.val < high)) return false;\n    stack.push([node.left, low, node.val], [node.right, node.val, high]);\n  }\n  return true;\n}\n\nconst t = build([5, 3, 8, 1, 4, null, 9]);\nconst [pre, ino, post] = dfsOrders(t);\nassert.deepStrictEqual([pre, ino, post], [[5, 3, 1, 4, 8, 9], [1, 3, 4, 5, 8, 9], [1, 4, 3, 9, 8, 5]]);\nassert.deepStrictEqual(inorderIterative(t), ino);\nassert.deepStrictEqual(levelOrder(t), [[5], [3, 8], [1, 4, 9]]);\nassert.ok(height(t) === 3 && height(null) === 0 && isBST(t));\nassert.ok(!isBST(build([5, 3, 8, 1, 6])));    // 6 is in 5's left subtree\nassert.deepStrictEqual(dfsOrders(null), [[], [], []]);\n\nlet chain = null;\nfor (let v = 2000; v >= 1; v--) chain = new TreeNode(v, chain);   // a left-only chain\nassert.ok(height(chain) === 2000 && inorderIterative(chain)[0] === 2000);\ntry {\n  dfsOrders(chain);\n  console.log(\"recursion at depth 2000: fine\");\n} catch (e) {\n  console.log(\"recursion at depth 2000: too deep (\" + e.name + \")\");\n}\nconsole.log(\"all traversal tests passed\");\n","out":"recursion at depth 2000: fine\nall traversal tests passed\n"}]},"breakit":["Make `is_bst` compare each node only with its two children, and show that it wrongly accepts [5, 3, 8, 1, 6].","Raise Python's limit with `sys.setrecursionlimit(200_000)` and run `dfs_orders` on a 100,000-node chain: on Python 3.11+ it works (older versions can crash). Then run the JavaScript version on the same chain, and explain why iterative code is still the real fix (Node.js has a fixed stack of roughly 10,000 simple frames, recursion through C code such as `functools.cache` still hits a lower limit, and every frame costs memory)."]},{"id":"lab-heap","t":"A binary heap from scratch, heap sort and top-k","min":75,"mods":["m03"],"goal":"Write the array-based min-heap behind Python's `heapq`, and the one JavaScript doesn't have: push, pop, peek and an O(n) heapify. Use it for heap sort and for the k largest values, and test both against the built-in sort.","pre":["Module 03"],"steps":["Store the heap in an array: the children of index i are 2i + 1 and 2i + 2, and its parent is (i − 1) // 2.","`push`: append, then sift up while the item is smaller than its parent. `pop`: swap the root with the last item, remove it, then sift down.","Heapify in the constructor: sift down every non-leaf, from the last one back to index 0. That's O(n), not O(n log n).","Heap sort: heapify, then pop n times. Compare with the built-in sort on 1,000 random arrays, including empty ones and duplicates.","Top-k: keep a min-heap of size k, pushing each value and popping whenever the size passes k."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\n\nclass MinHeap:\n    def __init__(self, items=()):\n        self.a = list(items)\n        for i in range(len(self.a) // 2 - 1, -1, -1):   # heapify: O(n)\n            self._down(i)\n\n    def __len__(self):\n        return len(self.a)\n\n    def peek(self):\n        if not self.a:\n            raise IndexError(\"peek from an empty heap\")\n        return self.a[0]\n\n    def push(self, x):                    # O(log n)\n        self.a.append(x)\n        self._up(len(self.a) - 1)\n\n    def pop(self):                        # O(log n)\n        a = self.a\n        if not a:\n            raise IndexError(\"pop from an empty heap\")\n        a[0], a[-1] = a[-1], a[0]\n        smallest = a.pop()\n        if a:\n            self._down(0)\n        return smallest\n\n    def _up(self, i):\n        a = self.a\n        while i > 0 and a[i] < a[(i - 1) // 2]:\n            p = (i - 1) // 2\n            a[i], a[p] = a[p], a[i]\n            i = p\n\n    def _down(self, i):\n        a, n = self.a, len(self.a)\n        while True:\n            smallest = i\n            for c in (2 * i + 1, 2 * i + 2):\n                if c < n and a[c] < a[smallest]:\n                    smallest = c\n            if smallest == i:\n                return\n            a[i], a[smallest] = a[smallest], a[i]\n            i = smallest\n\ndef heap_sort(values):                    # O(n log n)\n    h = MinHeap(values)\n    return [h.pop() for _ in range(len(h))]\n\ndef k_largest(values, k):                 # O(n log k) time, O(k) space\n    h = MinHeap()\n    for v in values:\n        h.push(v)\n        if len(h) > k:\n            h.pop()                       # drop the smallest of the k + 1\n    return sorted(h.a, reverse=True)\n\nfor _ in range(1000):\n    data = [random.randint(-50, 50) for _ in range(random.randint(0, 40))]\n    assert heap_sort(data) == sorted(data)\n    k = random.randint(1, 5)\n    assert k_largest(data, k) == sorted(data, reverse=True)[:k]\nh = MinHeap([5, 3, 8])\nh.push(1)\nassert h.peek() == 1 and h.pop() == 1 and h.pop() == 3 and len(h) == 2\ntry:\n    MinHeap().pop()\n    raise AssertionError(\"pop on an empty heap should fail\")\nexcept IndexError:\n    pass\nprint(\" \".join(map(str, heap_sort([5, 2, 9, 1, 5, 6]))), \"|\", \" \".join(map(str, k_largest([3, 1, 4, 1, 5, 9, 2, 6], 3))))\n","out":"1 2 5 5 6 9 | 9 6 5"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass MinHeap {\n  constructor(items = []) {\n    this.a = [...items];\n    for (let i = Math.floor(this.a.length / 2) - 1; i >= 0; i--) this.down(i);   // heapify: O(n)\n  }\n  get size() { return this.a.length; }\n  peek() {\n    if (!this.a.length) throw new RangeError(\"peek from an empty heap\");\n    return this.a[0];\n  }\n  push(x) {                               // O(log n)\n    this.a.push(x);\n    this.up(this.a.length - 1);\n  }\n  pop() {                                 // O(log n)\n    const a = this.a;\n    if (!a.length) throw new RangeError(\"pop from an empty heap\");\n    [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];\n    const smallest = a.pop();\n    if (a.length) this.down(0);\n    return smallest;\n  }\n  up(i) {\n    const a = this.a;\n    while (i > 0 && a[i] < a[(i - 1) >> 1]) {\n      const p = (i - 1) >> 1;\n      [a[i], a[p]] = [a[p], a[i]];\n      i = p;\n    }\n  }\n  down(i) {\n    const a = this.a, n = a.length;\n    for (;;) {\n      let smallest = i;\n      for (const c of [2 * i + 1, 2 * i + 2]) if (c < n && a[c] < a[smallest]) smallest = c;\n      if (smallest === i) return;\n      [a[i], a[smallest]] = [a[smallest], a[i]];\n      i = smallest;\n    }\n  }\n}\n\nfunction heapSort(values) {               // O(n log n)\n  const h = new MinHeap(values);\n  return Array.from({ length: h.size }, () => h.pop());\n}\n\nfunction kLargest(values, k) {            // O(n log k) time, O(k) space\n  const h = new MinHeap();\n  for (const v of values) {\n    h.push(v);\n    if (h.size > k) h.pop();              // drop the smallest of the k + 1\n  }\n  return h.a.toSorted((x, y) => y - x);\n}\n\nfor (let t = 0; t < 1000; t++) {\n  const data = Array.from({ length: Math.floor(Math.random() * 41) }, () => Math.floor(Math.random() * 101) - 50);\n  const sorted = data.toSorted((x, y) => x - y);\n  assert.deepStrictEqual(heapSort(data), sorted);\n  const k = 1 + Math.floor(Math.random() * 5);\n  assert.deepStrictEqual(kLargest(data, k), sorted.toReversed().slice(0, k));\n}\nconst h = new MinHeap([5, 3, 8]);\nh.push(1);\nassert.ok(h.peek() === 1 && h.pop() === 1 && h.pop() === 3 && h.size === 2);\nassert.throws(() => new MinHeap().pop(), RangeError);\nconsole.log(heapSort([5, 2, 9, 1, 5, 6]).join(\" \"), \"|\", kLargest([3, 1, 4, 1, 5, 9, 2, 6], 3).join(\" \"));\n","out":"1 2 5 5 6 9 | 9 6 5"}]},"breakit":["Build a 100,000-item heap from values in descending order (the worst case for a min-heap), once by pushing them one at a time and once with heapify, and count the swaps each way. Then repeat with random values and explain why the gap shrinks.","In JavaScript, push [priority, task] pairs and notice `<` compares arrays as strings ([10, \"a\"] < [9, \"b\"] is true). Add a compare function to fix it."]},{"id":"lab-trie","t":"Autocomplete with a trie","min":60,"mods":["m04"],"goal":"Build the trie behind a search box: insert words with a popularity count, check whole words and prefixes, return the most popular completions of a prefix, and delete words without leaving dead branches behind.","pre":["Module 04"],"steps":["Each node holds a map from character to child and a `count` (0 means no word ends here).","`insert(word, count=1)` walks the word, creating nodes as needed, and adds to the last node's count. `contains` and `starts_with` walk without creating anything.","`suggest(prefix, k)`: walk to the prefix's node, collect every word below it with a DFS, and return the k most popular, ties in alphabetical order.","`delete(word)`: set the count to 0, then remove nodes from the bottom up while they have no children and no count.","Test an empty prefix, a missing prefix, a word that's a prefix of another (car and card), repeated inserts and deletes."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.count = 0                     # > 0 means a word ends here\n\nclass Trie:\n    def __init__(self):\n        self.root = TrieNode()\n\n    def insert(self, word, count=1):       # O(len(word))\n        node = self.root\n        for ch in word:\n            node = node.children.setdefault(ch, TrieNode())\n        node.count += count\n\n    def _find(self, prefix):\n        node = self.root\n        for ch in prefix:\n            node = node.children.get(ch)\n            if node is None:\n                return None\n        return node\n\n    def contains(self, word):\n        node = self._find(word)\n        return node is not None and node.count > 0\n\n    def starts_with(self, prefix):\n        return self._find(prefix) is not None\n\n    def suggest(self, prefix, k):          # O(size of the subtree + m log m) for m matches\n        start, found = self._find(prefix), []\n        def dfs(node, path):\n            if node.count:\n                found.append((-node.count, path))\n            for ch, child in node.children.items():\n                dfs(child, path + ch)\n        if start:\n            dfs(start, prefix)\n        return [word for _, word in sorted(found)[:k]]\n\n    def delete(self, word):                # True if the word was there\n        path, node = [], self.root\n        for ch in word:\n            path.append((node, ch))\n            node = node.children.get(ch)\n            if node is None:\n                return False\n        if node.count == 0:\n            return False\n        node.count = 0\n        for parent, ch in reversed(path):  # prune nodes that no longer lead to a word\n            child = parent.children[ch]\n            if child.count or child.children:\n                break\n            del parent.children[ch]\n        return True\n\nt = Trie()\nfor word, n in [(\"car\", 5), (\"card\", 2), (\"care\", 7), (\"cart\", 2), (\"cat\", 9), (\"dog\", 4)]:\n    t.insert(word, n)\nt.insert(\"car\")                            # a repeated insert adds to the count: car is now 6\nassert t.contains(\"car\") and not t.contains(\"ca\") and t.starts_with(\"ca\") and not t.starts_with(\"cow\")\nassert t.suggest(\"car\", 3) == [\"care\", \"car\", \"card\"]     # 7, 6, then a tie at 2: card before cart\nassert t.suggest(\"\", 2) == [\"cat\", \"care\"] and t.suggest(\"x\", 3) == []\nassert t.delete(\"car\") and not t.contains(\"car\") and t.contains(\"card\")   # card keeps the c-a-r nodes\nassert not t.delete(\"car\") and not t.delete(\"ca\")\nassert t.delete(\"dog\") and not t.starts_with(\"d\")         # the whole d-o-g branch is gone\nprint(*t.suggest(\"ca\", 5))\n","out":"cat care card cart"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass TrieNode {\n  constructor() {\n    this.children = new Map();\n    this.count = 0;                        // > 0 means a word ends here\n  }\n}\n\nclass Trie {\n  constructor() { this.root = new TrieNode(); }\n\n  insert(word, count = 1) {                // O(word.length)\n    let node = this.root;\n    for (const ch of word) {\n      if (!node.children.has(ch)) node.children.set(ch, new TrieNode());\n      node = node.children.get(ch);\n    }\n    node.count += count;\n  }\n\n  find(prefix) {\n    let node = this.root;\n    for (const ch of prefix) {\n      node = node.children.get(ch);\n      if (node === undefined) return null;\n    }\n    return node;\n  }\n\n  contains(word) {\n    const node = this.find(word);\n    return node !== null && node.count > 0;\n  }\n\n  startsWith(prefix) { return this.find(prefix) !== null; }\n\n  suggest(prefix, k) {                     // O(size of the subtree + m log m) for m matches\n    const start = this.find(prefix), found = [];\n    const dfs = (node, path) => {\n      if (node.count) found.push([node.count, path]);\n      for (const [ch, child] of node.children) dfs(child, path + ch);\n    };\n    if (start) dfs(start, prefix);\n    found.sort((a, b) => b[0] - a[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0));\n    return found.slice(0, k).map(([, word]) => word);\n  }\n\n  delete(word) {                           // true if the word was there\n    const path = [];\n    let node = this.root;\n    for (const ch of word) {\n      path.push([node, ch]);\n      node = node.children.get(ch);\n      if (node === undefined) return false;\n    }\n    if (node.count === 0) return false;\n    node.count = 0;\n    for (const [parent, ch] of path.reverse()) {   // prune nodes that no longer lead to a word\n      const child = parent.children.get(ch);\n      if (child.count || child.children.size) break;\n      parent.children.delete(ch);\n    }\n    return true;\n  }\n}\n\nconst t = new Trie();\nfor (const [word, n] of [[\"car\", 5], [\"card\", 2], [\"care\", 7], [\"cart\", 2], [\"cat\", 9], [\"dog\", 4]]) t.insert(word, n);\nt.insert(\"car\");                           // a repeated insert adds to the count: car is now 6\nassert.ok(t.contains(\"car\") && !t.contains(\"ca\") && t.startsWith(\"ca\") && !t.startsWith(\"cow\"));\nassert.deepStrictEqual(t.suggest(\"car\", 3), [\"care\", \"car\", \"card\"]);\nassert.deepStrictEqual(t.suggest(\"\", 2), [\"cat\", \"care\"]);\nassert.deepStrictEqual(t.suggest(\"x\", 3), []);\nassert.ok(t.delete(\"car\") && !t.contains(\"car\") && t.contains(\"card\"));\nassert.ok(!t.delete(\"car\") && !t.delete(\"ca\"));\nassert.ok(t.delete(\"dog\") && !t.startsWith(\"d\"));\nconsole.log(...t.suggest(\"ca\", 5));\n","out":"cat care card cart"}]},"breakit":["Delete by only setting the count to 0 (no pruning). Insert and delete 100,000 random words and count the nodes left behind.","Store the top 3 suggestions at every node so `suggest` costs O(prefix length). What does that do to `insert`?"]},{"id":"lab-graph","t":"Graph toolkit: BFS paths, components and topological order","min":90,"mods":["m05","m06"],"goal":"Write the routines most medium graph problems are built on: an adjacency list from an edge list, the BFS shortest path (by number of edges) with the path itself, connected components with an iterative DFS, and a topological order that reports cycles (Kahn's algorithm).","pre":["Modules 05 and 06"],"steps":["Build an adjacency list from an edge list: a dict of lists in Python, a Map of arrays in JavaScript. Add both directions for an undirected graph.","`shortest_path(graph, start, goal)`: BFS that records each node's parent, then walks back from the goal to rebuild the path. Return an empty path if the goal can't be reached.","`components(n, edges)`: start an iterative DFS from every node not seen yet, and count the starts.","`topo_order(n, prereqs)`: Kahn's algorithm with in-degrees and a queue. If fewer than n nodes come out, there's a cycle, so return an empty list.","Test an unreachable node, start = goal, isolated nodes, a DAG with several valid orders (check the order is valid rather than equal to one answer) and a 3-node cycle."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"from collections import deque, defaultdict\n\ndef build_graph(edges, directed=False):\n    graph = defaultdict(list)\n    for u, v in edges:\n        graph[u].append(v)\n        if not directed:\n            graph[v].append(u)\n    return graph\n\ndef shortest_path(graph, start, goal):     # BFS: O(V + E)\n    parent = {start: None}\n    queue = deque([start])\n    while queue:\n        node = queue.popleft()\n        if node == goal:\n            path = []\n            while node is not None:\n                path.append(node)\n                node = parent[node]\n            return path[::-1]\n        for nxt in graph.get(node, ()):\n            if nxt not in parent:          # mark when queued, not when popped\n                parent[nxt] = node\n                queue.append(nxt)\n    return []\n\ndef components(n, edges):                  # iterative DFS: O(V + E)\n    graph = build_graph(edges)\n    seen, count = set(), 0\n    for s in range(n):\n        if s in seen:\n            continue\n        count += 1\n        seen.add(s)\n        stack = [s]\n        while stack:\n            node = stack.pop()\n            for nxt in graph.get(node, ()):\n                if nxt not in seen:\n                    seen.add(nxt)\n                    stack.append(nxt)\n    return count\n\ndef topo_order(n, prereqs):                # Kahn: O(V + E); prereqs are (before, after)\n    graph = build_graph(prereqs, directed=True)\n    indegree = [0] * n\n    for _, after in prereqs:\n        indegree[after] += 1\n    queue = deque(v for v in range(n) if indegree[v] == 0)\n    order = []\n    while queue:\n        node = queue.popleft()\n        order.append(node)\n        for nxt in graph.get(node, ()):\n            indegree[nxt] -= 1\n            if indegree[nxt] == 0:\n                queue.append(nxt)\n    return order if len(order) == n else []   # leftovers are on, or downstream of, a cycle\n\nroads = build_graph([(\"home\", \"park\"), (\"park\", \"zoo\"), (\"home\", \"shop\"),\n                     (\"shop\", \"museum\"), (\"museum\", \"zoo\"), (\"lake\", \"cabin\")])\nassert shortest_path(roads, \"home\", \"zoo\") == [\"home\", \"park\", \"zoo\"]\nassert shortest_path(roads, \"home\", \"cabin\") == [] and shortest_path(roads, \"zoo\", \"zoo\") == [\"zoo\"]\nassert components(6, [(0, 1), (1, 2), (3, 4)]) == 3 and components(3, []) == 3\ndag = [(0, 1), (0, 2), (1, 3), (2, 3)]\norder = topo_order(4, dag)\npos = {v: i for i, v in enumerate(order)}\nassert len(order) == 4 and all(pos[a] < pos[b] for a, b in dag)\nassert topo_order(3, [(0, 1), (1, 2), (2, 0)]) == []\nprint(*shortest_path(roads, \"home\", \"zoo\"), \"|\", components(6, [(0, 1), (1, 2), (3, 4)]), \"|\", *order)\n","out":"home park zoo | 3 | 0 1 2 3"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nfunction buildGraph(edges, directed = false) {\n  const graph = new Map();\n  const add = (u, v) => {\n    if (!graph.has(u)) graph.set(u, []);\n    graph.get(u).push(v);\n  };\n  for (const [u, v] of edges) {\n    add(u, v);\n    if (!directed) add(v, u);\n  }\n  return graph;\n}\n\nfunction shortestPath(graph, start, goal) {   // BFS: O(V + E)\n  const parent = new Map([[start, null]]);\n  const queue = [start];\n  for (let head = 0; head < queue.length; head++) {   // a head index instead of shift()\n    let node = queue[head];\n    if (node === goal) {\n      const path = [];\n      for (; node !== null; node = parent.get(node)) path.push(node);\n      return path.reverse();\n    }\n    for (const nxt of graph.get(node) ?? []) {\n      if (!parent.has(nxt)) {               // mark when queued, not when popped\n        parent.set(nxt, node);\n        queue.push(nxt);\n      }\n    }\n  }\n  return [];\n}\n\nfunction components(n, edges) {             // iterative DFS: O(V + E)\n  const graph = buildGraph(edges), seen = new Set();\n  let count = 0;\n  for (let s = 0; s < n; s++) {\n    if (seen.has(s)) continue;\n    count++;\n    seen.add(s);\n    const stack = [s];\n    while (stack.length) {\n      const node = stack.pop();\n      for (const nxt of graph.get(node) ?? []) {\n        if (!seen.has(nxt)) {\n          seen.add(nxt);\n          stack.push(nxt);\n        }\n      }\n    }\n  }\n  return count;\n}\n\nfunction topoOrder(n, prereqs) {            // Kahn: O(V + E); prereqs are [before, after]\n  const graph = buildGraph(prereqs, true);\n  const indegree = new Array(n).fill(0);\n  for (const [, after] of prereqs) indegree[after]++;\n  const queue = [];\n  for (let v = 0; v < n; v++) if (indegree[v] === 0) queue.push(v);\n  for (let head = 0; head < queue.length; head++) {\n    for (const nxt of graph.get(queue[head]) ?? []) {\n      if (--indegree[nxt] === 0) queue.push(nxt);\n    }\n  }\n  return queue.length === n ? queue : [];   // leftovers are on, or downstream of, a cycle\n}\n\nconst roads = buildGraph([[\"home\", \"park\"], [\"park\", \"zoo\"], [\"home\", \"shop\"],\n                          [\"shop\", \"museum\"], [\"museum\", \"zoo\"], [\"lake\", \"cabin\"]]);\nassert.deepStrictEqual(shortestPath(roads, \"home\", \"zoo\"), [\"home\", \"park\", \"zoo\"]);\nassert.deepStrictEqual(shortestPath(roads, \"home\", \"cabin\"), []);\nassert.deepStrictEqual(shortestPath(roads, \"zoo\", \"zoo\"), [\"zoo\"]);\nassert.ok(components(6, [[0, 1], [1, 2], [3, 4]]) === 3 && components(3, []) === 3);\nconst dag = [[0, 1], [0, 2], [1, 3], [2, 3]];\nconst order = topoOrder(4, dag);\nconst pos = new Map(order.map((v, i) => [v, i]));\nassert.ok(order.length === 4 && dag.every(([a, b]) => pos.get(a) < pos.get(b)));\nassert.deepStrictEqual(topoOrder(3, [[0, 1], [1, 2], [2, 0]]), []);\nconsole.log(...shortestPath(roads, \"home\", \"zoo\"), \"|\", components(6, [[0, 1], [1, 2], [3, 4]]), \"|\", ...order);\n","out":"home park zoo | 3 | 0 1 2 3"}]},"breakit":["Mark nodes as seen when you *pop* them instead of when you queue them, and count how often each node enters the queue on a dense graph.","Write a recursive DFS and run it on path graphs of 1,000, 10,000 and 100,000 nodes in Python and in Node.js. Find where each one breaks, and explain why the iterative version never does."]},{"id":"lab-dsu","t":"Union-find and Kruskal's minimum spanning tree","min":60,"mods":["m07"],"goal":"Write a disjoint-set union with path compression and union by size. Use it to count components as links arrive, to find the first redundant link, and to build Kruskal's minimum spanning tree. Check the component counts and the MST totals against brute force.","pre":["Module 07"],"steps":["`find(x)` with path compression, written as a loop so long chains can't overflow the stack; `union(a, b)` by size that returns False when a and b were already connected.","Keep a `count` of separate sets: it starts at n and drops by 1 on every successful union.","Redundant connection: the first edge whose union fails closes a cycle.","Kruskal: sort the edges by weight, keep each edge whose union succeeds, and stop at n − 1 edges. Return None / null if the graph is disconnected.","Compare against a brute-force DFS (components) and a brute-force search over edge subsets (MST) on 300 random small graphs."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom itertools import combinations\n\nclass DSU:\n    def __init__(self, n):\n        self.parent = list(range(n))\n        self.size = [1] * n\n        self.count = n                     # the number of separate sets\n\n    def find(self, x):                     # path compression, as a loop\n        root = x\n        while self.parent[root] != root:\n            root = self.parent[root]\n        while x != root:                   # point every node on the path at the root\n            nxt = self.parent[x]\n            self.parent[x] = root\n            x = nxt\n        return root\n\n    def union(self, a, b):                 # union by size; False if already joined\n        ra, rb = self.find(a), self.find(b)\n        if ra == rb:\n            return False\n        if self.size[ra] < self.size[rb]:\n            ra, rb = rb, ra\n        self.parent[rb] = ra\n        self.size[ra] += self.size[rb]\n        self.count -= 1\n        return True\n\ndef redundant_edge(n, edges):\n    dsu = DSU(n)\n    for u, v in edges:\n        if not dsu.union(u, v):\n            return u, v                    # u and v were already connected\n    return None\n\ndef kruskal(n, edges):                     # edges are (weight, u, v); O(E log E)\n    dsu, total, used = DSU(n), 0, 0\n    for w, u, v in sorted(edges):\n        if dsu.union(u, v):\n            total += w\n            used += 1\n            if used == n - 1:\n                break\n    return total if used == n - 1 else None   # None: the graph is disconnected\n\ndef brute_components(n, pairs):\n    adj = [[] for _ in range(n)]\n    for u, v in pairs:\n        adj[u].append(v)\n        adj[v].append(u)\n    seen, count = set(), 0\n    for s in range(n):\n        if s not in seen:\n            count += 1\n            seen.add(s)\n            stack = [s]\n            while stack:\n                for nxt in adj[stack.pop()]:\n                    if nxt not in seen:\n                        seen.add(nxt)\n                        stack.append(nxt)\n    return count\n\ndef brute_mst(n, edges):                   # try every set of n - 1 edges\n    best = None\n    for subset in combinations(edges, n - 1):\n        if brute_components(n, [(u, v) for _, u, v in subset]) == 1:\n            w = sum(e[0] for e in subset)\n            best = w if best is None else min(best, w)\n    return best\n\nfor _ in range(300):\n    n = random.randint(1, 6)\n    edges = [(random.randint(1, 9), random.randrange(n), random.randrange(n)) for _ in range(random.randint(0, 8))]\n    dsu = DSU(n)\n    for _, u, v in edges:\n        dsu.union(u, v)\n    assert dsu.count == brute_components(n, [(u, v) for _, u, v in edges])\n    assert kruskal(n, edges) == brute_mst(n, edges), (n, edges)\n\nu, v = redundant_edge(5, [(0, 1), (1, 2), (3, 4), (2, 0), (1, 3)])\nmst = kruskal(4, [(1, 0, 1), (4, 1, 2), (3, 0, 2), (2, 2, 3), (5, 1, 3)])\nprint(f\"redundant {u}-{v}, MST weight {mst}, disconnected: {'yes' if kruskal(3, [(1, 0, 1)]) is None else 'no'}\")\n","out":"redundant 2-0, MST weight 6, disconnected: yes"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass DSU {\n  constructor(n) {\n    this.parent = Array.from({ length: n }, (_, i) => i);\n    this.size = new Array(n).fill(1);\n    this.count = n;                        // the number of separate sets\n  }\n  find(x) {                                // path compression, as a loop\n    let root = x;\n    while (this.parent[root] !== root) root = this.parent[root];\n    while (x !== root) {                   // point every node on the path at the root\n      const next = this.parent[x];\n      this.parent[x] = root;\n      x = next;\n    }\n    return root;\n  }\n  union(a, b) {                            // union by size; false if already joined\n    let ra = this.find(a), rb = this.find(b);\n    if (ra === rb) return false;\n    if (this.size[ra] < this.size[rb]) [ra, rb] = [rb, ra];\n    this.parent[rb] = ra;\n    this.size[ra] += this.size[rb];\n    this.count--;\n    return true;\n  }\n}\n\nfunction redundantEdge(n, edges) {\n  const dsu = new DSU(n);\n  for (const [u, v] of edges) if (!dsu.union(u, v)) return [u, v];   // already connected\n  return null;\n}\n\nfunction kruskal(n, edges) {               // edges are [weight, u, v]; O(E log E)\n  const dsu = new DSU(n);\n  let total = 0, used = 0;\n  for (const [w, u, v] of edges.toSorted((a, b) => a[0] - b[0])) {\n    if (dsu.union(u, v)) {\n      total += w;\n      if (++used === n - 1) break;\n    }\n  }\n  return used === n - 1 ? total : null;   // null: the graph is disconnected\n}\n\nfunction bruteComponents(n, pairs) {\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v] of pairs) { adj[u].push(v); adj[v].push(u); }\n  const seen = new Set();\n  let count = 0;\n  for (let s = 0; s < n; s++) {\n    if (seen.has(s)) continue;\n    count++;\n    seen.add(s);\n    const stack = [s];\n    while (stack.length) {\n      for (const nxt of adj[stack.pop()]) {\n        if (!seen.has(nxt)) { seen.add(nxt); stack.push(nxt); }\n      }\n    }\n  }\n  return count;\n}\n\nfunction bruteMst(n, edges) {               // try every set of n - 1 edges\n  let best = null;\n  const pick = (start, chosen) => {\n    if (chosen.length === n - 1) {\n      if (bruteComponents(n, chosen.map(([, u, v]) => [u, v])) === 1) {\n        const w = chosen.reduce((s, e) => s + e[0], 0);\n        best = best === null ? w : Math.min(best, w);\n      }\n      return;\n    }\n    for (let i = start; i < edges.length; i++) pick(i + 1, [...chosen, edges[i]]);\n  };\n  pick(0, []);\n  return best;\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nfor (let t = 0; t < 300; t++) {\n  const n = 1 + rnd(6);\n  const edges = Array.from({ length: rnd(9) }, () => [1 + rnd(9), rnd(n), rnd(n)]);\n  const dsu = new DSU(n);\n  for (const [, u, v] of edges) dsu.union(u, v);\n  assert.strictEqual(dsu.count, bruteComponents(n, edges.map(([, u, v]) => [u, v])));\n  assert.strictEqual(kruskal(n, edges), bruteMst(n, edges));\n}\n\nconst [u, v] = redundantEdge(5, [[0, 1], [1, 2], [3, 4], [2, 0], [1, 3]]);\nconst mst = kruskal(4, [[1, 0, 1], [4, 1, 2], [3, 0, 2], [2, 2, 3], [5, 1, 3]]);\nconsole.log(`redundant ${u}-${v}, MST weight ${mst}, disconnected: ${kruskal(3, [[1, 0, 1]]) === null ? \"yes\" : \"no\"}`);\n","out":"redundant 2-0, MST weight 6, disconnected: yes"}]},"breakit":["Remove union by size and path compression, call `union(i, i - 1)` for i from 1 to 100,000 so each new node becomes the root, and time `find(0)`. Then put the two optimisations back.","Return Kruskal's total without checking `used == n - 1`, and find a disconnected graph where the wrong answer looks plausible."]},{"id":"lab-dp","t":"Dynamic programming three ways","min":90,"mods":["m09","m10"],"goal":"Solve coin change (fewest coins) top-down with memoisation and bottom-up with a table, then rebuild the coins actually used. Compute the longest common subsequence and rebuild one LCS string. Check everything against brute force.","pre":["Modules 09 and 10"],"steps":["Top-down: `best(a)` = the fewest coins that make amount a, cached with `functools.cache` / a Map. Return −1 when no combination works.","Bottom-up: fill `dp[a] = min(dp[a − c] + 1)` from 0 up to the amount, and record in `choice[a]` the coin that achieved it.","Rebuild the coins by following `choice` back from the amount to 0.","LCS: fill `dp[i][j]` for the first i characters of s and the first j of t, then walk back from the bottom-right corner to rebuild one LCS.","Compare every function with brute force on 300 small random inputs."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom functools import cache\nfrom itertools import combinations\n\ndef coin_change_memo(coins, amount):       # top-down; recursion depth up to `amount`\n    @cache\n    def best(a):\n        if a == 0:\n            return 0\n        return min((best(a - c) + 1 for c in coins if c <= a), default=float(\"inf\"))\n    result = best(amount)\n    return -1 if result == float(\"inf\") else result\n\ndef coin_change_table(coins, amount):      # bottom-up, plus the coins themselves\n    INF = float(\"inf\")\n    dp = [0] + [INF] * amount\n    choice = [0] * (amount + 1)             # the last coin used for each amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n                dp[a], choice[a] = dp[a - c] + 1, c\n    if dp[amount] == INF:\n        return -1, []\n    picked, a = [], amount\n    while a:\n        picked.append(choice[a])\n        a -= choice[a]\n    return dp[amount], sorted(picked)\n\ndef lcs(s, t):                              # O(m·n) time and space\n    m, n = len(s), len(t)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if s[i - 1] == t[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    out, i, j = [], m, n                    # walk back to rebuild one LCS\n    while i and j:\n        if s[i - 1] == t[j - 1]:\n            out.append(s[i - 1])\n            i, j = i - 1, j - 1\n        elif dp[i - 1][j] >= dp[i][j - 1]:\n            i -= 1\n        else:\n            j -= 1\n    return dp[m][n], \"\".join(reversed(out))\n\ndef brute_coins(coins, amount, start=0):   # every multiset of coins: small inputs only\n    if amount == 0:\n        return 0\n    best = float(\"inf\")\n    for i in range(start, len(coins)):\n        if coins[i] <= amount:\n            best = min(best, 1 + brute_coins(coins, amount - coins[i], i))\n    return best\n\ndef is_subseq(a, b):\n    it = iter(b)\n    return all(ch in it for ch in a)\n\ndef brute_lcs_len(s, t):\n    for r in range(len(s), -1, -1):\n        if any(is_subseq(\"\".join(c), t) for c in combinations(s, r)):\n            return r\n\nfor _ in range(300):\n    coins = random.sample(range(1, 9), random.randint(1, 3))\n    amount = random.randint(0, 25)\n    want = brute_coins(coins, amount)\n    want = -1 if want == float(\"inf\") else want\n    count, picked = coin_change_table(coins, amount)\n    assert coin_change_memo(coins, amount) == want == count, (coins, amount)\n    if count == -1:\n        assert picked == []\n    else:\n        assert sum(picked) == amount and len(picked) == count and set(picked) <= set(coins)\n    s = \"\".join(random.choice(\"abc\") for _ in range(random.randint(0, 7)))\n    t = \"\".join(random.choice(\"abc\") for _ in range(random.randint(0, 7)))\n    length, seq = lcs(s, t)\n    assert length == brute_lcs_len(s, t) == len(seq) and is_subseq(seq, s) and is_subseq(seq, t)\n\ncount, picked = coin_change_table([1, 3, 4], 6)\nlength, seq = lcs(\"abcbdab\", \"bdcaba\")\nprint(coin_change_memo([1, 3, 4], 6), count, \"+\".join(map(str, picked)), coin_change_table([2], 3)[0], length, seq)\n","out":"2 2 3+3 -1 4 bcba"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nfunction coinChangeMemo(coins, amount) {    // top-down; recursion depth up to `amount`\n  const memo = new Map();\n  const best = a => {\n    if (a === 0) return 0;\n    if (memo.has(a)) return memo.get(a);\n    let result = Infinity;\n    for (const c of coins) if (c <= a) result = Math.min(result, best(a - c) + 1);\n    memo.set(a, result);\n    return result;\n  };\n  const result = best(amount);\n  return result === Infinity ? -1 : result;\n}\n\nfunction coinChangeTable(coins, amount) {   // bottom-up, plus the coins themselves\n  const dp = [0, ...new Array(amount).fill(Infinity)];\n  const choice = new Array(amount + 1).fill(0);   // the last coin used for each amount\n  for (let a = 1; a <= amount; a++) {\n    for (const c of coins) {\n      if (c <= a && dp[a - c] + 1 < dp[a]) {\n        dp[a] = dp[a - c] + 1;\n        choice[a] = c;\n      }\n    }\n  }\n  if (dp[amount] === Infinity) return [-1, []];\n  const picked = [];\n  for (let a = amount; a > 0; a -= choice[a]) picked.push(choice[a]);\n  return [dp[amount], picked.sort((x, y) => x - y)];\n}\n\nfunction lcs(s, t) {                        // O(m·n) time and space\n  const m = s.length, n = t.length;\n  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));\n  for (let i = 1; i <= m; i++) {\n    for (let j = 1; j <= n; j++) {\n      dp[i][j] = s[i - 1] === t[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);\n    }\n  }\n  const out = [];                           // walk back to rebuild one LCS\n  let i = m, j = n;\n  while (i && j) {\n    if (s[i - 1] === t[j - 1]) {\n      out.push(s[i - 1]);\n      i--;\n      j--;\n    } else if (dp[i - 1][j] >= dp[i][j - 1]) i--;\n    else j--;\n  }\n  return [dp[m][n], out.reverse().join(\"\")];\n}\n\nfunction bruteCoins(coins, amount, start = 0) {   // every multiset of coins: small inputs only\n  if (amount === 0) return 0;\n  let best = Infinity;\n  for (let i = start; i < coins.length; i++) {\n    if (coins[i] <= amount) best = Math.min(best, 1 + bruteCoins(coins, amount - coins[i], i));\n  }\n  return best;\n}\n\nfunction isSubseq(a, b) {\n  let k = 0;\n  for (const ch of b) if (k < a.length && ch === a[k]) k++;\n  return k === a.length;\n}\n\nfunction bruteLcsLen(s, t) {\n  let best = 0;\n  for (let mask = 0; mask < 1 << s.length; mask++) {\n    let sub = \"\";\n    for (let i = 0; i < s.length; i++) if ((mask >> i) & 1) sub += s[i];\n    if (sub.length > best && isSubseq(sub, t)) best = sub.length;\n  }\n  return best;\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nconst randWord = () => Array.from({ length: rnd(8) }, () => \"abc\"[rnd(3)]).join(\"\");\nfor (let trial = 0; trial < 300; trial++) {\n  const coins = [1, 2, 3, 4, 5, 6, 7, 8].sort(() => Math.random() - 0.5).slice(0, 1 + rnd(3));\n  const amount = rnd(26);\n  let want = bruteCoins(coins, amount);\n  if (want === Infinity) want = -1;\n  const [count, picked] = coinChangeTable(coins, amount);\n  assert.ok(coinChangeMemo(coins, amount) === want && count === want, `${coins} ${amount}`);\n  if (count === -1) assert.deepStrictEqual(picked, []);\n  else assert.ok(picked.reduce((x, y) => x + y, 0) === amount && picked.length === count && picked.every(c => coins.includes(c)));\n  const s = randWord(), t = randWord();\n  const [length, seq] = lcs(s, t);\n  assert.ok(length === bruteLcsLen(s, t) && seq.length === length && isSubseq(seq, s) && isSubseq(seq, t));\n}\n\nconst [count, picked] = coinChangeTable([1, 3, 4], 6);\nconst [length, seq] = lcs(\"abcbdab\", \"bdcaba\");\nconsole.log(coinChangeMemo([1, 3, 4], 6), count, picked.join(\"+\"), coinChangeTable([2], 3)[0], length, seq);\n","out":"2 2 3+3 -1 4 bcba"}]},"breakit":["Call the memoised Python version with coins [1] and amount 5,000. Read the RecursionError, then explain why the table version is fine.","Change the table to count the *ways* to make each amount (LeetCode 518: add instead of taking the minimum). With amounts in the outer loop you count orderings (1 + 3 and 3 + 1 separately); swap the loops so you count combinations."]},{"id":"capstone","capstone":true,"t":"Pattern library + the 150-problem milestone","min":900,"mods":["m01","m02","m03","m04","m05","m06","m07","m08","m09","m10","m11","m12"],"goal":"Turn your six labs into one small pattern library in **both** Python and JavaScript, with tests, a Big-O table and a page of templates you can type from memory. Alongside it, finish the NeetCode 150 with a pattern logged for every problem, and do four timed mock interviews. This is your L2 evidence.","deliver":["A repo with `python/` and `js/` folders: tree helpers, MinHeap, Trie, graph routines (BFS path, components, topological order), DSU and the DP examples.","Tests (pytest and `node:test`) for empty inputs, one element, cycles, disconnected graphs and 10,000-deep chains.","A TEMPLATES.md page: tree recursion, BFS, iterative DFS, Kahn's algorithm, DSU, backtracking, a DP table, interval greedy and the bit recipes, each under 15 lines per language.","A problem log for the NeetCode 150 (problem, pattern, time, space, what tripped you up) and four short mock-interview reviews."],"rubric":["All tests pass in both languages, including the deep-input cases.","Every routine has its time and space complexity in the README.","You can type each template from a blank file in under 5 minutes.","The problem log names a pattern for every problem, and each mock review says what to fix next.","The code is readable: clear names, small functions, nothing copy-pasted."],"steps":["Create the repo and copy in your lab solutions, with the same API names in both languages.","Add the deep-input tests and remove any recursion that could reach 10,000 levels.","Write TEMPLATES.md, then retype each template from a blank file once a week until it's automatic.","Work through the NeetCode 150 by pattern and log each problem the same day.","Every two weeks, run a 45-minute mock interview (the Interview tab, or the tutor in Examiner mode) and write a five-line review."],"stretch":["Add Dijkstra's shortest paths using your MinHeap (a preview of L3).","Make the trie keep the top 3 suggestions at every node, and measure insert and suggest times.","Benchmark your MinHeap against Python's heapq and explain the gap."]}],"interview":[{"c":"Trees","q":"How do you approach a binary-tree problem?","a":"I decide what each recursive call should return for its subtree (a height, a sum, a pair of values) and what it needs from its children. The code is then: handle the empty tree, recurse left and right, combine. That's O(n) time and O(h) stack space, where h is the height: about log n if the tree is balanced and n if it's a chain. For very deep trees in Python I switch to an iterative version with an explicit stack.","f":["How would you find the diameter of a tree?","When does a helper need to return two values?"]},{"c":"Trees","q":"DFS or BFS on a tree: when do you use each?","a":"DFS goes
