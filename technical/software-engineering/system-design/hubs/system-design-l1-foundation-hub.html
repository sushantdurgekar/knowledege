\n  const rows = items.filter(it => after === null || isAfter(it, after)).slice(0, limit + 1);   // one extra says \"more\"\n  const page = rows.slice(0, limit);\n  return [page, rows.length > limit ? encodeCursor(page.at(-1)[0], page.at(-1)[1]) : null];\n}\n\nconst items = [[1700000300, 7, \"g\"], [1700000300, 6, \"f\"], [1700000200, 5, \"e\"],\n  [1700000100, 4, \"d\"], [1700000100, 3, \"c\"], [1700000000, 2, \"b\"]];\nlet cursor = null;\nconst pages = [];\ndo {\n  let page;\n  [page, cursor] = nextPage(items, cursor);\n  pages.push(page.map(([, , text]) => text).join(\"\"));\n} while (cursor !== null);\nconsole.log(...pages, \"| first cursor:\", encodeCursor(1700000300, 6));\n","out":"gf ed cb | first cursor: WzE3MDAwMDAzMDAsNl0"}]}},"traps":[["“Put verbs in the path, like /createOrder.”","Name resources with nouns and let the method be the verb: POST /orders creates an order, GET /orders/42 reads one. Clients, caches and tools understand that convention, and the API stays consistent as it grows."],["“Return 200 with the error message inside.”","Clients, retries, caches and monitoring all read the status code. A failed request that answers 200 looks like success to every one of them; send the right 4xx or 5xx code with a clear error body."],["“POST is safe to retry.”","POST isn't idempotent: retrying a create after a timeout can create two orders or charge twice. Use idempotency keys, or make the operation an idempotent PUT to an ID the client chooses."],["“Offset pagination works for any list.”","Deep pages make the database read and throw away every earlier row, and rows added between requests shift the pages so items repeat or vanish. For feeds and big lists, use cursors."],["“A base64 cursor hides what's inside.”","Base64 is an encoding, not encryption: anyone can decode it. Never put secrets in a cursor, validate it on the server like any other input, and sign it if clients mustn't tamper with it."],["“We can rename a field; clients will update.”","Old app versions stay in use for months. Only add to a published API, and for breaking changes publish a new version and retire the old one slowly, watching who still calls it."]],"disc":[["How would you design an endpoint for creating an order that clients may retry?","POST /orders with an Idempotency-Key header that the client generates for each checkout. The server stores the key, a hash of the request body and the response, ideally in the same transaction that creates the order. A repeat with the same key and body gets the stored response; the same key with a different body gets an error such as 422; and a repeat while the first is still running gets 409, so the client waits and tries again. Keys expire after a day or so, and clients retry only after timeouts and 5xx answers, with backoff."],["REST, gRPC or GraphQL for a mobile app's backend?","REST over JSON is the simple default: easy to cache, debug and document, and any client can call it. GraphQL helps when screens need data from many resources and fetching exactly the needed fields in one round trip matters on slow mobile networks, at the cost of harder caching and the risk of expensive queries. gRPC suits calls between your own services, where its binary format and generated clients make calls fast and typed; browsers need a proxy to use it. Many systems use REST or GraphQL at the edge and gRPC inside."]],"teach":{"prompt":"Explain to a junior colleague how you'd design a small orders API so that clients can page through orders and safely retry.","rubric":["Nouns for resources, HTTP methods as the verbs","Exact status codes: 201, 400, 404, 409, 429, 5xx","Idempotency keys for POST; GET, PUT and DELETE are idempotent already","Cursor pagination for big or changing lists","Add-only changes, and a new version for breaking ones"],"model":"I'd make orders a resource: POST /orders creates one, GET /orders/42 reads it, GET /orders lists them, and DELETE /orders/42 cancels it, with exact status codes: 201 with a Location header on create, 400 for a bad request, 404 for a missing order, 409 when the order's state forbids the change, and 429 when a client is rate limited. GET, PUT and DELETE are idempotent, so clients may retry them freely, but POST isn't, so creates take an Idempotency-Key header: the server stores each key with its first result and replays that result for a repeat. The list uses cursor pagination: each page returns an opaque cursor built from the last order's time and id, so deep pages stay fast and new orders don't cause repeats or gaps. And once clients depend on the API, I only add to it; anything breaking goes into a new version."},"qa":[["Which HTTP methods are idempotent?","GET, HEAD, OPTIONS, PUT and DELETE; POST and PATCH aren't guaranteed to be."],["201, 204, 404, 409, 429?","Created, No Content, Not Found, Conflict, Too Many Requests."],["What is an idempotency key?","A unique key per operation that the client sends with every retry, so the server replays the first result instead of acting again."],["Offset or cursor pagination for a feed?","Cursor: fast at any depth, and stable while new items arrive."],["What's usually inside a cursor?","The sort key of the last item returned (for example its time and id), encoded as an opaque token."],["How do you change a public API safely?","Only add (new optional fields, new endpoints); put breaking changes in a new version."]],"quiz":[{"q":"What does this print?","snip":{"t":"Choosing a status code","tabs":[{"lang":"python","src":"def status_for(method, exists, valid=True):\n    if not valid:\n        return 400\n    if method == \"POST\":\n        return 201\n    if not exists:\n        return 404\n    return 204 if method == \"DELETE\" else 200\n\nprint(status_for(\"POST\", False), status_for(\"GET\", False), status_for(\"DELETE\", True), status_for(\"PUT\", True, valid=False))\n"},{"lang":"javascript","src":"function statusFor(method, exists, valid = true) {\n  if (!valid) return 400;\n  if (method === \"POST\") return 201;\n  if (!exists) return 404;\n  return method === \"DELETE\" ? 204 : 200;\n}\n\nconsole.log(statusFor(\"POST\", false), statusFor(\"GET\", false), statusFor(\"DELETE\", true), statusFor(\"PUT\", true, false));\n"}]},"o":["201 404 204 400","200 404 200 400","201 200 204 400","201 404 204 200"],"a":0,"e":"A valid POST creates (201); reading something that doesn't exist is 404; a successful DELETE has nothing to return (204); and an invalid request is 400 whatever the method."},{"q":"What does this print?","snip":{"t":"Page 2 after a new post","tabs":[{"lang":"python","src":"feed = [9, 8, 7, 6, 5]                      # newest first\npage1 = feed[0:2]\nfeed.insert(0, 10)                          # a new post arrives\noffset_page2 = feed[2:4]\ncursor_page2 = [p for p in feed if p < page1[-1]][:2]\nprint(*offset_page2, \"|\", *cursor_page2)\n"},{"lang":"javascript","src":"const feed = [9, 8, 7, 6, 5];               // newest first\nconst page1 = feed.slice(0, 2);\nfeed.unshift(10);                           // a new post arrives\nconst offsetPage2 = feed.slice(2, 4);\nconst cursorPage2 = feed.filter(p => p < page1.at(-1)).slice(0, 2);\nconsole.log(...offsetPage2, \"|\", ...cursorPage2);\n"}]},"o":["8 7 | 7 6","7 6 | 7 6","8 7 | 8 7","7 6 | 6 5"],"a":0,"e":"Page 1 is 9 and 8. The new post shifts everything down a place, so offset 2 now starts at 8, a repeat. The cursor asks for posts older than 8: 7 and 6."},{"q":"A phone sends POST /payments, the connection drops before the reply arrives, and the app retries. What prevents a double charge?","o":["An idempotency key sent with both attempts, so the server returns the stored result for the repeat","Sending the retry as a GET instead","Answering 200 instead of 201","A shorter timeout in the app"],"a":0,"e":"Only the key lets the server recognise the retry. A GET must not change anything, the status code doesn't stop a second charge, and a shorter timeout just makes retries more likely."},{"q":"Which changes to a published JSON API are safe for old clients? (choose 2)","t":"ms","o":["Adding a new optional field to a response","Adding a new endpoint","Renaming the field total to amount","Changing a field from a number to a string","Making an optional request field required"],"a":[0,1],"e":"Old clients ignore fields and endpoints they don't know about. A renamed or retyped field breaks every client that reads it, and a newly required field rejects requests that old clients still send."},{"q":"Judge each statement.","t":"yn","s":[["PUT and DELETE are idempotent: repeating them leaves the same state as doing them once.",true],["A GET request may change data, as long as it's quick.",false],["Offset pagination can repeat or skip items when rows are added between requests.",true],["429 Too Many Requests tells a client it's being rate limited.",true]],"e":"Idempotency is about the server's final state. GET must be safe because caches, crawlers and retries call it freely. Added rows shift every later offset. And 429 is the rate-limit code, often with a Retry-After header."},{"q":"Put the steps of handling a POST with an idempotency key in order.","t":"ord","items":["Read the Idempotency-Key header from the request","Look the key up among the stored results","If it's new, process the request and store the key with its result","Return the stored result for a repeat, or the new one"],"e":"You need the key before you can look it up, the lookup decides whether to process the request, and the reply comes last, after the result is stored, so a lost reply can still be replayed."},{"q":"Complete the Python create function so that a repeated key returns the first result.","t":"drop","lang":"python","code":"def create_order(store, orders, key, body):\n    if key in store:\n        return {{0}}\n    orders.append(body)\n    order_id = len(orders)\n    store[key] = {{1}}\n    return store[key]\n","blanks":[{"o":["store[key]","(201, len(orders))","None","create_order(store, orders, key, body)"],"a":0},{"o":["(201, order_id)","(200, key)","key","None"],"a":0}],"e":"A repeat must get back exactly what was stored for its key, and what's stored is the first response: 201 with the new order's id."},{"q":"Match each status code to its meaning.","t":"match","pairs":[["201 Created","A POST made a new resource"],["404 Not Found","There's no resource at that path"],["409 Conflict","The request clashes with the resource's current state"],["503 Service Unavailable","The server is overloaded or down for now; try again later"]],"extra":["The client must sign in first"],"e":"Signing in is 401 Unauthorized, which isn't in the list."}],"probs":[["LC 535 · Encode and Decode TinyURL","https://leetcode.com/problems/encode-and-decode-tinyurl/","Medium","the worked example: a counter in base 62; the capstone turns it into a real service"],["Exercise · How a big public API pages its results","https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api","","find how GitHub's REST API points to the next page, and whether different endpoints use page numbers or cursors"],["Exercise · Idempotent requests in a payments API","https://docs.stripe.com/api/idempotent_requests","","find how keys are sent, how long they're kept and what happens when a retry's parameters differ; add those rules to this module's PaymentsAPI"],["Exercise · Opaque page tokens","https://google.aip.dev/158","","read why Google's API guidelines require opaque page tokens, and compare them with this module's cursors"],["Reference · HTTP status codes","https://developer.mozilla.org/en-US/docs/Web/HTTP/Status","","for each code in this module, write one sentence on when your API would send it"]],"src":[["RFC 9110: HTTP Semantics (methods and status codes)","https://www.rfc-editor.org/rfc/rfc9110"],["MDN: HTTP response status codes","https://developer.mozilla.org/en-US/docs/Web/HTTP/Status"],["Google AIP-158: Pagination","https://google.aip.dev/158"],["Stripe API: Idempotent requests","https://docs.stripe.com/api/idempotent_requests"],["IETF draft (expired): The Idempotency-Key HTTP header field","https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/"]]},{"id":"m09","d":"d4","t":"Back-of-the-envelope estimation","min":90,"hook":"Before drawing boxes, an interviewer wants to know how big the problem is. A few minutes of rounded arithmetic (requests per second, storage per year, bandwidth at the peak) tells you whether one server will do or you need a fleet, and which part of the design deserves the most attention. The skill is stating assumptions and rounding boldly, not precision.","pre":{"q":"A service gets 100 million requests a day. Roughly how many requests a second is that on average, and what might the peak be?","a":"A day has 86,400 seconds; call it 100,000. 100 million ÷ 100,000 ≈ 1,000 requests a second on average (1,157 more exactly). Peaks are often 2 to 5 times the average, so plan for a few thousand a second, and say which peak factor you assumed."},"kid":{"t":"Packing for the road trip","x":"Before the road trip, Dad works out what to pack without a calculator. Four people, three days, about two sandwiches each a day: 4 × 3 × 2 is 24 sandwiches. Grandma's is about 500 km away and the car uses about 6 litres every 100 km, so the trip there needs about 30 litres of petrol. “Round the numbers so you can do them in your head,” he says, “and write down what you guessed, in case we're wrong.” Tara says the drive home is when everyone is hungriest, so they pack extra for that day.","map":[["4 × 3 × 2 = 24 sandwiches","Multiplying rounded factors: users × actions per user × size"],["Writing down what you guessed","Stating assumptions, so they can be checked and changed"],["Rounding to do the sums in your head","Round numbers and powers of ten: a day ≈ 100,000 seconds"],["About 30 litres for 500 km","A rate times a quantity: requests per second × bytes, storage per day × days"],["Extra food for the hungriest day","Planning for the peak, not the average"]],"brk":"A wrong sandwich count costs a snack; a wrong estimate can cost a redesign. Real estimates are checked against measurements as soon as the system runs, and the assumptions are updated."},"keys":["**Why estimate**: a few minutes of arithmetic tells you whether the problem needs one server or a fleet, where the bottleneck will be (reads, writes, storage or bandwidth), and which parts of the design deserve attention. Interviewers grade the reasoning and the stated assumptions, not the exact numbers.","**Round boldly**: a day is 86,400 seconds, about 10⁵; a month about 2.6 million seconds; a year about 3.2 × 10⁷. So 1 million requests a day is about 12 a second, and 1 billion a day about 12,000 a second.","**Powers of two and ten**: 2¹⁰ ≈ 10³ (KB), 2²⁰ ≈ 10⁶ (MB), 2³⁰ ≈ 10⁹ (GB), 2⁴⁰ ≈ 10¹² (TB). An ASCII character is a byte, a number about 8 bytes, a short row of text and ids a few hundred bytes, a photo a few hundred KB to a few MB, a minute of HD video tens of MB.","**Traffic**: requests per second = daily active users × actions per user per day ÷ 86,400. The peak = the average × a peak factor (often 2 to 5 for consumer apps; say which you assume). Split reads from writes: many products read 10 to 100 times more often than they write.","**Storage**: new data per day = writes per day × bytes per item. Multiply by how long it's kept and by the number of copies (replicas, often 3), then add room for indexes and growth. 1 KB a write at 1 million writes a day is 1 GB a day, about 365 GB a year before copies.","**Bandwidth**: bytes per second = requests per second × response size, and networks are measured in bits: multiply by 8. 1,000 requests a second of 100 KB is 100 MB/s, which is 800 Mbit/s, most of a 1 Gbit/s link: a hint that a CDN should serve those bytes.","**Servers and memory**: servers = peak requests per second ÷ what one server carries with headroom (module 2). Cache memory: hold the hot set, often taken as the 20% of items that get 80% of the reads, so memory ≈ hot items × bytes per item.","**Sanity checks**: compare each answer with something you know (one database handles thousands of simple queries a second; one large server has hundreds of GB of memory), and redo any sum that looks 10× off. A design built on the wrong order of magnitude fails either way."],"dia":[{"type":"layers","cap":"Numbers to round with","rows":[["Seconds in a day","86,400 ≈ 10⁵"],["Seconds in a month","≈ 2.6 million"],["Seconds in a year","≈ 32 million (3.2 × 10⁷)"],["2¹⁰, 2²⁰, 2³⁰, 2⁴⁰","≈ a thousand (KB), a million (MB), a billion (GB), a trillion (TB)"],["1 million a day","≈ 12 a second"],["1 byte","8 bits, so 1 MB/s ≈ 8 Mbit/s"]],"note":"Rounding 86,400 to 100,000 makes every per-second figure about 14% low; that's fine for an estimate, as long as you know which way you rounded."},{"type":"flow","cap":"An estimate, step by step","steps":[["Assumptions","daily users, actions per user, sizes, peak factor, retention, copies"],["Traffic","average and peak requests per second, reads and writes apart"],["Storage","per day, per year, with copies"],["Bandwidth","requests per second × bytes × 8"],["Servers and cache","peak ÷ capacity per server; hot set × bytes"],["Sanity check","does any number break a single machine, or look 10× off?"]],"note":"Write the assumptions down first: every later number depends on them, and an interviewer will often change one to see how your design copes."},{"type":"hub","cap":"The URL shortener in numbers (this module's worked example)","core":"URL shortener: 100 million new links a month","spokes":[["Writes","≈ 40 a second"],["Reads","≈ 3,900 a second, ≈ 11,600 at a 3× peak"],["Records","6 billion in 5 years"],["Codes","6 characters of base 62"],["Storage","≈ 9 TB with 3 copies"],["Cache","≈ 33 GB for 20% of a day's reads"]],"note":"Nothing here needs a huge fleet: the hard parts are fast redirects and staying up, which is where the design effort goes."}],"cmp":[{"cap":"Sizes to estimate with (rules of thumb)","head":["Thing","Rough size"],"rows":[["A character of English text","1 byte in UTF-8"],["An integer, id or timestamp","4 to 8 bytes"],["A row of ids, short text and timestamps","a few hundred bytes to 1 KB"],["A compressed photo","a few hundred KB to a few MB"],["A minute of 1080p video","tens of MB"],["Memory in one large server","hundreds of GB"]]},{"cap":"Where the big number usually is","head":["Product","Biggest number","So the design focuses on"],"rows":[["URL shortener","Reads: about 100 for every write","Caching and fast redirects"],["Photo sharing","Storage and image bandwidth","Object storage and a CDN"],["Chat","Writes and open connections","A store that scales writes, and connection servers"],["Analytics events","Write volume","Append-only logs and batch processing"]]}],"code":[{"t":"Rounding and size helpers used by every example (powers of 1,000, as disks are sold)","tabs":[{"lang":"python","src":"SECONDS_PER_DAY = 86_400\n\ndef one_decimal(x):                             # round half up, the same way in both languages\n    return f\"{int(x * 10 + 0.5) / 10:.1f}\"\n\ndef human_bytes(n):\n    \"\"\"2_500_000 -> '2.5 MB', in powers of 1,000.\"\"\"\n    units, i = [\"B\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\"], 0\n    while n >= 1000 and i < len(units) - 1:\n        n /= 1000\n        i += 1\n    return f\"{one_decimal(n)} {units[i]}\"\n"},{"lang":"javascript","src":"const SECONDS_PER_DAY = 86400;\n\nconst oneDecimal = x => (Math.floor(x * 10 + 0.5) / 10).toFixed(1);   // round half up, the same way in both languages\n\nfunction humanBytes(n) {\n  // 2500000 -> \"2.5 MB\", in powers of 1,000\n  const units = [\"B\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\"];\n  let i = 0;\n  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }\n  return `${oneDecimal(n)} ${units[i]}`;\n}\n"}]},{"t":"Powers of two, and requests a day as requests a second","tabs":[{"lang":"python","src":"for power, name in ((10, \"KB\"), (20, \"MB\"), (30, \"GB\"), (40, \"TB\")):\n    print(f\"2^{power} = {2 ** power:,} bytes, about 10^{power * 3 // 10} ({name})\")\nfor per_day in (1_000_000, 100_000_000, 1_000_000_000):\n    print(f\"{per_day:,} a day = {one_decimal(per_day / SECONDS_PER_DAY)} a second\")\n","out":"2^10 = 1,024 bytes, about 10^3 (KB)\n2^20 = 1,048,576 bytes, about 10^6 (MB)\n2^30 = 1,073,741,824 bytes, about 10^9 (GB)\n2^40 = 1,099,511,627,776 bytes, about 10^12 (TB)\n1,000,000 a day = 11.6 a second\n100,000,000 a day = 1157.4 a second\n1,000,000,000 a day = 11574.1 a second\n","notes":[[2,"Each step of 2¹⁰ is about a factor of 1,000, and the error grows only slowly: 2⁴⁰ is 10% over 10¹²."],[4,"Dividing by 86,400 (about 10⁵): a million a day is about 12 a second, a billion a day about 12,000."]]},{"lang":"javascript","src":"for (const [power, name] of [[10, \"KB\"], [20, \"MB\"], [30, \"GB\"], [40, \"TB\"]]) {\n  console.log(`2^${power} = ${(2 ** power).toLocaleString(\"en-US\")} bytes, about 10^${Math.floor((power * 3) / 10)} (${name})`);\n}\nfor (const perDay of [1000000, 100000000, 1000000000]) {\n  console.log(`${perDay.toLocaleString(\"en-US\")} a day = ${oneDecimal(perDay / SECONDS_PER_DAY)} a second`);\n}\n","out":"2^10 = 1,024 bytes, about 10^3 (KB)\n2^20 = 1,048,576 bytes, about 10^6 (MB)\n2^30 = 1,073,741,824 bytes, about 10^9 (GB)\n2^40 = 1,099,511,627,776 bytes, about 10^12 (TB)\n1,000,000 a day = 11.6 a second\n100,000,000 a day = 1157.4 a second\n1,000,000,000 a day = 11574.1 a second\n","notes":[[2,"Each step of 2¹⁰ is about a factor of 1,000, and the error grows only slowly: 2⁴⁰ is 10% over 10¹²."],[5,"Dividing by 86,400 (about 10⁵): a million a day is about 12 a second, a billion a day about 12,000."]]}]},{"t":"Traffic and storage for a feed","tabs":[{"lang":"python","src":"dau = 10_000_000                              # assumption: daily active users\nposts_per_user, reads_per_user = 2, 100       # assumption: per user, per day\npeak_factor = 3                               # assumption: the busiest hour runs at 3x the average\n\nwrites = dau * posts_per_user / SECONDS_PER_DAY\nreads = dau * reads_per_user / SECONDS_PER_DAY\nprint(\"writes/s:\", one_decimal(writes), \"average,\", one_decimal(writes * peak_factor), \"peak\")\nprint(\"reads/s:\", one_decimal(reads), \"average,\", one_decimal(reads * peak_factor), \"peak\")\nprint(\"reads per write:\", reads_per_user // posts_per_user)\n\npost_bytes = 1_000                            # assumption: text, ids and timestamps\nper_day = dau * posts_per_user * post_bytes\nprint(\"new posts a day:\", human_bytes(per_day), \"| 5 years x 3 copies:\", human_bytes(per_day * 365 * 5 * 3))\n","out":"writes/s: 231.5 average, 694.4 peak\nreads/s: 11574.1 average, 34722.2 peak\nreads per write: 50\nnew posts a day: 20.0 GB | 5 years x 3 copies: 109.5 TB\n","notes":[[1,"Every estimate starts with assumptions, written where everyone can see and challenge them."],[9,"Reads dominate at 50 per write: cache the feeds, and make sure the read path scales."],[13,"Writes are modest (about 700 a second at the peak), but five years of posts with three copies is over 100 TB: plan storage early."]]},{"lang":"javascript","src":"const dau = 10000000;                         // assumption: daily active users\nconst postsPerUser = 2, readsPerUser = 100;   // assumption: per user, per day\nconst peakFactor = 3;                         // assumption: the busiest hour runs at 3x the average\n\nconst writes = (dau * postsPerUser) / SECONDS_PER_DAY;\nconst reads = (dau * readsPerUser) / SECONDS_PER_DAY;\nconsole.log(\"writes/s:\", oneDecimal(writes), \"average,\", oneDecimal(writes * peakFactor), \"peak\");\nconsole.log(\"reads/s:\", oneDecimal(reads), \"average,\", oneDecimal(reads * peakFactor), \"peak\");\nconsole.log(\"reads per write:\", Math.floor(readsPerUser / postsPerUser));\n\nconst postBytes = 1000;                       // assumption: text, ids and timestamps\nconst perDay = dau * postsPerUser * postBytes;\nconsole.log(\"new posts a day:\", humanBytes(perDay), \"| 5 years x 3 copies:\", humanBytes(perDay * 365 * 5 * 3));\n","out":"writes/s: 231.5 average, 694.4 peak\nreads/s: 11574.1 average, 34722.2 peak\nreads per write: 50\nnew posts a day: 20.0 GB | 5 years x 3 copies: 109.5 TB\n","notes":[[1,"Every estimate starts with assumptions, written where everyone can see and challenge them."],[9,"Reads dominate at 50 per write: cache the feeds, and make sure the read path scales."],[13,"Writes are modest (about 700 a second at the peak), but five years of posts with three copies is over 100 TB: plan storage early."]]}]},{"t":"Bandwidth and cache memory","tabs":[{"lang":"python","src":"reads_per_s = 11_574                          # from the feed estimate\nitem_bytes = 1_000                            # each feed item read\nimage_bytes = 200_000                         # assumption: one 200 KB image for every 10 items read\napi_out = reads_per_s * item_bytes\nimage_out = reads_per_s // 10 * image_bytes\nfor label, rate in ((\"API responses\", api_out), (\"images\", image_out)):\n    print(f\"{label}: {human_bytes(rate)}/s = {one_decimal(rate * 8 / 1e9)} Gbit/s\")\n\ndaily_items = 20_000_000                      # posts written per day (10 million users x 2)\nhot = daily_items * 20 // 100                 # assumption: 20% of items get 80% of the reads\nprint(\"cache for the hottest 20% of a day's posts:\", human_bytes(hot * item_bytes))\n","out":"API responses: 11.6 MB/s = 0.1 Gbit/s\nimages: 231.4 MB/s = 1.9 Gbit/s\ncache for the hottest 20% of a day's posts: 4.0 GB\n","notes":[[7,"Bytes become bits: × 8. The images need about 20 times the bandwidth of the API itself, so they belong on a CDN."],[11,"4 GB fits easily in one cache server's memory, so caching the hot posts is cheap."]]},{"lang":"javascript","src":"const readsPerS = 11574;                      // from the feed estimate\nconst itemBytes = 1000;                       // each feed item read\nconst imageBytes = 200000;                    // assumption: one 200 KB image for every 10 items read\nconst apiOut = readsPerS * itemBytes;\nconst imageOut = Math.floor(readsPerS / 10) * imageBytes;\nfor (const [label, rate] of [[\"API responses\", apiOut], [\"images\", imageOut]]) {\n  console.log(`${label}: ${humanBytes(rate)}/s = ${oneDecimal((rate * 8) / 1e9)} Gbit/s`);\n}\n\nconst dailyItems = 20000000;                  // posts written per day (10 million users x 2)\nconst hot = Math.floor((dailyItems * 20) / 100);   // assumption: 20% of items get 80% of the reads\nconsole.log(\"cache for the hottest 20% of a day's posts:\", humanBytes(hot * itemBytes));\n","out":"API responses: 11.6 MB/s = 0.1 Gbit/s\nimages: 231.4 MB/s = 1.9 Gbit/s\ncache for the hottest 20% of a day's posts: 4.0 GB\n","notes":[[7,"Bytes become bits: × 8. The images need about 20 times the bandwidth of the API itself, so they belong on a CDN."],[12,"4 GB fits easily in one cache server's memory, so caching the hot posts is cheap."]]}]}],"ex":{"q":"Estimate a URL shortener: 100 million new short URLs a month, 100 redirects for every new URL, about 500 bytes per record, kept for 5 years, a peak of 3× the average, and 3 copies of the data. How many writes and reads a second, how long must the codes be, how much storage, and how much cache memory for 20% of a day's reads?","steps":["Writes: 100 million a month ÷ (30 × 86,400 ≈ 2.6 million seconds) ≈ 40 new URLs a second.","Reads at 100 per write: about 3,900 redirects a second on average and about 11,600 at a 3× peak: a few app servers and a cache, not a giant fleet.","Five years of URLs: 100 million × 60 months = 6 billion records. 62⁵ ≈ 0.9 billion codes is too few and 62⁶ ≈ 57 billion is enough, so codes need 6 characters.","Storage: 6 billion × 500 bytes = 3 TB, 9 TB with three copies: one large or sharded database, not a big-data problem. Caching 20% of a day's 333 million reads at 500 bytes each takes about 33 GB of memory, one or two cache servers. Each figure is O(1) arithmetic; the code length loop runs a handful of times."],"code":{"t":"The URL shortener in numbers","tabs":[{"lang":"python","src":"def shortener_estimate(new_per_month, reads_per_write, record_bytes, years, peak_factor=3, copies=3):\n    writes = new_per_month / (30 * SECONDS_PER_DAY)\n    reads = writes * reads_per_write\n    records = new_per_month * 12 * years\n    code_len = 1\n    while 62 ** code_len < records:           # the shortest base-62 code that covers every record\n        code_len += 1\n    daily_reads = new_per_month * reads_per_write // 30\n    cache = daily_reads * 20 // 100 * record_bytes   # 20% of a day's reads\n    return writes, reads, reads * peak_factor, records, code_len, records * record_bytes * copies, cache\n\nw, r, peak, records, code_len, storage, cache = shortener_estimate(100_000_000, 100, 500, 5)\nprint(\"writes/s:\", one_decimal(w), \"| reads/s:\", one_decimal(r), \"| peak reads/s:\", one_decimal(peak))\nprint(f\"records in 5 years: {records:,} | code length: {code_len}\")\nprint(\"storage with 3 copies:\", human_bytes(storage), \"| cache:\", human_bytes(cache))\n","out":"writes/s: 38.6 | reads/s: 3858.0 | peak reads/s: 11574.1\nrecords in 5 years: 6,000,000,000 | code length: 6\nstorage with 3 copies: 9.0 TB | cache: 33.3 GB\n"},{"lang":"javascript","src":"function shortenerEstimate(newPerMonth, readsPerWrite, recordBytes, years, peakFactor = 3, copies = 3) {\n  const writes = newPerMonth / (30 * SECONDS_PER_DAY);\n  const reads = writes * readsPerWrite;\n  const records = newPerMonth * 12 * years;\n  let codeLen = 1;\n  while (62 ** codeLen < records) codeLen++;  // the shortest base-62 code that covers every record\n  const dailyReads = Math.floor((newPerMonth * readsPerWrite) / 30);\n  const cache = Math.floor((dailyReads * 20) / 100) * recordBytes;   // 20% of a day's reads\n  return [writes, reads, reads * peakFactor, records, codeLen, records * recordBytes * copies, cache];\n}\n\nconst [w, r, peak, records, codeLen, storage, cache] = shortenerEstimate(100000000, 100, 500, 5);\nconsole.log(\"writes/s:\", oneDecimal(w), \"| reads/s:\", oneDecimal(r), \"| peak reads/s:\", oneDecimal(peak));\nconsole.log(`records in 5 years: ${records.toLocaleString(\"en-US\")} | code length: ${codeLen}`);\nconsole.log(\"storage with 3 copies:\", humanBytes(storage), \"| cache:\", humanBytes(cache));\n","out":"writes/s: 38.6 | reads/s: 3858.0 | peak reads/s: 11574.1\nrecords in 5 years: 6,000,000,000 | code length: 6\nstorage with 3 copies: 9.0 TB | cache: 33.3 GB\n"}]},"a":"About 38.6 writes and 3,858 reads a second on average (11,574 reads at the peak), 6 billion records that need 6-character codes, 9 TB of storage with three copies and about 33 GB of cache. All modest: the hard parts of this design are fast redirects and staying up, not size."},"fade":{"q":"Estimate a photo-sharing app: 2 million daily users, 10% of them upload one 2 MB photo a day, everyone views 50 thumbnails of 100 KB a day, and the peak is 3× the average. Finish `photo_estimate` so it returns uploads per second, new storage per day and per year (bytes, before copies) and the peak thumbnail traffic in bits per second.","steps":["Write the assumptions down first; each one is an argument to the function, so it's easy to change later.",{"ask":"How many uploads a second, and how much new storage?","a":"200,000 uploads a day ÷ 86,400 ≈ 2.3 a second: tiny. But 200,000 × 2 MB = 400 GB a day, about 146 TB a year before copies: storage, not traffic, is this design's big number."},{"ask":"What's the peak bandwidth for viewing?","a":"2 million × 50 × 100 KB = 10 TB a day, about 0.93 Gbit/s on average and about 2.8 Gbit/s at a 3× peak: a job for a CDN."},{"ask":"What does the estimate cost, and which inputs matter most?","a":"A handful of multiplications: O(1). Every answer grows in step with its inputs, so the riskiest guesses are the photo size and the share of users who upload; say so, and check them against real numbers as soon as you can."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def photo_estimate(dau, upload_pct, photo_bytes, views_per_user, thumb_bytes, peak_factor=3):\n    \"\"\"Returns (uploads per second, new bytes a day, new bytes a year, peak thumbnail bits per second).\"\"\"\n    ...                                       # TODO: uploads a day, then the rates, storage and bandwidth\n"},{"lang":"javascript","src":"function photoEstimate(dau, uploadPct, photoBytes, viewsPerUser, thumbBytes, peakFactor = 3) {\n  // returns [uploads per second, new bytes a day, new bytes a year, peak thumbnail bits per second]\n  // TODO: uploads a day, then the rates, storage and bandwidth\n}\n"}]},"solution":{"t":"Solution: uploads, storage and bandwidth from the assumptions","tabs":[{"lang":"python","src":"def photo_estimate(dau, upload_pct, photo_bytes, views_per_user, thumb_bytes, peak_factor=3):\n    \"\"\"Returns (uploads per second, new bytes a day, new bytes a year, peak thumbnail bits per second).\"\"\"\n    uploads_per_day = dau * upload_pct // 100\n    storage_day = uploads_per_day * photo_bytes\n    peak_bits = dau * views_per_user * thumb_bytes * 8 * peak_factor / SECONDS_PER_DAY\n    return uploads_per_day / SECONDS_PER_DAY, storage_day, storage_day * 365, peak_bits\n\nups, day, year, peak_bits = photo_estimate(2_000_000, 10, 2_000_000, 50, 100_000)\nprint(\"uploads/s:\", one_decimal(ups), \"| storage a day:\", human_bytes(day), \"| a year:\", human_bytes(year))\nprint(\"peak thumbnail traffic:\", one_decimal(peak_bits / 1e9), \"Gbit/s\")\n","out":"uploads/s: 2.3 | storage a day: 400.0 GB | a year: 146.0 TB\npeak thumbnail traffic: 2.8 Gbit/s\n"},{"lang":"javascript","src":"function photoEstimate(dau, uploadPct, photoBytes, viewsPerUser, thumbBytes, peakFactor = 3) {\n  // returns [uploads per second, new bytes a day, new bytes a year, peak thumbnail bits per second]\n  const uploadsPerDay = Math.floor((dau * uploadPct) / 100);\n  const storageDay = uploadsPerDay * photoBytes;\n  const peakBits = (dau * viewsPerUser * thumbBytes * 8 * peakFactor) / SECONDS_PER_DAY;\n  return [uploadsPerDay / SECONDS_PER_DAY, storageDay, storageDay * 365, peakBits];\n}\n\nconst [ups, day, year, peakBits] = photoEstimate(2000000, 10, 2000000, 50, 100000);\nconsole.log(\"uploads/s:\", oneDecimal(ups), \"| storage a day:\", humanBytes(day), \"| a year:\", humanBytes(year));\nconsole.log(\"peak thumbnail traffic:\", oneDecimal(peakBits / 1e9), \"Gbit/s\");\n","out":"uploads/s: 2.3 | storage a day: 400.0 GB | a year: 146.0 TB\npeak thumbnail traffic: 2.8 Gbit/s\n"}]}},"traps":[["“Estimates need precise numbers.”","They need the right order of magnitude and stated assumptions. Whether it's 1,157 or 1,000 requests a second doesn't matter; 1,000 against 100,000 changes the design."],["“Size the system for the average traffic.”","Systems fall over at the peak. Multiply the average by a peak factor (and say which), then add headroom and a spare server."],["“Storage is just items × size.”","Multiply by how long the data is kept and by the number of copies (replicas, backups), and add indexes and growth. 1 TB of data can easily mean 4 TB of disk."],["“Bandwidth is the same thing as requests per second.”","Bandwidth is requests × bytes. A modest 1,000 requests a second of 1 MB images is 8 Gbit/s, more than many servers' network links: that's what CDNs are for."],["“MB/s and Mbit/s are the same.”","File sizes are counted in bytes and network speeds in bits, with 8 bits to a byte. 100 MB/s of data needs about 800 Mbit/s of network."],["“Every registered user is active every day.”","Daily active users are usually a fraction of everyone who has signed up, and each does only a few things a day. Start from daily active users and actions per user, and say where those numbers came from."]],"disc":[["Walk through estimating the storage for a chat app with 50 million daily users.","Assume each user sends 40 messages a day of about 100 bytes of text, plus about 100 bytes of ids, timestamps and index entries: 50 million × 40 × 200 bytes = 400 GB a day, about 146 TB a year, about 440 TB with three copies. Attachments would dwarf that, so they'd go to object storage and be estimated separately. Then check the rate: 2 billion messages a day is about 23,000 writes a second on average, so the message store must scale writes out."],["What do you do when the interviewer gives you no numbers?","Propose your own and say them out loud: “Let's assume 10 million daily users, each doing about 20 reads and 2 writes a day.” Pick round numbers, check that they're plausible for the product, and write them down so you can change one later. Then estimate, and let the results steer the design: which tier is the bottleneck, what needs a cache, what needs partitioning."]],"teach":{"prompt":"Explain to a junior colleague how you'd estimate the requests per second, storage and bandwidth for a new feature.","rubric":["Write down the assumptions: daily users, actions per user, sizes","Requests per second = daily counts ÷ about 100,000, then a peak factor","Storage = items per day × size × days kept × copies","Bandwidth = requests per second × response size, × 8 for bits","Round boldly and sanity-check against known limits"],"model":"I start by writing down assumptions: how many people use the feature each day, how often each one reads and writes, and how big each item is. Daily counts divided by 86,400, which I round to 100,000, give the average requests per second, and a peak factor of 2 to 5 gives the number to design for, with reads and writes worked out separately. Storage is the new items per day times their size, times how long we keep them and how many copies we store. Bandwidth is requests per second times the response size, times 8 to get bits, which tells me whether images or video need a CDN. Then I check each answer against things I know, such as what one database or one server can handle, and redo anything that looks ten times off. The numbers tell me where the design effort should go."},"qa":[["Seconds in a day, roughly?","86,400: call it 100,000 for quick estimates."],["1 million requests a day is about how many a second?","About 12."],["2¹⁰, 2²⁰, 2³⁰?","About a thousand, a million and a billion: KB, MB, GB."],["How do you turn MB/s into Mbit/s?","Multiply by 8."],["The storage formula?","Items per day × bytes per item × days kept × number of copies, plus indexes."],["A typical peak factor?","Often 2 to 5 times the average for consumer apps; always say which you assume."]],"quiz":[{"q":"What does this print?","snip":{"t":"Per day to per second","tabs":[{"lang":"python","src":"per_day = 50_000_000\nprint(per_day // 86_400, per_day * 3 // 86_400, 2 ** 20)\n"},{"lang":"javascript","src":"const perDay = 50000000;\nconsole.log(Math.floor(perDay / 86400), Math.floor((perDay * 3) / 86400), 2 ** 20);\n"}]},"o":["578 1736 1048576","500 1500 1000000","578 1736 1000000","5787 17361 1048576"],"a":0,"e":"50 million ÷ 86,400 ≈ 578.7, rounded down to 578; three times the traffic gives 1,736. And 2²⁰ is exactly 1,048,576, close to a million but not equal to it."},{"q":"What does this print? (`human_bytes` / `humanBytes` and `one_decimal` / `oneDecimal` are this module's helpers.)","snip":{"t":"A year of rows, then a second of responses","tabs":[{"lang":"python","src":"print(human_bytes(3_000_000 * 1_500 * 365), human_bytes(2_500 * 400_000), one_decimal(2_500 * 400_000 * 8 / 1e9))\n"},{"lang":"javascript","src":"console.log(humanBytes(3000000 * 1500 * 365), humanBytes(2500 * 400000), oneDecimal((2500 * 400000 * 8) / 1e9));\n"}]},"o":["1.6 TB 1.0 GB 8.0","4.5 GB 1.0 GB 8.0","1.6 TB 1.0 GB 1.0","1.6 TB 8.0 GB 8.0"],"a":0,"e":"3 million rows of 1.5 KB is 4.5 GB a day, about 1.6 TB a year. 2,500 responses of 400 KB is 1 GB a second, which is 8 Gbit/s once you count bits."},{"q":"A social app has 20 million daily users who each view 30 images of 200 KB a day. Roughly what average outgoing bandwidth do the images need?","o":["About 1.4 GB/s, roughly 11 Gbit/s: serve them from a CDN","About 14 MB/s","About 140 GB/s","About 1.4 Gbit/s, which is roughly 0.17 GB/s"],"a":0,"e":"20 million × 30 × 200 KB = 120 TB a day; ÷ 86,400 ≈ 1.4 GB a second, and × 8 ≈ 11 Gbit/s on average, more at the peak. The last option confuses bytes with bits."},{"q":"Which belong in a storage estimate? (choose 2)","t":"ms","o":["How long the data is kept","How many copies are stored (replicas, backups)","The number of app servers","The CDN's hit ratio","The peak reads per second"],"a":[0,1],"e":"Storage is items per day × size × retention × copies. App servers, the CDN and read rates shape the compute and network estimates, not the bytes on disk."},{"q":"Judge each statement.","t":"yn","s":[["A day has 86,400 seconds, which rounds to 10⁵ for quick estimates.",true],["100 MB/s of data needs about 100 Mbit/s of network.",false],["2³⁰ bytes is about a billion bytes.",true],["Servers should be sized for the average traffic, because peaks are rare.",false]],"e":"86,400 is within 14% of 100,000. Bytes are 8 bits, so 100 MB/s needs about 800 Mbit/s. 2³⁰ = 1,073,741,824. And systems must survive their peak, so size for it."},{"q":"Put the steps of an estimate in order.","t":"ord","items":["Write down the assumptions: daily users and actions per user","Turn the daily counts into average requests per second","Multiply by a peak factor to get the peak","Divide the peak by one server's capacity to get the server count"],"e":"Each step uses the previous result: the assumptions give daily counts, those give the average, the average gives the peak, and the peak sets the number of servers."},{"q":"Complete the JavaScript function for peak bandwidth in Gbit/s.","t":"drop","lang":"javascript","code":"function peakGbitPerS(dailyRequests, responseBytes, peakFactor) {\n  const bytesPerS = {{0}} * responseBytes;\n  return (bytesPerS * {{1}} * peakFactor) / 1e9;\n}\n","blanks":[{"o":["dailyRequests / 86400","dailyRequests * 86400","dailyRequests / 3600","dailyRequests"],"a":0},{"o":["8","1 / 8","1000","1"],"a":0}],"e":"Requests a day ÷ 86,400 gives requests a second; × bytes gives bytes a second; × 8 turns bytes into bits, and × the peak factor gives the peak."},{"q":"Match each daily volume to its rough rate.","t":"match","pairs":[["About 12 requests a second","1 million requests a day"],["About 120 requests a second","10 million requests a day"],["About 1,200 requests a second","100 million requests a day"],["About 12,000 requests a second","1 billion requests a day"]],"extra":["10 billion requests a day"],"e":"Divide by 86,400 (about 10⁵): every factor of 10 in the daily volume is a factor of 10 in the rate. 10 billion a day would be about 116,000 a second."}],"probs":[["Exercise · Estimate a pastebin","https://github.com/donnemartin/system-design-primer","","use the primer's powers-of-two table, then estimate a pastebin with 10 million new pastes a month: writes, reads, storage for 3 years and cache size"],["Exercise · Peak against average in real traffic","https://radar.cloudflare.com/","","look at a week of internet traffic for your country, and estimate the peak-to-average ratio you'd plan for"],["Exercise · Does it fit on one machine?","https://aws.amazon.com/ec2/instance-types/","","find the memory and network bandwidth of one large instance, and check whether this module's 33 GB cache and 2.8 Gbit/s fit on one machine"],["Reference · KB or KiB?","https://en.wikipedia.org/wiki/Byte","","find the difference between decimal (kB, MB) and binary (KiB, MiB) units, and redo the photo estimate in TiB"]],"src":[["System Design Primer (powers of two, latency numbers)","https://github.com/donnemartin/system-design-primer"],["Colin Scott: Latency numbers every programmer should know","https://colin-scott.github.io/personal_website/research/interactive_latency.html"],["Wikipedia: Byte (units of measurement)","https://en.wikipedia.org/wiki/Byte"],["AWS: Amazon EC2 instance types","https://aws.amazon.com/ec2/instance-types/"]]}],"plan":[{"t":"How a request travels","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a sd-l1/ folder with python/ and js/; pytest and node --test; a notebook or doc for design sketches","min":30,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-latency"},{"k":"mod","ref":"m03"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Spreading the load","blocks":[{"k":"mod","ref":"m04"},{"k":"lab","ref":"lab-lb"},{"k":"mod","ref":"m05"},{"k":"mod","ref":"m06"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Data and interfaces","blocks":[{"k":"mod","ref":"m07"},{"k":"lab","ref":"lab-cache"},{"k":"mod","ref":"m08"},{"k":"lab","ref":"lab-api"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Estimation","blocks":[{"k":"mod","ref":"m09"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L1","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-designs","label":"Design practice: three written one-page designs (a pastebin, a news feed read path, an image host), each with estimates and a boxes-and-arrows sketch","min":300,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the module practice problems and design prompts, logged with what you learned from each","min":600,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L1: the request path in your own words, your estimation cheat sheet, and what you'd change in your capstone; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Luigi's ordering app","org":"Luigi's Pizza (a growing online ordering app)","min":25,"blurb":"One busy server is falling over at dinner time. Find the bottleneck, make it scale out, and stop the double charges.","sections":[["Overview","Luigi's app takes online orders for 40 shops across Pizza Town. About 200,000 people use it each day, and 80% of the day's orders arrive between 6 pm and 8 pm. Everything runs on one server: the web app, the API, the menu photos and a PostgreSQL database."],["Current design",["One server runs the app, keeps sessions and baskets in memory, and serves the 300 KB menu photos from its own disk.","The database runs on the same machine, and every page view queries the menu.","The payment call has a 10-second timeout, and the app retries it once after a timeout.","There's no load balancer and no CDN."]],["Problems",["At 7 pm the CPU sits at 100% and pages take 4 seconds.","Restarting the server for an update logs everyone out and empties their baskets.","Some customers have been charged twice after a slow payment.","Last month a database disk failure took the app down for 3 hours."]]],"items":[{"d":"d2","q":"What must change before the app can run on several servers behind a load balancer?","o":["Move sessions and baskets out of server memory into a shared store","Buy a server with twice the CPU","Add more indexes to the database","Switch from HTTP/1.1 to HTTP/2"],"a":0,"e":"Round-robin requests would land on servers that don't hold the user's basket. With the state in a shared store (or signed tokens), any server can answer, and a restart no longer logs anyone out."},{"d":"d1","q":"Every menu page shows ten 300 KB photos. What's the best fix for the bandwidth and server time they use?","o":["Serve them from object storage through a CDN, with versioned names and long cache lifetimes","Store them in the database instead","Give the photos a one-second TTL","Serve them from every app server's disk"],"a":0,"e":"A CDN serves the photos from near the users, and versioned names let them be cached for a year. In the database they bloat it, a one-second TTL defeats caching, and copies on every server's disk must be kept in step."},{"d":"d1","t":"ms","q":"Which TWO make retrying the payment safe and sensible?","o":["Send an idempotency key with the payment and with every retry","Retry only after a timeout or a 503, with backoff","Retry three times straight away instead of once","Remove the payment timeout","Charge the card before checking the basket"],"a":[0,1],"e":"The key stops a retry from charging twice, and retrying only errors that may pass, with backoff, avoids hammering a struggling provider. Instant retries make overload worse, no timeout ties up workers, and charging before checking risks charging for a bad order."},{"d":"d2","q":"The new design has two app servers (99.9% each, either will do) and one database (99.9%). Roughly how available is the ordering path, ignoring the load balancer?","o":["About 99.9%: the single database now limits it","About 99.9999%","About 99.8%","100%"],"a":0,"e":"The app tier is 1 − 0.001² = 99.9999%, so the path is about 0.999999 × 0.999 ≈ 99.9%. The next step is a standby database with automatic failover."},{"d":"d4","q":"Each of the 200,000 daily users places about one order, and 80% of orders arrive in the two dinner hours. Roughly what's the peak order rate?","o":["About 22 orders a second","About 2 orders a second","About 220 orders a second","About 1,900 orders a second"],"a":0,"e":"160,000 orders in 7,200 seconds ≈ 22 a second, about ten times the daily average of 2.3. Size for the dinner peak, not the day."}]},{"id":"cs2","title":"The road-trip photo club","org":"A photo-sharing app for families' road trips","min":25,"blurb":"Choose storage, caching and paging for an app that's mostly photos.","sections":[["Overview","Families post road-trip photos and browse each other's albums. 2 million people use the app each day; 10% upload one 2 MB photo, and everyone scrolls through about 50 thumbnails of 100 KB."],["Current design",["Photos are stored as binary columns in the main relational database.","The album page uses ?page=N with OFFSET, newest first.","All reads go to the primary database; a read replica exists but isn't used.","Thumbnails are generated on every request."]],["Goals",["Keep the database small and fast.","Make scrolling smooth, even while new photos arrive.","Cut thumbnail bandwidth and work.","Show users their own new photo straight after they post it."]]],"items":[{"d":"d3","q":"Where should the photo bytes go?","o":["Object storage, with each photo's key and details in the database and a CDN in front","Stay in the database, with more indexes","In the cache only","On the app servers' local disks"],"a":0,"e":"Object storage is built for large files and a CDN serves them near users; the database keeps only the key and details, so it stays small."},{"d":"d1","q":"People say the same photo sometimes appears twice as they scroll. What's the fix?","o":["Cursor pagination: ask for photos older than the last one shown","A bigger page size","A longer cache lifetime for album pages","Sorting oldest first"],"a":0,"e":"New uploads shift every OFFSET page down, so items repeat. A cursor based on the last item's sort key isn't affected."},{"d":"d3","q":"Reads move to the replica, and now people sometimes can't see the photo they've just posted. What's the best fix?","o":["Send each user's reads to the primary for a few seconds after they post","Stop using the replica","Make the replica synchronous for every write","Cache the album page for a minute"],"a":0,"e":"Read-your-own-writes hides the lag from the one person who would notice it, while the replica still carries most reads. A minute-long cache would make the problem worse."},{"d":"d4","q":"Roughly how much new photo storage does a year need, before copies?","o":["About 146 TB","About 400 GB","About 1.5 PB","About 14.6 TB"],"a":0,"e":"200,000 photos a day × 2 MB = 400 GB a day, × 365 ≈ 146 TB a year, before replicas and thumbnails."},{"d":"d3","t":"yn","q":"Judge each statement about the thumbnails.","s":[["Generating each thumbnail once at upload and caching it at the CDN removes the repeated work.",true],["A cache in front of album pages makes the first view of each page faster.",false],["A content hash in each thumbnail's URL lets the CDN cache it for a year.",true]],"e":"Doing the work once and serving the result from the edge removes both the CPU and the bandwidth cost. The first view of each page is always a miss with cache-aside. And a URL that changes with the content can be cached for as long as you like."}]}],"diag":[{"d":"d1","q":"Before the first byte of an HTTPS response arrives on a brand-new connection (TCP and TLS 1.3), how many round trips are needed, not counting DNS?","o":["Three: the TCP handshake, the TLS handshake, then the request","One: just the request","Two: TCP and the request; TLS adds no round trip","Five: TCP, two for TLS, the request and an acknowledgement"],"a":0,"e":"TCP needs one round trip, TLS 1.3 one more, and the request itself a third. TLS 1.2 needed two for its handshake, and HTTP/3 merges the transport and TLS handshakes."},{"d":"d1","q":"Which Cache-Control directive gives shared caches such as a CDN their own lifetime, overriding max-age?","o":["s-maxage","ETag","private","no-cache"],"a":0,"e":"s-maxage applies only to shared caches. An ETag is a validator, private keeps a response out of shared caches, and no-cache forces revalidation before every reuse."},{"d":"d1","q":"A phone app retries POST /payments after a timeout. What stops a double charge?","o":["An idempotency key sent with both attempts","Sending the retry over HTTP/2","Answering 204 instead of 201","A longer cache TTL"],"a":0,"e":"With the same key on both attempts the server recognises the retry and replays the first result. The protocol version, status code and caching don't stop a second charge."},{"d":"d1","q":"Why is cursor pagination preferred over offset pagination for a busy feed?","o":["Deep pages stay fast, and new posts don't cause repeats or gaps","It lets users jump straight to any page number","It needs no index","It works without any sort order"],"a":0,"e":"A cursor seeks straight to where the last page ended and isn't shifted by new rows. Jumping to page 50 is exactly what cursors can't do, and they need a sort order with an index to be fast."},{"d":"d1","q":"What does a reverse proxy do?","o":["Sits in front of servers and routes each request to a backend, often terminating TLS","Acts for clients going out to the internet","Turns domain names into IP addresses","Stores the database's backups"],"a":0,"e":"A reverse proxy acts for the servers behind it. A forward proxy acts for clients, and DNS turns names into addresses."},{"d":"d2","q":"A request needs a load balancer, an app server and a database, each 99.9% available. Roughly how available is the whole path?","o":["About 99.7%","99.9%","99.99%","About 97%"],"a":0,"e":"Parts in series multiply: 0.999³ ≈ 0.997. The chain is less available than any single part."},{"d":"d2","q":"Two independent servers, each 99% available, either of which will do. How available is the pair?","o":["99.99%","99.5%","98%","100%"],"a":0,"e":"Both are down together only 1% × 1% = 0.01% of the time, if their failures are independent."},{"d":"d2","q":"Your app keeps sessions in each server's memory. What must change before you add servers behind a round-robin load balancer?","o":["Move sessions to a shared store or signed tokens","Buy a bigger server first","Put a CDN in front","Switch to UDP"],"a":0,"e":"Round robin sends a user's requests to different servers, so state in one server's memory gets lost. Shared state makes the servers stateless."},{"d":"d2","q":"Requests to an API take anything from 5 ms to 5 s. Which load-balancing algorithm spreads the load best?","o":["Least connections","Round robin","A hash of the client's IP address","Weighted round robin with equal weights"],"a":0,"e":"Least connections looks at the requests each server is holding, so slow requests don't pile up on one server. The others count requests, not load."},{"d":"d2","q":"1,000 requests a second each take 200 ms. About how many are in flight at any moment?","o":["About 200","About 5","About 1,000","About 5,000"],"a":0,"e":"Little's law: in flight = arrival rate × time in the system = 1,000 × 0.2 s = 200."},{"d":"d3","q":"A cache answers in 1 ms and the database in 10 ms. With a 90% hit ratio, what's the average read time?","o":["About 2 ms","About 1 ms","About 9.1 ms","About 10 ms"],"a":0,"e":"Every read pays 1 ms for the cache and the 10% that miss also pay 10 ms: 1 + 0.1 × 10 = 2 ms."},{"d":"d3","q":"With cache-aside, what's the usual way to handle a write?","o":["Write the database, then delete the cached copy","Update the cache only, and the database at night","Clear the whole cache","Write nothing to the database until the entry expires"],"a":0,"e":"Deleting the key after the database write makes the next read load the new value. The other options risk losing data or wiping out every hit."},{"d":"d3","q":"Where should users' 5 MB photos be stored?","o":["In object storage, with keys in the database and a CDN in front","In a binary column of the relational database","In the cache","On the local disk of the app server that received them"],"a":0,"e":"Object storage is cheap and durable, and a CDN serves the bytes near users. Large files bloat a database, a cache may evict them, and a local disk breaks statelessness."},{"d":"d3","q":"A user saves a change, reloads at once and sees the old value. Reads go to an asynchronous replica. What's the likely cause?","o":["Replication lag","A missing index","A hot partition","A DNS cache"],"a":0,"e":"The replica hadn't applied the write yet. Reading a user's own recent writes from the primary hides the lag."},{"d":"d4","q":"Roughly how many requests a second is 100 million requests a day?","o":["About 1,200","About 120","About 12,000","About 100,000"],"a":0,"e":"100 million ÷ 86,400 seconds ≈ 1,157: round to about 1,200 (or about 1,000 with a day ≈ 10⁵ seconds)."},{"d":"d4","q":"1,000 requests a second, each with a 100 KB response, need roughly how much network bandwidth?","o":["About 800 Mbit/s","About 100 Mbit/s","About 8 Gbit/s","About 80 Mbit/s"],"a":0,"e":"1,000 × 100 KB = 100 MB a second, and × 8 bits per byte = 800 Mbit/s."}],"labs":[{"id":"lab-latency","t":"Measure a request: a tiny HTTP server and the cost of new connections","min":60,"mods":["m01","m02"],"goal":"Run a real HTTP server on your own machine with only the standard library, call it 200 times with a new connection each time and 200 times over one kept-alive connection, and compare the medians. Then add 20 ms of pretend work to the server and watch it add straight to every request.","pre":["Python 3.12+ and Node.js 22+","Read module 1 (how a request travels)"],"steps":["Start a server on port 0 (the system picks a free port) that answers GET with a small JSON body and a Content-Length header: `http.server` in Python, `node:http` in JavaScript.","Write a client that makes 200 requests, opening a new connection for each, and records each request's time in milliseconds.","Repeat over one connection kept alive for all 200 requests (Python's `http.client` reuses an open connection; in Node, use an `http.Agent` with `keepAlive: true`).","Print both medians. Then add a 20 ms delay to the handler and confirm the median rises by about 20 ms: the server's time adds to the network's.","Write two sentences: which round trips the kept-alive connection saves, and why the gap is small on one machine but large across an ocean (module 1's model)."],"starter":{"t":"Starter (fill in the client)","tabs":[{"lang":"python","src":"import http.client, json, statistics, threading, time\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nclass Handler(BaseHTTPRequestHandler):\n    protocol_version = \"HTTP/1.1\"           # keep-alive needs HTTP/1.1 and a Content-Length\n    wbufsize = -1                           # buffer the reply so headers and body leave together\n\n    def do_GET(self):\n        body = json.dumps({\"path\": self.path}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\nserver = ThreadingHTTPServer((\"127.0.0.1\", 0), Handler)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nport = server.server_address[1]\n\ndef median_ms(n, reuse):\n    # TODO: make n GET requests, a new HTTPConnection each time unless reuse is true,\n    # time each one with time.perf_counter() and return the median in milliseconds\n    ...\n"},{"lang":"javascript","src":"const http = require(\"node:http\");\n\nconst server = http.createServer((req, res) => {\n  const body = JSON.stringify({ path: req.url });\n  res.writeHead(200, { \"Content-Length\": Buffer.byteLength(body) });\n  res.end(body);\n});\n\nasync function medianMs(port, n, reuse) {\n  // TODO: an http.Agent({ keepAlive: reuse, maxSockets: 1 }), n GET requests with http.get,\n  // each timed with performance.now(); return the median in milliseconds\n}\n\nserver.listen(0, \"127.0.0.1\", async () => {\n  const port = server.address().port;\n  // TODO: print medianMs(port, 200, false) and medianMs(port, 200, true), then server.close()\n});\n"}]},"solution":{"t":"Reference solution (timings go to stderr; the checks print OK)","tabs":[{"lang":"python","src":"import http.client, json, statistics, sys, threading, time\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nclass Handler(BaseHTTPRequestHandler):\n    protocol_version = \"HTTP/1.1\"                   # keep-alive needs HTTP/1.1 and a Content-Length\n    wbufsize = -1                                   # buffer the reply so headers and body leave together\n    delay = 0.0                                     # seconds of pretend work per request\n\n    def do_GET(self):\n        time.sleep(self.delay)\n        body = json.dumps({\"path\": self.path, \"pizza\": \"margherita\"}).encode()\n        self.send_response(200)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def log_message(self, *args):                   # keep the console quiet\n        pass\n\ndef start_server():\n    server = ThreadingHTTPServer((\"127.0.0.1\", 0), Handler)   # port 0: the system picks a free port\n    threading.Thread(target=server.serve_forever, daemon=True).start()\n    return server\n\ndef median_ms(port, n, reuse):\n    times, conn = [], None\n    for i in range(n):\n        start = time.perf_counter()\n        if conn is None or not reuse:\n            conn = http.client.HTTPConnection(\"127.0.0.1\", port)   # a new TCP connection\n        conn.request(\"GET\", f\"/menu/{i}\")\n        resp = conn.getresponse()\n        data = json.loads(resp.read())\n        assert resp.status == 200 and data[\"path\"] == f\"/menu/{i}\"\n        if not reuse:\n            conn.close()\n        times.append((time.perf_counter() - start) * 1000)\n    conn.close()\n    return statistics.median(times)\n\nserver = start_server()\nport = server.server_address[1]\ncold = median_ms(port, 200, reuse=False)\nwarm = median_ms(port, 200, reuse=True)\nHandler.delay = 0.02                                # add 20 ms of server work\nslow = median_ms(port, 20, reuse=True)\nserver.shutdown()\nprint(f\"new connection each time: {cold:.2f} ms | kept alive: {warm:.2f} ms | with 20 ms of work: {slow:.2f} ms\", file=sys.stderr)\nassert 0 < warm and 0 < cold and slow >= 20\nprint(\"latency lab OK\")\n","out":"latency lab OK"},{"lang":"javascript","src":"const http = require(\"node:http\");\n\nlet delayMs = 0;                                    // pretend work per request\n\nfunction startServer() {\n  const server = http.createServer((req, res) => {\n    setTimeout(() => {\n      const body = JSON.stringify({ path: req.url, pizza: \"margherita\" });\n      res.writeHead(200, { \"Content-Type\": \"application/json\", \"Content-Length\": Buffer.byteLength(body) });\n      res.end(body);\n    }, delayMs);\n  });\n  return new Promise(resolve => server.listen(0, \"127.0.0.1\", () => resolve(server)));   // port 0: the system picks a free port\n}\n\nfunction get(port, path, agent) {\n  return new Promise((resolve, reject) => {\n    http.get({ host: \"127.0.0.1\", port, path, agent }, res => {\n      let data = \"\";\n      res.on(\"data\", chunk => (data += chunk));\n      res.on(\"end\", () => resolve([res.statusCode, JSON.parse(data)]));\n    }).on(\"error\", reject);\n  });\n}\n\nasync function medianMs(port, n, reuse) {\n  const agent = new http.Agent({ keepAlive: reuse, maxSockets: 1 });   // keepAlive false: a new connection per request\n  const times = [];\n  for (let i = 0; i < n; i++) {\n    const start = performance.now();\n    const [status, body] = await get(port, `/menu/${i}`, agent);\n    if (status !== 200 || body.path !== `/menu/${i}`) throw new Error(\"bad response\");\n    times.push(performance.now() - start);\n  }\n  agent.destroy();\n  times.sort((a, b) => a - b);\n  return times[Math.floor(n / 2)];\n}\n\n(async () => {\n  const server = await startServer();\n  const port = server.address().port;\n  const cold = await medianMs(port, 200, false);\n  const warm = await medianMs(port, 200, true);\n  delayMs = 20;                                     // add 20 ms of server work\n  const slow = await medianMs(port, 20, true);\n  server.close();\n  console.error(`new connection each time: ${cold.toFixed(2)} ms | kept alive: ${warm.toFixed(2)} ms | with 20 ms of work: ${slow.toFixed(2)} ms`);\n  if (!(cold > 0 && warm > 0 && slow >= 20)) throw new Error(\"timings\");\n  console.log(\"latency lab OK\");\n})();\n","out":"latency lab OK"}]},"breakit":["In Python, set `wbufsize = 0` again and time the kept-alive requests: headers and body now leave in two packets, and Nagle's algorithm waiting for a delayed acknowledgement can add about 40 ms to each one.","Remove the Content-Length header: with HTTP/1.1 the client can no longer tell where the body ends.","Run the client against a server on another continent (any public HTTPS site) and compare the gap with module 1's model."]},{"id":"lab-lb","t":"A load balancer with health checks and retries: a simulation","min":75,"mods":["m03","m04"],"goal":"Build a round-robin load balancer in front of three servers, take one server down for 20 seconds, and measure the errors with no health checks, with health checks (down after 3 failures, up after 2 passes), and with one retry on another server. Then explain every number.","pre":["Python 3.12+ and Node.js 22+","Read modules 3 and 4"],"steps":["Write `health_step(healthy, streak, ok, fall, rise)`: one check result in, the new state out (module 4's thresholds).","Write a `LoadBalancer` with `check(up)` (one round of health checks), `pick(avoid)` (round robin over healthy servers not in avoid) and `send(up)` (try, and retry on another server up to `retries` times).","Simulate 60 one-second ticks with 30 requests each; server s1 is down from second 20 to second 39.","Print the errors and attempts for three set-ups: no health checks, health checks, and health checks plus one retry.","Explain each result: why 200 errors without checks, why exactly 20 with them, and why the retry version makes 30 extra attempts."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"def health_step(healthy, streak, ok, fall=3, rise=2):\n    ...                                     # TODO: module 4's thresholds; return (healthy, streak)\n\nclass LoadBalancer:\n    def __init__(self, names, health_checks=True, retries=0):\n        self.names, self.health_checks, self.retries = names, health_checks, retries\n        self.healthy = {n: True for n in names}\n        self.streak = {n: 0 for n in names}\n        self.turn, self.attempts = 0, 0\n\n    def check(self, up): ...                # TODO: one health-check round (skip if health checks are off)\n    def pick(self, avoid): ...              # TODO: round robin over healthy servers not in avoid\n    def send(self, up): ...                 # TODO: try, then retry elsewhere up to self.retries times\n\n# TODO: simulate 60 ticks of 30 requests; s1 is down for ticks 20 to 39\n"},{"lang":"javascript","src":"function healthStep(healthy, streak, ok, fall = 3, rise = 2) {\n  // TODO: module 4's thresholds; return [healthy, streak]\n}\n\nclass LoadBalancer {\n  constructor(names, healthChecks = true, retries = 0) {\n    this.names = names; this.healthChecks = healthChecks; this.retries = retries;\n    this.healthy = Object.fromEntries(names.map(n => [n, true]));\n    this.streak = Object.fromEntries(names.map(n => [n, 0]));\n    this.turn = 0; this.attempts = 0;\n  }\n  check(up) { /* TODO */ }\n  pick(avoid) { /* TODO */ }\n  send(up) { /* TODO */ }\n}\n\n// TODO: simulate 60 ticks of 30 requests; s1 is down for ticks 20 to 39\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"import random\n\ndef health_step(healthy, streak, ok, fall=3, rise=2):\n    \"\"\"Apply one health-check result; returns the new (healthy, streak).\"\"\"\n    if ok == healthy:\n        return healthy, 0                           # agrees with the current state: reset the count\n    streak += 1\n    if streak == (rise if ok else fall):\n        return ok, 0                                # enough results in a row: switch\n    return healthy, streak\n\nclass LoadBalancer:\n    def __init__(self, names, health_checks=True, retries=0):\n        self.names, self.health_checks, self.retries = names, health_checks, retries\n        self.healthy = {n: True for n in names}\n        self.streak = {n: 0 for n in names}\n        self.turn = 0                               # round-robin position\n        self.attempts = 0\n\n    def check(self, up):                            # one round of health checks\n        if self.health_checks:\n            for n in self.names:\n                self.healthy[n], self.streak[n] = health_step(self.healthy[n], self.streak[n], up[n])\n\n    def pick(self, avoid):\n        pool = [n for n in self.names if self.healthy[n] and n not in avoid]\n        if not pool:\n            return None\n        n = pool[self.turn % len(pool)]\n        self.turn += 1\n        return n\n\n    def send(self, up):                             # True if the request succeeded\n        tried = []\n        for _ in range(1 + self.retries):\n            n = self.pick(tried)\n            if n is None:\n                return False\n            self.attempts += 1\n            if up[n]:\n                return True\n            tried.append(n)                         # retry somewhere else\n        return False\n\ndef simulate(health_checks, retries, ticks=60, per_tick=30):\n    lb, errors = LoadBalancer([\"s0\", \"s1\", \"s2\"], health_checks, retries), 0\n    for t in range(ticks):                          # one tick = one second; s1 is down from 20 s to 39 s\n        up = {\"s0\": True, \"s1\": not 20 <= t < 40, \"s2\": True}\n        lb.check(up)\n        errors += sum(not lb.send(up) for _ in range(per_tick))\n    return errors, lb.attempts\n\nfor label, checks, retries in ((\"no health checks\", False, 0), (\"health checks\", True, 0), (\"health checks + 1 retry\", True, 1)):\n    errors, attempts = simulate(checks, retries)\n    print(f\"{label}: {errors} errors in 1800 requests, {attempts} attempts\")\n\nassert simulate(False, 0) == (200, 1800) and simulate(True, 0)[0] == 20 and simulate(True, 1) == (0, 1830)\nfor _ in range(500):                                # health_step against a direct count of the last results\n    fall, rise = random.randint(1, 4), random.randint(1, 4)\n    healthy, streak, history = True, 0, []\n    for _ in range(40):\n        ok = random.random() < 0.6\n        before = healthy\n        healthy, streak = health_step(healthy, streak, ok, fall, rise)\n        history.append(ok)\n        if healthy != before:                       # a switch needs `fall` failures or `rise` passes in a row\n            need = rise if healthy else fall\n            assert history[-need:] == [healthy] * need\nprint(\"load balancer lab OK\")\n","out":"no health checks: 200 errors in 1800 requests, 1800 attempts\nhealth checks: 20 errors in 1800 requests, 1800 attempts\nhealth checks + 1 retry: 0 errors in 1800 requests, 1830 attempts\nload balancer lab OK\n"},{"lang":"javascript","src":"function healthStep(healthy, streak, ok, fall = 3, rise = 2) {\n  // apply one health-check result; returns the new [healthy, streak]\n  if (ok === healthy) return [healthy, 0];          // agrees with the current state: reset the count\n  streak++;\n  if (streak === (ok ? rise : fall)) return [ok, 0];   // enough results in a row: switch\n  return [healthy, streak];\n}\n\nclass LoadBalancer {\n  constructor(names, healthChecks = true, retries = 0) {\n    this.names = names; this.healthChecks = healthChecks; this.retries = retries;\n    this.healthy = Object.fromEntries(names.map(n => [n, true]));\n    this.streak = Object.fromEntries(names.map(n => [n, 0]));\n    this.turn = 0;                                  // round-robin position\n    this.attempts = 0;\n  }\n  check(up) {                                       // one round of health checks\n    if (!this.healthChecks) return;\n    for (const n of this.names) [this.healthy[n], this.streak[n]] = healthStep(this.healthy[n], this.streak[n], up[n]);\n  }\n  pick(avoid) {\n    const pool = this.names.filter(n => this.healthy[n] && !avoid.includes(n));\n    if (!pool.length) return null;\n    return pool[this.turn++ % pool.length];\n  }\n  send(up) {                                        // true if the request succeeded\n    const tried = [];\n    for (let k = 0; k <= this.retries; k++) {\n      const n = this.pick(tried);\n      if (n === null) return false;\n      this.attempts++;\n      if (up[n]) return true;\n      tried.push(n);                                // retry somewhere else\n    }\n    return false;\n  }\n}\n\nfunction simulate(healthChecks, retries, ticks = 60, perTick = 30) {\n  const lb = new LoadBalancer([\"s0\", \"s1\", \"s2\"], healthChecks, retries);\n  let errors = 0;\n  for (let t = 0; t < ticks; t++) {                 // one tick = one second; s1 is down from 20 s to 39 s\n    const up = { s0: true, s1: !(t >= 20 && t < 40), s2: true };\n    lb.check(up);\n    for (let r = 0; r < perTick; r++) if (!lb.send(up)) errors++;\n  }\n  return [errors, lb.attempts];\n}\n\nfor (const [label, checks, retries] of [[\"no health checks\", false, 0], [\"health checks\", true, 0], [\"health checks + 1 retry\", true, 1]]) {\n  const [errors, attempts] = simulate(checks, retries);\n  console.log(`${label}: ${errors} errors in 1800 requests, ${attempts} attempts`);\n}\n\nif (simulate(false, 0).join() !== \"200,1800\" || simulate(true, 0)[0] !== 20 || simulate(true, 1).join() !== \"0,1830\") throw new Error(\"simulation\");\nfor (let r = 0; r < 500; r++) {                     // healthStep against a direct count of the last results\n  const fall = 1 + Math.floor(Math.random() * 4), rise = 1 + Math.floor(Math.random() * 4);\n  let healthy = true, streak = 0;\n  const history = [];\n  for (let k = 0; k < 40; k++) {\n    const ok = Math.random() < 0.6, before = healthy;\n    [healthy, streak] = healthStep(healthy, streak, ok, fall, rise);\n    history.push(ok);\n    if (healthy !== before) {                       // a switch needs `fall` failures or `rise` passes in a row\n      const need = healthy ? rise : fall;\n      if (!history.slice(-need).every(x => x === healthy)) throw new Error(\"threshold\");\n    }\n  }\n}\nconsole.log(\"load balancer lab OK\");\n","out":"no health checks: 200 errors in 1800 requests, 1800 attempts\nhealth checks: 20 errors in 1800 requests, 1800 attempts\nhealth checks + 1 retry: 0 errors in 1800 requests, 1830 attempts\nload balancer lab OK\n"}]},"breakit":["Set fall to 1: errors drop, but make s1 fail one check in three and watch it flap in and out.","Give the retry no `avoid` list, so it can pick the same dead server again, and count the errors.","Add least connections as a second policy, give s0 slow requests, and compare the peak load per server (module 4)."]},{"id":"lab-cache","t":"A cache layer: LRU, TTL and one load per missing key","min":75,"mods":["m05","m06","m07"],"goal":"Build the cache you'd put in front of a database: least-recently-used eviction, a time to live, and single-flight loading, so that 100 requests arriving together for a missing key cause one database read, not 100. Test it with a fake clock and a slow fake database.","pre":["Python 3.12+ (asyncio) and Node.js 22+ (promises)","Read module 5"],"steps":["Write `get(key)` and `set(key, value)` over an ordered map: a hit moves the key to the recent end, an expired entry counts as missing, and a full cache evicts the least recently used key.","Write `get_or_load(key, loader)`: return a fresh value, or start one load and remember it as in flight, so that other misses for the same key wait for that same load.","Fire 100 concurrent `get_or_load` calls for one missing key and check that the database was read once.","Check eviction (capacity 2: the least recently used key goes) and expiry (advance the fake clock past the TTL).","Test `get` and `set` against a simple list model with random operations."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import asyncio\nfrom collections import OrderedDict\n\nclass Cache:\n    def __init__(self, capacity, ttl, clock):\n        self.capacity, self.ttl, self.clock = capacity, ttl, clock\n        self.items = OrderedDict()          # key -> (value, expires_at), least recently used first\n        self.in_flight = {}                 # key -> the task that is loading it\n        self.hits = self.misses = self.loads = 0\n\n    def get(self, key): ...                 # TODO: None if missing or expired; otherwise mark as used\n    def set(self, key, value): ...          # TODO: store with an expiry; evict the LRU while over capacity\n\n    async def get_or_load(self, key, loader):\n        ...                                 # TODO: a hit, or one shared load per missing key\n"},{"lang":"javascript","src":"class Cache {\n  constructor(capacity, ttl, clock) {\n    this.capacity = capacity; this.ttl = ttl; this.clock = clock;\n    this.items = new Map();                 // key -> [value, expiresAt], least recently used first\n    this.inFlight = new Map();              // key -> the promise that is loading it\n    this.hits = 0; this.misses = 0; this.loads = 0;\n  }\n  get(key) { /* TODO: undefined if missing or expired; otherwise mark as used */ }\n  set(key, value) { /* TODO: store with an expiry; evict the LRU while over capacity */ }\n  async getOrLoad(key, loader) { /* TODO: a hit, or one shared load per missing key */ }\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"import asyncio, random\nfrom collections import OrderedDict\n\nclass Clock:                                        # a fake clock for TTLs\n    def __init__(self):\n        self.now = 0\n\nclass Cache:\n    \"\"\"LRU + TTL cache with single-flight loading: concurrent misses for one key share one load.\"\"\"\n    def __init__(self, capacity, ttl, clock):\n        self.capacity, self.ttl, self.clock = capacity, ttl, clock\n        self.items = OrderedDict()                  # key -> (value, expires_at), least recently used first\n        self.in_flight = {}                         # key -> the task that is loading it\n        self.hits = self.misses = self.loads = 0\n\n    def get(self, key):\n        item = self.items.get(key)\n        if item is None or item[1] <= self.clock.now:\
