gative cycle shows up as some d[i][i] < 0.","**Transitive closure**: the same triple loop on booleans, reach[i][j] = reach[i][j] or (reach[i][k] and reach[k][j]), answers “can i reach j?” for every pair (Course Schedule IV) in O(V³) time.","**Minimum spanning tree (MST)**: V − 1 edges that connect every vertex of a connected, undirected, weighted graph with the least total weight. **Cut property**: split the vertices into two groups in any way; a lightest edge crossing the split belongs to some MST. Kruskal (L2, module 07) applies it to the cheapest remaining edge, with union-find, in O(E log E).","**Prim's algorithm** grows one tree from any vertex, always adding the cheapest edge that leaves the tree (the cut property with the tree as one side). With a heap and lazy deletion: O(E log V) time and O(V + E) space. On dense graphs (E close to V²), the array version, which scans for the closest vertex outside the tree, is O(V²) and wins.","**An MST is not a shortest-path tree**: an MST minimises the total weight of its edges; a shortest-path tree (Dijkstra's parent links) minimises each vertex's distance from one source. In a triangle with A–B 2, B–C 2 and A–C 3, the MST is A–B + B–C (total 4), yet the shortest path from A to C is the direct edge (3, not 4)."],"dia":[{"type":"graph","cap":"Bellman–Ford from 0: a negative edge, and a cycle that would turn negative","directed":true,"h":220,"nodes":[["0",6,30],["1",34,8],["2",34,52],["3",64,8],["4",92,30],["5",6,54]],"edges":[["0","1","4"],["0","2","5"],["2","1","−3"],["1","3","2"],["3","4","1"],["2","4","6"],["5","0","1"]],"hl":["0"],"hle":[["0","2"],["2","1"],["1","3"],["3","4"]],"note":"Distances from 0: 0 2 5 4 5, and 5 is unreachable. Through the −3 edge, 0 → 2 → 1 (cost 2) beats 0 → 1 (cost 4). A Dijkstra that never revisits a popped vertex would pop 1 at 4 and leave 3 at 6 and 4 at 7. Adding an edge 4 → 2 of weight −7 closes the cycle 2 → 1 → 3 → 4 → 2 with total −7: the second graph in the first code block."},{"type":"cells","cap":"Floyd–Warshall's final matrix for the second code block (row = from, column = to)","rows":[{"label":"from 0","vals":[0,4,2,3],"ok":[0]},{"label":"from 1","vals":[1,0,"−2","−1"],"ok":[1],"hl":[2,3]},{"label":"from 2","vals":[3,7,0,1],"ok":[2]},{"label":"from 3","vals":["∞","∞","∞",0],"ok":[3],"dim":[0,1,2]}],"note":"Row 1 uses the negative edge 1 → 2: 1 → 2 → 3 costs −1. Row 3 is ∞ except for itself, because 3 has no outgoing edges. Every diagonal entry is 0, so there's no negative cycle."},{"type":"graph","cap":"Prim from 0 on the L2 Kruskal graph: the same MST, total 11","h":200,"nodes":[["0",8,30],["1",36,8],["2",36,52],["3",66,52],["4",92,30]],"edges":[["0","1","4"],["1","2","1"],["0","2","3"],["2","3","2"],["3","4","5"],["1","4","7"],["2","4","6"]],"hl":["0"],"hle":[["0","2"],["2","1"],["2","3"],["3","4"]],"note":"Prim adds 0–2 (3), 2–1 (1), 2–3 (2), then 3–4 (5); Kruskal took the same edges in weight order (1–2, 2–3, 0–2, 3–4). The shortest path from 0 to 4 is 0 → 2 → 4 (cost 9) and uses edge 2–4, which isn't in the MST; the MST's route 0 → 2 → 3 → 4 costs 10."}],"cmp":[{"cap":"Shortest-path algorithms side by side","head":["","Dijkstra (heap)","Bellman–Ford","Floyd–Warshall"],"rows":[["Answers","One source to every vertex","One source to every vertex","Every pair"],["Negative edges","No","Yes","Yes"],["Negative cycles","Not allowed (no negative edges at all)","Detects one reachable from the source","Detects any: some d[i][i] < 0"],["Time","O((V + E) log V)","O(V · E)","O(V³)"],["Extra space","O(V + E)","O(V)","O(V²)"],["Sweet spot","Large sparse graphs, weights ≥ 0","Negative edges; “at most k edges”","Up to a few hundred vertices; transitive closure"]]},{"cap":"Prim or Kruskal?","head":["","Prim (heap)","Prim (array)","Kruskal (L2)"],"rows":[["Idea","Grow one tree; add the cheapest edge leaving it","The same, scanning an array for the closest vertex outside the tree","Sort all the edges; keep each one that joins two components"],["Data structure","Min-heap with lazy deletion","Two arrays of size V","Union-find"],["Time","O(E log V)","O(V²)","O(E log E)"],["Best for","Sparse graphs as adjacency lists","Dense graphs, E close to V²","Edge lists; on a disconnected graph it gives a minimum spanning forest"]]}],"code":[{"t":"The heap helper used by Prim's algorithm below","tabs":[{"lang":"python","src":"import heapq                                  # a min-heap on a plain list\n"},{"lang":"javascript","src":"class MinHeap {                               // JavaScript has no built-in heap\n  constructor(less) { this.a = []; this.less = less; }   // less(a, b): should a come out before b?\n  get size() { return this.a.length; }\n  peek() { return this.a[0]; }\n  push(x) {                                   // O(log n): sift up\n    const a = this.a;\n    a.push(x);\n    let i = a.length - 1;\n    while (i > 0) {\n      const p = (i - 1) >> 1;                 // parent index\n      if (!this.less(a[i], a[p])) break;\n      [a[i], a[p]] = [a[p], a[i]];\n      i = p;\n    }\n  }\n  pop() {                                     // O(log n): sift down\n    const a = this.a, top = a[0], last = a.pop();\n    if (a.length) {\n      a[0] = last;\n      let i = 0;\n      for (;;) {\n        const l = 2 * i + 1, r = l + 1;\n        let m = i;\n        if (l < a.length && this.less(a[l], a[m])) m = l;\n        if (r < a.length && this.less(a[r], a[m])) m = r;\n        if (m === i) break;\n        [a[i], a[m]] = [a[m], a[i]];\n        i = m;\n      }\n    }\n    return top;\n  }\n}\n"}]},{"t":"Bellman–Ford with negative-cycle detection","tabs":[{"lang":"python","src":"def bellman_ford(n, edges, src):\n    dist = [float(\"inf\")] * n\n    dist[src] = 0\n    for _ in range(n - 1):                        # V - 1 rounds\n        changed = False\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:             # inf + w stays inf: an unreached u changes nothing\n                dist[v] = dist[u] + w\n                changed = True\n        if not changed:\n            break                                 # a quiet round: every distance is final\n    for u, v, w in edges:                         # round V\n        if dist[u] + w < dist[v]:\n            return None                           # still improving: a reachable negative cycle\n    return dist\n\ndef show(dist):\n    if dist is None:\n        return \"negative cycle\"\n    return \" \".join(\"INF\" if d == float(\"inf\") else str(d) for d in dist)\n\nedges = [(0, 1, 4), (0, 2, 5), (2, 1, -3), (1, 3, 2), (3, 4, 1), (2, 4, 6), (5, 0, 1)]\nprint(show(bellman_ford(6, edges, 0)))\nprint(show(bellman_ford(6, edges + [(4, 2, -7)], 0)))\n","out":"0 2 5 4 5 INF\nnegative cycle\n","notes":[[7,"An unreached u has dist ∞, and ∞ + w is still ∞, so it never relaxes anything. With a finite stand-in such as `10**9` you'd need an explicit check, or `10**9 + (-3)` would look like an improvement."],[11,"If a whole round changes nothing, no later round can: stop early."],[14,"After V − 1 rounds every shortest path has been found, so any further improvement must come from a negative cycle."]]},{"lang":"javascript","src":"function bellmanFord(n, edges, src) {\n  const dist = new Array(n).fill(Infinity);\n  dist[src] = 0;\n  for (let round = 1; round < n; round++) {       // V - 1 rounds\n    let changed = false;\n    for (const [u, v, w] of edges) {\n      if (dist[u] + w < dist[v]) {                // Infinity + w stays Infinity\n        dist[v] = dist[u] + w;\n        changed = true;\n      }\n    }\n    if (!changed) break;                          // a quiet round: every distance is final\n  }\n  for (const [u, v, w] of edges) {                // round V\n    if (dist[u] + w < dist[v]) return null;       // still improving: a reachable negative cycle\n  }\n  return dist;\n}\n\nconst show = dist => (dist === null ? \"negative cycle\" : dist.map(d => (d === Infinity ? \"INF\" : d)).join(\" \"));\nconst edges = [[0, 1, 4], [0, 2, 5], [2, 1, -3], [1, 3, 2], [3, 4, 1], [2, 4, 6], [5, 0, 1]];\nconsole.log(show(bellmanFord(6, edges, 0)));\nconsole.log(show(bellmanFord(6, [...edges, [4, 2, -7]], 0)));\n","out":"0 2 5 4 5 INF\nnegative cycle\n","notes":[[7,"An unreached u has dist Infinity, and Infinity + w is still Infinity, so it never relaxes anything."],[12,"If a whole round changes nothing, no later round can: stop early."],[15,"After V − 1 rounds every shortest path has been found, so any further improvement must come from a negative cycle."]]}]},{"t":"Floyd–Warshall: every pair, with k outermost","tabs":[{"lang":"python","src":"def floyd_warshall(n, edges):\n    INF = float(\"inf\")\n    d = [[0 if i == j else INF for j in range(n)] for i in range(n)]\n    for u, v, w in edges:\n        d[u][v] = min(d[u][v], w)                 # keep the cheapest of repeated edges\n    for k in range(n):                            # allow k as a middle vertex: outermost\n        for i in range(n):\n            for j in range(n):\n                if d[i][k] + d[k][j] < d[i][j]:\n                    d[i][j] = d[i][k] + d[k][j]\n    return d\n\ndef has_negative_cycle(d):\n    return any(d[i][i] < 0 for i in range(len(d)))\n\nd = floyd_warshall(4, [(0, 1, 4), (1, 2, -2), (2, 0, 3), (0, 3, 8), (2, 3, 1)])\nfor row in d:\n    print(*(\"INF\" if x == float(\"inf\") else x for x in row))\nprint(\"negative cycle\" if has_negative_cycle(d) else \"no negative cycle\")\nprint(\"negative cycle\" if has_negative_cycle(floyd_warshall(3, [(0, 1, 1), (1, 2, -2), (2, 1, 1)])) else \"no negative cycle\")\n","out":"0 4 2 3\n1 0 -2 -1\n3 7 0 1\nINF INF INF 0\nno negative cycle\nnegative cycle\n","notes":[[6,"k is the outermost loop: after its pass, d[i][j] may use any of 0..k as middle vertices."],[14,"A negative cycle through i makes the round trip i → … → i cost less than 0."]]},{"lang":"javascript","src":"function floydWarshall(n, edges) {\n  const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : Infinity)));\n  for (const [u, v, w] of edges) d[u][v] = Math.min(d[u][v], w);   // keep the cheapest of repeated edges\n  for (let k = 0; k < n; k++)                     // allow k as a middle vertex: outermost\n    for (let i = 0; i < n; i++)\n      for (let j = 0; j < n; j++)\n        if (d[i][k] + d[k][j] < d[i][j]) d[i][j] = d[i][k] + d[k][j];\n  return d;\n}\n\nconst hasNegativeCycle = d => d.some((row, i) => row[i] < 0);\n\nconst d = floydWarshall(4, [[0, 1, 4], [1, 2, -2], [2, 0, 3], [0, 3, 8], [2, 3, 1]]);\nfor (const row of d) console.log(...row.map(x => (x === Infinity ? \"INF\" : x)));\nconsole.log(hasNegativeCycle(d) ? \"negative cycle\" : \"no negative cycle\");\nconsole.log(hasNegativeCycle(floydWarshall(3, [[0, 1, 1], [1, 2, -2], [2, 1, 1]])) ? \"negative cycle\" : \"no negative cycle\");\n","out":"0 4 2 3\n1 0 -2 -1\n3 7 0 1\nINF INF INF 0\nno negative cycle\nnegative cycle\n","notes":[[4,"k is the outermost loop: after its pass, d[i][j] may use any of 0..k as middle vertices."],[11,"A negative cycle through i makes the round trip i → … → i cost less than 0."]]}]},{"t":"Prim's MST with a heap (lazy deletion)","tabs":[{"lang":"python","src":"def prim(n, edges):                               # undirected edges (u, v, w); start at 0\n    graph = [[] for _ in range(n)]\n    for u, v, w in edges:\n        graph[u].append((w, v))\n        graph[v].append((w, u))\n    in_tree = [False] * n\n    heap = [(0, 0, -1)]                           # (edge weight, vertex, the tree vertex it hangs from)\n    total, chosen = 0, []\n    while heap:\n        w, u, frm = heapq.heappop(heap)\n        if in_tree[u]:\n            continue                              # stale: u already joined by a cheaper edge\n        in_tree[u] = True\n        total += w\n        if frm != -1:\n            chosen.append((frm, u))\n        for wv, v in graph[u]:\n            if not in_tree[v]:\n                heapq.heappush(heap, (wv, v, u))  # a candidate edge leaving the tree\n    return total, chosen\n\ntotal, chosen = prim(5, [(0, 1, 4), (1, 2, 1), (0, 2, 3), (2, 3, 2), (3, 4, 5), (1, 4, 7), (2, 4, 6)])\nprint(total, *(f\"{a}-{b}\" for a, b in chosen))\n","out":"11 0-2 2-1 2-3 3-4","notes":[[10,"Once stale pairs are skipped (next line), the popped edge is the cheapest one leaving the tree, so the cut property says it's safe to add."],[12,"Lazy deletion again: an edge whose far end has already joined the tree is skipped."]]},{"lang":"javascript","src":"function prim(n, edges) {                         // undirected edges [u, v, w]; start at 0\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v, w] of edges) {\n    graph[u].push([w, v]);\n    graph[v].push([w, u]);\n  }\n  const inTree = new Array(n).fill(false), chosen = [];\n  const heap = new MinHeap((a, b) => a[0] < b[0]);   // [edge weight, vertex, the tree vertex it hangs from]\n  heap.push([0, 0, -1]);\n  let total = 0;\n  while (heap.size) {\n    const [w, u, from] = heap.pop();\n    if (inTree[u]) continue;                      // stale: u already joined by a cheaper edge\n    inTree[u] = true;\n    total += w;\n    if (from !== -1) chosen.push([from, u]);\n    for (const [wv, v] of graph[u]) {\n      if (!inTree[v]) heap.push([wv, v, u]);      // a candidate edge leaving the tree\n    }\n  }\n  return [total, chosen];\n}\n\nconst [total, chosen] = prim(5, [[0, 1, 4], [1, 2, 1], [0, 2, 3], [2, 3, 2], [3, 4, 5], [1, 4, 7], [2, 4, 6]]);\nconsole.log(total, ...chosen.map(([a, b]) => `${a}-${b}`));\n","out":"11 0-2 2-1 2-3 3-4","notes":[[12,"Once stale pairs are skipped (next line), the popped edge is the cheapest one leaving the tree, so the cut property says it's safe to add."],[13,"Lazy deletion again: an edge whose far end has already joined the tree is skipped."]]}]}],"ex":{"q":"Flights `[from, to, price]` join n cities (every price ≥ 1). Find the cheapest price from src to dst using at most k stops, or −1 if there's no such route (LeetCode 787, Cheapest Flights Within K Stops).","steps":["Without the limit this is a plain shortest path. The limit is on edges: at most k stops means at most k + 1 flights.","If every round of Bellman–Ford adds exactly one more flight, then after round i the prices are the cheapest using at most i flights. So run exactly k + 1 rounds.","Each round must read a copy of the previous round's prices. In place, a price set early in a round can feed a later flight in the same round, so a route could gain several flights in one round and break the limit.","Dijkstra on the cities alone is wrong here: the cheapest route might have too many stops. Dijkstra over (city, flights used) states also works, with more code.","O((k + 1) · (n + E)) time (each round copies n prices and scans E flights) and O(n) extra space."],"code":{"t":"k + 1 rounds of Bellman–Ford, each reading a copy","tabs":[{"lang":"python","src":"def find_cheapest_price(n, flights, src, dst, k):\n    price = [float(\"inf\")] * n\n    price[src] = 0\n    for _ in range(k + 1):                        # at most k stops = at most k + 1 flights\n        prev = price[:]                           # read only last round's prices\n        for u, v, p in flights:\n            if prev[u] + p < price[v]:\n                price[v] = prev[u] + p\n    return price[dst] if price[dst] < float(\"inf\") else -1\n\nflights = [[0, 1, 100], [1, 2, 100], [2, 3, 100], [0, 3, 500], [1, 3, 300]]\nprint(*(find_cheapest_price(4, flights, 0, 3, k) for k in range(3)), find_cheapest_price(4, flights, 3, 0, 2))\n","out":"500 400 300 -1"},{"lang":"javascript","src":"function findCheapestPrice(n, flights, src, dst, k) {\n  const price = new Array(n).fill(Infinity);\n  price[src] = 0;\n  for (let round = 0; round <= k; round++) {      // at most k stops = at most k + 1 flights\n    const prev = [...price];                      // read only last round's prices\n    for (const [u, v, p] of flights) {\n      if (prev[u] + p < price[v]) price[v] = prev[u] + p;\n    }\n  }\n  return price[dst] < Infinity ? price[dst] : -1;\n}\n\nconst flights = [[0, 1, 100], [1, 2, 100], [2, 3, 100], [0, 3, 500], [1, 3, 300]];\nconsole.log(...[0, 1, 2].map(k => findCheapestPrice(4, flights, 0, 3, k)), findCheapestPrice(4, flights, 3, 0, 2));\n","out":"500 400 300 -1"}]},"a":"500, 400, 300 and −1. With no stops, only the direct flight 0 → 3 (500) is allowed; one stop allows 0 → 1 → 3 (400); two stops allow 0 → 1 → 2 → 3 (300). There are no flights out of city 3, so 3 → 0 is −1."},"fade":{"q":"n cities are joined by two-way roads `[u, v, weight]`. Return the city that can reach the fewest other cities within `distanceThreshold`; if several tie, return the one with the largest number (LeetCode 1334, Find the City With the Smallest Number of Neighbors at a Threshold Distance).","steps":["You need the distance between every pair of cities, and n ≤ 100, so Floyd–Warshall's O(n³), about 10⁶ steps, is fine.",{"ask":"Which loop must be outermost, and why?","a":"k, the middle city: after the pass for k, d[i][j] may use any of cities 0..k in the middle, and each pass builds on the previous pass being complete for every pair."},{"ask":"How do you return the largest city number on a tie?","a":"Scan i upwards and take a city whenever its count is ≤ the best so far (≤, not <), so a later, larger city wins a tie. Or scan downwards with <."},{"ask":"Time and space?","a":"O(n³) time and O(n²) space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def find_the_city(n, edges, distance_threshold):\n    INF = float(\"inf\")\n    d = [[0 if i == j else INF for j in range(n)] for i in range(n)]\n    for u, v, w in edges:                         # two-way roads\n        d[u][v] = d[v][u] = w\n    ...                                           # TODO: Floyd-Warshall with k outermost\n    best_city, best_count = -1, n\n    ...                                           # TODO: count each city's reachable cities; a tie goes to the larger city\n    return best_city\n"},{"lang":"javascript","src":"function findTheCity(n, edges, distanceThreshold) {\n  const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : Infinity)));\n  for (const [u, v, w] of edges) d[u][v] = d[v][u] = w;   // two-way roads\n  // TODO: Floyd-Warshall with k outermost\n  let bestCity = -1, bestCount = n;\n  // TODO: count each city's reachable cities; a tie goes to the larger city\n  return bestCity;\n}\n"}]},"solution":{"t":"Solution: Floyd–Warshall, then count","tabs":[{"lang":"python","src":"def find_the_city(n, edges, distance_threshold):\n    INF = float(\"inf\")\n    d = [[0 if i == j else INF for j in range(n)] for i in range(n)]\n    for u, v, w in edges:                         # two-way roads\n        d[u][v] = d[v][u] = w\n    for k in range(n):                            # k outermost\n        for i in range(n):\n            for j in range(n):\n                if d[i][k] + d[k][j] < d[i][j]:\n                    d[i][j] = d[i][k] + d[k][j]\n    best_city, best_count = -1, n\n    for i in range(n):\n        count = sum(1 for j in range(n) if j != i and d[i][j] <= distance_threshold)\n        if count <= best_count:                   # <=: a later, larger city wins a tie\n            best_city, best_count = i, count\n    return best_city\n\nprint(find_the_city(4, [[0, 1, 1], [1, 2, 5], [2, 3, 1]], 2),\n      find_the_city(5, [[0, 1, 2], [1, 2, 2], [2, 3, 2], [3, 4, 1]], 3))\n","out":"3 0"},{"lang":"javascript","src":"function findTheCity(n, edges, distanceThreshold) {\n  const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : Infinity)));\n  for (const [u, v, w] of edges) d[u][v] = d[v][u] = w;   // two-way roads\n  for (let k = 0; k < n; k++)                     // k outermost\n    for (let i = 0; i < n; i++)\n      for (let j = 0; j < n; j++)\n        if (d[i][k] + d[k][j] < d[i][j]) d[i][j] = d[i][k] + d[k][j];\n  let bestCity = -1, bestCount = n;\n  for (let i = 0; i < n; i++) {\n    const count = d[i].filter((x, j) => j !== i && x <= distanceThreshold).length;\n    if (count <= bestCount) {                     // <=: a later, larger city wins a tie\n      bestCity = i;\n      bestCount = count;\n    }\n  }\n  return bestCity;\n}\n\nconsole.log(findTheCity(4, [[0, 1, 1], [1, 2, 5], [2, 3, 1]], 2),\n            findTheCity(5, [[0, 1, 2], [1, 2, 2], [2, 3, 2], [3, 4, 1]], 3));\n","out":"3 0"}]}},"traps":[["“For at most k flights, relaxing in place is fine.”","In place, a price set earlier in a round can be reused later in the same round, so one round can add several flights. Read from a copy of the previous round's prices, and run exactly k + 1 rounds."],["“Floyd–Warshall's three loops can go in any order.”","k, the allowed middle vertex, must be outermost: each pass needs the previous pass finished for every pair. Only the order of i and j inside is free."],["“A big number like 10**9 is a safe ∞.”","With negative edges, `10**9 + (-5) < 10**9`, so a vertex that was never reached seems to improve its neighbours. Use `float('inf')` / `Infinity`, where ∞ + w stays ∞, or skip any u whose distance is still the stand-in."],["“An MST gives the shortest path from the root to every vertex.”","An MST minimises the total weight of all its edges, not each distance. In the triangle A–B 2, B–C 2, A–C 3, the MST route from A to C costs 4, but the direct edge costs 3."],["“A Bellman–Ford run from one source finds every negative cycle.”","Only the cycles it can reach. To check the whole graph, start every dist at 0, as if a new source had a 0-weight edge to every vertex."],["“Prim's and Kruskal's algorithms need non-negative weights.”","They only compare weights, so negative weights are fine. Adding a constant c to every weight adds (V − 1) × c to every spanning tree, so the cheapest tree stays the cheapest."]],"disc":[["Why does the k-stops problem need a copy, when plain Bellman–Ford doesn't?","Plain Bellman–Ford only needs each dist to be the cost of some real route, and in-place updates just find cheap routes sooner. With a limit, round i must mean “at most i edges”. In place, a price set through edge a → b can feed edge b → c in the same round, so a route gains two edges in one round. Reading from a copy makes each round add exactly one edge."],["When would you pick Floyd–Warshall over running Dijkstra from every vertex?","Floyd–Warshall is O(V³) with tiny constants, allows negative edges and is a few lines, so it's ideal up to a few hundred vertices or on dense graphs. V runs of Dijkstra cost O(V (V + E) log V), better for large sparse graphs with weights ≥ 0. With negative edges on a large sparse graph, Johnson's algorithm reweights the edges using one Bellman–Ford run, then runs Dijkstra from every vertex."]],"teach":{"prompt":"Explain to a junior colleague how Bellman–Ford finds shortest paths with negative edges, how it detects a negative cycle, and what changes for “at most k edges”.","rubric":["Each round relaxes every edge; V − 1 rounds, because a shortest path needs at most V − 1 edges","Stop early when a round changes nothing","A V-th round that still improves something means a reachable negative cycle","At most k edges: exactly k rounds, each reading a copy of the previous round","O(V · E) time and O(V) extra space"],"model":"Bellman–Ford starts with dist = 0 at the source and ∞ elsewhere, then relaxes every edge in rounds: for each edge u → v of weight w, if dist[u] + w < dist[v], it lowers dist[v]. After round i, every vertex with a shortest path of at most i edges has its final distance. Without a negative cycle every vertex has a shortest path of at most V − 1 edges, so V − 1 rounds are enough, and a round that changes nothing means you can stop early. If a V-th round still lowers something, a negative cycle is reachable from the source and some distances have no minimum. For “at most k edges”, run exactly k rounds and read dist[u] from a copy of the previous round, because in place one round can extend a path by several edges. It costs O(V · E) time and O(V) extra space."},"qa":[["Bellman–Ford: time and extra space?","O(V · E) time and O(V) extra space."],["How does Bellman–Ford detect a negative cycle?","If a V-th round still lowers some distance, a negative cycle is reachable from the source."],["Why does the “at most k edges” variant read a copy?","So each round adds exactly one edge; in place, one round can add several."],["Floyd–Warshall's update, and which loop is outermost?","d[i][j] = min(d[i][j], d[i][k] + d[k][j]), with k outermost."],["What is the cut property?","For any split of the vertices into two groups, a lightest edge crossing the split belongs to some MST."],["Prim's algorithm: heap version and dense version?","O(E log V) with a heap and lazy deletion; O(V²) with arrays, better when E is close to V²."]],"quiz":[{"q":"What does this print?","snip":{"t":"In place or from a copy? (k = 0: one round)","tabs":[{"lang":"python","src":"flights = [(0, 1, 100), (1, 2, 100), (2, 3, 100), (0, 3, 500)]\nINF = float(\"inf\")\na = [0, INF, INF, INF]                    # relaxed in place\nb = [0, INF, INF, INF]                    # relaxed from a copy\nprev = b[:]\nfor u, v, p in flights:\n    a[v] = min(a[v], a[u] + p)\n    b[v] = min(b[v], prev[u] + p)\nprint(a[3], b[3])\n"},{"lang":"javascript","src":"const flights = [[0, 1, 100], [1, 2, 100], [2, 3, 100], [0, 3, 500]];\nconst a = [0, Infinity, Infinity, Infinity];   // relaxed in place\nconst b = [0, Infinity, Infinity, Infinity];   // relaxed from a copy\nconst prev = [...b];\nfor (const [u, v, p] of flights) {\n  a[v] = Math.min(a[v], a[u] + p);\n  b[v] = Math.min(b[v], prev[u] + p);\n}\nconsole.log(a[3], b[3]);\n"}]},"o":["300 500","500 500","300 300","500 300"],"a":0,"e":"In place, a[1] = 100 is used straight away for 1 → 2, then a[2] for 2 → 3: one round took three flights, so a[3] = 300. The copy only allows routes of one flight: b[3] = 500, the direct flight. With k = 0, 500 is right."},{"q":"What does this print?","snip":{"t":"How many rounds until a quiet one?","tabs":[{"lang":"python","src":"def rounds_needed(n, edges):\n    dist = [0] + [float(\"inf\")] * (n - 1)\n    rounds = 0\n    for _ in range(n - 1):\n        rounds += 1\n        changed = False\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                changed = True\n        if not changed:\n            break\n    return rounds\n\nchain = [(0, 1, 1), (1, 2, 1), (2, 3, 1), (3, 4, 1)]\nprint(rounds_needed(5, chain), rounds_needed(5, chain[::-1]))\n"},{"lang":"javascript","src":"function roundsNeeded(n, edges) {\n  const dist = [0, ...new Array(n - 1).fill(Infinity)];\n  let rounds = 0;\n  for (let r = 0; r < n - 1; r++) {\n    rounds++;\n    let changed = false;\n    for (const [u, v, w] of edges) {\n      if (dist[u] + w < dist[v]) {\n        dist[v] = dist[u] + w;\n        changed = true;\n      }\n    }\n    if (!changed) break;\n  }\n  return rounds;\n}\n\nconst chain = [[0, 1, 1], [1, 2, 1], [2, 3, 1], [3, 4, 1]];\nconsole.log(roundsNeeded(5, chain), roundsNeeded(5, chain.toReversed()));\n"}]},"o":["2 4","1 4","4 4","2 5"],"a":0,"e":"In path order, one round sets every distance and the second round is quiet, so it stops at 2. In reverse order each round reaches only one more vertex, so it needs all V − 1 = 4 rounds, and the loop never runs a fifth."},{"q":"Why must k be the outermost loop in Floyd–Warshall?","o":["After the pass for k, d[i][j] is the shortest path using only vertices 0..k in the middle, and that pass needs the previous pass finished for every pair","Putting k outermost is only faster; any loop order gives the same distances","k must be outermost so that negative edges are handled","The order doesn't matter as long as i comes before j"],"a":0,"e":"With i or j outermost, some d[i][k] or d[k][j] is read before it has been improved by the vertices it needs, so some distances come out too big. With k outermost, the order of i and j inside is free."},{"q":"Which of these stay correct when some edge weights are negative (but there's no negative cycle)? (choose 3)","t":"ms","o":["Bellman–Ford","Floyd–Warshall","Prim's minimum spanning tree algorithm","Dijkstra's algorithm that never revisits a popped vertex","BFS counting edges"],"a":[0,1,2],"e":"Bellman–Ford and Floyd–Warshall only ever take minimums of real path costs. Prim's (and Kruskal's) algorithm only compares weights, so negative weights are fine for MSTs. Dijkstra's “popped means final” needs weights ≥ 0, and BFS ignores weights altogether."},{"q":"Judge each statement.","t":"yn","s":[["Bellman–Ford can stop as soon as a whole round changes nothing.",true],["After Floyd–Warshall, some d[i][i] < 0 means the graph has a negative cycle.",true],["A minimum spanning tree contains a shortest path from any one vertex to every other.",false],["For “at most k flights”, relaxing in place is fine because it only ever lowers prices.",false]],"e":"A quiet round means every edge is already satisfied. A negative d[i][i] is a round trip that costs less than nothing. An MST minimises total weight, not each distance (the triangle A–B 2, B–C 2, A–C 3). In place, a lower price can come from a route with too many flights."},{"q":"Put Bellman–Ford with negative-cycle detection in order.","t":"ord","items":["Set dist[source] = 0 and every other dist to ∞","Relax every edge once: one round","Repeat the rounds, up to V − 1 in total, stopping early if a round changes nothing","Run one more round over every edge","If anything still improves, report a negative cycle; otherwise dist holds the shortest distances"],"e":"The extra round only means something after the V − 1 rounds, and its result decides the answer."},{"q":"Complete this JavaScript Floyd–Warshall with negative-cycle detection.","t":"drop","lang":"javascript","code":"function floydWarshall(n, edges) {\n  const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? {{0}} : Infinity)));\n  for (const [u, v, w] of edges) d[u][v] = Math.min(d[u][v], w);\n  for (let k = 0; k < n; k++)\n    for (let i = 0; i < n; i++)\n      for (let j = 0; j < n; j++)\n        d[i][j] = Math.min(d[i][j], {{1}});\n  const negativeCycle = d.some((row, i) => row[i] {{2}} 0);\n  return [d, negativeCycle];\n}\n","blanks":[{"o":["0","Infinity","-1","1"],"a":0},{"o":["d[i][k] + d[k][j]","d[i][k] + d[j][k]","d[k][i] + d[k][j]","d[i][j] + d[k][k]"],"a":0},{"o":["<","<=","===",">"],"a":0}],"e":"The diagonal starts at 0 (staying put is free), the update goes i → k → j, and a negative cycle shows up as a diagonal entry below 0. Any other start for the diagonal or other comparison flags the wrong graphs."},{"q":"Match each task to the technique.","t":"match","pairs":[["One source, some negative edges","Bellman–Ford: V − 1 rounds, then one check round"],["Every pair of distances, V ≤ 400","Floyd–Warshall"],["The cheapest cable network linking every office","A minimum spanning tree (Prim or Kruskal)"],["The cheapest flight with at most k legs","k rounds of relaxation, each reading a copy"]],"extra":["Binary search on the answer"],"e":"Negative edges need Bellman–Ford; all pairs on a small graph is Floyd–Warshall; connecting everything cheaply is an MST; an edge limit is Bellman–Ford with a copy per round."}],"probs":[["LC 787 · Cheapest Flights Within K Stops","https://leetcode.com/problems/cheapest-flights-within-k-stops/","Medium","k + 1 rounds of Bellman–Ford, each reading a copy of the previous round"],["LC 1334 · Find the City With the Smallest Number of Neighbors at a Threshold Distance","https://leetcode.com/problems/find-the-city-with-the-smallest-number-of-neighbors-at-a-threshold-distance/","Medium","Floyd–Warshall, then count per city; a tie goes to the larger index"],["LC 1462 · Course Schedule IV","https://leetcode.com/problems/course-schedule-iv/","Medium","transitive closure: Floyd–Warshall on booleans (or a BFS from every course)"],["LC 399 · Evaluate Division","https://leetcode.com/problems/evaluate-division/","Medium","edges a → b of weight a/b and b → a of b/a; multiply along a path (or Floyd–Warshall with × in place of +)"],["LC 1489 · Find Critical and Pseudo-Critical Edges in Minimum Spanning Tree","https://leetcode.com/problems/find-critical-and-pseudo-critical-edges-in-minimum-spanning-tree/","Hard","find the MST weight; an edge is critical if leaving it out raises the weight (or disconnects), pseudo-critical if forcing it in keeps the weight"]],"src":[["cp-algorithms: Bellman–Ford algorithm","https://cp-algorithms.com/graph/bellman_ford.html"],["cp-algorithms: Floyd–Warshall algorithm","https://cp-algorithms.com/graph/all-pair-shortest-path-floyd-warshall.html"],["cp-algorithms: Minimum spanning tree, Prim's algorithm","https://cp-algorithms.com/graph/mst_prim.html"],["Wikipedia: Minimum spanning tree","https://en.wikipedia.org/wiki/Minimum_spanning_tree"]]},{"id":"m03","d":"d1","t":"Bridges, articulation points and Euler paths","min":110,"hook":"Which single cable, road or server can fail and split a network in two? One DFS answers that for every edge and every vertex at once. The opposite question, a route that uses every road exactly once (a postman's round, a chain of dominoes, a ticket itinerary), has a neat linear-time answer too.","pre":{"q":"On a town's road map, which roads would cut the town in two if they were closed? Is there anything faster than closing each road in turn and checking whether the town is still connected?","a":"Yes: one DFS. A road can only split the town if it lies on no loop. While exploring, record when each junction was first reached and how early its part of the search tree can reach back through a shortcut. If the junctions below a road can't reach back to the road's upper end or above it, the road is critical. That's O(V + E) instead of O(E · (V + E))."},"kid":{"t":"Stickers on the toy railway","x":"Tara and Ben build a toy railway across the toy room. Ben explores it, sticking a number on each station the first time he reaches it: 1, 2, 3… When a track leads to a station that already has a number, he notes that number: it's a shortcut back. Then each station asks: “from me, or any station Ben reached through me, what's the smallest number we can get back to with one shortcut?” If the stations behind a track can't get back to the track's near end or earlier, that track is a bridge: lift it out and the railway falls into two pieces.","map":[["A number stuck on each station when Ben first reaches it","tin[v], the DFS discovery time"],["A track to a station that already has a number","A back edge: an edge to a vertex the DFS has already visited"],["The smallest number a station, or any station reached through it, can get back to with one shortcut","low[v] = the smallest tin reachable from v's DFS subtree with one back edge"],["The stations behind a track can't get back to its near end or earlier","low[v] > tin[u]: the tree edge u–v is a bridge"],["Lifting that track splits the railway in two","Removing a bridge disconnects the graph"]],"brk":"Ben counts every track to a numbered station as a shortcut, even the track he has just arrived along. Code must skip that one track, or every station could reach back to its parent and no track would ever look like a bridge. It skips it by its edge id, not by “the station I came from”, so a second, parallel track still counts as a real shortcut."},"keys":["**The DFS tree**: a DFS uses some edges to reach new vertices (tree edges). In an undirected graph every other edge joins a vertex to one of its ancestors (a back edge); there are no edges across between separate branches.","**tin and low**: tin[v] is when the DFS first reached v. low[v] is the smallest tin that v's subtree can reach with one back edge: low[v] = min(tin[v], tin[w] for each back edge v–w, low[c] for each child c).","**Bridge**: a tree edge u–v (u the parent) is a bridge exactly when low[v] > tin[u]: nothing under v can get back to u or above without it. A bridge lies on no cycle, so back edges are never bridges.","**Articulation point** (cut vertex): a non-root u is one when some child v has low[v] ≥ tin[u]. The root is one when it has two or more DFS children.","**Repeated edges**: give every edge an id and skip only the edge you arrived by, not every edge back to the parent. Two parallel edges between u and v form a cycle, so neither is a bridge. O(V + E) time and space.","**Go iterative**: Python's default recursion limit is 1,000 frames and LeetCode 1192 allows 10⁵ vertices; Node's default call stack also overflows long before 10⁵ nested calls. Keep an explicit stack of (vertex, arriving edge id, next neighbour index), and when a vertex is popped, fold its low into its parent's.","**Euler path or circuit** (every edge exactly once): all edges must be in one connected piece. Undirected: 0 odd-degree vertices (a circuit) or exactly 2 (a path between them). Directed: either every vertex has in = out (a circuit), or the start has out − in = 1, the end has in − out = 1 and the rest are balanced (a path).","**Hierholzer's algorithm**: walk from the start using up edges; when the top vertex has no unused edge left, pop it onto the answer; reverse at the end. With an explicit stack and each vertex's list of unused edges it's O(V + E) time and space. For the lexicographically smallest route (Reconstruct Itinerary), take each vertex's neighbours in sorted order: O(E log E)."],"dia":[{"type":"graph","cap":"Bridges and cut vertices (the first code example)","h":200,"nodes":[["0",6,14],["1",6,46],["2",24,30],["3",44,30],["4",62,30],["5",80,30],["6",96,12],["7",96,48]],"edges":[["0","1"],["1","2"],["2","0"],["2","3"],["3","4","×2"],["4","5"],["5","6"],["6","7"],["7","5"]],"hl":["2","3","4","5"],"hle":[["2","3"],["4","5"]],"note":"The bridges (highlighted) are 2–3 and 4–5; the cut vertices (highlighted) are 2, 3, 4 and 5. The two parallel edges 3–4 form a cycle of length 2, so neither is a bridge, yet 3 and 4 are still cut vertices."},{"type":"cells","cap":"tin and low for that graph (DFS from 0, neighbours in edge order)","rows":[{"label":"tin","vals":[0,1,2,3,4,5,6,7]},{"label":"low","vals":[0,0,0,3,3,5,5,5],"hl":[3,5]}],"note":"low[3] = 3 > tin[2] = 2, so 2–3 is a bridge; low[5] = 5 > tin[4] = 4, so 4–5 is a bridge. The second 3–4 edge lets 4 reach back to 3, so low[4] = 3 = tin[3]: 3–4 is not a bridge, but low[4] ≥ tin[3] makes 3 a cut vertex."},{"type":"graph","cap":"Hierholzer from S, smallest neighbour first","directed":true,"h":200,"nodes":[["S",6,30],["A",36,30],["B",36,52],["C",68,8],["D",68,50]],"edges":[["S","A","1"],["A","C","2"],["C","D","3"],["D","A","4"],["A","B","5"]],"hl":["S","B"],"note":"S has out − in = 1, so the path starts there. The first walk S → A → B takes A's smallest neighbour and gets stuck at B with the loop A → C → D → A unused. Backing up, A still has an edge, so the loop is walked and spliced in before B. The numbers give the order in the final path: S A C D A B."}],"cmp":[{"cap":"Bridges or articulation points?","head":["","Bridge (cut edge)","Articulation point (cut vertex)"],"rows":[["Removing it…","One edge: the graph splits","A vertex and its edges: the graph splits"],["Test (u the DFS parent of v)","low[v] > tin[u]","low[v] ≥ tin[u] for some child v (u not the root)"],["The DFS root","No special case","A cut vertex only with 2+ DFS children"],["Repeated edges","Two parallel edges are never bridges: skip by edge id","They don't change which vertices are cut vertices"],["Cost","O(V + E) time and space","O(V + E) time and space"]]},{"cap":"Euler path or circuit?","head":["","Undirected","Directed"],"rows":[["Circuit (ends where it starts)","Every vertex has even degree","Every vertex has in = out"],["Path (not a circuit)","Exactly 2 odd-degree vertices: start at one, end at the other","Start: out − in = 1; end: in − out = 1; the rest balanced"],["Also needed","All edges in one connected piece","All edges in one weakly connected piece"],["Build it","Hierholzer, marking each edge used once (both directions share one id)","Hierholzer, popping from each vertex's out-list"],["Cost","O(V + E)","O(V + E), or O(E log E) for the lexicographically smallest"]]}],"code":[{"t":"Bridges and articulation points (recursive, for small graphs)","tabs":[{"lang":"python","src":"def bridges_and_cuts(n, edges):\n    graph = [[] for _ in range(n)]\n    for i, (u, v) in enumerate(edges):\n        graph[u].append((v, i))                   # (neighbour, edge id)\n        graph[v].append((u, i))\n    tin, low = [-1] * n, [0] * n\n    bridges, cuts, timer = [], set(), 0\n\n    def dfs(u, in_edge):\n        nonlocal timer\n        tin[u] = low[u] = timer\n        timer += 1\n        children = 0\n        for v, eid in graph[u]:\n            if eid == in_edge:\n                continue                          # skip only the edge we arrived by\n            if tin[v] != -1:\n                low[u] = min(low[u], tin[v])      # a back edge\n            else:\n                children += 1\n                dfs(v, eid)\n                low[u] = min(low[u], low[v])\n                if low[v] > tin[u]:\n                    bridges.append((min(u, v), max(u, v)))\n                if in_edge != -1 and low[v] >= tin[u]:\n                    cuts.add(u)                   # v's subtree can't get above u\n        if in_edge == -1 and children >= 2:\n            cuts.add(u)                           # a root with 2+ DFS children\n    for s in range(n):\n        if tin[s] == -1:\n            dfs(s, -1)\n    return sorted(bridges), sorted(cuts)\n\nbridges, cuts = bridges_and_cuts(8, [(0, 1), (1, 2), (2, 0), (2, 3), (3, 4), (3, 4), (4, 5), (5, 6), (6, 7), (7, 5)])\nprint(\"bridges:\", *(f\"{a}-{b}\" for a, b in bridges), \"| cut vertices:\", *cuts)\n","out":"bridges: 2-3 4-5 | cut vertices: 2 3 4 5","notes":[[15,"Skip by edge id, not by parent vertex: the second 3–4 edge must still count as a back edge."],[23,"Nothing under v reaches u or above without this edge, so u–v is a bridge."],[26,"v's subtree can't get past u, so removing u cuts it off. The root is excluded: low[v] ≥ tin[root] is always true."]]},{"lang":"javascript","src":"function bridgesAndCuts(n, edges) {\n  const graph = Array.from({ length: n }, () => []);\n  edges.forEach(([u, v], i) => {\n    graph[u].push([v, i]);                        // [neighbour, edge id]\n    graph[v].push([u, i]);\n  });\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), bridges = [], cuts = new Set();\n  let timer = 0;\n  const dfs = (u, inEdge) => {\n    tin[u] = low[u] = timer++;\n    let children = 0;\n    for (const [v, id] of graph[u]) {\n      if (id === inEdge) continue;                // skip only the edge we arrived by\n      if (tin[v] !== -1) low[u] = Math.min(low[u], tin[v]);   // a back edge\n      else {\n        children++;\n        dfs(v, id);\n        low[u] = Math.min(low[u], low[v]);\n        if (low[v] > tin[u]) bridges.push([Math.min(u, v), Math.max(u, v)]);\n        if (inEdge !== -1 && low[v] >= tin[u]) cuts.add(u);   // v's subtree can't get above u\n      }\n    }\n    if (inEdge === -1 && children >= 2) cuts.add(u);          // a root with 2+ DFS children\n  };\n  for (let s = 0; s < n; s++) if (tin[s] === -1) dfs(s, -1);\n  return [bridges.sort((a, b) => a[0] - b[0] || a[1] - b[1]), [...cuts].sort((a, b) => a - b)];\n}\n\nconst [bridges, cuts] = bridgesAndCuts(8, [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4], [3, 4], [4, 5], [5, 6], [6, 7], [7, 5]]);\nconsole.log(\"bridges:\", ...bridges.map(([a, b]) => `${a}-${b}`), \"| cut vertices:\", ...cuts);\n","out":"bridges: 2-3 4-5 | cut vertices: 2 3 4 5","notes":[[13,"Skip by edge id, not by parent vertex: the second 3–4 edge must still count as a back edge."],[19,"Nothing under v reaches u or above without this edge, so u–v is a bridge."],[20,"v's subtree can't get past u, so removing u cuts it off. The root is excluded: low[v] ≥ tin[root] is always true."]]}]},{"t":"The iterative version: 100,000 vertices in a row, no overflow","tabs":[{"lang":"python","src":"def find_bridges(n, edges):                       # low-link with an explicit stack\n    graph = [[] for _ in range(n)]\n    for i, (u, v) in enumerate(edges):\n        graph[u].append((v, i))\n        graph[v].append((u, i))\n    tin, low, timer, bridges = [-1] * n, [0] * n, 0, []\n    for root in range(n):\n        if tin[root] != -1:\n            continue\n        tin[root] = low[root] = timer\n        timer += 1\n        stack = [[root, -1, 0]]                   # frames: [vertex, arriving edge id, next neighbour index]\n        while stack:\n            u, in_edge, i = stack[-1]\n            if i < len(graph[u]):                 # u has a neighbour left to look at\n                stack[-1][2] += 1\n                v, eid = graph[u][i]\n                if eid == in_edge:\n                    continue\n                if tin[v] != -1:\n                    low[u] = min(low[u], tin[v])  # a back edge\n                else:\n                    tin[v] = low[v] = timer\n                    timer += 1\n                    stack.append([v, eid, 0])     # instead of a recursive call\n            else:\n                stack.pop()                       # u is finished: hand its low to the parent\n                if stack:\n                    p = stack[-1][0]\n                    low[p] = min(low[p], low[u])\n                    if low[u] > tin[p]:\n                        bridges.append((p, u))\n    return bridges\n\nprint(len(find_bridges(100_000, [(i, i + 1) for i in range(99_999)])))\n","out":"99999","notes":[[12,"Each frame remembers where u's neighbour loop had got to, exactly what a recursive call keeps on the call stack."],[25,"Pushing a frame replaces the recursive call. On this path a recursive DFS would be 100,000 calls deep: far past Python's default limit of 1,000 (RecursionError)."],[27,"Popping a finished vertex is the “return”: its parent folds in its low and tests the edge between them."]]},{"lang":"javascript","src":"function findBridges(n, edges) {                  // low-link with an explicit stack\n  const graph = Array.from({ length: n }, () => []);\n  edges.forEach(([u, v], i) => { graph[u].push([v, i]); graph[v].push([u, i]); });\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), bridges = [];\n  let timer = 0;\n  for (let root = 0; root < n; root++) {\n    if (tin[root] !== -1) continue;\n    tin[root] = low[root] = timer++;\n    const stack = [[root, -1, 0]];                // frames: [vertex, arriving edge id, next neighbour index]\n    while (stack.length) {\n      const frame = stack.at(-1), [u, inEdge, i] = frame;\n      if (i < graph[u].length) {                  // u has a neighbour left to look at\n        frame[2]++;\n        const [v, id] = graph[u][i];\n        if (id === inEdge) continue;\n        if (tin[v] !== -1) low[u] = Math.min(low[u], tin[v]);   // a back edge\n        else {\n          tin[v] = low[v] = timer++;\n          stack.push([v, id, 0]);                 // instead of a recursive call\n        }\n      } else {\n        stack.pop();                              // u is finished: hand its low to the parent\n        if (stack.length) {\n          const p = stack.at(-1)[0];\n          low[p] = Math.min(low[p], low[u]);\n          if (low[u] > tin[p]) bridges.push([p, u]);\n        }\n      }\n    }\n  }\n  return bridges;\n}\n\nconsole.log(findBridges(100_000, Array.from({ length: 99_999 }, (_, i) => [i, i + 1])).length);\n","out":"99999","notes":[[9,"Each frame remembers where u's neighbour loop had got to, exactly what a recursive call keeps on the call stack."],[19,"Pushing a frame replaces the recursive call. On this path a recursive DFS would be 100,000 calls deep; Node's default call stack overflows long before that (RangeError)."],[22,"Popping a finished vertex is the “return”: its parent folds in its low and tests the edge between them."]]}]},{"t":"Hierholzer's algorithm: a directed Euler path","tabs":[{"lang":"python","src":"def euler_path(edges):                            # directed edges (u, v); assumes an Euler path exists\n    graph, bal = {}, {}\n    for u, v in edges:\n        graph.setdefault(u, []).append(v)\n        graph.setdefault(v, [])\n        bal[u] = bal.get(u, 0) + 1                # out - in\n        bal[v] = bal.get(v, 0) - 1\n    start = next((x for x in graph if bal[x] == 1), edges[0][0])   # out - in = 1, else anywhere\n    for x in graph:\n        graph[x].sort(reverse=True)               # pop() now gives the smallest neighbour\n    stack, path = [start], []\n    while stack:\n        u = stack[-1]\n        if graph[u]:\n            stack.append(graph[u].pop())          # use the edge u -> v\n        else:\n            path.append(stack.pop())              # stuck: u's place in the path is fixed\n    return path[::-1]\n\nprint(*euler_path([(\"S\", \"A\"), (\"A\", \"B\"), (\"A\", \"C\"), (\"C\", \"D\"), (\"D\", \"A\")]))\n","out":"S A C D A B","notes":[[8,"A path must start where out − in = 1; if every vertex is balanced it's a circuit, and any vertex with an edge will do."],[17,"A vertex is added only once all its edges are used, so the path comes out backwards: the first vertex finished is the end."]]},{"lang":"javascript","src":"function eulerPath(edges) {                       // directed edges [u, v]; assumes an Euler path exists\n  const graph = new Map(), bal = new Map();\n  for (const [u, v] of edges) {\n    if (!graph.has(u)) graph.set(u, []);\n    if (!graph.has(v)) graph.set(v, []);\n    graph.get(u).push(v);\n    bal.set(u, (bal.get(u) ?? 0) + 1);            // out - in\n    bal.set(v, (bal.get(v) ?? 0) - 1);\n  }\n  const start = [...graph.keys()].find(x => bal.get(x) === 1) ?? edges[0][0];   // out - in = 1, else anywhere\n  for (const list of graph.values()) list.sort().reverse();   // pop() now gives the smallest neighbour\n  const stack = [start], path = [];\n  while (stack.length) {\n    const u = stack.at(-1);\n    if (graph.get(u).length) stack.push(graph.get(u).pop());   // use the edge u -> v\n    else path.push(stack.pop());                  // stuck: u's place in the path is fixed\n  }\n  return path.reverse();\n}\n\nconsole.log(...eulerPath([[\"S\", \"A\"], [\"A\", \"B\"], [\"A\", \"C\"], [\"C\", \"D\"], [\"D\", \"A\"]]));\n","out":"S A C D A B","notes":[[10,"A path must start where out − in = 1; if every vertex is balanced it's a circuit, and any vertex with an edge will do."],[11,"The default sort compares as strings, which is right for these letter labels. For numbers, use `list.sort((a, b) => b - a)` instead (descending, no reverse)."],[16,"A vertex is added only once all its edges are used, so the path comes out backwards: the first vertex finished is the end."]]}]}],"ex":{"q":"n servers are joined by two-way connections (no repeats), and every server can reach every other. Return every critical connection: one whose removal leaves some server unable to reach another (LeetCode 1192, Critical Connections in a Network; n ≤ 10⁵).","steps":["A critical connection is exactly a bridge: an edge on no cycle. One DFS with tin and low finds them all: tree edge u–v is a bridge when low[v] > tin[u].","With up to 10⁵ servers, a path-shaped network makes a recursive DFS 10⁵ calls deep, past Python's 1,000 limit and Node's default stack. So the DFS uses an explicit stack.","Each vertex is pushed only once, when it's discovered, so its frame (the next neighbour to look at and the edge it arrived by) can live in two arrays indexed by vertex, and the stack holds plain vertices.","When a vertex runs out of neighbours, pop it, fold its low into its parent's, and test low[child] > tin[parent].","O(V + E) time and O(V + E) space."],"code":{"t":"Critical connections with an explicit stack","tabs":[{"lang":"python","src":"def critical_connections(n, connections):         # the network is connected (LC 1192)\n    graph = [[] for _ in range(n)]\n    for i, (u, v) in enumerate(connections):\n        graph[u].append((v, i))\n        graph[v].append((u, i))\n    tin, low = [-1] * n, [0] * n\n    nxt, in_edge = [0] * n, [-1] * n              # each vertex's frame, kept in arrays\n    tin[0] = low[0] = 0\n    timer, stack, result = 1, [0], []\n    while stack:\n        u = stack[-1]\n        if nxt[u] < len(graph[u]):\n            v, eid = graph[u][nxt[u]]\n            nxt[u] += 1\n            if eid == in_edge[u]:\n                continue                          # the edge we arrived by\n            if tin[v] != -1:\n                low[u] = min(low[u], tin[v])      # a back edge\n            else:\n                tin[v] = low[v] = timer\n                timer += 1\n                in_edge[v] = eid\n                stack.append(v)\n        else:\n            stack.pop()                           # u is finished\n            if stack:\n                p = stack[-1]\n                low[p] = min(low[p], low[u])\n                if low[u] > tin[p]:\n                    result.append([p, u])         # nothing under u gets back to p or above\n    return result\n\nconns = [[0, 1], [1, 2], [2, 0], [1, 3], [3, 4], [4, 5], [5, 3], [5, 6]]\nprint(*(f\"{min(e)}-{max(e)}\" for e in sorted(critical_connections(7, conns))))\n","out":"1-3 5-6"},{"lang":"javascript","src":"function criticalConnections(n, connections) {    // the network is connected (LC 1192)\n  const graph = Array.from({ length: n }, () => []);\n  connections.forEach(([u, v], i) => { graph[u].push([v, i]); graph[v].push([u, i]); });\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0);\n  const nxt = new Array(n).fill(0), inEdge = new Array(n).fill(-1);   // each vertex's frame, kept in arrays\n  tin[0] = low[0] = 0;\n  let timer = 1;\n  const stack = [0], result = [];\n  while (stack.length) {\n    const u = stack.at(-1);\n    if (nxt[u] < graph[u].length) {\n      const [v, id] = graph[u][nxt[u]++];\n      if (id === inEdge[u]) continue;             // the edge we arrived by\n      if (tin[v] !== -1) low[u] = Math.min(low[u], tin[v]);   // a back edge\n      else {\n        tin[v] = low[v] = timer++;\n        inEdge[v] = id;\n        stack.push(v);\n      }\n    } else {\n      stack.pop();                                // u is finished\n      if (stack.length) {\n        const p = stack.at(-1);\n        low[p] = Math.min(low[p], low[u]);\n        if (low[u] > tin[p]) result.push([p, u]); // nothing under u gets back to p or above\n      }\n    }\n  }\n  return result;\n}\n\nconst conns = [[0, 1], [1, 2], [2, 0], [1, 3], [3, 4], [4, 5], [5, 3], [5, 6]];\nconst found = criticalConnections(7, conns).map(([a, b]) => [Math.min(a, b), Math.max(a, b)]);\nconsole.log(...found.sort((x, y) => x[0] - y[0] || x[1] - y[1]).map(([a, b]) => `${a}-${b}`));\n","out":"1-3 5-6"}]},"a":"1–3 and 5–6. The triangles 0–1–2 and 3–4–5 are cycles, so none of their edges is critical. 1–3 is the only link between the two triangles, and 5–6 is the only way to reach server 6."},"fade":{"q":"You're given `pairs[i] = [start, end]` (values up to 10⁹, up to 10⁵ pairs, and a valid answer always exists). Arrange all the pairs so that each pair's start equals the previous pair's end (LeetCode 2097, Valid Arrangement of Pairs).","steps":["Each pair is a directed edge start → end, and a valid arrangement uses every edge once, end to start: it's an Euler path.",{"ask":"Where must the path start?","a":"At the vertex with out − in = 1, if there is one. Otherwise every vertex is balanced, the path is a circuit, and any vertex with an edge works, such as pairs[0][0]."},{"ask":"Why an explicit stack rather than recursion?","a":"With up to 10⁵ pairs the walk can be 10⁵ steps deep, far past Python's default recursion limit of 1,000 and Node's default call stack."},{"ask":"Time and space?","a":"O(E) time on average (hash maps for the adjacency lists and balances) and O(E) space, for E pairs."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def valid_arrangement(pairs):\n    graph, bal = {}, {}\n    for u, v in pairs:\n        graph.setdefault(u, []).append(v)\n        bal[u] = bal.get(u, 0) + 1                # out - in\n        bal[v] = bal.get(v, 0) - 1\n    start = next((x for x in bal if bal[x] == 1), pairs[0][0])   # out - in = 1, else anywhere\n    stack, path = [start], []\n    ...                                           # TODO: Hierholzer: follow unused edges; pop a vertex when it has none left\n    path.reverse()\n    return [[path[i], path[i + 1]] for i in range(len(path) - 1)]\n"},{"lang":"javascript","src":"function validArrangement(pairs) {\n  const graph = new Map(), bal = new Map();\n  for (const [u, v] of pairs) {\n    if (!graph.has(u)) graph.set(u, []);\n    graph.get(u).push(v);\n    bal.set(u, (bal.get(u) ?? 0) + 1);            // out - in\n    bal.set(v, (bal.get(v) ?? 0) - 1);\n  }\n  const start = [...bal.keys()].find(x => bal.get(x) === 1) ?? pairs[0][0];   // out - in = 1, else anywhere\n  const stack = [start], path = [];\n  // TODO: Hierholzer: follow unused edges; pop a vertex when it has none left\n  path.reverse();\n  return path.slice(1).map((v, i) => [path[i], v]);\n}\n"}]},"solution":{"t":"Solution: Hierholzer with an explicit stack","tabs":[{"lang":"python","src":"def valid_arrangement(pairs):\n    graph, bal = {}, {}\n    for u, v in pairs:\n        graph.setdefault(u, []).append(v)\n        bal[u] = bal.get(u, 0) + 1                # out - in\n        bal[v] = bal.get(v, 0) - 1\n    start = next((x for x in bal if bal[x] == 1), pairs[0][0])   # out - in = 1, else anywhere\n    stack, path = [start], []\n    while stack:\n        u = stack[-1]\n        if graph.get(u):                          # an unused edge leaves u\n            stack.append(graph[u].pop())\n        else:\n            path.append(stack.pop())              # u has no edges left: its place is fixed\n    path.reverse()\n    return [[path[i], path[i + 1]] for i in range(len(path) - 1)]\n\nprint(*(f\"[{a},{b}]\" for a, b in valid_arrangement([[3, 7], [7, 3], [1, 3], [3, 2]])),\n      \"|\", *(f\"[{a},{b}]\" for a, b in valid_arrangement([[2, 1], [1, 2]])))\n","out":"[1,3] [3,7] [7,3] [3,2] | [2,1] [1,2]"},{"lang":"javascript","src":"function validArrangement(pairs) {\n  const graph = new Map(), bal = new Map();\n  for (const [u, v] of pairs) {\n    if (!graph.has(u)) graph.set(u, []);\n    graph.get(u).push(v);\n    bal.set(u, (bal.get(u) ?? 0) + 1);            // out - in\n    bal.set(v, (bal.get(v) ?? 0) - 1);\n  }\n  const start = [...bal.keys()].find(x => bal.get(x) === 1) ?? pairs[0][0];   // out - in = 1, else anywhere\n  const stack = [start], path = [];\n  while (stack.length) {\n    const out = graph.get(stack.at(-1));\n    if (out && out.length) stack.push(out.pop()); // an unused edge leaves the top vertex\n    else path.push(stack.pop());                  // no edges left: its place is fixed\n  }\n  path.reverse();\n  return path.slice(1).map((v, i) => [path[i], v]);\n}\n\nconsole.log(...validArrangement([[3, 7], [7, 3], [1, 3], [3, 2]]).map(([a, b]) => `[${a},${b}]`),\n            \"|\", ...validArrangement([[2, 1], [1, 2]]).map(([a, b]) => `[${a},${b}]`));\n","out":"[1,3] [3,7] [7,3] [3,2] | [2,1] [1,2]"}]}},"traps":[["“Skip every edge that leads back to the parent.”","With two parallel edges between u and v, the second one is a real cycle. Skipping by parent vertex ignores it and reports a false bridge. Skip only the arriving edge's id."],["“A recursive DFS is fine for 10⁵ vertices.”","On a path-shaped graph the recursion is 10⁵ calls deep. Python stops at 1,000 by default (RecursionError), and Node's default call stack overflows long before 10⁵ nested calls (RangeError). Use an explicit stack of (vertex, arriving edge id, next neighbour index)."],["“Both endpoints of a bridge are articulation points.”","Not an endpoint of degree 1: removing that vertex leaves the rest connected. In a graph with a single edge, neither endpoint is an articulation point."],["“The root is a cut vertex when some child has low[child] ≥ tin[root].”","That's always true for the root, because tin[root] is the smallest time. The root is a cut vertex only when it has two or more DFS children."],["“The degree conditions alone guarantee an Euler path.”","The edges must also form one connected piece (weakly connected, for a directed graph): two separate cycles have every vertex balanced but no Euler circuit. A cheap check is that Hierholzer's result has E + 1 vertices."],["“Hierholzer's walk is the answer in the order you walk it.”","The first walk can get stuck at the end vertex before every edge is used. The answer is the order in which vertices are popped (finished), reversed, which splices each detour in at the right place."]],"disc":[["Why does low[v] > tin[u] mean the edge u–v is a bridge?","low[v] is the earliest discovery time that v's subtree can reach without using the edge from u. If it's later than tin[u], no edge leaves v's subtree for u or anything above it, so every path from that subtree to the rest of the graph uses u–v. If low[v] ≤ tin[u], some back edge closes a cycle through u–v, and removing u–v leaves the graph connected."],["Why does Hierholzer with sorted neighbours still work when the smallest choice is a dead end?","The first walk can only get stuck at the path's final vertex, the one with one more edge in than out (or back at the start, for a circuit). Hierholzer pops that vertex first, so after reversing it comes last, and every detour walked afterwards is spliced in before it. Taking the smallest unused neighbour at every step is what makes LeetCode 332's itinerary the lexicographically smallest."]],"teach":{"prompt":"Explain to a junior colleague how one DFS finds every bridge in a network, and why you'd write it without recursion.","rubric":["The DFS gives each vertex a discovery time tin","low[v]: the smallest tin reachable from v's subtree with one back edge, skipping the arriving edge by id","A tree edge u–v is a bridge when low[v] > tin[u]","O(V + E) time and space","An explicit stack, because a 10⁵-deep recursion breaks Python's 1,000 limit and Node's stack"],"model":"Run a DFS and give each vertex a discovery time tin when you first reach it. Then compute low[v], the smallest discovery time that v or anything below it in the DFS tree can reach through one back edge, skipping the edge you arrived by. Skip it by its id, so a parallel edge still counts as a cycle. When the DFS finishes a child v of u, fold low[v] into low[u] and test the edge: if low[v] > tin[u], nothing under v can get back to u or above without this edge, so it's a bridge. Every edge is looked at twice, so it's O(V + E) time and space. Python's default recursion limit is 1,000 and LeetCode 1192 has up to 10⁵ vertices, and Node's default call stack overflows long before that depth, so I keep an explicit stack of (vertex, arriving edge id, next neighbour index) and update the parent's low whenever a vertex is popped."},"qa":[["What are tin[v] and low[v]?","tin: when the DFS first reached v. low: the smallest tin that v's subtree can reach with one back edge."],["When is a tree edge u–v a bridge?","When low[v] > tin[u]."],["When is a vertex an articulation point?","A non-root u: some child v has low[v] ≥ tin[u]. The root: it has two or more DFS children."],["When does an undirected graph have an Euler path?","When its edges are connected and 0 (a circuit) or 2 (a path between them) vertices have odd degree."],["Directed Euler path conditions?","The edges are connected; the start has out − in = 1, the end in − out = 1, the rest are balanced (or all balanced: a circuit)."],["In what order does Hierholzer's algorithm produce the path?","The vertices in the order they're popped from the stack, reversed."]],"quiz":[{"q":"What does this print?","snip":{"t":"Trace low","tabs":[{"lang":"python","src":"edges = [(0, 1), (1, 2), (2, 0), (1, 3)]\ngraph = [[] for _ in range(4)]\nfor i, (u, v) in enumerate(edges):\n    graph[u].append((v, i))\n    graph[v].append((u, i))\ntin, low = [-1] * 4, [0] * 4\ntimer = 0\n\ndef dfs(u, in_edge):\n    global timer\n    tin[u] = low[u] = timer\n    timer += 1\n    for v, eid in graph[u]:\n        if eid == in_edge:\n            continue\n        if tin[v] != -1:\n            low[u] = min(low[u], tin[v])\n        else:\n            dfs(v, eid)\n            low[u] = min(low[u], low[v])\n\ndfs(0, -1)\nprint(*low)\n"},{"lang":"javascript","src":"const edges = [[0, 1], [1, 2], [2, 0], [1, 3]];\nconst graph = [[], [], [], []];\nedges.forEach(([u, v], i) => {\n  graph[u].push([v, i]);\n  graph[v].push([u, i]);\n});\nconst tin = [-1, -1, -1, -1], low = [0, 0, 0, 0];\nlet timer = 0;\n\nfunction dfs(u, inEdge) {\n  tin[u] = low[u] = timer++;\n  for (const [v, id] of graph[u]) {\n    if (id === inEdge) continue;\n    if (tin[v] !== -1) low[u] = Math.min(low[u], tin[v]);\n    else {\n      dfs(v, id);\n      low[u] = Math.min(low[u], low[v]);\n    }\n  }\n}\n\ndfs(0, -1);\nconsole.log(...low);\n"}]},"o":["0 0 0 3","0 1 2 3","0 0 0 1","0 1 0 3"],"a":0,"e":"Vertex 2's back edge to 0 gives low[2] = 0, which flows up to 1 and 0. Vertex 3's only edge is the one it arrived by, which is skipped, so low[3] stays at tin[3] = 3 > tin[1] = 1: the edge 1–3 is a bridge. “0 0 0 1” is what you'd get by counting the arriving edge as a back edge."},{"q":"What does this print?","snip":{"t":"Hierholzer's splice","tabs":[{"lang":"python","src":"graph = {\"X\": [\"Y\", \"Z\"], \"Y\": [], \"Z\": [\"X\"]}\nfor x in graph:\n    graph[x].sort(reverse=True)                # pop() gives the smallest\nstack, path = [\"X\"], []\nwhile stack:\n    u = stack[-1]\n    if graph[u]:\n        stack.append(graph[u].pop())\n    else:\n        path.append(stack.pop())\nprint(*path[::-1])\n"},{"lang":"javascript","src":"const graph = new Map([[\"X\", [\"Y\", \"Z\"]], [\"Y\", []], [\"Z\", [\"X\"]]]);\nfor (const list of graph.values()) list.sort().reverse();   // pop() gives the smallest\nconst stack = [\"X\"], path = [];\nwhile (stack.length) {\n  const u = stack.at(-1);\n  if (graph.get(u).length) stack.push(graph.get(u).pop());\n  else path.push(stack.pop());\n}\nconsole.log(...path.reverse());\n"}]},"o":["X Z X Y","X Y X Z","X Y Z X","Y X Z X"],"a":0,"e":"The walk goes X → Y first (the smallest neighbour) and gets stuck, so Y is popped first and ends up last. Back at X, the loop X → Z → X is walked and popped. Reversing the pop order gives X Z X Y; forgetting to reverse would print Y X Z X."},{"q":"In the low-link DFS, why skip only the edge you arrived by (its id), rather than every edge back to the parent?","o":["A second edge between the same two vertices is a real cycle; skipping by parent ignores it and reports a false bridge","Skipping by id is faster, but both ways find the same bridges","Edge ids make the DFS visit the vertices in sorted order","Skipping by parent would make every edge look like a bridge"],"a":0,"e":"With two edges between u and v, removing one leaves the other, so neither is a bridge. Skipping by parent throws the second edge away too, so low[v] can't reach tin[u] and u–v is reported. (Not skipping the arriving edge at all is the opposite mistake: then no edge ever looks like a bridge.)"},{"q":"Which edges can never be bridges? (choose 3)","t":"ms","o":["A back edge of the DFS","An edge that lies on a cycle","One of two parallel edges between the same pair of vertices","The only edge at a vertex of degree 1","A tree edge u–v with low[v] > tin[u]"],"a":[0,1,2],"e":"A bridge lies on no cycle: a back edge closes a cycle, and two parallel edges form a cycle of length 2. The edge at a degree-1 vertex is always a bridge, and low[v] > tin[u] is exactly the bridge test."},{"q":"Judge each statement.","t":"yn","s":[["The DFS root is an articulation point exactly when it has two or more DFS children.",true],["A connected graph with exactly one vertex of odd degree has an Euler path.",false],["In a directed Euler path that isn't a circuit, the start vertex has out-degree − in-degree = 1.",true],["Both endpoints of every bridge are articulation points.",false]],"e":"The root has nothing above it, so only 2+ children make it a cut vertex. No graph has exactly one odd-degree vertex: the degrees add up to an even number. The start uses one more edge out than in. An endpoint of degree 1 isn't a cut vertex: removing it leaves the rest connected."},{"q":"Put the steps for building a directed Euler path in order.","t":"ord","items":["Count each vertex's out-degree and in-degree","Pick the start: the vertex with out − in = 1, or any vertex with an edge if all are balanced","Walk from the start with Hierholzer's stack, adding each vertex to a list when it's popped","Reverse the list; if it has fewer than E + 1 vertices, the edges weren't connected and there's no Euler path"],"e":"The degrees decide the start, the start begins the walk, and the walk produces the vertices backwards."},{"q":"Complete this JavaScript bridge finder.","t":"drop","lang":"javascript","code":"function bridges(n, edges) {\n  const g = Array.from({ length: n }, () => []);\n  edges.forEach(([u, v], id) => { g[u].push([v, id]); g[v].push([u, id]); });\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), out = [];\n  let timer = 0;\n  const dfs = (u, inEdge) => {\n    tin[u] = low[u] = timer++;\n    for (const [v, id] of g[u]) {\n      if (id === {{0}}) continue;\n      if (tin[v] !== -1) low[u] = Math.min(low[u], {{1}});\n      else {\n        dfs(v, id);\n        low[u] = Math.min(low[u], low[v]);\n        if (low[v] {{2}} tin[u]) out.push(id);\n      }\n    }\n  };\n  for (let s = 0; s < n; s++) if (tin[s] === -1) dfs(s, -1);\n  return out;\n}\n","blanks":[{"o":["inEdge","v","u","-1"],"a":0},{"o":["tin[v]","tin[u]","low[u] + 1","timer"],"a":0},{"o":[">",">=","<","==="],"a":0}],"e":"Skip only the arriving edge (inEdge), lower low[u] with the discovery time of the vertex a back edge reaches (tin[v]), and report a bridge when the child's subtree can't reach u or above (low[v] > tin[u])."},{"q":"Match each question to the technique.","t":"match","pairs":[["Which cables, if cut, would split the network?","Bridges: low[v] > tin[u]"],["Which servers, if they failed, would split the network?","Articulation points: low[v] ≥ tin[u], or a root with 2+ children"],["Is there a drawing that uses every line exactly once?","Check the degrees (0 or 2 odd vertices) and that the edges are connected"],["Build the actual route through every ticket, smallest order first","Hierholzer's algorithm with sorted neighbours"]],"extra":["Kruskal's algorithm"],"e":"Cut edges are bridges and cut vertices are articulation points; whether an Euler path exists is a degree-and-connectivity check, and Hierholzer builds the route itself."}],"probs":[["LC 1192 · Critical Connections in a Network","https://leetcode.com/problems/critical-connections-in-a-network/","Hard","iterative low-link; a tree edge u–v is critical when low[v] > tin[u]"],["LC 1568 · Minimum Number of Days to Disconnect Island","https://leetcode.com/problems/minimum-number-of-days-to-disconnect-island/","Hard","the answer is 0, 1 or 2: 0 if it isn't exactly one island; 1 if removing some single land cell changes that (try each, or find an articulation point); otherwise 2"],["LC 332 · Reconstruct Itinerary","https://leetcode.com/problems/reconstruct-itinerary/","Hard","Hierholzer from JFK, taking each airport's destinations in sorted order; reverse the finished list"],["LC 753 · Cracking the Safe","https://leetcode.com/problems/cracking-the-safe/","Hard","the (n − 1)-digit strings are vertices and each next digit is an edge; an Euler circuit gives the shortest string (a de Bruijn sequence)"],["LC 2097 · Valid Arrangement of Pairs","https://leetcode.com/problems/valid-arrangement-of-pairs/","Hard","start where out − in = 1 (else anywhere), run Hierholzer with a stack, then reverse"]],"src":[["cp-algorithms: Finding bridges in a graph in O(N + M)","https://cp-algorithms.com/graph/bridge-searching.html"],["cp-algorithms: Finding articulation points in a graph in O(N + M)","https://cp-algorithms.com/graph/cutpoints.html"],["cp-algorithms: Finding the Eulerian path in O(M)","https://cp-algorithms.com/graph/euler_path.html"],["Wikipedia: Eulerian path","https://en.wikipedia.org/wiki/Eulerian_path"]]},{"id":"m04","d":"d2","t":"Interval dynamic programming","min":110,"hook":"Some problems ask for the best way to process a row of things where one choice in the middle splits the row in two: merging neighbouring piles, cutting a stick, bursting balloons, splitting a string into palindromes. Interval DP keeps one answer for every contiguous range and builds long ranges from shorter ones. NumPy's `linalg.multi_dot` uses it to choose the cheapest order for multiplying a chain of matrices.","pre":{"q":"A stick 10 long must be cut at 2, 4 and 7, and each cut costs the length of the piece being cut. Does the order of the cuts matter? What smaller questions would help you choose it?","a":"It matters. Cutting at 2, then 4, then 7 costs 10 + 8 + 6 = 24, but cutting at 4 first costs 10 + 4 + 6 = 20. The smaller questions are “what's the cheapest way to finish the piece between these two points?”. Each piece is a contiguous range, and once it's cut off, its cuts never affect the rest of the stick."},"kid":{"t":"Snipping the bunting ribbon","x":"Tara is making bunting for the car. Her ribbon is 10 squares long, with pen marks at 2, 4 and 7. Each snip costs one sweet per square of the piece being snipped, so the order matters. Ben prices the short stretches between marks first, then longer ones. For each stretch he tries every mark inside it as the first snip: that snip costs the stretch's length, and the two halves are shorter stretches he has already priced. For the whole ribbon, snipping at 4 first wins: 10 sweets, then 4 for the left piece and 6 for the right, 20 in all.","map":[["A stretch of ribbon between two marks","A range: dp[i][j] for the piece between points i and j"],["Trying every mark inside the stretch as the first snip","Trying every split point k between i and j"],["The first snip costs the stretch's length","The cost term pts[j] − pts[i]"],["The two halves are already priced","dp[i][k] + dp[k][j], read from shorter ranges"],["Short stretches before long ones","Filling the table by increasing length"]],"brk":"Thinking about the first move works here because, once the ribbon is cut, the two pieces never affect each other again. In burst balloons the first burst makes its two neighbours touch, so the sides stay linked, and the DP has to choose the last balloon in a range instead."},"keys":["**The state** dp[i][j] is the best answer for one contiguous range: a substring s[i..j], a run of piles, or the piece of stick between points i and j. There are O(n²) ranges.","**Fill by increasing length.** A range reads only shorter ranges inside it, so loop the length from short to long, then the start i, with j fixed by the two. Memoised recursion gives the same answers in whatever order the calls ask.","**Shape 1, peel off the ends**: dp[i][j] reads dp[i + 1][j − 1], dp[i + 1][j] or dp[i][j − 1]. s[i..j] is a palindrome when s[i] == s[j] and the inside s[i + 1..j − 1] is a palindrome or shorter than 2. O(1) work per range: O(n²) in total.","**Shape 2, choose a split point k**: dp[i][j] = the best over k of dp[i][k] + dp[k][j] + cost(i, k, j). Merging piles, cutting a stick, triangulating a polygon and ordering a matrix chain all look like this. O(n) choices per range: O(n³) time and O(n²) space.","**Choose the LAST action** when the first one leaves the two sides linked. In burst balloons, if k is the last balloon burst between walls i and j, its neighbours at that moment are exactly i and j, and the balloons on its two sides never meet: dp[i][j] = max over k of dp[i][k] + dp[k][j] + a[i] · a[k] · a[j].","**Expand around centres** for palindromic substrings: grow outwards from each of the 2n − 1 centres (n letters and n − 1 gaps) while the two ends match. O(n²) time and O(1) extra space, instead of an O(n²) table.","**Precompute an is-palindrome table** when palindromes are a building block: pal[i][j] for every range in O(n²), then a 1-D DP over prefixes reads it in O(1). Palindrome Partitioning II drops from O(n³) to O(n²) this way.","**Read the constraints**: n up to a few hundred (300 balloons in LC 312, 50 vertices in LC 1039) and words like merge, cut, burst or split point to O(n³) interval DP. The triple loop runs about n³/6 times: 4.5 million for n = 300."],"dia":[{"type":"cells","cap":"Cutting a stick 10 long at 2, 4 and 7: dp[i][j] over the points 0, 2, 4, 7, 10","rows":[{"label":"i = 0","vals":["·",0,4,11,20],"ok":[4]},{"label":"i = 1","vals":["·","·",0,5,13]},{"label":"i = 2","vals":["·","·","·",0,6]},{"label":"i = 3","vals":["·","·","·","·",0]}],"note":"Columns are j. dp[i][j] is the cheapest way to make every cut strictly between points i and j, so neighbouring points cost 0. Each diagonal reads only shorter ones: dp[0][4] = 10 + min(0 + 13, 4 + 6, 11 + 0) = 20, with the first cut at k = 2 (position 4)."},{"type":"tree","cap":"Which interval transition?","root":{"q":"What does the answer for the range i..j depend on?","c":[["its two end items","Peel off the ends: dp[i + 1][j − 1], dp[i + 1][j], dp[i][j − 1]"],["a first move that splits it into independent parts","Split point k: dp[i][k] + dp[k][j] + cost"],["a first move that leaves the two sides linked","Choose the last move k instead (burst balloons)"],["only which substrings are palindromes","A pal[i][j] table, then a 1-D DP over prefixes"]]}}],"cmp":[{"cap":"Interval DP problems at a glance","head":["Problem","State","Transition","Time / space"],"rows":[["Palindromic substrings (LC 647, 5)","A centre, no table","Grow while s[lo] == s[hi]","O(n²) / O(1)"],["Burst balloons (LC 312)","dp[i][j], walls i and j","Max over the last balloon k","O(n³) / O(n²)"],["Polygon triangulation (LC 1039)","dp[i][j], the polygon i..j","Min over the triangle (i, k, j)","O(n³) / O(n²)"],["Cutting a stick (LC 1547)","dp[i][j] over the sorted cut points","Length + min over the first cut k","O(m³) / O(m²), m = cuts + 2"],["Palindrome partitioning II (LC 132)","pal[i][j], then cuts[j]","Min over the last palindromic piece","O(n²) / O(n²)"]]},{"cap":"Three ways to find palindromic substrings","head":["","is-palindrome table","Expand around centres","Manacher's algorithm"],"rows":[["Time","O(n²)","O(n²) worst case, O(n + number of palindromes) in general","O(n)"],["Extra space","O(n²)","O(1)","O(n)"],["Answers “is s[i..j] a palindrome?” later in O(1)","Yes","No","Yes, from the stored radii"],["Use it when","Other DP steps need pal[i][j]","You only count them or want the longest","n is 10⁵ or more"]]}],"code":[{"t":"Palindromic substrings: expand around all 2n − 1 centres","tabs":[{"lang":"python","src":"def count_palindromes(s):\n    total = 0\n    for c in range(2 * len(s) - 1):          # n letter centres and n - 1 gap centres\n        lo, hi = c // 2, (c + 1) // 2        # even c: a letter; odd c: the gap after letter c // 2\n        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n            total += 1                       # s[lo..hi] is one more palindrome\n            lo, hi = lo - 1, hi + 1\n    return total\n\ndef longest_palindrome(s):\n    best_lo, best_hi = 0, 0                  # the best so far is s[best_lo:best_hi]\n    for c in range(2 * len(s) - 1):\n        lo, hi = c // 2, (c + 1) // 2\n        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n            lo, hi = lo - 1, hi + 1\n        if hi - lo - 1 > best_hi - best_lo:  # the last match was s[lo + 1..hi - 1]\n            best_lo, best_hi = lo + 1, hi\n    return s[best_lo:best_hi]\n\nprint(count_palindromes(\"abc\"), count_palindromes(\"aaa\"), count_palindromes(\"abacaba\"))\nprint(longest_palindrome(\"babad\"), longest_palindrome(\"cbbd\"), longest_palindrome(\"forgeeksskeegfor\")
