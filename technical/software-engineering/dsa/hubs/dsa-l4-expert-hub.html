po and move in your five lab solutions, one file per topic, with matching names in both languages.","Add the remaining module templates, each with a stress test against its brute force and a large-input test.","Set your problem: write the statement and constraints first, then the brute force, the model solution, the validator and the generator; build the tests and run every plausible wrong idea against them.","Write the editorial, then ask someone (or a fresh chat) to solve your problem from the statement alone and note where they got stuck.","Keep the problem log and the contest reviews as you go, and finish with the L4 write-up: your technique map from L1 to L4 and the five problems that taught you most."],"stretch":["Replace the O(n log² n) suffix array with the O(n log n) radix-sort version, or SA-IS, and benchmark them on 10⁶ characters.","Add Hopcroft–Karp, or Dinic on the unit network, and compare it with Kuhn on a dense 10⁴ × 10⁴ bipartite graph.","Publish your problem on Codeforces Gym or Polygon and collect feedback from real solvers."]}],"interview":[{"c":"Graph structure","q":"How do you find strongly connected components, and what are they good for?","a":"An SCC is a largest set of vertices that can all reach each other, and shrinking each one to a node leaves a DAG, the condensation. Tarjan's algorithm finds them in one depth-first search: it tracks discovery times and low-link values, lowers low[u] only through vertices still on its stack, and pops a whole component when low[u] equals tin[u]. Kosaraju's does two searches, one on the graph for finishing order and one on the reversed graph. Both are O(V + E), and I'd write them with an explicit stack, because a long path would overflow the recursion. They're useful whenever cycles get in the way: DP over the condensation, deadlock detection, and 2-SAT.","f":["In what order does Tarjan's algorithm output the components?","How would you collect the most coins in a graph with cycles?"]},{"c":"Graph structure","q":"How does 2-SAT work, and why is it linear?","a":"Each clause (a ∨ b) becomes two implications: if a is false then b must be true, and if b is false then a must be. That gives a graph on 2n literals with 2m edges. The formula is unsatisfiable exactly when some variable and its negation are in the same SCC, because then each forces the other. Otherwise I set each variable to whichever of x and ¬x comes later in topological order of the condensation, which with Tarjan's numbering is comp[x] < comp[¬x]. One SCC pass makes the whole thing O(n + m).","f":["Why doesn't the same trick work for 3-SAT?","How would you encode “exactly one of a and b”?"]},{"c":"Flows & matching","q":"State the max-flow min-cut theorem and explain how you'd find a minimum cut.","a":"The largest flow from s to t equals the smallest total capacity of edges whose removal separates s from t. Every flow is at most every cut, because all flow has to cross it, and when no augmenting path is left, the vertices s still reaches in the residual graph form a cut whose edges are all full, so the two are equal. To find the cut I run a max-flow algorithm such as Dinic, which is O(V² E), then search from s using only edges with spare capacity; the cut is the edges from the reached vertices to the rest. With unit capacities, the cut size is the number of links an attacker must remove.","f":["Why do the algorithms use shortest augmenting paths?","How would you model a vertex with limited capacity?"]},{"c":"Flows & matching","q":"Why does the residual graph need reverse edges?","a":"Because a greedy first choice can block the true maximum. In the diamond s → a → b → t, sending the first unit through the middle edge leaves no forward path for a second unit, even though two units fit. The residual graph adds a reverse edge for every unit of flow, so a later path can send flow back along a → b, which cancels it and reroutes it. Storing each edge next to its reverse, at indexes e and e ^ 1, makes a push two updates: cap[e] −= f and cap[e ^ 1] += f.","f":["What would plain greedy path-finding return on the diamond?","Does Dinic ever use that middle edge there?"]},{"c":"Flows & matching","q":"How would you count routes between two servers that share no link? And no machine?","a":"For routes that share no link, I give every link capacity 1 and run max flow from one server to the other; by Menger's theorem the flow value is the number of link-disjoint routes, and following the full edges from the source recovers them. If a link works both ways, I add it as two directed edges. For routes that share no machine, I split every machine v into v_in → v_out with capacity 1, send incoming links to v_in and outgoing links from v_out, and run the same flow from the source's out-copy to the sink's in-copy. Both are max flows on unit networks, which Dinic handles quickly.","f":["How do you recover the actual routes?","What changes if each link can carry up to c routes?"]},{"c":"Flows & matching","q":"How would you assign tasks to workers at the least total cost?","a":"If it's n workers and n tasks with a cost per pair, that's the assignment problem, and the Hungarian algorithm solves it in O(n³): it keeps potentials that make every reduced cost non-negative and adds one worker at a time along zero-cost edges. For maximising a score, I negate the scores. If there are capacities or some workers can take several tasks, I'd use min-cost flow instead: s → worker, worker → task with the cost, task → t, and successive shortest paths with Bellman–Ford, because the reverse edges have negative costs. Without costs, plain bipartite matching (Kuhn, or Hopcroft–Karp for large graphs) is enough.","f":["Why can't min-cost flow use plain Dijkstra?","How would you handle a pair that isn't allowed?"]},{"c":"Trees","q":"How does binary lifting answer lowest common ancestor queries?","a":"I store, for every vertex, its 2^j-th ancestor for each j: up[0] is the parent and up[j][v] = up[j − 1][up[j − 1][v]], which takes O(n log n) time and memory. For a query, I lift the deeper vertex to the other's depth using the bits of the depth difference. If they meet, that's the answer; otherwise I try jumps from the largest down and take one only when it lands the two vertices on different ancestors, and then the LCA is the parent of either. Each query is O(log n), and distance is depth[a] + depth[b] − 2 · depth[LCA].","f":["How many levels do you need for n vertices?","How would you get O(1) queries instead?"]},{"c":"Trees","q":"How do you answer subtree-sum and path-sum queries on a tree that gets point updates?","a":"I flatten the tree with a DFS preorder: each vertex gets an entry time, and its subtree is the contiguous range [tin, tout). A Fenwick tree over those positions gives point updates and subtree sums in O(log n). For sums from the root to a vertex, I add each vertex's value over its whole subtree range instead, so the value at a vertex's position is the sum of its ancestors; a path between two vertices then combines four of those values using the LCA. The DFS must be iterative, because a path-shaped tree is as deep as it is long.","f":["How would you support updates on whole paths?","What changes if the values are on edges instead of vertices?"]},{"c":"Strings","q":"What is a suffix array, and what can you do with it?","a":"It's the start positions of all suffixes of a string in sorted order. I'd build it by prefix doubling, sorting by pairs of ranks of the first k and the next k characters, which is O(n log² n) with a normal sort or O(n log n) with radix sort, and then build the LCP array of neighbouring suffixes with Kasai's algorithm in O(n). Since every substring is a prefix of a suffix, the pair answers a lot: distinct substrings are n(n + 1)/2 minus the sum of the LCP array, the longest repeat is the largest LCP, a pattern's occurrences are one block found by binary search, and joining two strings with a separator gives their longest common substring.","f":["Why does Kasai's algorithm run in linear time?","When would you rather use rolling hashes?"]},{"c":"Data structures","q":"When would you choose a sparse table, a segment tree, square-root decomposition or Mo's algorithm?","a":"A sparse table is for static data with an idempotent operation such as min, max or gcd: O(n log n) to build and O(1) per query, but no updates. With updates and an operation that merges neatly, I'd use a Fenwick or segment tree at O(log n) per operation. When the per-block summary is easy but merging is awkward, like counting values below x with updates, blocks of about √n cost O(√n) per operation with very little code. And when every query is known in advance and I can add or remove one element cheaply, like counting distinct values, Mo's algorithm sorts the queries and slides one window across them in about O(n √q).","f":["Why can't a sparse table do range sums in O(1)?","Which block size does Mo's algorithm use?"]},{"c":"Data structures","q":"How does a skip list work, and where is it used?","a":"It's a sorted linked list with express lanes: every node also joins the level above with probability one half, so each level has about half the nodes of the one below and there are about log₂ n levels. A search starts at the top, moves right while the next value is smaller than the target, and drops a level when it can't, so search, insert and delete take expected O(log n) time and expected O(n) space. Inserting records the last smaller node on each level and splices the new node in after them; there are no rotations at all. Redis uses one for sorted sets, and LevelDB and RocksDB for their in-memory write buffers.","f":["What does “expected” mean here, and can an input make it slow?","How would you find the k-th element quickly?"]},{"c":"Geometry","q":"How would you check whether a point is inside a polygon, robustly?","a":"With integer coordinates I'd use only exact orientation tests. First I check every edge: if the cross product of the edge and the point is zero and the point is within the edge's bounding box, it's on the boundary. Otherwise I cast a ray to the right and count crossings, counting an edge only when its two ends are on different sides of the ray's line, a half-open rule that counts a vertex on the ray once and skips flat edges; an odd count means inside. Each point is O(n). In JavaScript I'd compute the cross products with BigInt, because coordinates near 10⁹ give products near 10¹⁸, past 2⁵³.","f":["How would you speed this up for a convex polygon?","What goes wrong with floating point?"]},{"c":"Maths","q":"How would you compute the 10¹⁸-th Fibonacci number modulo 10⁹ + 7?","a":"The pair (F(n), F(n − 1)) comes from (F(n − 1), F(n − 2)) by multiplying by the matrix [[1, 1], [1, 0]], so F(n) is an entry of that matrix to the n-th power. Repeated squaring computes the power with about 60 squarings and at most 60 extra products for n = 10¹⁸, each a 2 × 2 product reduced modulo 10⁹ + 7. The same idea works for any linear recurrence of order d in O(d³ log n), and for counting walks of length k with an adjacency matrix. In JavaScript the products of two residues reach about 10¹⁸, so I'd use BigInt.","f":["Which recurrences can't be done this way?","How would you count walks of length k between two vertices?"]},{"c":"DP optimisation","q":"When does the convex hull trick apply, and what does it cost?","a":"When a DP transition is a minimum (or maximum) over earlier states of linear functions of something about the current state: dp[i] = min over j of m_j · x_i + c_j. Each earlier state is a line and each query is a point, so dp[i] is the lowest line at x_i. If slopes arrive in sorted order and the queries are sorted too, a deque keeps the lower envelope, and each line is added and removed once: O(n) overall. Otherwise a Li Chao tree takes lines in any order at O(log C) per insert and query. I compare crossing points by cross-multiplying, with BigInt in JavaScript, so nothing is rounded.","f":["How do you decide that a middle line is useless?","What would you use if the best split point is monotone instead?"]},{"c":"Testing","q":"How do you make sure a tricky solution is correct before you submit it?","a":"I write a brute force straight from the definition, independent of my solution and as slow as it needs to be, and a seeded generator of small random inputs with tiny value ranges, so duplicates and edge cases come up often. A loop runs both on thousands of inputs and stops at the first disagreement, printing the input; I shrink it to a minimal failing case before debugging. Then I add hand-made edge cases and a few tests at the maximum values and sizes, because small tests miss overflow and time limits. Passing all that is strong evidence, not proof, so I also write down why the solution is correct.","f":["Why use small inputs rather than large ones?","How do you make the random tests reproducible in JavaScript?"]},{"c":"Behavioural (STAR)","q":"Tell me about a time a bug got past your tests.","a":"Situation: I had a range-query solution that passed every example and my own tests, and failed on a hidden test. Task: find the bug quickly without seeing the test. Action: I wrote a brute force from the problem's definition and a seeded generator of tiny arrays, and within seconds they disagreed on a three-element array with two equal values; shrinking it showed I'd used < where the merge needed ≤. I fixed it, added the case to my tests and made stress testing part of my routine for anything clever. Result: the fix was accepted, and I've caught several similar bugs before submitting since.","f":["What would you do differently next time?","How do you decide when a solution needs a stress test?"]}],"cheat":[{"t":"Templates to know cold","items":["Tarjan: explicit stack of [vertex, next edge]; lower low[u] only through vertices on the vertex stack; low[u] == tin[u] → pop a component","Dinic: BFS levels on edges with cap > 0; push along level + 1 edges with current-arc pointers; push f: cap[e] −= f, cap[e ^ 1] += f","Kuhn: for each left vertex, try right neighbours; a free one ends the path, a taken one asks its partner to move; flip the path","Binary lifting: up[j][v] = up[j − 1][up[j − 1][v]]; LCA: equalise depths, jump both while ancestors differ, return the parent","Suffix array: sort by (rank[i], rank[i + k]), re-rank, double k; Kasai: h = max(h − 1, 0) between text positions","Monotone chain: sort; lower and upper chains; pop while cross(out[−2], out[−1], p) ≤ 0 (< 0 keeps edge points)","Convex hull trick: drop the middle line when (c₃ − c₁)(m₁ − m₂) ≤ (c₂ − c₁)(m₁ − m₃); pop the front while the next line is lower at x"]},{"t":"Python ↔ JavaScript","items":["Products past 2⁵³ (mod 10⁹ + 7, cross products of 10⁹ coordinates, big DP values): BigInt in JavaScript; Python ints are exact","No deque in JavaScript: an array with a head index (not `shift`, which is O(n))","−0 prints as “-0” in JavaScript: write 0 − x, not −x, when x can be 0","Math.random can't be seeded: port a small seeded generator such as mulberry32 to both languages","Deep recursion fails in both (Python's 1,000-frame limit, Node's stack): use explicit stacks for DFS on 10⁵ vertices","Strings compare by code point in Python and by UTF-16 unit in JavaScript; they differ only beyond the Basic Multilingual Plane"]},{"t":"Technique triggers","items":["Mutual reachability, cycles in the way → SCCs and the condensation","Either/or choices with pairwise rules → 2-SAT","Pairing with capacities, or fewest cuts to separate → max flow / min cut","Cheapest perfect pairing → Hungarian; costs with capacities → min-cost flow","Many ancestor, LCA or path queries on a tree → binary lifting, Euler tour","Many substring questions on one text → suffix array + LCP","Points, lines and polygons → integer cross products","Huge n with a fixed linear rule → matrix power; min over lines → convex hull trick; sums over subsets → SOS DP"]},{"t":"Costs","items":["SCCs and 2-SAT: O(V + E) · Dinic: O(V² E), O(E √V) on unit bipartite graphs · Kuhn: O(V E)","Hungarian: O(n³) · min-cost flow: O(k · V E) with Bellman–Ford","Binary lifting: O(n log n) build, O(log n) query · sparse table: O(n log n) build, O(1) query","Suffix array: O(n log² n) doubling, O(n log n) with radix sort · Kasai: O(n)","Mo's algorithm: O(n √q) · √n blocks: O(√n) per operation · skip list: O(log n) expected","Monotone chain: O(n log n) · matrix power: O(d³ log n) · CHT: O(n) amortised, Li Chao O(log C) · SOS DP: O(2^b · b)"]},{"t":"Edge cases to test every time","items":["Self-loops, repeated edges, disconnected graphs, t unreachable from s","A path-shaped tree 2 × 10⁵ deep (recursion) and a star (wide fan-out)","Duplicate points, all points on one line, polygons listed clockwise","Values at the limits: overflow past 2⁵³ in JavaScript, 2⁶³ elsewhere","Empty input, n = 1, all values equal","Ties: equal slopes, equal costs, equal suffixes' prefixes","Strings of one repeated letter (worst case for suffix sorting)"]}],"glossary":[["2-SAT","Deciding whether clauses of two literals each, such as (a ∨ b), can all be satisfied; solved with SCCs of the implication graph in linear time."],["Augmenting path","In flows, an s–t path with spare residual capacity; in matching, a path between two unmatched vertices alternating unmatched and matched edges. Flipping it improves the answer by one."],["Binary lifting","Storing each vertex's 2^j-th ancestor so that k-th ancestors and LCAs take O(log n) jumps."],["Blocking flow","In Dinic's algorithm, a flow in the level graph after which every shortest s–t path has a full edge."],["Condensation","The DAG made by shrinking each strongly connected component of a directed graph to one node."],["Convex hull","The smallest convex polygon containing a set of points; Andrew's monotone chain builds it in O(n log n)."],["Convex hull trick","Speeding up a DP whose candidates are lines by keeping their lower (or upper) envelope."],["Cross product (2-D)","(a − o) × (b − o): its sign says whether o → a → b turns left, right or goes straight; it's twice the triangle's signed area."],["Dinic's algorithm","A maximum-flow algorithm that builds BFS levels and pushes blocking flows: O(V² E), and O(E √V) on unit bipartite graphs."],["Divide and conquer optimisation","Filling one layer of a DP in O(n log n) when the best split point moves in one direction only."],["Euler tour (DFS order)","Numbering vertices in preorder so that every subtree is a contiguous range [tin, tout)."],["Hungarian algorithm","An O(n³) algorithm for the cheapest perfect assignment in an n × n cost matrix."],["Idempotent operation","One where combining a value with itself changes nothing, such as min, max or gcd; needed for O(1) sparse-table queries."],["Kasai's algorithm","Building the LCP array from a suffix array in O(n), reusing the previous match length minus one."],["Kőnig's theorem","In a bipartite graph, a minimum vertex cover has as many vertices as a maximum matching has edges."],["LCA (lowest common ancestor)","The deepest vertex that is an ancestor of both of two given vertices in a rooted tree."],["LCP array","For each pair of neighbours in the suffix array, the length of their longest common prefix."],["Li Chao tree","A segment tree over x that keeps one line per node, answering the minimum line at a point in O(log C)."],["Matrix exponentiation","Computing Mⁿ by repeated squaring, which evaluates linear recurrences and counts walks for huge n."],["Max-flow min-cut theorem","The maximum s–t flow equals the minimum total capacity of edges whose removal separates s from t."],["Min-cost flow","Sending a given amount of flow at the least total cost, usually by successive shortest paths."],["Mo's algorithm","Answering offline range queries by sorting them by block of the left end and sliding one window: about O(n √q)."],["Pick's theorem","For a lattice polygon, area = interior points + boundary points / 2 − 1."],["Residual graph","The graph of spare capacities, including reverse edges that let earlier flow be cancelled."],["Shoelace formula","Twice a polygon's signed area is the sum of the cross products of consecutive vertices."],["Skip list","A sorted linked list with randomly chosen express levels, giving expected O(log n) search, insert and delete."],["SOS DP","Sum over subsets: computing, for every mask, the sum over its submasks in O(2^b · b)."],["Sparse table","A table of answers for every power-of-two block, giving O(1) range queries for idempotent operations on static data."],["Strongly connected component","A largest set of vertices in a directed graph in which every vertex can reach every other."],["Stress test","Comparing a fast solution with an obviously correct brute force on many random inputs to find bugs."],["Suffix array","The start positions of all suffixes of a string, sorted."]],"sourceGroups":[{"t":"Practice","items":[["LeetCode problem set","https://leetcode.com/problemset/","A4 R5 D4 · the free tier is enough for L4"],["LeetCode contests (weekly contests, plus virtual entry to past ones)","https://leetcode.com/contest/","A4 R5 D4 · free"],["Codeforces (rated contests, Gym and the problem archive)","https://codeforces.com/","A5 R5 D5 · free"],["CSES Problem Set","https://cses.fi/problemset/","A5 R4 D5 · free"]]},{"t":"Reference","items":[["cp-algorithms (algorithms for competitive programming)","https://cp-algorithms.com/","A4 R4 D5 · free"],["Antti Laaksonen, Competitive Programmer's Handbook (PDF)","https://cses.fi/book/book.pdf","A5 R3 D4 · free"],["USACO Guide (gold, platinum and advanced sections)","https://usaco.guide/","A4 R5 D5 · free"],["MDN JavaScript reference (BigInt, typed arrays, Math.imul)","https://developer.mozilla.org/en-US/docs/Web/JavaScript","A5 R5 D4 · free"]]},{"t":"Courses and books","items":[["Jeff Erickson, Algorithms (flows, cuts and applications)","https://jeffe.cs.illinois.edu/teaching/algorithms/","A5 R4 D5 · free"],["MIT OpenCourseWare 6.046J, Design and Analysis of Algorithms","https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/","A5 R3 D5 · free"],["Codeforces EDU (step-by-step courses, including suffix arrays and segment trees)","https://codeforces.com/edu/courses","A4 R4 D5 · free with an account"]]}],"aiCtx":"The learner finished DSA levels L1–L3 (from Big-O up to shortest paths, MSTs, bridges, interval/bitmask/tree DP, Fenwick and segment trees, KMP/Z/hashing, number theory and games) and is now at level L4 Expert: strongly connected components and 2-SAT, maximum flow and minimum cut, bipartite matching, binary lifting and LCA, suffix arrays, square-root decomposition and offline queries, computational geometry with exact integer arithmetic, matrix exponentiation and probability DP, DP optimisations (convex hull trick, divide and conquer, sum over subsets), and stress testing, problem setting and teaching. They code in both Python 3.12+ and JavaScript (Node.js 22). Use plain words and short examples, show code in Python and JavaScript when it helps, state the time and space complexity of every solution, point out precision and recursion-depth differences between the languages, and never invent problem numbers or titles (LeetCode or CSES). If you are unsure of a detail, say so.","storyWorld":"The toy room and the treasure-map road trip","kidMapHead":"In code","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the code before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps in order.","**Code drop-downs**: complete Python or JavaScript. Each was checked so only one combination works.","**Matching**: map techniques to problems or code to Big-O."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to recognise which technique a hard problem needs. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is a small system with real requirements. Read the scenario tabs, then pick the algorithms and justify their correctness and complexity.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Practice-problem links point to LeetCode titles from your audited list and to CSES tasks, both checked on 11 Oct 2026, and none of them needs a paid account.","sourcesTab":"Resources","freshStyle":"in the style of a contest editorial or a staff-level interview (a short scenario or code snippet, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Big-O, arrays, hashing, pointers, stacks, lists, recursion, sorting, binary search","x":"done"},{"k":"L2 Proficient","t":"Trees, heaps, tries, graphs, union-find, backtracking, DP, greedy, bits","x":"done"},{"k":"L3 Specialist","t":"Shortest paths, MSTs, advanced DP, range queries, strings, number theory, games","x":"done"},{"k":"L4 Expert","t":"SCCs, flows and matching, suffix arrays, geometry, DP optimisations, stress testing, teaching","x":"this hub","cur":true}],"ladderTitle":"Your DSA ladder","ladderNote":"Each level is its own hub","deck":"dsa-l4","examinerRole":"competitive-programming coach and senior interviewer for staff-level algorithm questions","aiCheck":"Written by Claude for this hub. Check surprising claims against cp-algorithms, the official Python and MDN docs, and run the code yourself."};

/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */
function inl(s) {
  const parts = String(s == null ? "" : s).split("`");
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<code>" + esc(p) + "</code>";
    let t = esc(p);
    t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[\s(“"'\/-])\*([^*\s](?:[^*]*[^*\s])?)\*(?=[\s).,;:!?”"'\/-]|$)/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }).join("");
}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(iso, opts) { try { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return iso; } }
function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1800); } }
  catch (e) {
    const host = (btn && btn.closest(".panel, .q, .ai-box")) || document.body;
    let ta = host.querySelector("textarea.copybox");
    if (!ta) { ta = document.createElement("textarea"); ta.className = "copybox mono"; ta.setAttribute("aria-label", "Text to copy"); host.appendChild(ta); }
    ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
    if (btn) btn.textContent = "Select all and copy the text below";
  }
}

function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, probs: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }
    else setSync("error");
  } finally {
    SYNC.busy[part] = false;
    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }
  else return false;
  U[part] = data.upd; return true;
}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }
      else if (U[part]) flush(part);
    } catch (e) { setSync("error"); return changed; }
  }
  saveLocal();
  return changed;
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("loading");
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }
  });
}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }
  if (score < 1) {
    const m = S.mis[it.id] || { n: 0 };
    m.n += 1; m.at = today(); m.g = String(given || "").slice(0, 160); m.fx = null; S.mis[it.id] = m;
    const keys = Object.keys(S.mis); if (keys.length > 400) { keys.sort((a, b) => (S.mis[a].at < S.mis[b].at ? -1 : 1)).slice(0, keys.length - 400).forEach(k => delete S.mis[k]); }
  } else if (S.mis[it.id] && !S.mis[it.id].fx) { S.mis[it.id].fx = today(); }
  touch("main");
}
function domainAccuracy(did) { const ds = S.dstat[did]; return ds && ds[1] ? ds[0] / ds[1] : null; }
function readiness() {
  if (!HASMOCK) {
    const n = M.length, ok = M.filter(m => S.quiz[m.id] && S.quiz[m.id].best >= 80).length;
    if (ok === n) return { cls: "ok", label: `Mastery: ${ok}/${n} topics`, verdict: "ok", text: `Level mastered: every topic's quiz is at 80% or better. Finish the capstone and write it up to mark this level complete.` };
    if (ok > 0) return { cls: "mid", label: `Mastery: ${ok}/${n} topics`, verdict: "mid", text: `${ok} of ${n} topics are at 80%+ on their quiz. A topic counts as mastered at 80%; Practice → Weak spots finds the rest.` };
    return { cls: "info", label: `Mastery: 0/${n} topics`, verdict: "na", text: `No topic mastered yet. A topic counts as mastered when its quiz reaches 80%; the level is complete when every topic does and the capstone is built.` };
  }
  const list = MOCKS.slice().sort((a, b) => (a.at < b.at ? -1 : 1));
  if (!list.length) return { cls: "info", label: "Readiness: no mock yet", verdict: "na", text: "Take a timed mock to get a readiness estimate." };
  const last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;
  const doms = Object.values(last.byDomain || {}).map(x => x.pct);
  const minDom = doms.length ? Math.min(...doms) : 0;
  if (prev && last.weighted >= 85 && prev.weighted >= 85 && minDom >= 70 && last.cwPct <= 10) return { cls: "ok", label: "Readiness: ready", verdict: "ok", text: `Ready: your last two mocks are ${prev.weighted}% and ${last.weighted}% (weighted), no domain is under 70%, and confident-wrong answers are ${last.cwPct}%. Confirm with the official practice assessment, then book.` };
  if (last.weighted >= 75) return { cls: "mid", label: "Readiness: almost", verdict: "mid", text: `Almost: last mock ${last.weighted}% weighted, weakest domain ${minDom}%, confident-wrong ${last.cwPct}%. ${prev ? "" : "One mock isn't enough evidence: take the second mock after fixing your weak topics. "}Ready means 85%+ on two consecutive mocks, every domain at 70%+, and confident-wrong at 10% or less.` };
  return { cls: "no", label: "Readiness: not yet", verdict: "no", text: `Not yet: last mock ${last.weighted}% weighted (weakest domain ${minDom}%). Work through the weakest modules (story, key points, quiz), redo your mistakes, then retake.` };
}

/* ===== items: Microsoft-style question types =====
   mc  single answer         {q,o,a:int,e}
   ms  multiple answers      {q,o,a:[int],e}                partial credit
   yn  yes/no statements     {q,s:[[text,bool]],e}          partial credit (hot-area style)
   ord build list / order    {q,items:[in correct order],e} all-or-nothing
   drop code/hot-area blanks {q,code:"..{{0}}..",blanks:[{o:[..],a:int}],e} partial credit
   match drag-drop matching  {q,pairs:[[left,right]],extra:[right distractors],e} partial credit */
function prepItem(it) {
  const v = { it, t: it.t };
  if (v.t === "mc" || v.t === "ms") v.order = it.fix ? it.o.map((_, i) => i) : shuffle(it.o.map((_, i) => i));
  if (v.t === "ord") { let s = shuffle(it.items.map((_, i) => i)); if (s.every((x, i) => x === i) && s.length > 1) s = s.slice(1).concat(s[0]); v.start = s; }
  if (v.t === "match") { const n = it.pairs.length + (it.extra || []).length; v.rorder = shuffle(Array.from({ length: n }, (_, i) => i)); }
  if (v.t === "drop") v.dorder = it.blanks.map(b => (it.fix ? b.o.map((_, j) => j) : shuffle(b.o.map((_, j) => j))));
  if (v.t === "yn") v.sorder = it.fix ? it.s.map((_, i) => i) : shuffle(it.s.map((_, i) => i));
  return v;
}
function rightText(it, i) { return i < it.pairs.length ? it.pairs[i][1] : (it.extra || [])[i - it.pairs.length]; }
function isAnswered(v, r) {
  if (r == null) return false;
  switch (v.t) {
    case "mc": return typeof r === "number";
    case "ms": return r.length > 0;
    case "yn": case "drop": case "match": return r.some(x => x != null);
    case "ord": return true;
  }
  return false;
}
function gradeItem(it, r) {
  if (r == null) return 0;
  switch (it.t) {
    case "mc": return r === it.a ? 1 : 0;
    case "ms": { const C = new Set(it.a); let g = 0, b = 0; r.forEach(x => (C.has(x) ? g++ : b++)); return Math.max(0, (g - b) / C.size); }
    case "yn": return it.s.reduce((a, s, i) => a + (r[i] === s[1] ? 1 : 0), 0) / it.s.length;
    case "ord": return r.every((x, i) => x === i) ? 1 : 0;
    case "drop": return it.blanks.reduce((a, b, i) => a + (r[i] === b.a ? 1 : 0), 0) / it.blanks.length;
    case "match": return it.pairs.reduce((a, p, i) => a + (r[i] === i ? 1 : 0), 0) / it.pairs.length;
  }
  return 0;
}
function givenText(it, r) {
  if (r == null) return "(no answer)";
  try {
    switch (it.t) {
      case "mc": return LET[r] + ". " + it.o[r];
      case "ms": return r.map(x => it.o[x]).join(" | ");
      case "yn": return r.map(x => (x == null ? "-" : x ? "Y" : "N")).join("");
      case "ord": return r.map(x => it.items[x]).join(" > ");
      case "drop": return r.map((x, i) => (x == null ? "-" : it.blanks[i].o[x])).join(" | ");
      case "match": return r.map((x, i) => it.pairs[i][0] + "=" + (x == null ? "-" : rightText(it, x))).join("; ");
    }
  } catch (e) { }
  return "";
}
function correctText(it) {
  switch (it.t) {
    case "mc": return it.o[it.a];
    case "ms": return it.a.map(x => it.o[x]).join(" | ");
    case "yn": return it.s.map(s => s[0] + ": " + (s[1] ? "Yes" : "No")).join("; ");
    case "ord": return it.items.join(" > ");
    case "drop": return it.blanks.map(b => b.o[b.a]).join(" | ");
    case "match": return it.pairs.map(p => p[0] + " = " + p[1]).join("; ");
  }
  return "";
}
function typeHint(it) {
  switch (it.t) {
    case "ms": return `Choose ${it.a.length}. Each correct choice earns partial credit.`;
    case "yn": return "For each statement, select Yes if it is true. Otherwise, select No.";
    case "ord": return "Arrange the actions in the correct order (use the arrows).";
    case "drop": return "Complete the code by selecting the correct option in each drop-down.";
    case "match": return "Match each item to the correct answer. Not every answer is used.";
  }
  return "";
}
/* interactive rendering (used by quizzes before checking, and by mocks/cases throughout) */
function itemHTML(v, r, num, opt) {
  const it = v.it; opt = opt || {};
  let h = `<div class="meta">${opt.meta || ""}</div><div class="stem">${num ? num + ". " : ""}${inl(it.q)}</div>`;
  if (it.snip) h += `<div class="snip">${codeBox(it.snip)}</div>`;
  const hint = typeHint(it); if (hint) h += `<div class="hint">${hint}</div>`;
  if (v.t === "mc" || v.t === "ms") {
    const sel = v.t === "mc" ? (r == null ? [] : [r]) : (r || []);
    h += v.order.map((oi, k) => `<button type="button" class="opt ${sel.includes(oi) ? "sel" : ""}" data-oi="${oi}" aria-pressed="${sel.includes(oi)}"><span class="k">${LET[k]}</span><span>${inl(it.o[oi])}</span></button>`).join("");
  } else if (v.t === "yn") {
    h += `<div class="yn">` + (v.sorder || it.s.map((_, i) => i)).map((i, k) => { const s = it.s[i]; const x = r ? r[i] : null; return `<div class="st"><span>${inl(s[0])}</span><span class="seg" role="group" aria-label="Statement ${k + 1}"><button type="button" data-yi="${i}" data-yv="1" aria-pressed="${x === true}" class="${x === true ? "r2" : ""}">Yes</button><button type="button" data-yi="${i}" data-yv="0" aria-pressed="${x === false}" class="${x === false ? "r0" : ""}">No</button></span></div>`; }).join("") + `</div>`;
  } else if (v.t === "ord") {
    const cur = r || v.start;
    h += `<div class="ord">` + cur.map((x, k) => `<div class="it"><span class="pos">${k + 1}</span><span>${inl(it.items[x])}</span><span class="mv"><button type="button" data-mv="${k}" data-dir="-1" aria-label="Move up" ${k === 0 ? "disabled" : ""}>↑</button><button type="button" data-mv="${k}" data-dir="1" aria-label="Move down" ${k === cur.length - 1 ? "disabled" : ""}>↓</button></span></div>`).join("") + `</div>`;
  } else if (v.t === "drop") {
    const parts = it.code.split(/\{\{(\d+)\}\}/);
    h += `<pre class="dropcode">` + parts.map((p, i) => {
      if (i % 2 === 0) return esc(p);
      const bi = +p, b = it.blanks[bi], x = r ? r[bi] : null;
      const ord = (v.dorder && v.dorder[bi]) || b.o.map((_, j) => j);
      return `<select data-bi="${bi}" aria-label="Blank ${bi + 1}"><option value="">▾ choose</option>${ord.map(j => `<option value="${j}" ${x === j ? "selected" : ""}>${esc(b.o[j])}</option>`).join("")}</select>`;
    }).join("") + `</pre>`;
  } else if (v.t === "match") {
    h += `<div class="match">` + it.pairs.map((p, i) => { const x = r ? r[i] : null; return `<div class="pr"><span>${inl(p[0])}</span><select data-mi="${i}" aria-label="Match for item ${i + 1}"><option value="">▾ choose</option>${v.rorder.map(j => `<option value="${j}" ${x === j ? "selected" : ""}>${esc(rightText(it, j))}</option>`).join("")}</select></div>`; }).join("") + `</div>`;
  }
  return h;
}
function bindItem(el, v, getR, setR) {
  const it = v.it;
  $$(".opt", el).forEach(b => b.addEventListener("click", () => {
    const oi = +b.dataset.oi;
    if (v.t === "mc") setR(oi);
    else { const cur = (getR() || []).slice(); const k = cur.indexOf(oi); if (k >= 0) cur.splice(k, 1); else cur.push(oi); setR(cur); }
  }));
  $$("[data-yi]", el).forEach(b => b.addEventListener("click", () => {
    const cur = (getR() || it.s.map(() => null)).slice(); cur[+b.dataset.yi] = b.dataset.yv === "1"; setR(cur);
  }));
  $$("[data-mv]", el).forEach(b => b.addEventListener("click", () => {
    const cur = (getR() || v.start).slice(); const k = +b.dataset.mv, d = +b.dataset.dir, j = k + d;
    if (j < 0 || j >= cur.length) return; [cur[k], cur[j]] = [cur[j], cur[k]]; setR(cur);
  }));
  $$("select[data-bi]", el).forEach(s => s.addEventListener("change", () => {
    const cur = (getR() || it.blanks.map(() => null)).slice(); cur[+s.dataset.bi] = s.value === "" ? null : +s.value; setR(cur, true);

  const trySubmit = btn => { const un = X.vs.filter((q, k) => !isAnswered(q, X.R[k])).length; if (un > 0 && !btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = `Submit with ${un} unanswered?`; $("#subWarn").textContent = "Click again to confirm. Unanswered questions score zero; guessing costs nothing."; return; } submitMock(); };
  if ($("#qSub")) $("#qSub").addEventListener("click", e => trySubmit(e.currentTarget));
  $("#qSub2").addEventListener("click", e => trySubmit(e.currentTarget));
  tick();
}
function submitMock() {
  const X = MOCKRUN; if (!X) return; clearInterval(TIMER);
  const res = X.vs.map((vv, k) => ({ id: vv.it.id, d: vv.it.d, tp: vv.it.tp || "", sc: gradeItem(vv.it, X.R[k]), conf: X.C[k] || "", flag: X.F[k], ans: isAnswered(vv, X.R[k]) }));
  const byDomain = {}; DOM.forEach(d => { const rs = res.filter(r => r.d === d.id); if (rs.length) byDomain[d.id] = { pct: pct(rs.reduce((a, r) => a + r.sc, 0), rs.length), n: rs.length }; });
  const raw = pct(res.reduce((a, r) => a + r.sc, 0), res.length);
  const wsum = Object.keys(byDomain).reduce((a, d) => a + dWeight(d), 0);
  const weighted = Math.round(Object.keys(byDomain).reduce((a, d) => a + byDomain[d].pct * dWeight(d), 0) / (wsum || 1));
  const cw = res.filter(r => r.conf === "high" && r.sc < 1).length;
  const rec = { set: X.set, at: new Date().toISOString(), pct: raw, weighted, byDomain, cw, cwPct: pct(cw, res.length), n: res.length, answered: res.filter(r => r.ans).length, dur: Math.round((Math.min(Date.now(), X.end) - X.start) / 60000), items: res.map(r => [r.id, Math.round(r.sc * 100) / 100, r.conf ? r.conf[0] : "", r.flag ? 1 : 0]) };
  MOCKS.push(rec); if (MOCKS.length > 40) MOCKS = MOCKS.slice(-40);
  X.vs.forEach((vv, k) => recordAnswer(vv.it, res[k].sc, givenText(vv.it, X.R[k])));
  touch("mocks"); header();
  const topics = {}; res.forEach(r => { if (!r.tp) return; const t = topics[r.tp] || (topics[r.tp] = { c: 0, n: 0 }); t.n++; t.c += r.sc; });
  const r = readiness();
  const v = $("#v-mock");
  v.innerHTML = `<div class="eyebrow">Mock ${esc(X.set)} · results</div>
  <div class="grid2" style="margin-top:10px"><div class="panel"><div class="score">${weighted}%</div><div class="muted">weighted by the official domain weights · raw ${raw}% · ${rec.answered}/${rec.n} answered · ${rec.dur} min</div>
   <div class="dbars">${DOM.map(d => byDomain[d.id] ? `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${byDomain[d.id].pct}%;background:${byDomain[d.id].pct >= 70 ? "var(--good)" : "var(--bad)"}"></i></div><b>${byDomain[d.id].pct}%</b></div>` : "").join("")}</div>
   <div class="verdict ${r.verdict}">${esc(r.text)}</div><p class="small muted" style="margin:.6em 0 0">Confident-but-wrong: <b>${cw}</b> (${rec.cwPct}%). These are misconceptions, not gaps: re-read those modules' traps.</p></div>
   <div class="panel"><h3>By topic (weakest first)</h3><div class="dbars">${Object.entries(topics).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n).slice(0, 14).map(([t, o]) => { const p = pct(o.c, o.n); return `<div class="dbar"><span>${esc(t)}</span><div class="tr"><i style="width:${p}%;background:${p >= 70 ? "var(--good)" : "var(--bad)"}"></i></div><b>${Math.round(o.c * 10) / 10}/${o.n}</b></div>`; }).join("")}</div></div></div>
  <div class="panel" style="margin-top:14px"><div class="row between"><h3>Get a remediation plan</h3><div class="row"><button type="button" class="btn primary" id="rCopy">Copy results for Claude</button><button type="button" class="btn" id="rBack">Back to mocks</button></div></div><p class="small muted" style="margin:.4em 0 0">${SYNC.db ? "Your results are also saved to your account, so you can just tell me in chat that you finished a mock." : "Paste the copied results in our chat for a readiness report and a targeted plan."}</p></div>
  <h3 style="margin:22px 0 10px;font-size:1.15rem">Review every question</h3>
  ${X.vs.map((vv, k) => `<div class="q">${reviewHTML(vv, X.R[k], k + 1, { meta: dchip(vv.it.d, vv.it.tp) + `<span class="chip">confidence: ${esc(X.C[k] || "unset")}${X.F[k] ? " · flagged" : ""}</span>` + (vv.it.cs ? `<span class="chip">case: ${esc(CASE[vv.it.cs].title)}</span>` : "") })}</div>`).join("")}`;
  bindExplain(v);
  const payloadTxt = JSON.stringify({ exam: H.code, mock: X.set, date: rec.at, weighted_pct: weighted, raw_pct: raw, by_domain: byDomain, confident_wrong: cw, minutes: rec.dur, by_topic: topics, items: rec.items.map(x => ({ id: x[0], score: x[1], conf: x[2], flagged: !!x[3], topic: ITEMS[x[0]].tp || "", domain: ITEMS[x[0]].d })) });
  $("#rCopy").addEventListener("click", e => copyText(`Here are my ${H.code} Mock ${X.set} results from the Study Hub. Score them, update my readiness, and give me a remediation plan:\n` + payloadTxt, e.currentTarget));
  $("#rBack").addEventListener("click", () => RENDER.mock());
  MOCKRUN = null; saveRun(); window.scrollTo(0, 0);
}

/* ---------- FLASHCARDS (Leitner boxes, spaced) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function allCards() { const out = []; M.forEach(m => (m.qa || []).forEach((q, i) => out.push({ id: m.id + ".c" + (i + 1), d: m.d, t: m.t, q: q[0], a: q[1] }))); (H.cards || []).forEach((c, i) => out.push({ id: "x." + (i + 1), d: c.d, t: c.t || "Extra", q: c.q, a: c.a })); return out; }
let FC = { list: [], i: 0, flip: false, filter: "due" };
function buildFC() {
  const all = allCards(), tn = dayNum(today()), f = FC.filter;
  let list = all.filter(c => f === "due" ? (CARDS[c.id] ? CARDS[c.id][1] <= tn : true) : f === "all" ? true : f.startsWith("m:") ? c.id.startsWith(f.slice(2) + ".") : c.d === f);
  if (f === "due") { const seen = list.filter(c => CARDS[c.id]), fresh = list.filter(c => !CARDS[c.id]); list = shuffle(seen).concat(fresh.slice(0, 20)); } else list = shuffle(list);
  FC.list = list; FC.i = 0; FC.flip = false;
}
RENDER.cards = function () {
  if (!FC.list.length || FC.i >= FC.list.length) buildFC();
  const v = $("#v-cards"), all = allCards(), tn = dayNum(today());
  const due = all.filter(c => CARDS[c.id] && CARDS[c.id][1] <= tn).length, unseen = all.filter(c => !CARDS[c.id]).length;
  const boxes = [0, 0, 0, 0, 0, 0]; all.forEach(c => { boxes[CARDS[c.id] ? CARDS[c.id][0] : 0]++; });
  const c = FC.list[FC.i];
  v.innerHTML = `<div class="fc"><div class="eyebrow">Spaced retrieval</div><h2 class="h-view">Flashcards</h2>
  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn small" id="fCopy">Copy card progress for Claude</button></div><p class="small muted" style="text-align:center;margin:.4em 0 0">Paste it in our chat to sync these cards with the deck in your vault.</p></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  $("#fCopy").addEventListener("click", e => { const tn2 = dayNum(today()); const prog = Object.keys(CARDS).map(id => ({ id, box: CARDS[id][0], due_in_days: CARDS[id][1] - tn2 })); copyText(`My ${H.code} flashcard progress from the Study Hub (deck ${H.deck || H.id}). Please update the vault deck to match:\n` + JSON.stringify(prog), e.currentTarget); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};
