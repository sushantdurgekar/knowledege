{
  id: "d03", d: "d2", t: "Context management and memory implementation", min: 90,
  hook: "Context is the scarcest resource in a multi-agent system: every agent, turn and tool result competes for it. The exam asks how you **accumulate, retrieve, inject and compact** context in and between agents, how you implement memory safely, and how to diagnose the four classic context failures.",
  pre: { q: "By the fifth agent in a pipeline, the prompt holds 2,150 tokens of earlier conversation, but the approval agent needs about 200 tokens of facts. What would you pass instead?", a: "A **structured digest**: key-value facts (customer identified, tier, order, status, eligibility, exception required, approval status) with a validator, plus only the tool results that agent needs — compressed to the fields it uses." },
  story: [
    "Adventure Works' returns pipeline had five agents. Each passed its full context to the next, so by agent five 80% of the prompt was irrelevant, costs had tripled and the approval agent sometimes missed the one fact that mattered.",
    "The engineer, **Kai**, built a **context assembler**. Every agent gets a priority-ordered budget: the **system prompt** first (static, cacheable), then a **digest** of the case (structured key-value facts, validated against the source), then **compressed tool results** (agent-specific schemas — 3 fields, not a 50-field record), then **important older turns** (selected by an importance score), then a **rolling window** of the last three turns. If the budget overflows, the window is summarised first; the system prompt and digest are never cut.",
    "Per-agent budgets reflect jobs: lookups 2,000 tokens, reasoning 4,000, complex policy 8,000. A static 800-token policy document moved out of system prompts into a retrieval tool that agents call only when needed.",
    "Long-term **memory** got the same discipline. An extractor stores only memorable observations with an importance score; retrieval blends similarity, importance and recency; the top five go into a labelled *context from previous interactions* section after the role definition. Writes go through middleware that checks tenant, consent and retention rules and logs every access.",
    "Then the failure hunt. A customer's allergy dropped out of a long conversation (**sliding-window amnesia**) — fixed by exempting critical facts. Summaries drifted from the truth after several compactions (**summary drift**) — fixed with contradiction checks and preferring raw recent turns. Order numbers weren't found by vector search (**vector-only recall**) — fixed with hybrid keyword search. Two customers named Sam got mixed up (**entity continuity**) — fixed by tagging memories with entity IDs."
  ],
  breaks: "Compaction is lossy by definition. Every summary is a model's judgment of what matters, and errors compound across agents. Keep sources of truth (records, IDs, documents) outside the context and re-derive facts from them rather than trusting a chain of summaries.",
  dia: [
    { type: "layers", cap: "Context assembly priority (highest first)", rows: [["1. System prompt", "static, cacheable prefix; never pruned"], ["2. Digest", "structured case facts + validator; rarely pruned"], ["3. Compressed tool results", "agent-specific fields only; compressed first under pressure"], ["4. Important older turns", "selected by importance (e.g., ≥ 0.75)"], ["5. Rolling window", "last ~3 turns; summarised first when over budget"], ["Reserve", "response buffer; ~30% budget for the window"]] },
    { type: "tree", cap: "Diagnosing context-window failures", root: { q: "What's the symptom?", c: [["Early critical facts forgotten in long sessions", "Sliding-window amnesia → pin/exempt critical facts"], ["Facts gradually distorted after repeated summaries", "Summary drift → contradiction checks, keep raw recent turns"], ["IDs, codes, dosages not retrieved", "Vector-only recall → add keyword/hybrid search"], ["Details of two similar entities mixed up", "Entity continuity → tag memories with entity IDs"]] } }
  ],
  keys: [
    "Budget creep sources: **context accumulation** across agents, **history bloat** (full history ≈ 3× tokens vs pruning), **tool-result over-injection** (whole records instead of needed fields).",
    "**Digest**: structured key-value summary of the case validated against sources; fall back to fuller context if loss is detected.",
    "**Rolling window + importance**: keep ~3 recent turns plus older turns above an importance threshold (e.g., 0.75 — preferences 0.8, commitments 0.85, account declarations 0.9).",
    "Assembly order: system prompt (cacheable) > digest > compressed tool results > important turns > rolling window; reserve budget for the window and response; emergency truncation as last resort.",
    "**Per-agent budgets** (example): lookup 2,000, reasoning 4,000, complex policy 8,000 tokens; log violations; move static reference text into retrieval tools.",
    "Count tokens before calling (e.g., `tiktoken`); act early (e.g., at ~40% of the window) rather than at overflow.",
    "Between agents: pass structured handoff payloads and the digest, not transcripts; give each agent only its slice.",
    "Memory implementation: extract memorable observations with importance/type; retrieval score blends similarity, importance and recency; inject top ~5 in a labelled section; dedupe and handle contradictions.",
    "Memory governance in code: tenant/subject validation on every read and write, consent and retention checks, deletion workflows (memories + embeddings + caches), audit middleware.",
    "Failure modes: **sliding-window amnesia**, **summary drift**, **vector-only recall**, **entity continuity** — each with a specific fix."
  ],
  cmp: [{ cap: "Context budget allocation (illustrative, 32K effective budget)", head: ["Section", "Typical tokens", "Pruning rule"], rows: [["System prompt", "500–1,500", "Never"], ["Memories", "2,000–6,000", "Top-k by blended score"], ["Retrieved documents", "10,000–30,000 (large windows)", "Rerank; keep top chunks"], ["Conversation history", "5,000–20,000", "Rolling window + important turns; summarise"], ["Tool results", "1,000–5,000", "Agent-specific schemas; compress first"], ["Response buffer", "4,000–16,000", "Reserve up front"]] }],
  code: [{ t: "A budgeted context assembler (simplified)", lang: "python", src: `import tiktoken
enc = tiktoken.get_encoding("o200k_base")
tokens = lambda text: len(enc.encode(text))

def assemble(agent, case, turns, tool_results, budget):
    parts = [agent.system_prompt, render_digest(case.digest)]          # never pruned
    used = sum(tokens(p) for p in parts)
    window_reserve = int(0.3 * budget)

    for r in tool_results:                                           # compressed first
        slim = {k: r[k] for k in agent.tool_fields[r["tool"]]}
        if used + tokens(str(slim)) > budget - window_reserve: break
        parts.append(f"<tool name={r['tool']}>{slim}</tool>"); used += tokens(str(slim))

    for t in sorted(turns[:-3], key=lambda t: t.importance, reverse=True):
        if t.importance < 0.75 or used + tokens(t.text) > budget - window_reserve: break
        parts.append(t.text); used += tokens(t.text)

    window = "\\n".join(t.text for t in turns[-3:])
    if used + tokens(window) > budget:
        window = summarise(window, keep=case.critical_facts)            # never drop pinned facts
    return "\\n\\n".join(parts + [window])`, notes: [[2, "Count tokens with the model's tokenizer before calling."], [6, "System prompt and digest come first and are never pruned."], [8, "Reserve part of the budget for the most recent turns."], [11, "Inject only the fields this agent needs from each tool result."], [15, "Older turns survive only if important enough and within budget."], [21, "Summarise the window last, protecting critical facts (prevents amnesia)."]] }],
  portal: [{ t: "Find context problems in traces", path: "Foundry tracing / Application Insights", steps: ["Plot input tokens per agent and turn; look for growth across a session.", "Open traces where answers missed known facts; check whether the fact was in the prompt.", "Compare successful vs failed traces for truncation, summarisation or retrieval misses.", "Add regression cases for each failure mode found."] }],
  ex: { q: "A support agent handles 40-turn conversations. Customers complain that it forgets the refund amount agreed at turn 6, and sometimes invents order numbers.", steps: ["Forgetting an early agreed fact → sliding-window amnesia.", "Inventing order numbers → missing exact-ID recall; summaries may have distorted numbers.", "Fix both in the context design."], a: "Pin **commitments** (agreed refund) in the **digest** as critical facts that are never pruned; store order IDs in structured state and retrieve them with **keyword/hybrid** search or a lookup tool; prefer raw recent turns over summaries; add contradiction checks to compaction and regression tests for both failures." },
  fade: { q: "Agent 4 in a pipeline receives a 50-field customer record from a CRM tool but only uses tier and status.", steps: ["This is tool-result over-injection.", { ask: "What do you change?", a: "An agent-specific tool result schema: inject only tier and status (and an ID for traceability)." }, { ask: "What's the benefit beyond cost?", a: "Less distraction and lower risk of leaking unnecessary personal data between agents (data minimisation)." }] },
  traps: [
    ["Passing full transcripts between agents.", "Pass digests and structured payloads; give each agent its slice."],
    ["Summarising repeatedly without checks.", "Summary drift: validate summaries against sources; keep raw recent turns."],
    ["Pure vector search for IDs and codes.", "Add keyword/hybrid retrieval for exact identifiers."],
    ["Pruning critical facts with everything else.", "Pin critical facts (allergies, commitments)."],
    ["Waiting for overflow before managing context.", "Budget proactively per agent; v2 truncates silently."]
  ],
  disc: [
    ["How would you prove a digest doesn't lose important information?", "Validate digest fields against sources, run evaluations comparing answers with digest vs full context on a sample, and monitor contradictions; fall back to fuller context when validation fails."],
    ["Shared memory vs per-agent memory?", "Shared team memory for case facts all agents need (with concurrency control); per-agent memory for role-specific learnings. Keep access least-privilege: an agent shouldn't read memories it doesn't need."]
  ],
  teach: { prompt: "Explain how you manage context across a five-agent pipeline and how you diagnose context failures.", rubric: ["Budget creep sources", "Assembly priority and per-agent budgets", "Digest, compressed tool results, rolling window + importance", "Memory retrieval/injection with governance", "Four failure modes and fixes"], model: "I give every agent a token budget and assemble context in priority order: system prompt, a validated digest of the case, tool results compressed to the fields that agent needs, important older turns, and a rolling window of recent turns, summarising the window last and never dropping pinned facts. Between agents I pass digests and structured payloads, not transcripts. Long-term memories are retrieved by similarity, importance and recency, injected as a labelled top-five section, and governed for tenant, consent and retention. For failures I look for sliding-window amnesia, summary drift, vector-only recall and entity mix-ups, each with a specific fix and regression tests." },
  qa: [["Three sources of budget creep?", "Context accumulation, history bloat, tool-result over-injection."], ["Never pruned?", "System prompt (and usually the digest)."], ["Compressed first?", "Tool results."], ["Fix for vector-only recall?", "Add keyword/hybrid search for IDs."], ["Fix for entity mix-ups?", "Tag memories with entity IDs."], ["Fix for summary drift?", "Contradiction checks; prefer raw recent turns."], ["Typical rolling window?", "About the last 3 turns."]],
  quiz: [
    { t: "match", q: "Match each symptom to the context failure mode.", pairs: [["The patient's allergy from turn 2 is missing by turn 30", "Sliding-window amnesia"], ["After several compactions the refund amount changed", "Summary drift"], ["Policy number POL-88213 isn't found though it's stored", "Vector-only recall"], ["Details of two customers named Lee are mixed", "Entity continuity"]], extra: ["Prompt caching"], e: "Each symptom has a characteristic cause and fix.", tp: "Failure modes" },
    { q: "Which component of the context should be pruned or compressed FIRST when an agent exceeds its budget?", o: ["The system prompt", "The case digest", "Tool results (compressed to needed fields)", "The response buffer"], a: 2, e: "Tool results are compressed first; system prompt and digest are protected.", tp: "Context assembly" },
    { t: "yn", q: "Evaluate each statement about passing context between agents.", s: [["Passing the full transcript to every agent is the safest default.", false], ["A validated structured digest reduces tokens and keeps key facts.", true], ["Each agent should receive only the context slice its role needs.", true]], e: "Digests and role slices beat full transcripts.", tp: "Inter-agent context" },
    { t: "ms", q: "An approval agent receives 2,150 tokens but needs ~200. Which TWO changes help MOST?", o: ["Send a structured digest of case facts instead of the history", "Inject only the tool-result fields the approval agent uses", "Increase the model's context window", "Raise temperature", "Add another summariser agent before it"], a: [0, 1], e: "Digest + agent-specific tool fields solve accumulation and over-injection.", tp: "Token efficiency" },
    { q: "Where should a static 800-token policy reference used by only some requests live?", o: ["In every agent's system prompt", "Behind a retrieval tool agents call when needed", "In the rolling window", "In the response buffer"], a: 1, e: "Move rarely needed static text out of prompts into retrieval.", tp: "Budgets" },
    { t: "drop", q: "Complete the memory retrieval score with weights that sum to 1.0, so similarity dominates but importance and recency still count.", code: `score = {{0}} * similarity + {{1}} * (importance / 10) + {{2}} * recency`, blanks: [{ o: ["0.5", "0.1", "0.9"], a: 0 }, { o: ["0.3", "0.6", "0.0"], a: 0 }, { o: ["0.2", "0.5", "1.0"], a: 0 }], e: "A typical blend: 0.5 similarity + 0.3 importance + 0.2 recency.", tp: "Memory retrieval" }
  ],

{
  id: "d04", d: "d2", t: "Multi-agent RAG and knowledge integration", min: 95,
  hook: "Retrieval quality caps answer quality, and in multi-agent systems one bad retrieval propagates through every downstream agent. The exam tests hybrid search tuning, reranking, chunking, embedding choices, routing across many sources and how to share knowledge safely between agents.",
  pre: { q: "Users search for exact product codes like `KX-2210B` and get semantically similar but wrong products. Pure vector search is used. What's the fix?", a: "Use **hybrid search** (BM25 keyword + vector, fused with RRF), possibly with a lower vector weight for code-heavy queries, and avoid generative query rewriting for exact codes." },
  story: [
    "Tailwind Traders' field-service platform has three agents that all need knowledge: a diagnosis agent (repair manuals), a parts agent (catalogue) and a warranty agent (policy documents). The first version gave each agent a vector index and top-5 results. Answers cited the wrong manual pages a third of the time.",
    "The search engineer, **Lin**, started with **hybrid retrieval** in Azure AI Search: BM25 for exact codes and names, vectors for synonyms, fused with **Reciprocal Rank Fusion**. She tuned the vector weight per query type, retrieved 50 candidates, and turned on the **semantic ranker** to rerank the top 50 with captions. For the diagnosis agent, a cross-encoder reranked the top 20 down to 5.",
    "Chunking mattered more than she expected. Fixed 1,000-token chunks split procedures mid-step. **Structural chunking** using document layout (section headings from Document Intelligence) kept procedures whole; **parent-child** chunking indexed small chunks for precision but returned their parent section for context.",
    "Then routing. Queries now go through a lightweight classifier that picks sources (manuals, catalogue, policies) with confidence scores: above 0.7, search that source; between 0.4 and 0.7, include it if nothing better; below 0.4 everywhere, search all. Results from different indexes are **score-normalised** and reranked together. The query is embedded once and reused.",
    "Finally, knowledge became a **shared layer**: Foundry IQ knowledge bases (on Azure AI Search, with agentic retrieval and citations) exposed to all three agents over MCP, with security trimming so technicians only see documents they're entitled to. Retrieval precision@5 went from 0.61 to 0.86, measured on 100 labelled queries."
  ],
  breaks: "Better retrieval can't fix missing or outdated documents, and reranking can't rescue what retrieval never returned. Measure recall at the candidate stage before tuning rerankers, and treat document freshness as part of the RAG design.",
  dia: [
    { type: "flow", cap: "Retrieval cascade", steps: [["Hybrid retrieve", "BM25 + vector (RRF); 50–100 candidates"], ["Semantic ranker", "L2 rerank of top 50; captions/answers"], ["Cross-encoder", "domain rerank top 20 → 5"], ["LLM rerank (optional)", "top 10 → 3 for high-stakes"], ["Diversify", "MMR to avoid near-duplicates"], ["Inject with citations", "source, page, timestamp"]], loop: "Measure each stage: recall@50, precision@5, nDCG, MRR" },
    { type: "tree", cap: "Chunking strategy", root: { q: "What do the documents look like?", c: [["Uniform prose, little structure", "Fixed-size with overlap (~1,000 tokens)"], ["Clear sections, headings, procedures", "Structural (layout-aware) chunking"], ["Long text where topics shift without headings", "Semantic chunking (split at similarity drops)"], ["Need precise matches but full context", "Hierarchical parent-child (index children, return parent)"]] } }
  ],
  keys: [
    "**Hybrid search**: BM25 (exact terms, codes, names) + vector (meaning) fused with **RRF**; vector query **weight** (default 1.0; lower for keyword-heavy, higher for semantic-heavy) shifts influence; `k_nearest_neighbors` sets candidate breadth (e.g., 50), not weight.",
    "**Semantic ranker**: reranks the top 50 with a cross-encoder-style model, adds captions/answers; optional generative query rewrite (avoid for exact codes).",
    "Vector index tuning: HNSW `m`, `efConstruction`, `efSearch` (recall vs latency); exhaustive KNN for small or accuracy-critical sets. Tune with 50–100 labelled queries.",
    "Reranking cascade: hybrid → semantic ranker → domain cross-encoder → optional LLM reranker; **MMR** for diversity. Reranking can't recover documents retrieval missed.",

{
  id: "d06", d: "d2", t: "Tool errors, fallbacks and result validation", min: 75,
  hook: "Tools fail: throttling, timeouts, bad data, outages, and responses carrying injected instructions. *Design tool error-handling and fallback mechanisms* and *implement tool result validation and quality checks* are separate skills; together they decide whether one flaky API takes down the whole agent system.",
  pre: { q: "A pharmacy tool returns HTTP 400 \"invalid dosage format\" and the agent's retry logic retries it five times with backoff. What's wrong?", a: "400 is a **permanent** error: retrying won't help. Return a **structured error** immediately (so the agent can fix the input or ask the user). Retry only **transient** errors (429, 5xx, timeouts) with exponential backoff + jitter." },
  story: [
    "During a regional outage, Contoso Pharmacy's dosage-check tool started timing out. The agents retried aggressively, tripled traffic to the struggling service, and users waited 90 seconds for an error.",
    "The fix had layers. **Classify errors**: transient (429, 5xx, timeouts) get exponential backoff with jitter, honouring `Retry-After`; permanent ones (400, validation) return immediately as structured errors; degraded responses (partial data) pass through with a warning. Retry budgets differ: critical tools up to 5 attempts (~31 s total), standard ones 3 (~7 s) — and the agent's own timeout is longer than the maximum retry duration so retries aren't cut off mid-way.",
    "A **circuit breaker** wraps each tool: after a run of consecutive failures (or an error rate such as 30% in 60 s) it **opens**, failing fast with a **structured fallback** — `{status: unavailable, fallback: consult_pharmacist, retry_after_seconds: 120}` — instead of hammering the service. After a recovery timeout it goes **half-open** and lets a probe through; successes close it again. A `/health` endpoint reports dependencies and breaker state.",
    "Writes became **idempotent**: each call carries an idempotency key so a retried \"create prescription refill\" never creates two.",
    "Then **validation** of what comes back. Results are checked against a schema, values against ranges (a dosage of 5,000 mg is flagged), and text fields are scanned for **indirect prompt injection** and harmful content before entering the agent's context. Personal data the agent doesn't need is redacted. Empty or low-confidence results trigger a different strategy (rephrase, alternate source) rather than a confident wrong answer."
  ],
  breaks: "Retries and fallbacks change semantics. A cached fallback may be stale, an alternate provider may disagree, and a degraded answer must say it's degraded. Every fallback needs a visible marker for the agent and the user, and an alert for operators.",
  dia: [
    { type: "flow", cap: "Circuit breaker states", steps: [["Closed", "calls flow; count failures"], ["Open", "after N consecutive failures or error-rate threshold: fail fast with structured fallback"], ["Half-open", "after recovery timeout: allow probe calls"], ["Closed again", "after enough successes"]], loop: "Probe fails → back to Open" },
    { type: "layers", cap: "Tool result validation pipeline", rows: [["Schema", "types, required fields (e.g., Pydantic)"], ["Ranges & consistency", "plausible values; cross-field checks"], ["Content safety", "indirect prompt injection, harmful content in text fields"], ["Privacy", "redact PII the agent doesn't need"], ["Size", "truncate/summarise large payloads to agent-specific fields"], ["Quality", "empty/low-confidence results → alternate strategy or clarification"]] }
  ],
  keys: [
    "Error classes: **transient** (429, 5xx, timeouts → retry with exponential backoff + jitter, honour `Retry-After`), **permanent** (400/validation/authorisation → structured error, no retry), **degraded** (partial results → pass with warning).",
    "Retry budgets per criticality (e.g., critical 5 attempts ≈ 31 s, standard 3 ≈ 7 s); agent/tool timeout must exceed the maximum retry duration.",
    "Retries require **idempotency** for writes (idempotency keys, dedupe).",
    "**Circuit breaker**: CLOSED → OPEN (N consecutive failures or error rate in a window) → HALF_OPEN after recovery timeout → CLOSED after successes; fail fast while open.",

  code: [{ t: "Retry, circuit breaker and validation around a tool (simplified)", lang: "python", src: `from tenacity import retry, stop_after_attempt, wait_exponential_jitter, retry_if_exception_type
from pydantic import BaseModel, Field

class DoseCheck(BaseModel):
    drug_code: str
    max_daily_mg: float = Field(gt=0, lt=4000)       # plausible range
    interactions: list[str]

class Transient(Exception): ...

@retry(retry=retry_if_exception_type(Transient), stop=stop_after_attempt(3),
       wait=wait_exponential_jitter(initial=1, max=8))
def call_dose_api(payload, idem_key):
    r = http.post(DOSE_URL, json=payload, headers={"Idempotency-Key": idem_key}, timeout=10)
    if r.status_code in (429, 500, 502, 503, 504): raise Transient(r.status_code)
    r.raise_for_status()                              # 4xx → permanent, no retry
    return r.json()

def dose_tool(payload, idem_key):
    if breaker.is_open():
        return {"status": "unavailable", "fallback": "consult_pharmacist", "retry_after_seconds": 120}
    try:
        data = DoseCheck.model_validate(call_dose_api(payload, idem_key))
        breaker.record_success()
        return scan_and_redact(data.model_dump())     # injection scan + PII redaction
    except Exception as e:
        breaker.record_failure()
        return {"status": "error", "kind": type(e).__name__, "retryable": False}`, notes: [[6, "Range checks catch implausible values before the agent trusts them."], [11, "Retry only transient errors, with bounded attempts and jittered exponential backoff."], [14, "An idempotency key makes retried writes safe."], [15, "Map transient status codes explicitly; everything else is permanent."], [20, "While the breaker is open, fail fast with a structured fallback the model can use."], [23, "Validate the shape before using the result."], [25, "Scan text fields for injected instructions and redact unneeded PII."], [28, "Return a structured error rather than raising into the model loop."]] }],

  hook: "*Implement multi-agent orchestration patterns* (hub-and-spoke, sequential, parallel, peer-to-peer, orchestrator-subagent), *scale and control spawning, batching and concurrency*, and *integrate existing agents securely with A2A and/or MCP*. This is the heart of D2 — and of most case studies.",
  pre: { q: "Four specialist agents each take 15 s. Run in sequence they take 60 s. Run in parallel they'd take 15 s — but the deployment allows 1,000 tokens per minute (TPM) and each agent call uses about 300 tokens. What limits parallelism?", a: "**Quota.** Parallel calls consume TPM at the same moment; with ~300 tokens per call and 1,000 TPM, only about **3** can run concurrently without throttling. Use a semaphore sized to quota, or raise quota/spread deployments." },
  story: [
    "Adventure Works' trip-planning service started as a mesh: every agent could message every other. It worked with three agents and collapsed at seven — loops, duplicated work, nobody in charge.",
    "The rebuild used **hub-and-spoke**: an orchestrator owns routing and ordering; specialist spokes (flights, hotels, visas, budget) are registered as tools and see only their domain. The hub handles failures centrally: each spoke call has a **timeout** (30 s), a **circuit breaker** (open after 3 consecutive failures), and a **structured fallback**, so a broken visa service yields a partial plan with a completeness note instead of a crash.",

  keys: [
    "**Sequential**: dependent steps; simplest; no backtracking. **Parallel**: independent subtasks, fan-out/fan-in, aggregation (vote, merge, best). **Hub-and-spoke**: orchestrator routes, spokes domain-only; single point of failure → harden the hub.",
    "**Orchestrator-subagent / hierarchical**: dynamic delegation; sub-orchestrators with narrow contracts; watch latency and versioning across levels. **Peer-to-peer**: handoff (one active agent) or group chat (manager picks speaker); needs loop guards and depth limits.",

  code: [{ t: "Quota-aware fan-out with deadlines and a minimum quorum", lang: "python", src: `import asyncio

SEM = asyncio.Semaphore(3)                      # sized to TPM/RPM quota

async def call_spoke(spoke, task, timeout):
    async with SEM:
        return await asyncio.wait_for(spoke.run(task), timeout=timeout)

async def fan_out(spokes, task, deadline_s=20, quorum=2):
    per_call = deadline_s * 0.8                 # leave time to merge
    results = await asyncio.gather(*(call_spoke(s, task, per_call) for s in spokes),
                                   return_exceptions=True)
    ok = [r for r in results if not isinstance(r, Exception)]
    if len(ok) < quorum:
        return {"status": "insufficient", "completeness": f"{len(ok)}/{len(spokes)}"}
    return {"status": "ok", "merged": merge(ok), "completeness": f"{len(ok)}/{len(spokes)}"}`, notes: [[3, "Concurrency is capped by quota, not by how many spokes exist."], [7, "Every call has a timeout derived from the overall deadline."], [10, "Reserve part of the deadline for merging and the final answer."], [12, "`return_exceptions=True` lets one failure not cancel the others."], [14, "Minimum-quorum policy: proceed with 2 of 3, otherwise degrade explicitly."], [16, "Always report completeness so downstream agents and users know what's missing."]] }],

{
  id: "d08", d: "d2", t: "Frameworks: Agent Framework, LangGraph, LangChain, Hugging Face and middleware", min: 90,
  hook: "Three named skills: *implement orchestration frameworks (Agent Framework, LangChain, LangGraph)*, *implement advanced capabilities with Hugging Face Transformers*, and *design middleware for reusable capabilities (logging, authorisation, exception handling)*. Expect code-reading questions.",
  pre: { q: "You need the same PII redaction and authorisation check on every tool call across 15 Agent Framework agents. Where do you put it?", a: "In **function middleware** registered on the agents (or shared via a factory): it wraps every tool invocation, can inspect/modify arguments and results, and can short-circuit unauthorised calls — written once, reused everywhere." },
  story: [
    "Contoso's agent teams used four frameworks. The platform group standardised: **Microsoft Agent Framework** for new Foundry-centric agents, **LangGraph** for flows that auditors need to inspect as explicit state machines, and **Hugging Face Transformers** for cheap specialised subtasks. Semantic Kernel and AutoGen code was migrated over time; CrewAI stayed in prototypes.",
    "In Agent Framework, an `Agent` wraps a chat client (`FoundryChatClient` for Foundry), instructions and tools. Standard patterns come from builders — sequential, concurrent, **handoff**, group chat, magentic — and custom flows use **workflows**: executors joined by edges (direct, conditional, switch-case, fan-out, fan-in), with events and **checkpointing** so long runs resume after failures.",
    "Cross-cutting concerns moved into **middleware**. *Agent middleware* wraps whole runs (logging, timing, tenant checks). *Function middleware* wraps tool calls (authorisation, argument validation, PII redaction, rate limiting). *Chat middleware* wraps model requests (prompt logging, token accounting). Middleware calls `call_next()` to continue, edits results after it returns, or short-circuits by setting a result instead.",
    "The audit-heavy dispute workflow is a **LangGraph** `StateGraph`: typed state, nodes, conditional edges, a checkpointer and interrupts for human review. Every transition is explicit and replayable; tracing goes to Azure via OpenTelemetry.",
    "Finally, **Hugging Face**: a zero-shot classifier routes requests without an LLM call, a cross-encoder reranks retrieval results, and a clinical NER model extracts entities. Large open models are deployed to **Foundry managed compute** and called through the OpenAI-compatible endpoint."
  ],
  breaks: "Frameworks change fast — APIs are renamed between versions, and exam snippets reflect a point in time. Learn the concepts (agents, tools, middleware, executors/edges, state graphs, checkpointing, interrupts) and read code for intent, not exact signatures.",

  hook: "a02 designed *where* humans fit. This module *implements* it: durable approval workflows, overrides, timeouts, stale approvals and the feedback loop that turns human decisions into better agents. The exam likes edge cases — the approver who never answers, the approval that's out of date.",
  pre: { q: "A manager approves a refund 6 hours after the request, but in the meantime the customer already received a partial refund. What should the workflow do on approval?", a: "**Re-validate before executing**: check that the state the approval was based on still holds (amount, status, policy). If it changed, don't execute; route back for a fresh decision. Approvals are for a specific state, not a blank cheque." },
  story: [
    "Adventure Works' refund agent now escalates about 9% of cases. The first implementation held an HTTP request open while waiting for Teams approvals; deployments and timeouts lost dozens of pending decisions.",
    "The rebuild used a **durable orchestration**: the agent proposes a refund, a Durable Functions orchestrator sends an adaptive card to Teams, then waits for an **external event** or a **timer**, whichever comes first. While it waits, nothing runs and nothing is lost on restart. Pending approvals are also visible in a dashboard (Redis with a 24-hour TTL for quick lookups; Cosmos DB as the system of record).",
    "Edge cases were written down and coded. **Timeout**: after 4 hours escalate to a senior reviewer, after 24 hours reject by default and notify. **Approver unavailable**: delegation rules. **Stale approval**: re-validate state before executing. **Duplicate clicks**: idempotent execution keyed by request ID. **Partial approval**: the approver can edit the amount — an **override** recorded with reason and identity. **Emergency stop**: a kill switch pauses all executions for an agent.",
    "Overrides and rejections are gold. Approvers pick a rejection reason from a short list (wrong policy interpretation, outside authority, insufficient context, tier mismatch, other) — three seconds of effort. Monthly, a feedback collector samples high-quality rejections, turns them into regression test cases with the expected correct action and trace links, and ranks them by `0.4 × confidence-outcome mismatch + 0.3 × novelty + 0.3 × frequency`. Rejections fell from 28% to 12% in six months.",
    "Every decision is audited according to its tier — routine, notable, auditable or regulated — with retention from 30 days to 7+ years."

  code: [{ t: "Durable Functions: approval with timeout, re-validation and safe default", lang: "python", src: `import azure.durable_functions as df
from datetime import timedelta

def orchestrator(context: df.DurableOrchestrationContext):
    proposal = yield context.call_activity("propose_refund", context.get_input())
    if proposal["amount"] <= 50 and proposal["confidence"] >= 0.75:
        return (yield context.call_activity("execute_refund", proposal))   # full-auto

    yield context.call_activity("send_teams_card", proposal)
    timer = context.create_timer(context.current_utc_datetime + timedelta(hours=4))
    decision = context.wait_for_external_event("ApprovalDecision")
    winner = yield context.task_any([decision, timer])

    if winner == decision:
        timer.cancel()
        d = decision.result
        if d["approved"] and (yield context.call_activity("revalidate", proposal)):
            final = {**proposal, **d.get("override", {})}
            return (yield context.call_activity("execute_refund", final))
    return (yield context.call_activity("reject_and_notify", proposal))

main = df.Orchestrator.create(orchestrator)`, notes: [[6, "Low-impact, confident proposals skip the human."], [10, "A durable timer: nothing runs while waiting, and it survives restarts."], [11, "The approval arrives as an external event raised by the Teams card handler."], [12, "Whichever completes first wins: decision or timeout."], [17, "Re-validate state before executing an approved action."], [18, "Overrides (edited amounts) are applied — and audited in the activity."], [20, "Timeout or rejection: safe default with notification (escalation can be added before this)."]] }],

  pre: { q: "To maximise prompt-cache hits, where should the customer's name and the retrieved documents go in the prompt — before or after the 2,000-token system prompt?", a: "**After.** Prompt caching works on an identical **prefix**: put static content (system prompt, tool definitions, examples) first and variable content (customer context, retrieved docs, the question) after it." },
  story: [
    "Adventure Works served 10 million agent requests a month. A cost review found three wastes: the same 2,000-token system prompt paid in full on every call, thousands of near-identical questions (\"what's your return window?\") answered from scratch, and catalogue lookups recomputed for every user.",
    "First, **prompt caching**: prompts were reordered so the static system prompt and tool definitions form an identical prefix, with variable content after it. Cached input tokens are billed at a steep discount (around half price), automatically, with no code change beyond the ordering.",
    "Second, **semantic caching**: questions are embedded and compared with recent questions in Redis; above a similarity threshold (0.92 after tuning — 0.80 produced wrong hits, 0.98 almost no hits) the stored answer is returned without calling the model. TTLs depend on the content: 7 days for general answers, 24 hours for anything time-sensitive, 30 days for stable policy text. Keys include the agent and tenant, so one tenant never sees another's answers. At the API Management layer, the `llm-semantic-cache-lookup` and `llm-semantic-cache-store` policies do the same for every app behind the gateway, partitioned with **vary-by**.",
    "Third, **response caching** for deterministic tools — catalogue, store locations, policy lookups — with invalidation by dependency tags (entity IDs), data-source versions and TTLs.",
    "Together they cut inference cost by about two-thirds. Batch work (nightly re-summarisation of 2 million reviews) moved to **Batch** deployments at a lower price with a 24-hour window, and request bursts were smoothed with queues and quota-sized concurrency."
  ],
  breaks: "A cache hit is a confident answer from the past. If data changed, the hit is wrong; if the key ignored a user or tenant, it's a leak; if the threshold is loose, it's an answer to a different question. Caching is a correctness feature as much as a cost feature.",
  dia: [
    { type: "layers", cap: "Three caching layers", rows: [["Prompt (prefix) caching", "provider-side; identical prefix → discounted input tokens; static content first"], ["Semantic caching", "embedding similarity ≥ threshold → stored answer; Redis/APIM; TTL by content; vary-by tenant/user"], ["Response/result caching", "deterministic tool/agent results; exact keys; invalidation by tags, versions, TTL"], ["Batching", "offline bulk work at lower price; micro-batching embeddings"]] },
    { type: "tree", cap: "Is this response safe to cache?", root: { q: "Does the answer depend on user-specific or real-time data?", c: [["Yes, user-specific", "Don't share; cache only per user (vary-by) or not at all"], ["Yes, real-time (prices, stock, status)", "No semantic cache, or very short TTL with source versioning"], ["No: general, stable content", { q: "Is the question exact or paraphrased?", c: [["Exact repeat (deterministic tool)", "Response cache with exact key"], ["Paraphrased", "Semantic cache with tuned threshold + TTL"]] }]] } }
  ],
  keys: [
    "**Prompt caching**: automatic for long prompts (Azure OpenAI applies it to prompts of roughly 1,024+ tokens with an identical prefix); cached input tokens are discounted; design: static first (system prompt, tools, examples), variable after.",
    "**Semantic caching**: embed the query, find a stored answer above a similarity threshold, return it; typical hit rates 20–40%; tune the threshold on labelled pairs (e.g., 0.92); too low → wrong answers, too high → few hits.",
    "TTL by content: general ~7 days, time-sensitive ~24 h (or none), stable policy ~30 days; never cache volatile data (stock, prices, status) for long.",
    "Partition caches: keys include agent and tenant (and user for personalised answers); in APIM use **vary-by** (e.g., subscription, user or tenant).",
    "**APIM policies**: `llm-semantic-cache-lookup` (inbound; `score-threshold` where **lower = stricter** similarity requirement, e.g., start ~0.05; embeddings backend; `vary-by`) and `llm-semantic-cache-store` (outbound; `duration` in seconds); requires Azure Managed Redis/Azure Cache for Redis with RediSearch.",
    "**Response caching** for deterministic workloads (catalogue, policies, locations): exact keys, invalidation by dependency tags (entity IDs), data-source versions, cascading invalidation through agent dependencies, TTL.",
    "Combined layers can reduce inference costs ~60–70% at scale; ROI depends on volume (infra + engineering vs savings per hit).",
    "Pitfalls: thresholds too loose/strict, poor invalidation, unbounded key scans (use native vector search or bounded scans), caching time-sensitive data, cross-user leakage.",
    "**Batching**: Batch deployments/APIs for non-urgent bulk jobs (lower cost, ~24 h turnaround); micro-batch embeddings; keep interactive paths on standard deployments.",
    "Cost-aware execution: quota-sized concurrency, queues for bursts, smaller models for simple steps (v02), and per-agent cost attribution (v05)."
  ],
  cmp: [{ cap: "Caching layers compared", head: ["Layer", "Saves", "Hit condition", "Main risk"], rows: [["Prompt caching", "Discount on cached input tokens", "Identical prefix (long prompts)", "Low hits if variable content comes first"], ["Semantic caching", "Whole model call", "Similarity ≥ threshold", "Wrong or stale answers; leakage"], ["Response caching", "Tool/agent computation", "Exact key match", "Stale data without invalidation"], ["Batch processing", "Lower per-token price", "Offline workloads", "Latency (hours)"]] }],
  code: [{ t: "API Management: per-subscription token limit + semantic cache", lang: "xml", src: `<policies>

  traps: [

  teach: { prompt: "Explain your caching strategy for a high-volume multi-agent service and how you keep it correct.", rubric: ["Prompt caching mechanics and ordering", "Semantic cache: threshold tuning, TTLs, partitioning", "APIM semantic cache policies (score-threshold, vary-by, duration)", "Response caching with invalidation", "What not to cache; batching for offline"], model: "Prompts are ordered with static content first so prompt caching discounts the shared prefix. A semantic cache in Redis or at API Management returns stored answers for paraphrased questions above a tuned similarity threshold — in APIM a lower score-threshold is stricter — with TTLs by content type and keys partitioned by agent, tenant and, where needed, user via vary-by. Deterministic tool results use exact-key response caching with invalidation by entity tags, data versions and TTL. I never cache volatile or personal answers in shared caches, and I move offline bulk work to batch deployments. Hit rates, false hits and staleness are monitored, with a bypass switch." },

  code: [{ t: "Tiered routing with quality floors (simplified)", lang: "python", src: `TIERS = {1: "gpt-5.4-nano", 2: "gpt-5.4-mini", 3: "gpt-5.5"}
FLOORS = {1: 75, 2: 85, 3: 60}

def classify(req) -> int:
    text = req.text.lower()
    if req.amount and req.amount > 500 or any(w in text for w in ("legal", "complaint", "exception")):

    if len(text.split()) < 10 and req.matches_known_template:

    return 2

def answer(req):

  code: [{ t: "A specialised, bias-aware pairwise judge (simplified)", lang: "python", src: `JUDGE_PROMPT = """You judge ONE criterion: factual accuracy against the reference policy.
Reference policy:
{reference}
Question: {question}
Answer A: {a}
Answer B: {b}
Return JSON: {{"winner": "A"|"B"|"tie", "reasoning": "<2 sentences citing the policy>"}}"""

def pairwise(question, reference, ans1, ans2):
    v1 = judge(JUDGE_PROMPT.format(reference=reference, question=question, a=ans1, b=ans2))
    v2 = judge(JUDGE_PROMPT.format(reference=reference, question=question, a=ans2, b=ans1))
    w1 = {"A": "ans1", "B": "ans2", "tie": "tie"}[v1["winner"]]
    w2 = {"A": "ans2", "B": "ans1", "tie": "tie"}[v2["winner"]]
    return w1 if w1 == w2 else "inconsistent"      # position bias → route to human review

  code: [{ t: "OpenTelemetry for agents: setup, GenAI attributes and manual propagation", lang: "python", src: `from azure.monitor.opentelemetry import configure_azure_monitor
from opentelemetry import trace

configure_azure_monitor()                      # reads APPLICATIONINSIGHTS_CONNECTION_STRING
tracer = trace.get_tracer("claims-orchestrator")
prop = TraceContextTextMapPropagator()

def call_agent_b(payload):
    with tracer.start_as_current_span("agent.call claims-verifier") as span:
        span.set_attribute("agent.id", "claims-orchestrator")
        span.set_attribute("agent.version", "3.2.0")
        headers = {}
        prop.inject(headers)                   # adds traceparent
        return http.post(VERIFIER_URL, json=payload, headers=headers)

# In agent B (callee):
def handle(request):
    ctx = prop.extract(request.headers)        # continue the caller's trace
    with tracer.start_as_current_span("agent.handle claims-verifier", context=ctx) as span:

        span.set_attribute("gen_ai.request.model", "gpt-5.4")
        span.set_attribute("gen_ai.usage.input_tokens", resp.usage.input_tokens)
        span.set_attribute("gen_ai.usage.output_tokens", resp.usage.output_tokens)
        return resp`, notes: [[5, "The Azure Monitor distro configures exporters from the connection string environment variable."], [10, "A span per semantic boundary: here an agent-to-agent call."], [11, "Agent identity and version on every span enable per-agent analysis and regressions by version."], [14, "Custom HTTP calls need manual injection of `traceparent`."], [19, "The callee extracts the context so its spans join the same trace."], [22, "GenAI semantic convention attributes record model and token usage."]] }],

  hook: "Three monitoring skills: *reliability* (agent health, workflow failures, drift, regression, remediation), *availability and SLA adherence*, and *cost* (usage, quotas, allocations, chargebacks). The exam pairs them with incidents: an alert storm, a token explosion, a model upgrade gone wrong.",
  pre: { q: "At 03:15 a model deployment was upgraded. By 09:00 checkout errors are 34.5% (from 1.2%), and alerts fired for eleven services. How do you avoid eleven pages and find the cause fast?", a: "**Correlate alerts** in a time window (e.g., 5 minutes), identify the upstream root and **suppress downstream** alerts; then follow the hypothesis order — **model deployment change first** — using traces comparing failed vs successful requests and replay with the old and new versions." },
  story: [
    "The 03:15 upgrade at Northwind made the pricing agent's output more verbose. The extra text pushed the price out of the truncated context, the payment API received `\"$99.99\"` instead of `99.99`, and checkouts failed. Failed traces took 3,200 ms in the pricing agent versus 450 ms normally.",
    "The postmortem produced a monitoring strategy. **Health**: per-agent error rate, latency percentiles and heartbeats. **Baselines**: 14-day rolling, by hour of day and day of week, with **dynamic thresholds** (start at medium sensitivity, the default). **Multi-agent anomaly signals**: routing drift (the orchestrator's distribution shifts), latency spikes, **token explosions** (possible injection or loops), escalation surges, tool error bursts. **Quality drift**: continuous evaluation on sampled traffic with 7-day rolling averages.",
    "**Alert hygiene**: anomalies within five minutes are grouped, the upstream root is identified and downstream alerts suppressed. Severities map to SLOs: **P1** threatens the SLA (page, acknowledge in 5 minutes), **P2** puts an SLO at risk (30 minutes), **P3** early warning (next business day), **P4** leading indicators (backlog).",
    "**Automated remediation** handles *known* failure modes only: a token spike over 3σ on one agent applies a rate limit and opens its circuit; a gateway failure fails over after three health checks and a $1 test transaction — 45 minutes manual became under 2 minutes. Runbooks are idempotent, time-limited, rate-limited and logged; novel failures go to humans with an Incident Commander, Technical Lead and Communications Lead.",
    "**Cost**: tokens are metered per agent and tenant (OpenTelemetry metrics and API Management token metrics), quotas enforced per tenant at the gateway, budgets and alerts in Cost Management, and monthly **showback** turned into **chargeback** for the two largest business units. Unit economics — cost per resolved task — became a release metric alongside quality."
  ],
  breaks: "Monitoring isn't the goal; reliable outcomes are. Too many alerts train people to ignore them (target ~80% genuine), and automated fixes for unknown problems can make outages worse. Review alerts monthly and keep automation to the failure modes you understand.",

    { type: "layers", cap: "SLI → SLO → SLA → error budget", rows: [["SLI", "what you measure: P95 latency, success rate, task completion"], ["SLO", "internal target: e.g., P95 < 2 s over 7 days; 99.9% success"], ["SLA", "external commitment: e.g., 99.5% availability with credits"], ["Error budget", "allowed failure (SLO gap) that paces releases and risk"]] },
    { type: "flow", cap: "Detect → correlate → remediate → learn", steps: [["Detect", "dynamic thresholds, anomaly signals, continuous evaluation"], ["Correlate", "5-minute window; find upstream root; suppress downstream"], ["Remediate", "runbook for known modes (idempotent, time/rate-limited) or page humans"], ["Verify", "metrics back at baseline 30+ min"], ["Learn", "blameless postmortem within 48 h; action items; regression tests"]] }

  keys: [
    "Reliability signals: per-agent health (errors, latency P50/P95/P99, heartbeats), workflow failure rates, trace correlation, **drift** (routing distribution, quality scores, token usage), **regression** (continuous evaluation, canary comparisons).",
    "Baselines: rolling 14 days by hour/day; z-scores (2σ warning, 3σ critical); Azure Monitor **dynamic thresholds** sensitivity: **High** (tight thresholds, more alerts), **Medium** (balanced default; start here), **Low** (loose thresholds, fewer alerts).",
    "Multi-agent anomalies: routing drift, latency spike, **token explosion** (injection or loop), escalation surge, tool error burst.",
    "Alert correlation: group within ~5 minutes, find the root, suppress downstream; target ~80% genuine alerts; review monthly.",

    { cap: "Showback vs chargeback", head: ["", "Showback", "Chargeback"], rows: [["What", "Report costs per team/tenant", "Bill costs to teams/tenants"], ["Use when", "Building awareness, early maturity", "Mature metering; accountable budgets"], ["Needs", "Attribution by agent/tenant", "Agreed allocation of shared baseline costs"]] }

  code: [{ t: "KQL: per-agent latency percentiles and token cost by tenant", lang: "kql", src: `// P50/P95/P99 latency per agent over the last hour
dependencies
| where timestamp > ago(1h)
| extend agent = tostring(customDimensions["agent.id"])
| summarize p50 = percentile(duration, 50), p95 = percentile(duration, 95),
            p99 = percentile(duration, 99), calls = count() by agent
| order by p95 desc

// Daily input/output tokens per tenant for showback
customMetrics
| where name in ("gen_ai.client.token.usage") and timestamp > ago(30d)
| extend tenant = tostring(customDimensions["tenant.id"]),
         kind = tostring(customDimensions["gen_ai.token.type"])

    "Contoso Bank's red team compromised one agent through an indirect prompt injection and then tried to move sideways. In the old design they'd have found a shared service principal with Contributor on the subscription. In the new one they found almost nothing.",

  code: [{ t: "AKS workload identity + deny-all network policy", lang: "bash", src: `# 1) Federate a Kubernetes service account with an agent's managed identity
az aks update -g rg-agents -n aks-agents --enable-oidc-issuer --enable-workload-identity

  --identity-name mi-claims-agent --resource-group rg-agents \\

# 2) Least privilege: read one container only

  id: "s02", d: "d4", t: "Authentication flows and secrets management with Key Vault", min: 80,
  hook: "Two skills: *design and implement authentication flows (user impersonation, on-behalf-of, API keys, OAuth 2.0)* and *design secrets management with Azure Key Vault (secrets, certificates, rotation, RBAC, encryption)*. Getting the flow wrong either leaks power (agent acts with too much) or breaks audit (nobody knows who acted).",
  pre: { q: "An HR agent calls the HR API on behalf of the signed-in manager, and HR policy says the API must enforce *the manager's* permissions and log the manager as the actor. Which flow?", a: "**On-behalf-of (OBO)**: the agent's back end exchanges the user's token for a token to the HR API, so the API sees and enforces the manager's identity and permissions. A managed identity would act as the agent, not the user." },
  story: [
    "Woodgrove's HR assistant first called every API with its managed identity. It worked — and auditors flagged it: every salary lookup appeared to be done by \"hr-agent\", and the agent could read every employee's file.",
    "The redesign matched each call to a flow. For the HR and payroll APIs, the agent uses **on-behalf-of**: the front end signs the manager in, the agent's API receives the manager's token and exchanges it for a downstream token, so the HR API enforces the manager's own permissions and logs the manager. For the benefits SaaS that employees connect personally, the platform uses **OAuth authorisation code with PKCE** and stores refresh tokens in **Key Vault**. For a partner background-check service, **OAuth client credentials**. For the agent's own Azure resources, its **managed identity**. One legacy pension API only accepts an **API key**: it lives in Key Vault, isolated per environment, rotated quarterly and on exposure.",
    "Key Vault itself got the same rigour. Access uses **Azure RBAC**, not access policies: agents have **Key Vault Secrets User** on the vault they need; the CI/CD identity has **Secrets Officer**; a monitored break-glass group has **Administrator**; services encrypting data have **Crypto User** on keys. **Soft delete** and **purge protection** are on. Rotation is automated: Event Grid's *SecretNearExpiry* event triggers a function that creates the new secret (keys use a Key Vault rotation policy), with **dual (blue-green) secrets** so clients switch without downtime. Service-to-service mTLS uses **certificates** that renew automatically.",
    "Data at rest uses **customer-managed keys** for the regulated stores, which also lets the bank **crypto-shred** a tenant's data by revoking its key."
  ],
  breaks: "OBO isn't a universal fix. It needs a user token at the start (not available for autonomous background agents), token lifetimes constrain long tasks, and consent/permissions must be configured per API. Autonomous agents acting for no particular user need their own identity with tightly scoped rights — and human approval for sensitive actions.",
  dia: [
    { type: "tree", cap: "Which authentication flow?", root: { q: "Whose permissions must the downstream call use?", c: [["The signed-in user's (and audit must show the user)", { q: "Is the downstream API protected by Entra ID?", c: [["Yes", "On-behalf-of (OBO) / delegated user impersonation"], ["No, third-party SaaS", "OAuth 2.0 auth code + PKCE; tokens in Key Vault"]] }], ["The agent's own (service-level data)", { q: "Azure resource?", c: [["Yes", "Managed identity"], ["No, partner service", "OAuth 2.0 client credentials (certificate preferred)"]] }], ["Legacy API with keys only", "API key in Key Vault; rotation; per-env isolation"]] } },

  keys: [
    "**Managed identity**: agent → Azure resources; no secrets.",
    "**On-behalf-of (OBO)**: middle-tier exchanges the user's token for a downstream token; downstream enforces and audits the **user**; requires delegated permissions/consent; `OnBehalfOfCredential(..., user_assertion=token)`.",
    "**User impersonation** (delegated permissions): the app acts as the user within granted scopes; contrast with **app-only** permissions (application acts as itself).",
    "**OAuth 2.0 client credentials**: service-to-service/B2B; prefer certificates (or federated credentials) over client secrets.",
    "**OAuth 2.0 auth code + PKCE**: user-delegated access to third-party SaaS; store refresh tokens securely (Key Vault); platform features like Foundry/Copilot Studio **identity passthrough** handle per-user tokens.",
    "**API keys**: last resort — Key Vault, per-service and per-environment isolation, rotation (scheduled + on exposure), usage monitoring.",
    "Key Vault object types: **secrets** (passwords, keys for APIs), **keys** (cryptographic operations, CMK), **certificates** (TLS/mTLS with auto-renewal).",
    "Key Vault access: **Azure RBAC** (recommended over access policies): Secrets User (read), Secrets Officer (manage), Crypto User (use keys), Administrator (break-glass); private endpoint; diagnostic logs.",

  code: [{ t: "OBO for a user-scoped API, managed identity for Key Vault", lang: "python", src: `from azure.identity import OnBehalfOfCredential, ManagedIdentityCredential

# 1) User-scoped call: exchange the incoming user token (OBO)

  hook: "Four skills: *multi-intervention guardrails* (user inputs, tool calls, tool responses, outputs), *custom guardrails for domain constraints*, *guardrail testing with synthetic data*, and *shift-left security with the AI Red Teaming Agent*. In multi-agent systems every edge is an attack surface.",
  pre: { q: "Content filters on the model block harmful outputs. Is that enough for an agent that reads emails and can send payments?", a: "No. Output filtering is one point. You also need **input** checks (Prompt Shields for user and document attacks), **tool-call** checks (allow-lists, parameter validation, approvals), and **tool-response** checks (schema, injection scan, PII redaction) — guardrails at every intervention point." },
  story: [
    "Margie's Travel's booking platform had five agents and a content filter on the model. A red-team exercise still succeeded three ways: a hotel description containing hidden instructions (indirect injection through a tool response), a jailbreak in Base64 (input), and a crafted request that made the payment agent call `refund` with a negative amount (tool call).",
    "The security architect, **Omar**, mapped **guardrails to every intervention point**. *User input*: delimiters, **Prompt Shields** for user and document attacks, an intent classifier, schema checks. *Tool calls*: allow-lists per agent, strict parameter schemas and value ranges, content scans of parameters, sandboxed execution and approvals for money movement. *Tool responses*: schema validation, Content Safety and injection scans, PII redaction, value ranges. *Outputs*: Content Safety categories, **groundedness** checks, protected material detection, policy classifiers and output schemas.",
    "Some rules were domain-specific: never quote a fare not returned by the pricing tool, never book for minors without a guardian, never expose passport numbers. Those became **custom guardrails** in a cascade: regex for passport-number patterns (under a millisecond), a fine-tuned classifier for policy topics (tens of milliseconds), and an LLM judge only for borderline scores (hundreds of milliseconds). Targets: false positives under 2%, false negatives under 0.1% for safety-critical rules.",
    "Guardrails need tests like any code. A **coverage matrix** crossed surfaces (input, tool call, tool response, output) × threats (injection, jailbreak, PII leak, harmful content, policy violation) × variations (paraphrase, multilingual, Base64, multi-turn, leetspeak). Synthetic attacks from simulators fill the matrix; every guardrail trigger emits an OpenTelemetry span.",
    "Finally, **shift-left**: the **AI Red Teaming Agent** runs in CI against each candidate agent version, probing risk categories (violence, hate/unfairness, sexual, self-harm, protected material, code vulnerability, ungrounded attributes) with attack strategies such as Base64, ROT13, character flipping and jailbreak prompts, and reports the **attack success rate (ASR)**. A rise in ASR blocks the release."
  ],
  breaks: "Guardrails reduce risk; they can't certify safety. Attackers adapt, classifiers drift and every check adds latency and false positives. Combine guardrails with least privilege (so a bypass can't do much), monitoring of guardrail triggers, and regular red-teaming.",

  code: [{ t: "AI Red Teaming Agent local scan in CI (azure-ai-evaluation; Foundry classic projects; simplified)", lang: "python", src: `import asyncio
from azure.identity import DefaultAzureCredential
from azure.ai.evaluation.red_team import RedTeam, RiskCategory, AttackStrategy

async def target(query: str) -> str:              # wraps the candidate agent version
    return await call_agent(version=CANDIDATE, message=query)

async def main():
    red_team = RedTeam(
        azure_ai_project=PROJECT_ENDPOINT, credential=DefaultAzureCredential(),
        risk_categories=[RiskCategory.Violence, RiskCategory.HateUnfairness,
                         RiskCategory.Sexual, RiskCategory.SelfHarm],
        num_objectives=10)
    result = await red_team.scan(
        target=target, scan_name=f"agent-{CANDIDATE}",
        attack_strategies=[AttackStrategy.EASY, AttackStrategy.MODERATE,
                           AttackStrategy.Base64, AttackStrategy.Flip, AttackStrategy.Jailbreak])
    asr = overall_attack_success_rate(result)
    if asr > BASELINE_ASR:
        raise SystemExit(f"ASR {asr:.1%} above baseline: block release")

asyncio.run(main())`, notes: [[5, "The target is a callback wrapping the agent version under test."], [11, "Choose risk categories relevant to the agent."], [13, "Number of attack objectives per category."], [16, "Attack strategies transform prompts (encodings, flips, jailbreak templates) at different complexity levels."], [18, "Attack success rate (ASR) is the key metric; compare with the approved baseline."], [20, "Fail the pipeline when ASR regresses: shift-left in practice."]] }],

{
  id: "s04", d: "d4", t: "Release methodology: DTAP, blue/green, canary and rollback", min: 80,
  hook: "*Choose a release methodology (DTAP, blue/green, canary)* and *design multi-environment release strategies, rollback, release management and rollout.* AI releases change behaviour, not just code — so gates use evaluation metrics, and rollback must restore prompts, models and tools together.",
  pre: { q: "A new agent version passes CI. You roll it to 5% of traffic; error rate and latency are normal, but task-completion scores from continuous evaluation drop 6%. Proceed?", a: "No. Canary gates must include **AI quality metrics**, not only errors and latency. A >5% evaluation drop is a rollback trigger." },
  story: [
    "Northwind's last big release went straight to 100%: a new model version, a rewritten prompt and two new tools at once. Quality fell, and rolling back the model alone left the new prompt and tools incompatible. It took a day to recover.",
    "The new release process starts with **DTAP** environments: **Development** (small models, synthetic data), **Test**, **Acceptance/staging** (production parity, anonymised data) and **Production**. Each has its own Foundry project, Key Vault and configuration namespace (App Configuration labels), deployed from the same Bicep templates with an environment parameter. The **same artifact** is built once and promoted.",
    "Production rollouts are **canaries**: 5% → 25% → 50% → 100%, about 24 hours per stage, with **quality gates** that include evaluation scores alongside errors and latency. Traffic splitting uses Container Apps **revision weights** (or Front Door/APIM policies). Big infrastructure changes use **blue/green**: a full parallel environment, switched instantly and switched back if needed, at double cost during the transition. **Feature flags** decouple deploying code from releasing behaviour, and enable per-tenant activation. Risky new agents first run in **shadow** mode, receiving copies of traffic without affecting users.",
    "**Rollback** is automated. Triggers: evaluation score drops over 5% (over hours), error rate over 2× baseline (5 minutes), P95 above 150% of the SLO (10 minutes), schema violations over 1% (15 minutes). An Azure Monitor alert calls a webhook, which fires a GitHub `repository_dispatch`, which reactivates the stable revision. The whole **release batch** (model, prompt, tools — tagged together) rolls back as a unit; database changes stay backward compatible.",
    "**Release management** ties it together: a version manifest per agent, tiered approvals (automated for small changes; manual for model upgrades, prompt rewrites over 20% or new tools), tenant rollout tiers (T1 immediately, T2 after 7 days, T3 regulated after 30), version pinning for at most 90 days, and a 90-day retirement notice for old versions."
  ],
  breaks: "Canaries assume traffic at 5% is representative. Low-volume segments (a language, a premium tier) may barely appear, so per-segment metrics can stay statistically blind. Combine canaries with targeted evaluation sets, shadow traffic and tenant-tiered rollouts.",
  dia: [
    { type: "flow", cap: "Progressive delivery with AI quality gates", steps: [["Shadow (optional)", "copy traffic; compare outputs offline"], ["Canary 5%", "24 h; gates: errors, P95, eval scores, schema"], ["25%", "24 h; per-segment checks"], ["50%", "24 h"], ["100%", "keep previous revision warm for rollback"]], loop: "Any gate breach → automated rollback of the whole release batch" },
    { type: "layers", cap: "DTAP environments", rows: [["Development", "small models, synthetic data, fast iteration"], ["Test", "integration and automated evaluations"], ["Acceptance / staging", "production parity, anonymised data, load and red-team tests"], ["Production", "canary/blue-green; protected approvals; monitoring"]] }
  ],
  keys: [
    "**DTAP**: Development → Testing → Acceptance → Production; separate Foundry projects, Key Vaults and configuration per environment; **build once, promote the same artifact**.",
    "Environment differences via parameters (Bicep `@allowed(['dev','staging','production'])`), App Configuration labels, environment-specific model deployments (smaller in dev).",
    "**Blue/green**: two full environments; instant switch and instant rollback; ~2× cost during cut-over; needs backward-compatible data.",
    "**Canary**: gradual traffic (e.g., 5 → 25 → 50 → 100%), ~24 h per stage, gates on **AI evaluation metrics** plus errors/latency; splitting via Container Apps revision weights, Front Door weighted origins, APIM policies or Traffic Manager (DNS).",
    "**Feature flags** (Azure App Configuration): decouple deploy from release; per-tenant activation; kill switches.",
    "**Shadow/dark launch**: mirror traffic to the new version without user impact; compare outputs.",
    "Automated **rollback triggers** (example): eval score −5% (hours), error rate > 2× baseline (5 min), P95 > 150% SLO (10 min), schema violations > 1% (15 min) → alert → webhook → `repository_dispatch` → activate stable revision.",
    "Roll back the **whole release batch** (model deployment, prompt, tools, config) together; keep DB schema backward compatible; agent versions are immutable, so rollback can re-point to the previous version.",
    "Release management: version manifests, tiered approval gates (automated vs manual vs customer), tenant rollout tiers, version pinning windows (e.g., ≤ 90 days), deprecation and retirement (90-day notice; HTTP 410 for retired endpoints).",
    "Model upgrades are releases: pin model versions, test the new version through the same pipeline, canary it."
  ],
  cmp: [{ cap: "Release methodologies", head: ["Method", "Strength", "Cost / risk"], rows: [["DTAP promotion", "Controlled environments, approvals", "Slower; parity effort"], ["Blue/green", "Instant switch and rollback", "Double infrastructure during cut-over"], ["Canary", "Real-traffic validation with small blast radius", "Needs good metrics; low-volume segments hard to see"], ["Feature flags", "Release behaviour independently of deploy; per tenant", "Flag debt; testing combinations"], ["Shadow", "Zero user impact comparison", "Extra cost; side-effect-free calls only"]] }],
  code: [{ t: "Canary with Container Apps revisions, then automated rollback", lang: "bash", src: `# Deploy the new revision with no traffic, then shift 5%
az containerapp update -n claims-agent -g rg-prod --image $ACR/claims-agent:3.3.0 \\
  --revision-suffix v330
az containerapp ingress traffic set -n claims-agent -g rg-prod \\
  --revision-weight claims-agent--v320=95 claims-agent--v330=5

# Promote after gates pass (24 h per stage): 25 -> 50 -> 100
az containerapp ingress traffic set -n claims-agent -g rg-prod \\
  --revision-weight claims-agent--v320=75 claims-agent--v330=25

# Rollback (triggered by an alert -> webhook -> repository_dispatch)
az containerapp ingress traffic set -n claims-agent -g rg-prod \\
  --revision-weight claims-agent--v320=100 claims-agent--v330=0`, notes: [[2, "Multiple-revision mode: the new revision starts with no traffic."], [4, "Canary stage 1: 5% of traffic to the new version."], [8, "Promote only after quality, error, latency and schema gates pass."], [12, "Rollback is a traffic switch back to the stable revision — fast because it's still running."]] }],
  portal: [{ t: "Wire automated rollback", path: "Azure Monitor alert → action group → webhook → GitHub", steps: ["Create alerts for rollback triggers (eval score drop, error ratio, P95 vs SLO, schema violations).", "Action group: webhook to a function that calls GitHub `repository_dispatch`.", "Rollback workflow: re-point traffic/agent version for the whole release batch (tagged).", "Notify the team and open an incident; postmortem within 48 hours."] }],

  fade: { q: "A rollback restored the old model deployment, but errors continued because the new prompt expected the new model's output format.", steps: ["Partial rollback created a version mismatch.", { ask: "What should have been rolled back?", a: "The whole release batch: model, prompt, tools and configuration, tagged together." }, { ask: "How do you make that easy?", a: "Version manifests and immutable agent versions so rollback re-points to the previous complete version." }] },

  ],
  disc: [
    ["When would you choose blue/green over canary?", "When changes are infrastructure-wide or hard to split by traffic (e.g., networking, data platform), when instant full rollback matters more than gradual exposure, and when you can afford double capacity briefly."],

  ],
  teach: { prompt: "Explain how you'd release a new version of a production agent safely.", rubric: ["DTAP with separate resources; build once, promote", "Canary stages with AI quality gates (and/or blue/green)", "Feature flags, shadow, tenant tiers", "Automated rollback triggers and whole-batch rollback", "Release management: manifests, approvals, pinning, retirement"], model: "Changes move through development, test, acceptance and production, each with its own Foundry project, Key Vault and configuration, using one artifact built once. In production I canary — 5, 25, 50, 100 percent over days — with gates on evaluation scores as well as errors, latency and schema validity, or use blue/green for broad infrastructure changes. Feature flags and shadow traffic decouple deployment from release and allow per-tenant rollout, with regulated tenants on longer notice. Alerts on quality drops, error ratios, latency against SLO and schema violations trigger automated rollback of the whole release batch. Version manifests, tiered approvals, pinning windows and retirement notices make it auditable." },
