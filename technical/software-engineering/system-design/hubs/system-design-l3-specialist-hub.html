":{"t":"Solution: the verifier sets the algorithm, then every claim is checked","tabs":[{"lang":"python","src":"def verify(token, key, audience, issuer, now, leeway=60):\n    parts = token.split(\".\")\n    if len(parts) != 3:\n        return \"malformed\"\n    head, body, signature = parts\n    header = json.loads(unb64url(head))\n    if header.get(\"alg\") != \"HS256\":\n        return \"unexpected algorithm\"                  # the verifier picks the algorithm, never the token\n    expected = b64url(hmac.new(key, f\"{head}.{body}\".encode(), hashlib.sha256).digest())\n    if not hmac.compare_digest(expected, signature):\n        return \"bad signature\"\n    claims = json.loads(unb64url(body))\n    if not isinstance(claims.get(\"exp\"), int) or now > claims[\"exp\"] + leeway:\n        return \"expired\"                               # a little leeway for clock skew between machines\n    if claims.get(\"aud\") != audience:\n        return \"wrong audience\"                        # a token minted for another API must not work here\n    if claims.get(\"iss\") != issuer:\n        return \"wrong issuer\"\n    return \"ok\"\n\nKEY = b\"32-bytes-of-secret-from-a-vault!\"\ngood = {\"sub\": \"user-42\", \"iss\": \"https://id.example.com\", \"aud\": \"orders-api\", \"exp\": 1760000600}\ngenuine = sign_hs256(good, KEY)\nunsigned = b64url(b'{\"alg\":\"none\"}') + \".\" + genuine.split(\".\")[1] + \".\"\nswapped = genuine.split(\".\")[0] + \".\" + b64url(b'{\"sub\":\"admin\"}') + \".\" + genuine.split(\".\")[2]\ncases = [(\"valid\", genuine), (\"expired an hour ago\", sign_hs256({**good, \"exp\": 1759996000}, KEY)),\n         (\"minted for another API\", sign_hs256({**good, \"aud\": \"billing-api\"}, KEY)),\n         (\"from another issuer\", sign_hs256({**good, \"iss\": \"https://staging.example.com\"}, KEY)),\n         (\"alg none, no signature\", unsigned), (\"payload swapped\", swapped)]\nfor label, token in cases:\n    print(f\"{label}: {verify(token, KEY, 'orders-api', 'https://id.example.com', now=1760000000)}\")\n","out":"valid: ok\nexpired an hour ago: expired\nminted for another API: wrong audience\nfrom another issuer: wrong issuer\nalg none, no signature: unexpected algorithm\npayload swapped: bad signature\n"},{"lang":"javascript","src":"function verify(token, key, audience, issuer, now, leeway = 60) {\n  const parts = token.split(\".\");\n  if (parts.length !== 3) return \"malformed\";\n  const [head, body, signature] = parts;\n  const header = JSON.parse(unb64url(head).toString());\n  if (header.alg !== \"HS256\") return \"unexpected algorithm\";   // the verifier picks the algorithm, never the token\n  const expected = Buffer.from(b64url(crypto.createHmac(\"sha256\", key).update(`${head}.${body}`).digest()));\n  const given = Buffer.from(signature);\n  if (given.length !== expected.length || !crypto.timingSafeEqual(given, expected)) return \"bad signature\";\n  const claims = JSON.parse(unb64url(body).toString());\n  if (!Number.isInteger(claims.exp) || now > claims.exp + leeway) return \"expired\";   // a little leeway for clock skew between machines\n  if (claims.aud !== audience) return \"wrong audience\";   // a token minted for another API must not work here\n  if (claims.iss !== issuer) return \"wrong issuer\";\n  return \"ok\";\n}\n\nconst KEY = Buffer.from(\"32-bytes-of-secret-from-a-vault!\");\nconst good = { sub: \"user-42\", iss: \"https://id.example.com\", aud: \"orders-api\", exp: 1760000600 };\nconst genuine = signHs256(good, KEY);\nconst unsigned = `${b64url('{\"alg\":\"none\"}')}.${genuine.split(\".\")[1]}.`;\nconst swapped = `${genuine.split(\".\")[0]}.${b64url('{\"sub\":\"admin\"}')}.${genuine.split(\".\")[2]}`;\nconst cases = [[\"valid\", genuine], [\"expired an hour ago\", signHs256({ ...good, exp: 1759996000 }, KEY)],\n               [\"minted for another API\", signHs256({ ...good, aud: \"billing-api\" }, KEY)],\n               [\"from another issuer\", signHs256({ ...good, iss: \"https://staging.example.com\" }, KEY)],\n               [\"alg none, no signature\", unsigned], [\"payload swapped\", swapped]];\nfor (const [label, token] of cases) {\n  console.log(`${label}: ${verify(token, KEY, \"orders-api\", \"https://id.example.com\", 1760000000)}`);\n}\n","out":"valid: ok\nexpired an hour ago: expired\nminted for another API: wrong audience\nfrom another issuer: wrong issuer\nalg none, no signature: unexpected algorithm\npayload swapped: bad signature\n"}]}},"traps":[["“The gateway checked the token, so the services behind it can trust every request.”","Anything inside the network can call them directly: a compromised service, a misrouted request, a server-side request forgery bug. Authenticate callers with mTLS and authorize every request in the service that owns the data."],["“Put the user's roles and details in the JWT; it's signed.”","Signed isn't encrypted: whoever holds the token can read it, and claims go stale until it expires. Keep claims minimal, and look up anything sensitive or fast-changing."],["“Long-lived tokens are fine; we can revoke them.”","A self-contained token can't be revoked without a deny list. Keep access tokens to minutes, and make refresh tokens rotate on each use and be revocable."],["“Secrets in environment files are fine; the repository is private.”","Private repositories leak through forks, laptops, CI logs and former staff. Use a secrets manager, scan for leaks, and rotate anything that was ever committed."],["“The database is encrypted at rest, so the data is safe.”","At-rest encryption protects stolen disks and backups, not a compromised application holding valid credentials. Authorization, least privilege and audit logs still matter, and the keys must live apart from the data."],["“The UI hides the button, so users can't do it.”","UI checks are a convenience; attackers call the API directly. Enforce every permission on the server, for the specific object."]],"disc":[["You're splitting a monolith into 30 services. How do you handle authentication and authorization between them?","Users sign in once with an OpenID Connect provider; the gateway validates their token and passes it on, or exchanges it for a narrower internal token. Services authenticate each other with mTLS and workload identities from a mesh or SPIFFE. Each service authorizes every request itself, for the specific object, with a shared policy engine (OPA or Cedar) or a relationship service where sharing matters. Secrets come from a manager at run time, and every decision is logged."],["A tenant asks you to prove that their data is deleted, backups included. How?","Encrypt each tenant's data with its own data key, wrapped by a master key in a KMS, wherever the data goes, backups included. Deleting the tenant's wrapped key makes every copy unreadable at once (crypto-shredding); the KMS audit log of the key's deletion is the evidence, and live rows are deleted as usual."]],"teach":{"prompt":"Explain to a junior colleague how authentication and authorization work across many services, and how secrets and keys should be handled.","rubric":["OpenID Connect sign-in, short-lived access tokens and revocable refresh tokens","Verifying a JWT: algorithm, signature, expiry, audience and issuer; readable, not secret","Authorization on every request, for the specific object: RBAC, ABAC or relationships","Zero trust: mTLS, workload identities and least privilege between services","Secrets managers, envelope encryption, rotation and crypto-shredding"],"model":"Users sign in with an identity provider through OpenID Connect, and the app gets a short-lived access token, often a signed JWT, plus a refresh token it can renew it with. Every service verifies the token itself: the algorithm it expects, the signature, the expiry, the audience and the issuer. The token is readable by anyone, so it carries no secrets. Knowing who the user is isn't enough: each service checks that this user may do this action on this particular object, using roles, attributes or relationships, and denies by default. Between services nothing is trusted because of where it comes from: calls use mTLS with workload identities, and each service gets only the permissions it needs. Secrets live in a secrets manager and are fetched at run time, ideally as short-lived credentials. Data at rest is encrypted with data keys wrapped by a master key in a KMS, so keys can be rotated cheaply, and destroying a tenant's key deletes their data everywhere."},"qa":[["Authentication or authorization: which says what a user may do?","Authorization; authentication establishes who they are."],["What must an API check in a JWT before trusting it?","The algorithm it expects, the signature, the expiry, the audience and the issuer."],["Why keep access tokens short-lived?","A self-contained token can't easily be revoked, so its lifetime bounds what a thief can do with it."],["What does zero trust mean for a call between two internal services?","It's authenticated, for example with mTLS and workload identities, and authorized like any other request."],["What is envelope encryption?","Data encrypted with data keys, which are encrypted by a master key held in a KMS."],["What is crypto-shredding?","Destroying a key so that every copy of the data it encrypted becomes unreadable."]],"quiz":[{"q":"What does this print?","snip":{"t":"Reading a JWT payload without the key","tabs":[{"lang":"python","src":"import base64\npayload = \"eyJzdWIiOiJ1c2VyLTQyIiwicm9sZSI6ImFkbWluIn0\"\nprint(base64.urlsafe_b64decode(payload + \"=\" * (-len(payload) % 4)).decode())\n"},{"lang":"javascript","src":"const payload = \"eyJzdWIiOiJ1c2VyLTQyIiwicm9sZSI6ImFkbWluIn0\";\nconsole.log(Buffer.from(payload, \"base64url\").toString());\n"}]},"o":["{\"sub\":\"user-42\",\"role\":\"admin\"}","An error: the payload is encrypted","{\"sub\":\"user-42\"}","user-42 admin"],"a":0,"e":"A JWT's payload is plain JSON in base64url, readable by anyone who has the token. The signature only stops changes, so keep secrets out of tokens."},{"q":"What does this print?","snip":{"t":"An expiry check with leeway for clock skew","tabs":[{"lang":"python","src":"now, exp, leeway = 1_000_000, 999_970, 60\nprint(\"accepted\" if now <= exp + leeway else \"expired\", now - exp)\n"},{"lang":"javascript","src":"const now = 1000000, exp = 999970, leeway = 60;\nconsole.log(now <= exp + leeway ? \"accepted\" : \"expired\", now - exp);\n"}]},"o":["accepted 30","expired 30","accepted -30","expired -30"],"a":0,"e":"The token expired 30 seconds ago, but the 60-second leeway absorbs clock differences between the issuer and this server. Keep the leeway small: it extends every stolen token too."},{"q":"An API checks the caller's token, then returns /invoices/{id} for whatever id is asked for. What's the flaw?","o":["Broken object-level authorization: it must check that this user may see this particular invoice","The token should be sent in a cookie","Invoice ids should be random","It should use HTTP/2"],"a":0,"e":"Authentication says who is asking; every request for an object still needs a permission check on that object. Random ids only make guessing harder. It's API1 in the OWASP API Security Top 10."},{"q":"Where should a service's database password come from?","o":["A secrets manager, fetched at run time with the service's identity, ideally as short-lived dynamic credentials","An environment file committed with the code","The container image","A config file every pod can read"],"a":0,"e":"A secrets manager keeps secrets out of code and images, controls and logs who reads them, and can issue credentials that expire on their own."},{"q":"Which are zero-trust practices? (choose 3)","t":"ms","o":["Authenticate service-to-service calls with mTLS and workload identities","Authorize every request, including those from inside the network","Give each component only the permissions it needs","Trust any request that comes from the internal network","Share one admin credential between all services"],"a":[0,1,2],"e":"Zero trust replaces trust in network location with verified identity and least privilege on every request; shared credentials and trusted networks are exactly what it removes."},{"q":"Judge each statement.","t":"yn","s":[["A JWT's payload is encrypted, so it can hold secrets.",false],["A signed JWT keeps working until it expires, unless services check a deny list.",true],["Envelope encryption lets you rotate the master key without re-encrypting all the data.",true],["Authentication decides what a user may do.",false]],"e":"Signed isn't encrypted, and self-contained tokens can't be recalled. Envelope encryption puts a layer of data keys between the master key and the data, so rotation re-wraps keys only. Authorization, not authentication, decides permissions."},{"q":"Put an OpenID Connect sign-in and API call in order.","t":"ord","items":["The app redirects the user to the identity provider","The user signs in, and the provider redirects back with an authorization code","The app exchanges the code for an ID token and an access token","The app calls the API with the access token","The API verifies the token and checks the user's permission on the object"],"e":"The code exchange happens server to server, so tokens never pass through the browser's address bar; the API's own checks come last, on every call."},{"q":"Complete the Python function that evaluates an access policy the way cloud IAM does.","t":"drop","lang":"python","code":"def allowed(policy, principal, action, resource):\n    decision = False                           # nothing is allowed unless a statement allows it\n    for stmt in policy:\n        if principal in stmt[\"principals\"] and action in stmt[\"actions\"] and resource.startswith(stmt[\"prefix\"]):\n            if stmt[\"effect\"] == {{0}}:\n                return False                   # an explicit deny always wins\n            decision = {{1}}\n    return decision\n","blanks":[{"o":["'deny'","'allow'","True","None"],"a":0},{"o":["True","False","stmt","None"],"a":0}],"e":"Access is denied by default, a matching allow grants it, and any matching deny overrides every allow, which is how AWS IAM evaluates policies."}],"probs":[["Reading · OWASP API Security Top 10 (2023)","https://api-security.owasp.org/editions/2023/en/0x11-t10/","","for API1 to API3, find one place in a system you know where each could happen, and the check that prevents it"],["Reading · NIST SP 800-207: Zero Trust Architecture","https://csrc.nist.gov/pubs/sp/800/207/final","","map the policy engine, policy administrator and enforcement point onto a service mesh with OPA"],["Reading · Zanzibar: Google's global authorization system","https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/","","explain the 'new enemy' problem and how zookies (consistency tokens) solve it"],["Reference · RFC 8725: JWT Best Current Practices","https://www.rfc-editor.org/rfc/rfc8725","","list every check the RFC requires of a verifier, and compare with this module's fade"]],"src":[["OpenID Connect Core 1.0","https://openid.net/specs/openid-connect-core-1_0.html"],["RFC 8725: JSON Web Token Best Current Practices","https://www.rfc-editor.org/rfc/rfc8725"],["OWASP API Security Top 10, 2023 edition","https://api-security.owasp.org/editions/2023/en/0x11-t10/"],["NIST SP 800-207: Zero Trust Architecture","https://csrc.nist.gov/pubs/sp/800/207/final"],["Pang et al.: Zanzibar, Google's Consistent, Global Authorization System (USENIX ATC 2019)","https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/"],["SPIFFE overview","https://spiffe.io/docs/latest/spiffe-about/overview/"],["AWS KMS: Cryptography essentials (envelope encryption)","https://docs.aws.amazon.com/kms/latest/developerguide/kms-cryptography.html"]]},{"id":"m09","d":"d4","t":"Classic large designs: video, ride-hailing, collaborative docs, payments, crawlers and key-value stores","min":150,"hook":"Interviews and real projects keep returning to the same handful of systems, because each forces a distinctive trade-off. Video streaming is a bandwidth and caching problem, ride-hailing a write-heavy location problem, collaborative editing a conflict-merging problem, payments a correctness problem, a web crawler a politeness and scale problem, and a distributed key-value store a partitioning and replication problem. Learn the pattern behind each, and new designs become combinations of patterns you've already seen.","pre":{"q":"For each of these, name the one property that dominates the design: a video platform, a payment system, and a collaborative document editor.","a":"Video: bandwidth and caching, so encode once into many renditions, serve short segments from CDNs and let the player adapt the bitrate. Payments: correctness under retries and failures, so idempotency keys, a double-entry ledger and daily reconciliation. Collaborative editing: merging concurrent edits so every copy converges, with operational transformation or CRDTs, at typing speed."},"kid":{"t":"Luigi's growing business","x":"Luigi's business has grown. He films cooking lessons and sends them in short clips, sharper when the customer's connection is good and blurrier when it's slow, so they never stop to load. His riders ring in their positions every few seconds, and he keeps only the latest. Two cooks edit the same recipe card at once, and simple rules merge their changes so both copies end up identical. Every payment slip carries the order number, so a slip sent twice is charged once. And his scout visits suppliers' shops for new ingredients, but never more than one visit per shop per hour, or he'd be thrown out.","map":[["Short clips, sharper or blurrier with the connection","Adaptive bitrate streaming: segments at several bitrates, chosen by the player"],["Riders ringing in, only the latest kept","Ride-hailing: an in-memory, write-heavy location index"],["Rules that merge two cooks' edits","Collaborative editing: operational transformation or CRDTs"],["The order number on every payment slip","Idempotency keys: a retried payment is charged once"],["One visit per shop per hour","Crawler politeness: a rate limit per host"]],"brk":"Luigi solves each problem on its own. Real products combine them: a ride-hailing app also takes payments and streams maps, so the patterns share identity, queues and storage, and the hardest bugs live where they meet."},"keys":["**A way into any large design**: name the property that dominates it before drawing boxes, then use the L2 framework: requirements, estimates, API and data model, a high-level design, deep dives, and failure modes. Spend the deep dives where the dominant property lives: bandwidth for video, correctness for payments, convergence for editors.","**Video streaming**: uploads go to object storage in resumable chunks; a transcoding pipeline (a graph of jobs) encodes several resolutions and bitrates, cut into segments of 2 to 6 seconds with HLS or DASH manifests. CDNs serve the segments, so almost no bytes reach the origin, and popular titles are pushed to the edge in advance. The player's adaptive bitrate logic picks each segment's quality from measured throughput and buffer level.","**Ride-hailing**: drivers report locations every few seconds, so the location index is write-heavy, in memory and partitioned by city, with cells mapping to drivers and a TTL for drivers who go quiet. Matching offers a trip to one nearby driver at a time with a timeout, and never assigns a driver twice, using a conditional update on the driver's state. A trip is a durable state machine (requested, accepted, arrived, in progress, completed); ETAs and pricing are separate services, and location history streams to analytics.","**Collaborative documents**: every edit is applied locally at once, sent to the server, and merged with concurrent edits. Operational transformation, used by Google Docs, shifts each operation's positions to account for operations it didn't know about, with the server fixing the order; CRDTs such as Yjs and Automerge give every character a unique, ordered id, so copies merge in any order, even after working offline. Cursors and presence travel over WebSockets, and documents are stored as snapshots plus an operation log.","**Payment systems**: correctness comes first. Every request carries an idempotency key, so a retry after a timeout never charges twice; money moves through a double-entry ledger, where every transaction debits one account and credits another and entries are only ever appended; payments are state machines, with sagas for refunds and reversals; and daily reconciliation compares the ledger with the provider's and the bank's records. Card numbers stay with a PCI-compliant provider, which returns tokens.","**Web crawlers**: a URL frontier decides what to fetch next and enforces politeness, with one queue per host, a delay between requests to the same host, and respect for robots.txt. Fetchers resolve DNS through a cache and download; parsers extract links, which are normalised and deduplicated with a URL-seen set or Bloom filter before joining the frontier, and content fingerprints catch duplicate pages. How often a page is recrawled follows how often it changes.","**Distributed key-value stores**, as in Dynamo and Cassandra: consistent hashing with virtual nodes spreads keys and limits movement when nodes join or leave; each key is replicated to N nodes, with tunable quorums (W + R > N for reading your own writes); sloppy quorums and hinted handoff keep writes available during failures; Merkle trees find differing key ranges cheaply for anti-entropy repair; and gossip spreads membership and failure suspicion.","**The recurring parts**: most designs reuse the same building blocks: object storage and a CDN for large blobs, a cache in front of hot reads, a log or queue between producers and slow consumers, idempotent consumers, a store partitioned by the main access pattern, and asynchronous pipelines for analytics. Naming them quickly leaves time for the part that's unique to the problem."],"dia":[{"type":"flow","cap":"Video: from upload to playback","steps":[["Upload","in resumable chunks, to object storage"],["Transcode","a job graph: several resolutions and bitrates"],["Package","4-second segments and an HLS or DASH manifest"],["Distribute","CDN edges cache the segments; popular titles are pushed early"],["Play","the player picks a bitrate for each segment"]],"note":"Encoding happens once per title; delivery happens millions of times, so nearly all the cost and engineering is in the CDN and the player."},{"type":"tiers","cap":"A payment system","tiers":[["Checkout",["each request carries an idempotency key"]],["Payment service",["state machine: created, authorized, captured, refunded","idempotency store"],"API"],["Ledger",["double-entry, append-only"],"every movement of money"],["Providers",["card processor, holding card numbers behind tokens","bank transfers"],"calls with retries and the same key"],["Reconciliation",["daily: the ledger against provider and bank statements"],"settlement files"]],"note":"Every step can be retried safely, and reconciliation catches whatever slipped through, such as a charge whose reply was lost."},{"type":"flow","cap":"A web crawler's loop","steps":[["Frontier","priority queues, one per host, with politeness delays"],["Fetch","cached DNS, robots.txt, timeouts"],["Parse","extract links and text"],["Deduplicate","URL seen before? Page content seen before?"],["Store","pages to storage, new URLs back to the frontier"]],"loop":"new URLs","note":"The frontier is the brain: it decides priority, freshness and politeness; everything else is plumbing that scales out."}],"cmp":[{"cap":"Six designs, and what dominates each","head":["Design","Dominant concern","Key techniques"],"rows":[["Video streaming","Bandwidth and start-up time","Transcoding ladders, segments, CDNs, adaptive bitrate"],["Ride-hailing","Location updates and fast matching","In-memory geo index per city, TTLs, conditional assignment"],["Collaborative docs","Concurrent edits that must converge","OT or CRDTs, WebSockets, snapshots plus an op log"],["Payments","Correctness under failure","Idempotency keys, double-entry ledger, reconciliation"],["Web crawler","Politeness and scale","Per-host queues, robots.txt, URL dedup, recrawl scheduling"],["Key-value store","Availability and partitioning","Consistent hashing, quorums, hinted handoff, Merkle trees"]]},{"cap":"Operational transformation or CRDTs","head":["","Operational transformation","CRDTs"],"rows":[["Concurrent edits","Each operation is transformed against the ones it missed","Every element has a unique, ordered id; merges work in any order"],["Needs a server","Usually, to order operations","No: peer-to-peer and offline editing work"],["Metadata","Small","Ids per element, and tombstones for deletions"],["Examples","Google Docs and other server-based editors","Yjs, Automerge and many local-first apps"]]}],"code":[{"t":"Helpers used by the examples: a seeded generator, geohash encoding and a city-scale distance","tabs":[{"lang":"python","src":"import math\n\ndef mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nBASE32 = \"0123456789bcdefghjkmnpqrstuvwxyz\"\nM_PER_DEG_LAT, M_PER_DEG_LON = 111_195, 73_160  # metres per degree; longitude degrees shrink with latitude (Paris, 48.86° N)\n\ndef encode(lat, lon, length):\n    \"\"\"Geohash: halve the longitude and latitude ranges in turn, one bit each time, 5 bits per character.\"\"\"\n    lat_r, lon_r = [-90.0, 90.0], [-180.0, 180.0]\n    value, chars = 0, []\n    for i in range(length * 5):\n        rng, x = (lon_r, lon) if i % 2 == 0 else (lat_r, lat)   # even bits split longitude, odd bits latitude\n        mid = (rng[0] + rng[1]) / 2\n        bit = 1 if x >= mid else 0\n        rng[1 - bit] = mid                      # keep the half that contains the point\n        value = value * 2 + bit\n        if i % 5 == 4:\n            chars.append(BASE32[value])\n            value = 0\n    return \"\".join(chars)\n\ndef bbox(gh):\n    \"\"\"The cell a geohash names: (lat_lo, lat_hi, lon_lo, lon_hi).\"\"\"\n    lat_r, lon_r = [-90.0, 90.0], [-180.0, 180.0]\n    i = 0\n    for ch in gh:\n        v = BASE32.index(ch)\n        for shift in range(4, -1, -1):\n            rng = lon_r if i % 2 == 0 else lat_r\n            rng[1 - ((v >> shift) & 1)] = (rng[0] + rng[1]) / 2\n            i += 1\n    return lat_r[0], lat_r[1], lon_r[0], lon_r[1]\n\ndef metres(lat1, lon1, lat2, lon2):             # a flat-earth distance: accurate enough across a city\n    dy, dx = (lat2 - lat1) * M_PER_DEG_LAT, (lon2 - lon1) * M_PER_DEG_LON\n    return math.sqrt(dx * dx + dy * dy)\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst BASE32 = \"0123456789bcdefghjkmnpqrstuvwxyz\";\nconst M_PER_DEG_LAT = 111_195, M_PER_DEG_LON = 73_160;   // metres per degree; longitude degrees shrink with latitude (Paris, 48.86° N)\n\nfunction encode(lat, lon, length) {\n  // geohash: halve the longitude and latitude ranges in turn, one bit each time, 5 bits per character\n  const latR = [-90, 90], lonR = [-180, 180];\n  let value = 0, chars = \"\";\n  for (let i = 0; i < length * 5; i++) {\n    const [rng, x] = i % 2 === 0 ? [lonR, lon] : [latR, lat];   // even bits split longitude, odd bits latitude\n    const mid = (rng[0] + rng[1]) / 2;\n    const bit = x >= mid ? 1 : 0;\n    rng[1 - bit] = mid;                         // keep the half that contains the point\n    value = value * 2 + bit;\n    if (i % 5 === 4) { chars += BASE32[value]; value = 0; }\n  }\n  return chars;\n}\n\nfunction bbox(gh) {\n  // the cell a geohash names: [latLo, latHi, lonLo, lonHi]\n  const latR = [-90, 90], lonR = [-180, 180];\n  let i = 0;\n  for (const ch of gh) {\n    const v = BASE32.indexOf(ch);\n    for (let shift = 4; shift >= 0; shift--) {\n      const rng = i % 2 === 0 ? lonR : latR;\n      rng[1 - ((v >> shift) & 1)] = (rng[0] + rng[1]) / 2;\n      i++;\n    }\n  }\n  return [latR[0], latR[1], lonR[0], lonR[1]];\n}\n\nfunction metres(lat1, lon1, lat2, lon2) {       // a flat-earth distance: accurate enough across a city\n  const dy = (lat2 - lat1) * M_PER_DEG_LAT, dx = (lon2 - lon1) * M_PER_DEG_LON;\n  return Math.sqrt(dx * dx + dy * dy);\n}\n"}]},{"t":"Video: three ways to pick the next segment's bitrate","tabs":[{"lang":"python","src":"rand = mulberry32(11)\nRATES = [400, 1000, 2500, 5000, 8000]                 # kbit/s of each rendition, from 240p to 4K\nSEGMENT_MS, MAX_BUFFER_MS = 4000, 30_000\n\nbandwidth, trace = 6000, []\nfor n in range(150):                                   # the network during each segment's download, in kbit/s\n    bandwidth = max(800, min(12_000, bandwidth + int((rand() - 0.5) * 3000)))\n    trace.append(600 if 60 <= n < 75 else bandwidth)   # a train tunnel for a minute\n\ndef play(policy):\n    buffer = stall = switches = total = 0\n    last_rate, measured = None, 3000\n    for bw in trace:\n        if policy == \"fixed 5 Mbit/s\":\n            rate = 5000\n        elif policy == \"by throughput\":\n            rate = max([r for r in RATES if r <= measured * 8 // 10] or [RATES[0]])   # 80% of the last measurement\n        else:                                          # by buffer (BBA-0): map the buffer onto the bitrate range\n            f = RATES[0] + (RATES[-1] - RATES[0]) * max(0, min(18_000, buffer - 8000)) // 18_000\n            prev = last_rate or RATES[0]\n            higher, lower = [r for r in RATES if r > prev], [r for r in RATES if r < prev]\n            if higher and f >= higher[0]:\n                rate = max(r for r in RATES if r <= f)     # step up only when the buffer clearly allows it\n            elif lower and f <= lower[-1]:\n                rate = min(r for r in RATES if r >= f)     # step down only when it clearly demands it\n            else:\n                rate = prev\n        download_ms = rate * SEGMENT_MS // bw          # the segment's size divided by the bandwidth\n        if download_ms > buffer:\n            stall += download_ms - buffer              # the buffer ran dry: the picture freezes\n        buffer = min(MAX_BUFFER_MS, max(0, buffer - download_ms) + SEGMENT_MS)\n        measured = bw\n        switches += last_rate is not None and rate != last_rate\n        last_rate, total = rate, total + rate\n    return stall, total // len(trace), switches\n\nfor policy in (\"fixed 5 Mbit/s\", \"by throughput\", \"by buffer\"):\n    stall, average, switches = play(policy)\n    print(f\"{policy}: frozen for {stall // 1000}.{stall % 1000 // 100} s, average {average} kbit/s, {switches} quality switches\")\n","out":"fixed 5 Mbit/s: frozen for 487.4 s, average 5000 kbit/s, 0 quality switches\nby throughput: frozen for 0.6 s, average 3120 kbit/s, 30 quality switches\nby buffer: frozen for 11.9 s, average 4826 kbit/s, 26 quality switches\n","notes":[[8,"A minute in a tunnel at 600 kbit/s: the stretch that separates good players from bad ones."],[17,"Throughput-based: pick the best rendition below 80% of the last measured speed."],[19,"Buffer-based (BBA-0): the buffer level maps onto a bitrate, and the choice moves only when that mapping clearly passes the next level."],[30,"A stall is the worst outcome for viewers: the picture freezes until the segment arrives."],[39,"A fixed high bitrate freezes again and again. Throughput-based adapts fastest here; buffer-based keeps higher quality but carried a full buffer's confidence into the tunnel. Real players combine both, and abandon a download that's too slow."]]},{"lang":"javascript","src":"const rand = mulberry32(11);\nconst RATES = [400, 1000, 2500, 5000, 8000];           // kbit/s of each rendition, from 240p to 4K\nconst SEGMENT_MS = 4000, MAX_BUFFER_MS = 30000;\n\nlet bandwidth = 6000;\nconst trace = [];\nfor (let n = 0; n < 150; n++) {                        // the network during each segment's download, in kbit/s\n  bandwidth = Math.max(800, Math.min(12000, bandwidth + Math.trunc((rand() - 0.5) * 3000)));\n  trace.push(n >= 60 && n < 75 ? 600 : bandwidth);     // a train tunnel for a minute\n}\n\nfunction play(policy) {\n  let buffer = 0, stall = 0, switches = 0, total = 0, lastRate = null, measured = 3000;\n  for (const bw of trace) {\n    let rate;\n    if (policy === \"fixed 5 Mbit/s\") rate = 5000;\n    else if (policy === \"by throughput\") {\n      const fits = RATES.filter(r => r <= Math.floor(measured * 8 / 10));   // 80% of the last measurement\n      rate = fits.length ? Math.max(...fits) : RATES[0];\n    } else {                                           // by buffer (BBA-0): map the buffer onto the bitrate range\n      const f = RATES[0] + Math.floor((RATES.at(-1) - RATES[0]) * Math.max(0, Math.min(18000, buffer - 8000)) / 18000);\n      const prev = lastRate ?? RATES[0];\n      const higher = RATES.filter(r => r > prev), lower = RATES.filter(r => r < prev);\n      if (higher.length && f >= higher[0]) rate = Math.max(...RATES.filter(r => r <= f));   // step up only when the buffer clearly allows it\n      else if (lower.length && f <= lower.at(-1)) rate = Math.min(...RATES.filter(r => r >= f));   // step down only when it clearly demands it\n      else rate = prev;\n    }\n    const downloadMs = Math.floor(rate * SEGMENT_MS / bw);   // the segment's size divided by the bandwidth\n    if (downloadMs > buffer) stall += downloadMs - buffer;   // the buffer ran dry: the picture freezes\n    buffer = Math.min(MAX_BUFFER_MS, Math.max(0, buffer - downloadMs) + SEGMENT_MS);\n    measured = bw;\n    if (lastRate !== null && rate !== lastRate) switches++;\n    lastRate = rate;\n    total += rate;\n  }\n  return [stall, Math.floor(total / trace.length), switches];\n}\n\nfor (const policy of [\"fixed 5 Mbit/s\", \"by throughput\", \"by buffer\"]) {\n  const [stall, average, switches] = play(policy);\n  console.log(`${policy}: frozen for ${Math.floor(stall / 1000)}.${Math.floor((stall % 1000) / 100)} s, average ${average} kbit/s, ${switches} quality switches`);\n}\n","out":"fixed 5 Mbit/s: frozen for 487.4 s, average 5000 kbit/s, 0 quality switches\nby throughput: frozen for 0.6 s, average 3120 kbit/s, 30 quality switches\nby buffer: frozen for 11.9 s, average 4826 kbit/s, 26 quality switches\n","notes":[[9,"A minute in a tunnel at 600 kbit/s: the stretch that separates good players from bad ones."],[18,"Throughput-based: pick the best rendition below 80% of the last measured speed."],[21,"Buffer-based (BBA-0): the buffer level maps onto a bitrate, and the choice moves only when that mapping clearly passes the next level."],[29,"A stall is the worst outcome for viewers: the picture freezes until the segment arrives."],[41,"A fixed high bitrate freezes again and again. Throughput-based adapts fastest here; buffer-based keeps higher quality but carried a full buffer's confidence into the tunnel. Real players combine both, and abandon a download that's too slow."]]}]},{"t":"Collaborative editing: operational transformation keeps copies identical","tabs":[{"lang":"python","src":"def apply(text, op):\n    kind, pos, ch, site = op\n    if pos is None:\n        return text                                    # an edit that became a no-op\n    return text[:pos] + ch + text[pos:] if kind == \"ins\" else text[:pos] + text[pos + 1:]\n\ndef transform(op, against):\n    \"\"\"Rewrite op so it applies after `against`, an edit made at the same time on another copy.\"\"\"\n    kind, pos, ch, site = op\n    other_kind, other_pos, _, other_site = against\n    if pos is None or other_pos is None:\n        return op\n    if other_kind == \"ins\":\n        if other_pos < pos or (other_pos == pos and (kind == \"del\" or other_site < site)):\n            pos += 1                                   # text was inserted before us: move right\n    elif other_pos < pos:\n        pos -= 1                                       # text was deleted before us: move left\n    elif other_pos == pos and kind == \"del\":\n        pos = None                                     # both deleted the same character\n    return (kind, pos, ch, site)\n\nbase = \"cat\"\nana, ben = (\"ins\", 3, \"s\", 1), (\"ins\", 1, \"h\", 2)      # typed at the same moment on two copies\nprint(\"without transforming:\", apply(apply(base, ana), ben), apply(apply(base, ben), ana))\nprint(\"with transforming:\", apply(apply(base, ana), transform(ben, ana)), apply(apply(base, ben), transform(ana, ben)))\n\nrand = mulberry32(3)\nnaive_agree = ot_agree = 0\nfor _ in range(1000):\n    base = \"\".join(\"abcdefgh\"[int(rand() * 8)] for _ in range(1 + int(rand() * 8)))\n    ops = []\n    for site in (1, 2):\n        if rand() < 0.5:\n            ops.append((\"del\", int(rand() * len(base)), \"\", site))\n        else:\n            ops.append((\"ins\", int(rand() * (len(base) + 1)), \"xy\"[site - 1], site))\n    a, b = ops\n    naive_agree += apply(apply(base, a), b) == apply(apply(base, b), a)\n    ot_agree += apply(apply(base, a), transform(b, a)) == apply(apply(base, b), transform(a, b))\nprint(f\"1000 random pairs of simultaneous edits: copies agree {naive_agree} times without transforming, {ot_agree} with it\")\n","out":"without transforming: chats chast\nwith transforming: chats chats\n1000 random pairs of simultaneous edits: copies agree 232 times without transforming, 1000 with it\n","notes":[[14,"Two inserts at the same place are ordered by site id, so every copy breaks the tie the same way."],[19,"If both sides deleted the same character, the second delete becomes a no-op."],[24,"Applied as they arrive, the same two edits leave the copies different."],[40,"Transformed, every pair converges: Google Docs runs this idea for every keystroke, with the server ordering operations."]]},{"lang":"javascript","src":"function apply(text, [kind, pos, ch]) {\n  if (pos === null) return text;                       // an edit that became a no-op\n  return kind === \"ins\" ? text.slice(0, pos) + ch + text.slice(pos) : text.slice(0, pos) + text.slice(pos + 1);\n}\n\nfunction transform(op, against) {\n  // rewrite op so it applies after `against`, an edit made at the same time on another copy\n  let [kind, pos, ch, site] = op;\n  const [otherKind, otherPos, , otherSite] = against;\n  if (pos === null || otherPos === null) return op;\n  if (otherKind === \"ins\") {\n    if (otherPos < pos || (otherPos === pos && (kind === \"del\" || otherSite < site))) pos += 1;   // text was inserted before us: move right\n  } else if (otherPos < pos) {\n    pos -= 1;                                          // text was deleted before us: move left\n  } else if (otherPos === pos && kind === \"del\") {\n    pos = null;                                        // both deleted the same character\n  }\n  return [kind, pos, ch, site];\n}\n\nconst base = \"cat\";\nconst ana = [\"ins\", 3, \"s\", 1], ben = [\"ins\", 1, \"h\", 2];   // typed at the same moment on two copies\nconsole.log(\"without transforming:\", apply(apply(base, ana), ben), apply(apply(base, ben), ana));\nconsole.log(\"with transforming:\", apply(apply(base, ana), transform(ben, ana)), apply(apply(base, ben), transform(ana, ben)));\n\nconst rand = mulberry32(3);\nlet naiveAgree = 0, otAgree = 0;\nfor (let i = 0; i < 1000; i++) {\n  let text = \"\";\n  for (let n = 1 + Math.floor(rand() * 8); n > 0; n--) text += \"abcdefgh\"[Math.floor(rand() * 8)];\n  const ops = [];\n  for (const site of [1, 2]) {\n    if (rand() < 0.5) ops.push([\"del\", Math.floor(rand() * text.length), \"\", site]);\n    else ops.push([\"ins\", Math.floor(rand() * (text.length + 1)), \"xy\"[site - 1], site]);\n  }\n  const [a, b] = ops;\n  if (apply(apply(text, a), b) === apply(apply(text, b), a)) naiveAgree++;\n  if (apply(apply(text, a), transform(b, a)) === apply(apply(text, b), transform(a, b))) otAgree++;\n}\nconsole.log(`1000 random pairs of simultaneous edits: copies agree ${naiveAgree} times without transforming, ${otAgree} with it`);\n","out":"without transforming: chats chast\nwith transforming: chats chats\n1000 random pairs of simultaneous edits: copies agree 232 times without transforming, 1000 with it\n","notes":[[12,"Two inserts at the same place are ordered by site id, so every copy breaks the tie the same way."],[16,"If both sides deleted the same character, the second delete becomes a no-op."],[23,"Applied as they arrive, the same two edits leave the copies different."],[40,"Transformed, every pair converges: Google Docs runs this idea for every keystroke, with the server ordering operations."]]}]},{"t":"A crawler's frontier: breadth first against one polite queue per host","tabs":[{"lang":"python","src":"HOST_PAGES = [20_000] + [500] * 49                     # one huge site and 49 small ones\n\ndef links(host, page):\n    \"\"\"The links on a page: mostly to the same site, sometimes to another. The same page always has the same links.\"\"\"\n    r = mulberry32(host * 100_003 + page)\n    out = []\n    for _ in range(6):\n        h = host if r() < 0.85 else int(r() * len(HOST_PAGES))\n        out.append((h, int(r() * HOST_PAGES[h])))\n    return out\n\ndef crawl(polite, seconds=60, workers=10, fetch_ticks=2, gap_ticks=10):   # ticks of 100 ms\n    seeds = [(h, 0) for h in range(5)]                 # the front pages of five sites\n    seen, fifo, head = set(seeds), list(seeds), 0\n    queues, heads, next_ok = {}, {}, {}                # polite: one queue per host, and when it may be fetched again\n    for url in seeds:\n        queues.setdefault(url[0], []).append(url)\n        heads[url[0]] = 0\n    busy_until, fetched, per_second = [0] * workers, 0, {}\n    for tick in range(seconds * 10):\n        for w in range(workers):\n            if busy_until[w] > tick:\n                continue\n            url = None\n            if polite:\n                ready = [h for h in queues if heads[h] < len(queues[h]) and next_ok.get(h, 0) <= tick]\n                if ready:\n                    h = min(ready, key=lambda h: (next_ok.get(h, 0), h))   # the host that has waited longest\n                    url, heads[h], next_ok[h] = queues[h][heads[h]], heads[h] + 1, tick + gap_ticks\n            elif head < len(fifo):\n                url, head = fifo[head], head + 1       # breadth first, whatever the host\n            if url is None:\n                break\n            busy_until[w], fetched = tick + fetch_ticks, fetched + 1\n            per_second[(url[0], tick // 10)] = per_second.get((url[0], tick // 10), 0) + 1\n            for link in links(*url):\n                if link not in seen:                   # deduplicate before queueing\n                    seen.add(link)\n                    if polite:\n                        queues.setdefault(link[0], []).append(link)\n                        heads.setdefault(link[0], 0)\n                    else:\n                        fifo.append(link)\n    return fetched, max(per_second.values()), len(seen) - fetched\n\nfor polite in (False, True):\n    fetched, busiest, waiting = crawl(polite)\n    label = \"one queue per host, 1 request a second each\" if polite else \"one breadth-first queue\"\n    print(f\"{label}: {fetched} pages in 60 s, at most {busiest} requests to one site in a second, {waiting} URLs waiting\")\n","out":"one breadth-first queue: 3000 pages in 60 s, at most 47 requests to one site in a second, 9794 URLs waiting\none queue per host, 1 request a second each: 2934 pages in 60 s, at most 1 requests to one site in a second, 9815 URLs waiting\n","notes":[[8,"Most links stay on the same site, so a breadth-first queue fills up with one site's pages."],[26,"Only hosts whose politeness delay has passed are candidates."],[29,"After a fetch, that host must wait a second before the next one."],[37,"Every URL is checked against the seen set before it's queued; at billions of URLs this becomes a Bloom filter or a sharded store."],[49,"Breadth first is faster here only because it hammers the big site; the polite crawler spreads its requests and stays welcome."]]},{"lang":"javascript","src":"const HOST_PAGES = [20000, ...new Array(49).fill(500)];   // one huge site and 49 small ones\n\nfunction links(host, page) {\n  // the links on a page: mostly to the same site, sometimes to another; the same page always has the same links\n  const r = mulberry32(host * 100003 + page);\n  const out = [];\n  for (let i = 0; i < 6; i++) {\n    const h = r() < 0.85 ? host : Math.floor(r() * HOST_PAGES.length);\n    out.push([h, Math.floor(r() * HOST_PAGES[h])]);\n  }\n  return out;\n}\n\nfunction crawl(polite, seconds = 60, workers = 10, fetchTicks = 2, gapTicks = 10) {   // ticks of 100 ms\n  const seeds = [0, 1, 2, 3, 4].map(h => [h, 0]);     // the front pages of five sites\n  const seen = new Set(seeds.map(u => u.join(\"/\"))), fifo = [...seeds];\n  let head = 0;\n  const queues = new Map(), heads = new Map(), nextOk = new Map();   // polite: one queue per host, and when it may be fetched again\n  for (const url of seeds) { queues.set(url[0], [url]); heads.set(url[0], 0); }\n  const busyUntil = new Array(workers).fill(0), perSecond = new Map();\n  let fetched = 0;\n  for (let tick = 0; tick < seconds * 10; tick++) {\n    for (let w = 0; w < workers; w++) {\n      if (busyUntil[w] > tick) continue;\n      let url = null;\n      if (polite) {\n        const ready = [...queues.keys()].filter(h => heads.get(h) < queues.get(h).length && (nextOk.get(h) ?? 0) <= tick);\n        if (ready.length) {\n          const h = ready.reduce((best, x) => {        // the host that has waited longest\n            const [bx, xx] = [nextOk.get(best) ?? 0, nextOk.get(x) ?? 0];\n            return xx < bx || (xx === bx && x < best) ? x : best;\n          });\n          url = queues.get(h)[heads.get(h)];\n          heads.set(h, heads.get(h) + 1);\n          nextOk.set(h, tick + gapTicks);\n        }\n      } else if (head < fifo.length) {\n        url = fifo[head++];                            // breadth first, whatever the host\n      }\n      if (url === null) break;\n      busyUntil[w] = tick + fetchTicks;\n      fetched++;\n      const key = `${url[0]}@${Math.floor(tick / 10)}`;\n      perSecond.set(key, (perSecond.get(key) ?? 0) + 1);\n      for (const link of links(...url)) {\n        if (!seen.has(link.join(\"/\"))) {               // deduplicate before queueing\n          seen.add(link.join(\"/\"));\n          if (polite) {\n            if (!queues.has(link[0])) { queues.set(link[0], []); heads.set(link[0], 0); }\n            queues.get(link[0]).push(link);\n          } else fifo.push(link);\n        }\n      }\n    }\n  }\n  return [fetched, Math.max(...perSecond.values()), seen.size - fetched];\n}\n\nfor (const polite of [false, true]) {\n  const [fetched, busiest, waiting] = crawl(polite);\n  const label = polite ? \"one queue per host, 1 request a second each\" : \"one breadth-first queue\";\n  console.log(`${label}: ${fetched} pages in 60 s, at most ${busiest} requests to one site in a second, ${waiting} URLs waiting`);\n}\n","out":"one breadth-first queue: 3000 pages in 60 s, at most 47 requests to one site in a second, 9794 URLs waiting\none queue per host, 1 request a second each: 2934 pages in 60 s, at most 1 requests to one site in a second, 9815 URLs waiting\n","notes":[[8,"Most links stay on the same site, so a breadth-first queue fills up with one site's pages."],[27,"Only hosts whose politeness delay has passed are candidates."],[35,"After a fetch, that host must wait a second before the next one."],[46,"Every URL is checked against the seen set before it's queued; at billions of URLs this becomes a Bloom filter or a sharded store."],[62,"Breadth first is faster here only because it hammers the big site; the polite crawler spreads its requests and stays welcome."]]}]}],"ex":{"q":"Design the driver-location service for a ride-hailing app: 2,000 drivers in one city, each reporting every 4 seconds; riders ask for the three nearest available drivers. Drivers who stop reporting must not be offered. Show the index and how much work the updates really cause.","steps":["Scale: 2,000 drivers every 4 seconds is 500 updates a second for this city; 500,000 drivers nationally would be 125,000 a second, so partition by city and keep positions in memory.","Index: driver → (position, cell, last seen) and cell → set of drivers, with 6-character cells (about 800 × 610 m in Paris). An update that stays in the same cell only overwrites the position; only a change of cell touches two sets.","Query: read the rider's cell and its 8 neighbours, skip drivers silent for longer than the TTL (30 seconds), compute exact distances and return the nearest three. If fewer than three are found, widen to 5-character cells.","Costs: O(1) per update; a query reads nine cells, a few dozen drivers in a busy area. Redis GEO (GEOADD, GEOSEARCH) does the same with a geohash-scored sorted set; replicate per city, and stream the history to cheap storage for ETAs and analytics."],"code":{"t":"A city's driver index: cheap updates, nine-cell queries, a TTL for silent drivers","tabs":[{"lang":"python","src":"class DriverIndex:\n    \"\"\"Where each driver is now: driver -> (lat, lon, cell, last seen), and cell -> drivers in it.\"\"\"\n    def __init__(self, precision=6, ttl=30):\n        self.precision, self.ttl = precision, ttl\n        self.drivers, self.cells = {}, {}\n        self.updates = self.cell_changes = 0\n\n    def update(self, driver, lat, lon, now):\n        cell = encode(lat, lon, self.precision)\n        self.updates += 1\n        old = self.drivers.get(driver)\n        if old is not None and old[2] != cell:\n            self.cells[old[2]].discard(driver)     # moved to another cell: the only update that touches two sets\n            self.cell_changes += 1\n        if old is None or old[2] != cell:\n            self.cells.setdefault(cell, set()).add(driver)\n        self.drivers[driver] = (lat, lon, cell, now)   # otherwise just overwrite the position\n\n    def nearest(self, lat, lon, k, now):\n        lat_lo, lat_hi, lon_lo, lon_hi = bbox(encode(lat, lon, self.precision))\n        h, w = lat_hi - lat_lo, lon_hi - lon_lo\n        found, stale = [], []\n        for dy in (-1, 0, 1):\n            for dx in (-1, 0, 1):\n                for d in self.cells.get(encode(lat + dy * h, lon + dx * w, self.precision), ()):\n                    dlat, dlon, _, seen = self.drivers[d]\n                    if now - seen > self.ttl:\n                        stale.append(d)            # silent too long: don't offer this driver\n                    else:\n                        found.append((metres(lat, lon, dlat, dlon), d))\n        return sorted(found)[:k], sorted(stale)\n\nrand = mulberry32(5)\nindex = DriverIndex()\npositions = {f\"d{i}\": [48.84 + rand() * 0.04, 2.31 + rand() * 0.06] for i in range(2000)}\nindex.update(\"ghost\", 48.8607, 2.3377, 0)          # a driver who reported once, right by the Louvre, then went quiet\nfor t in range(0, 240, 4):                         # four minutes of updates every 4 seconds\n    for driver, p in positions.items():\n        p[0] += (rand() - 0.5) * 0.0002            # about 10 km/h of wandering\n        p[1] += (rand() - 0.5) * 0.0003\n        index.update(driver, p[0], p[1], t)\nper_mille = index.cell_changes * 1000 // index.updates\nprint(f\"location updates: {index.updates} | changed cell: {index.cell_changes} ({per_mille // 10}.{per_mille % 10}%)\")\nnearest, stale = index.nearest(48.8606, 2.3376, 3, 236)\nprint(\"nearest three:\", \", \".join(f\"{d} at {int(m + 0.5)} m\" for m, d in nearest), \"| skipped as stale:\", *stale)\n","out":"location updates: 120001 | changed cell: 1984 (1.6%)\nnearest three: d1155 at 26 m, d1665 at 54 m, d1930 at 74 m | skipped as stale: ghost\n"},{"lang":"javascript","src":"class DriverIndex {\n  // where each driver is now: driver -> [lat, lon, cell, last seen], and cell -> drivers in it\n  constructor(precision = 6, ttl = 30) {\n    this.precision = precision; this.ttl = ttl;\n    this.drivers = new Map(); this.cells = new Map();\n    this.updates = 0; this.cellChanges = 0;\n  }\n  update(driver, lat, lon, now) {\n    const cell = encode(lat, lon, this.precision);\n    this.updates++;\n    const old = this.drivers.get(driver);\n    if (old !== undefined && old[2] !== cell) {\n      this.cells.get(old[2]).delete(driver);       // moved to another cell: the only update that touches two sets\n      this.cellChanges++;\n    }\n    if (old === undefined || old[2] !== cell) {\n      if (!this.cells.has(cell)) this.cells.set(cell, new Set());\n      this.cells.get(cell).add(driver);\n    }\n    this.drivers.set(driver, [lat, lon, cell, now]);   // otherwise just overwrite the position\n  }\n  nearest(lat, lon, k, now) {\n    const [latLo, latHi, lonLo, lonHi] = bbox(encode(lat, lon, this.precision));\n    const h = latHi - latLo, w = lonHi - lonLo;\n    const found = [], stale = [];\n    for (const dy of [-1, 0, 1]) {\n      for (const dx of [-1, 0, 1]) {\n        for (const d of this.cells.get(encode(lat + dy * h, lon + dx * w, this.precision)) ?? []) {\n          const [dlat, dlon, , seen] = this.drivers.get(d);\n          if (now - seen > this.ttl) stale.push(d);   // silent too long: don't offer this driver\n          else found.push([metres(lat, lon, dlat, dlon), d]);\n        }\n      }\n    }\n    found.sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : 1));\n    return [found.slice(0, k), stale.sort()];\n  }\n}\n\nconst rand = mulberry32(5);\nconst index = new DriverIndex();\nconst positions = new Map(Array.from({ length: 2000 }, (_, i) => [`d${i}`, [48.84 + rand() * 0.04, 2.31 + rand() * 0.06]]));\nindex.update(\"ghost\", 48.8607, 2.3377, 0);         // a driver who reported once, right by the Louvre, then went quiet\nfor (let t = 0; t < 240; t += 4) {                 // four minutes of updates every 4 seconds\n  for (const [driver, p] of positions) {\n    p[0] += (rand() - 0.5) * 0.0002;               // about 10 km/h of wandering\n    p[1] += (rand() - 0.5) * 0.0003;\n    index.update(driver, p[0], p[1], t);\n  }\n}\nconst perMille = Math.floor(index.cellChanges * 1000 / index.updates);\nconsole.log(`location updates: ${index.updates} | changed cell: ${index.cellChanges} (${Math.floor(perMille / 10)}.${perMille % 10}%)`);\nconst [nearest, stale] = index.nearest(48.8606, 2.3376, 3, 236);\nconsole.log(\"nearest three:\", nearest.map(([m, d]) => `${d} at ${Math.floor(m + 0.5)} m`).join(\", \"), \"| skipped as stale:\", ...stale);\n","out":"location updates: 120001 | changed cell: 1984 (1.6%)\nnearest three: d1155 at 26 m, d1665 at 54 m, d1930 at 74 m | skipped as stale: ghost\n"}]},"a":"The 2,000 drivers sent 120,000 updates, and only 1,984 of them (1.6%) moved a driver into another cell; the rest simply overwrote a position. The nearest three drivers are 26, 54 and 74 m from the rider, and \"ghost\", only about 13 m away but silent for almost four minutes, is skipped."},"fade":{"q":"Finish the payment provider's `charge(amount, key)`: a request whose idempotency key has been seen must not charge the card again. Replay the first result, or reject the request if its amount differs from the first one.","steps":["A timeout doesn't mean the charge failed: the provider may have charged the card and lost the reply. Retrying blindly can charge twice; not retrying can lose the sale.",{"ask":"What should the provider do with a key it has seen before?","a":"Return the stored result of the first request without charging again, so a retry is safe. If the amount differs, reject it: the key is being misused, not retried."},{"ask":"What if every attempt times out?","a":"The outcome is unknown, not failed. Record it, ask the provider for the payment's status later or wait for its webhook, and let reconciliation settle it; never ask the customer to pay again on a guess."},{"ask":"What does it cost?","a":"One lookup and one stored result per key, kept for a day or so (Stripe keeps keys at least 24 hours), plus care that two concurrent requests with the same key can't both charge, for example with a unique constraint on the key."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class PaymentProvider:\n    \"\"\"A card processor. A reply can be lost on its way back, even when the card was charged.\"\"\"\n    def __init__(self, rand):\n        self.rand, self.charges, self.results = rand, [], {}\n\n    def charge(self, amount, key=None):\n        ...                                            # TODO: a key seen before: replay its first result, or reject a different amount\n        self.charges.append(amount)                    # the card is charged\n        result = (\"ok\", f\"ch_{len(self.charges)}\")\n        ...                                            # TODO: remember the outcome under the key\n        return (\"timeout\", None) if self.rand() < 0.15 else result   # the reply may never arrive\n"},{"lang":"javascript","src":"class PaymentProvider {\n  // a card processor; a reply can be lost on its way back, even when the card was charged\n  constructor(rand) { this.rand = rand; this.charges = []; this.results = new Map(); }\n\n  charge(amount, key = null) {\n    // TODO: a key seen before: replay its first result, or reject a different amount\n    this.charges.push(amount);                         // the card is charged\n    const result = [\"ok\", `ch_${this.charges.length}`];\n    // TODO: remember the outcome under the key\n    return this.rand() < 0.15 ? [\"timeout\", null] : result;   // the reply may never arrive\n  }\n}\n"}]},"solution":{"t":"Solution: store each key's first result, and replay it","tabs":[{"lang":"python","src":"class PaymentProvider:\n    \"\"\"A card processor. A reply can be lost on its way back, even when the card was charged.\"\"\"\n    def __init__(self, rand):\n        self.rand, self.charges, self.results = rand, [], {}\n\n    def charge(self, amount, key=None):\n        if key is not None and key in self.results:\n            first_amount, result = self.results[key]\n            if amount != first_amount:\n                result = (\"rejected\", \"key reused with a different amount\")   # misuse, not a retry\n        else:\n            self.charges.append(amount)                # the card is charged\n            result = (\"ok\", f\"ch_{len(self.charges)}\")\n            if key is not None:\n                self.results[key] = (amount, result)   # remember the outcome under the key\n        return (\"timeout\", None) if self.rand() < 0.15 else result   # the reply may never arrive\n\ndef checkout(provider, orders, use_keys, attempts=3):\n    unknown = 0\n    for order_id, amount in orders:\n        for _ in range(attempts):\n            status, _ = provider.charge(amount, order_id if use_keys else None)\n            if status == \"ok\":\n                break\n        else:\n            unknown += 1                               # still unknown: ask the provider later, never guess\n    return len(provider.charges), unknown\n\norders = [(f\"order-{i}\", 1000 + i) for i in range(1, 201)]\nfor use_keys in (False, True):\n    charges, unknown = checkout(PaymentProvider(mulberry32(4)), orders, use_keys)\n    print(f\"{'with' if use_keys else 'without'} idempotency keys: 200 orders, {charges} charges, {unknown} outcomes still unknown\")\nprovider = PaymentProvider(mulberry32(2))\nprovider.charge(500, \"order-9\")\nreplies = [provider.charge(700, \"order-9\")[0] for _ in range(5)]\nprint(\"same key, different amount:\", *replies)\n","out":"without idempotency keys: 200 orders, 229 charges, 2 outcomes still unknown\nwith idempotency keys: 200 orders, 200 charges, 2 outcomes still unknown\nsame key, different amount: rejected rejected rejected rejected rejected\n"},{"lang":"javascript","src":"class PaymentProvider {\n  // a card processor; a reply can be lost on its way back, even when the card was charged\n  constructor(rand) { this.rand = rand; this.charges = []; this.results = new Map(); }\n\n  charge(amount, key = null) {\n    let result;\n    if (key !== null && this.results.has(key)) {\n      const [firstAmount, first] = this.results.get(key);\n      result = amount === firstAmount ? first : [\"rejected\", \"key reused with a different amount\"];   // misuse, not a retry\n    } else {\n      this.charges.push(amount);                       // the card is charged\n      result = [\"ok\", `ch_${this.charges.length}`];\n      if (key !== null) this.results.set(key, [amount, result]);   // remember the outcome under the key\n    }\n    return this.rand() < 0.15 ? [\"timeout\", null] : result;   // the reply may never arrive\n  }\n}\n\nfunction checkout(provider, orders, useKeys, attempts = 3) {\n  let unknown = 0;\n  for (const [orderId, amount] of orders) {\n    let done = false;\n    for (let a = 0; a < attempts && !done; a++) done = provider.charge(amount, useKeys ? orderId : null)[0] === \"ok\";\n    if (!done) unknown++;                              // still unknown: ask the provider later, never guess\n  }\n  return [provider.charges.length, unknown];\n}\n\nconst orders = Array.from({ length: 200 }, (_, i) => [`order-${i + 1}`, 1001 + i]);\nfor (const useKeys of [false, true]) {\n  const [charges, unknown] = checkout(new PaymentProvider(mulberry32(4)), orders, useKeys);\n  console.log(`${useKeys ? \"with\" : \"without\"} idempotency keys: 200 orders, ${charges} charges, ${unknown} outcomes still unknown`);\n}\nconst provider = new PaymentProvider(mulberry32(2));\nprovider.charge(500, \"order-9\");\nconst replies = Array.from({ length: 5 }, () => provider.charge(700, \"order-9\")[0]);\nconsole.log(\"same key, different amount:\", ...replies);\n","out":"without idempotency keys: 200 orders, 229 charges, 2 outcomes still unknown\nwith idempotency keys: 200 orders, 200 charges, 2 outcomes still unknown\nsame key, different amount: rejected rejected rejected rejected rejected\n"}]}},"traps":[["“Stream video straight from our own servers.”","Video is mostly bytes: a single popular title can need terabits a second. Serve segments from CDNs, push popular titles to the edge ahead of demand, and keep the origin for the long tail."],["“If a payment call times out, just retry it.”","Without an idempotency key the retry can charge the card twice. Retry with the same key, and if the outcome is still unknown, check the payment's status before deciding."],["“Store each account's balance and update it.”","In-place updates lose the history and make errors untraceable. Record every movement as balanced double-entry ledger lines, append-only, and derive balances from them."],["“Lock the document while someone is editing.”","Locks kill collaboration and fail badly when a client disconnects. Apply edits locally and merge concurrent ones with operational transformation or CRDTs."],["“Crawl breadth first, as fast as possible.”","That hammers whichever site has the most links, gets the crawler blocked, and can fall into infinite calendar or session-id URL spaces. Use per-host queues and delays, honour robots.txt, normalise URLs and cap depth per site."],["“Last-writer-wins is fine for the key-value store; conflicts are rare.”","Concurrent writes do happen, and last-writer-wins silently drops all but one. Keep one writer per key where you can, or detect conflicts with vector clocks and merge them (CRDTs, or the application)."]],"disc":[["How would you make sure a ride-hailing driver is never assigned two trips at once?","Make assignment a conditional update on the driver's record: set the driver to 'offered' only if they are 'available' (a compare-and-set in the database, or a Lua script in Redis), and expire the offer after 15 seconds so a silent driver is released. The trip service then moves the trip to 'accepted' only if the offer is still valid. Because each step is a state transition guarded by the current state, two matchers racing for one driver can't both win."],["Five million people start the same premiere at the same second. What keeps the video platform up?","Push the title's segments to CDN edges before the start, and start players at a low bitrate so adaptive streaming climbs gradually. Shield the origin with a mid-tier cache that collapses identical requests, scale the licence, authentication and manifest services ahead of time, and spread start times with a short random delay or a waiting room if needed."]],"teach":{"prompt":"Pick two of the six designs and explain to a junior colleague which property dominates each, and which techniques follow from it.","rubric":["Names the dominant property for each chosen design","Video: segments, renditions, CDNs and adaptive bitrate","Payments: idempotency keys, ledger, reconciliation; or editors: OT and CRDTs","Crawlers: per-host politeness and deduplication; or key-value stores: hashing, quorums, repair","Says what fails without each technique"],"model":"Video streaming is dominated by bandwidth. So each title is encoded once into a ladder of resolutions and bitrates, cut into segments of a few seconds, and served from CDN edges; the player measures throughput and watches its buffer to choose each segment's quality, so it can drop quality instead of freezing. Without segments and CDNs the origin melts; without adaptive bitrate a tunnel freezes the picture. Payments are dominated by correctness. Every request carries an idempotency key, so a retry after a timeout replays the first result instead of charging again; money moves through an append-only double-entry ledger; and daily reconciliation against the provider's and bank's records catches anything left in an unknown state. Without keys, retries double-charge; without reconciliation, lost replies turn into silent errors."},"qa":[["What does adaptive bitrate streaming adapt to?","The measured throughput and the buffer level, choosing each segment's quality."],["Why do payment APIs take idempotency keys?","So a retry after a timeout returns the first result instead of charging again."],["What does operational transformation do?","Shifts each edit's position to account for concurrent edits, so every copy converges."],["What makes a crawler polite?","A delay between requests to the same host, honouring robots.txt, and identifying itself."],["How does a Dynamo-style store find differences between replicas cheaply?","By comparing Merkle trees of key ranges."],["Why keep driver locations in memory, partitioned by city?","Updates arrive every few seconds and only the latest position matters for matching."]],"quiz":[{"q":"What does this print?","snip":{"t":"A throughput-based bitrate choice","tabs":[{"lang":"python","src":"rates = [400, 1000, 2500, 5000, 8000]\nthroughput = 3200\nprint(max(r for r in rates if r <= throughput * 8 // 10))\n"},{"lang":"javascript","src":"const rates = [400, 1000, 2500, 5000, 8000];\nconst throughput = 3200;\nconsole.log(Math.max(...rates.filter(r => r <= Math.floor(throughput * 8 / 10))));\n"}]},"o":["2500","5000","1000","3200"],"a":0,"e":"80% of 3,200 kbit/s is 2,560, and the best rendition below that is 2,500. The safety margin absorbs estimation errors that would otherwise stall playback."},{"q":"What does this print?","snip":{"t":"Transforming one insert against another","tabs":[{"lang":"python","src":"text = \"cat\"\nana, ben = (3, \"s\"), (1, \"h\")                  # (position, letter), typed at the same moment\npos = ana[0] + (1 if ben[0] <= ana[0] else 0)  # shift Ana's insert past Ben's\nmerged = text[:ben[0]] + ben[1] + text[ben[0]:]\nprint(merged[:pos] + ana[1] + merged[pos:], pos)\n"},{"lang":"javascript","src":"const text = \"cat\";\nconst ana = [3, \"s\"], ben = [1, \"h\"];          // [position, letter], typed at the same moment\nconst pos = ana[0] + (ben[0] <= ana[0] ? 1 : 0);   // shift Ana's insert past Ben's\nconst merged = text.slice(0, ben[0]) + ben[1] + text.slice(ben[0]);\nconsole.log(merged.slice(0, pos) + ana[1] + merged.slice(pos), pos);\n"}]},"o":["chats 4","chast 3","chats 3","chat 4"],"a":0,"e":"Ben's 'h' went in before position 3, so Ana's 's' moves from 3 to 4, and both copies read 'chats'. Without the shift, Ben's copy would read 'chast'."},{"q":"Why is video cut into segments of a few seconds, each encoded at several bitrates?","o":["So the player can change quality between segments as the network changes, and CDNs can cache segments like ordinary files","So each segment can use a different encryption key","So uploads finish faster","To save storage"],"a":0,"e":"Segments are the unit of both adaptation and caching. They cost extra storage, one copy per rendition, which is cheap compared with bandwidth and frozen screens."},{"q":"A checkout service's call to the payment provider times out. What should it do?","o":["Retry with the same idempotency key; if the outcome is still unknown, check the payment's status with the provider before deciding","Retry without a key","Mark the order as failed and ask the customer to pay again","Assume the payment succeeded"],"a":0,"e":"A timeout leaves the outcome unknown. The same key makes retries safe, and a status check or webhook, followed by reconciliation, settles what really happened."},{"q":"Which techniques keep a Dynamo-style key-value store available and its replicas convergent? (choose 3)","t":"ms","o":["Consistent hashing with virtual nodes","Hinted handoff while a replica is down","Merkle trees to find and repair differences between replicas","One global lock per key","Two-phase commit on every write"],"a":[0,1,2],"e":"Hashing spreads the keys, hinted handoff keeps accepting writes during failures, and Merkle trees repair what drifted. Global locks and two-phase commit would give up the availability Dynamo was built for."},{"q":"Judge each statement.","t":"yn","s":[["A double-entry ledger updates account balances in place.",false],["A polite crawler limits how often it fetches from each host.",true],["CRDT-based editors can merge edits made while offline.",true],["A ride-hailing app should write every location update to its main relational database.",false]],"e":"Ledgers append balanced entries and derive balances. Politeness is per host. CRDTs merge in any order, so offline edits merge on reconnect. Live locations belong in an in-memory index, with history streamed elsewhere."},{"q":"Put a video's journey in order.","t":"ord","items":["Upload the source file in chunks to object storage","Transcode it into several resolutions and bitrates","Cut each rendition into segments and write a manifest","Cache the segments at CDN edges","The player picks a bitrate for each segment"],"e":"Everything before the CDN happens once per title; the last two steps happen for every viewer, which is where the scale is."},{"q":"Complete the Python function that finds which node owns a key on a consistent-hashing ring with virtual nodes.","t":"drop","lang":"python","code":"import bisect\nimport hashlib\n\ndef node_for(key, points, owners):\n    h = int(hashlib.md5(key.encode()).hexdigest()[:8], 16)   # the key's position on the ring\n    i = bisect.bisect_right(points, {{0}})                  # the first point clockwise after it\n    return owners[i % {{1}}]                                # past the last point, wrap to the first\n","blanks":[{"o":["h","key","len(points)","0"],"a":0},{"o":["len(points)","len(nodes)","h","i"],"a":0}],"e":"Each node owns several points (virtual nodes) on the ring, and a key belongs to the first point after its hash, wrapping around. Adding a node takes over only the ranges just before its points."}],"probs":[["Reading · Dynamo: Amazon's Highly Available Key-value Store","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","","for each technique in the paper's summary table, name the problem it solves and its cost"],["Reference · Stripe: Idempotent requests","https://docs.stripe.com/api/idempotent_requests","","compare Stripe's rules for reused keys with this module's fade, and say what happens to keys after 24 hours"],["Reference · Apple: HTTP Live Streaming","https://developer.apple.com/streaming/","","open an example playlist and identify the renditions, the segment length and the bitrates"],["Reading · Google Docs: conflict resolution","https://drive.googleblog.com/2010/09/whats-different-about-new-google-docs_22.html","","explain how the server's ordering keeps every collaborator's copy identical"]],"src":[["DeCandia et al.: Dynamo, Amazon's Highly Available Key-value Store (SOSP 2007)","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf"],["Stripe API reference: Idempotent requests","https://docs.stripe.com/api/idempotent_requests"],["Apple Developer: HTTP Live Streaming","https://developer.apple.com/streaming/"],["Google Workspace blog: What's different about the new Google Docs, conflict resolution (2010)","https://drive.googleblog.com/2010/09/whats-different-about-new-google-docs_22.html"],["Google Search Central: Introduction to robots.txt","https://developers.google.com/search/docs/crawling-indexing/robots/intro"],["About CRDTs (crdt.tech)","https://crdt.tech/"]]}],"plan":[{"t":"Data in motion","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a sd-l3/ folder with python/ and js/; pytest and node --test; pip install cryptography (module 8); Docker Desktop (for the capstone); a doc for design reviews","min":45,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-saga"},{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-stream"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"What the platforms stand on","blocks":[{"k":"mod","ref":"m04"},{"k":"lab","ref":"lab-raft"},{"k":"mod","ref":"m05"},{"k":"lab","ref":"lab-lsm"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Specialist systems","blocks":[{"k":"mod","ref":"m06"},{"k":"mod","ref":"m07"},{"k":"mod","ref":"m08"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Putting it together","blocks":[{"k":"mod","ref":"m09"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L3","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-designs","label":"Design reviews: write up two of the classic large designs (your choice) as one-page design docs with estimates, failure modes and a review checklist","min":480,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the module practice problems and exercises, logged with what you learned from each","min":600,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L3: your design-review checklist, the failure modes you now look for first, and a review of your capstone; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Luigi's goes event-driven","org":"Luigi's Pizza, with 600 shops, an order platform and a loyalty programme","min":30,"blurb":"Sagas, outboxes, Kafka partitions and projections: fix double charges, vanished orders, a stale order page and a schema change that broke a consumer.","sections":[["Overview","Luigi's split its monolith into order, payment, kitchen and loyalty services that talk through Kafka. Orders go through placed, paid, cooking and delivered; each service has its own PostgreSQL database; the customer's order page reads a projection built from the events. Peak traffic is 2,000 orders a minute on Friday evenings."],["Current design",["The order service commits the order, then publishes OrderPlaced to Kafka in the same request handler.","The payment service charges the card when it reads OrderPlaced and commits its Kafka offset afterwards.","Topics are partitioned by shop id; the order-page projection is a consumer that writes to Redis.","Event schemas are JSON with no registry; teams add and rename fields when they need to."]],["Problems",["After a deployment of the payment service, about 40 customers were charged twice.","A few orders a day are in the database but never reach the kitchen.","Customers who have just paid often see 'placed' on their order page for several seconds.","Renaming a field from amount to total broke the loyalty service for an evening."]]],"items":[{"d":"d1","q":"What most likely caused the double charges after the payment service was deployed?","o":["The rebalance during the deployment redelivered messages processed but not yet committed, and the consumer isn't idempotent","Kafka lost the offsets","The card provider double-charged","The partitions were too large"],"a":0,"e":"Committing offsets after processing gives at-least-once delivery: anything between the charge and the commit is redelivered after a rebalance. Idempotency keys on the charge, or an inbox of processed event ids in the same transaction, make redelivery harmless."},{"d":"d1","q":"Why do some orders never reach the kitchen, and what's the fix?","o":["The service sometimes crashes between committing the order and publishing the event; write the event to an outbox in the same transaction and relay it","Kafka drops messages under load","The kitchen consumer is too slow","The partitions are keyed by shop id"],"a":0,"e":"A database commit and a Kafka publish are two separate systems, so a crash between them loses the event. The outbox makes both one local transaction; a relay or change data capture publishes it at least once."},{"d":"d1","t":"ms","q":"Which TWO changes help with the order page showing 'placed' after the customer has paid?","o":["Return the new status from the payment request and show it straight away, while the projection catches up","Monitor the projection consumer's lag and scale it, and key its updates by order id","Make every service read the order database directly","Move the projection to the same partition as payments"],"a":[0,1],"e":"A projection is eventually consistent, so the UI should show what the user just did (read-your-writes) and the team should watch and bound the lag. Sharing a database across services undoes the split."},{"d":"d1","q":"How should the team have renamed amount to total without breaking the loyalty service?","o":["Add total as a new field, keep writing amount until every consumer has moved, enforce compatibility in a schema registry, then remove amount","Rename it everywhere in one deployment","Version the topic name for every change","Ask consumers to ignore unknown events"],"a":0,"e":"Renames are breaking changes. Expand and contract (add, migrate the consumers, then remove), with a schema registry rejecting incompatible schemas, keeps producers and consumers deployable independently."}]},{"id":"cs2","title":"Payments go multi-region","org":"PayLane, a payment platform for 9,000 shops in the EU and the US","min":30,"blurb":"Replication, failover, residency and tokens: protect money and personal data when a region fails.","sections":[["Overview","PayLane runs in one US region with an asynchronous replica in a second US region. It processes 1,500 payments a second at
