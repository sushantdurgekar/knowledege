<style>
/* Layout: app shell — sticky tab bar, Learn view = module rail + reading pane; exam views are focused single columns */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e9edf3; --line:#d3dae4;
  --fg:#15202c; --muted:#556474; --accent:#2c56d6; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --good:#18794e; --good-soft:#dcf3e7; --bad:#b4232c; --bad-soft:#fbe3e4; --trap:#9a5400; --trap-soft:#fdf0d9;
  --d1:#7046c4; --d1-soft:#ece5fa; --d2:#0f7a8a; --d2-soft:#dcf2f4;
  --code-bg:#0f1720; --code-fg:#dbe6f3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151d26; --surface-2:#1c2632; --line:#2a3644;
  --fg:#e4ebf2; --muted:#94a3b3; --accent:#86a4ff; --accent-ink:#0d1218; --accent-soft:#1e2a4a;
  --good:#4fc98d; --good-soft:#12301f; --bad:#ff7b84; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --d1:#b79cff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151d26; --surface-2:#1c2632; --line:#2a3644;
  --fg:#e4ebf2; --muted:#94a3b3; --accent:#86a4ff; --accent-ink:#0d1218; --accent-soft:#1e2a4a;
  --good:#4fc98d; --good-soft:#12301f; --bad:#ff7b84; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --d1:#b79cff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
button{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:1.25rem;letter-spacing:-.01em}
.brand .code{font-family:var(--f-mono);font-size:.78rem;padding:2px 7px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.bar{width:120px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.92rem}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 60px}
.view[hidden]{display:none!important}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)}
.chip.day{background:var(--surface-2);color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
/* Plan */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fact b{display:block;font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.fact span{font-size:.82rem;color:var(--muted)}
.day h3{font-size:1.1rem;margin-bottom:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.check label{cursor:pointer}
.check .t{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;padding-left:8px}
.weights{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.82rem;font-weight:700}
.weights div{display:flex;align-items:center;padding-inline:10px;min-width:0;white-space:nowrap;overflow:hidden}
/* Learn */
.learn{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 130px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail h4{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:.92rem}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);width:22px;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mod-head h2{font-size:clamp(1.5rem,3.2vw,2.1rem);letter-spacing:-.015em}
.hook{font-size:1.06rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0}
.sec{margin-top:22px}
.sec>h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec>h3 .tag{font-family:var(--f-body);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:72ch}
.story p{margin:0 0 10px} .story p:last-child{margin:0}
.breaks{font-size:.93rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
ul.keys{margin:0;padding-left:20px;max-width:78ch} ul.keys li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.85rem}
tr:last-child td{border-bottom:0}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:14px 16px;border-radius:var(--r);overflow-x:auto;line-height:1.5;margin:0}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 35%,transparent);border-radius:8px;padding:9px 12px;font-size:.95rem}
.trap b{color:var(--trap)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.disc{display:grid;gap:8px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d summary{cursor:pointer;font-weight:700}
details.d div{margin-top:8px;color:var(--fg)}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.flip{min-height:118px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;overflow-x:auto}
.dia .cap{font-size:.82rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.88rem;position:relative}
.flow .st b{display:block;font-family:var(--f-display);font-size:.95rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-family:var(--f-display);font-weight:700}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.88rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
/* Quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.q .stem{font-weight:700;margin-bottom:10px;white-space:pre-wrap}
.q .multi{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:8px;font-size:.93rem;border-top:1px solid var(--line);padding-top:8px}
.expl .v{font-weight:700}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)}
/* Practice / mock */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.mock-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:12px}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 0;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--fg)}
.navgrid button.flag::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--trap)}
.navgrid button.r{background:var(--good-soft);border-color:var(--good)}
.navgrid button.w{background:var(--bad-soft);border-color:var(--bad)}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.dbars{display:grid;gap:8px;margin-top:10px}
.dbar{display:grid;grid-template-columns:140px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:.88rem}
.dbar .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.dbar .tr i{display:block;height:100%}
.verdict{padding:12px 14px;border-radius:8px;font-weight:700;margin-top:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.mid{background:var(--trap-soft);color:var(--trap)} .verdict.no{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);padding:10px}
/* Flashcards */
.fc{max-width:620px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}
.card .side{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .txt{font-size:1.12rem}
.card.back{background:var(--accent-soft)}
/* Cheat sheet */
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.cs .panel h3{font-size:1rem;margin-bottom:8px}
.cs ul{margin:0;padding-left:18px;font-size:.92rem} .cs li{margin-bottom:4px}
@media (max-width:860px){
  .learn{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px;padding:6px}
  .rail h4{display:none}
  .rail button{width:auto;white-space:nowrap;flex:none}
  .mock-shell{grid-template-columns:minmax(0,1fr)}
  .mock-side{position:static;order:-1}
  .dbar{grid-template-columns:100px minmax(0,1fr) 48px}
  .bar{width:70px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
