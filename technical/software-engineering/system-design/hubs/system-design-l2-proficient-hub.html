                # resume after the last event the client saw\n            out += f\"id: {eid}\\nevent: {kind}\\ndata: {data}\\n\\n\"\n    return out\n\ndef parse(text):\n    \"\"\"What the browser's EventSource does: split on blank lines, then read the fields.\"\"\"\n    events = []\n    for block in text.split(\"\\n\\n\"):\n        fields = dict(line.split(\": \", 1) for line in block.split(\"\\n\") if \": \" in line)\n        if \"data\" in fields:\n            events.append((int(fields[\"id\"]), fields[\"event\"], fields[\"data\"]))\n    return events\n\nreceived = parse(stream())[:2]                     # the connection drops after two events\nprint(\"before the drop:\", \" | \".join(f\"{e} {k} {d}\" for e, k, d in received))\nlast_id = received[-1][0]\nprint(\"the browser reconnects with Last-Event-ID:\", last_id)\nresumed = stream(last_id)\nprint(\"the server resends:\")\nfor line in resumed.split(\"\\n\"):\n    if line.startswith((\"id\", \"event\", \"data\")):\n        print(\"  \" + line)\nprint(\"after:\", \" | \".join(f\"{e} {k} {d}\" for e, k, d in parse(resumed)))\n","out":"before the drop: 1 score 1-0 | 2 score 1-1\nthe browser reconnects with Last-Event-ID: 2\nthe server resends:\n  id: 3\n  event: card\n  data: yellow: #4\n  id: 4\n  event: score\n  data: 2-1\nafter: 3 card yellow: #4 | 4 score 2-1\n","notes":[[5,"The retry field tells the browser how long to wait before reconnecting on its own."],[8,"Each event is a few text lines ending in a blank line. The id is what makes resuming possible."],[15,"Split each line at the first colon-and-space only: the data itself may contain one, as in yellow: #4."],[24,"On reconnect the browser sends the last id it saw, and the server replays only what came after it."]]},{"lang":"javascript","src":"const EVENTS = [[1, \"score\", \"1-0\"], [2, \"score\", \"1-1\"], [3, \"card\", \"yellow: #4\"], [4, \"score\", \"2-1\"]];   // id, type, data\n\nfunction stream(lastEventId = 0) {\n  // what the server writes on a text/event-stream response\n  let out = \"retry: 3000\\n\\n\";                     // ask the browser to wait 3 s before reconnecting\n  for (const [eid, kind, data] of EVENTS) {\n    if (eid > lastEventId) out += `id: ${eid}\\nevent: ${kind}\\ndata: ${data}\\n\\n`;   // resume after the last event the client saw\n  }\n  return out;\n}\n\nfunction parse(text) {\n  // what the browser's EventSource does: split on blank lines, then read the fields\n  const events = [];\n  for (const block of text.split(\"\\n\\n\")) {\n    const fields = Object.fromEntries(block.split(\"\\n\").filter(line => line.includes(\": \")).map(line => {\n      const i = line.indexOf(\": \");\n      return [line.slice(0, i), line.slice(i + 2)];\n    }));\n    if (\"data\" in fields) events.push([Number(fields.id), fields.event, fields.data]);\n  }\n  return events;\n}\n\nconst received = parse(stream()).slice(0, 2);     // the connection drops after two events\nconsole.log(\"before the drop:\", received.map(([e, k, d]) => `${e} ${k} ${d}`).join(\" | \"));\nconst lastId = received.at(-1)[0];\nconsole.log(\"the browser reconnects with Last-Event-ID:\", lastId);\nconst resumed = stream(lastId);\nconsole.log(\"the server resends:\");\nfor (const line of resumed.split(\"\\n\")) {\n  if ([\"id\", \"event\", \"data\"].some(f => line.startsWith(f))) console.log(\"  \" + line);\n}\nconsole.log(\"after:\", parse(resumed).map(([e, k, d]) => `${e} ${k} ${d}`).join(\" | \"));\n","out":"before the drop: 1 score 1-0 | 2 score 1-1\nthe browser reconnects with Last-Event-ID: 2\nthe server resends:\n  id: 3\n  event: card\n  data: yellow: #4\n  id: 4\n  event: score\n  data: 2-1\nafter: 3 card yellow: #4 | 4 score 2-1\n","notes":[[5,"The retry field tells the browser how long to wait before reconnecting on its own."],[7,"Each event is a few text lines ending in a blank line. The id is what makes resuming possible."],[17,"Split each line at the first colon-and-space only: the data itself may contain one, as in yellow: #4."],[29,"On reconnect the browser sends the last id it saw, and the server replays only what came after it."]]}]},{"t":"Routing chat messages to the servers that hold the connections","tabs":[{"lang":"python","src":"class Gateway:\n    \"\"\"One WebSocket server: it holds some users' connections and pushes to them.\"\"\"\n    def __init__(self, name):\n        self.name, self.sockets = name, set()\n\n    def push(self, user, text):\n        return f\"{user}@{self.name}\"               # in real life: write a frame to the user's socket\n\nclass Router:\n    def __init__(self, gateways):\n        self.gateways = {g.name: g for g in gateways}\n        self.where = {}                            # user -> servers holding their connections (Redis in production)\n        self.rooms, self.hops = {}, 0              # hops: messages sent between servers\n\n    def connect(self, user, gw):\n        self.gateways[gw].sockets.add(user)\n        self.where.setdefault(user, set()).add(gw)\n\n    def disconnect(self, user, gw):\n        self.gateways[gw].sockets.discard(user)\n        self.where[user].discard(gw)\n\n    def send(self, room, sender, text):\n        by_server = {}\n        for user in self.rooms[room]:\n            if user != sender:\n                for gw in self.where.get(user, ()):\n                    by_server.setdefault(gw, []).append(user)   # group recipients by the server holding them\n        delivered = []\n        for gw, users in sorted(by_server.items()):\n            self.hops += 1                         # one message per server, however many users it holds\n            delivered += [self.gateways[gw].push(u, text) for u in sorted(users)]\n        return delivered\n\nrouter = Router([Gateway(f\"gw-{i}\") for i in range(1, 51)])   # a fleet of 50 gateway servers\nfor user, gw in ((\"ana\", \"gw-1\"), (\"bob\", \"gw-2\"), (\"cy\", \"gw-2\"), (\"dev\", \"gw-3\"), (\"bob\", \"gw-4\")):   # bob has a laptop and a phone\n    router.connect(user, gw)\nrouter.rooms[\"team\"] = {\"ana\", \"bob\", \"cy\", \"dev\"}\nprint(\"ana -> team:\", *router.send(\"team\", \"ana\", \"standup?\"), \"| server hops so far:\", router.hops)\nrouter.disconnect(\"bob\", \"gw-2\")                   # bob's laptop drops, and reconnects to another server\nrouter.connect(\"bob\", \"gw-3\")\nprint(\"dev -> team:\", *router.send(\"team\", \"dev\", \"on my way\"), \"| server hops so far:\", router.hops)\nprint(\"broadcasting both messages to all\", len(router.gateways), \"servers would have taken\", 2 * len(router.gateways), \"hops\")\n","out":"ana -> team: bob@gw-2 cy@gw-2 dev@gw-3 bob@gw-4 | server hops so far: 3\ndev -> team: ana@gw-1 cy@gw-2 bob@gw-3 bob@gw-4 | server hops so far: 7\nbroadcasting both messages to all 50 servers would have taken 100 hops\n","notes":[[12,"The registry records which servers hold each user's connections; one user can be on several devices, and so on several servers."],[28,"Recipients are grouped by server, so one hop reaches every user that server holds."],[41,"When a connection moves, the registry is updated, and the next message follows it to the new server."],[43,"Targeted routing used 7 hops for two messages; broadcasting to every server would cost 100, and the gap grows with the fleet."]]},{"lang":"javascript","src":"class Gateway {\n  // one WebSocket server: it holds some users' connections and pushes to them\n  constructor(name) { this.name = name; this.sockets = new Set(); }\n  push(user, text) { return `${user}@${this.name}`; }   // in real life: write a frame to the user's socket\n}\n\nclass Router {\n  constructor(gateways) {\n    this.gateways = new Map(gateways.map(g => [g.name, g]));\n    this.where = new Map();                        // user -> servers holding their connections (Redis in production)\n    this.rooms = new Map(); this.hops = 0;         // hops: messages sent between servers\n  }\n  connect(user, gw) {\n    this.gateways.get(gw).sockets.add(user);\n    if (!this.where.has(user)) this.where.set(user, new Set());\n    this.where.get(user).add(gw);\n  }\n  disconnect(user, gw) {\n    this.gateways.get(gw).sockets.delete(user);\n    this.where.get(user).delete(gw);\n  }\n  send(room, sender, text) {\n    const byServer = new Map();\n    for (const user of this.rooms.get(room)) {\n      if (user === sender) continue;\n      for (const gw of this.where.get(user) ?? []) {\n        if (!byServer.has(gw)) byServer.set(gw, []);\n        byServer.get(gw).push(user);               // group recipients by the server holding them\n      }\n    }\n    const delivered = [];\n    for (const gw of [...byServer.keys()].sort()) {\n      this.hops++;                                 // one message per server, however many users it holds\n      delivered.push(...byServer.get(gw).sort().map(u => this.gateways.get(gw).push(u, text)));\n    }\n    return delivered;\n  }\n}\n\nconst router = new Router(Array.from({ length: 50 }, (_, i) => new Gateway(`gw-${i + 1}`)));   // a fleet of 50 gateway servers\nfor (const [user, gw] of [[\"ana\", \"gw-1\"], [\"bob\", \"gw-2\"], [\"cy\", \"gw-2\"], [\"dev\", \"gw-3\"], [\"bob\", \"gw-4\"]]) router.connect(user, gw);   // bob has a laptop and a phone\nrouter.rooms.set(\"team\", new Set([\"ana\", \"bob\", \"cy\", \"dev\"]));\nconsole.log(\"ana -> team:\", ...router.send(\"team\", \"ana\", \"standup?\"), \"| server hops so far:\", router.hops);\nrouter.disconnect(\"bob\", \"gw-2\");                  // bob's laptop drops, and reconnects to another server\nrouter.connect(\"bob\", \"gw-3\");\nconsole.log(\"dev -> team:\", ...router.send(\"team\", \"dev\", \"on my way\"), \"| server hops so far:\", router.hops);\nconsole.log(\"broadcasting both messages to all\", router.gateways.size, \"servers would have taken\", 2 * router.gateways.size, \"hops\");\n","out":"ana -> team: bob@gw-2 cy@gw-2 dev@gw-3 bob@gw-4 | server hops so far: 3\ndev -> team: ana@gw-1 cy@gw-2 bob@gw-3 bob@gw-4 | server hops so far: 7\nbroadcasting both messages to all 50 servers would have taken 100 hops\n","notes":[[10,"The registry records which servers hold each user's connections; one user can be on several devices, and so on several servers."],[28,"Recipients are grouped by server, so one hop reaches every user that server holds."],[45,"When a connection moves, the registry is updated, and the next message follows it to the new server."],[47,"Targeted routing used 7 hops for two messages; broadcasting to every server would cost 100, and the gap grows with the fleet."]]}]}],"ex":{"q":"Design the message delivery path of a chat app: 1:1 and group chats, several devices per user, and no lost or reordered messages even though pushes over mobile networks are sometimes lost or duplicated. Show the client logic that makes it reliable.","steps":["Scale first: 50 million daily users sending about 40 messages each is 2 billion a day, about 23,000 a second on average, with peaks perhaps three times that.","Clients hold a WebSocket to a gateway fleet. The chat service stores each message with the next sequence number for its conversation (partitioned by conversation id, so one leader assigns the numbers), then pushes through the gateways that hold recipients' devices; offline devices get a push notification.","Push is best effort, so the client does the rest: a number below what it has shown is a duplicate and is ignored; a number that skips ahead reveals a gap, so it fetches the missing messages; and on reconnect it asks for everything after the last number it saw.","Trade-offs: sequence numbers need one writer per conversation; very large groups are cheaper to fan out on read than on write; and presence (who's online) is a heartbeat with a TTL, so it's always slightly stale."],"code":{"t":"Store first, push second: a client that fixes gaps and ignores duplicates","tabs":[{"lang":"python","src":"class Server:\n    def __init__(self):\n        self.log = []                              # the durable store: message n is log[n - 1]\n\n    def fetch(self, first, last):\n        return self.log[first - 1:last]\n\nclass Client:\n    def __init__(self, server):\n        self.server, self.shown = server, []\n        self.gap_fills = self.dupes = self.caught_up = 0\n\n    def on_push(self, seq, text):\n        last = len(self.shown)                     # messages are numbered 1, 2, 3... in each conversation\n        if seq <= last:\n            self.dupes += 1                        # already shown: a duplicate push\n            return\n        if seq > last + 1:                         # a gap: earlier pushes were lost\n            missing = self.server.fetch(last + 1, seq - 1)\n            self.gap_fills += len(missing)\n            self.shown += missing\n        self.shown.append(text)\n\n    def reconnect(self):                           # catch up on anything pushed while we were away\n        missing = self.server.fetch(len(self.shown) + 1, len(self.server.log))\n        self.caught_up += len(missing)\n        self.shown += missing\n\nserver, rand = Server(), mulberry32(2)\nclient = Client(server)\nlost = duplicated = 0\nfor seq in range(1, 21):\n    server.log.append(f\"m{seq}\")                   # 1. store, with its sequence number\n    r = rand()\n    if r < 0.15:\n        lost += 1                                  # 2. push: the network loses some...\n        continue\n    client.on_push(seq, f\"m{seq}\")\n    if r > 0.9:\n        duplicated += 1\n        client.on_push(seq, f\"m{seq}\")             # ...and a retry delivers some twice\nclient.reconnect()\norder = \"in order\" if client.shown == server.log else \"OUT OF ORDER\"\nprint(f\"pushes lost: {lost}, duplicated: {duplicated} | filled from gaps: {client.gap_fills}, \"\n      f\"caught up on reconnect: {client.caught_up}, duplicates ignored: {client.dupes}\")\nprint(f\"the client shows {len(client.shown)} messages, {order}\")\n","out":"pushes lost: 3, duplicated: 1 | filled from gaps: 2, caught up on reconnect: 1, duplicates ignored: 1\nthe client shows 20 messages, in order\n"},{"lang":"javascript","src":"class Server {\n  constructor() { this.log = []; }                 // the durable store: message n is log[n - 1]\n  fetch(first, last) { return this.log.slice(first - 1, last); }\n}\n\nclass Client {\n  constructor(server) {\n    this.server = server; this.shown = [];\n    this.gapFills = 0; this.dupes = 0; this.caughtUp = 0;\n  }\n  onPush(seq, text) {\n    const last = this.shown.length;                // messages are numbered 1, 2, 3... in each conversation\n    if (seq <= last) { this.dupes++; return; }     // already shown: a duplicate push\n    if (seq > last + 1) {                          // a gap: earlier pushes were lost\n      const missing = this.server.fetch(last + 1, seq - 1);\n      this.gapFills += missing.length;\n      this.shown.push(...missing);\n    }\n    this.shown.push(text);\n  }\n  reconnect() {                                    // catch up on anything pushed while we were away\n    const missing = this.server.fetch(this.shown.length + 1, this.server.log.length);\n    this.caughtUp += missing.length;\n    this.shown.push(...missing);\n  }\n}\n\nconst server = new Server(), rand = mulberry32(2);\nconst client = new Client(server);\nlet lost = 0, duplicated = 0;\nfor (let seq = 1; seq <= 20; seq++) {\n  server.log.push(`m${seq}`);                      // 1. store, with its sequence number\n  const r = rand();\n  if (r < 0.15) { lost++; continue; }              // 2. push: the network loses some...\n  client.onPush(seq, `m${seq}`);\n  if (r > 0.9) { duplicated++; client.onPush(seq, `m${seq}`); }   // ...and a retry delivers some twice\n}\nclient.reconnect();\nconst order = client.shown.join() === server.log.join() ? \"in order\" : \"OUT OF ORDER\";\nconsole.log(`pushes lost: ${lost}, duplicated: ${duplicated} | filled from gaps: ${client.gapFills}, ` +\n            `caught up on reconnect: ${client.caughtUp}, duplicates ignored: ${client.dupes}`);\nconsole.log(`the client shows ${client.shown.length} messages, ${order}`);\n","out":"pushes lost: 3, duplicated: 1 | filled from gaps: 2, caught up on reconnect: 1, duplicates ignored: 1\nthe client shows 20 messages, in order\n"}]},"a":"Three pushes were lost and one was duplicated, yet the client shows all 20 messages in order: two lost messages were fetched when a later number revealed the gap, the last one came back with the catch-up on reconnect, and the duplicate was ignored because its number had already been shown."},"fade":{"q":"Finish `parse_sse(text)` the way a browser's EventSource reads a stream: a blank line ends an event; lines starting with a colon are comments; each line is `field: value` (the space after the colon is optional); several `data` lines join with newlines; `event` sets the type (default `message`); and `id` sets the last event id, which carries over to later events. Return (last id, type, data) for each event that has data.","steps":["Read line by line, collecting the current event's data lines and type; a blank line dispatches the event if it has any data, then resets them.",{"ask":"Why do servers send comment lines?","a":"As keep-alives: a line like `: ping` every 15 to 30 seconds stops proxies and load balancers from closing an idle connection, and the browser ignores it."},{"ask":"Why does the last id carry over instead of resetting?","a":"It's the reconnection point: the browser sends it as Last-Event-ID, so it has to remember the latest id it saw, even across events that didn't set one."},{"ask":"What does it cost?","a":"One pass over the text: O(n) time, with memory for the current event. Browsers do this incrementally as bytes arrive, which is why each event must end with a blank line."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def parse_sse(text):\n    events, data, kind, last_id = [], [], \"message\", \"\"\n    for line in text.split(\"\\n\"):\n        ...                                        # TODO: blank line, comment, or field: value\n    return events\n"},{"lang":"javascript","src":"function parseSse(text) {\n  const events = [];\n  let data = [], kind = \"message\", lastId = \"\";\n  for (const line of text.split(\"\\n\")) {\n    // TODO: blank line, comment, or field: value\n  }\n  return events;\n}\n"}]},"solution":{"t":"Solution: dispatch on blank lines, remember the last id","tabs":[{"lang":"python","src":"def parse_sse(text):\n    events, data, kind, last_id = [], [], \"message\", \"\"\n    for line in text.split(\"\\n\"):\n        if line == \"\":                             # a blank line ends the event\n            if data:\n                events.append((last_id, kind, \"\\n\".join(data)))\n            data, kind = [], \"message\"\n            continue\n        if line.startswith(\":\"):\n            continue                               # a comment: servers send these as keep-alives\n        field, _, value = line.partition(\":\")\n        if value.startswith(\" \"):\n            value = value[1:]                      # one space after the colon is optional\n        if field == \"data\":\n            data.append(value)\n        elif field == \"event\":\n            kind = value\n        elif field == \"id\":\n            last_id = value                        # kept for the next reconnect, across events\n    return events\n\nstream = \": keep-alive\\n\\nid: 7\\nevent: score\\ndata: 2-1\\n\\ndata: line one\\ndata: line two\\n\\nevent: card\\ndata:red\\n\\n\"\nfor last_id, kind, data in parse_sse(stream):\n    print(f\"id {last_id} | {kind} | {data.replace(chr(10), ' / ')}\")\n","out":"id 7 | score | 2-1\nid 7 | message | line one / line two\nid 7 | card | red\n"},{"lang":"javascript","src":"function parseSse(text) {\n  const events = [];\n  let data = [], kind = \"message\", lastId = \"\";\n  for (const line of text.split(\"\\n\")) {\n    if (line === \"\") {                             // a blank line ends the event\n      if (data.length) events.push([lastId, kind, data.join(\"\\n\")]);\n      data = []; kind = \"message\";\n      continue;\n    }\n    if (line.startsWith(\":\")) continue;            // a comment: servers send these as keep-alives\n    const i = line.indexOf(\":\");\n    const field = i === -1 ? line : line.slice(0, i);\n    let value = i === -1 ? \"\" : line.slice(i + 1);\n    if (value.startsWith(\" \")) value = value.slice(1);   // one space after the colon is optional\n    if (field === \"data\") data.push(value);\n    else if (field === \"event\") kind = value;\n    else if (field === \"id\") lastId = value;       // kept for the next reconnect, across events\n  }\n  return events;\n}\n\nconst stream = \": keep-alive\\n\\nid: 7\\nevent: score\\ndata: 2-1\\n\\ndata: line one\\ndata: line two\\n\\nevent: card\\ndata:red\\n\\n\";\nfor (const [lastId, kind, data] of parseSse(stream)) console.log(`id ${lastId} | ${kind} | ${data.replaceAll(\"\\n\", \" / \")}`);\n","out":"id 7 | score | 2-1\nid 7 | message | line one / line two\nid 7 | card | red\n"}]}},"traps":[["“WebSockets are always the best choice for real time.”","If only the server sends, SSE is simpler: plain HTTP, with reconnection and resuming built in. If updates are rare, polling may be cheaper than holding a connection per user."],["“Once a message is pushed, it has been delivered.”","Pushes are lost when phones switch networks or apps go to sleep. Store first, number messages per conversation, and let clients fetch gaps and catch up on reconnect."],["“Polling every second gives real time cheaply.”","The load is clients × frequency whether or not anything changed: a million clients polling every second is a million requests a second, nearly all of them empty."],["“The load balancer will spread WebSocket load evenly.”","Connections live for hours, so a server that restarts or joins late stays unbalanced. Balance by connection count, drain gently on deploys, and add jitter to reconnects so a restart doesn't cause a stampede."],["“Every server can broadcast every message to every other server.”","That works for a handful of servers; then the traffic between servers dominates. Route through a registry of which server holds which user, or subscribe each server only to the channels its users need."],["“Presence (who's online) can be exact.”","Connections die silently, so presence is a heartbeat with a TTL and is always a few seconds stale. Design the interface to tolerate that."]],"disc":[["How would you build the notifications bell for a web app with 5 million daily users?","Write each notification to a per-user store first. While the page is open, push the unread count and new items over SSE (one-way, reconnects by itself, resumes with Last-Event-ID) from a gateway tier, routed through pub/sub keyed by user. On page load, fetch the latest from the API. Polling every minute is a reasonable fallback for clients behind proxies that break streaming."],["A sports platform expects 2 million viewers to receive the same score update within a second. What's the bottleneck, and the design?","Fan-out: one update must reach 2 million connections. Spread the connections over many gateway servers, publish each update once to a topic every gateway subscribes to, and let each gateway write it to its own connections. Everyone gets the same update, so there's no per-user routing; the costs are the gateways' outbound bandwidth and the reconnect storm after a gateway fails, which needs jittered reconnects."]],"teach":{"prompt":"Explain to a junior colleague the difference between polling, long polling, SSE and WebSockets, and how a chat system makes sure no message is lost.","rubric":["Polling: empty requests, and a delay of up to one interval","Long polling: the server holds the request until there's news","SSE: one-way streaming over HTTP, with reconnection and Last-Event-ID","WebSocket: a persistent two-way connection; routing between gateway servers","Store first with sequence numbers; clients fill gaps, ignore duplicates and catch up on reconnect"],"model":"Polling asks every few seconds, so most answers are empty and updates arrive up to one interval late. Long polling holds each request open until there's news, which removes the empty answers but still costs a request per message. SSE keeps one HTTP response open and streams events from the server; the browser reconnects by itself and sends Last-Event-ID so the server can resend what was missed. WebSockets give a persistent two-way connection, which chat needs. In a chat system, users connect to many gateway servers, so a registry or pub/sub gets each message to the server holding the recipient's connection. Pushes can be lost, so every message is stored first with a sequence number per conversation; the client fetches any gap it notices, ignores duplicates, and on reconnect asks for everything after the last number it saw."},"qa":[["Polling's two costs?","Mostly empty responses, and updates up to one interval late."],["Long polling?","The server holds the request until there's news or a timeout, then the client asks again."],["Server-Sent Events?","One long HTTP response streaming events from server to client, with automatic reconnection."],["Last-Event-ID?","The header an SSE client sends when it reconnects, so the server can resend what it missed."],["WebSocket?","A persistent two-way connection, upgraded from an HTTP request."],["How does a message reach a user connected to another server?","Through a registry of which server holds the user's connection, or a pub/sub channel that server subscribes to."]],"quiz":[{"q":"What does this print?","snip":{"t":"A client checking sequence numbers","tabs":[{"lang":"python","src":"last, fetched = 0, 0\nfor seq in [1, 2, 2, 5, 6]:\n    if seq <= last:\n        continue                                 # a duplicate\n    if seq > last + 1:\n        fetched += seq - last - 1                # fill the gap from the server\n    last = seq\nprint(last, fetched)\n"},{"lang":"javascript","src":"let last = 0, fetched = 0;\nfor (const seq of [1, 2, 2, 5, 6]) {\n  if (seq <= last) continue;                     // a duplicate\n  if (seq > last + 1) fetched += seq - last - 1; // fill the gap from the server\n  last = seq;\n}\nconsole.log(last, fetched);\n"}]},"o":["6 2","5 2","6 0","4 3"],"a":0,"e":"The second 2 is a duplicate and is skipped. Jumping from 2 to 5 reveals a gap of two messages (3 and 4), which are fetched; then 6 follows on, so the client ends at 6."},{"q":"A live sports page receives score updates from the server, and the browser never sends anything back. Which fits best?","o":["Server-Sent Events","WebSockets","Polling every 100 ms","Long polling with a 1-second timeout"],"a":0,"e":"One-way updates are exactly what SSE is for, with reconnection and resuming built in. WebSockets would work, but add two-way machinery nobody uses; fast polling wastes requests."},{"q":"1 million connected clients each poll every 2 seconds. How many requests per second is that?","o":["500,000","2,000,000","1,000,000","50,000"],"a":0,"e":"Each client makes half a request per second: 1,000,000 ÷ 2 = 500,000 per second, whether or not anything has changed."},{"q":"Which are true of WebSockets? (choose 2)","t":"ms","o":["They start as an HTTP request upgraded with 101 Switching Protocols","Both sides can send messages at any time over one connection","The browser reconnects automatically and resumes with Last-Event-ID","Each message needs a new HTTP request","They only carry text from the server to the client"],"a":[0,1],"e":"Automatic reconnection with Last-Event-ID belongs to SSE; WebSockets leave reconnection to you. Messages flow both ways over one connection, without new requests, as text or binary frames."},{"q":"Judge each statement.","t":"yn","s":[["Long polling holds a request open until the server has news or a timeout passes.",true],["SSE lets the client send messages to the server over the same stream.",false],["Restarting a WebSocket server disconnects every client connected to it.",true],["If messages are stored first, a client that reconnects can ask for everything after the last sequence number it saw.",true]],"e":"SSE is one-way: the client sends with ordinary HTTP requests. A restart drops that server's connections, so deploys must drain gently, and stored, numbered messages make catching up possible."},{"q":"Put the delivery of a chat message to a user on another gateway server in order.","t":"ord","items":["The sender's gateway receives the message over its WebSocket","The chat service stores it with the next sequence number","It finds which gateway holds the recipient's connection, or publishes to the recipient's channel","That gateway pushes the message down the recipient's WebSocket","The recipient's client checks the sequence number for gaps"],"e":"Storing before pushing means a lost push can always be recovered, and the sequence number lets the client notice when that's needed."},{"q":"Complete the Python routing step: group a room's recipients (everyone except the sender) by the gateway servers holding their connections.","t":"drop","lang":"python","code":"def route(where, members, sender):\n    by_server = {}\n    for user in members:\n        if user != {{0}}:\n            for gw in where.get(user, ()):\n                by_server.setdefault({{1}}, []).append(user)\n    return by_server\n","blanks":[{"o":["sender","gw","members","user"],"a":0},{"o":["gw","user","sender","members"],"a":0}],"e":"The sender is skipped, and each recipient is filed under every server that holds one of their connections, so each server needs one message, however many recipients it holds."},{"q":"Match each description to its name.","t":"match","pairs":[["The client asks on a timer","Polling"],["The server holds each request until there's news","Long polling"],["One HTTP response that streams events to the client","Server-Sent Events"],["A persistent two-way connection","WebSocket"]],"extra":["Write-back"],"e":"Write-back is a caching strategy (module 4), not a way to deliver updates."}],"probs":[["Reference · Using server-sent events","https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events","","build a small SSE endpoint that resends missed events when the browser reconnects with Last-Event-ID"],["Reference · The WebSocket protocol","https://www.rfc-editor.org/rfc/rfc6455","","read the opening handshake and the ping and pong frames, then explain how you'd detect a dead connection"],["Exercise · The WebSocket API","https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API","","write a client that reconnects with backoff and jitter, and resumes from the last sequence number it saw"],["Exercise · Design a chat system","https://bytebytego.com/courses/system-design-interview/design-a-chat-system","","compare the chapter's design with the delivery path in this module's worked example"]],"src":[["MDN: Using server-sent events","https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events"],["HTML Living Standard: Server-sent events","https://html.spec.whatwg.org/multipage/server-sent-events.html"],["RFC 6455: The WebSocket Protocol","https://www.rfc-editor.org/rfc/rfc6455"],["MDN: The WebSocket API","https://developer.mozilla.org/en-US/docs/Web/API/WebSockets_API"]]},{"id":"m09","d":"d3","t":"Observability: logs, metrics, traces and SLOs","min":100,"hook":"In production you can't attach a debugger: you learn what the system is doing from what it emits. Metrics tell you that something is wrong, traces tell you where, and logs tell you why. SLOs turn \"is it working?\" into a number users care about, and the error budget turns reliability into a decision you make together with the product team.","pre":{"q":"Your dashboard shows an average API latency of 120 ms, well under the 300 ms target, yet users say the app is slow. How can both be true?","a":"Averages hide the tail. If 95% of requests take 80 ms and 5% take 900 ms, the average is about 120 ms, but one request in twenty is slow, and a page that makes several requests hits a slow one far more often. Track percentiles (p95, p99) from histograms, and set the objective on them: for example, 99% of requests within 300 ms."},"kid":{"t":"How is the restaurant doing tonight?","x":"Luigi keeps a diary of everything unusual: \"table 4's soup came back cold at 8:12\". On the kitchen wall, a tally counts the dishes served and sent back each hour. When one order takes forever, he follows its ticket, which every station stamps with the time, and sees it waited 20 minutes at the grill. He promises his customers that 99 dishes in every 100 come out within 15 minutes. That leaves one slow dish in a hundred to spare, and when a month has used it up, he stops trying new recipes until things calm down.","map":[["The diary of unusual events","Logs: detailed, timestamped records of individual events"],["The tally on the kitchen wall","Metrics: cheap counts and measurements over time, for dashboards and alerts"],["Following one ticket, stamped at each station","A trace: one request's path through every service, with the time spent in each"],["99 dishes in every 100 within 15 minutes","An SLO: a target for an SLI (the share of good events) over a time window"],["The one slow dish in a hundred to spare","The error budget: the failures the SLO allows, to be spent on change and risk"]],"brk":"Luigi can see his whole kitchen at once. A distributed system has hundreds of processes that nobody sees whole, so every request needs an id that travels with it, and every service must emit the same kinds of signals."},"keys":["**Three signals**: metrics are numbers aggregated over time (request rate, error rate, latency histograms, CPU): cheap to keep, fast to query, ideal for dashboards and alerts. Logs record individual events: rich in detail, expensive at volume. Traces follow one request across services as a tree of timed spans. Metrics say something is wrong, traces say where, logs say why.","**What to measure**: for each service, RED (rate, errors, duration); for each resource, USE (utilisation, saturation, errors); or Google's four golden signals: latency, traffic, errors and saturation. Record latency as histograms and alert on percentiles, never on averages.","**Structured logs**: emit JSON with consistent fields (time, level, service, trace id, tenant or user id) so logs can be filtered and joined, not just searched as text. Never log secrets or personal data you don't need, sample noisy debug logs, and set retention by value.","**Distributed tracing**: a trace id is created at the edge and passed on every call in a header (W3C traceparent); each service records spans with a name, start, duration, parent and attributes, and the tree shows where time went. Sample to control cost: keep every error and slow request, plus a small share of the rest. OpenTelemetry is the vendor-neutral standard for emitting all three signals.","**Cardinality**: every distinct combination of metric labels is a separate time series. Labels such as status code or route are fine; user ids, request ids or full URLs multiply the series and the bill. Keep high-cardinality detail in logs and traces.","**SLIs and SLOs**: an SLI is a measured ratio of good events to all events, such as checkout requests that succeed within 500 ms ÷ all checkout requests. An SLO is a target for it over a window: 99.9% over 30 days. Pick SLIs users would notice, measure them close to the user, and set targets below 100%: perfection is impossible, and past a point users can't tell the difference.","**Error budgets**: 1 − SLO is the budget. 99.9% over 30 days allows 0.1% of requests to fail, or about 43 minutes of complete downtime. While budget remains, ship; when it's spent, slow risky releases and fix reliability. The budget makes reliability a shared, numeric decision between product and engineering.","**Alerting**: page on symptoms users feel (the SLO burning), not on causes (CPU at 90%). The burn rate is how fast the budget is being spent compared with spending it evenly. Google's SRE workbook suggests paging when 2% of a 30-day budget burns in an hour (a burn rate of 14.4) or 5% in six hours (6), each confirmed by a short window, so that both sudden outages and slow leaks are caught. Every page should be actionable, with a runbook."],"dia":[{"type":"layers","cap":"Three signals, three questions","rows":[["Metrics","Is something wrong, and how badly? Counters and histograms, cheap and aggregated: dashboards and alerts"],["Traces","Where? One request's path through every service, as a tree of timed spans"],["Logs","Why? Detailed records of individual events, joined to traces by the trace id"]],"note":"An investigation moves down the list: an alert from the metrics, then a slow trace, then the logs for that trace."},{"type":"seq","cap":"Passing the trace context along","actors":["Gateway","Checkout","Payment","Trace collector"],"msgs":[["Gateway","Checkout","traceparent: 00-4bf9…4736-a1-01"],["Checkout","Payment","traceparent: 00-4bf9…4736-b2-01"],["Payment","Trace collector","span c3: 225 ms, parent b2"],["Checkout","Trace collector","span b2: 375 ms, parent a1"],["Gateway","Trace collector","span a1: 380 ms, the root"]],"note":"Every hop carries the same trace id with its caller's span as the parent, so the collector can rebuild the whole tree."},{"type":"flow","cap":"An error budget policy","steps":[["SLO","99.9% of checkouts succeed within 500 ms, over 30 days"],["Budget","0.1% of requests may fail: 72,000 of 72 million"],["Burn-rate alerts","page at 14.4× for an hour, or 6× for six hours"],["Policy","budget left: ship; budget spent: freeze risky releases and fix reliability"]],"note":"Agree the policy with the product team before an incident, so that spending the budget leads to a decision rather than an argument."}],"cmp":[{"cap":"Metrics, logs and traces","head":["","Metrics","Logs","Traces"],"rows":[["Answers","Is something wrong, and how much?","What exactly happened, and why?","Where did the time go?"],["Unit","A number over time","One event","One request across services"],["Cost","Low, if label cardinality is controlled","Grows with traffic and detail","Grows with traffic; usually sampled"],["Typical tools","Prometheus, CloudWatch, Datadog","Loki, Elasticsearch, CloudWatch Logs","Jaeger, Tempo, Zipkin, X-Ray"],["Standards","OpenTelemetry, the Prometheus format","OpenTelemetry, JSON","OpenTelemetry, W3C Trace Context"]]},{"cap":"SLO targets and their budgets over 30 days","head":["SLO","Failures allowed","Complete downtime allowed"],"rows":[["99%","1 in 100","7 h 12 min"],["99.5%","1 in 200","3 h 36 min"],["99.9%","1 in 1,000","43 min"],["99.95%","1 in 2,000","21.6 min"],["99.99%","1 in 10,000","4.3 min"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Averages hide the tail","tabs":[{"lang":"python","src":"def percentile(sorted_ms, permille):\n    return sorted_ms[len(sorted_ms) * permille // 1000 - 1]   # nearest rank: 990 per mille is p99\n\nrand = mulberry32(1)\nlatencies = []\nfor _ in range(10_000):\n    if rand() < 0.05:\n        latencies.append(600 + int(rand() * 600))  # 1 request in 20 takes a slow path\n    else:\n        latencies.append(50 + int(rand() * 60))\ns = sorted(latencies)\nprint(f\"average {sum(latencies) // len(latencies)} ms | p50 {percentile(s, 500)} ms | \"\n      f\"p95 {percentile(s, 950)} ms | p99 {percentile(s, 990)} ms\")\ngood = sum(1 for ms in latencies if ms <= 300)     # the SLI: requests answered within 300 ms\ntenths = good * 1000 // len(latencies)\nprint(f\"within 300 ms: {tenths // 10}.{tenths % 10}% of requests, against an SLO of 99%\")\n","out":"average 118 ms | p50 81 ms | p95 109 ms | p99 1074 ms\nwithin 300 ms: 95.1% of requests, against an SLO of 99%\n","notes":[[2,"Nearest rank: sort, then take the value at that share of the list. Monitoring systems estimate this from histogram buckets instead."],[8,"About 5% of requests take 600 ms or more. That's invisible in the average and only just outside the p95."],[12,"The average (118 ms) and even the p95 look healthy; the p99 shows the slow requests users complain about."],[16,"As an SLI, 95.1% of requests within 300 ms clearly misses a 99% objective, which the average never revealed."]]},{"lang":"javascript","src":"function percentile(sortedMs, permille) {\n  return sortedMs[Math.floor(sortedMs.length * permille / 1000) - 1];   // nearest rank: 990 per mille is p99\n}\n\nconst rand = mulberry32(1);\nconst latencies = [];\nfor (let i = 0; i < 10_000; i++) {\n  if (rand() < 0.05) latencies.push(600 + Math.floor(rand() * 600));   // 1 request in 20 takes a slow path\n  else latencies.push(50 + Math.floor(rand() * 60));\n}\nconst s = [...latencies].sort((a, b) => a - b);\nconst average = Math.floor(latencies.reduce((a, b) => a + b, 0) / latencies.length);\nconsole.log(`average ${average} ms | p50 ${percentile(s, 500)} ms | ` +\n            `p95 ${percentile(s, 950)} ms | p99 ${percentile(s, 990)} ms`);\nconst good = latencies.filter(ms => ms <= 300).length;   // the SLI: requests answered within 300 ms\nconst tenths = Math.floor(good * 1000 / latencies.length);\nconsole.log(`within 300 ms: ${Math.floor(tenths / 10)}.${tenths % 10}% of requests, against an SLO of 99%`);\n","out":"average 118 ms | p50 81 ms | p95 109 ms | p99 1074 ms\nwithin 300 ms: 95.1% of requests, against an SLO of 99%\n","notes":[[2,"Nearest rank: sort, then take the value at that share of the list. Monitoring systems estimate this from histogram buckets instead."],[8,"About 5% of requests take 600 ms or more. That's invisible in the average and only just outside the p95."],[13,"The average (118 ms) and even the p95 look healthy; the p99 shows the slow requests users complain about."],[17,"As an SLI, 95.1% of requests within 300 ms clearly misses a 99% objective, which the average never revealed."]]}]},{"t":"A trace: spans, parents and a text waterfall","tabs":[{"lang":"python","src":"CALLS = (\"checkout\", 5, [(\"auth\", 20, []),         # (name, its own work in ms, the calls it makes in turn)\n                         (\"cart\", 10, [(\"db: load cart\", 45, [])]),\n                         (\"payment\", 10, [(\"fraud check\", 60, []), (\"card network\", 225, [])])])\n\ndef trace(call, parent, start, spans):\n    \"\"\"Run a call and its children one after another, recording a span (name, start, duration, parent) for each.\"\"\"\n    name, own_ms, children = call\n    index = len(spans)\n    spans.append(None)                             # reserve this span's place before its children's\n    clock = start + own_ms\n    for child in children:\n        clock = trace(child, index, clock, spans)  # the child's traceparent names this span as its parent\n    spans[index] = (name, start, clock - start, parent)\n    return clock\n\nspans = []\ntotal = trace(CALLS, None, 0, spans)\nfor name, start, ms, parent in spans:\n    depth, p = 0, parent\n    while p is not None:                           # walk up the parents to find how deep this span is\n        depth, p = depth + 1, spans[p][3]\n    bar = \".\" * (start * 30 // total) + \"#\" * max(1, ms * 30 // total)\n    print(f\"{'  ' * depth + name:<18}{bar:<31}{start}-{start + ms} ms\")\nown = [ms - sum(c[2] for c in spans if c[3] == i) for i, (_, _, ms, _) in enumerate(spans)]\nworst = max(range(len(spans)), key=lambda i: own[i])\nprint(f\"most time spent in: {spans[worst][0]}, {own[worst]} of {total} ms\")\n","out":"checkout          ############################## 0-375 ms\n  auth            #                              5-25 ms\n  cart            ..####                         25-80 ms\n    db: load cart ..###                          35-80 ms\n  payment         ......#######################  80-375 ms\n    fraud check   .......####                    90-150 ms\n    card network  ............################## 150-375 ms\nmost time spent in: card network, 225 of 375 ms\n","notes":[[9,"Each span is reserved before its children run, so the list comes out in the same order as the waterfall."],[12,"In a real system the parent's span id travels in the traceparent header, and the child's span points back to it."],[23,"The waterfall shows where the time went: payment holds most of the request, and inside it the card network."],[24,"Self time is a span's duration minus its children's. The biggest self time is where to start optimising."]]},{"lang":"javascript","src":"const CALLS = [\"checkout\", 5, [[\"auth\", 20, []],   // [name, its own work in ms, the calls it makes in turn]\n                               [\"cart\", 10, [[\"db: load cart\", 45, []]]],\n                               [\"payment\", 10, [[\"fraud check\", 60, []], [\"card network\", 225, []]]]]];\n\nfunction trace(call, parent, start, spans) {\n  // run a call and its children one after another, recording a span [name, start, duration, parent] for each\n  const [name, ownMs, children] = call;\n  const index = spans.length;\n  spans.push(null);                                // reserve this span's place before its children's\n  let clock = start + ownMs;\n  for (const child of children) clock = trace(child, index, clock, spans);   // the child's traceparent names this span as its parent\n  spans[index] = [name, start, clock - start, parent];\n  return clock;\n}\n\nconst spans = [];\nconst total = trace(CALLS, null, 0, spans);\nfor (const [name, start, ms, parent] of spans) {\n  let depth = 0;\n  for (let p = parent; p !== null; p = spans[p][3]) depth++;   // walk up the parents to find how deep this span is\n  const bar = \".\".repeat(Math.floor(start * 30 / total)) + \"#\".repeat(Math.max(1, Math.floor(ms * 30 / total)));\n  console.log(`${(\"  \".repeat(depth) + name).padEnd(18)}${bar.padEnd(31)}${start}-${start + ms} ms`);\n}\nconst own = spans.map(([, , ms], i) => ms - spans.filter(c => c[3] === i).reduce((sum, c) => sum + c[2], 0));\nlet worst = 0;\nown.forEach((ms, i) => { if (ms > own[worst]) worst = i; });\nconsole.log(`most time spent in: ${spans[worst][0]}, ${own[worst]} of ${total} ms`);\n","out":"checkout          ############################## 0-375 ms\n  auth            #                              5-25 ms\n  cart            ..####                         25-80 ms\n    db: load cart ..###                          35-80 ms\n  payment         ......#######################  80-375 ms\n    fraud check   .......####                    90-150 ms\n    card network  ............################## 150-375 ms\nmost time spent in: card network, 225 of 375 ms\n","notes":[[9,"Each span is reserved before its children run, so the list comes out in the same order as the waterfall."],[11,"In a real system the parent's span id travels in the traceparent header, and the child's span points back to it."],[22,"The waterfall shows where the time went: payment holds most of the request, and inside it the card network."],[24,"Self time is a span's duration minus its children's. The biggest self time is where to start optimising."]]}]},{"t":"An error budget and two burn-rate alerts over a month","tabs":[{"lang":"python","src":"REQUESTS_PER_HOUR, SLO_PERMILLE, HOURS = 100_000, 999, 720   # 99.9% over 30 days\nallowed_per_hour = REQUESTS_PER_HOUR * (1000 - SLO_PERMILLE) // 1000   # 100 failures an hour is exactly on budget\nbudget = allowed_per_hour * HOURS\n\nrand = mulberry32(1)\nerrors = []\nfor h in range(HOURS):\n    e = 10 + int(rand() * 20)                      # a normal hour: 0.01% to 0.03% of requests fail\n    if 300 <= h < 302:\n        e = 5000 + int(rand() * 100)               # an outage: 5% of requests fail for 2 hours\n    if 500 <= h < 512:\n        e = 800 + int(rand() * 50)                 # a bad deploy: 0.8% fail for 12 hours\n    errors.append(e)\n\ndef first_alert(start, rule):\n    return next((h for h in range(start, start + 24) if rule(h)), None)\n\nfast = lambda h: errors[h] >= 144 * allowed_per_hour // 10                      # 14.4x over 1 hour\nslow = lambda h: sum(errors[max(0, h - 5):h + 1]) >= 6 * 6 * allowed_per_hour   # 6x over 6 hours\nprint(f\"budget: {budget} failed requests in 30 days, 0.1% of {REQUESTS_PER_HOUR * HOURS}\")\nfor label, start in ((\"outage (5% for 2 h)\", 300), (\"bad deploy (0.8% for 12 h)\", 500)):\n    f, s = first_alert(start, fast), first_alert(start, slow)\n    print(f\"{label}: fast burn {'at hour ' + str(f) if f is not None else 'never'}, \"\n          f\"slow burn {'at hour ' + str(s) if s is not None else 'never'}\")\nused = sum(errors) * 1000 // budget\nprint(f\"used by the end of the month: {sum(errors)} of {budget} ({used // 10}.{used % 10}%), so the SLO is {'met' if used < 1000 else 'missed'}\")\n","out":"budget: 72000 failed requests in 30 days, 0.1% of 72000000\noutage (5% for 2 h): fast burn at hour 300, slow burn at hour 300\nbad deploy (0.8% for 12 h): fast burn never, slow burn at hour 504\nused by the end of the month: 33512 of 72000 (46.5%), so the SLO is met\n","notes":[[2,"On budget means 0.1% of each hour's 100,000 requests: 100 failures. A burn rate is the actual failures divided by that."],[18,"The fast rule pages when an hour burns 14.4 times the planned rate: 2% of the month's budget gone in one hour."],[19,"The slow rule pages when six hours average 6 times the planned rate: 5% of the budget gone, too slowly for the fast rule to notice."],[23,"The outage trips both rules at once; the bad deploy never reaches 14.4x, so only the six-hour rule catches it, five hours in."]]},{"lang":"javascript","src":"const REQUESTS_PER_HOUR = 100_000, SLO_PERMILLE = 999, HOURS = 720;   // 99.9% over 30 days\nconst allowedPerHour = Math.floor(REQUESTS_PER_HOUR * (1000 - SLO_PERMILLE) / 1000);   // 100 failures an hour is exactly on budget\nconst budget = allowedPerHour * HOURS;\n\nconst rand = mulberry32(1);\nconst errors = [];\nfor (let h = 0; h < HOURS; h++) {\n  let e = 10 + Math.floor(rand() * 20);            // a normal hour: 0.01% to 0.03% of requests fail\n  if (h >= 300 && h < 302) e = 5000 + Math.floor(rand() * 100);   // an outage: 5% of requests fail for 2 hours\n  if (h >= 500 && h < 512) e = 800 + Math.floor(rand() * 50);     // a bad deploy: 0.8% fail for 12 hours\n  errors.push(e);\n}\n\nfunction firstAlert(start, rule) {\n  for (let h = start; h < start + 24; h++) if (rule(h)) return h;\n  return null;\n}\n\nconst fast = h => errors[h] >= Math.floor(144 * allowedPerHour / 10);   // 14.4x over 1 hour\nconst slow = h => errors.slice(Math.max(0, h - 5), h + 1).reduce((a, b) => a + b, 0) >= 6 * 6 * allowedPerHour;   // 6x over 6 hours\nconsole.log(`budget: ${budget} failed requests in 30 days, 0.1% of ${REQUESTS_PER_HOUR * HOURS}`);\nfor (const [label, start] of [[\"outage (5% for 2 h)\", 300], [\"bad deploy (0.8% for 12 h)\", 500]]) {\n  const f = firstAlert(start, fast), s = firstAlert(start, slow);\n  console.log(`${label}: fast burn ${f !== null ? \"at hour \" + f : \"never\"}, ` +\n              `slow burn ${s !== null ? \"at hour \" + s : \"never\"}`);\n}\nconst spent = errors.reduce((a, b) => a + b, 0);\nconst used = Math.floor(spent * 1000 / budget);\nconsole.log(`used by the end of the month: ${spent} of ${budget} (${Math.floor(used / 10)}.${used % 10}%), so the SLO is ${used < 1000 ? \"met\" : \"missed\"}`);\n","out":"budget: 72000 failed requests in 30 days, 0.1% of 72000000\noutage (5% for 2 h): fast burn at hour 300, slow burn at hour 300\nbad deploy (0.8% for 12 h): fast burn never, slow burn at hour 504\nused by the end of the month: 33512 of 72000 (46.5%), so the SLO is met\n","notes":[[2,"On budget means 0.1% of each hour's 100,000 requests: 100 failures. A burn rate is the actual failures divided by that."],[19,"The fast rule pages when an hour burns 14.4 times the planned rate: 2% of the month's budget gone in one hour."],[20,"The slow rule pages when six hours average 6 times the planned rate: 5% of the budget gone, too slowly for the fast rule to notice."],[24,"The outage trips both rules at once; the bad deploy never reaches 14.4x, so only the six-hour rule catches it, five hours in."]]}]}],"ex":{"q":"Checkout's latency SLO is burning after a deploy. Using structured logs that carry a trace id and each span's timing, find which endpoint got slower, which dependency is responsible, and why.","steps":["Start from the metrics: compare each endpoint's p99 before and after the deploy. Only /checkout moved, from under 200 ms to about a second, so /cart and the shared layers are fine.","Then the traces: take the slow /checkout requests and find the span with the most time in each. If one span dominates almost every slow trace, that's the dependency to look at.","Then the logs for those traces: what do they have in common? Here every slow request was a cache miss in the inventory lookup, which points to a cache change in the deploy.","The investigation needs the trace id in every log line and consistent field names across services; without them each step is guesswork. Afterwards, add an alert on the cache hit rate, and a check to the deploy."],"code":{"t":"From metrics to traces to logs, over 6,000 structured log lines","tabs":[{"lang":"python","src":"import json\n\ndef p99(values):\n    s = sorted(values)\n    return s[len(s) * 99 // 100 - 1]\n\ndef make_logs(seed=7):\n    \"\"\"An hour of requests. At minute 30 a deploy makes 8% of inventory lookups miss the cache.\"\"\"\n    rand, logs = mulberry32(seed), []\n    for minute in range(60):\n        for _ in range(50):\n            for route in (\"/checkout\", \"/cart\"):\n                spans, cache = {\"auth\": 5 + int(rand() * 10)}, \"hit\"\n                if route == \"/checkout\":\n                    if minute >= 30 and rand() < 0.08:\n                        cache, spans[\"inventory\"] = \"miss\", 600 + int(rand() * 400)\n                    else:\n                        spans[\"inventory\"] = 10 + int(rand() * 20)\n                    spans[\"payment\"] = 80 + int(rand() * 60)\n                else:\n                    spans[\"db\"] = 20 + int(rand() * 30)\n                logs.append(json.dumps({\"minute\": minute, \"route\": route, \"trace\": f\"t{len(logs)}\",\n                                        \"ms\": sum(spans.values()), \"spans\": spans, \"cache\": cache},\n                                       separators=(\",\", \":\")))\n    return logs\n\nlines = make_logs()\nprint(\"a log line:\", lines[0])\nrecords = [json.loads(line) for line in lines]\nfor route in (\"/checkout\", \"/cart\"):                # 1. metrics: which endpoint moved?\n    before = [r[\"ms\"] for r in records if r[\"route\"] == route and r[\"minute\"] < 30]\n    after = [r[\"ms\"] for r in records if r[\"route\"] == route and r[\"minute\"] >= 30]\n    print(f\"{route} p99: {p99(before)} ms before the deploy, {p99(after)} ms after\")\nslow = [r for r in records if r[\"route\"] == \"/checkout\" and r[\"ms\"] > 500]\nworst = {}\nfor r in slow:                                      # 2. traces: which span holds the time?\n    name = max(r[\"spans\"], key=r[\"spans\"].get)\n    worst[name] = worst.get(name, 0) + 1\nprint(f\"slow /checkout traces: {len(slow)} | slowest span:\", \", \".join(f\"{k} in {v}\" for k, v in sorted(worst.items())))\nmisses = sum(1 for r in slow if r[\"cache\"] == \"miss\")   # 3. logs: what do they share?\nprint(f\"their logs: cache miss in {misses} of {len(slow)}\")\n","out":"a log line: {\"minute\":0,\"route\":\"/checkout\",\"trace\":\"t0\",\"ms\":154,\"spans\":{\"auth\":5,\"inventory\":11,\"payment\":138},\"cache\":\"hit\"}\n/checkout p99: 173 ms before the deploy, 1050 ms after\n/cart p99: 61 ms before the deploy, 61 ms after\nslow /checkout traces: 110 | slowest span: inventory in 110\ntheir logs: cache miss in 110 of 110\n"},{"lang":"javascript","src":"function p99(values) {\n  const s = [...values].sort((a, b) => a - b);\n  return s[Math.floor(s.length * 99 / 100) - 1];\n}\n\nfunction makeLogs(seed = 7) {\n  // an hour of requests; at minute 30 a deploy makes 8% of inventory lookups miss the cache\n  const rand = mulberry32(seed), logs = [];\n  for (let minute = 0; minute < 60; minute++) {\n    for (let i = 0; i < 50; i++) {\n      for (const route of [\"/checkout\", \"/cart\"]) {\n        const spans = { auth: 5 + Math.floor(rand() * 10) };\n        let cache = \"hit\";\n        if (route === \"/checkout\") {\n          if (minute >= 30 && rand() < 0.08) { cache = \"miss\"; spans.inventory = 600 + Math.floor(rand() * 400); }\n          else spans.inventory = 10 + Math.floor(rand() * 20);\n          spans.payment = 80 + Math.floor(rand() * 60);\n        } else {\n          spans.db = 20 + Math.floor(rand() * 30);\n        }\n        const ms = Object.values(spans).reduce((a, b) => a + b, 0);\n        logs.push(JSON.stringify({ minute, route, trace: `t${logs.length}`, ms, spans, cache }));\n      }\n    }\n  }\n  return logs;\n}\n\nconst lines = makeLogs();\nconsole.log(\"a log line:\", lines[0]);\nconst records = lines.map(line => JSON.parse(line));\nfor (const route of [\"/checkout\", \"/cart\"]) {       // 1. metrics: which endpoint moved?\n  const before = records.filter(r => r.route === route && r.minute < 30).map(r => r.ms);\n  const after = records.filter(r => r.route === route && r.minute >= 30).map(r => r.ms);\n  console.log(`${route} p99: ${p99(before)} ms before the deploy, ${p99(after)} ms after`);\n}\nconst slow = records.filter(r => r.route === \"/checkout\" && r.ms > 500);\nconst worst = new Map();\nfor (const r of slow) {                             // 2. traces: which span holds the time?\n  const name = Object.keys(r.spans).reduce((a, b) => (r.spans[b] > r.spans[a] ? b : a));\n  worst.set(name, (worst.get(name) ?? 0) + 1);\n}\nconsole.log(`slow /checkout traces: ${slow.length} | slowest span:`, [...worst].sort().map(([k, v]) => `${k} in ${v}`).join(\", \"));\nconst misses = slow.filter(r => r.cache === \"miss\").length;   // 3. logs: what do they share?\nconsole.log(`their logs: cache miss in ${misses} of ${slow.length}`);\n","out":"a log line: {\"minute\":0,\"route\":\"/checkout\",\"trace\":\"t0\",\"ms\":154,\"spans\":{\"auth\":5,\"inventory\":11,\"payment\":138},\"cache\":\"hit\"}\n/checkout p99: 173 ms before the deploy, 1050 ms after\n/cart p99: 61 ms before the deploy, 61 ms after\nslow /checkout traces: 110 | slowest span: inventory in 110\ntheir logs: cache miss in 110 of 110\n"}]},"a":"Only /checkout moved, from a p99 of 173 ms to 1,050 ms; /cart stayed at 61 ms. All 110 slow checkout traces spend most of their time in the inventory span, and every one of them logged a cache miss, so the deploy's cache change is the cause."},"fade":{"q":"Finish `histogram_quantile(permille, buckets)` the way Prometheus estimates a percentile. `buckets` is a list of (upper bound in ms, cumulative count), ending with (infinity, total). Find the bucket that contains the wanted rank and interpolate linearly inside it; the first bucket starts at 0, and a rank in the infinite bucket returns the highest finite bound.","steps":["The rank is total × permille ÷ 1000. Walk the buckets until the cumulative count reaches it.",{"ask":"How do you estimate a value inside the bucket?","a":"Assume the requests are spread evenly between the bucket's lower and upper bounds: lower + (upper − lower) × (rank − count below) ÷ count in the bucket."},{"ask":"Why can't the estimate be exact?","a":"The histogram only stores counts per bucket, not the values. Accuracy depends on the bucket edges, so put edges near the thresholds you alert on (for example, one at exactly 300 ms for a 300 ms SLO)."},{"ask":"What does it cost, and why do monitoring systems store histograms?","a":"O(buckets) per estimate, with no sorting. Bucket counts can be added up across servers and time windows, while percentiles can't: you can't average p99s."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"INF = float(\"inf\")\n\ndef histogram_quantile(permille, buckets):\n    total = buckets[-1][1]\n    lower, below = 0, 0                            # the previous bucket's bound and cumulative count\n    for upper, count in buckets:\n        ...                                        # TODO: is the rank in this bucket? if so, interpolate\n    return lower\n"},{"lang":"javascript","src":"function histogramQuantile(permille, buckets) {\n  const total = buckets.at(-1)[1];\n  let lower = 0, below = 0;                        // the previous bucket's bound and cumulative count\n  for (const [upper, count] of buckets) {\n    // TODO: is the rank in this bucket? if so, interpolate\n  }\n  return lower;\n}\n"}]},"solution":{"t":"Solution: find the bucket, then interpolate","tabs":[{"lang":"python","src":"INF = float(\"inf\")\n\ndef histogram_quantile(permille, buckets):\n    total = buckets[-1][1]\n    lower, below = 0, 0                            # the previous bucket's bound and cumulative count\n    for upper, count in buckets:\n        if count * 1000 >= total * permille:       # the rank (total x permille / 1000) is in this bucket\n            if upper == INF:\n                return lower                       # can't interpolate to infinity: the highest finite bound\n            in_bucket = count - below\n            if in_bucket == 0:\n                return lower                       # an empty bucket: nothing to interpolate\n            return lower + (upper - lower) * (total * permille - below * 1000) // (in_bucket * 1000)\n        lower, below = upper, count\n    return lower\n\nbuckets = [(50, 1200), (100, 9300), (250, 9520), (500, 9610), (1000, 9930), (2500, 10000), (INF, 10000)]\nprint(*(f\"p{q // 10} ≈ {histogram_quantile(q, buckets)} ms\" for q in (500, 950, 990)), sep=\" | \")\n","out":"p50 ≈ 73 ms | p95 ≈ 236 ms | p99 ≈ 953 ms"},{"lang":"javascript","src":"function histogramQuantile(permille, buckets) {\n  const total = buckets.at(-1)[1];\n  let lower = 0, below = 0;                        // the previous bucket's bound and cumulative count\n  for (const [upper, count] of buckets) {\n    if (count * 1000 >= total * permille) {        // the rank (total x permille / 1000) is in this bucket\n      if (upper === Infinity) return lower;        // can't interpolate to infinity: the highest finite bound\n      const inBucket = count - below;\n      if (inBucket === 0) return lower;            // an empty bucket: nothing to interpolate\n      return lower + Math.floor((upper - lower) * (total * permille - below * 1000) / (inBucket * 1000));\n    }\n    lower = upper; below = count;\n  }\n  return lower;\n}\n\nconst buckets = [[50, 1200], [100, 9300], [250, 9520], [500, 9610], [1000, 9930], [2500, 10000], [Infinity, 10000]];\nconsole.log([500, 950, 990].map(q => `p${Math.floor(q / 10)} ≈ ${histogramQuantile(q, buckets)} ms`).join(\" | \"));\n","out":"p50 ≈ 73 ms | p95 ≈ 236 ms | p99 ≈ 953 ms"}]}},"traps":[["“Alert on high CPU.”","Users don't feel CPU; they feel errors and slowness. Page on symptoms (the SLO burning), and keep cause signals like CPU for dashboards and capacity planning."],["“Track the average latency.”","Averages hide the slow requests users remember. Record histograms and watch p95 and p99, and remember that a page making ten calls meets each call's p99 far more often than 1% of the time."],["“Aim for 100% availability.”","It's impossible, enormously expensive to approach, and users can't tell 99.99% from 100% through their own networks and devices. Pick the target users need, and spend the rest of the budget on shipping."],["“Add the user id as a metric label so we can break it down by user.”","Every distinct label value creates another time series; a million users means a million series per metric. Keep high-cardinality fields in logs and traces."],["“Log everything at debug level, just in case.”","Volume drives cost and buries the signal, and logs can leak secrets and personal data. Log structured events with ids, sample the noisy ones, and use traces for request flows."],["“Tracing means instrumenting every service by hand.”","OpenTelemetry's libraries and auto-instrumentation cover common frameworks, HTTP clients and databases; you add spans by hand only for your own important steps. What must never be skipped is passing the trace header on."]],"disc":[["Your team keeps arguing about whether to ship features or fix reliability. How can SLOs settle it?","Agree an SLO with the product team (say 99.9% of checkouts succeed within 500 ms over 30 days) and a policy for the error budget. While budget remains, ship at full speed; when a burn-rate alert shows it's going fast, or it's gone, the agreed policy applies: slow risky releases, prioritise reliability work, and review the incidents. An argument about opinions becomes a number both sides signed up to."],["A request passes through a gateway, three services and a queue. How do you make it traceable from end to end?","Create the trace at the gateway (or accept the caller's traceparent), pass the traceparent header on every HTTP or gRPC call, and put it in the queue message's headers so the consumer continues the trace or links to it. Each service emits spans with OpenTelemetry, and every log line includes the trace id, so you can jump from a slow span to its logs. Keep every error and slow trace, plus a small sample of the rest."]],"teach":{"prompt":"Explain to a junior colleague what metrics, logs and traces are each for, and how an SLO and its error budget work.","rubric":["Metrics: is something wrong; traces: where; logs: why","Percentiles from histograms, not averages; watch label cardinality","A trace id propagated on every call; spans form a tree","SLI as a ratio of good events; SLO as a target over a window","Error budget and burn-rate alerts that page on symptoms"],"model":"Metrics are cheap numbers over time, such as request rates, error rates and latency histograms; they tell us something is wrong and drive dashboards and alerts. Traces follow a single request through every service as a tree of timed spans, joined by a trace id passed in a header, so they show where the time went. Logs are detailed structured events, tagged with that trace id, so they explain why. For latency I look at percentiles, not averages. An SLI is the share of good events, such as requests that succeed within 300 ms, and an SLO is the target for it, say 99.9% over 30 days. What's left over, 0.1%, is the error budget: while there's budget we ship, and when it's being burned too fast, an alert pages us and we slow down releases to fix reliability."},"qa":[["Metrics, logs or traces: which shows where the time went?","Traces: they show which service and span took the time."],["RED?","Rate, errors and duration: the three metrics to track for every service."],["SLI?","A measured share of good events, such as requests that succeed within 300 ms."],["The error budget for 99.9% over 30 days?","0.1% of requests, or about 43 minutes of complete downtime."],["Burn rate?","How fast the error budget is being spent, compared with spending it evenly over the window."],["Cardinality?","The number of distinct label combinations, each one a separate time series."]],"quiz":[{"q":"What does this print?","snip":{"t":"A 99.9% SLO over 30 days","tabs":[{"lang":"python","src":"slo_permille = 999\nminutes = 30 * 24 * 60\nbudget = minutes * (1000 - slo_permille) // 1000\nprint(minutes, budget)\n"},{"lang":"javascript","src":"const sloPermille = 999;\nconst minutes = 30 * 24 * 60;\nconst budget = Math.floor(minutes * (1000 - sloPermille) / 1000);\nconsole.log(minutes, budget);\n"}]},"o":["43200 43","43200 432","1440 1","43200 4"],"a":0,"e":"30 days is 43,200 minutes, and 0.1% of that is 43.2, rounded down to 43 minutes of complete downtime a month."},{"q":"What does this print?","snip":{"t":"Burn rates against a fast-burn threshold","tabs":[{"lang":"python","src":"allowed_per_hour = 100                           # 0.1% of 100,000 requests\nout = []\nfor errors in [90, 1500, 800]:\n    burn = errors / allowed_per_hour\n    out.append(\"page\" if burn >= 14.4 else \"ok\")\nprint(\" \".join(out))\n"},{"lang":"javascript","src":"const allowedPerHour = 100;                      // 0.1% of 100,000 requests\nconst out = [];\nfor (const errors of [90, 1500, 800]) {\n  const burn = errors / allowedPerHour;\n  out.push(burn >= 14.4 ? \"page\" : \"ok\");\n}\nconsole.log(out.join(\" \"));\n"}]},"o":["ok page ok","ok page page","page page page","ok ok ok"],"a":0,"e":"The burn rates are 0.9, 15 and 8. Only 15 crosses 14.4; the 8x hour is serious but slower, which is what the six-hour rule is for."},{"q":"Which label is safe to put on a request-count metric?","o":["The HTTP status code","The user id","The request id","The full URL, including the query string"],"a":0,"e":"A status code has a handful of values. The other three have millions, and every distinct value creates another time series."},{"q":"Which makes the best SLI for a checkout API?","o":["The share of checkout requests that succeed within 500 ms, measured at the load balancer","The average CPU use of the checkout servers","The number of log lines per minute","The uptime of the database host"],"a":0,"e":"A good SLI is a ratio of good events to all events that users would notice, measured close to them. CPU, log volume and host uptime are causes or noise, not the user's experience."},{"q":"Which should page an on-call engineer at 3 a.m.? (choose 2)","t":"ms","o":["The error budget burning 14 times faster than planned over the last hour","Checkout success below its SLO for the last 15 minutes, and falling","CPU at 85% on one of twenty servers","A disk that is 60% full","One request that took 4 seconds"],"a":[0,1],"e":"Both describe users being hurt right now. The others are causes or single events that belong on a dashboard or in a ticket, not in a page."},{"q":"Judge each statement.","t":"yn","s":[["Averages are a good basis for a latency SLO.",false],["A trace id passed in a header lets spans from different services be joined into one trace.",true],["A 99.9% SLO allows about 43 minutes of complete downtime in 30 days.",true],["User ids make cheap metric labels, because each label is just a string.",false]],"e":"Latency SLOs use percentiles or the share of fast requests, since averages hide the tail. And each distinct label value is another series, so user ids are expensive."},{"q":"Put the investigation of a latency alert in order.","t":"ord","items":["An SLO burn-rate alert fires for checkout latency","Dashboards show which endpoint's p99 rose, and when","Slow traces from that endpoint show which span holds the time","The logs for those traces show why: a cache miss, a retry, an error","A fix ships, and the burn rate returns to normal"],"e":"From cheap and aggregated to detailed and specific: the metrics narrow it down, the traces locate it, the logs explain it."},{"q":"Complete the Python latency SLI: the percentage (rounded down) of requests answered within the threshold.","t":"drop","lang":"python","code":"def latency_sli(durations_ms, threshold_ms):\n    good = sum(1 for d in durations_ms if d {{0}} threshold_ms)\n    return {{1}}\n","blanks":[{"o":["<=",">=",">","=="],"a":0},{"o":["good * 100 // len(durations_ms)","len(durations_ms) * 100 // good","good // len(durations_ms)","good * 100 // threshold_ms"],"a":0}],"e":"A good event is a request at or under the threshold, and the SLI is good events divided by all events, here as a whole percentage."}],"probs":[["Reading · Service level objectives","https://sre.google/sre-book/service-level-objectives/","","write SLIs and SLOs for a checkout service, and say where you'd measure each one"],["Exercise · Alerting on SLOs","https://sre.google/workbook/alerting-on-slos/","","work through the burn-rate table, then choose the windows and thresholds for a 99.5% SLO"],["Reference · OpenTelemetry concepts","https://opentelemetry.io/docs/concepts/","","instrument a small service with traces and metrics, and propagate the context to a second service"],["Reference · Trace Context","https://www.w3.org/TR/trace-context/","","decode a traceparent header field by field, and explain what the sampled flag does"]],"src":[["Google SRE book: Service level objectives","https://sre.google/sre-book/service-level-objectives/"],["Google SRE book: Monitoring distributed systems","https://sre.google/sre-book/monitoring-distributed-systems/"],["Google SRE workbook: Alerting on SLOs","https://sre.google/workbook/alerting-on-slos/"],["OpenTelemetry documentation: Concepts","https://opentelemetry.io/docs/concepts/"],["W3C Recommendation: Trace Context","https://www.w3.org/TR/trace-context/"],["Prometheus documentation: Histograms and summaries","https://prometheus.io/docs/practices/histograms/"]]},{"id":"m10","d":"d4","t":"The interview framework and classic designs","min":110,"hook":"At L2 the questions are open-ended: “design a pastebin”, “design a chat app”. Interviewers and design reviews judge the route as much as the result: clear scope, numbers that drive choices, an API and data model that serve the real access patterns, a walk-through of the design, one or two deep dives, and honest trade-offs. A repeatable routine keeps you from rambling or forgetting the requirements that matter most, and four classic designs (a rate limiter, a news feed, chat and a notification service) bring together everything in this hub.","pre":{"q":"You're asked to design a pastebin in 45 minutes. What do you do in the first five minutes, before drawing any boxes?","a":"Clarify the scope and the constraints: who uses it, which features are in (create, read by link, expiry) and which are out (accounts, editing), and the non-functional needs: pastes and reads per day, size limits, how long pastes live, latency and availability targets. Then estimate quickly, so that the numbers can drive the design."},"kid":{"t":"Tara's stall at the fair","x":"The school asks Tara and Ben to run a pizza stall at the fair. Before buying anything, Tara asks questions: how many people will come, how long the fair lasts, and does anyone need gluten-free? She writes the answers down and works out roughly how many pizzas they'll need. Then she makes the price board and plans where the oven, the till and the queue will go. “What if the oven breaks?” asks Ben. They borrow a second oven, but only one till fits, so they accept a longer queue at lunchtime.","map":[["Asking how many people, how long, and who needs gluten-free","Clarifying functional and non-functional requirements"],["Working out roughly how many pizzas","Back-of-the-envelope estimates that drive the design"],["The price board","The API: what clients can ask for"],["Planning where the oven, the till and the queue go","The high-level design: components and the request path"],["A second oven, but a longer queue at lunchtime","Handling a failure, and naming the trade-off you accepted"]],"brk":"The fair's needs are fixed for the day; a real product's requirements change. A good design notes which assumptions would force a redesign if they changed: ten times the users, a second region, stricter consistency."},"keys":["**Clarify first**: functional requirements (the features in scope), non-functional requirements (scale, latency, availability, consistency, durability, cost) and constraints. Write down what's out of scope. Ask; if the interviewer won't say, propose numbers and carry on.","**Estimate to decide**: peak requests per second for reads and writes, storage and bandwidth (L1 module 9). Every number should change a decision: cache or not, replicas or not, partition or not, queue or not.","**API first**: list the main operations with their inputs and outputs (POST /pastes returns an id; GET /pastes/{id} returns the text). The API fixes the contract and exposes the access patterns the data model must serve.","**Data model from access patterns**: one table or collection per entity, keys that serve the main lookups, and an index for every other query the API needs. A query with neither scans everything and will fail at scale.","**High-level design**: draw the request path (clients, load balancer, services, cache, database, queue, object storage) and walk one read and one write through it, naming what each box does.","**Deep dives**: pick the one or two hardest or riskiest parts for this product and go deep with numbers and alternatives, rather than skimming everything. The classics each have a crux: an atomic shared counter for a rate limiter, fan-out for a news feed, ordered and never-lost delivery for chat, and retries without duplicates for notifications.","**Failure and operations**: name the single points of failure, what happens when each box fails, the timeouts and retries between them, and what you'd monitor, starting with the four golden signals: latency, traffic, errors and saturation.","**Trade-offs out loud**: consistency or availability, latency or cost, simplicity or flexibility. Say what you chose, what it cost, and what would make you choose differently."],"dia":[{"type":"flow","cap":"A 45-minute design routine","steps":[["Requirements","about 5 min: features in and out, scale, latency, consistency"],["Estimates","about 5 min: peak requests per second, reads against writes, storage"],["API and data model","about 5 min: endpoints, keys and indexes"],["High-level design","10–15 min: boxes and arrows, one request walked through"],["Deep dives","10–15 min: the hardest part, with numbers and alternatives"],["Wrap-up","about 5 min: failures, monitoring, trade-offs"]],"note":"Say the plan at the start and check in at each step. Interviewers usually steer the deep dives; let them."},{"type":"tiers","cap":"A pastebin's high-level design","tiers":[["Clients",["Browser","API users"]],["Load balancer",["TLS, routing"],"HTTPS"],["API servers",["create paste","read paste","expiry sweeper"],"stateless"],["Storage",["Cache: hot pastes","Database: paste metadata","Object storage: paste bodies"],"metadata in the database, bodies by key"]],"note":"Reads hit the cache first, then fetch metadata and the body. Expired pastes are hidden on read and deleted in batches by a background job."},{"type":"tiers","cap":"A notification service","tiers":[["Callers",["Order service","Billing","Marketing tools"]],["Notification API",["Validate, check preferences and per-user limits","Idempotency key per notification"],"send(user, template, data, key)"],["Queues, one per channel",["email","SMS","push"],"enqueue, then reply 202"],["Workers",["Render the template, call the provider","Retry with backoff and jitter","Dead-letter queue after 5 attempts"],"at-least-once"],["Providers",["Email provider","SMS gateway","APNs and FCM"],"timeouts and circuit breakers"]],"note":"The API replies as soon as the message is queued; the workers absorb slow providers. The idempotency key stops retries from sending twice, and per-user limits stop a bug from spamming everyone."}],"cmp":[{"cap":"Functional and non-functional requirements","head":["","Functional","Non-functional"],"rows":[["Answers","What does it do?","How well, and at what scale?"],["Pastebin examples","Create a paste; read it by l
