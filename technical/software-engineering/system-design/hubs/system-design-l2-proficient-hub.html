<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Design L2 Proficient Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}

pre.dropcode select.right{border-color:#4fc98d;box-shadow:0 0 0 1px #4fc98d}
pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}
.expl{margin-top:9px;font-size:.93rem;border-top:1px solid var(--line);padding-top:9px}

.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}

/* Practice / mock / cases */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}

.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}

.scenario{font-size:.93rem}
.scenario ul{padding-left:20px;margin:6px 0}
details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}

/* Flashcards */
.fc{max-width:660px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}

nfo","t":"Numbers are rules of thumb","x":"Capacities, latencies and traffic shapes in this hub are typical orders of magnitude for teaching, not measurements of any product. Real designs start from measured numbers, and every estimate states its assumptions."}],"howto":["Take the **diagnostic** first (15 minutes). It ranks the four topic areas by *weight × gap*.","Open **Roadmap**, set your hours per week and start date, and tick blocks off as you go.","In each module: guess the pre-question, read the **🍎 story**, then the key ideas, diagram and code. Do the worked example, then finish the faded one yourself.","Run every simulation and change one thing at a time: a partition, a replica, a queue's retry limit. Predict the result before you run it.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","For every design, write the requirements and estimates first, then draw the boxes, then name what you traded away.","Finish with the capstone: write the design doc first, then build the smallest version that tests it."],"tactics":["**Requirements**: functional (what it does) and non-functional (scale, latency, availability, consistency). Agree the scope out loud.","**Estimates**: requests per second at the peak, reads against writes, storage, bandwidth (L1 module 9).","**API and data model**: the main endpoints, and the tables or keys that serve them.","**High-level design**: boxes and arrows for the main paths, then walk a request through it.","**Deep dives**: the hardest part (a hot key, fan-out, ordering, failure) gets the most time.","**Trade-offs and failures**: what breaks first, what you'd monitor, and what you gave up for what."],"tacticsTitle":"Design routine (use it on every question)","labsIntro":"Four builds feed the capstone. Write each one yourself in Python **and** JavaScript, run the tests, then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"These labs need only Python 3.12+ and Node.js 22.13+, using their standard libraries. No cloud account and no cost. Keep each lab in its own folder with its tests."},"labsTab":"Build","interviewIntro":"At L2 the interviewer wants a complete, defensible design in 45 minutes: clear requirements, numbers that drive the choices, a clean high-level design and one or two deep dives. Answer each question out loud in about three minutes, then compare with the model answer.","interviewEyebrow":"From practice to interview","interviewSkills":"distributed data, caching and messaging, resilience patterns, service architecture, observability, product system design","interviewTopics":"System Design L2 (consistency, replication, partitioning, caching strategies, messaging, rate limiting and resilience, service architecture, real time, observability, classic designs)","roles":["Mid-level / senior software engineer","Backend engineer","Platform or infrastructure engineer"],"domains":[{"id":"d1","short":"A","name":"Consistency, replication and partitioning","w":[30,30]},{"id":"d2","short":"B","name":"Caching, messaging and resilience","w":[30,30]},{"id":"d3","short":"C","name":"Services, real time and observability","w":[25,25]},{"id":"d4","short":"D","name":"Interview framework and classic designs","w":[15,15]}],"groups":[{"id":"g1","t":"Data across machines","mods":["m01","m02","m03"]},{"id":"g2","t":"Caches, queues and protection","mods":["m04","m05","m06"]},{"id":"g3","t":"Services in production","mods":["m07","m08","m09"]},{"id":"g4","t":"Putting it together","mods":["m10"]}],"modules":[{"id":"m01","d":"d1","t":"Consistency models: what a reader is promised","min":100,"hook":"As soon as data lives on more than one machine, two readers can get different answers to the same question. A consistency model is the promise a system makes about what a read may return: the latest write, something eventually, or at least your own writes. Choosing the weakest promise a feature can live with buys speed and availability; choosing too weak a promise costs money or trust.","pre":{"q":"A user changes their display name, refreshes and sees the old one; a second later the new name appears. Another user in another country sees the old name for five seconds. Is the system broken?","a":"Not necessarily: it's eventually consistent, and the replicas caught up. But showing users their own old data breaks read-your-writes, which people notice and which is cheap to fix (send their reads to an up-to-date copy for a while). Another user seeing a few seconds of the old name is usually fine for a display name, and not fine for a bank balance."},"kid":{"t":"New price cards by bicycle","x":"When Luigi changes a price on the big board in his shop, a boy on a bicycle carries the new price card to every kiosk in town. For a few minutes some kiosks still show the old price; by teatime they all agree. Tara orders at the shop, then checks her order at a kiosk, and it isn't there yet. One day the bridge closes, and the kiosks across the river get no cards at all. Luigi must choose: tell those kiosks to stop selling until the bridge opens, or let them keep selling at the old prices. Even on normal days, waiting for every kiosk to confirm a change would make each change slow.","map":[["Kiosks showing the old price for a while, then all agreeing","Eventual consistency: replicas converge once updates stop"],["Tara's order missing at the kiosk just after she placed it","A read-your-writes violation"],["The bridge closing","A network partition between replicas"],["Stop selling, or keep selling at the old prices","CAP: during a partition, choose consistency or availability"],["Waiting for every kiosk to confirm makes each change slow","PACELC: even without a partition, stronger consistency costs latency"]],"brk":"A kiosk knows when its card is late; a real replica usually can't tell that it's stale. And real systems don't use one promise for everything: a bank balance and a like counter can have different models in the same app."},"keys":["**Why consistency models exist**: with several copies of the data (replicas, caches, regions), a read can land on a copy that hasn't seen the latest write yet. A consistency model is the contract that says which values a read is allowed to return.","**Strong consistency (linearizability)**: every operation appears to take effect at one instant between its start and its end, so once a write has completed, every later read, by anyone, returns it or something newer. It's what one machine gives you, and what locks, leader election and account balances need.","**Eventual consistency**: if writes stop, all replicas eventually return the same value. Until then a read may return an old value. It's cheap and stays available, and it's fine for likes, view counts and profile pictures.","**Session guarantees**: in between. Read-your-writes: you always see your own earlier writes. Monotonic reads: you never see an older value after a newer one. Consistent prefix: you see writes in the order they happened, so an answer never appears before its question.","**CAP**: during a network partition between replicas, a system must choose consistency (refuse or delay some requests so nobody reads diverging data) or availability (answer every request, possibly with stale or conflicting data). It's a choice made when a partition happens, not a permanent label.","**PACELC**: if there's a Partition, choose Availability or Consistency; Else, choose Latency or Consistency. With a healthy network, waiting for replicas to confirm writes, or reading from the leader or a majority, still adds latency, so the trade-off is there every day.","**Making the promises**: strong consistency usually means one leader per item with synchronous replication or majority quorums (module 2). Read-your-writes can come from reading the leader for a while after a write, or from remembering the version you wrote and only accepting replicas that have it.","**Choose per feature**: one app can mix models. A transfer needs strong consistency, a basket read-your-writes, a like counter only eventual consistency. Ask what goes wrong if someone sees old data, and for how long that's acceptable."],"dia":[{"type":"seq","cap":"Eventual consistency, and a read-your-writes violation","actors":["Tara","Leader","Replica"],"msgs":[["Tara","Leader","write name = “Tara B.”"],["Leader","Tara","OK, version 2",true],["Tara","Replica","read name (1 s later)"],["Replica","Tara","“Tara”, version 1: her own write is missing",true],["Leader","Replica","version 2 arrives (5 s after the write)"]],"note":"Remembering “I wrote version 2” lets the client refuse version 1 and ask the leader instead: read-your-writes for Tara, while everyone else keeps using the nearby replica."},{"type":"layers","cap":"From the strongest promise to the weakest","rows":[["Linearizable (strong)","every read sees the latest completed write · locks, balances, stock"],["Sequential","everyone sees the same order of writes, though possibly late"],["Causal","effects never appear before their causes · comments and replies"],["Session guarantees","read-your-writes, monotonic reads, consistent prefix · baskets, profiles"],["Eventual","converges once writes stop · counters, likes, recommendations"]],"note":"Each step down is cheaper and stays available in more failures, and lets readers see more surprising results."},{"type":"quad","cap":"PACELC: two choices, not one","x0":"partitioned: stay available (PA)","x1":"partitioned: stay consistent (PC)","y1":"normally: consistent, slower (EC)","y0":"normally: fast, maybe stale (EL)","cells":[["PA/EC","available during partitions, consistent when the network is healthy"],["PC/EC","always consistent: one leader or majority quorums; account balances"],["PA/EL","always fast and available, eventually consistent; likes, presence, carts"],["PC/EL","fast reads normally, but refuses rather than diverges in a partition"]]}],"cmp":[{"cap":"Consistency models compared","head":["Model","Promise","Cost","Good for"],"rows":[["Linearizable","Every read sees the latest completed write","A leader or quorum round trip on every read and write; unavailable on the minority side of a partition","Balances, stock at checkout, locks, unique usernames"],["Read-your-writes","You always see your own writes","Track what each client wrote; some reads go to the leader","Profiles, baskets, settings, posts you just made"],["Monotonic reads","Time never goes backwards for a reader","Stick to one replica, or track the last version seen","Feeds, comment threads, dashboards"],["Eventual","Replicas converge once writes stop","Almost none; readers may see old values","Likes, view counts, recommendations, caches"]]},{"cap":"During a partition","head":["","Consistency first (CP)","Availability first (AP)"],"rows":[["Minority side","Refuses or delays reads and writes","Keeps answering"],["The data","Never diverges","Diverges; reconciled after healing"],["The risk","Errors and timeouts for some users","Stale reads; lost or merged writes"],["Typical use","Locks, leader election, balances","Carts, likes, presence, DNS"]]}],"code":[{"t":"A leader and replicas that apply each write after a fixed lag","tabs":[{"lang":"python","src":"class Replicated:\n    \"\"\"A leader takes writes; replica i applies each write lags[i] seconds after it happened (replica 0 is the leader).\"\"\"\n    def __init__(self, lags):\n        self.lags, self.log = lags, []          # log: (time, version, value) in write order\n\n    def write(self, now, value):\n        version = len(self.log) + 1\n        self.log.append((now, version, value))\n        return version\n\n    def read(self, now, replica):\n        \"\"\"(version, value) of the newest write this replica has applied by `now`; (0, None) if none yet.\"\"\"\n        best = (0, None)\n        for t, version, value in self.log:\n            if t + self.lags[replica] <= now:\n                best = (version, value)\n        return best\n"},{"lang":"javascript","src":"class Replicated {\n  // a leader takes writes; replica i applies each write lags[i] seconds after it happened (replica 0 is the leader)\n  constructor(lags) { this.lags = lags; this.log = []; }   // log: [time, version, value] in write order\n  write(now, value) {\n    const version = this.log.length + 1;\n    this.log.push([now, version, value]);\n    return version;\n  }\n  read(now, replica) {\n    // [version, value] of the newest write this replica has applied by `now`; [0, null] if none yet\n    let best = [0, null];\n    for (const [t, version, value] of this.log) if (t + this.lags[replica] <= now) best = [version, value];\n    return best;\n  }\n}\n"}]},{"t":"Eventual consistency: replicas disagree for a while, then converge","tabs":[{"lang":"python","src":"store = Replicated([0, 2, 5])                 # the leader and two replicas, 2 s and 5 s behind\nstore.write(0, \"Tara\")\nstore.write(10, \"Tara B.\")                    # she changes her name at t = 10\nfor now in (10, 11, 12, 15):\n    print(f\"t={now}:\", \" | \".join(store.read(now, r)[1] for r in range(3)))\n","out":"t=10: Tara B. | Tara | Tara\nt=11: Tara B. | Tara | Tara\nt=12: Tara B. | Tara B. | Tara\nt=15: Tara B. | Tara B. | Tara B.\n","notes":[[1,"Replica 0 is the leader; the others apply each write 2 and 5 seconds after it happens."],[5,"For five seconds after the change, readers get different names depending on which copy answers."]]},{"lang":"javascript","src":"const store = new Replicated([0, 2, 5]);      // the leader and two replicas, 2 s and 5 s behind\nstore.write(0, \"Tara\");\nstore.write(10, \"Tara B.\");                   // she changes her name at t = 10\nfor (const now of [10, 11, 12, 15]) {\n  console.log(`t=${now}:`, [0, 1, 2].map(r => store.read(now, r)[1]).join(\" | \"));\n}\n","out":"t=10: Tara B. | Tara | Tara\nt=11: Tara B. | Tara | Tara\nt=12: Tara B. | Tara B. | Tara\nt=15: Tara B. | Tara B. | Tara B.\n","notes":[[1,"Replica 0 is the leader; the others apply each write 2 and 5 seconds after it happens."],[5,"For five seconds after the change, readers get different names depending on which copy answers."]]}]},{"t":"Session guarantees: a client that tracks versions","tabs":[{"lang":"python","src":"store = Replicated([0, 2, 5])\nstore.write(0, \"Tara\")\nmine = store.write(10, \"Tara B.\")             # the client's own write: version 2\n\ndef read_at_least(now, replica, min_version):\n    version, value = store.read(now, replica)\n    if version < min_version:                 # this copy is too old for this client\n        version, value = store.read(now, 0)   # so ask the leader\n    return version, value\n\nvisits = [(10, 2), (12, 1), (13, 2)]          # (time, replica) of three reads\nplain = [store.read(now, r)[0] for now, r in visits]\nseen, tracked = mine, []\nfor now, r in visits:\n    version, _ = read_at_least(now, r, seen)\n    seen = max(seen, version)                 # never accept anything older than this again\n    tracked.append(version)\nprint(\"plain:   \", *(f\"v{v}\" for v in plain))\nprint(\"tracking:\", *(f\"v{v}\" for v in tracked))\n","out":"plain:    v1 v2 v1\ntracking: v2 v2 v2\n","notes":[[3,"The leader returns the new version number with every write, and the client keeps it."],[7,"A replica older than what this client has already written or seen is skipped."],[18,"Plain reads break both promises: the client misses its own write (v1 at t = 10), then goes back in time (v2, then v1)."],[19,"Tracking the version gives read-your-writes and monotonic reads; only the stale reads cost a trip to the leader."]]},{"lang":"javascript","src":"const store = new Replicated([0, 2, 5]);\nstore.write(0, \"Tara\");\nconst mine = store.write(10, \"Tara B.\");      // the client's own write: version 2\n\nfunction readAtLeast(now, replica, minVersion) {\n  let [version, value] = store.read(now, replica);\n  if (version < minVersion) [version, value] = store.read(now, 0);   // too old for this client: ask the leader\n  return [version, value];\n}\n\nconst visits = [[10, 2], [12, 1], [13, 2]];   // [time, replica] of three reads\nconst plain = visits.map(([now, r]) => store.read(now, r)[0]);\nlet seen = mine;\nconst tracked = [];\nfor (const [now, r] of visits) {\n  const [version] = readAtLeast(now, r, seen);\n  seen = Math.max(seen, version);             // never accept anything older than this again\n  tracked.push(version);\n}\nconsole.log(\"plain:   \", ...plain.map(v => `v${v}`));\nconsole.log(\"tracking:\", ...tracked.map(v => `v${v}`));\n","out":"plain:    v1 v2 v1\ntracking: v2 v2 v2\n","notes":[[3,"The leader returns the new version number with every write, and the client keeps it."],[7,"A replica older than what this client has already written or seen is skipped."],[20,"Plain reads break both promises: the client misses its own write (v1 at t = 10), then goes back in time (v2, then v1)."],[21,"Tracking the version gives read-your-writes and monotonic reads; only the stale reads cost a trip to the leader."]]}]},{"t":"CAP during a partition: consistency first or availability first","tabs":[{"lang":"python","src":"def run(mode):\n    sides = [{\"A\", \"B\"}, {\"C\"}]               # a partition: C can't reach A or B\n    value = {r: (0, \"8\") for r in \"ABC\"}      # replica -> (time written, price)\n    events = [(6, \"X\", \"A\", \"write\", \"10\"), (7, \"Y\", \"C\", \"write\", \"12\"), (8, \"Z\", \"C\", \"read\", None)]\n    log = []\n    for t, client, replica, op, price in events:\n        side = next(s for s in sides if replica in s)\n        if mode == \"CP\" and len(side) < 2:    # no majority of the 3 replicas on this side\n            log.append(f\"{client} refused\")\n        elif op == \"write\":\n            for r in side:\n                value[r] = (t, price)\n            log.append(f\"{client} ok\")\n        else:\n            log.append(f\"{client} reads {value[replica][1]}\")\n    return log, max(value.values())[1]        # healing: the newest write wins everywhere\n\nfor mode in (\"CP\", \"AP\"):\n    log, final = run(mode)\n    print(f\"{mode}: {', '.join(log)}; after healing everyone reads {final}\")\n","out":"CP: X ok, Y refused, Z refused; after healing everyone reads 10\nAP: X ok, Y ok, Z reads 12; after healing everyone reads 12\n","notes":[[9,"Consistency first: the side without a majority refuses both the write and the read, so no one sees diverging prices."],[16,"When the partition heals, last-writer-wins keeps the newest write. In AP mode that silently discards X's price of 10."],[20,"CP turned users away; AP answered everyone but lost a write. Neither is free: pick per feature."]]},{"lang":"javascript","src":"function run(mode) {\n  const sides = [new Set([\"A\", \"B\"]), new Set([\"C\"])];   // a partition: C can't reach A or B\n  const value = { A: [0, \"8\"], B: [0, \"8\"], C: [0, \"8\"] };   // replica -> [time written, price]\n  const events = [[6, \"X\", \"A\", \"write\", \"10\"], [7, \"Y\", \"C\", \"write\", \"12\"], [8, \"Z\", \"C\", \"read\", null]];\n  const log = [];\n  for (const [t, client, replica, op, price] of events) {\n    const side = sides.find(s => s.has(replica));\n    if (mode === \"CP\" && side.size < 2) log.push(`${client} refused`);   // no majority of the 3 replicas on this side\n    else if (op === \"write\") {\n      for (const r of side) value[r] = [t, price];\n      log.push(`${client} ok`);\n    } else log.push(`${client} reads ${value[replica][1]}`);\n  }\n  const newest = Object.values(value).reduce((a, b) => (b[0] > a[0] ? b : a));   // healing: the newest write wins everywhere\n  return [log, newest[1]];\n}\n\nfor (const mode of [\"CP\", \"AP\"]) {\n  const [log, final] = run(mode);\n  console.log(`${mode}: ${log.join(\", \")}; after healing everyone reads ${final}`);\n}\n","out":"CP: X ok, Y refused, Z refused; after healing everyone reads 10\nAP: X ok, Y ok, Z reads 12; after healing everyone reads 12\n","notes":[[8,"Consistency first: the side without a majority refuses both the write and the read, so no one sees diverging prices."],[14,"When the partition heals, last-writer-wins keeps the newest write. In AP mode that silently discards X's price of 10."],[20,"CP turned users away; AP answered everyone but lost a write. Neither is free: pick per feature."]]}]}],"ex":{"q":"Users in Sydney read their profile; the leader is in Frankfurt (280 ms away) and a replica is 5 ms away. 5% of reads come within 10 seconds of that user's own write. Compare the average read latency of three policies: always read the leader (strong), always read the replica (eventual), and read-your-writes (the leader for 10 s after your own write, the replica otherwise).","steps":["Strong: every read goes to the leader so that it sees the latest write: 280 ms each, for everyone in Sydney.","Eventual: every read uses the nearby replica: 5 ms, but users may not see their own change for as long as the replica lags.","Read-your-writes: only the 5% of reads just after the user's own write go to the leader: 0.05 × 280 + 0.95 × 5 = 18.75 ms on average.","The guarantee users actually notice costs about 14 ms on average instead of 275. Other users may see the old value for a moment, which is fine for a profile but not for a balance. The arithmetic is O(1); the real work is deciding which feature needs which promise."],"code":{"t":"Average read latency under three policies","tabs":[{"lang":"python","src":"def avg_latency_ms(policy, recent_pct, leader_ms=280, replica_ms=5):\n    if policy == \"strong\":\n        return leader_ms\n    if policy == \"eventual\":\n        return replica_ms\n    return (recent_pct * leader_ms + (100 - recent_pct) * replica_ms) / 100   # read-your-writes\n\nfor policy in (\"strong\", \"eventual\", \"read-your-writes\"):\n    print(f\"{policy}: {avg_latency_ms(policy, 5):.2f} ms\")\n","out":"strong: 280.00 ms\neventual: 5.00 ms\nread-your-writes: 18.75 ms\n"},{"lang":"javascript","src":"function avgLatencyMs(policy, recentPct, leaderMs = 280, replicaMs = 5) {\n  if (policy === \"strong\") return leaderMs;\n  if (policy === \"eventual\") return replicaMs;\n  return (recentPct * leaderMs + (100 - recentPct) * replicaMs) / 100;   // read-your-writes\n}\n\nfor (const policy of [\"strong\", \"eventual\", \"read-your-writes\"]) console.log(`${policy}: ${avgLatencyMs(policy, 5).toFixed(2)} ms`);\n","out":"strong: 280.00 ms\neventual: 5.00 ms\nread-your-writes: 18.75 ms\n"}]},"a":"Strong consistency costs 280 ms on every read, eventual consistency 5 ms, and read-your-writes 18.75 ms on average: almost the speed of the replica, while still showing users their own changes at once."},"fade":{"q":"A cheap check behind strong consistency: a read must never return a value that a later write had already replaced before the read began. Writes have unique values and run from `start` to `end`; reads report what they saw. Finish `stale_reads(writes, reads)` so it returns (read start, value seen) for every read that saw an already-replaced value (or the initial value after a write had completed).","steps":["Linearizability forbids one thing above all: reading a value after a newer write has already finished.",{"ask":"When is a read of value V definitely stale?","a":"When some write W started after V's write had finished and itself finished before the read began: W is certainly newer than V and complete, so a strongly consistent read must return W or something newer."},{"ask":"Why is a write that overlaps the read allowed either way?","a":"A write still in progress may take effect before or after the read, so seeing either the old or the new value is legal."},{"ask":"What does the check cost, and what does it miss?","a":"O(reads × writes) time. It catches stale reads but isn't a full linearizability check: tools such as Jepsen's checkers search for one order of all operations that explains every result."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def stale_reads(writes, reads):\n    \"\"\"writes: (start, end, value); reads: (start, end, value seen). Returns [(read start, value seen)] for stale reads.\"\"\"\n    ...                                       # TODO: stale if a write began after the seen value's write ended and ended before the read began\n"},{"lang":"javascript","src":"function staleReads(writes, reads) {\n  // writes: [start, end, value]; reads: [start, end, value seen]. Returns [[read start, value seen]] for stale reads\n  // TODO: stale if a write began after the seen value's write ended and ended before the read began\n}\n"}]},"solution":{"t":"Solution: look for a complete, strictly newer write","tabs":[{"lang":"python","src":"def stale_reads(writes, reads):\n    \"\"\"writes: (start, end, value); reads: (start, end, value seen). Returns [(read start, value seen)] for stale reads.\"\"\"\n    ended = {value: end for _, end, value in writes}\n    stale = []\n    for r_start, _, seen in reads:\n        seen_end = ended.get(seen, float(\"-inf\"))   # the initial value counts as written before everything\n        if any(w_start > seen_end and w_end < r_start for w_start, w_end, _ in writes):\n            stale.append((r_start, seen))\n    return stale\n\nwrites = [(0, 2, \"v1\"), (5, 6, \"v2\"), (9, 12, \"v3\")]\nreads = [(3, 4, \"v1\"), (7, 8, \"v1\"), (10, 11, \"v2\"), (13, 14, \"v2\")]\nprint(\"stale reads:\", *(f\"{value} at t={start}\" for start, value in stale_reads(writes, reads)))\n","out":"stale reads: v1 at t=7 v2 at t=13"},{"lang":"javascript","src":"function staleReads(writes, reads) {\n  // writes: [start, end, value]; reads: [start, end, value seen]. Returns [[read start, value seen]] for stale reads\n  const ended = new Map(writes.map(([, end, value]) => [value, end]));\n  const stale = [];\n  for (const [rStart, , seen] of reads) {\n    const seenEnd = ended.has(seen) ? ended.get(seen) : -Infinity;   // the initial value counts as written before everything\n    if (writes.some(([wStart, wEnd]) => wStart > seenEnd && wEnd < rStart)) stale.push([rStart, seen]);\n  }\n  return stale;\n}\n\nconst writes = [[0, 2, \"v1\"], [5, 6, \"v2\"], [9, 12, \"v3\"]];\nconst reads = [[3, 4, \"v1\"], [7, 8, \"v1\"], [10, 11, \"v2\"], [13, 14, \"v2\"]];\nconsole.log(\"stale reads:\", ...staleReads(writes, reads).map(([start, value]) => `${value} at t=${start}`));\n","out":"stale reads: v1 at t=7 v2 at t=13"}]}},"traps":[["“Eventual consistency means the data might never agree.”","It promises convergence once writes stop; what it doesn't promise is when, or what you see in the meantime. In a healthy system the lag is usually milliseconds to seconds."],["“CAP means you pick two of consistency, availability and partition tolerance.”","Partitions happen whether you like it or not, so the real choice is what to do during one: refuse some requests or answer with possibly stale data. Outside partitions, PACELC's latency-or-consistency trade-off applies."],["“Strong consistency is always the safe choice.”","It costs latency on every operation and availability during partitions. Use it where stale data causes real harm (money, stock, locks) and weaker promises elsewhere."],["“Read-your-writes needs strong consistency everywhere.”","It's a promise to each client: send a user's reads to the leader for a while after they write, or only accept replicas that have their version. Everyone else keeps reading nearby copies."],["“A replica that answers quickly is up to date.”","Replicas rarely know they're stale, and speed says nothing about freshness. Only versions or timestamps compared with what the client has seen can tell you."],["“Last-writer-wins resolves conflicts safely.”","It keeps one write and silently discards the others, and it trusts clocks that can disagree. Fine for a profile picture, dangerous for a basket or a balance; module 2 covers better merges."]],"disc":[["Which consistency would you choose for a shopping app's features?","Stock at checkout and payments: strong, with the decrement and the order in one transaction on the leader, because overselling costs money and trust. The basket: read-your-writes, so people always see what they added, with conflicting edits merged rather than overwritten. Product pages and reviews: eventual, cached and replicated freely, because a few seconds of staleness hurts nobody. Like and view counts: eventual, even approximate."],["Explain CAP with an example of each choice.","Take three replicas with one cut off by a network partition. A consistency-first system, for example one that needs a majority quorum, keeps serving on the side with two replicas and refuses writes, and possibly reads, on the isolated one, so nobody sees diverging values. An availability-first system lets every replica keep accepting reads and writes, so both sides stay up, but they diverge and must be reconciled later, possibly losing a write. Neither is free: the right choice depends on what stale or lost data would cost."]],"teach":{"prompt":"Explain to a junior colleague the difference between strong, eventual and read-your-writes consistency, and where CAP and PACELC come in.","rubric":["Strong: every read sees the latest completed write","Eventual: replicas converge; reads may be stale meanwhile","Read-your-writes and monotonic reads as promises to one client","CAP: during a partition, choose consistency or availability","PACELC: otherwise, choose latency or consistency; pick per feature"],"model":"With several copies of the data, a read can hit a copy that hasn't seen the latest write, so we pick a promise. Strong consistency, or linearizability, says that once a write has finished, every later read by anyone sees it; that usually means going to a leader or a majority, which is slower. Eventual consistency only says the copies agree once writes stop, so reads can be stale for a while; it's cheap and fine for things like likes. In between are promises to one client: read-your-writes means you always see your own changes, and monotonic reads means you never go back in time; we can give those by tracking versions and asking the leader only when a replica is too old. CAP is about partitions: when replicas can't talk, we either refuse some requests or answer with possibly stale data. PACELC adds that even on a good day, stronger consistency costs latency. So I choose per feature: strong for money and stock, read-your-writes for baskets and profiles, eventual for counters."},"qa":[["What does linearizability promise?","Once a write completes, every later read by anyone returns it or something newer."],["What does eventual consistency promise?","If writes stop, all replicas eventually return the same value."],["Read-your-writes?","A client always sees its own earlier writes."],["Monotonic reads?","A client never sees an older value after it has seen a newer one."],["CAP in one line?","During a network partition, a system chooses consistency or availability."],["PACELC in one line?","If Partitioned, choose Availability or Consistency; Else, choose Latency or Consistency."]],"quiz":[{"q":"What does this print? (`Replicated` is this module's helper: replica 0 is the leader.)","snip":{"t":"Reads from a leader and a lagging replica","tabs":[{"lang":"python","src":"s = Replicated([0, 3])\ns.write(0, \"a\")\ns.write(10, \"b\")\nprint(*(s.read(t, r)[1] for t, r in ((9, 1), (10, 0), (12, 1), (13, 1))))\n"},{"lang":"javascript","src":"const s = new Replicated([0, 3]);\ns.write(0, \"a\");\ns.write(10, \"b\");\nconsole.log(...[[9, 1], [10, 0], [12, 1], [13, 1]].map(([t, r]) => s.read(t, r)[1]));\n"}]},"o":["a b a b","a b b b","b b a b","a a a b"],"a":0,"e":"The leader sees “b” at once (t = 10). The replica applies each write 3 s late, so it still shows “a” at 9 and 12 and switches to “b” at 13."},{"q":"What does this print?","snip":{"t":"Average latency as more reads go to the leader","tabs":[{"lang":"python","src":"leader_ms, replica_ms = 200, 10\nprint(*((pct * leader_ms + (100 - pct) * replica_ms) // 100 for pct in (0, 10, 100)))\n"},{"lang":"javascript","src":"const leaderMs = 200, replicaMs = 10;\nconsole.log(...[0, 10, 100].map(pct => Math.floor((pct * leaderMs + (100 - pct) * replicaMs) / 100)));\n"}]},"o":["10 29 200","10 20 200","10 19 200","0 29 200"],"a":0,"e":"With no reads at the leader the average is the replica's 10 ms; with all of them it's 200 ms; with 10%: (10 × 200 + 90 × 10) ÷ 100 = 29 ms."},{"q":"During a network partition, a replica on the minority side receives a write. What does a consistency-first (CP) system do?","o":["Refuses or delays the write until it can reach a majority","Accepts it and lets the newest write win when the partition heals","Accepts it and quietly forwards it later","Accepts it on every replica at once"],"a":0,"e":"Without a majority it can't be sure no conflicting write was accepted elsewhere, so it refuses. Accepting and reconciling later is the availability-first choice; reaching every replica is impossible during a partition."},{"q":"Which features can live with eventual consistency? (choose 2)","t":"ms","o":["A video's view count","Product reviews","Decrementing stock at checkout","A bank transfer","A lock that only one worker may hold"],"a":[0,1],"e":"A count that's briefly off or reviews that appear a few seconds late harm nobody. Stock, money and locks need every reader to agree on the latest value."},{"q":"Judge each statement.","t":"yn","s":[["Eventual consistency promises that replicas converge once writes stop.",true],["CAP says a system can never be both consistent and available.",false],["Read-your-writes can be provided without making every read strongly consistent.",true],["Last-writer-wins can silently discard a concurrent write.",true]],"e":"Convergence is exactly eventual consistency's promise. CAP's choice only applies during a partition. Read-your-writes only needs the writer's reads to be fresh. And last-writer-wins keeps one of two concurrent writes and drops the other."},{"q":"Put the steps of a read-your-writes read in order.","t":"ord","items":["The client writes and keeps the version number it gets back","The client reads from a nearby replica","It compares the replica's version with the one it kept","If the replica is older, it reads from the leader instead"],"e":"The client needs the version from its write before it can compare, it can only compare after the replica answers, and it only falls back to the leader when the comparison fails."},{"q":"Complete the JavaScript read that never returns anything older than the client has seen (`Replicated` is this module's helper).","t":"drop","lang":"javascript","code":"function readAtLeast(store, now, replica, minVersion) {\n  const [version, value] = store.read(now, replica);\n  if ({{0}}) return store.read(now, {{1}});\n  return [version, value];\n}\n","blanks":[{"o":["version < minVersion","version > minVersion","version === minVersion","value === null"],"a":0},{"o":["0","replica","replica + 1","minVersion"],"a":0}],"e":"If the replica is older than the version the client must see, the leader (replica 0) has every write, so read from it; otherwise the nearby replica is good enough."},{"q":"Match each promise to its name.","t":"match","pairs":[["Every read sees the latest completed write","Linearizability"],["Replicas agree once writes stop","Eventual consistency"],["You always see your own updates","Read-your-writes"],["You never see an older value after a newer one","Monotonic reads"]],"extra":["Consistent hashing"],"e":"Consistent hashing decides where data lives (module 3); it isn't a promise about what a read returns."}],"probs":[["Reading · A map of consistency models","https://jepsen.io/consistency","","find linearizable, sequential, causal, read-your-writes and monotonic reads, and note which stay available during a partition"],["Reading · CAP twelve years later","https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/","","Brewer on what CAP does and doesn't say, and why partitions are rare but must be planned for"],["Exercise · Tunable consistency in a real database","https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels","","compare the five consistency levels with this module's models, then pick one for a basket and one for a view counter"],["Exercise · Sessions that read their own writes","https://www.mongodb.com/docs/manual/core/causal-consistency-read-write-concerns/","","find how causally consistent sessions give read-your-writes and monotonic reads, and what they cost"]],"src":[["Jepsen: Consistency models","https://jepsen.io/consistency"],["Eric Brewer: CAP twelve years later (InfoQ)","https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/"],["Wikipedia: PACELC design principle","https://en.wikipedia.org/wiki/PACELC_design_principle"],["Azure Cosmos DB: Consistency levels","https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels"]]},{"id":"m02","d":"d1","t":"Replication: leaders, followers and quorums","min":105,"hook":"Replication keeps copies of the same data on several machines, so the system survives a machine dying, reads can be spread out, and users far away get a nearby copy. The hard questions are who accepts writes, how the copies stay in step, and what happens when they disagree. Three answers (one leader, several leaders, or no leader at all) cover almost every database you'll meet.","pre":{"q":"A database has one leader and two followers with asynchronous replication. The leader crashes a moment after confirming a write that hadn't reached either follower, and a follower is promoted. What happened to the write, and how could you have prevented it?","a":"It's lost: the new leader never received it, even though the client was told it succeeded. Waiting for at least one follower before confirming (semi-synchronous replication) prevents that, at the cost of that wait on every write; writing to a quorum of replicas is the leaderless equivalent."},"kid":{"t":"Order books and noticeboards","x":"Luigi writes every order in his big order book, and his two helpers copy each new page into their own books a little later. When Luigi catches a cold, a helper takes over, but the last few orders were never copied. Luigi's second shop also takes orders, and the two shops swap pages every evening; once, both changed Ben's order on the same day, and nobody knew which to keep. In the market square there are five noticeboards. Tara pins her order on any three. Ben, checking, reads any three boards and trusts the newest note, because any three boards always share at least one with Tara's three.","map":[["Luigi's big book, copied a little later by his helpers","Leader-follower replication with asynchronous followers"],["The last orders never copied when Luigi falls ill","Failover can lose writes the followers hadn't received"],["Two shops both taking orders and swapping pages","Multi-leader replication, with conflicts to resolve"],["Pinning on any 3 of 5 boards, and reading any 3","Leaderless replication with write and read quorums"],["Any three boards share one with Tara's three","W + R > N: every read overlaps the latest successful write"]],"brk":"A noticeboard never half-fails; real replicas do, and a read can catch a write that reached only some of them. So real systems add version numbers to know which note is newest, and repair stale copies as they find them."},"keys":["**Why replicate**: copies on several machines keep the data available when one dies, spread reads across more machines, and put data near users in other regions. The cost is keeping the copies in step.","**Leader-follower (single leader)**: all writes go to one leader, which sends a log of its changes to the followers; reads can go to followers, a little behind. Simple and free of conflicts, but the leader is the write bottleneck and a single point of failure until failover.","**Synchronous or asynchronous**: synchronous replication waits for followers before confirming a write (no loss on failover, but slower, and a dead follower stalls writes); asynchronous confirms at once (fast, but a crash can lose confirmed writes). Semi-synchronous waits for one follower: a common middle ground.","**Failover**: when the leader dies, a follower is promoted. The dangers: losing writes it hadn't received, two nodes both believing they're the leader (split brain), and clients still writing to the old one. Fencing (writes from an old leadership term are rejected) and consensus (L3) make it safe.","**Multi-leader**: several leaders, often one per region, each accept writes and replicate to each other. Writes are fast and local and survive a region failing, but the same item can be changed in two places at once, so conflicts must be resolved: last-writer-wins, a merge, or asking the user.","**Leaderless (Dynamo-style)**: the client writes to W of the N replicas and reads from R of them, keeping the newest version. If W + R > N, every read set shares at least one replica with every write set, so a read sees the latest successful write. Stale copies are fixed by read repair and background anti-entropy.","**Choosing quorums**: W = N with R = 1 makes reads cheap, but any dead replica blocks writes; W = 1 makes writes cheap but risks loss; a majority for both (N = 3, W = 2, R = 2) is the usual balance. Even with W + R > N, concurrent writes, half-finished writes and sloppy quorums mean quorums alone aren't linearizable.","**Replication lag**: asynchronous followers usually trail the leader by milliseconds, and by seconds or minutes under load or after a failure. Measure it (as time or log position), alert on it, and hide it from users with module 1's session guarantees."],"dia":[{"type":"tiers","cap":"Leader-follower replication","tiers":[["Clients",["writes","reads"]],["Leader",["accepts every write","streams its change log"],"all writes"],["Followers",["follower 1: semi-synchronous","follower 2: asynchronous"],"the change log"]],"note":"The leader confirms a write once follower 1 has it, so a failover to follower 1 loses nothing. Follower 2 may lag; reads from it can be a little stale."},{"type":"cells","cap":"A quorum with N = 5, W = 3, R = 3","rows":[{"label":"write reached","vals":["v7","v7","v7","v6","v6"],"hl":[0,1,2]},{"label":"read asked","vals":["","","v7","v6","v6"],"hl":[2,3,4]},{"label":"overlap","vals":["","","✓","",""],"ok":[2]}],"note":"3 + 3 > 5, so any 3 replicas a read asks include at least one of the 3 that took the write. The read keeps the highest version (v7) and can repair replicas 3 and 4 on the way."},{"type":"seq","cap":"Multi-leader: a conflict","actors":["Tara (EU)","EU leader","US leader","Ben (US)"],"msgs":[["Tara (EU)","EU leader","add pizza to the family basket"],["Ben (US)","US leader","add cola to the same basket"],["EU leader","US leader","replicate: + pizza"],["US leader","EU leader","replicate: + cola",true]],"note":"Both leaders accepted a change to the same basket without seeing the other's. Last-writer-wins keeps one change and drops the other; a merge keeps both items."}],"cmp":[{"cap":"Three ways to replicate","head":["","Leader-follower","Multi-leader","Leaderless"],"rows":[["Who accepts writes","One leader","One leader per region or site","Any W of the N replicas"],["Conflicts","None: one order of writes","Yes: concurrent writes in different places","Yes: concurrent writes to different replicas"],["Write latency","A trip to the leader (plus followers if synchronous)","Local","The slowest of the W fastest replicas"],["One node fails","Failover, with possible loss if asynchronous","Other leaders carry on","Carry on while W and R replicas are reachable"],["Typical use","Most relational databases","Multi-region writes, offline-first apps","Dynamo-style stores such as Cassandra"]]},{"cap":"Choosing W and R for N = 3","head":["W, R","A read sees the latest write?","Replicas that can be down","Good for"],"rows":[["W = 2, R = 2","Yes (4 > 3)","1 for writes, 1 for reads","The usual balance"],["W = 3, R = 1","Yes (4 > 3)","0 for writes, 2 for reads","Rare writes, many fast reads"],["W = 1, R = 3","Yes (4 > 3)","2 for writes, 0 for reads","Many fast writes, rare reads"],["W = 1, R = 1","No (2 ≤ 3)","2 for writes, 2 for reads","Data where speed matters more than freshness"]]}],"code":[{"t":"A leaderless store: N replicas, writes reach some of them, reads ask some of them","tabs":[{"lang":"python","src":"class QuorumStore:\n    \"\"\"N replicas each hold (version, value). A write reaches some replicas; a read asks some and keeps the newest.\"\"\"\n    def __init__(self, n):\n        self.replicas = [(0, None)] * n\n        self.version = 0\n\n    def write(self, value, reached):            # reached: the replicas that acknowledged the write\n        self.version += 1\n        for r in reached:\n            self.replicas[r] = (self.version, value)\n        return self.version\n\n    def read(self, asked, repair=False):        # asked: the replicas that answered the read\n        newest = max((self.replicas[r] for r in asked), key=lambda vv: vv[0])   # the highest version wins\n        if repair:\n            for r in asked:\n                self.replicas[r] = newest       # read repair: fix the stale copies we just saw\n        return newest\n"},{"lang":"javascript","src":"class QuorumStore {\n  // N replicas each hold [version, value]. A write reaches some replicas; a read asks some and keeps the newest\n  constructor(n) { this.replicas = Array.from({ length: n }, () => [0, null]); this.version = 0; }\n  write(value, reached) {                       // reached: the replicas that acknowledged the write\n    this.version++;\n    for (const r of reached) this.replicas[r] = [this.version, value];\n    return this.version;\n  }\n  read(asked, repair = false) {                 // asked: the replicas that answered the read\n    const newest = asked.map(r => this.replicas[r]).reduce((a, b) => (b[0] > a[0] ? b : a));   // the highest version wins\n    if (repair) for (const r of asked) this.replicas[r] = newest;   // read repair: fix the stale copies we just saw\n    return newest;\n  }\n}\n"}]},{"t":"Asynchronous replication can lose a confirmed write on failover","tabs":[{"lang":"python","src":"def failover(write_times, lags, crash_at, semi_sync):\n    \"\"\"Writes confirmed before the crash, how many the promoted follower lacks, and the extra wait per write.\"\"\"\n    wait = min(lags) if semi_sync else 0      # semi-sync: confirm once the fastest follower has the write\n    confirmed = [t for t in write_times if t + wait < crash_at]\n    promoted_lag = min(lags)                  # promote the most up-to-date follower\n    lost = sum(1 for t in confirmed if t + promoted_lag >= crash_at)\n    return len(confirmed), lost, wait\n\nwrites = list(range(0, 1000, 10))             # a write every 10 ms, then the leader dies at 1,000 ms\nfor mode, semi in ((\"async\", False), (\"semi-sync\", True)):\n    confirmed, lost, wait = failover(writes, [30, 120], 1000, semi)\n    print(f\"{mode}: {confirmed} confirmed, {lost} lost on failover, +{wait} ms per write\")\n","out":"async: 100 confirmed, 3 lost on failover, +0 ms per write\nsemi-sync: 97 confirmed, 0 lost on failover, +30 ms per write\n","notes":[[3,"Semi-synchronous replication waits for the fastest follower before telling the client “done”."],[6,"A confirmed write is lost if the promoted follower hadn't received it when the leader died."],[12,"Asynchronous: the last 30 ms of confirmed writes vanish. Semi-sync: nothing confirmed is lost; the 3 unconfirmed writes failed visibly, so clients can retry."]]},{"lang":"javascript","src":"function failover(writeTimes, lags, crashAt, semiSync) {\n  // writes confirmed before the crash, how many the promoted follower lacks, and the extra wait per write\n  const wait = semiSync ? Math.min(...lags) : 0;   // semi-sync: confirm once the fastest follower has the write\n  const confirmed = writeTimes.filter(t => t + wait < crashAt);\n  const promotedLag = Math.min(...lags);           // promote the most up-to-date follower\n  const lost = confirmed.filter(t => t + promotedLag >= crashAt).length;\n  return [confirmed.length, lost, wait];\n}\n\nconst writes = Array.from({ length: 100 }, (_, i) => i * 10);   // a write every 10 ms, then the leader dies at 1,000 ms\nfor (const [mode, semi] of [[\"async\", false], [\"semi-sync\", true]]) {\n  const [confirmed, lost, wait] = failover(writes, [30, 120], 1000, semi);\n  console.log(`${mode}: ${confirmed} confirmed, ${lost} lost on failover, +${wait} ms per write`);\n}\n","out":"async: 100 confirmed, 3 lost on failover, +0 ms per write\nsemi-sync: 97 confirmed, 0 lost on failover, +30 ms per write\n","notes":[[3,"Semi-synchronous replication waits for the fastest follower before telling the client “done”."],[6,"A confirmed write is lost if the promoted follower hadn't received it when the leader died."],[13,"Asynchronous: the last 30 ms of confirmed writes vanish. Semi-sync: nothing confirmed is lost; the 3 unconfirmed writes failed visibly, so clients can retry."]]}]},{"t":"Quorums: when does every read overlap every write?","tabs":[{"lang":"python","src":"def sets_of(n, k):                            # every set of k replicas out of n, as a bit mask\n    return [m for m in range(1 << n) if bin(m).count(\"1\") == k]\n\nfor n, w, r in ((3, 2, 2), (3, 1, 1), (3, 3, 1), (5, 3, 3), (5, 2, 3)):\n    always = all(wm & rm for wm in sets_of(n, w) for rm in sets_of(n, r))\n    verdict = \"always overlaps\" if always else \"can miss the latest write\"\n    print(f\"N={n} W={w} R={r}: {verdict}; writes survive {n - w} down, reads {n - r}\")\n","out":"N=3 W=2 R=2: always overlaps; writes survive 1 down, reads 1\nN=3 W=1 R=1: can miss the latest write; writes survive 2 down, reads 2\nN=3 W=3 R=1: always overlaps; writes survive 0 down, reads 2\nN=5 W=3 R=3: always overlaps; writes survive 2 down, reads 2\nN=5 W=2 R=3: can miss the latest write; writes survive 3 down, reads 2\n","notes":[[5,"Check every possible write set against every possible read set: they overlap exactly when W + R > N."],[7,"The other side of the trade-off: how many replicas can be down while writes, and reads, still succeed."]]},{"lang":"javascript","src":"function setsOf(n, k) {                       // every set of k replicas out of n, as a bit mask\n  const out = [];\n  for (let m = 0; m < 1 << n; m++) {\n    let bits = 0;\n    for (let x = m; x; x &= x - 1) bits++;\n    if (bits === k) out.push(m);\n  }\n  return out;\n}\n\nfor (const [n, w, r] of [[3, 2, 2], [3, 1, 1], [3, 3, 1], [5, 3, 3], [5, 2, 3]]) {\n  const always = setsOf(n, w).every(wm => setsOf(n, r).every(rm => (wm & rm) !== 0));\n  const verdict = always ? \"always overlaps\" : \"can miss the latest write\";\n  console.log(`N=${n} W=${w} R=${r}: ${verdict}; writes survive ${n - w} down, reads ${n - r}`);\n}\n","out":"N=3 W=2 R=2: always overlaps; writes survive 1 down, reads 1\nN=3 W=1 R=1: can miss the latest write; writes survive 2 down, reads 2\nN=3 W=3 R=1: always overlaps; writes survive 0 down, reads 2\nN=5 W=3 R=3: always overlaps; writes survive 2 down, reads 2\nN=5 W=2 R=3: can miss the latest write; writes survive 3 down, reads 2\n","notes":[[12,"Check every possible write set against every possible read set: they overlap exactly when W + R > N."],[14,"The other side of the trade-off: how many replicas can be down while writes, and reads, still succeed."]]}]},{"t":"Multi-leader conflicts: last-writer-wins against a merge","tabs":[{"lang":"python","src":"base = {\"bread\"}\neu = (base | {\"pizza\"}, 100.0)                # (basket, timestamp from the EU leader's clock)\nus = (base | {\"cola\"}, 103.0)                 # written 3 s later in real time...\nus_slow_clock = (us[0], us[1] - 5.0)          # ...but the US server's clock runs 5 s slow\n\ndef last_writer_wins(a, b):\n    return a if a[1] >= b[1] else b           # keep the write with the later timestamp\n\ndef merge(a, b):\n    return (a[0] | b[0], max(a[1], b[1]))     # union of the additions: nothing is lost\n\nprint(\"last writer wins:\", *sorted(last_writer_wins(eu, us)[0]))\nprint(\"with a slow clock:\", *sorted(last_writer_wins(eu, us_slow_clock)[0]))\nprint(\"merge:\", *sorted(merge(eu, us_slow_clock)[0]))\n","out":"last writer wins: bread cola\nwith a slow clock: bread pizza\nmerge: bread cola pizza\n","notes":[[7,"Last-writer-wins keeps one whole version and silently drops the other's change."],[10,"A merge keeps both additions. Removals need more care (remembering what was removed), which is what CRDTs formalise."],[13,"With a 5-second slow clock the later US write loses: last-writer-wins trusts timestamps, not real time."]]},{"lang":"javascript","src":"const base = new Set([\"bread\"]);\nconst eu = [new Set([...base, \"pizza\"]), 100];   // [basket, timestamp from the EU leader's clock]\nconst us = [new Set([...base, \"cola\"]), 103];    // written 3 s later in real time...\nconst usSlowClock = [us[0], us[1] - 5];          // ...but the US server's clock runs 5 s slow\n\nconst lastWriterWins = (a, b) => (a[1] >= b[1] ? a : b);   // keep the write with the later timestamp\nconst merge = (a, b) => [new Set([...a[0], ...b[0]]), Math.max(a[1], b[1])];   // union of the additions: nothing is lost\n\nconsole.log(\"last writer wins:\", ...[...lastWriterWins(eu, us)[0]].sort());\nconsole.log(\"with a slow clock:\", ...[...lastWriterWins(eu, usSlowClock)[0]].sort());\nconsole.log(\"merge:\", ...[...merge(eu, usSlowClock)[0]].sort());\n","out":"last writer wins: bread cola\nwith a slow clock: bread pizza\nmerge: bread cola pizza\n","notes":[[6,"Last-writer-wins keeps one whole version and silently drops the other's change."],[7,"A merge keeps both additions. Removals need more care (remembering what was removed), which is what CRDTs formalise."],[10,"With a 5-second slow clock the later US write loses: last-writer-wins trusts timestamps, not real time."]]}]}],"ex":{"q":"Each of N = 3 replicas is up 99% of the time, independently. A write succeeds if at least W replicas are up, a read if at least R are. Compare the availability of writes and reads for (W, R) = (1, 3), (2, 2), (3, 1) and (1, 1), and say which settings guarantee that a read sees the latest write.","steps":["P(at least k of 3 replicas up): k = 1 is 1 − 0.01³ = 99.9999%; k = 2 is 3 × 0.99² × 0.01 + 0.99³ = 99.9702%; k = 3 is 0.99³ = 97.0299%.","W = 2, R = 2 gives 99.9702% for both, and 2 + 2 > 3, so every read overlaps the latest write.","W = 3, R = 1 makes reads very available, but one dead replica stops all writes (97.03%); W = 1, R = 3 is the mirror image.","W = 1, R = 1 is the most available for both, but 1 + 1 ≤ 3, so a read can miss the latest write. The sums take O(N²) time; the judgement is which operation must never fail for this product."],"code":{"t":"Quorum availability, from L1's availability maths","tabs":[{"lang":"python","src":"from math import comb\n\ndef at_least(n, k, p):                        # the chance that at least k of n replicas are up\n    total = 0.0\n    for i in range(k, n + 1):\n        term = comb(n, i)\n        for _ in range(i):\n            term *= p\n        for _ in range(n - i):\n            term *= 1 - p\n        total += term\n    return total\n\nfor w, r in ((1, 3), (2, 2), (3, 1), (1, 1)):\n    fresh = \"yes\" if w + r > 3 else \"no\"\n    print(f\"W={w} R={r}: writes {at_least(3, w, 0.99) * 100:.4f}%, reads {at_least(3, r, 0.99) * 100:.4f}%, reads see the latest write: {fresh}\")\n","out":"W=1 R=3: writes 99.9999%, reads 97.0299%, reads see the latest write: yes\nW=2 R=2: writes 99.9702%, reads 99.9702%, reads see the latest write: yes\nW=3 R=1: writes 97.0299%, reads 99.9999%, reads see the latest write: yes\nW=1 R=1: writes 99.9999%, reads 99.9999%, reads see the latest write: no\n"},{"lang":"javascript","src":"function comb(n, k) {\n  let c = 1;\n  for (let i = 1; i <= k; i++) c = (c * (n - k + i)) / i;\n  return c;\n}\n\nfunction atLeast(n, k, p) {                   // the chance that at least k of n replicas are up\n  let total = 0;\n  for (let i = k; i <= n; i++) {\n    let term = comb(n, i);\n    for (let j = 0; j < i; j++) term *= p;\n    for (let j = 0; j < n - i; j++) term *= 1 - p;\n    total += term;\n  }\n  return total;\n}\n\nfor (const [w, r] of [[1, 3], [2, 2], [3, 1], [1, 1]]) {\n  const fresh = w + r > 3 ? \"yes\" : \"no\";\n  console.log(`W=${w} R=${r}: writes ${(atLeast(3, w, 0.99) * 100).toFixed(4)}%, reads ${(atLeast(3, r, 0.99) * 100).toFixed(4)}%, reads see the latest write: ${fresh}`);\n}\n","out":"W=1 R=3: writes 99.9999%, reads 97.0299%, reads see the latest write: yes\nW=2 R=2: writes 99.9702%, reads 99.9702%, reads see the latest write: yes\nW=3 R=1: writes 97.0299%, reads 99.9999%, reads see the latest write: yes\nW=1 R=1: writes 99.9999%, reads 99.9999%, reads see the latest write: no\n"}]},"a":"A majority for both (W = 2, R = 2) keeps reads and writes at about 99.97% and guarantees fresh reads. W = 3 or R = 3 makes one side fragile (97.03%), and W = 1, R = 1 is the most available but can return stale data."},"fade":{"q":"Multi-leader and leaderless stores detect concurrent writes with version vectors: each replica counts the writes it accepted, and a version carries every replica's count. Finish `compare(a, b)` so it returns \"equal\", \"before\" (a happened before b), \"after\" or \"concurrent\".","steps":["A missing replica in a vector counts as 0.",{"ask":"When did a happen before b?","a":"When every count in a is ≤ the matching count in b, and they aren't all equal: b has seen everything a had, and more."},{"ask":"What does “concurrent” mean, and what do you do about it?","a":"Each vector has some count larger than the other's: the two writes were made without seeing each other. Keep both as siblings and merge them (a union for a basket) or ask the user; don't silently pick one."},{"ask":"What does
