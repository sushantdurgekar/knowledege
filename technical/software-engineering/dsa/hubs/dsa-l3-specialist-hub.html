h and goal occurs in s + s"],["LC 459 · Repeated Substring Pattern","https://leetcode.com/problems/repeated-substring-pattern/","Easy","the faded example: the period n − π[n − 1] must be < n and divide n"],["LC 686 · Repeated String Match","https://leetcode.com/problems/repeated-string-match/","Medium","repeat a until it's at least as long as b, then allow one more copy; search with KMP or Z"],["LC 187 · Repeated DNA Sequences","https://leetcode.com/problems/repeated-dna-sequences/","Medium","slide a 10-letter window and keep a set of hashes (or 2 bits per letter); report those seen twice"],["LC 1392 · Longest Happy Prefix","https://leetcode.com/problems/longest-happy-prefix/","Hard","the longest happy prefix is s[:π[n − 1]]"],["LC 214 · Shortest Palindrome","https://leetcode.com/problems/shortest-palindrome/","Hard","the worked example: the last π value of s + “#” + reverse(s)"],["LC 1044 · Longest Duplicate Substring","https://leetcode.com/problems/longest-duplicate-substring/","Hard","binary search the length; hash every window of that length and look for a repeat, confirming it or using two moduli"]],"src":[["cp-algorithms: Prefix function, Knuth–Morris–Pratt algorithm","https://cp-algorithms.com/string/prefix-function.html"],["cp-algorithms: Z-function and its calculation","https://cp-algorithms.com/string/z-function.html"],["cp-algorithms: String hashing","https://cp-algorithms.com/string/string-hashing.html"],["Wikipedia: Knuth–Morris–Pratt algorithm","https://en.wikipedia.org/wiki/Knuth%E2%80%93Morris%E2%80%93Pratt_algorithm"]]},{"id":"m11","d":"d4","t":"Number theory: gcd, primes and modular arithmetic","min":100,"hook":"Hard problems hide number theory everywhere: answers “modulo 1,000,000,007”, counting with factorials, cycles that line up every lcm steps, primes for hashing. A few small tools (Euclid's gcd, a sieve, fast power and modular inverses) cover almost all of it. JavaScript needs extra care, because its numbers are exact only up to 2⁵³.","pre":{"q":"You need 3¹⁰⁰⁰⁰⁰⁰⁰⁰⁰ mod 1,000,000,007. Multiplying by 3 a billion times is far too slow. How could you do it in about 60 multiplications?","a":"Square repeatedly: 3, 3², 3⁴, 3⁸, … each from the one before, reducing mod 1,000,000,007 every time. Write the exponent in binary and multiply together the squares where it has a 1 bit. That's O(log e) work: about 30 squarings and at most 30 more multiplications for e = 10⁹."},"kid":{"t":"The rug and the clock","x":"Tara wants to cover the 12-by-18 playroom rug with the biggest square cushions that fit exactly. Ben has a trick: cut off the biggest square he can, 12 by 12, which leaves a 12-by-6 strip. Then 6-by-6 squares fit that strip exactly, so 6 is the answer, and he never tried 1, 2, 3, 4 or 5 one by one. Later, in the car, Tara asks what time it will be 100 hours after 9 o'clock. Ben doesn't count 100 hours: the clock only has 12 numbers, and 100 hours is 8 full turns and 4 more, so it will be 1 o'clock.","map":[["Cutting off the biggest square, again and again","Euclid's algorithm: gcd(a, b) = gcd(b, a mod b)"],["The square size that finally fits exactly (6)","The gcd: the largest number that divides both"],["Never trying 1, 2, 3… one by one","O(log min(a, b)) steps instead of O(min(a, b))"],["The 12-hour clock wrapping round","Arithmetic modulo m: only the remainder matters"],["100 hours is 8 full turns and 4 more","100 mod 12 = 4, so (9 + 100) mod 12 = (9 + 4) mod 12 = 1"]],"brk":"A clock can't divide: “half of 6 o'clock” could be 3 or 9, because 2 and 12 share a factor. Code avoids this by working modulo a prime such as 1,000,000,007, where every non-zero number has a modular inverse to divide by."},"keys":["**Euclid's algorithm**: gcd(a, b) = gcd(b, a mod b), stopping at gcd(a, 0) = a. The numbers shrink at least as fast as the Fibonacci numbers, so it takes O(log min(a, b)) steps. Python has `math.gcd` (any number of arguments since 3.9) and `math.lcm`; JavaScript has neither.","**lcm** = a / gcd(a, b) × b. Divide first, so the intermediate value never exceeds the answer. Up to n there are ⌊n / a⌋ multiples of a, and inclusion–exclusion gives ⌊n / a⌋ + ⌊n / b⌋ − ⌊n / lcm(a, b)⌋ numbers divisible by a or b.","**Extended Euclid** also finds whole numbers x and y with a·x + b·y = gcd(a, b) (Bézout's identity). When gcd(a, m) = 1, that x is the inverse of a modulo m.","**Sieve of Eratosthenes**: cross out the multiples of each prime p, starting at p², because smaller multiples were already crossed out by smaller primes. O(n log log n) time and O(n) space. A smallest-prime-factor (spf) sieve stores each number's smallest prime factor, so factorising any x ≤ n takes O(log x) divisions.","**Modular arithmetic**: sums, differences and products can be reduced mod m at every step. Division can't: dividing by b means multiplying by b's inverse, which exists only when gcd(b, m) = 1. That's why answers use a prime modulus such as 1,000,000,007.","**Fast exponentiation**: square the base and halve the exponent, multiplying the result in whenever the exponent's lowest bit is 1. O(log e) multiplications. For a prime p, Fermat's little theorem gives the inverse a^(p − 2) mod p, for a not divisible by p. Python's `pow(a, e, m)` does fast power, and `pow(a, -1, m)` (3.8+) the inverse.","**nCr mod p**: precompute factorials and inverse factorials up to n in O(n) (one inverse by Fermat, then `inv_fact[i - 1] = inv_fact[i] * i`). Each C(n, r) is then fact[n] · inv_fact[r] · inv_fact[n − r] mod p, in O(1).","**JavaScript numbers** are exact only up to 2⁵³ ≈ 9 × 10¹⁵. Two residues near 10⁹ multiply to about 10¹⁸, so `(a * b) % p` silently loses precision: use BigInt (`BigInt(a) * BigInt(b) % 1000000007n`). JavaScript's `%` also keeps the sign of the left side (`-7 % 3` is −1, Python gives 2), so normalise with `((a % m) + m) % m`."],"dia":[{"type":"flow","cap":"Euclid's algorithm on gcd(252, 105)","steps":[["252 mod 105 = 42","so gcd(252, 105) = gcd(105, 42)"],["105 mod 42 = 21","so it equals gcd(42, 21)"],["42 mod 21 = 0","so it equals gcd(21, 0) = 21"]]},{"type":"cells","cap":"Fast power: 3¹³, with 13 = 1101 in binary (read from the right)","idx":false,"rows":[{"label":"bit of 13","vals":[1,0,1,1]},{"label":"square","vals":["3¹","3²","3⁴","3⁸"]},{"label":"multiply in?","vals":["yes","no","yes","yes"],"ok":[0,2,3],"dim":[1]}],"note":"3¹³ = 3⁸ × 3⁴ × 3¹ = 6561 × 81 × 3 = 1,594,323. That's 3 squarings plus 3 multiplications into the running result, instead of 12 multiplications by 3."}],"cmp":[{"cap":"Number theory in Python and JavaScript","head":["Task","Python","JavaScript"],"rows":[["gcd and lcm","`math.gcd`, `math.lcm`","Write your own (Euclid)"],["a^e mod m","`pow(a, e, m)`","Write modPow; use BigInt once m² can pass 2⁵³ (m above about 9 × 10⁷)"],["Inverse mod m","`pow(a, -1, m)` (3.8+)","Extended Euclid, or modPow(a, m − 2, m) for a prime m"],["n choose r","`math.comb(n, r)`, exact","A multiplicative loop in BigInt, or factorial tables mod p"],["Integer square root","`math.isqrt(n)`, exact","`Math.floor(Math.sqrt(n))`, then adjust by 1 for large n"],["−7 mod 3","`-7 % 3` is 2","`-7 % 3` is −1: use `((a % m) + m) % m`"],["Big integers","Built in, unlimited","BigInt (`10n ** 30n`), which can't be mixed with Number"]]},{"cap":"Which tool answers which question?","head":["Question","Tool","Cost"],"rows":[["Largest common divisor, lining up cycles","gcd and lcm","O(log min(a, b))"],["Every prime up to n","Sieve of Eratosthenes","O(n log log n)"],["Factorise many numbers up to n","Smallest-prime-factor sieve","O(n log log n) setup, O(log x) each"],["Is one number up to 10¹² prime?","Trial division up to √n","O(√n)"],["a^e mod m","Fast power","O(log e)"],["Division modulo a prime p","Multiply by the inverse (Fermat or extended Euclid)","O(log p)"],["Many C(n, r) mod p","Factorial and inverse-factorial tables","O(n) setup, O(1) each"]]}],"code":[{"t":"gcd, lcm and extended Euclid","tabs":[{"lang":"python","src":"def gcd(a, b):\n    while b:\n        a, b = b, a % b                 # gcd(a, b) = gcd(b, a mod b)\n    return a\n\ndef lcm(a, b):\n    return a // gcd(a, b) * b           # divide first: no oversized intermediate\n\ndef ext_gcd(a, b):                      # returns (g, x, y) with a*x + b*y == g\n    if b == 0:\n        return a, 1, 0\n    g, x, y = ext_gcd(b, a % b)\n    return g, y, x - (a // b) * y\n\nprint(gcd(252, 105), lcm(4, 6), lcm(21, 6))\ng, x, y = ext_gcd(240, 46)\nprint(g, x, y, 240 * x + 46 * y)\n","out":"21 12 42\n2 -9 47 2\n","notes":[[3,"a % b is smaller than b, and the numbers at least halve every two steps, so the loop runs O(log min(a, b)) times."],[7,"a // gcd(a, b) is a whole number, so the result is exact and never bigger than the lcm itself."],[13,"Back-substitution: if b·x + (a mod b)·y = g, then a·y + b·(x − (a // b)·y) = g, because a mod b = a − (a // b)·b."]]},{"lang":"javascript","src":"function gcd(a, b) {\n  while (b) [a, b] = [b, a % b];       // gcd(a, b) = gcd(b, a mod b)\n  return a;\n}\n\nconst lcm = (a, b) => (a / gcd(a, b)) * b;   // divide first: no oversized intermediate\n\nfunction extGcd(a, b) {                 // returns [g, x, y] with a*x + b*y === g\n  if (b === 0) return [a, 1, 0];\n  const [g, x, y] = extGcd(b, a % b);\n  return [g, y, x - Math.floor(a / b) * y];\n}\n\nconsole.log(gcd(252, 105), lcm(4, 6), lcm(21, 6));\nconst [g, x, y] = extGcd(240, 46);\nconsole.log(g, x, y, 240 * x + 46 * y);\n","out":"21 12 42\n2 -9 47 2\n","notes":[[2,"a % b is smaller than b, and the numbers at least halve every two steps, so the loop runs O(log min(a, b)) times."],[11,"`Math.floor(a / b)` is Python's `a // b` for these non-negative numbers."]]}]},{"t":"The sieve: count primes, then factorise fast","tabs":[{"lang":"python","src":"import math\n\ndef count_primes(n):                    # primes strictly below n (LeetCode 204)\n    if n < 3:\n        return 0\n    is_prime = bytearray([1]) * n\n    is_prime[0] = is_prime[1] = 0\n    for p in range(2, math.isqrt(n - 1) + 1):\n        if is_prime[p]:\n            is_prime[p * p::p] = bytes(len(range(p * p, n, p)))   # cross out from p squared\n    return sum(is_prime)\n\ndef spf_sieve(n):                       # the smallest prime factor of every number up to n\n    spf = list(range(n + 1))\n    for p in range(2, math.isqrt(n) + 1):\n        if spf[p] == p:                 # p is prime\n            for q in range(p * p, n + 1, p):\n                if spf[q] == q:\n                    spf[q] = p\n    return spf\n\ndef factorise(x, spf):                  # O(log x) divisions\n    out = []\n    while x > 1:\n        out.append(spf[x])\n        x //= spf[x]\n    return out\n\nspf = spf_sieve(1000)\nprint(count_primes(10), count_primes(100), count_primes(1_000_000))\nprint(*factorise(360, spf), \"|\", *factorise(997, spf))\n","out":"4 25 78498\n2 2 2 3 3 5 | 997\n","notes":[[8,"Only primes up to √(n − 1) need a pass: any composite below n has a prime factor that small."],[10,"Every smaller multiple k·p with k < p was already crossed out by a prime factor of k, so start at p²."],[26,"Each division removes one prime factor, and a number up to x has at most log₂ x of them."]]},{"lang":"javascript","src":"function countPrimes(n) {               // primes strictly below n (LeetCode 204)\n  if (n < 3) return 0;\n  const isPrime = new Uint8Array(n).fill(1);\n  isPrime[0] = isPrime[1] = 0;\n  for (let p = 2; p * p < n; p++) {\n    if (!isPrime[p]) continue;\n    for (let q = p * p; q < n; q += p) isPrime[q] = 0;   // cross out from p squared\n  }\n  let count = 0;\n  for (let i = 0; i < n; i++) count += isPrime[i];\n  return count;\n}\n\nfunction spfSieve(n) {                  // the smallest prime factor of every number up to n\n  const spf = Int32Array.from({ length: n + 1 }, (_, i) => i);\n  for (let p = 2; p * p <= n; p++) {\n    if (spf[p] !== p) continue;         // p isn't prime\n    for (let q = p * p; q <= n; q += p) if (spf[q] === q) spf[q] = p;\n  }\n  return spf;\n}\n\nfunction factorise(x, spf) {            // O(log x) divisions\n  const out = [];\n  while (x > 1) {\n    out.push(spf[x]);\n    x /= spf[x];\n  }\n  return out;\n}\n\nconst spf = spfSieve(1000);\nconsole.log(countPrimes(10), countPrimes(100), countPrimes(1000000));\nconsole.log(...factorise(360, spf), \"|\", ...factorise(997, spf));\n","out":"4 25 78498\n2 2 2 3 3 5 | 997\n","notes":[[7,"Every smaller multiple k·p with k < p was already crossed out by a prime factor of k, so start at p²."],[27,"spf[x] divides x exactly, so `x /= spf[x]` stays a whole number."]]}]},{"t":"Fast power, inverses and nCr mod p (BigInt in JavaScript)","tabs":[{"lang":"python","src":"MOD = 1_000_000_007\n\ndef mod_pow(a, e, m):                   # fast power: O(log e) multiplications\n    result, a = 1, a % m\n    while e:\n        if e & 1:\n            result = result * a % m\n        a = a * a % m                   # square the base, halve the exponent\n        e >>= 1\n    return result\n\ndef make_ncr(n, p=MOD):                 # factorial tables: O(n) setup, O(1) per query\n    fact = [1] * (n + 1)\n    for i in range(1, n + 1):\n        fact[i] = fact[i - 1] * i % p\n    inv_fact = [1] * (n + 1)\n    inv_fact[n] = mod_pow(fact[n], p - 2, p)   # Fermat: a^(p-2) is a's inverse\n    for i in range(n, 0, -1):\n        inv_fact[i - 1] = inv_fact[i] * i % p\n    def ncr(a, b):\n        if b < 0 or b > a:\n            return 0\n        return fact[a] * inv_fact[b] % p * inv_fact[a - b] % p\n    return ncr\n\nncr = make_ncr(100_000)\nprint(mod_pow(3, 10**9, MOD), mod_pow(2, MOD - 2, MOD))\nprint(ncr(5, 2), ncr(100_000, 50_000), ncr(3, 5))\n","out":"235939645 500000004\n10 149033233 0\n","notes":[[8,"After k steps the base is a^(2^k): squaring doubles the exponent it stands for."],[17,"One Fermat inverse for fact[n]; every other inverse factorial then costs a single multiplication."],[19,"1/(i − 1)! = (1/i!) × i, so the table fills from n down to 0."],[27,"Python's built-in `pow(2, -1, MOD)` gives the same 500000004."]]},{"lang":"javascript","src":"const MOD = 1000000007n;\n\nfunction modPow(a, e, m) {              // fast power in BigInt: O(log e) multiplications\n  let result = 1n;\n  a %= m;\n  while (e > 0n) {\n    if (e & 1n) result = (result * a) % m;\n    a = (a * a) % m;                    // square the base, halve the exponent\n    e >>= 1n;\n  }\n  return result;\n}\n\nfunction makeNcr(n, p = MOD) {          // factorial tables: O(n) setup, O(1) per query\n  const fact = new Array(n + 1).fill(1n);\n  for (let i = 1; i <= n; i++) fact[i] = (fact[i - 1] * BigInt(i)) % p;\n  const invFact = new Array(n + 1).fill(1n);\n  invFact[n] = modPow(fact[n], p - 2n, p);   // Fermat: a^(p-2) is a's inverse\n  for (let i = n; i > 0; i--) invFact[i - 1] = (invFact[i] * BigInt(i)) % p;\n  return (a, b) => (b < 0 || b > a ? 0n : (((fact[a] * invFact[b]) % p) * invFact[a - b]) % p);\n}\n\nconst ncr = makeNcr(100000);\nconsole.log(String(modPow(3n, 10n ** 9n, MOD)), String(modPow(2n, MOD - 2n, MOD)));\nconsole.log(String(ncr(5, 2)), String(ncr(100000, 50000)), String(ncr(3, 5)));\n","out":"235939645 500000004\n10 149033233 0\n","notes":[[1,"BigInt literals end in n. BigInt and Number can't be mixed, so every constant here is a BigInt."],[7,"Both factors are below MOD, so the product can reach about 10¹⁸: past 2⁵³, which is why this is BigInt."],[24,"`String()` prints a BigInt without the trailing n that console.log would show."]]}]}],"ex":{"q":"A digit string is “good” if every digit at an even index (0, 2, 4, …) is even and every digit at an odd index is a prime (2, 3, 5 or 7). How many good strings of length n are there, modulo 1,000,000,007, for n up to 10¹⁵? (LeetCode 1922, Count Good Numbers)","steps":["Each even index can hold 0, 2, 4, 6 or 8: 5 choices. Each odd index can hold 2, 3, 5 or 7: 4 choices.","The choices are independent, so the count is 5^(even indexes) × 4^(odd indexes), with ⌈n / 2⌉ even and ⌊n / 2⌋ odd indexes.","n can be 10¹⁵, so use fast power: O(log n) multiplications, reducing mod 1,000,000,007 each time.","In JavaScript the residues multiply to about 10¹⁸, so do the arithmetic in BigInt. (n = 10¹⁵ itself is still exact as a Number, below 2⁵³.)"],"code":{"t":"Count by multiplying the choices","tabs":[{"lang":"python","src":"MOD = 1_000_000_007\n\ndef count_good_numbers(n):\n    evens, odds = (n + 1) // 2, n // 2  # indexes 0, 2, 4, … and 1, 3, 5, …\n    return pow(5, evens, MOD) * pow(4, odds, MOD) % MOD\n\nprint(count_good_numbers(1), count_good_numbers(4), count_good_numbers(50), count_good_numbers(10**15))\n","out":"5 400 564908303 711414395"},{"lang":"javascript","src":"const MOD = 1000000007n;\n\nfunction modPow(a, e, m) {\n  let result = 1n;\n  for (a %= m; e > 0n; e >>= 1n) {\n    if (e & 1n) result = (result * a) % m;\n    a = (a * a) % m;\n  }\n  return result;\n}\n\nfunction countGoodNumbers(n) {\n  const N = BigInt(n);\n  const evens = (N + 1n) / 2n, odds = N / 2n;   // BigInt division rounds down here, like //\n  return (modPow(5n, evens, MOD) * modPow(4n, odds, MOD)) % MOD;\n}\n\nconsole.log(...[1, 4, 50, 10 ** 15].map(n => String(countGoodNumbers(n))));\n","out":"5 400 564908303 711414395"}]},"a":"5, 400, 564908303 and 711414395. For n = 4 there are 5 × 4 × 5 × 4 = 400 good strings. For n = 10¹⁵, each fast power needs only about 50 squarings, because 10¹⁵ < 2⁵⁰."},"fade":{"q":"Compute a^b mod 1337, where b is a huge number given as an array of its decimal digits, most significant first (LeetCode 372, Super Pow).","steps":["If b's digits are d₁ … dₖ, then b = 10 × (the number formed by d₁ … dₖ₋₁) + dₖ.",{"ask":"So how does a^b relate to a raised to b-without-its-last-digit?","a":"a^b = (a^rest)^10 × a^(dₖ). Keep a running result: raise it to the 10th power, then multiply by a to the next digit."},{"ask":"Why can't Fermat's little theorem shrink b here?","a":"1337 = 7 × 191 isn't prime, so a^(p − 1) ≡ 1 doesn't apply. The digit-by-digit method works for any modulus."},{"ask":"Time?","a":"O(k) for k digits: each step is two fast powers with exponents of at most 10."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def super_pow(a, b, m=1337):\n    result = 1\n    for d in b:                         # b's digits, most significant first\n        ...                             # TODO: result = result^10 * a^d, all mod m\n    return result\n"},{"lang":"javascript","src":"function superPow(a, b, m = 1337) {\n  let result = 1;\n  for (const d of b) {                  // b's digits, most significant first\n    // TODO: result = result^10 * a^d, all mod m\n  }\n  return result;\n}\n"}]},"solution":{"t":"Solution: one digit at a time","tabs":[{"lang":"python","src":"def super_pow(a, b, m=1337):\n    result = 1\n    for d in b:                         # b's digits, most significant first\n        result = pow(result, 10, m) * pow(a, d, m) % m\n    return result\n\nprint(super_pow(2, [3]), super_pow(2, [1, 0]), super_pow(1, [4, 3, 3, 8, 5, 2]), super_pow(2147483647, [2, 0, 0]))\n","out":"8 1024 1 1198"},{"lang":"javascript","src":"function modPow(a, e, m) {              // m = 1337, so every product stays tiny\n  let result = 1;\n  for (a %= m; e > 0; e >>= 1) {\n    if (e & 1) result = (result * a) % m;\n    a = (a * a) % m;\n  }\n  return result;\n}\n\nfunction superPow(a, b, m = 1337) {\n  let result = 1;\n  for (const d of b) result = (modPow(result, 10, m) * modPow(a, d, m)) % m;   // most significant first\n  return result;\n}\n\nconsole.log(superPow(2, [3]), superPow(2, [1, 0]), superPow(1, [4, 3, 3, 8, 5, 2]), superPow(2147483647, [2, 0, 0]));\n","out":"8 1024 1 1198"}]}},"traps":[["“`(a * b) % p` is safe in JavaScript.”","Only while a × b stays below 2⁵³. Two residues mod 1,000,000,007 can multiply to about 10¹⁸, which rounds silently. Use BigInt, or a modulus below about 9 × 10⁷."],["“`%` always gives a remainder from 0 to m − 1.”","In Python, yes. In JavaScript, `%` keeps the sign of the left side: `-7 % 3` is −1. After a subtraction, normalise with `((a % m) + m) % m`."],["“You can divide modulo m the normal way.”","Plain division breaks: multiply by the inverse instead, a^(p − 2) mod p for a prime p (Fermat), or extended Euclid when gcd(a, m) = 1. If a and m share a factor, no inverse exists."],["“The sieve must cross out the multiples of p starting from 2p.”","That works, but starting at p² is enough: every smaller multiple k·p with k < p was already crossed out by a prime factor of k. The cost is O(n log log n) either way."],["“lcm(a, b) = a × b / gcd(a, b) is always fine in code.”","Mathematically, yes, but a × b can overflow a fixed-size integer (or pass 2⁵³ in JavaScript) even when the lcm fits. Divide first: a / gcd(a, b) × b."],["“Fermat's little theorem gives an inverse for any modulus.”","Only for a prime modulus p, and only for a not divisible by p. For a composite like 1337 = 7 × 191, use extended Euclid, and only when gcd(a, m) = 1."]],"disc":[["Why do so many problems ask for the answer modulo 1,000,000,007?","The true answer is astronomically large, and the modulus keeps every intermediate value small. 1,000,000,007 is prime, so every non-zero number has an inverse and division works. It's also below 2³⁰, so the sum of two residues fits a 32-bit int and their product fits a 64-bit int. JavaScript's 53-bit-exact numbers fall in between, which is why products need BigInt."],["When is trial division good enough for primality?","When you test a few numbers up to about 10¹²: trying divisors up to √n is O(√n), about 10⁶ steps. For many queries up to n, build a sieve once. For single numbers near 10¹⁸, a deterministic Miller–Rabin test with fixed bases is the standard tool (beyond this module)."]],"teach":{"prompt":"Explain to a junior colleague how to compute a^e mod m quickly, and how that gives a modular inverse.","rubric":["Square the base and halve the exponent; multiply into the result when the lowest bit is 1","O(log e) multiplications, reducing mod m every time","Fermat: for a prime p, a^(p − 2) mod p is the inverse of a (a not divisible by p)","A composite modulus needs extended Euclid, and gcd(a, m) = 1","Mentions JavaScript's 2⁵³ limit and BigInt, or Python's built-in pow"],"model":"Write the exponent in binary. Keep a running result, starting at 1, and a base that you square at every step: a, a², a⁴, a⁸ and so on. Whenever the exponent's lowest bit is 1, multiply the result by the current base; then halve the exponent. Reducing mod m after every multiplication keeps the numbers small, and there are only O(log e) steps, about 30 for an exponent of 10⁹. For a prime modulus p, Fermat's little theorem says a^(p − 1) ≡ 1, so a^(p − 2) is the inverse of a, as long as p doesn't divide a. For a composite modulus, use the extended Euclidean algorithm instead, which works only when a and m share no factor. In Python, `pow(a, e, m)` and `pow(a, -1, m)` do all of this; in JavaScript, do the multiplications in BigInt, because two residues near 10⁹ multiply past 2⁵³."},"qa":[["What does Euclid's algorithm compute, and how fast?","gcd(a, b), using gcd(b, a mod b): O(log min(a, b)) steps."],["How do you compute lcm(a, b) safely?","a / gcd(a, b) × b: divide first."],["Why does the sieve start crossing out at p²?","Every smaller multiple k·p (k < p) was already crossed out by a prime factor of k."],["How do you divide by b modulo a prime p?","Multiply by b^(p − 2) mod p (Fermat), for b not divisible by p."],["How do you answer many C(n, r) mod p quickly?","Precompute factorials and inverse factorials in O(n); then C(n, r) = fact[n] · inv_fact[r] · inv_fact[n − r]."],["Why is `(a * b) % 1000000007` risky in JavaScript?","The product can pass 2⁵³ and lose precision: use BigInt."]],"quiz":[{"q":"What does this print?","snip":{"t":"gcd and lcm","tabs":[{"lang":"python","src":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\nprint(gcd(48, 18), gcd(17, 5), 48 // gcd(48, 18) * 18)\n"},{"lang":"javascript","src":"function gcd(a, b) {\n  while (b) [a, b] = [b, a % b];\n  return a;\n}\n\nconsole.log(gcd(48, 18), gcd(17, 5), (48 / gcd(48, 18)) * 18);\n"}]},"o":["6 1 144","6 1 864","3 1 144","6 5 144"],"a":0,"e":"48 mod 18 = 12, 18 mod 12 = 6, 12 mod 6 = 0, so gcd(48, 18) = 6. 17 and 5 share no factor. lcm(48, 18) = 48 / 6 × 18 = 144; 864 is just 48 × 18."},{"q":"What does this JavaScript print?","snip":{"t":"Remainders and precision","lang":"javascript","src":"console.log(-7 % 3, ((-7 % 3) + 3) % 3, 2 ** 53 + 1 === 2 ** 53);\n"},"o":["-1 2 true","2 2 false","-1 2 false","2 -1 true"],"a":0,"e":"JavaScript's % keeps the sign of the left side, so −7 % 3 is −1, and adding 3 then taking % 3 normalises it to 2. 2⁵³ + 1 can't be stored exactly, so it rounds back to 2⁵³ and the comparison is true. Python would print 2 for -7 % 3."},{"q":"What is the inverse of 3 modulo 7?","o":["5","4","3","2"],"a":0,"e":"3 × 5 = 15 = 2 × 7 + 1. Fermat agrees: 3^(7 − 2) = 243, and 243 mod 7 = 5."},{"q":"Which statements about working modulo 1,000,000,007 are true? (choose 2)","t":"ms","o":["Sums and products can be reduced at every step","Every non-zero residue has an inverse, because 1,000,000,007 is prime","Division can be done by dividing first and reducing afterwards","JavaScript Numbers multiply two residues exactly","Differences never need fixing up in any language"],"a":[0,1],"e":"Division needs a modular inverse; exact division of the residues doesn't work. Two residues can multiply to about 10¹⁸, past 2⁵³. In JavaScript, a difference can come out negative and must be normalised."},{"q":"Judge each statement.","t":"yn","s":[["`math.gcd(0, 5)` is 5.",true],["The sieve of Eratosthenes runs in O(n log log n) time.",true],["Fermat's little theorem gives inverses modulo 1337.",false],["lcm(4, 6) is 24.",false]],"e":"gcd(0, b) = b. The sieve's work is n × (1/2 + 1/3 + 1/5 + …) over the primes, which is O(n log log n). 1337 = 7 × 191 isn't prime. lcm(4, 6) = 12; 24 is just 4 × 6."},{"q":"Put the steps for answering many C(n, r) mod p queries in order.","t":"ord","items":["Build fact[i] = fact[i − 1] × i mod p for i up to n","Compute inv_fact[n] = fact[n]^(p − 2) mod p","Fill inv_fact[i − 1] = inv_fact[i] × i mod p, from n down to 1","Answer each query as fact[n] × inv_fact[r] × inv_fact[n − r] mod p"],"e":"The single Fermat inverse needs fact[n]; the downward fill starts from inv_fact[n]; and every query reads both tables."},{"q":"Complete the Python sieve so it returns every prime below n.","t":"drop","lang":"python","code":"def primes_below(n):\n    is_prime = [True] * n\n    is_prime[0] = is_prime[1] = False\n    p = 2\n    while p * p < n:\n        if is_prime[p]:\n            for q in range({{0}}, n, {{1}}):\n                is_prime[q] = False\n        p += 1\n    return [i for i in range(n) if is_prime[i]]\n","blanks":[{"o":["p * p","p","2","p + 1"],"a":0},{"o":["p","1","2","p * p"],"a":0}],"e":"Start at p² (smaller multiples are already crossed out) and step by p. Starting at p would cross out the prime itself."},{"q":"Match each question to its tool.","t":"match","pairs":[["The gcd of two numbers","Euclid's algorithm, O(log n)"],["Every prime up to 10⁷","Sieve of Eratosthenes, O(n log log n)"],["3^(10¹⁸) mod p","Fast power, O(log e)"],["Division modulo a prime","Multiply by the inverse a^(p − 2)"]],"extra":["Trial division by every number below n"],"e":"Each tool turns a hopeless brute force (counting, trying, multiplying a billion times) into a few logarithmic or near-linear steps."}],"probs":[["LC 1979 · Find Greatest Common Divisor of Array","https://leetcode.com/problems/find-greatest-common-divisor-of-array/","Easy","the gcd of the smallest and largest values"],["LC 1071 · Greatest Common Divisor of Strings","https://leetcode.com/problems/greatest-common-divisor-of-strings/","Easy","if s + t == t + s, the answer is the prefix of length gcd(len(s), len(t)); otherwise there is none"],["LC 204 · Count Primes","https://leetcode.com/problems/count-primes/","Medium","the sieve; count the primes strictly below n"],["LC 172 · Factorial Trailing Zeroes","https://leetcode.com/problems/factorial-trailing-zeroes/","Medium","count the factors of 5: n // 5 + n // 25 + n // 125 + …"],["LC 372 · Super Pow","https://leetcode.com/problems/super-pow/","Medium","the faded example: digit by digit, result^10 × a^digit mod 1337"],["LC 1922 · Count Good Numbers","https://leetcode.com/problems/count-good-numbers/","Medium","the worked example: 5^⌈n/2⌉ × 4^⌊n/2⌋ with fast power"],["LC 2513 · Minimize the Maximum of Two Arrays","https://leetcode.com/problems/minimize-the-maximum-of-two-arrays/","Medium","binary search on the answer; count with ⌊x / d⌋ and inclusion–exclusion through lcm"],["LC 149 · Max Points on a Line","https://leetcode.com/problems/max-points-on-a-line/","Hard","for each point, reduce every slope (dy, dx) by their gcd and fix the sign, then count with a hash map"]],"src":[["cp-algorithms: Euclidean algorithm for computing the GCD","https://cp-algorithms.com/algebra/euclid-algorithm.html"],["cp-algorithms: Sieve of Eratosthenes","https://cp-algorithms.com/algebra/sieve-of-eratosthenes.html"],["cp-algorithms: Binary exponentiation","https://cp-algorithms.com/algebra/binary-exp.html"],["cp-algorithms: Modular multiplicative inverse","https://cp-algorithms.com/algebra/module-inverse.html"],["MDN: BigInt","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt"]]},{"id":"m12","d":"d4","t":"Counting and games: digit DP and game theory","min":110,"hook":"Two kinds of hard problem look as if they need brute force over astronomically many cases: two-player puzzles (“who wins with perfect play?”) and counting questions (“how many numbers up to 10¹⁸ have this property?”). Both shrink to small dynamic programs once you find the right state: win/lose positions and score differences for games, and (position, tight, …) for digit DP.","pre":{"q":"Two players take turns removing 1, 2 or 3 coins from a pile of 10, and whoever takes the last coin wins. Should you go first, and what's your first move?","a":"Yes: take 2, leaving 8. A multiple of 4 is a losing pile for the player who must move. Whatever they take (1, 2 or 3), you take enough to make 4 in that round, so you keep handing back multiples of 4 until you take the last coin."},"kid":{"t":"The last-sweet game","x":"On the long drive, Tara and Ben play with a pile of sweets: each turn you eat 1, 2 or 3, and whoever eats the last one wins. Ben keeps losing, so Tara shows him her chart. With 0 sweets left on your turn, you've already lost. A pile is a winner for you if one of your moves leaves your rival a loser; it's a loser if every move hands them a winner. She fills the chart from 1 sweet upwards: win, win, win, lose, win, win, win, lose… “See? Never hand me a pile I can win from,” she grins.","map":[["0 sweets on your turn: you've already lost","The base case: under normal play, a position with no moves is losing"],["A winner if one move leaves your rival a loser","win[n] is true if some move m gives a losing win[n − m]"],["A loser if every move hands them a winner","A losing position: every move leads to a winning one"],["Filling the chart from 1 sweet upwards","Bottom-up DP over positions, smallest first (or memoised recursion)"],["Win, win, win, lose, over and over","The losing piles are exactly the multiples of 4"]],"brk":"Tara's chart works because the pile only shrinks and both players have the same moves. If positions can repeat (moves that undo each other), there may be no “smaller first” order and games can be drawn, so you need retrograde analysis on a graph of positions instead. If the two players have different moves, every position needs two answers, one for each player to move."},"keys":["**Win/lose positions**: under normal play (whoever can't move loses), a position is losing if every move leads to a winning position, and winning if at least one move leads to a losing one. Compute them bottom-up when positions only shrink, or with memoised recursion: O(states × moves).","**Score-difference minimax**: when players collect points (LeetCode 486, 877), let dp[i][j] be the best (my total − rival's total) the player to move can force on piles i..j. Taking pile i is worth nums[i] − dp[i + 1][j]; taking pile j is worth nums[j] − dp[i][j − 1]. It's an interval DP: O(n²) time, and O(n) space with one reused row.","**Nim**: with several piles, where a move removes any number of stones from one pile, the player to move wins exactly when the XOR of the pile sizes isn't 0 (Bouton's theorem). A winning move makes the XOR 0 again.","**Sprague–Grundy**: every position of an impartial game (both players have the same moves) has a Grundy number: the mex, the smallest non-negative integer that none of its moves reaches. 0 means losing. A sum of independent games is won exactly when the XOR of the parts' Grundy numbers isn't 0, so games combine like Nim piles.","**Memo over a mask**: when the state is “which numbers are already used” (LeetCode 464, n ≤ 20), memoise the result for each mask: O(2ⁿ · n) time and O(2ⁿ) space. Check the cheap cases first, such as the numbers' total being below the target.","**Digit DP**: to count the integers from 0 to N with a digit property, walk N's digits from the most significant with a state such as (position, tight, extra). tight means the prefix so far equals N's prefix, so the next digit can't exceed N's digit there; once a smaller digit is used, the rest are free. Memoising the states costs about digits × states × 10 steps instead of a loop to N.","**Counting a range [L, R]**: the answer is count(R) − count(L − 1), so you only ever write count(≤ N). For a property of the binary digits (LeetCode 600), the same idea runs over bits.","**Counting with combinatorics**: some counting problems need multinomial coefficients mod p. LeetCode 1916 counts the orders for building a tree's rooms as n! divided by the product of all subtree sizes, using the inverse factorials from module 11."],"dia":[{"type":"cells","cap":"Take 1, 2 or 3 coins: winning (W) and losing (L) piles from 0 to 12","rows":[{"label":"pile","vals":["L","W","W","W","L","W","W","W","L","W","W","W","L"],"hl":[0,4,8,12]}],"note":"A pile is L when every move (−1, −2 or −3) lands on a W. The multiples of 4 are the losing piles: from 10, take 2 to hand your rival 8."},{"type":"cells","cap":"Grundy numbers g(n) for the game “take 1, 3 or 4 coins”","rows":[{"label":"g(n)","vals":[0,1,0,1,2,3,2,0,1,0,1,2,3,2,0],"ok":[0,2,7,9,14]}],"note":"g(n) is the mex of g(n − 1), g(n − 3) and g(n − 4). The zeros (n = 0, 2, 7, 9, 14, …) are the losing piles, and the pattern repeats every 7."}],"cmp":[{"cap":"Game DP shapes","head":["Game","State","Rule","Cost"],"rows":[["Take 1–3 coins from one pile","The pile size n","win[n] = some move reaches a losing pile","O(n × moves)"],["Take from either end; most points wins (LeetCode 486, 877)","The interval i..j","dp[i][j] = max(nums[i] − dp[i + 1][j], nums[j] − dp[i][j − 1])","O(n²)"],["Nim with many piles","The pile sizes","Win ⇔ the XOR of the sizes ≠ 0","O(piles)"],["A sum of different games","Each game's position","Win ⇔ the XOR of the Grundy numbers ≠ 0","A Grundy table, then O(games)"],["Pick unused numbers 1..m (LeetCode 464)","The used-numbers mask","Win if some pick reaches the target or leaves a losing mask","O(2ᵐ × m)"]]},{"cap":"Counting the numbers up to N: a loop or digit DP?","head":["","Loop from 0 to N","Digit DP"],"rows":[["Work for N = 10⁹","10⁹ checks, each O(digits)","About 10 digits × 2 tight values × 10 choices × the extra state"],["Work for N = 10¹⁸","Out of reach","Still only thousands of steps"],["What the state holds","The whole number","(position, tight, extra), e.g. the previous digit or a count so far"],["A range [L, R]","Loop over the range","count(R) − count(L − 1)"]]}],"code":[{"t":"Predict the Winner: the score-difference DP","tabs":[{"lang":"python","src":"def score_difference(nums):            # the best (my total - rival's total) for player 1\n    n = len(nums)\n    dp = nums[:]                        # dp[j] = best difference on nums[i..j]; one pile: take it\n    for i in range(n - 2, -1, -1):\n        for j in range(i + 1, n):\n            dp[j] = max(nums[i] - dp[j], nums[j] - dp[j - 1])\n    return dp[n - 1]\n\ndef predict_the_winner(nums):\n    return score_difference(nums) >= 0  # a tie counts as a win for player 1 (LeetCode 486)\n\nfor nums in ([1, 5, 2], [1, 5, 233, 7], [5, 3, 4, 5]):\n    print(score_difference(nums), \"yes\" if predict_the_winner(nums) else \"no\")\n","out":"-2 no\n222 yes\n1 yes\n","notes":[[3,"With one pile left, the player to move just takes it, so the difference for i..i is nums[i]."],[6,"Take the left pile (the rival then plays i + 1..j, still stored in dp[j]) or the right one (the rival plays i..j − 1, already updated in dp[j − 1]). Their best counts against you."]]},{"lang":"javascript","src":"function scoreDifference(nums) {        // the best (my total - rival's total) for player 1\n  const n = nums.length, dp = [...nums];   // dp[j] = best difference on nums[i..j]; one pile: take it\n  for (let i = n - 2; i >= 0; i--)\n    for (let j = i + 1; j < n; j++) dp[j] = Math.max(nums[i] - dp[j], nums[j] - dp[j - 1]);\n  return dp[n - 1];\n}\n\nconst predictTheWinner = nums => scoreDifference(nums) >= 0;   // a tie counts as a win for player 1\n\nfor (const nums of [[1, 5, 2], [1, 5, 233, 7], [5, 3, 4, 5]])\n  console.log(scoreDifference(nums), predictTheWinner(nums) ? \"yes\" : \"no\");\n","out":"-2 no\n222 yes\n1 yes\n","notes":[[4,"Take the left pile (the rival then plays i + 1..j, still stored in dp[j]) or the right one (the rival plays i..j − 1, already updated in dp[j − 1]). Their best counts against you."]]}]},{"t":"Grundy numbers with mex, and XOR for a sum of games","tabs":[{"lang":"python","src":"def grundy_table(n, moves):\n    g = [0] * (n + 1)\n    for x in range(1, n + 1):\n        seen = {g[x - m] for m in moves if m <= x}\n        mex = 0\n        while mex in seen:                 # the smallest value no move reaches\n            mex += 1\n        g[x] = mex\n    return g\n\ng = grundy_table(14, (1, 3, 4))\nprint(*g)\nprint(*(x for x in range(15) if g[x] == 0))      # the losing piles\n\ntotal = 0\nfor pile in (7, 9, 12):                         # three separate piles of the same game\n    total ^= g[pile]\nprint(total, \"first player wins\" if total else \"first player loses\")\nnim = 3 ^ 4 ^ 5                                 # plain Nim: a pile's Grundy number is its size\nprint(nim, \"first player wins\" if nim else \"first player loses\")\n","out":"0 1 0 1 2 3 2 0 1 0 1 2 3 2 0\n0 2 7 9 14\n3 first player wins\n2 first player wins\n","notes":[[4,"The Grundy numbers of the positions one move away; a pile too small for move m simply doesn't have that move."],[17,"g(7) = 0 and g(9) = 0, but g(12) = 3, so the XOR is 3: the first player should move in the pile of 12 to a pile whose g is 0."],[19,"3 XOR 4 = 7 and 7 XOR 5 = 2, which isn't 0: by Bouton's theorem the first player wins."]]},{"lang":"javascript","src":"function grundyTable(n, moves) {\n  const g = new Array(n + 1).fill(0);\n  for (let x = 1; x <= n; x++) {\n    const seen = new Set(moves.filter(m => m <= x).map(m => g[x - m]));\n    let mex = 0;\n    while (seen.has(mex)) mex++;                // the smallest value no move reaches\n    g[x] = mex;\n  }\n  return g;\n}\n\nconst g = grundyTable(14, [1, 3, 4]);\nconsole.log(...g);\nconsole.log(...g.flatMap((v, x) => (v === 0 ? [x] : [])));   // the losing piles\n\nlet total = 0;\nfor (const pile of [7, 9, 12]) total ^= g[pile];   // three separate piles of the same game\nconsole.log(total, total ? \"first player wins\" : \"first player loses\");\nconst nim = 3 ^ 4 ^ 5;                          // plain Nim: a pile's Grundy number is its size\nconsole.log(nim, nim ? \"first player wins\" : \"first player loses\");\n","out":"0 1 0 1 2 3 2 0 1 0 1 2 3 2 0\n0 2 7 9 14\n3 first player wins\n2 first player wins\n","notes":[[4,"The Grundy numbers of the positions one move away; a pile too small for move m simply doesn't have that move."],[17,"g(7) = 0 and g(9) = 0, but g(12) = 3, so the XOR is 3: the first player should move in the pile of 12 to a pile whose g is 0."]]}]},{"t":"Digit DP: no two consecutive 1s in binary (LeetCode 600)","tabs":[{"lang":"python","src":"from functools import cache\n\ndef count_no_adjacent_ones(n):           # how many x in [0, n] have no \"11\" in binary\n    bits = bin(n)[2:]                    # most significant bit first\n\n    @cache\n    def go(pos, prev, tight):            # ways to fill bits[pos:] after the bit prev\n        if pos == len(bits):\n            return 1\n        limit = int(bits[pos]) if tight else 1\n        total = 0\n        for b in range(limit + 1):\n            if b == 1 and prev == 1:     # this would make \"11\"\n                continue\n            total += go(pos + 1, b, tight and b == limit)\n        return total\n\n    return go(0, 0, True)\n\nprint(*(count_no_adjacent_ones(n) for n in (1, 2, 5, 10, 10**9)))\n","out":"2 3 5 8 2178309","notes":[[7,"The state space is tiny: about 30 positions × 2 previous bits × 2 tight values, even for n = 10⁹."],[10,"While tight, the next bit can't exceed n's bit at this position; once free, both 0 and 1 are allowed."],[15,"tight survives only if this bit equals n's bit; using a 0 where n has a 1 frees every later position."]]},{"lang":"javascript","src":"function countNoAdjacentOnes(n) {        // how many x in [0, n] have no \"11\" in binary\n  const bits = n.toString(2);            // most significant bit first\n  const memo = new Map();\n  function go(pos, prev, tight) {        // ways to fill bits[pos:] after the bit prev\n    if (pos === bits.length) return 1;\n    const key = `${pos},${prev},${tight}`;\n    if (memo.has(key)) return memo.get(key);\n    const limit = tight ? Number(bits[pos]) : 1;\n    let total = 0;\n    for (let b = 0; b <= limit; b++) {\n      if (b === 1 && prev === 1) continue;   // this would make \"11\"\n      total += go(pos + 1, b, tight && b === limit);\n    }\n    memo.set(key, total);\n    return total;\n  }\n  return go(0, 0, true);\n}\n\nconsole.log(...[1, 2, 5, 10, 10 ** 9].map(n => countNoAdjacentOnes(n)));\n","out":"2 3 5 8 2178309","notes":[[6,"A string key turns the three-part state into one Map key; JavaScript has no tuple keys."],[12,"tight survives only if this bit equals n's bit; using a 0 where n has a 1 frees every later position."]]}]}],"ex":{"q":"Count the total number of digit 1s in all the integers from 0 to n, for n up to 10⁹ (LeetCode 233, Number of Digit One).","steps":["Looping from 0 to n and counting the 1s in each number takes about 10⁹ × 10 steps: far too slow.","Build the numbers digit by digit from the left. While the prefix equals n's prefix (tight), the next digit can only go up to n's digit; after a smaller digit, any of 0–9 is allowed.","The state is (position, how many 1s so far, tight), and go returns the total number of 1s over every way to finish the number. Leading zeros are harmless here, because zeros never add a 1.","There are at most 10 positions × 10 counts × 2 tight values = 200 states, each trying up to 10 digits: about 2,000 steps."],"code":{"t":"Digit DP on (position, ones so far, tight)","tabs":[{"lang":"python","src":"from functools import cache\n\ndef count_digit_one(n):                  # the total number of 1 digits in 0, 1, …, n\n    digits = str(n)\n\n    @cache\n    def go(pos, ones, tight):            # the total 1s over every way to finish the number\n        if pos == len(digits):\n            return ones\n        limit = int(digits[pos]) if tight else 9\n        return sum(go(pos + 1, ones + (d == 1), tight and d == limit) for d in range(limit + 1))\n\n    return go(0, 0, True)\n\nprint(count_digit_one(13), count_digit_one(0), count_digit_one(99), count_digit_one(10**9))\n","out":"6 0 20 900000001"},{"lang":"javascript","src":"function countDigitOne(n) {              // the total number of 1 digits in 0, 1, …, n\n  const digits = String(n), memo = new Map();\n  function go(pos, ones, tight) {        // the total 1s over every way to finish the number\n    if (pos === digits.length) return ones;\n    const key = `${pos},${ones},${tight}`;\n    if (memo.has(key)) return memo.get(key);\n    const limit = tight ? Number(digits[pos]) : 9;\n    let total = 0;\n    for (let d = 0; d <= limit; d++) total += go(pos + 1, ones + (d === 1 ? 1 : 0), tight && d === limit);\n    memo.set(key, total);\n    return total;\n  }\n  return go(0, 0, true);\n}\n\nconsole.log(countDigitOne(13), countDigitOne(0), countDigitOne(99), countDigitOne(10 ** 9));\n","out":"6 0 20 900000001"}]},"a":"6, 0, 20 and 900000001. For 13 the 1s are in 1, 10, 11 (two of them), 12 and 13: six in total. For 10⁹ the DP visits only a few hundred states."},"fade":{"q":"Two players take turns picking a number from 1 to m that hasn't been picked yet, adding it to a running total. Whoever first makes the total reach at least the target wins. Can the first player force a win? (LeetCode 464, Can I Win; m ≤ 20)","steps":["The state is the set of numbers already used, stored as a mask: the remaining target follows from it, so it adds no new information.",{"ask":"When is the answer settled before any search?","a":"If the target is 0 or less, the first player has already won. If 1 + 2 + … + m is below the target, nobody can ever reach it, so the first player can't win."},{"ask":"When is picking the number i a winning move?","a":"If i alone reaches the remaining target, or if the rival, facing the mask with i added and the target reduced by i, can't win."},{"ask":"Time and space?","a":"O(2ᵐ · m) time and O(2ᵐ) memory: each mask is solved once and tries up to m picks."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"from functools import cache\n\ndef can_i_win(m, target):\n    if target <= 0:\n        return True\n    if m * (m + 1) // 2 < target:\n        return False\n\n    @cache\n    def wins(mask, remaining):              # can the player to move force a win?\n        for i in range(1, m + 1):\n            bit = 1 << i\n            if mask & bit:\n                continue\n            ...                             # TODO: win now, or leave the rival in a losing position\n        return False\n\n    return wins(0, target)\n"},{"lang":"javascript","src":"function canIWin(m, target) {\n  if (target <= 0) return true;\n  if ((m * (m + 1)) / 2 < target) return false;\n  const memo = new Map();\n  function wins(mask, remaining) {          // can the player to move force a win?\n    if (memo.has(mask)) return memo.get(mask);\n    let result = false;\n    for (let i = 1; i <= m && !result; i++) {\n      const bit = 1 << i;\n      if (mask & bit) continue;\n      // TODO: win now, or leave the rival in a losing position\n    }\n    memo.set(mask, result);\n    return result;\n  }\n  return wins(0, target);\n}\n"}]},"solution":{"t":"Solution: memoise over the used-numbers mask","tabs":[{"lang":"python","src":"from functools import cache\n\ndef can_i_win(m, target):\n    if target <= 0:\n        return True\n    if m * (m + 1) // 2 < target:\n        return False\n\n    @cache\n    def wins(mask, remaining):              # can the player to move force a win?\n        for i in range(1, m + 1):\n            bit = 1 << i\n            if mask & bit:\n                continue\n            if i >= remaining or not wins(mask | bit, remaining - i):\n                return True\n        return False\n\n    return wins(0, target)\n\nprint(*(\"yes\" if can_i_win(m, t) else \"no\" for m, t in ((10, 11), (10, 12), (10, 0), (5, 50), (10, 40))))\n","out":"no yes yes no no"},{"lang":"javascript","src":"function canIWin(m, target) {\n  if (target <= 0) return true;\n  if ((m * (m + 1)) / 2 < target) return false;\n  const memo = new Map();\n  function wins(mask, remaining) {          // can the player to move force a win?\n    if (memo.has(mask)) return memo.get(mask);\n    let result = false;\n    for (let i = 1; i <= m && !result; i++) {\n      const bit = 1 << i;\n      if (mask & bit) continue;\n      if (i >= remaining || !wins(mask | bit, remaining - i)) result = true;\n    }\n    memo.set(mask, result);\n    return result;\n  }\n  return wins(0, target);\n}\n\nconsole.log(...[[10, 11], [10, 12], [10, 0], [5, 50], [10, 40]].map(([m, t]) => (canIWin(m, t) ? \"yes\" : \"no\")));\n","out":"no yes yes no no"}]}},"traps":[["“A good first move is any move that looks strong.”","A move is good only if it leaves the rival in a *losing* position, one from which every reply hands you back a win. Build the answer up from the base case instead of judging moves by feel."],["“Greedy play (always take the bigger pile) is optimal.”","Not in general: in [1, 5, 2] the first player loses whichever end they take, and in [1, 5, 233, 7] the winning first move is the small 1, because it keeps 233 for later. Use the score-difference DP."],["“In Nim, you win by emptying the biggest pile.”","You win by moving to a position whose XOR is 0. If the XOR is already 0 on your turn, every move loses against perfect play."],["“Add the Grundy numbers to value a sum of games.”","Combine them with XOR, not +. Two games with Grundy number 1 make a losing sum (1 XOR 1 = 0), while 1 + 1 = 2 would wrongly suggest a win."],["“Digit DP can drop the tight flag after the first digit.”","tight must be carried the whole way: it stays true only while every digit so far equals n's digit. Dropping it counts numbers bigger than n."],["“Memoising on (position, tight) is always enough.”","The state must hold everything the rest depends on: the previous digit (no consecutive 1s), a count so far, a remainder. Leaving something out makes the cached answers wrong."]],"disc":[["Why do game problems use a score difference instead of tracking both totals?","The game is zero-sum: whatever one player gains counts against the other. A single number, my total minus yours, captures the outcome, and the recurrence just flips its sign each turn: my best is the pile I take minus the rival's best on what's left. Tracking both totals would double the state for no gain."],["When should you look for a pattern instead of running the DP?","When positions are huge (a pile of 10¹⁸ coins) the table won't fit, but small games often repeat: take-1-to-3 loses exactly on multiples of 4, and the {1, 3, 4} game repeats every 7. Compute the table for small sizes, spot the period, and prove it, or at least test it against the DP for a few thousand sizes."]],"teach":{"prompt":"Explain to a junior colleague how to decide who wins a take-away game with perfect play, and how several separate games combine.","rubric":["A position with no moves is losing (normal play)","Winning if some move reaches a losing position; losing if every move reaches a winning one","Fill bottom-up or memoise: O(states × moves)","A Grundy number is the mex of the options' Grundy numbers; 0 means losing","A sum of games: XOR the Grundy numbers (in Nim, the pile sizes)"],"model":"Work back from the end of the game. Under normal play, a position with no moves is lost for the player who must move. Any other position is winning if at least one move leads to a losing position, and losing if every move leads to a winning one. Because piles only shrink, you can fill this in from small piles upwards in O(positions × moves) time. For several independent games played side by side, win or lose isn't enough: give each position a Grundy number, the smallest non-negative integer that none of its moves reaches (the mex). Zero means losing, and the combined game is won exactly when the XOR of the separate Grundy numbers isn't zero. In plain Nim, a pile's Grundy number is just its size, which is Bouton's theorem."},"qa":[["When is a game position losing (normal play)?","When every move leads to a winning position; a position with no moves is losing."],["In Predict the Winner, what does dp[i][j] store?","The best (my total − rival's total) the player to move can force on piles i..j."],["Who wins Nim?","The player to move wins exactly when the XOR of the pile sizes isn't 0."],["What is a Grundy number?","The mex of the Grundy numbers of the positions one move away; 0 means losing."],["What does tight mean in digit DP?","The prefix so far equals n's prefix, so the next digit can't exceed n's digit there."],["How do you count a range [L, R] with digit DP?","count(R) − count(L − 1)."]],"quiz":[{"q":"What does this print?","snip":{"t":"Losing piles for take 1, 2 or 3","tabs":[{"lang":"python","src":"win = [False] * 9\nfor n in range(1, 9):\n    win[n] = any(not win[n - k] for k in (1, 2, 3) if k <= n)\nprint(*(n for n in range(9) if not win[n]))\n"},{"lang":"javascript","src":"const win = new Array(9).fill(false);\nfor (let n = 1; n < 9; n++) win[n] = [1, 2, 3].some(k => k <= n && !win[n - k]);\nconsole.log(...[...win.keys()].filter(n => !win[n]));\n"}]},"o":["0 4 8","4 8","1 5","0 3 6"],"a":0,"e":"0 is losing (no moves). 1, 2 and 3 can reach 0, so they win; every move from 4 lands on 1, 2 or 3, so 4 loses; and so on: the multiples of 4."},{"q":"What does this print?","snip":{"t":"A Nim position","tabs":[{"lang":"python","src":"x = 0\nfor p in [1, 4, 5]:\n    x ^= p\nprint(x, \"win\" if x else \"lose\")\n"},{"lang":"javascript","src":"let x = 0;\nfor (const p of [1, 4, 5]) x ^= p;\nconsole.log(x, x ? \"win\" : \"lose\");\n"}]},"o":["0 lose","10 win","1 win","5 win"],"a":0,"e":"1 XOR 4 = 5 and 5 XOR 5 = 0. A zero XOR is a losing position for the player to move."},{"q":"In Predict the Winner, what is taking pile i from piles i..j worth to the player who moves?","o":["nums[i] − dp[i + 1][j]","nums[i] + dp[i + 1][j]","dp[i + 1][j] − nums[i]","max(nums[i], dp[i + 1][j])"],"a":0,"e":"You gain nums[i], then your rival moves on i + 1..j and gets their best difference, dp[i + 1][j], which counts against you."},{"q":"Which statements about Grundy numbers are true? (choose 2)","t":"ms","o":["A position's Grundy number is the mex of the Grundy numbers of its options","A sum of independent games is lost by the player to move exactly when the XOR of the Grundy numbers is 0","The Grundy numbers of a sum of games add up","Only positions with Grundy number 1 are winning","Grundy numbers work for games where the two players have different moves"],"a":[0,1],"e":"Grundy numbers combine by XOR, every non-zero value is a win, and the theory covers impartial games, where both players have the same moves."},{"q":"Judge each statement.","t":"yn","s":[["In the take-1-to-3 game, a pile of 12 is lost for the player to move.",true],["In Nim with two piles of 2, the first player wins.",false],["Digit DP counts the numbers in [L, R] as count(R) − count(L − 1).",true],["mex({0, 1, 3}) is 2.",true]],"e":"12 is a multiple of 4. 2 XOR 2 = 0, so the second player wins by copying every move in the other pile. Counting up to R minus counting up to L − 1 leaves exactly [L, R]. 2 is the smallest non-negative integer missing from {0, 1, 3}."},{"q":"Put the steps of filling the Predict the Winner table in order.","t":"ord","items":["Set dp[i][i] = nums[i] for every i","Fill the intervals of length 2 from the length-1 values","Fill each longer interval from the two shorter intervals inside it","Read dp[0][n − 1] and check whether it's at least 0"],"e":"Every interval needs the two intervals one shorter inside it, so lengths go 1, 2, 3, …, and the whole row's answer is ready last."},{"q":"Complete the JavaScript Grundy table.","t":"drop","lang":"javascript","code":"function grundy(n, moves) {\n  const g = new Array(n + 1).fill(0);\n  for (let x = 1; x <= n; x++) {\n    const seen = new Set();\n    for (const m of moves) if (m <= x) seen.add(g[{{0}}]);\n    let mex = 0;\n    while (seen.has(mex)) mex{{1}};\n    g[x] = mex;\n  }\n  return g;\n}\n","blanks":[{"o":["x - m","m","x","x + m"],"a":0},{"o":["++","--"," += 2"," += 3"],"a":0}],"e":"A move of m from x lands on x − m, and the mex is found by counting up from 0 one step at a time until a value is missing."},{"q":"Match each problem to its technique.","t":"match","pairs":[["Take 1–3 coins from one pile","The losing piles are the multiples of 4"],["Take from either end of a row of piles","Interval DP on the score difference"],["Several Nim piles","The XOR of the pile sizes"],["Count the numbers up to n that follow a digit rule","Digit DP with a tight flag"]],"extra":["Dijkstra's algorithm"],"e":"Each game or count collapses to a small state: a pile size, an interval, an XOR, or (position, tight, extra)."}],"probs":[["LC 292 · Nim Game","https://leetcode.com/problems/nim-game/","Easy","you lose exactly when n is a multiple of 4"],["LC 1025 · Divisor Game","https://leetcode.com/problems/divisor-game/","Easy","Alice wins exactly when n is even; prove it, then check with a small DP"],["LC 877 · Stone Game","https://leetcode.com/problems/stone-game/","Medium","the score-difference DP works, and a parity argument shows the first player always wins"],["LC 486 · Predict the Winner","https://leetcode.com/problems/predict-the-winner/","Medium","code block 1: dp[i][j] = max(nums[i] − dp[i + 1][j], nums[j] − dp[i][j − 1])"],["LC 1140 · Stone Game II","https://leetcode.com/problems/stone-game-ii/","Medium","memoise on (start index, M); suffix sums make each move's gain O(1)"],["LC 464 · Can I Win","https://leetcode.com/problems/can-i-win/","Medium","the faded example: memoise over the used-numbers mask"],["LC 902 · Numbers At Most N Given Digit Set","https://leetcode.com/problems/numbers-at-most-n-given-digit-set/","Hard","count the shorter lengths with powers, then walk N's digits with a tight flag"],["LC 233 · Number of Digit One","https://leetcode.com/problems/number-of-digit-one/","Hard","the worked example: digit DP on (position, ones so far, tight)"],["LC 600 · Non-negative Integers without Consecutive Ones","https://leetcode.com/problems/non-negative-integers-without-consecutive-ones/","Hard","digit DP over the bits, with the previous bit in the state"],["LC 1916 · Count Ways to Build Rooms in an Ant Colony","https://leetcode.com/problems/count-ways-to-build-rooms-in-an-ant-colony/","Hard","n! divided by the product of all subtree sizes, mod p, with module 11's inverse factorials"]],"src":[["cp-algorithms: Sprague–Grundy theorem and Nim","https://cp-algorithms.com/game_theory/sprague-grundy-nim.html"],["cp-algorithms: Games on arbitrary graphs","https://cp-algorithms.com/game_theory/games_on_graphs.html"],["USACO Guide: Digit DP","https://usaco.guide/gold/digit-dp"],["Wikipedia: Nim","https://en.wikipedia.org/wiki/Nim"]]}],"plan":[{"t":"Weighted & advanced graphs","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a dsa-l3/ folder with python/ and js/; pytest for Python, node --test for JavaScript; accounts on LeetCode and Codeforces for virtual contests","min":30,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-paths"},{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-lowlink"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Advanced DP","blocks":[{"k":"mod","ref":"m04"},{"k":"mod","ref":"m05"},{"k":"lab","ref":"lab-dp-masks"},{"k":"mod","ref":"m06"},{"k":"lab","ref":"lab-rerooting"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Range queries","blocks":[{"k":"mod","ref":"m07"},{"k":"mod","ref":"m08"},{"k":"mod","ref":"m09"},{"k":"lab","ref":"lab-range"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Strings, maths & games","blocks":[{"k":"mod","ref":"m10"},{"k":"mod","ref":"m11"},{"k":"lab","ref":"lab-strings-math"},{"k":"mod","ref":"m12"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L3","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-contests","label":"Six virtual contests (LeetCode weekly or Codeforces Div. 2, 90 minutes each); write down the first problem you couldn't solve and upsolve it","min":720,"kind":"Milestone"},{"id":"t-mocks","label":"Four timed mock interviews (60 minutes, one hard problem, think aloud); write a short review after each","min":300,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: all 89 module problems solved and logged with the technique that unlocked each (about 45 minutes a problem)","min":4000,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L3: your technique cheat sheet, the 5 problems that taught you most, and what you'd tell an L2 learner; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Ben's delivery-route app","org":"A route planner for a small delivery business","min":25,"blurb":"Shortest paths, negative costs, minimum spanning trees and bridges inside one routing app.","sections":[["Overview","Ben's family runs a delivery business in a city with 20,000 junctions and 60,000 one-way streets. Ben is building the route planner."],["Features",["Fastest route: every street has a travel time in minutes, never negative.","Cash-back streets: some partner streets pay the driver a bonus, modelled as a negative cost. The planner must never get stuck chasing a loop of bonuses.","Toll-free option: count how many toll streets a route uses (1 per toll street, 0 for the rest) and use as few as possible.","Depot network: link 30 depots with private fibre cable at the lowest total cost.","Lifelines: treating every street as two-way, flag the streets whose closure would split the city's network in two."]],["Constraints",["Each answer must come back in under a second on a laptop.","Ben wants to name the algorithm and its cost for every feature."]]],"items":[{"d":"d1","q":"Which algorithm fits the fastest-route feature?","o":["Dijkstra with a binary heap: O((V + E) log V)","BFS, counting each street as one step","Floyd–Warshall for every pair of junctions","Bellman–Ford for every request"],"a":0,"e":"Times are non-negative, so Dijkstra is correct and fast. BFS ignores the times, Floyd–Warshall is O(V³) = 8 × 10¹² steps here, and Bellman–Ford is O(V·E) per request."},{"d":"d1","q":"With cash-back (negative) streets, what must the planner do?","o":["Run Bellman–Ford, plus one extra round: if anything still improves, a negative cycle is reachable, so report it instead of a route","Keep Dijkstra, since negative streets only make routes cheaper","Add a constant to every cost so all are positive, then run Dijkstra","Use BFS"],"a":0,"e":"Dijkstra can finalise a junction before a later negative street would improve it. Adding a constant penalises routes with more streets, so it changes which route is cheapest."},{"d":"d1","q":"The toll-free option costs 1 per toll street and 0 otherwise. Which method is most efficient?","o":["0-1 BFS with a deque, in O(V + E)","Floyd–Warshall","A DFS that tries every route","Prim's algorithm"],"a":0,"e":"Dijkstra also works, in O((V + E) log V); 0-1 BFS drops the log factor because there are only two weights."},{"d":"d1","t":"ms","q":"Which TWO statements about the depot fibre network are true?","o":["It's a minimum spanning tree over the 30 depots","Prim's algorithm with a heap, or Kruskal's with union-find, solves it","It's the shortest-path tree from the head office","It needs Bellman–Ford, because cable costs can be large","Floyd–Warshall gives the cheapest network"],"a":[0,1],"e":"A shortest-path tree makes each depot close to one source, which isn't the same as the least total cable."},{"d":"d1","q":"How should the lifeline check find the streets whose closure splits the network?","o":["One DFS that records discovery times and low-link values: a tree edge u → v is a bridge when low[v] > tin[u]","Remove each street in turn and run a BFS to see whether the city is still connected","Build a minimum spanning tree: its edges are the lifelines","Run Dijkstra from every junction"],"a":0,"e":"Removing each of 60,000 streets and searching again costs O(E · (V + E)), billions of steps. Spanning-tree edges aren't necessarily bridges; a bridge is an edge on no cycle."}]},{"id":"cs2","title":"Tara's games club","org":"A league app for the after-school games club","min":25,"blurb":"Range queries, string search, bitmask DP and game theory inside one club app.","sections":[["Overview","Tara runs the after-school games club: 2,000 players, matches every day, a live leaderboard and a word-puzzle corner."],["Features",["Live leaderboard: after every match one player's score changes, and the app can say how many players scored less than any value.","Season stats: the total points scored over any range of days, while bonus points get added to whole ranges of days at once.","Puzzle checker: find every place a hidden word appears in a long puzzle text.","Team picker: split 12 players into four teams of 3, maximising the total teamwork score, where every pair of players has a score in a 12 × 12 table.","Coin game: two players take 1, 2 or 3 coins from a pile in turn, and whoever takes the last coin wins. The app tells the first player whether to start."]],["Constraints",["Every action must feel instant.","Season totals get huge, so the app reports them modulo 1,000,000,007."]]],"items":[{"d":"d3","q":"The leaderboard needs score updates and “how many players scored less than x?” queries. What fits best?","o":["A Fenwick tree over the (compressed) score values: O(log n) per update and query","Re-sorting all players after every match","A hash map from player to score","A trie of scores"],"a":0,"e":"An update moves one player from their old score to the new one (−1 at the old value, +1 at the new); a prefix sum counts lower scores. Re-sorting costs O(n log n) per match."},{"d":"d3","q":"Season stats need range sums AND bonuses added to whole ranges of days. What fits?","o":["A segment tree with lazy propagation (or the two-Fenwick-tree trick)","A plain prefix-sum array","A sparse table","A monotonic deque"],"a":0,"e":"Prefix sums break on updates, and a sparse table only works on data that doesn't change. Lazy tags handle range add with range sum in O(log n)."},{"d":"d4","q":"The puzzle checker searches a text of length n for a word of length m. Which method is O(n + m) in the worst case?","o":["KMP (the prefix function) or the Z-function","Comparing the word at every start position","Sorting the text","Binary search over the text"],"a":0,"e":"Checking every start position is O(n · m) on texts like aaaa…ab. A rolling hash is O(n + m) on average, but collisions make it probabilistic."},{"d":"d2","q":"How should the team picker find the best split of 12 players into four teams of 3?","o":["Bitmask DP over the set of players already placed, always building the next team around the lowest unplaced player","Greedily take the pair with the highest score, then add the best third player, and repeat","Sort the players by skill and cut the list into blocks of 3","Run Dijkstra between players"],"a":0,"e":"There are only 2¹² = 4,096 sets of placed players. Fixing the lowest unplaced player stops the same split being counted in different orders. Greedy pairing can lock out a better overall split."},{"d":"d4","t":"yn","q":"Judge each statement about the coin game (take 1, 2 or 3 coins; whoever takes the last coin wins).","s":[["The first player loses, with perfect play, exactly when the pile size is a multiple of 4.",true],["With 10 coins, the first player should take 2.",true],["Working out every pile size from 0 to n as winning or losing costs O(n).",true],["The second player always wins with perfect play.",false]],"e":"From a multiple of 4, every move leaves a non-multiple, and the opponent can always return to a multiple of 4. 10 − 2 = 8. Each pile size checks 3 moves. The second player wins only from multiples of 4."}]}],"diag":[{"d":"d1","q":"Which algorithm finds single-source shortest paths when every edge weight is non-negative, in O((V + E) log V)?","o":["Dijkstra's algorithm with a binary heap","Breadth-first search","Bellman–Ford","Floyd–Warshall"],"a":0,"e":"BFS only handles equal weights, Bellman–Ford is O(V·E), and Floyd–Warshall computes all pairs in O(V³)."},{"d":"d1","q":"A graph has some negative edge weights but no negative cycles. Which single-source algorithm is correct?","o":["Bellman–Ford","Dijkstra's algorithm","Breadth-first search","Prim's algorithm"],"a":0,"e":"Dijkstra can finalise a vertex too early, before a later negative edge would lower its distance. Bellman–Ford relaxes every edge V − 1 times."},{"d":"d1","q":"Every edge weighs either 0 or 1. Which technique finds shortest paths in O(V + E)?","o":["0-1 BFS: a deque, with 0-weight edges pushed to the front and 1-weight edges to the back","Plain BFS with a queue","Depth-first search","Sorting the edges by weight"],"a":0,"e":"The deque stays sorted by distance, so it behaves like Dijkstra without the heap's log factor. Plain BFS treats 0-edges as costing 1."},{"d":"d1","q":"In a connected undirected graph, what is a bridge, and how is it found efficiently?","o":["An edge whose removal disconnects the graph, found with one DFS using low-link values in O(V + E)","An edge on the path between the two farthest vertices, found with two BFS runs","The heaviest edge on each cycle, found by sorting","An edge whose two ends both have degree 1"],"a":0,"e":"A bridge lies on no cycle. For a DFS tree edge u → v, it's a bridge exactly when low[v] > tin[u]."},{"d":"d1","q":"A connected undirected graph has an Euler path (a walk that uses every edge exactly once) when…","o":["It has 0 or 2 vertices of odd degree","Every vertex has even degree, and only then","It has no cycles","It has exactly one vertex of odd degree"],"a":0,"e":"0 odd vertices give an Euler circuit, and exactly 2 give a path between them. No graph has exactly one odd vertex: the degrees always sum to an even number."},{"d":"d2","q":"dp[i][j] describes the substring s[i..j] and is built from shorter substrings inside it. In what order must a bottom-up table be filled?","o":["By increasing length j − i","Row by row, starting from i = 0","By decreasing j only","Any order works"],"a":0,"e":"Every interval depends only on shorter intervals inside it, so all intervals of one length must be done before the next length."},{"d":"d2","q":"n ≤ 16 people must each get a different task, minimising the total cost. Which DP state fits?","o":["dp[mask] = the least cost when the tasks in mask go to the first popcount(mask) people","dp[i] = the least cost for the first i people, ignoring which tasks are used","dp[i][j] over people and tasks, with no record of used tasks","No DP: give each person their cheapest task"],"a":0,"e":"Which tasks are already taken matters, and 2¹⁶ masks × 16 choices is small. Greedy can give two people the same task or miss the best total."},{"d":"d2","q":"How many (mask, submask) pairs are visited when you enumerate every submask of every mask of n bits?","o":["3ⁿ","4ⁿ","2ⁿ","n · 2ⁿ"],"a":0,"e":"Each bit is either outside the mask, in the mask but not the submask, or in both: 3 choices per bit."},{"d":"d2","q":"In a tree DP, what does each node usually return to its parent?","o":["A small summary of its subtree, such as the best total if it's taken and if it's skipped","The full list of its descendants","Nothing: tree DP only passes values downwards","The final answer for the whole tree"],"a":0,"e":"The parent combines its children's summaries in O(1) each, so the whole tree takes O(n)."},{"d":"d2","q":"Rerooting computes a tree answer with every node as the root. What does it cost?","o":["O(n): one pass for one root, then one more pass that moves the root across each edge in O(1)","O(n²): a fresh DFS from every node","O(n log n): sort the nodes first","O(2ⁿ)"],"a":0,"e":"Moving the root from a parent to a child changes the answer by an amount you can compute from stored subtree sizes."},{"d":"d3","q":"An array gets 10⁵ point updates and 10⁵ prefix-sum queries. Which structure is simplest, at O(log n) per operation?","o":["A Fenwick (binary indexed) tree","A prefix-sum array rebuilt after every update","A hash map","A sorted list"],"a":0,"e":"Rebuilding prefix sums costs O(n) per update. A Fenwick tree needs about ten lines of code."},{"d":"d3","q":"You must add a value to whole ranges and ask for the maximum of any range. What fits?","o":["A segment tree with lazy propagation","A Fenwick tree for prefix sums","A difference array","A sparse table"],"a":0,"e":"A difference array can't answer range max, and a sparse table works only on data that doesn't change. Lazy tags make range add and range max O(log n)."},{"d":"d3","q":"What does a monotonic deque give you for a sliding window of size k?","o":["The window's maximum (or minimum) in O(1) amortised per step","The window's median in O(1)","The window's items in sorted order","The window's sum in O(k)"],"a":0,"e":"Each index is pushed and popped at most once, and the front of the deque is always the window's best index."},{"d":"d4","q":"The KMP prefix function π[i] is…","o":["The length of the longest proper prefix of s[0..i] that is also a suffix of it","How many times s[i] appears before position i","The position of the next mismatch","A hash of s[0..i]"],"a":0,"e":"On a mismatch, KMP falls back to π instead of restarting, which makes searching O(n + m)."},{"d":"d4","q":"In JavaScript, why is `(a * b) % 1000000007` risky when a and b are both below 1,000,000,007?","o":["The product can pass 2⁵³, so it loses precision before % runs","% doesn't work on large numbers","JavaScript numbers are 32-bit integers","It isn't risky"],"a":0,"e":"The product can reach about 10¹⁸, far above 2⁵³ ≈ 9 × 10¹⁵. Use BigInt or split the multiplication; Python's ints are exact."},{"d":"d4","q":"In Nim with piles of 3, 4 and 5 stones, does the first player win with perfect play?","o":["Yes, because 3 XOR 4 XOR 5 = 2, which isn't 0","No, because the XOR is 0","Only if they always take from the largest pile","It depends on who moves last, which can't be known in advance"],"a":0,"e":"3 ^ 4 = 7 and 7 ^ 5 = 2. A non-zero XOR is a winning position (Bouton's theorem): there's always a move that makes it 0."}],"labs":[{"id":"lab-paths","t":"Shortest-path toolkit","min":90,"mods":["m01","m02"],"goal":"Write the four shortest-path algorithms that hard graph problems are built on: Dijkstra with a binary heap and lazy deletion (plus the path itself), 0-1 BFS with a deque, Bellman–Ford that reports a reachable negative cycle, and Floyd–Warshall for every pair. Then make them check each other on hundreds of random graphs.","pre":["Python 3.12+ and Node.js 22+","Modules 01 and 02"],"steps":["`dijkstra(n, edges, src)` (the signatures of modules 01 and 02, with directed (u, v, w) edges): build adjacency lists and keep a min-heap of (distance, vertex). Pop, skip the entry if it's stale (its distance is bigger than `dist[u]`), then relax every edge, pushing each improvement and recording `parent[v]`. JavaScript has no heap, so write a small one for [key, value] pairs.","`path_to(dist, parent, t)`: walk the parents back from t and reverse them; return an empty path when t can't be reached.","`zero_one_bfs(n, edges, src)`: a 0-edge sends its vertex to the front of a deque, a 1-edge to the back. In JavaScript, make the deque from a stack for the front and an array read from a head index for the back (not `unshift`, which moves every element).","`bellman_ford(n, edges, src)`: up to V − 1 rounds over every edge, stopping early when nothing changes; if one more round still improves a distance, return None / null. `floyd_warshall(n, edges)`: start from the cheapest direct edge for each pair, then run the triple loop with k outermost.","Test 300 random graphs (up to 7 vertices, with self-loops and repeated edges): Dijkstra equals Bellman–Ford on weights 0–9, 0-1 BFS equals Dijkstra on the same graph with weights mod 2, and Floyd–Warshall equals Bellman–Ford from every source after shifting each weight by `pot[u] - pot[v]` (edges turn negative, but every cycle keeps its total, as in Johnson's reweighting). Finally, plant a cycle of weight −1 and check that it's caught."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import heapq, random\nfrom collections import deque\n\nINF = float(\"inf\")\n\ndef adjacency(n, edges):                       # directed (u, v, w) edges -> adjacency lists\n    adj = [[] for _ in range(n)]\n    for u, v, w in edges:\n        adj[u].append((v, w))\n    return adj\n\ndef dijkstra(n, edges, src):                   # O((V + E) log V) time, O(V + E) space\n    adj = adjacency(n, edges)\n    dist, parent = [INF] * n, [-1] * n\n    dist[src] = 0\n    heap = [(0, src)]\n    while heap:\n        d, u = heapq.heappop(heap)\n        if d > dist[u]:                        # stale entry: u was already reached more cheaply\n            continue\n        for v, w in adj[u]:\n            if d + w < dist[v]:\n                dist[v], parent[v] = d + w, u\n                heapq.heappush(heap, (d + w, v))   # lazy deletion: the old entry stays behind\n    return dist, parent\n\ndef path_to(dist, parent, t):                  # the vertices from the source to t\n    if dist[t] == INF:\n        return []\n    path = []\n    while t != -1:\n        path.append(t)\n        t = parent[t]\n    return path[::-1]\n\ndef zero_one_bfs(n, edges, src):               # weights 0 or 1 only: O(V + E)\n    adj = adjacency(n, edges)\n    dist = [INF] * n\n    dist[src] = 0\n    dq = deque([src])\n    while dq:\n        u = dq.popleft()\n        for v, w in adj[u]:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                if w == 0:\n                    dq.appendleft(v)           # same distance as u: to the front\n                else:\n                    dq.append(v)               # one more: to the back\n    return dist\n\ndef bellman_ford(n, edges, src):               # O(V * E); None if a negative cycle is reachable\n    dist = [INF] * n\n    dist[src] = 0\n    for _ in range(n - 1):\n        changed = False\n        for u, v, w in edges:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                changed = True\n        if not changed:\n            break\n    for u, v, w in edges:                      # one more round: any improvement means a cycle\n        if dist[u] + w < dist[v]:\n            return None\n    return dist\n\ndef floyd_warshall(n, edges):                  # all pairs: O(V^3) time, O(V^2) space\n    d = [[0 if i == j else INF for j in range(n)] for i in range(n)]\n    for u, v, w in edges:\n        d[u][v] = min(d[u][v], w)\n    for k in range(n):                         # k outermost: allow 0..k as stops\n        for i in range(n):\n            if d[i][k] == INF:\n                continue\n            for j in range(n):\n                if d[i][k] + d[k][j] < d[i][j]:\n                    d[i][j] = d[i][k] + d[k][j]\n    return d\n\ndef path_cost(edges, p):                       # cheapest edge between each consecutive pair\n    return sum(min(w for a, b, w in edges if (a, b) == (u, v)) for u, v in zip(p, p[1:]))\n\nfor _ in range(300):\n    n = random.randint(1, 7)\n    edges = [(random.randrange(n), random.randrange(n), random.randint(0, 9)) for _ in range(random.randint(0, 15))]\n    s = random.randrange(n)\n    dist, parent = dijkstra(n, edges, s)\n    assert dist == bellman_ford(n, edges, s)\n    for t in range(n):\n        p = path_to(dist, parent, t)\n        if p:\n            assert p[0] == s and p[-1] == t and path_cost(edges, p) == dist[t]\n        else:\n            asser
