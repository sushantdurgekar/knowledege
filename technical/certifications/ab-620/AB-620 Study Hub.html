{
  id: "w01", d: "d1", t: "Agent flows: build, parameters, connectors, topics", min: 85,
  hook: "Agent flows (called **Workflows** in the newest UI) are how a Copilot Studio agent does reliable multi-step work: write a record, call two systems, send an email, all in a fixed order. The exam tests the trigger, the response action, parameters, the time limit and how a topic calls a flow.",
  pre: { q: "Your flow writes a return record, emails the customer, then waits two minutes for a warehouse system to confirm stock. Called as a tool, the agent reports a failure even though the email arrives. Why?", a: "A flow used as a tool must reach **Respond to the agent** within the **100-second action limit**. Waiting two minutes before responding breaks that. Respond first (e.g., with a reference number) and continue the slow work after responding." },
  story: [
    "Asha needs the agent to **file a return**: create a row in the Dataverse *Returns* table, then email the customer a confirmation. One connector action can't do both, and the order must never change, so she builds an **agent flow**.",
    "Every agent flow starts with the same trigger: **When an agent calls the flow** (*When an agent calls the workflow* in the new designer). Here she declares **inputs**: order number (text), reason (text), customer email (text). Each input gets a clear name and description, because the orchestrator reads them when deciding what to pass.",
    "Then come ordinary Power Automate actions: **Dataverse – Add a new row** maps the inputs into the Returns table; **Office 365 Outlook – Send an email (V2)** confirms to the customer. Each connector uses a **connection**, and in a solution that connection is referenced through a **connection reference**, which is what lets the flow move to test and production with different accounts.",
    "The flow ends with **Respond to the agent**, returning **outputs**: the return ID and a status message. Asha leaves *Asynchronous response* **off** so the agent waits for the answer, and keeps the run well under **100 seconds**. She saves and **publishes** the flow, because only published flows can be used as tools.",
    "Finally she wires it up twice. At **agent level** (Tools > Add a tool > the flow) the orchestrator decides when to call it and fills inputs from the conversation. Inside the *Start a return* **topic** (Add node > Add a tool), she maps topic variables to inputs and saves outputs into topic variables, because that topic must always confirm the details with the customer first."
  ],
  breaks: "A flow is not an agent: it doesn't reason or recover on its own. If an action fails, nothing \"tries something else\" unless you design error handling (next module). And a flow called at agent level still depends on the orchestrator passing sensible inputs.",
  dia: [
    { type: "flow", cap: "Anatomy of an agent flow", steps: [["Trigger", "When an agent calls the flow: declare inputs (name, type, description)"], ["Actions", "connectors (Dataverse, Outlook, SharePoint...), conditions, loops, approvals"], ["Respond to the agent", "outputs back to the agent; synchronous; within ~100 s"], ["Optional: more actions", "slow work can continue after responding"]] },
    { type: "seq", cap: "A topic calling an agent flow", actors: ["User", "Topic", "Agent flow", "Dataverse"], msgs: [["User", "Topic", "\"I want to return order 1042\""], ["Topic", "User", "Confirm item and reason (Question nodes)", true], ["Topic", "Agent flow", "Inputs: order 1042, reason, email"], ["Agent flow", "Dataverse", "Add a new row (Returns)"], ["Dataverse", "Agent flow", "Row ID", true], ["Agent flow", "Topic", "Outputs: returnId, status", true], ["Topic", "User", "\"Return R-311 created, check your email\""]] }
  ],
  keys: [
    "An **agent flow** is a Power Automate-based flow native to Copilot Studio, billed in **Copilot Credits** (not Power Automate licences). Newest UI name: **Workflow**.",
    "Required shape for use as a tool: trigger **When an agent calls the flow**, action **Respond to the agent**, the flow **published**, *Asynchronous response* **Off** (Respond to the agent > Settings/Networking), and a response within the **100-second action limit**.",
    "Inputs are declared on the trigger (simple types such as Text, Number, Yes/No; pass complex data as JSON text). Outputs are declared on Respond to the agent. Good names and **descriptions** help the orchestrator fill inputs.",
    "Use a flow for **multi-step, ordered, branching or reusable** logic, approvals and parallel work. For a single action, a connector tool is simpler.",
    "Connector actions inside the flow use connections; in solutions they use **connection references** so each environment can bind its own connection.",
    "Agent-level tool: the orchestrator decides when to call and fills inputs (*Dynamically fill with AI* by default; you can also set a fixed value or Power Fx).",
    "Topic-level: **Add node > Add a tool** (or *Call an action*) > choose the flow, map **topic variables → inputs**, and outputs become **topic variables**. Use it when the call must happen at a precise step.",
    "Long-running work: respond early (return a tracking ID), then continue processing after the response; notify the user later (email, Teams). Some environments also offer an **asynchronous response** mode with a callback (fully supported in Teams).",
    "Flows can be created from Copilot Studio (Flows/Workflows page, or Tools > Add a tool > New agent flow) and edited in the designer; use natural language to draft a flow, then check every step.",
    "Keep flows in the **same solution** as the agent so ALM moves them together."
  ],
  cmp: [
    { cap: "Agent flow vs other ways to act", head: ["", "Connector tool", "Agent flow", "Send HTTP request node"], rows: [
      ["Steps", "One action", "Many, ordered, branching", "One call"],
      ["Approvals / waiting", "No", "Yes", "No"],
      ["Reuse across agents", "Yes", "Yes", "No (topic only)"],
      ["Called by", "Orchestrator or topic", "Orchestrator or topic", "Topic"],
      ["Time limit", "Connector timeouts", "Respond within ~100 s", "Default timeout 30 s (configurable)"]] },
    { cap: "Agent-level vs topic-level tool calls", head: ["", "Agent level", "Topic level"], rows: [
      ["Who decides to call", "Orchestrator, by description", "Your topic, at a fixed step"],
      ["Inputs", "Filled by AI from the conversation (or set values)", "Mapped from topic variables"],
      ["Outputs", "Used by the orchestrator to write the reply", "Saved to topic variables you use next"],
      ["Best for", "Flexible requests", "Mandatory sequences (confirm, then act)"]] }
  ],
  code: [{ t: "Topic YAML: calling an agent flow with input and output bindings", lang: "yaml", src: `- kind: Question
  id: ask_reason
  variable: init:Topic.ReturnReason
  prompt: What's the reason for the return?
  entity: StringPrebuiltEntity

- kind: InvokeFlowAction
  id: call_create_return
  flowId: 4f6c0d2e-...            # the agent flow in this solution
  input:
    binding:
      orderNumber: =Topic.OrderNumber
      reason: =Topic.ReturnReason
      customerEmail: =System.User.Email
  output:
    binding:
      returnId: Topic.ReturnId
      status: Topic.ReturnStatus

- kind: SendActivity
  id: confirm
  activity: Return {Topic.ReturnId} is {Topic.ReturnStatus}. A confirmation email is on its way.`, notes: [[7, "Calling a flow from a topic appears in YAML as `InvokeFlowAction`."], [12, "Input bindings are Power Fx expressions (note the `=`)."], [14, "System variables are read-only but can be passed as inputs."], [17, "Outputs bind into topic variables for the next nodes."], [22, "Use the outputs immediately in a message."]] }],
  portal: [
    { t: "Create an agent flow (exam UI)", path: "Copilot Studio > Flows > + New agent flow (or Tools > Add a tool > New agent flow)", steps: ["Trigger **When an agent calls the flow**: add inputs (Text/Number/Yes-No) with clear names.", "Add actions, e.g. Dataverse **Add a new row** and Outlook **Send an email (V2)**; create or select connections.", "Add **Respond to the agent** with outputs; in its settings keep **Asynchronous response** off.", "Save and **Publish** the flow.", "In the agent: Tools > Add a tool > Flow > select it; write a precise description."] },
    { t: "Create a Workflow (new UI, AB-620T00 v2 labs)", path: "Copilot Studio > Workflows > New workflow", steps: ["Start node: trigger **When an agent calls the workflow** (Respond to the agent is added automatically).", "+ Add an input for each parameter.", "Add actions between Start and Respond to the agent; map outputs.", "Save, then **Publish** the workflow.", "In the agent: Tools > + > **Workflows** > select it; fill **Description for AI**."] }
  ],
  ex: { q: "A flow called by the agent creates a shipping label (5 s), then polls the carrier until pickup is booked (up to 10 minutes), then emails the customer. Users see \"Something went wrong\" every time. Fix the design.", steps: ["The tool fails because Respond to the agent comes after the 10-minute polling, beyond the ~100-second limit.", "The user only needs to know the label was created and that an email will follow.", "Slow polling can run after the response."], a: "Move **Respond to the agent** directly after label creation (return the label/tracking ID and \"you'll get an email when pickup is booked\"), keep async response off, and let the polling and email actions run **after** the response. The agent answers within seconds and the flow finishes in the background." },
  fade: { q: "The orchestrator keeps calling your *Create return* flow with an empty reason.", steps: ["The orchestrator fills inputs from the conversation using names and descriptions.", { ask: "What do you improve first?", a: "The input's name and **description** (e.g., *reason: the customer's stated reason for returning the item, such as damaged or wrong size*) and the flow's description; mark it required." }, { ask: "What protects the flow if a blank still arrives?", a: "Validate in the flow (Condition on empty input → respond with a clear error status), or call the flow from a topic after a Question node collects the reason." }] },
  traps: [
    ["Turning on *Asynchronous response* for a flow you want as an agent tool.", "Tools need a real-time (synchronous) response: async off, respond within ~100 s."],
    ["Forgetting to **publish** the flow.", "Only published flows show up and run as tools."],
    ["Putting Respond to the agent at the very end of a slow flow.", "Respond as soon as you have what the user needs; continue afterwards."],
    ["Using an agent flow for a single connector action.", "A connector tool is simpler and cheaper; flows are for multi-step logic."],
    ["Building the flow outside the agent's solution.", "Keep flows, connection references and the agent in the same solution for ALM."]

{
  id: "w02", d: "d1", t: "Human-in-the-loop flows, error handling, monitoring", min: 80,
  hook: "Agents that change money, data or access need a human checkpoint and need to fail gracefully. The exam asks which approval action fits, how to catch and report errors, and where to look when a flow run goes wrong.",
  pre: { q: "An approval flow waits for a supervisor who is on holiday. What happens to the flow run, and how should it be handled?", a: "Approvals can wait a long time (flows can run for up to **30 days**), so set a **timeout** on the approval and handle the *timed out* path (escalate to a deputy, notify the requester), rather than leaving the request hanging." },
  story: [
    "Contoso's finance rule is simple: refunds up to $100 are automatic, anything above needs a supervisor. Asha builds a second flow, *Request refund*, with an **If/Else**: under the threshold it updates the Returns row to *Approved*; above it, it starts an approval.",
    "For the approval she uses **Approvals – Start and wait for an approval** (*Approve/Reject – First to respond*). The supervisor gets the request in Teams and Outlook, with the order details and amount. A **Switch on Outcome** handles *Approve* and *Reject*, and each branch updates the row and records who decided.",
    "Her colleague Leo shows her a second option for questions rather than yes/no decisions: the **Request for information** (human review) action sends an Outlook actionable message asking a person to fill in fields (text, yes/no, number, date) that flow back as outputs. *\"Ask a warehouse lead which bin the item came from\"* is a perfect fit.",
    "Then she thinks about failure. She wraps the Dataverse update in a **Try** scope, adds a **Catch** scope that runs after Try *has failed* or *has timed out*, and returns a friendly status (\"couldn't update the record, reference 7781\") to the agent instead of a crash. A **Terminate** action marks the run *Failed* so monitoring shows the truth.",
    "Two weeks after launch, a manager says \"refunds are stuck\". Asha opens the flow's **Activity** page in Copilot Studio, finds runs waiting on one approver, opens a run to see every step's inputs and outputs, and checks **Analytics** for the failure rate over the week. The fix is a timeout and a delegate approver."
  ],
  breaks: "A flow that waits for an approval can't keep the agent waiting: the agent needs a reply within about 100 seconds. In production you usually tell the user \"submitted for approval, reference R-311\" first, then notify them of the decision by email or Teams when it arrives.",
  dia: [
    { type: "tree", cap: "Which human-in-the-loop action?", root: { q: "What do you need from the person?", c: [["A decision: approve or reject", "Approvals: Start and wait for an approval (single or multistage, with timeout)"], ["Information: values to continue", "Request for information (human review): Outlook actionable message with input fields"], ["To take over the conversation", "Escalate / transfer to a live agent (not a flow)"]] } },
    { type: "layers", cap: "Error-handling toolkit in agent flows", rows: [["Retry policy", "transient errors retried automatically (default exponential); tune per action"], ["Configure run after", "run a step only if the previous one succeeded / failed / was skipped / timed out"], ["Scopes", "Try → Catch (after failed or timed out) → Finally (always)"], ["Terminate", "end the run as Succeeded, Failed or Cancelled with a message"], ["Return status", "send an error status/message output so the agent can explain and offer next steps"], ["Topic side", "Condition on the output; On Error topic for tool failures"]] }
  ],
  keys: [
    "**Approvals – Start and wait for an approval**: types *Approve/Reject – Everyone must approve*, *Approve/Reject – First to respond*, *Custom responses* (wait for one / all); then branch on **Outcome** with Condition or **Switch**.",
    "**Request for information** (human review, Copilot Studio agent flows): sends an Outlook **actionable message** to reviewers with input fields (Text, Yes/No, Email, Number, Date); the **first response** completes it; reviewers must be in your tenant; avoid spaces in input names.",
    "**Multistage approvals** can chain manual stages (and AI stages with instructions) for complex sign-off.",
    "Approvals can wait long (flow runs last up to **30 days**); set **timeouts** on the action and handle the *timed out* path.",
    "Keep the agent responsive: respond to the agent with a reference first, notify the user of the decision later.",
    "**Configure run after**: is successful, has failed, is skipped, has timed out. Basis of try/catch/finally with **Scope** actions.",
    "**Retry policy** handles transient failures (HTTP 408/429/5xx); don't retry non-idempotent writes blindly.",
    "**Terminate** sets the run status (Succeeded/Failed/Cancelled) so monitoring reflects reality.",
    "Return an error **status/message output**; in the topic, check it with a Condition and offer alternatives (retry, escalate). Unhandled tool failures go to the **On Error** topic.",
    "Monitor in Copilot Studio: Flows page > flow > **Overview**, **Activity** (run history, open a run, see each action's inputs/outputs, resubmit or cancel), **Analytics** (run count, failure rate; data can lag up to ~30 minutes; solution flows). The agent's analytics/Monitor and transcripts show how tools were used."
  ],
  cmp: [{ cap: "Approvals vs Request for information", head: ["", "Start and wait for an approval", "Request for information"], rows: [
    ["Output", "Outcome (Approve/Reject or custom) + responses/comments", "Typed values you defined (text, number, date...)"],
    ["Where people respond", "Teams Approvals app, Outlook, Power Automate", "Outlook actionable message"],
    ["Multiple people", "Everyone must approve or first to respond", "First response wins"],
    ["Typical use", "Refund over threshold, access request", "Ask a specialist for a missing value"]] }],
  code: [{ t: "Try / Catch / Finally in the flow definition (code view)", lang: "json", src: `"Try": {
  "type": "Scope",
  "actions": { "Update_return_row": { "type": "OpenApiConnection", "inputs": { "retryPolicy": { "type": "exponential", "count": 4, "interval": "PT10S" } } } }
},
"Catch": {
  "type": "Scope",
  "runAfter": { "Try": ["Failed", "TimedOut"] },
  "actions": { "Respond_with_error": { "type": "Response", "inputs": { "body": { "status": "error", "message": "Couldn't update the record." } } } }
},
"Finally": {
  "type": "Scope",
  "runAfter": { "Catch": ["Succeeded", "Failed", "Skipped", "TimedOut"] }
}`, notes: [[2, "A **Scope** groups actions so you can react to the group's result."], [3, "Retry policy for transient errors: exponential back-off, 4 retries."], [7, "**Configure run after**: Catch runs only if Try failed or timed out."], [8, "Return a clean error output so the agent can explain and offer a next step (shape simplified here)."], [12, "Finally runs whatever happened (logging, clean-up)."]] }],
  portal: [
    { t: "Add an approval branch (new UI lab pattern)", path: "Workflows > (workflow) > + after the record lookup", steps: ["Add **If/Else**: requestedAmount > 100.", "True branch: **Approvals – Start and wait for an approval** (Approve/Reject – First to respond); assign the supervisor; include details in the body.", "Add **Switch** on *Outcome*: cases Approve and Reject, each updating the row.", "False branch: **Update a row** to auto-approve.", "Make sure every branch ends in (or has passed) **Respond to the agent**; publish."] },
    { t: "Monitor runs", path: "Copilot Studio > Flows (Workflows) > (flow) > Activity / Analytics", steps: ["Activity: filter by status; open a run to see each step with inputs, outputs and errors.", "Resubmit a failed run after fixing the cause, or cancel stuck runs.", "Analytics: runs over time and failure rate (may lag ~30 min).", "Correlate with the agent's transcript to see what the user experienced."] }

  traps: [

    ["Leaving approvals without a timeout.", "Runs can sit for up to 30 days; add a timeout and a timed-out path."],
    ["Letting the agent wait for the human decision.", "Respond to the agent first, then notify the user of the outcome."],

    ["Looking for flow run details in the agent's transcript only.", "Use the flow's **Activity** page for step-level inputs, outputs and errors."]
  ],
  disc: [
    ["When is an AI approval stage acceptable?", "For low-risk, high-volume checks with clear rules (completeness, policy match), followed by a human stage for exceptions or high values. Never as the only check for high-impact or irreversible actions."],
    ["How do you prove to auditors who approved a refund?", "Store approver, outcome, comments and timestamps from the approval response in the Dataverse row, keep flow run history, and use Purview audit for agent activity."]
  ],
  teach: { prompt: "Explain how you'd add human approval and robust error handling to an agent flow, and how you'd monitor it.", rubric: ["Start and wait for an approval + Switch on outcome", "Request for information for missing values", "Timeouts and timed-out path", "Respond to the agent early", "Run after / scopes / terminate / retry", "Activity and Analytics pages"], model: "For decisions I use Start and wait for an approval and branch on the outcome with a Switch; for missing details I use Request for information. I set a timeout and handle the timed-out path, and I respond to the agent before waiting so the user gets a reference immediately. Errors are handled with retry policies, Try/Catch scopes using configure run after, a clear error output for the agent and Terminate to mark failures. I monitor runs on the flow's Activity page (step inputs and outputs) and Analytics (failure rate)." },
  qa: [["Approval action name?", "**Start and wait for an approval**."], ["Branch on the result with?", "Condition or **Switch** on *Outcome*."], ["Human gives values, not a decision?", "**Request for information** (Outlook actionable message)."], ["Max flow run duration?", "**30 days**."], ["Run-after states?", "Succeeded, failed, skipped, timed out."], ["Where are step-level run details?", "Flow > **Activity** > open a run."], ["Mark a handled failure as failed?", "**Terminate** with status Failed."]],

    { t: "match", q: "Match each need to the right flow feature.", pairs: [["Retry transient 429 errors automatically", "Retry policy"], ["Run clean-up whether or not earlier steps failed", "Scope with run after all states"], ["Ask a warehouse lead for the bin number", "Request for information"], ["Show the run as failed after handling the error", "Terminate"]], extra: ["Trigger phrase"], e: "Retry policy for transient errors; Finally-style scope for clean-up; human review for values; Terminate for run status.", tp: "Error handling" },
    { t: "yn", q: "Evaluate each statement about monitoring agent flows in Copilot Studio.", s: [["The Activity page lets you open a run and inspect each action's inputs and outputs.", true], ["Flow analytics are always real-time with no delay.", false], ["You can resubmit a failed run after fixing the cause.", true]], e: "Activity shows step details and supports resubmit/cancel; analytics can lag by up to ~30 minutes.", tp: "Monitoring" },
    { q: "Refunds above $100 need approval, but the agent must answer the user within seconds. What's the BEST design?", o: ["Wait for the approval, then Respond to the agent", "Respond to the agent with a reference first, then start the approval and notify the user of the outcome later", "Turn on Asynchronous response and remove the approval", "Ask the agent to poll the approval every 10 seconds"], a: 1, e: "Respond early to stay within the time limit; notify on decision.", tp: "HITL design" },

{
  id: "c01", d: "d1", t: "Topics, variables and response formatting", min: 85,
  hook: "Topics are where you control a conversation exactly: the questions, the branches, the wording, the data you keep. *Manage variables* and *Configure agent response formatting* are named skills, and they're where small details (scope, type, Power Fx) decide answers.",
  pre: { q: "A value collected in one topic must be available in every later topic of the same conversation. Topic variable or global variable? And can a website set it before the chat starts?", a: "A **global** variable (`Global.` prefix) lasts for the whole conversation across topics. If you tick *External sources can set values*, the hosting page can set it (for example a customer tier) at the start." },
  story: [
    "Contoso's returns topic needs to feel personal and be exact. Asha opens the topic canvas: a **trigger** at the top (*The agent chooses*, with a description), then **nodes**: *Send a message*, *Ask a question*, *Add a condition*, *Variable management*, *Topic management*, *Add a tool*, and *Advanced* nodes such as generative answers and HTTP requests.",
    "The first message greets the user by name, `{System.User.DisplayName}`, a **system variable** filled by sign-in. A **Question** node asks for the order number and stores it in `Topic.OrderNumber`, a **topic variable** that lives only inside this topic. The reason for return uses a **custom entity** (a closed list: damaged, wrong size, not as described), so the agent recognises \"it's broken\" as *damaged*.",
    "The customer's loyalty tier comes from the website before the chat starts, so Asha creates `Global.CustomerTier` and allows **external sources** to set it. Later topics use it to offer free return shipping to Gold members. The returns email address lives in an **environment variable**, read as `Env.cr5_ReturnsMailbox`, so test and production can differ without editing the topic.",
    "Some values need calculation. A **Condition** node uses **Power Fx**: `Topic.Amount > 100`. A message shows `Text(Topic.Amount, \"$#,##0.00\")` so prices look right. When an API returns JSON as text, a **Parse value** node turns it into a record with typed fields.",
    "Finally Asha formats replies so they read well in Teams: short sentences, a bulleted summary, **bold** for the return number, **quick replies** (*Track another order*, *Talk to a person*) and a couple of **message variations** so the greeting doesn't sound robotic. For answers the orchestrator writes itself, she adds formatting rules to the agent's **instructions**."
  ],
  breaks: "Variables feel like spreadsheet cells, but their **type is fixed at first assignment** and their **scope** matters: a topic variable is gone when the topic ends unless you return it as an output, and global variables can leak data between topics if you forget to clear them.",
  dia: [
    { type: "nest", cap: "Variable scopes", levels: [["Environment (`Env.`)", "environment variables from the solution; read-only in Copilot Studio; differ per environment"], ["System (`System.`)", "read-only: User, Activity, Conversation, Error, Bot"], ["Global (`Global.`)", "whole conversation, every topic; optionally set by external sources"], ["Topic (`Topic.`)", "one topic run; pass in/out with topic inputs and outputs"]] },
    { type: "flow", cap: "A typical topic", steps: [["Trigger", "The agent chooses (description) or phrases"], ["Ask", "Question node + entity → Topic var"], ["Decide", "Condition (Power Fx)"], ["Act", "Add a tool / flow / HTTP"], ["Respond", "Message with variables, formatting, quick replies"], ["End", "End current topic / redirect / end all"]] }

  keys: [
    "Topic nodes: **Send a message**, **Ask a question**, **Ask with adaptive card**, **Add a condition**, **Variable management** (Set a variable value, Parse value, Clear variable values), **Topic management** (Redirect, End current topic, End all topics, Transfer conversation), **Add a tool**, **Advanced** (Generative answers, Send HTTP request, Send an event, Authenticate...).",
    "Variable scopes: **Topic** (no prefix shown in UI; `Topic.` in formulas), **Global** (`Global.`; all topics; *External sources can set values* lets hosts set it), **System** (`System.`; read-only), **Environment** (`Env.`; read-only).",
    "Useful system variables: `System.Activity.Text` (user's last message), `System.User.DisplayName`, `System.User.Email`, `System.User.IsLoggedIn`, `System.Conversation.Id`, `System.Error.Code` / `System.Error.Message` (in On Error), `System.FallbackCount`.",
    "Types: String, Number, Boolean, DateTime, Choice, Record, Table, Blank. A variable's type is set by its **first assignment** and can't change.",
    "**Topic inputs and outputs** (Receive values from / Return values to other topics): with generative orchestration, the orchestrator fills inputs from the conversation (descriptions matter) and uses outputs to write the reply.",
    "**Question node**: entity (prebuilt: number, date and time, email, money, person name...; custom: closed list or regex), retries, reprompt, action when no valid entity is found, *Skip question* when the variable already has a value, interruptions.",
    "**Power Fx** in conditions, Set variable and messages: `If`, `IsBlank`, `Text(value, format)`, `CountRows`, `First`, `Filter`, `ForAll`, string concatenation with `&`.",
    "**Parse value** converts JSON text into a typed record/table using a sample or schema.",

    "Generative replies are formatted by the agent's **instructions** (\"answer in up to 3 bullets\", \"bold the order number\") and by custom instructions on generative answers nodes."

{
  id: "c02", d: "d1", t: "Adaptive cards", min: 75,
  hook: "Adaptive cards turn a chat into a form or a dashboard. The exam likes card JSON, input IDs that become variables, schema versions per channel, and when to use a Formula card so values can be dynamic.",
  pre: { q: "An *Ask with adaptive card* node has an input `\"id\": \"leaveType\"`. After the user submits, where is the value?", a: "In a topic output variable created from the input's **id**, here `Topic.leaveType`. That's why descriptive camelCase IDs matter." },
  story: [
    "HR wants leave requests by chat, but typing a date, a leave type and a number of days into free text produces chaos. Asha uses an **Ask with adaptive card** node: one card with an **Input.ChoiceSet** (leave type), two **Input.Date** fields and an **Input.Number**, plus an **Action.Submit** button.",
    "When the employee submits, Copilot Studio creates **output variables** named after each input's **id**: `Topic.leaveType`, `Topic.startDate`, `Topic.endDate`, `Topic.days`. She marks inputs **required**, but also adds a **Condition** after the node, because some channels let blank values through.",
    "Leave types differ per country, so the choice list must come from data. In **JSON** mode a card is static; switching the node to a **Formula** card lets her build the card with **Power Fx**, so `choices` comes from `Topic.AvailableLeaveTypes` (a table with title and value), and the header can show the employee's name.",
    "After submission, a second, *informational* card confirms the request: a **ColumnSet** with the employee's photo, a **FactSet** with dates and days, and a *Submitted* badge. Informational cards go in a **Send a message** node.",
    "In the test pane everything is perfect. In Teams, one card is blank. The culprit: `version: \"1.6\"` and a 1.6-only property. Teams renders up to **schema 1.5**. Asha sets every card to 1.5, uses **Action.Submit** (not Action.Execute, which the web channel doesn't support), and re-tests in Teams."
  ],
  breaks: "Cards aren't free-form web pages: no custom scripts, limited styling, and each host (Teams, web chat, Outlook) renders slightly differently. Keep cards simple, with 3–5 key data points, and always provide a text alternative for screen readers.",
  dia: [
    { type: "layers", cap: "Building blocks of an adaptive card", rows: [["Card", "type AdaptiveCard, version (design to 1.5), body, actions"], ["Containers", "Container, ColumnSet/Column (layout), FactSet (label/value pairs)"], ["Elements", "TextBlock (wrap: true), Image (altText), RichTextBlock"], ["Inputs", "Input.Text, Input.Number, Input.Date (YYYY-MM-DD), Input.Time (HH:MM), Input.Toggle, Input.ChoiceSet"], ["Actions", "Action.Submit (send inputs), Action.OpenUrl, Action.ShowCard, Action.ToggleVisibility"]] },
    { type: "seq", cap: "Ask with adaptive card: from card to variables", actors: ["Topic", "Card", "User"], msgs: [["Topic", "Card", "Render (JSON or Formula)"], ["Card", "User", "Inputs: leave type, dates, days"], ["User", "Card", "Action.Submit"], ["Card", "Topic", "Outputs: Topic.leaveType, Topic.startDate... (from ids)", true], ["Topic", "Topic", "Condition: validate blanks, ranges"]] }
  ],
  keys: [
    "**Informational** cards: Send a message > Add > Adaptive card (edit in the designer or JSON). **Interactive** cards: **Ask with adaptive card** node, which waits for submission.",
    "Inputs' **id** values become **output variables** (`Topic.<id>`); use descriptive camelCase IDs. Mark inputs required (`isRequired`, `errorMessage`) and still validate with a Condition.",
    "**Action.Submit** sends all inputs. Use a unique submit ID when several cards are shown in a row so you know which one was submitted.",
    "**Formula card** (Power Fx) instead of JSON lets the card use variables and computed values, e.g., `choices` from a table variable with `title` and `value`. Compute complex values into variables first.",
    "Input formats: Input.Date returns `YYYY-MM-DD`; Input.Time returns `HH:MM`.",
    "Channel versions: **Teams and Omnichannel live chat support schema 1.5**; the web channel supports 1.6; the test pane renders 1.6 (can mislead). Design to **1.5** for multi-channel agents.",
    "The web channel doesn't support **Action.Execute**; use **Action.Submit**.",
    "Layout: Container, ColumnSet/Column, FactSet, Image, TextBlock with `wrap: true`, spacing, style `emphasis`, `minHeight`. Keep to **3–5 data points**.",
    "Accessibility: `altText` on images, clear `label`s on inputs, sufficient contrast, don't rely on colour alone.",
    "Several cards can be shown as a **carousel** or **list** in one message."
  ],
  cmp: [{ cap: "JSON card vs Formula card", head: ["", "JSON card", "Formula card (Power Fx)"], rows: [["Dynamic values (variables)", "No", "Yes"], ["Edit with the designer", "Yes", "Write Power Fx (start from JSON, then convert)"], ["Dynamic choice lists", "No", "Yes, from a table variable"], ["Best for", "Static forms and messages", "Data-driven cards"]] }],
  code: [
    { t: "Ask with adaptive card: leave request (JSON, schema 1.5)", lang: "json", src: `{
  "type": "AdaptiveCard",
  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
  "version": "1.5",
  "body": [
    { "type": "TextBlock", "text": "Request leave", "weight": "Bolder", "size": "Medium", "wrap": true },
    { "type": "Input.ChoiceSet", "id": "leaveType", "label": "Leave type", "isRequired": true,
      "errorMessage": "Choose a leave type",
      "choices": [ { "title": "Annual", "value": "annual" }, { "title": "Sick", "value": "sick" } ] },
    { "type": "Input.Date", "id": "startDate", "label": "First day", "isRequired": true },
    { "type": "Input.Number", "id": "days", "label": "Number of days", "min": 0.5, "max": 30 }
  ],
  "actions": [ { "type": "Action.Submit", "title": "Submit request" } ]
}`, notes: [[4, "Design to 1.5 so Teams renders it."], [6, "`wrap: true` stops long text being cut off."], [7, "`id` becomes the output variable `Topic.leaveType`."], [10, "Input.Date returns `YYYY-MM-DD`."], [13, "Action.Submit sends every input value back to the topic."]] },
    { t: "Formula card: dynamic confirmation (Power Fx)", lang: "powerfx", src: `{
  type: "AdaptiveCard",
  version: "1.5",
  body: [
    { type: "TextBlock", text: "Leave request for " & System.User.DisplayName, weight: "Bolder", wrap: true },
    { type: "FactSet", facts: [
        { title: "Type", value: Topic.leaveType },
        { title: "Starts", value: Text(DateValue(Topic.startDate), DateTimeFormat.LongDate) },
        { title: "Days", value: Text(Topic.days) } ] }
  ]
}`, notes: [[1, "A Formula card is a Power Fx **record**, so keys aren't quoted and values can be expressions."], [5, "Concatenate variables into text."], [8, "Convert the `YYYY-MM-DD` string to a date, then format it."], [9, "FactSet values must be text, so convert numbers with `Text()`."]] }
  ],
  portal: [{ t: "Add an interactive card", path: "Topic > + > Ask with adaptive card", steps: ["Open the card editor (designer) or paste JSON; set version 1.5.", "Give each input a descriptive **id**; mark required inputs.", "Need variables? In the node properties switch **JSON card** to **Formula card** and use Power Fx.", "Check the node's output variables (one per input id).", "Add a **Condition** to validate values, then use them (tool call, message)."] }],
  ex: { q: "A card for room booking must list only the rooms available at the chosen site, returned by a tool as `Topic.Rooms` (a table with name and id).", steps: ["Static JSON can't read a variable.", "Switch the node to a Formula card.", "Build choices from the table: `ForAll(Topic.Rooms, { title: ThisRecord.name, value: ThisRecord.id })`."], a: "Use a **Formula card**; set the ChoiceSet's `choices` to `ForAll(Topic.Rooms, {title: ThisRecord.name, value: ThisRecord.id})`; the selection returns in `Topic.<inputId>` as the room id." },
  fade: { q: "A card works in the test pane and web chat but shows an error in Teams.", steps: ["The test pane renders 1.6; Teams renders up to 1.5.", { ask: "What do you check first?", a: "The card's `version` and any element or property introduced after 1.5 (and `Action.Execute`)." }, { ask: "What's the durable fix?", a: "Set version 1.5, replace unsupported features, and test in the Teams channel itself." }] },
  traps: [
    ["Relying on `isRequired` alone.", "Some channels still send blanks: add a Condition after the card."],
    ["Using variables inside a JSON card.", "JSON cards are static; use a Formula card for dynamic values."],
    ["Trusting the test pane for Teams rendering.", "Test pane = 1.6; Teams = 1.5."],
    ["Using Action.Execute on the web channel.", "Not supported there; use Action.Submit."],
    ["Generic input IDs like `input1`.", "IDs become variable names; use descriptive camelCase."]
  ],
  disc: [
    ["Card or plain questions?", "Cards suit several related inputs or structured choices (forms, approvals, summaries). Plain questions suit one value, voice channels, or when you want natural language extraction by entities."],
    ["How do you keep cards accessible?", "Labels on inputs, altText on images, readable text sizes, no colour-only meaning, and a text summary in the message for channels or users that can't use cards."]
  ],
  teach: { prompt: "Explain how an Ask with adaptive card node turns a user's form into variables, and how you make the card dynamic and Teams-safe.", rubric: ["Input ids → output variables", "Action.Submit sends values", "Validate with a Condition", "Formula card for variables/dynamic choices", "Design to schema 1.5; Action.Submit not Execute"], model: "Each input has an id, and after Action.Submit the node creates matching output variables such as Topic.leaveType, which I validate with a Condition because blanks can slip through. For dynamic content I switch from a JSON card to a Formula card and build values and choice lists with Power Fx. I design to schema 1.5 and use Action.Submit so the card works in Teams, and I test in the real channel." },
  qa: [["Where does input `days` land?", "`Topic.days`."], ["Teams max schema?", "**1.5**."], ["Dynamic values in a card?", "**Formula card** (Power Fx)."], ["Input.Date format?", "`YYYY-MM-DD`."], ["Submit action to use on web?", "**Action.Submit**."], ["Label/value list element?", "**FactSet**."]],
  quiz: [
    { t: "drop", q: "Complete the card so it works in Teams and returns the user's choice in `Topic.priority`.", code: `{
  "type": "AdaptiveCard",
  "version": "{{0}}",
  "body": [ { "type": "{{1}}", "id": "{{2}}", "label": "Priority",
      "choices": [ { "title": "High", "value": "high" }, { "title": "Low", "value": "low" } ] } ],
  "actions": [ { "type": "{{3}}", "title": "Send" } ]
}`, blanks: [{ o: ["1.5", "1.6", "2.0"], a: 0 }, { o: ["Input.ChoiceSet", "FactSet", "TextBlock"], a: 0 }, { o: ["priority", "Topic.priority", "input1"], a: 0 }, { o: ["Action.Submit", "Action.Execute", "Action.OpenUrl"], a: 0 }], e: "Version 1.5 for Teams; ChoiceSet for options; the id (without prefix) becomes Topic.priority; Action.Submit sends values.", tp: "Card JSON" },
    { q: "The list of choices on a card must come from `Topic.Products`, a table returned by a tool. What should you do?", o: ["Paste the products into the JSON", "Switch the node to a Formula card and build `choices` with Power Fx", "Use quick replies instead", "Raise the schema version to 1.6"], a: 1, e: "Formula cards can read variables and build choices from a table.", tp: "Formula cards" },
    { t: "yn", q: "Evaluate each statement about adaptive cards in Copilot Studio.", s: [["Marking an input required guarantees no blank value reaches the topic in every channel.", false], ["The test pane can render cards that Teams can't.", true], ["Each input id in an Ask with adaptive card node creates an output variable.", true]], e: "Validate blanks with a Condition; the test pane renders 1.6; ids create outputs.", tp: "Card behaviour" },
    { t: "match", q: "Match each card element to its purpose.", pairs: [["Label/value pairs such as Status: Shipped", "FactSet"], ["Side-by-side layout of photo and details", "ColumnSet"], ["Pick one option from a list", "Input.ChoiceSet"], ["Send inputs back to the topic", "Action.Submit"]], extra: ["Action.Execute"], e: "FactSet for facts; ColumnSet for layout; ChoiceSet for options; Submit sends inputs.", tp: "Card elements" },
    { q: "An Input.Time field returns its value in which format?", o: ["HH:MM", "Unix timestamp", "ISO date-time with timezone", "Minutes since midnight"], a: 0, e: "Input.Time returns HH:MM; Input.Date returns YYYY-MM-DD.", tp: "Inputs" },
    { t: "ms", q: "A support agent shows a card in Teams and web chat. Which TWO choices keep it working in both?", o: ["Set version 1.5", "Use Action.Submit for the button", "Use Action.Execute for the button", "Set version 1.6", "Remove all labels"], a: [0, 1], e: "1.5 and Action.Submit work across both channels.", tp: "Channels" }
  ],
  src: [["Adaptive Cards overview (Copilot Studio)", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/adaptive-cards-overview"], ["Ask with Adaptive Cards", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/authoring-ask-with-adaptive-card"], ["Adaptive Cards designer", "https://adaptivecards.microsoft.com/designer"], ["Agent Academy: adaptive cards mission", "https://microsoft.github.io/agent-academy/recruit/08-add-adaptive-card/"]]
},
{
  id: "c03", d: "d1", t: "Advanced responses: generative answers, prompts, HTTP, tools in topics", min: 95,
  hook: "This is the busiest skill group in D1: generative answers nodes, custom knowledge, custom prompts, Send HTTP request and tools inside topics. Each solves a different problem, and the exam gives you scenarios where only one fits.",
  pre: { q: "A topic must classify a customer complaint into category and urgency, returning JSON the topic can branch on. Generative answers node or a prompt?", a: "A **prompt** (custom prompt tool): it runs your instructions on input you pass (the complaint) and can return structured JSON. Generative answers is for answering questions from knowledge, with citations." },
  story: [
    "Asha's agent now handles the common requests, but four awkward ones remain. First: inside the *Warranty* topic, the agent must answer questions **only** from the warranty PDFs, not from everything the agent knows. She adds a **generative answers** node to that topic and gives it its own data sources; node-level sources beat the agent's general knowledge for that step. Custom instructions tell it to answer in three sentences and cite the document.",
    "Second: product manuals live in a search API owned by another team. Generative answers can still summarise them through **custom data**: an HTTP call fetches results, a **Set variable** builds a table with `Content`, `ContentLocation` and `Title`, and the node summarises it with citations. Only the **first three** records are used, so Asha sorts by relevance at the source.",
    "Third: complaints need a category and urgency. She builds a **prompt** in prompt builder with an input variable `{complaintText}`, instructions, and **JSON output**. The default model is a small fast one; for tricky legal complaints she tries a reasoning model, and the data team connects a model from the **Foundry model catalog**. In the topic, a *Add a tool > prompt* node maps the input and saves the output.",
    "Fourth: a carrier API needs one GET call with a header. No connector exists and nobody else needs it, so she uses **Send HTTP request**: URL built with Power Fx, the API key read from a secret **environment variable**, response schema from sample JSON, and *Continue on error* so she can check the status code and offer a friendly fallback instead of the On Error topic.",
    "At the end she has a rule of thumb taped to her screen: *answer from knowledge → generative answers; transform or classify text → prompt; one raw API call → HTTP request; a governed reusable action → connector or flow tool.*"
  ],
  breaks: "These are building blocks, not silos. A topic can call HTTP, feed the result to custom data, summarise with generative answers, then classify the answer with a prompt. The exam picks one block per question, but real topics chain them.",
  dia: [
    { type: "tree", cap: "Which advanced response?", root: { q: "What does this step need to do?", c: [["Answer a question from documents or sites, with citations", { q: "Where's the content?", c: [["Agent knowledge or selected sources", "Generative answers node (node-level sources)"], ["Your own API or search results", "Generative answers + custom data (Content, ContentLocation, Title)"]] }], ["Transform, classify or extract from text you already have", "Prompt tool (prompt builder; text or JSON output; choice of model)"], ["Call one API endpoint once", "Send HTTP request node"], ["Run a governed, reusable action", "Connector, REST API or agent flow tool via Add a tool"]] } },
    { type: "flow", cap: "Custom data pattern", steps: [["HTTP request", "search your API with the user's question"], ["Set variable", "ForAll → table of Content, ContentLocation, Title (top 3)"], ["Generative answers", "Custom data = the table; custom instructions"], ["Answer + citations", "ContentLocation becomes the citation link"]] }
  ],
  keys: [
    "**Generative answers node** (Add node > Advanced > Generative answers): input usually `System.Activity.Text`; data sources set **on the node** apply to that node (agent-level knowledge is used when the node has none); can save the answer to a variable; per-node **content moderation** and **custom instructions** (tone, length, scope; can include variables).",
    "Sources for generative answers: public websites (Bing), SharePoint, uploaded documents, Dataverse, Azure AI Search (and Azure OpenAI on your data until it retires on 14 Oct 2026), Bing Custom Search, AI general knowledge, and **custom data**.",
    "**Custom data**: a Power Fx table with `Content` (required), `ContentLocation` (URL for citations) and `Title`. Only the **first 3** records are used, so rank at the source.",
    "No answer found → the node produces nothing; add a **Condition** (`IsBlank(Topic.Answer)`) with a fallback such as escalation.",
    "**Conversational boosting** system topic = agent-wide fallback to generative answers under **classic** orchestration; generative orchestration searches knowledge on its own.",
    "**Prompts** (Tools > Add a tool > New tool > Prompt): instructions + input variables (text, and files/images where supported) + optional knowledge; output **text or JSON**; choose a model (small/default, general, reasoning) or connect a **Foundry model** deployment; test in the builder; use in topics with input mapping and an output variable.",
    "Prompt vs generative answers: prompt = do *a task* on given input (classify, extract, rewrite); generative answers = *answer a question* from knowledge with citations.",
    "**Send HTTP request**: method (GET, POST, PUT, PATCH, DELETE), URL (static or Power Fx), headers (no hard-coded secrets: use environment variables, secret type in Azure Key Vault), body (none, JSON, raw), response type with schema **from sample data**, timeout (default 30,000 ms).",
    "HTTP error handling: default **Raise an error** (goes to On Error) or **Continue on error** (save status code and error body to variables, then branch).",
    "**Tools in topics** (Add node > Add a tool): connectors, custom connectors, flows, prompts, REST API tools. Map inputs (variables, Power Fx, fixed values) and save outputs; choose credentials (end user or maker)."
  ],
  cmp: [
    { cap: "Pick the right advanced response", head: ["Need", "Use", "Not this"], rows: [
      ["Answer from the warranty PDFs only, with citations", "Generative answers node with node-level sources", "Prompt (no retrieval by default)"],
      ["Summarise results from your own search API", "Generative answers + custom data", "HTTP node alone (no summary)"],
      ["Return {category, urgency} JSON for a complaint", "Prompt tool with JSON output", "Generative answers"],
      ["One GET to a partner API, used once", "Send HTTP request", "New custom connector"],
      ["Create a CRM case (shared, governed)", "Connector or flow tool in the topic", "HTTP node with a hard-coded key"]] },
    { cap: "Send HTTP request: error handling", head: ["Setting", "What happens on failure", "Use when"], rows: [["Raise an error (default)", "On Error topic runs", "Failure should stop the topic"], ["Continue on error", "Status code and error body saved to variables; topic continues", "You want a custom fallback (retry, alternative, apology)"]] }
  ],
  code: [
    { t: "Custom data for generative answers (Power Fx, Set variable)", lang: "powerfx", src: `// Topic.SearchResults came from a Send HTTP request node (Record with a results table)
ForAll(
    FirstN(Topic.SearchResults.results, 3),
    {
        Content: ThisRecord.snippet,
        ContentLocation: ThisRecord.url,
        Title: ThisRecord.title
    }
)`, notes: [[3, "Only the first 3 records are used, so take the best 3 yourself."], [5, "`Content` is required: the text the model reads."], [6, "`ContentLocation` becomes the citation link."], [7, "`Title` labels the citation."]] },
    { t: "Prompt for structured classification (prompt builder)", lang: "text", src: `You triage customer complaints for Contoso Retail.

Complaint: {complaintText}

Return only JSON with this shape:
{"category": "delivery | product | billing | other",
 "urgency": "low | medium | high",
 "summary": "at most 20 words"}

Rules: urgency is high if the customer mentions injury, legal action or a payment taken twice.`, notes: [[3, "`{complaintText}` is an input variable you map from the topic."], [5, "Choose **JSON** output so the topic gets typed fields to branch on."], [10, "Explicit rules make outputs consistent; test them in the prompt builder."]] },
    { t: "Send HTTP request node settings", lang: "http", src: `GET https://api.carrier.example/v2/shipments/{Topic.TrackingNumber}
x-api-key: {Env.cr5_CarrierApiKey}
Accept: application/json

# Response data type: From sample data -> Topic.Shipment (record)
# Error handling: Continue on error -> Topic.StatusCode, Topic.ErrorBody
# Request timeout: 30000 ms (default)`, notes: [[1, "The URL is a Power Fx expression in the node: `\"https://.../shipments/\" & Topic.TrackingNumber`."], [2, "Read the key from a **secret environment variable** (Key Vault), never hard-code it."], [5, "Paste a sample response to generate the schema; fields become dot-accessible."], [6, "Continue on error lets you branch on the status code instead of jumping to On Error."]] }
  ],
  portal: [
    { t: "Add a generative answers node to a topic", path: "Topic > + > Advanced > Generative answers", steps: ["Input: `System.Activity.Text` (or a rewritten question variable).", "Data sources > Edit: choose the sources for this node (e.g., the warranty files only) or Custom data.", "Optional: custom instructions, content moderation level, save the answer to a variable.", "Add a Condition after the node for when no answer is found."] },
    { t: "Create a prompt and use it in a topic", path: "Tools > Add a tool > New tool > Prompt", steps: ["Write instructions; insert input variables; optionally add knowledge.", "Pick the model (or connect a Foundry model deployment); choose text or JSON output.", "Test with sample inputs; save.", "In a topic: + > Add a tool > the prompt; map inputs; store the output; branch on it."] }
  ],
  ex: { q: "In a *Product help* topic, answers must come from the manufacturer's manuals API (no connector), cite the manual page, and fall back to a person if nothing is found.", steps: ["No connector and one call → Send HTTP request (key in a secret environment variable).", "Summarise with citations → generative answers with **custom data** built from the top 3 results.", "No answer → Condition on the answer variable → Escalate."], a: "HTTP request (Continue on error) → Set variable with `ForAll(FirstN(results,3), {Content, ContentLocation, Title})` → **Generative answers** with Custom data and instructions to cite → Condition `IsBlank(Topic.Answer)` → transfer to a person." },
  fade: { q: "Every message in a *Claims* topic must be checked for whether it mentions a policy number, and the number extracted.", steps: ["This is extraction from text you already have, not a knowledge question.", { ask: "Which component?", a: "A **prompt** with `{messageText}` input and JSON output `{hasPolicyNumber, policyNumber}`." }, { ask: "How does the topic use it?", a: "Add a tool > the prompt, map `System.Activity.Text`, save output, then Condition on `hasPolicyNumber`." }] },

    ["HTTP node or REST API tool for the same API?", "HTTP node for a single call at a fixed step in one topic. REST API tool when the agent (orchestrator) should call several operations flexibly with proper auth and descriptions, still only within Copilot Studio."]

  teach: { prompt: "Explain when to use a generative answers node, custom data, a prompt and a Send HTTP request node.", rubric: ["Generative answers: knowledge Q&A with citations; node-level sources", "Custom data: table Content/ContentLocation/Title, first 3", "Prompt: transform/classify/extract, text or JSON, model choice/Foundry", "HTTP: single call, secrets in env vars, schema from sample, error handling"], model: "A generative answers node answers a question from knowledge with citations, using sources set on that node. If the content comes from my own API, I build custom data: a table with Content, ContentLocation and Title, and only the first three rows are used. A prompt is for transforming text I already have: classify, extract, rewrite, with JSON output and a model I choose, including Foundry models. Send HTTP request makes one API call from a topic, with secrets in environment variables, a schema from sample data and either raise-an-error or continue-on-error handling." },
  qa: [["Custom data columns?", "`Content` (required), `ContentLocation`, `Title`."], ["How many custom data records are used?", "The first **3**."], ["Default HTTP error behaviour?", "**Raise an error** → On Error topic."], ["Default HTTP timeout?", "**30,000 ms**."], ["Where to keep an API key for HTTP?", "Secret environment variable (Azure Key Vault)."], ["Prompt output types?", "Text or **JSON**."], ["Agent-wide fallback under classic orchestration?", "**Conversational boosting** topic."]],
  quiz: [

    { t: "match", q: "Match each requirement to the component.", pairs: [["Extract invoice number and amount from a pasted email as JSON", "Prompt tool"], ["Summarise top results from your search API with citations", "Generative answers with custom data"], ["Call a partner's REST endpoint once, inside one topic", "Send HTTP request node"], ["Answer questions from the HR SharePoint site", "Generative answers / knowledge"]], extra: ["Adaptive card"], e: "Prompts transform text; custom data summarises your results; HTTP for one call; knowledge for Q&A.", tp: "Component choice" },

    { t: "yn", q: "Evaluate each statement about Send HTTP request.", s: [["The default error behaviour sends the conversation to the On Error topic.", true], ["You can save the status code and continue the topic by choosing Continue on error.", true], ["Hard-coding the API key as a literal value in the node's header is the recommended approach.", false]], e: "Raise an error is default; Continue on error captures details; secrets belong in environment variables (Key Vault) or connectors.", tp: "HTTP" },
