er, status, payload, headers=()):\n    body = json.dumps(payload).encode()\n    handler.send_response(status)\n    handler.send_header(\"Content-Type\", \"application/json\")\n    handler.send_header(\"Content-Length\", str(len(body)))\n    for name, value in headers:\n        handler.send_header(name, value)\n    handler.end_headers()\n    handler.wfile.write(body)\n\nclass StoreHandler(BaseHTTPRequestHandler):\n    def log_message(self, *args):                   # keep the output quiet\n        pass\n\n    def do_POST(self):\n        req = json.loads(self.rfile.read(int(self.headers[\"Content-Length\"])))\n        if self.path == \"/take\":\n            ok, retry_after = store.take(req[\"key\"], req[\"capacity\"], req[\"per_sec\"], time.monotonic())\n            send_json(self, 200, {\"ok\": ok, \"retry_after\": retry_after})\n        elif self.path == \"/get\":\n            with store.lock:\n                value = store.data.get(req[\"key\"], req[\"default\"])\n            send_json(self, 200, {\"value\": value})\n        elif self.path == \"/set\":\n            with store.lock:\n                store.data[req[\"key\"]] = req[\"value\"]\n            send_json(self, 200, {})\n        else:\n            send_json(self, 404, {})\n\ndef call_store(port, path, payload):\n    req = urllib.request.Request(f\"http://127.0.0.1:{port}{path}\", json.dumps(payload).encode(),\n                                 {\"Content-Type\": \"application/json\"})\n    with urllib.request.urlopen(req) as res:\n        return json.loads(res.read())\n\ndef make_api(store_port):\n    class ApiHandler(BaseHTTPRequestHandler):\n        def log_message(self, *args):\n            pass\n\n        def do_GET(self):\n            client = self.headers.get(\"X-Api-Key\", \"anonymous\")\n            if self.path == \"/hello\":               # the safe way: one atomic call to the store\n                answer = call_store(store_port, \"/take\", {\"key\": client, \"capacity\": CAPACITY, \"per_sec\": PER_SEC})\n                ok, retry_after = answer[\"ok\"], answer[\"retry_after\"]\n            elif self.path == \"/hello-racy\":        # the unsafe way: read, think, then write back\n                tokens = call_store(store_port, \"/get\", {\"key\": client, \"default\": CAPACITY})[\"value\"]\n                time.sleep(0.02)                    # other servers read the same count meanwhile\n                ok, retry_after = tokens >= 1, 100\n                if ok:\n                    call_store(store_port, \"/set\", {\"key\": client, \"value\": tokens - 1})\n            else:\n                return send_json(self, 404, {})\n            if ok:\n                send_json(self, 200, {\"hello\": client})\n            else:\n                send_json(self, 429, {\"error\": \"rate limited\"}, [(\"Retry-After\", str(retry_after))])\n    return ApiHandler\n\ndef start(handler):\n    server = ThreadingHTTPServer((\"127.0.0.1\", 0), handler)\n    threading.Thread(target=server.serve_forever, daemon=True).start()\n    return server\n\nstore_server = start(StoreHandler)\nstore_port = store_server.server_address[1]\napis = [start(make_api(store_port)) for _ in range(3)]\n\ndef hit(i, path, key):\n    port = apis[i % 3].server_address[1]            # spread the client's requests over the three servers\n    req = urllib.request.Request(f\"http://127.0.0.1:{port}{path}\", headers={\"X-Api-Key\": key})\n    try:\n        with urllib.request.urlopen(req) as res:\n            return res.status, None\n    except urllib.error.HTTPError as err:\n        return err.code, err.headers.get(\"Retry-After\")\n\nwith ThreadPoolExecutor(max_workers=30) as pool:\n    atomic = list(pool.map(lambda i: hit(i, \"/hello\", \"tara\"), range(30)))\n    racy = list(pool.map(lambda i: hit(i, \"/hello-racy\", \"ben\"), range(30)))\n\nallowed = sum(1 for status, _ in atomic if status == 200)\nrejected = [retry for status, retry in atomic if status == 429]\nracy_allowed = sum(1 for status, _ in racy if status == 200)\nprint(f\"atomic take: {allowed} of 30 allowed, {len(rejected)} got 429 with a Retry-After header\")\nprint(f\"GET, then SET: {'more than 10' if racy_allowed > 10 else 'only ' + str(racy_allowed)} of 30 allowed\")\nprint(f\"(racy run: {racy_allowed} allowed)\", file=sys.stderr)\nassert allowed == 10 and len(rejected) == 20 and all(r is not None and int(r) > 0 for r in rejected)\nassert racy_allowed > 10\nfor server in apis + [store_server]:\n    server.shutdown()\nprint(\"limiter lab OK\")\n","out":"atomic take: 10 of 30 allowed, 20 got 429 with a Retry-After header\nGET, then SET: more than 10 of 30 allowed\nlimiter lab OK\n"},{"lang":"javascript","src":"// One rate limit shared by three API servers: a tiny store service (standing in for Redis) and three API servers.\nconst http = require(\"node:http\");\n\nconst CAPACITY = 10, PER_SEC = 0.01;                // 10 requests, then one more every 100 seconds\n\nconst data = new Map();                             // the store's contents\nfunction take(key, capacity, perSec, now) {\n  // refill, check and spend in one synchronous step: Node runs nothing else in between (what a Lua script does in Redis)\n  let [tokens, last] = data.get(key) ?? [capacity, now];\n  tokens = Math.min(capacity, tokens + (now - last) * perSec);\n  if (tokens >= 1) { data.set(key, [tokens - 1, now]); return [true, 0]; }\n  data.set(key, [tokens, now]);\n  return [false, Math.floor((1 - tokens) / perSec) + 1];   // whole seconds until the next token\n}\n\nfunction sendJson(res, status, payload, headers = {}) {\n  const body = JSON.stringify(payload);\n  res.writeHead(status, { \"Content-Type\": \"application/json\", \"Content-Length\": Buffer.byteLength(body), ...headers });\n  res.end(body);\n}\n\nfunction readJson(req) {\n  return new Promise(resolve => {\n    let raw = \"\";\n    req.on(\"data\", chunk => { raw += chunk; });\n    req.on(\"end\", () => resolve(raw ? JSON.parse(raw) : {}));\n  });\n}\n\nconst storeServer = http.createServer(async (req, res) => {\n  const body = await readJson(req);\n  if (req.url === \"/take\") {\n    const [ok, retryAfter] = take(body.key, body.capacity, body.per_sec, performance.now() / 1000);\n    sendJson(res, 200, { ok, retry_after: retryAfter });\n  } else if (req.url === \"/get\") {\n    sendJson(res, 200, { value: data.has(body.key) ? data.get(body.key) : body.default });\n  } else if (req.url === \"/set\") {\n    data.set(body.key, body.value);\n    sendJson(res, 200, {});\n  } else sendJson(res, 404, {});\n});\n\nasync function callStore(port, path, payload) {\n  const res = await fetch(`http://127.0.0.1:${port}${path}`, { method: \"POST\", body: JSON.stringify(payload) });\n  return res.json();\n}\n\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\n\nfunction makeApi(storePort) {\n  return http.createServer(async (req, res) => {\n    const client = req.headers[\"x-api-key\"] ?? \"anonymous\";\n    let ok, retryAfter;\n    if (req.url === \"/hello\") {                     // the safe way: one atomic call to the store\n      const answer = await callStore(storePort, \"/take\", { key: client, capacity: CAPACITY, per_sec: PER_SEC });\n      ok = answer.ok; retryAfter = answer.retry_after;\n    } else if (req.url === \"/hello-racy\") {         // the unsafe way: read, think, then write back\n      const tokens = (await callStore(storePort, \"/get\", { key: client, default: CAPACITY })).value;\n      await sleep(20);                              // other servers read the same count meanwhile\n      ok = tokens >= 1; retryAfter = 100;\n      if (ok) await callStore(storePort, \"/set\", { key: client, value: tokens - 1 });\n    } else return sendJson(res, 404, {});\n    if (ok) sendJson(res, 200, { hello: client });\n    else sendJson(res, 429, { error: \"rate limited\" }, { \"Retry-After\": String(retryAfter) });\n  });\n}\n\nconst listen = server => new Promise(resolve => server.listen(0, \"127.0.0.1\", () => resolve(server.address().port)));\n\n(async () => {\n  const storePort = await listen(storeServer);\n  const apis = [makeApi(storePort), makeApi(storePort), makeApi(storePort)];\n  const ports = await Promise.all(apis.map(listen));\n  const hit = async (i, path, key) => {             // spread the client's requests over the three servers\n    const res = await fetch(`http://127.0.0.1:${ports[i % 3]}${path}`, { headers: { \"X-Api-Key\": key } });\n    await res.text();\n    return [res.status, res.headers.get(\"retry-after\")];\n  };\n  const atomic = await Promise.all(Array.from({ length: 30 }, (_, i) => hit(i, \"/hello\", \"tara\")));\n  const racy = await Promise.all(Array.from({ length: 30 }, (_, i) => hit(i, \"/hello-racy\", \"ben\")));\n\n  const allowed = atomic.filter(([status]) => status === 200).length;\n  const rejected = atomic.filter(([status]) => status === 429).map(([, retry]) => retry);\n  const racyAllowed = racy.filter(([status]) => status === 200).length;\n  console.log(`atomic take: ${allowed} of 30 allowed, ${rejected.length} got 429 with a Retry-After header`);\n  console.log(`GET, then SET: ${racyAllowed > 10 ? \"more than 10\" : \"only \" + racyAllowed} of 30 allowed`);\n  console.error(`(racy run: ${racyAllowed} allowed)`);\n  if (allowed !== 10 || rejected.length !== 20 || !rejected.every(r => r !== null && Number(r) > 0)) throw new Error(\"atomic limit\");\n  if (racyAllowed <= 10) throw new Error(\"the racy version should over-admit\");\n  console.log(\"limiter lab OK\");\n  process.exit(0);                                  // close the servers and any kept-alive connections\n})();\n","out":"atomic take: 10 of 30 allowed, 20 got 429 with a Retry-After header\nGET, then SET: more than 10 of 30 allowed\nlimiter lab OK\n"}]},"breakit":["Remove the lock from the Python store and call /take from 100 threads at once: does the limit still hold?","Give each API server its own in-memory bucket of 10, and count what one client gets across the three.","Stop the store halfway through and decide: fail open (allow everything) or fail closed (reject everything)?"]},{"id":"lab-observe","t":"Trace a request through two services, and measure an SLO","min":75,"mods":["m07","m09"],"goal":"Run a front service that calls an inventory service over HTTP, passing a W3C traceparent header. Record a span and a structured JSON log line for every request in both services, serve a Prometheus-style latency histogram on /metrics, then compute the SLI from the buckets and check that every trace joins up.","pre":["Python 3.12+ and Node.js 22+","Read modules 7 and 9"],"steps":["Write parse_traceparent(header): split 00-<trace id>-<span id>-01 into its parts, or start a new trace when there's no header.","In each service, create a span id, send 00-<trace id>-<your span id>-01 on the next call, and on the way out record the span (trace, span, parent, name, ms) and a JSON log line with the trace id.","Make every tenth inventory lookup take 300 ms (a cache miss) and the rest 5 ms. Count the front's latencies in buckets of 50, 100, 250, 500 and 1,000 ms plus +Inf, and serve them in the Prometheus text format on /metrics.","Send 50 requests, then read /metrics and compute the share within 250 ms from the cumulative buckets.","Check that there are 50 traces, each with two spans where the inventory span's parent is the front span, and that every log line carries a trace id."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import json, os, threading, time, urllib.request\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nSPANS, LOGS, LOCK = [], [], threading.Lock()\nBUCKETS = [50, 100, 250, 500, 1000]                 # +Inf is implied\n\ndef parse_traceparent(header):\n    ...                                             # TODO: (trace id, parent span id), or a new trace id and None\n\nclass Inventory(BaseHTTPRequestHandler):\n    def do_GET(self): ...                           # TODO: sleep 300 ms for every tenth n, else 5 ms; record a span and a log\n\ndef make_front(inventory_port):\n    class Front(BaseHTTPRequestHandler):\n        def do_GET(self): ...                       # TODO: /metrics, or /buy: call inventory with a traceparent, observe the latency\n    return Front\n"},{"lang":"javascript","src":"const http = require(\"node:http\");\nconst { randomBytes } = require(\"node:crypto\");\n\nconst SPANS = [], LOGS = [];\nconst BUCKETS = [50, 100, 250, 500, 1000];          // +Inf is implied\n\nfunction parseTraceparent(header) { /* TODO: [trace id, parent span id], or a new trace id and null */ }\n\nconst inventory = http.createServer(async (req, res) => { /* TODO: slow every tenth n; record a span and a log */ });\nfunction makeFront(inventoryPort) {\n  return http.createServer(async (req, res) => { /* TODO: /metrics, or /buy with a traceparent */ });\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"Two services, one trace: traceparent propagation, spans, structured logs and a Prometheus-style latency histogram.\"\"\"\nimport json, os, threading, time, urllib.request\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nSPANS, LOGS, LOCK = [], [], threading.Lock()        # what a real system would send to a collector\nBUCKETS = [50, 100, 250, 500, 1000]                 # histogram upper bounds in ms; +Inf is implied\ncounts, total = [0] * (len(BUCKETS) + 1), {\"count\": 0, \"sum_ms\": 0.0}\n\ndef new_id(nbytes):\n    return os.urandom(nbytes).hex()\n\ndef parse_traceparent(header):\n    \"\"\"'00-<32 hex trace id>-<16 hex parent span id>-01' -> (trace id, parent span id), or a fresh trace.\"\"\"\n    if header:\n        version, trace_id, parent_id, flags = header.split(\"-\")\n        return trace_id, parent_id\n    return new_id(16), None\n\ndef record(service, name, trace_id, span_id, parent_id, start, status):\n    ms = (time.perf_counter() - start) * 1000\n    with LOCK:\n        SPANS.append({\"trace_id\": trace_id, \"span_id\": span_id, \"parent_id\": parent_id, \"name\": name, \"ms\": ms})\n        LOGS.append(json.dumps({\"level\": \"info\", \"service\": service, \"msg\": name, \"status\": status,\n                                \"trace_id\": trace_id, \"span_id\": span_id, \"ms\": round(ms, 1)}))\n    return ms\n\nclass Inventory(BaseHTTPRequestHandler):\n    def log_message(self, *args):\n        pass\n\n    def do_GET(self):\n        start = time.perf_counter()\n        trace_id, parent_id = parse_traceparent(self.headers.get(\"traceparent\"))\n        span_id = new_id(8)\n        n = int(self.path.split(\"=\")[1])\n        time.sleep(0.3 if n % 10 == 0 else 0.005)   # every tenth lookup misses a cache and is slow\n        body = b'{\"in_stock\": true}'\n        self.send_response(200)\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n        record(\"inventory\", \"GET /stock\", trace_id, span_id, parent_id, start, 200)\n\ndef make_front(inventory_port):\n    class Front(BaseHTTPRequestHandler):\n        def log_message(self, *args):\n            pass\n\n        def do_GET(self):\n            if self.path == \"/metrics\":             # the Prometheus text format, read by a scraper\n                lines, cumulative = [\"# TYPE http_request_duration_ms histogram\"], 0\n                with LOCK:\n                    for bound, c in zip(BUCKETS + [\"+Inf\"], counts):\n                        cumulative += c\n                        lines.append(f'http_request_duration_ms_bucket{{le=\"{bound}\"}} {cumulative}')\n                    lines += [f\"http_request_duration_ms_sum {total['sum_ms']:.1f}\",\n                              f\"http_request_duration_ms_count {total['count']}\"]\n                body = (\"\\n\".join(lines) + \"\\n\").encode()\n            else:\n                start = time.perf_counter()\n                trace_id, parent_id = parse_traceparent(self.headers.get(\"traceparent\"))\n                span_id = new_id(8)\n                n = self.path.split(\"=\")[1]\n                req = urllib.request.Request(f\"http://127.0.0.1:{inventory_port}/stock?n={n}\",\n                                             headers={\"traceparent\": f\"00-{trace_id}-{span_id}-01\"})   # pass the context on\n                with urllib.request.urlopen(req) as res:\n                    res.read()\n                body = b'{\"ordered\": true}'\n                ms = record(\"front\", \"GET /buy\", trace_id, span_id, parent_id, start, 200)\n                with LOCK:                          # observe the latency in the histogram\n                    counts[next((i for i, b in enumerate(BUCKETS) if ms <= b), len(BUCKETS))] += 1\n                    total[\"count\"] += 1\n                    total[\"sum_ms\"] += ms\n            self.send_response(200)\n            self.send_header(\"Content-Length\", str(len(body)))\n            self.end_headers()\n            self.wfile.write(body)\n    return Front\n\ndef start(handler):\n    server = ThreadingHTTPServer((\"127.0.0.1\", 0), handler)\n    threading.Thread(target=server.serve_forever, daemon=True).start()\n    return server\n\ninventory = start(Inventory)\nfront = start(make_front(inventory.server_address[1]))\nfront_url = f\"http://127.0.0.1:{front.server_address[1]}\"\nfor n in range(1, 51):\n    urllib.request.urlopen(f\"{front_url}/buy?n={n}\").read()\n\nmetrics = urllib.request.urlopen(f\"{front_url}/metrics\").read().decode()\nbuckets = {line.split('\"')[1]: int(line.split()[-1]) for line in metrics.splitlines() if line.startswith(\"http_request_duration_ms_bucket\")}\ngood, count = buckets[\"250\"], buckets[\"+Inf\"]        # the SLI straight from the cumulative buckets\ntraces = {}\nfor span in SPANS:\n    traces.setdefault(span[\"trace_id\"], []).append(span)\nlinked = all(len(spans) == 2 and {s[\"parent_id\"] for s in spans} == {None, next(s[\"span_id\"] for s in spans if s[\"name\"] == \"GET /buy\")}\n             for spans in traces.values())\nwith_trace = sum(1 for line in LOGS if json.loads(line).get(\"trace_id\"))\ntenths = good * 1000 // count\nprint(f\"requests: {count} | traces: {len(traces)}, each with 2 spans, the child linked to its parent: {'yes' if linked else 'no'}\")\nprint(f\"SLI from the histogram: {good} of {count} within 250 ms ({tenths // 10}.{tenths % 10}%), so a 99% SLO is \"\n      f\"{'met' if tenths >= 990 else 'missed'}\")\nprint(f\"log lines carrying a trace id: {with_trace} of {len(LOGS)}\")\nassert count == 50 and good == 45 and len(traces) == 50 and linked and with_trace == len(LOGS) == 100\nfront.shutdown()\ninventory.shutdown()\nprint(\"observability lab OK\")\n","out":"requests: 50 | traces: 50, each with 2 spans, the child linked to its parent: yes\nSLI from the histogram: 45 of 50 within 250 ms (90.0%), so a 99% SLO is missed\nlog lines carrying a trace id: 100 of 100\nobservability lab OK\n"},{"lang":"javascript","src":"// Two services, one trace: traceparent propagation, spans, structured logs and a Prometheus-style latency histogram.\nconst http = require(\"node:http\");\nconst { randomBytes } = require(\"node:crypto\");\n\nconst SPANS = [], LOGS = [];                        // what a real system would send to a collector\nconst BUCKETS = [50, 100, 250, 500, 1000];          // histogram upper bounds in ms; +Inf is implied\nconst counts = new Array(BUCKETS.length + 1).fill(0);\nconst total = { count: 0, sumMs: 0 };\n\nconst newId = nbytes => randomBytes(nbytes).toString(\"hex\");\n\nfunction parseTraceparent(header) {\n  // '00-<32 hex trace id>-<16 hex parent span id>-01' -> [trace id, parent span id], or a fresh trace\n  if (header) {\n    const [, traceId, parentId] = header.split(\"-\");\n    return [traceId, parentId];\n  }\n  return [newId(16), null];\n}\n\nfunction record(service, name, traceId, spanId, parentId, start, status) {\n  const ms = performance.now() - start;\n  SPANS.push({ trace_id: traceId, span_id: spanId, parent_id: parentId, name, ms });\n  LOGS.push(JSON.stringify({ level: \"info\", service, msg: name, status, trace_id: traceId, span_id: spanId, ms: Math.round(ms * 10) / 10 }));\n  return ms;\n}\n\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\n\nconst inventory = http.createServer(async (req, res) => {\n  const start = performance.now();\n  const [traceId, parentId] = parseTraceparent(req.headers.traceparent);\n  const spanId = newId(8);\n  const n = Number(req.url.split(\"=\")[1]);\n  await sleep(n % 10 === 0 ? 300 : 5);              // every tenth lookup misses a cache and is slow\n  const body = '{\"in_stock\":true}';\n  res.writeHead(200, { \"Content-Length\": Buffer.byteLength(body) });\n  res.end(body);\n  record(\"inventory\", \"GET /stock\", traceId, spanId, parentId, start, 200);\n});\n\nfunction makeFront(inventoryPort) {\n  return http.createServer(async (req, res) => {\n    let body;\n    if (req.url === \"/metrics\") {                   // the Prometheus text format, read by a scraper\n      const lines = [\"# TYPE http_request_duration_ms histogram\"];\n      let cumulative = 0;\n      [...BUCKETS, \"+Inf\"].forEach((bound, i) => {\n        cumulative += counts[i];\n        lines.push(`http_request_duration_ms_bucket{le=\"${bound}\"} ${cumulative}`);\n      });\n      lines.push(`http_request_duration_ms_sum ${total.sumMs.toFixed(1)}`, `http_request_duration_ms_count ${total.count}`);\n      body = lines.join(\"\\n\") + \"\\n\";\n    } else {\n      const start = performance.now();\n      const [traceId, parentId] = parseTraceparent(req.headers.traceparent);\n      const spanId = newId(8);\n      const n = req.url.split(\"=\")[1];\n      const inv = await fetch(`http://127.0.0.1:${inventoryPort}/stock?n=${n}`,\n                              { headers: { traceparent: `00-${traceId}-${spanId}-01` } });   // pass the context on\n      await inv.text();\n      body = '{\"ordered\":true}';\n      const ms = record(\"front\", \"GET /buy\", traceId, spanId, parentId, start, 200);\n      const i = BUCKETS.findIndex(b => ms <= b);    // observe the latency in the histogram\n      counts[i === -1 ? BUCKETS.length : i]++;\n      total.count++; total.sumMs += ms;\n    }\n    res.writeHead(200, { \"Content-Length\": Buffer.byteLength(body) });\n    res.end(body);\n  });\n}\n\nconst listen = server => new Promise(resolve => server.listen(0, \"127.0.0.1\", () => resolve(server.address().port)));\n\n(async () => {\n  const inventoryPort = await listen(inventory);\n  const frontUrl = `http://127.0.0.1:${await listen(makeFront(inventoryPort))}`;\n  for (let n = 1; n <= 50; n++) await (await fetch(`${frontUrl}/buy?n=${n}`)).text();\n\n  const metrics = await (await fetch(`${frontUrl}/metrics`)).text();\n  const buckets = Object.fromEntries(metrics.split(\"\\n\").filter(l => l.startsWith(\"http_request_duration_ms_bucket\"))\n    .map(l => [l.split('\"')[1], Number(l.split(\" \").at(-1))]));\n  const good = buckets[\"250\"], count = buckets[\"+Inf\"];   // the SLI straight from the cumulative buckets\n  const traces = new Map();\n  for (const span of SPANS) {\n    if (!traces.has(span.trace_id)) traces.set(span.trace_id, []);\n    traces.get(span.trace_id).push(span);\n  }\n  const linked = [...traces.values()].every(spans => {\n    const root = spans.find(s => s.name === \"GET /buy\");\n    const parents = new Set(spans.map(s => s.parent_id));\n    return spans.length === 2 && root && parents.size === 2 && parents.has(null) && parents.has(root.span_id);\n  });\n  const withTrace = LOGS.filter(line => JSON.parse(line).trace_id).length;\n  const tenths = Math.floor(good * 1000 / count);\n  console.log(`requests: ${count} | traces: ${traces.size}, each with 2 spans, the child linked to its parent: ${linked ? \"yes\" : \"no\"}`);\n  console.log(`SLI from the histogram: ${good} of ${count} within 250 ms (${Math.floor(tenths / 10)}.${tenths % 10}%), so a 99% SLO is ` +\n              `${tenths >= 990 ? \"met\" : \"missed\"}`);\n  console.log(`log lines carrying a trace id: ${withTrace} of ${LOGS.length}`);\n  if (count !== 50 || good !== 45 || traces.size !== 50 || !linked || withTrace !== 100 || LOGS.length !== 100) throw new Error(\"observability checks\");\n  console.log(\"observability lab OK\");\n  process.exit(0);\n})();\n","out":"requests: 50 | traces: 50, each with 2 spans, the child linked to its parent: yes\nSLI from the histogram: 45 of 50 within 250 ms (90.0%), so a 99% SLO is missed\nlog lines carrying a trace id: 100 of 100\nobservability lab OK\n"}]},"breakit":["Stop passing the traceparent header: there are now 100 one-span traces, and you can't tell which inventory call belonged to which purchase.","Add the request number as a metric label, and count the time series you've just created.","Move the 250 ms bucket edge to 300 ms and see how the SLI changes."]},{"id":"capstone","capstone":true,"t":"A shared rate limiter and a notification worker, with dashboards","min":1200,"mods":["m04","m05","m06","m07","m09","m10"],"goal":"Build a small, production-shaped system. Three API instances behind a round-robin proxy share one per-client rate limit kept in a Redis-like store, and a notification service queues messages for a worker that retries with backoff, dead-letters what keeps failing and never sends twice. Instrument everything, put the numbers on a dashboard, and write it up as a design doc that someone else reviews.","deliver":["A design doc of two or three pages: requirements, estimates, the API, the data model, a diagram, SLOs and the trade-offs you chose (module 10's routine).","A store service with an atomic token-bucket operation (the limiter lab), or real Redis with a Lua script if you have Docker; three API instances behind a small round-robin proxy, each answering 429 with Retry-After when the shared limit is used up.","POST /notify with an Idempotency-Key, writing to the SQLite queue (the queue lab), and a worker that sends through a fake provider that fails 20% of the time and sometimes hangs: timeouts, retries with backoff and jitter, and a dead-letter state after 5 attempts.","Metrics on /metrics for every service (allowed and limited requests, queue depth, retries, dead letters, latency histograms), a trace id passed on every call and written in every log line, and a dashboard page or script that shows the numbers.","Tests, a load test showing that the limit holds across all three instances, and two failure tests: stop the store, and kill the worker in the middle of a send."],"rubric":["The limit holds exactly across instances under concurrent load, and the doc says whether the API fails open or closed when the store is down, and why.","No notification is sent twice, even when the worker is killed between sending and acknowledging, and poison messages end as dead letters with their error.","SLOs are written down for the API and for notification delivery time, and the dashboard shows them with their burn rates.","Every call has a timeout, retries happen at one layer only, and one trace id links a request's logs across services.","Someone else can run everything from the README, and the write-up says what you'd change for 10 times the traffic."],"steps":["Write the requirements, estimates and SLOs first, and agree the API: GET /hello, limited per API key, and POST /notify.","Build the store and the three API instances behind the proxy, then load-test the limit.","Build the notification queue, the worker and the fake provider; add idempotency keys and the dead-letter state; test with crashes.","Add metrics, structured logs and trace propagation to every service, then the dashboard.","Run the failure tests, write up the results, and have someone review the design doc against module 10's checklist."],"stretch":["Swap the store for real Redis and a Lua script (redis:7 in Docker) and compare the latency.","Add a transactional outbox: the API writes the notification and an outbox row in one transaction, and a relay queues it.","Add per-user notification limits (at most 5 an hour) and quiet hours, and show them on the dashboard.","Run two workers and prove, from the trace ids, that no notification was sent twice."]}],"interview":[{"c":"Consistency","q":"Explain CAP and PACELC, and how you'd use them in a design discussion.","a":"CAP says that when a network partition separates replicas, a system must either refuse some requests to stay consistent or keep answering on both sides and accept that they diverge. PACELC adds the everyday case: even without a partition, you trade latency against consistency, because waiting for other replicas takes time. In a design I use them per feature, not per system: payments and inventory counts choose consistency and accept errors or delays during a partition; likes, feeds and view counts choose availability and low latency, and converge later.","f":["Where does a single-leader database with async replicas sit?","What does the user see when a CP system is partitioned?"]},{"c":"Consistency","q":"What's the difference between linearizability and eventual consistency, and when do you need each?","a":"Linearizability makes the system behave like a single copy: once a write completes, every later read, from any client, sees it. Eventual consistency only promises that replicas converge if writes stop, so reads can be stale for a while. I need linearizability for things like a unique username, a lock or an account balance that must not go negative; elsewhere eventual consistency, often with session guarantees such as read-your-writes, is cheaper and faster."},{"c":"Replication","q":"How can leader failover go wrong, and how do you guard against it?","a":"With asynchronous replication the new leader may be missing the old leader's last writes, so they're lost or conflict when the old leader comes back. If the old leader isn't really dead, just slow or cut off, two leaders can accept writes at once: split brain. Guards: semi-synchronous replication so at least one follower has every write, a consensus-based election, fencing tokens so storage rejects the old leader's writes, and timeouts that aren't so short that a pause triggers failover.","f":["What's a fencing token?"]},{"c":"Replication","q":"How do quorums work in a leaderless store?","a":"Each key lives on N replicas. A write is sent to all of them and succeeds after W acknowledge; a read asks R and takes the newest version. If W + R > N, every read set overlaps the last write's set, so the read sees it; N = 3 with W = R = 2 is common. Replicas that missed writes catch up through read repair and background anti-entropy. The overlap guarantee weakens with sloppy quorums, concurrent writes and failures mid-write, so it's not full linearizability."},{"c":"Partitioning","q":"How would you partition a large table, and what do you do about hot keys?","a":"I pick a partition key from the main access pattern: hash it for an even spread, or use ranges when range scans matter, accepting hot ranges. Routing goes through a lookup service or the client library, and secondary indexes are either local to each partition (queries fan out) or global (writes update another partition). For a hot key, I cache it, split it into sub-keys such as key#0 to key#9 and combine on read, or give it a partition of its own.","f":["Why fixed partitions rather than one per node?"]},{"c":"Partitioning","q":"What is consistent hashing, and why use virtual nodes?","a":"Nodes and keys are hashed onto a ring, and each key belongs to the next node clockwise. Adding or removing a node moves only the keys on its arc, about 1/N of them, instead of almost all keys as with hash mod N. With few nodes the arcs are uneven, so each node takes many points on the ring (virtual nodes): that evens out the load, and a leaving node's keys spread over many others instead of one neighbour."},{"c":"Caching","q":"Write-through, write-back or write-around: how do you choose?","a":"Write-through updates the cache and the database together, so reads right after a write are fresh, at the cost of slower writes; it suits data read soon after it's written. Write-back writes the cache and flushes later, which is fast and batches well but loses unflushed writes if the cache dies, so I keep it for counters and metrics. Write-around writes only the database and drops the cached copy, which suits data rarely re-read soon. In every case I delete rather than update cached values, and guard against the stale-set race."},{"c":"Messaging","q":"Can a message queue give you exactly-once processing?","a":"Not by itself across an unreliable network: an acknowledgement can be lost, so the broker redelivers, which is at-least-once. What you can build is an exactly-once effect: the consumer records each message id in the same transaction as its effect and skips ids it has seen, or makes the effect idempotent by nature. Kafka's transactions give exactly-once from topic to topic, but side effects outside Kafka, such as charging a card, still need idempotency.","f":["What's the difference between at-most-once and at-least-once?"]},{"c":"Messaging","q":"How do you keep events in order, and what breaks ordering?","a":"Order holds within a partition, so I key events by the entity whose order matters, such as the order id, and let one consumer read each partition at a time. Parallel consumers on one queue, retries that requeue at the back, dead-letter queues and producers retrying out of order all break it. Where order matters a lot, consumers should also check version numbers or sequence numbers, so a late event can't overwrite a newer state."},{"c":"Messaging","q":"What is the transactional outbox, and why is it needed?","a":"Writing to the database and publishing to a broker are two writes that can't be made atomic: crash between them and the event is lost, or announced for a change that never committed. With an outbox, the service writes the event into an outbox table in the same transaction as the change; a relay, or change-data-capture on the database log, publishes it afterwards. Delivery is at-least-once, so events carry ids and consumers deduplicate."},{"c":"Resilience","q":"Design a rate limiter for an API that runs on many servers.","a":"Requirements first: limits per API key, say 100 requests a minute with short bursts, checked in about a millisecond, with 429 and Retry-After when exceeded. I'd use a token bucket per client in Redis, as a hash of tokens and the last refill time, updated by a Lua script so the refill, check and spend are atomic across all API servers; keys get a TTL so idle clients disappear. The limiter sits in the gateway, before any work is done. If Redis is unreachable, ordinary APIs fail open and sensitive ones such as logins fail closed. At very high volume, servers can hold a small local allowance and sync in batches.","f":["Token bucket or sliding window?","How do you avoid Redis becoming a single point of failure?"]},{"c":"Resilience","q":"What is a circuit breaker, and how does it differ from a retry?","a":"A retry repeats a failed call in the hope that the failure was brief. A circuit breaker does the opposite when failures persist: after a threshold of failures it opens and fails calls at once, without calling the dependency, for a cool-down; then it lets a trial call through and closes if it succeeds. Retries handle blips; breakers stop a caller from wasting threads and hammering a dependency that's down. They work together, with timeouts on every call and a fallback for when the breaker is open."},{"c":"Architecture","q":"Would you start a new product with microservices or a monolith?","a":"Usually a modular monolith: one deployable with enforced module boundaries, which is simple to build, test and change while the domain is still being discovered. I'd split off services when separate teams start blocking each other's releases, or when a part needs its own scaling or failure isolation, cutting along business capabilities with each service owning its data. Splitting early turns every change into a distributed one: network calls, versioned APIs and no transactions across services."},{"c":"Real time","q":"How would you build the real-time part of a chat app?","a":"Clients hold a WebSocket to a fleet of gateway servers. When a message arrives, the chat service stores it first, with the next sequence number for its conversation, then routes it to the gateways holding the recipients' connections, using a registry or pub/sub, with push notifications for offline devices. Pushes can be lost, so clients fill gaps by sequence number, ignore duplicates, and on reconnect ask for everything after the last number they saw. Presence is a heartbeat with a TTL, so it's always slightly stale.","f":["How do you handle a group with 100,000 members?"]},{"c":"Observability","q":"How do you define SLOs, and what do you do with the error budget?","a":"I pick SLIs that users would notice, as ratios of good events to all events, such as checkout requests that succeed within 500 ms, measured close to the user. The SLO is a target over a window, say 99.9% over 30 days, and the 0.1% left over is the error budget. Alerts page on the budget's burn rate (fast and slow windows), not on CPU. While budget remains we ship; when it's being spent too fast, the agreed policy slows risky releases and moves effort to reliability."},{"c":"Classic designs","q":"Design a news feed.","a":"After agreeing scope and scale, the crux is fan-out. Pushing each post into every follower's precomputed feed (fan-out on write) makes reading a feed one lookup, which suits the usual pattern of far more reads than posts, but one celebrity post would mean millions of writes. So I'd push for ordinary accounts, using queue workers, and merge celebrities' recent posts in at read time from a cache. Feeds keep only a few hundred ids in memory, posts live in a partitioned store, and inactive users' feeds are rebuilt on demand rather than kept up to date.","f":["How would you rank the feed instead of sorting by time?"]},{"c":"Classic designs","q":"Design a notification service.","a":"Callers send a request with the user, a template, data and an idempotency key. The API checks the user's preferences and per-user limits, puts the message on a queue per channel (email, SMS, push) and replies straight away. Workers render the template and call the providers, with timeouts, retries with backoff and jitter, circuit breakers per provider, and a dead-letter queue after a few attempts. The idempotency key, recorded with each send, stops retries from sending twice. I'd monitor queue depth, delivery latency, provider error rates and the dead-letter queue."}],"cheat":[{"t":"Consistency and replication","items":["Linearizable: behaves like one copy, in real time · eventual: replicas converge · session: read-your-writes, monotonic reads","CAP: in a partition, consistency or availability · PACELC: otherwise, latency or consistency","Quorums: W + R > N overlaps the last write · N = 3 → W = R = 2 · read repair and anti-entropy catch up","Async replication: fast writes, lag, failover can lose writes · sync: no loss, slower writes · semi-sync: one follower in step","Failover: detect, elect, fence the old leader (fencing tokens), redirect clients"]},{"t":"Partitioning and caching","items":["Range: scans, but hot ranges · hash: even spread, no range scans · consistent hashing: about 1/N of keys move per node","Hot key: cache it, split it (key#0 to key#9), or give it its own partition","Write-through (fresh, slower writes) · write-back (fast, can lose) · write-around (the first read misses)","Invalidate by deleting; stop the stale-set race with versions, leases or a second delete","Stampedes: single flight · stale-while-revalidate · early refresh · TTL jitter"]},{"t":"Messaging and resilience","items":["Queue: one consumer per message · topic: every group gets every message · Kafka: partitions shared within a group","Ack after processing = at-least-once · exactly-once effect = at-least-once + an idempotent consumer","Order only within a partition: key by entity · dead-letter after N attempts, alert, replay · outbox for DB + event","Token bucket: rate + burst · fixed window: 2× at the boundary · sliding window counter: two counters","Timeouts from p99.9 · retries: transient and idempotent only, backoff + jitter, a budget, one layer · breaker: closed, open, half-open · bulkheads"]},{"t":"Services and real time","items":["Modular monolith first · split by business capability · each service owns its data","A chain multiplies availability and adds latency · fan-out: you wait for the slowest call","Gateway: TLS, auth, limits, routing · BFF: one API per kind of client · discovery: a registry kept current by health checks","Polling (simple, wasteful) · long polling · SSE (server to client, Last-Event-ID) · WebSocket (both ways)","Chat: store first, a sequence number per conversation, fill gaps, catch up on reconnect"]},{"t":"Observability and the interview","items":["Metrics: is it wrong · traces: where · logs: why · RED for services, USE for resources · percentiles, not averages","SLI = good ÷ all · 99.9% over 30 days ≈ 43 min · page at a burn rate of 14.4 for 1 h or 6 for 6 h","Metric labels must have few values; ids go in logs and traces","Routine: requirements → estimates → API → data model → design → deep dives → trade-offs","Classic cruxes: limiter (an atomic shared counter) · feed (fan-out) · chat (ordered, never lost) · notifications (no duplicates)"]}],"glossary":[["Anti-entropy","A background process that compares replicas (often with Merkle trees) and copies over whatever they're missing."],["API gateway","A single entry point in front of services that routes requests and handles TLS, authentication and rate limits."],["At-least-once delivery","A message is redelivered until it's acknowledged, so it may be processed more than once."],["Backend for frontend (BFF)","A backend built for one kind of client, shaping and combining data for exactly what it shows."],["Bulkhead","A separate pool of threads or connections per dependency, so one slow dependency can't use up everything."],["Burn rate","How fast an error budget is being spent, relative to spending it evenly over the SLO window."],["CAP theorem","During a network partition, a system must choose between consistency and availability."],["Cardinality","The number of distinct label combinations a metric has; each is a separate time series."],["Circuit breaker","A wrapper that stops calling a failing dependency for a while, fails fast, then tries one trial call."],["Consistent hashing","Placing nodes and keys on a hash ring so that adding or removing a node moves only about 1/N of the keys."],["Consumer group","Consumers that share a topic's partitions, so each message is processed once per group."],["Dead-letter queue","Where messages go after failing a set number of times, to be inspected and replayed."],["Error budget","The failures an SLO allows over its window: 1 minus the SLO."],["Eventual consistency","Replicas may disagree for a while but converge when writes stop."],["Fan-out on write","Pushing each new post into every follower's precomputed feed when it's written."],["Fencing token","An increasing number issued with a lease, so storage can reject writes from an old leader."],["Hot key","A key that gets far more traffic than others, overloading the partition that holds it."],["Idempotent consumer","A consumer that records processed message ids with their effects, so a redelivery changes nothing."],["Jitter","A random part added to retry delays or TTLs, so that clients or keys don't act in lockstep."],["Leaky bucket","A rate limiter that queues requests and lets them out at a fixed rate."],["Linearizability","The guarantee that a system behaves like a single copy: a completed write is visible to every later read."],["Long polling","The server holds each request open until it has news or a timeout passes."],["PACELC","If there's a partition, choose availability or consistency; else, choose latency or consistency."],["Quorum","The number of replicas (W for writes, R for reads) that must answer for an operation to succeed."],["Read repair","Fixing stale replicas found during a read by writing the newest version back to them."],["Read-your-writes","A session guarantee that a user always sees their own earlier writes."],["Server-Sent Events (SSE)","A long HTTP response over which the server streams events to the client, with automatic reconnection."],["Service discovery","Finding the current addresses of a service's instances, through a registry or a load balancer."],["SLI and SLO","A measured ratio of good events, and the target for it over a time window."],["Span","One timed operation in a trace, with a name, a duration and a parent."],["Split brain","Two nodes both acting as leader and accepting writes, usually after a partition."],["Stale-set race","A slow reader stores an old value in the cache after a writer's invalidation."],["Strangler fig","Replacing a monolith piece by piece behind a routing layer until the old code can go."],["Token bucket","A rate limiter whose tokens refill at a steady rate up to a capacity; each request spends one."],["Trace context","The trace id and parent span id passed between services, in the W3C traceparent header."],["Transactional outbox","Writing an event to an outbox table in the same transaction as the change, for a relay to publish."],["WebSocket","A persistent, two-way connection upgraded from an HTTP request."],["Write-back cache","A cache that acknowledges writes and flushes them to the database later."]],"sourceGroups":[{"t":"Books and papers","items":[["Designing Data-Intensive Applications, 2nd edition (2026)","https://martin.kleppmann.com/2026/03/24/designing-data-intensive-applications-2e.html","A5 R5 D5 · paid, the core book for L2–L4"],["Dynamo: Amazon's highly available key-value store (SOSP 2007)","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","A5 R2 D5 · free"],["Google SRE book","https://sre.google/sre-book/table-of-contents/","A5 R3 D5 · free"],["Google SRE workbook","https://sre.google/workbook/table-of-contents/","A5 R3 D5 · free"]]},{"t":"Official documentation","items":[["Redis docs: data types and scripting","https://redis.io/docs/latest/develop/data-types/","A5 R5 D4 · free"],["Apache Kafka documentation: Design","https://kafka.apache.org/43/design/design/","A5 R5 D5 · free"],["Amazon SQS Developer Guide","https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html","A5 R5 D4 · free"],["MDN: Server-sent events and the WebSocket API","https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events","A5 R5 D4 · free"],["OpenTelemetry documentation","https://opentelemetry.io/docs/","A5 R5 D4 · free"],["W3C Trace Context","https://www.w3.org/TR/trace-context/","A5 R4 D4 · free"],["Python docs: sqlite3","https://docs.python.org/3/library/sqlite3.html","A5 R5 D4 · free"],["Node.js docs: SQLite","https://nodejs.org/api/sqlite.html","A5 R5 D4 · free"]]},{"t":"Engineering write-ups","items":[["AWS Architecture Blog: Exponential backoff and jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/","A5 R3 D4 · free"],["Stripe: Scaling your API with rate limiters","https://stripe.com/blog/rate-limiters","A4 R3 D4 · free"],["Martin Fowler: Microservices, MonolithFirst, CircuitBreaker","https://martinfowler.com/microservices/","A4 R3 D4 · free"],["Jepsen: Consistency models","https://jepsen.io/consistency","A5 R4 D5 · free"]]},{"t":"Practice","items":[["System Design Primer","https://github.com/donnemartin/system-design-primer","A4 R3 D4 · free"]]}],"aiCtx":"The learner is at System Design level L2 Proficient: consistency models (strong, eventual, read-your-writes, CAP and PACELC), replication (leader-follower, multi-leader, leaderless, quorums, replication lag), partitioning (range and hash, consistent hashing, hot    <div id="misTable"></div></div>
  <div class="panel" style="margin-top:14px"><h3>Accuracy by domain (all quizzes and drills)</h3><div class="dbars">${DOM.map(d => { const a = domainAccuracy(d.id); const n = S.dstat[d.id] ? S.dstat[d.id][1] : 0; return `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${a == null ? 0 : Math.round(a * 100)}%;background:${a == null ? "var(--line)" : a >= 0.7 ? "var(--good)" : "var(--bad)"}"></i></div><b>${a == null ? "–" : Math.round(a * 100) + "%"}</b></div><div class="muted small" style="margin:-4px 0 2px">${n} answered</div>`; }).join("")}</div></div>`;

    $("#misTable").innerHTML = ids.length ? `<div class="tbl"><table><thead><tr><th>Where</th><th>Question</th><th class="num">Missed</th><th>Last</th><th>Status</th></tr></thead><tbody>${ids.map(k => { const it = ITEMS[k], x = S.mis[k]; return `<tr><td>${esc(it.src || "")}</td><td>${inl(it.q.length > 160 ? it.q.slice(0, 157) + "…" : it.q)}</td><td class="num">${x.n}</td><td>${esc(fmtDate(x.at))}</td><td>${x.fx ? `<span class="pill ok">fixed ${esc(fmtDate(x.fx))}</span>` : `<span class="pill no">open</span>`}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">No mistakes recorded yet. They appear when you miss a question anywhere in the hub.</p>`;

let CASERUN = null;
RENDER.cases = function () {
  CASERUN = null;
  const v = $("#v-cases");
  v.innerHTML = `<div class="eyebrow">Long scenarios · several questions each</div><h2 class="h-view">Case studies</h2>
  <p class="lede">${inl(H.casesIntro || "Read the scenario tabs first, then answer. Requirements and constraints decide every answer, so keep the scenario open next to the questions. In the real exam each case study is its own section: once you leave it, you can't go back.")}</p>
  <div class="grid2">${(H.cases || []).filter(c => !c.mockOnly).map(c => { const s = S.cases[c.id]; return `<div class="panel"><div class="row between"><h3>${esc(c.title)}</h3>${s && s.pct != null ? `<span class="pill ${s.pct >= 70 ? "ok" : "no"}">${s.pct}%</span>` : ""}</div><p class="small muted" style="margin:.2em 0 .6em">${esc(c.org || "")} · ${c.items.length} questions · about ${c.min} min</p><p class="small">${inl(c.blurb || "")}</p><button type="button" class="btn primary" data-case="${c.id}">${s ? "Retake" : "Start"} case study</button></div>`; }).join("")}</div>`;
  $$("[data-case]", v).forEach(b => b.addEventListener("click", () => openCase(b.dataset.case)));
};
function caseDoc(c, tab) {
  return `<div class="case-tabs" role="tablist">${c.sections.map((s, i) => `<button type="button" data-ct="${i}" aria-pressed="${i === tab}">${esc(s[0])}</button>`).join("")}</div><div class="scenario">${(() => { const s = c.sections[tab]; return Array.isArray(s[1]) ? `<ul>${s[1].map(x => `<li>${inl(x)}</li>`).join("")}</ul>` : paras(s[1]); })()}</div>`;
}
function openCase(id) {
  const c = CASE[id]; if (!c) return;
  if (CURVIEW !== "cases") show("cases");
  const vs = c.items.map(prepItem);
  CASERUN = { c, vs, R: vs.map(() => null), tab: 0, done: false };
  const v = $("#v-cases");
  const paint = () => {
    const X = CASERUN;
    v.innerHTML = `<div class="row between" style="margin-bottom:10px"><div><div class="eyebrow">Case study · ${esc(c.org || "")}</div><h2 class="h-view" style="margin:0">${esc(c.title)}</h2></div><button type="button" class="btn small" id="caseBack">← All case studies</button></div>
    <div class="case-shell"><aside class="panel case-doc" aria-label="Scenario">${caseDoc(c, X.tab)}</aside><div style="min-width:0">
    ${X.vs.map((vv, i) => `<div class="q" data-k="${i}">${X.done ? reviewHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }) : itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) })}</div>`).join("")}
    ${X.done ? `<div class="panel"><b>Score: ${S.cases[c.id].pct}%</b> <span class="muted small">Missed items are in your mistake list.</span><div class="row" style="margin-top:8px"><button type="button" class="btn" id="caseAgain">Retake</button></div></div>` : `<button type="button" class="btn primary" id="caseSubmit">Submit case study</button>`}</div></div>`;
    const bindTabs = () => $$("[data-ct]", v).forEach(b => b.addEventListener("click", () => { X.tab = +b.dataset.ct; $(".case-doc", v).innerHTML = caseDoc(c, X.tab); bindTabs(); }));
    bindTabs();
    $("#caseBack").addEventListener("click", () => RENDER.cases());
    if (!X.done) {
      X.vs.forEach((vv, i) => { const el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); });
      $("#caseSubmit").addEventListener("click", e => {
        const un = X.vs.filter((vv, i) => !isAnswered(vv, X.R[i])).length;
        if (un && !e.currentTarget.dataset.sure) { e.currentTarget.dataset.sure = "1"; e.currentTarget.textContent = `Submit with ${un} unanswered?`; return; }
        let got = 0; X.vs.forEach((vv, i) => { const sc = gradeItem(vv.it, X.R[i]); got += sc; recordAnswer(vv.it, sc, givenText(vv.it, X.R[i])); });
        S.cases[c.id] = { at: today(), pct: pct(got, X.vs.length) }; touch("main"); X.done = true; paint(); window.scrollTo(0, 0);
      });
    } else { $("#caseAgain").addEventListener("click", () => openCase(id)); bindExplain(v); }
  };
  const rebind = i => { const X = CASERUN, vv = X.vs[i], el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); };
  paint(); window.scrollTo(0, 0);
}

  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
