if v not in seen:\n            dfs(v)\n\ndfs(1)\nprint(*order)\n"},{"lang":"javascript","src":"const graph = new Map([[1, [2, 3]], [2, [4]], [3, [4, 5]], [4, [6]], [5, [6]], [6, []]]);\nconst order = [], seen = new Set();\nfunction dfs(u) {\n  seen.add(u);\n  order.push(u);\n  for (const v of graph.get(u)) if (!seen.has(v)) dfs(v);\n}\ndfs(1);\nconsole.log(...order);\n"}]},"o":["1 2 4 6 3 5","1 2 3 4 5 6","1 3 5 6 4 2","6 4 2 5 3 1"],"a":0,"e":"DFS goes 1 → 2 → 4 → 6, backs up to 1, then visits 3 and 5; 4 and 6 are already seen."},{"q":"Every road takes the same time. You need the fewest roads from town A to town Z. Which algorithm?","o":["BFS from A","DFS from A","Sorting the roads by length","Union-find"],"a":0,"e":"With equal costs, BFS's layers give the fewest edges. DFS may find a long route first, and union-find only answers “connected or not”."},{"q":"Which tasks suit DFS well? (choose 3)","t":"ms","o":["Counting connected components","Detecting a cycle","Listing every path through a small maze","The fewest moves in an unweighted maze","Each cell's distance to its nearest exit"],"a":[0,1,2],"e":"The last two are distance questions: BFS and multi-source BFS."},{"q":"Judge each statement.","t":"yn","s":[["An adjacency matrix for 100,000 vertices needs about 10 billion cells.",true],["BFS should mark vertices visited when they're enqueued.",true],["DFS finds the shortest path in an unweighted graph.",false],["A grid can be treated as a graph whose vertices are cells.",true]],"e":"100,000² = 10¹⁰. Mark on enqueue. DFS gives a path, not the shortest. Cells are vertices; neighbouring cells are edges."},{"q":"Put the BFS steps in order.","t":"ord","items":["Put the start in the queue and mark it visited","Take the vertex at the front of the queue","For each unvisited neighbour, mark it visited and add it to the back","Repeat until the queue is empty or the goal is reached"],"e":"Mark-on-enqueue is in step 1 and step 3."},{"q":"Complete the JavaScript island counter (an explicit stack, cells encoded as r × C + c).","t":"drop","lang":"javascript","code":"function numIslands(grid) {\n  const R = grid.length, C = grid[0].length, seen = new Set();\n  let islands = 0;\n  for (let r = 0; r < R; r++)\n    for (let c = 0; c < C; c++) {\n      if (grid[r][c] !== \"1\" || seen.has(r * C + c)) continue;\n      islands++;\n      const stack = [[r, c]];\n      seen.add(r * C + c);\n      while (stack.length) {\n        const [y, x] = stack.{{0}}();\n        for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {\n          const ny = y + dy, nx = x + dx;\n          if (ny < 0 || ny >= R || nx < 0 || nx >= {{1}}) continue;\n          if (grid[ny][nx] === \"1\" && !seen.has(ny * C + nx)) {\n            seen.add({{2}});\n            stack.push([ny, nx]);\n          }\n        }\n      }\n    }\n  return islands;\n}\n","blanks":[{"o":["pop","push","at","peek"],"a":0},{"o":["C","R","nx","grid.length"],"a":0},{"o":["ny * C + nx","ny * R + nx","y * C + x","nx * C + ny"],"a":0}],"e":"Pop from the stack, check the column against C (the number of columns), and mark the neighbour's own key, ny × C + nx, before pushing it."},{"q":"Match each question to the technique.","t":"match","pairs":[["The fewest moves for a knight on a chessboard","BFS"],["Is there any route from A to B at all?","BFS or DFS: either works"],["Every cell's distance to its nearest exit","Multi-source BFS"],["How many separate friend groups are there?","Count connected components"]],"extra":["Binary search"],"e":"Distances need BFS; plain reachability works with either search; groups are components."}],"probs":[["LC 200 · Number of Islands","https://leetcode.com/problems/number-of-islands/","Medium","the code above, from memory; then a BFS version"],["LC 695 · Max Area of Island","https://leetcode.com/problems/max-area-of-island/","Medium","a DFS that returns the island's size"],["LC 133 · Clone Graph","https://leetcode.com/problems/clone-graph/","Medium","BFS or DFS with a map from each node to its copy"],["LC 994 · Rotting Oranges","https://leetcode.com/problems/rotting-oranges/","Medium","multi-source BFS from every rotten orange"],["LC 417 · Pacific Atlantic Water Flow","https://leetcode.com/problems/pacific-atlantic-water-flow/","Medium","search backwards from each ocean's edge"],["LC 130 · Surrounded Regions","https://leetcode.com/problems/surrounded-regions/","Medium","mark the O's connected to the border first"],["LC 1971 · Find if Path Exists in Graph","https://leetcode.com/problems/find-if-path-exists-in-graph/","Easy","BFS, DFS or union-find"],["LC 841 · Keys and Rooms","https://leetcode.com/problems/keys-and-rooms/","Medium","DFS from room 0"],["LC 1091 · Shortest Path in Binary Matrix","https://leetcode.com/problems/shortest-path-in-binary-matrix/","Medium","BFS with 8 directions"],["LC 785 · Is Graph Bipartite?","https://leetcode.com/problems/is-graph-bipartite/","Medium","BFS 2-colouring of every component"],["LC 127 · Word Ladder","https://leetcode.com/problems/word-ladder/","Hard","BFS over words; neighbours differ by one letter"]],"src":[["MIT 6.006 Introduction to Algorithms (Spring 2020): breadth-first and depth-first search","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["USACO Guide: Graph traversal","https://usaco.guide/silver/graph-traversal"],["cp-algorithms: Breadth-first search","https://cp-algorithms.com/graph/breadth-first-search.html"],["cp-algorithms: Depth-first search","https://cp-algorithms.com/graph/depth-first-search.html"]]},{"id":"m06","d":"d2","t":"Topological sort and cycle detection","min":100,"hook":"Build systems, course prerequisites, spreadsheet formulas and package managers all need an order in which every task comes after the things it depends on, and they must notice when dependencies go round in a circle.","pre":{"q":"To get dressed, socks go on before shoes and trousers before shoes. Which item can you always put on first, and how do you know?","a":"Anything with no unmet prerequisites (socks or trousers). Repeatedly doing a task whose prerequisites are all done, then crossing it off, gives a valid order. That's Kahn's topological sort."},"kid":{"t":"Getting ready for the road trip","x":"Before the road trip, Ben has a list of jobs: pack the bags, load the car, buy snacks, fill the tank. Some jobs must wait for others: the car can't be loaded until the bags are packed. Tara writes on each job how many jobs it's still waiting for. Any job with a zero can start now. When a job is done, she crosses it off and lowers the number on every job that was waiting for it. One day Ben writes “load the car before packing” and “pack before loading the car”: both jobs wait for each other forever, so neither number ever reaches zero.","map":[["Jobs and “must happen before” arrows (pack the bags → load the car)","A directed graph: an edge u → v means u comes before v"],["How many jobs each one is still waiting for","In-degree: the number of incoming edges"],["Starting any job whose number is zero","Kahn's algorithm: a queue of in-degree-0 vertices"],["Two jobs waiting for each other forever","A cycle: no valid order exists, and some in-degrees never reach 0"]],"brk":"Ben and Tara can do several jobs at the same time, but Kahn's algorithm takes one job at a time off the queue. Processing the queue in rounds (every zero at once) shows which jobs could run in parallel, which is how build tools speed things up."},"keys":["**A topological order** of a directed graph lists its vertices so that every edge u → v has u before v. One exists if and only if the graph has no directed cycle, that is, it's a **DAG** (directed acyclic graph).","**Kahn's algorithm (BFS)**: count in-degrees; queue every vertex with in-degree 0; repeatedly pop one into the order and decrement its neighbours' in-degrees, queueing any that reach 0. O(V + E).","**Cycle detection comes free**: if Kahn's order ends with fewer than V vertices, the rest are in a cycle or wait on one.","**DFS version**: run DFS and add each vertex to a list *after* all its descendants are finished (postorder). The reversed list is a topological order.","**Directed cycles with DFS colours**: white = unvisited, grey = on the current path, black = finished. Reaching a grey vertex is a back edge, which means a cycle. Reaching a black vertex is not.","**Undirected cycles are different**: the edge you arrived by is stored both ways, so it leads straight back to your parent. Skip the parent; any other visited neighbour means a cycle (or use union-find, next module).","**Get the edge direction right**: for “to take course a you must first take b”, the edge is b → a. Backwards edges give a reversed order.","**Orders aren't unique**: swap the queue for a min-heap to get the lexicographically smallest order. Python 3.9+ also ships `graphlib.TopologicalSorter`."],"dia":[{"type":"graph","cap":"A DAG: Kahn's algorithm gives 0 5 1 2 3 4","directed":true,"nodes":[["0",8,18],["1",34,6],["2",34,32],["3",60,20],["4",88,34],["5",60,52]],"edges":[["0","1"],["0","2"],["1","3"],["2","3"],["3","4"],["5","4"]],"hl":["0","5"],"note":"0 and 5 have no incoming edges, so they start in the queue. 3 waits for both 1 and 2; 4 waits for 3 and 5."},{"type":"flow","cap":"Kahn's algorithm","steps":[["Count in-degrees","0:0 1:1 2:1 3:2 4:2 5:0"],["Queue the zeros","0, 5"],["Pop, record, decrement","each edge is used once"],["Check the length","fewer than V vertices → a cycle"]]}],"cmp":[{"cap":"Two ways to sort topologically","head":["","Kahn's (BFS on in-degrees)","DFS postorder, reversed"],"rows":[["Idea","Repeatedly take a vertex with no remaining prerequisites","Finish a vertex after all its descendants, then reverse"],["Cycle detection","The order is shorter than V","Reaching a grey (in-progress) vertex"],["Recursion","None","Recursive, or an explicit stack"],["Smallest-first order","Easy: use a min-heap","Awkward"],["Time / extra space","O(V + E) / O(V) beyond the graph","O(V + E) / O(V) beyond the graph"]]}],"code":[{"t":"Kahn's algorithm, with a cycle check","tabs":[{"lang":"python","src":"from collections import deque\n\ndef topo_sort(n, edges):                    # edge (u, v): u must come before v\n    graph = [[] for _ in range(n)]\n    indeg = [0] * n\n    for u, v in edges:\n        graph[u].append(v)\n        indeg[v] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    order = []\n    while q:\n        u = q.popleft()\n        order.append(u)\n        for v in graph[u]:\n            indeg[v] -= 1                    # one prerequisite done\n            if indeg[v] == 0:\n                q.append(v)\n    return order if len(order) == n else None   # None: there's a cycle\n\nprint(*topo_sort(6, [(0, 1), (0, 2), (1, 3), (2, 3), (3, 4), (5, 4)]))\nprint(\"cycle\" if topo_sort(3, [(0, 1), (1, 2), (2, 0)]) is None else \"ok\")\n","out":"0 5 1 2 3 4\ncycle\n","notes":[[8,"In-degree = how many prerequisites a vertex is still waiting for."],[18,"In a cycle nobody's in-degree reaches 0, so those vertices never enter the order."]]},{"lang":"javascript","src":"function topoSort(n, edges) {               // edge [u, v]: u must come before v\n  const graph = Array.from({ length: n }, () => []);\n  const indeg = new Array(n).fill(0);\n  for (const [u, v] of edges) {\n    graph[u].push(v);\n    indeg[v]++;\n  }\n  const q = [];\n  for (let i = 0; i < n; i++) if (indeg[i] === 0) q.push(i);\n  const order = [];\n  for (let head = 0; head < q.length; head++) {\n    const u = q[head];\n    order.push(u);\n    for (const v of graph[u]) {\n      indeg[v]--;                            // one prerequisite done\n      if (indeg[v] === 0) q.push(v);\n    }\n  }\n  return order.length === n ? order : null;  // null: there's a cycle\n}\n\nconsole.log(...topoSort(6, [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [5, 4]]));\nconsole.log(topoSort(3, [[0, 1], [1, 2], [2, 0]]) === null ? \"cycle\" : \"ok\");\n","out":"0 5 1 2 3 4\ncycle\n","notes":[[16,"In-degree 0 means every prerequisite is done: the vertex can join the queue."]]}]},{"t":"DFS postorder, with colours for cycle detection","tabs":[{"lang":"python","src":"def topo_dfs(n, edges):\n    graph = [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n    WHITE, GREY, BLACK = 0, 1, 2\n    color, post = [WHITE] * n, []\n\n    def dfs(u):                              # returns False if a cycle is found\n        color[u] = GREY                      # on the current path\n        for v in graph[u]:\n            if color[v] == GREY:\n                return False                 # a back edge: a cycle\n            if color[v] == WHITE and not dfs(v):\n                return False\n        color[u] = BLACK                     # finished\n        post.append(u)                       # after all its descendants\n        return True\n\n    for u in range(n):\n        if color[u] == WHITE and not dfs(u):\n            return None\n    return post[::-1]\n\nprint(*topo_dfs(6, [(0, 1), (0, 2), (1, 3), (2, 3), (3, 4), (5, 4)]))\nprint(\"cycle\" if topo_dfs(3, [(0, 1), (1, 2), (2, 0)]) is None else \"ok\")\n","out":"5 0 2 1 3 4\ncycle\n","notes":[[11,"Grey means “still on the current path”: reaching it again closes a loop."],[16,"A vertex is appended only after everything reachable from it, so the reversed list puts it before all of them."]]},{"lang":"javascript","src":"function topoDfs(n, edges) {\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) graph[u].push(v);\n  const WHITE = 0, GREY = 1, BLACK = 2;\n  const color = new Array(n).fill(WHITE), post = [];\n\n  function dfs(u) {                          // returns false if a cycle is found\n    color[u] = GREY;                         // on the current path\n    for (const v of graph[u]) {\n      if (color[v] === GREY) return false;   // a back edge: a cycle\n      if (color[v] === WHITE && !dfs(v)) return false;\n    }\n    color[u] = BLACK;                        // finished\n    post.push(u);                            // after all its descendants\n    return true;\n  }\n\n  for (let u = 0; u < n; u++) if (color[u] === WHITE && !dfs(u)) return null;\n  return post.reverse();\n}\n\nconsole.log(...topoDfs(6, [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [5, 4]]));\nconsole.log(topoDfs(3, [[0, 1], [1, 2], [2, 0]]) === null ? \"cycle\" : \"ok\");\n","out":"5 0 2 1 3 4\ncycle\n","notes":[[10,"Grey means “still on the current path”: reaching it again closes a loop."],[19,"A different valid order from Kahn's: topological orders aren't unique."]]}]}],"ex":{"q":"Given packages and “a depends on b” pairs, return a build order, or report which packages are stuck because of a cycle.","steps":["“a depends on b” means b must build first, so the edge is b → a. Getting this direction wrong reverses the order.","Count each package's in-degree (how many packages it still waits for) and queue those with 0.","Pop a package into the order and lower the in-degree of everything that depends on it; queue any that reach 0.","Anything left with in-degree > 0 is in a cycle or waits on one. O(V + E) time; O(V) extra space beyond the graph itself."],"code":{"t":"Build order with names, and the stuck packages","tabs":[{"lang":"python","src":"from collections import deque, defaultdict\n\ndef build_order(packages, depends_on):        # (a, b): a depends on b, so b builds first\n    graph, indeg = defaultdict(list), {p: 0 for p in packages}\n    for a, b in depends_on:\n        graph[b].append(a)                    # edge b -> a\n        indeg[a] += 1\n    q = deque(p for p in packages if indeg[p] == 0)\n    order = []\n    while q:\n        p = q.popleft()\n        order.append(p)\n        for nxt in graph[p]:\n            indeg[nxt] -= 1\n            if indeg[nxt] == 0:\n                q.append(nxt)\n    stuck = [p for p in packages if indeg[p] > 0]   # in a cycle, or waiting on one\n    return order, stuck\n\norder, stuck = build_order([\"app\", \"api\", \"db\", \"utils\", \"ui\"],\n                           [(\"app\", \"api\"), (\"app\", \"ui\"), (\"api\", \"db\"), (\"api\", \"utils\"), (\"ui\", \"utils\")])\nprint(\" -> \".join(order) or \"(nothing)\", \"| stuck:\", \" \".join(stuck) or \"none\")\norder, stuck = build_order([\"a\", \"b\", \"c\", \"d\"], [(\"a\", \"b\"), (\"b\", \"c\"), (\"c\", \"b\"), (\"d\", \"a\")])\nprint(\" -> \".join(order) or \"(nothing)\", \"| stuck:\", \" \".join(stuck) or \"none\")\n","out":"db -> utils -> api -> ui -> app | stuck: none\n(nothing) | stuck: a b c d\n"},{"lang":"javascript","src":"function buildOrder(packages, dependsOn) {    // [a, b]: a depends on b, so b builds first\n  const graph = new Map(packages.map(p => [p, []]));\n  const indeg = new Map(packages.map(p => [p, 0]));\n  for (const [a, b] of dependsOn) {\n    graph.get(b).push(a);                     // edge b -> a\n    indeg.set(a, indeg.get(a) + 1);\n  }\n  const q = packages.filter(p => indeg.get(p) === 0), order = [];\n  for (let head = 0; head < q.length; head++) {\n    const p = q[head];\n    order.push(p);\n    for (const nxt of graph.get(p)) {\n      indeg.set(nxt, indeg.get(nxt) - 1);\n      if (indeg.get(nxt) === 0) q.push(nxt);\n    }\n  }\n  const stuck = packages.filter(p => indeg.get(p) > 0);   // in a cycle, or waiting on one\n  return [order, stuck];\n}\n\nlet [order, stuck] = buildOrder([\"app\", \"api\", \"db\", \"utils\", \"ui\"],\n                                [[\"app\", \"api\"], [\"app\", \"ui\"], [\"api\", \"db\"], [\"api\", \"utils\"], [\"ui\", \"utils\"]]);\nconsole.log(order.join(\" -> \") || \"(nothing)\", \"| stuck:\", stuck.join(\" \") || \"none\");\n[order, stuck] = buildOrder([\"a\", \"b\", \"c\", \"d\"], [[\"a\", \"b\"], [\"b\", \"c\"], [\"c\", \"b\"], [\"d\", \"a\"]]);\nconsole.log(order.join(\" -> \") || \"(nothing)\", \"| stuck:\", stuck.join(\" \") || \"none\");\n","out":"db -> utils -> api -> ui -> app | stuck: none\n(nothing) | stuck: a b c d\n"}]},"a":"db -> utils -> api -> ui -> app with nothing stuck. In the second case b and c depend on each other, a waits on b and d waits on a, so nothing can ever start: all four are stuck."},"fade":{"q":"Does an undirected graph (no repeated edges, no self-loops) contain a cycle? Use DFS and remember where you came from.","steps":["In an undirected graph every edge is stored both ways, so stepping back to your parent is not a cycle.",{"ask":"When does meeting an already-seen neighbour mean a cycle?","a":"When that neighbour isn't the vertex you just came from: it was reached by a second route."},{"ask":"Why loop over every vertex as a possible start?","a":"The graph may have several components, and a cycle could be in any of them."},{"ask":"Time and space?","a":"O(V + E) time, and O(V) extra space beyond the graph itself."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def has_cycle_undirected(n, edges):\n    graph = [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n        graph[v].append(u)\n    seen = [False] * n\n    for s in range(n):\n        if seen[s]:\n            continue\n        seen[s] = True\n        stack = [(s, -1)]                # (vertex, the vertex we came from)\n        while stack:\n            u, parent = stack.pop()\n            for v in graph[u]:\n                if v == parent:\n                    continue\n                ...                      # TODO: seen already -> cycle; otherwise mark it and push (v, u)\n    return False\n"},{"lang":"javascript","src":"function hasCycleUndirected(n, edges) {\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    graph[u].push(v);\n    graph[v].push(u);\n  }\n  const seen = new Array(n).fill(false);\n  for (let s = 0; s < n; s++) {\n    if (seen[s]) continue;\n    seen[s] = true;\n    const stack = [[s, -1]];             // [vertex, the vertex we came from]\n    while (stack.length) {\n      const [u, parent] = stack.pop();\n      for (const v of graph[u]) {\n        if (v === parent) continue;\n        // TODO: seen already -> cycle; otherwise mark it and push [v, u]\n      }\n    }\n  }\n  return false;\n}\n"}]},"solution":{"t":"Solution: a second route means a cycle","tabs":[{"lang":"python","src":"def has_cycle_undirected(n, edges):\n    graph = [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n        graph[v].append(u)\n    seen = [False] * n\n    for s in range(n):\n        if seen[s]:\n            continue\n        seen[s] = True\n        stack = [(s, -1)]\n        while stack:\n            u, parent = stack.pop()\n            for v in graph[u]:\n                if v == parent:\n                    continue\n                if seen[v]:\n                    return True          # reached again by a different route\n                seen[v] = True\n                stack.append((v, u))\n    return False\n\ncases = [(4, [(0, 1), (1, 2), (2, 3)]), (3, [(0, 1), (1, 2), (2, 0)]),\n         (4, [(0, 1), (2, 3)]), (4, [(0, 1), (1, 2), (2, 3), (3, 1)])]\nprint(*(\"yes\" if has_cycle_undirected(n, e) else \"no\" for n, e in cases))\n","out":"no yes no yes"},{"lang":"javascript","src":"function hasCycleUndirected(n, edges) {\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    graph[u].push(v);\n    graph[v].push(u);\n  }\n  const seen = new Array(n).fill(false);\n  for (let s = 0; s < n; s++) {\n    if (seen[s]) continue;\n    seen[s] = true;\n    const stack = [[s, -1]];\n    while (stack.length) {\n      const [u, parent] = stack.pop();\n      for (const v of graph[u]) {\n        if (v === parent) continue;\n        if (seen[v]) return true;        // reached again by a different route\n        seen[v] = true;\n        stack.push([v, u]);\n      }\n    }\n  }\n  return false;\n}\n\nconst cases = [[4, [[0, 1], [1, 2], [2, 3]]], [3, [[0, 1], [1, 2], [2, 0]]],\n               [4, [[0, 1], [2, 3]]], [4, [[0, 1], [1, 2], [2, 3], [3, 1]]]];\nconsole.log(...cases.map(([n, e]) => (hasCycleUndirected(n, e) ? \"yes\" : \"no\")));\n","out":"no yes no yes"}]}},"traps":[["“Every directed graph has a topological order.”","Only DAGs do. In a cycle (a → b → a) neither can go first. Kahn's algorithm shows it: the order comes out shorter than V."],["“For ‘to take a you need b’, the edge is a → b.”","Prerequisites come first, so the edge is b → a. Reversing it reverses the order. Always say what an edge means before you code."],["“In a directed DFS, reaching any visited vertex means a cycle.”","Two paths can meet without looping (a diamond: a → b, a → c, b → d, c → d). Only reaching a vertex still on the current path (grey) is a cycle."],["“In an undirected DFS, any visited neighbour is a cycle.”","The edge you arrived by is stored both ways, so it leads straight back to the parent you came from. Skip the parent; any *other* visited neighbour means a cycle."],["“The DFS postorder is the topological order.”","It's the reverse: a vertex is added after its descendants, so reverse the list."],["“The topological order is unique.”","Usually there are many. If a problem wants one in particular, such as the smallest-first order, use a min-heap in Kahn's algorithm."]],"disc":[["Kahn's algorithm or DFS for a topological sort?","Kahn's is iterative, gives cycle detection for free and adapts easily (smallest-first with a heap, or level by level for parallel work). DFS is shorter if you're already writing one, but deep recursion can be a problem in Python."],["How would you find which tasks can run in parallel, and the fewest rounds needed?","Run Kahn's algorithm level by level: everything in the queue at the same moment has no dependencies left, so a whole level can run together. The number of levels is the fewest rounds."]],"teach":{"prompt":"Explain to a junior colleague how Kahn's algorithm produces a topological order and how it detects a cycle.","rubric":["Edges point from a prerequisite to the thing that depends on it","Compute in-degrees and queue every vertex with in-degree 0","Pop a vertex into the order, decrement its neighbours, queue those that reach 0","An order with fewer than V vertices means a cycle","O(V + E)"],"model":"Draw an edge from each prerequisite to the thing that depends on it, and count every vertex's in-degree: how many prerequisites it still has. Every vertex with in-degree 0 can go first, so put them in a queue. Repeatedly take one from the queue, add it to the order, and lower the in-degree of each vertex it points to; any that reach 0 join the queue. Each vertex and edge is handled once, so it's O(V + E). If the queue empties before all V vertices are in the order, the leftovers are in a cycle or depend on one, because their in-degree can never reach 0."},"qa":[["When does a directed graph have a topological order?","Exactly when it has no directed cycle (it's a DAG)."],["Kahn's algorithm in one line?","Repeatedly remove a vertex with in-degree 0, adding it to the order and decrementing its neighbours' in-degrees."],["How does Kahn's algorithm detect a cycle?","The order ends with fewer than V vertices."],["Topological sort with DFS?","Add each vertex after its descendants are finished (postorder), then reverse the list."],["Directed cycle detection with DFS colours?","Grey = on the current path; reaching a grey vertex is a back edge, which means a cycle."],["Edge direction for “to take a you must take b first”?","b → a."]],"quiz":[{"q":"What does this print?","snip":{"t":"Run Kahn's algorithm","tabs":[{"lang":"python","src":"from collections import deque\n\ngraph = {\"a\": [\"c\"], \"b\": [\"c\", \"d\"], \"c\": [\"e\"], \"d\": [\"e\"], \"e\": []}\nindeg = {u: 0 for u in graph}\nfor u in graph:\n    for v in graph[u]:\n        indeg[v] += 1\nq = deque(u for u in graph if indeg[u] == 0)\norder = []\nwhile q:\n    u = q.popleft()\n    order.append(u)\n    for v in graph[u]:\n        indeg[v] -= 1\n        if indeg[v] == 0:\n            q.append(v)\nprint(*order)\n"},{"lang":"javascript","src":"const graph = new Map([[\"a\", [\"c\"]], [\"b\", [\"c\", \"d\"]], [\"c\", [\"e\"]], [\"d\", [\"e\"]], [\"e\", []]]);\nconst indeg = new Map([...graph.keys()].map(u => [u, 0]));\nfor (const vs of graph.values()) for (const v of vs) indeg.set(v, indeg.get(v) + 1);\nconst q = [...graph.keys()].filter(u => indeg.get(u) === 0), order = [];\nfor (let head = 0; head < q.length; head++) {\n  const u = q[head];\n  order.push(u);\n  for (const v of graph.get(u)) {\n    indeg.set(v, indeg.get(v) - 1);\n    if (indeg.get(v) === 0) q.push(v);\n  }\n}\nconsole.log(...order);\n"}]},"o":["a b c d e","a c b d e","b d a c e","e d c b a"],"a":0,"e":"a and b start at in-degree 0. After a and b, c and d reach 0; after both, e does. “b d a c e” is also a valid order, but it isn't what this queue produces."},{"q":"To take course 1 you need 0, to take 2 you need 1, and to take 0 you need 2. What does Kahn's algorithm report?","o":["A cycle: no course ever reaches in-degree 0","The order 0, 1, 2","The order 2, 1, 0","It loops forever"],"a":0,"e":"Every course waits for another, so the queue starts empty and the order has 0 of 3 courses. Kahn's algorithm always stops."},{"q":"In a DFS for directed cycle detection, you reach a vertex that is already BLACK (finished). What does that tell you?","o":["Nothing about a cycle: it was finished through another path, so skip it","There is a cycle","The graph is undirected","The topological order is invalid"],"a":0,"e":"Black vertices are completely explored and not on the current path. Only reaching a grey vertex closes a loop."},{"q":"Which of these are topological-sort problems? (choose 3)","t":"ms","o":["Order courses so every prerequisite comes first","Decide the build order of packages from their dependencies","Recover the letter order of an alien alphabet from a sorted word list","Find the cheapest route on a weighted road map","Count the islands in a grid"],"a":[0,1,2],"e":"Each of the first three is “order these things given before/after rules”. The others are shortest paths and connected components."},{"q":"Judge each statement.","t":"yn","s":[["A directed graph with a cycle has no topological order.",true],["Reaching any already-visited vertex in a directed DFS means there's a cycle.",false],["Reversing the DFS postorder of a DAG gives a topological order.",true],["Every DAG has exactly one topological order.",false]],"e":"Cycles block ordering. Black (finished) vertices don't mean a cycle. Reversed postorder works. Orders are usually not unique."},{"q":"Put the steps of Kahn's algorithm in order.","t":"ord","items":["Count every vertex's in-degree","Queue every vertex with in-degree 0","Pop a vertex and append it to the order","Decrement its neighbours' in-degrees and queue any that reach 0","If the order has fewer than V vertices, report a cycle"],"e":"The final length check is the cycle detector."},{"q":"Complete Kahn's algorithm in Python.","t":"drop","lang":"python","code":"from collections import deque\n\ndef topo_sort(n, edges):\n    graph = [[] for _ in range(n)]\n    indeg = [0] * n\n    for u, v in edges:\n        graph[u].append(v)\n        indeg[{{0}}] += 1\n    q = deque(i for i in range(n) if indeg[i] == {{1}})\n    order = []\n    while q:\n        u = q.popleft()\n        order.append(u)\n        for v in graph[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0:\n                q.append(v)\n    return order if len(order) == {{2}} else None\n","blanks":[{"o":["v","u","u + v","0"],"a":0},{"o":["0","1","n","-1"],"a":0},{"o":["n","len(edges)","n - 1","len(q)"],"a":0}],"e":"The edge u → v adds to v's in-degree; vertices with in-degree 0 start the queue; a complete order has all n vertices."},{"q":"Match each task to its technique.","t":"match","pairs":[["Order tasks so prerequisites come first","Topological sort"],["Find a directed cycle with DFS","Reaching a grey (on-path) vertex again"],["Find an undirected cycle with DFS","A visited neighbour that isn't the parent"],["Find tasks that can run in parallel","Kahn's algorithm, level by level"]],"extra":["Binary search"],"e":"Directed and undirected cycle checks differ; Kahn's levels show the parallel rounds."}],"probs":[["LC 207 · Course Schedule","https://leetcode.com/problems/course-schedule/","Medium","Kahn's: did every course get taken?"],["LC 210 · Course Schedule II","https://leetcode.com/problems/course-schedule-ii/","Medium","Kahn's order, or [] when there's a cycle"],["LC 2115 · Find All Possible Recipes from Given Supplies","https://leetcode.com/problems/find-all-possible-recipes-from-given-supplies/","Medium","seed the queue with the supplies only; a recipe's in-degree is its number of ingredients"],["LC 310 · Minimum Height Trees","https://leetcode.com/problems/minimum-height-trees/","Medium","peel the leaves layer by layer, like Kahn's on a tree"],["LC 1203 · Sort Items by Groups Respecting Dependencies","https://leetcode.com/problems/sort-items-by-groups-respecting-dependencies/","Hard","two topological sorts: groups, then items"]],"src":[["cp-algorithms: Topological sorting","https://cp-algorithms.com/graph/topological-sort.html"],["cp-algorithms: Checking a graph for acyclicity and finding a cycle","https://cp-algorithms.com/graph/finding-cycle.html"],["USACO Guide: Topological sort","https://usaco.guide/gold/toposort"],["Python docs: graphlib.TopologicalSorter","https://docs.python.org/3/library/graphlib.html"]]},{"id":"m07","d":"d2","t":"Union-find (disjoint sets)","min":90,"hook":"When connections only ever get added (friendships, network links, merged accounts) and you keep asking “are these two connected?”, union-find answers in effectively constant time. It's also the engine inside Kruskal's minimum spanning tree.","pre":{"q":"Friend groups merge whenever two people from different groups become friends. How could you tell whether two people are in the same group without searching all the friendships each time?","a":"Give every group a leader. Each person points, directly or through others, to their group's leader; two people are in the same group if they reach the same leader. Merging two groups just makes one leader point to the other."},"kid":{"t":"The team captains","x":"At the toy-room party, every child starts in their own team and is their own captain. When two children hold hands, their teams merge: one captain joins the other captain's team. To check whether Tara and Ben are on the same team, each follows the chain “who's my captain?” until they reach someone who is their own captain. Same captain, same team! To keep the chains short, smaller teams always join bigger ones, and whenever someone walks a chain, everyone on it then points straight at the top captain.","map":[["Every child starts as their own captain","make-set: parent[x] = x"],["Holding hands merges two teams","union(a, b): link one root under the other"],["Following “who's my captain?” to the top","find(x): follow parent links to the root"],["Same captain means same team","a and b are connected exactly when find(a) == find(b)"],["Small teams join big ones; pointing straight at the top","Union by size and path compression"]],"brk":"Teams can only merge, never split: union-find has no cheap way to remove a connection. It also can't tell you the chain of hand-holds between two children, only that one exists."},"keys":["**Union-find (DSU)** keeps a `parent` array: each element points to a parent, and a root points to itself. Each root names one disjoint set.","**find(x)** follows parents up to the root; **union(a, b)** links one root under the other; a and b are connected when their roots match.","**Path compression**: during find, point every node on the path straight at the root, so later finds are short.","**Union by size (or rank)**: attach the smaller tree under the larger one, so trees stay shallow.","**With both tricks** each operation costs O(α(n)) amortised, where α is the inverse Ackermann function: below 5 for any realistic n, so effectively constant.","**Typical uses**: counting connected components as edges arrive, spotting a cycle in an undirected graph (an edge whose ends already share a root), merging accounts, Kruskal's minimum spanning tree.","**Kruskal's MST**: sort the edges by weight; keep each edge whose ends are in different sets (the union succeeds); stop after V − 1 edges. O(E log E).","**Limits**: no splitting sets and no paths. Union-find says *whether* two items are connected, not *how*; use BFS or DFS for routes."],"dia":[{"type":"graph","cap":"Arrows point to parents: union(2, 4) links root 3 under root 0","directed":true,"h":200,"nodes":[["0",32,8],["1",12,30],["2",32,30],["3",52,30],["4",52,52],["5",80,30]],"edges":[["1","0"],["2","0"],["4","3"],["3","0"]],"hl":["0","5"],"hle":[["3","0"]],"note":"After union(0, 1), union(1, 2) and union(3, 4), find(2) is one step (2 → 0) and find(4) is one step (4 → 3). Union by size puts the smaller tree under the bigger root: root 3 (2 nodes) goes under root 0 (3 nodes), the highlighted arrow. 5 is still alone: a set of its own."},{"type":"flow","cap":"Path compression on find(4), after the union above","steps":[["Walk up","4 → 3 → 0: the root is 0"],["Compress","point 4 straight at 0 (3 already points there)"],["Next time","find(4) takes a single step"]]}],"cmp":[{"cap":"Union-find or BFS/DFS for connectivity?","head":["","Union-find","BFS / DFS"],"rows":[["Edges arrive one at a time","O(α(n)) per new edge","A fresh search after each edge: O(V + E) each"],["Are a and b connected?","O(α(n)) amortised","O(V + E) per fresh search; O(1) after labelling the components once (fixed graph)"],["The actual path","Not available","Yes, with parent links"],["Deleting edges","Not supported","Just search again"],["Directed graphs","No: undirected connectivity only","Yes"]]}],"code":[{"t":"The union-find class used by every example below","tabs":[{"lang":"python","src":"class DSU:\n    def __init__(self, n):\n        self.parent = list(range(n))        # everyone is their own root\n        self.size = [1] * n\n        self.sets = n\n\n    def find(self, x):\n        root = x\n        while self.parent[root] != root:    # walk up to the root\n            root = self.parent[root]\n        while self.parent[x] != root:       # path compression: point the path at the root\n            nxt = self.parent[x]\n            self.parent[x] = root\n            x = nxt\n        return root\n\n    def union(self, a, b):                  # False if a and b were already together\n        ra, rb = self.find(a), self.find(b)\n        if ra == rb:\n            return False\n        if self.size[ra] < self.size[rb]:   # union by size: small tree under big tree\n            ra, rb = rb, ra\n        self.parent[rb] = ra\n        self.size[ra] += self.size[rb]\n        self.sets -= 1\n        return True\n"},{"lang":"javascript","src":"class DSU {\n  constructor(n) {\n    this.parent = Array.from({ length: n }, (_, i) => i);   // everyone is their own root\n    this.size = new Array(n).fill(1);\n    this.sets = n;\n  }\n\n  find(x) {\n    let root = x;\n    while (this.parent[root] !== root) root = this.parent[root];   // walk up to the root\n    while (this.parent[x] !== root) {       // path compression: point the path at the root\n      const nxt = this.parent[x];\n      this.parent[x] = root;\n      x = nxt;\n    }\n    return root;\n  }\n\n  union(a, b) {                             // false if a and b were already together\n    let ra = this.find(a), rb = this.find(b);\n    if (ra === rb) return false;\n    if (this.size[ra] < this.size[rb]) [ra, rb] = [rb, ra];   // union by size\n    this.parent[rb] = ra;\n    this.size[ra] += this.size[rb];\n    this.sets--;\n    return true;\n  }\n}\n"}]},{"t":"Unions, finds and set counts","tabs":[{"lang":"python","src":"yn = lambda b: \"yes\" if b else \"no\"\n\nd = DSU(6)\nfor a, b in [(0, 1), (1, 2), (3, 4)]:\n    d.union(a, b)\nprint(d.sets, yn(d.find(2) == d.find(0)), yn(d.find(4) == d.find(0)))\nd.union(2, 4)                           # merges {0, 1, 2} and {3, 4}\nprint(d.sets, yn(d.find(4) == d.find(0)), yn(d.union(1, 3)))\n","out":"3 yes no\n2 yes no\n","notes":[[8,"1 and 3 are already in the same set, so union returns False and nothing changes."]]},{"lang":"javascript","src":"const yn = b => (b ? \"yes\" : \"no\");\n\nconst d = new DSU(6);\nfor (const [a, b] of [[0, 1], [1, 2], [3, 4]]) d.union(a, b);\nconsole.log(d.sets, yn(d.find(2) === d.find(0)), yn(d.find(4) === d.find(0)));\nd.union(2, 4);                          // merges {0, 1, 2} and {3, 4}\nconsole.log(d.sets, yn(d.find(4) === d.find(0)), yn(d.union(1, 3)));\n","out":"3 yes no\n2 yes no\n","notes":[[7,"1 and 3 are already in the same set, so union returns false and nothing changes."]]}]},{"t":"Edges arriving one by one: the first loop, and the running group count","tabs":[{"lang":"python","src":"def redundant_edge(n, edges):               # the first edge that closes a loop\n    d = DSU(n)\n    for a, b in edges:\n        if not d.union(a, b):               # a and b were already connected\n            return a, b\n    return None\n\nprint(*redundant_edge(4, [(0, 1), (1, 2), (2, 3), (1, 3), (0, 3)]))\n\nd = DSU(5)\ncounts = []\nfor a, b in [(0, 1), (2, 3), (1, 0), (3, 4), (1, 2)]:\n    d.union(a, b)\n    counts.append(d.sets)\nprint(*counts)\n","out":"1 3\n4 3 3 2 1\n","notes":[[4,"An undirected edge between two items that are already connected must close a loop."],[14,"Each successful union lowers the count by one; a repeated pair (1, 0) changes nothing."]]},{"lang":"javascript","src":"function redundantEdge(n, edges) {          // the first edge that closes a loop\n  const d = new DSU(n);\n  for (const [a, b] of edges) if (!d.union(a, b)) return [a, b];   // already connected\n  return null;\n}\n\nconsole.log(...redundantEdge(4, [[0, 1], [1, 2], [2, 3], [1, 3], [0, 3]]));\n\nconst d = new DSU(5), counts = [];\nfor (const [a, b] of [[0, 1], [2, 3], [1, 0], [3, 4], [1, 2]]) {\n  d.union(a, b);\n  counts.push(d.sets);\n}\nconsole.log(...counts);\n","out":"1 3\n4 3 3 2 1\n","notes":[[3,"An undirected edge between two items that are already connected must close a loop."]]}]},{"t":"Kruskal's minimum spanning tree","tabs":[{"lang":"python","src":"def kruskal(n, edges):                      # edges: (weight, u, v)\n    d, total, used = DSU(n), 0, []\n    for w, u, v in sorted(edges):           # cheapest first\n        if d.union(u, v):                   # joins two different trees: keep it\n            total += w\n            used.append((u, v))\n            if len(used) == n - 1:\n                break\n    return total, used\n\ntotal, used = kruskal(5, [(4, 0, 1), (1, 1, 2), (3, 0, 2), (2, 2, 3), (5, 3, 4), (7, 1, 4), (6, 2, 4)])\nprint(total, *(f\"{u}-{v}\" for u, v in used))\n","out":"11 1-2 2-3 0-2 3-4","notes":[[4,"Edge 0–1 (weight 4) is skipped: 0 and 1 are already joined through 2."],[7,"A spanning tree on n vertices has exactly n − 1 edges, so stop early."]]},{"lang":"javascript","src":"function kruskal(n, edges) {                // edges: [weight, u, v]\n  const d = new DSU(n), used = [];\n  let total = 0;\n  for (const [w, u, v] of edges.toSorted((a, b) => a[0] - b[0])) {   // cheapest first\n    if (d.union(u, v)) {                    // joins two different trees: keep it\n      total += w;\n      used.push([u, v]);\n      if (used.length === n - 1) break;\n    }\n  }\n  return [total, used];\n}\n\nconst [total, used] = kruskal(5, [[4, 0, 1], [1, 1, 2], [3, 0, 2], [2, 2, 3], [5, 3, 4], [7, 1, 4], [6, 2, 4]]);\nconsole.log(total, ...used.map(([u, v]) => `${u}-${v}`));\n","out":"11 1-2 2-3 0-2 3-4","notes":[[4,"Sort a copy by weight; `toSorted` leaves the input untouched."]]}]}],"ex":{"q":"Given equations like “a==b” and “b!=c” over lowercase letters, can all of them be true at once? (LeetCode 990, Satisfiability of Equality Equations.)","steps":["Equality is transitive (a == b and b == c mean a == c), so variables that must be equal form groups: disjoint sets.","Pass 1: union the two sides of every “==”. Do all the unions before any check.","Pass 2: for every “!=”, the two sides must be in different sets; the same root means a contradiction.","26 letters and n equations: O(n · α(26)), effectively O(n) time, with O(1) extra space."],"code":{"t":"Two passes: merge, then check","tabs":[{"lang":"python","src":"def equations_possible(equations):\n    d = DSU(26)\n    idx = lambda ch: ord(ch) - ord(\"a\")\n    for e in equations:\n        if e[1:3] == \"==\":\n            d.union(idx(e[0]), idx(e[3]))    # first, merge everything that must be equal\n    for e in equations:\n        if e[1:3] == \"!=\" and d.find(idx(e[0])) == d.find(idx(e[3])):\n            return False                     # then, no \"!=\" pair may share a set\n    return True\n\ntests = [[\"a==b\", \"b!=a\"], [\"b==a\", \"a==b\"], [\"a==b\", \"b==c\", \"a==c\"], [\"a==b\", \"b!=c\", \"c==a\"], [\"c==c\", \"b==d\", \"x!=z\"]]\nprint(*(\"yes\" if equations_possible(t) else \"no\" for t in tests))\n","out":"no yes yes no yes"},{"lang":"javascript","src":"function equationsPossible(equations) {\n  const d = new DSU(26);\n  const idx = ch => ch.charCodeAt(0) - 97;   // 'a' is 97\n  for (const e of equations)\n    if (e.slice(1, 3) === \"==\") d.union(idx(e[0]), idx(e[3]));   // first, merge the equal ones\n  for (const e of equations)\n    if (e.slice(1, 3) === \"!=\" && d.find(idx(e[0])) === d.find(idx(e[3]))) return false;   // then check\n  return true;\n}\n\nconst tests = [[\"a==b\", \"b!=a\"], [\"b==a\", \"a==b\"], [\"a==b\", \"b==c\", \"a==c\"], [\"a==b\", \"b!=c\", \"c==a\"], [\"c==c\", \"b==d\", \"x!=z\"]];\nconsole.log(...tests.map(t => (equationsPossible(t) ? \"yes\" : \"no\")));\n","out":"no yes yes no yes"}]},"a":"no, yes, yes, no, yes. In the fourth case a == b and c == a put b and c in one set, which contradicts b != c. In the first, b != a contradicts a == b."},"fade":{"q":"`is_connected[i][j] == 1` means cities i and j are directly linked. How many separate groups of cities (provinces) are there?","steps":["Start with n sets. Each successful union merges two groups, so the count drops by one.",{"ask":"Which cells of the matrix do you need to read?","a":"Only those with j > i: the matrix is symmetric and the diagonal is always 1."},{"ask":"What's the answer at the end?","a":"The number of sets left, `d.sets`."},{"ask":"Time?","a":"O(n² · α(n)) to scan the matrix: effectively O(n²)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def count_provinces(is_connected):\n    n = len(is_connected)\n    d = DSU(n)\n    for i in range(n):\n        for j in range(i + 1, n):\n            ...                     # TODO: merge i and j when they're linked\n    return d.sets\n\nprint(count_provinces([[1, 1, 0], [1, 1, 0], [0, 0, 1]]))   # expect 2\n"},{"lang":"javascript","src":"function countProvinces(isConnected) {\n  const n = isConnected.length, d = new DSU(n);\n  for (let i = 0; i < n; i++)\n    for (let j = i + 1; j < n; j++) {\n      // TODO: merge i and j when they're linked\n    }\n  return d.sets;\n}\n\nconsole.log(countProvinces([[1, 1, 0], [1, 1, 0], [0, 0, 1]]));   // expect 2\n"}]},"solution":{"t":"Solution","tabs":[{"lang":"python","src":"def count_provinces(is_connected):\n    n = len(is_connected)\n    d = DSU(n)\n    for i in range(n):\n        for j in range(i + 1, n):\n            if is_connected[i][j]:\n                d.union(i, j)\n    return d.sets\n\nprint(count_provinces([[1, 1, 0], [1, 1, 0], [0, 0, 1]]), count_provinces([[1, 0, 0], [0, 1, 0], [0, 0, 1]]))\n","out":"2 3"},{"lang":"javascript","src":"function countProvinces(isConnected) {\n  const n = isConnected.length, d = new DSU(n);\n  for (let i = 0; i < n; i++)\n    for (let j = i + 1; j < n; j++)\n      if (isConnected[i][j]) d.union(i, j);\n  return d.sets;\n}\n\nconsole.log(countProvinces([[1, 1, 0], [1, 1, 0], [0, 0, 1]]), countProvinces([[1, 0, 0], [0, 1, 0], [0, 0, 1]]));\n","out":"2 3"}]}},"traps":[["“find is O(1).”","Without path compression and union by size, a chain can grow n tall and find becomes O(n). With both, it's O(α(n)) amortised: effectively constant, but not literally O(1)."],["“union(a, b) can set parent[a] = b.”","Link the *roots*: `parent[find(b)] = find(a)` (or the other way round). Re-pointing `a` itself cuts it off from the rest of its old set."],["“Union-find can remove a connection.”","It only merges. If edges can disappear, rebuild it or use another technique."],["“Union-find finds the path between two nodes.”","It answers *whether* they're connected, not *how*. Use BFS or DFS for the route."],["“Union-find detects cycles in directed graphs.”","It works for undirected graphs. For directed cycles, use DFS colours or Kahn's algorithm."],["“A recursive find is always fine in Python.”","With union by size (or rank) a tree is at most log₂ n deep, about 20 levels for a million items, so recursion is fine. Without it, path compression alone can leave a chain n long until someone walks it, and a recursive find on that chain can pass Python's 1,000-call limit. The two-loop iterative find is safe either way."]],"disc":[["Why does union by size keep the trees shallow?","An element only gets deeper when its tree is attached under a tree at least as big, which at least doubles the size of the tree it belongs to. Sizes can only double about log₂ n times, so depth stays O(log n) even before path compression."],["When would you choose union-find over BFS/DFS for connectivity?","When edges arrive over time and you keep asking “connected?” in between. On a fixed graph, one BFS/DFS pass that labels each vertex with its component answers every later question in O(1) too. BFS/DFS is also better when you need the path or distances, or when edges get deleted."]],"teach":{"prompt":"Explain to a junior colleague how union-find answers “are a and b connected?” and why its operations are nearly constant time.","rubric":["Each element points to a parent; roots point to themselves and name the set","find follows parents to the root; connected means the same root","union links one root under the other","Path compression flattens paths; union by size keeps trees shallow","Together: O(α(n)) amortised, effectively constant"],"model":"Union-find stores a parent pointer for every element; a root points to itself and stands for its whole set. To check whether a and b are connected, find each one's root by following parent pointers, then compare them. To merge two sets, find both roots and make one the parent of the other. Two tricks keep it fast: union by size attaches the smaller tree under the larger, so trees stay shallow, and path compression makes every node on a find path point straight at the root, so the next find is a single step. Together they make each operation O(α(n)) amortised, and α stays below 5 for any input you'll ever meet."},"qa":[["What does union-find store?","A parent pointer per element (roots point to themselves), usually plus a size or rank for each root."],["How do you test whether a and b are connected?","Compare find(a) and find(b)."],["What is path compression?","During find, make every node on the path point directly at the root."],["What is union by size?","Attach the root of the smaller set under the root of the larger set."],["Cost per operation with both optimisations?","O(α(n)) amortised: effectively constant."],["How does Kruskal's algorithm use union-find?","Sort the edges by weight; keep an edge only if union succeeds, meaning it joins two different sets."]],"quiz":[{"q":"What does this print? (`DSU` is this module's union-find class.)","snip":{"t":"Count the sets","tabs":[{"lang":"python","src":"d = DSU(5)\nfor a, b in [(0, 1), (2, 3), (1, 2), (0, 3)]:\n    d.union(a, b)\nprint(d.sets)\n"},{"lang":"javascript","src":"const d = new DSU(5);\nfor (const [a, b] of [[0, 1], [2, 3], [1, 2], [0, 3]]) d.union(a, b);\nconsole.log(d.sets);\n"}]},"o":["2","1","3","4"],"a":0,"e":"Three unions succeed ({0, 1}, {2, 3}, then both together); (0, 3) is already connected. 5 − 3 = 2 sets: {0, 1, 2, 3} and {4}."},{"q":"What does this print?","snip":{"t":"Which unions succeed?","tabs":[{"lang":"python","src":"d = DSU(4)\nprint(*(\"new\" if d.union(a, b) else \"same\" for a, b in [(0, 1), (1, 2), (0, 2), (2, 3), (3, 1)]))\n"},{"lang":"javascript","src":"const d = new DSU(4);\nconsole.log(...[[0, 1], [1, 2], [0, 2], [2, 3], [3, 1]].map(([a, b]) => (d.union(a, b) ? \"new\" : \"same\")));\n"}]},"o":["new new same new same","new new new new same","new same same new same","new new same new new"],"a":0,"e":"(0, 2) and (3, 1) join items that are already connected, so those unions return false. Each “same” is an edge that would close a loop."},{"q":"Edges of an undirected network arrive one by one, and after each you must report how many separate groups exist. What's the best tool?","o":["Union-find, counting successful unions","A fresh BFS after every edge","A topological sort","A min-heap"],"a":0,"e":"Each successful union lowers the group count by one, in effectively constant time. A BFS per edge costs O(V + E) every time."},{"q":"Which can union-find do efficiently? (choose 2)","t":"ms","o":["Tell whether two items are in the same set","Merge two sets","Split a set in two","Return the path between two items","Detect a cycle in a directed graph"],"a":[0,1],"e":"Union-find only merges and compares roots. Splitting, paths and directed cycles need other tools."},{"q":"Judge each statement.","t":"yn","s":[["With path compression and union by size, operations are effectively constant time.",true],["union(a, b) should set parent[a] = b directly.",false],["Kruskal's algorithm keeps an edge only if its endpoints are in different sets.",true],["Union-find detects cycles in directed graphs.",false]],"e":"α(n) < 5 in practice. Link roots, not elements. Kruskal skips edges inside a set. Directed cycles need DFS colours or Kahn's algorithm."},{"q":"Put Kruskal's algorithm in order.","t":"ord","items":["Sort the edges by weight, cheapest first","Take the next cheapest edge","Keep it if its endpoints are in different sets (the union succeeds)","Stop once V − 1 edges are kept"],"e":"Greedy by weight, with union-find rejecting any edge that would close a loop."},{"q":"Complete this Python union-find (find with path compression, then union).","t":"drop","lang":"python","code":"def find(parent, x):\n    root = x\n    while parent[root] != {{0}}:\n        root = parent[root]\n    while parent[x] != root:\n        nxt = parent[x]\n        parent[x] = {{1}}\n        x = nxt\n    return root\n\ndef union(parent, a, b):\n    ra, rb = find(parent, a), find(parent, b)\n    if ra != rb:\n        parent[{{2}}] = ra\n","blanks":[{"o":["root","x","0","-1"],"a":0},{"o":["root","nxt","x","0"],"a":0},{"o":["rb","b","a","ra"],"a":0}],"e":"A root is its own parent; compression points each node on the path at the root; union links root rb under root ra."},{"q":"Match each question to the union-find move.","t":"match","pairs":[["Are two people in the same friend group?","find(a) == find(b)"],["Join two friend groups","union(a, b)"],["The cheapest network linking every office","Kruskal's MST with union-find"],["The first cable that creates a loop","The first union that returns false"]],"extra":["Topological sort"],"e":"Compare roots, merge roots, keep only joining edges, and watch for failed unions."}],"probs":[["LC 684 · Redundant Connection","https://leetcode.com/problems/redundant-connection/","Medium","the first union that fails"],["LC 721 · Accounts Merge","https://leetcode.com/problems/accounts-merge/","Medium","union accounts that share an email"],["LC 1584 · Min Cost to Connect All Points","https://leetcode.com/problems/min-cost-to-connect-all-points/","Medium","Kruskal on every pair of points (or Prim's)"],["LC 886 · Possible Bipartition","https://leetcode.com/problems/possible-bipartition/","Medium","union each person's dislikes together, then check for conflicts"],["LC 2368 · Reachable Nodes With Restrictions","https://leetcode.com/problems/reachable-nodes-with-restrictions/","Medium","union only unrestricted nodes; answer with the size of 0's set"],["LC 1579 · Remove Max Number of Edges to Keep Graph Fully Traversable","https://leetcode.com/problems/remove-max-number-of-edges-to-keep-graph-fully-traversable/","Hard","two DSUs; add the shared edges first"]],"src":[["cp-algorithms: Disjoint Set Union","https://cp-algorithms.com/data_structures/disjoint_set_union.html"],["cp-algorithms: Kruskal's algorithm with DSU","https://cp-algorithms.com/graph/mst_kruskal_with_dsu.html"],["USACO Guide: Disjoint set union","https://usaco.guide/gold/dsu"],["Wikipedia: Disjoint-set data structure","https://en.wikipedia.org/wiki/Disjoint-set_data_structure"]]},{"id":"m08","d":"d3","t":"Backtracking: subsets, permutations, combinations","min":100,"hook":"When a problem says “all”, “every combination” or “any valid arrangement” (subsets, permutations, Sudoku, N-Queens), backtracking explores the choices one at a time and undoes each choice when it leads nowhere.","pre":{"q":"How many different subsets does a set of 4 items have, and where does that number come from?","a":"16 = 2⁴. For each item you decide “in or out”, and 4 independent yes/no choices give 2 × 2 × 2 × 2 combinations."},"kid":{"t":"Packing the toy bag","x":"Tara is choosing toys for the road trip. She walks along the shelf, and for each toy she asks “in the bag or not?” and writes her answer down. When she reaches the end of the shelf, she has one complete packing list. Then she steps back, changes her last answer, and walks forward again, until she has tried every possible list. If the bag is already too heavy halfway along the shelf, she doesn't bother finishing that list: she steps back straight away.","map":[["Asking “in or out?” for each toy","One decision at each level of the recursion"],["Reaching the end of the shelf with a complete list","A leaf: record a solution (the base case)"],["Stepping back and changing the last answer","Backtracking: undo the last choice (pop) and try the next one"],["Giving up early when the bag is too heavy","Pruning: stop exploring a branch that can't work"]],"brk":"Tara writes a fresh list every time, but the code keeps one path and changes it in place, so it must store a copy when it records a solution. And no one could finish her game with 30 toys (over a billion lists): backtracking only works for small inputs, or with pruning that cuts most branches early."},"keys":["**Backtracking** builds a solution step by step: choose, explore (recurse), un-choose. It's a depth-first search over a tree of decisions.","**The template**: if the path is complete, record a copy and return; otherwise, for each valid choice: make it, recurse, undo it.","**Record a copy**: `res.append(path[:])` / `res.push([...path])`. Appending `path` itself stores one list that keeps changing.","**Subsets**: include or skip each item, 2ⁿ results. **Permutations**: pick any unused item for each position, n! results. **Combinations of size k**: C(n, k) results; pass a start index so you never go backwards.","**Duplicates in the input**: sort first, then skip a choice equal to the previous one at the same depth. For subsets and combinations that's `i > start and nums[i] == nums[i - 1]`; permutations use a `used` check instead (LeetCode 47).","**Pruning** cuts branches that can't succeed: stop when the running sum passes the target (with sorted candidates), or when a square is under attack.","**The cost is exponential**: these problems generate everything, so n is small (often ≤ 10–20). State the output size, such as 2ⁿ, n! or C(n, k), when you give the complexity.","**Library shortcuts**: Python's `itertools.combinations`, `permutations` and `product` generate these for you; interviews usually want the hand-written version, and JavaScript has no built-in equivalent."],"dia":[{"type":"tree","cap":"The decision tree for the subsets of [1, 2, 3]","root":{"q":"1 in?","c":[["yes",{"q":"2 in?","c":[["yes",{"q":"3 in?","c":[["yes","[1, 2, 3]"],["no","[1, 2]"]]}],["no",{"q":"3 in?","c":[["yes","[1, 3]"],["no","[1]"]]}]]}],["no",{"q":"2 in?","c":[["yes",{"q":"3 in?","c":[["yes","[2, 3]"],["no","[2]"]]}],["no",{"q":"3 in?","c":[["yes","[3]"],["no","[ ]"]]}]]}]]}},{"type":"flow","cap":"One step of the template","steps":[["Choose","add an item to the path"],["Explore","recurse on the rest"],["Un-choose","remove it again"],["Next choice","try the next option"]],"loop":"when the path is complete, save a copy of it"}],"cmp":[{"cap":"How big the output gets","head":["Problem","Count for n = 10","Formula","Typical limit on n"],"rows":[["All subsets","1,024","2ⁿ","about 20"],["All permutations","3,628,800","n!","about 8–10"],["Combinations of size 3","120","C(n, k) = n! / (k! (n − k)!)","depends on k"],["n-Queens solutions","724 (and 92 for n = 8)","no simple formula","about 12–14"]]}],"code":[{"t":"Subsets and permutations with one template","tabs":[{"lang":"python","src":"def subsets(nums):\n    res, path = [], []\n    def backtrack(i):\n        if i == len(nums):                  # every item decided: record a copy\n            res.append(path[:])\n            return\n        path.append(nums[i])                # choose: take nums[i]\n        backtrack(i + 1)\n        path.pop()                          # un-choose\n        backtrack(i + 1)                    # the other branch: skip nums[i]\n    backtrack(0)\n    return res\n\ndef permutations(nums):\n    res, path, used = [], [], [False] * len(nums)\n    def backtrack():\n        if len(path) == len(nums):\n            res.append(path[:])\n            return\n        for i, x in enumerate(nums):\n            if not used[i]:\n                used[i] = True              # choose\n                path.append(x)\n                backtrack()                 # explore\n                path.pop()                  # un-choose\n                used[i] = False\n    backtrack()\n    return res\n\nsubs, perms = subsets([1, 2, 3]), permutations([1, 2, 3])\nprint(len(subs), *(\"\".join(map(str, s)) or \"{}\" for s in subs))\nprint(len(perms), *(\"\".join(map(str, p)) for p in perms))\n","out":"8 123 12 13 1 23 2 3 {}\n6 123 132 213 231 312 321\n","notes":[[5,"`path[:]` is a snapshot. Appending `path` itself would store the same list eight times."],[9,"Pop before the “skip” branch so the path is exactly as it was before the choice."],[20,"Permutations reuse every unused item at each position, so they track `used` instead of a start index."]]},{"lang":"javascript","src":"function subsets(nums) {\n  const res = [], path = [];\n  function backtrack(i) {\n    if (i === nums.length) {                // every item decided: record a copy\n      res.push([...path]);\n      return;\n    }\n    path.push(nums[i]);                     // choose: take nums[i]\n    backtrack(i + 1);\n    path.pop();                             // un-choose\n    backtrack(i + 1);                       // the other branch: skip nums[i]\n  }\n  backtrack(0);\n  return res;\n}\n\nfunction permutations(nums) {\n  const res = [], path = [], used = new Array(nums.length).fill(false);\n  function backtrack() {\n    if (path.length === nums.length) {\n      res.push([...path]);\n      return;\n    }\n    for (let i = 0; i < nums.length; i++) {\n      if (used[i]) continue;\n      used[i] = true;                       // choose\n      path.push(nums[i]);\n      backtrack();                          // explore\n      path.pop();                           // un-choose\n      used[i] = false;\n    }\n  }\n  backtrack();\n  return res;\n}\n\nconst subs = subsets([1, 2, 3]), perms = permutations([1, 2, 3]);\nconsole.log(subs.length, ...subs.map(s => s.join(\"\") || \"{}\"));\nconsole.log(perms.length, ...perms.map(p => p.join(\"\")));\n","out":"8 123 12 13 1 23 2 3 {}\n6 123 132 213 231 312 321\n","notes":[[5,"`[...path]` is a snapshot. Pushing `path` itself would store the same array eight times."],[26,"Permutations reuse every unused item at each position, so they track `used` instead of a start index."]]}]},{"t":"Combinations with pruning: k digits from 1–9 that add up to n","tabs":[{"lang":"python","src":"def combination_sum3(k, n):\n    res, path = [], []\n    def backtrack(start, remaining):\n        if len(path) == k:\n            if remaining == 0:\n                res.append(path[:])\n            return\n        for x in range(start, 10):\n            if x > remaining:               # prune: the digits only get bigger\n                break\n            path.append(x)\n            backtrack(x + 1, remaining - x) # x + 1: each digit once, no reordering\n            path.pop()\n    backtrack(1, n)\n    return res\n\nprint(*(\" \".join(map(str, c)) for c in combination_sum3(3, 9)), sep=\" | \")\nprint(len(combination_sum3(3, 15)), len(combination_sum3(4, 1)))\n","out":"1 2 6 | 1 3 5 | 2 3 4\n8 0\n","notes":[[9,"Because the loop goes upwards, one digit that's too big means every later digit is too."],[12,"Starting the next level at x + 1 means [1, 2, 6] can't also appear as [2, 1, 6]."]]},{"lang":"javascript","src":"function combinationSum3(k, n) {\n  const res = [], path = [];\n  function backtrack(start, remaining) {\n    if (path.length === k) {\n      if (remaining === 0) res.push([...path]);\n      return;\n    }\n    for (let x = start; x <= 9; x++) {\n      if (x > remaining) break;             // prune: the digits only get bigger\n      path.push(x);\n      backtrack(x + 1, remaining - x);      // x + 1: each digit once, no reordering\n      path.pop();\n    }\n  }\n  backtrack(1, n);\n  return res;\n}\n\nconsole.log(combinationSum3(3, 9).map(c => c.join(\" \")).join(\" | \"));\nconsole.log(combinationSum3(3, 15).length, combinationSum3(4, 1).length);\n","out":"1 2 6 | 1 3 5 | 2 3 4\n8 0\n","notes":[[9,"Because the loop goes upwards, one digit that's too big means every later digit is too."]]}]},{"t":"N-Queens: count the boards, pruning attacked squares","tabs":[{"lang":"python","src":"def n_queens(n):\n    cols, diag, anti = set(), set(), set()\n    count = 0\n    def place(r):                           # put a queen somewhere in row r\n        nonlocal count\n        if r == n:\n            count += 1\n            return\n        for c in range(n):\n            if c in cols or r - c in diag or r + c in anti:\n                continue                    # attacked: prune this branch\n            cols.add(c)\n            diag.add(r - c)\n            anti.add(r + c)\n            place(r + 1)\n            cols.remove(c)\n            diag.remove(r - c)\n            anti.remove(r + c)\n    place(0)\n    return count\n\nprint(*(n_queens(n) for n in range(1, 9)))\n","out":"1 0 0 2 10 4 40 92","notes":[[10,"Squares on one diagonal share r − c; squares on one anti-diagonal share r + c. Sets make each check O(1)."]]},{"lang":"javascript","src":"function nQueens(n) {\n  const cols = new Set(), diag = new Set(), anti = new Set();\n  let count = 0;\n  function place(r) {                       // put a queen somewhere in row r\n    if (r === n) {\n      count++;\n      return;\n    }\n    for (let c = 0; c < n; c++) {\n      if (cols.has(c) || diag.has(r - c) || anti.has(r + c)) continue;   // attacked: prune\n      cols.add(c); diag.add(r - c); anti.add(r + c);\n      place(r + 1);\n      cols.delete(c); diag.delete(r - c); anti.delete(r + c);\n    }\n  }\n  place(0);\n  return count;\n}\n\nconsole.log(...Array.from({ length: 8 }, (_, i) => nQueens(i + 1)));\n","out":"1 0 0 2 10 4 40 92","notes":[[10,"Squares on one diagonal share r − c; squares on one anti-diagonal share r + c."]]}]}],"ex":{"q":"Generate every balanced string of n pairs of parentheses.","steps":["Each position is “(” or “)”: 2²ⁿ strings in total, most of them invalid.","Prune with two counters: add “(” only while open < n; add “)” only while close < open.","When the string reaches length 2n it's valid by construction: record it.","The number of results is the Catalan number (5 for n = 3, 42 for n = 5), and the work is roughly that count × n."],"code":{"t":"Backtracking with two counters","tabs":[{"lang":"python","src":"def generate_parentheses(n):\n    res, path = [], []\n    def backtrack(open_, close):\n        if len(path) == 2 * n:\n            res.append(\"\".join(path))\n            return\n        if open_ < n:                       # can still open one\n            path.append(\"(\")\n            backtrack(open_ + 1, close)\n            path.pop()\n        if close < open_:                   # can close one that's open\n            path.append(\")\")\n            backtrack(open_, close + 1)\n            path.pop()\n    backtrack(0, 0)\n    return res\n\nprint(*generate_parentheses(3))\nprint(*(len(generate_parentheses(n)) for n in range(1, 7)))\n","out":"((())) (()()) (())() ()(()) ()()()\n1 2 5 14 42 132\n"},{"lang":"javascript","src":"function generateParentheses(n) {\n  const res = [], path = [];\n  function backtrack(open, close) {\n    if (path.length === 2 * n) {\n      res.push(path.join(\"\"));\n      return;\n    }\n    if (open < n) {                         // can still open one\n      path.push(\"(\");\n      backtrack(open + 1, close);\n      path.pop();\n    }\n    if (close < open) {                     // can close one that's open\n      path.push(\")\");\n      backtrack(open, close + 1);\n      path.pop();\n    }\n  }\n  backtrack(0, 0);\n  return res;\n}\n\nconsole.log(...generateParentheses(3));\nconsole.log(...Array.from({ length: 6 }, (_, i) => generateParentheses(i + 1).length));\n","out":"((())) (()()) (())() ()(()) ()()()\n1 2 5 14 42 132\n"}]},"a":"((())) (()()) (())() ()(()) ()()() for n = 3, and the counts 1, 2, 5, 14, 42, 132 are the Catalan numbers. The two counters prune every branch that could never close properly."},"fade":{"q":"Return every string you can make from `s` by switching the case of its letters (digits stay as they are): “a1b” gives a1b, a1B, A1b, A1B.","steps":["Each letter is a two-way choice (lower or upper); a digit has only one option.",{"ask":"What's the base case?","a":"Index i == len(s): join the path and record it."},{"ask":"How many results for a string with k letters?","a":"2^k."},{"ask":"Time?","a":"O(2^k · n): 2^k strings, each n characters long."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def letter_case_permutations(s):\n    res, path = [], []\n    def backtrack(i):\n        if i == len(s):\n            res.append(\"\".join(path))\n            return\n        ch = s[i]\n        if ch.isalpha():\n            ...                             # TODO: try ch.lower(), then ch.upper()\n        else:\n            path.append(ch)\n            backtrack(i + 1)\n            path.pop()\n    backtrack(0)\n    return res\n\nprint(letter_case_permutations(\"a1b\"))      # expect ['a1b', 'a1B', 'A1b', 'A1B']\n"},{"lang":"javascript","src":"function letterCasePermutations(s) {\n  const res = [], path = [];\n  function backtrack(i) {\n    if (i === s.length) {\n      res.push(path.join(\"\"));\n      return;\n    }\n    const ch = s[i];\n    if (/[a-z]/i.test(ch)) {\n      // TODO: try ch.toLowerCase(), then ch.toUpperCase()\n    } else {\n      path.push(ch);\n      backtrack(i + 1);\n      path.pop();\n    }\n  }\n  backtrack(0);\n  return res;\n}\n\nconsole.log(letterCasePermutations(\"a1b\"));   // expect ['a1b', 'a1B', 'A1b', 'A1B']\n"}]},"solution":{"t":"Solution","tabs":[{"lang":"python","src":"def letter_case_permutations(s):\n    res, path = [], []\n    def backtrack(i):\n        if i == len(s):\n            res.append(\"\".join(path))\n            return\n        ch = s[i]\n        if ch.isalpha():\n            for variant in (ch.lower(), ch.upper()):\n                path.append(variant)\n                backtrack(i + 1)\n                path.pop()\n        else:\n            path.append(ch)\n            backtrack(i + 1)\n            path.pop()\n    backtrack(0)\n    return res\n\nprint(*letter_case_permutations(\"a1b\"), *letter_case_permutations(\"3z4\"))\n","out":"a1b a1B A1b A1B 3z4 3Z4"},{"lang":"javascript","src":"function letterCasePermutations(s) {\n  const res = [], path = [];\n  function backtrack(i) {\n    if (i === s.length) {\n      res.push(path.join(\"\"));\n      return;\n    }\n    const ch = s[i];\n    const options = /[a-z]/i.test(ch) ? [ch.toLowerCase(), ch.toUpperCase()] : [ch];\n    for (const variant of options) {\n      path.push(variant);\n      backtrack(i + 1);\n      path.pop();\n    }\n  }\n  backtrack(0);\n  return res;\n}\n\nconsole.log(...letterCasePermutations(\"a1b\"), ...letterCasePermutations(\"3z4\"));\n","out":"a1b a1B A1b A1B 3z4 3Z4"}]}},"traps":[["“`res.append(path)` saves the current path.”","It saves a reference to the one list you keep changing, so every saved entry ends up the same (often empty). Save a copy: `path[:]` / `[...path]`."],["“Forgetting to undo a choice only affects that branch.”","The leftover item stays in `path` (or `used`) for every later branch and corrupts all the results that follow. Every choose needs a matching un-choose."],["“Permutations need a start index, like combinations.”","Combinations use a start index so an earlier item is never picked again (order doesn't matter). Permutations reuse every unused item at each position (order matters), so they track `used` instead."],["“Remove duplicate results by putting them in a set.”","It works but wastes time generating the duplicates. Sort first and skip equal neighbours at the same depth."],["“Backtracking is roughly O(n²).”","It's exponential: 2ⁿ subsets or n! permutations. That's why inputs are small, and why you state the output size when giving the complexity."],["“Building strings with `+` in every call is free.”","For short outputs it's fine, but a list `path` with append/pop avoids copying at every step; join only when you record."]],"disc":[["How can you tell a problem wants backtracking rather than dynamic programming?","If it asks you to list every solution (all subsets, all valid boards), you have to generate them: backtracking. If it asks for a count or a best value and the same subproblems repeat, DP is usually the better tool."],["What makes pruning effective?","Checking as early as possible that a partial solution can't succeed (the sum is already too big, the square is already attacked), especially with sorted input, where one failure means every later choice fails too."]],"teach":{"prompt":"Explain to a junior colleague the backtracking template, using “all subsets of a list” as the example.","rubric":["Build a path step by step: at each index, include or skip","Choose, recurse, un-choose (pop), so one path list is reused","At the end (index n), record a copy of the path","2ⁿ subsets: O(n · 2ⁿ) time","Mentions pruning or handling duplicates"],"model":"Backtracking explores a tree of decisions with depth-first search. For all subsets, the decision at index i is “include nums[i] or not”. The function appends nums[i] to a shared path, recurses to index i + 1, then pops it off and recurses again without it. When the index reaches the end, every item has been decided, so the path is one complete subset: record a copy, because the path will keep changing. With n items there are 2ⁿ leaves, so listing them all costs O(n · 2ⁿ). Pruning, which skips branches that can't lead to a valid answer, is what keeps harder versions fast enough."},"qa":[["The three moves of backtracking?","Choose, explore (recurse), un-choose."],["Why record `path[:]` / `[...path]` instead of `path`?","`path` is one list that keeps changing; you need a snapshot."],["How many subsets and permutations do n items have?","2ⁿ subsets and n! permutations."],["How do you avoid duplicate results when the input has duplicates?","Sort, then skip an item equal to the previous one at the same depth."],["Combinations vs permutations in code?","Combinations pass a start index that only moves forward; permutations track which items are used."],["What is pruning?","Abandoning a partial solution as soon as it can't lead to a valid answer."]],"quiz":[{"q":"What does this print?","snip":{"t":"Record at every node","tabs":[{"lang":"python","src":"res, path = [], []\ndef backtrack(start):\n    res.append(path[:])\n    for i in range(start, 3):\n        path.append(i)\n        backtrack(i + 1)\n        path.pop()\nbacktrack(0)\nprint(len(res), max(len(p) for p in res))\n"},{"lang":"javascript","src":"const res = [], path = [];\nfunction backtrack(start) {\n  res.push([...path]);\n  for (let i = start; i < 3; i++) {\n    path.push(i);\n    backtrack(i + 1);\n    path.pop();\n  }\n}\nbacktrack(0);\nconsole.log(res.length, Math.max(...res.map(p => p.length)));\n"}]},"o":["8 3","6 3","7 2","3 3"],"a":0,"e":"Recording at every node (not just at the leaves) of the start-index tree lists every subset of {0, 1, 2}: 2³ = 8, the largest having 3 items."},{"q":"What does this print?","snip":{"t":"Spot the bug","tabs":[{"lang":"python","src":"res, path = [], []\ndef backtrack(i):\n    if i == 2:\n        res.append(path)          # no copy!\n        return\n    for x in \"ab\":\n        path.append(x)\n        backtrack(i + 1)\n        path.pop()\nbacktrack(0)\nprint(len(res), sum(len(p) for p in res))\n"},{"lang":"javascript","src":"const res = [], path = [];\nfunction backtrack(i) {\n  if (i === 2) {\n    res.push(path);               // no copy!\n    return;\n  }\n  for (const x of \"ab\") {\n    path.push(x);\n    backtrack(i + 1);\n    path.pop();\n  }\n}\nbacktrack(0);\nconsole.log(res.length, res.reduce((s, p) => s + p.length, 0));\n"}]},"o":["4 0","4 8","2 4","0 0"],"a":0,"e":"All four entries are the same list, which is empty once the search finishes. Recording a copy would give 4 strings of length 2 (8 letters)."},{"q":"Which change stops the start-index subsets generator (as in question 1) from producing duplicate subsets for [1, 2, 2]?","o":["Sort, then skip nums[i] when i > start and nums[i] == nums[i − 1]","Use a while loop instead of recursion","Record path instead of path[:]","Start the loop at 0 every time"],"a":0,"e":"Skipping equal neighbours at the same depth means each value is chosen once per position. The other changes either do nothing or break the generator."},{"q":"Which of these need backtracking, because you must list many solutions? (choose 3)","t":"ms","o":["List every valid placement of 8 queens","List all permutations of a string","List every way to split a string into palindromes","The length of the longest increasing subsequence","The number of ways to climb n stairs"],"a":[0,1,2],"e":"The last two ask for a single number with overlapping subproblems: dynamic programming."},{"q":"Judge each statement.","t":"yn","s":[["A set of n items has 2ⁿ subsets.",true],["Permutation generators usually need a start index so earlier items aren't reused.",false],["Pruning can skip whole branches of the decision tree.",true],["Generating all permutations of 15 items is quick because each step is O(1).",false]],"e":"Permutations track used items, not a start index. 15! is about 1.3 × 10¹²: far too many to list."},{"q":"Put one step of the backtracking template in order.","t":"ord","items":["Check whether the next choice is valid","Make the choice (add it to the path)","Recurse to decide the rest","Undo the choice (remove it from the path)"],"e":"Check, choose, explore, un-choose."},{"q":"Complete the JavaScript permutation generator.","t":"drop","lang":"javascript","code":"function permute(nums) {\n  const res = [], path = [], used = new Array(nums.length).fill(false);\n  function backtrack() {\n    if (path.length === nums.length) {\n      res.push({{0}});\n      return;\n    }\n    for (let i = 0; i < nums.length; i++) {\n      if (used[i]) continue;\n      used[i] = true;\n      path.push(nums[i]);\n      backtrack();\n      path.{{1}}();\n      used[i] = {{2}};\n    }\n  }\n  backtrack();\n  return res;\n}\n","blanks":[{"o":["[...path]","path","nums","path.length"],"a":0},{"o":["pop","shift","push","reverse"],"a":0},{"o":["false","true","i","1"],"a":0}],"e":"Record a copy, pop the last item to undo the push, and mark the item unused again."},{"q":"Match each task to its backtracking shape.","t":"match","pairs":[["Every subset","Include or skip each item"],["Every ordering","Pick any unused item for each position"],["Every size-k group, order ignored","A start index that only moves forward; stop at k items"],["Subsets of [1, 2, 2] without repeats","Sort, then skip equal neighbours at the same depth"]],"extra":["Binary search"],"e":"The shape of the decision tree depends on whether order matters and whether items repeat."}],"probs":[["LC 90 · Subsets II","https://leetcode.com/problems/subsets-ii/","Medium","sort; skip equal neighbours at the same depth"],["LC 46 · Permutations","https://leetcode.com/problems/permutations/","Medium","the used-array template"],["LC 39 · Combination Sum","https://leetcode.com/problems/combination-sum/","Medium","reuse allowed: recurse with i, not i + 1; prune when too big"],["LC 40 · Combination Sum II","https://leetcode.com/problems/combination-sum-ii/","Medium","each number once; skip duplicates"],["LC 77 · Combinations","https://leetcode.com/problems/combinations/","Medium","a start index; stop when the path has k items"],["LC 17 · Letter Combinations of a Phone Number","https://leetcode.com/problems/letter-combinations-of-a-phone-number/","Medium","one recursion level per digit"],["LC 79 · Word Search","https://leetcode.com/problems/word-search/","Medium","mark the cell, recurse in 4 directions, unmark"],["LC 131 · Palindrome Partitioning","https://leetcode.com/problems/palindrome-partitioning/","Medium","cut wherever the prefix is a palindrome"],["LC 51 · N-Queens","https://leetcode.com/problems/n-queens/","Hard","sets for columns and both diagonals"],["LC 37 · Sudoku Solver","https://leetcode.com/problems/sudoku-solver/","Hard","try 1–9 in each empty cell; undo on failure"]],"src":[["Wikipedia: Backtrack
