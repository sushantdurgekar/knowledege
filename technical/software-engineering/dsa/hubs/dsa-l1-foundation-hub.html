from the head."],["Why use a dummy head node?","Inserting or deleting at the front stops being a special case; return `dummy.next` at the end."],["The three steps inside the reversal loop?","Save nxt = cur.next; set cur.next = prev; move prev = cur and cur = nxt."],["How do fast and slow pointers detect a cycle?","Slow moves 1 and fast moves 2. If they ever reach the same node there's a cycle; if fast reaches the end there isn't."],["Find the k-th node from the end in one pass?","Move a lead pointer k steps ahead, then move lead and follow together until lead falls off the end; follow is the answer."],["Why compare nodes with `is` / `===` in a cycle check?","You need the same node object, not just an equal value."]],"quiz":[{"q":"What does this print?","snip":{"t":"Trace the links","tabs":[{"lang":"python","src":"class ListNode:\n    def __init__(self, val, next=None):\n        self.val, self.next = val, next\n\nhead = ListNode(1, ListNode(2, ListNode(3)))\nhead.next = head.next.next\ntotal, node = 0, head\nwhile node:\n    total += node.val\n    node = node.next\nprint(total)\n"},{"lang":"javascript","src":"class ListNode {\n  constructor(val, next = null) { this.val = val; this.next = next; }\n}\nconst head = new ListNode(1, new ListNode(2, new ListNode(3)));\nhead.next = head.next.next;\nlet total = 0;\nfor (let node = head; node; node = node.next) total += node.val;\nconsole.log(total);\n"}]},"o":["4","6","3","1"],"a":0,"e":"`head.next = head.next.next` skips node 2, so the list is 1 → 3 and the total is 4. That one line is how you delete a node."},{"q":"What does this print?","snip":{"t":"Fast and slow","tabs":[{"lang":"python","src":"class ListNode:\n    def __init__(self, val, next=None):\n        self.val, self.next = val, next\n\nhead = None\nfor v in [8, 7, 6, 5]:\n    head = ListNode(v, head)      # push to the front\nslow = fast = head\nwhile fast and fast.next:\n    slow, fast = slow.next, fast.next.next\nprint(slow.val)\n"},{"lang":"javascript","src":"class ListNode {\n  constructor(val, next = null) { this.val = val; this.next = next; }\n}\nlet head = null;\nfor (const v of [8, 7, 6, 5]) head = new ListNode(v, head);   // push to the front\nlet slow = head, fast = head;\nwhile (fast && fast.next) {\n  slow = slow.next;\n  fast = fast.next.next;\n}\nconsole.log(slow.val);\n"}]},"o":["7","6","5","8"],"a":0,"e":"Pushing to the front builds 5 → 6 → 7 → 8. With an even length this loop stops on the second middle node: 7."},{"q":"What goes wrong if the reversal loop runs `cur.next = prev` *before* saving `cur.next`?","o":["The rest of the list is lost, so the loop can't move on","Nothing: the order of the steps doesn't matter","The list gets reversed twice","It becomes O(n²)"],"a":0,"e":"`cur.next` was the only link to the rest of the list. Overwrite it first and that link is gone."},{"q":"Which are O(1) on a singly linked list that only keeps a head pointer? (choose 2)","t":"ms","o":["Insert a new node at the head","Insert a node right after a node you already hold","Read the 50th node","Append at the end","Find the node with value 42"],"a":[0,1],"e":"Head inserts and inserts after a known node only change pointers. Reading by position, appending without a tail pointer and searching all walk the list."},{"q":"Judge each statement.","t":"yn","s":[["A dummy head node removes the special case for deleting the first node.",true],["`while fast.next and fast:` is a safe loop condition.",false],["Floyd's method detects a cycle with O(1) extra space.",true],["Reversing a list recursively uses O(1) extra space.",false]],"e":"Check `fast` before `fast.next`: the order of short-circuit tests matters. Recursion keeps one stack frame per node, so it's O(n) space."},{"q":"Put one iteration of the reversal loop in order.","t":"ord","items":["nxt = cur.next","cur.next = prev","prev = cur","cur = nxt"],"e":"Save, flip, then advance both pointers."},{"q":"Complete the Python merge of two sorted lists.","t":"drop","lang":"python","code":"def merge(a, b):\n    dummy = tail = ListNode(0)\n    while a and b:\n        if a.val <= b.val:\n            tail.next, a = a, a.next\n        else:\n            tail.next, b = b, b.next\n        tail = {{0}}\n    tail.next = {{1}}\n    return {{2}}\n","blanks":[{"o":["tail.next","a","b","dummy"],"a":0},{"o":["a or b","None","a","dummy"],"a":0},{"o":["dummy.next","dummy","tail","a"],"a":0}],"e":"Move `tail` onto the node just attached, hang whatever list is left on the end (`a or b`), and skip the dummy when returning."},{"q":"Match each task to its technique.","t":"match","pairs":[["Find the middle in one pass","Fast and slow pointers"],["Find the k-th node from the end","A lead pointer k steps ahead"],["Merge two sorted lists without special cases","A dummy head node"],["Reverse in place","prev, cur and a saved next"]],"extra":["Binary search"],"e":"Speed difference, a fixed gap, a fake head, and save-before-overwrite: the four core linked-list moves."}],"probs":[["LC 206 · Reverse Linked List","https://leetcode.com/problems/reverse-linked-list/","Easy","the loop from memory; then try it recursively"],["LC 141 · Linked List Cycle","https://leetcode.com/problems/linked-list-cycle/","Easy","fast and slow pointers"],["LC 876 · Middle of the Linked List","https://leetcode.com/problems/middle-of-the-linked-list/","Easy","fast and slow; the second middle"],["LC 203 · Remove Linked List Elements","https://leetcode.com/problems/remove-linked-list-elements/","Easy","a dummy head"],["LC 234 · Palindrome Linked List","https://leetcode.com/problems/palindrome-linked-list/","Easy","find the middle, reverse the second half, compare"],["LC 160 · Intersection of Two Linked Lists","https://leetcode.com/problems/intersection-of-two-linked-lists/","Easy","two pointers that switch lists at the end"],["LC 19 · Remove Nth Node From End of List","https://leetcode.com/problems/remove-nth-node-from-end-of-list/","Medium","dummy head + a lead pointer n + 1 steps ahead"],["LC 2 · Add Two Numbers","https://leetcode.com/problems/add-two-numbers/","Medium","walk both lists with a carry"],["LC 707 · Design Linked List","https://leetcode.com/problems/design-linked-list/","Medium","build it yourself: dummy head and a size counter"]],"src":[["MIT 6.006 Introduction to Algorithms (Spring 2020): sequence data structures","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["Wikipedia: Cycle detection (Floyd's tortoise and hare)","https://en.wikipedia.org/wiki/Cycle_detection"],["Python docs: collections.deque (what to use instead in real code)","https://docs.python.org/3/library/collections.html#collections.deque"]]},{"id":"m07","d":"d4","t":"Recursion","min":85,"hook":"Recursion solves a big problem by solving a smaller copy of the same problem. It's the foundation for trees, graphs, backtracking and divide-and-conquer sorting, so getting comfortable with it now pays off all through L2.","pre":{"q":"`count_down(n)` prints n, then calls `count_down(n − 1)`. What must it do when n reaches 0, and what happens if it doesn't?","a":"It must stop and return without calling itself: that's the base case. Without it the calls never end and the program crashes with a stack overflow (`RecursionError` in Python, `RangeError: Maximum call stack size exceeded` in JavaScript)."},"kid":{"t":"The boxes inside boxes","x":"Tara gets a present in a box. Inside is a smaller box, and inside that another, each with a note: “open me, then add 1 to whatever the inner box says”. The tiniest box has no box inside, just a note saying “1”. Tara opens boxes all the way down, remembering where she is in each one, then climbs back out adding 1 at each level: the answer is how many boxes there were. If a box pointed to an even bigger box, she'd never finish.","map":[["Each box holds a smaller box","The recursive case: call yourself on a smaller input"],["The tiniest box just says “1”","The base case: answer directly, no more calls"],["Remembering where she is in each box","The call stack: one frame per pending call"],["Climbing back out, adding 1 at each level","Results combine as the calls return"],["A box that points to a bigger box","No progress towards the base case: infinite recursion, stack overflow"]],"brk":"Real call stacks are small: Python stops at about 1,000 nested calls by default, and JavaScript runs out after roughly ten thousand, so a present with 100,000 boxes would crash. Deep, simple recursion is often better as a loop."},"keys":["**Two parts**: a base case that answers directly, and a recursive case that calls the function on a *smaller* input and combines the result. Every call must move towards the base case.","**The call stack** keeps one frame (local variables and where to return to) per pending call, so a recursion d levels deep costs O(d) space.","**Limits**: Python's default limit is 1,000 nested calls (`RecursionError`); Node.js runs out after roughly ten thousand (`RangeError: Maximum call stack size exceeded`). Neither CPython nor Node.js optimises tail calls, so deep linear recursion should become a loop.","**Time = number of calls × work per call.** One call on n − 1 makes n calls: O(n). Halving makes about log₂ n calls. Two calls on n − 1 and n − 2 (naive Fibonacci) makes about 1.6ⁿ calls: exponential.","**Memoisation** caches the answer to each subproblem, so naive Fibonacci drops from exponential to O(n). Python: `@functools.cache`; JavaScript: a `Map`. This is the doorway to dynamic programming (L2).","**Trust the recursion** (the “leap of faith”): assume the call on the smaller input returns the right answer, and only check your base case and your combine step.","**Pass indexes, not slices**: give the helper `lo` and `hi` instead of `a[1:]` or `s.slice(1)`, so each call does O(1) work and nothing is copied."],"dia":[{"type":"layers","cap":"The call stack for factorial(4): calls go down, answers come back up","rows":[["factorial(4)","waits for factorial(3), then × 4 → 24"],["factorial(3)","waits for factorial(2), then × 3 → 6"],["factorial(2)","waits for factorial(1), then × 2 → 2"],["factorial(1)","base case: returns 1"]]},{"type":"btree","cap":"Naive fib(5) calls fib(n − 1) on the left and fib(n − 2) on the right","nodes":["f5","f4","f3","f3","f2","f2","f1","f2","f1","f1","f0","f1","f0",null,null,"f1","f0"],"hl":["f3"],"note":"fib(3) is computed twice and fib(2) three times. A memo computes each value once: O(n) instead of exponential."}],"cmp":[{"cap":"Counting calls","head":["Shape of the recursion","Calls","Time","Stack space"],"rows":[["One call on n − 1 (factorial, sum of a list)","n","O(n)","O(n)"],["One call on n / 2 (fast power)","about log₂ n","O(log n)","O(log n)"],["Calls on n − 1 and n − 2 (naive Fibonacci)","about 1.6ⁿ","O(2ⁿ) (tighter: O(1.62ⁿ))","O(n)"],["The same, memoised","about 2n","O(n)","O(n)"],["Two calls on halves plus a linear merge (merge sort)","about 2n","O(n log n)","O(log n) stack + O(n) merge buffer"]]}],"code":[{"t":"Base case, recursive case, and the stack limit","tabs":[{"lang":"python","src":"import sys\n\ndef factorial(n):\n    if n <= 1:                    # base case\n        return 1\n    return n * factorial(n - 1)   # smaller input, then combine\n\ndef digit_sum(n):\n    if n < 10:                    # base case: a single digit\n        return n\n    return n % 10 + digit_sum(n // 10)\n\nprint(factorial(5), digit_sum(9045), sys.getrecursionlimit())\n","out":"120 18 1000","notes":[[4,"`n <= 1` rather than `n == 1`: a stray 0 or negative input still stops."],[13,"Python's default recursion limit: about 1,000 nested calls."]]},{"lang":"javascript","src":"function factorial(n) {\n  if (n <= 1) return 1;                 // base case\n  return n * factorial(n - 1);          // smaller input, then combine\n}\n\nfunction digitSum(n) {\n  if (n < 10) return n;                 // base case: a single digit\n  return (n % 10) + digitSum(Math.floor(n / 10));\n}\n\nfunction dive() { dive(); }             // no base case at all\ntry {\n  dive();\n} catch (e) {\n  console.log(factorial(5), digitSum(9045), e instanceof RangeError);\n}\n","out":"120 18 true","notes":[[11,"With no base case, the stack fills up and Node.js throws a `RangeError`."]]}]},{"t":"Memoisation: from about 240,000 calls to about 50","tabs":[{"lang":"python","src":"from functools import cache\n\ncalls = 0\ndef fib(n):\n    global calls\n    calls += 1\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\n@cache                           # remember every answer\ndef fib_memo(n):\n    if n <= 1:\n        return n\n    return fib_memo(n - 1) + fib_memo(n - 2)\n\nprint(fib(25), calls)\nprint(fib_memo(78))\n","out":"75025 242785\n8944394323791464\n","notes":[[17,"242,785 calls for fib(25): the same small values are recomputed again and again."],[18,"With the cache, fib(78) needs each value from 0 to 78 only once."]]},{"lang":"javascript","src":"let calls = 0;\nfunction fib(n) {\n  calls++;\n  if (n <= 1) return n;\n  return fib(n - 1) + fib(n - 2);\n}\n\nconst memo = new Map();          // remember every answer\nfunction fibMemo(n) {\n  if (n <= 1) return n;\n  if (memo.has(n)) return memo.get(n);\n  const v = fibMemo(n - 1) + fibMemo(n - 2);\n  memo.set(n, v);\n  return v;\n}\n\nconsole.log(fib(25), calls);\nconsole.log(fibMemo(78));\n","out":"75025 242785\n8944394323791464\n","notes":[[18,"fib(78) is the largest Fibonacci number below 2⁵³, the limit for exact whole numbers in a JavaScript `Number` (use `BigInt` beyond it)."]]}]},{"t":"Pass indexes, not slices: a recursive palindrome check","tabs":[{"lang":"python","src":"def is_palindrome(s, lo=0, hi=None):\n    if hi is None:\n        hi = len(s) - 1\n    if lo >= hi:                          # 0 or 1 characters left\n        return True\n    if s[lo] != s[hi]:\n        return False\n    return is_palindrome(s, lo + 1, hi - 1)   # O(1) work per call: no slicing\n\nprint(*(\"yes\" if is_palindrome(w) else \"no\" for w in (\"racecar\", \"abba\", \"abca\", \"\")))\n","out":"yes yes no yes","notes":[[8,"`is_palindrome(s[1:-1])` would copy the string at every level: O(n²) in total. The depth is n/2 calls, so very long strings (over about 2,000 characters) hit Python's limit: a loop is better there."]]},{"lang":"javascript","src":"function isPalindrome(s, lo = 0, hi = s.length - 1) {\n  if (lo >= hi) return true;                 // 0 or 1 characters left\n  if (s[lo] !== s[hi]) return false;\n  return isPalindrome(s, lo + 1, hi - 1);    // O(1) work per call: no slicing\n}\n\nconsole.log(...[\"racecar\", \"abba\", \"abca\", \"\"].map(w => (isPalindrome(w) ? \"yes\" : \"no\")));\n","out":"yes yes no yes","notes":[[1,"Default parameters are evaluated at call time, so `hi` can depend on `s`."]]}]}],"ex":{"q":"Compute `x ** n` for a whole number n ≥ 0 with O(log n) multiplications instead of n.","steps":["Base case: x⁰ = 1.","Recursive case: compute `half = power(x, n // 2)` **once**.","If n is even, xⁿ = half × half; if n is odd, xⁿ = half × half × x.","n halves at every call, so there are about log₂ n calls: O(log n) time and O(log n) stack space. Calling `power(x, n // 2)` twice instead of reusing `half` would bring back about n calls."],"code":{"t":"Fast power","tabs":[{"lang":"python","src":"def power(x, n):\n    if n == 0:                         # base case\n        return 1\n    half = power(x, n // 2)            # solve the half-size problem ONCE\n    if n % 2 == 0:\n        return half * half\n    return half * half * x\n\ncalls = []\ndef traced(x, n):                       # the same function, recording each n\n    calls.append(n)\n    if n == 0:\n        return 1\n    half = traced(x, n // 2)\n    return half * half * (x if n % 2 else 1)\n\nprint(power(2, 10), power(3, 5), traced(2, 30), *calls)\n","out":"1024 243 1073741824 30 15 7 3 1 0"},{"lang":"javascript","src":"function power(x, n) {\n  if (n === 0) return 1;                      // base case\n  const half = power(x, Math.floor(n / 2));   // solve the half-size problem ONCE\n  return n % 2 === 0 ? half * half : half * half * x;\n}\n\nconst calls = [];\nfunction traced(x, n) {                       // the same function, recording each n\n  calls.push(n);\n  if (n === 0) return 1;\n  const half = traced(x, Math.floor(n / 2));\n  return half * half * (n % 2 ? x : 1);\n}\n\nconsole.log(power(2, 10), power(3, 5), traced(2, 30), ...calls);\n","out":"1024 243 1073741824 30 15 7 3 1 0"}]},"a":"1024, 243 and 2³⁰ = 1,073,741,824, using only 6 calls for n = 30 (30 → 15 → 7 → 3 → 1 → 0) instead of 30 multiplications."},"fade":{"q":"Flatten a nested list: `[1, [2, [3, 4]], 5]` becomes `[1, 2, 3, 4, 5]`.","steps":["A list can contain lists, which can contain lists… The data is recursive, so the code can be too.",{"ask":"What's the base case?","a":"An item that isn't a list: append it to the output."},{"ask":"What's the recursive case, and why pass the same `out` list down?","a":"An item that is a list: flatten it into the same `out` list (trust the recursion). Returning a new list from every level and extending it would copy deeply nested items once per level."},{"ask":"Time and stack space?","a":"O(total items + total lists) time, because each item is appended exactly once. Stack depth equals the deepest nesting level."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def flatten(items, out=None):\n    if out is None:                # a fresh list for each top-level call\n        out = []\n    for x in items:\n        if isinstance(x, list):\n            ...                    # TODO: flatten x into the same out list\n        else:\n            out.append(x)\n    return out\n\nprint(flatten([1, [2, [3, 4]], 5]))     # expect [1, 2, 3, 4, 5]\n"},{"lang":"javascript","src":"function flatten(items, out = []) {      // a fresh [] for each top-level call\n  for (const x of items) {\n    if (Array.isArray(x)) {\n      // TODO: flatten x into the same out array\n    } else out.push(x);\n  }\n  return out;\n}\n\nconsole.log(flatten([1, [2, [3, 4]], 5]));   // expect [1, 2, 3, 4, 5]\n"}]},"solution":{"t":"Solution: one shared output list","tabs":[{"lang":"python","src":"def flatten(items, out=None):\n    if out is None:                # not `out=[]`: a default list would be shared by every call\n        out = []\n    for x in items:\n        if isinstance(x, list):\n            flatten(x, out)        # trust the recursion: it appends into out\n        else:\n            out.append(x)          # base case: a plain item\n    return out\n\nprint(*flatten([1, [2, [3, [4, []]]], 5]))\n","out":"1 2 3 4 5"},{"lang":"javascript","src":"function flatten(items, out = []) {      // JS evaluates the default on every call, so this is safe\n  for (const x of items) {\n    if (Array.isArray(x)) flatten(x, out);   // trust the recursion: it pushes into out\n    else out.push(x);                        // base case: a plain item\n  }\n  return out;\n}\n\nconsole.log(...flatten([1, [2, [3, [4, []]]], 5]));   // built-in: arr.flat(Infinity)\n","out":"1 2 3 4 5"}]}},"traps":[["“Recursion without a base case stops eventually.”","It never stops by itself: it fills the call stack and crashes with `RecursionError` (Python) or `RangeError: Maximum call stack size exceeded` (JavaScript)."],["“Every recursive call automatically gets closer to the base case.”","Only if the input really shrinks. `f(n)` calling `f(n)` or `f(n + 1)`, or a negative n that skips past an `== 0` check, recurses forever. Guards like `n <= 0` are safer."],["“Recursion costs no extra memory.”","Each pending call keeps a stack frame: depth d means O(d) extra space, and 100,000 levels crashes in both languages unless you rewrite it as a loop."],["“Naive Fibonacci is O(n) because it's only n levels deep.”","Depth is n, but the number of calls is about 1.6ⁿ: exponential time. Memoisation brings it down to O(n)."],["“Slicing in recursive calls is fine.”","`f(a[1:])` or `f(s.slice(1))` copies the rest of the input at every level: O(n²) time and memory in total. Pass indexes instead."],["“A mutable default argument makes a handy memo.”","In Python, `def f(n, memo={})` shares one dict across every call, forever, which surprises people in tests. Use `@functools.cache` or pass the memo explicitly."]],"disc":[["When is recursion clearer than a loop, and when is a loop better?","Recursion is clearer for naturally recursive shapes: trees, nested lists, divide and conquer, backtracking. A loop is better for long linear chains, such as counting down or walking a long list, where the depth would hit the stack limit."],["Why does memoising Fibonacci turn exponential time into O(n)?","There are only n + 1 different inputs (0 to n). Without a cache, the same inputs are recomputed exponentially many times; with one, each is computed once and every later call is an O(1) lookup."]],"teach":{"prompt":"Explain to a junior colleague how a recursive function works, using factorial, and how to judge its time and space.","rubric":["The base case answers directly; the recursive case calls itself on a smaller input","Each call waits on the stack until the smaller call returns, then combines","Time = number of calls × work per call (factorial: n calls, O(n))","Space = the deepest the call stack gets (factorial: O(n))","Names the risk: a missing base case or too much depth causes a stack overflow"],"model":"A recursive function solves a problem by calling itself on a smaller version of it. factorial(n) has a base case, factorial(1) = 1, and a recursive case, n × factorial(n − 1). Each call waits on the call stack until the smaller call returns, then multiplies and returns its own answer, so the result builds up on the way back. To judge the cost, count the calls and the work per call: factorial makes n calls of O(1) work, so O(n) time, and up to n calls wait at once, so O(n) stack space. Without a base case, or with very deep input, the stack overflows."},"qa":[["The two parts of every recursive function?","A base case that answers directly, and a recursive case that calls itself on a smaller input and combines the result."],["Stack space of a recursion n levels deep?","O(n): one frame per pending call."],["Python's default recursion limit, and the error you get past it?","About 1,000 nested calls; `RecursionError`."],["Roughly how many calls does naive fib(n) make?","About 1.6ⁿ, which is exponential. Memoisation makes it O(n)."],["How do you memoise in Python and in JavaScript?","Python: `@functools.cache` (or `lru_cache`). JavaScript: a `Map` checked at the start of the function."],["Why pass indexes instead of slices into recursive calls?","A slice copies O(n) items per call; indexes keep each call O(1)."]],"quiz":[{"q":"What does this print?","snip":{"t":"Trace it","tabs":[{"lang":"python","src":"def f(n):\n    if n == 0:\n        return 0\n    return n + f(n - 1)\n\nprint(f(4))\n"},{"lang":"javascript","src":"function f(n) {\n  if (n === 0) return 0;\n  return n + f(n - 1);\n}\nconsole.log(f(4));\n"}]},"o":["10","4","24","9"],"a":0,"e":"4 + 3 + 2 + 1 + 0 = 10. The additions happen as the calls return."},{"q":"What does this print?","snip":{"t":"When does each call print?","tabs":[{"lang":"python","src":"def show(n):\n    if n == 0:\n        return\n    show(n - 1)\n    print(n, end=\" \")\n\nshow(3)\nprint()\n"},{"lang":"javascript","src":"const out = [];\nfunction show(n) {\n  if (n === 0) return;\n  show(n - 1);\n  out.push(n);\n}\nshow(3);\nconsole.log(out.join(\" \"));\n"}]},"o":["1 2 3","3 2 1","3 2 1 0","0 1 2 3"],"a":0,"e":"Each call prints *after* its recursive call returns, so the deepest call (n = 1) prints first."},{"q":"What is the time complexity of `g(n)`?","snip":{"t":"Two calls per level","tabs":[{"lang":"python","src":"def g(n):\n    if n <= 1:\n        return 1\n    return g(n - 1) + g(n - 1)\n"},{"lang":"javascript","src":"function g(n) {\n  if (n <= 1) return 1;\n  return g(n - 1) + g(n - 1);\n}\n"}]},"o":["O(2ⁿ)","O(n)","O(n²)","O(log n)"],"a":0,"e":"Each call makes two calls on n − 1, doubling the calls at every level: 1 + 2 + 4 + … ≈ 2ⁿ. Computing `g(n − 1)` once and doubling it would be O(n)."},{"q":"Which of these make a recursive function crash with a stack overflow? (choose 2)","t":"ms","o":["It has no base case","The recursive case never moves towards the base case","The base case returns 0","It uses a memo dictionary","It calls itself twice per level on smaller inputs"],"a":[0,1],"e":"Without a reachable base case the calls never end. Two calls per level on smaller inputs is slow (exponential) but still finishes."},{"q":"Judge each statement.","t":"yn","s":[["Each pending recursive call uses stack space.",true],["CPython optimises tail calls, so deep tail recursion is safe.",false],["Memoisation helps when the same subproblem is solved many times.",true],["`f(a[1:])` in a recursive function costs O(1) per call.",false]],"e":"Frames stay on the stack until their call returns. CPython has no tail-call optimisation. Slicing copies the rest of the list."},{"q":"For n = 20, order these from fewest calls to most.","t":"ord","items":["One call on n // 2 (about 5 calls)","One call on n − 1 (20 calls)","Memoised Fibonacci (about 40 calls)","Naive Fibonacci (about 22,000 calls)"],"e":"Halving is logarithmic, n − 1 is linear, the memo makes about 2n calls, and naive Fibonacci makes 2·F(21) − 1 = 21,891 calls."},{"q":"Complete the memoised Fibonacci in JavaScript.","t":"drop","lang":"javascript","code":"const memo = new Map();\nfunction fib(n) {\n  if (n <= 1) return {{0}};\n  if (memo.{{1}}(n)) return memo.get(n);\n  const v = fib(n - 1) + fib(n - 2);\n  memo.set(n, {{2}});\n  return v;\n}\n","blanks":[{"o":["n","1","0","fib(n)"],"a":0},{"o":["has","keys","includes","set"],"a":0},{"o":["v","n","fib(n)","memo"],"a":0}],"e":"fib(0) = 0 and fib(1) = 1, so the base case returns n. Check the cache with `has`, and store the computed value v."},{"q":"Match each recursive function to its time complexity.","t":"match","pairs":[["factorial(n): one call on n − 1","O(n)"],["power(x, n): one call on n // 2","O(log n)"],["naive fib(n): calls on n − 1 and n − 2","O(2ⁿ)"],["merge sort: two calls on halves plus a linear merge","O(n log n)"]],"extra":["O(n²)"],"e":"Count the calls and the work per call; the tree of calls tells you the total."}],"probs":[["LC 509 · Fibonacci Number","https://leetcode.com/problems/fibonacci-number/","Easy","plain recursion first, then memoise"],["LC 70 · Climbing Stairs","https://leetcode.com/problems/climbing-stairs/","Easy","the same recurrence as Fibonacci"],["LC 342 · Power of Four","https://leetcode.com/problems/power-of-four/","Easy","divide by 4 while you can"],["LC 50 · Pow(x, n)","https://leetcode.com/problems/powx-n/","Medium","the worked example, plus negative n"],["LC 24 · Swap Nodes in Pairs","https://leetcode.com/problems/swap-nodes-in-pairs/","Medium","swap the first two, recurse on the rest"],["LC 78 · Subsets","https://leetcode.com/problems/subsets/","Medium","include or skip each item: a first taste of backtracking"]],"src":[["Python docs: functools.cache","https://docs.python.org/3/library/functools.html#functools.cache"],["Python docs: sys.getrecursionlimit","https://docs.python.org/3/library/sys.html#sys.getrecursionlimit"],["MDN: Recursion","https://developer.mozilla.org/en-US/docs/Glossary/Recursion"],["MDN: Too much recursion (stack overflow errors)","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Errors/Too_much_recursion"]]},{"id":"m08","d":"d4","t":"Sorting and binary search","min":95,"hook":"Sorting is the most common first step in a fast solution, and binary search turns “check every item” into about 20 checks for a million items. Together they unlock a big family of problems, including “binary search on the answer”.","pre":{"q":"I'm thinking of a number from 1 to 100 and will say “higher” or “lower”. What's your best first guess, and how many guesses do you need at most?","a":"50, the middle, because each answer rules out half of what's left. 100 → 50 → 25 → 13 → 7 → 4 → 2 → 1 means at most 7 guesses, since 2⁷ = 128 ≥ 100."},"kid":{"t":"Finding page 300","x":"Ben wants page 300 of a 500-page storybook. Tara opens it in the middle: page 250. “Too early,” says Ben, so they forget the whole first half. She opens the middle of the back half: page 375. “Too far!” They forget everything after it. Halving again and again, they reach page 300 in a handful of tries, never more than nine, instead of three hundred. The trick only works because the pages are in order: in Ben's messy pile of picture cards, opening the middle tells you nothing until he sorts the pile.","map":[["Opening the middle page","Check the middle item: `mid = (lo + hi) // 2`"],["“Too early”: forget the first half","Target is bigger: `lo = mid + 1`"],["“Too far”: forget the back half","Target is smaller: `hi = mid − 1`"],["Never more than nine tries for 500 pages","O(log n): log₂ 500 ≈ 9"],["Sorting the messy card pile first","Binary search needs sorted data: sort once, O(n log n)"]],"brk":"A book opens at any page instantly, like an array. On a linked list you can't jump to the middle, so binary search loses its speed. And real searches often want the *first* page that matches (a lower bound), which needs a slightly different loop."},"keys":["**Built-in sorts are stable and fast**: Python's `sorted()` / `list.sort()` (an adaptive merge sort from the Timsort family, O(n log n)) and JavaScript's `Array.prototype.sort` (stable since ES2019; O(n log n) in V8 and Node.js, though the spec doesn't promise a complexity). Use them in real code.","**JavaScript's default sort compares strings**: `[10, 9, 1].sort()` gives `[1, 10, 9]`. Always pass a comparator for numbers: `a.sort((x, y) => x - y)`.","**Sort by a key**: Python `sorted(people, key=lambda p: (p.age, p.name))`; JavaScript `people.toSorted((a, b) => a.age - b.age || a.name.localeCompare(b.name))`. `sorted()` and `toSorted()` return a new list; `sort()` sorts in place. Note that `localeCompare` follows language rules while Python compares code points, so “alice” and “Bob” can come out in a different order.","**The classic sorts**: insertion sort is O(n²) but quick on tiny or nearly sorted input; merge sort is O(n log n), stable, O(n) extra space; quicksort is O(n log n) on average, O(n²) worst case, in place; counting sort is O(n + k) for small integer ranges.","**Binary search** needs sorted (monotonic) data and halves the search space each step: O(log n), about 20 steps for a million items.","**Pick one interval style and stick to it.** Closed: `while lo <= hi`, `hi = mid − 1`. Half-open lower bound: `while lo < hi`, `hi = mid`. Most bugs come from mixing the two.","**Library help**: Python's `bisect.bisect_left` / `bisect_right` give insertion points. JavaScript has no built-in binary search, so keep a lower-bound function handy.","**Binary search on the answer**: when “can it be done with x?” goes false, false, …, true, true, binary-search the smallest x that works (eating speed, shipping capacity: L2)."],"dia":[{"type":"cells","cap":"Binary search for 23","rows":[{"label":"16 < 23 → go right","vals":[2,5,8,12,16,23,38,56,72,91],"hl":[4],"marks":{"0":"lo","4":"mid","9":"hi"}},{"label":"56 > 23 → go left","vals":[2,5,8,12,16,23,38,56,72,91],"hl":[7],"dim":[0,1,2,3,4],"marks":{"5":"lo","7":"mid","9":"hi"}},{"label":"23 found","vals":[2,5,8,12,16,23,38,56,72,91],"ok":[5],"dim":[0,1,2,3,4,7,8,9],"marks":{"5":"lo·mid","6":"hi"}}],"note":"Each step throws away half of what's left: 10 → 5 → 2 candidates, found on the third look."},{"type":"tree","cap":"Search or sort?","root":{"q":"Is the data sorted?","c":[["yes",{"q":"Looking for a value or a boundary?","c":[["a value","Binary search: O(log n)"],["the first item ≥ x","Lower bound / bisect_left"]]}],["no",{"q":"How many lookups?","c":[["one","Linear scan: O(n)"],["many","Sort once, O(n log n), or build a hash set, O(n)"]]}]]}}],"cmp":[{"cap":"Sorting algorithms at a glance","head":["Algorithm","Best","Average","Worst","Extra space","Stable?"],"rows":[["Insertion sort","O(n)","O(n²)","O(n²)","O(1)","Yes"],["Merge sort","O(n log n)","O(n log n)","O(n log n)","O(n)","Yes"],["Quicksort","O(n log n)","O(n log n)","O(n²)","O(log n) stack","No"],["Heapsort (L2)","O(n log n)","O(n log n)","O(n log n)","O(1)","No"],["Counting sort (keys 0..k)","O(n + k)","O(n + k)","O(n + k)","O(n + k)","Yes"],["Python `sorted` / JS `sort` (V8)","O(n)","O(n log n)","O(n log n)","O(n)","Yes"]]},{"cap":"Sorting in Python and JavaScript","head":["Task","Python","JavaScript"],"rows":[["Numbers ascending, as a new list","`sorted(a)`","`a.toSorted((x, y) => x - y)`"],["In place","`a.sort()`","`a.sort((x, y) => x - y)`"],["Descending","`sorted(a, reverse=True)`","`a.toSorted((x, y) => y - x)`"],["By a key, then a tie-breaker","`sorted(p, key=lambda r: (r.age, r.name))`","`p.toSorted((a, b) => a.age - b.age || a.name.localeCompare(b.name))`"],["Insertion point for x","`bisect.bisect_left(a, x)`","Write a lower-bound loop"]]}],"code":[{"t":"Binary search (closed interval) and lower bound (half-open)","tabs":[{"lang":"python","src":"def binary_search(a, target):              # closed interval [lo, hi]\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if a[mid] == target:\n            return mid\n        if a[mid] < target:\n            lo = mid + 1                   # the answer is right of mid\n        else:\n            hi = mid - 1                   # the answer is left of mid\n    return -1\n\ndef lower_bound(a, target):                # first index with a[i] >= target\n    lo, hi = 0, len(a)                     # half-open interval [lo, hi)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if a[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid                       # mid might be the answer: keep it\n    return lo\n\na = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\nprint(binary_search(a, 23), binary_search(a, 7))\nprint(lower_bound([1, 3, 3, 3, 7], 3), lower_bound([1, 3, 3, 3, 7], 4))\n","out":"5 -1\n1 4\n","notes":[[3,"Closed interval: `lo <= hi`, because a one-item range [lo, lo] still needs checking."],[20,"Half-open: `hi = mid`, never `mid − 1`, because mid may be the first match. It returns what `bisect.bisect_left` returns."]]},{"lang":"javascript","src":"function binarySearch(a, target) {         // closed interval [lo, hi]\n  let lo = 0, hi = a.length - 1;\n  while (lo <= hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (a[mid] === target) return mid;\n    if (a[mid] < target) lo = mid + 1;     // the answer is right of mid\n    else hi = mid - 1;                     // the answer is left of mid\n  }\n  return -1;\n}\n\nfunction lowerBound(a, target) {           // first index with a[i] >= target\n  let lo = 0, hi = a.length;               // half-open interval [lo, hi)\n  while (lo < hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (a[mid] < target) lo = mid + 1;\n    else hi = mid;                         // mid might be the answer: keep it\n  }\n  return lo;\n}\n\nconst a = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91];\nconsole.log(binarySearch(a, 23), binarySearch(a, 7));\nconsole.log(lowerBound([1, 3, 3, 3, 7], 3), lowerBound([1, 3, 3, 3, 7], 4));\n","out":"5 -1\n1 4\n","notes":[[4,"`Math.floor`: plain `/` gives a fraction such as 4.5."],[17,"Half-open: `hi = mid`, never `mid − 1`, because mid may be the first match."]]}]},{"t":"Sorting with keys, and JavaScript's default-sort trap","tabs":[{"lang":"python","src":"nums = [10, 9, 1, 100]\nprint(*sorted(nums), \"|\", *sorted(nums, key=str))     # numbers vs text order\n\npeople = [(\"Tara\", 9), (\"Ben\", 7), (\"Ava\", 9), (\"Raj\", 7)]\nby_age_then_name = sorted(people, key=lambda p: (p[1], p[0]))\nprint(*(name for name, _ in by_age_then_name))\n","out":"1 9 10 100 | 1 10 100 9\nBen Raj Ava Tara\n","notes":[[5,"A tuple key sorts by age first, then by name to break ties."]]},{"lang":"javascript","src":"const nums = [10, 9, 1, 100];\nconsole.log(...nums.toSorted((x, y) => x - y), \"|\", ...nums.toSorted());   // numbers vs the default (text order)\n\nconst people = [[\"Tara\", 9], [\"Ben\", 7], [\"Ava\", 9], [\"Raj\", 7]];\nconst byAgeThenName = people.toSorted((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]));\nconsole.log(...byAgeThenName.map(([name]) => name));\n","out":"1 9 10 100 | 1 10 100 9\nBen Raj Ava Tara\n","notes":[[2,"With no comparator, JavaScript sorts the numbers as text: \"100\" comes before \"9\"."],[5,"`||` falls through to the name comparison only when the ages are equal (difference 0)."]]}]},{"t":"Merge sort: split, sort both halves, merge","tabs":[{"lang":"python","src":"def merge_sort(a):\n    if len(a) <= 1:                        # base case: already sorted\n        return a\n    mid = len(a) // 2\n    left = merge_sort(a[:mid])             # sort each half (recursion)\n    right = merge_sort(a[mid:])\n    out, i, j = [], 0, 0\n    while i < len(left) and j < len(right):   # merge: take the smaller head\n        if left[i] <= right[j]:            # <= keeps equal items in order (stable)\n            out.append(left[i])\n            i += 1\n        else:\n            out.append(right[j])\n            j += 1\n    out.extend(left[i:])                   # one side may have leftovers\n    out.extend(right[j:])\n    return out\n\nprint(*merge_sort([38, 27, 43, 3, 9, 82, 10]))\n","out":"3 9 10 27 38 43 82","notes":[[5,"The slices copy O(n) items per level, which merge sort pays for merging anyway: still O(n log n) in total."],[9,"`<=` takes from the left half on ties, which is what makes merge sort stable."]]},{"lang":"javascript","src":"function mergeSort(a) {\n  if (a.length <= 1) return a;             // base case: already sorted\n  const mid = Math.floor(a.length / 2);\n  const left = mergeSort(a.slice(0, mid)); // sort each half (recursion)\n  const right = mergeSort(a.slice(mid));\n  const out = [];\n  let i = 0, j = 0;\n  while (i < left.length && j < right.length) {    // merge: take the smaller head\n    if (left[i] <= right[j]) out.push(left[i++]);  // <= keeps equal items in order (stable)\n    else out.push(right[j++]);\n  }\n  return out.concat(left.slice(i), right.slice(j));   // one side may have leftovers\n}\n\nconsole.log(...mergeSort([38, 27, 43, 3, 9, 82, 10]));\n","out":"3 9 10 27 38 43 82","notes":[[9,"`<=` takes from the left half on ties, which is what makes merge sort stable."]]}]}],"ex":{"q":"Find ⌊√x⌋ for a whole number x ≥ 0 without calling a square-root function.","steps":["The answer lies between 0 and x, and the test “mid × mid ≤ x” goes true, true, …, true, false, false: it's monotonic.","Binary-search for the *last* true: if `mid * mid <= x`, remember mid and search right (`lo = mid + 1`); otherwise search left (`hi = mid − 1`).","Each step halves the range: O(log x) steps and O(1) space.","Check the edges: 0 and 1 return themselves, perfect squares are exact, and 8 gives 2."],"code":{"t":"Binary search on the answer","tabs":[{"lang":"python","src":"def isqrt(x):\n    lo, hi, ans = 0, x, 0\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if mid * mid <= x:                 # small enough: remember it, try bigger\n            ans = mid\n            lo = mid + 1\n        else:                              # too big: try smaller\n            hi = mid - 1\n    return ans\n\nprint(isqrt(0), isqrt(1), isqrt(8), isqrt(16), isqrt(2_147_395_599))\n","out":"0 1 2 4 46339"},{"lang":"javascript","src":"function isqrt(x) {\n  let lo = 0, hi = x, ans = 0;\n  while (lo <= hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (mid * mid <= x) {                  // small enough: remember it, try bigger\n      ans = mid;\n      lo = mid + 1;\n    } else hi = mid - 1;                   // too big: try smaller\n  }\n  return ans;\n}\n\nconsole.log(isqrt(0), isqrt(1), isqrt(8), isqrt(16), isqrt(2_147_395_599));\n","out":"0 1 2 4 46339"}]},"a":"0, 1, 2, 4 and 46339. O(log x) steps. “Find the last value where a yes/no test is still true” is *binary search on the answer*, and it shows up in many medium problems. (In JavaScript, `mid * mid` is exact up to 2⁵³; for bigger x, compare `mid <= x / mid` or use `BigInt`.)"},"fade":{"q":"Finish insertion sort: grow a sorted prefix by inserting one item at a time.","steps":["Before step i, `a[0..i − 1]` is already sorted.",{"ask":"How do you insert `a[i]` into the sorted prefix?","a":"Save it as `key`, shift every bigger item one place right, then drop `key` into the gap."},{"ask":"What are the best and worst cases?","a":"Best O(n) on sorted input (nothing shifts). Worst O(n²) on reversed input (everything shifts)."},{"ask":"Is it stable?","a":"Yes, as long as you only shift items strictly greater than `key` (`>`, not `>=`)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def insertion_sort(a):\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        # TODO: while j >= 0 and a[j] > key, shift a[j] one place right\n        a[j + 1] = key\n    return a\n\nprint(insertion_sort([5, 2, 4, 6, 1, 3]))    # expect [1, 2, 3, 4, 5, 6]\n"},{"lang":"javascript","src":"function insertionSort(a) {\n  for (let i = 1; i < a.length; i++) {\n    const key = a[i];\n    let j = i - 1;\n    // TODO: while j >= 0 and a[j] > key, shift a[j] one place right\n    a[j + 1] = key;\n  }\n  return a;\n}\n\nconsole.log(insertionSort([5, 2, 4, 6, 1, 3]));    // expect [1, 2, 3, 4, 5, 6]\n"}]},"solution":{"t":"Solution","tabs":[{"lang":"python","src":"def insertion_sort(a):\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        while j >= 0 and a[j] > key:       # > (not >=) keeps it stable\n            a[j + 1] = a[j]                # shift the bigger item right\n            j -= 1\n        a[j + 1] = key                     # drop key into the gap\n    return a\n\nprint(*insertion_sort([5, 2, 4, 6, 1, 3]))\n","out":"1 2 3 4 5 6"},{"lang":"javascript","src":"function insertionSort(a) {\n  for (let i = 1; i < a.length; i++) {\n    const key = a[i];\n    let j = i - 1;\n    while (j >= 0 && a[j] > key) {         // > (not >=) keeps it stable\n      a[j + 1] = a[j];                     // shift the bigger item right\n      j--;\n    }\n    a[j + 1] = key;                        // drop key into the gap\n  }\n  return a;\n}\n\nconsole.log(...insertionSort([5, 2, 4, 6, 1, 3]));\n","out":"1 2 3 4 5 6"}]}},"traps":[["“`[10, 9, 1].sort()` sorts numbers in JavaScript.”","Without a comparator JavaScript compares the items as text, giving `[1, 10, 9]`. Use `a.sort((x, y) => x - y)`."],["“`mid = (lo + hi) / 2` is fine in JavaScript.”","`/` gives a fraction such as 4.5. Use `Math.floor((lo + hi) / 2)`; in Python use `//`."],["“`while lo < hi` with `hi = mid − 1` is a working binary search.”","Mixing styles skips answers or loops forever. Closed: `lo <= hi` with `hi = mid − 1`. Half-open: `lo < hi` with `hi = mid`."],["“Binary search works on any array.”","Only on sorted (or monotonic) data. Sorting first costs O(n log n), which only pays off if you search many times."],["“`list.sort()` returns the sorted list.”","Python's `list.sort()` sorts in place and returns `None`, so `a = a.sort()` loses your list; use `sorted(a)` for a new one. JavaScript's `sort()` sorts in place *and* returns the same array; use `toSorted()` for a copy."],["“Quicksort is always O(n log n).”","Bad pivots, such as always the first item on already-sorted input, make it O(n²). Random pivots make that very unlikely."]],"disc":[["When is it worth sorting first?","When it unlocks a faster next step: binary search for many queries, two pointers for pair sums, grouping equal items, or merging intervals. Sorting costs O(n log n) once, so for a single lookup a linear scan (O(n)) is cheaper."],["Why does a stable sort matter?","It keeps equal items in their original order, so you can sort by a secondary key first and then by the primary key, and ties stay in the earlier order. Python's sort and modern JavaScript's sort are both stable."]],"teach":{"prompt":"Explain to a junior colleague how binary search works, why it's O(log n), and the two most common bugs.","rubric":["It needs sorted (monotonic) data","Compare with the middle and discard the half that can't contain the answer","The range halves every step, so about log₂ n steps (20 for a million)","Bug 1: mixing interval styles (lo <= hi with hi = mid − 1, or lo < hi with hi = mid)","Bug 2: midpoint maths (integer division; Math.floor in JavaScript) and off-by-one at the edges"],"model":"Binary search works on sorted data. Look at the middle item: if it's the target, you're done; if it's smaller, the target can only be in the right half, so discard the left half; if it's bigger, discard the right half. Each step halves what's left, so a million items need only about 20 steps: O(log n). The most common bugs are mixing the two interval styles, closed (while lo <= hi, hi = mid − 1) and half-open (while lo < hi, hi = mid), which skips answers or loops forever, and getting the midpoint wrong, for example forgetting Math.floor in JavaScript."},"qa":[["At most how many binary-search steps for 1,000,000 sorted items?","About 20, since 2²⁰ ≈ 1,000,000."],["How do you sort numbers correctly in JavaScript?","Pass a comparator: `a.sort((x, y) => x - y)`. The default compares the items as text."],["Closed-interval binary search: loop condition and updates?","`while lo <= hi`; then `lo = mid + 1` or `hi = mid − 1`."],["What does `bisect_left(a, x)` return?","The first index where x could be inserted and keep a sorted: the first i with a[i] >= x."],["Merge sort: time, extra space and stability?","O(n log n) always, O(n) extra space, stable."],["What is “binary search on the answer”?","Binary-searching the smallest (or largest) value for which a monotonic yes/no test passes, instead of searching an array."]],"quiz":[{"q":"What does this JavaScript print?","snip":{"t":"JavaScript's default sort","lang":"javascript","src":"console.log([10, 9, 1, 100].sort().join(\" \"));\n"},"o":["1 10 100 9","1 9 10 100","100 10 9 1","9 1 10 100"],"a":0,"e":"With no comparator the numbers are compared as text: \"1\" < \"10\" < \"100\" < \"9\"."},{"q":"What does this print?","snip":{"t":"Count the looks","tabs":[{"lang":"python","src":"a = list(range(1, 101))          # 1..100\nlo, hi, steps = 0, len(a) - 1, 0\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    steps += 1\n    if a[mid] == 37:\n        break\n    if a[mid] < 37:\n        lo = mid + 1\n    else:\n        hi = mid - 1\nprint(steps)\n"},{"lang":"javascript","src":"const a = Array.from({ length: 100 }, (_, i) => i + 1);   // 1..100\nlet lo = 0, hi = a.length - 1, steps = 0;\nwhile (lo <= hi) {\n  const mid = Math.floor((lo + hi) / 2);\n  steps++;\n  if (a[mid] === 37) break;\n  if (a[mid] < 37) lo = mid + 1;\n  else hi = mid - 1;\n}\nconsole.log(steps);\n"}]},"o":["3","7","37","6"],"a":0,"e":"It looks at 50 (too big), then 25 (too small), then 37: three looks. Seven is the worst case for 100 items, not the count for every target."},{"q":"What's wrong with `nums = nums.sort()` in Python?","o":["`list.sort()` sorts in place and returns `None`, so `nums` becomes `None`","Nothing: `nums` is now sorted","It sorts in descending order","It raises a `TypeError`"],"a":0,"e":"In-place methods return `None` in Python. Write `nums.sort()` on its own, or `nums = sorted(nums)`."},{"q":"Which of these sorts are stable? (choose 3)","t":"ms","o":["Merge sort","Insertion sort","Python's `sorted()`","A typical in-place quicksort","Heapsort"],"a":[0,1,2],"e":"Merge sort and insertion sort never move an item past an equal one, and Python's sort is guaranteed stable (so is JavaScript's since ES2019). Typical quicksort and heapsort swap items over long distances."},{"q":"Judge each statement.","t":"yn","s":[["Binary search on 1,000,000 sorted items needs at most about 20 comparisons.",true],["Binary search works on unsorted data if you search both halves.",false],["Sorting first is worth it for a single lookup in unsorted data.",false],["`bisect_left([1, 3, 3, 3, 7], 3)` returns 1.",true]],"e":"Searching both halves is just a slow linear scan. For one lookup, an O(n) scan beats an O(n log n) sort. `bisect_left` gives the first position of 3."},{"q":"Complete the Python lower bound in half-open style, [lo, hi): the first index with a[i] >= target.","t":"drop","lang":"python","code":"def lower_bound(a, target):\n    lo, hi = 0, {{0}}\n    while lo {{1}} hi:\n        mid = (lo + hi) // 2\n        if a[mid] < target:\n            lo = mid + 1\n        else:\n            hi = {{2}}\n    return lo\n","blanks":[{"o":["len(a)","len(a) - 1","0","target"],"a":0},{"o":["<","<=","==",">"],"a":0},{"o":["mid","mid + 1","lo","mid // 2"],"a":0}],"e":"Half-open style: `hi` starts at `len(a)` (the answer can be “after everything”), the loop runs while `lo < hi`, and `hi = mid` keeps mid as a candidate."},{"q":"For n = 1,000,000, order these by how many steps they take (fewest first).","t":"ord","items":["Binary search (about 20)","Linear scan (1,000,000)","Merge sort (about 20,000,000)","Insertion sort on reversed input (about 500,000,000,000)"],"e":"log n < n < n log n < n²/2."},{"q":"Match each situation to the best tool.","t":"match","pairs":[["Find 42 in a sorted array","Binary search"],["The smallest speed that finishes on time (the yes/no test is monotonic)","Binary search on the answer"],["Sort 10 nearly sorted items","Insertion sort"],["Sort a million records stably with guaranteed O(n log n)","Merge sort"]],"extra":["Quicksort with the first item as pivot"],"e":"A sorted array or a monotonic test means binary search. Tiny or nearly sorted input suits insertion sort; guaranteed O(n log n) and stability point to merge sort."}],"probs":[["LC 704 · Binary Search","https://leetcode.com/problems/binary-search/","Easy","the closed-interval template"],["LC 35 · Search Insert Position","https://leetcode.com/problems/search-insert-position/","Easy","lower bound"],["LC 278 · First Bad Version","https://leetcode.com/problems/first-bad-version/","Easy","the first true: half-open template"],["LC 374 · Guess Number Higher or Lower","https://leetcode.com/problems/guess-number-higher-or-lower/","Easy","binary search against an API"],["LC 1051 · Height Checker","https://leetcode.com/problems/height-checker/","Easy","sort a copy and compare"],["LC 976 · Largest Perimeter Triangle","https://leetcode.com/problems/largest-perimeter-triangle/","Easy","sort, then check neighbours from the largest"],["LC 912 · Sort an Array","https://leetcode.com/problems/sort-an-array/","Medium","write merge sort yourself; the built-in isn't the point"],["LC 75 · Sort Colors","https://leetcode.com/problems/sort-colors/","Medium","counting sort, or the one-pass three-pointer version"],["LC 34 · Find First and Last Position of Element in Sorted Array","https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/","Medium","two lower bounds: target and target + 1"],["LC 74 · Search a 2D Matrix","https://leetcode.com/problems/search-a-2d-matrix/","Medium","treat the matrix as one sorted array"]],"src":[["Python docs: Sorting techniques","https://docs.python.org/3/howto/sorting.html"],["Python docs: bisect","https://docs.python.org/3/library/bisect.html"],["MDN: Array.prototype.sort","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort"],["MDN: Array.prototype.toSorted","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/toSorted"],["USACO Guide: Binary search","https://usaco.guide/silver/binary-search"]]}],"plan":[{"t":"Analysis","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: Python 3.12+, Node.js 22 LTS, VS Code, a free LeetCode account; make a dsa/ folder with python/ and js/ inside","min":45,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"lab","ref":"lab-timing"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Arrays, strings & hashing","blocks":[{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-dynarray"},{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-hashmap"},{"k":"mod","ref":"m04"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Linear structures","blocks":[{"k":"mod","ref":"m05"},{"k":"lab","ref":"lab-stackqueue"},{"k":"mod","ref":"m06"},{"k":"lab","ref":"lab-linkedlist"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Recursion, sorting & searching","blocks":[{"k":"mod","ref":"m07"},{"k":"mod","ref":"m08"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L1","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-milestone","label":"Milestone: 40 easy + 20 medium problems solved and logged (tick them in each module)","min":600,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L1: what you built, your Big-O table, the 3 patterns you found hardest; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Tara's toy shop","org":"Tara's toy shop (inventory app)","min":20,"blurb":"Pick the data structures for a small shop's stock, orders and search, and justify the Big-O.","sections":[["Overview","Tara runs an online toy shop with about 50,000 products. A small Python and Node.js app stores the stock list in memory and answers customer searches. The app is getting slow as the catalogue grows."],["Current design",["Products are kept in one list/array of objects; looking up a product by its code loops over the whole list.","To find duplicate product codes, the nightly job compares every product with every other product.","Orders are processed first come, first served, but the code removes the first order with `orders.pop(0)` / `orders.shift()`.","The 'undo last stock change' button replays the whole day's change log."]],["Requirements",["Look up a product by code in O(1) average time.","Find duplicate codes in one pass.","Process orders in arrival order in O(1) per order.","Undo the most recent stock change instantly.","Show products sorted by price, and find all products in a price range quickly."]]],"items":[{"d":"d2","q":"Which change makes lookups by product code O(1) on average?","o":["Keep a hash map from code to product (Python dict / JavaScript Map)","Sort the list by code and loop over it","Keep the list but search it from the end","Store the products in a linked list"],"a":0,"e":"A hash map gives average O(1) lookups by key; sorting enables O(log n) binary search, which is good but not O(1)."},{"d":"d1","q":"The nightly duplicate check compares every pair of 50,000 products. Roughly how many comparisons is that?","o":["About 1.25 billion","About 50,000","About 800,000","About 2.5 million"],"a":0,"e":"n(n−1)/2 = 50,000 × 49,999 / 2 ≈ 1.25 × 10⁹. A one-pass hash-set check needs only 50,000 steps."},{"d":"d3","t":"ms","q":"Which TWO fix the order queue so each order is removed in O(1)?","o":["collections.deque with popleft() in Python","A ring buffer (or a head index) in JavaScript instead of shift()","Sorting the orders by time before each pop(0)","Using a hash set of orders","Reversing the list before each pop"],"a":[0,1],"e":"pop(0) and shift() can move every remaining element (O(n)). A deque or a head index avoids the shifting."},{"d":"d3","q":"Which structure makes 'undo the last stock change' instant?","o":["A stack of changes: push each change, pop to undo","A queue of changes","A hash set of changes","A sorted array of changes"],"a":0,"e":"Undo needs the most recent change first: last in, first out."},{"d":"d4","q":"Products are kept sorted by price. What finds every product priced between 10 and 20 quickly?","o":["Binary search for the first price ≥ 10, then walk right until the price > 20","Scan the whole list every time","A stack of prices","Recursion over every subset"],"a":0,"e":"Two binary searches (or one plus a short walk) cost O(log n + k), where k is the number of matches."}]},{"id":"cs2","title":"Road-trip playlist","org":"A music app for the family car","min":20,"blurb":"Queues, stacks, windows and searching inside one small app.","sections":[["Overview","Ben is building a playlist app for the family road trip. Songs play in order, kids can 'go back' to the previous song, and the app shows stats for the last k songs."],["Features",["Up Next: songs added by anyone play in the order they were added.","Back button: returns to the songs played most recently, one at a time.","Stats: the total minutes of the last k songs played, updated after every song.","Search: the song library (sorted by title) has 100,000 titles."]],["Constraints",["The app runs on an old tablet: every action must feel instant.","Ben wants to explain each choice to his teacher in Big-O."]]],"items":[{"d":"d3","q":"Which structure fits Up Next?","o":["A queue (first in, first out)","A stack","A hash map","A binary tree"],"a":0,"e":"Songs play in the order they were added: FIFO."},{"d":"d3","q":"Which structure fits the Back button?","o":["A stack of played songs","A queue of played songs","A sorted array","A hash set"],"a":0,"e":"Back returns the most recent song first: LIFO."},{"d":"d2","q":"How should the 'total minutes of the last k songs' update after each new song?","o":["Fixed-size sliding window: add the new song's minutes and subtract the song that left the window","Re-add all k songs every time","Sort the last k songs","Binary search the history"],"a":0,"e":"A running window total is O(1) per update; re-adding k songs is O(k)."},{"d":"d4","q":"How many comparisons does a binary search over 100,000 sorted titles need at most?","o":["About 17","About 100","About 1,000","About 50,000"],"a":0,"e":"2¹⁷ = 131,072 ≥ 100,000, so about 17 comparisons."},{"d":"d4","t":"yn","q":"Evaluate each statement about the search feature.","s":[["Binary search only works because the titles are sorted.",true],["If titles were unsorted, sorting once (O(n log n)) then binary searching many times can beat scanning every time.",true],["JavaScript's default array sort orders numbers numerically.",false]],"e":"Binary search needs sorted data; one sort pays off over many searches. JS's default sort compares as strings, so [10, 9, 1].sort() gives [1, 10, 9]."}]}],"diag":[{"d":"d1","q":"A function has a loop over n items, and inside it another loop over the same n items. What is its time complexity?","o":["O(n²)","O(n)","O(2n)","O(n log n)"],"a":0,"e":"Nested loops multiply: n × n = n²."},{"d":"d1","q":"Which grows slowest as n gets large?","o":["O(log n)","O(n)","O(n log n)","O(√n)"],"a":0,"e":"log n grows slower than √n, n and n log n."},{"d":"d1","q":"Constraints say n ≤ 200,000. Which approach is too slow?","o":["An O(n²) double loop","An O(n log n) sort then a scan","An O(n) single pass with a hash map","An O(log n) binary search per query for 10 queries"],"a":0,"e":"200,000² = 4 × 10¹⁰ steps: far beyond a one-second budget."},{"d":"d2","q":"You need to check whether a value has been seen before, many times, in a stream. Which structure gives O(1) average lookups?","o":["A hash set (Python set / JavaScript Set)","A list / array searched with `in` / `includes`","A sorted list re-sorted after each insert","A linked list"],"a":0,"e":"Hash sets give average O(1) membership; list membership is O(n)."},{"d":"d2","q":"A sorted array and a target sum: which technique finds a pair in O(n) time and O(1) extra space?","o":["Two pointers from both ends","Nested loops","A hash map of seen values","Recursion over every subset"],"a":0,"e":"On a sorted array, move the left or right pointer depending on whether the sum is too small or too big."},{"d":"d2","q":"What does a prefix-sum array let you answer in O(1) after O(n) setup?","o":["The sum of any contiguous range","The maximum of any range","Whether the array is sorted","The median of the array"],"a":0,"e":"sum(i..j) = prefix[j+1] − prefix[i]."},{"d":"d2","q":"Longest substring without repeating characters is best solved with…","o":["A variable-size sliding window with a set or map","Binary search","A stack","Sorting the string"],"a":0,"e":"Grow the window on the right; shrink it from the left while a repeat is inside."},{"d":"d3","q":"Which structure checks balanced brackets like ([]{}) most naturally?","o":["A stack","A queue","A hash set","A sorted array"],"a":0,"e":"The most recent opening bracket must close first: last in, first out."},{"d":"d3","q":"In Python, which removes from the front of a queue in O(1)?","o":["collections.deque.popleft()","list.pop(0)","list.remove(x)","sorted(list)[0]"],"a":0,"e":"list.pop(0) shifts every element (O(n)); deque.popleft() is O(1)."},{"d":"d3","q":"Fast and slow pointers on a linked list can…","o":["Detect a cycle and find the middle node","Sort the list in O(n)","Search it in O(log n)","Reverse it without changing any pointers"],"a":0,"e":"Floyd's tortoise and hare: if they meet there's a cycle; when fast reaches the end, slow is at the middle."},{"d":"d4","q":"Binary search on a sorted array of 1,000,000 items needs at most about…","o":["20 comparisons","1,000 comparisons","500,000 comparisons","1,000,000 comparisons"],"a":0,"e":"log₂(1,000,000) ≈ 20."},{"d":"d4","q":"What does every correct recursive function need?","o":["A base case that stops the recursion","A global variable","A loop inside it","At least two recursive calls"],"a":0,"e":"Without a base case the calls never stop and the stack overflows."}],"labs":[{"id":"lab-timing","t":"Big-O with a stopwatch","min":45,"mods":["m01"],"goal":"See complexity with your own eyes: time an O(n), an O(n log n) and an O(n²) function as n doubles, in Python and JavaScript, and check that the ratios match the theory (about 2×, a bit over 2×, and 4×).","pre":["Python 3.12+ and Node.js 22+","Read module 01 (Big-O)"],"steps":["Write three functions: sum of a list (O(n)), sort a copy (O(n log n)), count equal pairs with two nested loops (O(n²)).","Time each one for n = 1,000, 2,000, 4,000 and 8,000 using `time.perf_counter()` in Python and `performance.now()` in Node.","Print the ratio between each time and the previous one.","Repeat each measurement 5 times and keep the best, to remove noise.","Write two sentences in your notes: which ratio matched the theory best, and why the small n values are noisy."],"starter":{"t":"Starter (fill in the timing loop)","tabs":[{"lang":"python","src":"import random, time\n\ndef linear(a):       return sum(a)\ndef n_log_n(a):      return sorted(a)\ndef quadratic(a):\n    pairs = 0\n    for i in range(len(a)):\n        for j in range(i + 1, len(a)):\n            if a[i] == a[j]:\n                pairs += 1\n    return pairs\n\ndef best_time(fn, a, repeats=5):\n    # TODO: run fn(a) `repeats` times and return the fastest time in seconds\n    ...\n\nprev = None\nfor n in (1000, 2000, 4000, 8000):\n    data = [random.randint(0, 1000) for _ in range(n)]\n    # TODO: time quadratic(data) and print n, the time, and the ratio to prev\n"},{"lang":"javascript","src":"const { performance } = require(\"node:perf_hooks\");\n\nconst linear = a => a.reduce((s, x) => s + x, 0);\nconst nLogN = a => [...a].sort((x, y) => x - y);\nfunction quadratic(a) {\n  let pairs = 0;\n  for (let i = 0; i < a.length; i++)\n    for (let j = i + 1; j < a.length; j++)\n      if (a[i] === a[j]) pairs++;\n  return pairs;\n}\n\nfunction bestTime(fn, a, repeats = 5) {\n  // TODO: run fn(a) `repeats` times and return the fastest time in ms\n}\n\nlet prev = null;\nfor (const n of [1000, 2000, 4000, 8000]) {\n  const data = Array.from({ length: n }, () => Math.floor(Math.random() * 1001));\n  // TODO: time quadratic(data) and print n, the time, and the ratio to prev\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"import random, time\n\ndef quadratic(a):\n    pairs = 0\n    for i in range(len(a)):\n        for j in range(i + 1, len(a)):\n            if a[i] == a[j]:\n                pairs += 1\n    return pairs\n\ndef best_time(fn, a, repeats=5):\n    best = float(\"inf\")\n    for _ in range(repeats):\n        t0 = time.perf_counter()\n        fn(a)\n        best = min(best, time.perf_counter() - t0)\n    return best\n\nprev = None\nratios = []\nfor n in (500, 1000, 2000):\n    data = [random.randint(0, 1000) for _ in range(n)]\n    t = best_time(quadratic, data, repeats=3)\n    if prev:\n        ratios.append(t / prev)\n    prev = t\n# doubling n should roughly quadruple the time of an O(n^2) function\nassert all(2.5 < r < 6.5 for r in ratios), ratios\nprint(\"quadratic ratios look like ~4x\")\n","out":"quadratic ratios look like ~4x"},{"lang":"javascript","src":"const { performance } = require(\"node:perf_hooks\");\n\nfunction quadratic(a) {\n  let pairs = 0;\n  for (let i = 0; i < a.length; i++)\n    for (let j = i + 1; j < a.length; j++)\n      if (a[i] === a[j]) pairs++;\n  return pairs;\n}\n\nfunction bestTime(fn, a, repeats = 5) {\n  let best = Infinity;\n  for (let r = 0; r < repeats; r++) {\n    const t0 = performance.now();\n    fn(a);\n    best = Math.min(best, performance.now() - t0);\n  }\n  return best;\n}\n\nlet prev = null;\nconst ratios = [];\nfor (const n of [2000, 4000, 8000]) {\n  const data = Array.from({ length: n }, () => Math.floor(Math.random() * 1001));\n  const t = bestTime(quadratic, data, 3);\n  if (prev) ratios.push(t / prev);\n  prev = t;\n}\nif (!ratios.every(r => r > 2.2 && r < 7)) throw new Error(\"unexpected ratios \" + ratios);\nconsole.log(\"quadratic ratios look like ~4x\");\n","out":"quadratic ratios look like ~4x"}]},"breakit":["Replace the nested loops with a Counter / Map of counts (pairs = sum of c × (c − 1) / 2) and watch the ratio drop to about 2×.","Time `list.insert(0, x)` in a loop and discover it's O(n²) overall."]},{"id":"lab-dynarray","t":"A dynamic array from scratch","min":60,"mods":["m01","m02"],"goal":"Build the structure behind Python's list and JavaScript's Array: a fixed-size block that grows by a constant factor when full (we use ×2; CPython grows lists by about 1.125× and V8 by about 1.5×). Count the copies to prove append is O(1) amortised.","steps":["Store `capacity`, `size` and a fixed-size block (a Python list of None / a JS array created once).","Implement `append`, `get(i)`, `set(i, x)`, `pop()` and `len`/`size` with bounds checks.","When full, allocate a block twice as big and copy everything across; count every copied item.","Append 1,000,000 items and print copies ÷ n. It should stay below 2.","Add `insert(i, x)` and note why it is O(n)."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class DynArray:\n    def __init__(self):\n        self._cap, self._n, self.copies = 1, 0, 0\n        self._a = [None] * self._cap\n\n    def __len__(self):\n        return self._n\n\n    def _grow(self):\n        bigger = [None] * (self._cap * 2)\n        for i in range(self._n):          # O(n) copy, but rare\n            bigger[i] = self._a[i]\n        self.copies += self._n\n        self._a, self._cap = bigger, self._cap * 2\n\n    def append(self, x):                  # O(1) amortised\n        if self._n == self._cap:\n            self._grow()\n        self._a[self._n] = x\n        self._n += 1\n\n    def get(self, i):                     # O(1)\n        if not 0 <= i < self._n:\n            raise IndexError(i)\n        return self._a[i]\n\n    def set(self, i, x):                  # O(1)\n        if not 0 <= i < self._n:\n            raise IndexError(i)\n        self._a[i] = x\n\n    def pop(self):                        # O(1)\n        if self._n == 0:\n            raise IndexError(\"pop from empty\")\n        self._n -= 1\n        x, self._a[self._n] = self._a[self._n], None\n        return x\n\n    def insert(self, i, x):               # O(n): shifts the tail right\n        if not 0 <= i <= self._n:\n            raise IndexError(i)\n        self.append(x)\n        for k in range(self._n - 1, i, -1):\n            self._a[k] = self._a[k - 1]\n        self._a[i] = x\n\nd = DynArray()\nfor k in range(100_000):\n    d.append(k)\nassert len(d) == 100_000 and d.get(99_999) == 99_999\nassert d.copies / len(d) < 2\nd.set(5, 42)\nassert d.get(5) == 42\nd.set(5, 5)\nd.insert(0, -1)\nassert d.get(0) == -1 and d.get(1) == 0 and d.pop() == 99_999\nprint(\"copies per append:\", round(d.copies / 100_000, 3))\n","out":"copies per append: 1.311"},{"lang":"javascript","src":"class DynArray {\n  constructor() { this.cap = 1; this.n = 0; this.copies = 0; this.a = new Array(this.cap); }\n  get length() { return this.n; }\n  grow() {\n    const bigger = new Array(this.cap * 2);\n    for (let i = 0; i < this.n; i++) bigger[i] = this.a[i];   // O(n), but rare\n    this.copies += this.n;\n    this.a = bigger; this.cap *= 2;\n  }\n  append(x) { if (this.n === this.cap) this.grow(); this.a[this.n++] = x; }   // O(1) amortised\n  get(i) { if (i < 0 || i >= this.n) throw new RangeError(String(i)); return this.a[i]; }\n  set(i, x) { if (i < 0 || i >= this.n) throw new RangeError(String(i)); this.a[i] = x; }   // O(1)\n  pop() {\n    if (this.n === 0) throw new RangeError(\"pop from empty\");\n    const x = this.a[--this.n]; this.a[this.n] = undefined; return x;\n  }\n  insert(i, x) {                                                // O(n)\n    if (i < 0 || i > this.n) throw new RangeError(String(i));\n    this.append(x);\n    for (let k = this.n - 1; k > i; k--) this.a[k] = this.a[k - 1];\n    this.a[i] = x;\n  }\n}\n\nconst d = new DynArray();\nfor (let k = 0; k < 100000; k++) d.append(k);\nif (d.length !== 100000 || d.get(99999) !== 99999) throw new Error(\"append/get\");\nif (!(d.copies / d.length < 2)) throw new Error(\"amortised bound\");\nd.set(5, 42);\nif (d.get(5) !== 42) throw new Error(\"set\");\nd.set(5, 5);\nd.insert(0, -1);\nif (d.get(0) !== -1 || d.get(1) !== 0 || d.pop() !== 99999) throw new Error(\"insert/pop\");\nconsole.log(\"copies per append:\", Math.round((d.copies / 100000) * 1000) / 1000);\n","out":"copies per append: 1.311"}]},"breakit":["Grow by +10 slots instead of ×2 and watch copies ÷ n grow with n (that's O(n²) total).","Shrink by half when a quarter full, not when half full, and explain why (avoid thrashing)."]},{"id":"lab-linkedlist","t":"Linked-list toolkit","min":60,"mods":["m06"],"goal":"Build a singly linked list and the four classic moves (build from an array, reverse, find the middle, detect a cycle) in both languages.","steps":["Write a `Node` with `val` and `next`, and helpers to build a list from an array and turn it back into an array.","Implement `reverse(head)` iteratively with three pointers: prev, cur, next.","Implement `middle(head)` with slow and fast pointers.","Implement `has_cycle(head)` with Floyd's algorithm, then test it on a list whose tail points back to node 2.","Write the Big-O of each function in a comment."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class Node:\n    def __init__(self, val, nxt=None):\n        self.val, self.next = val, nxt\n\ndef from_list(xs):\n    head = None\n    for x in reversed(xs):\n        head = Node(x, head)\n    return head\n\ndef to_list(head):\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n\ndef reverse(head):              # O(n) time, O(1) space\n    prev = None\n    while head:\n        nxt = head.next         # save the rest of the list\n        head.next = prev        # flip the arrow\n        prev, head = head, nxt  # step forward\n    return prev\n\ndef middle(head):               # O(n) time, O(1) space\n    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    return slow\n\ndef has_cycle(head):            # O(n) time, O(1) space\n    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is fast:\n            return True\n    return False\n\nassert to_list(reverse(from_list([1, 2, 3, 4]))) == [4, 3, 2, 1]\nassert middle(from_list([1, 2, 3, 4, 5])).val == 3\nassert middle(from_list([1, 2, 3, 4])).val == 3      # second middle\nloop = from_list([1, 2, 3, 4])\nloop.next.next.next.next = loop.next                 # 4 -> 2\nassert has_cycle(loop) and not has_cycle(from_list([1, 2, 3]))\nprint(\"linked-list toolkit OK\")\n","out":"linked-list toolkit OK"},{"lang":"javascript","src":"class Node { constructor(val, next = null) { this.val = val; this.next = next; } }\nconst fromArray = xs => xs.reduceRight((head, x) => new Node(x, head), null);\nfunction toArray(head) { const out = []; for (; head; head = head.next) out.push(head.val); return out; }\n\nfunction reverse(head) {           // O(n) time, O(1) space\n  let prev = null;\n  while (head) { const next = head.next; head.next = prev; prev = head; head = next; }\n  return prev;\n}\nfunction middle(head) {            // O(n) time, O(1) space\n  let slow = head, fast = head;\n  while (fast && fast.next) { slow = slow.next; fast = fast.next.next; }\n  return slow;\n}\nfunction hasCycle(head) {          // O(n) time, O(1) space\n  let slow = head, fast = head;\n  while (fast && fast.next) {\n    slow = slow.next; fast = fast.next.next;\n    if (slow === fast) return true;\n  }\n  return false;\n}\n\nconst assert = require(\"node:assert\");\nassert.deepStrictEqual(toArray(reverse(fromArray([1, 2, 3, 4]))), [4, 3, 2, 1]);\nassert.strictEqual(middle(fromArray([1, 2, 3, 4, 5])).val, 3);\nassert.strictEqual(middle(fromArray([1, 2, 3, 4])).val, 3);\nconst loop = fromArray([1, 2, 3, 4]);\nloop.next.next.next.next = loop.next;\nassert.ok(hasCycle(loop) && !hasCycle(fromArray([1, 2, 3])));\nconsole.log(\"linked-list toolkit OK\");\n","out":"linked-list toolkit OK"}]},"breakit":["Forget to save `next` before re-pointing in reverse and see the list get cut off.","Return the first middle instead of the second and adjust the loop condition."]},{"id":"lab-stackqueue","t":"Stack, queue and a ring buffer","min":60,"mods":["m05"],"goal":"Implement a stack on a dynamic array, a queue as a fixed-size ring buffer, and use both: check brackets, and compute \"next warmer day\" with a monotonic stack.","steps":["Stack: a list / array with push (append), pop, a peek at the last item and an emptiness check, all O(1).","Ring buffer queue with capacity k: head index, size, wrap-around with modulo; enqueue fails (returns false) when full.","Use the stack to validate brackets `([]{})`.","Use a monotonic stack to compute, for each temperature, how many days until a warmer one."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class RingQueue:\n    def __init__(self, k):\n        self.a, self.head, self.size = [None] * k, 0, 0\n\n    def enqueue(self, x):                       # O(1)\n        if self.size == len(self.a):\n            return False\n        self.a[(self.head + self.size) % len(self.a)] = x\n        self.size += 1\n        return True\n\n    def dequeue(self):                          # O(1)\n        if self.size == 0:\n            raise IndexError(\"empty queue\")\n        x = self.a[self.head]\n        self.head = (self.head + 1) % len(self.a)\n        self.size -= 1\n        return x\n\ndef balanced(s):                                # O(n) time, O(n) space\n    pairs, stack = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}, []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n    return not stack\n\ndef days_until_warmer(temps):                   # O(n): each index pushed and popped once\n    ans, stack = [0] * len(temps), []           # stack holds indices of colder days\n    for i, t in enumerate(temps):\n        while stack and temps[stack[-1]] < t:\n            j = stack.pop()\n            ans[j] = i - j\n        stack.append(i)\n    return ans\n\nq = RingQueue(3)\nassert q.enqueue(1) and q.enqueue(2) and q.enqueue(3) and not q.enqueue(4)\nassert q.dequeue() == 1 and q.enqueue(4) and [q.dequeue() for _ in range(3)] == [2, 3, 4]\nassert balanced(\"([]{})\") and not balanced(\"(]\") and not balanced(\"((\")\nassert days_until_warmer([73, 74, 75, 71, 69, 72, 76, 73]) == [1, 1, 4, 2, 1, 1, 0, 0]\nprint(\"stack and queue OK\")\n","out":"stack and queue OK"},{"lang":"javascript","src":"class RingQueue {\n  constructor(k) { this.a = new Array(k); this.head = 0; this.size = 0; }\n  enqueue(x) {                                   // O(1)\n    if (this.size === this.a.length) return false;\n    this.a[(this.head + this.size) % this.a.length] = x; this.size++; return true;\n  }\n  dequeue() {                                    // O(1)\n    if (this.size === 0) throw new RangeError(\"empty queue\");\n    const x = this.a[this.head];\n    this.head = (this.head + 1) % this.a.length; this.size--; return x;\n  }\n}\nfunction balanced(s) {                           // O(n) time, O(n) space\n  const pairs = new Map([[\")\", \"(\"], [\"]\", \"[\"], [\"}\", \"{\"]]), stack = [];\n  for (const ch of s) {\n    if (\"([{\".includes(ch)) stack.push(ch);\n    else if (pairs.has(ch) && stack.pop() !== pairs.get(ch)) return false;   // pop() on empty gives undefined\n  }\n  return stack.length === 0;\n}\nfunction daysUntilWarmer(temps) {                // O(n)\n  const ans = new Array(temps.length).fill(0), stack = [];\n  temps.forEach((t, i) => {\n    while (stack.length && temps[stack[stack.length - 1]] < t) { const j = stack.pop(); ans[j] = i - j; }\n    stack.push(i);\n  });\n  return ans;\n}\n\nconst assert = require(\"node:assert\");\nconst q = new RingQueue(3);\nassert.ok(q.enqueue(1) && q.enqueue(2) && q.enqueue(3) && !q.enqueue(4));\nassert.ok(q.dequeue() === 1 && q.enqueue(4));\nassert.deepStrictEqual([q.dequeue(), q.dequeue(), q.dequeue()], [2, 3, 4]);\nassert.ok(balanced(\"([]{})\") && !balanced(\"(]\") && !balanced(\"((\"));\nassert.deepStrictEqual(daysUntilWarmer([73, 74, 75, 71, 69, 72, 76, 73]), [1, 1, 4, 2, 1, 1, 0, 0]);\nconsole.log(\"stack and queue OK\");\n","out":"stack and queue OK"}]},"breakit":["Use list.pop(0) / array.shift() as your queue and time 100,000 dequeues (V8 only slows down past roughly 16,000 items).","Python: delete `not stack or` from the check inside the loop of `balanced` and find the input that crashes it. Then explain why the JavaScript version doesn't crash."]},{"id":"lab-hashmap","t":"Hash map with chaining and resizing","min":75,"mods":["m03"],"goal":"Build a hash map with separate chaining: an array of buckets, a hash function, and a resize to twice the buckets when the load factor passes 0.75. Then use it to count words.","steps":["Pick a bucket with `hash(key) % len(buckets)` (Python) or a small string hash (JavaScript).","Each bucket is a list of [key, value] pairs; `put` updates an existing key or appends a new pair.","Track `size`; when size ÷ buckets > 0.75, double the bucket count and re-insert every pair.","Implement `get` (with a default) and `delete`.","Count words in a sentence with your map and check against Counter / a Map."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class HashMap:\n    def __init__(self, buckets=8):\n        self.b, self.size = [[] for _ in range(buckets)], 0\n\n    def _bucket(self, key):\n        return self.b[hash(key) % len(self.b)]\n\n    def put(self, key, val):                 # O(1) average\n        bucket = self._bucket(key)\n        for pair in bucket:\n            if pair[0] == key:\n                pair[1] = val\n                return\n        bucket.append([key, val])\n        self.size += 1\n        if self.
