hey're gone. Use it where losing the last few seconds is acceptable (counters, metrics), or make the cache durable."],["“Update the cached value on every write instead of deleting it.”","Two concurrent writers can update the database in one order and the cache in the other, leaving the cache wrong until its TTL ends. Deleting is safer: the next read reloads whatever the database holds."],["“Deleting the key after a write keeps the cache consistent.”","A slow reader that read the old row before the write can store it after the delete (the stale-set race). Keep TTLs short, delete again a moment later, or use versions or leases that reject older values."],["“A lock around recomputation solves stampedes.”","It stops the duplicate work but makes every waiting request slow, and a crashed lock holder stalls them all unless the lock expires. Serving stale data while one refresh runs, or refreshing early, keeps latency flat."],["“Redis is a database, so it won't lose data.”","Its persistence is configurable and often asynchronous, and with eviction enabled it deletes keys under memory pressure by design. Keep the source of truth in a real database unless you've configured and tested Redis for durability."],["“Put everything in one Redis.”","One instance is a single point of failure and executes commands one at a time. Separate the cache from rate limiters and locks, plan memory and eviction for each use, and use replicas or a cluster for anything critical."]],"disc":[["Which write strategy would you pick for a social app's posts, likes and view counts?","Posts: write to the database and delete (or write through) the cached copy, because authors expect to see their post at once and losing one is unacceptable. Likes: write-through, or a Redis counter persisted every few seconds, since a short delay is fine. View counts: write-back, flushed in batches, because losing a few views in a crash is acceptable and it cuts database writes enormously."],["How would you keep many servers' caches consistent after a product update?","Write the database first, then publish an invalidation, or let change-data-capture emit one from the database's log, that every cache layer consumes: shared caches delete the key and in-process caches drop their copy. Keep TTLs as a safety net, version the keys where staleness is costly, and accept a short window of inconsistency rather than putting distributed locks around every read."]],"teach":{"prompt":"Explain to a junior colleague how write-through, write-back and write-around differ, and how you'd stop a cache stampede.","rubric":["Write-through: fresh reads, slower writes","Write-back: fast, batched writes, at the risk of losing unflushed data","Write-around: database only, so the first read after a write misses","Invalidation by deleting, and the stale-set race with its fixes","Stampedes: single flight, stale-while-revalidate, early refresh, TTL jitter"],"model":"Write-through updates the database and the cache together, so reads right after a write are fresh, at the cost of slower writes. Write-back writes only to the cache and flushes to the database later in batches, which is fast but loses anything unflushed if the cache dies, so I'd keep it for counters and metrics. Write-around writes only to the database and deletes the cached copy, so the first read afterwards is a miss; that suits data that's rarely re-read soon. I prefer deleting to updating cached values, and I guard against the stale-set race, where a slow reader stores an old value after the delete, with short TTLs or version checks. For stampedes on hot keys I'd let one request refresh while the others get the stale value, refresh a little before expiry with a randomised trigger, and add jitter to TTLs so keys don't all expire together."},"qa":[["Write-through?","Every write updates the database and the cache together."],["Write-back?","Writes go to the cache and reach the database later; unflushed writes can be lost."],["Write-around?","Writes go only to the database; the cache fills on reads."],["The stale-set race?","A slow reader stores an old value after a writer's invalidation, so the cache stays stale until its TTL."],["Stale-while-revalidate?","Serve a slightly stale value while one background refresh fetches a new one."],["Which Redis structure makes a leaderboard?","A sorted set: ZADD, ZREVRANGE and ZREVRANK."]],"quiz":[{"q":"What does this print?","snip":{"t":"Three writes, three policies","tabs":[{"lang":"python","src":"cache, db = {}, {}\ndef write(policy, k, v):\n    if policy in (\"through\", \"around\"):\n        db[k] = v\n    if policy in (\"through\", \"back\"):\n        cache[k] = v\n    if policy == \"around\":\n        cache.pop(k, None)\nwrite(\"through\", \"a\", 1)\nwrite(\"back\", \"b\", 2)\nwrite(\"around\", \"a\", 3)\nprint(*(f\"{k}={v}\" for k, v in sorted(cache.items())), \"|\", *(f\"{k}={v}\" for k, v in sorted(db.items())))\n"},{"lang":"javascript","src":"const cache = new Map(), db = new Map();\nfunction write(policy, k, v) {\n  if (policy === \"through\" || policy === \"around\") db.set(k, v);\n  if (policy === \"through\" || policy === \"back\") cache.set(k, v);\n  if (policy === \"around\") cache.delete(k);\n}\nwrite(\"through\", \"a\", 1);\nwrite(\"back\", \"b\", 2);\nwrite(\"around\", \"a\", 3);\nconst show = m => [...m].sort().map(([k, v]) => `${k}=${v}`);\nconsole.log(...show(cache), \"|\", ...show(db));\n"}]},"o":["b=2 | a=3","a=3 b=2 | a=3","a=1 b=2 | a=3 b=2","b=2 | a=3 b=2"],"a":0,"e":"The write-through puts a=1 in both. The write-back puts b=2 only in the cache (not flushed yet). The write-around sets a=3 in the database and removes a from the cache."},{"q":"What does this print?","snip":{"t":"How old is too old?","tabs":[{"lang":"python","src":"ttl, stale_for, fetched_at = 10, 20, 0\nprint(*(\"fresh\" if now - fetched_at < ttl else \"stale-ok\" if now - fetched_at < ttl + stale_for else \"reload\"\n        for now in (5, 15, 35)))\n"},{"lang":"javascript","src":"const ttl = 10, staleFor = 20, fetchedAt = 0;\nconsole.log(...[5, 15, 35].map(now => (now - fetchedAt < ttl ? \"fresh\" : now - fetchedAt < ttl + staleFor ? \"stale-ok\" : \"reload\")));\n"}]},"o":["fresh stale-ok reload","fresh reload reload","fresh fresh stale-ok","stale-ok stale-ok reload"],"a":0,"e":"At 5 seconds the value is younger than the 10-second TTL; at 15 it's stale but within the 30-second limit, so it's served while a refresh runs; at 35 it's too old and must be reloaded."},{"q":"View counts are written 50,000 times a second, and losing a few seconds of counts in a crash is acceptable. Which write strategy fits?","o":["Write-back, flushing batched counts every few seconds","Write-through","Write-around","No cache: write every view to the database"],"a":0,"e":"Write-back absorbs the bursts and turns thousands of increments into one database write per batch; the risk of losing a few seconds is accepted. The other options send every view to the database."},{"q":"Which reduce stampedes on a hot key? (choose 2)","t":"ms","o":["Serve the stale value while one background refresh runs","Refresh early, with a probability that rises as expiry approaches","Give the hot key a one-second TTL","Delete the hot key on every read","Let every miss query the database"],"a":[0,1],"e":"Both keep a value available while exactly one refresh runs. A one-second TTL makes the key expire, and stampede, far more often; deleting on read causes a miss every time; and letting every miss query the database is the stampede."},{"q":"Judge each statement.","t":"yn","s":[["Write-around makes the first read after a write a cache miss.",true],["Updating cached values on writes is safer than deleting them.",false],["With write-back, writes not yet flushed are lost if the cache node fails.",true],["Each single Redis command is atomic.",true]],"e":"Write-around drops the cached copy, so the next read misses. Concurrent updates can leave the cache wrong, while deletes just cause a reload. Unflushed write-back data lives only in the cache. And Redis executes commands one at a time."},{"q":"Put the steps of the stale-set race in order.","t":"ord","items":["Reader A misses the cache and reads the old row from the database","A writer updates the row in the database","The writer deletes the cached copy","Reader A stores the old row in the cache, where it stays until the TTL ends"],"e":"The race needs A's read before the update (so A holds the old value), the delete after the update, and A's late store after the delete; in any other order the cache ends up correct."},{"q":"Complete the Python cache write that ignores values older than what the cache already knows.","t":"drop","lang":"python","code":"def cache_set(cache, key, version, value):\n    current = cache.get(key)\n    if current is not None and {{0}}:\n        return False\n    cache[key] = {{1}}\n    return True\n","blanks":[{"o":["current[0] >= version","current[0] < version","current[1] is None","version >= current[0]"],"a":0},{"o":["(version, value)","(value, version)","value","(current[0], value)"],"a":0}],"e":"A value is stored only if its version is newer than the cached one, and the cache keeps (version, value) so the next write can be compared."},{"q":"Match each description to its name.","t":"match","pairs":[["Update the database and the cache together","Write-through"],["Write to the cache now, the database later","Write-back"],["Write to the database only; the cache fills on reads","Write-around"],["Serve stale data while one refresh runs","Stale-while-revalidate"]],"extra":["Read repair"],"e":"Read repair fixes stale replicas in a leaderless store (module 2), not caches."}],"probs":[["Reading · Optimal probabilistic cache stampede prevention","https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf","","the XFetch rule: refresh early with a probability that rises exponentially near expiry; compare it with this module's linear ramp"],["Exercise · Pick Redis data types","https://redis.io/docs/latest/develop/data-types/","","choose a type and write the commands for a leaderboard, a set of online users, a per-minute counter and a list of recent items"],["Exercise · What Redis loses in a crash","https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/","","compare snapshots and the append-only file, and say how much each can lose with its default settings"],["Reference · stale-while-revalidate in HTTP","https://www.rfc-editor.org/rfc/rfc5861","","the same idea as a Cache-Control extension; find what stale-if-error adds"]],"src":[["Vattani, Chierichetti and Lowenstein: Optimal probabilistic cache stampede prevention (VLDB 2015)","https://cseweb.ucsd.edu/~avattani/papers/cache_stampede.pdf"],["Redis docs: Data types","https://redis.io/docs/latest/develop/data-types/"],["RFC 5861: HTTP Cache-Control extensions for stale content","https://www.rfc-editor.org/rfc/rfc5861"],["Scaling Memcache at Facebook (NSDI 2013)","https://www.usenix.org/conference/nsdi13/technical-sessions/presentation/nishtala"]]},{"id":"m05","d":"d2","t":"Messaging: queues, pub/sub and delivery guarantees","min":105,"hook":"A queue lets a service hand work off and reply at once; a topic lets one event reach every service that cares. The hard parts are the failures in between: a worker crashes before acknowledging, an ack gets lost, a message can't be parsed, two events for the same order race each other. Brokers deliver at least once, so exactly-once is something you build (with idempotent consumers), and order holds only per partition.","pre":{"q":"A payment worker takes a 'charge order 7' message from a queue, charges the card, and crashes before acknowledging the message. What happens next, and what could go wrong?","a":"The broker never received the ack, so once the visibility timeout passes (or the connection drops) it delivers the message again, and another worker charges the card a second time. Redelivery is how the broker avoids losing messages, so duplicates are normal. The worker has to be idempotent: store the message id in the same transaction as the charge, and skip ids it has already processed."},"kid":{"t":"Tickets on the kitchen rail","x":"In Luigi's kitchen, waiters pin order tickets on a rail, and each ticket is taken by one free cook. A ticket stays on the rail until the dish leaves the kitchen, so if a cook is called away, someone else picks it up. Once, table 5 nearly got two pizzas, until the waiter checked the ticket number. When the closing bell rings, every waiter, the cashier and the cleaner hear it. Tickets for one table hang on the same hook, so the starter comes before the main. A smudged ticket that three cooks couldn't read goes to the manager's tray instead of round and round.","map":[["Tickets on the rail, each taken by one cook","A queue: each message goes to one consumer (competing consumers)"],["The closing bell everyone hears","Pub/sub: every subscriber gets its own copy of each event"],["A ticket stays on the rail until the dish leaves, and the waiter checks its number","At-least-once delivery (a message is removed only once acknowledged, so a crash means redelivery) with an idempotent consumer that deduplicates by message id"],["One hook per table","Ordering per key: messages with the same key go to the same partition and stay in order"],["The manager's tray","A dead-letter queue for messages that keep failing"]],"brk":"Luigi's cooks can see each other, and the waiter is in the room. A real broker can't tell a slow consumer from a dead one, so it redelivers after a timeout, and duplicates arrive even when nothing crashed."},"keys":["**Why a queue**: it decouples producer and consumer in time and load. The producer replies at once, consumers work at their own pace, and a spike becomes a backlog instead of errors (load levelling). The costs: results arrive later, there's a broker to run, and new failure modes. Watch queue depth and consumer lag, and push back on producers when the backlog keeps growing.","**Queue or pub/sub**: a queue gives each message to one consumer, so adding consumers shares the work (competing consumers). A topic gives each message to every subscriber. Log-based brokers such as Kafka do both: every consumer group receives every message, and inside a group the partitions are split among the members.","**Acknowledgements**: a broker forgets a message only when the consumer acknowledges it. SQS hides a received message for a visibility timeout and shows it again if it isn't deleted in time; RabbitMQ requeues unacknowledged messages when the consumer's channel closes; Kafka consumers commit offsets. A log-based broker keeps messages for a retention period, so a new group can replay them.","**Delivery guarantees**: ack (or commit) before processing gives at-most-once: a crash loses the message. Process, then ack gives at-least-once: a crash or a slow ack means a duplicate. No broker can promise exactly-once delivery across an unreliable network; what you build is an exactly-once effect: at-least-once delivery plus idempotent processing.","**Idempotent consumers**: give every message a unique id (or idempotency key), record processed ids in the same transaction as the effect, and skip ids already seen; or make the operation idempotent by nature (set status = 'paid' rather than add 10). Keep the dedupe records for at least as long as redeliveries can happen.","**Ordering**: many consumers on one queue don't preserve order. Kafka keeps order within a partition, so key messages by entity (an order id) to keep each entity's events in order; SQS FIFO queues keep order within a message group. Retries and dead-letter queues can still reorder, so consumers that check versions or do idempotent upserts are the safest.","**Dead-letter queues**: after a few failed attempts, move the message to a dead-letter queue instead of retrying forever, so a poison message doesn't block a partition or burn consumers. Alert on the DLQ's depth, inspect the errors, fix the cause and replay. Transient errors deserve retries with backoff first (module 6).","**Transactional outbox**: writing to the database and publishing to a broker are two writes that can't be made atomic, so a crash between them loses an event, or announces a change that never committed. Insert the event into an outbox table in the same transaction as the change; a relay, or change-data-capture on the database log, publishes it at least once."],"dia":[{"type":"tiers","cap":"One topic, two consumer groups","tiers":[["Producer",["Order service: key = customer"]],["Topic: orders",["partition 0","partition 1","partition 2"],"same key, same partition"],["Group: billing (shares the work)",["billing-1: partitions 0 and 2","billing-2: partition 1"],"one member per partition"],["Group: email (gets everything)",["email-1: partitions 0, 1 and 2"],"every group reads every message"]],"note":"Inside a group the partitions are split among the members, like a queue; across groups every group gets every message, like pub/sub. Offsets belong to each group, so a new group can start from the beginning and replay."},{"type":"seq","cap":"At-least-once: the ack that never arrived","actors":["Broker","Worker A","Worker B","Payments"],"msgs":[["Broker","Worker A","deliver m7 (hidden for 30 s)"],["Worker A","Payments","charge order 7 and record m7"],["Worker A","Broker","ack: never sent, A crashed",true],["Broker","Worker B","30 s passed: deliver m7 again"],["Worker B","Payments","charge order 7?"],["Payments","Worker B","m7 already recorded: skip",true],["Worker B","Broker","ack",true]],"note":"The broker can't tell a crashed worker from a slow one, so it redelivers. Recording the message id with the charge makes the second delivery harmless."},{"type":"flow","cap":"The transactional outbox","steps":[["One transaction","insert the order and an outbox row holding its event: both commit or neither does"],["Relay reads","the oldest unsent outbox rows, in order (or change-data-capture tails the database log)"],["Publish","send each event to the broker"],["Mark sent","a crash before this step means the event is sent again"],["Consumers","skip event ids they've already processed"]],"note":"The transaction makes the event as durable as the order, the relay makes delivery at-least-once, and the consumers' dedupe turns that into an exactly-once effect."}],"cmp":[{"cap":"Queues and pub/sub","head":["","Queue (point to point)","Pub/sub (topic)"],"rows":[["Each message goes to","One consumer","Every subscriber (in Kafka, every consumer group)"],["Adding consumers","Shares the work","Adds another independent reader"],["After it's consumed","Deleted once acknowledged","Classic pub/sub drops it once delivered; a log keeps it for the retention period"],["Typical use","Background jobs, work distribution","Events that several services react to"],["Examples","Amazon SQS, RabbitMQ queues, Celery","Kafka topics, Amazon SNS, Google Pub/Sub, Redis pub/sub"]]},{"cap":"Delivery guarantees","head":["Guarantee","How","On a crash","Use for"],"rows":[["At-most-once","Ack (or commit the offset) before processing","The message is lost","Metrics, logs, anything where a gap is fine"],["At-least-once","Process, then ack; redeliver after a timeout","The message is processed again","The default for almost everything"],["Exactly-once effect","At-least-once plus idempotent processing, or a transaction that covers reading, processing and writing","The duplicate is detected and skipped","Payments, ledgers, inventory"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"A topic with partitions and consumer groups: a queue and pub/sub at once","tabs":[{"lang":"python","src":"class Topic:\n    \"\"\"A log-based topic: messages are appended to partitions and kept; each consumer group has its own offsets.\"\"\"\n    def __init__(self, partitions):\n        self.parts = [[] for _ in range(partitions)]\n        self.offsets = {}                         # (group, partition) -> next offset to read\n\n    def publish(self, key, message):\n        self.parts[sum(map(ord, key)) % len(self.parts)].append(message)   # same key, same partition\n\n    def poll(self, group, partition):\n        offset = self.offsets.get((group, partition), 0)\n        batch = self.parts[partition][offset:]\n        self.offsets[(group, partition)] = len(self.parts[partition])     # commit: nothing is deleted\n        return batch\n\ndef consume(topic, group, members):\n    \"\"\"Split the partitions among a group's members; each member reads only its own partitions.\"\"\"\n    got = {m: [] for m in members}\n    for p in range(len(topic.parts)):\n        got[members[p % len(members)]] += topic.poll(group, p)\n    return got\n\norders = Topic(partitions=3)\nfor n, customer in enumerate([\"ana\", \"ben\", \"eve\", \"ana\", \"ben\", \"cy\"], 1):\n    orders.publish(customer, f\"o{n}\")\nfor group, members in ((\"billing\", [\"billing-1\", \"billing-2\"]), (\"email\", [\"email-1\"])):\n    for member, msgs in consume(orders, group, members).items():\n        print(f\"{member}: {' '.join(msgs)}\")\nagain = len(consume(orders, \"email\", [\"email-1\"])[\"email-1\"])\nlate = len(consume(orders, \"analytics\", [\"analytics-1\"])[\"analytics-1\"])\nprint(f\"email polls again: {again} new | analytics, a new group, reads {late} from the start\")\n","out":"billing-1: o2 o5 o3\nbilling-2: o1 o4 o6\nemail-1: o2 o5 o1 o4 o6 o3\nemail polls again: 0 new | analytics, a new group, reads 6 from the start\n","notes":[[8,"The key picks the partition, so all of one customer's orders land in the same partition, in the order they were sent."],[13,"Reading deletes nothing: the group only moves its own offset forward, and other groups keep their own positions."],[20,"Inside a group each partition has exactly one reader, so the members share the work like a queue."],[30,"A new group starts at offset 0 and replays the whole log; a classic queue would already have deleted these messages."]]},{"lang":"javascript","src":"class Topic {\n  // a log-based topic: messages are appended to partitions and kept; each consumer group has its own offsets\n  constructor(partitions) {\n    this.parts = Array.from({ length: partitions }, () => []);\n    this.offsets = new Map();                   // \"group/partition\" -> next offset to read\n  }\n  publish(key, message) {\n    const p = [...key].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % this.parts.length;\n    this.parts[p].push(message);                // same key, same partition\n  }\n  poll(group, partition) {\n    const offset = this.offsets.get(`${group}/${partition}`) ?? 0;\n    const batch = this.parts[partition].slice(offset);\n    this.offsets.set(`${group}/${partition}`, this.parts[partition].length);   // commit: nothing is deleted\n    return batch;\n  }\n}\n\nfunction consume(topic, group, members) {\n  // split the partitions among a group's members; each member reads only its own partitions\n  const got = new Map(members.map(m => [m, []]));\n  for (let p = 0; p < topic.parts.length; p++) got.get(members[p % members.length]).push(...topic.poll(group, p));\n  return got;\n}\n\nconst orders = new Topic(3);\n[\"ana\", \"ben\", \"eve\", \"ana\", \"ben\", \"cy\"].forEach((customer, i) => orders.publish(customer, `o${i + 1}`));\nfor (const [group, members] of [[\"billing\", [\"billing-1\", \"billing-2\"]], [\"email\", [\"email-1\"]]]) {\n  for (const [member, msgs] of consume(orders, group, members)) console.log(`${member}: ${msgs.join(\" \")}`);\n}\nconst again = consume(orders, \"email\", [\"email-1\"]).get(\"email-1\").length;\nconst late = consume(orders, \"analytics\", [\"analytics-1\"]).get(\"analytics-1\").length;\nconsole.log(`email polls again: ${again} new | analytics, a new group, reads ${late} from the start`);\n","out":"billing-1: o2 o5 o3\nbilling-2: o1 o4 o6\nemail-1: o2 o5 o1 o4 o6 o3\nemail polls again: 0 new | analytics, a new group, reads 6 from the start\n","notes":[[9,"The key picks the partition, so all of one customer's orders land in the same partition, in the order they were sent."],[14,"Reading deletes nothing: the group only moves its own offset forward, and other groups keep their own positions."],[22,"Inside a group each partition has exactly one reader, so the members share the work like a queue."],[32,"A new group starts at offset 0 and replays the whole log; a classic queue would already have deleted these messages."]]}]},{"t":"At-most-once, at-least-once and an idempotent consumer, under the same crashes","tabs":[{"lang":"python","src":"def deliver(mode, n=100, crash_rate=0.1, seed=6):\n    rand = mulberry32(seed)\n    charges, seen = {}, set()                     # order -> times charged; orders already processed\n    for order in range(n):\n        while True:                               # the broker keeps delivering until it gets an ack\n            crashed = rand() < crash_rate         # does the worker die during this attempt?\n            if mode == \"at-most-once\":            # ack first, then process\n                if not crashed:\n                    charges[order] = charges.get(order, 0) + 1\n                break                             # acked either way: a crash loses the order\n            if not (mode == \"idempotent\" and order in seen):\n                charges[order] = charges.get(order, 0) + 1\n                seen.add(order)                   # stored in the same transaction as the charge\n            if not crashed:\n                break                             # process, then ack: a crash before the ack means redelivery\n    lost = n - len(charges)\n    duplicated = sum(1 for times in charges.values() if times > 1)\n    return lost, duplicated\n\nfor mode in (\"at-most-once\", \"at-least-once\", \"idempotent\"):\n    lost, duplicated = deliver(mode)\n    print(f\"{mode}: {lost} orders never charged, {duplicated} charged more than once\")\n","out":"at-most-once: 10 orders never charged, 0 charged more than once\nat-least-once: 0 orders never charged, 10 charged more than once\nidempotent: 0 orders never charged, 0 charged more than once\n","notes":[[10,"At-most-once: the ack went first, so when the worker crashes the broker has already forgotten the message."],[11,"The idempotent consumer checks whether this order was already processed; a redelivery skips the charge and just acks."],[15,"At-least-once: the ack comes after the work, so a crash in between makes the broker deliver the same message again."],[22,"Same crashes, three outcomes: lost orders, double charges, or neither. Only the idempotent consumer gets an exactly-once effect."]]},{"lang":"javascript","src":"function deliver(mode, n = 100, crashRate = 0.1, seed = 6) {\n  const rand = mulberry32(seed);\n  const charges = new Map(), seen = new Set();  // order -> times charged; orders already processed\n  const charge = order => charges.set(order, (charges.get(order) ?? 0) + 1);\n  for (let order = 0; order < n; order++) {\n    while (true) {                              // the broker keeps delivering until it gets an ack\n      const crashed = rand() < crashRate;       // does the worker die during this attempt?\n      if (mode === \"at-most-once\") {            // ack first, then process\n        if (!crashed) charge(order);\n        break;                                  // acked either way: a crash loses the order\n      }\n      if (!(mode === \"idempotent\" && seen.has(order))) {\n        charge(order);\n        seen.add(order);                        // stored in the same transaction as the charge\n      }\n      if (!crashed) break;                      // process, then ack: a crash before the ack means redelivery\n    }\n  }\n  const lost = n - charges.size;\n  const duplicated = [...charges.values()].filter(times => times > 1).length;\n  return [lost, duplicated];\n}\n\nfor (const mode of [\"at-most-once\", \"at-least-once\", \"idempotent\"]) {\n  const [lost, duplicated] = deliver(mode);\n  console.log(`${mode}: ${lost} orders never charged, ${duplicated} charged more than once`);\n}\n","out":"at-most-once: 10 orders never charged, 0 charged more than once\nat-least-once: 0 orders never charged, 10 charged more than once\nidempotent: 0 orders never charged, 0 charged more than once\n","notes":[[10,"At-most-once: the ack went first, so when the worker crashes the broker has already forgotten the message."],[12,"The idempotent consumer checks whether this order was already processed; a redelivery skips the charge and just acks."],[16,"At-least-once: the ack comes after the work, so a crash in between makes the broker deliver the same message again."],[26,"Same crashes, three outcomes: lost orders, double charges, or neither. Only the idempotent consumer gets an exactly-once effect."]]}]},{"t":"Ordering: a shared queue against partitioning by key","tabs":[{"lang":"python","src":"def apply_events(events, workers, by_key, seed=4):\n    \"\"\"Process the events with several workers; count orders whose events finished out of order.\"\"\"\n    rand = mulberry32(seed)\n    free_at = [0] * workers                       # when each worker is next free\n    finished = {}                                 # (order, step) -> time its processing finished\n    for order, step in events:\n        if by_key:\n            w = order % workers                   # partitioned: an order's events always go to the same worker\n        else:\n            w = free_at.index(min(free_at))       # shared queue: whichever worker is free first\n        free_at[w] += 1 + int(rand() * 5)         # processing takes 1 to 5 time units\n        finished[(order, step)] = free_at[w]\n    orders = {order for order, _ in events}\n    return sum(1 for o in orders if any(finished[(o, s + 1)] < finished[(o, s)] for s in range(2)))\n\nevents = [(order, step) for order in range(10) for step in range(3)]   # created, paid, shipped, back to back\nfor by_key, label in ((False, \"one shared queue, 3 workers\"), (True, \"partitioned by order id, 3 workers\")):\n    print(f\"{label}: {apply_events(events, 3, by_key)} of 10 orders had events applied out of order\")\n","out":"one shared queue, 3 workers: 5 of 10 orders had events applied out of order\npartitioned by order id, 3 workers: 0 of 10 orders had events applied out of order\n","notes":[[8,"Partitioned by key: all of an order's events go to one worker, which handles them one after another."],[10,"A shared queue hands each event to whichever worker is free, so created, paid and shipped can run at the same time."],[14,"An order counts as broken if any later event finished before the one before it."],[18,"Half the orders are applied out of order with a shared queue, none with partitioning. The price: one slow or hot key holds up its whole partition."]]},{"lang":"javascript","src":"function applyEvents(events, workers, byKey, seed = 4) {\n  // process the events with several workers; count orders whose events finished out of order\n  const rand = mulberry32(seed);\n  const freeAt = new Array(workers).fill(0);    // when each worker is next free\n  const finished = new Map();                   // \"order/step\" -> time its processing finished\n  for (const [order, step] of events) {\n    const w = byKey\n      ? order % workers                         // partitioned: an order's events always go to the same worker\n      : freeAt.indexOf(Math.min(...freeAt));    // shared queue: whichever worker is free first\n    freeAt[w] += 1 + Math.floor(rand() * 5);    // processing takes 1 to 5 time units\n    finished.set(`${order}/${step}`, freeAt[w]);\n  }\n  const orders = new Set(events.map(([order]) => order));\n  return [...orders].filter(o => [0, 1].some(s => finished.get(`${o}/${s + 1}`) < finished.get(`${o}/${s}`))).length;\n}\n\nconst events = Array.from({ length: 10 }, (_, order) => [0, 1, 2].map(step => [order, step])).flat();   // created, paid, shipped, back to back\nfor (const [byKey, label] of [[false, \"one shared queue, 3 workers\"], [true, \"partitioned by order id, 3 workers\"]]) {\n  console.log(`${label}: ${applyEvents(events, 3, byKey)} of 10 orders had events applied out of order`);\n}\n","out":"one shared queue, 3 workers: 5 of 10 orders had events applied out of order\npartitioned by order id, 3 workers: 0 of 10 orders had events applied out of order\n","notes":[[8,"Partitioned by key: all of an order's events go to one worker, which handles them one after another."],[9,"A shared queue hands each event to whichever worker is free, so created, paid and shipped can run at the same time."],[14,"An order counts as broken if any later event finished before the one before it."],[19,"Half the orders are applied out of order with a shared queue, none with partitioning. The price: one slow or hot key holds up its whole partition."]]}]}],"ex":{"q":"An order service must save each order and publish an OrderPlaced event. Show what goes wrong when it commits to the database and then publishes to the broker, and design a transactional outbox that never loses an event.","steps":["Two separate writes can't be atomic. Crash after the database commit and before the publish, and the event is lost; publish first and crash before the commit, and other services hear about an order that doesn't exist.","The outbox: in the same database transaction as the order, insert a row holding the event into an outbox table. Both commit or neither does.","A relay reads the unsent outbox rows in order, publishes each one, then marks it sent. A crash between publishing and marking means the event is published again after a restart: at-least-once, so events carry ids and consumers deduplicate.","Change-data-capture (Debezium reading the database log, for example) can replace the polling relay. The costs: a table to prune, a little delay before publishing, and a relay to monitor; the age of the oldest unsent row makes a good alert."],"code":{"t":"Dual write against a transactional outbox, with a deduplicating consumer","tabs":[{"lang":"python","src":"def dual_write(n, seed):\n    rand, db, published = mulberry32(seed), [], []\n    for order in range(n):\n        db.append(order)                          # 1. commit the order\n        if rand() < 0.08:\n            continue                              # crash here: the order exists, the event is never sent\n        published.append(order)                   # 2. publish the event\n    return db, published\n\ndef with_outbox(n, seed):\n    rand, db, outbox, published = mulberry32(seed), [], [], []\n    for order in range(n):\n        db.append(order)                          # one transaction: the order...\n        outbox.append({\"id\": order, \"sent\": False})   # ...and its event, committed together\n    while True:                                   # the relay\n        row = next((r for r in outbox if not r[\"sent\"]), None)   # SELECT the oldest unsent row\n        if row is None:\n            break\n        published.append(row[\"id\"])               # publish it\n        if rand() < 0.08:\n            continue                              # crash before marking it sent: it is published again\n        row[\"sent\"] = True                        # UPDATE outbox SET sent = true\n    return db, published\n\ndef consume_once(events):\n    seen, handled = set(), 0\n    for event_id in events:\n        if event_id not in seen:                  # dedupe by event id\n            seen.add(event_id)\n            handled += 1\n    return handled\n\nfor name, run in ((\"dual write\", dual_write), (\"outbox\", with_outbox)):\n    db, published = run(100, seed=4)\n    missing = len(db) - len(set(published))\n    print(f\"{name}: {len(db)} orders, {len(published)} events sent, {missing} orders missing, {consume_once(published)} handled after dedupe\")\n","out":"dual write: 100 orders, 92 events sent, 8 orders missing, 92 handled after dedupe\noutbox: 100 orders, 108 events sent, 0 orders missing, 100 handled after dedupe\n"},{"lang":"javascript","src":"function dualWrite(n, seed) {\n  const rand = mulberry32(seed), db = [], published = [];\n  for (let order = 0; order < n; order++) {\n    db.push(order);                             // 1. commit the order\n    if (rand() < 0.08) continue;                // crash here: the order exists, the event is never sent\n    published.push(order);                      // 2. publish the event\n  }\n  return [db, published];\n}\n\nfunction withOutbox(n, seed) {\n  const rand = mulberry32(seed), db = [], outbox = [], published = [];\n  for (let order = 0; order < n; order++) {\n    db.push(order);                             // one transaction: the order...\n    outbox.push({ id: order, sent: false });    // ...and its event, committed together\n  }\n  while (true) {                                // the relay\n    const row = outbox.find(r => !r.sent);      // SELECT the oldest unsent row\n    if (row === undefined) break;\n    published.push(row.id);                     // publish it\n    if (rand() < 0.08) continue;                // crash before marking it sent: it is published again\n    row.sent = true;                            // UPDATE outbox SET sent = true\n  }\n  return [db, published];\n}\n\nfunction consumeOnce(events) {\n  const seen = new Set();\n  let handled = 0;\n  for (const id of events) {\n    if (!seen.has(id)) { seen.add(id); handled++; }   // dedupe by event id\n  }\n  return handled;\n}\n\nfor (const [name, run] of [[\"dual write\", dualWrite], [\"outbox\", withOutbox]]) {\n  const [db, published] = run(100, 4);\n  const missing = db.length - new Set(published).size;\n  console.log(`${name}: ${db.length} orders, ${published.length} events sent, ${missing} orders missing, ${consumeOnce(published)} handled after dedupe`);\n}\n","out":"dual write: 100 orders, 92 events sent, 8 orders missing, 92 handled after dedupe\noutbox: 100 orders, 108 events sent, 0 orders missing, 100 handled after dedupe\n"}]},"a":"The dual write loses 8 of the 100 events: those orders exist, but no other service ever hears about them. The outbox sends 108 events, 8 of them repeats after relay crashes, and loses none; the consumer's dedupe by event id brings that back to exactly 100."},"fade":{"q":"Finish `drain(messages, handler, max_attempts)`: process messages in order; when the handler raises, the message goes to the back of the queue to be retried; after `max_attempts` failures it moves to the dead-letter list with its error. Return the processed ids, the dead letters and the number of handler calls.","steps":["Keep each message with its count of failed attempts. Take from the front, call the handler, and record the id on success.",{"ask":"What happens to a message whose handler fails?","a":"Its failure count goes up. Below the limit it goes to the back of the queue, so the messages behind it aren't blocked; at the limit it moves to the dead-letter list with the error."},{"ask":"What does sending failures to the back cost?","a":"Ordering: m2 is processed after m4 and m5. When a key's order matters, retry in place after a delay (holding up only that key's partition), or park the message and hold the later messages with the same key."},{"ask":"What's the cost, and what do you monitor?","a":"Each message is handled at most max_attempts times, so a poison message costs a bounded amount of work. Alert on the dead-letter queue's depth and age, inspect the errors, fix the cause and replay. Real systems also wait between attempts, with backoff (module 6)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"from collections import deque\n\ndef drain(messages, handler, max_attempts=3):\n    queue = deque((m, 0) for m in messages)      # (message, failed attempts so far)\n    done, dead, calls = [], [], 0\n    while queue:\n        msg, failures = queue.popleft()\n        calls += 1\n        ...                                       # TODO: call the handler; on failure retry at the back, or dead-letter\n    return done, dead, calls\n"},{"lang":"javascript","src":"function drain(messages, handler, maxAttempts = 3) {\n  const queue = messages.map(m => [m, 0]);      // [message, failed attempts so far]\n  const done = [], dead = [];\n  let calls = 0;\n  while (queue.length) {\n    let [msg, failures] = queue.shift();\n    calls++;\n    // TODO: call the handler; on failure retry at the back, or dead-letter\n  }\n  return [done, dead, calls];\n}\n"}]},"solution":{"t":"Solution: retry at the back, dead-letter at the limit","tabs":[{"lang":"python","src":"from collections import deque\n\ndef drain(messages, handler, max_attempts=3):\n    queue = deque((m, 0) for m in messages)      # (message, failed attempts so far)\n    done, dead, calls = [], [], 0\n    while queue:\n        msg, failures = queue.popleft()\n        calls += 1\n        try:\n            handler(msg)\n            done.append(msg[\"id\"])\n        except ValueError as err:\n            failures += 1\n            if failures < max_attempts:\n                queue.append((msg, failures))     # retry later; don't block the messages behind it\n            else:\n                dead.append(f\"{msg['id']} ({err})\")   # give up: park it for a human to inspect\n    return done, dead, calls\n\nflaky_seen = set()\ndef handler(msg):\n    if msg[\"body\"] == \"???\":\n        raise ValueError(\"unreadable body\")       # a poison message: it will never succeed\n    if msg[\"body\"] == \"flaky\" and msg[\"id\"] not in flaky_seen:\n        flaky_seen.add(msg[\"id\"])\n        raise ValueError(\"timeout\")               # a transient failure: works on the second try\n\nmessages = [{\"id\": f\"m{i}\", \"body\": body} for i, body in enumerate([\"ok\", \"flaky\", \"???\", \"ok\", \"ok\"], 1)]\ndone, dead, calls = drain(messages, handler)\nprint(\"processed:\", *done, \"| dead letters:\", *dead, \"| handler calls:\", calls)\n","out":"processed: m1 m4 m5 m2 | dead letters: m3 (unreadable body) | handler calls: 8"},{"lang":"javascript","src":"function drain(messages, handler, maxAttempts = 3) {\n  const queue = messages.map(m => [m, 0]);      // [message, failed attempts so far]\n  const done = [], dead = [];\n  let calls = 0;\n  while (queue.length) {\n    let [msg, failures] = queue.shift();\n    calls++;\n    try {\n      handler(msg);\n      done.push(msg.id);\n    } catch (err) {\n      failures++;\n      if (failures < maxAttempts) queue.push([msg, failures]);   // retry later; don't block the messages behind it\n      else dead.push(`${msg.id} (${err.message})`);              // give up: park it for a human to inspect\n    }\n  }\n  return [done, dead, calls];\n}\n\nconst flakySeen = new Set();\nfunction handler(msg) {\n  if (msg.body === \"???\") throw new Error(\"unreadable body\");   // a poison message: it will never succeed\n  if (msg.body === \"flaky\" && !flakySeen.has(msg.id)) {\n    flakySeen.add(msg.id);\n    throw new Error(\"timeout\");                 // a transient failure: works on the second try\n  }\n}\n\nconst messages = [\"ok\", \"flaky\", \"???\", \"ok\", \"ok\"].map((body, i) => ({ id: `m${i + 1}`, body }));\nconst [done, dead, calls] = drain(messages, handler);\nconsole.log(\"processed:\", ...done, \"| dead letters:\", ...dead, \"| handler calls:\", calls);\n","out":"processed: m1 m4 m5 m2 | dead letters: m3 (unreadable body) | handler calls: 8"}]}},"traps":[["“Our broker guarantees exactly-once, so consumers don't need to deduplicate.”","Exactly-once features cover a narrow path, such as Kafka transactions from topic to topic, or SQS FIFO deduplication within a five-minute window. Effects outside the broker, like charging a card or sending an email, still need idempotency keys."],["“Acknowledge first, so the message isn't redelivered.”","That's at-most-once: a crash after the ack loses the message. Process first, then acknowledge, and make the processing idempotent."],["“A FIFO queue keeps things in order, however many consumers it has.”","The queue hands messages out in order, but parallel consumers finish them in any order. Order holds per partition or message group, with one consumer at a time."],["“Retry failed messages until they succeed.”","A poison message never succeeds: it burns consumers and, in an ordered partition, blocks everything behind it. Cap the attempts, back off between them, and dead-letter the rest."],["“Save to the database, then publish the event: what could go wrong?”","A crash between the two loses the event, and publishing first can announce an order that never commits. Use a transactional outbox or change-data-capture."],["“A queue fixes overload.”","It turns a spike into a backlog. If consumers are slower than producers on average, the backlog grows until messages expire or the disk fills. Watch depth and consumer lag, scale consumers, and push back on producers."]],"disc":[["When would you choose a log-based broker such as Kafka over a classic queue such as SQS or RabbitMQ?","Kafka when several independent consumers need the same events, when you want to replay history (rebuild a view, backfill a new service), or when per-key ordering at high throughput matters. A classic queue when the job is handing tasks to workers, with per-message acks, delays, dead-letter queues and easy scaling, and nobody needs the history."],["A payment consumer occasionally charges customers twice. How would you find and fix it?","Duplicates point to at-least-once redelivery: a handler slower than the visibility timeout, a crash between charging and acknowledging, or a producer retry that published twice. Fix it at the effect: give each payment an idempotency key, store it with the charge in one transaction (and pass it to the payment provider, which accepts idempotency keys), and skip keys already processed. Then tune the timeout and alert on redelivery counts."]],"teach":{"prompt":"Explain to a junior colleague the difference between a queue and pub/sub, and how you'd make a consumer safe when the broker delivers at least once.","rubric":["Queue: each message to one consumer; pub/sub: every subscriber gets a copy","Ack after processing gives at-least-once; ack before gives at-most-once","Exactly-once effect: at-least-once delivery plus an idempotent consumer that records ids with the effect","Order holds only per partition or key","A dead-letter queue after a few attempts, monitored and replayed"],"model":"A queue gives each message to one consumer, so adding consumers shares the work; pub/sub gives every subscriber its own copy, so several services can react to the same event. Kafka does both with consumer groups. Brokers forget a message only when it's acknowledged, so I process first and ack after, which is at-least-once: a crash or a slow ack means the same message arrives again. To make that safe, the consumer records each message id in the same transaction as its effect and skips ids it has seen, which gives an exactly-once effect. Order holds only within a partition, so I key messages by entity. Messages that keep failing go to a dead-letter queue after a few attempts, with an alert, so they can be fixed and replayed instead of blocking everything."},"qa":[["Queue or pub/sub: which gives each message to one consumer?","A queue; pub/sub gives every subscriber a copy."],["Acknowledging before processing gives?","At-most-once delivery: a crash after the ack loses the message."],["How do you get an exactly-once effect?","At-least-once delivery plus an idempotent consumer that records message ids with the effect."],["How does Kafka keep order?","Only within a partition, so key messages by entity to keep each entity's events in order."],["What is a dead-letter queue for?","Parking messages that keep failing, so they stop blocking or burning consumers."],["The transactional outbox?","Write the event to an outbox table in the same transaction as the data; a relay publishes it."]],"quiz":[{"q":"What does this print?","snip":{"t":"Two workers share a queue; an audit service subscribes","tabs":[{"lang":"python","src":"msgs = [\"a\", \"b\", \"c\", \"d\", \"e\"]\nworkers = {\"w1\": [], \"w2\": []}\nnames = list(workers)\nfor i, m in enumerate(msgs):\n    workers[names[i % 2]].append(m)\naudit = list(msgs)\nprint(\" \".join(workers[\"w1\"]), \"|\", \" \".join(workers[\"w2\"]), \"|\", len(audit))\n"},{"lang":"javascript","src":"const msgs = [\"a\", \"b\", \"c\", \"d\", \"e\"];\nconst workers = { w1: [], w2: [] };\nconst names = Object.keys(workers);\nmsgs.forEach((m, i) => workers[names[i % 2]].push(m));\nconst audit = [...msgs];\nconsole.log(workers.w1.join(\" \"), \"|\", workers.w2.join(\" \"), \"|\", audit.length);\n"}]},"o":["a c e | b d | 5","a b c d e | a b c d e | 5","a c e | b d | 0","a b c | d e | 5"],"a":0,"e":"The two workers compete for the queue's messages, so they alternate; the audit service is a separate subscriber and receives all five."},{"q":"What does this print?","snip":{"t":"A consumer that remembers message ids","tabs":[{"lang":"python","src":"balance, seen = 0, set()\nfor msg_id, amount in [(\"t1\", 50), (\"t2\", 20), (\"t1\", 50), (\"t3\", 30), (\"t2\", 20)]:\n    if msg_id in seen:\n        continue\n    seen.add(msg_id)\n    balance += amount\nprint(balance, len(seen))\n"},{"lang":"javascript","src":"let balance = 0;\nconst seen = new Set();\nfor (const [msgId, amount] of [[\"t1\", 50], [\"t2\", 20], [\"t1\", 50], [\"t3\", 30], [\"t2\", 20]]) {\n  if (seen.has(msgId)) continue;\n  seen.add(msgId);\n  balance += amount;\n}\nconsole.log(balance, seen.size);\n"}]},"o":["100 3","170 5","100 5","170 3"],"a":0,"e":"t1 and t2 are each delivered twice, but the second copies are skipped, so only t1, t2 and t3 count: 50 + 20 + 30 = 100, from 3 distinct messages."},{"q":"Each order's events (created, paid, shipped) must be processed in order, and you need 20 consumers for throughput. What do you do?","o":["Partition the topic by order id, with each partition read by one consumer at a time","Put all events on one queue with 20 competing consumers","Use a single consumer","Let consumers sort events by their timestamps"],"a":0,"e":"Partitioning by key keeps each order's events in one partition, read in order, while the 20 consumers share the partitions. One shared queue lets events of the same order run in parallel; one consumer can't keep up; and timestamps from different machines can't be trusted to order events."},{"q":"Which make a consumer safe under at-least-once delivery? (choose 2)","t":"ms","o":["Record each message id in the same transaction as its effect, and skip ids already seen","Make the effect idempotent by nature, such as setting status = 'paid'","Acknowledge each message before processing it","Raise the visibility timeout to an hour","Retry failed messages forever"],"a":[0,1],"e":"Both make a repeated delivery harmless. Acknowledging first trades duplicates for lost messages; a longer timeout makes redelivery rarer but not impossible; and endless retries let a poison message block the queue."},{"q":"Judge each statement.","t":"yn","s":[["A topic delivers each message to every subscriber group.",true],["Acknowledging a message before processing it gives at-least-once delivery.",false],["Kafka keeps a topic's messages in order across all of its partitions.",false],["A dead-letter queue stops a poison message from being retried forever.",true]],"e":"Every group gets every message. Acknowledging first gives at-most-once: a crash loses the message. Kafka orders messages only within a partition. And a dead-letter queue parks messages after a set number of failures."},{"q":"Put the transactional outbox steps in order.","t":"ord","items":["In one transaction, insert the order and an outbox row holding its event","The relay reads the oldest unsent outbox row","The relay publishes the event to the broker","The relay marks the row as sent","The consumer processes the event, skipping ids it has already seen"],"e":"The transaction makes the event durable with the order; the relay publishes before marking, so a crash causes a repeat rather than a loss, and the consumer's dedupe absorbs the repeat."},{"q":"Complete the Python failure handler: retry at the back of the queue, and dead-letter the message once it has failed `max_attempts` times.","t":"drop","lang":"python","code":"def on_failure(msg, attempts, queue, dlq, max_attempts=3):\n    attempts += 1\n    if {{0}}:\n        dlq.append(msg)\n    else:\n        queue.append({{1}})\n    return attempts\n","blanks":[{"o":["attempts >= max_attempts","attempts > max_attempts","attempts < max_attempts","max_attempts >= attempts"],"a":0},{"o":["(msg, attempts)","(msg, 0)","msg","(attempts, msg)"],"a":0}],"e":"After the third failure the message goes to the dead-letter queue; before that it goes back on the queue carrying its new attempt count, so the next failure is counted correctly."},{"q":"Match each description to its name.","t":"match","pairs":[["Each message goes to one consumer in a group","Queue (competing consumers)"],["Every subscriber gets each message","Pub/sub"],["Messages that keep failing are parked here","Dead-letter queue"],["Events written in the same transaction as the data","Transactional outbox"]],"extra":["Write-back cache"],"e":"Write-back is a caching strategy (module 4), not a messaging pattern."}],"probs":[["Exercise · SQS visibility timeouts","https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html","","work out what happens when processing takes longer than the timeout, and how a consumer can extend it"],["Exercise · SQS dead-letter queues","https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html","","set a maxReceiveCount for a payment queue, say why it shouldn't be 1, and plan how failed messages get replayed"],["Reading · Kafka's design: delivery semantics","https://kafka.apache.org/43/design/design/","","in the Message Delivery Semantics section, explain how committing the offset before or after processing changes the guarantee, and what Kafka transactions add"],["Pattern · Transactional outbox","https://microservices.io/patterns/data/transactional-outbox.html","","sketch the outbox table and the relay for an order service, and list what consumers must do about duplicates"]],"src":[["Apache Kafka documentation: Design","https://kafka.apache.org/43/design/design/"],["Amazon SQS Developer Guide: Visibility timeout","https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html"],["Amazon SQS Developer Guide: Dead-letter queues","https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html"],["RabbitMQ: Consumer acknowledgements and publisher confirms","https://www.rabbitmq.com/docs/confirms"],["microservices.io: Transactional outbox","https://microservices.io/patterns/data/transactional-outbox.html"]]},{"id":"m06","d":"d2","t":"Rate limiting and resilience: limits, timeouts, retries and breakers","min":110,"hook":"One client's runaway script, or one slow dependency, can take a whole service down. Rate limiters decide how much each client may send. Timeouts, retries with backoff, circuit breakers and bulkheads decide what happens when something you call gets slow or fails, so that a fault stays small instead of cascading through every service that waits on it.","pre":{"q":"Your service calls a payment API with a 30-second timeout and retries three times on any error. The payment API slows to 20 seconds per call. What happens to your service?","a":"Every payment request now holds a thread or connection for 20 seconds, and much longer with retries, so the pool fills and every endpoint, even ones that never touch payments, starts queueing and timing out. The retries also multiply the load on the struggling API. A shorter timeout, retries with backoff and jitter under a budget, a circuit breaker and a separate pool (a bulkhead) for payment calls would keep the slowdown contained."},"kid":{"t":"The pool's water slides","x":"At the pool, the big slide has a jar of tokens: one token per ride, one new token every ten seconds, five at most, so friends can go back to back, but nobody hogs it. The small slide just lets one kid go every ten seconds, however long the line. When the slide is shut, kids come back after one minute, then two, then four, each at a slightly different time, so they don't all rush back at once. After three kids got stuck, the lifeguard closed the slide for ten minutes, then let one kid test it. And the toddlers have their own slide, so a jam on the big one never stops them.","map":[["A jar of tokens that refills slowly, five at most","Token bucket: a steady refill rate, with room for short bursts"],["The small slide: one kid every ten seconds","Leaky bucket: requests leave at a fixed rate, however fast they arrive"],["Coming back after one, two, then four minutes, at slightly different times","Retries with exponential backoff and jitter"],["Closing the slide after three got stuck, then letting one kid test it","A circuit breaker: open after repeated failures, half-open to try again"],["The toddlers' own slide","A bulkhead: separate pools, so one failing dependency can't use up everything"]],"brk":"The kids can see that the slide is shut. A service usually can't: it only sees slow replies, so it needs timeouts to notice, and limits that hold across many servers rather than at one gate."},"keys":["**Why limit**: to protect a service from overload and abuse, share capacity fairly between clients, and control cost. Limit per client (API key, user, sometimes IP) and sometimes globally; reject with 429 Too Many Requests and a Retry-After header, and tell clients their remaining quota.","**Token bucket**: tokens refill at rate r up to a capacity b; each request spends one; an empty bucket rejects. Bursts of up to b pass, then r per second on average. Only two numbers per client: the tokens left and the time of the last refill.","**Leaky bucket**: requests join a queue that drains at a fixed rate, and a full queue rejects. The output is perfectly smooth, which suits a fragile backend, but requests wait in the queue and bursts can't get through faster. NGINX's limit_req works this way.","**Windows**: a fixed window counter is simplest (INCR plus EXPIRE) but lets up to twice the limit through around a window boundary. A sliding log stores every timestamp and is exact; a sliding window counter weights the previous window's count by how much of it still overlaps, which is accurate enough with just two counters.","**Limiting across servers**: with many API servers the counters must be shared (usually in Redis), and the check and the update must be one atomic step (a Lua script, or a single INCR), or two servers can both let the last request through. Cheaper approximations: give each of N servers limit/N, or route each client to one server. Decide whether to fail open or closed when the limiter's store is down.","**Timeouts**: every remote call needs one, set from the dependency's measured latency (a little above its p99.9, say), plus an overall deadline that shrinks as it's passed down the call chain. Without timeouts, one slow dependency holds threads and connections until everything queues behind it.","**Retries**: retry only transient failures (timeouts, 503s, dropped connections) and only idempotent operations or ones carrying an idempotency key. Use exponential backoff with jitter so clients don't retry in lockstep, cap the attempts, keep a retry budget (retries under about 10% of requests), and retry at one layer only: 4 attempts at each of 3 layers can turn one call into 64.","**Circuit breakers and bulkheads**: a breaker counts recent failures; past a threshold it opens and fails fast for a cool-down, then half-opens to let a trial call through, closing if it succeeds. A bulkhead gives each dependency its own pool of threads or connections, so one slow dependency can't starve the rest. With fallbacks (a cached or default answer) and load shedding, they stop failures from cascading."],"dia":[{"type":"tree","cap":"Should this call be retried?","root":{"q":"Is the error transient (a timeout, 503 or reset connection)?","c":[["No","Don't retry: a 400 or 404 will fail again"],["Yes",{"q":"Is the call idempotent, or does it carry an idempotency key?","c":[["No","Don't retry blindly: first check whether it took effect"],["Yes",{"q":"Is there budget left (attempts, retry ratio, deadline)?","c":[["Yes","Retry after a backoff with jitter"],["No","Fail, or serve a fallback"]]}]]}]]}},{"type":"flow","cap":"A circuit breaker's states","steps":[["Closed","calls go through; failures in a row are counted"],["Open","after 5 failures in a row: fail fast for 10 seconds without calling"],["Half-open","after the cool-down: let one trial call through"],["Closed or open","the trial succeeds: close and reset the count; it fails: open again"]],"note":"Failing fast spares the caller's threads and gives the dependency room to recover; the half-open trial finds out when it has."},{"type":"tiers","cap":"Where the protections sit","tiers":[["Clients",["Apps and partners","Retry with backoff and jitter"]],["Edge: API gateway",["Per-client token buckets","429 with Retry-After"],"HTTPS"],["Services",["Timeouts and deadlines","Retries at one layer, under a budget","Circuit breakers with fallbacks"],"only requests within limits"],["Dependencies",["A pool per dependency (bulkheads)","Load shedding when full"],"bounded concurrency"]],"note":"Edge limits keep clients fair and reject cheaply before any work is done; the inner layers keep each service alive when the things it calls misbehave."}],"cmp":[{"cap":"Rate-limiting algorithms","head":["Algorithm","State per client","Bursts","Accuracy","Notes"],"rows":[["Token bucket","Tokens and the last refill time","Up to the capacity","Exact","The usual choice for API limits"],["Leaky bucket (queue)","A queue","Smoothed out","Exact","Steady output, but requests wait"],["Fixed window counter","One counter per window","Up to twice the limit at a boundary","Coarse","Simplest: INCR and EXPIRE"],["Sliding window log","Every timestamp in the window","None beyond the limit","Exact","Memory grows with the limit"],["Sliding window counter","Two counters","Small","Approximate","Weights the previous window; good enough at scale"]]},{"cap":"Resilience patterns","head":["Pattern","Protects against","Watch out for"],"rows":[["Timeout","Waiting forever on a slow dependency","Too long ties up resources; too short fails healthy calls"],["Retry with backoff and jitter","Brief, transient failures","Duplicates (needs idempotency) and multiplied load"],["Circuit breaker","Hammering a dependency that's down","Needs a fallback; thresholds to tune per dependency"],["Bulkhead","One slow dependency using up every thread or connection","Pools that are too small waste capacity"],["Load shedding","More work than capacity","Shed low-priority work first"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Three limiters, 10 requests a minute, 20 requests around the minute boundary","tabs":[{"lang":"python","src":"class FixedWindow:\n    def __init__(self, limit, window_ms):\n        self.limit, self.window, self.counts = limit, window_ms, {}\n\n    def allow(self, now):\n        w = now // self.window                    # which window this request falls in\n        if self.counts.get(w, 0) >= self.limit:\n            return False\n        self.counts[w] = self.counts.get(w, 0) + 1\n        return True\n\nclass SlidingWindowCounter:\n    def __init__(self, limit, window_ms):\n        self.limit, self.window, self.counts = limit, window_ms, {}\n\n    def allow(self, now):\n        w, into = divmod(now, self.window)\n        prev, cur = self.counts.get(w - 1, 0), self.counts.get(w, 0)\n        # estimate = prev x (share of the previous window still in the last minute) + cur, in whole numbers\n        if prev * (self.window - into) + cur * self.window >= self.limit * self.window:\n            return False\n        self.counts[w] = cur + 1\n        return True\n\nclass TokenBucket:\n    def __init__(self, capacity, ms_per_token):\n        self.capacity, self.ms_per_token = capacity, ms_per_token\n        self.credit, self.last = capacity * ms_per_token, 0   # credit counts milliseconds of refill; starts full\n\n    def allow(self, now):\n        self.credit = min(self.capacity * self.ms_per_token, self.credit + now - self.last)   # refill\n        self.last = now\n        if self.credit < self.ms_per_token:\n            return False\n        self.credit -= self.ms_per_token          # spend one token\n        return True\n\nburst = [59_000 + 100 * i for i in range(20)]     # 20 requests between 59.0 s and 60.9 s\nfor name, limiter in ((\"fixed window\", FixedWindow(10, 60_000)),\n                      (\"sliding window counter\", SlidingWindowCounter(10, 60_000)),\n                      (\"token bucket\", TokenBucket(10, 6_000))):\n    allowed = sum(1 for t in burst if limiter.allow(t))\n    print(f\"{name}: {allowed} of 20 allowed in 2 seconds\")\n","out":"fixed window: 20 of 20 allowed in 2 seconds\nsliding window counter: 11 of 20 allowed in 2 seconds\ntoken bucket: 10 of 20 allowed in 2 seconds\n","notes":[[6,"Each window has its own counter, so the count starts again from zero at 60.0 seconds."],[20,"The previous window still counts in proportion to how much of it overlaps the last 60 seconds, so the full previous minute blocks almost everything."],[31,"Refill is computed lazily from the time since the last request, so an idle client costs nothing."],[43,"The fixed window lets 20 through in two seconds, twice the limit. The sliding counter lets one extra slip through; the token bucket holds at 10."]]},{"lang":"javascript","src":"class FixedWindow {\n  constructor(limit, windowMs) { this.limit = limit; this.window = windowMs; this.counts = new Map(); }\n  allow(now) {\n    const w = Math.floor(now / this.window);    // which window this request falls in\n    if ((this.counts.get(w) ?? 0) >= this.limit) return false;\n    this.counts.set(w, (this.counts.get(w) ?? 0) + 1);\n    return true;\n  }\n}\n\nclass SlidingWindowCounter {\n  constructor(limit, windowMs) { this.limit = limit; this.window = windowMs; this.counts = new Map(); }\n  allow(now) {\n    const w = Math.floor(now / this.window), into = now % this.window;\n    const prev = this.counts.get(w - 1) ?? 0, cur = this.counts.get(w) ?? 0;\n    // estimate = prev x (share of the previous window still in the last minute) + cur, in whole numbers\n    if (prev * (this.window - into) + cur * this.window >= this.limit * this.window) return false;\n    this.counts.set(w, cur + 1);\n    return true;\n  }\n}\n\nclass TokenBucket {\n  constructor(capacity, msPerToken) {\n    this.capacity = capacity; this.msPerToken = msPerToken;\n    this.credit = capacity * msPerToken; this.last = 0;   // credit counts milliseconds of refill; starts full\n  }\n  allow(now) {\n    this.credit = Math.min(this.capacity * this.msPerToken, this.credit + now - this.last);   // refill\n    this.last = now;\n    if (this.credit < this.msPerToken) return false;\n    this.credit -= this.msPerToken;             // spend one token\n    return true;\n  }\n}\n\nconst burst = Array.from({ length: 20 }, (_, i) => 59_000 + 100 * i);   // 20 requests between 59.0 s and 60.9 s\nfor (const [name, limiter] of [[\"fixed window\", new FixedWindow(10, 60_000)],\n                               [\"sliding window counter\", new SlidingWindowCounter(10, 60_000)],\n                               [\"token bucket\", new TokenBucket(10, 6_000)]]) {\n  const allowed = burst.filter(t => limiter.allow(t)).length;\n  console.log(`${name}: ${allowed} of 20 allowed in 2 seconds`);\n}\n","out":"fixed window: 20 of 20 allowed in 2 seconds\nsliding window counter: 11 of 20 allowed in 2 seconds\ntoken bucket: 10 of 20 allowed in 2 seconds\n","notes":[[4,"Each window has its own counter, so the count starts again from zero at 60.0 seconds."],[17,"The previous window still counts in proportion to how much of it overlaps the last 60 seconds, so the full previous minute blocks almost everything."],[29,"Refill is computed lazily from the time since the last request, so an idle client costs nothing."],[42,"The fixed window lets 20 through in two seconds, twice the limit. The sliding counter lets one extra slip through; the token bucket holds at 10."]]}]},{"t":"A retry storm: immediate retries, plain backoff and backoff with jitter","tabs":[{"lang":"python","src":"def storm(policy, clients=100, capacity=10, base=8, seed=2):\n    \"\"\"100 clients fail at once and retry. Each time slot the server completes 10 requests,\n    but only 5 when more than 20 arrive: an overloaded server wastes work.\"\"\"\n    rand = mulberry32(seed)\n    due = {0: list(range(clients))}               # slot -> clients sending a request in that slot\n    failures = [0] * clients\n    calls = overloaded = last = 0\n    while due:\n        slot = min(due)\n        batch = due.pop(slot)\n        calls += len(batch)\n        busy = len(batch) > 2 * capacity\n        if busy:\n            overloaded += 1\n        served = capacity // 2 if busy else capacity\n        for i, c in enumerate(batch):\n            if i < served:\n                last = slot                       # this client is done\n                continue\n            failures[c] += 1\n            ceiling = min(64, base * 2 ** (failures[c] - 1))   # 8, 16, 32, 64, 64... slots\n            if policy == \"immediate\":\n                wait = 1\n            elif policy == \"backoff\":\n                wait = ceiling                    # everyone who failed together waits the same time\n            else:\n                wait = 1 + int(rand() * ceiling)  # full jitter: anywhere up to the ceiling\n            due.setdefault(slot + wait, []).append(c)\n    return calls, overloaded, last\n\nfor policy in (\"immediate\", \"backoff\", \"backoff + jitter\"):\n    calls, overloaded, last = storm(policy)\n    print(f\"{policy}: {calls} calls, overloaded slots {overloaded}, last client served in slot {last}\")\n","out":"immediate: 1030 calls, overloaded slots 16, last client served in slot 17\nbackoff: 1030 calls, overloaded slots 16, last client served in slot 952\nbackoff + jitter: 215 calls, overloaded slots 1, last client served in slot 24\n","notes":[[15,"Overload makes things worse: a server swamped with requests completes fewer of them, so the retries feed the overload."],[23,"Immediate retries hit the server again in the very next slot, keeping it overloaded until the crowd thins."],[25,"Plain backoff waits longer each time, but clients that failed together still return together, in waves."],[27,"Jitter spreads each wave across the whole waiting period, so the server rarely sees more than it can handle."]]},{"lang":"javascript","src":"function storm(policy, clients = 100, capacity = 10, base = 8, seed = 2) {\n  // 100 clients fail at once and retry. Each time slot the server completes 10 requests,\n  // but only 5 when more than 20 arrive: an overloaded server wastes work.\n  const rand = mulberry32(seed);\n  const due = new Map([[0, Array.from({ length: clients }, (_, c) => c)]]);   // slot -> clients sending in that slot\n  const failures = new Array(clients).fill(0);\n  let calls = 0, overloaded = 0, last = 0;\n  while (due.size) {\n    const slot = Math.min(...due.keys());\n    const batch = due.get(slot);\n    due.delete(slot);\n    calls += batch.length;\n    const busy = batch.length > 2 * capacity;\n    if (busy) overloaded++;\n    const served = busy ? Math.floor(capacity / 2) : capacity;\n    batch.forEach((c, i) => {\n      if (i < served) { last = slot; return; }  // this client is done\n      failures[c]++;\n      const ceiling = Math.min(64, base * 2 ** (failures[c] - 1));   // 8, 16, 32, 64, 64... slots\n      let wait;\n      if (policy === \"immediate\") wait = 1;\n      else if (policy === \"backoff\") wait = ceiling;              // everyone who failed together waits the same time\n      else wait = 1 + Math.floor(rand() * ceiling);               // full jitter: anywhere up to the ceiling\n      if (!due.has(slot + wait)) due.set(slot + wait, []);\n      due.get(slot + wait).push(c);\n    });\n  }\n  return [calls, overloaded, last];\n}\n\nfor (const policy of [\"immediate\", \"backoff\", \"backoff + jitter\"]) {\n  const [calls, overloaded, last] = storm(policy);\n  console.log(`${policy}: ${calls} calls, overloaded slots ${overloaded}, last client served in slot ${last}`);\n}\n","out":"immediate: 1030 calls, overloaded slots 16, last client served in slot 17\nbackoff: 1030 calls, overloaded slots 16, last client served in slot 952\nbackoff + jitter: 215 calls, overloaded slots 1, last client served in slot 24\n","notes":[[15,"Overload makes things worse: a server swamped with requests completes fewer of them, so the retries feed the overload."],[21,"Immediate retries hit the server again in the very next slot, keeping it overloaded until the crowd thins."],[22,"Plain backoff waits longer each time, but clients that failed together still return together, in waves."],[23,"Jitter spreads each wave across the whole waiting period, so the server rarely sees more than it can handle."]]}]},{"t":"A circuit breaker through an outage","tabs":[{"lang":"python","src":"class CircuitBreaker:\n    def __init__(self, threshold=5, cooldown=10):\n        self.threshold, self.cooldown = threshold, cooldown\n        self.state, self.failures, self.opened_at = \"closed\", 0, None\n\n    def call(self, now, fn):\n        if self.state == \"open\":\n            if now - self.opened_at < self.cooldown:\n                return \"o\"                        # open: fail fast, don't even call\n            self.state = \"half-open\"              # cool-down over: let one trial call through\n        ok = fn(now)\n        if self.state == \"half-open\":\n            if ok:\n                self.state, self.failures = \"closed\", 0\n                return \"H\"                        # the trial worked: close again\n            self.state, self.opened_at = \"open\", now\n            return \"h\"                            # the trial failed: open for another cool-down\n        if ok:\n            self.failures = 0\n            return \".\"\n        self.failures += 1\n        if self.failures >= self.threshold:\n            self.state, self.opened_at = \"open\", now   # too many failures in a row: open\n        return \"x\"\n\ndef healthy(t):\n    return not 10 <= t < 36                       # the dependency is down from second 10 to second 35\n\nbreaker = CircuitBreaker()\ntimeline = \"\".join(breaker.call(t, healthy) for t in range(60))   # one call a second for a minute\nprint(\"timeline:\", timeline)\nreached = sum(1 for t, mark in enumerate(timeline) if mark != \"o\" and not healthy(t))\nprint(f\"calls that reached the dependency while it was down: {reached} of 26\")\n","out":"timeline: ..........xxxxxooooooooohooooooooohoooooooooH...............\ncalls that reached the dependency while it was down: 7 of 26\n","notes":[[9,"Open: the call fails at once without touching the dependency, so the caller's threads are free and the dependency gets room to recover."],[17,"A failed trial opens the breaker again for another full cool-down."],[22,"Five failures in a row open the breaker; a success resets the count."],[33,"In the timeline, . is a success, x a failure, o a fast failure, h a failed trial and H the trial that closed it. Only 7 of the 26 calls during the outage reached the dependency."]]},{"lang":"javascript","src":"class CircuitBreaker {\n  constructor(threshold = 5, cooldown = 10) {\n    this.threshold = threshold; this.cooldown = cooldown;\n    this.state = \"closed\"; this.failures = 0; this.openedAt = null;\n  }\n  call(now, fn) {\n    if (this.state === \"open\") {\n      if (now - this.openedAt < this.cooldown) return \"o\";   // open: fail fast, don't even call\n      this.state = \"half-open\";                 // cool-down over: let one trial call through\n    }\n    const ok = fn(now);\n    if (this.state === \"half-open\") {\n      if (ok) { this.state = \"closed\"; this.failures = 0; return \"H\"; }   // the trial worked: close again\n      this.state = \"open\"; this.openedAt = now;\n      return \"h\";                               // the trial failed: open for another cool-down\n    }\n    if (ok) { this.failures = 0; return \".\"; }\n    this.failures++;\n    if (this.failures >= this.threshold) { this.state = \"open\"; this.openedAt = now; }   // too many failures in a row: open\n    return \"x\";\n  }\n}\n\nconst healthy = t => !(t >= 10 && t < 36);    // the dependency is down from second 10 to second 35\n\nconst breaker = new CircuitBreaker();\nconst timeline = Array.from({ length: 60 }, (_, t) => breaker.call(t, healthy)).join(\"\");   // one call a second for a minute\nconsole.log(\"timeline:\", timeline);\nconst reached = [...timeline].filter((mark, t) => mark !== \"o\" && !healthy(t)).length;\nconsole.log(`calls that reached the dependency while it was down: ${reached} of 26`);\n","out":"timeline: ..........xxxxxooooooooohooooooooohoooooooooH...............\ncalls that reached the dependency while it was down: 7 of 26\n","notes":[[8,"Open: the call fails at once without touching the dependency, so the caller's threads are free and the dependency gets room to recover."],[15,"A failed trial opens the breaker again for another full cool-down."],[19,"Five failures in a row open the breaker; a success resets the count."],[30,"In the timeline, . is a success, x a failure, o a fast failure, h a failed trial and H the trial that closed it. Only 7 of the 26 calls during the outage reached the dependency."]]}]}],"ex":{"q":"Three API servers must enforce one limit per client: 10 requests, shared across all of them, kept in Redis. Show what goes wrong if each server reads the token count and then writes it back, and how to make the check safe.","steps":["Store each client's bucket in Redis as a hash (tokens and the time of the last refill), with a TTL so idle client
