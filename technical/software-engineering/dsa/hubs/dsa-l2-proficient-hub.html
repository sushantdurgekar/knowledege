deep first (pre-, in- or post-order) with recursion or a stack; BFS visits level by level with a queue. I use BFS when the question is about levels or the nearest node (level order, right-side view, minimum depth) and DFS for most other things: path sums, subtree properties, validating a BST. Both are O(n) time; DFS uses O(h) memory and BFS uses O(width)."},{"c":"Trees","q":"How do you validate a binary search tree?","a":"Comparing each node with its children isn't enough: a value deep in the left subtree must still be less than the root. I pass down a (low, high) range: the root gets (−∞, +∞); going left, the node's value becomes the upper bound, and going right, the lower bound. Any node outside its range fails. Another way: an inorder traversal must be strictly increasing. Both are O(n) time and O(h) space.","f":["What changes if duplicates are allowed?"]},{"c":"Heaps & tries","q":"When would you use a heap, and how do you get the k largest items?","a":"A heap gives O(1) access to the smallest (or largest) item and O(log n) push and pop, so it fits “repeatedly take the best next item”: scheduling, merging k sorted lists, Dijkstra, running medians. For the k largest of n items I keep a min-heap of size k, pushing each item and popping when the size passes k: O(n log k) time and O(k) space, better than sorting when k is small. Python has heapq (a min-heap); JavaScript has no built-in heap, so I say that up front and write a small one.","f":["How would you keep a running median?"]},{"c":"Heaps & tries","q":"What is a trie, and when is it better than a hash set?","a":"A trie stores strings character by character in a tree, so words with the same prefix share nodes. Insert and lookup cost O(length of the word). A hash set is just as fast for whole words, but a trie also answers prefix questions, like which words start with “car”, without scanning everything. That's why it's used for autocomplete and Word Search II. The cost is memory: lots of small nodes."},{"c":"Graphs","q":"How do you represent a graph, and why does the choice matter?","a":"Usually as an adjacency list: a map from each node to its neighbours, O(V + E) memory, so looping over a node's neighbours costs only as many steps as it has neighbours. An adjacency matrix takes O(V²) memory but answers “is there an edge?” in O(1), which suits small dense graphs. In interviews the graph is often implicit, like a grid whose neighbours are the four adjacent cells, and then I don't build anything at all."},{"c":"Graphs","q":"Explain topological sort and how it detects a cycle.","a":"A topological order lists the nodes of a directed graph so that every edge points forward; one exists only if there's no cycle. With Kahn's algorithm I count in-degrees and queue every node with in-degree 0. Each time I pop a node, I decrement its neighbours' in-degrees and queue any that reach 0. If fewer than V nodes come out, the graph has a cycle: every leftover node is on a cycle or depends on one. It's O(V + E); Course Schedule is the classic problem.","f":["How would you do it with DFS instead?"]},{"c":"Graphs","q":"Union-find or BFS/DFS for connectivity: how do you choose?","a":"If the graph is fixed and I need the components once, BFS or DFS is simple: O(V + E). If edges arrive over time and I'm asked about connectivity in between, union-find is better: each union and find is nearly O(1) amortised with path compression and union by size. Union-find also detects a cycle in an undirected graph (a union that fails) and powers Kruskal's minimum spanning tree. It can't easily handle deleting edges."},{"c":"Backtracking & DP","q":"How do you recognise a backtracking problem, and how do you keep it fast enough?","a":"The question asks for all (or any) combinations, subsets, permutations or placements, and the input is small: n up to about 20 for subsets, about 10 for permutations. The template is choose, explore, un-choose. To keep it fast I prune early (stop when a partial answer can't work, like a sum that's already too big or a clash on the board), sort to skip duplicates, and count the output size so I can state the complexity, like O(n · 2ⁿ) for subsets."},{"c":"Backtracking & DP","q":"How do you get from a brute-force recursion to dynamic programming?","a":"I write the recursion first and name its state: the arguments that change between calls. If the same states repeat, I add a cache keyed by the state; that's top-down DP. If I want, I then turn it into a table filled in an order where each state's dependencies come first (bottom-up), and shrink the memory to the rows the recurrence actually reads. The time is the number of states times the work per state."},{"c":"Backtracking & DP","q":"Walk me through coin change (the fewest coins).","a":"dp[a] is the fewest coins that make amount a; dp[0] = 0 and every other entry starts at infinity. For each amount from 1 up, I try each coin c ≤ a: dp[a] = min(dp[a], dp[a − c] + 1). The answer is dp[amount], or −1 if it's still infinity. That's O(amount × coins) time and O(amount) space. Greedy (the largest coin first) fails for coins like {1, 3, 4} and amount 6, where 3 + 3 beats 4 + 1 + 1.","f":["How do you count the number of ways instead?"]},{"c":"Backtracking & DP","q":"What's the longest common subsequence recurrence?","a":"dp[i][j] is the LCS length of the first i characters of s and the first j of t. If s[i − 1] equals t[j − 1], dp[i][j] = dp[i − 1][j − 1] + 1; otherwise it's the larger of dp[i − 1][j] and dp[i][j − 1]. Empty prefixes give 0. That's O(m × n) time, and the memory drops to two rows if I only need the length, not the subsequence itself."},{"c":"Greedy & bits","q":"How do you know a greedy algorithm is correct?","a":"First I try to break it with tiny inputs; a counterexample sends me to DP. If I can't break it, I make an exchange argument: take any optimal solution, swap one of its choices for the greedy choice, and show the result is still valid and no worse. For interval scheduling, the interval that ends earliest can always replace the first interval of an optimal schedule."},{"c":"Greedy & bits","q":"Which bit tricks should you know, and what's different in JavaScript?","a":"x & (x − 1) clears the lowest set bit (with x > 0, a result of 0 means a power of two), x & −x keeps only that bit, XOR cancels pairs (the single-number problem), and the masks 0 to 2ⁿ − 1 list every subset. In JavaScript, bitwise operators work on 32-bit signed integers, so 1 << 31 is negative, and === binds tighter than &, so I always add parentheses. Python ints are unbounded, so I mask with 0xFFFFFFFF when a problem assumes 32 bits."},{"c":"Interview technique","q":"You can tell a problem needs DP but you can't see the recurrence. What do you do?","a":"I say so, then write the brute-force recursion: what choice do I make at each step, and what's left afterwards? The arguments of that recursion are the state. I draw the call tree for a small input to show the repeated calls, add memoisation, and only then think about a table. Interviewers give credit for a correct memoised solution, and the table version often follows quickly."},{"c":"Behavioural (STAR)","q":"Tell me about a time a choice of data structure made a real difference.","a":"Use STAR. Situation: the feature and the problem (slow lookups, a growing backlog, an ordering bug). Task: the target, such as under 100 ms. Action: how you measured it, which structure you chose (a heap, a trie, union-find, a graph traversal) and why, and the tests you wrote. Result: the before and after numbers. If you're new, use a lab from this hub, like the autocomplete trie or the graph toolkit."}],"cheat":[{"t":"Templates to know cold","items":["Tree recursion: empty → base case; `left = f(node.left)`; `right = f(node.right)`; combine","BFS: queue + seen (mark when queued); `for _ in range(len(q))` for levels","Iterative DFS: stack + seen; Python recursion stops near 1,000 levels","Kahn: in-degrees → queue the zeros → pop, decrement, queue new zeros; fewer than V out = a cycle","DSU: find with path compression; union by size; a failed union = already connected","Backtracking: choose → explore → un-choose; prune early","DP: state → recurrence → base cases → fill order → shrink the memory"]},{"t":"Python ↔ JavaScript","items":["heapq (a min-heap on a list) ↔ write a small MinHeap (none built in)","deque.popleft() ↔ a head index into an array","defaultdict(list) ↔ Map with `graph.get(u) ?? []`","@functools.cache ↔ a Map keyed by a string such as `${i},${j}`","Unbounded ints ↔ 32-bit bitwise operators (BigInt for wider values)","Recursion limit of 1,000 ↔ a stack overflow somewhere around 10,000 simple frames in Node.js"]},{"t":"Pattern triggers","items":["Hierarchy, subtree, path from the root → **tree recursion**","Fewest steps, nearest, levels → **BFS**","Dependencies, “before” rules → **topological sort**","Connectivity as edges arrive → **union-find**","All combinations or placements, small n → **backtracking**","Count the ways, min/max cost, overlapping choices → **DP**","k largest or smallest, the next best item → **heap**","Prefixes, autocomplete, word grids → **trie**","Intervals, schedules → **sort + greedy**"]},{"t":"Costs","items":["Tree traversal: O(n) time, O(h) space","Heap push/pop O(log n) · peek O(1) · heapify O(n)","Trie insert/search: O(word length)","BFS, DFS, Kahn: O(V + E)","DSU operations: nearly O(1) amortised","Subsets O(n · 2ⁿ) · permutations O(n · n!)","DP: number of states × work per state"]},{"t":"Edge cases to test every time","items":["An empty tree or graph","One node, or a node with a self-loop","A chain (skewed tree or path graph) 10,000 deep","A disconnected graph; a cycle","Duplicates (subsets, permutations, heap ties)","A target of 0; an impossible target"]}],"glossary":[["Adjacency list","A graph stored as a map from each node to its neighbours; O(V + E) memory."],["Backtracking","Building a solution step by step and undoing the last step when it can't lead to an answer."],["Balanced tree","A tree whose height stays O(log n), such as an AVL or red-black tree."],["BFS (breadth-first search)","Visits nodes in order of their distance from the start, using a queue."],["Binary search tree (BST)","A binary tree where each node's left subtree holds smaller values and its right subtree larger ones."],["Bitmask","An integer whose bits mark which items of a small set are chosen."],["Complete binary tree","Every level is full except perhaps the last, which fills from the left; the shape a heap keeps in an array."],["Cycle","A path that comes back to the node it started from."],["DAG","A directed acyclic graph: directed edges and no cycles, so it has a topological order."],["DFS (depth-first search)","Goes as deep as possible before backing up, using recursion or a stack."],["Disjoint-set union (DSU)","Union-find: tracks which elements are in the same group, with nearly constant-time find and union."],["Dynamic programming","Solving a problem by combining the answers to overlapping subproblems, each computed once."],["Exchange argument","A proof that a greedy choice is safe: swapping it into any optimal solution doesn't make that solution worse."],["Greedy algorithm","Makes the locally best choice at each step and never undoes it."],["Heap","A complete binary tree where every parent is ≤ its children (a min-heap), so the minimum sits at the root."],["In-degree","The number of edges pointing into a node."],["Memoisation","Caching a function's result by its arguments so repeated calls are free."],["Minimum spanning tree","A spanning tree (n − 1 edges, no cycles) with the smallest total weight in a connected, undirected, weighted graph."],["Optimal substructure","The best answer is built from the best answers to smaller subproblems."],["Overlapping subproblems","The same smaller problems come up again and again in a recursion."],["Path compression","During find, pointing every node on the path straight at the root."],["Pruning","Abandoning a search branch as soon as it can't lead to a valid answer."],["Topological order","An ordering of a DAG's nodes in which every edge points forward."],["Trie","A tree of characters in which each path from the root spells a prefix."],["Two's complement","How signed integers are stored: −x is ~x + 1, and the top bit marks negative numbers."],["Union by size","Attaching the smaller tree under the root of the larger one, which keeps trees shallow."]],"sourceGroups":[{"t":"Practice","items":[["NeetCode 150 (interview problems grouped by pattern)","https://neetcode.io/practice/practice/neetcode150","A4 R4 D4 · free, with paid extras"],["LeetCode problem set","https://leetcode.com/problemset/","A4 R5 D4 · the free tier is enough for L2"]]},{"t":"Reference","items":[["Python docs: heapq (heap queue algorithm)","https://docs.python.org/3/library/heapq.html","A5 R5 D4 · free"],["Python docs: functools.cache","https://docs.python.org/3/library/functools.html#functools.cache","A5 R5 D3 · free"],["Python docs: graphlib (topological sorting)","https://docs.python.org/3/library/graphlib.html","A5 R5 D3 · free"],["MDN: Bitwise operators","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Expressions_and_operators#bitwise_operators","A5 R5 D4 · free"],["cp-algorithms: Disjoint Set Union","https://cp-algorithms.com/data_structures/disjoint_set_union.html","A4 R4 D5 · free"],["cp-algorithms: Topological sorting","https://cp-algorithms.com/graph/topological-sort.html","A4 R4 D4 · free"]]},{"t":"Courses and books","items":[["Jeff Erickson, Algorithms (free textbook)","https://jeffe.cs.illinois.edu/teaching/algorithms/","A5 R3 D5 · free"],["Pat Morin, Open Data Structures (free textbook)","https://opendatastructures.org/","A4 R2 D5 · free"],["MIT 6.006 Introduction to Algorithms (Spring 2020, OCW)","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/","A5 R3 D5 · free"],["USACO Guide (the silver and gold sections for L2)","https://usaco.guide/","A5 R4 /* ---------- state ---------- */

}

function prepItem(it) {

   <div id="misTable"></div></div>
  <div class="panel" style="margin-top:14px"><h3>Accuracy by domain (all quizzes and drills)</h3><div class="dbars">${DOM.map(d => { const a = domainAccuracy(d.id); const n = S.dstat[d.id] ? S.dstat[d.id][1] : 0; return `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${a == null ? 0 : Math.round(a * 100)}%;background:${a == null ? "var(--line)" : a >= 0.7 ? "var(--good)" : "var(--bad)"}"></i></div><b>${a == null ? "–" : Math.round(a * 100) + "%"}</b></div><div class="muted small" style="margin:-4px 0 2px">${n} answered</div>`; }).join("")}</div></div>`;

    $("#misTable").innerHTML = ids.length ? `<div class="tbl"><table><thead><tr><th>Where</th><th>Question</th><th class="num">Missed</th><th>Last</th><th>Status</th></tr></thead><tbody>${ids.map(k => { const it = ITEMS[k], x = S.mis[k]; return `<tr><td>${esc(it.src || "")}</td><td>${inl(it.q.length > 160 ? it.q.slice(0, 157) + "…" : it.q)}</td><td class="num">${x.n}</td><td>${esc(fmtDate(x.at))}</td><td>${x.fx ? `<span class="pill ok">fixed ${esc(fmtDate(x.fx))}</span>` : `<span class="pill no">open</span>`}</td></tr>`; }).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">No mistakes recorded yet. They appear when you miss a question anywhere in the hub.</p>`;

let CASERUN = null;
RENDER.cases = function () {
  CASERUN = null;
  const v = $("#v-cases");
  v.innerHTML = `<div class="eyebrow">Long scenarios · several questions each</div><h2 class="h-view">Case studies</h2>
  <p class="lede">${inl(H.casesIntro || "Read the scenario tabs first, then answer. Requirements and constraints decide every answer, so keep the scenario open next to the questions. In the real exam each case study is its own section: once you leave it, you can't go back.")}</p>
  <div class="grid2">${(H.cases || []).filter(c => !c.mockOnly).map(c => { const s = S.cases[c.id]; return `<div class="panel"><div class="row between"><h3>${esc(c.title)}</h3>${s && s.pct != null ? `<span class="pill ${s.pct >= 70 ? "ok" : "no"}">${s.pct}%</span>` : ""}</div><p class="small muted" style="margin:.2em 0 .6em">${esc(c.org || "")} · ${c.items.length} questions · about ${c.min} min</p><p class="small">${inl(c.blurb || "")}</p><button type="button" class="btn primary" data-case="${c.id}">${s ? "Retake" : "Start"} case study</button></div>`; }).join("")}</div>`;
  $$("[data-case]", v).forEach(b => b.addEventListener("click", () => openCase(b.dataset.case)));
};
function caseDoc(c, tab) {
  return `<div class="case-tabs" role="tablist">${c.sections.map((s, i) => `<button type="button" data-ct="${i}" aria-pressed="${i === tab}">${esc(s[0])}</button>`).join("")}</div><div class="scenario">${(() => { const s = c.sections[tab]; return Array.isArray(s[1]) ? `<ul>${s[1].map(x => `<li>${inl(x)}</li>`).join("")}</ul>` : paras(s[1]); })()}</div>`;
}
function openCase(id) {
  const c = CASE[id]; if (!c) return;
  if (CURVIEW !== "cases") show("cases");
  const vs = c.items.map(prepItem);
  CASERUN = { c, vs, R: vs.map(() => null), tab: 0, done: false };
  const v = $("#v-cases");
  const paint = () => {
    const X = CASERUN;
    v.innerHTML = `<div class="row between" style="margin-bottom:10px"><div><div class="eyebrow">Case study · ${esc(c.org || "")}</div><h2 class="h-view" style="margin:0">${esc(c.title)}</h2></div><button type="button" class="btn small" id="caseBack">← All case studies</button></div>
    <div class="case-shell"><aside class="panel case-doc" aria-label="Scenario">${caseDoc(c, X.tab)}</aside><div style="min-width:0">
    ${X.vs.map((vv, i) => `<div class="q" data-k="${i}">${X.done ? reviewHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }) : itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) })}</div>`).join("")}
    ${X.done ? `<div class="panel"><b>Score: ${S.cases[c.id].pct}%</b> <span class="muted small">Missed items are in your mistake list.</span><div class="row" style="margin-top:8px"><button type="button" class="btn" id="caseAgain">Retake</button></div></div>` : `<button type="button" class="btn primary" id="caseSubmit">Submit case study</button>`}</div></div>`;
    const bindTabs = () => $$("[data-ct]", v).forEach(b => b.addEventListener("click", () => { X.tab = +b.dataset.ct; $(".case-doc", v).innerHTML = caseDoc(c, X.tab); bindTabs(); }));
    bindTabs();
    $("#caseBack").addEventListener("click", () => RENDER.cases());
    if (!X.done) {
      X.vs.forEach((vv, i) => { const el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); });
      $("#caseSubmit").addEventListener("click", e => {
        const un = X.vs.filter((vv, i) => !isAnswered(vv, X.R[i])).length;
        if (un && !e.currentTarget.dataset.sure) { e.currentTarget.dataset.sure = "1"; e.currentTarget.textContent = `Submit with ${un} unanswered?`; return; }
        let got = 0; X.vs.forEach((vv, i) => { const sc = gradeItem(vv.it, X.R[i]); got += sc; recordAnswer(vv.it, sc, givenText(vv.it, X.R[i])); });
        S.cases[c.id] = { at: today(), pct: pct(got, X.vs.length) }; touch("main"); X.done = true; paint(); window.scrollTo(0, 0);
      });
    } else { $("#caseAgain").addEventListener("click", () => openCase(id)); bindExplain(v); }
  };
  const rebind = i => { const X = CASERUN, vv = X.vs[i], el = $(`.q[data-k="${i}"]`, v); bindItem(el, vv, () => X.R[i], (nr, noPaint) => { X.R[i] = nr; if (!noPaint) { el.innerHTML = itemHTML(vv, X.R[i], i + 1, { meta: dchip(vv.it.d) }); rebind(i); } }); };
  paint(); window.scrollTo(0, 0);
}

  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
