 peak, and a new EU bank partner requires EU customers' personal data to stay in the EU. Last quarter a regional outage took payments down for 52 minutes."],["Current design",["The ledger database replicates asynchronously, typically 2 seconds behind, with lag spikes during nightly batch jobs.","Failover is a manual runbook: an engineer promotes the replica and updates DNS, whose TTL is one hour.","Merchant APIs use JWT access tokens valid for 24 hours.","Logs and analytics for all customers are shipped to one US warehouse."]],["Problems",["During the outage, the team argued for 30 minutes about whether the primary was really down, and then the old primary came back and accepted writes for 4 minutes after the failover.","Some payments acknowledged just before the outage were missing after it.","A merchant's leaked token was used for 20 hours.","The EU partner's audit found EU customers' data in US logs."]]],"items":[{"d":"d3","q":"What would have prevented the old primary from accepting writes after the failover?","o":["Fencing: the old primary steps down when it loses its quorum, its write credentials are revoked, and a higher epoch makes it rejoin as a replica","A shorter DNS TTL","A bigger replica","Running the runbook faster"],"a":0,"e":"Without fencing, a primary that returns, or was only cut off, keeps writing: split brain. A witness in a third location decides, and fencing makes sure only one primary can write."},{"d":"d3","q":"Payments acknowledged just before the outage went missing. What explains it, and what's the fix for the ledger?","o":["Asynchronous replication loses the lag; the ledger needs synchronous or quorum replication across zones or nearby regions, so the RPO is zero","The DNS TTL was too long","The replica's disk was too small","The tokens expired"],"a":0,"e":"The RPO of asynchronous replication is the lag at the moment of failure, and batch jobs made it worse. Money needs zero RPO; less critical data can stay asynchronous."},{"d":"d3","t":"ms","q":"Which TWO changes limit the damage from a leaked merchant token?","o":["Short-lived access tokens, minutes rather than hours, renewed with refresh tokens that can be revoked","Bind tokens to the merchant's client (mTLS or DPoP) and alert on unusual use","Encrypt the JWT payload","Make the signing key longer"],"a":[0,1],"e":"A self-contained token works until it expires, so its lifetime caps the damage; binding it to the client makes a stolen copy useless elsewhere. Encryption and longer keys don't stop the holder of a valid token."},{"d":"d3","q":"How should PayLane meet the EU partner's residency requirement?","o":["Give EU customers an EU home region holding their data, backups, logs and analytics, and fail over only to another EU region","Encrypt the US warehouse","Copy EU data to the US nightly for analytics","Ask EU customers for consent to store data in the US"],"a":0,"e":"Residency covers every copy of the data: databases, backups, logs, analytics and support tools. A home region per customer, with region-aware routing and failover, keeps every copy in place."}]}],"diag":[{"d":"d1","q":"An order service writes the order to its database and then publishes an OrderPlaced event to Kafka. The process crashes between the two. What prevents a lost or phantom event?","o":["Write the event to an outbox table in the same transaction as the order, and let a relay publish it","Publish the event first, then write the order","Retry the publish three times","Use a bigger Kafka cluster"],"a":0,"e":"The outbox makes the order and its event commit together; a relay publishes the outbox rows, at least once, so consumers dedupe. Publishing first creates events for orders that may never exist."},{"d":"d1","q":"A saga books a hotel, then a car, then fails to ticket the flight. What should it do?","o":["Run compensations in reverse: release the car, then the hotel","Roll back a distributed transaction","Retry the flight forever","Leave the bookings and email the customer"],"a":0,"e":"A saga is a sequence of local transactions, each with a compensating action; when a step fails, the completed steps are undone in reverse order. There's no global rollback to rely on."},{"d":"d1","q":"Why would a team choose event sourcing for an account ledger?","o":["Every change is kept as an immutable event, so balances can be rebuilt, audited and replayed into new views","It makes reads faster with no extra work","It avoids the need for schemas","It removes the need for backups"],"a":0,"e":"Event sourcing stores the facts rather than the latest state. The price is that reads need projections (CQRS), and events need careful schema evolution."},{"d":"d1","q":"A per-minute ride count is computed from phone events that can arrive two minutes late. Which time should the windows use?","o":["Event time, with a watermark and some allowed lateness","Processing time, because it's simpler","The broker's ingestion time","Wall-clock time on the stream processor"],"a":0,"e":"Event time puts each ride in the minute it happened; the watermark decides when a window's result is final, and allowed lateness sets how long to wait for stragglers."},{"d":"d2","q":"How many node failures can a five-node Raft cluster survive while still committing writes?","o":["Two","One","Three","Four"],"a":0,"e":"A commit needs a majority, three of five, so two nodes can fail. A sixth node wouldn't raise that: a majority of six is four."},{"d":"d2","q":"A worker holds a lock with a lease, pauses for 30 seconds in garbage collection, then writes to storage. What stops the stale write?","o":["A fencing token: storage rejects writes carrying a lower token than one it has seen","A longer lease","Checking the lock just before writing","NTP-synchronized clocks"],"a":0,"e":"A pause can outlast any lease and can happen between a check and a write. Only the resource itself, comparing increasing tokens, can reject the stale holder."},{"d":"d2","q":"Which storage engine design usually ingests heavy write loads best?","o":["An LSM tree: sequential log writes and sorted flushes, merged later by compaction","A B-tree updating pages in place","A hash index on a single file","A heap file with no index"],"a":0,"e":"LSM trees turn random writes into sequential ones; they pay with compaction and with reads that may check several files, which Bloom filters keep cheap."},{"d":"d2","q":"Two events have vector clocks 2,1,0 and 1,2,0. What can you conclude?","o":["They're concurrent: neither happened before the other","The first happened before the second","The second happened before the first","They're the same event"],"a":0,"e":"One event precedes another only if its vector is less than or equal in every slot. Here each is bigger in one slot, so they're concurrent, a conflict to resolve."},{"d":"d3","q":"Why does a search engine stem 'pizzas' to 'pizza' at both indexing and query time?","o":["So different forms of a word land on the same posting list","To make the index encrypted","To rank long documents higher","To make the index smaller than the documents"],"a":0,"e":"Matching happens on terms, so documents and queries must go through the same analyzer; otherwise a query for 'pizzas' never meets documents indexed under 'pizza'."},{"d":"d3","q":"A geohash index searches the query's cell and its 8 neighbours. Why the neighbours?","o":["A nearby point can sit just across a cell edge, with a different geohash","Neighbours hold backup copies","Geohashes are random","It sorts the results"],"a":0,"e":"A shared prefix means a shared cell, but points either side of an edge can differ early, so a radius search must cover the block of nine."},{"d":"d3","q":"A database replicates asynchronously to another region with 3 seconds of lag, and the primary region fails. What's the RPO of that failover?","o":["About 3 seconds of committed writes","Zero","The time it takes to promote the replica","The DNS TTL"],"a":0,"e":"Asynchronous replication loses whatever the replica hadn't applied: the lag at the moment of failure. The time to promote and redirect is the RTO."},{"d":"d3","q":"An API validates the user's token and returns /documents/{id} for any id requested. What's missing?","o":["An object-level authorization check: may this user see this document?","HTTPS","A longer token lifetime","A CDN"],"a":0,"e":"Authentication says who is asking; each object still needs a permission check. Broken object-level authorization is the top risk in OWASP's API Security Top 10."},{"d":"d4","q":"A video player measures 3,000 kbit/s of throughput. Renditions are 1,000, 2,500 and 5,000 kbit/s. Which is the safe choice for the next segment?","o":["2,500 kbit/s, leaving a margin below the measured throughput","5,000 kbit/s, the best available","1,000 kbit/s, always the lowest","Whichever loaded fastest last time"],"a":0,"e":"Players pick a rendition below the measured throughput, with a safety margin, and watch the buffer: choosing above the throughput drains the buffer and freezes the picture."},{"d":"d4","q":"A payment request times out. What should the client do?","o":["Retry with the same idempotency key, and check the payment's status if it's still unknown","Retry without a key","Tell the customer the payment failed","Assume it succeeded"],"a":0,"e":"A timeout leaves the outcome unknown. The same key makes the retry safe, because the provider replays the first result instead of charging again."},{"d":"d4","q":"Two people type into the same sentence at the same moment in a collaborative editor. What keeps their copies identical?","o":["Operational transformation or a CRDT, which merges concurrent edits so every copy converges","Locking the document while one of them types","Last writer wins on the whole document","Saving every second"],"a":0,"e":"OT shifts each edit's position to account for edits it didn't know about; CRDTs give each character a unique ordered id. Locks and last-writer-wins lose or block edits."},{"d":"d4","q":"A web crawler fetches pages breadth-first from one queue, and most links point within the same site. What goes wrong?","o":["It hammers one site with many requests a second; per-host queues with delays fix it","It can't find new sites at all","It fetches every page twice","It runs out of DNS names"],"a":0,"e":"A single queue fills with one site's pages, so the crawler floods that site and gets blocked. A polite frontier keeps a queue per host and a delay between requests."}],"labs":[{"id":"lab-saga","t":"An order saga across three services, with outboxes, inboxes and crashes","min":90,"mods":["m01","m02"],"goal":"Build an orchestrated order saga across three services (orders, inventory and payments), each with its own SQLite database. Every state change and the message it causes commit together through an outbox; a relay publishes outbox rows to a broker; every consumer dedupes through an inbox. Then crash the relay after publishing and the consumers after committing, and prove that no order is left half-done, no stock is lost and no card is charged twice.","pre":["Python 3.12+ (sqlite3) and Node.js 22.13+ (node:sqlite)","Read modules 1 and 2"],"steps":["Give each service its own in-memory database with an outbox (seq, topic, body, sent) and an inbox (msg_id primary key), plus its own tables: orders, stock and reservations, payments.","Place 30 orders: each order row and its ReserveStock command go into the orders database in one transaction.","Write the handlers: inventory reserves or reports out of stock, and releases on request; payments charges or declines (amounts divisible by 7 are declined); orders, the orchestrator, moves each order on to the next step or to cancelled.","Write the relay (publish unsent outbox rows, then mark them sent) and the delivery loop (insert the message id into the inbox, run the handler and write its replies, all in one transaction). Crash the relay after publishing one time in ten, and a consumer after committing one time in ten, using the seeded generator.","Check the invariants: every order confirmed or cancelled; stock sold equals stock reserved for confirmed orders; exactly one charge per confirmed order; duplicates delivered and skipped."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import json, sqlite3\n\ndef mulberry32(seed): ...                       # copy the seeded generator from module 1\n\ndef service_db(schema):\n    ...                                         # TODO: a fresh :memory: database with schema, an outbox and an inbox\n\ndef emit(db, topic, body):\n    ...                                         # TODO: insert into the outbox, inside the caller's transaction\n\nHANDLERS = {}                                   # TODO: topic -> (service, handler(db, message))\n\ndef relay(): ...                                # TODO: publish unsent rows, crash one time in ten, then mark sent\ndef deliver(): ...                              # TODO: inbox dedupe, handler and replies in one transaction\n"},{"lang":"javascript","src":"const { DatabaseSync } = require(\"node:sqlite\");\n\nfunction mulberry32(seed) { /* copy the seeded generator from module 1 */ }\nfunction serviceDb(schema) { /* TODO: a fresh :memory: database with schema, an outbox and an inbox */ }\nfunction emit(db, topic, body) { /* TODO: insert into the outbox, inside the caller's transaction */ }\nconst HANDLERS = {};                            // TODO: topic -> [service, handler(db, message)]\nfunction relay() { /* TODO: publish unsent rows, crash one time in ten, then mark sent */ }\nfunction deliver() { /* TODO: inbox dedupe, handler and replies in one transaction */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"An orchestrated order saga across three services, each with its own SQLite database, an outbox and an inbox.\"\"\"\nimport json\nimport sqlite3\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef service_db(schema):\n    db = sqlite3.connect(\":memory:\")                # every service owns its own database\n    db.executescript(schema + \"\"\"\n        CREATE TABLE outbox (seq INTEGER PRIMARY KEY AUTOINCREMENT, topic TEXT, body TEXT, sent INTEGER DEFAULT 0);\n        CREATE TABLE inbox (msg_id TEXT PRIMARY KEY);\"\"\")\n    return db\n\ndbs = {\n    \"orders\": service_db(\"CREATE TABLE orders (id TEXT PRIMARY KEY, qty INTEGER, amount INTEGER, status TEXT, reason TEXT);\"),\n    \"inventory\": service_db(\"CREATE TABLE stock (sku TEXT PRIMARY KEY, available INTEGER);\"\n                            \"CREATE TABLE reservations (order_id TEXT PRIMARY KEY, qty INTEGER);\"),\n    \"payments\": service_db(\"CREATE TABLE payments (order_id TEXT PRIMARY KEY, amount INTEGER, status TEXT);\"),\n}\ndbs[\"inventory\"].execute(\"INSERT INTO stock VALUES ('pizza-box', 40)\")\ndbs[\"inventory\"].commit()\n\ndef emit(db, topic, body):                          # called inside the handler's transaction: the outbox pattern\n    db.execute(\"INSERT INTO outbox (topic, body) VALUES (?, ?)\", (topic, json.dumps(body)))\n\ndef on_reserve(db, m):\n    available = db.execute(\"SELECT available FROM stock WHERE sku = 'pizza-box'\").fetchone()[0]\n    if available >= m[\"qty\"]:\n        db.execute(\"UPDATE stock SET available = available - ? WHERE sku = 'pizza-box'\", (m[\"qty\"],))\n        db.execute(\"INSERT INTO reservations VALUES (?, ?)\", (m[\"order\"], m[\"qty\"]))\n        emit(db, \"StockReserved\", m)\n    else:\n        emit(db, \"OutOfStock\", m)\n\ndef on_release(db, m):\n    row = db.execute(\"SELECT qty FROM reservations WHERE order_id = ?\", (m[\"order\"],)).fetchone()\n    if row:                                         # compensation: give the stock back\n        db.execute(\"UPDATE stock SET available = available + ? WHERE sku = 'pizza-box'\", (row[0],))\n        db.execute(\"DELETE FROM reservations WHERE order_id = ?\", (m[\"order\"],))\n    emit(db, \"StockReleased\", m)\n\ndef on_charge(db, m):\n    declined = m[\"amount\"] % 7 == 0                 # the provider declines some cards\n    db.execute(\"INSERT INTO payments VALUES (?, ?, ?)\", (m[\"order\"], m[\"amount\"], \"declined\" if declined else \"charged\"))\n    emit(db, \"PaymentDeclined\" if declined else \"PaymentCharged\", m)\n\ndef set_status(db, m, status, reason=None):\n    db.execute(\"UPDATE orders SET status = ?, reason = ? WHERE id = ?\", (status, reason, m[\"order\"]))\n\ndef on_reserved(db, m):                             # the orchestrator: decides the next step from each reply\n    set_status(db, m, \"reserved\")\n    emit(db, \"ChargePayment\", m)\n\ndef on_declined(db, m):\n    set_status(db, m, \"releasing\")\n    emit(db, \"ReleaseStock\", m)\n\nHANDLERS = {\n    \"ReserveStock\": (\"inventory\", on_reserve), \"ReleaseStock\": (\"inventory\", on_release),\n    \"ChargePayment\": (\"payments\", on_charge),\n    \"StockReserved\": (\"orders\", on_reserved), \"PaymentDeclined\": (\"orders\", on_declined),\n    \"OutOfStock\": (\"orders\", lambda db, m: set_status(db, m, \"cancelled\", \"out of stock\")),\n    \"PaymentCharged\": (\"orders\", lambda db, m: set_status(db, m, \"confirmed\")),\n    \"StockReleased\": (\"orders\", lambda db, m: set_status(db, m, \"cancelled\", \"card declined\")),\n}\n\nrand = mulberry32(7)\nbroker, stats = [], {\"delivered\": 0, \"duplicates\": 0, \"relay crashes\": 0, \"consumer crashes\": 0}\n\ndef relay():                                        # copy unsent outbox rows to the broker, then mark them sent\n    for name, db in dbs.items():\n        for seq, topic, body in db.execute(\"SELECT seq, topic, body FROM outbox WHERE sent = 0 ORDER BY seq\").fetchall():\n            broker.append((f\"{name}-{seq}\", topic, body))\n            if rand() < 0.1:\n                stats[\"relay crashes\"] += 1         # published, but crashed before marking it: it goes out again\n                return\n            with db:\n                db.execute(\"UPDATE outbox SET sent = 1 WHERE seq = ?\", (seq,))\n\ndef deliver():\n    msg_id, topic, body = broker.pop(0)\n    name, handler = HANDLERS[topic]\n    db = dbs[name]\n    stats[\"delivered\"] += 1\n    with db:                                        # dedupe, state change and reply in one local transaction\n        if db.execute(\"INSERT OR IGNORE INTO inbox VALUES (?)\", (msg_id,)).rowcount == 0:\n            stats[\"duplicates\"] += 1                # seen before: skip it\n            return\n        handler(db, json.loads(body))\n    if rand() < 0.1:\n        stats[\"consumer crashes\"] += 1              # committed, but crashed before acknowledging: redelivered later\n        broker.append((msg_id, topic, body))\n\nfor i in range(1, 31):                              # place 30 orders: the order row and its first command, atomically\n    with dbs[\"orders\"]:\n        order = {\"order\": f\"order-{i}\", \"qty\": 1 + i % 3, \"amount\": 1000 + 13 * i}\n        dbs[\"orders\"].execute(\"INSERT INTO orders VALUES (?, ?, ?, 'placed', NULL)\", (order[\"order\"], order[\"qty\"], order[\"amount\"]))\n        emit(dbs[\"orders\"], \"ReserveStock\", order)\nwhile True:\n    relay()\n    if not broker:\n        break\n    while broker:\n        deliver()\n\norders = dbs[\"orders\"].execute(\"SELECT status, reason, qty FROM orders\").fetchall()\nconfirmed = [qty for status, _, qty in orders if status == \"confirmed\"]\nreasons = [reason for status, reason, _ in orders if status == \"cancelled\"]\navailable = dbs[\"inventory\"].execute(\"SELECT available FROM stock\").fetchone()[0]\nreserved = dbs[\"inventory\"].execute(\"SELECT COALESCE(SUM(qty), 0) FROM reservations\").fetchone()[0]\ncharged = dbs[\"payments\"].execute(\"SELECT COUNT(*) FROM payments WHERE status = 'charged'\").fetchone()[0]\nprint(f\"orders: {len(orders)} | confirmed: {len(confirmed)} | cancelled: {len(reasons)} \"\n      f\"(out of stock {reasons.count('out of stock')}, card declined {reasons.count('card declined')})\")\nprint(f\"messages delivered: {stats['delivered']} | duplicates skipped: {stats['duplicates']} | \"\n      f\"relay crashes: {stats['relay crashes']} | consumer crashes: {stats['consumer crashes']}\")\nprint(f\"stock: {available} of 40 left, {reserved} sold to confirmed orders: \"\n      f\"{'yes' if reserved == sum(confirmed) == 40 - available else 'no'} | charges: {charged}, one per confirmed order: \"\n      f\"{'yes' if charged == len(confirmed) else 'no'}\")\nassert all(status in (\"confirmed\", \"cancelled\") for status, _, _ in orders)   # every saga finished\nassert reserved == sum(confirmed) == 40 - available and charged == len(confirmed)\nassert stats[\"duplicates\"] > 0                      # duplicates really happened, and were absorbed\nprint(\"saga lab OK\")\n","out":"orders: 30 | confirmed: 19 | cancelled: 11 (out of stock 9, card declined 2)\nmessages delivered: 123 | duplicates skipped: 17 | relay crashes: 8 | consumer crashes: 9\nstock: 3 of 40 left, 37 sold to confirmed orders: yes | charges: 19, one per confirmed order: yes\nsaga lab OK\n"},{"lang":"javascript","src":"// An orchestrated order saga across three services, each with its own SQLite database, an outbox and an inbox.\nconst { DatabaseSync } = require(\"node:sqlite\");     // built in from Node.js 22.13 (with an experimental warning)\n\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction serviceDb(schema) {\n  const db = new DatabaseSync(\":memory:\");          // every service owns its own database\n  db.exec(schema + `\n    CREATE TABLE outbox (seq INTEGER PRIMARY KEY AUTOINCREMENT, topic TEXT, body TEXT, sent INTEGER DEFAULT 0);\n    CREATE TABLE inbox (msg_id TEXT PRIMARY KEY);`);\n  return db;\n}\n\nfunction transaction(db, work) {                    // BEGIN ... COMMIT, or ROLLBACK if anything throws\n  db.exec(\"BEGIN\");\n  try { const result = work(); db.exec(\"COMMIT\"); return result; } catch (e) { db.exec(\"ROLLBACK\"); throw e; }\n}\n\nconst dbs = {\n  orders: serviceDb(\"CREATE TABLE orders (id TEXT PRIMARY KEY, qty INTEGER, amount INTEGER, status TEXT, reason TEXT);\"),\n  inventory: serviceDb(\"CREATE TABLE stock (sku TEXT PRIMARY KEY, available INTEGER);\" +\n                       \"CREATE TABLE reservations (order_id TEXT PRIMARY KEY, qty INTEGER);\"),\n  payments: serviceDb(\"CREATE TABLE payments (order_id TEXT PRIMARY KEY, amount INTEGER, status TEXT);\"),\n};\ndbs.inventory.exec(\"INSERT INTO stock VALUES ('pizza-box', 40)\");\n\nfunction emit(db, topic, body) {                    // called inside the handler's transaction: the outbox pattern\n  db.prepare(\"INSERT INTO outbox (topic, body) VALUES (?, ?)\").run(topic, JSON.stringify(body));\n}\n\nfunction onReserve(db, m) {\n  const { available } = db.prepare(\"SELECT available FROM stock WHERE sku = 'pizza-box'\").get();\n  if (available >= m.qty) {\n    db.prepare(\"UPDATE stock SET available = available - ? WHERE sku = 'pizza-box'\").run(m.qty);\n    db.prepare(\"INSERT INTO reservations VALUES (?, ?)\").run(m.order, m.qty);\n    emit(db, \"StockReserved\", m);\n  } else emit(db, \"OutOfStock\", m);\n}\n\nfunction onRelease(db, m) {\n  const row = db.prepare(\"SELECT qty FROM reservations WHERE order_id = ?\").get(m.order);\n  if (row) {                                        // compensation: give the stock back\n    db.prepare(\"UPDATE stock SET available = available + ? WHERE sku = 'pizza-box'\").run(row.qty);\n    db.prepare(\"DELETE FROM reservations WHERE order_id = ?\").run(m.order);\n  }\n  emit(db, \"StockReleased\", m);\n}\n\nfunction onCharge(db, m) {\n  const declined = m.amount % 7 === 0;              // the provider declines some cards\n  db.prepare(\"INSERT INTO payments VALUES (?, ?, ?)\").run(m.order, m.amount, declined ? \"declined\" : \"charged\");\n  emit(db, declined ? \"PaymentDeclined\" : \"PaymentCharged\", m);\n}\n\nconst setStatus = (db, m, status, reason = null) =>\n  db.prepare(\"UPDATE orders SET status = ?, reason = ? WHERE id = ?\").run(status, reason, m.order);\n\nconst HANDLERS = {                                  // the orchestrator lives in orders: it decides each next step\n  ReserveStock: [\"inventory\", onReserve], ReleaseStock: [\"inventory\", onRelease],\n  ChargePayment: [\"payments\", onCharge],\n  StockReserved: [\"orders\", (db, m) => { setStatus(db, m, \"reserved\"); emit(db, \"ChargePayment\", m); }],\n  PaymentDeclined: [\"orders\", (db, m) => { setStatus(db, m, \"releasing\"); emit(db, \"ReleaseStock\", m); }],\n  OutOfStock: [\"orders\", (db, m) => setStatus(db, m, \"cancelled\", \"out of stock\")],\n  PaymentCharged: [\"orders\", (db, m) => setStatus(db, m, \"confirmed\")],\n  StockReleased: [\"orders\", (db, m) => setStatus(db, m, \"cancelled\", \"card declined\")],\n};\n\nconst rand = mulberry32(7);\nconst broker = [], stats = { delivered: 0, duplicates: 0, relayCrashes: 0, consumerCrashes: 0 };\n\nfunction relay() {                                  // copy unsent outbox rows to the broker, then mark them sent\n  for (const [name, db] of Object.entries(dbs)) {\n    for (const { seq, topic, body } of db.prepare(\"SELECT seq, topic, body FROM outbox WHERE sent = 0 ORDER BY seq\").all()) {\n      broker.push([`${name}-${seq}`, topic, body]);\n      if (rand() < 0.1) { stats.relayCrashes++; return; }   // published, but crashed before marking it: it goes out again\n      db.prepare(\"UPDATE outbox SET sent = 1 WHERE seq = ?\").run(seq);\n    }\n  }\n}\n\nfunction deliver() {\n  const [msgId, topic, body] = broker.shift();\n  const [name, handler] = HANDLERS[topic];\n  const db = dbs[name];\n  stats.delivered++;\n  const fresh = transaction(db, () => {             // dedupe, state change and reply in one local transaction\n    if (db.prepare(\"INSERT OR IGNORE INTO inbox VALUES (?)\").run(msgId).changes === 0) return false;   // seen before: skip it\n    handler(db, JSON.parse(body));\n    return true;\n  });\n  if (!fresh) { stats.duplicates++; return; }\n  if (rand() < 0.1) { stats.consumerCrashes++; broker.push([msgId, topic, body]); }   // committed, but crashed before acknowledging\n}\n\nfor (let i = 1; i <= 30; i++) {                     // place 30 orders: the order row and its first command, atomically\n  const order = { order: `order-${i}`, qty: 1 + (i % 3), amount: 1000 + 13 * i };\n  transaction(dbs.orders, () => {\n    dbs.orders.prepare(\"INSERT INTO orders VALUES (?, ?, ?, 'placed', NULL)\").run(order.order, order.qty, order.amount);\n    emit(dbs.orders, \"ReserveStock\", order);\n  });\n}\nwhile (true) {\n  relay();\n  if (broker.length === 0) break;\n  while (broker.length) deliver();\n}\n\nconst orders = dbs.orders.prepare(\"SELECT status, reason, qty FROM orders\").all();\nconst confirmed = orders.filter(o => o.status === \"confirmed\").map(o => o.qty);\nconst reasons = orders.filter(o => o.status === \"cancelled\").map(o => o.reason);\nconst { available } = dbs.inventory.prepare(\"SELECT available FROM stock\").get();\nconst { reserved } = dbs.inventory.prepare(\"SELECT COALESCE(SUM(qty), 0) AS reserved FROM reservations\").get();\nconst { charged } = dbs.payments.prepare(\"SELECT COUNT(*) AS charged FROM payments WHERE status = 'charged'\").get();\nconst sold = confirmed.reduce((a, b) => a + b, 0);\nconsole.log(`orders: ${orders.length} | confirmed: ${confirmed.length} | cancelled: ${reasons.length} ` +\n            `(out of stock ${reasons.filter(r => r === \"out of stock\").length}, card declined ${reasons.filter(r => r === \"card declined\").length})`);\nconsole.log(`messages delivered: ${stats.delivered} | duplicates skipped: ${stats.duplicates} | ` +\n            `relay crashes: ${stats.relayCrashes} | consumer crashes: ${stats.consumerCrashes}`);\nconsole.log(`stock: ${available} of 40 left, ${reserved} sold to confirmed orders: ` +\n            `${reserved === sold && sold === 40 - available ? \"yes\" : \"no\"} | charges: ${charged}, one per confirmed order: ` +\n            `${charged === confirmed.length ? \"yes\" : \"no\"}`);\nif (!orders.every(o => o.status === \"confirmed\" || o.status === \"cancelled\")) throw new Error(\"a saga didn't finish\");\nif (!(reserved === sold && sold === 40 - available && charged === confirmed.length)) throw new Error(\"invariants\");\nif (stats.duplicates === 0) throw new Error(\"no duplicates were exercised\");\nconsole.log(\"saga lab OK\");\n","out":"orders: 30 | confirmed: 19 | cancelled: 11 (out of stock 9, card declined 2)\nmessages delivered: 123 | duplicates skipped: 17 | relay crashes: 8 | consumer crashes: 9\nstock: 3 of 40 left, 37 sold to confirmed orders: yes | charges: 19, one per confirmed order: yes\nsaga lab OK\n"}]},"breakit":["Publish straight from the handler instead of through the outbox, crash between the commit and the publish, and find the orders that never move on.","Remove the inbox check and count the double charges and double reservations.","Make the release step fail the first time and check that the saga still finishes, because the retry is safe."]},{"id":"lab-stream","t":"A windowed stream job with watermarks, checkpoints and an idempotent sink","min":75,"mods":["m03"],"goal":"Process 3,000 page views that arrive out of order into one-minute counts per page, by event time. A watermark with 30 seconds of allowed lateness decides when each window is final, and later events are sent aside. Save checkpoints of the job's state and input offset to disk, crash the job twice, restart from the checkpoints, and show that an upserting sink ends up exactly as in a run without crashes, while an append-only sink collects duplicates.","pre":["Python 3.12+ and Node.js 22.13+ (node:sqlite)","Read module 3"],"steps":["Generate the events with the seeded generator: an event time over 20 minutes, a page, and an arrival time, 2 seconds later usually and 20 to 150 seconds later for one event in ten. Sort them by arrival.","Keep state as plain data: the input offset, the newest event time, the open windows' counts, the windows already emitted and the late count.","For each event: count it in its tumbling window, or send it aside if that window was already emitted; advance the watermark; emit every window whose end is behind it to a SQLite sink with an upsert, and also append it to a second table.","Every 500 events, write the state to checkpoint.json atomically (write a temporary file, then rename it).","Crash at offsets 1,234 and 2,345 by throwing the state away and loading the last checkpoint; compare the sink with a crash-free run."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import json, os, sqlite3, tempfile\n\ndef mulberry32(seed): ...                       # copy the seeded generator from module 1\n\nWINDOW, LATENESS, EVERY = 60, 30, 500\n\ndef run(crash_at, workdir):\n    state = {\"offset\": 0, \"newest\": 0, \"open\": {}, \"closed\": [], \"late\": 0}\n    ...                                         # TODO: process, emit behind the watermark, checkpoint, crash and restore\n"},{"lang":"javascript","src":"const fs = require(\"node:fs\"), os = require(\"node:os\"), path = require(\"node:path\");\nconst { DatabaseSync } = require(\"node:sqlite\");\n\nfunction mulberry32(seed) { /* copy the seeded generator from module 1 */ }\nconst WINDOW = 60, LATENESS = 30, EVERY = 500;\n\nfunction run(crashAt, workdir) {\n  let state = { offset: 0, newest: 0, open: {}, closed: [], late: 0 };\n  // TODO: process, emit behind the watermark, checkpoint, crash and restore\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"A windowed stream job: event-time windows, a watermark, checkpoints to disk, crashes, and an idempotent sink.\"\"\"\nimport json\nimport os\nimport sqlite3\nimport tempfile\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nrand = mulberry32(5)\nevents = []\nfor _ in range(3000):                               # page views over 20 minutes; 10% arrive 20 to 150 s late\n    t = int(rand() * 1200)\n    page = [\"home\", \"menu\", \"order\"][int(rand() * 3)]\n    events.append((t + (20 + int(rand() * 130) if rand() < 0.1 else int(rand() * 3)), t, page))\nevents.sort()                                       # the log holds them in arrival order\nWINDOW, LATENESS, EVERY = 60, 30, 500\n\ndef fresh_state():\n    return {\"offset\": 0, \"newest\": 0, \"open\": {}, \"closed\": [], \"late\": 0}\n\ndef run(crash_at=(), workdir=None):\n    sink = sqlite3.connect(\":memory:\")\n    sink.execute(\"CREATE TABLE counts (window INTEGER, page TEXT, n INTEGER, PRIMARY KEY (window, page))\")\n    sink.execute(\"CREATE TABLE appended (window INTEGER, page TEXT, n INTEGER)\")   # what an append-only sink would hold\n    path = os.path.join(workdir, \"checkpoint.json\")\n    crashes, state, processed = set(crash_at), fresh_state(), 0\n    while state[\"offset\"] < len(events):\n        if state[\"offset\"] in crashes:              # the process dies: everything in memory is gone\n            crashes.discard(state[\"offset\"])\n            with open(path) as f:\n                state = json.load(f)                # restart from the last checkpoint and replay from its offset\n            continue\n        _, t, page = events[state[\"offset\"]]\n        start = t - t % WINDOW\n        if start in state[\"closed\"]:\n            state[\"late\"] += 1                      # its window was already emitted: send it aside\n        else:\n            key = f\"{start}|{page}\"\n            state[\"open\"][key] = state[\"open\"].get(key, 0) + 1\n        state[\"newest\"] = max(state[\"newest\"], t)\n        watermark = state[\"newest\"] - LATENESS\n        for key in sorted(k for k in state[\"open\"] if int(k.split(\"|\")[0]) + WINDOW <= watermark):\n            w, p = key.split(\"|\")\n            n = state[\"open\"].pop(key)\n            with sink:                              # an upsert: replaying the same window rewrites the same row\n                sink.execute(\"INSERT INTO counts VALUES (?, ?, ?) ON CONFLICT (window, page) DO UPDATE SET n = excluded.n\", (int(w), p, n))\n                sink.execute(\"INSERT INTO appended VALUES (?, ?, ?)\", (int(w), p, n))\n            if int(w) not in state[\"closed\"]:\n                state[\"closed\"].append(int(w))\n        state[\"offset\"] += 1\n        processed += 1\n        if state[\"offset\"] % EVERY == 0:\n            tmp = path + \".tmp\"\n            with open(tmp, \"w\") as f:\n                json.dump(state, f)\n            os.replace(tmp, path)                   # atomic: a crash mid-write leaves the old checkpoint intact\n    rows = sink.execute(\"SELECT window, page, n FROM counts ORDER BY window, page\").fetchall()\n    appended = sink.execute(\"SELECT COUNT(*) FROM appended\").fetchone()[0]\n    return rows, appended, processed, state[\"late\"], sum(state[\"open\"].values())\n\nwith tempfile.TemporaryDirectory() as clean_dir, tempfile.TemporaryDirectory() as crash_dir:\n    rows, appended, processed, late, still_open = run(workdir=clean_dir)\n    rows2, appended2, processed2, late2, _ = run(crash_at=(1234, 2345), workdir=crash_dir)\nprint(f\"events: {len(events)} | windows emitted: {len(rows)} | late events sent aside: {late} | still in open windows: {still_open}\")\nprint(f\"with crashes at offsets 1234 and 2345: {processed2 - processed} events replayed, \"\n      f\"sink identical to the clean run: {'yes' if rows2 == rows and late2 == late else 'no'}, \"\n      f\"an append-only sink would hold {appended2 - len(rows2)} duplicate rows\")\nassert rows2 == rows and late2 == late and processed2 - processed == 234 + 345\nassert sum(n for _, _, n in rows) + late + still_open == len(events)   # every event counted exactly once\nprint(\"stream lab OK\")\n","out":"events: 3000 | windows emitted: 57 | late events sent aside: 194 | still in open windows: 153\nwith crashes at offsets 1234 and 2345: 579 events replayed, sink identical to the clean run: yes, an append-only sink would hold 12 duplicate rows\nstream lab OK\n"},{"lang":"javascript","src":"// A windowed stream job: event-time windows, a watermark, checkpoints to disk, crashes, and an idempotent sink.\nconst fs = require(\"node:fs\");\nconst os = require(\"node:os\");\nconst path = require(\"node:path\");\nconst { DatabaseSync } = require(\"node:sqlite\");     // built in from Node.js 22.13 (with an experimental warning)\n\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst rand = mulberry32(5);\nconst events = [];\nfor (let i = 0; i < 3000; i++) {                    // page views over 20 minutes; 10% arrive 20 to 150 s late\n  const t = Math.floor(rand() * 1200);\n  const page = [\"home\", \"menu\", \"order\"][Math.floor(rand() * 3)];\n  const delay = rand() < 0.1 ? 20 + Math.floor(rand() * 130) : Math.floor(rand() * 3);\n  events.push([t + delay, t, page]);\n}\nevents.sort((a, b) => a[0] - b[0] || a[1] - b[1] || (a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0));   // the log holds them in arrival order\nconst WINDOW = 60, LATENESS = 30, EVERY = 500;\n\nconst freshState = () => ({ offset: 0, newest: 0, open: {}, closed: [], late: 0 });\n\nfunction run(crashAt, workdir) {\n  const sink = new DatabaseSync(\":memory:\");\n  sink.exec(\"CREATE TABLE counts (window INTEGER, page TEXT, n INTEGER, PRIMARY KEY (window, page))\");\n  sink.exec(\"CREATE TABLE appended (window INTEGER, page TEXT, n INTEGER)\");   // what an append-only sink would hold\n  const file = path.join(workdir, \"checkpoint.json\");\n  const crashes = new Set(crashAt);\n  let state = freshState(), processed = 0;\n  while (state.offset < events.length) {\n    if (crashes.has(state.offset)) {                // the process dies: everything in memory is gone\n      crashes.delete(state.offset);\n      state = JSON.parse(fs.readFileSync(file, \"utf8\"));   // restart from the last checkpoint and replay from its offset\n      continue;\n    }\n    const [, t, page] = events[state.offset];\n    const start = t - (t % WINDOW);\n    if (state.closed.includes(start)) state.late++; // its window was already emitted: send it aside\n    else {\n      const key = `${start}|${page}`;\n      state.open[key] = (state.open[key] ?? 0) + 1;\n    }\n    state.newest = Math.max(state.newest, t);\n    const watermark = state.newest - LATENESS;\n    for (const key of Object.keys(state.open).filter(k => Number(k.split(\"|\")[0]) + WINDOW <= watermark).sort()) {\n      const [w, p] = key.split(\"|\");\n      const n = state.open[key];\n      delete state.open[key];\n      sink.exec(\"BEGIN\");                           // an upsert: replaying the same window rewrites the same row\n      sink.prepare(\"INSERT INTO counts VALUES (?, ?, ?) ON CONFLICT (window, page) DO UPDATE SET n = excluded.n\").run(Number(w), p, n);\n      sink.prepare(\"INSERT INTO appended VALUES (?, ?, ?)\").run(Number(w), p, n);\n      sink.exec(\"COMMIT\");\n      if (!state.closed.includes(Number(w))) state.closed.push(Number(w));\n    }\n    state.offset++;\n    processed++;\n    if (state.offset % EVERY === 0) {\n      fs.writeFileSync(file + \".tmp\", JSON.stringify(state));\n      fs.renameSync(file + \".tmp\", file);           // atomic: a crash mid-write leaves the old checkpoint intact\n    }\n  }\n  const rows = sink.prepare(\"SELECT window, page, n FROM counts ORDER BY window, page\").all().map(r => [r.window, r.page, r.n]);\n  const appended = sink.prepare(\"SELECT COUNT(*) AS c FROM appended\").get().c;\n  return [rows, appended, processed, state.late, Object.values(state.open).reduce((a, b) => a + b, 0)];\n}\n\nconst cleanDir = fs.mkdtempSync(path.join(os.tmpdir(), \"stream-\")), crashDir = fs.mkdtempSync(path.join(os.tmpdir(), \"stream-\"));\nconst [rows, , processed, late, stillOpen] = run([], cleanDir);\nconst [rows2, appended2, processed2, late2] = run([1234, 2345], crashDir);\nfs.rmSync(cleanDir, { recursive: true }); fs.rmSync(crashDir, { recursive: true });\nconst same = JSON.stringify(rows2) === JSON.stringify(rows) && late2 === late;\nconsole.log(`events: ${events.length} | windows emitted: ${rows.length} | late events sent aside: ${late} | still in open windows: ${stillOpen}`);\nconsole.log(`with crashes at offsets 1234 and 2345: ${processed2 - processed} events replayed, ` +\n            `sink identical to the clean run: ${same ? \"yes\" : \"no\"}, an append-only sink would hold ${appended2 - rows2.length} duplicate rows`);\nif (!same || processed2 - processed !== 234 + 345) throw new Error(\"replay changed the result\");\nif (rows.reduce((s, r) => s + r[2], 0) + late + stillOpen !== events.length) throw new Error(\"an event was lost or counted twice\");\nconsole.log(\"stream lab OK\");\n","out":"events: 3000 | windows emitted: 57 | late events sent aside: 194 | still in open windows: 153\nwith crashes at offsets 1234 and 2345: 579 events replayed, sink identical to the clean run: yes, an append-only sink would hold 12 duplicate rows\nstream lab OK\n"}]},"breakit":["Save the checkpoint without the rename and crash halfway through writing it: what does the restart load?","Checkpoint the state but not the offset, and watch events vanish or double.","Set the allowed lateness to 0, then to 300 seconds, and compare late events against how long each window waits."]},{"id":"lab-raft","t":"Raft on five nodes, through two network partitions","min":120,"mods":["m04"],"goal":"Simulate five Raft nodes over a lossy, delayed network: randomized election timeouts, RequestVote with the up-to-date rule, AppendEntries with the consistency check, and the leader's commit rule. Cut the leader off from everyone for three seconds, later split the cluster two against three, then heal. Assert Raft's safety properties on every millisecond, and show that the commands the cut-off leader accepted were never committed and are gone.","pre":["Python 3.12+ and Node.js 22+","Read module 4"],"steps":["Model each node: term, vote, log of (term, command), commit index, role, and for a leader the next and match index of each follower. Messages take 2 to 9 ms and are dropped across a partition.","Elections: a follower whose timer (150 to 299 ms) runs out becomes a candidate for the next term; votes go to at most one candidate per term, and only if its log is at least as up to date. A new leader appends a no-op entry.","Replication: every 50 ms the leader sends each follower the entries from its next index, with the previous entry's index and term; followers refuse on a mismatch and say where to back up to; the leader commits the highest current-term entry stored on a majority.","Every 50 ms, a client sends a command to each node that believes it's the leader. Partition the cluster at 3,000 ms (the leader alone) and at 9,000 ms (nodes 0 and 1 against the rest), healing at 6,000 and 12,000.","Assert: at most one leader per term; a committed entry never changes on any node; every new leader already holds every committed entry; and after healing all nodes agree."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"def mulberry32(seed): ...                       # copy the seeded generator from module 1\n\nN = 5\n\nclass Node:\n    def __init__(self, i):\n        ...                                     # TODO: term, vote, log, commit, role, next and match, timers\n\ndef handle(now, node, src, msg):\n    ...                                         # TODO: vote?, vote, append and appended, as in module 4\n"},{"lang":"javascript","src":"function mulberry32(seed) { /* copy the seeded generator from module 1 */ }\nconst N = 5;\n\nclass Node {\n  constructor(i) { /* TODO: term, vote, log, commit, role, next and match, timers */ }\n}\n\nfunction handle(now, node, src, msg) { /* TODO: vote?, vote, append and appended, as in module 4 */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"Raft on five simulated nodes: elections, log replication and commits, through two network partitions.\"\"\"\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nN, rand = 5, mulberry32(3)\ntimeout = lambda now: now + 150 + int(rand() * 150)  # randomized election timeouts\n\nclass Node:\n    def __init__(self, i):\n        self.id, self.term, self.voted, self.log, self.commit = i, 0, None, [], 0   # log entries: (term, command)\n        self.role, self.votes, self.next, self.match = \"follower\", set(), {}, {}\n        self.deadline, self.heartbeat_due = timeout(0), 0\n\nnodes, net, leaders, committed = [Node(i) for i in range(N)], [], {}, {}\nisolated = None                                     # the node cut off during the first partition\n\ndef connected(now, a, b):\n    if 3000 <= now < 6000:\n        return (a == isolated) == (b == isolated)   # the leader of the day, alone on one side\n    if 9000 <= now < 12000:\n        return (a < 2) == (b < 2)                   # nodes 0 and 1 against 2, 3 and 4\n    return True\n\ndef send(now, src, dst, msg):\n    if connected(now, src, dst):\n        net.append((now + 2 + int(rand() * 8), src, dst, msg))\n\ndef last_term(node):\n    return node.log[-1][0] if node.log else 0\n\ndef become_leader(now, node):\n    node.role = \"leader\"\n    leaders.setdefault(node.term, set()).add(node.id)\n    for i, entry in committed.items():              # leader completeness: it already holds every committed entry\n        assert len(node.log) >= i and node.log[i - 1] == entry\n    node.next = {p: len(node.log) + 1 for p in range(N) if p != node.id}\n    node.match = {p: 0 for p in range(N) if p != node.id}\n    node.log.append((node.term, None))              # a no-op, so earlier terms' entries can commit with it\n    node.heartbeat_due = now\n\ndef handle(now, node, src, msg):\n    kind, term = msg[0], msg[1]\n    if term > node.term:                            # a newer term: become a follower\n        node.term, node.voted, node.role = term, None, \"follower\"\n    if kind == \"vote?\":\n        _, _, their_last_index, their_last_term = msg\n        granted = (term == node.term and node.voted in (None, src)\n                   and (their_last_term, their_last_index) >= (last_term(node), len(node.log)))\n        if granted:\n            node.voted, node.deadline = src, timeout(now)\n        send(now, node.id, src, (\"vote\", node.term, granted))\n    elif kind == \"vote\":\n        if node.role == \"candidate\" and term == node.term and msg[2]:\n            node.votes.add(src)\n            if len(node.votes) > N // 2:\n                become_leader(now, node)\n    elif kind == \"append\":\n        _, _, prev, prev_term, entries, leader_commit = msg\n        if term < node.term:\n            return send(now, node.id, src, (\"appended\", node.term, False, 0))\n        node.role, node.deadline = \"follower\", timeout(now)   # there's a leader for this term\n        if prev > len(node.log):                    # too short: tell the leader where this log ends\n            return send(now, node.id, src, (\"appended\", node.term, False, len(node.log) + 1))\n        if prev > 0 and node.log[prev - 1][0] != prev_term:\n            first = prev                            # a conflict: skip back over the whole conflicting term at once\n            while first > 1 and node.log[first - 2][0] == node.log[prev - 1][0]:\n                first -= 1\n            return send(now, node.id, src, (\"appended\", node.term, False, first))\n        for k, entry in enumerate(entries):\n            if prev + k < len(node.log) and node.log[prev + k][0] != entry[0]:\n                del node.log[prev + k:]             # the first conflict: drop it and everything after\n            if prev + k >= len(node.log):\n                node.log.append(entry)\n        node.commit = max(node.commit, min(leader_commit, prev + len(entries)))\n        send(now, node.id, src, (\"appended\", node.term, True, prev + len(entries)))\n    elif kind == \"appended\" and node.role == \"leader\" and term == node.term:\n        if msg[2]:\n            node.match[src] = max(node.match[src], msg[3])\n            node.next[src] = node.match[src] + 1\n            for n in range(len(node.log), node.commit, -1):   # the highest current-term entry on a majority\n                if node.log[n - 1][0] == node.term and 1 + sum(m >= n for m in node.match.values()) > N // 2:\n                    node.commit = n\n                    break\n        else:\n            node.next[src] = max(1, min(node.next[src] - 1, msg[3]))   # back up, using the follower's hint\n\naccepted, stranded = 0, set()                       # stranded: commands the cut-off leader accepted\nfor now in range(15_000):\n    if now == 3000:\n        isolated = max((n for n in nodes if n.role == \"leader\"), key=lambda n: n.term).id\n    for _, src, dst, msg in [m for m in net if m[0] == now]:\n        if connected(now, src, dst):\n            handle(now, nodes[dst], src, msg)\n    net = [m for m in net if m[0] > now]\n    for node in nodes:\n        if node.role == \"leader\" and now >= node.heartbeat_due:\n            node.heartbeat_due = now + 50\n            for p in range(N):\n                if p != node.id:\n                    prev = node.next[p] - 1\n                    send(now, node.id, p, (\"append\", node.term, prev, node.log[prev - 1][0] if prev else 0, node.log[prev:], node.commit))\n        elif node.role != \"leader\" and now >= node.deadline:\n            node.term, node.role, node.voted, node.votes = node.term + 1, \"candidate\", node.id, {node.id}\n            node.deadline = timeout(now)\n            for p in range(N):\n                if p != node.id:\n                    send(now, node.id, p, (\"vote?\", node.term, len(node.log), last_term(node)))\n    if now % 50 == 25 and now < 13_000:\n        for node in nodes:\n            if node.role == \"leader\":               # each client talks to whichever node says it's the leader\n                accepted += 1\n                node.log.append((node.term, f\"c{accepted}\"))\n                if node.id == isolated and 3000 <= now < 6000:\n                    stranded.add(f\"c{accepted}\")\n    for node in nodes:\n        for i in range(1, node.commit + 1):         # a committed entry must never change, on any node\n            assert committed.setdefault(i, node.log[i - 1]) == node.log[i - 1]\n\nassert all(len(ids) == 1 for ids in leaders.values())   # election safety: at most one leader per term\nlogs = {tuple(n.log[:n.commit]) for n in nodes}\nassert len(logs) == 1 and len({n.commit for n in nodes}) == 1   # after healing, every node agrees\ncommands = [cmd for _, cmd in nodes[0].log[:nodes[0].commit] if cmd]\nprint(f\"terms: {max(n.term for n in nodes)} | leaders elected: {len(leaders)} | commands accepted: {accepted}, \"\n      f\"committed: {len(commands)}, never committed: {accepted - len(commands)}\")\ngone = not stranded & set(commands) and not stranded & {cmd for _, cmd in nodes[isolated].log}\nassert stranded and gone                            # accepted by a deposed leader, never committed, then overwritten\nprint(f\"one leader per term: yes | committed entries identical on all {N} nodes: yes | \"\n      f\"the {len(stranded)} commands cut-off leader {isolated} accepted: never committed, now gone: {'yes' if gone else 'no'}\")\nprint(\"raft lab OK\")\n","out":"terms: 18 | leaders elected: 3 | commands accepted: 314, committed: 253, never committed: 61\none leader per term: yes | committed entries identical on all 5 nodes: yes | the 60 commands cut-off leader 1 accepted: never committed, now gone: yes\nraft lab OK\n"},{"lang":"javascript","src":"// Raft on five simulated nodes: elections, log replication and commits, through two network partitions.\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst N = 5, rand = mulberry32(3);\nconst timeout = now => now + 150 + Math.floor(rand() * 150);   // randomized election timeouts\n\nclass Node {\n  constructor(i) {\n    this.id = i; this.term = 0; this.voted = null; this.log = []; this.commit = 0;   // log entries: [term, command]\n    this.role = \"follower\"; this.votes = new Set(); this.next = {}; this.match = {};\n    this.deadline = timeout(0); this.heartbeatDue = 0;\n  }\n}\n\nconst nodes = Array.from({ length: N }, (_, i) => new Node(i));\nlet net = [];\nconst leaders = new Map(), committed = new Map();\nlet isolated = null;                                // the node cut off during the first partition\nconst sameEntry = (a, b) => a[0] === b[0] && a[1] === b[1];\n\nfunction connected(now, a, b) {\n  if (now >= 3000 && now < 6000) return (a === isolated) === (b === isolated);   // the leader of the day, alone on one side\n  if (now >= 9000 && now < 12000) return (a < 2) === (b < 2);   // nodes 0 and 1 against 2, 3 and 4\n  return true;\n}\n\nfunction send(now, src, dst, msg) {\n  if (connected(now, src, dst)) net.push([now + 2 + Math.floor(rand() * 8), src, dst, msg]);\n}\n\nconst lastTerm = node => (node.log.length ? node.log.at(-1)[0] : 0);\n\nfunction becomeLeader(now, node) {\n  node.role = \"leader\";\n  if (!leaders.has(node.term)) leaders.set(node.term, new Set());\n  leaders.get(node.term).add(node.id);\n  for (const [i, entry] of committed) {             // leader completeness: it already holds every committed entry\n    if (node.log.length < i || !sameEntry(node.log[i - 1], entry)) throw new Error(\"a new leader lacks a committed entry\");\n  }\n  node.next = {}; node.match = {};\n  for (let p = 0; p < N; p++) if (p !== node.id) { node.next[p] = node.log.length + 1; node.match[p] = 0; }\n  node.log.push([node.term, null]);                 // a no-op, so earlier terms' entries can commit with it\n  node.heartbeatDue = now;\n}\n\nfunction handle(now, node, src, msg) {\n  const [kind, term] = msg;\n  if (term > node.term) { node.term = term; node.voted = null; node.role = \"follower\"; }   // a newer term: become a follower\n  if (kind === \"vote?\") {\n    const [, , theirLastIndex, theirLastTerm] = msg;\n    const mine = lastTerm(node);\n    const upToDate = theirLastTerm > mine || (theirLastTerm === mine && theirLastIndex >= node.log.length);\n    const granted = term === node.term && (node.voted === null || node.voted === src) && upToDate;\n    if (granted) { node.voted = src; node.deadline = timeout(now); }\n    send(now, node.id, src, [\"vote\", node.term, granted]);\n  } else if (kind === \"vote\") {\n    if (node.role === \"candidate\" && term === node.term && msg[2]) {\n      node.votes.add(src);\n      if (node.votes.size > Math.floor(N / 2)) becomeLeader(now, node);\n    }\n  } else if (kind === \"append\") {\n    const [, , prev, prevTerm, entries, leaderCommit] = msg;\n    if (term < node.term) { send(now, node.id, src, [\"appended\", node.term, false, 0]); return; }\n    node.role = \"follower\"; node.deadline = timeout(now);   // there's a leader for this term\n    if (prev > node.log.length) {                   // too short: tell the leader where this log ends\n      send(now, node.id, src, [\"appended\", node.term, false, node.log.length + 1]);\n      return;\n    }\n    if (prev > 0 && node.log[prev - 1][0] !== prevTerm) {\n      let first = prev;                             // a conflict: skip back over the whole conflicting term at once\n      while (first > 1 && node.log[first - 2][0] === node.log[prev - 1][0]) first--;\n      send(now, node.id, src, [\"appended\", node.term, false, first]);\n      return;\n    }\n    entries.forEach((entry, k) => {\n      if (prev + k < node.log.length && node.log[prev + k][0] !== entry[0]) node.log.length = prev + k;   // the first conflict: drop it and everything after\n      if (prev + k >= node.log.length) node.log.push(entry);\n    });\n    node.commit = Math.max(node.commit, Math.min(leaderCommit, prev + entries.length));\n    send(now, node.id, src, [\"appended\", node.term, true, prev + entries.length]);\n  } else if (kind === \"appended\" && node.role === \"leader\" && term === node.term) {\n    if (msg[2]) {\n      node.match[src] = Math.max(node.match[src], msg[3]);\n      node.next[src] = node.match[src] + 1;\n      for (let n = node.log.length; n > node.commit; n--) {   // the highest current-term entry on a majority\n        if (node.log[n - 1][0] === node.term && 1 + Object.values(node.match).filter(m => m >= n).length > Math.floor(N / 2)) {\n          node.commit = n;\n          break;\n        }\n      }\n    } else node.next[src] = Math.max(1, Math.min(node.next[src] - 1, msg[3]));   // back up, using the follower's hint\n  }\n}\n\nlet accepted = 0;\nconst stranded = new Set();                         // commands the cut-off leader accepted\nfor (let now = 0; now < 15000; now++) {\n  if (now === 3000) {\n    isolated = nodes.filter(n => n.role === \"leader\").reduce((best, n) => (best === null || n.term > best.term ? n : best), null).id;\n  }\n  for (const [, src, dst, msg] of net.filter(m => m[0] === now)) {\n    if (connected(now, src, dst)) handle(now, nodes[dst], src, msg);\n  }\n  net = net.filter(m => m[0] > now);\n  for (const node of nodes) {\n    if (node.role === \"leader\" && now >= node.heartbeatDue) {\n      node.heartbeatDue = now + 50;\n      for (let p = 0; p < N; p++) {\n        if (p === node.id) continue;\n        const prev = node.next[p] - 1;\n        send(now, node.id, p, [\"append\", node.term, prev, prev ? node.log[prev - 1][0] : 0, node.log.slice(prev), node.commit]);\n      }\n    } else if (node.role !== \"leader\" && now >= node.deadline) {\n      node.term++; node.role = \"candidate\"; node.voted = node.id; node.votes = new Set([node.id]);\n      node.deadline = timeout(now);\n      for (let p = 0; p < N; p++) if (p !== node.id) send(now, node.id, p, [\"vote?\", node.term, node.log.length, lastTerm(node)]);\n    }\n  }\n  if (now % 50 === 25 && now < 13000) {\n    for (const node of nodes) {\n      if (node.role !== \"leader\") continue;         // each client talks to whichever node says it's the leader\n      accepted++;\n      node.log.push([node.term, `c${accepted}`]);\n      if (node.id === isolated && now >= 3000 && now < 6000) stranded.add(`c${accepted}`);\n    }\n  }\n  for (const node of nodes) {\n    for (let i = 1; i <= node.commit; i++) {        // a committed entry must never change, on any node\n      if (!committed.has(i)) committed.set(i, node.log[i - 1]);\n      if (!sameEntry(committed.get(i), node.log[i - 1])) throw new Error(\"a committed entry changed\");\n    }\n  }\n}\n\nif (![...leaders.values()].every(ids => ids.size === 1)) throw new Error(\"two leaders in one term\");\nconst logs = new Set(nodes.map(n => JSON.stringify(n.log.slice(0, n.commit))));\nif (logs.size !== 1 || new Set(nodes.map(n => n.commit)).size !== 1) throw new Error(\"the nodes disagree after healing\");\nconst commands = nodes[0].log.slice(0, nodes[0].commit).map(([, cmd]) => cmd).filter(Boolean);\nconsole.log(`terms: ${Math.max(...nodes.map(n => n.term))} | leaders elected: ${leaders.size} | commands accepted: ${accepted}, ` +\n            `committed: ${commands.length}, never committed: ${accepted - commands.length}`);\nconst inLog = new Set(nodes[isolated].log.map(([, cmd]) => cmd));\nconst gone = [...stranded].every(c => !commands.includes(c) && !inLog.has(c));\nif (!(stranded.size > 0 && gone)) throw new Error(\"the deposed leader's entries survived\");\nconsole.log(`one leader per term: yes | committed entries identical on all ${N} nodes: yes | ` +\n            `the ${stranded.size} commands cut-off leader ${isolated} accepted: never committed, now gone: ${gone ? \"yes\" : \"no\"}`);\nconsole.log(\"raft lab OK\");\n","out":"terms: 18 | leaders elected: 3 | commands accepted: 314, committed: 253, never committed: 61\none leader per term: yes | committed entries identical on all 5 nodes: yes | the 60 commands cut-off leader 1 accepted: never committed, now gone: yes\nraft lab OK\n"}]},"breakit":["Drop the up-to-date check from voting and find the run where a new leader overwrites a committed entry.","Let the leader commit an entry from an earlier term by counting replicas, and look for a committed entry that changes later.","Give every node the same 150 ms timeout and count the split votes."]},{"id":"lab-lsm","t":"A tiny LSM key-value store: write-ahead log, SSTables, crash recovery and compaction","min":90,"mods":["m05"],"goal":"Build a key-value store on disk the way LSM engines do: every write is appended to a write-ahead log and flushed with fsync before it's acknowledged, a memtable holds recent writes, full memtables become immutable sorted SSTable files, reads check the memtable and then the tables from newest to oldest, deletes write tombstones, and compaction merges the tables. Crash it three times, once halfway through writing a log record, and prove that every restart recovers exactly the acknowledged writes.","pre":["Python 3.12+ and Node.js 22+","Read module 5"],"steps":["Write a record to wal.log for every put and delete, flush and fsync it, then update the memtable; when the memtable holds 50 keys, write it as a sorted SSTable (a temporary file, fsynced, then renamed) and start a new log.","get(key) looks in the memtable, then in each SSTable from newest to oldest; count how many tables each read searches.","On open, load the SSTables, replay the log into the memtable, and stop at a torn final record, rewriting the log without it.","Run 2,000 random puts and deletes over 300 keys, crashing after 500, 1,000 and 1,500 writes; at 1,000, die halfway through a record. Compare every key with a reference dictionary after each restart.","Compact all tables into one, dropping tombstones, and compare the tables searched per read before and after."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import json, os, tempfile\n\ndef mulberry32(seed): ...                       # copy the seeded generator from module 1\n\nclass LSMStore:\n    def __init__(self, folder, memtable_limit=50):\n        ...                                     # TODO: load the SSTables, replay the log, drop a torn tail\n    def write(self, key, value): ...            # TODO: log, fsync, memtable, flush when full\n    def get(self, key): ...                     # TODO: memtable, then tables newest first\n    def compact(self): ...                      # TODO: merge, drop tombstones, delete old files\n"},{"lang":"javascript","src":"const fs = require(\"node:fs\"), os = require(\"node:os\"), path = require(\"node:path\");\n\nfunction mulberry32(seed) { /* copy the seeded generator from module 1 */ }\n\nclass LSMStore {\n  constructor(folder, memtableLimit = 50) { /* TODO: load the SSTables, replay the log, drop a torn tail */ }\n  write(key, value) { /* TODO: log, fsync, memtable, flush when full */ }\n  get(key) { /* TODO: memtable, then tables newest first */ }\n  compact() { /* TODO: merge, drop tombstones, delete old files */ }\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"A tiny LSM key-value store on disk: a write-ahead log, a memtable, SSTable files, crash recovery and compaction.\"\"\"\nimport json\nimport os\nimport shutil\nimport tempfile\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nclass LSMStore:\n    def __init__(self, folder, memtable_limit=50):\n        self.folder, self.limit, self.tables = folder, memtable_limit, []   # tables: (number, dict), newest first\n        for name in sorted(n for n in os.listdir(folder) if n.startswith(\"sst-\") and n.endswith(\".jsonl\")):\n            with open(self.path(int(name[4:10]))) as f:\n                self.tables.insert(0, (int(name[4:10]), dict(json.loads(line) for line in f)))\n        self.memtable, self.recovered, good = {}, 0, []\n        wal = os.path.join(folder, \"wal.log\")\n        if os.path.exists(wal):\n            with open(wal) as f:\n                for line in f:\n                    try:\n                        key, value = json.loads(line)\n                    except ValueError:\n                        break                       # a torn record from a crash mid-write: it was never acknowledged\n                    self.memtable[key] = value\n                    good.append(line if line.endswith(\"\\n\") else line + \"\\n\")\n                    self.recovered += 1\n        with open(wal + \".tmp\", \"w\") as f:          # rewrite the log without the torn tail\n            f.writelines(good)\n        os.replace(wal + \".tmp\", wal)\n        self.wal = open(wal, \"a\")\n\n    def path(self, number):\n        return os.path.join(self.folder, f\"sst-{number:06d}.jsonl\")\n\n    def write(self, key, value):                    # value None is a delete: a tombstone\n        self.wal.write(json.dumps([key, value]) + \"\\n\")\n        self.wal.flush()\n        os.fsync(self.wal.fileno())                 # durable before the write is acknowledged\n        self.memtable[key] = value\n        if len(self.memtable) >= self.limit:\n            self.save_table(self.memtable)\n            self.wal.close()\n            self.wal = open(os.path.join(self.folder, \"wal.log\"), \"w\")   # those records now live in the table\n            self.memtable = {}\n\n    def save_table(self, rows):\n        number = self.tables[0][0] + 1 if self.tables else 1\n        with open(self.path(number) + \".tmp\", \"w\") as f:\n            f.writelines(json.dumps([k, rows[k]]) + \"\\n\" for k in sorted(rows))\n            f.flush()\n            os.fsync(f.fileno())\n        os.replace(self.path(number) + \".tmp\", self.path(number))   # a table appears whole, or not at all\n        self.tables.insert(0, (number, dict(rows)))\n\n    def get(self, key):\n        if key in self.memtable:\n            return self.memtable[key], 0\n        for searched, (_, table) in enumerate(self.tables, start=1):\n            if key in table:\n                return table[key], searched         # the newest table holding the key wins\n        return None, len(self.tables)\n\n    def compact(self):\n        merged = {}\n        for _, table in reversed(self.tables):      # oldest first, so newer values overwrite older ones\n            merged.update(table)\n        live = {k: v for k, v in merged.items() if v is not None}   # nothing older remains: tombstones can go\n        old = [n for n, _ in self.tables]\n        self.save_table(live)\n        for n in old:\n            os.remove(self.path(n))\n        self.tables = self.tables[:1]\n        return len(merged) - len(live)\n\nrand, folder = mulberry32(9), tempfile.mkdtemp()\nstore, reference, matched = LSMStore(folder), {}, True\nkeys = [f\"k{n:03d}\" for n in range(300)]\nfor i in range(2000):\n    key, value = keys[int(rand() * 300)], (None if rand() < 0.2 else int(rand() * 1000))\n    store.write(key, value)\n    reference[key] = value\n    if i in (499, 999, 1499):                       # the process dies; at 999 it dies halfway through a record\n        if i == 999:\n            store.wal.write('[\"k007\", 12')\n            store.wal.flush()\n        store.wal.close()\n        store = LSMStore(folder)                    # restart: tables from disk, the memtable from the log\n        matched = matched and all(store.get(k)[0] == reference.get(k) for k in keys)\nbefore = len(store.tables)\nsearched_before = sum(store.get(k)[1] for k in keys) * 10 // len(keys)\nstore.save_table(store.memtable)                    # flush what's left, then merge everything\nstore.memtable = {}\ndropped = store.compact()\nsearched_after = sum(store.get(k)[1] for k in keys) * 10 // len(keys)\nmatched = matched and all(store.get(k)[0] == reference.get(k) for k in keys)\nlive = sum(1 for k in keys if store.get(k)[0] is not None)\nstore.wal.close()\nshutil.rmtree(folder)\nprint(f\"2000 writes, 3 crashes, one halfway through a log record: every restart matched the reference: {'yes' if matched else 'no'}\")\nprint(f\"sstables: {before} before compaction, 1 after | tables searched per read: \"\n      f\"{searched_before // 10}.{searched_before % 10} before, {searched_after // 10}.{searched_after % 10} after\")\nprint(f\"live keys: {live} | tombstones dropped by compaction: {dropped} | records replayed from the log at the last restart: {store.recovered}\")\nassert matched and live == sum(1 for v in reference.values() if v is not None)\nprint(\"lsm lab OK\")\n","out":"2000 writes, 3 crashes, one halfway through a log record: every restart matched the reference: yes\nsstables: 36 before compaction, 1 after | tables searched per read: 5.1 before, 1.0 after\nlive keys: 238 | tombstones dropped by compaction: 62 | records replayed from the log at the last restart: 41\nlsm lab OK\n"},{"lang":"javascript","src":"// A tiny LSM key-value store on disk: a write-ahead log, a memtable, SSTable files, crash recovery and compaction.\nconst fs = require(\"node:fs\");\nconst os = require(\"node:os\");\nconst path = require(\"node:path\");\n\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nclass LSMStore {\n  constructor(folder, memtableLimit = 50) {\n    this.folder = folder; this.limit = memtableLimit; this.tables = [];   // tables: [number, Map], newest first\n    for (const name of fs.readdirSync(folder).filter(n => n.startsWith(\"sst-\") && n.endsWith(\".jsonl\")).sort()) {\n      const lines = fs.readFileSync(path.join(folder, name), \"utf8\").split(\"\\n\").filter(Boolean);\n      this.tables.unshift([Number(name.slice(4, 10)), new Map(lines.map(line => JSON.parse(line)))]);\n    }\n    this.memtable = new Map(); this.recovered = 0;\n    const wal = path.join(folder, \"wal.log\"), good = [];\n    if (fs.existsSync(wal)) {\n      for (const line of fs.readFileSync(wal, \"utf8\").split(\"\\n\").filter(Boolean)) {\n        let record;\n        try { record = JSON.parse(line); } catch { break; }   // a torn record from a crash mid-write: it was never acknowledged\n        this.memtable.set(record[0], record[1]);\n        good.push(line + \"\\n\");\n        this.recovered++;\n      }\n    }\n    fs.writeFileSync(wal + \".tmp\", good.join(\"\"));  // rewrite the log without the torn tail\n    fs.renameSync(wal + \".tmp\", wal);\n    this.wal = fs.openSync(wal, \"a\");\n  }\n\n  path(number) { return path.join(this.folder, `sst-${String(number).padStart(6, \"0\")}.jsonl`); }\n\n  write(key, value) {                               // value null is a delete: a tombstone\n    fs.writeSync(this.wal, JSON.stringify([key, value]) + \"\\n\");\n    fs.fsyncSync(this.wal);                         // durable before the write is acknowledged\n    this.memtable.set(key, value);\n    if (this.memtable.size >= this.limit) {\n      this.saveTable(this.memtable);\n      fs.closeSync(this.wal);\n      this.wal = fs.openSync(path.join(this.folder, \"wal.log\"), \"w\");   // those records now live in the table\n      this.memtable = new Map();\n    }\n  }\n\n  saveTable(rows) {\n    const number = this.tables.length ? this.tables[0][0] + 1 : 1;\n    const fd = fs.openSync(this.path(number) + \".tmp\", \"w\");\n    fs.writeSync(fd, [...rows.keys()].sort().map(k => JSON.stringify([k, rows.get(k)]) + \"\\n\").join(\"\"));\n    fs.fsyncSync(fd);\n    fs.closeSync(fd);\n    fs.renameSync(this.path(number) + \".tmp\", this.path(number));   // a table appears whole, or not at all\n    this.tables.unshift([number, new Map(rows)]);\n  }\n\n  get(key) {\n    if (this.memtable.has(key)) return [this.memtable.get(key), 0];\n    for (let i = 0; i < this.tables.length; i++) {\n      if (this.tables[i][1].has(key)) return [this.tables[i][1].get(key), i + 1];   // the newest table holding the key wins\n    }\n    return [null, this.tables.length];\n  }\n\n  compact() {\n    const merged = new Map();\n    for (const [, table] of [...this.tables].reverse()) for (const [k, v] of table) merged.set(k, v);   // oldest first\n    const live = new Map([...merged].filter(([, v]) => v !== null));   // nothing older remains: tombstones can go\n    const old = this.tables.map(([n]) => n);\n    this.saveTable(live);\n    for (const n of old) fs.unlinkSync(this.path(n));\n    this.tables = this.tables.slice(0, 1);\n    return merged.size - live.size;\n  }\n}\n\nconst rand = mulberry32(9), folder = fs.mkdtempSync(path.join(os.tmpdir(), \"lsm-\"));\nlet store = new LSMStore(folder), matched = true;\nconst reference = new Map(), keys = Array.from({ length: 300 }, (_, n) => `k${String(n).padStart(3, \"0\")}`);\nconst matches = () => keys.every(k => store.get(k)[0] === (reference.get(k) ?? null));\nfor (let i = 0; i < 2000; i++) {\n  const key = keys[Math.floor(rand() * 300)], value = rand() < 0.2 ? null : Math.floor(rand() * 1000);\n  store.write(key, value);\n  reference.set(key, value);\n  if (i === 499 || i === 999 || i === 1499) {       // the process dies; at 999 it dies halfway through a record\n    if (i === 999) fs.writeSync(store.wal, '[\"k007\", 12');\n    fs.closeSync(store.wal);\n    store = new LSMStore(folder);                   // restart: tables from disk, the memtable from the log\n    matched = matched && matches();\n  }\n}\nconst before = store.tables.length;\nconst searchedBefore = Math.floor(keys.reduce((s, k) => s + store.get(k)[1], 0) * 10 / keys.length);\nstore.saveTable(store.memtable);                    // flush what's left, then merge everything\nstore.memtable = new Map();\nconst dropped = store.compact();\nconst searchedAfter = Math.floor(keys.reduce((s, k) => s + store.get(k)[1], 0) * 10 / keys.length);\nmatched = matched && matches();\nconst live = keys.filter(k => store.get(k)[0] !== null).length;\nfs.closeSync(store.wal);\nfs.rmSync(folder, { recursive: true });\nconsole.log(`2000 writes, 3 crashes, one halfway through a log record: every restart matched the reference: ${matched ? \"yes\" : \"no\"}`);\nconsole.log(`sstables: ${before} before compaction, 1 after | tables searched per read: ` +\n            `${Math.floor(searchedBefore / 10)}.${searchedBefore % 10} before, ${Math.floor(searchedAfter / 10)}.${searchedAfter % 10} after`);\nconsole.log(`live keys: ${live} | tombstones dropped by compaction: ${dropped} | records replayed from the log at the last restart: ${store.recovered}`);\nif (!matched || live !== [...reference.values()].filter(v => v !== null).length) throw new Error(\"the store lost or invented data\");\nconsole.log(\"lsm lab OK\");\n","out":"2000 writes, 3 crashes, one halfway through a log record: every restart matched the reference: yes\nsstables: 36 before compaction, 1 after | tables searched per read: 5.1 before, 1.0 after\nlive keys: 238 | tombstones dropped by compaction: 62 | records replayed from the log at the last restart: 41\nlsm lab OK\n"}]},"breakit":["Skip the fsync and simulate a power cut by dropping the last log records the OS hadn't written: which acknowledged writes vanish?","Drop tombstones while merging only the two newest tables, and watch deleted keys come back.","Write SSTables in place instead of renaming a temporary file, crash halfway, and see what the restart reads."]},{"id":"capstone","capstone":true,"t":"An event-driven order platform with sagas, outboxes and failure injection","min":1800,"mods":["m01","m02","m03","m04","m05","m07","m08","m09"],"goal":"Build a small event-driven platform the way production teams do. Order, payment and inventory services, each with its own PostgreSQL database, talk only through Kafka; an orchestrated saga with outboxes and idempotent consumers takes each order to confirmed or cancelled; a stream job computes per-minute order metrics by event time. Run it all with Docker Compose, then break it on purpose (kill brokers and services, partition the network, replay topics) and write a failure-injection report that someone else reviews.","deliver":["A design doc of three to four pages: requirements, estimates, the event catalogue with schemas and keys, the saga's state machine, a diagram, SLOs, and the trade-offs chosen, using the L2 framework and this level's review checklist.","Three services in Python or Node.js, each with its own PostgreSQL database and an outbox table, published to Kafka by a relay or Debezium; consumers dedupe through an inbox table; the order saga handles out-of-stock and declined payments with compensations.","Topics partitioned by order id, with a documented schema evolution rule; a dead-letter topic for poison messages; and a stream job (Kafka Streams, Flink or your own consumer) producing per-minute counts by event time with a watermark.","A docker-compose.yml that starts Kafka (KRaft mode, three brokers), the databases, the services and the stream job with one command, plus a load generator.","A failure-injection report: for each experiment (kill a broker, kill a service mid-saga, delay the network between two services, replay a topic from the start, send a malformed event) the hypothesis, what happened, the metrics, and the fix.","Security basics: services authenticate to Kafka and their databases with credentials from a secrets file or manager, never from code, and the API checks a JWT and the caller's right to each order."],"rubric":["No order is ever charged twice or left in a non-final state, under every experiment, and the report proves it with counts from the databases.","Every state change and its event commit together (outbox), and every consumer is idempotent; duplicate deliveries are measured, not assumed.","Partitioning keeps each order's events in order, and the doc explains w
