)\n","out":"3 6 12\nbab bb geeksskeeg\n","notes":[[4,"c // 2 and (c + 1) // 2 are equal for even c (one letter) and one apart for odd c (the gap between two letters)."],[6,"Each step outwards that still matches is one more palindrome, so counting costs nothing extra."],[16,"After the loop, lo and hi sit one step past the match on each side, so the palindrome is s[lo + 1:hi], of length hi − lo − 1."]]},{"lang":"javascript","src":"function countPalindromes(s) {\n  let total = 0;\n  for (let c = 0; c < 2 * s.length - 1; c++) {    // n letter centres and n - 1 gap centres\n    let lo = c >> 1, hi = (c + 1) >> 1;            // even c: a letter; odd c: the gap after letter c >> 1\n    while (lo >= 0 && hi < s.length && s[lo] === s[hi]) {\n      total++;                                     // s[lo..hi] is one more palindrome\n      lo--;\n      hi++;\n    }\n  }\n  return total;\n}\n\nfunction longestPalindrome(s) {\n  let bestLo = 0, bestHi = 0;                      // the best so far is s.slice(bestLo, bestHi)\n  for (let c = 0; c < 2 * s.length - 1; c++) {\n    let lo = c >> 1, hi = (c + 1) >> 1;\n    while (lo >= 0 && hi < s.length && s[lo] === s[hi]) { lo--; hi++; }\n    if (hi - lo - 1 > bestHi - bestLo) [bestLo, bestHi] = [lo + 1, hi];   // the last match was s[lo + 1..hi - 1]\n  }\n  return s.slice(bestLo, bestHi);\n}\n\nconsole.log(countPalindromes(\"abc\"), countPalindromes(\"aaa\"), countPalindromes(\"abacaba\"));\nconsole.log(longestPalindrome(\"babad\"), longestPalindrome(\"cbbd\"), longestPalindrome(\"forgeeksskeegfor\"));\n","out":"3 6 12\nbab bb geeksskeeg\n","notes":[[4,"`c >> 1` is integer halving: the same index twice for even c, two neighbours for odd c."],[19,"After the loop, lo and hi sit one step past the match on each side, so the palindrome is s.slice(lo + 1, hi)."]]}]},{"t":"Burst balloons: k is the LAST balloon burst between walls i and j","tabs":[{"lang":"python","src":"def max_coins(nums):\n    a = [1] + nums + [1]                     # two walls worth 1 that are never burst\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]         # dp[i][j]: best for the balloons strictly between i and j\n    for length in range(2, n):               # length = j - i; shorter gaps first\n        for i in range(n - length):\n            j = i + length\n            for k in range(i + 1, j):        # k = the LAST balloon burst between i and j\n                coins = dp[i][k] + dp[k][j] + a[i] * a[k] * a[j]\n                if coins > dp[i][j]:\n                    dp[i][j] = coins\n    return dp[0][n - 1]\n\nprint(max_coins([3, 1, 5, 8]), max_coins([1, 5]), max_coins([7]), max_coins([]))\n","out":"167 10 7 0","notes":[[5,"Every gap reads only narrower gaps inside it, so the narrow ones are finished first."],[9,"While k waits to be burst, it keeps its two sides apart. When it goes, its only neighbours are the walls i and j."]]},{"lang":"javascript","src":"function maxCoins(nums) {\n  const a = [1, ...nums, 1];                       // two walls worth 1 that are never burst\n  const n = a.length;\n  const dp = Array.from({ length: n }, () => new Array(n).fill(0));   // dp[i][j]: balloons strictly between i and j\n  for (let length = 2; length < n; length++) {     // length = j - i; shorter gaps first\n    for (let i = 0; i + length < n; i++) {\n      const j = i + length;\n      for (let k = i + 1; k < j; k++) {            // k = the LAST balloon burst between i and j\n        const coins = dp[i][k] + dp[k][j] + a[i] * a[k] * a[j];\n        if (coins > dp[i][j]) dp[i][j] = coins;\n      }\n    }\n  }\n  return dp[0][n - 1];\n}\n\nconsole.log(maxCoins([3, 1, 5, 8]), maxCoins([1, 5]), maxCoins([7]), maxCoins([]));\n","out":"167 10 7 0","notes":[[9,"While k waits to be burst, it keeps its two sides apart. When it goes, its only neighbours are the walls i and j."]]}]},{"t":"Minimum cost to cut a stick: a table over cut points, not positions","tabs":[{"lang":"python","src":"def min_cost(n, cuts):\n    pts = [0] + sorted(cuts) + [n]           # the cut positions, plus both ends\n    m = len(pts)\n    dp = [[0] * m for _ in range(m)]         # dp[i][j]: every cut strictly between pts[i] and pts[j]\n    for length in range(2, m):\n        for i in range(m - length):\n            j = i + length\n            # the first cut at pts[k] costs the whole piece; then the two pieces are separate\n            dp[i][j] = pts[j] - pts[i] + min(dp[i][k] + dp[k][j] for k in range(i + 1, j))\n    return dp[0][m - 1]\n\nprint(min_cost(7, [1, 3, 4, 5]), min_cost(9, [5, 6, 1, 4, 2]), min_cost(10, [2, 4, 7]))\n","out":"16 22 20","notes":[[2,"n can be 10⁶, but there are at most 100 cuts. Indexing by cut points makes the work O(m³) with m = cuts + 2, whatever n is."],[9,"Same loops as burst balloons; only the cost term differs. Here the FIRST cut splits the stick into two independent pieces."]]},{"lang":"javascript","src":"function minCost(n, cuts) {\n  const pts = [0, ...cuts.toSorted((x, y) => x - y), n];   // the cut positions, plus both ends\n  const m = pts.length;\n  const dp = Array.from({ length: m }, () => new Array(m).fill(0));   // dp[i][j]: cuts strictly between pts[i] and pts[j]\n  for (let length = 2; length < m; length++) {\n    for (let i = 0; i + length < m; i++) {\n      const j = i + length;\n      let best = Infinity;\n      for (let k = i + 1; k < j; k++) best = Math.min(best, dp[i][k] + dp[k][j]);   // first cut at pts[k]\n      dp[i][j] = pts[j] - pts[i] + best;           // that cut costs the whole piece\n    }\n  }\n  return dp[0][m - 1];\n}\n\nconsole.log(minCost(7, [1, 3, 4, 5]), minCost(9, [5, 6, 1, 4, 2]), minCost(10, [2, 4, 7]));\n","out":"16 22 20","notes":[[2,"The comparator matters: the default sort compares as strings, so [9, 10].sort() gives [10, 9]."],[9,"The first cut inside the piece splits it into two pieces that never affect each other again."]]}]}],"ex":{"q":"Minimum Score Triangulation of Polygon (LeetCode 1039): a convex polygon's vertices have values v[0..n − 1] in order. Split it into n − 2 triangles; each triangle scores the product of its three values. Find the smallest total.","steps":["Look at the edge between vertices 0 and n − 1 (in general, i and j). In every triangulation it belongs to exactly one triangle, (i, k, j), for some k between them.","That triangle leaves two smaller polygons, i..k and k..j, which are triangulated independently. So dp[i][j] = min over i < k < j of dp[i][k] + dp[k][j] + v[i] · v[k] · v[j], with dp[i][i + 1] = 0: a single edge holds no triangle.","Fill by increasing j − i and read the answer from dp[0][n − 1].","O(n²) ranges × O(n) choices of k: O(n³) time and O(n²) space. With n ≤ 50 that's under 20,000 (i, k, j) triples."],"code":{"t":"The triangle on edge (i, j) chooses k","tabs":[{"lang":"python","src":"def min_score_triangulation(values):\n    n = len(values)\n    dp = [[0] * n for _ in range(n)]         # dp[i][j]: polygon i, i + 1, ..., j; 0 when j = i + 1\n    for length in range(2, n):\n        for i in range(n - length):\n            j = i + length\n            dp[i][j] = min(dp[i][k] + dp[k][j] + values[i] * values[k] * values[j]\n                           for k in range(i + 1, j))   # the triangle on edge i-j is (i, k, j)\n    return dp[0][n - 1]\n\nprint(min_score_triangulation([1, 2, 3]), min_score_triangulation([3, 7, 4, 5]),\n      min_score_triangulation([1, 3, 1, 4, 1, 5]))\n","out":"6 144 13"},{"lang":"javascript","src":"function minScoreTriangulation(values) {\n  const n = values.length;\n  const dp = Array.from({ length: n }, () => new Array(n).fill(0));   // dp[i][j]: polygon i..j; 0 when j = i + 1\n  for (let length = 2; length < n; length++) {\n    for (let i = 0; i + length < n; i++) {\n      const j = i + length;\n      let best = Infinity;\n      for (let k = i + 1; k < j; k++)              // the triangle on edge i-j is (i, k, j)\n        best = Math.min(best, dp[i][k] + dp[k][j] + values[i] * values[k] * values[j]);\n      dp[i][j] = best;\n    }\n  }\n  return dp[0][n - 1];\n}\n\nconsole.log(minScoreTriangulation([1, 2, 3]), minScoreTriangulation([3, 7, 4, 5]),\n            minScoreTriangulation([1, 3, 1, 4, 1, 5]));\n","out":"6 144 13"}]},"a":"6, 144 and 13. A triangle has only one triangulation: 1 · 2 · 3 = 6. For [3, 7, 4, 5] the diagonal 0–2 gives 3 · 7 · 4 + 3 · 4 · 5 = 144 and the diagonal 1–3 gives 3 · 7 · 5 + 7 · 4 · 5 = 245, so the DP keeps 144. The hidden tests check every answer against a brute force that clips ears in every possible order."},"fade":{"q":"Palindrome Partitioning II (LeetCode 132): cut s into pieces that are all palindromes, with as few cuts as possible. “aab” needs 1 cut: “aa” | “b”.","steps":["First build pal[i][j]: s[i..j] is a palindrome when s[i] == s[j] and the inside is shorter than 2 or a palindrome. Run i downwards so pal[i + 1][j − 1] is ready when you need it.",{"ask":"What does cuts[j] mean, and when is it 0?","a":"The fewest cuts for the prefix s[0..j]. It's 0 when s[0..j] is itself a palindrome."},{"ask":"Otherwise, how do you compute cuts[j]?","a":"Every partition of s[0..j] has a last piece s[i..j], and it must be a palindrome. So cuts[j] is the minimum of cuts[i − 1] + 1 over every i ≥ 1 with pal[i][j]. i = j always qualifies, because one letter is a palindrome."},{"ask":"Time and space?","a":"O(n²) time: the table, then O(j) choices for each j. O(n²) space for pal (cuts is O(n)). For n = 2,000 that's 4 million cells, where a split-point interval DP would need O(n³) time."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def min_cut(s):\n    n = len(s)\n    pal = [[False] * n for _ in range(n)]    # pal[i][j]: is s[i..j] a palindrome?\n    for i in range(n - 1, -1, -1):           # i downwards, so pal[i + 1][...] is ready\n        for j in range(i, n):\n            pal[i][j] = s[i] == s[j] and (j - i < 2 or pal[i + 1][j - 1])\n    cuts = [0] * n                           # cuts[j]: fewest cuts for s[0..j]\n    for j in range(n):\n        ...                                  # TODO: 0 if s[0..j] is a palindrome, else try every last piece s[i..j]\n    return cuts[n - 1]\n\nprint(min_cut(\"aab\"))   # expect 1\n"},{"lang":"javascript","src":"function minCut(s) {\n  const n = s.length;\n  const pal = Array.from({ length: n }, () => new Array(n).fill(false));   // pal[i][j]: is s[i..j] a palindrome?\n  for (let i = n - 1; i >= 0; i--)                 // i downwards, so pal[i + 1][...] is ready\n    for (let j = i; j < n; j++) pal[i][j] = s[i] === s[j] && (j - i < 2 || pal[i + 1][j - 1]);\n  const cuts = new Array(n).fill(0);               // cuts[j]: fewest cuts for s[0..j]\n  for (let j = 0; j < n; j++) {\n    // TODO: 0 if s[0..j] is a palindrome, else try every last piece s[i..j]\n  }\n  return cuts[n - 1];\n}\n\nconsole.log(minCut(\"aab\"));   // expect 1\n"}]},"solution":{"t":"Solution: a palindrome table plus cuts over prefixes","tabs":[{"lang":"python","src":"def min_cut(s):\n    n = len(s)\n    pal = [[False] * n for _ in range(n)]    # pal[i][j]: is s[i..j] a palindrome?\n    for i in range(n - 1, -1, -1):           # i downwards, so pal[i + 1][...] is ready\n        for j in range(i, n):\n            pal[i][j] = s[i] == s[j] and (j - i < 2 or pal[i + 1][j - 1])\n    cuts = [0] * n                           # cuts[j]: fewest cuts for s[0..j]\n    for j in range(n):\n        if not pal[0][j]:                    # a palindromic prefix needs no cut at all\n            cuts[j] = min(cuts[i - 1] + 1 for i in range(1, j + 1) if pal[i][j])   # last piece s[i..j]\n    return cuts[n - 1]\n\nprint(min_cut(\"aab\"), min_cut(\"a\"), min_cut(\"abccbc\"), min_cut(\"banana\"), min_cut(\"abcde\"))\n","out":"1 0 2 1 4"},{"lang":"javascript","src":"function minCut(s) {\n  const n = s.length;\n  const pal = Array.from({ length: n }, () => new Array(n).fill(false));   // pal[i][j]: is s[i..j] a palindrome?\n  for (let i = n - 1; i >= 0; i--)                 // i downwards, so pal[i + 1][...] is ready\n    for (let j = i; j < n; j++) pal[i][j] = s[i] === s[j] && (j - i < 2 || pal[i + 1][j - 1]);\n  const cuts = new Array(n).fill(0);               // cuts[j]: fewest cuts for s[0..j]\n  for (let j = 0; j < n; j++) {\n    if (pal[0][j]) continue;                       // a palindromic prefix needs no cut at all\n    let best = Infinity;\n    for (let i = 1; i <= j; i++) if (pal[i][j]) best = Math.min(best, cuts[i - 1] + 1);   // last piece s[i..j]\n    cuts[j] = best;\n  }\n  return cuts[n - 1];\n}\n\nconsole.log(minCut(\"aab\"), minCut(\"a\"), minCut(\"abccbc\"), minCut(\"banana\"), minCut(\"abcde\"));\n","out":"1 0 2 1 4"}]}},"traps":[["“Fill dp[i][j] row by row, with i going up from 0.”","dp[i][j] reads row i + 1, which that order hasn't filled yet, so it silently uses the starting zeros. Loop by increasing length, or run i downwards and j upwards."],["“In burst balloons, choose which balloon to burst first.”","After the first burst its two neighbours touch, so the left and right parts still affect each other. Choose the last balloon k between walls i and j: until it bursts, it keeps the two sides apart."],["“A table of n² cells means O(n²) time.”","Each cell of a split-point DP tries O(n) values of k, so it's O(n³) time with O(n²) space. Only the peel-off-the-ends shape costs O(1) per cell."],["“Cutting a stick needs a table over every position 0..n.”","n can be 10⁶, but there are at most 100 cuts. Index the table by the sorted cut points with 0 and n added: O(m³) time and O(m²) space for m = cuts + 2, whatever n is."],["“Expanding around the n letters finds every palindrome.”","Even-length palindromes such as “abba” are centred on the gap between two letters. Try all 2n − 1 centres: n letters and n − 1 gaps."],["“Longest palindromic substring and subsequence share a recurrence.”","A substring must be contiguous: pal[i][j] needs s[i] == s[j] and pal[i + 1][j − 1]. A subsequence may skip letters, so on a mismatch it takes max(dp[i + 1][j], dp[i][j − 1])."]],"disc":[["Why does choosing the last balloon make the two sides independent?","dp[i][j] assumes i and j are still standing while every balloon between them bursts. If k bursts last, then until that moment it stands between its left and right sides, so no balloon on one side ever becomes a neighbour of a balloon on the other. The left side is exactly the problem (i, k) and the right side is (k, j). When k finally bursts, only i and j are beside it, so it earns a[i] · a[k] · a[j]. Choosing the first burst instead makes two balloons from different sides neighbours, so the halves aren't separate problems."],["O(n³) is too slow for n = 2,000. What can you try?","First check whether the problem needs a split point at all: many palindrome problems need only an O(n²) table plus a 1-D DP. For split-point DPs whose cost depends only on i and j and satisfies the quadrangle inequality (cutting a stick does), Knuth's optimisation limits k to the range opt[i][j − 1]..opt[i + 1][j], which makes the whole DP O(n²). Otherwise look for a different state or a greedy rule, and prove it against a brute force first."]],"teach":{"prompt":"Explain to a junior colleague how burst balloons is solved with interval DP, and why the obvious first idea fails.","rubric":["Pads the array with a 1 at each end, as walls that never burst","dp[i][j] = the most coins from the balloons strictly between i and j","Chooses the LAST balloon k to burst, so the two sides are independent","dp[i][j] = max over k of dp[i][k] + dp[k][j] + a[i] · a[k] · a[j], filled by increasing j − i","O(n³) time and O(n²) space"],"model":"Add a balloon worth 1 at each end; these walls never burst. Let dp[i][j] be the most coins from bursting every balloon strictly between positions i and j while i and j are still standing. The obvious idea, choosing the first balloon to burst, fails: its two neighbours become adjacent, so the two sides keep affecting each other. Instead choose the balloon k that bursts last in the range. Until then it separates the two sides, so they are the independent problems dp[i][k] and dp[k][j]. When k finally bursts, its neighbours are i and j, which earns a[i] · a[k] · a[j]. Take the maximum over k, fill the table by increasing gap j − i, and read the answer from dp[0][n + 1] for n balloons. There are O(n²) ranges and O(n) choices of k, so it's O(n³) time and O(n²) space."},"qa":[["In what order is an interval DP table filled?","By increasing range length, because each range reads only shorter ranges inside it."],["Burst balloons recurrence?","dp[i][j] = max over i < k < j of dp[i][k] + dp[k][j] + a[i] · a[k] · a[j], where k is the last balloon burst."],["How many centres does expand-around-centre try?","2n − 1: n letters for odd lengths and n − 1 gaps for even lengths."],["Time and space of a split-point interval DP?","O(n³) time (O(n²) ranges × O(n) split points) and O(n²) space."],["Minimum cost to cut a stick: what indexes the table?","The sorted cut positions with 0 and n added, not the positions 0..n."],["Palindrome partitioning II in O(n²)?","Build pal[i][j]; cuts[j] = 0 if s[0..j] is a palindrome, else the minimum of cuts[i − 1] + 1 over palindromic s[i..j]."]],"quiz":[{"q":"What does this print?","snip":{"t":"Centres on letters only","tabs":[{"lang":"python","src":"def count(s):\n    total = 0\n    for c in range(len(s)):              # centres on letters only\n        lo = hi = c\n        while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n            total += 1\n            lo, hi = lo - 1, hi + 1\n    return total\n\nprint(count(\"abba\"))\n"},{"lang":"javascript","src":"function count(s) {\n  let total = 0;\n  for (let c = 0; c < s.length; c++) {   // centres on letters only\n    let lo = c, hi = c;\n    while (lo >= 0 && hi < s.length && s[lo] === s[hi]) { total++; lo--; hi++; }\n  }\n  return total;\n}\n\nconsole.log(count(\"abba\"));\n"}]},"o":["4","6","5","2"],"a":0,"e":"Each of the 4 letters is a palindrome, and no longer odd-length palindrome exists in “abba”. “bb” and “abba” have even length, so they're centred on gaps, which this loop never tries. With all 2n − 1 centres the count is 6."},{"q":"What does this print? (Merging two neighbouring piles costs the size of the new pile.)","snip":{"t":"Merge neighbouring piles","tabs":[{"lang":"python","src":"piles = [3, 4, 5]\nn = len(piles)\npre = [0]\nfor p in piles:\n    pre.append(pre[-1] + p)              # pre[j + 1] - pre[i] = piles i..j\ndp = [[0] * n for _ in range(n)]\nfor length in range(2, n + 1):\n    for i in range(n - length + 1):\n        j = i + length - 1\n        dp[i][j] = min(dp[i][k] + dp[k + 1][j] for k in range(i, j)) + pre[j + 1] - pre[i]\nprint(dp[0][n - 1])\n"},{"lang":"javascript","src":"const piles = [3, 4, 5], n = piles.length;\nconst pre = [0];\nfor (const p of piles) pre.push(pre.at(-1) + p);   // pre[j + 1] - pre[i] = piles i..j\nconst dp = Array.from({ length: n }, () => new Array(n).fill(0));\nfor (let length = 2; length <= n; length++)\n  for (let i = 0; i + length <= n; i++) {\n    const j = i + length - 1;\n    let best = Infinity;\n    for (let k = i; k < j; k++) best = Math.min(best, dp[i][k] + dp[k + 1][j]);\n    dp[i][j] = best + pre[j + 1] - pre[i];\n  }\nconsole.log(dp[0][n - 1]);\n"}]},"o":["19","21","12","24"],"a":0,"e":"dp[0][1] = 7 and dp[1][2] = 9. Both splits of the whole row then pay the final pile of 12: 7 + 12 = 19 (merge 3 and 4 first) or 9 + 12 = 21 (merge 4 and 5 first). The DP keeps the minimum, 19."},{"q":"Why does the burst balloons DP choose the LAST balloon burst between i and j, rather than the first?","o":["When k bursts last, its neighbours are exactly i and j, and the balloons on its two sides never meet","The last balloon always earns the most coins","It halves the size of the table","Bursting in reverse order always earns the same coins"],"a":0,"e":"Choosing the last balloon splits the range into two independent problems. The first burst would make its two neighbours touch, linking the sides. The table size is O(n²) either way, and the order of bursts changes the coins."},{"q":"Which problems have the split-point shape, dp[i][j] = the best over k of (left part + right part) + a cost? (choose 3)","t":"ms","o":["Minimum score triangulation of a polygon","Minimum cost to cut a stick","Matrix chain multiplication","Counting palindromic substrings","Longest increasing subsequence"],"a":[0,1,2],"e":"Each one picks a split point k (a triangle's third vertex, the first cut, the last multiplication) and adds two smaller ranges. Counting palindromes only peels off the ends, and LIS is a 1-D DP over prefixes."},{"q":"Judge each statement.","t":"yn","s":[["Expanding around centres counts every palindromic substring in O(n²) time and O(1) extra space.",true],["A string of length n has n possible palindrome centres.",false],["If dp[i][j] reads dp[i + 1][j − 1], a loop with i going up from 0 reads cells it hasn't filled yet.",true],["Burst balloons with n balloons runs in O(n²) time.",false]],"e":"Each centre grows in O(n) at most, with no table. There are 2n − 1 centres, counting the gaps. Row i + 1 is filled after row i in that order. Burst balloons tries O(n) values of k for each of O(n²) ranges: O(n³)."},{"q":"Put the bottom-up interval DP in order.","t":"ord","items":["Set the base case for the shortest ranges","Loop over the range length, shortest first","Inside it, loop over the start i and work out j from i and the length","Try every split point k between i and j and keep the best","Read the answer from dp[0][n − 1]"],"e":"Each loop sits inside the one before, and every range reads only shorter, already-finished ranges. The answer is the full range, which is filled last."},{"q":"Complete the Python burst balloons DP.","t":"drop","lang":"python","code":"def max_coins(nums):\n    a = [1] + nums + [1]\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]\n    for length in {{0}}:\n        for i in range(n - length):\n            j = i + length\n            for k in range(i + 1, j):\n                dp[i][j] = max(dp[i][j], {{1}} + {{2}})\n    return dp[0][n - 1]\n","blanks":[{"o":["range(2, n)","range(n - 1, 1, -1)","range(2, n - 1)","range(3, n)"],"a":0},{"o":["dp[i][k] + dp[k][j]","dp[i][k] + dp[k + 1][j]","dp[i + 1][k] + dp[k][j - 1]","dp[i][k - 1] + dp[k + 1][j]"],"a":0},{"o":["a[i] * a[k] * a[j]","a[k - 1] * a[k] * a[k + 1]","a[i] * a[j]","a[k] * a[k]"],"a":0}],"e":"Gaps go from 2 (one balloon inside) up to the full row, n − 1, shortest first. The two sides of the last balloon k are (i, k) and (k, j), sharing k as a wall, and k earns a[i] · a[k] · a[j]: its neighbours at the end are the walls, not its original neighbours a[k − 1] and a[k + 1]."},{"q":"Match each problem to the idea that solves it.","t":"match","pairs":[["Count palindromic substrings with O(1) extra space","Expand around each of the 2n − 1 centres"],["Burst balloons for the most coins","Choose the last balloon k between walls i and j"],["The fewest cuts so that every piece is a palindrome","A pal[i][j] table plus a 1-D cuts array"],["Triangulate a convex polygon at the least score","Try every triangle (i, k, j) on the edge i–j"]],"extra":["Binary search on the answer"],"e":"Centres for counting, the last balloon for independence, a palindrome table for partitioning, and the triangle on a fixed edge for triangulation."}],"probs":[["LC 647 · Palindromic Substrings","https://leetcode.com/problems/palindromic-substrings/","Medium","expand around all 2n − 1 centres; each step outwards that matches is one more"],["LC 5 · Longest Palindromic Substring","https://leetcode.com/problems/longest-palindromic-substring/","Medium","the same expansion; keep the widest bounds seen"],["LC 132 · Palindrome Partitioning II","https://leetcode.com/problems/palindrome-partitioning-ii/","Hard","the faded example: a pal[i][j] table, then cuts over prefixes"],["LC 1039 · Minimum Score Triangulation of Polygon","https://leetcode.com/problems/minimum-score-triangulation-of-polygon/","Medium","the worked example: the triangle on edge (i, j) chooses k"],["LC 312 · Burst Balloons","https://leetcode.com/problems/burst-balloons/","Hard","pad with 1s; k is the LAST balloon burst between i and j"],["LC 1000 · Minimum Cost to Merge Stones","https://leetcode.com/problems/minimum-cost-to-merge-stones/","Hard","impossible unless (n − 1) % (k − 1) == 0; add the range sum when i..j can become one pile"],["LC 664 · Strange Printer","https://leetcode.com/problems/strange-printer/","Hard","the turn that prints s[i] can stretch to a later equal letter at k: dp[i + 1][k − 1] + dp[k][j]"],["LC 1547 · Minimum Cost to Cut a Stick","https://leetcode.com/problems/minimum-cost-to-cut-a-stick/","Hard","sort the cuts and add 0 and n; the table is over cut indexes, not positions"]],"src":[["USACO Guide: Range DP","https://usaco.guide/gold/dp-ranges"],["Jeff Erickson, Algorithms (chapter 3, Dynamic Programming)","https://jeffe.cs.illinois.edu/teaching/algorithms/"],["Wikipedia: Matrix chain multiplication","https://en.wikipedia.org/wiki/Matrix_chain_multiplication"],["cp-algorithms: Knuth's optimization","https://cp-algorithms.com/dynamic_programming/knuth-optimization.html"]]},{"id":"m05","d":"d2","t":"Bitmask dynamic programming","min":110,"hook":"When the input is tiny (n ≤ 20) but the answer depends on which items are already used, store that set as the bits of one integer and index a DP table with it. 2ⁿ sets replace n! orders. That's how the travelling salesman problem is solved exactly for small n (the Held–Karp algorithm), and how “assign every task”, “visit every node” and “split into groups” problems are cracked in contests and interviews.","pre":{"q":"Eight workers each need a different job, and trying every assignment means 8! = 40,320 orders. Two partial plans have given the first four workers the same four jobs, but in different ways. What do the two plans have in common, and why does that help?","a":"Their futures are identical: the last four workers must share the same four remaining jobs, whoever took which job so far. So only the cheaper of the two plans matters, and you need just one best cost for each set of used jobs: 2⁸ = 256 sets instead of 40,320 orders."},"kid":{"t":"The road-trip sticker card","x":"On the road trip, Tara and Ben want to visit the castle, the beach, the zoo and the farm, starting and ending at home, with as little driving as possible. Tara's card has four boxes, and she ticks one after each visit. Ben keeps a notebook page for every pattern of ticks and every place they could be standing, holding the shortest drive that gets there. Two routes with the same ticks that end in the same place have the same future, so he keeps only the shorter one. Four places give 16 tick patterns; even 15 places give only 32,768, against 1.3 trillion orders.","map":[["The four boxes on Tara's card","A bitmask: bit i is 1 when place i has been visited"],["Ticking a box after a visit","`mask | 1 << i`"],["A notebook page for each tick pattern and standing place","The state dp[mask][last]"],["Keeping only the shorter of two routes on the same page","dp[mask][last] = the minimum over every way to get there"],["16 tick patterns for 4 places","2ⁿ masks for n items"]],"brk":"Ben's card could have 40 boxes, but 2⁴⁰ × 40 pages is about 44 trillion: bitmask DP is only practical up to about n = 20. A computer's card has its own edge too: JavaScript's bit operators use 32-bit integers, so `1 << 31` is already negative."},"keys":["**A mask is a set**: bit i of an integer says whether item i is in it. `mask >> i & 1` tests item i, `mask | 1 << i` adds it, `mask & ~(1 << i)` removes it, and `(1 << n) - 1` is the set of all n items.","**When it fits**: the DP must remember which of n items are used, and n is at most about 20. 2²⁰ = 1,048,576 masks; with O(n) work per mask that's about 2 × 10⁷ steps.","**The assignment pattern**: dp[mask] = the best cost when the tasks in mask go to the first popcount(mask) people. The next person is always popcount(mask), so the state doesn't need to store it. O(2ⁿ · n) time and O(2ⁿ) space.","**Held–Karp TSP**: dp[mask][last] = the shortest path that starts at city 0, visits exactly the cities in mask and ends at last. Extend it to each city not yet in mask, then close the tour back to 0. O(2ⁿ · n²) time and O(2ⁿ · n) space, against O(n!) for trying every order.","**BFS over (node, mask)**: when every step costs 1 and the walk may revisit nodes, the state is where you are plus who you've seen. LC 847 has n · 2ⁿ states and runs in O(2ⁿ · (n + E)) time and O(2ⁿ · n) space.","**Submask enumeration**: `sub = (sub - 1) & mask` steps through every submask of mask, largest first. Summed over all masks that's 3ⁿ steps, because each bit is outside the mask, in the mask only, or in both: 3¹⁴ ≈ 4.8 million for n = 14.","**Speed and memory**: keep tables flat. In Python a list of 2ⁿ slots (or 2ⁿ · n, indexed `mask * n + last`) beats dicts and nested lists; in JavaScript typed arrays (`Int32Array`, `Float64Array`) are compact and start zero-filled. Python 3.10+ has `mask.bit_count()`; JavaScript has no popcount, so count bits with a loop or a table.","**JavaScript bits are 32-bit**: `&`, `|`, `^` and `<<` convert their operands to 32-bit integers, so masks are safe up to n = 30. `1 << 31` is −2147483648, and `1 << 32` is 1 because the shift count is taken mod 32. Python's ints never overflow."],"dia":[{"type":"cells","cap":"Every submask of 1011 (11), in the order `sub = (sub - 1) & mask` visits them","idx":false,"rows":[{"label":"binary","vals":["1011","1010","1001","1000","0011","0010","0001","0000"],"hl":[0]},{"label":"decimal","vals":[11,10,9,8,3,2,1,0]}],"note":"Subtracting 1 clears the lowest set bit and sets every bit below it; `& mask` then keeps only the bits that belong to the mask. Three set bits give 2³ = 8 submasks, ending at 0."},{"type":"graph","cap":"Held–Karp on four cities: the shortest tour is 80","h":220,"nodes":[["1",10,8],["3",90,8],["0",50,26],["2",50,56]],"edges":[["1","3","25"],["0","1","10"],["0","3","20"],["0","2","15"],["1","2","35"],["3","2","30"]],"hl":["0"],"hle":[["0","1"],["1","3"],["3","2"],["2","0"]],"note":"The tour 0 → 1 → 3 → 2 → 0 costs 10 + 25 + 30 + 15 = 80. The DP closes it from dp[all][last] + dist[last][0]: last = 2 gives 65 + 15 and last = 1 gives 70 + 10, the same tour in opposite directions."}],"cmp":[{"cap":"Four bitmask patterns","head":["Pattern","State","Step","Time / space"],"rows":[["Assignment (LC 1879)","dp[mask]; the next person is popcount(mask)","Give that person a free task j","O(2ⁿ · n) / O(2ⁿ)"],["Held–Karp TSP","dp[mask][last]","Drive on to a city not in mask","O(2ⁿ · n²) / O(2ⁿ · n)"],["Visit every node, unit steps (LC 847)","BFS over (node, mask)","Move along an edge and set its bit","O(2ⁿ · (n + E)) / O(2ⁿ · n)"],["Split into groups (LC 1986)","dp[mask] over the items used","Add one valid submask as a group","O(3ⁿ) / O(2ⁿ)"]]},{"cap":"Python and JavaScript for 2²⁰ states","head":["","Python","JavaScript"],"rows":[["The table","A flat list: `[INF] * (1 << n)`","A typed array: `new Float64Array(1 << n)`"],["Infinity","`float(\"inf\")` mixes freely with ints","Fine in a `Float64Array`; an `Int32Array` stores it as 0"],["Popcount","`mask.bit_count()` (Python 3.10+)","No built-in: loop `m &= m - 1`, or precompute a table"],["Index of the lowest set bit","`(m & -m).bit_length() - 1`","`31 - Math.clz32(m & -m)`"],["Bit operators","Unbounded ints: any n","32-bit: safe up to n = 30"]]}],"code":[{"t":"The assignment pattern: the next person is popcount(mask)","tabs":[{"lang":"python","src":"def minimum_xor_sum(nums1, nums2):\n    n = len(nums1)\n    INF = float(\"inf\")\n    dp = [INF] * (1 << n)                    # dp[mask]: best sum pairing nums1[:k] with the nums2 items in mask\n    dp[0] = 0\n    for mask in range(1 << n):               # every mask is final before it's used\n        i = mask.bit_count()                 # k = popcount(mask): nums1[k] is next\n        for j in range(n):\n            if not mask >> j & 1:            # nums2[j] is still free\n                new = mask | 1 << j\n                dp[new] = min(dp[new], dp[mask] + (nums1[i] ^ nums2[j]))\n    return dp[(1 << n) - 1]\n\nprint(minimum_xor_sum([1, 2], [2, 3]), minimum_xor_sum([1, 0, 3], [5, 3, 4]),\n      minimum_xor_sum([72, 97, 8, 32, 15], [63, 97, 57, 60, 83]))\n","out":"2 8 152","notes":[[7,"People are served in a fixed order, so the number of used tasks says whose turn it is: the state needs no person index."],[11,"A new mask has one more bit, so it's a bigger number than mask, and the loop reaches it only after every way in has been tried."]]},{"lang":"javascript","src":"function minimumXorSum(nums1, nums2) {\n  const n = nums1.length;\n  const dp = new Float64Array(1 << n).fill(Infinity);   // dp[mask]: best sum pairing nums1[0..k-1] with mask\n  dp[0] = 0;\n  for (let mask = 0; mask < 1 << n; mask++) {           // every mask is final before it's used\n    let i = 0;\n    for (let m = mask; m; m &= m - 1) i++;              // popcount: nums1[i] is next\n    for (let j = 0; j < n; j++) {\n      if ((mask >> j & 1) === 0) {                      // nums2[j] is still free\n        const next = mask | 1 << j;\n        dp[next] = Math.min(dp[next], dp[mask] + (nums1[i] ^ nums2[j]));\n      }\n    }\n  }\n  return dp[(1 << n) - 1];\n}\n\nconsole.log(minimumXorSum([1, 2], [2, 3]), minimumXorSum([1, 0, 3], [5, 3, 4]),\n            minimumXorSum([72, 97, 8, 32, 15], [63, 97, 57, 60, 83]));\n","out":"2 8 152","notes":[[3,"A Float64Array holds Infinity; an Int32Array would silently store 0 instead."],[7,"No popcount built-in: `m &= m - 1` clears one set bit per step."]]}]},{"t":"Held–Karp TSP: dp[mask][last] in one flat table","tabs":[{"lang":"python","src":"def tsp(dist):\n    n = len(dist)\n    INF = float(\"inf\")\n    full = 1 << n\n    dp = [INF] * (full * n)                  # dp[mask * n + last]: one flat list\n    dp[1 * n + 0] = 0                        # mask {0} (= 1), standing at city 0\n    for mask in range(1, full, 2):           # odd masks only: city 0 is always in the set\n        for last in range(n):\n            cur = dp[mask * n + last]\n            if cur == INF:\n                continue                     # no path visits exactly mask and ends at last\n            for nxt in range(n):\n                if not mask >> nxt & 1:      # drive on to a city not visited yet\n                    i = (mask | 1 << nxt) * n + nxt\n                    if cur + dist[last][nxt] < dp[i]:\n                        dp[i] = cur + dist[last][nxt]\n    return min(dp[(full - 1) * n + last] + dist[last][0] for last in range(1, n))\n\ndist4 = [[0, 10, 15, 20], [10, 0, 35, 25], [15, 35, 0, 30], [20, 25, 30, 0]]\ndist5 = [[0, 3, 4, 2, 7], [3, 0, 4, 6, 3], [4, 4, 0, 5, 8], [2, 6, 5, 0, 6], [7, 3, 8, 6, 0]]\nprint(tsp(dist4), tsp(dist5))\n","out":"80 19","notes":[[5,"A flat list of 2ⁿ · n slots is much smaller and faster than a dict keyed by (mask, last) pairs."],[7,"Every real path contains city 0, so even masks are never reached; stepping by 2 halves the work."],[17,"Each complete path closes the tour by driving from its last city back to city 0."]]},{"lang":"javascript","src":"function tsp(dist) {\n  const n = dist.length, full = 1 << n;\n  const dp = new Float64Array(full * n).fill(Infinity);   // dp[mask * n + last]: one flat typed array\n  dp[1 * n + 0] = 0;                                      // mask {0} (= 1), standing at city 0\n  for (let mask = 1; mask < full; mask += 2) {            // odd masks only: city 0 is always in the set\n    for (let last = 0; last < n; last++) {\n      const cur = dp[mask * n + last];\n      if (cur === Infinity) continue;                     // no path visits exactly mask and ends at last\n      for (let nxt = 0; nxt < n; nxt++) {\n        if ((mask >> nxt & 1) === 0) {                    // drive on to a city not visited yet\n          const i = (mask | 1 << nxt) * n + nxt;\n          if (cur + dist[last][nxt] < dp[i]) dp[i] = cur + dist[last][nxt];\n        }\n      }\n    }\n  }\n  let best = Infinity;\n  for (let last = 1; last < n; last++) best = Math.min(best, dp[(full - 1) * n + last] + dist[last][0]);\n  return best;                                            // the tour closes by driving back to city 0\n}\n\nconst dist4 = [[0, 10, 15, 20], [10, 0, 35, 25], [15, 35, 0, 30], [20, 25, 30, 0]];\nconst dist5 = [[0, 3, 4, 2, 7], [3, 0, 4, 6, 3], [4, 4, 0, 5, 8], [2, 6, 5, 0, 6], [7, 3, 8, 6, 0]];\nconsole.log(tsp(dist4), tsp(dist5));\n","out":"80 19","notes":[[3,"One Float64Array of 2ⁿ · n slots, indexed `mask * n + last`, instead of 2ⁿ small arrays."],[5,"Every real path contains city 0, so even masks are never reached; stepping by 2 halves the work."]]}]},{"t":"Submask enumeration: the fewest work sessions in O(3ⁿ)","tabs":[{"lang":"python","src":"def min_sessions(tasks, session_time):\n    n = len(tasks)\n    full = 1 << n\n    total = [0] * full                       # total[mask]: time of the tasks in mask\n    for mask in range(1, full):\n        low = mask & -mask                   # the lowest set bit\n        total[mask] = total[mask ^ low] + tasks[low.bit_length() - 1]\n    dp = [0] + [n] * (full - 1)              # dp[mask]: fewest sessions for the tasks in mask\n    for mask in range(1, full):\n        sub = mask\n        while sub:                           # every non-empty submask of mask\n            if total[sub] <= session_time:   # sub fits in one session\n                dp[mask] = min(dp[mask], dp[mask ^ sub] + 1)\n            sub = (sub - 1) & mask\n    return dp[full - 1]\n\nprint(min_sessions([1, 2, 3], 3), min_sessions([3, 1, 3, 1, 1], 8), min_sessions([1, 2, 3, 4, 5], 15))\n","out":"2 2 1","notes":[[6,"In two's complement, `mask & -mask` keeps only the lowest set bit, so each total is O(1): O(2ⁿ) for the whole table."],[14,"Subtracting 1 drops below sub, and `& mask` throws away bits outside the mask. Over all masks this loop runs 3ⁿ times."]]},{"lang":"javascript","src":"function minSessions(tasks, sessionTime) {\n  const n = tasks.length, full = 1 << n;\n  const total = new Int32Array(full);                   // total[mask]: time of the tasks in mask\n  for (let mask = 1; mask < full; mask++) {\n    const low = mask & -mask;                           // the lowest set bit\n    total[mask] = total[mask ^ low] + tasks[31 - Math.clz32(low)];\n  }\n  const dp = new Int32Array(full).fill(n);              // dp[mask]: fewest sessions for the tasks in mask\n  dp[0] = 0;\n  for (let mask = 1; mask < full; mask++) {\n    for (let sub = mask; sub; sub = (sub - 1) & mask) { // every non-empty submask of mask\n      if (total[sub] <= sessionTime) dp[mask] = Math.min(dp[mask], dp[mask ^ sub] + 1);\n    }\n  }\n  return dp[full - 1];\n}\n\nconsole.log(minSessions([1, 2, 3], 3), minSessions([3, 1, 3, 1, 1], 8), minSessions([1, 2, 3, 4, 5], 15));\n","out":"2 2 1","notes":[[6,"`31 - Math.clz32(low)` turns a single bit back into its index, like Python's `bit_length() - 1`."],[11,"The for-loop form of `sub = (sub - 1) & mask`; it stops before the empty submask 0."]]}]}],"ex":{"q":"Shortest Path Visiting All Nodes (LeetCode 847): an undirected, connected graph has n ≤ 12 nodes. Find the length of the shortest walk that visits every node. You may start and end anywhere and reuse nodes and edges.","steps":["Every edge costs 1, so BFS finds shortest walks. But a walk may pass through a node twice, so the node alone can't be the state: the state is (node, mask of the nodes seen so far).","The walk may start anywhere, so start from all n states (i, 1 << i) at distance 0 at once: a multi-source BFS.","From (u, mask), move to each neighbour v: (v, mask | 1 << v). BFS pops states in order of distance, so the first state popped with the full mask holds the answer.","n · 2ⁿ states, and each one scans its node's edges: O(2ⁿ · (n + E)) time and O(2ⁿ · n) space. For n = 12 that's 49,152 states."],"code":{"t":"BFS over (node, mask)","tabs":[{"lang":"python","src":"from collections import deque\n\ndef shortest_path_length(graph):\n    n = len(graph)\n    full = (1 << n) - 1\n    dist = [-1] * (n << n)                   # dist[u << n | mask]; -1 = not reached yet\n    q = deque()\n    for u in range(n):                       # the walk may start anywhere: every node is a source\n        dist[u << n | 1 << u] = 0\n        q.append((u, 1 << u))\n    while q:\n        u, mask = q.popleft()\n        d = dist[u << n | mask]\n        if mask == full:\n            return d                         # BFS pops states in order of distance\n        for v in graph[u]:\n            nxt = mask | 1 << v\n            if dist[v << n | nxt] == -1:\n                dist[v << n | nxt] = d + 1\n                q.append((v, nxt))\n\nprint(shortest_path_length([[1, 2, 3], [0], [0], [0]]), shortest_path_length([[1], [0, 2, 4], [1, 3, 4], [2], [1, 2]]),\n      shortest_path_length([[1], [0, 2], [1]]), shortest_path_length([[]]))\n","out":"4 4 2 0"},{"lang":"javascript","src":"function shortestPathLength(graph) {\n  const n = graph.length, full = (1 << n) - 1;\n  const dist = new Int32Array(n << n).fill(-1);       // dist[u << n | mask]; -1 = not reached yet\n  const qu = [], qm = [];                             // the queue: two arrays read with a head index\n  for (let u = 0; u < n; u++) {                       // the walk may start anywhere: every node is a source\n    dist[u << n | 1 << u] = 0;\n    qu.push(u);\n    qm.push(1 << u);\n  }\n  for (let head = 0; head < qu.length; head++) {\n    const u = qu[head], mask = qm[head], d = dist[u << n | mask];\n    if (mask === full) return d;                      // BFS pops states in order of distance\n    for (const v of graph[u]) {\n      const next = mask | 1 << v;\n      if (dist[v << n | next] === -1) {\n        dist[v << n | next] = d + 1;\n        qu.push(v);\n        qm.push(next);\n      }\n    }\n  }\n}\n\nconsole.log(shortestPathLength([[1, 2, 3], [0], [0], [0]]), shortestPathLength([[1], [0, 2, 4], [1, 3, 4], [2], [1, 2]]),\n            shortestPathLength([[1], [0, 2], [1]]), shortestPathLength([[]]));\n","out":"4 4 2 0"}]},"a":"4, 4, 2 and 0. In the star [[1, 2, 3], [0], [0], [0]] the best walk is 1 → 0 → 2 → 0 → 3: node 0 is visited three times, which is why the state must include the mask. A single node needs no steps. The hidden tests compare every answer with a brute force that tries every visiting order over all-pairs BFS distances."},"fade":{"q":"Beautiful Arrangement (LeetCode 526): count the permutations of 1..n where, at every position p (1-indexed), the number x placed there satisfies x % p == 0 or p % x == 0. n ≤ 15.","steps":["Fill positions 1, 2, 3, … in order. Then the state only needs the set of numbers already used: a mask, with number x in bit x − 1.",{"ask":"Which position does a mask fill next?","a":"popcount(mask) + 1: the numbers in mask fill exactly the first popcount(mask) positions."},{"ask":"What does dp[mask] count, and how does it move forward?","a":"The ways to fill positions 1..popcount(mask) using exactly the numbers in mask. For each unused x that suits the next position, add dp[mask] to dp[mask | 1 << (x − 1)]."},{"ask":"Time and space?","a":"O(2ⁿ · n) time and O(2ⁿ) space: about 500,000 steps for n = 15."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def count_arrangement(n):\n    dp = [0] * (1 << n)                      # dp[mask]: ways to fill positions 1..popcount(mask) with mask's numbers\n    dp[0] = 1\n    for mask in range(1 << n):\n        if dp[mask] == 0:\n            continue\n        pos = mask.bit_count() + 1           # the next position to fill\n        for x in range(1, n + 1):\n            ...                              # TODO: if x is unused and suits pos, add dp[mask] to the bigger mask\n    return dp[(1 << n) - 1]\n\nprint(count_arrangement(2))   # expect 2\n"},{"lang":"javascript","src":"function countArrangement(n) {\n  const dp = new Int32Array(1 << n);                  // dp[mask]: ways to fill positions 1..popcount(mask)\n  dp[0] = 1;\n  for (let mask = 0; mask < 1 << n; mask++) {\n    if (dp[mask] === 0) continue;\n    let pos = 1;\n    for (let m = mask; m; m &= m - 1) pos++;          // the next position: popcount(mask) + 1\n    for (let x = 1; x <= n; x++) {\n      // TODO: if x is unused and suits pos, add dp[mask] to the bigger mask\n    }\n  }\n  return dp[(1 << n) - 1];\n}\n\nconsole.log(countArrangement(2));   // expect 2\n"}]},"solution":{"t":"Solution: positions in order, numbers in the mask","tabs":[{"lang":"python","src":"def count_arrangement(n):\n    dp = [0] * (1 << n)                      # dp[mask]: ways to fill positions 1..popcount(mask) with mask's numbers\n    dp[0] = 1\n    for mask in range(1 << n):\n        if dp[mask] == 0:\n            continue\n        pos = mask.bit_count() + 1           # the next position to fill\n        for x in range(1, n + 1):\n            bit = 1 << (x - 1)               # number x lives in bit x - 1\n            if not mask & bit and (x % pos == 0 or pos % x == 0):\n                dp[mask | bit] += dp[mask]\n    return dp[(1 << n) - 1]\n\nprint(count_arrangement(2), count_arrangement(4), count_arrangement(6), count_arrangement(15))\n","out":"2 8 36 24679"},{"lang":"javascript","src":"function countArrangement(n) {\n  const dp = new Int32Array(1 << n);                  // dp[mask]: ways to fill positions 1..popcount(mask)\n  dp[0] = 1;\n  for (let mask = 0; mask < 1 << n; mask++) {\n    if (dp[mask] === 0) continue;\n    let pos = 1;\n    for (let m = mask; m; m &= m - 1) pos++;          // the next position: popcount(mask) + 1\n    for (let x = 1; x <= n; x++) {\n      const bit = 1 << (x - 1);                       // number x lives in bit x - 1\n      if ((mask & bit) === 0 && (x % pos === 0 || pos % x === 0)) dp[mask | bit] += dp[mask];\n    }\n  }\n  return dp[(1 << n) - 1];\n}\n\nconsole.log(countArrangement(2), countArrangement(4), countArrangement(6), countArrangement(15));\n","out":"2 8 36 24679"}]}},"traps":[["“Bitmask DP is fine for n = 40.”","2⁴⁰ ≈ 1.1 × 10¹² states is far too many. Masks fit n up to about 20; for n near 40, split the items into two halves of about 2²⁰ each (meet in the middle)."],["“`1 << 31` is an ordinary positive number in JavaScript.”","Bit operators work on 32-bit signed integers, so `1 << 31` is −2147483648 and `1 << 32` is 1. JavaScript masks are safe up to n = 30; past that, use BigInt."],["“`mask & 1 << i === 0` tests whether bit i is clear.”","Not in JavaScript: `===` binds tighter than `&`, so it means `mask & ((1 << i) === 0)`, which is always 0. Write `(mask >> i & 1) === 0`. Python groups `mask & 1 << i == 0` the way you meant, because its comparisons bind more loosely than `&`."],["“An `Int32Array` filled with `Infinity` holds infinities.”","Integer typed arrays convert whatever they store: Infinity and NaN become 0, and 3.7 becomes 3. Use a `Float64Array` for Infinity, or a large sentinel such as 1e9 in an `Int32Array`."],["“Enumerating every submask of every mask costs 4ⁿ.”","Each bit is outside the mask, in the mask only, or in both, so the total is 3ⁿ: about 4.8 million for n = 14, which is fine."],["“A plain BFS over nodes solves Shortest Path Visiting All Nodes.”","The best walk may pass through a node twice, each time with a different set already seen. A visited-node check refuses the second visit, so the state must be (node, mask)."]],"disc":[["Why doesn't the assignment DP store which person comes next?","People are served in a fixed order (0, 1, 2, …), so a mask with k tasks used always means persons 0..k − 1 are done, and the next person is k = popcount(mask). Storing it would add a dimension the mask already determines. The same trick works whenever one side is processed in order and only the other side's choices need remembering."],["How would you rebuild the actual tour from Held–Karp, not just its length?","Store parent[mask][last], the city before last on the best path, whenever dp improves. Pick the best final city, then walk back: step to parent[mask][last], remove last from mask, and repeat until only city 0 is left. That's O(n) extra steps, plus a parent table the same size as dp, O(2ⁿ · n)."]],"teach":{"prompt":"Explain to a junior colleague how Held–Karp solves the travelling salesman problem for 15 cities, and why it beats trying every order.","rubric":["The state is (the set of visited cities as a mask, the current city)","Base case: only city 0 visited, standing at 0, cost 0","Transition: extend to each unvisited city, keeping the minimum","Closes the tour with the minimum of dp[all][last] + dist[last][0]","O(2ⁿ · n²) time and O(2ⁿ · n) space, against O(n!)"],"model":"Trying every order of 15 cities means 14! ≈ 87 billion tours from a fixed start. Held–Karp notices that a partial route's future depends only on which cities it has visited and where it stands now, not on the order it took. So the state is dp[mask][last]: the shortest path that starts at city 0, visits exactly the cities in mask and ends at last. Start with dp[{0}][0] = 0, go through the masks in increasing order, and extend each reachable state to every city not in its mask, keeping the minimum. The tour's length is the minimum over last of dp[all][last] plus the drive from last back to 0. There are 2¹⁵ · 15 ≈ 490,000 states with 15 choices each, about 7 million steps: O(2ⁿ · n²) time and O(2ⁿ · n) space, where trying every order is O(n!)."},"qa":[["How do you test, add and remove item i in a mask?","Test `mask >> i & 1`, add `mask | 1 << i`, remove `mask & ~(1 << i)`."],["Roughly the largest n for bitmask DP?","About 20: 2²⁰ ≈ 10⁶ masks."],["Assignment DP: who is assigned next?","Person popcount(mask), the number of tasks already used."],["Held–Karp state and cost?","dp[mask][last]; O(2ⁿ · n²) time and O(2ⁿ · n) space."],["How do you enumerate the submasks of mask?","Start at `sub = mask` and step `sub = (sub - 1) & mask` until 0; all masks together cost 3ⁿ."],["Why are JavaScript masks limited to n ≤ 30?","Bit operators use 32-bit signed integers: `1 << 31` is negative and `1 << 32` is 1."]],"quiz":[{"q":"What does this print?","snip":{"t":"Walk the submasks","tabs":[{"lang":"python","src":"mask = 0b1010\nsub, out = mask, []\nwhile sub:\n    out.append(sub)\n    sub = (sub - 1) & mask\nprint(*out)\n"},{"lang":"javascript","src":"const mask = 0b1010, out = [];\nfor (let sub = mask; sub; sub = (sub - 1) & mask) out.push(sub);\nconsole.log(...out);\n"}]},"o":["10 8 2","10 8 2 0","2 8 10","10 9 8 2"],"a":0,"e":"1010 has two set bits, so it has four submasks: 1010 (10), 1000 (8), 0010 (2) and 0000. The loop stops when sub reaches 0, so 0 isn't printed. 9 (1001) isn't a submask: `& mask` removes its lowest bit."},{"q":"What does this JavaScript print? (JavaScript only: Python's ints don't overflow.)","snip":{"t":"A 31-item mask","lang":"javascript","src":"const n = 31;\nconsole.log(1 << 30, 1 << n, (1 << n) - 1);\n"},"o":["1073741824 -2147483648 -2147483649","1073741824 2147483648 2147483647","1073741824 -2147483648 2147483647","1073741824 0 -1"],"a":0,"e":"`<<` works on 32-bit signed integers, so `1 << 31` sets the sign bit: −2147483648. Subtracting 1 then happens in ordinary number arithmetic, giving −2147483649 instead of the full mask 2147483647. That's why JavaScript masks stop at n = 30."},{"q":"Which constraint most strongly suggests bitmask DP?","o":["n ≤ 16, and the answer depends on which items are already used","n ≤ 10⁵, and the array is sorted","n ≤ 500, and the answer for i..j comes from shorter ranges","Values up to 10⁹, and the answer needs a modulus"],"a":0,"e":"2¹⁶ = 65,536 masks is small, and a mask records exactly which items are used. A sorted array of 10⁵ suggests binary search or two pointers, ranges i..j with n ≤ 500 suggest interval DP, and large values say nothing about sets."},{"q":"Which statements about Held–Karp on n cities are true? (choose 2)","t":"ms","o":["The state is the set of visited cities plus the current city","It runs in O(2ⁿ · n²) time","It runs in O(n!) time, like trying every order","It needs only O(n²) memory","It handles n = 50 in under a second"],"a":[0,1],"e":"There are 2ⁿ · n states with n choices each. The table needs O(2ⁿ · n) memory, and 2⁵⁰ masks are far beyond any computer."},{"q":"Judge each statement.","t":"yn","s":[["`sub = (sub - 1) & mask` visits every submask of mask, from largest to smallest.",true],["Enumerating all submasks of all n-bit masks takes 3ⁿ steps in total.",true],["In JavaScript, `1 << 32` equals 4294967296.",false],["An `Int32Array` filled with `Infinity` holds Infinity in every slot.",false]],"e":"Each step moves to the next smaller submask. Each bit has 3 possible states. The shift count is taken mod 32, so `1 << 32` is `1 << 0`, which is 1. An integer typed array converts Infinity to 0."},{"q":"Put Held–Karp in order.","t":"ord","items":["Set dp[{0}][0] = 0: the path starts at city 0, having visited only city 0","Go through the masks in increasing order","For each reachable (mask, last), extend to every city not in mask, keeping the minimum","Close the tour: the minimum over last of dp[all][last] + dist[last][0]"],"e":"The base case comes first; every transition goes from a smaller mask to a bigger one, so increasing order finishes each state before it's extended; the tour closes only once every complete path is known."},{"q":"Complete the Python DP for the fewest work sessions (each session holds tasks totalling at most cap).","t":"drop","lang":"python","code":"def min_sessions(tasks, cap):\n    n = len(tasks)\n    total = [sum(t for i, t in enumerate(tasks) if m >> i & 1) for m in range(1 << n)]\n    dp = [0] + [{{0}}] * ((1 << n) - 1)\n    for mask in range(1, 1 << n):\n        sub = mask\n        while sub:\n            if total[sub] <= cap:\n                dp[mask] = min(dp[mask], dp[{{1}}] + 1)\n            sub = {{2}}\n    return dp[(1 << n) - 1]\n","blanks":[{"o":["n","0","1","-1"],"a":0},{"o":["mask ^ sub","sub","mask | sub","mask"],"a":0},{"o":["(sub - 1) & mask","sub ^ mask","sub & (sub - 1)","sub >> 1"],"a":0}],"e":"n sessions always suffice, so n is a safe starting value (0 or 1 would be too optimistic). Using sub as one session leaves the tasks in `mask ^ sub`. `(sub - 1) & mask` visits every submask; the other steps skip some of them."},{"q":"Match each problem to its bitmask pattern.","t":"match","pairs":[["Pair two arrays one-to-one at the least total cost","dp[mask]; the next item is popcount(mask)"],["The shortest tour through every city","dp[mask][last] (Held–Karp)"],["The shortest walk visiting every node when each edge costs 1","BFS over (node, mask)"],["Split tasks into the fewest sessions","Submask enumeration, O(3ⁿ)"]],"extra":["Interval DP over i..j"],"e":"Assignment counts used items, TSP adds the current city, unit-cost walks use BFS states, and grouping enumerates submasks."}],"probs":[["LC 526 · Beautiful Arrangement","https://leetcode.com/problems/beautiful-arrangement/","Medium","the faded example: position popcount(mask) + 1 comes next"],["LC 698 · Partition to K Equal Sum Subsets","https://leetcode.com/problems/partition-to-k-equal-sum-subsets/","Medium","dp[mask] = how full the current bucket is, sum(mask) % target; add a number only if it fits"],["LC 1986 · Minimum Number of Work Sessions to Finish the Tasks","https://leetcode.com/problems/minimum-number-of-work-sessions-to-finish-the-tasks/","Medium","code block 3: a session is any submask whose total fits"],["LC 847 · Shortest Path Visiting All Nodes","https://leetcode.com/problems/shortest-path-visiting-all-nodes/","Hard","the worked example: multi-source BFS over (node, mask)"],["LC 1879 · Minimum XOR Sum of Two Arrays","https://leetcode.com/problems/minimum-xor-sum-of-two-arrays/","Hard","the assignment pattern: nums1[popcount(mask)] takes a free nums2[j]"],["LC 1655 · Distribute Repeating Integers","https://leetcode.com/problems/distribute-repeating-integers/","Hard","only the counts of each value matter; dp[i][mask] over customers, trying each submask count i can cover"],["LC 1349 · Maximum Students Taking Exam","https://leetcode.com/problems/maximum-students-taking-exam/","Hard","row by row over seat masks: no two students side by side, none on broken seats, no diagonal neighbour in the row above"],["LC 943 · Find the Shortest Superstring","https://leetcode.com/problems/find-the-shortest-superstring/","Hard","Held–Karp where each step adds the next word minus its overlap; keep parents to rebuild the string"],["LC 1434 · Number of Ways to Wear Different Hats to Each Other","https://leetcode.com/problems/number-of-ways-to-wear-different-hats-to-each-other/","Hard","mask over the 10 people, not the 40 hats: go hat by hat, giving each hat to at most one person"]],"src":[["cp-algorithms: Enumerating submasks of a bitmask","https://cp-algorithms.com/algebra/all-submasks.html"],["USACO Guide: Bitmask DP","https://usaco.guide/gold/dp-bitmasks"],["Wikipedia: Held–Karp algorithm","https://en.wikipedia.org/wiki/Held%E2%80%93Karp_algorithm"],["MDN: Left shift (<<)","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Left_shift"]]},{"id":"m06","d":"d2","t":"DP on trees and rerooting","min":110,"hook":"A tree has no cycles, so every subtree is a separate subproblem: solve the children, then combine at the parent. That one idea handles robbing houses on a tree, placing cameras and finding longest paths, and with rerooting it answers “for every node as the root” in O(n) instead of O(n²). Real inputs are edge lists with 10⁵ nodes, so the code must also survive a tree that is one long path.","pre":{"q":"A tree has 100,000 nodes, and you need the sum of distances from every node to all the others. A BFS from each node is O(n²), about 10¹⁰ steps. When you move from a node to its neighbour, which distances change, and by how much?","a":"Every distance changes by exactly 1: the nodes on the neighbour's side get one step closer, and all the others get one step further. If you know how many nodes are on each side (a subtree size), the neighbour's sum follows from the node's sum in O(1). That's rerooting."},"kid":{"t":"Where to hold the family picnic","x":"On the road trip, the family plans a picnic with ten cousins who live in ten villages, joined by roads with no loops. They want the village with the least total driving. Ben prices Grandma's village first: for each road he counts the cousins who live beyond it, since each of them drives that road once. Then he slides the picnic one road over. The cousins on the far side of that road now drive one road less, and everyone else drives one road more. So the new total is the old one, minus the far side, plus the rest, and Ben prices every village without asking anyone again.","map":[["Villages joined by roads with no loops","A tree: n nodes and n − 1 edges"],["How many cousins live beyond each road","size[v], the subtree sizes, counted children first"],["The total driving for a picnic at Grandma's","ans[0], the sum of distances from the root"],["Sliding the picnic one road over: the far side drives one road less, the rest one road more","ans[v] = ans[u] − size[v] + (n − size[v])"],["Pricing every village without asking again","Rerooting: O(n) for all roots instead of O(n²)"]],"brk":"Ben can ask about a road and wait for the answer, like a recursive call. On a tree that is one chain of 100,000 villages, a recursive DFS passes Python's 1,000-frame limit (and overflows Node's stack), so the code walks a precomputed order instead."},"keys":["**Post-order tree DP**: each node turns its children's answers into a small summary of its own subtree and returns it to its parent. With O(1) work per child, the whole tree costs O(n) time.","**Return a pair when the node makes a choice**: House Robber III returns (take, skip). take = val + skip(left) + skip(right); skip = max(left pair) + max(right pair). The answer is the larger value at the root.","**Add states when the parent needs more detail**: Binary Tree Cameras returns one of 3 states: “not covered” (the parent must cover me), “covered without a camera” and “has a camera”. A missing child counts as covered without a camera.","**General trees arrive as edge lists**: build adjacency lists, then get a DFS order and a parent array with an explicit stack. Every node appears after its parent, so the reversed order puts children before parents, and post-order DP becomes a plain loop with no recursion at all.","**Subtree sizes and sums**: size[u] = 1 + the sizes of u's children, added into the parent while walking the order backwards: O(n). The same loop sums values, counts leaves or gathers any other subtree total.","**Longest path through a node** joins its two longest child chains: keep the top two (LC 2246, and the tree diameter), update the best answer with top1 + top2 + 1 nodes, and return only top1 + 1 to the parent, because a path can't fork.","**Rerooting**: compute the answer for root 0 bottom-up, then push it top-down. Moving the root from u to its child v changes the answer by an amount you can read from stored subtree data. For the sum of distances, ans[v] = ans[u] − size[v] + (n − size[v]). Two passes: O(n) time and space for all n roots.","**Two directions**: the bottom-up pass (order reversed) carries facts about a subtree up to its parent; the rerooting pass (order forwards) carries facts about everything outside a subtree down to the child."],"dia":[{"type":"btree","cap":"House Robber III on [3, 4, 5, 1, 3, null, 1]: each node returns (take, skip)","nodes":[3,4,5,1,3,null,1],"hl":[4,5],"note":"The leaves return (1, 0), (3, 0) and (1, 0). Node 4 returns (4, 4) and node 5 returns (5, 1). The root returns (3 + 4 + 1, 4 + 5) = (8, 9), so the best is 9: rob 4 and 5."},{"type":"graph","cap":"Sum of distances (LeetCode 834): moving the root from 0 to 2","h":200,"nodes":[["0",30,10],["1",12,50],["2",55,28],["3",38,52],["4",60,54],["5",85,50]],"edges":[["0","1"],["0","2"],["2","3"],["2","4"],["2","5"]],"hl":["2"],"hle":[["0","2"]],"note":"Rooted at 0, the subtree sizes are 6, 1, 4, 1, 1, 1 and ans[0] = 1 + 1 + 2 + 2 + 2 = 8. Moving the root across 0–2, the 4 nodes under 2 get one step closer and the other 2 one step further: ans[2] = 8 − 4 + 2 = 6. All answers: 8, 12, 6, 10, 10, 10."},{"type":"flow","cap":"The iterative template for a tree given as an edge list","steps":[["Adjacency lists","from the n − 1 edges"],["Stack DFS from 0","order and parent[]: each node after its parent"],["Order backwards","children first: sizes, sums, DP up"],["Order forwards","parents first: rerooting down"]]}],"cmp":[{"cap":"Recursive or iterative tree DP?","head":["","Recursive DFS","Precomputed order (explicit stack)"],"rows":[["Code","Short and natural","A few more lines: order and parent, then plain loops"],["A 10⁵-node path","Python raises RecursionError (default limit 1,000 frames); Node.js throws RangeError","Fine: the stack is an ordinary array"],["Extra memory","O(h) call frames, h = the tree's height","O(n) for the order and parent arrays"],["Use it for","Binary-tree problems with modest height","Edge lists with n up to 10⁵ or more"]]},{"cap":"Tree DP problems at a glance","head":["Problem","Each node returns","Combine at the node","Passes"],"rows":[["House Robber III (LC 337)","(take, skip)","take = val + both skips; skip = the sum of the children's maxima","1, bottom-up"],["Binary Tree Cameras (LC 968)","One of 3 states","A camera here if any child is not covered","1, bottom-up"],["Longest path, different letters (LC 2246)","The longest valid chain downwards","best = top1 + top2 + 1","1, bottom-up"],["Distribute Coins (LC 979)","Coins − nodes in the subtree","moves += the absolute excess of each child","1, bottom-up"],["Sum of Distances (LC 834)","Size and the sum of distances into the subtree","ans[v] = ans[u] + n − 2 · size[v]","2: up, then down"]]}],"code":[{"t":"The LeetCode tree helpers used by the binary-tree examples below","tabs":[{"lang":"python","src":"from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(level):                      # [3, 9, 20, None, None, 15, 7] -> tree\n    if not level or level[0] is None:\n        return None\n    root = TreeNode(level[0])\n    q, i = deque([root]), 1\n    while q and i < len(level):\n        node = q.popleft()\n        for side in (\"left\", \"right\"):\n            if i < len(level) and level[i] is not None:\n                child = TreeNode(level[i])\n                setattr(node, side, child)\n                q.append(child)\n            i += 1\n    return root\n"},{"lang":"javascript","src":"class TreeNode {\n  constructor(val = 0, left = null, right = null) { this.val = val; this.left = left; this.right = right; }\n}\n\nfunction build(level) {                // [3, 9, 20, null, null, 15, 7] -> tree\n  if (!level.length || level[0] === null) return null;\n  const root = new TreeNode(level[0]);\n  const q = [root];\n  let head = 0, i = 1;\n  while (head < q.length && i < level.length) {\n    const node = q[head++];\n    for (const side of [\"left\", \"right\"]) {\n      if (i < level.length && level[i] !== null) {\n        node[side] = new TreeNode(level[i]);\n        q.push(node[side]);\n      }\n      i++;\n    }\n  }\n  return root;\n}\n"}]},{"t":"House Robber III: every node returns (take, skip)","tabs":[{"lang":"python","src":"def rob(root):\n    def go(node):                            # returns (take, skip) for node's subtree\n        if node is None:\n            return 0, 0\n        left_take, left_skip = go(node.left)\n        right_take, right_skip = go(node.right)\n        take = node.val + left_skip + right_skip                         # both children must be skipped\n        skip = max(left_take, left_skip) + max(right_take, right_skip)   # each child is free to choose\n        return take, skip\n    return max(go(root))\n\nprint(rob(build([3, 2, 3, None, 3, None, 1])), rob(build([3, 4, 5, 1, 3, None, 1])),\n      rob(build([4, 1, None, 2, None, 3])))\n","out":"7 9 7","notes":[[2,"Recursion depth equals the tree's height: fine for these trees, but a 10⁴-node chain would pass Python's 1,000-frame limit (block 2 shows the fix)."],[7,"Robbing this node forbids robbing its children, so only their skip values can be added."],[8,"Skipping this node frees each child to take whichever of its two values is bigger."]]},{"lang":"javascript","src":"function rob(root) {\n  function go(node) {                                // returns [take, skip] for node's subtree\n    if (node === null) return [0, 0];\n    const [leftTake, leftSkip] = go(node.left);\n    const [rightTake, rightSkip] = go(node.right);\n    const take = node.val + leftSkip + rightSkip;                               // both children must be skipped\n    const skip = Math.max(leftTake, leftSkip) + Math.max(rightTake, rightSkip); // each child is free to choose\n    return [take, skip];\n  }\n  return Math.max(...go(root));\n}\n\nconsole.log(rob(build([3, 2, 3, null, 3, null, 1])), rob(build([3, 4, 5, 1, 3, null, 1])),\n            rob(build([4, 1, null, 2, null, 3])));\n","out":"7 9 7","notes":[[7,"Skipping this node frees each child to take whichever of its two values is bigger."]]}]},{"t":"The iterative template: DFS order, parents and subtree sizes on a 100,000-node path","tabs":[{"lang":"python","src":"def tree_order(n, edges, root=0):\n    adj = [[] for _ in range(n)]\n    for a, b in edges:\n        adj[a].append(b)\n        adj[b].append(a)\n    parent, order, stack = [-1] * n, [], [root]\n    while stack:                             # iterative DFS: no recursion at all\n        u = stack.pop()\n        order.append(u)                      # every node lands after its parent\n        for v in adj[u]:\n            if v != parent[u]:               # in a tree, the only neighbour seen before is the parent\n                parent[v] = u\n                stack.append(v)\n    return parent, order\n\ndef subtree_sizes(parent, order):\n    size = [1] * len(order)\n    for u in reversed(order):                # children before parents\n        if parent[u] != -1:\n            size[parent[u]] += size[u]\n    return size\n\nparent, order = tree_order(6, [(0, 1), (0, 2), (2, 3), (2, 4), (2, 5)])\nprint(*subtree_sizes(parent, order))\n\nn = 100_000\nparent, order = tree_order(n, [(i, i + 1) for i in range(n - 1)])   # a path: depth 99,999\nsize = subtree_sizes(parent, order)\nprint(size[0], size[1], size[n - 1], parent[n - 1])\n","out":"6 1 4 1 1 1\n100000 99999 1 99998\n","notes":[[7,"The stack replaces the call stack. It's an ordinary list, so a path 99,999 edges deep is no problem."],[11,"A tree has no cycles, so skipping the parent is enough; general graphs would need a visited array."],[18,"Each node appears after its parent in order, so walking it backwards finishes every child before its parent."]]},{"lang":"javascript","src":"function treeOrder(n, edges, root = 0) {\n  const adj = Array.from({ length: n }, () => []);\n  for (const [a, b] of edges) { adj[a].push(b); adj[b].push(a); }\n  const parent = new Int32Array(n).fill(-1), order = [], stack = [root];\n  while (stack.length) {                             // iterative DFS: no recursion at all\n    const u = stack.pop();\n    order.push(u);                                   // every node lands after its parent\n    for (const v of adj[u]) {\n      if (v !== parent[u]) {                         // in a tree, the only neighbour seen before is the parent\n        parent[v] = u;\n        stack.push(v);\n      }\n    }\n  }\n  return [parent, order];\n}\n\nfunction subtreeSizes(parent, order) {\n  const size = new Int32Array(order.length).fill(1);\n  for (let k = order.length - 1; k >= 0; k--) {      // children before parents\n    const u = order[k];\n    if (parent[u] !== -1) size[parent[u]] += size[u];\n  }\n  return size;\n}\n\nlet [parent, order] = treeOrder(6, [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5]]);\nconsole.log(...subtreeSizes(parent, order));\n\nconst n = 100000;\n[parent, order] = treeOrder(n, Array.from({ length: n - 1 }, (_, i) => [i, i + 1]));   // a path: depth 99,999\nconst size = subtreeSizes(parent, order);\nconsole.log(size[0], size[1], size[n - 1], parent[n - 1]);\n","out":"6 1 4 1 1 1\n100000 99999 1 99998\n","notes":[[4,"An Int32Array is fine here: node numbers and sizes stay below 2³¹."],[20,"Walking the order backwards finishes every child before its parent, with no recursion."]]}]},{"t":"Longest Path With Different Adjacent Characters: keep the top two child chains","tabs":[{"lang":"python","src":"def longest_path(parent, s):\n    n = len(parent)\n    children = [[] for _ in range(n)]\n    for v in range(1, n):\n        children[parent[v]].append(v)\n    order, stack = [], [0]\n    while stack:                             # parents before children\n        u = stack.pop()\n        order.append(u)\n        stack.extend(children[u])\n    down = [1] * n                           # down[u]: nodes on the longest valid chain from u downwards\n    best = 1\n    for u in reversed(order):                # children before parents\n        top1 = top2 = 0                      # the two longest chains that u may join\n        for v in children[u]:\n            if s[v] != s[u]:                 # only a child with a different letter can join u\n                if down[v] > top1:\n                    top1, top2 = down[v], top1\n                elif down[v] > top2:\n                    top2 = down[v]\n        down[u] = 1 + top1                   # a chain passed up to the parent can't fork\n        best = max(best, 1 + top1 + top2)    # a path may bend at u\n    return best\n\nprint(longest_path([-1, 0, 0, 1, 1, 2], \"abacbe\"), longest_path([-1, 0, 0, 0], \"aabc\"),\n      longest_path([-1, 0, 1, 2, 3], \"ababa\"), longest_path([-1], \"z\"))\n","out":"3 3 5 1","notes":[[6,"LeetCode's parent array doesn't promise parent[v] < v, so get a real order first."],[17,"Keep the two largest values in one pass: a new maximum pushes the old one down to second place."],[22,"The answer bends at u and uses two chains; the value returned upwards uses only one."]]},{"lang":"javascript","src":"function longestPath(parent, s) {\n  const n = parent.length;\n  const children = Array.from({ length: n }, () => []);\n  for (let v = 1; v < n; v++) children[parent[v]].push(v);\n  const order = [], stack = [0];\n  while (stack.length) {                             // parents before children\n    const u = stack.pop();\n    order.push(u);\n    for (const v of children[u]) stack.push(v);\n  }\n  const down = new Int32Array(n).fill(1);            // down[u]: nodes on the longest valid chain from u downwards\n  let best = 1;\n  for (let k = n - 1; k >= 0; k--) {                 // children before parents\n    const u = order[k];\n    let top1 = 0, top2 = 0;                          // the two longest chains that u may join\n    for (const v of children[u]) {\n      if (s[v] === s[u]) continue;                   // only a child with a different letter can join u\n      if (down[v] > top1) [top1, top2] = [down[v], top1];\n      else if (down[v] > top2) top2 = down[v];\n    }\n    down[u] = 1 + top1;                              // a chain passed up to the parent can't fork\n    best = Math.max(best, 1 + top1 + top2);          // a path may bend at u\n  }\n  return best;\n}\n\nconsole.log(longestPath([-1, 0, 0, 1, 1, 2], \"abacbe\"), longestPath([-1, 0, 0, 0], \"aabc\"),\n            longestPath([-1, 0, 1, 2, 3], \"ababa\"), longestPath([-1], \"z\"));\n","out":"3 3 5 1","notes":[[9,"A loop instead of `stack.push(...children[u])`: spreading a huge array into arguments can overflow the call stack."],[22,"The answer bends at u and uses two chains; the value returned upwards uses only one."]]}]}],"ex":{"q":"Sum of Distances in Tree (LeetCode 834): a tree has n nodes (n ≤ 3 × 10⁴) and n − 1 edges. Return ans, where ans[i] is the sum of the distances from node i to every other node.","steps":["Root the tree at 0 and get a DFS order and a parent array with an explicit stack, so nothing recurses.","Pass 1, children before parents (the order backwards): size[u] = 1 + the children's sizes, and down[u] = the sum of distances from u into its subtree: each child v adds down[v] + size[v], because all size[v] of its nodes are one step further from u.","ans[0] = down[0]. Moving the root from u to its child v brings the size[v] nodes under v one step closer and pushes the other n − size[v] one step further: ans[v] = ans[u] − size[v] + (n − size[v]).","Pass 2, parents before children (the order forwards), so ans[u] is ready before its children need it. Two O(n) passes: O(n) time and space, against O(n²) for a BFS from every node."],"code":{"t":"Rerooting: two passes over one DFS order","tabs":[{"lang":"python","src":"def sum_of_distances(n, edges):\n    adj = [[] for _ in range(n)]\n    for a, b in edges:\n        adj[a].append(b)\n        adj[b].append(a)\n    parent, order, stack = [-1] * n, [], [0]\n    while stack:                             # DFS order from root 0, no recursion\n        u = stack.pop()\n        order.append(u)\n        for v in adj[u]:\n            if v != parent[u]:\n                parent[v] = u\n                stack.append(v)\n    size, down = [1] * n, [0] * n            # down[u]: sum of distances from u into its subtree\n    for u in reversed(order):                # pass 1: children before parents\n        p = parent[u]\n        if p != -1:\n            size[p] += size[u]\n            down[p] += down[u] + size[u]     # each of the size[u] nodes is one step further from p\n    ans = [0] * n\n    ans[0] = down[0]\n    for u in order[1:]:                      # pass 2: parents before children\n        ans[u] = ans[parent[u]] - size[u] + (n - size[u])\n    return ans\n\nprint(*sum_of_distances(6, [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5]]))\nprint(*sum_of_distances(2, [[1, 0]]), *sum_of_distances(1, []))\n","out":"8 12 6 10 10 10\n1 1 0\n"},{"lang":"javascript","src":"function sumOfDistances(n, edges) {\n  const adj = Array.from({ length: n }, () => []);\n  for (const [a, b] of edges) { adj[a].push(b); adj[b].push(a); }\n  const parent = new Int32Array(n).fill(-1), order = [], stack = [0];\n  while (stack.length) {                             // DFS order from root 0, no recursion\n    const u = stack.pop();\n    order.push(u);\n    for (const v of adj[u]) if (v !== parent[u]) { parent[v] = u; stack.push(v); }\n  }\n  const size = new Int32Array(n).fill(1);\n  const down = new Float64Array(n);                  // sums reach about n^2 / 2: too big for an Int32Array\n  for (let k = n - 1; k >= 0; k--) {                 // pass 1: children before parents\n    const u = order[k], p = parent[u];\n    if (p !== -1) {\n      size[p] += size[u];\n      down[p] += down[u] + size[u];                  // each of the size[u] nodes is one step further from p\n    }\n  }\n  const ans = new Float64Array(n);\n  ans[0] = down[0];\n  for (let k = 1; k < n; k++) {                      // pass 2: parents before children\n    const u = order[k];\n    ans[u] = ans[parent[u]] - size[u] + (n - size[u]);\n  }\n  return ans;\n}\n\nconsole.log(...sumOfDistances(6, [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5]]));\nconsole.log(...sumOfDistances(2, [[1, 0]]), ...sumOfDistances(1, []));\n","out":"8 12 6 10 10 10\n1 1 0\n"}]},"a":"8 12 6 10 10 10 for the six-node tree, then 1 1 for two nodes and 0 for one. Node 2 sits in the middle, so its sum is the smallest; the leaves 3, 4 and 5 are two steps from 0 and 1. The hidden tests compare every answer with a BFS from each node, and run a 10⁵-node path to show nothing recurses."},"fade":{"q":"Distribute Coins in Binary Tree (LeetCode 979): a tree of n nodes holds n coins in total. One move sends one coin between a parent and a child. Find the fewest moves that leave exactly one coin on every node.","steps":["Think about one edge, between a node and its parent. Every coin that crosses it costs one move, and in the best plan coins cross each edge in one direction only.",{"ask":"How many coins must cross the edge above a subtree?","a":"|coins in the subtree − nodes in the subtree|, its excess. A positive excess must go up; a negative one is a shortage that must come down."},{"ask":"What does each call return to its parent, and where do the moves add up?","a":"The subtree's excess: node.val − 1 + excess(left) + excess(right). At each node, add |excess(left)| + |excess(right)|, the coins crossing its two child edges."},{"ask":"Time and space?","a":"O(n) time, one visit per node, and O(h) stack space for the recursion. LeetCode 979 has n ≤ 100, so recursion is safe; for a huge tree, use the order-backwards loop from block 2."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def distribute_coins(root):\n    moves = 0\n    def excess(node):                        # coins minus nodes in node's subtree\n        nonlocal moves\n        if node is None:\n            return 0\n        left, right = excess(node.left), excess(node.right)\n        ...                                  # TODO: add the moves on the two child edges, return this subtree's excess\n    excess(root)\n    return moves\n\nprint(distribute_coins(build([3, 0, 0])))   # expect 2\n"},{"lang":"javascript","src":"function distributeCoins(root) {\n  let moves = 0;\n  function excess(node) {                            // coins minus nodes in node's subtree\n    if (node === null) return 0;\n    const left = excess(node.left), right = excess(node.right);\n    // TODO: add the moves on the two child edges, return this subtree's excess\n  }\n  excess(root);\n  return moves;\n}\n\nconsole.log(distributeCoins(build([3, 0, 0])));   // expect 2\n"}]},"solution":{"t":"Solution: each edge carries the excess of the subtree below it","tabs":[{"lang":"python","src":"def distribute_coins(root):\n    moves = 0\n    def ex
