base\", 1, 2000]];\n  const [name, cap] = bottleneck(tiers);\n  console.log(count, \"app servers ->\", cap, \"req/s, limited by the\", name);\n}\nconsole.log(`database busy at peak: ${Math.floor((peak * 100) / 2000)}%`);\n","out":"app servers for the peak: 6\n2 app servers -> 1000 req/s, limited by the app\n3 app servers -> 1500 req/s, limited by the app\n5 app servers -> 2000 req/s, limited by the database\n8 app servers -> 2000 req/s, limited by the database\ndatabase busy at peak: 90%\n","notes":[[2,"1,800 ÷ (500 × 70%) = 5.1, rounded up to 6, so each server stays at most 70% busy at the peak."],[6,"Each tier is [name, servers, requests per second per server]. The load balancer is nowhere near its limit."],[8,"With 2 or 3 servers the app tier is the limit; with 5 or 8 it's the database, so the extra servers buy nothing."],[10,"At the peak the single database is 90% busy: it, not the app tier, is what to scale next."]]}]},{"t":"Why servers must be stateless: a cart behind a round-robin load balancer","tabs":[{"lang":"python","src":"class StatefulServer:\n    def __init__(self):\n        self.carts = {}                       # lives in this server's memory only\n    def add(self, user, item):\n        self.carts.setdefault(user, []).append(item)\n        return len(self.carts[user])\n\nclass StatelessServer:\n    def __init__(self, store):\n        self.store = store                    # shared by every server (think Redis or a database)\n    def add(self, user, item):\n        self.store.setdefault(user, []).append(item)\n        return len(self.store[user])\n\ndef shop(servers, items):                     # round robin: request i goes to server i mod n\n    return [servers[i % len(servers)].add(\"tara\", item) for i, item in enumerate(items)]\n\nitems = [\"pizza\", \"cola\", \"salad\", \"cake\"]\nprint(\"stateful: \", *shop([StatefulServer() for _ in range(3)], items))\nshared = {}\nprint(\"stateless:\", *shop([StatelessServer(shared) for _ in range(3)], items))\n","out":"stateful:  1 1 1 2\nstateless: 1 2 3 4\n","notes":[[3,"Each server has its own carts, so what Tara added on one server is invisible to the others."],[10,"Every server points at the same store, so it doesn't matter which one answers."],[19,"Tara's cart seems to keep resetting: her first three requests land on three different servers, and only the fourth comes back to the first."],[21,"With one shared store, every server sees the whole cart: 1, 2, 3, then 4 items."]]},{"lang":"javascript","src":"class StatefulServer {\n  constructor() { this.carts = new Map(); }   // lives in this server's memory only\n  add(user, item) {\n    if (!this.carts.has(user)) this.carts.set(user, []);\n    this.carts.get(user).push(item);\n    return this.carts.get(user).length;\n  }\n}\n\nclass StatelessServer {\n  constructor(store) { this.store = store; }  // shared by every server (think Redis or a database)\n  add(user, item) {\n    if (!this.store.has(user)) this.store.set(user, []);\n    this.store.get(user).push(item);\n    return this.store.get(user).length;\n  }\n}\n\nconst shop = (servers, items) => items.map((item, i) => servers[i % servers.length].add(\"tara\", item));  // round robin\n\nconst items = [\"pizza\", \"cola\", \"salad\", \"cake\"];\nconsole.log(\"stateful: \", ...shop([0, 1, 2].map(() => new StatefulServer()), items));\nconst shared = new Map();\nconsole.log(\"stateless:\", ...shop([0, 1, 2].map(() => new StatelessServer(shared)), items));\n","out":"stateful:  1 1 1 2\nstateless: 1 2 3 4\n","notes":[[2,"Each server has its own carts, so what Tara added on one server is invisible to the others."],[11,"Every server points at the same store, so it doesn't matter which one answers."],[22,"Tara's cart seems to keep resetting: her first three requests land on three different servers, and only the fourth comes back to the first."],[24,"With one shared store, every server sees the whole cart: 1, 2, 3, then 4 items."]]}]},{"t":"Little's law and Amdahl's law in numbers","tabs":[{"lang":"python","src":"def in_flight(rps, latency_ms):               # Little's law: L = arrival rate x time in the system\n    return rps * latency_ms // 1000\n\ndef speedup(parallel_pct, n):                 # Amdahl's law: the serial share never speeds up\n    return 100 / (100 - parallel_pct + parallel_pct / n)\n\nfor latency in (200, 400):\n    busy = in_flight(1_000, latency)\n    print(f\"{latency} ms -> {busy} in flight -> {math.ceil(busy / 64)} servers of 64 workers\")\nfor n in (2, 10, 100, 1_000_000):\n    print(f\"{n} machines: {speedup(90, n):.2f}x\")\n","out":"200 ms -> 200 in flight -> 4 servers of 64 workers\n400 ms -> 400 in flight -> 7 servers of 64 workers\n2 machines: 1.82x\n10 machines: 5.26x\n100 machines: 9.17x\n1000000 machines: 10.00x\n","notes":[[2,"1,000 requests a second, each taking 0.2 s, means about 200 are being served at any moment."],[9,"Double the latency and the requests in flight double too: 7 servers instead of 4 at the same traffic, even if their CPUs sit idle while they wait."],[11,"With 10% of the work serial: 1.82× on 2 machines, 5.26× on 10, and it creeps towards 10× but never passes it."]]},{"lang":"javascript","src":"const inFlight = (rps, latencyMs) => Math.floor((rps * latencyMs) / 1000);       // Little's law: L = arrival rate x time in the system\nconst speedup = (parallelPct, n) => 100 / (100 - parallelPct + parallelPct / n);  // Amdahl's law: the serial share never speeds up\n\nfor (const latency of [200, 400]) {\n  const busy = inFlight(1000, latency);\n  console.log(`${latency} ms -> ${busy} in flight -> ${Math.ceil(busy / 64)} servers of 64 workers`);\n}\nfor (const n of [2, 10, 100, 1000000]) console.log(`${n} machines: ${speedup(90, n).toFixed(2)}x`);\n","out":"200 ms -> 200 in flight -> 4 servers of 64 workers\n400 ms -> 400 in flight -> 7 servers of 64 workers\n2 machines: 1.82x\n10 machines: 5.26x\n100 machines: 9.17x\n1000000 machines: 10.00x\n","notes":[[1,"1,000 requests a second, each taking 0.2 s, means about 200 are being served at any moment."],[6,"Double the latency and the requests in flight double too: 7 servers instead of 4 at the same traffic, even if their CPUs sit idle while they wait."],[8,"With 10% of the work serial: 1.82× on 2 machines, 5.26× on 10, and it creeps towards 10× but never passes it."]]}]}],"ex":{"q":"An API gets 4.32 million requests a day, and its busiest minute runs at 4× the daily average. One server handles 150 requests per second at full CPU and has 32 worker threads, and an average request takes 250 ms. Every server must stay at most 70% busy at the peak, even with one server down. How many servers do you need, and are 32 workers enough? What if the average latency rises to 500 ms?","steps":["Average: 4,320,000 requests ÷ 86,400 seconds = 50 per second. The busiest minute runs at 4×: 200 requests per second.","At most 70% busy, one server carries 0.7 × 150 = 105 requests per second, so the peak needs ⌈200 ÷ 105⌉ = 2 servers.","N+1: run 3, so that losing any one still leaves the 2 the peak needs.","Little's law: 200 requests per second × 0.25 s = 50 requests in flight, which fit in the 2 × 32 = 64 workers left after a failure. At 500 ms, 100 are in flight and don't fit: requests queue although the CPU looks fine. Cut the latency or give each server more workers (or non-blocking I/O). Check concurrency as well as CPU."],"code":{"t":"A capacity plan with a failure check","tabs":[{"lang":"python","src":"def plan(daily_requests, peak_factor, per_server_rps, latency_ms, workers, max_busy_pct=70):\n    peak = daily_requests * peak_factor // 86_400              # requests per second at the peak\n    n = servers_needed(peak, per_server_rps, max_busy_pct) + 1  # N+1: survive one failure\n    busy = peak * latency_ms // 1000                           # Little's law: requests in flight\n    enough = busy <= (n - 1) * workers                         # check with one server down\n    return peak, n, busy, \"yes\" if enough else \"no\"\n\nprint(*plan(4_320_000, 4, 150, 250, 32))\nprint(*plan(4_320_000, 4, 150, 500, 32))\nprint(*plan(4_320_000, 4, 150, 500, 64))\n","out":"200 3 50 yes\n200 3 100 no\n200 3 100 yes\n"},{"lang":"javascript","src":"function plan(dailyRequests, peakFactor, perServerRps, latencyMs, workers, maxBusyPct = 70) {\n  const peak = Math.floor((dailyRequests * peakFactor) / 86400);   // requests per second at the peak\n  const n = serversNeeded(peak, perServerRps, maxBusyPct) + 1;     // N+1: survive one failure\n  const busy = Math.floor((peak * latencyMs) / 1000);              // Little's law: requests in flight\n  const enough = busy <= (n - 1) * workers;                        // check with one server down\n  return [peak, n, busy, enough ? \"yes\" : \"no\"];\n}\n\nconsole.log(...plan(4320000, 4, 150, 250, 32));\nconsole.log(...plan(4320000, 4, 150, 500, 32));\nconsole.log(...plan(4320000, 4, 150, 500, 64));\n","out":"200 3 50 yes\n200 3 100 no\n200 3 100 yes\n"}]},"a":"200 requests per second at the peak, 3 servers (2 for the peak plus one spare) and 50 requests in flight, which fit in the 64 workers of the 2 servers left after a failure. At 500 ms the 100 requests in flight don't fit, so the answer becomes “no” until each server has 64 workers or the latency comes back down."},"fade":{"q":"Instead of keeping sessions on a server, the app gives the browser a signed token: the user name and an expiry time, plus an HMAC signature made with a secret key that every app server shares. Finish `verify(token, now)` so that it returns the user only if the signature matches and the token hasn't expired.","steps":["`sign` builds the payload user.expires and appends its HMAC-SHA256 signature in hex, so the token is user.expires.signature.",{"ask":"What must verify check, and in what order?","a":"First that the signature matches the payload: recompute the HMAC with the shared key and compare. Only then trust the user and the expiry inside it, and refuse the token if the expiry time has passed."},{"ask":"Why compare signatures with hmac.compare_digest or crypto.timingSafeEqual rather than ==?","a":"An ordinary comparison can stop at the first character that differs, so its timing can leak how much of a forged signature is right. A constant-time comparison takes the same time either way."},{"ask":"What does this design buy, and what does it cost?","a":"No server stores anything, so any server can check any request in microseconds: O(token length) time and no server memory. But a token can't be cancelled before it expires without a shared deny-list, the secret key has to be rotated with care, and the token travels with every request."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"import hmac, hashlib\n\nSECRET = b\"rotate-me-regularly\"               # shared by every app server, never sent to the client\n\ndef sign(user, expires):\n    payload = f\"{user}.{expires}\"\n    mac = hmac.new(SECRET, payload.encode(), hashlib.sha256).hexdigest()\n    return f\"{payload}.{mac}\"\n\ndef verify(token, now):\n    ...                                       # TODO: the user if the signature matches and now < expires, else None\n"},{"lang":"javascript","src":"const crypto = require(\"node:crypto\");\nconst SECRET = \"rotate-me-regularly\";         // shared by every app server, never sent to the client\n\nfunction sign(user, expires) {\n  const payload = `${user}.${expires}`;\n  return `${payload}.${crypto.createHmac(\"sha256\", SECRET).update(payload).digest(\"hex\")}`;\n}\n\nfunction verify(token, now) {\n  // TODO: the user if the signature matches and now < expires, else null\n}\n"}]},"solution":{"t":"Solution: check the signature first, then the expiry","tabs":[{"lang":"python","src":"import hmac, hashlib\n\nSECRET = b\"rotate-me-regularly\"               # shared by every app server, never sent to the client\n\ndef sign(user, expires):\n    payload = f\"{user}.{expires}\"\n    mac = hmac.new(SECRET, payload.encode(), hashlib.sha256).hexdigest()\n    return f\"{payload}.{mac}\"\n\ndef verify(token, now):\n    payload, _, mac = token.rpartition(\".\")\n    good = hmac.new(SECRET, payload.encode(), hashlib.sha256).hexdigest()\n    if not hmac.compare_digest(mac, good):\n        return None                           # changed on the way, or signed with another key\n    user, expires = payload.rsplit(\".\", 1)\n    return user if now < int(expires) else None   # an expired token is refused too\n\ntoken = sign(\"tara\", 1_000)\ntampered = [token.replace(\"tara\", \"ben\"), token.replace(\"1000\", \"9999\")]\nresults = [verify(token, 500), verify(token, 1_000)] + [verify(t, 500) for t in tampered]\nprint(*(r or \"refused\" for r in results))\n","out":"tara refused refused refused"},{"lang":"javascript","src":"const crypto = require(\"node:crypto\");\nconst SECRET = \"rotate-me-regularly\";         // shared by every app server, never sent to the client\n\nfunction sign(user, expires) {\n  const payload = `${user}.${expires}`;\n  return `${payload}.${crypto.createHmac(\"sha256\", SECRET).update(payload).digest(\"hex\")}`;\n}\n\nfunction verify(token, now) {\n  const cut = token.lastIndexOf(\".\");\n  const payload = token.slice(0, cut), mac = Buffer.from(token.slice(cut + 1));\n  const good = Buffer.from(crypto.createHmac(\"sha256\", SECRET).update(payload).digest(\"hex\"));\n  if (mac.length !== good.length || !crypto.timingSafeEqual(mac, good)) return null;  // changed, or another key\n  const dot = payload.lastIndexOf(\".\");\n  return now < Number(payload.slice(dot + 1)) ? payload.slice(0, dot) : null;          // an expired token is refused too\n}\n\nconst token = sign(\"tara\", 1000);\nconst tampered = [token.replace(\"tara\", \"ben\"), token.replace(\"1000\", \"9999\")];\nconst results = [verify(token, 500), verify(token, 1000), ...tampered.map(t => verify(t, 500))];\nconsole.log(...results.map(r => r ?? \"refused\"));\n","out":"tara refused refused refused"}]}},"traps":[["“Vertical scaling is always the wrong answer.”","A bigger machine is often the simplest and cheapest first step: no code changes and no distributed-systems problems. It's wrong only when you hit the ceiling, can't afford the downtime of an upgrade, or must survive that one machine failing."],["“Adding servers always adds capacity.”","Only at the bottleneck tier. Once the database is the limit, more app servers add cost, not throughput, and can make things worse by opening more database connections."],["“Sticky sessions make a stateful app scalable.”","They spread users across servers, but the load gets uneven, a server can't be taken out without logging its users out, and a crash loses every session on it. Moving the state to a shared store or a signed token is the real fix."],["“At 50% CPU a server can take twice the traffic with the same response time.”","Requests queue more and more as a server nears 100% busy: in the simplest queueing model, the average wait in the queue at 90% busy is 9 times the wait at 50%. And another resource (memory, worker threads, connections) may run out first."],["“Stateless means the system has no state.”","The state still exists; it lives somewhere shared (a database, a cache, a signed token on the client) instead of in one server's memory. That shared place now has to scale and stay up."],["“Ten servers make a job ten times faster.”","Only the part that runs in parallel speeds up. With 10% of the work serial, Amdahl's law keeps the speed-up below 10× however many machines you add, and 10 machines give about 5.3×."]],"disc":[["When would you scale up instead of out?","When the work is hard to split: a relational database of moderate size, an older app that keeps state in memory, or a job that needs a lot of memory in one place. Scaling up buys time with no code changes. You still plan for its ceiling (the largest machine available) and for failure (a standby copy), and you move to scaling out when the next size up is too costly or one big machine is too big a risk."],["Where should session state live in a horizontally scaled web app?","Out of the app servers' memory. Common choices are a shared in-memory store such as Redis (fast and supports expiry, but one more system to run and keep available), the database (simple but slower), or a signed token in a cookie (no server storage at all, but it can't be cancelled before it expires without a deny-list, and it's sent with every request). Sticky sessions are a stopgap, not a design."]],"teach":{"prompt":"Explain to a junior colleague how you'd take a single-server web app to ten servers, and what you'd have to change first.","rubric":["Scaling up first can be fine, but it has a ceiling and a single point of failure","Scaling out needs a load balancer and stateless servers","Session state moves to a shared store or a signed token","Throughput is set by the bottleneck tier, often the database","Leave headroom at the peak and plan for one server failing (N+1)"],"model":"The quickest win is often a bigger machine, but that has a ceiling and leaves one box whose failure takes everything down, so for real growth you add servers behind a load balancer. Before that works, the servers must be stateless: anything kept in memory between requests, such as sessions, carts or uploaded files, has to move to a shared store, a database or object storage, or into a signed token, so that any server can answer any request. Sticky sessions would hide the problem but give uneven load and lost sessions on a crash. Then I'd measure: the whole system only goes as fast as its slowest tier, and once the web tier scales, that's usually the database, so it gets a cache or read replicas next. I'd size for the peak, keep each server at about 70% busy there, and add one spare so a failure doesn't hurt. Finally I'd check concurrency with Little's law, because slow downstream calls tie up workers even when the CPU looks idle."},"qa":[["What is vertical scaling?","Making one machine bigger (more CPU, memory, faster disks): simple, but with a ceiling and a single point of failure."],["What is horizontal scaling?","Adding more machines that share the work, usually behind a load balancer."],["What makes a service stateless?","It keeps nothing about a user between requests, so any server can answer any request."],["What does Little's law say?","Requests in flight = arrival rate × time each one spends in the system (L = λW)."],["What does Amdahl's law say?","The serial part caps the speed-up: with a share p of the work parallel, the speed-up stays below 1/(1 − p)."],["What is N+1 redundancy?","One more server than the peak needs, so losing any one still carries the load."]],"quiz":[{"q":"What does this print? (`servers_needed` / `serversNeeded` and `bottleneck` are this module's helpers.)","snip":{"t":"Sizing and the bottleneck","tabs":[{"lang":"python","src":"print(servers_needed(1_000, 200), servers_needed(1_000, 200, 100),\n      bottleneck([(\"app\", 4, 300), (\"cache\", 1, 5_000), (\"db\", 2, 500)])[0])\n"},{"lang":"javascript","src":"console.log(serversNeeded(1000, 200), serversNeeded(1000, 200, 100),\n  bottleneck([[\"app\", 4, 300], [\"cache\", 1, 5000], [\"db\", 2, 500]])[0]);\n"}]},"o":["8 5 db","5 5 db","8 5 app","7 5 db"],"a":0,"e":"At 70% busy each server carries 140 requests per second, and 1,000 ÷ 140 = 7.1 rounds up to 8. At 100% it's exactly 5. The tiers carry 1,200, 5,000 and 1,000 requests per second, so the database is the limit."},{"q":"What does this print?","snip":{"t":"Requests in flight","tabs":[{"lang":"python","src":"rps, latency_ms = 400, 250\nin_flight = rps * latency_ms // 1000\nprint(in_flight, math.ceil(in_flight / 16), math.ceil(in_flight * 2 / 16))\n"},{"lang":"javascript","src":"const rps = 400, latencyMs = 250;\nconst inFlight = Math.floor((rps * latencyMs) / 1000);\nconsole.log(inFlight, Math.ceil(inFlight / 16), Math.ceil((inFlight * 2) / 16));\n"}]},"o":["100 7 13","100 6 12","1600 100 200","100 7 14"],"a":0,"e":"250 ms is a quarter of a second, so 400 requests a second means 100 in flight (Little's law). 100 ÷ 16 = 6.25 rounds up to 7 servers of 16 workers. At double the latency 200 are in flight, and 12.5 rounds up to 13, not 14: round after doubling, not before."},{"q":"Your app keeps each user's shopping cart in the web server's memory. You add a second server behind a round-robin load balancer. What happens, and what's the best fix?","o":["Carts seem to empty and refill as requests alternate between servers; move carts to a shared store (or a signed token) so any server can answer","Nothing changes, because the load balancer copies memory between the servers","The app gets twice as fast, so nothing needs fixing","Carts are fine, but the database is overloaded, so add a read replica"],"a":0,"e":"Each server only sees the items added through it, so the cart a user sees depends on which server answers. A load balancer forwards requests; it doesn't copy memory. The fix is to make the servers stateless."},{"q":"Which changes make a web tier easier to scale out? (choose 2)","t":"ms","o":["Keep sessions in a shared store such as Redis instead of server memory","Keep uploaded files in shared object storage instead of on each server's local disk","Pin every user to one server with sticky sessions","Give each server its own copy of the database, updated separately","Move to the largest machine available"],"a":[0,1],"e":"Shared sessions and shared file storage let any server answer any request. Sticky sessions keep the state in memory (with all its problems), separate database copies drift apart, and a bigger machine is scaling up, not out."},{"q":"Judge each statement.","t":"yn","s":[["With 10% of the work serial, no number of machines gives a 10× speed-up.",true],["Adding app servers raises throughput even when the database is the bottleneck.",false],["By Little's law, 500 requests per second at 100 ms each means about 50 requests in flight.",true],["A server at 50% CPU can always take twice its traffic with the same response time.",false]],"e":"Amdahl's law: the speed-up creeps towards 1 ÷ 0.1 = 10 but never reaches it. Throughput is capped by the slowest tier. 500 × 0.1 s = 50. And queueing makes response times climb steeply as a server nears 100% busy, and another resource may run out first."},{"q":"Put the steps of sizing a web tier in order.","t":"ord","items":["Divide the requests per day by 86,400 to get the average per second","Multiply by the peak factor to get the peak requests per second","Divide by what one server carries at the target utilisation, and round up","Add one server so that the peak still fits when any one fails (N+1)"],"e":"Each step uses the result of the one before: the average gives the peak, the peak gives the server count, and the spare is added to that count."},{"q":"Complete the JavaScript function that sizes servers by concurrency.","t":"drop","lang":"javascript","code":"function serversForConcurrency(rps, latencyMs, workersPerServer) {\n  const inFlight = {{0}};\n  return {{1}};\n}\n","blanks":[{"o":["(rps * latencyMs) / 1000","rps / latencyMs","rps * latencyMs","(latencyMs / rps) * 1000"],"a":0},{"o":["Math.ceil(inFlight / workersPerServer)","Math.floor(inFlight / workersPerServer)","Math.round(inFlight / workersPerServer)","inFlight * workersPerServer"],"a":0}],"e":"Little's law with the latency in seconds gives the requests in flight, and rounding up is the only safe choice: rounding down or to the nearest leaves some requests without a worker."},{"q":"Match each idea to its name.","t":"match","pairs":[["One bigger machine with more CPU and memory","Vertical scaling"],["More machines sharing the work behind a load balancer","Horizontal scaling"],["Any server can answer any request","Stateless service"],["Requests in flight = arrival rate × time in the system","Little's law"]],"extra":["Sticky sessions"],"e":"Sticky sessions are the opposite of statelessness: they tie each user to one server so that state can stay in its memory."}],"probs":[["Exercise · Check an app against factor VI","https://12factor.net/processes","","list where an app you know keeps sessions, uploads and caches, and move each one out of the process on paper"],["Exercise · Why the default session store doesn't scale","https://expressjs.com/en/resources/middleware/session.html","","read the warning about MemoryStore, then sketch the same app with a shared session store behind a load balancer"],["Exercise · How an autoscaler picks a server count","https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/","","work through its replica formula for 4 replicas at 90% CPU with a 60% target, then compare it with servers_needed"],["Reference · Amdahl's law","https://en.wikipedia.org/wiki/Amdahl%27s_law","","sketch the speed-up for 50%, 90% and 99% parallel work as machines are added; where does each curve flatten?"]],"src":[["The Twelve-Factor App: VI. Processes","https://12factor.net/processes"],["Kubernetes: Horizontal Pod Autoscaling","https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"],["Google SRE book: Handling overload","https://sre.google/sre-book/handling-overload/"],["Wikipedia: Little's law","https://en.wikipedia.org/wiki/Little%27s_law"],["Wikipedia: Amdahl's law","https://en.wikipedia.org/wiki/Amdahl%27s_law"]]},{"id":"m03","d":"d2","t":"Availability: nines, redundancy and failing well","min":95,"hook":"Disks, servers and whole data centres fail, so the question is never whether parts break but how the system behaves when they do. Availability depends on how the parts are wired: parts in a chain multiply their availabilities down, while spare copies side by side multiply the chances of failure down. Add timeouts and careful retries, and you have the reliability basics every design review asks about.","pre":{"q":"A request passes through a load balancer, an app server and a database, each available 99.9% of the time. What's the availability of the whole path? And if you add a second app server, either of which will do, what does the app tier become?","a":"In a chain all three must be up, so 0.999³ ≈ 99.7%: about 26 hours down a year instead of 8.8. Two independent app servers fail together only 0.001² of the time, so the app tier becomes 99.9999%. But the path is still a chain, and the single load balancer and database now limit it."},"kid":{"t":"Bridges on the way to Grandma's","x":"On the road trip to Grandma's, the family must cross three rivers, one after another. If any bridge is closed, they can't get there: the trip needs every river crossing open. At the widest river there are two bridges side by side. If one is closed, Dad takes the other, so they're stuck there only if both are closed on the same day. At Grandma's, Tara phones Luigi's, but the line is busy. She tries again after one minute, then two, then four. Ben points out that if the whole street rang back at exactly the same moment, the line would stay busy, so everyone should wait a slightly different time.","map":[["Three rivers to cross, one after another","Parts in series: every one must be up, so their availabilities multiply"],["Two bridges side by side over the widest river","Redundant copies in parallel: the tier works while any copy is up"],["Stuck only if both bridges close on the same day","Independent copies fail together rarely: down only (1 − a)² of the time"],["Trying again after one, two, then four minutes","Retries with exponential backoff"],["Everyone waiting a slightly different time","Jitter: random waits so retries don't arrive in waves"]],"brk":"Real failures are often not independent: one flood can close both bridges, just as one power cut can stop two servers in the same rack. The parallel formula assumes independence, so spread copies across failure domains and treat its answer as a best case."},"keys":["**Availability**: the share of time, or of requests, for which the system does its job. Each extra nine cuts the allowed downtime tenfold: 99.9% allows about 8.8 hours a year (43 minutes in a 30-day month), 99.99% about 53 minutes a year.","**SLI, SLO and SLA**: an SLI is what you measure (say, the share of requests answered successfully within 300 ms), an SLO is your target for it (99.9% over 30 days), and an SLA is a contract with users that says what happens, often service credits, if you miss it. An SLA is usually set looser than the internal SLO, so the team hears about trouble first.","**Error budget**: 100% minus the SLO. At 99.9% you may fail 0.1% of requests, about 43 minutes of full outage in 30 days. While budget is left, you can ship changes faster; when it's spent, reliability work comes first.","**Parts in series multiply**: if a request needs every part, availability = a₁ × a₂ × … × aₙ, which is lower than the weakest part. Three parts at 99.9% give about 99.7%: every dependency you add costs availability.","**Copies in parallel**: if any one of n independent copies will do, the tier is down only when all are: availability = 1 − (1 − a)ⁿ. Two copies at 99.9% give 99.9999%. That's why every tier that matters gets at least two copies, leaving no single point of failure.","**Correlated failures**: the parallel formula assumes copies fail independently, but servers in one rack, one data centre or one region can fail together (power, network, a bad deploy). Spread copies across failure domains such as availability zones, and treat the formula as a best case.","**Failover**: redundancy needs a way to switch: health checks to notice a failure and a load balancer or failover process to stop using the broken copy. Active-active copies all serve traffic; active-passive keeps a standby that takes over, which takes time and must be tested.","**Timeouts and retries**: always set a timeout, or one slow dependency ties up every worker. Retry only errors that may pass (timeouts, 503s), only for operations that are safe to repeat, a few times, with exponential backoff and jitter. Retries at every layer multiply: three layers that each try 3 times can send 3 × 3 × 3 = 27 attempts to the bottom for one user request."],"dia":[{"type":"tiers","cap":"Series and parallel in one path","tiers":[["Load balancer",["LB · 99.99%"]],["App tier",["app 1 · 99.9%","app 2 · 99.9%"],"either server will do"],["Database",["primary · 99.95%"],"every request needs it"]],"note":"The app tier alone is 1 − 0.001² = 99.9999%. The path multiplies the tiers: 0.9999 × 0.999999 × 0.9995 ≈ 99.94%, so the single database is now the weakest link."},{"type":"layers","cap":"What the nines allow (365-day year, 30-day month)","rows":[["99% (two nines)","3.65 days a year · 7.2 hours a month"],["99.9% (three nines)","8.8 hours a year · 43 minutes a month"],["99.99% (four nines)","53 minutes a year · 4.3 minutes a month"],["99.999% (five nines)","5.3 minutes a year · 26 seconds a month"]],"note":"Each extra nine allows a tenth of the downtime, and usually costs far more than the one before."},{"type":"seq","cap":"Retrying with exponential backoff and full jitter","actors":["Client","Server"],"msgs":[["Client","Server","GET /menu"],["Server","Client","503 Service Unavailable",true],["Client","Server","retry after a random wait of up to 100 ms"],["Server","Client","503 again",true],["Client","Server","retry after a random wait of up to 200 ms"],["Server","Client","200 OK",true]],"note":"The ceiling doubles after each failure, and each wait is random below it, so clients that failed together don't come back together. If the attempts run out first, the client gives up and reports the error."}],"cmp":[{"cap":"SLI, SLO, SLA and the error budget","head":["","What it is","Example","Who uses it"],"rows":[["SLI","A measurement of the service","Share of requests answered successfully in under 300 ms","Engineers, on dashboards and alerts"],["SLO","A target for an SLI over a window","99.9% of requests over 30 days","The team and its stakeholders"],["SLA","A contract with consequences","Below 99.5% in a month, customers get service credits","Customers and the business"],["Error budget","What the SLO lets you fail","0.1% of requests: about 43 minutes of full outage in 30 days","The team, to decide when to slow down"]]},{"cap":"Two ways to run redundant copies","head":["","Active-active","Active-passive (standby)"],"rows":[["Who serves traffic","Every copy, all the time","Only the active copy; the standby waits"],["When a copy fails","The others take its share, if they have headroom","Failover promotes the standby, which takes seconds to minutes"],["Typical use","Stateless app servers, load balancers","Databases with one writable primary"],["Watch out for","Every copy needs spare capacity for the lost share","A standby that's never tested may not work when needed"]]}],"code":[{"t":"Availability helpers and the seeded random generator used below","tabs":[{"lang":"python","src":"def serial(*parts):\n    \"\"\"Every part must be up: multiply their availabilities.\"\"\"\n    up = 1.0\n    for a in parts:\n        up *= a\n    return up\n\ndef parallel(a, copies):\n    \"\"\"Up while at least one of `copies` independent copies is up.\"\"\"\n    down = 1.0\n    for _ in range(copies):\n        down *= 1 - a                           # every copy down at the same moment\n    return 1 - down\n\ndef downtime_per_year(a):\n    \"\"\"Hours a year the system is down at availability a (365 days = 8,760 hours).\"\"\"\n    return (1 - a) * 8760\n\ndef mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function serial(...parts) {\n  // every part must be up: multiply their availabilities\n  let up = 1;\n  for (const a of parts) up *= a;\n  return up;\n}\n\nfunction parallel(a, copies) {\n  // up while at least one of `copies` independent copies is up\n  let down = 1;\n  for (let i = 0; i < copies; i++) down *= 1 - a;   // every copy down at the same moment\n  return 1 - down;\n}\n\nfunction downtimePerYear(a) {\n  // hours a year the system is down at availability a (365 days = 8,760 hours)\n  return (1 - a) * 8760;\n}\n\nfunction mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"The nines, series and parallel","tabs":[{"lang":"python","src":"for label, a in ((\"99%\", 0.99), (\"99.9%\", 0.999), (\"99.99%\", 0.9999), (\"99.999%\", 0.99999)):\n    print(f\"{label}: {downtime_per_year(a):.1f} h a year, {(1 - a) * 720 * 60:.1f} min a month\")\n\none_each = serial(0.999, 0.999, 0.999)        # load balancer -> app -> database, one of each\napp_pair = serial(0.999, parallel(0.999, 2), 0.999)\nall_pairs = serial(*[parallel(0.999, 2)] * 3)\nprint(f\"{one_each * 100:.4f}% {app_pair * 100:.4f}% {all_pairs * 100:.4f}%\")\n","out":"99%: 87.6 h a year, 432.0 min a month\n99.9%: 8.8 h a year, 43.2 min a month\n99.99%: 0.9 h a year, 4.3 min a month\n99.999%: 0.1 h a year, 0.4 min a month\n99.7003% 99.8000% 99.9997%\n","notes":[[2,"Each extra nine cuts the downtime tenfold: 99.9% still allows about 8.8 hours a year, or 43 minutes a month."],[4,"Three parts in a chain at 99.9% each: only 99.7% for the path, about 26 hours down a year."],[5,"Doubling only the app tier barely helps (99.80%): the load balancer and the database are still single points of failure."],[6,"With every tier doubled, each tier is 99.9999% and the path reaches 99.9997%, if the copies fail independently."]]},{"lang":"javascript","src":"for (const [label, a] of [[\"99%\", 0.99], [\"99.9%\", 0.999], [\"99.99%\", 0.9999], [\"99.999%\", 0.99999]]) {\n  console.log(`${label}: ${downtimePerYear(a).toFixed(1)} h a year, ${((1 - a) * 720 * 60).toFixed(1)} min a month`);\n}\n\nconst oneEach = serial(0.999, 0.999, 0.999);  // load balancer -> app -> database, one of each\nconst appPair = serial(0.999, parallel(0.999, 2), 0.999);\nconst allPairs = serial(...Array(3).fill(parallel(0.999, 2)));\nconsole.log(`${(oneEach * 100).toFixed(4)}% ${(appPair * 100).toFixed(4)}% ${(allPairs * 100).toFixed(4)}%`);\n","out":"99%: 87.6 h a year, 432.0 min a month\n99.9%: 8.8 h a year, 43.2 min a month\n99.99%: 0.9 h a year, 4.3 min a month\n99.999%: 0.1 h a year, 0.4 min a month\n99.7003% 99.8000% 99.9997%\n","notes":[[2,"Each extra nine cuts the downtime tenfold: 99.9% still allows about 8.8 hours a year, or 43 minutes a month."],[5,"Three parts in a chain at 99.9% each: only 99.7% for the path, about 26 hours down a year."],[6,"Doubling only the app tier barely helps (99.80%): the load balancer and the database are still single points of failure."],[7,"With every tier doubled, each tier is 99.9999% and the path reaches 99.9997%, if the copies fail independently."]]}]},{"t":"Checking the maths with a seeded simulation, and what a shared cause does","tabs":[{"lang":"python","src":"def simulate(tiers, hours, seed=1):\n    \"\"\"Each tier is (availability, copies, shared): shared is the chance one cause stops every copy.\"\"\"\n    rand = mulberry32(seed)\n    down_hours = 0\n    for _ in range(hours):\n        up = True\n        for a, copies, shared in tiers:\n            common = rand() < shared                         # a rack power cut, a bad deploy, a zone outage\n            alive = sum(rand() < a for _ in range(copies))   # each copy's own luck\n            up = up and not common and alive > 0\n        down_hours += 0 if up else 1\n    return down_hours\n\none = (0.999, 1, 0)                           # a single load balancer or database\ndesigns = [(\"one app server\", [one, one, one]),\n           (\"two app servers\", [one, (0.999, 2, 0), one]),\n           (\"two on one power supply\", [one, (0.999, 2, 0.001), one])]\nfor name, tiers in designs:\n    model = 1 - serial(*[parallel(a, copies) for a, copies, _ in tiers])\n    print(f\"{name}: {simulate(tiers, 100_000)} hours down in 100,000; independent model: {model * 100_000:.0f}\")\n","out":"one app server: 305 hours down in 100,000; independent model: 300\ntwo app servers: 212 hours down in 100,000; independent model: 200\ntwo on one power supply: 301 hours down in 100,000; independent model: 200\n","notes":[[8,"One draw decides whether a shared cause hits the whole tier this hour, whatever the copies' own luck."],[9,"Each copy is up with probability a, independently of the others."],[20,"Close to the model for independent copies (the small gaps are chance), until a shared cause appears: on one power supply the pair is down about as often as a single server."]]},{"lang":"javascript","src":"function simulate(tiers, hours, seed = 1) {\n  // each tier is [availability, copies, shared]: shared is the chance one cause stops every copy\n  const rand = mulberry32(seed);\n  let downHours = 0;\n  for (let h = 0; h < hours; h++) {\n    let up = true;\n    for (const [a, copies, shared] of tiers) {\n      const common = rand() < shared;                            // a rack power cut, a bad deploy, a zone outage\n      let alive = 0;\n      for (let c = 0; c < copies; c++) if (rand() < a) alive++;  // each copy's own luck\n      up = up && !common && alive > 0;\n    }\n    if (!up) downHours++;\n  }\n  return downHours;\n}\n\nconst one = [0.999, 1, 0];                    // a single load balancer or database\nconst designs = [[\"one app server\", [one, one, one]],\n  [\"two app servers\", [one, [0.999, 2, 0], one]],\n  [\"two on one power supply\", [one, [0.999, 2, 0.001], one]]];\nfor (const [name, tiers] of designs) {\n  const model = 1 - serial(...tiers.map(([a, copies]) => parallel(a, copies)));\n  console.log(`${name}: ${simulate(tiers, 100000)} hours down in 100,000; independent model: ${(model * 100000).toFixed(0)}`);\n}\n","out":"one app server: 305 hours down in 100,000; independent model: 300\ntwo app servers: 212 hours down in 100,000; independent model: 200\ntwo on one power supply: 301 hours down in 100,000; independent model: 200\n","notes":[[8,"One draw decides whether a shared cause hits the whole tier this hour, whatever the copies' own luck."],[10,"Each copy is up with probability a, independently of the others."],[24,"Close to the model for independent copies (the small gaps are chance), until a shared cause appears: on one power supply the pair is down about as often as a single server."]]}]},{"t":"Backoff, jitter and how retries multiply","tabs":[{"lang":"python","src":"def backoff_ms(attempt, base=100, cap=2_000):  # exponential: 100, 200, 400 ... capped at 2 s\n    return min(cap, base * 2 ** attempt)\n\nprint(\"waits:\", *(backoff_ms(n) for n in range(6)))\n\nrand = mulberry32(42)\nfor label, jitter in ((\"no jitter\", False), (\"full jitter\", True)):\n    slots = [0] * 11                          # 100 ms slots from 0 to 1,000 ms\n    for _ in range(1_000):                    # 1,000 clients failed at the same moment\n        wait = int(rand() * 1_000) if jitter else 1_000   # full jitter: anywhere in [0, 1,000)\n        slots[wait // 100] += 1\n    print(f\"{label}: the busiest 100 ms gets {max(slots)} of 1,000 retries\")\n\nprint(\"attempts at the bottom of 3 layers that each try 3 times:\", 3 ** 3)\n","out":"waits: 100 200 400 800 1600 2000\nno jitter: the busiest 100 ms gets 1000 of 1,000 retries\nfull jitter: the busiest 100 ms gets 116 of 1,000 retries\nattempts at the bottom of 3 layers that each try 3 times: 27\n","notes":[[4,"The ceiling doubles after each failure and stops at the cap, so a struggling server gets more breathing room each time."],[10,"Without jitter all 1,000 clients come back in the same instant, a wave that can knock an overloaded server down again."],[12,"With full jitter the same retries are spread across the whole second, about a tenth in each 100 ms."],[14,"Retries multiply across layers, so retry at one layer only, with a small cap."]]},{"lang":"javascript","src":"const backoffMs = (attempt, base = 100, cap = 2000) => Math.min(cap, base * 2 ** attempt);  // exponential: 100, 200, 400 ... capped at 2 s\n\nconsole.log(\"waits:\", ...Array.from({ length: 6 }, (_, n) => backoffMs(n)));\n\nconst rand = mulberry32(42);\nfor (const [label, jitter] of [[\"no jitter\", false], [\"full jitter\", true]]) {\n  const slots = new Array(11).fill(0);        // 100 ms slots from 0 to 1,000 ms\n  for (let c = 0; c < 1000; c++) {            // 1,000 clients failed at the same moment\n    const wait = jitter ? Math.floor(rand() * 1000) : 1000;   // full jitter: anywhere in [0, 1,000)\n    slots[Math.floor(wait / 100)]++;\n  }\n  console.log(`${label}: the busiest 100 ms gets ${Math.max(...slots)} of 1,000 retries`);\n}\n\nconsole.log(\"attempts at the bottom of 3 layers that each try 3 times:\", 3 ** 3);\n","out":"waits: 100 200 400 800 1600 2000\nno jitter: the busiest 100 ms gets 1000 of 1,000 retries\nfull jitter: the busiest 100 ms gets 116 of 1,000 retries\nattempts at the bottom of 3 layers that each try 3 times: 27\n","notes":[[3,"The ceiling doubles after each failure and stops at the cap, so a struggling server gets more breathing room each time."],[9,"Without jitter all 1,000 clients come back in the same instant, a wave that can knock an overloaded server down again."],[12,"With full jitter the same retries are spread across the whole second, about a tenth in each 100 ms."],[15,"Retries multiply across layers, so retry at one layer only, with a small cap."]]}]}],"ex":{"q":"A checkout path runs through a load balancer (99.99%), two app servers (99.9% each, either will do) and one database (99.95%). The target is 99.95% for the whole path. Does design A meet it? Design B replaces the single database with a primary and a standby that fails over automatically; failover isn't instant, so assume the pair reaches 99.99% rather than the ideal 1 − 0.0005². Does B meet it, and how many minutes a 30-day month does each design allow?","steps":["The path is up only when the load balancer, the app tier and the database are all up, so multiply the tiers.","The app tier is down only when both servers are: 1 − 0.001² = 99.9999%. It's no longer the problem.","Design A: 0.9999 × 0.999999 × 0.9995 ≈ 99.940%, about 26 minutes down a month. The target allows 0.05% of 43,200 minutes = 21.6, so A misses it, and the single database is why.","Design B: 0.9999 × 0.999999 × 0.9999 ≈ 99.980%, under 9 minutes a month, so B meets it. Fix the weakest link first, and remember these are best cases that assume independent failures."],"code":{"t":"Availability of two designs against a target","tabs":[{"lang":"python","src":"def path(parts):                              # parts: (availability, copies), one after another\n    return serial(*[parallel(a, copies) for a, copies in parts])\n\nlb, apps, db, db_pair = (0.9999, 1), (0.999, 2), (0.9995, 1), (0.9999, 1)\nfor name, parts in ((\"A\", [lb, apps, db]), (\"B\", [lb, apps, db_pair])):\n    a = path(parts)\n    met = \"yes\" if a >= 0.9995 else \"no\"\n    print(f\"{name}: {a * 100:.3f}%, {(1 - a) * 43_200:.1f} min down a month, target met: {met}\")\n","out":"A: 99.940%, 26.0 min down a month, target met: no\nB: 99.980%, 8.7 min down a month, target met: yes\n"},{"lang":"javascript","src":"const path = parts => serial(...parts.map(([a, copies]) => parallel(a, copies)));   // parts: [availability, copies], one after another\n\nconst lb = [0.9999, 1], apps = [0.999, 2], db = [0.9995, 1], dbPair = [0.9999, 1];\nfor (const [name, parts] of [[\"A\", [lb, apps, db]], [\"B\", [lb, apps, dbPair]]]) {\n  const a = path(parts);\n  const met = a >= 0.9995 ? \"yes\" : \"no\";\n  console.log(`${name}: ${(a * 100).toFixed(3)}%, ${((1 - a) * 43200).toFixed(1)} min down a month, target met: ${met}`);\n}\n","out":"A: 99.940%, 26.0 min down a month, target met: no\nB: 99.980%, 8.7 min down a month, target met: yes\n"}]},"a":"Design A reaches about 99.940%, roughly 26 minutes down a month, and misses the 99.95% target (21.6 minutes). Design B reaches about 99.980%, under 9 minutes a month, and meets it: improving the weakest link, the single database, is what mattered."},"fade":{"q":"Finish `call_with_retries(op, max_attempts, rand)`: call `op()`; if it raises a timeout, wait a random time below min(cap, base × 2^attempt) (full jitter) and try again, up to `max_attempts` calls in all. Return the result and the list of waits; re-raise the error when the attempts run out, and never retry other errors.","steps":["Retry only errors that may pass (timeouts, 503s), and only operations that are safe to repeat; module 8's idempotency keys make writes safe to retry.",{"ask":"How long is the wait before retry number n (counting from 0)?","a":"Random between 0 and min(cap, base × 2ⁿ): 100 ms, then 200, then 400, and so on up to the cap, so a struggling server gets more breathing room each time."},{"ask":"What should happen after the last attempt fails, or on an error that isn't a timeout?","a":"Raise it to the caller straight away. Retrying a bad request or a bug can't help, and the caller decides what to show or log once the attempts run out."},{"ask":"What does this cost?","a":"Up to max_attempts calls per request, plus the waits: O(max_attempts) time, and O(max_attempts) memory for the list of waits. Retries add load exactly when a service struggles, so keep the cap small and retry at one layer only."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class Flaky:                                  # times out on the first `failures` calls, then succeeds\n    def __init__(self, failures):\n        self.failures = failures\n    def __call__(self):\n        if self.failures > 0:\n            self.failures -= 1\n            raise TimeoutError(\"timed out\")\n        return \"ok\"\n\ndef call_with_retries(op, max_attempts, rand, base=100, cap=2_000):\n    waits = []                                # the waits we would sleep for, in ms\n    ...                                       # TODO: try op(); on TimeoutError wait with full jitter and retry\n"},{"lang":"javascript","src":"class TimeoutError extends Error {}\n\nfunction flaky(failures) {                    // times out on the first `failures` calls, then succeeds\n  return () => {\n    if (failures > 0) { failures--; throw new TimeoutError(\"timed out\"); }\n    return \"ok\";\n  };\n}\n\nfunction callWithRetries(op, maxAttempts, rand, base = 100, cap = 2000) {\n  const waits = [];                           // the waits we would sleep for, in ms\n  // TODO: try op(); on TimeoutError wait with full jitter and retry\n}\n"}]},"solution":{"t":"Solution: full jitter, a cap on attempts, and only retryable errors","tabs":[{"lang":"python","src":"class Flaky:                                  # times out on the first `failures` calls, then succeeds\n    def __init__(self, failures):\n        self.failures = failures\n    def __call__(self):\n        if self.failures > 0:\n            self.failures -= 1\n            raise TimeoutError(\"timed out\")\n        return \"ok\"\n\ndef call_with_retries(op, max_attempts, rand, base=100, cap=2_000):\n    waits = []                                # the waits we would sleep for, in ms\n    for attempt in range(max_attempts):\n        try:\n            return op(), waits\n        except TimeoutError:                  # only retry errors that may pass\n            if attempt == max_attempts - 1:\n                raise                         # out of attempts: let the caller decide\n            waits.append(int(rand() * min(cap, base * 2 ** attempt)))   # full jitter\n\nrand = mulberry32(3)\nresult, waits = call_with_retries(Flaky(3), 5, rand)\nprint(result, \"after waits of\", *waits, \"ms\")\ntry:\n    call_with_retries(Flaky(9), 4, rand)\nexcept TimeoutError:\n    print(\"gave up after 4 attempts\")\n","out":"ok after waits of 72 7 182 ms\ngave up after 4 attempts\n"},{"lang":"javascript","src":"class TimeoutError extends Error {}\n\nfunction flaky(failures) {                    // times out on the first `failures` calls, then succeeds\n  return () => {\n    if (failures > 0) { failures--; throw new TimeoutError(\"timed out\"); }\n    return \"ok\";\n  };\n}\n\nfunction callWithRetries(op, maxAttempts, rand, base = 100, cap = 2000) {\n  const waits = [];                           // the waits we would sleep for, in ms\n  for (let attempt = 0; attempt < maxAttempts; attempt++) {\n    try {\n      return [op(), waits];\n    } catch (err) {\n      if (!(err instanceof TimeoutError) || attempt === maxAttempts - 1) throw err;   // not retryable, or out of attempts\n      waits.push(Math.floor(rand() * Math.min(cap, base * 2 ** attempt)));          // full jitter\n    }\n  }\n}\n\nconst rand = mulberry32(3);\nconst [result, waits] = callWithRetries(flaky(3), 5, rand);\nconsole.log(result, \"after waits of\", ...waits, \"ms\");\ntry {\n  callWithRetries(flaky(9), 4, rand);\n} catch (err) {\n  console.log(\"gave up after 4 attempts\");\n}\n","out":"ok after waits of 72 7 182 ms\ngave up after 4 attempts\n"}]}},"traps":[["“Two servers make the service twice as available.”","Availability can't double; what shrinks is the chance of being down. Two independent 99% servers are down together only 0.01% of the time, so the pair reaches 99.99%, if they really fail independently."],["“Our servers are 99.99%, so the service is 99.99%.”","A request crosses many parts in series (DNS, load balancer, app, database, a payment provider) and their availabilities multiply. Five parts at 99.99% give about 99.95% before anything else goes wrong."],["“Two copies in the same rack are redundant.”","A power or network failure in that rack takes both down together. Spread copies across failure domains (racks, availability zones, regions), or the parallel formula overstates your availability."],["“Retrying straight away is the quickest way to recover.”","Instant retries from many clients arrive together and can keep an overloaded server down. Wait with exponential backoff, add jitter, and cap the number of attempts."],["“Retry every failed request.”","Only errors that may pass (timeouts, 503s) and operations that are safe to repeat. Retrying a payment that actually went through can charge twice unless the API supports idempotency keys (module 8), and retrying a 400 Bad Request can never help."],["“100% availability is the right target.”","Each extra nine costs far more and slows down change, and users reach you through networks and devices that are less reliable than that anyway. Pick the SLO users need, and spend the error budget on shipping."]],"disc":[["How would you keep a web app with one database running if a whole availability zone fails?","Run the stateless app servers in at least two zones behind a load balancer that spans them, with enough headroom that either zone can carry the peak. Run the database as a primary in one zone with a standby in another that's kept up to date and promoted automatically, and test that failover regularly. Keep sessions and files in services that are themselves replicated across zones. Then look for the remaining single points: DNS, configuration and the deploy tooling."],["Why can retries make an outage worse, and what do you do about it?","When a service is overloaded, every failed request comes back as more requests, so the load rises exactly when capacity is short, and retries at several layers multiply. Set timeouts, retry at one layer with a small cap, use exponential backoff with jitter, and add a circuit breaker that stops calling a dependency that keeps failing, so it has room to recover."]],"teach":{"prompt":"Explain to a junior colleague how you'd estimate the availability of a three-tier web app, and how you'd raise it.","rubric":["Parts in series multiply, so every dependency lowers availability","Copies in parallel are down only when all are down: 1 − (1 − a)ⁿ","The formula assumes independent failures, so spread copies across zones","Find the weakest link and fix it first","Timeouts, a few retries with backoff and jitter, and tested failover"],"model":"I'd draw the request path and give each part an availability. Parts a request needs one after another multiply, so three parts at 99.9% give about 99.7%, and every new dependency lowers the total. A tier with spare copies is down only when all of them are, so two independent servers at 99.9% give 99.9999%. That makes the weakest link easy to find: usually the single database or a third-party API, so that's where redundancy or a standby with automatic failover goes first. The parallel maths assumes copies fail independently, so I'd put them in different availability zones and treat the result as a best case. Finally I'd make failures cheap: timeouts on every call, a few retries with exponential backoff and jitter at one layer, and failover that's actually tested."},"qa":[["Downtime allowed by 99.9% availability?","About 8.8 hours a year, or 43 minutes in a 30-day month."],["Availability of parts in series?","The product of their availabilities: 0.999 × 0.999 × 0.999 ≈ 99.7%."],["Availability of n independent copies in parallel?","1 − (1 − a)ⁿ: two copies at 99.9% give 99.9999%."],["What is an error budget?","100% minus the SLO: the failures you may spend on change and risk in the window."],["Why add jitter to retries?","So clients that failed together don't retry together in synchronised waves."],["SLI vs SLO vs SLA?","What you measure, the target you set for it, and a contract with consequences for users."]],"quiz":[{"q":"What does this print? (`serial` and `parallel` are this module's helpers.)","snip":{"t":"Series and parallel","tabs":[{"lang":"python","src":"print(f\"{serial(0.99, 0.99) * 100:.2f} {parallel(0.99, 2) * 100:.2f} {serial(0.99, parallel(0.9, 3)) * 100:.2f}\")\n"},{"lang":"javascript","src":"console.log(`${(serial(0.99, 0.99) * 100).toFixed(2)} ${(parallel(0.99, 2) * 100).toFixed(2)} ${(serial(0.99, parallel(0.9, 3)) * 100).toFixed(2)}`);\n"}]},"o":["98.01 99.99 98.90","99.00 99.99 98.90","98.01 99.98 98.90","98.01 99.99 99.90"],"a":0,"e":"Two parts in series at 99%: 0.99² = 98.01%. Two copies in parallel are down only when both are: 1 − 0.01² = 99.99%. Three copies at 90% make 99.9%, which in series with a 99% part gives 98.90%."},{"q":"What does this print? (Backoff waits for seven attempts, then the worst-case attempts when 2 layers each try 4 times.)","snip":{"t":"Capped backoff and multiplying retries","tabs":[{"lang":"python","src":"print(*(min(1_000, 50 * 2 ** n) for n in range(7)), 4 ** 2)\n"},{"lang":"javascript","src":"console.log(...Array.from({ length: 7 }, (_, n) => Math.min(1000, 50 * 2 ** n)), 4 ** 2);\n"}]},"o":["50 100 200 400 800 1000 1000 16","50 100 200 400 800 1600 3200 16","50 100 200 400 800 1000 1000 8","100 200 400 800 1000 1000 1000 16"],"a":0,"e":"The waits double from 50 ms and stop at the 1,000 ms cap. Two layers that each make up to 4 attempts can send 4 × 4 = 16 calls to the bottom layer for one request, not 4 + 4 = 8."},{"q":"A team runs two app servers for redundancy, both in the same rack on one power supply. What's the main flaw?","o":["One power failure stops both, so the pair is much less available than 1 − (1 − a)² suggests","Two servers are always less available than one","A load balancer can only send traffic to one server at a time","Redundant servers double the error budget"],"a":0,"e":"The parallel formula assumes independent failures; a shared power supply is a common cause that takes both down together. More copies never lower availability by themselves, load balancers spread traffic across many servers, and the error budget comes from the SLO, not the server count."},{"q":"Which practices stop retries from making an outage worse? (choose 2)","t":"ms","o":["Exponential backoff with jitter between attempts","A small cap on attempts, retrying at one layer only","Retrying straight away so users wait less","Retrying every error, including 400 Bad Request","Removing timeouts so that calls never fail"],"a":[0,1],"e":"Backoff with jitter spreads the retries out, and a small cap at one layer stops them multiplying. Instant retries arrive in waves, a 400 will fail again however often it's sent, and without timeouts slow calls tie up every worker."},{"q":"Judge each statement.","t":"yn","s":[["Three parts in series at 99.9% each give about 99.7% for the whole path.",true],["Two independent copies at 99.9% each give 99.9999% for the tier.",true],["An SLA is usually set stricter than the team's internal SLO.",false],["An SLO of 99.9% over 30 days allows about 43 minutes of full outage.",true]],"e":"0.999³ ≈ 0.997. Two copies: 1 − 0.001² = 0.999999. An SLA is usually looser than the SLO, so the team notices problems before customers are owed anything. And 0.1% of 43,200 minutes is 43.2."},{"q":"Put the steps of handling a failed call in order.","t":"ord","items":["Wait for the response, up to the timeout","Check that the error is one that may pass, such as a timeout or a 503","Wait a random time below the current backoff ceiling","Retry the call, and double the ceiling for the next failure"],"e":"You can only judge the error once the call has failed or timed out, you only wait if the error is worth retrying, and the retry comes after the wait."},{"q":"Complete the Python function for the availability of a tier with redundant copies.","t":"drop","lang":"python","code":"def tier_availability(a, copies):\n    down = 1.0\n    for _ in range(copies):\n        down {{0}}\n    return {{1}}\n","blanks":[{"o":["*= 1 - a","*= a","+= 1 - a","-= a"],"a":0},{"o":["1 - down","down","1 - down * copies","down / copies"],"a":0}],"e":"The tier is down only when every copy is down, which happens with probability (1 − a)ⁿ, so the availability is 1 minus that."},{"q":"Match each term to its meaning.","t":"match","pairs":[["What you measure, such as the share of fast, successful requests","SLI"],["The target for that measurement over a window","SLO"],["A contract with consequences if the target is missed","SLA"],["The failures the target still allows","Error budget"]],"extra":["Failover"],"e":"Failover is switching to a standby copy when the active one fails, a way to protect the SLO rather than a measure of it."}],"probs":[["Exercise · Read a real SLA","https://cloud.google.com/compute/sla","","find the monthly uptime percentages and the credits below them, and turn each percentage into minutes per month"],["Exercise · Set an SLO and its error budget","https://sre.google/workbook/implementing-slos/","","pick a service you use, choose one SLI and a 30-day SLO, and work out the error budget in minutes and in failed requests at 100 requests per second"],["Exercise · Timeouts, retries and backoff with jitter","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/","","read why retries multiply across layers, then add a retry budget to this module's call_with_retries"],["Exercise · Map your failure domains","https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html","","sketch a two-zone version of the module's three-tier app and list what still fails if one zone goes down"]],"src":[["Google SRE book: Embracing risk","https://sre.google/sre-book/embracing-risk/"],["Google SRE book: Service level objectives","https://sre.google/sre-book/service-level-objectives/"],["Google SRE workbook: Implementing SLOs","https://sre.google/workbook/implementing-slos/"],["Amazon Builders' Library: Timeouts, retries and backoff with jitter","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"],["AWS Architecture Blog: Exponential backoff and jitter","https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/"]]},{"id":"m04","d":"d2","t":"Load balancing: spreading requests and routing around failure","min":95,"hook":"A load balancer is the front door of every horizontally scaled service. It decides which server gets each request and stops sending traffic to servers that are failing. The algorithm it uses, and how its health checks decide that a server is up or down, change how evenly the load spreads and how quickly the system recovers from a failure.","pre":{"q":"Three servers sit behind a round-robin load balancer. One of them is twice as powerful as the others, and some requests take a hundred times longer than others. What goes wrong with plain round robin, and what would you use instead?","a":"Round robin gives every server the same number of requests, so the big server sits half idle while the small ones queue, and a server that happens to get several slow requests falls behind whatever its size. Weighted round robin (2 : 1 : 1) fixes the size difference; least connections sends each request to the server with the fewest in flight, which adapts to slow requests."},"kid":{"t":"Ben at the counter","x":"At Luigi's, Ben stands at the counter and hands each new order to the next cook in turn: Ana, then Bo, then Cy, then Ana again. Ana is twice as fast as the others, so Ben starts giving her two orders for every one he gives the others. Some pizzas take much longer than others, so Ben also glances at how many pizzas each cook already has and picks the least busy one. Every few minutes he asks each cook, “Are you OK?” If a cook doesn't answer twice in a row, Ben stops sending them orders until they've answered “OK” twice again.","map":[["Handing orders to Ana, Bo and Cy in turn","Round robin: each server gets the next request in rotation"],["Two orders for Ana for every one to the others","Weighted round robin: shares in proportion to capacity"],["Picking the cook with the fewest pizzas on the go","Least connections: the server with the fewest requests in flight"],["Asking “Are you OK?” every few minutes","Health checks: a regular probe of each server"],["Two missed answers to stop, two good ones to start again","Down and up thresholds, which stop a flaky server flapping in and out"]],"brk":"Ben sees every order, but real systems often run several load balancers, each seeing only its own share of the traffic, so “least busy” is each one's local guess. And a cook who answers “OK” might still burn every pizza: a health check only proves what it actually tests."},"keys":["**What a load balancer does**: it gives clients one address, spreads requests across a pool of servers, stops sending to servers that fail their health checks, and lets you add or remove servers without clients noticing. Common extras are TLS termination, reusing connections to the servers, and limits on request size and rate.","**Layer 4 and layer 7**: a layer 4 (transport) load balancer forwards TCP or UDP connections by address and port without reading them: fast, and it works for any protocol. A layer 7 (application) load balancer understands HTTP: it can route by path, host or header, terminate TLS and retry a request, at the cost of more work per request.","**Round robin and weighted round robin**: round robin hands requests to the servers in turn, which is fair when the servers and the requests are alike. Weighted round robin gives each server a share in proportion to its weight, for pools that mix machine sizes.","**Least connections**: send each request to the server with the fewest requests in flight. It adapts when some requests are slow or some servers are slower, because a busy server collects connections and stops being picked. A cheaper relative, the power of two choices, samples two servers at random and uses the less loaded one.","**Hashing for affinity**: routing by a hash of a key (a user ID, the client's IP address) sends the same key to the same server, which keeps that server's cache warm. But hash mod N moves most keys when N changes; consistent hashing (L2) moves only about 1/N of them.","**Health checks**: the load balancer probes each server every few seconds, with a TCP connection or an HTTP request to a path such as /health. A server is marked down after several failures in a row and up again after several passes, so one slow answer doesn't flap it in and out. Passive checks also watch real traffic for errors.","**What a health check should prove**: that the server can do useful work (it's running, and it can reach what only it needs) without failing every server at once when one shared dependency has a blip, which would turn a partial outage into a total one.","**No single point of failure in front**: the load balancer must be redundant too: a pair sharing a floating address, several behind DNS, or a managed load balancer that runs across zones. And drain a server before removing it: no new requests, while the ones in flight finish."],"dia":[{"type":"tiers","cap":"A layer 7 load balancer routing by path, with health checks","tiers":[["Clients",["Phone app","Browser"]],["Load balancer",["Terminates TLS","Routes by path","Checks /health every 10 s"],"HTTPS"],["/api pool",["api 1","api 2","api 3 (draining)"],"least connections"],["/images pool",["img 1","img 2"],"round robin"]],"note":"Each pool has its own algorithm. A draining server gets no new requests while the ones it holds finish; a server that fails three checks in a row is taken out until it passes two."},{"type":"flow","cap":"A health check's two thresholds","steps":[["Up","gets traffic; each failed check adds 1 to the failure count, each pass resets it"],["3 failures in a row","marked down: no new requests"],["Down","still probed; each pass adds 1, each failure resets the count"],["2 passes in a row","marked up: traffic returns"]],"note":"Two thresholds instead of one stop a server that fails one check in three from flapping in and out of the pool."}],"cmp":[{"cap":"Choosing an algorithm","head":["Algorithm","How it picks","Good when","Weak when"],"rows":[["Round robin","The next server in turn","Servers and requests are alike","Request times vary, or servers differ in size"],["Weighted round robin","In turn, in proportion to weights","Servers differ in size","Request times vary a lot"],["Least connections","Fewest requests in flight","Request times vary (slow reports, uploads)","Many balancers each see only part of the load"],["Hash of a key","hash(key) picks the server","A server's cache or session should see the same key again","The pool changes size (with mod N), or one key is very hot"]]},{"cap":"Layer 4 or layer 7","head":["","Layer 4 (transport)","Layer 7 (application)"],"rows":[["Sees","Addresses and ports of TCP or UDP connections","Whole HTTP requests: method, path, headers"],["Can route by","Address and port","Path, host, header, cookie"],["TLS","Usually passes it through","Usually terminates it"],["Typical use","Any protocol, very high throughput, databases","Web apps and APIs, path-based routing, retries"]]}],"code":[{"t":"A stable string hash and the health-check state machine used below","tabs":[{"lang":"python","src":"def fnv1a(key):                                 # a small, stable 32-bit string hash, same in both languages\n    h = 0x811C9DC5\n    for byte in key.encode():\n        h = ((h ^ byte) * 0x01000193) & 0xFFFFFFFF\n    return h\n\ndef health_states(probes, fall=3, rise=2):\n    \"\"\"probes: '+' passed, '-' failed. Down after `fall` failures in a row, up after `rise` passes in a row.\"\"\"\n    healthy, streak, states = True, 0, []\n    for p in probes:\n        ok = p == \"+\"\n        if ok == healthy:\n            streak = 0                          # agrees with the current state: reset the count\n        else:\n            streak += 1                         # one more result pointing the other way\n            if streak == (rise if ok else fall):\n                healthy, streak = ok, 0         # enough in a row: switch\n        states.append(\"U\" if healthy else \"D\")\n    return \"\".join(states)\n"},{"lang":"javascript","src":"function fnv1a(key) {                           // a small, stable 32-bit string hash, same in both languages\n  let h = 0x811c9dc5;\n  for (const byte of Buffer.from(key)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;\n  return h;\n}\n\nfunction healthStates(probes, fall = 3, rise = 2) {\n  // probes: \"+\" passed, \"-\" failed. Down after `fall` failures in a row, up after `rise` passes in a row\n  let healthy = true, streak = 0, states = \"\";\n  for (const p of probes) {\n    const ok = p === \"+\";\n    if (ok === healthy) streak = 0;             // agrees with the current state: reset the count\n    else if (++streak === (ok ? rise : fall)) { // one more result pointing the other way\n      healthy = ok; streak = 0;                 // enough in a row: switch\n    }\n    states += healthy ? \"U\" : \"D\";\n  }\n  return states;\n}\n"}]},{"t":"Round robin or least connections when some requests are slow","tabs":[{"lang":"python","src":"def simulate(policy, durations, servers=3):\n    \"\"\"One request arrives per tick; returns each server's peak number of requests in flight.\"\"\"\n    ends = [[] for _ in range(servers)]       # finish times of each server's requests in flight\n    peaks = [0] * servers\n    for t, d in enumerate(durations):\n        for e in ends:\n            e[:] = [x for x in e if x > t]    # finished requests leave\n        s = policy(t, [len(e) for e in ends])\n        ends[s].append(t + d)\n        peaks[s] = max(peaks[s], len(ends[s]))\n    return peaks\n\nround_robin = lambda t, active: t % len(active)\nleast_conn = lambda t, active: active.index(min(active))   # ties go to the lowest index\n\ndurations = [20 if i % 3 == 0 else 1 for i in range(60)]   # every third request is a slow report\nprint(\"round robin:\", *simulate(round_robin, durations))\nprint(\"least connections:\", *simulate(least_conn, durations))\n","out":"round robin: 7 1 1\nleast connections: 3 3 2\n","notes":[[13,"Round robin ignores load: request i always goes to server i mod 3."],[14,"Least connections looks at what each server holds right now."],[17,"Every slow report lands on server 0, because they arrive every third request: up to 7 in flight there while the others hold 1."],[18,"Least connections spreads the slow reports out: no server holds more than 3 at once."]]},{"lang":"javascript","src":"function simulate(policy, durations, servers = 3) {\n  // one request arrives per tick; returns each server's peak number of requests in flight\n  const ends = Array.from({ length: servers }, () => []);   // finish times of each server's requests in flight\n  const peaks = new Array(servers).fill(0);\n  durations.forEach((d, t) => {\n    for (let s = 0; s < servers; s++) ends[s] = ends[s].filter(x => x > t);   // finished requests leave\n    const s = policy(t, ends.map(e => e.length));\n    ends[s].push(t + d);\n    peaks[s] = Math.max(peaks[s], ends[s].length);\n  });\n  return peaks;\n}\n\nconst roundRobin = (t, active) => t % active.length;\nconst leastConn = (t, active) => active.indexOf(Math.min(...active));   // ties go to the lowest index\n\nconst durations = Array.from({ length: 60 }, (_, i) => (i % 3 === 0 ? 20 : 1));   // every third request is a slow report\nconsole.log(\"round robin:\", ...simulate(roundRobin, durations));\nconsole.log(\"least connections:\", ...simulate(leastConn, durations));\n","out":"round robin: 7 1 1\nleast connections: 3 3 2\n","notes":[[14,"Round robin ignores load: request i always goes to server i mod 3."],[15,"Least connections looks at what each server holds right now."],[18,"Every slow report lands on server 0, because they arrive every third request: up to 7 in flight there while the others hold 1."],[19,"Least connections spreads the slow reports out: no server holds more than 3 at once."]]}]},{"t":"Health checks: thresholds stop flapping","tabs":[{"lang":"python","src":"probes = \"++-+--+---++-++\"                    # one check every 10 s: '+' passed, '-' failed\njumpy = health_states(probes, fall=1, rise=1)\ncalm = health_states(probes, fall=3, rise=2)\nchanges = lambda s: sum(a != b for a, b in zip(s, s[1:]))\nprint(\"probes:\", probes)\nprint(\"fall 1, rise 1:\", jumpy, \"changes:\", changes(jumpy))\nprint(\"fall 3, rise 2:\", calm, \"changes:\", changes(calm))\ninterval, fall = 10, 3\nprint(f\"a dead server is dropped {interval * (fall - 1)} to {interval * fall} s after it dies\")\n","out":"probes: ++-+--+---++-++\nfall 1, rise 1: UUDUDDUDDDUUDUU changes: 8\nfall 3, rise 2: UUUUUUUUUDDUUUU changes: 2\na dead server is dropped 20 to 30 s after it dies\n","notes":[[2,"With thresholds of 1 the state simply copies the last probe, so every blip flips the server in or out."],[3,"Three failures to go down and two passes to come back: isolated failures are ignored."],[6,"8 changes of state in 15 checks: the pool keeps losing and regaining this server."],[9,"The price of calm: a dead server keeps getting requests until its third failed check, 20 to 30 seconds after it dies."]]},{"lang":"javascript","src":"const probes = \"++-+--+---++-++\";             // one check every 10 s: \"+\" passed, \"-\" failed\nconst jumpy = healthStates(probes, 1, 1);\nconst calm = healthStates(probes, 3, 2);\nconst changes = s => [...s].filter((c, i) => i > 0 && c !== s[i - 1]).length;\nconsole.log(\"probes:\", probes);\nconsole.log(\"fall 1, rise 1:\", jumpy, \"changes:\", changes(jumpy));\nconsole.log(\"fall 3, rise 2:\", calm, \"changes:\", changes(calm));\nconst interval = 10, fall = 3;\nconsole.log(`a dead server is dropped ${interval * (fall - 1)} to ${interval * fall} s after it dies`);\n","out":"probes: ++-+--+---++-++\nfall 1, rise 1: UUDUDDUDDDUUDUU changes: 8\nfall 3, rise 2: UUUUUUUUUDDUUUU changes: 2\na dead server is dropped 20 to 30 s after it dies\n","notes":[[2,"With thresholds of 1 the state simply copies the last probe, so every blip flips the server in or out."],[3,"Three failures to go down and two passes to come back: isolated failures are ignored."],[6,"8 changes of state in 15 checks: the pool keeps losing and regaining this server."],[9,"The price of calm: a dead server keeps getting requests until its third failed check, 20 to 30 seconds after it dies."]]}]},{"t":"Hashing keys to servers, and what mod N does when the pool changes","tabs":[{"lang":"python","src":"keys = [f\"user-{i}\" for i in range(10_000)]\ncounts = [0] * 4\nfor k in keys:\n    counts[fnv1a(k) % 4] += 1\nprint(\"keys per server:\", *counts)\n\nfor old_n, new_n in ((4, 5), (5, 4), (10, 11)):\n    moved = sum(fnv1a(k) % old_n != fnv1a(k) % new_n for k in keys)\n    print(f\"{old_n} -> {new_n} servers: {moved * 100 // len(keys)}% of keys move; the minimum is {100 // max(old_n, new_n)}%\")\n","out":"keys per server: 2501 2499 2499 2501\n4 -> 5 servers: 80% of keys move; the minimum is 20%\n5 -> 4 servers: 80% of keys move; the minimum is 20%\n10 -> 11 servers: 90% of keys move; the minimum is 9%\n","notes":[[5,"A good hash spreads the keys evenly: about 2,500 per server."],[8,"A key stays put only if its hash leaves the same remainder for both pool sizes."],[9,"Adding one server should move only the new server's fair share; mod N moves four to ten times that, emptying caches across the whole pool."]]},{"lang":"javascript","src":"const keys = Array.from({ length: 10000 }, (_, i) => `user-${i}`);\nconst counts = [0, 0, 0, 0];\nfor (const k of keys) counts[fnv1a(k) % 4]++;\nconsole.log(\"keys per server:\", ...counts);\n\nfor (const [oldN, newN] of [[4, 5], [5, 4], [10, 11]]) {\n  const moved = keys.filter(k => fnv1a(k) % oldN !== fnv1a(k) % newN).length;\n  console.log(`${oldN} -> ${newN} servers: ${Math.floor((moved * 100) / keys.length)}% of keys move; the minimum is ${Math.floor(100 / Math.max(oldN, newN))}%`);\n}\n","out":"keys per server: 2501 2499 2499 2501\n4 -> 5 servers: 80% of keys move; the minimum is 20%\n5 -> 4 servers: 80% of keys move; the minimum is 20%\n10 -> 11 servers: 90% of keys move; the minimum is 9%\n","notes":[[4,"A good hash spreads the keys evenly: about 2,500 per server."],[7,"A key stays put only if its hash leaves the same remainder for both pool sizes."],[8,"Adding one server should move only the new server's fair share; mod N moves four to ten times that, emptying caches across the whole pool."]]}]}],"ex":{"q":"A pool has two big servers (900 requests per second each at full load) and three small ones (300 each), behind weighted round robin with weights 3, 3, 1, 1, 1. Peak traffic is 2,000 requests per second. How busy is each server at the peak? What happens if one big server fails, and how would you fix it?","steps":["Weighted round robin hands out requests in proportion to the weights: a big server gets 3 of every 9 requests, a small one 1 of every 9.","At 2,000 requests per second a big server gets about 667 (74% of its 900) and a small one about 222 (74% of its 300). Weights in proportion to capacity keep every server equally busy.","If big-1 fails, its share is spread by weight over the rest: 1,000 for big-2 and 333 for each small server, 111% of their capacity. The 1,800 requests per second that remain can't carry a 2,000 peak, so everything slows down together.","Plan for losing the biggest server: with a third big server the pool still runs at 74% when one fails. The shares take O(n) time to work out for n servers; integer arithmetic avoids rounding surprises."],"code":{"t":"Weighted shares and the loss of the biggest server","tabs":[{"lang":"python","src":"def shares(peak, pool):\n    \"\"\"pool: (name, weight, capacity) per server; weighted round robin splits the peak by weight.\"\"\"\n    total = sum(w for _, w, _ in pool)\n    return [(name, peak * w // total, peak * w * 100 // (total * cap)) for name, w, cap in pool]\n\nbig = lambda n: (f\"big-{n}\", 3, 900)\nsmall = lambd
