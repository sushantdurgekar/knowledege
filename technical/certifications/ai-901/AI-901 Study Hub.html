dia:{type:"flow",cap:"Agent client (Python)",steps:[["Credential","DefaultAzureCredential() → Entra ID"],["Project client","AIProjectClient(endpoint=PROJECT_ENDPOINT, credential)"],["Get agent","project_client.agents.get(agent_name=...)"],["OpenAI client","project_client.get_openai_client()"],["Call","responses.create(input=[...], extra_body={agent_reference})"],["Read","response.output_text"]]},
keys:["<b>Playground</b>: test prompts, compare models and capture settings. Its generated code uses the OpenAI-compatible <b>Responses API</b>.",
"<b>Lightweight client app</b> = collect input → call remote service → display results. Small code, state and compute on the server, configured with env vars.",
"The Foundry SDK exposes a <b>project client</b> (Foundry-native: agents, connections) and an <b>OpenAI-compatible client</b> (Responses API). Most apps use both.",
"Model chat: `pip install openai` → `OpenAI(base_url=f'{ENDPOINT}/openai', api_key=KEY)` or the v1 endpoint → `client.responses.create(model=DEPLOYMENT_NAME, input=[{role:'system'…},{role:'user'…}], max_output_tokens=300, temperature=0.7)` → `response.output_text`.",
"Agent: `pip install --pre azure-ai-projects>=2.0.0b1 azure-identity` → `AIProjectClient(endpoint, DefaultAzureCredential())` → `agents.get(agent_name=…)` → `get_openai_client()` → `responses.create(input=…, extra_body={'agent': {'name': agent.name, 'type': 'agent_reference'}})`.",
"Agent ID and env values are in the agent playground's <b>code view → .env variables</b>.",
"Portal agent workflow: deploy model → chat → <b>Instructions</b> → <b>Tools → Add</b> (Web search, upload files → index) → <b>Save as agent</b> → YAML → <b>Preview web app</b> → <b>Continue in code</b>. Tools are managed in the <b>Foundry Tool Catalog</b>; a <b>toolbox</b> bundles tools into one MCP endpoint.",
"Models = raw inference. Agents = model + instructions + tools, reusable across apps (web apps, bots, backend workflows)."],
code:`# 1) Lightweight chat client (model deployment)
import os
from openai import OpenAI
client = OpenAI(base_url=f"{os.environ['AZURE_OPENAI_ENDPOINT']}/openai",
                api_key=os.environ["AZURE_OPENAI_API_KEY"])
response = client.responses.create(
    model=os.environ["DEPLOYMENT_NAME"],            # deployment name
    input=[{"role": "system", "content": "You're a helpful assistant."},
           {"role": "user", "content": "Summarize our release notes in 3 bullets."}],
    max_output_tokens=300, temperature=0.7)
print(response.output_text)

# 2) Lightweight agent client
from azure.identity import DefaultAzureCredential
from azure.ai.projects import AIProjectClient
project_client = AIProjectClient(
    endpoint="https://<resource>.services.ai.azure.com/api/projects/<project>",
    credential=DefaultAzureCredential())
agent = project_client.agents.get(agent_name="learning-agent")
openai_client = project_client.get_openai_client()
response = openai_client.responses.create(
    input=[{"role": "user", "content": "Tell me what you can help with."}],
    extra_body={"agent": {"name": agent.name, "type": "agent_reference"}})
print(response.output_text)`,
ex:{q:"Read the agent code above. Which line would you change to talk to a different agent in the same project, and what auth does it use?",a:"Change <b>agent_name='learning-agent'</b> in `agents.get(...)`. Auth is <b>Microsoft Entra ID</b> via `DefaultAzureCredential()`. No API key appears anywhere."},
traps:["`model=` takes the <b>deployment name</b>.","The agent client uses the <b>project endpoint</b> + Entra ID. The simple chat client uses the OpenAI endpoint + key (or Entra).","`output_text` is a convenient property on the Responses API result.","'Save as agent' happens in the playground. Agents are then callable from code via the Project API."],
disc:[["Why might a developer prefer calling an agent rather than a raw model from a web app?","The agent encapsulates instructions, tools and knowledge centrally. The app stays thin, and changes to tools or instructions don't need app redeploys."],["A user's second message ignores the first. What must a lightweight model client do?","Append previous user and assistant messages to the input list (conversation history) on each call."]],
qa:[["Package for the agent client?","azure-ai-projects (+ azure-identity)."],["Method that returns the generated text?","response.output_text."],["What does extra_body carry when calling an agent?","{'agent': {'name': ..., 'type': 'agent_reference'}}"],["Where do you see the agent's YAML definition?","Agent playground → YAML tab."]],

{q:"Which property returns the model's generated text from a Responses API call?",o:["response.choices[0].text","response.output_text","response.completion","response.result.text"],a:1,e:"The Responses API result exposes output_text."},

M.push({id:"m13",d:2,day:2,t:"Text analysis in Foundry",min:55,
hook:"Blueprint: 'Build a lightweight application that includes text analysis.' The key decision is general-purpose model vs Azure Language, and you should know the SDK shape and the Language MCP server.",
story:["The museum's support team gets messages in many languages, some with customers' phone numbers. Option A: ask <b>gpt-5-mini</b> in the playground, 'Summarize this review as a single short paragraph.' It's flexible and great for exploring, but the wording changes with the prompt.",
"Option B: under <b>Build → Services/AI services</b>, open <b>Azure Language – Language detection</b>. It returns 'German, de, confidence 1.00' every time. Then <b>Text PII Redaction</b> highlights 'Margaret Ellis', '128 High Street' and '021 685 4215' and returns redacted text. It's deterministic and structured, which suits a pipeline.",
"Option C, for an agent: add the <b>Azure Language MCP server</b> tool ('Azure Language in Foundry Tools'), type your <b>Foundry resource name</b>, and the agent can call language detection or PII redaction mid-conversation. No separate Language resource, no tokens in code."],
breaks:"In practice teams mix them: an LLM for flexible summarisation, Azure Language for compliance-grade PII redaction.",
dia:{type:"hub",cap:"Three ways to analyse text in Foundry",core:"Text in",spokes:[["General-purpose model","Responses API prompt: flexible, multi-task, varies with phrasing"],["Azure Language SDK","TextAnalyticsClient: deterministic, structured, confidence scores"],["Language MCP server","Agent tool exposing Language features via MCP"]]},
keys:["General-purpose models: key phrases, entity linking, sentiment and opinion mining, summarization, translation, classification, Q&A, all from prompts. Use them for flexibility, multi-step work, prototyping, and when approximate results are acceptable.",
"<b>Azure Language in Foundry Tools</b>: purpose-built analyzers using statistical techniques → <b>structured, deterministic</b> output for automated pipelines.",
"Language detection returns name, <b>ISO 639-1 code</b> (es) and <b>confidence 0–1</b>. PII returns entities (Person, Phone, Address, Email, PHI…) + <b>redacted_text</b>.",
"NER categories: Person, Location, Organization, DateTime (Date/Time/Duration), Quantity (Percentage/Number/Dimension).",
"SDK: `pip install azure-ai-textanalytics` → `TextAnalyticsClient(endpoint, AzureKeyCredential(key))` → `detect_language([text])`, `recognize_pii_entities([text])`, `analyze_sentiment`, `extract_key_phrases`, `recognize_entities`. Input is a <b>list</b> of documents.",
"<b>MCP</b>: open standard. The <b>MCP client</b> (agent) discovers and calls tools on an <b>MCP server</b>. The Azure Language MCP server exposes NER, sentiment, language detection and PII. Connect it with the Foundry resource name; no separate Language resource needed.",
"Typical agent + MCP use: route support tickets by detected language, redact PII before storing."],
code:`# pip install azure-ai-textanalytics python-dotenv
import os
from dotenv import load_dotenv
from azure.core.credentials import AzureKeyCredential
from azure.ai.textanalytics import TextAnalyticsClient
load_dotenv()
client = TextAnalyticsClient(endpoint=os.getenv("AZURE_LANGUAGE_ENDPOINT"),
                             credential=AzureKeyCredential(os.getenv("API_KEY")))
r = client.detect_language(["¡Hola! Me llamo Josefina y vivo en Madrid, España."])[0]
print(r.primary_language.name, r.primary_language.iso6391_name,
      r.primary_language.confidence_score)        # Spanish es 1.0
p = client.recognize_pii_entities(["Maria Garcia called from 020 7946 0958."])[0]
print(p.redacted_text)                             # ************ called from *************.
for e in p.entities: print(e.text, e.category, e.confidence_score)`,
ex:{q:"A nightly job must redact phone numbers and names from 50,000 chat logs before they're stored, with identical behaviour every run. Model or Azure Language?",a:"<b>Azure Language PII detection</b> (`recognize_pii_entities` → `redacted_text`). It's deterministic, structured and built for compliance pipelines. An LLM's output would vary with prompt phrasing."},
traps:["'Deterministic', 'structured', 'consistent', 'pipeline', 'compliance' → Azure Language.","'Flexible', 'translate then summarise', 'prototype' → general-purpose model.","You do NOT need a separate Language resource for the MCP server; the Foundry resource is enough.","Translation is a separate service (Translator), not an Azure Language feature."],
disc:[["Why does an LLM's sentiment output vary but Azure Language's doesn't?","LLMs respond to natural-language prompts, so phrasing changes output. Azure Language runs fixed analyzers that return the same schema and scores."],["What's the benefit of MCP for an agent developer?","A standard way to discover and call tools, with no custom integration code or token handling per service, and easy to swap or extend servers."]],
qa:[["Package for Azure Language Python SDK?","azure-ai-textanalytics."],["Property for detected ISO code?","primary_language.iso6391_name."],["What does MCP stand for?","Model Context Protocol."],["What do you enter to connect the Azure Language MCP tool?","Your Foundry resource name."]],

M.push({id:"m14",d:2,day:2,t:"Speech in Foundry",min:60,
hook:"Blueprint: 'Respond to spoken prompts by using a deployed multimodal model' and 'Build a lightweight application by using Azure Speech in Foundry Tools.' Know the Speech SDK objects, real-time vs batch, and Voice Live.",
story:["The museum wants three voice features. One: a <b>voicemail transcriber</b> for the front desk. That's Azure Speech STT. Create <b>SpeechConfig</b> (key + endpoint), point <b>AudioConfig</b> at 'audiofile.wav', make a <b>SpeechRecognizer</b> and call <b>recognize_once()</b>. For last year's 10,000 recordings in Blob storage, use <b>batch transcription</b> with SAS URIs. It's asynchronous and best-effort.",
"Two: an <b>announcement voice</b>. Set <b>speech_synthesis_voice_name</b> to a neural voice like 'en-US-Ava:DragonHDLatestNeural', use <b>AudioOutputConfig(use_default_speaker=True)</b>, create a <b>SpeechSynthesizer</b> and call <b>speak_text_async(text).get()</b>.",
"Three: a <b>talking guide</b>. Rather than wiring STT → LLM → TTS yourself, turn on <b>Voice mode</b> for the agent. That's <b>Voice Live</b>, a fully managed speech-to-speech service using your chosen generative model plus Azure acoustic models. Status goes Listening → Processing → Speaking, and the 'cc' button shows the transcript. Alternatively, send audio straight to an <b>audio-capable multimodal model</b> as an <b>input_audio</b> part."],
breaks:"The three options overlap. Pick by need: control and custom pipelines (Speech SDK), lowest-effort real-time conversation (Voice Live), or a single model call on recorded audio (multimodal).",
dia:{type:"hub",cap:"Voice options in Foundry",core:"Speech",spokes:[["Azure Speech STT","SpeechRecognizer: real-time, fast, batch, custom speech"],["Azure Speech TTS","SpeechSynthesizer: neural & custom voices, SSML, avatar"],["Voice Live","Managed speech-to-speech + generative model; agent Voice mode"],["Multimodal audio model","input_audio part → text and/or audio reply"]]},
keys:["Portal: Build → Models → <b>AI services</b> tab → 'Azure Speech – Speech to Text' (upload or record) and 'Text to Speech' (choose voice, speed, pitch).",
"STT SDK: `pip install azure-cognitiveservices-speech` → `SpeechConfig(subscription=key, endpoint=endpoint)` → `AudioConfig(use_default_microphone=True)` or `AudioConfig(filename='x.wav')` → `SpeechRecognizer` → `recognize_once()` or `start_continuous_recognition()` with <b>recognizing</b> (partial) and <b>recognized</b> (final) events.",
"<b>Real-time</b> transcription streams live audio (presentations, captions). <b>Batch</b> transcribes stored files via SAS URI asynchronously. Jobs are scheduled best-effort, so start time isn't guaranteed. <b>Fast transcription</b> handles pre-recorded files quickly.",
"TTS SDK: `speech_config.speech_synthesis_voice_name='en-US-Ava:DragonHDLatestNeural'` → `AudioOutputConfig(use_default_speaker=True)` → `SpeechSynthesizer` → `speak_text_async(text).get()` → check `ResultReason.SynthesizingAudioCompleted` vs `Canceled`.",
"<b>Neural voices</b> fix intonation issues. <b>Custom neural voice</b> = branded voice. <b>SSML</b> tunes pitch, rate, volume and pronunciation. TTS <b>avatar</b> = photorealistic speaking video.",
"Other Speech features: speech translation, language identification, pronunciation assessment, custom speech models.",
"<b>Voice Live</b>: unified STT + reasoning + TTS, fully managed. Can return avatars and trigger actions, handles interruptions, supports proactive engagement. `pip install azure-ai-voicelive`. Agent <b>Voice mode</b> puts the speech config in the agent itself.",
"Multimodal audio (e.g., gpt-4o-mini-audio-preview): `modalities=['text','audio']`, `audio={'voice':'alloy','format':'wav'}`, content part `{'type':'input_audio','input_audio':{'data': base64, 'format':'wav'}}`."],
code:`import azure.cognitiveservices.speech as speechsdk
speech_config = speechsdk.SpeechConfig(subscription=FOUNDRY_KEY, endpoint=ENDPOINT)

# Speech-to-text from a file
audio_config = speechsdk.audio.AudioConfig(filename="voicemail.wav")
recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config, audio_config=audio_config)
print(recognizer.recognize_once().text)

# Text-to-speech to the speaker
speech_config.speech_synthesis_voice_name = "en-US-Ava:DragonHDLatestNeural"
out = speechsdk.audio.AudioOutputConfig(use_default_speaker=True)
synth = speechsdk.SpeechSynthesizer(speech_config=speech_config, audio_config=out)
result = synth.speak_text_async("Welcome to the museum!").get()
if result.reason == speechsdk.ResultReason.SynthesizingAudioCompleted: print("done")`,
ex:{q:"An app must reply to customers in a natural, real-time spoken conversation with interruptions handled, with as little backend work as possible. Which option?",a:"<b>Voice Live</b> (or agent Voice mode). It's a fully managed speech-to-speech pipeline with a generative model, built for low-latency conversation and interruptions."},
traps:["SpeechRecognizer pairs with AudioConfig (input). SpeechSynthesizer pairs with AudioOutputConfig (output).","Stored recordings at scale → batch transcription (async). Live → real-time.","`speak_text_async(...)` needs `.get()` to wait for the result.","Voice Live uses a <b>generative model you choose</b> together with its own acoustic models."],

M.push({id:"m15",d:2,day:2,t:"Vision, image & video generation in Foundry",min:60,

story:["A visitor uploads a photo of a dusty beige box. In the playground you set the instructions to 'You are an AI assistant that helps people identify vintage computer hardware', click <b>Upload image</b>, ask 'What can you tell me about this?', and <b>gpt-5-mini</b> (vision-enabled) answers 'an IBM PC 5150…'. In code, the same request is one <b>responses.create</b> call with an <b>input_text</b> part and an <b>input_image</b> part, the image given as a URL or a base64 data URL.",

code:`from openai import OpenAI
import base64, os
client = OpenAI(api_key=os.getenv("FOUNDRY_KEY"),
                base_url="https://RES.openai.azure.com/openai/v1/")
# Interpret an image
r = client.responses.create(model=os.getenv("MODEL_NAME"), input=[{
    "role": "user", "content": [
        {"type": "input_text", "text": "What is in this image? 3 bullets."},
        {"type": "input_image", "image_url": "https://example.com/pc.jpg"}]}])
print(r.output_text)
# Create an image
r = client.responses.create(model="my-gpt-image", input="A vintage PC with a CRT monitor",
                            tools=[{"type": "image_generation"}])
b64 = next(i.result for i in r.output if i.type == "image_generation_call")
open("pc.png", "wb").write(base64.b64decode(b64))`,

M.push({id:"m16",d:2,day:3,t:"Azure Content Understanding",min:60,
hook:"Blueprint: four objectives (documents & forms, images, audio & video, lightweight app) all name Azure Content Understanding in Foundry Tools. That's a big slice of Domain 2.",
story:["The finance team photographs receipts, sales records customer calls, and facilities wants to count people in meeting-room videos. One service covers all three: <b>Azure Content Understanding</b>.",
"In the Foundry portal you try the <b>Read</b> analyzer (raw OCR text), then <b>Layout</b> (structure, tables), then <b>Receipt</b> from the Procurement category. Now the <b>Fields</b> tab shows MerchantName, TransactionDate and Total with confidence, the <b>Markdown</b> tab shows the text, and the <b>Result</b> tab shows raw JSON.",
"An <b>analyzer</b> is a reusable recipe: same <b>schema</b>, same extraction logic, same predictable JSON every time. Schemas apply <b>semantically</b>, so 'Invoice No.', 'Invoice #' or an unlabeled number all map to InvoiceNumber. For the voicemail from 'Ava at Contoso' an audio analyzer returns caller, summary, requested actions and callback number. In code it's <b>begin_analyze(analyzer_id, inputs)</b> → <b>poller.result()</b>, because analysis is a long-running operation."],
breaks:"Read/Layout-style OCR and prebuilt receipts are deterministic and familiar. The generative fields (summaries, classifications) rely on models and may prompt you to deploy them, and like any AI they come with confidence scores you should check.",
dia:{type:"flow",cap:"Content Understanding workflow",steps:[["Ingest","Document, image, audio or video (URL/file)"],["Analyzer","Prebuilt (prebuilt-invoice…) or custom + schema"],["AI analysis","OCR, speech recognition, NLU, multimodal models"],["Structured output","JSON: markdown/transcript + fields (type, value, confidence)"],["Downstream","Storage, search (RAG), automation"]]},
keys:["Supports <b>documents & images</b> (PDFs, forms, invoices, receipts, contracts), <b>audio</b> (calls, recordings) and <b>video</b> (meetings, media) → structured JSON.",
"<b>Analyzer</b> = unit that takes input, applies AI analysis and returns structured results consistently. <b>Schema</b> = fields to extract (supports nested collections, e.g., invoice Items with description, unit price, quantity, line total).",
"Field methods: <b>extract</b> (value in the content), <b>generate</b> (summaries, descriptions), <b>classify</b> (choose a category or route the document).",
"Prebuilt analyzers: base `prebuilt-document|image|audio|video`. Content `prebuilt-read` (OCR), `prebuilt-layout` (structure, tables). RAG-ready `prebuilt-documentSearch|imageSearch|audioSearch|videoSearch`. Domain `prebuilt-invoice`, `prebuilt-receipt`, `prebuilt-idDocument`, `prebuilt-contract`, `prebuilt-callCenter`, plus tax and mortgage analyzers.",
"Goes <b>beyond OCR</b>: understands relationships and meaning and extracts fields even with different or missing labels.",
"Audio: transcript, summary, caller, requested actions, contact details. Video: keyframes/segments, transcripts, descriptions, attendee counts, meeting summary, assigned actions.",
"SDK: `pip install azure-ai-contentunderstanding` → `ContentUnderstandingClient(endpoint, AzureKeyCredential(key))` → `begin_analyze(analyzer_id='prebuilt-invoice', inputs=[{'url': ...}])` → `poller.result()` → `result.contents[i].markdown` and `.fields` (type, valueString/valueDate, confidence 0–1).",
"Async by design: REST returns an Operation-Location to <b>poll</b>. The SDK poller does it for you. Endpoint: `https://&lt;resource&gt;.services.ai.azure.com/`."],
cmp:{head:["Need","Analyzer"],rows:[["Just the text from a scanned page","prebuilt-read"],["Text + tables + structure","prebuilt-layout"],["Vendor, date, line items, total from invoices","prebuilt-invoice"],["Merchant and total from till receipts","prebuilt-receipt"],["Summarize and transcribe call recordings","prebuilt-audioSearch / prebuilt-callCenter"],["Segment and summarize meeting videos","prebuilt-videoSearch"],["Custom fields (e.g., 'callback number')","Custom analyzer with your schema"]]},
code:`# python -m pip install azure-ai-contentunderstanding
import os
from azure.ai.contentunderstanding import ContentUnderstandingClient
from azure.core.credentials import AzureKeyCredential
client = ContentUnderstandingClient(endpoint=os.environ["FOUNDRY_ENDPOINT"],
                                    credential=AzureKeyCredential(os.environ["FOUNDRY_KEY"]))
poller = client.begin_analyze(analyzer_id="prebuilt-invoice",
                              inputs=[{"url": "https://.../invoice.pdf"}])   # starts LRO
result = poller.result()                                                     # SDK polls
for content in result.contents:
    print(content.markdown)          # extracted text as markdown
    print(content.fields)            # {"InvoiceDate": {"type":"date","valueDate":"2019-11-15","confidence":0.994}, ...}`,
ex:{q:"A support manager wants, for every recorded call: a summary, the customer's requested action and the callback number, as JSON for a CRM. Which service, and what do you configure?",a:"<b>Azure Content Understanding</b> with an <b>audio analyzer</b>: start from prebuilt-audioSearch/callCenter or a <b>custom analyzer</b> whose <b>schema</b> defines Summary (generate), RequestedAction (generate/classify) and CallbackNumber (extract). Call `begin_analyze` and read `fields`."},
traps:["Multimodal (audio/video/images/docs) + schema → <b>Content Understanding</b>, not Speech or Language alone.","`begin_analyze` is long-running, so you need `poller.result()` (or REST polling).","Read gives text only. Receipt/invoice analyzers give fields.","Confidence scores range 0–1. Low confidence → human review."],
disc:[["Why are analyzers valuable compared with ad-hoc prompts to a chat model for extraction?","The same schema and logic run every time, so you get predictable JSON with typed fields and confidence, which is easy to automate downstream."],["How could Content Understanding feed a RAG solution?","The Search analyzers (documentSearch, videoSearch…) produce markdown, descriptions and segments ready for chunking and indexing."]],
qa:[["What is an analyzer?","A reusable unit that applies AI analysis and a schema to content and returns structured JSON."],["Analyzer for OCR-only text?","prebuilt-read."],["Method that starts analysis in Python?","client.begin_analyze(analyzer_id=..., inputs=[...])."],["Three field methods?","Extract, generate, classify."]],

{q:"In Content Understanding, what defines WHICH fields are extracted and how they're structured?",o:["The deployment TPM","The analyzer's schema","The system prompt of an agent","The SAS token"],a:1,e:"The schema describes the fields (including nested ones) the analyzer extracts."},

{q:"Facilities wants to count in-person and remote attendees from meeting-room recordings and summarise actions. Which approach?",o:["Content Understanding with a video analyzer and a schema for attendee counts, summary and actions","Azure Language PII detection","Text-to-speech","An embedding model only"],a:0,e:"Video analysis with a schema can return attendee counts, summaries and actions as JSON."}]

M.push({id:"m17",d:2,day:3,t:"Foundry IQ: knowledge for agents",min:50,
hook:"Foundry IQ is a full module in the official path. It turns RAG into a shared, permission-aware knowledge layer for agents. Expect 'which component' and 'what's required' questions.",
story:["The company has three agents (Finance, Workplace, Vacation), and each team built its own RAG pipeline: three sets of chunking, embeddings, indexes, permissions and monitoring. It's messy.",
"<b>Foundry IQ</b> replaces that with <b>knowledge bases</b> organised by business domain, such as 'Finance Policies'. Each knowledge base has <b>knowledge sources</b>: an existing Azure AI Search index, Blob Storage documents, SharePoint, OneLake or the public web. Foundry IQ handles chunking, embeddings and metadata, and at question time runs <b>agentic retrieval</b>: plan the query, split it into sub-queries, search sources in parallel, rerank semantically, synthesise an answer and attach <b>citations</b>, all while respecting each user's <b>permissions</b>.",

/* ---------- Diagrams ---------- */
function dia(d){
  if(!d)return "";
  let h=`<div class="dia"><div class="cap">${esc(d.cap||"")}</div>`;
  if(d.type==="flow"){h+=`<div class="flow">`+d.steps.map((s,i)=>(i?`<span class="ar" aria-hidden="true">→</span>`:"")+`<div class="st"><b>${esc(s[0])}</b>${md(s[1])}</div>`).join("")+`</div>`;}
  else if(d.type==="hub"){h+=`<div class="hub"><div class="core">${esc(d.core)}</div><div class="spokes">`+d.spokes.map(s=>`<div class="sp"><b>${esc(s[0])}</b>${md(s[1])}</div>`).join("")+`</div></div>`;}
  else if(d.type==="nest"){let inner="";for(let i=d.levels.length-1;i>=0;i--){const l=d.levels[i];inner=`<div class="nest"><div class="lbl">${esc(l[0])}</div><div class="sub">${md(l[1])}</div>${inner}</div>`;}h+=inner;}
  return h+`</div>`;
}

/* ---------- Quiz component ---------- */
function quizHTML(items,prefix){
  return items.map((it,i)=>`<div class="q" data-qi="${i}" data-p="${prefix}">
   <div class="stem">${i+1}. ${md(esc(it.q))}</div>${isMulti(it)?`<div class="multi">Choose ${it.a.length}.</div>`:""}
   ${it.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${L[j]}</span><span>${md(esc(o))}</span></button>`).join("")}
   ${isMulti(it)?`<button class="btn small chk">Check answer</button>`:""}
   <div class="expl" hidden></div></div>`).join("");
}
function wireQuiz(root,items,src,onScore){
  root.querySelectorAll(".q").forEach(qel=>{
    const it=items[+qel.dataset.qi]; const sel=new Set(); let locked=false;
    const finish=()=>{locked=true;const chosen=[...sel];const ok=sameSet(chosen,correctSet(it));
      qel.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;b.disabled=true;if(correctSet(it).includes(j))b.classList.add("right");else if(sel.has(j))b.classList.add("wrong");});
      const ex=qel.querySelector(".expl");ex.hidden=false;ex.innerHTML=`<span class="v ${ok?"ok":"no"}">${ok?"Correct.":"Not quite."}</span> Answer: ${correctSet(it).map(j=>L[j]).join(", ")}. ${md(esc(it.e))}`;
      const c=qel.querySelector(".chk");if(c)c.hidden=true;
      if(!ok){S.mistakes.push({when:new Date().toISOString().slice(0,10),src:src(it),q:it.q,given:chosen.map(j=>it.o[j]),correct:correctSet(it).map(j=>it.o[j])});if(S.mistakes.length>200)S.mistakes.shift();save();}
      if(onScore)onScore(ok);};
    qel.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{if(locked)return;const j=+b.dataset.j;
      if(isMulti(it)){if(sel.has(j)){sel.delete(j);b.classList.remove("sel");}else{sel.add(j);b.classList.add("sel");}}
      else{sel.clear();sel.add(j);finish();}}));
    const c=qel.querySelector(".chk");if(c)c.addEventListener("click",()=>{if(!locked&&sel.size)finish();});
  });
}

   <div class="panel"><h3 style="font-size:1.05rem;margin-bottom:8px">By topic</h3><div class="dbars">${Object.entries(topics).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t,o])=>{const p=Math.round(100*o.c/o.n);return `<div class="dbar"><span>${esc(t)}</span><div class="tr"><i style="width:${p}%;background:${p>=70?"var(--good)":"var(--bad)"}"></i></div><b style="text-align:right">${o.c}/${o.n}</b></div>`;}).join("")}</div></div></div>

  <h3 style="margin:22px 0 10px;font-size:1.15rem">Review every question</h3>
  ${MOCK.map((it,k)=>`<div class="q"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="chip d${it.d}">D${it.d} · ${esc(it.tp)}</span><span class="muted" style="font-size:.82rem">confidence: ${res[k].confidence}${res[k].flagged?" · flagged":""}</span></div>
   <div class="stem">${k+1}. ${md(esc(it.q))}</div>${it.o.map((o,j)=>`<div class="opt ${correctSet(it).includes(j)?"right":(X.ans[k].includes(j)?"wrong":"")}"><span class="k">${L[j]}</span><span>${md(esc(o))}</span></div>`).join("")}
   <div class="expl"><span class="v ${res[k].correct?"ok":"no"}">${res[k].correct?"Correct.":(res[k].answered?"Incorrect.":"Not answered.")}</span> ${md(esc(it.e))}</div></div>`).join("")}`;
  $("#rCopy").addEventListener("click",e=>copyText("Here are my AI-901 mock exam 1 results from the Study Hub. Please score them, update my readiness and give me a remediation plan:\n"+JSON.stringify(payload),e.currentTarget));
  $("#rAgain").addEventListener("click",()=>{X=null;renderMockStart();});
  window.scrollTo(0,0);X=null;
}

/* ---------- Flashcards ---------- */
let deck=[],di=0,flipped=false,known=0;
function buildDeck(f){let src=[];M.forEach(m=>{if(f==="all"||f==="d"+m.d||f===m.id)m.qa.forEach(q=>src.push({t:m.t,q:q[0],a:q[1]}));});deck=shuffle(src);di=0;flipped=false;known=0;}
function renderCards(){
  const v=$("#v-cards");
  if(!deck.length)buildDeck("all");
  const c=deck[di];
  v.innerHTML=`<div class="fc"><div class="eyebrow">Retrieval practice</div><h2 style="font-size:1.7rem;margin:.2em 0 .6em">Flashcards</h2>
  <div class="toolbar"><label for="fFilter" class="muted">Deck</label><select id="fFilter"><option value="all">All (${M.reduce((a,m)=>a+m.qa.length,0)})</option><option value="d1">Domain 1</option><option value="d2">Domain 2</option>${M.map(m=>`<option value="${m.id}">${esc(m.t)}</option>`).join("")}</select><span class="muted" style="margin-left:auto">${c?`${di+1} / ${deck.length} · known ${known}`:""}</span></div>
  ${c?`<button class="card ${flipped?"back":""}" id="fCard"><span class="side">${flipped?"Answer":"Question"} · ${esc(c.t)}</span><span class="txt">${md(esc(flipped?c.a:c.q))}</span><span class="muted" style="font-size:.82rem">${flipped?"":"Say the answer out loud, then tap to flip"}</span></button>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="fAgain">Again (requeue)</button><button class="btn primary" id="fKnow">Got it</button></div>`:`<div class="panel">Deck finished. Known: ${known}. Pick another deck or reshuffle.</div><div class="row" style="margin-top:10px"><button class="btn primary" id="fRe">Reshuffle</button></div>`}</div>`;
  const sel=$("#fFilter");sel.value=v.dataset.f||"all";sel.addEventListener("change",()=>{v.dataset.f=sel.value;buildDeck(sel.value);renderCards();});
  if(c){$("#fCard").addEventListener("click",()=>{flipped=!flipped;renderCards();});
    $("#fAgain").addEventListener("click",()=>{deck.push(deck[di]);di++;flipped=false;if(di>=deck.length)deck=[];renderCards();});
    $("#fKnow").addEventListener("click",()=>{known++;di++;flipped=false;if(di>=deck.length){deck=[];v.dataset.done="1";}renderCards();});}
  else{$("#fRe").addEventListener("click",()=>{buildDeck(v.dataset.f||"all");renderCards();});}
}
