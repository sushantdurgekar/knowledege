n            self.items.pop(key, None)               # missing or expired\n            return None\n        self.items.move_to_end(key)                 # used just now\n        return item[0]\n\n    def set(self, key, value):\n        self.items[key] = (value, self.clock.now + self.ttl)\n        self.items.move_to_end(key)\n        while len(self.items) > self.capacity:\n            self.items.popitem(last=False)          # evict the least recently used\n\n    async def get_or_load(self, key, loader):\n        value = self.get(key)\n        if value is not None:\n            self.hits += 1\n            return value\n        self.misses += 1\n        if key not in self.in_flight:               # the first miss starts the load...\n            self.loads += 1\n            self.in_flight[key] = asyncio.ensure_future(loader(key))\n        try:\n            value = await self.in_flight[key]       # ...and every other miss waits for the same one\n            self.set(key, value)\n            return value\n        finally:\n            self.in_flight.pop(key, None)\n\nasync def main():\n    clock, db_reads = Clock(), []\n\n    async def loader(key):                          # the slow database\n        db_reads.append(key)\n        await asyncio.sleep(0.01)\n        return f\"value of {key}\"\n\n    cache = Cache(capacity=2, ttl=60, clock=clock)\n    results = await asyncio.gather(*(cache.get_or_load(\"menu\", loader) for _ in range(100)))\n    assert set(results) == {\"value of menu\"} and len(db_reads) == 1   # 100 misses, one database read\n    await cache.get_or_load(\"menu\", loader)         # a hit\n    await cache.get_or_load(\"prices\", loader)\n    await cache.get_or_load(\"hours\", loader)        # evicts menu, the least recently used\n    assert cache.get(\"menu\") is None and len(db_reads) == 3\n    clock.now += 61\n    assert cache.get(\"prices\") is None              # expired\n    print(\"hits\", cache.hits, \"misses\", cache.misses, \"loads\", cache.loads)\n\n    ref, model = Cache(3, 10, Clock()), []          # LRU and TTL against a simple list model\n    for _ in range(2000):\n        ref.clock.now += random.randint(0, 3)\n        key = random.randint(0, 5)\n        found = next((x for x in model if x[0] == key), None)\n        if random.random() < 0.5:\n            fresh = found is not None and found[2] > ref.clock.now\n            assert ref.get(key) == (found[1] if fresh else None)\n            if found:\n                model.remove(found)\n                if fresh:\n                    model.append(found)             # a hit moves to the recent end; an expired entry is dropped\n        else:\n            ref.set(key, key * 10)\n            if found:\n                model.remove(found)\n            model.append((key, key * 10, ref.clock.now + 10))\n            model = model[-3:]\n        assert list(ref.items) == [k for k, _, _ in model]\n\nasyncio.run(main())\nprint(\"cache lab OK\")\n","out":"hits 1 misses 102 loads 3\ncache lab OK\n"},{"lang":"javascript","src":"class Cache {\n  // LRU + TTL cache with single-flight loading: concurrent misses for one key share one load\n  constructor(capacity, ttl, clock) {\n    this.capacity = capacity; this.ttl = ttl; this.clock = clock;\n    this.items = new Map();                         // key -> [value, expiresAt], least recently used first\n    this.inFlight = new Map();                      // key -> the promise that is loading it\n    this.hits = 0; this.misses = 0; this.loads = 0;\n  }\n  get(key) {\n    const item = this.items.get(key);\n    if (item === undefined || item[1] <= this.clock.now) { this.items.delete(key); return undefined; }   // missing or expired\n    this.items.delete(key);\n    this.items.set(key, item);                      // used just now\n    return item[0];\n  }\n  set(key, value) {\n    this.items.delete(key);\n    this.items.set(key, [value, this.clock.now + this.ttl]);\n    while (this.items.size > this.capacity) this.items.delete(this.items.keys().next().value);   // evict the least recently used\n  }\n  async getOrLoad(key, loader) {\n    const cached = this.get(key);\n    if (cached !== undefined) { this.hits++; return cached; }\n    this.misses++;\n    if (!this.inFlight.has(key)) {                  // the first miss starts the load...\n      this.loads++;\n      this.inFlight.set(key, loader(key));\n    }\n    try {\n      const value = await this.inFlight.get(key);   // ...and every other miss waits for the same one\n      this.set(key, value);\n      return value;\n    } finally {\n      this.inFlight.delete(key);\n    }\n  }\n}\n\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\n\n(async () => {\n  const clock = { now: 0 }, dbReads = [];\n  const loader = async key => {                     // the slow database\n    dbReads.push(key);\n    await sleep(10);\n    return `value of ${key}`;\n  };\n  const cache = new Cache(2, 60, clock);\n  const results = await Promise.all(Array.from({ length: 100 }, () => cache.getOrLoad(\"menu\", loader)));\n  if (new Set(results).size !== 1 || results[0] !== \"value of menu\" || dbReads.length !== 1) throw new Error(\"single flight\");\n  await cache.getOrLoad(\"menu\", loader);            // a hit\n  await cache.getOrLoad(\"prices\", loader);\n  await cache.getOrLoad(\"hours\", loader);           // evicts menu, the least recently used\n  if (cache.get(\"menu\") !== undefined || dbReads.length !== 3) throw new Error(\"lru\");\n  clock.now += 61;\n  if (cache.get(\"prices\") !== undefined) throw new Error(\"ttl\");\n  console.log(\"hits\", cache.hits, \"misses\", cache.misses, \"loads\", cache.loads);\n\n  const ref = new Cache(3, 10, { now: 0 });         // LRU and TTL against a simple list model\n  let model = [];\n  for (let i = 0; i < 2000; i++) {\n    ref.clock.now += Math.floor(Math.random() * 4);\n    const key = Math.floor(Math.random() * 6);\n    const found = model.find(x => x[0] === key);\n    if (Math.random() < 0.5) {\n      const fresh = found !== undefined && found[2] > ref.clock.now;\n      if (ref.get(key) !== (fresh ? found[1] : undefined)) throw new Error(\"get\");\n      if (found) {\n        model = model.filter(x => x !== found);\n        if (fresh) model.push(found);               // a hit moves to the recent end; an expired entry is dropped\n      }\n    } else {\n      ref.set(key, key * 10);\n      if (found) model = model.filter(x => x !== found);\n      model.push([key, key * 10, ref.clock.now + 10]);\n      model = model.slice(-3);\n    }\n    if ([...ref.items.keys()].join() !== model.map(x => x[0]).join()) throw new Error(\"order\");\n  }\n  console.log(\"cache lab OK\");\n})();\n","out":"hits 1 misses 102 loads 3\ncache lab OK\n"}]},"breakit":["Remove the in-flight map and count the database reads for 100 concurrent misses: a stampede in miniature.","Make the loader fail once: do all 100 waiting callers see the error, and does the next call try again?","Give every key the same TTL, load 1,000 keys at once, and watch them all expire together; then add random jitter to the TTL."]},{"id":"lab-api","t":"An orders API over real HTTP: idempotent creates and cursor pages","min":90,"mods":["m07","m08"],"goal":"Build POST /orders and GET /orders as a real HTTP server with only the standard library. A retried create with the same Idempotency-Key must not create a second order, bad input must get a 400, and the list must page with an opaque cursor. Then test it over HTTP from a client in the same language.","pre":["Python 3.12+ and Node.js 22+ (for the built-in fetch)","Read module 8"],"steps":["Write `create_order(key, body)`: replay the stored response for a known key, answer 400 without a pizza, otherwise create the order (201) and store the response under the key.","Write `list_orders(limit, cursor)`: orders after the cursor's id, fetching limit + 1 to know whether to return a next cursor (base64url JSON).","Serve both with `http.server` / `node:http`, sending JSON with the right status codes and a Content-Length.","From a client, create an order, retry it with the same key, create six more, send a bad request, then walk all pages with limit=3.","Check that the retry returned the same order, the bad request got 400, and the pages held every id once, in order."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import base64, json, threading\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\norders, seen = [], {}\nlock = threading.Lock()                     # the threading server runs requests in parallel\n\ndef create_order(key, body):\n    ...                                     # TODO: replay for a known key, 400 without a pizza, else 201\n\ndef list_orders(limit, cursor):\n    ...                                     # TODO: orders after the cursor; limit + 1 to know if there's more\n\nclass Handler(BaseHTTPRequestHandler):\n    ...                                     # TODO: do_POST and do_GET sending JSON with a Content-Length\n"},{"lang":"javascript","src":"const http = require(\"node:http\");\n\nconst orders = [], seen = new Map();\n\nfunction createOrder(key, body) { /* TODO: replay for a known key, 400 without a pizza, else 201 */ }\nfunction listOrders(limit, cursor) { /* TODO: orders after the cursor; limit + 1 to know if there's more */ }\n\nconst server = http.createServer((req, res) => {\n  // TODO: route POST /orders and GET /orders, send JSON with a Content-Length\n});\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"import base64, json, threading, urllib.error, urllib.request\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom urllib.parse import parse_qs, urlsplit\n\norders, seen = [], {}                               # orders in creation order; seen: idempotency key -> response\nlock = threading.Lock()                             # the threading server runs requests in parallel\n\ndef encode_cursor(order_id):\n    return base64.urlsafe_b64encode(json.dumps({\"after\": order_id}).encode()).decode().rstrip(\"=\")\n\ndef decode_cursor(cursor):\n    return json.loads(base64.urlsafe_b64decode(cursor + \"=\" * (-len(cursor) % 4)))[\"after\"]\n\ndef create_order(key, body):\n    with lock:\n        if key and key in seen:\n            return seen[key]                        # a retry: replay the first response\n        if not isinstance(body, dict) or not body.get(\"pizza\"):\n            return 400, {\"error\": \"pizza is required\"}\n        order = {\"id\": len(orders) + 1, \"pizza\": body[\"pizza\"]}\n        orders.append(order)\n        response = (201, order)\n        if key:\n            seen[key] = response\n        return response\n\ndef list_orders(limit, cursor):\n    after = decode_cursor(cursor) if cursor else 0\n    rows = [o for o in orders if o[\"id\"] > after][:limit + 1]   # one extra row says whether there's more\n    page = rows[:limit]\n    return 200, {\"orders\": page, \"next\": encode_cursor(page[-1][\"id\"]) if len(rows) > limit else None}\n\nclass Handler(BaseHTTPRequestHandler):\n    def send_json(self, status, payload):\n        body = json.dumps(payload).encode()\n        self.send_response(status)\n        self.send_header(\"Content-Type\", \"application/json\")\n        self.send_header(\"Content-Length\", str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\n\n    def do_POST(self):\n        if self.path != \"/orders\":\n            return self.send_json(404, {\"error\": \"not found\"})\n        raw = self.rfile.read(int(self.headers.get(\"Content-Length\", 0)))\n        try:\n            body = json.loads(raw or b\"{}\")\n        except ValueError:\n            return self.send_json(400, {\"error\": \"invalid JSON\"})\n        self.send_json(*create_order(self.headers.get(\"Idempotency-Key\"), body))\n\n    def do_GET(self):\n        url = urlsplit(self.path)\n        if url.path != \"/orders\":\n            return self.send_json(404, {\"error\": \"not found\"})\n        query = parse_qs(url.query)\n        limit = max(1, min(int(query.get(\"limit\", [\"20\"])[0]), 100))\n        self.send_json(*list_orders(limit, query.get(\"cursor\", [None])[0]))\n\n    def log_message(self, *args):\n        pass\n\ndef call(port, method, path, body=None, key=None):\n    headers = {\"Content-Type\": \"application/json\", **({\"Idempotency-Key\": key} if key else {})}\n    data = json.dumps(body).encode() if body is not None else None\n    req = urllib.request.Request(f\"http://127.0.0.1:{port}{path}\", data=data, method=method, headers=headers)\n    try:\n        with urllib.request.urlopen(req) as resp:\n            return resp.status, json.loads(resp.read())\n    except urllib.error.HTTPError as e:             # urllib raises for 4xx and 5xx answers\n        return e.code, json.loads(e.read())\n\nserver = ThreadingHTTPServer((\"127.0.0.1\", 0), Handler)\nthreading.Thread(target=server.serve_forever, daemon=True).start()\nport = server.server_address[1]\ntry:\n    first = call(port, \"POST\", \"/orders\", {\"pizza\": \"margherita\"}, key=\"k-1\")\n    retry = call(port, \"POST\", \"/orders\", {\"pizza\": \"margherita\"}, key=\"k-1\")\n    assert first == retry == (201, {\"id\": 1, \"pizza\": \"margherita\"})          # the retry made no second order\n    for i in range(2, 8):\n        assert call(port, \"POST\", \"/orders\", {\"pizza\": f\"pizza {i}\"}, key=f\"k-{i}\")[0] == 201\n    assert call(port, \"POST\", \"/orders\", {}, key=\"k-bad\")[0] == 400\n    ids, cursor, pages = [], None, 0\n    while True:\n        status, page = call(port, \"GET\", \"/orders?limit=3\" + (f\"&cursor={cursor}\" if cursor else \"\"))\n        assert status == 200\n        ids += [o[\"id\"] for o in page[\"orders\"]]\n        cursor, pages = page[\"next\"], pages + 1\n        if cursor is None:\n            break\n    assert ids == list(range(1, 8)) and call(port, \"GET\", \"/nothing\")[0] == 404\n    print(f\"orders created: {len(orders)} | ids walked through {pages} pages:\", *ids)\nfinally:\n    server.shutdown()\nprint(\"api lab OK\")\n","out":"orders created: 7 | ids walked through 3 pages: 1 2 3 4 5 6 7\napi lab OK\n"},{"lang":"javascript","src":"const http = require(\"node:http\");\n\nconst orders = [], seen = new Map();                // orders in creation order; seen: idempotency key -> response\n                                                    // Node runs one handler at a time, so no lock is needed\nconst encodeCursor = id => Buffer.from(JSON.stringify({ after: id })).toString(\"base64url\");\nconst decodeCursor = cursor => JSON.parse(Buffer.from(cursor, \"base64url\").toString()).after;\n\nfunction createOrder(key, body) {\n  if (key && seen.has(key)) return seen.get(key);   // a retry: replay the first response\n  if (!body || typeof body !== \"object\" || !body.pizza) return [400, { error: \"pizza is required\" }];\n  const order = { id: orders.length + 1, pizza: body.pizza };\n  orders.push(order);\n  const response = [201, order];\n  if (key) seen.set(key, response);\n  return response;\n}\n\nfunction listOrders(limit, cursor) {\n  const after = cursor ? decodeCursor(cursor) : 0;\n  const rows = orders.filter(o => o.id > after).slice(0, limit + 1);   // one extra row says whether there's more\n  const page = rows.slice(0, limit);\n  return [200, { orders: page, next: rows.length > limit ? encodeCursor(page.at(-1).id) : null }];\n}\n\nconst server = http.createServer((req, res) => {\n  const send = (status, payload) => {\n    const body = JSON.stringify(payload);\n    res.writeHead(status, { \"Content-Type\": \"application/json\", \"Content-Length\": Buffer.byteLength(body) });\n    res.end(body);\n  };\n  const url = new URL(req.url, \"http://localhost\");\n  if (url.pathname !== \"/orders\") return send(404, { error: \"not found\" });\n  if (req.method === \"GET\") {\n    const limit = Math.max(1, Math.min(Number(url.searchParams.get(\"limit\") ?? 20), 100));\n    return send(...listOrders(limit, url.searchParams.get(\"cursor\")));\n  }\n  if (req.method !== \"POST\") return send(405, { error: \"method not allowed\" });\n  let raw = \"\";\n  req.on(\"data\", chunk => (raw += chunk));\n  req.on(\"end\", () => {\n    let body;\n    try { body = JSON.parse(raw || \"{}\"); } catch { return send(400, { error: \"invalid JSON\" }); }\n    send(...createOrder(req.headers[\"idempotency-key\"], body));\n  });\n});\n\nasync function call(port, method, path, body = null, key = null) {\n  const headers = { \"Content-Type\": \"application/json\" };\n  if (key) headers[\"Idempotency-Key\"] = key;\n  const res = await fetch(`http://127.0.0.1:${port}${path}`, { method, headers, body: body === null ? undefined : JSON.stringify(body) });\n  return [res.status, await res.json()];\n}\n\nserver.listen(0, \"127.0.0.1\", async () => {        // port 0: the system picks a free port\n  const port = server.address().port;\n  try {\n    const first = await call(port, \"POST\", \"/orders\", { pizza: \"margherita\" }, \"k-1\");\n    const retry = await call(port, \"POST\", \"/orders\", { pizza: \"margherita\" }, \"k-1\");\n    if (JSON.stringify(first) !== JSON.stringify(retry) || first[0] !== 201 || first[1].id !== 1) throw new Error(\"idempotency\");\n    for (let i = 2; i < 8; i++) {\n      if ((await call(port, \"POST\", \"/orders\", { pizza: `pizza ${i}` }, `k-${i}`))[0] !== 201) throw new Error(\"create\");\n    }\n    if ((await call(port, \"POST\", \"/orders\", {}, \"k-bad\"))[0] !== 400) throw new Error(\"validation\");\n    const ids = [];\n    let cursor = null, pages = 0;\n    do {\n      const [status, page] = await call(port, \"GET\", \"/orders?limit=3\" + (cursor ? `&cursor=${cursor}` : \"\"));\n      if (status !== 200) throw new Error(\"list\");\n      ids.push(...page.orders.map(o => o.id));\n      cursor = page.next;\n      pages++;\n    } while (cursor !== null);\n    if (ids.join() !== \"1,2,3,4,5,6,7\" || (await call(port, \"GET\", \"/nothing\"))[0] !== 404) throw new Error(\"pages\");\n    console.log(`orders created: ${orders.length} | ids walked through ${pages} pages:`, ...ids);\n    console.log(\"api lab OK\");\n  } finally {\n    server.close();\n  }\n});\n","out":"orders created: 7 | ids walked through 3 pages: 1 2 3 4 5 6 7\napi lab OK\n"}]},"breakit":["Drop the lock in Python and fire 50 concurrent creates with one key from threads: count how many orders appear.","Switch the list to offset paging, add an order between page requests, and catch a repeat.","Send a retry with the same key but a different pizza: what should the API say? (Module 8's discussion suggests 422.)"]},{"id":"capstone","capstone":true,"t":"URL shortener: design doc, estimates, a working service and a load test","min":720,"mods":["m01","m02","m03","m04","m05","m06","m07","m08","m09"],"goal":"Design and build a small URL shortener. Write a one-page design doc with estimates and a boxes-and-arrows diagram, build the service in Python or JavaScript (both if you can) with only the standard library, put a cache in front of the redirects, then load-test it and report what limited it.","deliver":["A design doc of one or two pages: requirements, estimates with stated assumptions (module 9), the API, the data model, a diagram, and the trade-offs you chose.","A working service: POST /links with an Idempotency-Key creates a link with a base-62 code (module 8); GET /{code} redirects with 301 or 302; unknown codes get 404; links are stored in SQLite (`sqlite3` / `node:sqlite`).","An LRU cache with a TTL in front of the redirects (the cache lab), with hit and miss counts you can show.","Tests for create, redirect, an unknown code, a retried create with the same key, and a cached link that expires.","A load-test script that fires concurrent redirects and reports requests per second and the median and 99th-percentile latency, with and without the cache, plus a paragraph on what limited it."],"rubric":["The estimates state their assumptions and lead to concrete choices: code length, storage and cache size.","The API uses correct methods and status codes, and a retried create can't make a duplicate.","The cache's effect is measured (hit ratio, latency), not guessed.","The doc names the single points of failure and how you'd remove them (modules 3 and 4).","Someone else can run the service, the tests and the load test from your README."],"steps":["Write the requirements and the estimates first: new links a month, redirects per link, record size, how long links live.","Sketch the design: client → load balancer → app servers → cache → database, and say where a CDN or a redirect cache would go.","Build create and redirect over SQLite, with base-62 codes from a counter.","Put the cache lab's LRU + TTL cache in front of redirects and count hits and misses.","Add idempotency keys to create, and a test for every case in the deliverables.","Load-test with and without the cache, then write up what you measured and what you'd change for 100 times the traffic."],"stretch":["Run two copies of the service behind a tiny round-robin proxy and stop one in the middle of the load test.","Hand out counter ranges per server (blocks of 1,000 ids) so that servers don't share one counter.","Make codes hard to guess by mixing the counter through a reversible shuffle before encoding it."]}],"interview":[{"c":"Networking","q":"What happens when you type a URL into a browser and press Enter?","a":"The browser parses the URL and finds the server's IP address with DNS, usually from a cache. It opens a TCP connection (one round trip) and sets up TLS (one more with TLS 1.3), checking the server's certificate, or does both in one round trip with HTTP/3 over QUIC. Then it sends the HTTP request; a CDN or a load balancer may answer or forward it to an app server, which replies with a status code, headers and HTML. The browser parses that and fetches the images, styles and scripts it refers to, reusing connections where it can. For a distant user the round trips, not the server's work, take most of the time.","f":["Where does the time go for a user on another continent?","What does HTTP/3 change?"]},{"c":"Networking","q":"TCP or UDP: when would you use each?","a":"TCP gives a reliable, ordered byte stream, so it carries most web traffic, databases and anything where every byte matters; it costs a handshake, and one lost packet stalls everything behind it. UDP sends independent datagrams with no handshake and no delivery promise, which suits real-time voice, video and games, where late data is useless, and small request-and-answer traffic such as DNS. QUIC builds reliable, multiplexed streams on top of UDP for HTTP/3.","f":["Why doesn't a video call just use TCP?"]},{"c":"Scaling","q":"Vertical or horizontal scaling: how do you choose?","a":"Scaling up, to a bigger machine, needs no code changes and is often the cheapest first step, but it has a ceiling and leaves a single point of failure. Scaling out, to more machines behind a load balancer, keeps growing and survives a machine failing, but the servers must be stateless and you take on more moving parts. I usually scale the stateless web tier out early, scale the database up for as long as that's comfortable, and move it to replicas and partitioning when the numbers say so.","f":["What has to change in an app before it can scale out?"]},{"c":"Scaling","q":"What makes a service stateless, and why does it matter?","a":"A stateless service keeps nothing about a user in its own memory between requests: sessions, carts and uploads live in a shared store, a database or object storage, or in a signed token the client sends back. Then any server can answer any request, so a load balancer can spread traffic freely, and servers can be added, removed or restarted without logging anyone out. Sticky sessions hide the problem, but give uneven load and lose sessions when a server dies.","f":["What are the trade-offs of signed tokens against a session store?"]},{"c":"Reliability","q":"How do you estimate the availability of a system with several components?","a":"Components a request needs one after another multiply, so three at 99.9% give about 99.7%. A tier of redundant copies is down only when all of them are: 1 − (1 − a)ⁿ, so two copies at 99.9% give 99.9999%. That shows where to add redundancy: at the weakest link, often a single database. The parallel formula assumes independent failures, so copies go in different racks or zones, and the result is a best case.","f":["What's an error budget?","Why can two servers in one rack fail together?"]},{"c":"Reliability","q":"How should a client retry a failed request?","a":"Only for errors that may pass, such as timeouts, connection resets and 503s, and only for operations that are safe to repeat: GET, PUT and DELETE, or POSTs with an idempotency key. It should wait between attempts with exponential backoff and random jitter, so that clients that failed together don't retry together, cap the attempts at a small number, and retry at one layer only, because retries at every layer multiply. Every call also needs a timeout.","f":["What's a retry storm?","What does a circuit breaker add?"]},{"c":"Load balancing","q":"How does a load balancer choose a server, and how does it notice failures?","a":"It picks from the healthy servers with an algorithm: round robin when servers and requests are alike, weights when servers differ in size, least connections when request times vary, or a hash of a key when the same user should reach the same server. It probes every server with health checks every few seconds, taking one out after several failures in a row and bringing it back after several passes, so a single blip doesn't make it flap. The load balancer itself runs as a redundant pair or a managed service.","f":["What should a health check test?","How do you take a server out without dropping requests?"]},{"c":"Load balancing","q":"Layer 4 or layer 7 load balancing?","a":"A layer 4 balancer forwards TCP or UDP connections by address and port without reading them: fast, simple and protocol-agnostic. A layer 7 balancer understands HTTP, so it can terminate TLS, route by path or host, add headers and retry safe requests, at more cost per request. Web apps usually want layer 7; layer 4 suits other protocols and very high throughput, often as a first tier in front of layer 7 proxies."},{"c":"Caching","q":"Explain cache-aside, and how you keep the cache consistent with the database.","a":"The app checks the cache first; on a miss it reads the database and stores the result with a TTL. Only data that is read gets cached, and a cache failure just makes reads slower. On a write I update the database and then delete the cached key, so the next read loads the fresh value, and the TTL is a safety net in case a delete is lost. Data that must never be stale, such as a price at checkout, is read from the database.","f":["Why delete the key rather than update it?","Write-through or write-back?"]},{"c":"Caching","q":"What is a cache stampede, and how do you prevent it?","a":"When a popular entry expires, every request misses at the same moment and they all hit the database together, which can knock it over. The fixes: let one request rebuild the entry while the others wait for it or get the old value (single flight, or a lock or lease), add random jitter to TTLs so keys don't expire together, and refresh hot keys before they expire."},{"c":"Caching","q":"How does a CDN decide what to cache, and how do you ship a new version of a file?","a":"The origin's Cache-Control headers decide: max-age or s-maxage for how long a copy stays fresh, private or no-store to keep it out of shared caches. When a copy goes stale the edge revalidates it with the ETag and gets a 304 if nothing changed. For static files the best approach is a content hash in the file name and a year-long lifetime: a release refers to new names, so no user sees a stale mix and nothing needs purging."},{"c":"Storage","q":"SQL or NoSQL: how do you decide?","a":"From the access patterns. If the data is relational, needs transactions and will be queried in ways I can't predict yet, a relational database is the default, and with caching and read replicas it goes a long way. A key-value or wide-column store fits a few known access patterns at very large scale, such as sessions, events or a feed per user; a document store fits records read and written whole whose shape changes often. Files go to object storage either way.","f":["How would you store a user's orders by date in a key-value store?"]},{"c":"Storage","q":"What is replication lag, and how do you deal with it?","a":"With asynchronous replication a replica applies the primary's changes a little later, so reads from it can be out of date: usually by milliseconds, more under load. The visible problem is a user who saves something and doesn't see it. The usual fix is reading your own writes: for a few seconds after a user writes, their reads go to the primary, while everyone else keeps using replicas. Data that must be current is always read from the primary."},{"c":"APIs","q":"How do you make a create endpoint safe to retry?","a":"The client sends an Idempotency-Key, a unique id for that one operation, with the request and every retry. The server stores the key with the first response, ideally in the same transaction that creates the resource, and replays that response for any repeat. A repeat with a different body gets an error, and a repeat while the first is still running gets 409 so the client waits. Keys expire after a day or so.","f":["Why isn't POST idempotent on its own?"]},{"c":"APIs","q":"Offset or cursor pagination?","a":"Offset pagination is simple and allows jumping to any page, but deep pages make the database read and throw away every earlier row, and new rows shift the pages so items repeat or go missing. Cursor pagination returns an opaque token with the last item's sort key, usually a timestamp plus an id to break ties, and asks for items after it. It's fast at any depth with an index and stable while data changes, but can't jump to page 50. I use cursors for feeds and big lists."},{"c":"Estimation","q":"Estimate the traffic and storage for a URL shortener.","a":"Assume 100 million new links a month and 100 redirects per link. That's about 40 writes a second and 4,000 redirects a second on average, about 12,000 at a 3× peak. Over five years that's 6 billion links, so base-62 codes need 6 characters (62⁶ ≈ 57 billion). At 500 bytes a record, that's 3 TB, or 9 TB with three copies, and caching 20% of a day's reads needs about 33 GB of memory. Nothing there needs a huge fleet, so the design effort goes into fast redirects and availability.","f":["What would change at 100 times the traffic?"]}],"cheat":[{"t":"Numbers to know","items":["Memory reference ~100 ns · SSD read ~16–150 µs · round trip in a data centre ~0.5 ms · between continents ~150 ms","Light in fibre ≈ 200 km per ms: 6,000 km away means a round trip of at least ~60 ms","A day ≈ 86,400 s ≈ 10⁵ · 1 million a day ≈ 12 a second · 1 billion a day ≈ 12,000 a second","2¹⁰ ≈ 10³ (KB) · 2²⁰ ≈ 10⁶ (MB) · 2³⁰ ≈ 10⁹ (GB) · 2⁴⁰ ≈ 10¹² (TB)","1 byte = 8 bits: 100 MB/s ≈ 800 Mbit/s"]},{"t":"Availability and retries","items":["99.9% ≈ 8.8 h a year ≈ 43 min a month · 99.99% ≈ 53 min a year","Series: a₁ × a₂ × … · parallel copies: 1 − (1 − a)ⁿ (independent failures only)","Error budget = 100% − SLO; an SLA is usually looser than the SLO","Retry: timeout → retryable error? → backoff with jitter → small cap, at one layer"]},{"t":"Scaling and load balancing","items":["Throughput = the slowest tier's capacity: scale the bottleneck","Little's law: in flight = rate × time · Amdahl: speed-up < 1 ÷ serial share","Servers = ⌈peak ÷ (capacity × 70%)⌉, plus one spare","Round robin (alike) · weighted (mixed sizes) · least connections (uneven request times) · hash (affinity)","Health checks: several failures to go down, several passes to come back"]},{"t":"Caching and storage","items":["Average read = cache time + (1 − hit ratio) × database time","Cache-aside: read through on a miss; on a write, update the database, then delete the key","Cache-Control: max-age · s-maxage (CDNs) · private · no-cache (revalidate) · no-store","Relational for transactions and flexible queries · key-value for huge simple lookups · object storage for files","Replicas lag: read your own recent writes from the primary"]},{"t":"APIs","items":["Nouns in paths, methods as verbs: GET, POST, PUT, PATCH, DELETE","201 Created · 204 No Content · 400 · 401 · 403 · 404 · 409 · 429 · 503","Idempotent: GET, PUT, DELETE · POST needs an idempotency key","Cursor = an opaque token holding the last item's sort key (and id); fetch limit + 1","Only add to a published API; breaking changes go in a new version"]}],"glossary":[["ACID","The guarantees of a database transaction: atomic (all or nothing), consistent, isolated and durable."],["Amdahl's law","The speed-up from spreading work over n machines is capped by the part that can't be spread."],["Availability","The share of time, or of requests, for which a system does its job."],["Bandwidth","How much data a link carries per second, usually in bits per second."],["Cache-aside","The app checks the cache, and on a miss reads the database and stores the result."],["CDN","Content delivery network: edge servers near users that serve cached copies of the origin's responses."],["Cursor pagination","Paging with an opaque token that marks where the last page ended."],["DNS","The system that turns host names into IP addresses."],["Error budget","100% minus the SLO: the failures a service may spend in a window."],["ETag","A validator that identifies a version of a response, used to revalidate cached copies."],["Failover","Switching to a standby copy when the active one fails."],["Health check","A regular probe that tells a load balancer whether a server should get traffic."],["Hit ratio","The share of lookups a cache answers itself."],["Horizontal scaling","Adding more machines that share the work."],["Idempotency key","A unique key per operation that lets the server replay the first result for a retry, so a POST becomes safe to repeat."],["Latency","How long one operation or trip takes."],["Least connections","Load balancing that sends each request to the server with the fewest in flight."],["Little's law","Requests in flight = arrival rate × time each spends in the system."],["Load balancer","A component that spreads requests across a pool of servers and routes around failed ones."],["LRU","Least recently used: the eviction policy that drops the entry untouched for the longest."],["Object storage","Storage for whole files addressed by key over HTTP, such as Amazon S3."],["Partition key","The part of a key that decides which partition or machine holds an item."],["Read replica","A copy of a database that follows the primary and serves reads."],["Replication lag","How far a replica is behind its primary."],["Reverse proxy","A server in front of other servers that receives requests on their behalf and routes them."],["Round trip time (RTT)","The time for a message to reach the other side and a reply to come back."],["SLI, SLO, SLA","What you measure, the target for it, and a contract with consequences if it's missed."],["Stateless service","A service that keeps no per-user state in memory between requests."],["TTL","Time to live: how long a cached copy or DNS answer may be used."],["Vertical scaling","Moving to a bigger machine."]],"sourceGroups":[{"t":"Standards and official documentation","items":[["RFC 9110: HTTP Semantics","https://www.rfc-editor.org/rfc/rfc9110","A5 R5 D5 · free"],["RFC 9111: HTTP Caching","https://www.rfc-editor.org/rfc/rfc9111","A5 R5 D5 · free"],["MDN: HTTP","https://developer.mozilla.org/en-US/docs/Web/HTTP","A5 R5 D4 · free"],["Python docs: http.server","https://docs.python.org/3/library/http.server.html","A5 R5 D4 · free"],["Node.js docs: HTTP","https://nodejs.org/api/http.html","A5 R5 D4 · free"],["Node.js docs: SQLite (node:sqlite, from Node.js 22.13)","https://nodejs.org/api/sqlite.html","A5 R5 D4 · free"]]},{"t":"Reliability in practice","items":[["Google SRE book (embracing risk, SLOs, load balancing, handling overload)","https://sre.google/sre-book/table-of-contents/","A5 R3 D5 · free"],["Google SRE workbook: Implementing SLOs","https://sre.google/workbook/implementing-slos/","A5 R3 D5 · free"],["Amazon Builders' Library: Timeouts, retries and backoff with jitter","https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/","A5 R3 D5 · free"]]},{"t":"Free references and practice","items":[["System Design Primer","https://github.com/donnemartin/system-design-primer","A4 R3 D4 · free"],["Colin Scott: Latency numbers every programmer should know","https://colin-scott.github.io/personal_website/research/interactive_latency.html","A4 R3 D3 · free"],["NGINX: Using nginx as HTTP load balancer","https://nginx.org/en/docs/http/load_balancing.html","A5 R4 D4 · free"],["Cloudflare Learning Center: CDNs, DNS and HTTP","https://www.cloudflare.com/learning/","A4 R4 D3 · free"]]},{"t":"Books for L2 and beyond","items":[["Designing Data-Intensive Applications, 2nd edition (2026)","https://martin.kleppmann.com/2026/03/24/designing-data-intensive-applications-2e.html","A5 R5 D5 · paid, for L2–L4"]]}],"aiCtx":"The learner is starting System Design at level L1 Foundation: how a request travels (DNS, TCP/UDP, HTTP, TLS and latency), vertical and horizontal scaling with stateless services, availability maths and redundancy, load balancing, caching basics, CDNs and proxies, choosing storage (SQL, NoSQL, blob storage), REST APIs with pagination and idempotency, and back-of-the-envelope estimation. They know basic programming in Python 3.12+ and JavaScript (Node.js 22), and DSA L1. Use plain words, concrete numbers and short examples, show small simulations in Python and JavaScript when it helps, state assumptions in every estimate, and say when a number is a rule of thumb rather than a measurement. Never invent product limits or prices; if unsure, say so.","storyWorld":"Pizza Town and the family road trip","kidMapHead":"In a real system","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the simulation before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps in order.","**Code drop-downs**: complete Python or JavaScript. Each was checked so only one combination works.","**Matching**: map building blocks to the problems they solve."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to pick the right building block for a scenario. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is a small product with real numbers. Read the scenario tabs, then choose the design and justify it with an estimate.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Standards (RFCs), official documentation and well-known free references, all checked on 12 Oct 2026.","sourcesTab":"Resources","freshStyle":"in the style of a first system-design interview (a short scenario with numbers, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Networking and latency, scaling, availability, load balancing, caching, CDNs, storage, APIs, estimation","x":"this hub","cur":true},{"k":"L2 Proficient","t":"Design common products (feed, chat, rate limiter) with sound trade-offs","x":"next"},{"k":"L3 Specialist","t":"Distributed, data-intensive systems: payments, streaming, search, geo","x":"later"},{"k":"L4 Expert","t":"Architecture leadership: reviews, capacity and cost, organisation-level design","x":"later"}],"ladderTitle":"Your system design ladder","ladderNote":"Each level is its own hub","deck":"system-design-l1","examinerRole":"senior engineer running a friendly first system-design interview","aiCheck":"Written by Claude for this hub. Check surprising claims against the linked RFCs, MDN, the official Python docs and the cloud providers' own documentation, and run the code yourself."};

<script>
(function () {
"use strict";
/* ===== core: data indexes, helpers, storage + account sync, tabs, header ===== */
const H = window.HUB;
const M = H.modules;
const MID = {};
M.forEach((m, i) => { MID[m.id] = m; m._i = i; });
const DOM = H.domains;
const DMAP = {};
DOM.forEach((d, i) => { DMAP[d.id] = d; d._i = i; d.cls = "d" + (i + 1); });
const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LET = "ABCDEFGHIJKL";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */
function inl(s) {
  const parts = String(s == null ? "" : s).split("`");
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<code>" + esc(p) + "</code>";
    let t = esc(p);
    t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[\s(“"'\/-])\*([^*\s](?:[^*]*[^*\s])?)\*(?=[\s).,;:!?”"'\/-]|$)/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }).join("");
}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(iso, opts) { try { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return iso; } }
function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1800); } }

    const host = (btn && btn.closest(".panel, .q, .ai-box")) || document.body;

    if (!ta) { ta = document.createElement("textarea"); ta.className = "copybox mono"; ta.setAttribute("aria-label", "Text to copy"); host.appendChild(ta); }
    ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
    if (btn) btn.textContent = "Select all and copy the text below";
  }
}

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));
(H.mocks || []).forEach(mk => (mk.items || []).forEach((q, i) => regItem(q, "mock" + mk.id + "." + (i + 1), { src: "Mock " + mk.id })));
(H.diag || []).forEach((q, i) => regItem(q, "diag." + (i + 1), { src: "Diagnostic" }));
const CASE = {}; (H.cases || []).forEach(c => { CASE[c.id] = c; });

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, probs: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }
    else setSync("error");
  } finally {
    SYNC.busy[part] = false;
    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }
  else return false;
  U[part] = data.upd; return true;
}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }
      else if (U[part]) flush(part);
    } catch (e) { setSync("error"); return changed; }
  }
  saveLocal();
  return changed;
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("loading");
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }
  });
}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }
  if (score < 1) {
    const m = S.mis[it.id] || { n: 0 };
    m.n += 1; m.at = today(); m.g = String(given || "").slice(0, 160); m.fx = null; S.mis[it.id] = m;
    const keys = Object.keys(S.mis); if (keys.length > 400) { keys.sort((a, b) => (S.mis[a].at < S.mis[b].at ? -1 : 1)).slice(0, keys.length - 400).forEach(k => delete S.mis[k]); }
  } else if (S.mis[it.id] && !S.mis[it.id].fx) { S.mis[it.id].fx = today(); }
  touch("main");
}
function domainAccuracy(did) { const ds = S.dstat[did]; return ds && ds[1] ? ds[0] / ds[1] : null; }
function readiness() {
  if (!HASMOCK) {
    const n = M.length, ok = M.filter(m => S.quiz[m.id] && S.quiz[m.id].best >= 80).length;
    if (ok === n) return { cls: "ok", label: `Mastery: ${ok}/${n} topics`, verdict: "ok", text: `Level mastered: every topic's quiz is at 80% or better. Finish the capstone and write it up to mark this level complete.` };
    if (ok > 0) return { cls: "mid", label: `Mastery: ${ok}/${n} topics`, verdict: "mid", text: `${ok} of ${n} topics are at 80%+ on their quiz. A topic counts as mastered at 80%; Practice → Weak spots finds the rest.` };
    return { cls: "info", label: `Mastery: 0/${n} topics`, verdict: "na", text: `No topic mastered yet. A topic counts as mastered when its quiz reaches 80%; the level is complete when every topic does and the capstone is built.` };
  }
  const list = MOCKS.slice().sort((a, b) => (a.at < b.at ? -1 : 1));
  if (!list.length) return { cls: "info", label: "Readiness: no mock yet", verdict: "na", text: "Take a timed mock to get a readiness estimate." };
  const last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;
  const doms = Object.values(last.byDomain || {}).map(x => x.pct);
  const minDom = doms.length ? Math.min(...doms) : 0;
  if (prev && last.weighted >= 85 && prev.weighted >= 85 && minDom >= 70 && last.cwPct <= 10) return { cls: "ok", label: "Readiness: ready", verdict: "ok", text: `Ready: your last two mocks are ${prev.weighted}% and ${last.weighted}% (weighted), no domain is under 70%, and confident-wrong answers are ${last.cwPct}%. Confirm with the official practice assessment, then book.` };
  if (last.weighted >= 75) return { cls: "mid", label: "Readiness: almost", verdict: "mid", text: `Almost: last mock ${last.weighted}% weighted, weakest domain ${minDom}%, confident-wrong ${last.cwPct}%. ${prev ? "" : "One mock isn't enough evidence: take the second mock after fixing your weak topics. "}Ready means 85%+ on two consecutive mocks, every domain at 70%+, and confident-wrong at 10% or less.` };
  return { cls: "no", label: "Readiness: not yet", verdict: "no", text: `Not yet: last mock ${last.weighted}% weighted (weakest domain ${minDom}%). Work through the weakest modules (story, key points, quiz), redo your mistakes, then retake.` };
}

/* ---------- tabs + header ---------- */
const HASMOCK = (H.mocks || []).length > 0;
const VIEWS = [["start", "Start"], ["plan", "Roadmap"], ["learn", "Learn"], ["practice", "Practice"], ["cases", H.casesTab || "Case studies"], ["mock", H.mockTab || "Mock exams"], ["labs", H.labsTab || "Labs"], ["cards", "Flashcards"], ["interview", "Interview"], ["cheat", H.cheatTab || "Cheat sheet"], ["sources", H.sourcesTab || "Sources"]].filter(([k]) => !(k === "mock" && !HASMOCK) && !(k === "cases" && !(H.cases || []).some(c => !c.mockOnly)));
const RENDER = {};
let CURVIEW = "start";
function show(v, keepScroll) {

   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn small" id="fCopy">Copy card progress for Claude</button></div><p class="small muted" style="text-align:center;margin:.4em 0 0">Paste it in our chat to sync these cards with the deck in your vault.</p></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  $("#fCopy").addEventListener("click", e => { const tn2 = dayNum(today()); const prog = Object.keys(CARDS).map(id => ({ id, box: CARDS[id][0], due_in_days: CARDS[id][1] - tn2 })); copyText(`My ${H.code} flashcard progress from the Study Hub (deck ${H.deck || H.id}). Please update the vault deck to match:\n` + JSON.stringify(prog), e.currentTarget); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
