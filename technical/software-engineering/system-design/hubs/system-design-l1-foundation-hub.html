<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Design L1 Foundation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}
.seq .arrow{position:relative;align-self:center;height:0;border-top:2px solid var(--accent);margin-inline:10%}
.seq .arrow.dash{border-top-style:dashed}
.seq .arrow::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.seq .arrow.r::after{right:-2px;border-left:8px solid var(--accent);border-right:0}
.seq .arrow.l::after{left:-2px;border-right:8px solid var(--accent);border-left:0}
.seq .arrow .t{position:absolute;left:0;right:0;bottom:3px;text-align:center;color:var(--fg);line-height:1.2;padding-inline:2px}
.seq .self{align-self:center;justify-self:center;border:1.5px dashed var(--accent);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--fg)}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1.5px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{position:relative;padding:4px 0 4px 10px;font-size:.88rem}
.tree li::before{content:"";position:absolute;left:-18px;top:16px;width:22px;border-top:1.5px solid var(--line)}
.tree>ul>li::before{display:none}
.tree .q{display:inline-block;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.tree .br{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.tree .leaf{display:inline-block;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:2px 8px}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;font-size:.86rem}
.quad .ax{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center;justify-self:center}
.quad .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px}
.quad .cell b{display:block;font-family:var(--f-display)}

/* Questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;min-width:0}
.q .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.q .stem{font-weight:700;margin-bottom:10px;white-space:pre-wrap}
.q .hint{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.yn{display:grid;gap:6px}
.yn .st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.yn .st.right{border-color:var(--good);background:var(--good-soft)} .yn .st.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord{display:grid;gap:6px;counter-reset:o}
.ord .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ord .it .pos{font-family:var(--f-mono);font-weight:600;color:var(--muted);width:1.6em}
.ord .it.right{border-color:var(--good);background:var(--good-soft)} .ord .it.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord .mv{display:flex;gap:4px}
.ord .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700}
.match{display:grid;gap:6px}
.match .pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.match .pr.right{border-color:var(--good);background:var(--good-soft)} .match .pr.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match select{width:100%;min-width:0}
pre.dropcode{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:var(--r);overflow-x:auto;line-height:2;margin:0 0 6px;font-size:.82rem;white-space:pre}
pre.dropcode select{font-family:var(--f-mono);font-size:.78rem;padding:1px 4px;border-radius:5px;background:#1d2a38;color:#e7eef6;border:1px solid #3d5168}
pre.dropcode select.right{border-color:#4fc98d;box-shadow:0 0 0 1px #4fc98d}
pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}
.expl{margin-top:9px;font-size:.93rem;border-top:1px solid var(--line);padding-top:9px}
.expl .v{font-weight:700}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Practice / mock / cases */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.mock-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);display:grid;gap:12px}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 0;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--fg)}
.navgrid button.flag::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--trap)}
.navgrid button.cs{border-style:dashed}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.82rem;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.dbars{display:grid;gap:8px;margin-top:10px}
.dbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:.86rem}
.dbar .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.dbar .tr i{display:block;height:100%}
.dbar b{text-align:right;font-variant-numeric:tabular-nums}
.verdict{padding:12px 14px;border-radius:8px;font-weight:700;margin-top:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.mid{background:var(--trap-soft);color:var(--trap)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.na{background:var(--surface-2);color:var(--muted)}
.case-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.case-doc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 126px);overflow:auto}
.case-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.case-tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:.82rem;font-weight:700;cursor:pointer}
.case-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scenario{font-size:.93rem}
.scenario ul{padding-left:20px;margin:6px 0}
details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}
details.scen summary{cursor:pointer;font-weight:700;color:var(--info)}

/* Flashcards */
.fc{max-width:660px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}
.card .side{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .txt{font-size:1.1rem}
.card.back{background:var(--accent-soft)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--surface-2);border-radius:7px;padding:6px;text-align:center;font-size:.76rem}
.boxes b{display:block;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}

/* Labs, interview, cheat */
details.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.lab+details.lab{margin-top:10px}
details.lab summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.lab summary::-webkit-details-marker{display:none}
details.lab summary h3{font-size:1.02rem}
details.lab .body{display:grid;gap:12px;margin-top:12px}
.cost{font-size:.88rem}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.cs-grid .panel h3{font-size:.98rem;margin-bottom:8px}
.cs-grid ul{margin:0;padding-left:18px;font-size:.9rem} .cs-grid li{margin-bottom:4px}
.gloss{display:grid;gap:0}
.gloss div{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.gloss b{font-family:var(--f-display)}

/* AI tutor */
.ai-only{display:none!important}
body.has-ai .ai-only{display:revert!important}
body.has-ai .no-ai{display:none!important}
.ai-box{border:1px solid color-mix(in srgb,var(--info) 35%,var(--line));background:var(--surface);border-radius:var(--r);padding:14px 16px}
.ai-out{margin-top:10px;font-size:.95rem;min-height:1em}
.ai-out:empty{display:none}
.ai-out p:last-child{margin-bottom:0}
.ai-out pre{background:var(--surface-2);padding:10px;border-radius:8px;overflow-x:auto}
.ai-note{font-size:.78rem;color:var(--muted)}
.chat{display:grid;gap:8px;margin-top:10px}
.bub{border-radius:10px;padding:9px 12px;max-width:92%;font-size:.94rem}
.bub.me{justify-self:end;background:var(--accent-soft)}
.bub.ai{justify-self:start;background:var(--surface-2)}
.bub p:last-child{margin-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ===== hub engine v2 additions ===== */
:root{--d6:#8a5a00;--d6-soft:#f6ead2;--d7:#2b6f99;--d7-soft:#dcebf5;--d8:#7a3f9e;--d8-soft:#efe1f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d6:#e6b85c;--d6-soft:#2e2410;--d7:#7cc0ec;--d7-soft:#10283a;--d8:#d4a2f2;--d8-soft:#2c1838}}
:root[data-theme="dark"]{--d6:#e6b85c;--d6-soft:#2e2410;--d7:#7cc0ec;--d7-soft:#10283a;--d8:#d4a2f2;--d8-soft:#2c1838}
.chip.d6{background:var(--d6-soft);color:var(--d6)} .chip.d7{background:var(--d7-soft);color:var(--d7)} .chip.d8{background:var(--d8-soft);color:var(--d8)}

/* code tabs (Python | JavaScript …) */
.ctabs .ttl{justify-content:space-between}
.ctab-btns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}

.out{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;overflow-x:auto;margin:0}

.langpick{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
/* array / string cells */
.cells-wrap{display:grid;gap:4px}
.cells-row{display:flex;gap:10px;align-items:center;min-width:0}

window.HUB = {"id":"system-design-l1","code":"SD · L1","title":"System Design L1 Foundation Hub","brand":"Foundation Hub","cert":"System Design · L1 Foundation","eyebrow":"Level L1 Foundation · System Design · Python + JavaScript","pace":5,"accessed":"12 October 2026","hero":{"title":"How a web app works, and how to make it scale","sub":"Level L1 covers the building blocks behind every large system: how a request travels, how to add servers, how to keep a service up, and how to estimate what you need. Nine topics, each told first as a Pizza Town story and then properly, with small runnable simulations in **Python and JavaScript** side by side. You finish with four tested builds and a capstone: a URL shortener with a design doc, estimates, a cache and a load test."},"facts":[["9","topics, each a 90–100 minute module"],["45–55 h","to finish L1 at your own pace"],["2","languages for every example: Python + JavaScript"],["4 + 1","labs plus the URL-shortener capstone"],["0","cloud accounts needed: everything runs on your laptop"],["~40","practice problems and exercises"]],"notices":[{"k":"info","t":"No certification at this level","x":"No widely recognised system-design certification exists. L1 is complete when every module quiz is at 80%+, the four labs pass their tests in both languages, and your URL-shortener capstone has a design doc with estimates, a working version with a cache, and a load-test result."},{"k":"info","t":"Python and JavaScript side by side","x":"Every code block has a **Python | JavaScript** switch, remembered across modules. The examples are small, deterministic simulations (no network, no cloud), run against tests on 12 Oct 2026 (Python 3.13, Node.js 22.22). Module 7's SQLite example uses the built-in `node:sqlite`, which needs Node.js 22.13 or later. The labs and the capstone add real HTTP servers using only the standard libraries."},{"k":"info","t":"Numbers are rules of thumb","x":"Latency figures, server capacities and traffic shapes in this hub are typical orders of magnitude for teaching, not measurements of any product. Real designs start from measured numbers, and every estimate states its assumptions."}],"howto":["Take the **diagnostic** first (15 minutes). It ranks the four topic areas by *weight × gap*.","Open **Roadmap**, set your hours per week and start date, and tick blocks off as you go.","In each module: guess the pre-question, read the **🍎 story**, then the key ideas, diagram and code. Do the worked example, then finish the faded one yourself.","Run every simulation and change one number at a time: double the traffic, halve the hit ratio, remove a server. Predict the result before you run it.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","Draw every design as boxes and arrows, and write the estimate next to each arrow.","Finish with the capstone: write the design doc first, then build the smallest version that tests it."],"tactics":["**Clarify**: who are the users, what must the system do, and what must it never do? Write two or three numbers down (users, requests a day, data size).","**Estimate**: requests per second (average and peak), storage, bandwidth. Round boldly and state assumptions.","**Sketch the path**: client → DNS → load balancer → app servers → cache → database, and where the CDN sits.","**Find the bottleneck**: which box breaks first at peak? Scale that one, then look again.","**Plan for failure**: what happens when each box fails? Remove single points of failure where it matters.","**Explain trade-offs**: every choice costs something (money, consistency, complexity). Say what you gave up."],"tacticsTitle":"Design routine (use it on every question)","labsIntro":"Four builds feed the capstone. Write each one yourself in Python **and** JavaScript, run the tests, then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"These labs need only Python 3.12+ and Node.js 22.13+, using their standard libraries. No cloud account and no cost. Keep each lab in its own folder with its tests."},"labsTab":"Build","interviewIntro":"At L1 the interviewer wants clear building blocks, sensible numbers and honest trade-offs, not every buzzword. Answer each question out loud in about two minutes, then compare with the model answer. Draw the boxes as you talk.","interviewEyebrow":"From practice to interview","interviewSkills":"system design fundamentals, capacity estimation, web architecture, reliability basics","interviewTopics":"System Design L1 (networking and latency, scaling, availability, load balancing, caching, CDNs and proxies, storage choices, APIs, estimation)","roles":["Junior / mid-level software engineer","Backend or full-stack engineer","Data or analytics engineer working with services"],"domains":[{"id":"d1","short":"A","name":"The request path: networking, proxies and APIs","w":[30,30]},{"id":"d2","short":"B","name":"Scaling, availability and load balancing","w":[30,30]},{"id":"d3","short":"C","name":"Caching and storage","w":[25,25]},{"id":"d4","short":"D","name":"Estimation and design method","w":[15,15]}],"groups":[{"id":"g1","t":"How a request travels","mods":["m01","m02","m03"]},{"id":"g2","t":"Spreading the load","mods":["m04","m05","m06"]},{"id":"g3","t":"Data and interfaces","mods":["m07","m08"]},{"id":"g4","t":"Estimation","mods":["m09"]}],"modules":[{"id":"m01","d":"d1","t":"Client-server and networking: how a request travels","min":90,"hook":"Every system design starts with one request travelling from a phone to a server and back. Most of the time a user waits isn't spent in your code at all: it's DNS lookups, handshakes and the speed of light. Knowing which steps cost a round trip, and roughly how long one takes, is the first estimate in every design.","pre":{"q":"Your server answers in 5 ms, yet a user on another continent waits about 600 ms for the first byte of your page. Where could the other 595 ms be going?","a":"Mostly round trips. A DNS lookup, the TCP handshake, the TLS handshake and then the request itself each need at least one trip across the ocean and back, about 150 ms each. Fewer round trips (reused connections, TLS 1.3, HTTP/3, a server nearer the user) help far more than a faster server."},"kid":{"t":"Tara phones Luigi's","x":"Tara wants a pizza from Luigi's. She doesn't know the number, so she looks it up in the town phone book and writes it on her hand for later. She calls, says “Hello, can you hear me?” and waits for “Yes, I can hear you!” before ordering anything. Then she and Luigi agree on a secret code word, so nobody listening in can change the order. Only then does she order, and Luigi reads it back. Ben notices that calling Luigi's other shop, in the next town, takes longer: every hello has to travel there and back.","map":[["Looking up Luigi's number in the phone book","DNS turns a name like shop.example.com into an IP address"],["Writing the number on her hand for later","Caching the DNS answer for its time to live (TTL)"],["“Can you hear me?” — “Yes, I can hear you!”","The TCP handshake: one round trip before any data"],["Agreeing on a secret code word","The TLS handshake: keys for encryption, one more round trip with TLS 1.3"],["Every hello travelling to the next town and back","Round-trip time (RTT): distance sets a floor on latency"]],"brk":"A phone call is one conversation at a time, but a browser opens several connections and HTTP/2 sends many requests over one. And the code word isn't agreed in the open: TLS uses a key exchange, so someone who hears every message still can't work out the key."},"keys":["**The request path**: the browser turns a name into an IP address (DNS), opens a connection to that address (TCP), secures it (TLS), then sends an HTTP request and reads the response. Every step that waits for the other side costs at least one round trip.","**DNS**: a recursive resolver asks a root server, then the top-level domain's servers (such as .com), then the domain's own authoritative servers, and caches each answer for its TTL. A cached answer comes back in about a millisecond; a cold lookup can take tens of milliseconds or more.","**TCP and UDP**: TCP gives a reliable, ordered byte stream and starts with a three-way handshake, one round trip before any data. UDP sends independent datagrams with no handshake and no delivery promise; it suits DNS queries, voice, video and games, and it carries QUIC.","**HTTP**: a request (method, path, headers, optional body) and a response (status code, headers, body). HTTP/1.1 sends one request at a time on a connection (keep-alive lets the next request reuse it), HTTP/2 multiplexes many requests over one TCP connection, and HTTP/3 runs over QUIC on UDP.","**TLS**: HTTPS is HTTP inside TLS, which encrypts the whole HTTP message and proves the server's identity with a certificate. TLS 1.3 needs one round trip to set up a new connection (TLS 1.2 needed two) and can resume a recent one with none.","**Latency and bandwidth**: latency is how long one trip takes; bandwidth is how much fits through each second. Light in optical fibre covers about 200 km per millisecond, so a 6,000 km distance means a round trip of at least about 60 ms, whatever the bandwidth.","**Latency numbers to know**: roughly 100 ns for a memory reference, 16–150 µs for a random SSD read (newer drives are faster), about 0.5 ms for a round trip inside a data centre and about 150 ms between continents. Each step is 30 to 300 times the one before, so where data lives decides how fast you can be.","**Cutting round trips**: reuse connections (keep-alive, HTTP/2), cache DNS answers, use TLS 1.3 or HTTP/3, and serve from somewhere near the user (a CDN, module 6). Removing a round trip usually helps more than a faster server."],"dia":[{"type":"seq","cap":"A cold HTTPS request with TLS 1.3: three round trips before the first byte","actors":["Browser","DNS resolver","Server"],"msgs":[["Browser","DNS resolver","Where is shop.example.com?"],["DNS resolver","Browser","203.0.113.7 (keep it for the TTL)",true],["Browser","Server","TCP: SYN"],["Server","Browser","SYN-ACK",true],["Browser","Server","ACK, then TLS ClientHello"],["Server","Browser","ServerHello, certificate, Finished",true],["Browser","Server","Finished + GET /pizzas/42"],["Server","Browser","200 OK and the page",true]],"note":"After the DNS answer: one round trip for TCP, one for TLS 1.3 and one for the request itself. A reused connection skips straight to the GET; HTTP/3 merges the TCP and TLS round trips into one."},{"type":"layers","cap":"Latency numbers, roughly (Jeff Dean's list, updated by Colin Scott)","rows":[["Memory reference","about 100 ns"],["Random read from an SSD","about 16 µs on newer drives (150 µs in the 2012 list)"],["Round trip inside a data centre","about 0.5 ms"],["Round trip between continents","about 150 ms"]],"note":"Each step is 30 to 300 times slower than the one before. Treat these as orders of magnitude for estimates, not measurements of your system."}],"cmp":[{"cap":"TCP, UDP and QUIC","head":["","TCP","UDP","QUIC (under HTTP/3)"],"rows":[["Setting up","Three-way handshake: 1 round trip, then TLS","Nothing: just send","1 round trip including TLS 1.3; 0 when resuming"],["Delivery","Reliable: lost data is sent again","Best effort: datagrams can be lost or reordered","Reliable, per stream"],["One lost packet","Stalls everything behind it","Affects only that datagram","Stalls only its own stream"],["Typical use","Web over HTTP/1.1 and HTTP/2, databases, SSH","DNS queries, voice and video calls, games","HTTP/3"]]},{"cap":"HTTP versions","head":["","HTTP/1.1","HTTP/2","HTTP/3"],"rows":[["Runs over","TCP","TCP","QUIC, over UDP"],["Requests per connection","One at a time (keep-alive reuses the connection)","Many at once, multiplexed","Many at once, as independent streams"],["Message format","Text","Binary frames","Binary frames"],["Head-of-line blocking","A slow response holds up the next one","A lost TCP packet holds up every stream","Only the stream that lost data waits"]]}],"code":[{"t":"The latency model used by the first example and the quiz","tabs":[{"lang":"python","src":"def time_to_first_byte(rtt, server, dns=0, new_conn=True, tls=\"1.3\", http3=False):\n    \"\"\"Milliseconds until the first byte of the response arrives.\"\"\"\n    t = dns                                     # 0 when the name is already cached\n    if new_conn:\n        if http3:\n            t += rtt                            # QUIC sets up transport and TLS 1.3 together: 1 round trip\n        else:\n            t += rtt                            # the TCP three-way handshake\n            t += rtt if tls == \"1.3\" else 2 * rtt   # TLS 1.3 needs 1 round trip, TLS 1.2 needed 2\n    return t + rtt + server                     # the request goes out, the first byte comes back\n"},{"lang":"javascript","src":"function timeToFirstByte(rtt, server, { dns = 0, newConn = true, tls = \"1.3\", http3 = false } = {}) {\n  // milliseconds until the first byte of the response arrives\n  let t = dns;                                  // 0 when the name is already cached\n  if (newConn) {\n    if (http3) t += rtt;                        // QUIC sets up transport and TLS 1.3 together: 1 round trip\n    else {\n      t += rtt;                                 // the TCP three-way handshake\n      t += tls === \"1.3\" ? rtt : 2 * rtt;       // TLS 1.3 needs 1 round trip, TLS 1.2 needed 2\n    }\n  }\n  return t + rtt + server;                      // the request goes out, the first byte comes back\n}\n"}]},{"t":"Where the time goes: a latency budget for one request","tabs":[{"lang":"python","src":"far = dict(rtt=150, server=5, dns=60)         # a user on another continent\nprint(\"cold, TLS 1.2:\", time_to_first_byte(**far, tls=\"1.2\"), \"ms\")\nprint(\"cold, TLS 1.3:\", time_to_first_byte(**far), \"ms\")\nprint(\"cold, HTTP/3:\", time_to_first_byte(**far, http3=True), \"ms\")\nprint(\"warm connection:\", time_to_first_byte(150, 5, new_conn=False), \"ms\")\nprint(\"nearby user, cold:\", time_to_first_byte(10, 5, dns=20), \"ms\")\n","out":"cold, TLS 1.2: 665 ms\ncold, TLS 1.3: 515 ms\ncold, HTTP/3: 365 ms\nwarm connection: 155 ms\nnearby user, cold: 55 ms\n","notes":[[2,"60 ms of DNS, then four round trips of 150 ms (TCP, two for TLS 1.2, the request) and 5 ms of work: the server is under 1% of the wait."],[3,"TLS 1.3 saves a whole round trip: 150 ms for this user, for free."],[5,"A warm connection skips DNS and both handshakes: one round trip plus the server's 5 ms."],[6,"The same request from 10 ms away: distance, not code, made the far user wait ten times longer."]]},{"lang":"javascript","src":"const far = { dns: 60 };                      // a user on another continent: rtt 150 ms, server 5 ms\nconsole.log(\"cold, TLS 1.2:\", timeToFirstByte(150, 5, { ...far, tls: \"1.2\" }), \"ms\");\nconsole.log(\"cold, TLS 1.3:\", timeToFirstByte(150, 5, far), \"ms\");\nconsole.log(\"cold, HTTP/3:\", timeToFirstByte(150, 5, { ...far, http3: true }), \"ms\");\nconsole.log(\"warm connection:\", timeToFirstByte(150, 5, { newConn: false }), \"ms\");\nconsole.log(\"nearby user, cold:\", timeToFirstByte(10, 5, { dns: 20 }), \"ms\");\n","out":"cold, TLS 1.2: 665 ms\ncold, TLS 1.3: 515 ms\ncold, HTTP/3: 365 ms\nwarm connection: 155 ms\nnearby user, cold: 55 ms\n","notes":[[2,"60 ms of DNS, then four round trips of 150 ms (TCP, two for TLS 1.2, the request) and 5 ms of work: the server is under 1% of the wait."],[3,"TLS 1.3 saves a whole round trip: 150 ms for this user, for free."],[5,"A warm connection skips DNS and both handshakes: one round trip plus the server's 5 ms."],[6,"The same request from 10 ms away: distance, not code, made the far user wait ten times longer."]]}]},{"t":"What a URL and an HTTP request look like inside","tabs":[{"lang":"python","src":"from urllib.parse import urlsplit, parse_qs\n\nurl = urlsplit(\"https://shop.example.com:8443/pizzas/42?size=large&extra=olives\")\nprint(url.scheme, url.hostname, url.port, url.path, parse_qs(url.query)[\"size\"][0])\n\nraw = \"GET /pizzas/42 HTTP/1.1\\r\\nHost: shop.example.com\\r\\nAccept: application/json\\r\\nConnection: keep-alive\\r\\n\\r\\n\"\nhead, body = raw.split(\"\\r\\n\\r\\n\", 1)         # a blank line ends the headers\nrequest_line, *header_lines = head.split(\"\\r\\n\")\nmethod, path, version = request_line.split(\" \")\nheaders = {k.lower(): v for k, v in (line.split(\": \", 1) for line in header_lines)}\nprint(method, path, version, headers[\"host\"], headers[\"connection\"], len(body))\n","out":"https shop.example.com 8443 /pizzas/42 large\nGET /pizzas/42 HTTP/1.1 shop.example.com keep-alive 0\n","notes":[[4,"The scheme picks the protocol and default port (443 for https); here the port is given explicitly, and the query string carries the options."],[6,"HTTP/1.1 is plain text: a request line, header lines ending in \\r\\n, then an empty line. With HTTPS this text travels encrypted inside TLS."],[10,"Header names are case-insensitive, so code compares them in lower case."]]},{"lang":"javascript","src":"const url = new URL(\"https://shop.example.com:8443/pizzas/42?size=large&extra=olives\");\nconsole.log(url.protocol.slice(0, -1), url.hostname, url.port, url.pathname, url.searchParams.get(\"size\"));\n\nconst raw = \"GET /pizzas/42 HTTP/1.1\\r\\nHost: shop.example.com\\r\\nAccept: application/json\\r\\nConnection: keep-alive\\r\\n\\r\\n\";\nconst cut = raw.indexOf(\"\\r\\n\\r\\n\");          // a blank line ends the headers\nconst [requestLine, ...headerLines] = raw.slice(0, cut).split(\"\\r\\n\");\nconst body = raw.slice(cut + 4);\nconst [method, path, version] = requestLine.split(\" \");\nconst headers = Object.fromEntries(headerLines.map(line => { const i = line.indexOf(\": \"); return [line.slice(0, i).toLowerCase(), line.slice(i + 2)]; }));\nconsole.log(method, path, version, headers.host, headers.connection, body.length);\n","out":"https shop.example.com 8443 /pizzas/42 large\nGET /pizzas/42 HTTP/1.1 shop.example.com keep-alive 0\n","notes":[[2,"The scheme picks the protocol and default port (443 for https); here the port is given explicitly, and the query string carries the options."],[4,"HTTP/1.1 is plain text: a request line, header lines ending in \\r\\n, then an empty line. With HTTPS this text travels encrypted inside TLS."],[9,"Header names are case-insensitive, so code compares them in lower case."]]}]},{"t":"Latency numbers and the speed of light","tabs":[{"lang":"python","src":"LATENCY_NS = {                                # rough orders of magnitude, not measurements\n    \"memory reference\": 100,\n    \"SSD random read\": 16_000,\n    \"round trip in a data centre\": 500_000,\n    \"round trip between continents\": 150_000_000,\n}\nfor name, ns in LATENCY_NS.items():\n    print(f\"{name}: {ns / 1e6:g} ms = {ns // 100:,} memory references\")\n\ndef min_rtt_ms(km):                           # light in fibre covers about 200 km per millisecond\n    return 2 * km // 200\n\nprint(min_rtt_ms(1_000), min_rtt_ms(6_000), min_rtt_ms(20_000))\n","out":"memory reference: 0.0001 ms = 1 memory references\nSSD random read: 0.016 ms = 160 memory references\nround trip in a data centre: 0.5 ms = 5,000 memory references\nround trip between continents: 150 ms = 1,500,000 memory references\n10 60 200\n","notes":[[8,"One trip between continents costs as much time as 1.5 million memory references: keep chatty work close together."],[11,"Out and back: twice the distance, at about 200 km per millisecond in glass."],[13,"20,000 km is about the furthest two points on Earth can be, so no round trip by fibre can beat about 200 ms there."]]},{"lang":"javascript","src":"const LATENCY_NS = {                          // rough orders of magnitude, not measurements\n  \"memory reference\": 100,\n  \"SSD random read\": 16000,\n  \"round trip in a data centre\": 500000,\n  \"round trip between continents\": 150000000,\n};\nfor (const [name, ns] of Object.entries(LATENCY_NS)) {\n  console.log(`${name}: ${ns / 1e6} ms = ${Math.floor(ns / 100).toLocaleString(\"en-US\")} memory references`);\n}\n\nconst minRttMs = km => Math.floor((2 * km) / 200);   // light in fibre covers about 200 km per millisecond\n\nconsole.log(minRttMs(1000), minRttMs(6000), minRttMs(20000));\n","out":"memory reference: 0.0001 ms = 1 memory references\nSSD random read: 0.016 ms = 160 memory references\nround trip in a data centre: 0.5 ms = 5,000 memory references\nround trip between continents: 150 ms = 1,500,000 memory references\n10 60 200\n","notes":[[8,"One trip between continents costs as much time as 1.5 million memory references: keep chatty work close together."],[11,"Out and back: twice the distance, at about 200 km per millisecond in glass."],[13,"20,000 km is about the furthest two points on Earth can be, so no round trip by fibre can beat about 200 ms there."]]}]}],"ex":{"q":"A 2 MB page is served over HTTPS (TLS 1.3, a new connection) to a user with an 80 ms round-trip time and 20 Mbit/s of bandwidth; DNS takes 40 ms and the server 20 ms. Estimate the load time. Then which helps more: halving the round-trip time or doubling the bandwidth? And for a 20 KB page?","steps":["Time to the first byte: DNS 40 + TCP 80 + TLS 80 + request 80 + server 20 = 300 ms.","Transfer: 2 MB is 16 million bits; at 20 Mbit/s that's 0.8 s = 800 ms. Total about 1,100 ms (ignoring TCP slow start, which only adds time).","Halving the RTT saves 3 × 40 = 120 ms; doubling the bandwidth saves 400 ms. For a big page, bandwidth wins.","For 20 KB the transfer is only 8 ms, so the round trips are almost everything: halving the RTT saves 120 ms of 308, doubling the bandwidth saves 4 ms. Most web requests are small, so latency usually rules."],"code":{"t":"Latency or bandwidth: which one matters?","tabs":[{"lang":"python","src":"def page_load_ms(size_bytes, rtt, mbps, dns=40, server=20):\n    first_byte = dns + rtt + rtt + rtt + server   # DNS, TCP, TLS 1.3, then the request\n    transfer = size_bytes * 8 / (mbps * 1000)     # bits / (bits per millisecond); ignores TCP slow start\n    return round(first_byte + transfer)\n\nfor size in (2_000_000, 20_000):\n    print(size, page_load_ms(size, 80, 20), page_load_ms(size, 40, 20), page_load_ms(size, 80, 40))\n","out":"2000000 1100 980 700\n20000 308 188 304\n"},{"lang":"javascript","src":"function pageLoadMs(sizeBytes, rtt, mbps, dns = 40, server = 20) {\n  const firstByte = dns + rtt + rtt + rtt + server;   // DNS, TCP, TLS 1.3, then the request\n  const transfer = (sizeBytes * 8) / (mbps * 1000);   // bits / (bits per millisecond); ignores TCP slow start\n  return Math.round(firstByte + transfer);\n}\n\nfor (const size of [2000000, 20000]) console.log(size, pageLoadMs(size, 80, 20), pageLoadMs(size, 40, 20), pageLoadMs(size, 80, 40));\n","out":"2000000 1100 980 700\n20000 308 188 304\n"}]},"a":"About 1,100 ms for the 2 MB page: halving the RTT gives 980 ms, doubling the bandwidth 700 ms. For the 20 KB page, 308 ms falls to 188 ms with half the RTT but only to 304 ms with double the bandwidth."},"fade":{"q":"A resolver caches DNS answers for their TTL. Finish `resolve(name, now)` so that a fresh cached answer is returned without asking upstream, and count the upstream queries for a sequence of lookups.","steps":["Each answer comes with a TTL in seconds; the resolver may reuse it until that much time has passed.",{"ask":"What should the cache store for each name?","a":"The IP address and the time it expires (now + TTL), so a later lookup can check freshness with one comparison."},{"ask":"When is a cached answer still fresh?","a":"While its expiry time is later than now. At or after the expiry, ask upstream again and store the new expiry."},{"ask":"What does a short TTL buy and cost?","a":"A short TTL lets a change (moving to a new server) reach users quickly, but every resolver asks again more often: more upstream queries and slower cold lookups. Lookups themselves are O(1) time with O(names) memory."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class DnsCache:                               # a resolver's cache: answers live for their TTL\n    def __init__(self, upstream):\n        self.upstream, self.entries, self.queries = upstream, {}, 0\n\n    def resolve(self, name, now):\n        ...                                   # TODO: return a fresh cached answer, or ask upstream and remember the expiry\n"},{"lang":"javascript","src":"class DnsCache {                              // a resolver's cache: answers live for their TTL\n  constructor(upstream) { this.upstream = upstream; this.entries = new Map(); this.queries = 0; }\n  resolve(name, now) {\n    // TODO: return a fresh cached answer, or ask upstream and remember the expiry\n  }\n}\n"}]},"solution":{"t":"Solution: store the address with its expiry time","tabs":[{"lang":"python","src":"class DnsCache:                               # a resolver's cache: answers live for their TTL\n    def __init__(self, upstream):\n        self.upstream, self.entries, self.queries = upstream, {}, 0\n\n    def resolve(self, name, now):\n        hit = self.entries.get(name)\n        if hit and hit[1] > now:\n            return hit[0]                     # still fresh: no upstream query\n        ip, ttl = self.upstream[name]\n        self.queries += 1\n        self.entries[name] = (ip, now + ttl)  # remember when it expires\n        return ip\n\nupstream = {\"shop.example.com\": (\"203.0.113.7\", 300), \"cdn.example.com\": (\"198.51.100.4\", 60)}\ncache = DnsCache(upstream)\nlookups = [(0, \"shop\"), (10, \"cdn\"), (50, \"shop\"), (75, \"cdn\"), (200, \"cdn\"), (299, \"shop\"), (300, \"shop\"), (360, \"cdn\")]\nfor now, short in lookups:\n    cache.resolve(short + \".example.com\", now)\nprint(len(lookups), \"lookups,\", cache.queries, \"upstream queries\")\n","out":"8 lookups, 6 upstream queries"},{"lang":"javascript","src":"class DnsCache {                              // a resolver's cache: answers live for their TTL\n  constructor(upstream) { this.upstream = upstream; this.entries = new Map(); this.queries = 0; }\n  resolve(name, now) {\n    const hit = this.entries.get(name);\n    if (hit && hit[1] > now) return hit[0];   // still fresh: no upstream query\n    const [ip, ttl] = this.upstream[name];\n    this.queries++;\n    this.entries.set(name, [ip, now + ttl]);  // remember when it expires\n    return ip;\n  }\n}\n\nconst upstream = { \"shop.example.com\": [\"203.0.113.7\", 300], \"cdn.example.com\": [\"198.51.100.4\", 60] };\nconst cache = new DnsCache(upstream);\nconst lookups = [[0, \"shop\"], [10, \"cdn\"], [50, \"shop\"], [75, \"cdn\"], [200, \"cdn\"], [299, \"shop\"], [300, \"shop\"], [360, \"cdn\"]];\nfor (const [now, short] of lookups) cache.resolve(`${short}.example.com`, now);\nconsole.log(lookups.length, \"lookups,\", cache.queries, \"upstream queries\");\n","out":"8 lookups, 6 upstream queries"}]}},"traps":[["“More bandwidth makes every page faster.”","Bandwidth only shortens the transfer. Small requests are dominated by round trips, which bandwidth doesn't change: for a 20 KB page, doubling bandwidth saved 4 ms while halving the RTT saved 120 ms."],["“A faster server fixes slow first loads.”","For a distant user the server's 5 ms is under 1% of the wait. Cut round trips instead: reuse connections, use TLS 1.3 or HTTP/3, and serve from nearer the user."],["“UDP is just a worse TCP.”","UDP skips the handshake and never stalls behind a lost packet, which is what real-time voice, video and games want. QUIC builds reliability on top of UDP for HTTP/3."],["“HTTPS hides which site you're visiting.”","TLS encrypts the path, headers and body, but the hostname can still show in the DNS lookup and in the TLS handshake's server name (unless encrypted DNS and Encrypted Client Hello are used)."],["“A DNS change takes effect straight away.”","Resolvers keep cached answers until their TTL runs out, so some users reach the old address for that long. Lower the TTL well before a planned move."],["“Keep-alive and HTTP/2 do the same thing.”","Keep-alive reuses a connection for one request after another; HTTP/2 multiplexes many requests at once over one connection, so a slow response doesn't hold up the others at the HTTP level."]],"disc":[["Why does HTTP/3 run over UDP instead of TCP?","QUIC builds its own reliability and congestion control on top of UDP. That lets it set up transport and TLS 1.3 in a single round trip (zero when resuming), keep one lost packet from stalling unrelated streams, and keep a connection alive when a phone switches from Wi-Fi to mobile data. And because it runs in ordinary programs rather than in the operating system's kernel, it can be improved without waiting for every operating system to change."],["What happens when you type a URL and press Enter?","The browser parses the URL, finds the IP address for the host name (from its cache, the operating system's, or a DNS resolver), opens a TCP connection and sets up TLS (or does both in one go with QUIC), checks the server's certificate, and sends an HTTP request. The server, often behind a load balancer and maybe a CDN, returns a response with a status code, headers and HTML, and the browser parses it and fetches the images, styles and scripts it refers to, reusing connections where it can."]],"teach":{"prompt":"Explain to a junior colleague what happens between pressing Enter on a URL and the first byte of the page arriving, and where the time goes.","rubric":["DNS turns the host name into an IP address, often from a cache","TCP handshake, then TLS handshake, then the request: each at least one round trip","Round-trip time is limited by distance (about 200 km per millisecond in fibre)","Reused connections, TLS 1.3 and HTTP/3 cut round trips","Bandwidth matters for big transfers, latency for small ones"],"model":"First the browser needs an IP address for the host name, so it asks DNS, which is usually answered from a cache and otherwise walks from a root server to the domain's own name servers. Then it opens a TCP connection, which costs one round trip for the handshake, and sets up TLS on top, one more round trip with TLS 1.3, during which the server proves who it is with a certificate. Only then does the HTTP request go out, and the first byte of the response comes back after one more round trip plus the server's own time. A round trip can't beat the speed of light in fibre, about 200 km per millisecond, so for a user far away those three or four trips dominate the wait. Reusing connections, TLS 1.3, HTTP/3 and servers close to the user cut the trips, and bandwidth only matters once the response is large."},"qa":[["What does DNS do?","It turns a host name into an IP address; resolvers cache each answer for its TTL."],["How many round trips does a new HTTPS connection with TLS 1.3 take before the first byte?","Three: TCP handshake, TLS handshake, then the request (plus any DNS lookup)."],["When would you choose UDP over TCP?","When late data is useless, as in voice, video and games, or for small queries such as DNS."],["What's the difference between latency and bandwidth?","Latency is the time for one trip; bandwidth is how much data fits through per second."],["How fast does light travel in optical fibre?","About 200 km per millisecond, so 6,000 km away means a round trip of at least about 60 ms."],["What does HTTP/2 add over HTTP/1.1?","Many requests multiplexed over one connection, in binary frames."]],"quiz":[{"q":"What does this print? (`time_to_first_byte` / `timeToFirstByte` is this module's latency model.)","snip":{"t":"Three requests, three budgets","tabs":[{"lang":"python","src":"print(time_to_first_byte(100, 10, dns=30),\n      time_to_first_byte(100, 10, new_conn=False),\n      time_to_first_byte(100, 10, dns=30, http3=True))\n"},{"lang":"javascript","src":"console.log(timeToFirstByte(100, 10, { dns: 30 }),\n  timeToFirstByte(100, 10, { newConn: false }),\n  timeToFirstByte(100, 10, { dns: 30, http3: true }));\n"}]},"o":["340 110 240","440 110 240","340 210 240","340 110 340"],"a":0,"e":"A cold TLS 1.3 request is DNS 30 + TCP 100 + TLS 100 + request 100 + server 10 = 340. A warm connection is just 100 + 10. HTTP/3 merges the two handshakes into one round trip: 30 + 100 + 110 = 240."},{"q":"What does this print?","snip":{"t":"Reading a raw request","tabs":[{"lang":"python","src":"raw = \"POST /orders HTTP/1.1\\r\\nHost: a.example\\r\\nContent-Length: 10\\r\\n\\r\\nsize=large\"\nhead, body = raw.split(\"\\r\\n\\r\\n\", 1)\nrequest_line, *lines = head.split(\"\\r\\n\")\nheaders = dict(line.split(\": \", 1) for line in lines)\nprint(*request_line.split(\" \")[:2], headers[\"Content-Length\"], len(body))\n"},{"lang":"javascript","src":"const raw = \"POST /orders HTTP/1.1\\r\\nHost: a.example\\r\\nContent-Length: 10\\r\\n\\r\\nsize=large\";\nconst cut = raw.indexOf(\"\\r\\n\\r\\n\"), body = raw.slice(cut + 4);\nconst [requestLine, ...lines] = raw.slice(0, cut).split(\"\\r\\n\");\nconst headers = Object.fromEntries(lines.map(line => line.split(\": \")));\nconsole.log(...requestLine.split(\" \").slice(0, 2), headers[\"Content-Length\"], body.length);\n"}]},"o":["POST /orders 10 10","POST /orders 10 0","GET /orders 10 10","POST orders 10 10"],"a":0,"e":"The request line gives the method and the path. Everything after the empty line is the body, “size=large”, which is 10 characters, matching the Content-Length header."},{"q":"Which transport suits a live video call best?","o":["UDP (or QUIC on top of it): a frame that arrives late is useless, so waiting to resend it in order only adds delay","TCP, because it guarantees that every packet arrives","HTTP/1.1, because it's the web's protocol","DNS, because it's the fastest lookup"],"a":0,"e":"Real-time media would rather skip a lost frame than stall the whole stream, which is TCP's behaviour. HTTP runs on top of a transport, and DNS finds addresses rather than carrying video."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["A new HTTPS connection over TCP with TLS 1.3 needs about three round trips before the first byte (TCP, TLS, then the request)","Reusing a connection skips the TCP and TLS handshakes","More bandwidth lowers the round-trip time","DNS answers are never cached","HTTP/2 needs UDP"],"a":[0,1],"e":"The handshakes and the request each cost a round trip, and keep-alive or HTTP/2 reuse an open connection. Bandwidth doesn't change the time for one trip, DNS answers are cached for their TTL, and HTTP/2 runs over TCP (HTTP/3 is the one over QUIC on UDP)."},{"q":"Judge each statement.","t":"yn","s":[["Light in fibre sets a floor on latency: 6,000 km away, a round trip can't take much less than 60 ms.",true],["HTTPS encrypts the request's path and headers as well as its body.",true],["A DNS record's TTL says how long resolvers may keep the answer cached.",true],["TLS 1.3 needs two round trips to set up a new connection.",false]],"e":"12,000 km there and back at about 200 km per millisecond is 60 ms. TLS wraps the whole HTTP message. The TTL is exactly the caching time. And TLS 1.3 needs one round trip (TLS 1.2 needed two)."},{"q":"Put the steps of a first HTTPS request in order.","t":"ord","items":["Resolve the host name to an IP address with DNS","Open a TCP connection with the three-way handshake","Set up TLS: agree keys and check the server's certificate","Send the HTTP request and read the response"],"e":"You need the address to connect, the connection to run TLS over, and TLS before any encrypted request can go out."},{"q":"Complete the Python DNS cache lookup.","t":"drop","lang":"python","code":"def resolve(cache, upstream, name, now):\n    hit = cache.get(name)\n    if hit and {{0}}:\n        return hit[0]\n    ip, ttl = upstream[name]\n    cache[name] = (ip, {{1}})\n    return ip\n","blanks":[{"o":["hit[1] > now","hit[1] < now","hit[1] == now","now > 0"],"a":0},{"o":["now + ttl","ttl","now - ttl","now"],"a":0}],"e":"An answer is fresh while its stored expiry time is still in the future, and the expiry to store is the current time plus the TTL."},{"q":"Match each protocol to its job.","t":"match","pairs":[["Turns a host name into an IP address","DNS"],["A reliable, ordered byte stream that starts with a handshake","TCP"],["Encrypts traffic and proves the server's identity","TLS"],["Methods, paths, headers and status codes","HTTP"]],"extra":["SMTP"],"e":"Each layer does one job on top of the one below. SMTP sends email, which isn't part of loading a web page."}],"probs":[["Exercise · Time each step with curl","https://curl.se/docs/manpage.html","","curl -w with time_namelookup, time_connect, time_appconnect and time_starttransfer, against a site near you and one far away; explain each gap"],["Exercise · Watch a TTL count down","https://www.cloudflare.com/learning/dns/what-is-dns/","","look a name up twice with dig or nslookup, a minute apart, and compare the TTLs; then read how resolvers walk from the root"],["Exercise · Your browser's network panel","https://developer.chrome.com/docs/devtools/network","","load a page cold and then warm; compare the DNS, connection, TLS and waiting times for the first request"],["Reference · Latency numbers, year by year","https://colin-scott.github.io/personal_website/research/interactive_latency.html","","slide the year and watch which numbers change (disks, networks) and which don't (the speed of light)"]],"src":[["RFC 9110: HTTP Semantics","https://www.rfc-editor.org/rfc/rfc9110"],["RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3","https://www.rfc-editor.org/rfc/rfc8446"],["RFC 9000: QUIC, a UDP-based multiplexed and secure transport","https://www.rfc-editor.org/rfc/rfc9000"],["MDN: An overview of HTTP","https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview"],["Colin Scott: Latency numbers every programmer should know (interactive)","https://colin-scott.github.io/personal_website/research/interactive_latency.html"]]},{"id":"m02","d":"d2","t":"Scaling up and out: stateless services and the bottleneck","min":90,"hook":"When traffic grows you can buy a bigger machine or add more machines. Adding machines only works if any server can answer any request, which means moving state out of the servers, and it only helps the tier that's actually the limit. These three ideas decide most scaling answers in interviews and in real systems.","pre":{"q":"One app server handles 500 requests per second flat out. Peak traffic is 1,800 requests per second, and every request makes one query to a database that tops out at 2,000 queries per second. How many app servers would you run, and what breaks next?","a":"Four servers could just carry 1,800 requests per second at 90% busy, but you'd run six to keep each under about 70% busy at the peak, and seven if the peak must survive one server failing. The database is then 90% busy at the peak: it's the next bottleneck, and no number of app servers lifts its 2,000 ceiling."},"kid":{"t":"Luigi's gets busy","x":"Luigi's pizza shop is getting busy. First he buys a bigger oven, but the biggest oven in the catalogue is very expensive, and when it breaks, nobody gets pizza. So he hires three more cooks, each with an ordinary oven. At first each cook remembers their own customers' orders, so when Tara comes back to add a drink, she has to find the same cook. Luigi pins every order to one big board that all the cooks can read, so any cook can help anyone. Still, the queue is long: everyone pays at the single till. Ben says, “More cooks won't help now. We need a second till.”","map":[["Buying a bigger oven","Vertical scaling: one bigger machine, with a ceiling and a single point of failure"],["More cooks, each with an ordinary oven","Horizontal scaling: more servers sharing the work"],["Each cook remembering their own customers","Session state in one server's memory, which forces sticky sessions"],["One order board every cook can read","A shared session store, so the servers are stateless"],["The single till everyone queues at","The bottleneck: the tier with the least capacity caps the whole system"]],"brk":"Real servers don't slow down because they're tired: they slow down because requests queue as they near 100% busy. And the board isn't free: every cook reading it is a network call to a shared store, which itself has to scale and stay up."},"keys":["**Vertical scaling (scaling up)**: move to a bigger machine with more CPU, more memory or faster disks. No code changes and no new kinds of failure, so it's often the right first step. But there's a largest machine you can buy or rent, an upgrade can mean downtime, and one machine is still a single point of failure.","**Horizontal scaling (scaling out)**: add more machines and spread the requests across them with a load balancer (module 4). For work that splits cleanly, capacity grows roughly in step with the number of servers, and losing one server loses only part of the capacity. The price is more moving parts, and the rule in the next point.","**Stateless services**: a server keeps nothing about a user between requests, so any server can answer any request, and servers can be added, removed or replaced at any time. The state still exists: it moves to a shared store (a database, an in-memory store such as Redis, object storage for files) or into a signed token that the client sends back.","**Sticky sessions**: the load balancer sends each user back to the same server, so state can stay in that server's memory. It works as a stopgap, but the load gets uneven, a server can't be taken out without logging its users out, and a crash loses every session on it.","**The bottleneck sets the pace**: every request passes through every tier, so the system's throughput is the smallest tier capacity (servers × requests per second per server). Scaling any other tier adds cost, not throughput. Find the bottleneck, fix it, then look again: it moves.","**Amdahl's law**: if a share p of the work can be spread over n machines, the speed-up is 1 / ((1 − p) + p/n). The serial part caps it: with 90% of the work parallel, the speed-up can never reach 10×, and 10 machines give about 5.3×.","**Little's law**: requests in flight = arrival rate × time each one spends in the system (L = λW). 1,000 requests a second at 200 ms each means about 200 in flight, and each needs a worker thread or connection somewhere. When a dependency slows down, W grows and so does L, at the same traffic.","**Headroom and N+1**: response time climbs steeply as a server nears 100% busy, because requests queue. Size for the peak, not the average, keep each server at about 60–70% busy at the peak (a rule of thumb), and add one spare (N+1) so the peak still fits when any one server fails."],"dia":[{"type":"tiers","cap":"A stateless web tier: any app server can answer any request","tiers":[["Clients",["Phone app","Browser"]],["Load balancer",["Spreads requests, checks health"],"HTTPS"],["App servers",["app 1","app 2","app 3","more at the peak"],"any server will do"],["Shared state",["Session store (Redis)","Database","Object storage for files"],"reads and writes"]],"note":"The app servers keep nothing between requests, so the load balancer can send each request anywhere, and servers can be added or replaced freely. The shared tier holds all the state, so it now has to scale and stay up."},{"type":"cells","cap":"Capacity in requests per second as app servers are added (500 each, one database at 2,000)","idx":false,"rows":[{"label":"app servers","vals":[2,3,4,5,8]},{"label":"app tier","vals":[1000,1500,2000,2500,4000],"hl":[0,1,2]},{"label":"database","vals":[2000,2000,2000,2000,2000],"hl":[2,3,4]},{"label":"system","vals":[1000,1500,2000,2000,2000],"ok":[0,1,2,3,4]}],"note":"Up to 4 servers the app tier sets the pace; at 4 the two tiers tie, and from then on the single database does. Servers 5 to 8 add cost but no throughput: the database is what to scale next, for example with a cache (module 5) or read replicas."}],"cmp":[{"cap":"Scaling up or scaling out","head":["","Vertical (scale up)","Horizontal (scale out)"],"rows":[["What changes","A bigger machine","More machines behind a load balancer"],["Code changes","Usually none","Servers must be stateless"],["Limit","The largest machine available","The next bottleneck, often the database"],["When one machine fails","Everything is down until it's back or replaced","The others carry on with less capacity"],["Good first choice for","Databases and apps that are hard to split","Stateless web and API servers"]]},{"cap":"Where session state can live","head":["","Server memory (sticky sessions)","Shared store (such as Redis)","Signed token (in a cookie)"],"rows":[["Any server can answer","No: only the server that has it","Yes","Yes"],["Survives a server restart","No","Yes, if the store stays up","Yes"],["Log a user out straight away","Yes, on that server","Yes: delete the session","No: it's valid until it expires (unless you keep a deny-list)"],["Cost per request","None","A network round trip to the store","Checking a signature; the token travels with every request"]]}],"code":[{"t":"Two capacity helpers used by the examples and the quiz","tabs":[{"lang":"python","src":"import math\n\ndef servers_needed(peak_rps, per_server_rps, max_busy_pct=70):\n    \"\"\"Fewest servers that carry the peak with each at most max_busy_pct busy.\"\"\"\n    return math.ceil(peak_rps * 100 / (per_server_rps * max_busy_pct))\n\ndef bottleneck(tiers):\n    \"\"\"Each tier is (name, servers, requests per second per server); the smallest capacity sets the pace.\"\"\"\n    name, count, per_server = min(tiers, key=lambda t: t[1] * t[2])\n    return name, count * per_server\n"},{"lang":"javascript","src":"function serversNeeded(peakRps, perServerRps, maxBusyPct = 70) {\n  // fewest servers that carry the peak with each at most maxBusyPct busy\n  return Math.ceil((peakRps * 100) / (perServerRps * maxBusyPct));\n}\n\nfunction bottleneck(tiers) {\n  // each tier is [name, servers, requests per second per server]; the smallest capacity sets the pace\n  let best = tiers[0];\n  for (const t of tiers) if (t[1] * t[2] < best[1] * best[2]) best = t;\n  return [best[0], best[1] * best[2]];\n}\n"}]},{"t":"Scaling out until the bottleneck moves","tabs":[{"lang":"python","src":"peak = 1_800                                  # requests per second at the busiest minute\napp = servers_needed(peak, 500)               # one app server manages 500 req/s flat out\nprint(\"app servers for the peak:\", app)\n\nfor count in (2, 3, 5, 8):\n    tiers = [(\"load balancer\", 1, 20_000), (\"app\", count, 500), (\"database\", 1, 2_000)]\n    name, cap = bottleneck(tiers)\n    print(count, \"app servers ->\", cap, \"req/s, limited by the\", name)\nprint(f\"database busy at peak: {peak * 100 // 2_000}%\")\n","out":"app servers for the peak: 6\n2 app servers -> 1000 req/s, limited by the app\n3 app servers -> 1500 req/s, limited by the app\n5 app servers -> 2000 req/s, limited by the database\n8 app servers -> 2000 req/s, limited by the database\ndatabase busy at peak: 90%\n","notes":[[2,"1,800 ÷ (500 × 70%) = 5.1, rounded up to 6, so each server stays at most 70% busy at the peak."],[6,"Each tier is (name, servers, requests per second per server). The load balancer is nowhere near its limit."],[8,"With 2 or 3 servers the app tier is the limit; with 5 or 8 it's the database, so the extra servers buy nothing."],[9,"At the peak the single database is 90% busy: it, not the app tier, is what to scale next."]]},{"lang":"javascript","src":"const peak = 1800;                            // requests per second at the busiest minute\nconst app = serversNeeded(peak, 500);         // one app server manages 500 req/s flat out\nconsole.log(\"app servers for the peak:\", app);\n\nfor (const count of [2, 3, 5, 8]) {\n  const tiers = [[\"load balancer\", 1, 20000], [\"app\", count, 500], [\"data
