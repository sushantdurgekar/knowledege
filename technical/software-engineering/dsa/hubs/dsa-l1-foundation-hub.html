size / len(self.b) > 0.75:\n            self._resize()\n\n    def get(self, key, default=None):        # O(1) average\n        for k, v in self._bucket(key):\n            if k == key:\n                return v\n        return default\n\n    def delete(self, key):\n        bucket = self._bucket(key)\n        for i, (k, _) in enumerate(bucket):\n            if k == key:\n                bucket.pop(i)\n                self.size -= 1\n                return True\n        return False\n\n    def _resize(self):                       # O(n), but rare\n        old = [pair for bucket in self.b for pair in bucket]\n        self.b, self.size = [[] for _ in range(len(self.b) * 2)], 0\n        for k, v in old:\n            self.put(k, v)\n\nfrom collections import Counter\nwords = \"the cat and the hat and the bat\".split()\nm = HashMap()\nfor w in words:\n    m.put(w, m.get(w, 0) + 1)\nassert all(m.get(w) == c for w, c in Counter(words).items())\nfor i in range(1000):\n    m.put(i, i * i)\nassert m.get(999) == 998001 and len(m.b) >= 1000 / 0.75\nassert m.delete(\"cat\") and m.get(\"cat\") is None\nprint(\"hash map OK:\", m.get(\"the\"), \"x the\")\n","out":"hash map OK: 3 x the"},{"lang":"javascript","src":"class HashMap {\n  constructor(buckets = 8) { this.b = Array.from({ length: buckets }, () => []); this.size = 0; }\n  hash(key) {                                  // a simple string hash (31 * h + code)\n    const s = String(key); let h = 0;\n    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;\n    return h;\n  }\n  bucket(key) { return this.b[this.hash(key) % this.b.length]; }\n  put(key, val) {                              // O(1) average\n    const bucket = this.bucket(key);\n    for (const pair of bucket) if (pair[0] === key) { pair[1] = val; return; }\n    bucket.push([key, val]); this.size++;\n    if (this.size / this.b.length > 0.75) this.resize();\n  }\n  get(key, dflt = undefined) {                 // O(1) average\n    for (const [k, v] of this.bucket(key)) if (k === key) return v;\n    return dflt;\n  }\n  delete(key) {\n    const bucket = this.bucket(key);\n    const i = bucket.findIndex(p => p[0] === key);\n    if (i < 0) return false;\n    bucket.splice(i, 1); this.size--; return true;\n  }\n  resize() {                                   // O(n), but rare\n    const old = this.b.flat();\n    this.b = Array.from({ length: this.b.length * 2 }, () => []); this.size = 0;\n    for (const [k, v] of old) this.put(k, v);\n  }\n}\n\nconst words = \"the cat and the hat and the bat\".split(\" \");\nconst m = new HashMap();\nfor (const w of words) m.put(w, m.get(w, 0) + 1);\nconst ref = new Map();\nfor (const w of words) ref.set(w, (ref.get(w) ?? 0) + 1);\nfor (const [w, c] of ref) if (m.get(w) !== c) throw new Error(\"count \" + w);\nfor (let i = 0; i < 1000; i++) m.put(i, i * i);\nif (m.get(999) !== 998001 || m.b.length < 1000 / 0.75) throw new Error(\"resize\");\nif (!m.delete(\"cat\") || m.get(\"cat\") !== undefined) throw new Error(\"delete\");\nconsole.log(\"hash map OK:\", m.get(\"the\"), \"x the\");\n","out":"hash map OK: 3 x the"}]},"breakit":["Make the hash function return 0 for every key and time 10,000 inserts: every bucket operation becomes O(n).","Remove the resize and watch the buckets get long."]},{"id":"capstone","capstone":true,"t":"Mini DS library + the 60-problem milestone","min":900,"mods":["m01","m02","m03","m05","m06","m08"],"goal":"Package your five lab structures into a small library in **both** Python and JavaScript, with tests and a Big-O table, and log 40 easy + 20 medium problems from the modules. This is your L1 evidence.","deliver":["A repo with `python/` and `js/` folders: DynArray, LinkedList, Stack, RingQueue, HashMap.","Tests: pytest for Python, `node:test` for JavaScript, covering empty, one-item and resize cases.","README with a Big-O table (time and space for every operation) and two design decisions.","A problems log (problem, pattern, time, space, what tripped you up) with 40 easy + 20 medium."],"rubric":["All tests pass in both languages; edge cases (empty, one item, full) are covered.","Every public method has a correct Big-O in the README.","Resizing is geometric (×2) and the amortised cost is explained.","The problems log names a pattern for every problem.","Code is readable: clear names, no copy-pasted blocks."],"steps":["Create the repo and copy in your lab solutions; give both languages the same API names.","Write the tests first for anything not tested yet (pop on empty, wrap-around, resize).","Fill in the README Big-O table and the two design decisions (e.g. why ×2, why chaining).","Work through each module's practice problems; log each one the same day.","Ask for a review (a friend or Claude) and fix what it finds."],"stretch":["Add a `MinStack` (push, pop, min all O(1)) and a `Deque` on a ring buffer.","Make the hash map iterable in insertion order, like Python's dict and JavaScript's Map.","Benchmark your HashMap against the built-in and explain the gap."]}],"interview":[{"c":"Complexity","q":"What is Big-O and why do interviewers care about it?","a":"Big-O describes how an algorithm's running time or memory grows as the input grows, ignoring constant factors and smaller terms. Interviewers care because it predicts whether a solution survives real input sizes: an O(n²) solution that's instant on 100 items can take hours on a million. I give time and space for every solution and say which part dominates.","f":["What's the difference between O, Θ and Ω?","What's the complexity of appending to a Python list?"]},{"c":"Complexity","q":"Explain amortised O(1) with the dynamic array example.","a":"A dynamic array grows its capacity by a constant factor (say ×2) when it's full. Most appends just write into a free slot (O(1)); a few trigger a copy of everything (O(n)). With doubling, the total copying over n appends is less than 2n (any constant factor gives a similar bound), so the average cost per append is constant. That's amortised O(1): a guarantee about the average over a sequence, not about every single call.","f":["What happens if you grow by a fixed amount instead?"]},{"c":"Complexity","q":"How do you use the input constraints to choose an approach?","a":"I estimate the work allowed: roughly 10⁸ simple operations per second in a compiled language, far fewer in Python. With n up to 10⁵, O(n²) is about 10¹⁰ operations, too slow, so I aim for O(n log n) or O(n). With n up to 20, even O(2ⁿ) is fine. The constraint often tells you the intended pattern."},{"c":"Arrays & hashing","q":"Walk me through Two Sum and its trade-offs.","a":"Brute force checks every pair: O(n²) time, O(1) space. Better: one pass with a hash map from value to index. For each number I check whether target − number is already in the map; if so I return both indices, otherwise I store the number. That's O(n) time and O(n) space. If the array were sorted, two pointers would give O(n) time and O(1) space.","f":["What if there can be several valid pairs?","What if the array is too big for memory?"]},{"c":"Arrays & hashing","q":"When would you use a hash set versus sorting to find duplicates?","a":"A hash set finds duplicates in one pass: O(n) time but O(n) extra memory. Sorting first costs O(n log n) time, and then duplicates sit next to each other; an in-place sort such as heapsort needs only O(1) extra memory (Python's and JavaScript's built-in sorts can use up to O(n), still usually less than a set). If memory is tight, or the data must end up sorted anyway, sorting wins; otherwise the set is faster and simpler."},{"c":"Arrays & hashing","q":"What is a prefix sum and when do you use one?","a":"prefix[i] holds the sum of the first i elements, built in one O(n) pass. The sum of any range i..j is then prefix[j+1] − prefix[i] in O(1). I use it when there are many range-sum queries, or combined with a hash map to count subarrays that add up to k."},{"c":"Pointers & windows","q":"How do you recognise a sliding-window problem?","a":"The question asks about a contiguous subarray or substring (longest, shortest, number of) with a condition that can be updated as you add one element on the right and remove one on the left. Fixed windows move both ends together; variable windows grow the right end and shrink the left end until the condition holds again. Each element enters and leaves once, so it's O(n).","f":["Why doesn't sliding window work for 'subarray sum equals k' with negative numbers?"]},{"c":"Pointers & windows","q":"Two pointers versus a hash map: how do you choose?","a":"Two pointers need structure, usually sorted data, so moving a pointer has a predictable effect on the sum or condition. They use O(1) space. A hash map works on unsorted data and gives O(n) time but O(n) space. If the input is sorted or I can afford to sort, two pointers; if I must keep original indices or can't sort, a hash map."},{"c":"Stacks, queues & lists","q":"Give two problems where a stack is the natural tool, and why.","a":"Balanced brackets, because the most recent opening bracket must close first; and 'next greater element', where a monotonic stack keeps the items still waiting for a bigger value. Both rely on last in, first out, and both run in O(n) because every item is pushed and popped at most once."},{"c":"Stacks, queues & lists","q":"Why is list.pop(0) a bad queue in Python, and what do you use instead?","a":"pop(0) removes the first element and shifts every other element left, which is O(n), so a loop of n dequeues becomes O(n²). collections.deque gives O(1) appends and pops at both ends. In JavaScript, shift() has the same problem on large arrays, so I keep a head index or use a ring buffer."},{"c":"Stacks, queues & lists","q":"How do you reverse a linked list, and what can go wrong?","a":"Walk the list with three references: prev, current and next. Save next, point current.next back to prev, then move prev and current forward. It's O(n) time and O(1) space. The classic bug is overwriting current.next before saving it, which loses the rest of the list."},{"c":"Stacks, queues & lists","q":"How does Floyd's cycle detection work?","a":"A slow pointer moves one step and a fast pointer two. If there's no cycle, fast reaches the end. If there is a cycle, fast enters it first and gains one step per move on slow, so they must meet inside the cycle. O(n) time, O(1) space, versus O(n) space for a visited set."},{"c":"Recursion & sorting","q":"What happens in memory when a recursive function runs?","a":"Each call gets a stack frame with its own arguments and local variables, pushed on the call stack. Frames unwind as calls return. Recursion depth therefore costs O(depth) space, and a missing or unreachable base case overflows the stack (Python's default recursion limit is 1,000)."},{"c":"Recursion & sorting","q":"Merge sort or quick sort: which would you pick and why?","a":"Merge sort guarantees O(n log n) and is stable, but needs O(n) extra space. Quick sort is usually faster in practice and sorts in place (O(log n) stack on average), but has an O(n²) worst case; random or median-of-three pivots make that very unlikely, not impossible. In real code I use the language's built-in sort: stable in both languages, and O(n log n) in CPython and V8 (the JavaScript spec doesn't promise a complexity)."},{"c":"Recursion & sorting","q":"What is 'binary search on the answer'?","a":"When the question asks for the smallest (or largest) value that satisfies a condition, and the condition is monotonic (if speed 5 works, speed 6 also works), I binary search over possible answers instead of over an array. Each step runs a check, often O(n), so the total is O(n log range). Koko Eating Bananas is the classic."},{"c":"Interview technique","q":"You're stuck on a problem in an interview. What do you do?","a":"I say what I know out loud: restate the problem, work a small example, and give the brute force with its complexity. Then I look for the repeated work and ask which tool removes it: a hash map, two pointers, a stack, sorting or binary search. Interviewers often give hints when they can see the reasoning."},{"c":"Behavioural (STAR)","q":"Tell me about a time you improved the performance of some code.","a":"Use STAR. Situation: what was slow and who noticed. Task: your goal (for example, under one second). Action: how you measured it, found the O(n²) part (a nested loop or a list used for lookups) and replaced it (hash map, sorting, a better algorithm), with tests. Result: the before/after numbers. If you're new, use a lab from this hub, such as the stopwatch lab."}],"cheat":[{"t":"Big-O at a glance","items":["O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ) < O(n!)","Sequential steps **add**; nested loops **multiply**; halving gives **log n**","Drop constants and lower terms: 3n² + 5n → O(n²)","Budget: ~10⁸ simple ops/s compiled, ~10⁶–10⁷ in Python","n ≤ 20 → 2ⁿ ok · n ≤ 5,000 → n² ok · n ≤ 10⁶ → n log n"]},{"t":"Python ↔ JavaScript","items":["list ↔ Array · dict ↔ Map (or object) · set ↔ Set","deque.popleft() ↔ head index / ring buffer (avoid shift() in loops)","sorted(a) ↔ a.toSorted((x, y) => x - y) · key=f ↔ (x, y) => f(x) - f(y)","bisect.bisect_left ↔ write your own binary search","len(a) ↔ a.length · a[-1] ↔ a.at(-1) · x in s ↔ s.has(x)"]},{"t":"Pattern triggers","items":["Lookup or count → **hash map / set**","Sorted array + pair or triplet → **two pointers**","Contiguous subarray/substring + condition → **sliding window**","Many range sums → **prefix sums**","Matching / undo / next greater → **stack** (monotonic)","Sorted + search, or min/max feasible value → **binary search**"]},{"t":"Operation costs","items":["Array index read/write: O(1) · append: O(1) amortised · insert/delete at front: O(n)","Hash map get/put/delete: O(1) average, O(n) worst","Linked list insert/delete *after* a node you hold: O(1) · find by index: O(n)","Stack push/pop, deque append/popleft: O(1)","Built-in sort: stable in Python and JavaScript; O(n log n) in CPython and V8"]},{"t":"Edge cases to test every time","items":["Empty input","One element","All elements equal","Already sorted / reverse sorted","Negative numbers and zero","Very large n (time limit)"]}],"glossary":[["Algorithm","A step-by-step procedure that solves a problem for every valid input."],["Amortised cost","The average cost per operation over a whole sequence, even if some single operations are expensive."],["Asymptotic","About behaviour as the input size grows very large."],["Base case","The input for which a recursive function returns without recursing."],["Big-O (O)","An upper bound on growth: the function grows no faster than this, up to a constant."],["Big-Omega (Ω)","A lower bound on growth."],["Big-Theta (Θ)","A tight bound: both O and Ω."],["Binary search","Repeatedly halving a sorted search space; O(log n)."],["Call stack","The stack of frames for function calls that haven't returned yet."],["Collision","Two different keys landing in the same hash-table bucket."],["Deque","Double-ended queue: O(1) add and remove at both ends."],["Dynamic array","An array that grows by allocating a block a constant factor larger (often 1.5× or 2×) and copying."],["Hash function","Maps a key to a number used to pick a bucket; equal keys must give equal hashes."],["Hash map","Key → value store with O(1) average operations (Python dict, JavaScript Map)."],["In place","Using O(1) (or O(log n) recursion) extra memory by modifying the input."],["Linked list","Nodes that each hold a value and a reference to the next node."],["Load factor","Items ÷ buckets in a hash table; a resize keeps it low."],["Monotonic stack","A stack kept in increasing or decreasing order, used for next-greater problems."],["Prefix sum","prefix[i] = sum of the first i elements; any range sum becomes one subtraction."],["Queue","First in, first out (FIFO)."],["Recursion","A function that calls itself on a smaller input."],["Sliding window","A contiguous range moved across the data, updated incrementally."],["Space complexity","How extra memory grows with the input size."],["Stable sort","A sort that keeps equal items in their original order."],["Stack","Last in, first out (LIFO)."],["Two pointers","Two indices moving through data, from both ends or in the same direction."]],"sourceGroups":[{"t":"Practice","items":[["NeetCode 150 (interview problems grouped by pattern)","https://neetcode.io/practice/practice/neetcode150","A4 R4 D4 · free, with paid extras"],["LeetCode problem set","https://leetcode.com/problemset/","A4 R5 D4 · free tier is enough for L1"]]},{"t":"Reference","items":[["Python wiki: TimeComplexity of list, deque, dict and set","https://wiki.python.org/moin/TimeComplexity","A4 R3 D4 · free · the wiki is being archived"],["Python docs: collections.deque","https://docs.python.org/3/library/collections.html#collections.deque","A5 R5 D4 · free"],["Python docs: bisect (binary search helpers)","https://docs.python.org/3/library/bisect.html","A5 R5 D4 · free"],["Python docs: Sorting techniques","https://docs.python.org/3/howto/sorting.html","A5 R5 D4 · free"],["MDN: Map","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map","A5 R5 D4 · free"],["MDN: Array.prototype.sort","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort","A5 R5 D4 · free"]]},{"t":"Courses and books","items":[["MIT 6.006 Introduction to Algorithms (Spring 2020, OCW)","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/","A5 R3 D5 · free"],["Introduction to Algorithms, 4th ed. (CLRS, MIT Press)","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/","A5 R3 D5 · paid, for L3–L4"],["USACO Guide (bronze and silver for L1–L2)","https://usaco.guide/","A5 R4 D5 · free"]]}],"aiCtx":"The learner is a beginner programmer at level L1 Foundation in data structures and algorithms, learning in both Python 3.12+ and JavaScript (Node.js 22). Use plain words and short examples, show code in Python and JavaScript when it helps, state the time and space complexity of every solution, and never invent LeetCode problem numbers or titles. If you are unsure of a detail, say so.","storyWorld":"The toy room and the treasure-map road trip","kidMapHead":"In code","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the code before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps or complexity classes in order.","**Code drop-downs**: complete Python or JavaScript.","**Matching**: map patterns to problems or code to Big-O."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to recognise which idea a problem needs, which is the real skill behind every coding interview. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is a small product with real requirements. Read the scenario tabs, then pick data structures and algorithms and justify their complexity.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Practice-problem links point to LeetCode titles from your audited list of 8 Oct 2026.","sourcesTab":"Resources","freshStyle":"in the style of a coding interview or exam (a short scenario or code snippet, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Big-O, arrays, hashing, pointers, stacks, lists, recursion, sorting, binary search","x":"this hub","cur":true},{"k":"L2 Proficient","t":"Trees, heaps, graphs, union-find, tries, backtracking, DP I, greedy, bits","x":"150 curated problems + mock interviews"},{"k":"L3 Specialist","t":"Advanced DP, shortest paths, range queries, strings, number theory, game theory","x":"contest practice"},{"k":"L4 Expert","t":"SCCs, flows, geometry, advanced techniques, teaching","x":"problem setting"}],"ladderTitle":"Your DSA ladder","ladderNote":"Each level is its own hub","deck":"dsa-l1","examinerRole":"technical interviewer for a junior software engineering role","aiCheck":"Written by Claude for this hub. Check surprising claims against the official Python and MDN docs, and run the code yourself."};

<script>
(function () {
"use strict";
/* ===== core: data indexes, helpers, storage + account sync, tabs, header ===== */
const H = window.HUB;
const M = H.modules;
const MID = {};
M.forEach((m, i) => { MID[m.id] = m; m._i = i; });
const DOM = H.domains;
const DMAP = {};
DOM.forEach((d, i) => { DMAP[d.id] = d; d._i = i; d.cls = "d" + (i + 1); });
const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LET = "ABCDEFGHIJKL";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */
function inl(s) {
  const parts = String(s == null ? "" : s).split("`");
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<code>" + esc(p) + "</code>";
    let t = esc(p);
    t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[\s(“"'\/-])\*([^*\s](?:[^*]*[^*\s])?)\*(?=[\s).,;:!?”"'\/-]|$)/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }).join("");
}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(iso, opts) { try { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return iso; } }
function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1800); } }
  catch (e) {
    const host = (btn && btn.closest(".panel, .q, .ai-box")) || document.body;
    let ta = host.querySelector("textarea.copybox");
    if (!ta) { ta = document.createElement("textarea"); ta.className = "copybox mono"; ta.setAttribute("aria-label", "Text to copy"); host.appendChild(ta); }
    ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
    if (btn) btn.textContent = "Select all and copy the text below";
  }
}

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));
(H.mocks || []).forEach(mk => (mk.items || []).forEach((q, i) => regItem(q, "mock" + mk.id + "." + (i + 1), { src: "Mock " + mk.id })));
(H.diag || []).forEach((q, i) => regItem(q, "diag." + (i + 1), { src: "Diagnostic" }));
const CASE = {}; (H.cases || []).forEach(c => { CASE[c.id] = c; });

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, probs: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }
    else setSync("error");
  } finally {
    SYNC.busy[part] = false;
    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }
  else return false;
  U[part] = data.upd; return true;
}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }
      else if (U[part]) flush(part);
    } catch (e) { setSync("error"); return changed; }
  }
  saveLocal();
  return changed;
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("loading");
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }
  });
}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }

/* ---------- FLASHCARDS (Leitner boxes, spaced) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function allCards() { const out = []; M.forEach(m => (m.qa || []).forEach((q, i) => out.push({ id: m.id + ".c" + (i + 1), d: m.d, t: m.t, q: q[0], a: q[1] }))); (H.cards || []).forEach((c, i) => out.push({ id: "x." + (i + 1), d: c.d, t: c.t || "Extra", q: c.q, a: c.a })); return out; }
let FC = { list: [], i: 0, flip: false, filter: "due" };
function buildFC() {
  const all = allCards(), tn = dayNum(today()), f = FC.filter;
  let list = all.filter(c => f === "due" ? (CARDS[c.id] ? CARDS[c.id][1] <= tn : true) : f === "all" ? true : f.startsWith("m:") ? c.id.startsWith(f.slice(2) + ".") : c.d === f);
  if (f === "due") { const seen = list.filter(c => CARDS[c.id]), fresh = list.filter(c => !CARDS[c.id]); list = shuffle(seen).concat(fresh.slice(0, 20)); } else list = shuffle(list);
  FC.list = list; FC.i = 0; FC.flip = false;
}
RENDER.cards = function () {
  if (!FC.list.length || FC.i >= FC.list.length) buildFC();
  const v = $("#v-cards"), all = allCards(), tn = dayNum(today());
  const due = all.filter(c => CARDS[c.id] && CARDS[c.id][1] <= tn).length, unseen = all.filter(c => !CARDS[c.id]).length;
  const boxes = [0, 0, 0, 0, 0, 0]; all.forEach(c => { boxes[CARDS[c.id] ? CARDS[c.id][0] : 0]++; });
  const c = FC.list[FC.i];
  v.innerHTML = `<div class="fc"><div class="eyebrow">Spaced retrieval</div><h2 class="h-view">Flashcards</h2>
  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn small" id="fCopy">Copy card progress for Claude</button></div><p class="small muted" style="text-align:center;margin:.4em 0 0">Paste it in our chat to sync these cards with the deck in your vault.</p></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  $("#fCopy").addEventListener("click", e => { const tn2 = dayNum(today()); const prog = Object.keys(CARDS).map(id => ({ id, box: CARDS[id][0], due_in_days: CARDS[id][1] - tn2 })); copyText(`My ${H.code} flashcard progress from the Study Hub (deck ${H.deck || H.id}). Please update the vault deck to match:\n` + JSON.stringify(prog), e.currentTarget); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
