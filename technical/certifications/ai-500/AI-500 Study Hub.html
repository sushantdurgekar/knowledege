  id: "s05", d: "d4", t: "Testing strategy and CI/CD with IaC for multi-agent systems", min: 85,
  hook: "*Design a testing strategy (unit, regression, integration, automated evaluations)* and *specify CI/CD requirements for integration and release, including IaC deployments and testing*. Multi-agent systems have dependencies between agents and tools, so the pipeline must deploy in the right order and prove compatibility.",
  pre: { q: "Agent B depends on Tool T v2's new optional field; Agent A uses T v1 behaviour. In what order should the pipeline deploy, and why?", a: "Deploy dependencies first (**reverse topological order**): Tool T v2 (backward compatible: optional field) → then agents that use it. Contract tests verify A still works with T v2 (N-1 compatibility)." },
  story: [
    "Contoso's platform had 18 agents and 9 tool servers in one repository. Releases broke when an agent shipped before the tool version it needed, or when a tool removed a field another agent still used.",
    "The CI/CD redesign started with a **dependency manifest** (`agent-dependencies.yml`) describing which agents depend on which tools and agents. The pipeline deploys in **reverse topological order** — dependencies first — using GitHub Actions `needs:`. A **compatibility matrix** of tool schema versions is checked by **contract tests**: required fields, types, response shapes. Breaking changes (new required parameter, removed field, type change) need a major version; during canaries both N and N−1 must work.",
    "Testing became layered. **Unit tests** cover deterministic code: tools, parsers, routing heuristics, validators — with the LLM mocked. **Contract tests** cover tool and agent message schemas. **Integration tests** run multi-agent flows against staging services with fault injection (timeouts, 429s, malformed responses). **Regression and automated evaluations** run the canary set, the full taxonomy set and historical failure probes against the gold baseline; red-team scans check attack success rate. **Load tests** check quotas and latency under peak.",
    "Infrastructure is **IaC**: Bicep (or Terraform) with **azd** for Foundry resources, projects, model deployments, connections, Container Apps, networking and Key Vault, with *what-if* previews on pull requests. Agent definitions are files in the repo, versioned with prompts.",
    "Pipelines authenticate with **OIDC federated credentials** (no secrets), deploy to protected **GitHub environments** with required reviewers for production, and fail fast on secret scanning, dependency vulnerabilities or evaluation gates. Dev containers, pinned CLI versions, lock files and an `AGENTS.md` keep developers and pipelines consistent."
  ],
  breaks: "Tests on LLM behaviour are probabilistic: a flaky evaluation gate erodes trust as fast as no gate. Use enough samples, thresholds derived from historical variance, per-segment checks and re-run policies for borderline results rather than demanding exact outputs.",
  dia: [
    { type: "layers", cap: "Testing pyramid for multi-agent systems", rows: [["Unit", "tools, parsers, routing rules, validators; LLM mocked; fast"], ["Contract", "tool/agent message schemas; N-1 compatibility"], ["Integration", "multi-agent flows in staging; fault injection"], ["Automated evaluations", "canaries → full set → historical probes vs gold baseline; per-segment"], ["Security & load", "red-team ASR, guardrail matrix, quota/latency under peak"], ["Production", "canary gates, continuous evaluation"]] },
    { type: "flow", cap: "Pipeline", steps: [["PR", "lint, unit, contract tests, secret/dependency scans, IaC what-if"], ["Build once", "images + agent definitions + manifest"], ["Deploy dev/test", "OIDC; dependency order (needs:)"], ["Evaluate", "regression + red team; gate"], ["Staging", "integration, load, approval"], ["Production", "protected environment; canary; auto-rollback"]] }
  ],
  keys: [
    "Test layers: **unit** (deterministic code; mock LLM), **contract** (schemas, N-1 compatibility), **integration** (multi-agent flows, fault injection), **regression/automated evaluations** (quality and safety vs baseline), **security** (red team, guardrail matrix, secret/dependency scans), **load**.",
    "Contract rules: breaking = new required parameter, removed tool/field, type change; safe = optional parameter/field. Keep N-1 compatibility during rolling and canary releases.",
    "**Dependency DAG manifest**; deploy dependencies first (reverse topological order); encode with GitHub Actions `needs:` (or Azure DevOps stage dependencies).",
    "**IaC**: Bicep/Terraform (+ azd) for Foundry resources, projects, deployments, connections, compute, networking, Key Vault, monitoring; *what-if* on PRs; idempotent deployments; environment parameters.",
    "Agent definitions, prompts, tool schemas and evaluation datasets live in source control and are versioned together.",
    "Auth: **OIDC federated credentials** (`permissions: id-token: write`, `azure/login`) — no long-lived secrets in CI.",
    "Gates: evaluation thresholds (from historical variance, per segment), safety 100%/ASR not worse than baseline, schema compliance, scans; production behind **protected environments** with required reviewers.",
    "Evaluation in CI: `microsoft/ai-agent-evals` GitHub Action (Azure DevOps extension also exists) or the evaluation SDK in a job the deploy job `needs`.",
    "Reproducibility: dev containers, pinned CLI/tool versions, lock files, Dependabot/Renovate, `AGENTS.md`/`copilot-instructions.md` for AI coding assistants.",
    "Flakiness control: enough samples, variance-based thresholds, re-run policy for borderline results, quarantined flaky tests tracked to fix."
  ],
  cmp: [{ cap: "What each test layer catches", head: ["Layer", "Catches", "Speed"], rows: [["Unit", "Logic bugs in tools/parsers/routing", "Seconds"], ["Contract", "Schema breaks between agents and tools", "Seconds"], ["Integration", "Flow, handoff and fault-handling bugs", "Minutes"], ["Automated evaluations", "Quality/safety regressions", "Minutes–hours (cost)"], ["Red team / guardrail matrix", "Security regressions (ASR)", "Minutes–hours"], ["Load", "Quota exhaustion, latency under peak", "Hours"]] }],
  code: [{ t: "GitHub Actions: OIDC, dependency order, evaluation gate, protected production", lang: "yaml", src: `permissions:
  id-token: write          # OIDC federation, no secrets
  contents: read

jobs:
  deploy-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: \${{ vars.AZURE_CLIENT_ID }}
          tenant-id: \${{ vars.AZURE_TENANT_ID }}
          subscription-id: \${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: azd deploy claims-tools-mcp --environment test

  deploy-agents:
    needs: deploy-tools     # dependencies first
    runs-on: ubuntu-latest
    steps:
      - run: azd deploy claims-agents --environment test

  evaluate:
    needs: deploy-agents
    runs-on: ubuntu-latest
    steps:
      - uses: microsoft/ai-agent-evals@v3-beta
        with:
          data-path: evals/claims_regression_v9.json

  deploy-prod:
    needs: evaluate          # gate: only runs if evaluation passes
    environment: production  # protected: required reviewers
    runs-on: ubuntu-latest
    steps:
      - run: azd deploy --environment prod`, notes: [[2, "Required for the job to request an OIDC token."], [9, "`azure/login` exchanges the GitHub OIDC token for an Entra token."], [11, "IDs are configuration variables, not secrets."], [17, "`needs:` encodes the dependency order: tools before agents."], [26, "The evaluation action runs Foundry evaluations; failures stop the pipeline."], [31, "Production waits for evaluation and for approval in a protected environment."]] }],
  portal: [{ t: "Set up a protected production environment", path: "GitHub > Settings > Environments > production", steps: ["Add required reviewers and a wait timer if needed.", "Restrict deployment branches (e.g., main only).", "Store non-secret IDs as environment variables; no client secrets (OIDC).", "Create the federated credential in Entra ID for the repo/environment subject.", "Grant the pipeline identity least-privilege roles per environment."] }],
  ex: { q: "A team's pipeline deploys all 12 agents and 5 tool servers in parallel; occasionally an agent starts before its tool's new version and fails health checks. They also store a client secret in GitHub. Fix the CI/CD design.", steps: ["Ordering → dependency DAG and `needs:`.", "Compatibility → contract tests and N-1 support.", "Secrets → OIDC federation."], a: "Introduce a **dependency manifest** and deploy in **reverse topological order** with `needs:` (tools before dependent agents), add **contract tests** and N-1 compatibility checks, gate on **automated evaluations**, and replace the client secret with **OIDC federated credentials** (`id-token: write`, `azure/login`) and protected environments for production." },
  fade: { q: "The evaluation gate fails randomly about 1 run in 6 with no code change.", steps: ["Gate is flaky.", { ask: "What do you check first?", a: "Sample size and threshold: are thresholds tighter than the metric's natural run-to-run variance?" }, { ask: "How do you fix it without weakening safety?", a: "Derive thresholds from historical variance, increase samples for noisy metrics, add a re-run policy for borderline results, keep safety checks strict (100%)." }] },
  traps: [
    ["Only end-to-end tests with live LLM calls.", "Unit and contract tests catch most bugs cheaply; mock the LLM."],
    ["Deploying agents and tools in parallel without ordering.", "Dependencies first via a DAG and `needs:`."],
    ["Client secrets in CI.", "OIDC federated credentials."],
    ["Evaluation gates with zero tolerance on noisy metrics.", "Variance-based thresholds; strict only for safety."],
    ["Infrastructure created by hand in the portal.", "IaC with what-if, versioned and reviewed."]
  ],
  disc: [
    ["How do you test a multi-agent handoff?", "Integration tests that drive a conversation across agents with stubbed tools, assert on handoff payload contents (contract), check coherence with a judge, and inject failures (spoke timeout, malformed response) to verify fallbacks."],
    ["What belongs in IaC vs agent configuration?", "IaC: resources, networking, identities, role assignments, model deployments, connections. Agent configuration (prompts, tools, agent definitions) is versioned in the repo and deployed by the pipeline, with evaluation gates — both promoted together."]
  ],
  teach: { prompt: "Explain your testing strategy and CI/CD requirements for a multi-agent system on Azure.", rubric: ["Layers: unit, contract, integration, evaluations, security, load", "Dependency DAG; reverse topological deploy; N-1 compatibility", "IaC (Bicep/Terraform + azd), what-if", "OIDC, protected environments, gates incl. evaluations and red team", "Reproducible dev env; flakiness control"], model: "I test in layers: unit tests for tools, parsers and routing with the model mocked; contract tests for tool and agent schemas with N-1 compatibility; integration tests for multi-agent flows with fault injection; automated evaluations and red-team scans against a gold baseline; and load tests for quotas. The pipeline builds once, deploys dependencies first using a DAG manifest and needs, provisions everything through Bicep or Terraform with azd and what-if previews, authenticates with OIDC instead of secrets, gates on evaluation, safety and scans, and promotes to a protected production environment with reviewers and a canary. Dev containers, pinned tools and lock files keep it reproducible, and evaluation thresholds come from historical variance to avoid flaky gates." },
  qa: [["Deploy order?", "Dependencies first (reverse topological)."], ["Breaking tool change?", "New required param, removed field, type change."], ["CI auth without secrets?", "OIDC federated credentials (`id-token: write`)."], ["Evaluation action?", "`microsoft/ai-agent-evals`."], ["IaC preview?", "what-if (Bicep) / plan (Terraform)."], ["Production protection?", "Protected environment with required reviewers."], ["Flaky eval gate fix?", "Variance-based thresholds, more samples, re-run policy."]],
  quiz: [
    { t: "ord", q: "Order the pipeline stages for a multi-agent release.", items: ["PR checks: unit and contract tests, scans, IaC what-if", "Build once: images, agent definitions and manifest", "Deploy tools, then dependent agents, to test", "Run automated evaluations and red-team scans (gate)", "Deploy to protected production with a canary"], e: "Fast checks, single build, ordered deploy, gates, controlled production.", tp: "CI/CD" },
    { t: "match", q: "Match each defect to the test layer most likely to catch it first.", pairs: [["Routing regex misclassifies refund requests", "Unit test"], ["Tool removed a field an agent reads", "Contract test"], ["Handoff loses the customer's constraint under a spoke timeout", "Integration test with fault injection"], ["New prompt lowers task adherence by 6%", "Automated evaluation (regression)"]], extra: ["Manual smoke test in production"], e: "Cheapest layer that can detect each defect.", tp: "Testing layers" },
    { t: "yn", q: "Evaluate each statement about CI/CD for agents.", s: [["`permissions: id-token: write` is required for OIDC login in GitHub Actions.", true], ["Agents and the tools they depend on can always be deployed in any order.", false], ["Production deployments should depend (`needs:`) on a passing evaluation job.", true]], e: "OIDC permission, dependency order and evaluation gates.", tp: "Pipelines" },
    { t: "drop", q: "Complete the workflow so production waits for evaluation and a human approval.", code: `deploy-prod:
  {{0}}: evaluate
  {{1}}: production
  runs-on: ubuntu-latest`, blanks: [{ o: ["needs", "after", "depends"], a: 0 }, { o: ["environment", "stage", "approval"], a: 0 }], e: "`needs` creates the dependency; a protected `environment` adds required reviewers.", tp: "GitHub Actions" },
    { t: "ms", q: "Which TWO tool-schema changes are BREAKING and need a major version?", o: ["Adding a new required parameter", "Changing a response field's type from number to string", "Adding an optional parameter with a default", "Adding a new optional response field", "Fixing a typo in the description"], a: [0, 1], e: "New required inputs and type changes break callers.", tp: "Contracts" },
    { q: "Which practice BEST ensures every developer and the pipeline use the same CLI and Python versions?", o: ["A shared wiki page", "A dev container with pinned images/features and lock files", "Installing latest versions daily", "Letting each developer choose"], a: 1, e: "Dev containers and lock files give reproducible environments.", tp: "Dev environment" }
  ],
  src: [["Use GitHub Actions with OIDC to connect to Azure", "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"], ["Azure Developer CLI (azd)", "https://learn.microsoft.com/en-us/azure/developer/azure-developer-cli/overview"], ["Bicep what-if", "https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if"], ["GitHub Action for agent evaluations", "https://github.com/microsoft/ai-agent-evals"]]
}

HUB.interview = [
{ c: "Architecture", q: "When would you NOT build a multi-agent system?", a: "When one agent with tools meets the requirements. I apply the litmus test: remove the second agent — if nothing breaks, the split only adds latency, tokens, a distributed trace to debug and more identities and guardrails. I split for specialisation that measurably helps, parallelism that cuts latency, separation of duties, different security boundaries, or independent ownership.", f: ["Tell me about a split you reversed.", "How do you measure whether a split paid off?"] },
{ c: "Architecture", q: "Walk me through how you'd architect a multi-agent claims platform on Azure.", a: "Start with requirements and constraints (audit, latency, residency). Decompose: deterministic steps as tools, judgment in agents, a reviewer agent for separation of duties, partner agents via A2A. Hub orchestrator in Agent Framework on Container Apps; tools as MCP servers behind APIM; memory in Cosmos DB with tenant partitions; knowledge via AI Search/Foundry IQ. Per-agent identities, private networking, guardrails at every intervention point, OpenTelemetry tracing, evaluation gates in CI, canary releases.", f: ["Where's the single point of failure?", "How do you handle a partner agent outage?"] },
{ c: "Architecture", q: "How do you design agent memory for a multi-tenant product?", a: "Separate working memory (session, digest in Redis), shared case state (Cosmos DB, session consistency, ETag concurrency) and long-term episodic/semantic memory (vector search). Store only memorable observations with importance; retrieve top few by similarity, importance and recency. Isolate tenants with partition keys, filters and post-retrieval validation; dedicated resources for regulated tenants; deletion workflows that purge embeddings too; audit every access.", f: ["How do you handle contradictory memories?"] },
{ c: "Development", q: "Explain how you make tool calls reliable and safe.", a: "Classify errors: transient get bounded retries with jittered backoff and Retry-After; permanent return structured errors; writes carry idempotency keys. Circuit breakers fail fast with structured fallbacks. Results are validated (schema, ranges), scanned for injection and redacted before entering context. Arguments are validated and authorised before execution, with approvals for high-impact actions.", f: ["Where do retries live to avoid retry storms?"] },
{ c: "Development", q: "MCP or A2A — how do you decide?", a: "MCP when my orchestrator calls tools or resources from a shared server — many agents and clients, independent versioning, central governance. A2A when I delegate a whole task to another agent that reasons with its own tools, especially across teams or companies, discovered via an agent card. Callers that want a deterministic function get MCP; callers that want delegation get A2A.", f: ["How do you secure an A2A integration?"] },
{ c: "Development", q: "How do you manage context across a long, multi-agent conversation?", a: "Per-agent token budgets and a priority-ordered assembler: system prompt (cacheable), a validated digest, compressed tool results, important older turns, then a rolling window summarised last with pinned critical facts. Agents get role-scoped slices, not transcripts. I watch for sliding-window amnesia, summary drift, vector-only recall and entity mix-ups.", f: ["How do you know a digest isn't losing information?"] },
{ c: "Development", q: "When do you fine-tune instead of prompting?", a: "When the task is stable, I have hundreds to thousands of quality examples, prompts are long and latency or cost targets are strict — typically for format, style or vocabulary. SFT for behaviour, DPO for preferences, RFT for verifiable reasoning. Never for changing facts (that's RAG). Every fine-tuned version goes through the same evaluation and safety gates and is retrained on drift or schema changes.", f: ["How do you avoid safety regressions after fine-tuning?"] },
{ c: "Operations", q: "Production quality dropped overnight but errors and latency look normal. What do you do?", a: "Check what changed: model deployment, prompt, tools, orchestration, configuration — in that order. Compare failing and successful traces, replay failures with old and new versions in isolation, drill down from system metrics to the agent and component. Mitigate (rollback the release batch), then add regression cases and a quality gate that would have caught it.", f: ["What monitoring would catch this earlier?"] },
{ c: "Operations", q: "How do you evaluate a multi-agent system?", a: "System metrics (task completion, goal achievement, journey coherence), business metrics (resolution, reopen, cost per resolved task) and component metrics (memory recall, retrieval nDCG/MRR, tool-call accuracy, intent resolution, task adherence). Specialised LLM judges calibrated against human review (κ > 0.7), synthetic taxonomy-driven datasets plus historical failure probes, CI gates with per-segment thresholds, and continuous evaluation in production.", f: ["How do you keep LLM judges honest?"] },
{ c: "Operations", q: "How would you cut model costs by 40% without hurting quality?", a: "Prompt caching (static prefix first), semantic caching for paraphrased FAQs with tuned thresholds and partitioned keys, result caching for deterministic lookups, tiered model routing with quality floors, token budgets and compact tool results, batch for offline work — validated with A/B tests and per-segment quality gates, with a quality circuit breaker.", f: ["What would you never cache?"] },
{ c: "Operations", q: "How do you design alerting so on-call isn't overwhelmed?", a: "Alert on SLO risk and anomalies against baselines (dynamic thresholds), correlate alerts within a short window and suppress downstream symptoms, map severities to SLO/SLA impact, automate only known failure modes with safe runbooks, and review alert precision monthly targeting ~80% actionable.", f: ["Give an example of a safe automated remediation."] },
{ c: "Security and governance", q: "How do you apply Zero Trust to agents?", a: "Per-agent identities with narrowly scoped data-plane roles (and Foundry's agent identity after publish), token validation between agents, PIM for humans, private endpoints and deny-by-default networking with controlled egress, guardrails at every intervention point, and audit. A compromised agent should reach as little as possible.", f: ["How do you prove least privilege to an auditor?"] },
{ c: "Security and governance", q: "Managed identity or on-behalf-of?", a: "Managed identity when the agent acts as itself on its own resources. OBO when the downstream system must enforce and audit the signed-in user's permissions. For third-party SaaS acting for a user, auth code with PKCE; partner services get client credentials; API keys only as a Key Vault-managed, rotated fallback.", f: ["What breaks OBO for long-running tasks?"] },
{ c: "Security and governance", q: "Describe your guardrail strategy for an agent that reads emails and moves money.", a: "Input: Prompt Shields for user and document attacks, delimiters, intent checks. Tool calls: allow-lists, schemas and amount limits, approvals above thresholds, sandboxing. Tool responses: schema checks, injection scans, PII redaction. Outputs: content safety, groundedness, policy classifiers. Domain rules in a regex → classifier → LLM-judge cascade with FP/FN targets. A coverage matrix in CI and the AI Red Teaming Agent with an ASR gate.", f: ["How do you handle false positives?"] },
{ c: "Delivery", q: "How do you release a new agent version safely?", a: "Build once and promote through DTAP with evaluation and red-team gates; deploy dependencies first; canary 5→25→50→100% with gates on evaluation scores, errors, latency and schema validity; feature flags and tenant tiers for behaviour changes; automated rollback of the whole release batch; manifests and approvals for audit.", f: ["When would you choose blue/green instead?"] },
{ c: "Behavioural (STAR)", q: "Tell me about a production incident involving an AI agent and what you changed afterwards.", a: "Use STAR. Situation: e.g., a model upgrade made outputs verbose and broke a parser. Task: restore service and prevent recurrence. Action: correlated traces, replayed with both model versions, rolled back the batch, added contract tests on output formats, pinned model versions, and made model upgrades go through canary with evaluation gates. Result: MTTR down, no recurrence; the postmortem led to platform-wide pinning.", f: ["What would you do differently?"] }
];

["Agent identity", "Distinct Microsoft Entra identity a Foundry agent receives when published; needs its own RBAC assignments."],
["Agent registry", "Catalogue of agents with capabilities, versions and health used for discovery and routing."],
["AI gateway", "API Management capabilities for models: token limits, semantic caching, metrics, load balancing."],
["AI Red Teaming Agent", "Foundry capability (PyRIT-based) that attacks a target with risk categories and strategies and reports attack success rate."],
["API Center", "Azure service to catalogue APIs and MCP servers for discovery and governance."],
["Attack success rate (ASR)", "Share of red-team attacks that produced an undesired response."],
["Autonomy level", "How independently an agent may act: full-auto, supervised, approval-required, human-only."],

<script>
(function () {

/* ===== core: data indexes, helpers, storage + account sync, tabs, header ===== */
const H = window.HUB;
const M = H.modules;
const MID = {};
M.forEach((m, i) => { MID[m.id] = m; m._i = i; });
const DOM = H.domains;
const DMAP = {};
DOM.forEach((d, i) => { DMAP[d.id] = d; d._i = i; d.cls = "d" + (i + 1); });
const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);

const LET = "ABCDEFGHIJKL";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */

}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }

function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }

function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(txt, btn) {

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));
(H.mocks || []).forEach(mk => (mk.items || []).forEach((q, i) => regItem(q, "mock" + mk.id + "." + (i + 1), { src: "Mock " + mk.id })));
(H.diag || []).forEach((q, i) => regItem(q, "diag." + (i + 1), { src: "Diagnostic" }));
const CASE = {}; (H.cases || []).forEach(c => { CASE[c.id] = c; });

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }

}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }
    else setSync("error");
  } finally {
    SYNC.busy[part] = false;
    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }
  else return false;
  U[part] = data.upd; return true;
}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }

}
async function initSync() {

  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }

}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }

    const keys = Object.keys(S.mis); if (keys.length > 400) { keys.sort((a, b) => (S.mis[a].at < S.mis[b].at ? -1 : 1)).slice(0, keys.length - 400).forEach(k => delete S.mis[k]); }

}
function domainAccuracy(did) { const ds = S.dstat[did]; return ds && ds[1] ? ds[0] / ds[1] : null; }
function readiness() {
  const list = MOCKS.slice().sort((a, b) => (a.at < b.at ? -1 : 1));

  const last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;

  if (last.weighted >= 75) return { cls: "mid", label: "Readiness: almost", verdict: "mid", text: `Almost: last mock ${last.weighted}% weighted, weakest domain ${minDom}%, confident-wrong ${last.cwPct}%. ${prev ? "" : "One mock isn't enough evidence: take the second mock after fixing your weak topics. "}Ready means 85%+ on two consecutive mocks, every domain at 70%+, and confident-wrong at 10% or less.` };
  return { cls: "no", label: "Readiness: not yet", verdict: "no", text: `Not yet: last mock ${last.weighted}% weighted (weakest domain ${minDom}%). Work through the weakest modules (story, key points, quiz), redo your mistakes, then retake.` };
}

/* ---------- tabs + header ---------- */
const VIEWS = [["start", "Start"], ["plan", "Roadmap"], ["learn", "Learn"], ["practice", "Practice"], ["cases", "Case studies"], ["mock", "Mock exams"], ["labs", "Labs"], ["cards", "Flashcards"], ["interview", "Interview"], ["cheat", "Cheat sheet"], ["sources", "Sources"]];

/* ===== items: Microsoft-style question types =====
   mc  single answer         {q,o,a:int,e}
   ms  multiple answers      {q,o,a:[int],e}                partial credit
   yn  yes/no statements     {q,s:[[text,bool]],e}          partial credit (hot-area style)
   ord build list / order    {q,items:[in correct order],e} all-or-nothing
   drop code/hot-area blanks {q,code:"..{{0}}..",blanks:[{o:[..],a:int}],e} partial credit
   match drag-drop matching  {q,pairs:[[left,right]],extra:[right distractors],e} partial credit */
function prepItem(it) {
  const v = { it, t: it.t };
  if (v.t === "mc" || v.t === "ms") v.order = it.fix ? it.o.map((_, i) => i) : shuffle(it.o.map((_, i) => i));
  if (v.t === "ord") { let s = shuffle(it.items.map((_, i) => i)); if (s.every((x, i) => x === i) && s.length > 1) s = s.slice(1).concat(s[0]); v.start = s; }
  if (v.t === "match") { const n = it.pairs.length + (it.extra || []).length; v.rorder = shuffle(Array.from({ length: n }, (_, i) => i)); }
  if (v.t === "drop") v.dorder = it.blanks.map(b => (it.fix ? b.o.map((_, j) => j) : shuffle(b.o.map((_, j) => j))));
  if (v.t === "yn") v.sorder = it.fix ? it.s.map((_, i) => i) : shuffle(it.s.map((_, i) => i));
  return v;
}
function rightText(it, i) { return i < it.pairs.length ? it.pairs[i][1] : (it.extra || [])[i - it.pairs.length]; }
function isAnswered(v, r) {
  if (r == null) return false;
  switch (v.t) {
    case "mc": return typeof r === "number";
    case "ms": return r.length > 0;
    case "yn": case "drop": case "match": return r.some(x => x != null);
    case "ord": return true;
  }
  return false;
}
function gradeItem(it, r) {
  if (r == null) return 0;
  switch (it.t) {
    case "mc": return r === it.a ? 1 : 0;
    case "ms": { const C = new Set(it.a); let g = 0, b = 0; r.forEach(x => (C.has(x) ? g++ : b++)); return Math.max(0, (g - b) / C.size); }
    case "yn": return it.s.reduce((a, s, i) => a + (r[i] === s[1] ? 1 : 0), 0) / it.s.length;

    <div class="row" style="margin-top:8px"><button type="button" class="btn ai ai-only" id="tbGrade">Grade it with Claude</button><button type="button" class="btn" id="tbSelf">Self-check with the rubric</button>${S.teach[m.id] ? `<span class="muted small">Last graded ${esc(fmtDate(S.teach[m.id].at))}: ${S.teach[m.id].score}/5</span>` : ""}</div>

  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">From certified to hireable</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.code} skills. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
