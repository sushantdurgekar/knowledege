<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141b24" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Free, self-paced Study Hubs for certifications and core tech skills. Progress is saved in your browser."
    />
    <title>Study Hubs</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Same font request as the hubs, so the browser can reuse its cache across shell and hubs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript">
        <h1>Study Hubs</h1>
        <p>The catalog needs JavaScript. Turn it on and reload this page to browse the hubs.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
