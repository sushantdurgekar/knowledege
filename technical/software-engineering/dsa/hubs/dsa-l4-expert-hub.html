→ a → b turns left (positive), right (negative) or goes straight (zero)","Whether the triangle o, a, b is acute","Which of a and b is farther from o","Whether the three points are all different"],"a":0,"e":"The cross product is twice the signed area of the triangle, and its sign is the turn's direction. It's exact with integers."},{"d":"d3","q":"Why does JavaScript need BigInt for cross products of coordinates up to 10⁹?","o":["Products reach about 4 × 10¹⁸, past 2⁵³, where Numbers stop being exact","Numbers can't be negative","BigInt is faster than Number","Multiplying Numbers isn't commutative"],"a":0,"e":"A double has 53 bits of precision, so integers past about 9 × 10¹⁵ get rounded and a nearly-zero cross product can flip sign."},{"d":"d3","q":"How long does a matrix power take to find the n-th term of a linear recurrence of order d?","o":["O(d³ log n)","O(d n)","O(n³)","O(d log n)"],"a":0,"e":"About log₂ n squarings and products, each a d × d matrix product costing O(d³)."},{"d":"d3","q":"What does linearity of expectation say?","o":["E[X + Y] = E[X] + E[Y] for any random variables, even dependent ones","E[XY] = E[X] · E[Y] always","Only independent variables' expectations can be added","E[X + Y] ≤ max(E[X], E[Y])"],"a":0,"e":"Linearity needs no independence, which is why an expected count is the sum of each event's probability. The product rule does need independence."},{"d":"d4","q":"dp[i] = min over j < i of (dp[j] + s[i] · f[j]), where f only falls and s only rises. Which technique makes it O(n) overall?","o":["The convex hull trick with a deque","Memoisation","Divide and conquer over i","A segment tree over j"],"a":0,"e":"Each j is a line with slope f[j], and the sorted slopes and queries let a deque keep the lower envelope in amortised O(1) per step."},{"d":"d4","q":"What does SOS DP compute, and how fast?","o":["For every mask of b bits, a sum over its subsets, in O(2^b · b)","Shortest paths over subsets, in O(3^b)","The number of set bits in every mask, in O(b)","All the submasks of one mask, in O(2^b)"],"a":0,"e":"One pass per bit adds, to each mask with that bit, the value without it. Enumerating every submask of every mask would be 3^b."},{"d":"d4","q":"What matters most about the brute force in a stress test?","o":["It's obviously correct, however slow it is","It runs within the time limit","It shares helper functions with the fast solution","It's written in a different language"],"a":0,"e":"The brute force is the oracle, so trust is everything; on tiny inputs speed doesn't matter. Shared helpers would hide shared bugs."}],"labs":[{"id":"lab-scc","t":"Strongly connected components and 2-SAT","min":75,"mods":["m01"],"goal":"Write both SCC algorithms without recursion, make them check each other and a brute force, then build a 2-SAT solver on top and test it against trying every assignment.","pre":["Python 3.12+ and Node.js 22+","Module 01"],"steps":["`tarjan_scc(n, edges)` returning (count, comp), with components numbered in reverse topological order. Use an explicit stack of [vertex, next edge index] instead of recursion, and lower low[u] only through vertices still on the vertex stack.","`kosaraju(n, edges)`: one pass over the graph recording vertices as they finish, then one pass over the reversed graph taking vertices in reverse finishing order. Components come out in topological order.","`two_sat(n, clauses)`: literal 2x means x and 2x + 1 means ¬x. Each clause (a, b) adds the edges a ^ 1 → b and b ^ 1 → a. Report no solution when comp[2x] == comp[2x + 1]; otherwise set x true when comp[2x] < comp[2x + 1] (Tarjan's numbering).","A brute force for each: mutual reachability by a search from every vertex, and every assignment for formulas with up to 6 variables.","Tests: 300 random graphs (n ≤ 9, with self-loops and repeated edges) where Tarjan, Kosaraju and the brute force agree and every condensation edge points the right way; 300 random formulas; and a 100,000-vertex ring to prove there's no recursion limit."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"def tarjan_scc(n, edges):                 # (count, comp); components numbered in reverse topological order\n    graph = [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n    tin, low, comp = [-1] * n, [0] * n, [-1] * n\n    on_stack, stack = [False] * n, []\n    timer = count = 0\n    for s in range(n):\n        if tin[s] != -1:\n            continue\n        tin[s] = low[s] = timer\n        timer += 1\n        stack.append(s)\n        on_stack[s] = True\n        work = [[s, 0]]                   # [vertex, next edge index]: an explicit call stack\n        while work:\n            u, i = work[-1]\n            if i < len(graph[u]):\n                work[-1][1] += 1\n                v = graph[u][i]\n                if tin[v] == -1:          # tree edge: \"call\" v\n                    tin[v] = low[v] = timer\n                    timer += 1\n                    stack.append(v)\n                    on_stack[v] = True\n                    work.append([v, 0])\n                elif on_stack[v]:         # an edge back into the current component\n                    low[u] = min(low[u], tin[v])\n            else:                         # u is finished: \"return\" to its parent\n                work.pop()\n                if work:\n                    p = work[-1][0]\n                    low[p] = min(low[p], low[u])\n                if low[u] == tin[u]:      # u is the root of an SCC: pop the whole SCC\n                    while True:\n                        w = stack.pop()\n                        on_stack[w] = False\n                        comp[w] = count\n                        if w == u:\n                            break\n                    count += 1\n    return count, comp\n\ndef kosaraju(n, edges):\n    graph, rev = [[] for _ in range(n)], [[] for _ in range(n)]\n    for u, v in edges:\n        graph[u].append(v)\n        rev[v].append(u)\n    order, seen = [], [False] * n\n    for s in range(n):                    # pass 1: record vertices by finishing time\n        if seen[s]:\n            continue\n        seen[s] = True\n        work = [[s, 0]]\n        while work:\n            u, i = work[-1]\n            if i < len(graph[u]):\n                work[-1][1] += 1\n                v = graph[u][i]\n                if not seen[v]:\n                    seen[v] = True\n                    work.append([v, 0])\n            else:\n                work.pop()\n                order.append(u)           # u's search is done: record it\n    comp, count = [-1] * n, 0\n    for s in reversed(order):             # pass 2: the reversed graph, latest finisher first\n        if comp[s] != -1:\n            continue\n        comp[s] = count\n        stack = [s]\n        while stack:\n            u = stack.pop()\n            for v in rev[u]:\n                if comp[v] == -1:\n                    comp[v] = count\n                    stack.append(v)\n        count += 1\n    return count, comp\n\ndef two_sat(n, clauses):                  # literal 2*x means x, 2*x + 1 means not x\n    edges = []\n    for a, b in clauses:                  # (a or b) gives: not a -> b, and not b -> a\n        edges.append((a ^ 1, b))\n        edges.append((b ^ 1, a))\n    _, comp = tarjan_scc(2 * n, edges)\n    result = []\n    for x in range(n):\n        if comp[2 * x] == comp[2 * x + 1]:\n            return None                   # x and not x imply each other\n        result.append(comp[2 * x] < comp[2 * x + 1])\n    return result\nimport itertools, random\nrandom.seed(1)\n\ndef reach_matrix(n, edges):                       # brute force: same SCC when each vertex reaches the other\n    adj = [[] for _ in range(n)]\n    for u, v in edges:\n        adj[u].append(v)\n    reach = []\n    for s in range(n):\n        seen, stack = {s}, [s]\n        while stack:\n            for v in adj[stack.pop()]:\n                if v not in seen:\n                    seen.add(v)\n                    stack.append(v)\n        reach.append(seen)\n    return [[v in reach[u] and u in reach[v] for v in range(n)] for u in range(n)]\n\ndef condensation(edges, comp):                    # the DAG of components, without repeated edges\n    return sorted({(comp[u], comp[v]) for u, v in edges if comp[u] != comp[v]})\n\nfor _ in range(300):\n    n = random.randint(1, 9)\n    es = [(random.randrange(n), random.randrange(n)) for _ in range(random.randint(0, 18))]\n    (c1, k1), (c2, k2), same = tarjan_scc(n, es), kosaraju(n, es), reach_matrix(n, es)\n    assert c1 == c2 == len({tuple(row) for row in same})\n    assert all((k1[u] == k1[v]) == same[u][v] == (k2[u] == k2[v]) for u in range(n) for v in range(n))\n    assert all(a > b for a, b in condensation(es, k1))       # Tarjan numbers sinks first\n    assert all(a < b for a, b in condensation(es, k2))       # Kosaraju numbers sources first\n\ndef holds(asg, a, b):\n    lit = lambda l: asg[l >> 1] if l % 2 == 0 else not asg[l >> 1]\n    return lit(a) or lit(b)\n\nfor _ in range(300):\n    n = random.randint(1, 6)\n    cl = [(random.randrange(2 * n), random.randrange(2 * n)) for _ in range(random.randint(0, 12))]\n    sol = two_sat(n, cl)\n    brute = any(all(holds(asg, a, b) for a, b in cl) for asg in itertools.product([False, True], repeat=n))\n    assert (sol is not None) == brute\n    assert sol is None or all(holds(sol, a, b) for a, b in cl)\n\nN = 100_000\nring = [(i, (i + 1) % N) for i in range(N)]\nprint(\"scc: 300 graphs ok | 2-sat: 300 formulas ok | 100000-vertex ring:\", tarjan_scc(N, ring)[0], kosaraju(N, ring)[0], \"component\")\n","out":"scc: 300 graphs ok | 2-sat: 300 formulas ok | 100000-vertex ring: 1 1 component"},{"lang":"javascript","src":"function tarjanScc(n, edges) {            // [count, comp]; components numbered in reverse topological order\n  const graph = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) graph[u].push(v);\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), comp = new Array(n).fill(-1);\n  const onStack = new Array(n).fill(false), stack = [];\n  let timer = 0, count = 0;\n  for (let s = 0; s < n; s++) {\n    if (tin[s] !== -1) continue;\n    tin[s] = low[s] = timer++;\n    stack.push(s);\n    onStack[s] = true;\n    const work = [[s, 0]];                // [vertex, next edge index]: an explicit call stack\n    while (work.length) {\n      const top = work[work.length - 1], u = top[0];\n      if (top[1] < graph[u].length) {\n        const v = graph[u][top[1]++];\n        if (tin[v] === -1) {              // tree edge: \"call\" v\n          tin[v] = low[v] = timer++;\n          stack.push(v);\n          onStack[v] = true;\n          work.push([v, 0]);\n        } else if (onStack[v]) low[u] = Math.min(low[u], tin[v]);   // an edge back into the current component\n      } else {                            // u is finished: \"return\" to its parent\n        work.pop();\n        if (work.length) {\n          const p = work[work.length - 1][0];\n          low[p] = Math.min(low[p], low[u]);\n        }\n        if (low[u] === tin[u]) {          // u is the root of an SCC: pop the whole SCC\n          let w;\n          do {\n            w = stack.pop();\n            onStack[w] = false;\n            comp[w] = count;\n          } while (w !== u);\n          count++;\n        }\n      }\n    }\n  }\n  return [count, comp];\n}\n\nfunction kosaraju(n, edges) {\n  const graph = Array.from({ length: n }, () => []), rev = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    graph[u].push(v);\n    rev[v].push(u);\n  }\n  const order = [], seen = new Array(n).fill(false);\n  for (let s = 0; s < n; s++) {           // pass 1: record vertices by finishing time\n    if (seen[s]) continue;\n    seen[s] = true;\n    const work = [[s, 0]];\n    while (work.length) {\n      const top = work[work.length - 1], u = top[0];\n      if (top[1] < graph[u].length) {\n        const v = graph[u][top[1]++];\n        if (!seen[v]) {\n          seen[v] = true;\n          work.push([v, 0]);\n        }\n      } else {\n        work.pop();\n        order.push(u);                    // u's search is done: record it\n      }\n    }\n  }\n  const comp = new Array(n).fill(-1);\n  let count = 0;\n  for (let k = order.length - 1; k >= 0; k--) {   // pass 2: the reversed graph, latest finisher first\n    const s = order[k];\n    if (comp[s] !== -1) continue;\n    comp[s] = count;\n    const stack = [s];\n    while (stack.length) {\n      const u = stack.pop();\n      for (const v of rev[u]) if (comp[v] === -1) { comp[v] = count; stack.push(v); }\n    }\n    count++;\n  }\n  return [count, comp];\n}\n\nfunction twoSat(n, clauses) {             // literal 2*x means x, 2*x + 1 means not x\n  const edges = [];\n  for (const [a, b] of clauses) {         // (a or b) gives: not a -> b, and not b -> a\n    edges.push([a ^ 1, b]);\n    edges.push([b ^ 1, a]);\n  }\n  const [, comp] = tarjanScc(2 * n, edges);\n  const result = [];\n  for (let x = 0; x < n; x++) {\n    if (comp[2 * x] === comp[2 * x + 1]) return null;   // x and not x imply each other\n    result.push(comp[2 * x] < comp[2 * x + 1]);\n  }\n  return result;\n}\nconst assert = require(\"node:assert\");\n\nfunction reachMatrix(n, edges) {                  // brute force: same SCC when each vertex reaches the other\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) adj[u].push(v);\n  const reach = [];\n  for (let s = 0; s < n; s++) {\n    const seen = new Set([s]), stack = [s];\n    while (stack.length) for (const v of adj[stack.pop()]) if (!seen.has(v)) { seen.add(v); stack.push(v); }\n    reach.push(seen);\n  }\n  return Array.from({ length: n }, (_, u) => Array.from({ length: n }, (_, v) => reach[u].has(v) && reach[v].has(u)));\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nfor (let t = 0; t < 300; t++) {\n  const n = 1 + rnd(9);\n  const es = Array.from({ length: rnd(19) }, () => [rnd(n), rnd(n)]);\n  const [c1, k1] = tarjanScc(n, es), [c2, k2] = kosaraju(n, es), same = reachMatrix(n, es);\n  assert.strictEqual(c1, c2);\n  assert.strictEqual(c1, new Set(same.map(r => r.join())).size);\n  for (let u = 0; u < n; u++) for (let v = 0; v < n; v++) {\n    assert.strictEqual(k1[u] === k1[v], same[u][v]);\n    assert.strictEqual(k2[u] === k2[v], same[u][v]);\n  }\n  for (const [u, v] of es) if (k1[u] !== k1[v]) { assert.ok(k1[u] > k1[v]); assert.ok(k2[u] < k2[v]); }\n}\n\nconst holds = (asg, a, b) => (a % 2 === 0 ? asg[a >> 1] : !asg[a >> 1]) || (b % 2 === 0 ? asg[b >> 1] : !asg[b >> 1]);\nfor (let t = 0; t < 300; t++) {\n  const n = 1 + rnd(6);\n  const cl = Array.from({ length: rnd(13) }, () => [rnd(2 * n), rnd(2 * n)]);\n  const sol = twoSat(n, cl);\n  let brute = false;\n  for (let m = 0; m < 1 << n && !brute; m++) {\n    const asg = Array.from({ length: n }, (_, i) => Boolean((m >> i) & 1));\n    if (cl.every(([a, b]) => holds(asg, a, b))) brute = true;\n  }\n  assert.strictEqual(sol !== null, brute);\n  if (sol) assert.ok(cl.every(([a, b]) => holds(sol, a, b)));\n}\n\nconst N = 100000;\nconst ring = Array.from({ length: N }, (_, i) => [i, (i + 1) % N]);\nconsole.log(\"scc: 300 graphs ok | 2-sat: 300 formulas ok | 100000-vertex ring:\", tarjanScc(N, ring)[0], kosaraju(N, ring)[0], \"component\");\n","out":"scc: 300 graphs ok | 2-sat: 300 formulas ok | 100000-vertex ring: 1 1 component"}]},"breakit":["Let Tarjan lower low[u] through any visited vertex, not only those still on the stack. Find a small graph where two separate SCCs get merged (a cross edge into a finished component does it).","In two_sat, set x true when comp[2x] > comp[2x + 1] instead. Find a satisfiable formula for which the returned assignment breaks a clause."]},{"id":"lab-flow","t":"Flows, cuts, matchings and assignments","min":100,"mods":["m02","m03"],"goal":"Write Dinic's maximum flow with a minimum-cut extractor, Kuhn's matching with Kőnig's cover, the Hungarian algorithm and min-cost flow, then make them check each other: max flow equals min cut, matching by flow equals Kuhn, and the Hungarian optimum equals min-cost flow.","pre":["Python 3.12+ and Node.js 22+","Modules 02 and 03"],"steps":["`MaxFlow` (Dinic) with `add_edge`, `max_flow` and `source_side`: each edge stored beside its reverse (indexes e and e ^ 1), BFS levels, current-arc pointers, and no recursion.","`max_matching(n_left, n_right, adj)` by Kuhn's algorithm with an explicit stack, and `matching_by_flow` on the unit network s → left → right → t. They must always agree.","`min_vertex_cover` from the matching by Kőnig's alternating search: the left vertices it misses plus the right vertices it reaches.","`assignment(cost)` (Hungarian, O(n³)) and `min_cost_flow(n, edges, s, t, k)` (successive shortest paths with a queue-based Bellman–Ford), checked against each other on n × n assignment networks.","Tests: random networks against a brute-force minimum cut over every vertex subset, random bipartite graphs against a brute-force matching, random cost matrices against every permutation, and a 2,000-move augmenting chain."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class MaxFlow:                                  # Dinic's algorithm\n    def __init__(self, n):\n        self.n, self.adj = n, [[] for _ in range(n)]\n        self.to, self.cap = [], []              # edge e and its reverse e ^ 1 sit side by side\n\n    def add_edge(self, u, v, c):\n        self.adj[u].append(len(self.to)); self.to.append(v); self.cap.append(c)\n        self.adj[v].append(len(self.to)); self.to.append(u); self.cap.append(0)\n\n    def _levels(self, s):                       # BFS distances from s using edges with spare capacity\n        level = [-1] * self.n\n        level[s], q = 0, [s]\n        for u in q:\n            for e in self.adj[u]:\n                if self.cap[e] > 0 and level[self.to[e]] < 0:\n                    level[self.to[e]] = level[u] + 1\n                    q.append(self.to[e])\n        return level\n\n    def _next_edge(self, u, level, it):         # first usable edge out of u, or -1\n        while it[u] < len(self.adj[u]):\n            e = self.adj[u][it[u]]\n            if self.cap[e] > 0 and level[self.to[e]] == level[u] + 1:\n                return e\n            it[u] += 1\n        return -1\n\n    def max_flow(self, s, t):\n        flow = 0\n        while (level := self._levels(s))[t] >= 0:\n            it = [0] * self.n                   # current-arc pointers: dead edges stay skipped\n            while True:                         # one shortest augmenting path per pass\n                path, u = [], s\n                while u != t:\n                    e = self._next_edge(u, level, it)\n                    if e >= 0:\n                        path.append(e)\n                        u = self.to[e]\n                    elif u == s:\n                        break                   # s is stuck: this level graph is used up\n                    else:\n                        u = self.to[path.pop() ^ 1]   # back to the tail of the last edge\n                        it[u] += 1                    # and never try that edge again this round\n                if u != t:\n                    break\n                f = min(self.cap[e] for e in path)\n                for e in path:\n                    self.cap[e] -= f\n                    self.cap[e ^ 1] += f\n                flow += f\n        return flow\n\n    def source_side(self, s):                   # after max_flow: what s still reaches is a min cut's side\n        return [d >= 0 for d in self._levels(s)]\n\ndef max_matching(n_left, n_right, adj):         # Kuhn; adj[u]: the right vertices left vertex u may take\n    match_l, match_r, size = [-1] * n_left, [-1] * n_right, 0\n    for root in range(n_left):\n        seen = [False] * n_right\n        stack, via, free = [[root, 0]], [], -1  # left vertices on the path, right vertices between them\n        while stack and free < 0:\n            u, i = stack[-1]\n            if i == len(adj[u]):                # u has nothing left to try: step back\n                stack.pop()\n                if via:\n                    via.pop()\n                continue\n            stack[-1][1] += 1\n            v = adj[u][i]\n            if seen[v]:\n                continue\n            seen[v] = True\n            if match_r[v] < 0:\n                free = v                        # a free right vertex ends an augmenting path\n            else:\n                via.append(v)\n                stack.append([match_r[v], 0])   # ask v's partner to move instead\n        if free >= 0:                           # flip the path: each left vertex takes the next right vertex\n            for (u, _), v in zip(stack, via + [free]):\n                match_l[u], match_r[v] = v, u\n            size += 1\n    return size, match_l, match_r\n\ndef assignment(cost):                           # Hungarian; n x m costs, n <= m: (least total, column per row)\n    n, m = len(cost), len(cost[0])\n    u, v = [0] * (n + 1), [0] * (m + 1)         # potentials, 1-based: cost - u[i] - v[j] stays >= 0\n    p, way = [0] * (m + 1), [0] * (m + 1)       # p[j]: the row holding column j (0 = none)\n    for i in range(1, n + 1):\n        p[0], j0 = i, 0                         # park the new row on the dummy column 0\n        minv, used = [float(\"inf\")] * (m + 1), [False] * (m + 1)\n        while True:                             # a Dijkstra-like search over reduced costs\n            used[j0] = True\n            i0, delta, j1 = p[j0], float(\"inf\"), 0\n            for j in range(1, m + 1):\n                if not used[j]:\n                    cur = cost[i0 - 1][j - 1] - u[i0] - v[j]\n                    if cur < minv[j]:\n                        minv[j], way[j] = cur, j0\n                    if minv[j] < delta:\n                        delta, j1 = minv[j], j\n            for j in range(m + 1):              # shift the potentials: a new zero-cost edge appears\n                if used[j]:\n                    u[p[j]] += delta\n                    v[j] -= delta\n                else:\n                    minv[j] -= delta\n            j0 = j1\n            if p[j0] == 0:                      # a free column: this row's search is over\n                break\n        while j0:                               # flip the alternating path back to column 0\n            j1 = way[j0]\n            p[j0] = p[j1]\n            j0 = j1\n    col = [0] * n\n    for j in range(1, m + 1):\n        if p[j]:\n            col[p[j] - 1] = j - 1\n    return -v[0], col\n\ndef min_vertex_cover(n_left, n_right, adj):       # Kőnig: as many vertices as the maximum matching has edges\n    size, match_l, match_r = max_matching(n_left, n_right, adj)\n    seen_l = [m < 0 for m in match_l]             # start from every unmatched left vertex\n    seen_r = [False] * n_right\n    stack = [u for u in range(n_left) if seen_l[u]]\n    while stack:                                  # alternate: any edge to the right, the matched edge back\n        u = stack.pop()\n        for v in adj[u]:\n            if not seen_r[v]:\n                seen_r[v] = True\n                w = match_r[v]                    # always matched, or the matching wasn't maximum\n                if not seen_l[w]:\n                    seen_l[w] = True\n                    stack.append(w)\n    return [u for u in range(n_left) if not seen_l[u]], [v for v in range(n_right) if seen_r[v]]\n\nfrom collections import deque\n\ndef min_cost_flow(n, edges, s, t, k):             # edges (u, v, capacity, cost per unit): send up to k units\n    to, cap, cost, adj = [], [], [], [[] for _ in range(n)]\n    for u, v, c, w in edges:\n        adj[u].append(len(to)); to.append(v); cap.append(c); cost.append(w)\n        adj[v].append(len(to)); to.append(u); cap.append(0); cost.append(-w)   # sending back refunds the cost\n    sent = total = 0\n    while sent < k:\n        dist, prev, queued = [None] * n, [-1] * n, [False] * n\n        dist[s], q = 0, deque([s])\n        while q:                                  # Bellman-Ford with a queue: refunds are negative costs\n            u = q.popleft()\n            queued[u] = False\n            for e in adj[u]:\n                v = to[e]\n                if cap[e] > 0 and (dist[v] is None or dist[u] + cost[e] < dist[v]):\n                    dist[v], prev[v] = dist[u] + cost[e], e\n                    if not queued[v]:\n                        queued[v] = True\n                        q.append(v)\n        if dist[t] is None:\n            break                                 # no room left: fewer than k units fit\n        push, v = k - sent, t\n        while v != s:                             # the cheapest path's bottleneck\n            push = min(push, cap[prev[v]])\n            v = to[prev[v] ^ 1]\n        v = t\n        while v != s:\n            cap[prev[v]] -= push\n            cap[prev[v] ^ 1] += push\n            v = to[prev[v] ^ 1]\n        sent, total = sent + push, total + push * dist[t]\n    return sent, total\nimport itertools, random\nrandom.seed(2)\n\ndef matching_by_flow(nl, nr, adj):                # s -> left -> right -> t, every capacity 1\n    g = MaxFlow(nl + nr + 2)\n    s, t = nl + nr, nl + nr + 1\n    for u in range(nl):\n        g.add_edge(s, u, 1)\n        for v in adj[u]:\n            g.add_edge(u, nl + v, 1)\n    for v in range(nr):\n        g.add_edge(nl + v, t, 1)\n    return g.max_flow(s, t)\n\ndef brute_cut(n, es, s, t):\n    inner = [v for v in range(n) if v not in (s, t)]\n    best = None\n    for bits in range(1 << len(inner)):\n        S = {s} | {inner[i] for i in range(len(inner)) if bits >> i & 1}\n        c = sum(cap for u, v, cap in es if u in S and v not in S)\n        best = c if best is None else min(best, c)\n    return best\n\ndef brute_matching(nl, adj, i=0, used=0):\n    if i == nl:\n        return 0\n    best = brute_matching(nl, adj, i + 1, used)\n    for v in adj[i]:\n        if not used >> v & 1:\n            best = max(best, 1 + brute_matching(nl, adj, i + 1, used | 1 << v))\n    return best\n\nfor _ in range(300):                              # max flow = min cut = the cut that source_side reports\n    n = random.randint(2, 7)\n    es = [(random.randrange(n), random.randrange(n), random.randint(0, 6)) for _ in range(random.randint(0, 14))]\n    g = MaxFlow(n)\n    for u, v, c in es:\n        g.add_edge(u, v, c)\n    f = g.max_flow(0, n - 1)\n    side = g.source_side(0)\n    assert f == brute_cut(n, es, 0, n - 1) == sum(c for u, v, c in es if side[u] and not side[v])\n\nfor _ in range(300):                              # Kuhn = flow = brute force; Konig's cover has the same size\n    nl, nr = random.randint(1, 6), random.randint(1, 6)\n    adj = [random.sample(range(nr), random.randint(0, nr)) for _ in range(nl)]\n    size = max_matching(nl, nr, adj)[0]\n    assert size == matching_by_flow(nl, nr, adj) == brute_matching(nl, adj)\n    rows, cols = min_vertex_cover(nl, nr, adj)\n    assert len(rows) + len(cols) == size and all(u in rows or v in cols for u in range(nl) for v in adj[u])\n\nfor _ in range(200):                              # Hungarian = min-cost flow = every permutation\n    n = random.randint(1, 5)\n    cost = [[random.randint(0, 9) for _ in range(n)] for _ in range(n)]\n    best = min(sum(cost[i][p[i]] for i in range(n)) for p in itertools.permutations(range(n)))\n    edges = ([(2 * n, i, 1, 0) for i in range(n)] + [(i, n + j, 1, cost[i][j]) for i in range(n) for j in range(n)]\n             + [(n + j, 2 * n + 1, 1, 0) for j in range(n)])\n    assert assignment(cost)[0] == best == min_cost_flow(2 * n + 2, edges, 2 * n, 2 * n + 1, n)[1]\n\nchain = [[i, i + 1] for i in range(1999)] + [[0]]\nprint(\"max flow = min cut: 300 ok | matchings: 300 ok | assignments: 200 ok | 2000-move chain:\", max_matching(2000, 2000, chain)[0])\n","out":"max flow = min cut: 300 ok | matchings: 300 ok | assignments: 200 ok | 2000-move chain: 2000"},{"lang":"javascript","src":"class MaxFlow {                                 // Dinic's algorithm\n  constructor(n) {\n    this.n = n;\n    this.adj = Array.from({ length: n }, () => []);\n    this.to = []; this.cap = [];                // edge e and its reverse e ^ 1 sit side by side\n  }\n  addEdge(u, v, c) {\n    this.adj[u].push(this.to.length); this.to.push(v); this.cap.push(c);\n    this.adj[v].push(this.to.length); this.to.push(u); this.cap.push(0);\n  }\n  levels(s) {                                   // BFS distances from s using edges with spare capacity\n    const level = new Array(this.n).fill(-1), q = [s];\n    level[s] = 0;\n    for (let h = 0; h < q.length; h++) {\n      const u = q[h];\n      for (const e of this.adj[u]) {\n        if (this.cap[e] > 0 && level[this.to[e]] < 0) {\n          level[this.to[e]] = level[u] + 1;\n          q.push(this.to[e]);\n        }\n      }\n    }\n    return level;\n  }\n  nextEdge(u, level, it) {                      // first usable edge out of u, or -1\n    for (; it[u] < this.adj[u].length; it[u]++) {\n      const e = this.adj[u][it[u]];\n      if (this.cap[e] > 0 && level[this.to[e]] === level[u] + 1) return e;\n    }\n    return -1;\n  }\n  maxFlow(s, t) {\n    let flow = 0, level;\n    while ((level = this.levels(s))[t] >= 0) {\n      const it = new Array(this.n).fill(0);     // current-arc pointers: dead edges stay skipped\n      for (;;) {                                // one shortest augmenting path per pass\n        const path = [];\n        let u = s;\n        while (u !== t) {\n          const e = this.nextEdge(u, level, it);\n          if (e >= 0) { path.push(e); u = this.to[e]; continue; }\n          if (u === s) break;                   // s is stuck: this level graph is used up\n          u = this.to[path.pop() ^ 1];          // back to the tail of the last edge\n          it[u]++;                              // and never try that edge again this round\n        }\n        if (u !== t) break;\n        let f = Infinity;\n        for (const e of path) f = Math.min(f, this.cap[e]);\n        for (const e of path) { this.cap[e] -= f; this.cap[e ^ 1] += f; }\n        flow += f;\n      }\n    }\n    return flow;\n  }\n  sourceSide(s) {                               // after maxFlow: what s still reaches is a min cut's side\n    return this.levels(s).map(d => d >= 0);\n  }\n}\n\nfunction maxMatching(nLeft, nRight, adj) {      // Kuhn; adj[u]: the right vertices left vertex u may take\n  const matchL = new Array(nLeft).fill(-1), matchR = new Array(nRight).fill(-1);\n  let size = 0;\n  for (let root = 0; root < nLeft; root++) {\n    const seen = new Array(nRight).fill(false);\n    const stack = [[root, 0]], via = [];        // left vertices on the path, right vertices between them\n    let free = -1;\n    while (stack.length && free < 0) {\n      const top = stack[stack.length - 1], u = top[0];\n      if (top[1] === adj[u].length) { stack.pop(); via.pop(); continue; }   // nothing left to try: step back\n      const v = adj[u][top[1]++];\n      if (seen[v]) continue;\n      seen[v] = true;\n      if (matchR[v] < 0) free = v;              // a free right vertex ends an augmenting path\n      else { via.push(v); stack.push([matchR[v], 0]); }   // ask v's partner to move instead\n    }\n    if (free >= 0) {                            // flip the path: each left vertex takes the next right vertex\n      via.push(free);\n      stack.forEach(([u], k) => { matchL[u] = via[k]; matchR[via[k]] = u; });\n      size++;\n    }\n  }\n  return [size, matchL, matchR];\n}\n\nfunction assignment(cost) {                     // Hungarian; n x m costs, n <= m: [least total, column per row]\n  const n = cost.length, m = cost[0].length;\n  const u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);   // potentials, 1-based\n  const p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0); // p[j]: the row holding column j (0 = none)\n  for (let i = 1; i <= n; i++) {\n    p[0] = i;                                   // park the new row on the dummy column 0\n    let j0 = 0;\n    const minv = new Array(m + 1).fill(Infinity), used = new Array(m + 1).fill(false);\n    do {                                        // a Dijkstra-like search over reduced costs\n      used[j0] = true;\n      const i0 = p[j0];\n      let delta = Infinity, j1 = 0;\n      for (let j = 1; j <= m; j++) {\n        if (used[j]) continue;\n        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];\n        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }\n        if (minv[j] < delta) { delta = minv[j]; j1 = j; }\n      }\n      for (let j = 0; j <= m; j++) {            // shift the potentials: a new zero-cost edge appears\n        if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta;\n      }\n      j0 = j1;\n    } while (p[j0] !== 0);                      // a free column: this row's search is over\n    do {                                        // flip the alternating path back to column 0\n      const j1 = way[j0];\n      p[j0] = p[j1];\n      j0 = j1;\n    } while (j0);\n  }\n  const col = new Array(n).fill(0);\n  for (let j = 1; j <= m; j++) if (p[j]) col[p[j] - 1] = j - 1;\n  return [0 - v[0], col];                       // 0 - x rather than -x, so a zero total is never -0\n}\n\nfunction minVertexCover(nLeft, nRight, adj) {     // Kőnig: as many vertices as the maximum matching has edges\n  const [, matchL, matchR] = maxMatching(nLeft, nRight, adj);\n  const seenL = matchL.map(m => m < 0);           // start from every unmatched left vertex\n  const seenR = new Array(nRight).fill(false);\n  const stack = [...seenL.keys()].filter(u => seenL[u]);\n  while (stack.length) {                          // alternate: any edge to the right, the matched edge back\n    const u = stack.pop();\n    for (const v of adj[u]) {\n      if (seenR[v]) continue;\n      seenR[v] = true;\n      const w = matchR[v];                        // always matched, or the matching wasn't maximum\n      if (!seenL[w]) { seenL[w] = true; stack.push(w); }\n    }\n  }\n  return [[...seenL.keys()].filter(u => !seenL[u]), [...seenR.keys()].filter(v => seenR[v])];\n}\n\nfunction minCostFlow(n, edges, s, t, k) {         // edges [u, v, capacity, cost per unit]: send up to k units\n  const to = [], cap = [], cost = [], adj = Array.from({ length: n }, () => []);\n  for (const [u, v, c, w] of edges) {\n    adj[u].push(to.length); to.push(v); cap.push(c); cost.push(w);\n    adj[v].push(to.length); to.push(u); cap.push(0); cost.push(-w);   // sending back refunds the cost\n  }\n  let sent = 0, total = 0;\n  while (sent < k) {\n    const dist = new Array(n).fill(Infinity), prev = new Array(n).fill(-1), queued = new Array(n).fill(false);\n    dist[s] = 0;\n    const q = [s];\n    for (let h = 0; h < q.length; h++) {          // Bellman-Ford with a queue: refunds are negative costs\n      const u = q[h];\n      queued[u] = false;\n      for (const e of adj[u]) {\n        const v = to[e];\n        if (cap[e] > 0 && dist[u] + cost[e] < dist[v]) {\n          dist[v] = dist[u] + cost[e];\n          prev[v] = e;\n          if (!queued[v]) { queued[v] = true; q.push(v); }\n        }\n      }\n    }\n    if (dist[t] === Infinity) break;              // no room left: fewer than k units fit\n    let push = k - sent;\n    for (let v = t; v !== s; v = to[prev[v] ^ 1]) push = Math.min(push, cap[prev[v]]);   // the cheapest path's bottleneck\n    for (let v = t; v !== s; v = to[prev[v] ^ 1]) { cap[prev[v]] -= push; cap[prev[v] ^ 1] += push; }\n    sent += push;\n    total += push * dist[t];\n  }\n  return [sent, total];\n}\nconst assert = require(\"node:assert\");\nconst rnd = k => Math.floor(Math.random() * k);\n\nfunction matchingByFlow(nl, nr, adj) {           // s -> left -> right -> t, every capacity 1\n  const g = new MaxFlow(nl + nr + 2), s = nl + nr, t = nl + nr + 1;\n  for (let u = 0; u < nl; u++) { g.addEdge(s, u, 1); for (const v of adj[u]) g.addEdge(u, nl + v, 1); }\n  for (let v = 0; v < nr; v++) g.addEdge(nl + v, t, 1);\n  return g.maxFlow(s, t);\n}\n\nfunction bruteCut(n, es, s, t) {\n  const inner = [];\n  for (let v = 0; v < n; v++) if (v !== s && v !== t) inner.push(v);\n  let best = Infinity;\n  for (let bits = 0; bits < 1 << inner.length; bits++) {\n    const S = new Set([s]);\n    inner.forEach((v, i) => { if ((bits >> i) & 1) S.add(v); });\n    let c = 0;\n    for (const [u, v, cap] of es) if (S.has(u) && !S.has(v)) c += cap;\n    best = Math.min(best, c);\n  }\n  return best;\n}\n\nfunction bruteMatching(nl, adj, i = 0, used = 0) {\n  if (i === nl) return 0;\n  let best = bruteMatching(nl, adj, i + 1, used);\n  for (const v of adj[i]) if (!((used >> v) & 1)) best = Math.max(best, 1 + bruteMatching(nl, adj, i + 1, used | (1 << v)));\n  return best;\n}\n\nconst perms = xs => (xs.length <= 1 ? [xs] : xs.flatMap((x, i) => perms([...xs.slice(0, i), ...xs.slice(i + 1)]).map(p => [x, ...p])));\n\nfor (let r = 0; r < 300; r++) {                   // max flow = min cut = the cut that sourceSide reports\n  const n = 2 + rnd(6);\n  const es = Array.from({ length: rnd(15) }, () => [rnd(n), rnd(n), rnd(7)]);\n  const g = new MaxFlow(n);\n  for (const [u, v, c] of es) g.addEdge(u, v, c);\n  const f = g.maxFlow(0, n - 1), side = g.sourceSide(0);\n  assert.strictEqual(f, bruteCut(n, es, 0, n - 1));\n  assert.strictEqual(f, es.reduce((sum, [u, v, c]) => sum + (side[u] && !side[v] ? c : 0), 0));\n}\n\nfor (let r = 0; r < 300; r++) {                   // Kuhn = flow = brute force; Konig's cover has the same size\n  const nl = 1 + rnd(6), nr = 1 + rnd(6);\n  const adj = Array.from({ length: nl }, () => [...Array(nr).keys()].filter(() => Math.random() < 0.4));\n  const size = maxMatching(nl, nr, adj)[0];\n  assert.strictEqual(size, matchingByFlow(nl, nr, adj));\n  assert.strictEqual(size, bruteMatching(nl, adj));\n  const [rows, cols] = minVertexCover(nl, nr, adj);\n  assert.strictEqual(rows.length + cols.length, size);\n  for (let u = 0; u < nl; u++) for (const v of adj[u]) assert.ok(rows.includes(u) || cols.includes(v));\n}\n\nfor (let r = 0; r < 200; r++) {                   // Hungarian = min-cost flow = every permutation\n  const n = 1 + rnd(5);\n  const cost = Array.from({ length: n }, () => Array.from({ length: n }, () => rnd(10)));\n  const best = Math.min(...perms([...Array(n).keys()]).map(p => p.reduce((s, j, i) => s + cost[i][j], 0)));\n  const edges = [];\n  for (let i = 0; i < n; i++) { edges.push([2 * n, i, 1, 0], [n + i, 2 * n + 1, 1, 0]); for (let j = 0; j < n; j++) edges.push([i, n + j, 1, cost[i][j]]); }\n  assert.strictEqual(assignment(cost)[0], best);\n  assert.strictEqual(minCostFlow(2 * n + 2, edges, 2 * n, 2 * n + 1, n)[1], best);\n}\n\nconst chain = Array.from({ length: 1999 }, (_, i) => [i, i + 1]).concat([[0]]);\nconsole.log(\"max flow = min cut: 300 ok | matchings: 300 ok | assignments: 200 ok | 2000-move chain:\", maxMatching(2000, 2000, chain)[0]);\n","out":"max flow = min cut: 300 ok | matchings: 300 ok | assignments: 200 ok | 2000-move chain: 2000"}]},"breakit":["Stop adding pushed flow to the reverse edge (cap[e ^ 1]). Find a network where the flow now stops below the maximum; the diamond from module 02 is a start.","In the Hungarian algorithm, start `minv` at 0 instead of infinity, then run the random tests and explain the first failure."]},{"id":"lab-lca","t":"Tree queries: ancestors, paths and subtrees","min":80,"mods":["m04"],"goal":"Build a reusable rooted-tree class with binary lifting and an Euler tour, then answer k-th ancestor, LCA, distance, subtree-sum, path-sum and heaviest-edge queries, all checked against naive walks up the tree.","pre":["Python 3.12+ and Node.js 22+","Module 04"],"steps":["`Tree(n, edges)`: one iterative DFS from the root (an explicit stack with ~v as the “leave v” marker) for parent, depth, tin and tout, then the jump table up[j][v] = up[j − 1][up[j − 1][v]], with the root pointing at itself.","`kth_ancestor`, `lca` and `dist`: one jump per 1 bit of k; equalise depths, then jump both while the ancestors differ; depth[a] + depth[b] − 2 · depth[LCA].","A Fenwick tree over the Euler tour: point update plus subtree sum over [tin, tout), and root-path sums by adding each value over its whole subtree range.","`heaviest_on_paths`: a maximum stored per jump, mx[j][v] = max(mx[j − 1][v], mx[j − 1][up[j − 1][v]]), combined while lifting.","Tests: 200 random trees against naive ancestor lists, plus a 200,000-vertex path to prove the build has no recursion limit."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"class Tree:                                     # rooted at 0; up[j][v] is v's 2^j-th ancestor (the root's is itself)\n    def __init__(self, n, edges):\n        adj = [[] for _ in range(n)]\n        for u, v in edges:\n            adj[u].append(v)\n            adj[v].append(u)\n        self.LOG = max(1, (n - 1).bit_length())     # 2^LOG is more than any depth\n        parent, self.depth = [0] * n, [0] * n\n        self.tin, self.tout = [0] * n, [0] * n      # v's subtree is the positions [tin[v], tout[v])\n        seen, stack, timer = [False] * n, [0], 0\n        seen[0] = True\n        while stack:                                # preorder without recursion; ~v marks \"leave v\"\n            v = stack.pop()\n            if v < 0:\n                self.tout[~v] = timer\n                continue\n            self.tin[v] = timer\n            timer += 1\n            stack.append(~v)\n            for w in reversed(adj[v]):              # reversed, so children are visited in order\n                if not seen[w]:\n                    seen[w] = True\n                    parent[w], self.depth[w] = v, self.depth[v] + 1\n                    stack.append(w)\n        self.up = [parent]\n        for j in range(1, self.LOG):\n            prev = self.up[-1]\n            self.up.append([prev[prev[v]] for v in range(n)])   # two jumps of 2^(j-1)\n\n    def kth_ancestor(self, v, k):                   # -1 if v has fewer than k ancestors\n        if k > self.depth[v]:\n            return -1\n        j = 0\n        while k:\n            if k & 1:\n                v = self.up[j][v]\n            k >>= 1\n            j += 1\n        return v\n\n    def lca(self, a, b):\n        if self.depth[a] < self.depth[b]:\n            a, b = b, a\n        a = self.kth_ancestor(a, self.depth[a] - self.depth[b])   # lift a to b's depth\n        if a == b:\n            return a\n        for j in range(self.LOG - 1, -1, -1):       # biggest jumps first, while the ancestors differ\n            if self.up[j][a] != self.up[j][b]:\n                a, b = self.up[j][a], self.up[j][b]\n        return self.up[0][a]\n\n    def dist(self, a, b):\n        return self.depth[a] + self.depth[b] - 2 * self.depth[self.lca(a, b)]\n\n    def is_ancestor(self, a, b):                    # is a an ancestor of b, or b itself?\n        return self.tin[a] <= self.tin[b] < self.tout[a]\n\nclass Fenwick:\n    def __init__(self, n):\n        self.t = [0] * (n + 1)\n    def add(self, i, x):                          # position i, from 0\n        i += 1\n        while i < len(self.t):\n            self.t[i] += x\n            i += i & -i\n    def prefix(self, i):                          # the sum of positions 0 .. i - 1\n        s = 0\n        while i > 0:\n            s += self.t[i]\n            i -= i & -i\n        return s\n\ndef heaviest_on_paths(n, edges, queries):         # edges (u, v, w); for each (a, b), the largest w on the path\n    t = Tree(n, [(u, v) for u, v, _ in edges])\n    w_up = [0] * n                                # the weight of the edge from v to its parent\n    for u, v, w in edges:\n        w_up[v if t.up[0][v] == u and v != 0 else u] = w\n    mx = [w_up]                                   # mx[j][v]: the heaviest edge on v's 2^j jump\n    for j in range(1, t.LOG):\n        prev, up = mx[-1], t.up[j - 1]\n        mx.append([max(prev[v], prev[up[v]]) for v in range(n)])   # first half, then second half\n    out = []\n    for a, b in queries:\n        best = 0\n        if t.depth[a] < t.depth[b]:\n            a, b = b, a\n        diff, j = t.depth[a] - t.depth[b], 0\n        while diff:                               # lift a, keeping the max of every jump\n            if diff & 1:\n                best, a = max(best, mx[j][a]), t.up[j][a]\n            diff, j = diff >> 1, j + 1\n        if a != b:\n            for j in range(t.LOG - 1, -1, -1):\n                if t.up[j][a] != t.up[j][b]:\n                    best = max(best, mx[j][a], mx[j][b])\n                    a, b = t.up[j][a], t.up[j][b]\n            best = max(best, w_up[a], w_up[b])    # the last two edges into the LCA\n        out.append(best)\n    return out\nimport random\nrandom.seed(3)\n\nfor _ in range(200):\n    n = random.randint(1, 40)\n    par = [0] + [random.randrange(v) for v in range(1, n)]\n    es = [(par[v], v, random.randint(1, 50)) for v in range(1, n)]\n    t = Tree(n, [(u, v) for u, v, _ in es])\n    weight = {(u, v): w for u, v, w in es}\n    def anc(v):                                   # v, its parent, grandparent, ..., the root\n        out = [v]\n        while out[-1] != 0:\n            out.append(par[out[-1]])\n        return out\n    vals = [random.randint(-9, 9) for _ in range(n)]\n    sub, path = Fenwick(n), Fenwick(n + 1)\n    for v in range(n):\n        sub.add(t.tin[v], vals[v])\n        path.add(t.tin[v], vals[v])\n        path.add(t.tout[v], -vals[v])\n    qs, want = [], []\n    for _ in range(30):\n        a, b, k = random.randrange(n), random.randrange(n), random.randint(0, n)\n        A, B = anc(a), anc(b)\n        c = next(x for x in A if x in B)\n        assert t.kth_ancestor(a, k) == (A[k] if k < len(A) else -1)\n        assert t.lca(a, b) == c and t.dist(a, b) == A.index(c) + B.index(c)\n        assert sub.prefix(t.tout[a]) - sub.prefix(t.tin[a]) == sum(vals[x] for x in range(n) if a in anc(x))\n        assert path.prefix(t.tin[a] + 1) == sum(vals[x] for x in A)\n        on_path = [weight[A[i + 1], A[i]] for i in range(A.index(c))] + [weight[B[i + 1], B[i]] for i in range(B.index(c))]\n        qs.append((a, b))\n        want.append(max(on_path, default=0))\n    assert heaviest_on_paths(n, es, qs) == want\n\nN = 200_000\nline = Tree(N, [(i, i + 1) for i in range(N - 1)])\nprint(\"tree queries: 200 random trees ok | 200000-vertex path:\", line.kth_ancestor(N - 1, N - 2), line.lca(N - 1, 100_000), line.dist(0, N - 1))\n","out":"tree queries: 200 random trees ok | 200000-vertex path: 1 100000 199999"},{"lang":"javascript","src":"class Tree {                                    // rooted at 0; up[j][v] is v's 2^j-th ancestor (the root's is itself)\n  constructor(n, edges) {\n    const adj = Array.from({ length: n }, () => []);\n    for (const [u, v] of edges) { adj[u].push(v); adj[v].push(u); }\n    this.LOG = Math.max(1, 32 - Math.clz32(n - 1));   // 2^LOG is more than any depth\n    const parent = new Array(n).fill(0);\n    this.depth = new Array(n).fill(0);\n    this.tin = new Array(n).fill(0);\n    this.tout = new Array(n).fill(0);               // v's subtree is the positions [tin[v], tout[v])\n    const seen = new Array(n).fill(false), stack = [0];\n    seen[0] = true;\n    let timer = 0;\n    while (stack.length) {                          // preorder without recursion; ~v marks \"leave v\"\n      const v = stack.pop();\n      if (v < 0) { this.tout[~v] = timer; continue; }\n      this.tin[v] = timer++;\n      stack.push(~v);\n      for (let i = adj[v].length - 1; i >= 0; i--) {   // reversed, so children are visited in order\n        const w = adj[v][i];\n        if (!seen[w]) { seen[w] = true; parent[w] = v; this.depth[w] = this.depth[v] + 1; stack.push(w); }\n      }\n    }\n    this.up = [parent];\n    for (let j = 1; j < this.LOG; j++) {\n      const prev = this.up[j - 1];\n      this.up.push(prev.map(p => prev[p]));         // two jumps of 2^(j-1)\n    }\n  }\n  kthAncestor(v, k) {                               // -1 if v has fewer than k ancestors\n    if (k > this.depth[v]) return -1;\n    for (let j = 0; k > 0; j++, k >>= 1) if (k & 1) v = this.up[j][v];\n    return v;\n  }\n  lca(a, b) {\n    if (this.depth[a] < this.depth[b]) [a, b] = [b, a];\n    a = this.kthAncestor(a, this.depth[a] - this.depth[b]);   // lift a to b's depth\n    if (a === b) return a;\n    for (let j = this.LOG - 1; j >= 0; j--) {       // biggest jumps first, while the ancestors differ\n      if (this.up[j][a] !== this.up[j][b]) { a = this.up[j][a]; b = this.up[j][b]; }\n    }\n    return this.up[0][a];\n  }\n  dist(a, b) {\n    return this.depth[a] + this.depth[b] - 2 * this.depth[this.lca(a, b)];\n  }\n  isAncestor(a, b) {                                // is a an ancestor of b, or b itself?\n    return this.tin[a] <= this.tin[b] && this.tin[b] < this.tout[a];\n  }\n}\n\nclass Fenwick {\n  constructor(n) { this.t = new Array(n + 1).fill(0); }\n  add(i, x) { for (i++; i < this.t.length; i += i & -i) this.t[i] += x; }   // position i, from 0\n  prefix(i) { let s = 0; for (; i > 0; i -= i & -i) s += this.t[i]; return s; }   // the sum of positions 0 .. i - 1\n}\n\nfunction heaviestOnPaths(n, edges, queries) {     // edges [u, v, w]; for each [a, b], the largest w on the path\n  const t = new Tree(n, edges.map(([u, v]) => [u, v]));\n  const wUp = new Array(n).fill(0);               // the weight of the edge from v to its parent\n  for (const [u, v, w] of edges) wUp[t.up[0][v] === u && v !== 0 ? v : u] = w;\n  const mx = [wUp];                               // mx[j][v]: the heaviest edge on v's 2^j jump\n  for (let j = 1; j < t.LOG; j++) {\n    const prev = mx[j - 1], up = t.up[j - 1];\n    mx.push(prev.map((m, v) => Math.max(m, prev[up[v]])));   // first half, then second half\n  }\n  return queries.map(([a, b]) => {\n    let best = 0;\n    if (t.depth[a] < t.depth[b]) [a, b] = [b, a];\n    for (let diff = t.depth[a] - t.depth[b], j = 0; diff > 0; diff >>= 1, j++) {   // lift a, keeping the max\n      if (diff & 1) { best = Math.max(best, mx[j][a]); a = t.up[j][a]; }\n    }\n    if (a !== b) {\n      for (let j = t.LOG - 1; j >= 0; j--) {\n        if (t.up[j][a] !== t.up[j][b]) {\n          best = Math.max(best, mx[j][a], mx[j][b]);\n          a = t.up[j][a]; b = t.up[j][b];\n        }\n      }\n      best = Math.max(best, wUp[a], wUp[b]);      // the last two edges into the LCA\n    }\n    return best;\n  });\n}\nconst assert = require(\"node:assert\");\nconst rnd = k => Math.floor(Math.random() * k);\n\nfor (let r = 0; r < 200; r++) {\n  const n = 1 + rnd(40);\n  const par = [0];\n  for (let v = 1; v < n; v++) par.push(rnd(v));\n  const es = par.slice(1).map((p, i) => [p, i + 1, 1 + rnd(50)]);\n  const t = new Tree(n, es.map(([u, v]) => [u, v]));\n  const weight = new Map(es.map(([u, v, w]) => [u * n + v, w]));\n  const anc = v => { const out = [v]; while (out.at(-1) !== 0) out.push(par[out.at(-1)]); return out; };\n  const vals = Array.from({ length: n }, () => rnd(19) - 9);\n  const sub = new Fenwick(n), path = new Fenwick(n + 1);\n  for (let v = 0; v < n; v++) { sub.add(t.tin[v], vals[v]); path.add(t.tin[v], vals[v]); path.add(t.tout[v], -vals[v]); }\n  const qs = [], want = [];\n  for (let q = 0; q < 30; q++) {\n    const a = rnd(n), b = rnd(n), k = rnd(n + 1), A = anc(a), B = anc(b), Bs = new Set(B);\n    const c = A.find(x => Bs.has(x));\n    assert.strictEqual(t.kthAncestor(a, k), k < A.length ? A[k] : -1);\n    assert.strictEqual(t.lca(a, b), c);\n    assert.strictEqual(t.dist(a, b), A.indexOf(c) + B.indexOf(c));\n    let inSub = 0;\n    for (let x = 0; x < n; x++) if (anc(x).includes(a)) inSub += vals[x];\n    assert.strictEqual(sub.prefix(t.tout[a]) - sub.prefix(t.tin[a]), inSub);\n    assert.strictEqual(path.prefix(t.tin[a] + 1), A.reduce((s, x) => s + vals[x], 0));\n    const onPath = [];\n    for (let i = 0; i < A.indexOf(c); i++) onPath.push(weight.get(A[i + 1] * n + A[i]));\n    for (let i = 0; i < B.indexOf(c); i++) onPath.push(weight.get(B[i + 1] * n + B[i]));\n    qs.push([a, b]);\n    want.push(onPath.length ? Math.max(...onPath) : 0);\n  }\n  assert.deepStrictEqual(heaviestOnPaths(n, es, qs), want);\n}\n\nconst N = 200000;\nconst line = new Tree(N, Array.from({ length: N - 1 }, (_, i) => [i, i + 1]));\nconsole.log(\"tree queries: 200 random trees ok | 200000-vertex path:\", line.kthAncestor(N - 1, N - 2), line.lca(N - 1, 100000), line.dist(0, N - 1));\n","out":"tree queries: 200 random trees ok | 200000-vertex path: 1 100000 199999"}]},"breakit":["Use ⌊log₂ n⌋ levels instead of the bit length of n − 1. Find the smallest n where a k-th ancestor query now fails (n = 9, k = 8).","In the LCA loop, jump both vertices when their ancestors are equal instead of different. Watch which random tests fail and explain why."]},{"id":"lab-suffix","t":"Suffix array toolkit with O(1) LCP queries","min":90,"mods":["m05","m06"],"goal":"Build the suffix array and LCP array, answer distinct-substring, longest-repeat, pattern and k-th-substring questions, and add a sparse table so that the common prefix of any two suffixes is an O(1) range minimum.","pre":["Python 3.12+ and Node.js 22+","Modules 05 and 06"],"steps":["`suffix_array(s)` by prefix doubling: sort by (rank, rank k places later), re-rank, double k, stop when every rank differs.","`lcp_array(s, sa)` by Kasai: visit suffixes in text order and start each comparison from the previous match length minus 1.","`find_all(s, sa, p)` with two binary searches, and `kth_distinct(s, k)` by walking the suffix array (suffix sa[i] adds n − sa[i] − lcp[i] new substrings).","`lcp_of(i, j)`: a sparse table over the LCP array; the common prefix of suffixes i and j is the minimum of lcp between their ranks.","Tests: 300 random strings against sorting every suffix, the set of all substrings and direct comparisons, plus “a” × 20,000, the worst case for doubling."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"def suffix_array(s):                            # s: a str, or a list of non-negative ints\n    n = len(s)\n    if n == 0:\n        return []\n    rank = [ord(c) for c in s] if isinstance(s, str) else list(s)\n    sa, k = list(range(n)), 1\n    while True:\n        key = lambda i: (rank[i], rank[i + k] if i + k < n else -1)   # (first k items, next k items)\n        sa.sort(key=key)\n        new = [0] * n\n        for j in range(1, n):\n            new[sa[j]] = new[sa[j - 1]] + (key(sa[j]) != key(sa[j - 1]))\n        rank = new                              # ranks now describe the first 2k items\n        if rank[sa[-1]] == n - 1:               # every rank differs: fully sorted\n            return sa\n        k *= 2\n\ndef lcp_array(s, sa):                           # Kasai: lcp[i] = LCP of suffixes sa[i - 1] and sa[i]; lcp[0] = 0\n    n = len(s)\n    rank = [0] * n\n    for i, p in enumerate(sa):\n        rank[p] = i\n    lcp, h = [0] * n, 0\n    for p in range(n):                          # suffixes in text order, so h falls by at most 1 per step\n        if rank[p] == 0:\n            h = 0\n            continue\n        q = sa[rank[p] - 1]                     # the suffix just before p in sorted order\n        while p + h < n and q + h < n and s[p + h] == s[q + h]:\n            h += 1\n        lcp[rank[p]] = h\n        h = max(h - 1, 0)\n    return lcp\n\ndef find_all(s, sa, p):                         # every start of p in s, in O(|p| log n)\n    def first(strict):                          # the first suffix whose first |p| letters are >= p (> p if strict)\n        lo, hi = 0, len(sa)\n        while lo < hi:\n            mid = (lo + hi) // 2\n            head = s[sa[mid]:sa[mid] + len(p)]\n            if head < p or (strict and head == p):\n                lo = mid + 1\n            else:\n                hi = mid\n        return lo\n    return sorted(sa[first(False):first(True)])\n\ndef kth_distinct(s, k):                         # the k-th smallest distinct substring (k from 1)\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    for i, p in enumerate(sa):\n        new = len(s) - p - lcp[i]               # prefixes of this suffix not seen in an earlier one\n        if k <= new:\n            return s[p:p + lcp[i] + k]\n        k -= new\n    return \"\"                                   # fewer than k distinct substrings\n\nclass SparseTable:                              # O(n log n) build, O(1) query for idempotent operations\n    def __init__(self, a, op):\n        self.op, self.t = op, [a[:]]            # t[j][i] = op over a[i .. i + 2^j - 1]\n        j = 1\n        while 1 << j <= len(a):\n            prev, half = self.t[-1], 1 << (j - 1)\n            self.t.append([op(prev[i], prev[i + half]) for i in range(len(a) - (1 << j) + 1)])\n            j += 1\n\n    def query(self, l, r):                      # op over a[l .. r], both ends included\n        j = (r - l + 1).bit_length() - 1        # the largest power of two that fits in the range\n        return self.op(self.t[j][l], self.t[j][r - (1 << j) + 1])   # two overlapping blocks cover [l, r]\nimport random\nrandom.seed(4)\n\ndef lcp_tools(s):                                 # the LCP of any two suffixes as an O(1) range minimum\n    sa = suffix_array(s)\n    lcp = lcp_array(s, sa)\n    rank = [0] * len(s)\n    for i, p in enumerate(sa):\n        rank[p] = i\n    table = SparseTable(lcp, min) if s else None\n    def lcp_of(i, j):\n        if i == j:\n            return len(s) - i\n        a, b = sorted((rank[i], rank[j]))\n        return table.query(a + 1, b)              # the minimum of the lcp values between the two ranks\n    return sa, lcp, lcp_of\n\nfor _ in range(300):\n    s = \"\".join(random.choice(\"ab\" if random.random() < 0.5 else \"abc\") for _ in range(random.randint(1, 14)))\n    n = len(s)\n    sa, lcp, lcp_of = lcp_tools(s)\n    assert sa == sorted(range(n), key=lambda i: s[i:])\n    subs = sorted({s[i:j] for i in range(n) for j in range(i + 1, n + 1)})\n    assert n * (n + 1) // 2 - sum(lcp) == len(subs)\n    for i in range(n):\n        for j in range(n):\n            h = 0\n            while i + h < n and j + h < n and s[i + h] == s[j + h]:\n                h += 1\n            assert lcp_of(i, j) == h\n    for k in range(1, len(subs) + 1):\n        assert kth_distinct(s, k) == subs[k - 1]\n    p = \"\".join(random.choice(\"abc\") for _ in range(random.randint(1, 3)))\n    assert find_all(s, sa, p) == [i for i in range(n) if s.startswith(p, i)]\n\nbig = \"a\" * 20_000\nsa, lcp, lcp_of = lcp_tools(big)\nprint(\"suffix arrays: 300 strings ok | a * 20000:\", len(big) * (len(big) + 1) // 2 - sum(lcp), \"distinct substrings, longest repeat\", max(lcp), \"| lcp_of(0, 1) =\", lcp_of(0, 1))\n","out":"suffix arrays: 300 strings ok | a * 20000: 20000 distinct substrings, longest repeat 19999 | lcp_of(0, 1) = 19999"},{"lang":"javascript","src":"function suffixArray(s) {                       // s: a string, or an array of non-negative integers\n  const n = s.length;\n  if (n === 0) return [];\n  let rank = typeof s === \"string\" ? Array.from({ length: n }, (_, i) => s.charCodeAt(i)) : [...s];\n  const sa = [...Array(n).keys()];\n  for (let k = 1; ; k *= 2) {\n    const second = i => (i + k < n ? rank[i + k] : -1);\n    const cmp = (a, b) => rank[a] - rank[b] || second(a) - second(b);   // (first k items, next k items)\n    sa.sort(cmp);\n    const next = new Array(n).fill(0);\n    for (let j = 1; j < n; j++) next[sa[j]] = next[sa[j - 1]] + (cmp(sa[j - 1], sa[j]) < 0 ? 1 : 0);\n    rank = next;                                // ranks now describe the first 2k items\n    if (rank[sa[n - 1]] === n - 1) return sa;   // every rank differs: fully sorted\n  }\n}\n\nfunction lcpArray(s, sa) {                      // Kasai: lcp[i] = LCP of suffixes sa[i - 1] and sa[i]; lcp[0] = 0\n  const n = s.length, rank = new Array(n).fill(0), lcp = new Array(n).fill(0);\n  sa.forEach((p, i) => { rank[p] = i; });\n  let h = 0;\n  for (let p = 0; p < n; p++) {                 // suffixes in text order, so h falls by at most 1 per step\n    if (rank[p] === 0) { h = 0; continue; }\n    const q = sa[rank[p] - 1];                  // the suffix just before p in sorted order\n    while (p + h < n && q + h < n && s[p + h] === s[q + h]) h++;\n    lcp[rank[p]] = h;\n    h = Math.max(h - 1, 0);\n  }\n  return lcp;\n}\n\nfunction findAll(s, sa, p) {                    // every start of p in s, in O(|p| log n)\n  const first = strict => {                     // the first suffix whose first |p| letters are >= p (> p if strict)\n    let lo = 0, hi = sa.length;\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1, head = s.slice(sa[mid], sa[mid] + p.length);\n      if (head < p || (strict && head === p)) lo = mid + 1;\n      else hi = mid;\n    }\n    return lo;\n  };\n  return sa.slice(first(false), first(true)).sort((a, b) => a - b);\n}\n\nfunction kthDistinct(s, k) {                    // the k-th smallest distinct substring (k from 1)\n  const sa = suffixArray(s), lcp = lcpArray(s, sa);\n  for (let i = 0; i < sa.length; i++) {\n    const fresh = s.length - sa[i] - lcp[i];    // prefixes of this suffix not seen in an earlier one\n    if (k <= fresh) return s.slice(sa[i], sa[i] + lcp[i] + k);\n    k -= fresh;\n  }\n  return \"\";                                    // fewer than k distinct substrings\n}\n\nclass SparseTable {                             // O(n log n) build, O(1) query for idempotent operations\n  constructor(a, op) {\n    this.op = op;\n    this.t = [[...a]];                          // t[j][i] = op over a[i .. i + 2^j - 1]\n    for (let j = 1; 1 << j <= a.length; j++) {\n      const prev = this.t[j - 1], half = 1 << (j - 1);\n      this.t.push(Array.from({ length: a.length - (1 << j) + 1 }, (_, i) => op(prev[i], prev[i + half])));\n    }\n  }\n  query(l, r) {                                 // op over a[l .. r], both ends included\n    const j = 31 - Math.clz32(r - l + 1);       // the largest power of two that fits in the range\n    return this.op(this.t[j][l], this.t[j][r - (1 << j) + 1]);   // two overlapping blocks cover [l, r]\n  }\n}\nconst assert = require(\"node:assert\");\n\nfunction lcpTools(s) {                            // the LCP of any two suffixes as an O(1) range minimum\n  const sa = suffixArray(s), lcp = lcpArray(s, sa), rank = new Array(s.length).fill(0);\n  sa.forEach((p, i) => { rank[p] = i; });\n  const table = s.length ? new SparseTable(lcp, Math.min) : null;\n  const lcpOf = (i, j) => {\n    if (i === j) return s.length - i;\n    const a = Math.min(rank[i], rank[j]), b = Math.max(rank[i], rank[j]);\n    return table.query(a + 1, b);                 // the minimum of the lcp values between the two ranks\n  };\n  return [sa, lcp, lcpOf];\n}\n\nfor (let r = 0; r < 300; r++) {\n  const al = Math.random() < 0.5 ? \"ab\" : \"abc\";\n  let s = \"\";\n  for (let i = 0, n = 1 + Math.floor(Math.random() * 14); i < n; i++) s += al[Math.floor(Math.random() * al.length)];\n  const n = s.length, [sa, lcp, lcpOf] = lcpTools(s);\n  assert.deepStrictEqual(sa, [...Array(n).keys()].sort((a, b) => (s.slice(a) < s.slice(b) ? -1 : 1)));\n  const set = new Set();\n  for (let i = 0; i < n; i++) for (let j = i + 1; j <= n; j++) set.add(s.slice(i, j));\n  const subs = [...set].sort((a, b) => (a < b ? -1 : 1));\n  assert.strictEqual(n * (n + 1) / 2 - lcp.reduce((a, b) => a + b, 0), subs.length);\n  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {\n    let h = 0;\n    while (i + h < n && j + h < n && s[i + h] === s[j + h]) h++;\n    assert.strictEqual(lcpOf(i, j), h);\n  }\n  subs.forEach((sub, k) => assert.strictEqual(kthDistinct(s, k + 1), sub));\n  let p = \"\";\n  for (let i = 0, m = 1 + Math.floor(Math.random() * 3); i < m; i++) p += \"abc\"[Math.floor(Math.random() * 3)];\n  const want = [];\n  for (let i = 0; i < n; i++) if (s.startsWith(p, i)) want.push(i);\n  assert.deepStrictEqual(findAll(s, sa, p), want);\n}\n\nconst big = \"a\".repeat(20000);\nconst [, lcpBig, lcpOfBig] = lcpTools(big);\nconsole.log(\"suffix arrays: 300 strings ok | a * 20000:\", big.length * (big.length + 1) / 2 - lcpBig.reduce((a, b) => a + b, 0), \"distinct substrings, longest repeat\", Math.max(...lcpBig), \"| lcp_of(0, 1) =\", lcpOfBig(0, 1));\n","out":"suffix arrays: 300 strings ok | a * 20000: 20000 distinct substrings, longest repeat 19999 | lcp_of(0, 1) = 19999"}]},"breakit":["Replace the doubling with a plain sort of suffix strings and time both on “a” × 20,000. Explain the difference with the cost of one comparison.","In Kasai, reset h to 0 for every suffix. The answers stay right; measure how much slower it gets on “a” × 20,000 and say why."]},{"id":"lab-geometry","t":"Exact geometry kit","min":80,"mods":["m07"],"goal":"Write the exact geometry predicates and algorithms in both languages, with BigInt in JavaScript, and test each one against a brute force or an independent method: Fraction-based intersection, Pick's theorem against counting, and hull corners against triangle containment.","pre":["Python 3.12+ and Node.js 22+","Module 07"],"steps":["`cross`, `orient` and `on_segment`, exact for coordinates up to 10⁹ (BigInt in JavaScript).","`intersect(p1, p2, p3, p4)`: four orientations, plus on-segment checks when one of them is 0.","`area2(poly)` (the shoelace sum) and `locate(poly, p)`: the boundary check first, then ray casting with the half-open rule.","`hull(points)` keeping corners only, and LeetCode 587's `outer_trees` keeping points on the edges; plus Pick's theorem for lattice points, with B = Σ gcd(|Δx|, |Δy|).","Tests: 3,000 random segment pairs against exact fractions, Pick's theorem against counting every lattice point, 300 random hulls against brute-force corners, and an orientation near 10¹⁸."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"def cross(o, a, b):                             # (a - o) x (b - o): > 0 left turn, < 0 right turn, 0 in line\n    return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])\n\ndef orient(o, a, b):                            # the sign of the cross product: 1, -1 or 0\n    c = cross(o, a, b)\n    return (c > 0) - (c < 0)\n\ndef on_segment(a, b, p):                        # p is in line with a and b: is it between them?\n    return min(a[0], b[0]) <= p[0] <= max(a[0], b[0]) and min(a[1], b[1]) <= p[1] <= max(a[1], b[1])\n\ndef intersect(p1, p2, p3, p4):                # do segments p1p2 and p3p4 share at least one point?\n    d1, d2 = orient(p3, p4, p1), orient(p3, p4, p2)\n    d3, d4 = orient(p1, p2, p3), orient(p1, p2, p4)\n    if d1 * d2 < 0 and d3 * d4 < 0:\n        return True                           # each segment straddles the other's line\n    return ((d1 == 0 and on_segment(p3, p4, p1)) or (d2 == 0 and on_segment(p3, p4, p2)) or\n            (d3 == 0 and on_segment(p1, p2, p3)) or (d4 == 0 and on_segment(p1, p2, p4)))\n\ndef area2(poly):                              # twice the signed area: > 0 when listed anticlockwise\n    return sum(cross((0, 0), poly[i], poly[(i + 1) % len(poly)]) for i in range(len(poly)))\n\ndef locate(poly, p):                          # \"INSIDE\", \"OUTSIDE\" or \"BOUNDARY\"\n    inside = False\n    for i in range(len(poly)):\n        a, b = poly[i], poly[(i + 1) % len(poly)]\n        o = orient(a, b, p)\n        if o == 0 and on_segment(a, b, p):\n            return \"BOUNDARY\"\n        if (a[1] > p[1]) != (b[1] > p[1]) and (o > 0) == (b[1] > a[1]):\n            inside = not inside               # this edge crosses the ray going right from p\n    return \"INSIDE\" if inside else \"OUTSIDE\"\n\ndef outer_trees(trees):                       # every tree on the fence, straight stretches included\n    pts = sorted(set(map(tuple, trees)))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        out = []\n        for p in seq:\n            while len(out) >= 2 and cross(out[-2], out[-1], p) < 0:   # pop right turns only\n                out.pop()\n            out.append(p)\n        return out\n    return sorted(set(chain(pts) + chain(pts[::-1])))   # both chains hold the ends; a set drops repeats\nimport random\nfrom fractions import Fraction\nfrom math import gcd\nrandom.seed(5)\n\ndef hull(points):                                 # corners only, anticlockwise\n    pts = sorted(set(points))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        out = []\n        for p in seq:\n            while len(out) >= 2 and cross(out[-2], out[-1], p) <= 0:\n                out.pop()\n            out.append(p)\n        return out\n    lower, upper = chain(pts), chain(pts[::-1])\n    return lower[:-1] + upper[:-1]\n\ndef lattice_points(poly):                         # Pick's theorem: (inside, on the boundary)\n    b = sum(gcd(abs(poly[i][0] - poly[i - 1][0]), abs(poly[i][1] - poly[i - 1][1])) for i in range(len(poly)))\n    return (abs(area2(poly)) - b + 2) // 2, b\n\ndef brute_intersect(p1, p2, p3, p4):\n    rx, ry, sx, sy = p2[0] - p1[0], p2[1] - p1[1], p4[0] - p3[0], p4[1] - p3[1]\n    den, qx, qy = rx * sy - ry * sx, p3[0] - p1[0], p3[1] - p1[1]\n    if den:\n        t, u = Fraction(qx * sy - qy * sx, den), Fraction(qx * ry - qy * rx, den)\n        return 0 <= t <= 1 and 0 <= u <= 1\n    if qx * ry - qy * rx:\n        return False\n    k = 0 if rx else 1\n    return max(min(p1[k], p2[k]), min(p3[k], p4[k])) <= min(max(p1[k], p2[k]), max(p3[k], p4[k]))\n\npt = lambda: (random.randint(-4, 4), random.randint(-4, 4))\nfor _ in range(3000):\n    p1, p2, p3, p4 = pt(), pt(), pt(), pt()\n    if p1 != p2 and p3 != p4:\n        assert intersect(p1, p2, p3, p4) == brute_intersect(p1, p2, p3, p4)\n\nshapes = [[(0, 0), (6, 0), (6, 4), (3, 2), (0, 4)], [(0, 0), (5, 0), (5, 5), (4, 5), (4, 1), (1, 1), (1, 5), (0, 5)],\n          [(0, 0), (4, 0), (2, 3)], [(2, 0), (4, 2), (2, 4), (0, 2)]]\nfor poly in shapes:\n    inside = sum(locate(poly, (x, y)) == \"INSIDE\" for x in range(-1, 8) for y in range(-1, 8))\n    boundary = sum(locate(poly, (x, y)) == \"BOUNDARY\" for x in range(-1, 8) for y in range(-1, 8))\n    assert lattice_points(poly) == (inside, boundary)        # Pick's theorem against counting every point\n\nfor _ in range(300):\n    pts = list({pt() for _ in range(random.randint(1, 10))})\n    h = hull(pts)\n    corner = lambda p: not any(orient(a, b, p) == 0 and on_segment(a, b, p) for a in pts for b in pts if a != p and b != p and a != b) and not any(\n        orient(a, b, c) != 0 and len({orient(a, b, p), orient(b, c, p), orient(c, a, p)} - {0}) <= 1\n        for a in pts for b in pts for c in pts if p not in (a, b, c) and len({a, b, c}) == 3)\n    assert sorted(h) == sorted(p for p in pts if corner(p))\n    on_fence = sorted(outer_trees([list(p) for p in pts]))\n    assert set(h) <= set(on_fence)\n\nbig = 10**9\nassert orient((0, 0), (big - 1, big - 2), (big - 2, big - 3)) == -1          # exact even near 10^18\nprint(\"geometry: 3000 segment pairs ok | Pick's theorem matches on 4 polygons | 300 hulls ok | exact at 10^9\")\n","out":"geometry: 3000 segment pairs ok | Pick's theorem matches on 4 polygons | 300 hulls ok | exact at 10^9"},{"lang":"javascript","src":"function cross(o, a, b) {                       // (a - o) x (b - o) as an exact BigInt: > 0 left, < 0 right, 0 in line\n  const ox = BigInt(o[0]), oy = BigInt(o[1]);\n  return (BigInt(a[0]) - ox) * (BigInt(b[1]) - oy) - (BigInt(a[1]) - oy) * (BigInt(b[0]) - ox);\n}\n\nfunction orient(o, a, b) {                      // the sign of the cross product: 1, -1 or 0\n  const c = cross(o, a, b);\n  return c > 0n ? 1 : c < 0n ? -1 : 0;\n}\n\nfunction onSegment(a, b, p) {                   // p is in line with a and b: is it between them?\n  return Math.min(a[0], b[0]) <= p[0] && p[0] <= Math.max(a[0], b[0]) && Math.min(a[1], b[1]) <= p[1] && p[1] <= Math.max(a[1], b[1]);\n}\n\nfunction intersect(p1, p2, p3, p4) {          // do segments p1p2 and p3p4 share at least one point?\n  const d1 = orient(p3, p4, p1), d2 = orient(p3, p4, p2);\n  const d3 = orient(p1, p2, p3), d4 = orient(p1, p2, p4);\n  if (d1 * d2 < 0 && d3 * d4 < 0) return true;   // each segment straddles the other's line\n  return (d1 === 0 && onSegment(p3, p4, p1)) || (d2 === 0 && onSegment(p3, p4, p2)) ||\n    (d3 === 0 && onSegment(p1, p2, p3)) || (d4 === 0 && onSegment(p1, p2, p4));\n}\n\nfunction area2(poly) {                        // twice the signed area: > 0 when listed anticlockwise\n  return poly.reduce((s, p, i) => s + cross([0, 0], p, poly[(i + 1) % poly.length]), 0n);\n}\n\nfunction locate(poly, p) {                    // \"INSIDE\", \"OUTSIDE\" or \"BOUNDARY\"\n  let inside = false;\n  for (let i = 0; i < poly.length; i++) {\n    const a = poly[i], b = poly[(i + 1) % poly.length], o = orient(a, b, p);\n    if (o === 0 && onSegment(a, b, p)) return \"BOUNDARY\";\n    if ((a[1] > p[1]) !== (b[1] > p[1]) && (o > 0) === (b[1] > a[1])) inside = !inside;   // crosses the ray to the right\n  }\n  return inside ? \"INSIDE\" : \"OUTSIDE\";\n}\n\nfunction outerTrees(trees) {                  // every tree on the fence, straight stretches included\n  const key = p => p[0] * 1000 + p[1];\n  const pts = [...new Map(trees.map(p => [key(p), p])).values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]);\n  if (pts.length <= 2) return pts;\n  const chain = seq => {\n    const out = [];\n    for (const p of seq) {\n      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) < 0n) out.pop();   // pop right turns only\n      out.push(p);\n    }\n    return out;\n  };\n  const both = [...chain(pts), ...chain([...pts].reverse())];   // both chains hold the ends; a Map drops repeats\n  return [...new Map(both.map(p => [key(p), p])).values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]);\n}\nconst assert = require(\"node:assert\");\nconst rnd = k => Math.floor(Math.random() * k);\n\nfunction hull(points) {                           // corners only, anticlockwise\n  const pts = [...new Map(points.map(p => [p.join(), p])).values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]);\n  if (pts.length <= 2) return pts;\n  const chain = seq => {\n    const out = [];\n    for (const p of seq) {\n      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) <= 0n) out.pop();\n      out.push(p);\n    }\n    return out;\n  };\n  const lower = chain(pts), upper = chain([...pts].reverse());\n  return [...lower.slice(0, -1), ...upper.slice(0, -1)];\n}\n\nconst gcd = (a, b) => (b === 0 ? a : gcd(b, a % b));\nfunction latticePoints(poly) {                    // Pick's theorem: [inside, on the boundary]\n  let b = 0;\n  poly.forEach((p, i) => { const q = poly[(i + poly.length - 1) % poly.length]; b += gcd(Math.abs(p[0] - q[0]), Math.abs(p[1] - q[1])); });\n  const a2 = area2(poly), absA2 = Number(a2 < 0n ? -a2 : a2);\n  return [(absA2 - b + 2) / 2, b];\n}\n\nfunction bruteIntersect(p1, p2, p3, p4) {\n  const rx = p2[0] - p1[0], ry = p2[1] - p1[1], sx = p4[0] - p3[0], sy = p4[1] - p3[1];\n  const den = rx * sy - ry * sx, qx = p3[0] - p1[0], qy = p3[1] - p1[1];\n  const inUnit = (num, d) => (d > 0 ? num >= 0 && num <= d : num <= 0 && num >= d);\n  if (den !== 0) return inUnit(qx * sy - qy * sx, den) && inUnit(qx * ry - qy * rx, den);\n  if (qx * ry - qy * rx !== 0) return false;\n  const k = rx !== 0 ? 0 : 1;\n  return Math.max(Math.min(p1[k], p2[k]), Math.min(p3[k], p4[k])) <= Math.min(Math.max(p1[k], p2[k]), Math.max(p3[k], p4[k]));\n}\n\nconst pt = () => [rnd(9) - 4, rnd(9) - 4];\nfor (let t = 0; t < 3000; t++) {\n  const p1 = pt(), p2 = pt(), p3 = pt(), p4 = pt();\n  if (p1.join() === p2.join() || p3.join() === p4.join()) continue;\n  assert.strictEqual(intersect(p1, p2, p3, p4), bruteIntersect(p1, p2, p3, p4));\n}\n\nconst shapes = [[[0, 0], [6, 0], [6, 4], [3, 2], [0, 4]], [[0, 0], [5, 0], [5, 5], [4, 5], [4, 1], [1, 1], [1, 5], [0, 5]],\n  [[0, 0], [4, 0], [2, 3]], [[2, 0], [4, 2], [2, 4], [0, 2]]];\nfor (const poly of shapes) {\n  let inside = 0, boundary = 0;\n  for (let x = -1; x < 8; x++) for (let y = -1; y < 8; y++) {\n    const where = locate(poly, [x, y]);\n    if (where === \"INSIDE\") inside++;\n    if (where === \"BOUNDARY\") boundary++;\n  }\n  assert.deepStrictEqual(latticePoints(poly), [inside, boundary]);   // Pick's theorem against counting every point\n}\n\nfor (let t = 0; t < 300; t++) {\n  const pts = [...new Map(Array.from({ length: 1 + rnd(10) }, () => { const p = pt(); return [p.join(), p]; })).values()];\n  const same = (a, b) => a[0] === b[0] && a[1] === b[1];\n  const corner = p => {\n    const rest = pts.filter(q => !same(q, p));\n    for (const a of rest) for (const b of rest) if (!same(a, b) && orient(a, b, p) === 0 && onSegment(a, b, p)) return false;\n    for (const a of rest) for (const b of rest) for (const c of rest) {\n      if (same(a, b) || same(b, c) || same(a, c) || orient(a, b, c) === 0) continue;\n      const s = new Set([orient(a, b, p), orient(b, c, p), orient(c, a, p)]);\n      s.delete(0);\n      if (s.size <= 1) return false;\n    }\n    return true;\n  };\n  const key = p => p.join();\n  assert.deepStrictEqual(hull(pts).map(key).sort(), pts.filter(corner).map(key).sort());\n  const fence = new Set(outerTrees(pts).map(key));\n  for (const p of hull(pts)) assert.ok(fence.has(key(p)));\n}\n\nconst big = 1e9;\nassert.strictEqual(orient([0, 0], [big - 1, big - 2], [big - 2, big - 3]), -1);   // exact even near 10^18\nconsole.log(\"geometry: 3000 segment pairs ok | Pick's theorem matches on 4 polygons | 300 hulls ok | exact at 10^9\");\n","out":"geometry: 3000 segment pairs ok | Pick's theorem matches on 4 polygons | 300 hulls ok | exact at 10^9"}]},"breakit":["Compute the cross product with floats (plain Numbers in JavaScript) and run the 10⁹ orientation test: find the first case that comes out wrong.","Drop the half-open rule in locate and count every edge the ray touches. Find a polygon and a point whose answer flips."]},{"id":"capstone","capstone":true,"t":"Expert library, a problem you set, and the contest log","min":900,"mods":["m01","m02","m03","m04","m05","m06","m07","m08","m09","m10"],"goal":"Turn the five labs and the module templates into one tested contest library in **both** Python and JavaScript, set and stress-test one original problem with a full problem package, and keep the problem and contest log that proves L4.","deliver":["A repo with `python/` and `js/` folders: the five labs plus the module templates (Dinic, Hungarian, min-cost flow, binary lifting, suffix array, sparse table, Li Chao tree, monotone convex hull trick, matrix power, SOS DP), with the same API names in both languages.","A stress test for every routine: a brute force, a seeded generator (the mulberry32 helper from module 10, so both languages see the same tests) and a comparison loop, plus edge-case and extreme-value tests.","One original problem: statement, constraints, model solution, brute force, validator, generator, at least 20 tests (edge, random, anti-heuristic and maximum size) and a one-page editorial with a proof sketch and the complexity.","A log of the module problems (about 70) with the technique, the proof idea and any mistake for each, and five-line reviews of 8 contests."],"rubric":["Every routine passes its stress test in both languages, including the large inputs (10⁵ vertices, 2 × 10⁵ queries) with no recursion errors.","Every routine in the README states its time and space complexity, with amortised and expected costs marked.","Your problem's model solution and brute force agree on every small test, the validator accepts every test file, and at least two plausible wrong solutions fail your tests.","You can type Dinic, Kuhn, binary lifting, the suffix array with Kasai, and the monotone chain from a blank file in under 10 minutes each.","You can explain any one technique to an L2 learner in five minutes: the idea, an example, why it's correct and what it costs."],"steps":["Create the re
