{
  id: "a07", d: "d2", t: "Foundry workflows: visual multi-step and human-in-the-loop", min: 70,
  hook: "\"Build autonomous or semiautonomous workflows with safeguards and approval flow controls\" and \"Design workflows\". Foundry workflows let you chain agents and logic visually, with Power Fx conditions and human-in-the-loop steps. **Heads-up:** Microsoft retires Foundry workflows on **1 Dec 2026** and recommends Microsoft Agent Framework for new workflows (or Logic Apps / A2A); the outline still names workflows, so learn both.",
  pre: { q: "A triage agent outputs `{\"category\": \"Billing\", \"confidence\": 0.42}`. In a workflow, how would you stop a low-confidence ticket from being routed automatically?", a: "Add an **If/Else** node with a Power Fx condition such as `Local.TriageJson.confidence > 0.6`; the *else* branch asks the user for more information (or sends it to a human) instead of routing." },
  story: [
    "A workflow is a **railway map** for work. Stations are **nodes**: invoke an agent, ask the user a question, send a message, set a variable, branch with If/Else, loop with For each, jump with Go to, end. Tracks are the order. Signals are **Power Fx** conditions that decide which branch a ticket takes.",
    "Tailspin Toys built a support workflow in **Build > Agents > Workflows**. Step one invokes a **triage agent** whose output is structured JSON (category and confidence), using a JSON-schema text format on the node, saved into variables (`Local.TriageOutputText`, `Local.TriageOutputJson`). An If/Else node checks the confidence: below 0.6, an **Ask a question** node requests more detail and loops back. Billing tickets go to a human escalation path; others go to a **resolution agent**.",
    "Workflows are saved as **immutable versions**: nothing auto-saves, and each save is a new version. The visual canvas and the **YAML** view stay in sync, so you can review changes like code. Templates give you a head start: **sequential**, **human-in-the-loop** and **group chat**.",
    "To run a workflow from code, you reference it by name just like an agent and usually **stream** the response so you can show progress events as each node runs. A human-in-the-loop workflow **pauses** at a question; you send another message to resume."
  ],
  breaks: "Trains never improvise. Agent nodes inside a workflow still use models, so a node's output can vary. Validate structured outputs and design branches for unexpected values.",
  dia: [
    { type: "flow", cap: "Tailspin's support workflow", steps: [["Start", "Local.CurrentTicket"], ["Invoke triage agent", "JSON: category + confidence"], ["If confidence > 0.6", "else → Ask a question → back"], ["If category = Billing", "→ human escalation"], ["Invoke resolution agent", "draft answer"], ["Send message → End", ""]] },
    { type: "layers", cap: "Workflow node types", rows: [["Invoke", "agent (new or existing), with input message and saved outputs"], ["Flow", "If/Else, Go to, For each"], ["Data transformation", "Set variable, Reset variable, Parse value"], ["Basics / chat", "Send message, Ask a question (pauses for the user)"], ["End", "finish the run"]] }
  ],
  keys: [
    "Create: **Build > Agents > Workflows > Create**: blank or templates (**sequential**, **human-in-the-loop**, **group chat**).",
    "Nodes: **Invoke agent**; flow control **If/Else, Go to, For each**; data **Set variable, Reset variable, Parse value**; chat **Send message, Ask a question**; **End**.",
    "Variables: `Local.<name>` (workflow scope) and `System.<name>` (built-in). Expressions use **Power Fx**: comparisons, `If`, `IsBlank`, `IsEmpty`, `Upper`, `Lower`, `Len`, `Concatenate`, `Sum`, `Count`, `ForAll`.",
    "Invoke-agent node settings: the input message (e.g. `Local.CurrentTicket`), *save agent output message as* (text variable) and *save output json_object as* (JSON variable) when the agent's text format is a **JSON schema**.",
    "Saves are manual and each save creates an **immutable version**; the visual designer and YAML stay synchronised; nodes can carry notes.",
    "Run from code: `responses.create(conversation=conv.id, extra_body={\"agent_reference\": {\"name\": workflow_name, \"type\": \"agent_reference\"}}, input=\"Start\", stream=True)`, then watch streamed events (`response.output_item.done` items of the workflow-action type report node status; `response.completed` ends).",
    "**Human-in-the-loop**: an Ask-a-question node pauses the run; another user message resumes it. Use it for approvals and missing information.",
    "Safeguards: confidence thresholds in conditions, explicit escalation branches, structured outputs between nodes, loop limits, and guardrails on the agents inside.",
    "The migration guide maps classic *connected agents* to the **A2A tool** in the new Agent Service; for code-first multi-agent orchestration use **Microsoft Agent Framework**.",
    "**Retirement (checked 2 Oct 2026):** Foundry workflows (visual designer and in-portal runs) retire on **1 Dec 2026**. Migration paths: **Microsoft Agent Framework** (recommended; declarative YAML or code, same patterns), **Azure Logic Apps** (visual designer) or **A2A** for simple agent-to-agent calls."
  ],
  cmp: [{ cap: "Workflow vs single agent vs code orchestration", head: ["", "Single agent", "Foundry workflow", "Agent Framework (code)"], rows: [["Control flow", "Model decides", "Explicit nodes + Power Fx", "Explicit graph in code"], ["Human steps", "Approvals on tools", "Ask-a-question / HITL template", "Request-info events"], ["Who builds it", "Anyone", "Low-code makers + devs", "Developers"], ["Versioning", "Agent versions", "Immutable workflow versions + YAML", "Git"]] }],
  code: [{ t: "Run a workflow and stream its progress", lang: "python", src: `conv = oc.conversations.create()

{

  hook: "\"Implement orchestrated multi-agent solutions\" and \"orchestrate multiple models, flows\". Microsoft Agent Framework (the successor to Semantic Kernel and AutoGen) gives you code-level agents and five orchestration patterns you must tell apart.",
  pre: { q: "Three agents each review a contract independently (legal, finance, security) and you combine their findings. Which orchestration pattern is that?", a: "**Concurrent** (fan-out/fan-in): independent agents work in parallel on the same input, then results are aggregated." },
  story: [
    "Agent Framework is a **film studio** for agents written in Python or .NET. Each **Agent** has a chat client (Foundry, Azure OpenAI, OpenAI, Anthropic, Ollama and more), instructions and tools. **Function tools** are plain Python functions; type hints and descriptions become their schema, and `@tool(approval_mode=\"always_require\")` makes them pause for approval. **Sessions** keep conversation history; **context providers** add memory; **middleware** can log, authorise or block calls.",
    "Multi-agent work follows recognisable scripts. **Sequential**: a pipeline where each agent builds on the previous one (draft → review → polish). **Concurrent**: several agents work on the same input in parallel and results are merged (independent reviews, voting). **Group chat**: a chat manager picks who speaks next in a shared conversation, ideal for maker-checker loops with two or three agents. **Handoff**: one agent at a time owns the conversation and transfers control dynamically, like triage passing to billing or tech support. **Magentic**: a manager agent plans open-ended work with a **task ledger** and tracks it with a **progress ledger**, assigning steps to specialists; powerful but slow.",
    "Underneath, **workflows** are graphs of **executors** connected by **edges** (direct, conditional, switch-case, fan-out, fan-in) that emit events and can **checkpoint** progress so long runs can resume.",
    "Wingtip's marketing team used **sequential** for copywriting, **concurrent** for compliance checks, and **handoff** for their customer-service triage. They avoided magentic for routine tasks because of its latency and cost."
  ],
  breaks: "Film crews talk freely. Free conversation between agents (group chat, magentic) costs tokens and can loop. Cap rounds, set termination conditions, and prefer the simplest pattern that works.",
  dia: [
    { type: "hub", cap: "Five orchestration patterns", core: "Which pattern?", spokes: [["Sequential", "fixed pipeline; each step builds on the last; no backtracking"], ["Concurrent", "parallel independent agents → aggregate (fan-out/fan-in)"], ["Group chat", "manager picks next speaker; maker-checker; ≤3 agents works best"], ["Handoff", "dynamic transfer of control, one active agent; watch for loops"], ["Magentic", "manager plans with task + progress ledgers; open-ended; slow"]] },
    { type: "flow", cap: "Sequential pipeline (SequentialBuilder)", steps: [["Summariser", "condense the input"], ["Classifier", "label it"], ["Action agent", "recommend next step"]], loop: "Concurrent would run all three on the same input instead" }

    "Function tools: plain functions with type hints and docstrings (or `Annotated[..., Field(description=...)]`), or `@tool(name=..., description=..., approval_mode=\"always_require\"|\"never_require\")`.",
    "History: service-side for Foundry Agent Service and Responses-based clients; local in-memory for Chat Completions clients.",
    "**Sequential**: fixed order, each agent sees prior output; simple and predictable; can't backtrack.",
    "**Concurrent**: same input to several agents in parallel, then aggregate (ensemble, voting, independent reviews); don't use when steps depend on each other.",
    "**Group chat**: a manager chooses the next speaker each round (can ask the user, terminate, filter results); best for refinement and maker-checker; keep to about three agents.",

  code: [{ t: "An agent with a tool, then a sequential workflow", lang: "python", src: `import asyncio
from agent_framework import Agent, tool
from agent_framework.foundry import FoundryChatClient
from agent_framework.orchestrations import SequentialBuilder
from azure.identity import AzureCliCredential

@tool(approval_mode="never_require")
def get_policy(topic: str) -> str:
    """Return the expense policy text for a topic."""
    return POLICIES.get(topic, "No policy found.")

async def main():
    client = FoundryChatClient(project_endpoint=ENDPOINT, model=DEPLOYMENT,
                               credential=AzureCliCredential())
    async with Agent(client=client, name="PolicyAgent",
                     instructions="Answer expense questions using get_policy.",
                     tools=[get_policy]) as agent:
        print((await agent.run("Can I expense a taxi to the airport?")).text)

    summariser = client.as_agent(name="Summariser", instructions="Summarise the request.")
    classifier = client.as_agent(name="Classifier", instructions="Classify it.")
    responder = client.as_agent(name="Responder", instructions="Recommend an action.")
    workflow = SequentialBuilder(participants=[summariser, classifier, responder]).build()
    result = await workflow.run("Customer reports duplicate charge on invoice 1182")
    print(result.get_outputs())

  story: [

    "A **routing agent** reads the badges, picks the right specialist and sends a **message** (made of parts such as text). Short jobs come back as a direct message; longer ones become a **task** with states (working, completed…) that you poll or stream.",
    "Fabrikam's travel company used it like this: their in-house **routing agent** (built in Foundry) delegated *find flights* to a partner's flight agent (built with a different framework, hosted elsewhere) and *check visa rules* to a government-data agent, both over A2A. Each agent kept its own model, tools and security.",
    "On the server side, the A2A SDK separates protocol from logic: you implement an **AgentExecutor** (`execute`, `cancel`) that updates task status through an event queue, wrap it in a request handler with a task store, and serve it as an HTTP app. On the client side, a **card resolver** fetches the card and a client sends messages."

from a2a.server.agent_execution import AgentExecutor
from a2a.server.tasks import TaskUpdater
from a2a.types import TaskState
from a2a.utils import new_agent_text_message

skill = AgentSkill(id="visa_rules", name="Visa rules",
                   description="Explains visa requirements for a trip",
                   tags=["travel"], examples=["Do I need a visa for Japan?"])
card = AgentCard(name="visa-agent", description="Visa requirement expert",
                 url="https://visa.example.com/", version="1.0.0",
                 default_input_modes=["text"], default_output_modes=["text"],
                 capabilities=AgentCapabilities(streaming=True), skills=[skill])

class VisaExecutor(AgentExecutor):
    async def execute(self, context, event_queue):
        updater = TaskUpdater(event_queue, context.task_id, context.context_id)
        await updater.update_status(TaskState.working,
                                    message=new_agent_text_message("Checking rules…"))

        await updater.complete(message=new_agent_text_message(answer))

        instructions="You are a friendly airline assistant. Keep answers short.",
        input_audio_format=InputAudioFormat.PCM16,
        output_audio_format=OutputAudioFormat.PCM16,

        input_audio_echo_cancellation=AudioEchoCancellation()))

  story: [
    "A multimodal model is a **colleague who can see**: you hand over one or more pictures with a question and get a written answer. In Foundry you use vision-capable models (GPT-4.1, GPT-4.1-mini, the GPT-5 family, Phi-4-multimodal) through the same Responses or Chat Completions APIs. The image travels as a URL or a base64 **data URL**, as an `input_image` part next to your `input_text`.",

    "For visual Q&A, Northwind tells the model to **ground every answer in what is visible** (\"describe the evidence you see; if it isn't visible, say you can't tell\"). That reduces confident guesses, just as grounding instructions do for text.",

{

  pre: { q: "`videos.create(...)` returns immediately. Why doesn't it return the video file?", a: "Video generation takes minutes, so it's an **asynchronous job**. You get a video id with status `queued`/`in_progress`, poll `videos.retrieve(id)` until `completed`, then download the content." },
  story: [
    "Making a Sora 2 video is like commissioning a **short film crew**. You hand over a shot description, and they go away to film it. You check back (poll) until they say it's done, then collect the footage.",
    "The brief works best like a director's note: **one camera move and one action per shot** (\"slow dolly-in on a barista pouring latte art, morning light\"). Clips are short (**4, 8 or 12 seconds**, default 4) in **1280×720 or 720×1280**, and Sora 2 generates **audio** too. Longer stories are stitched from several clips.",
    "You can anchor the first frame with an **input reference image** (JPEG, PNG or WebP) matching the output size, which suits a product shot. And you can edit a generated video with **remix**: give the original video id and a focused change (\"same shot, switch to an 85 mm lens\"). Remix returns a new video id; make one change per remix for predictable results.",
    "The crew has rules: no real people or public figures, no copyrighted characters or music, and nothing unsuitable for under-18s. Requests that break them are refused."
  ],
  breaks: "A film crew can reshoot just the last second. Remix changes the whole generated clip according to your instruction; small, specific changes work best, and you can't edit uploaded real-world footage this way.",
  dia: [
    { type: "seq", cap: "Async video job", actors: ["App", "Sora 2 deployment"], msgs: [["App", "Sora 2 deployment", "videos.create(prompt, size, seconds, input_reference?)"], ["Sora 2 deployment", "App", "id, status: queued", true], ["App", "Sora 2 deployment", "videos.retrieve(id) (poll)"], ["Sora 2 deployment", "App", "status: in_progress → completed", true], ["App", "Sora 2 deployment", "videos.download_content(id, variant=\"video\")"], ["App", "Sora 2 deployment", "videos.remix(video_id, prompt) → new id"]] }

  code: [{ t: "Create, poll, download and remix", lang: "python", src: `import time

video = client.videos.create(model="sora-2",
    prompt="Slow dolly-in on a barista pouring latte art, warm morning light",
    size="1280x720", seconds="8",
    input_reference=open("cafe_first_frame.png", "rb"))

while video.status in ("queued", "in_progress"):
    time.sleep(15)
    video = client.videos.retrieve(video.id)

if video.status == "completed":
    client.videos.download_content(video.id, variant="video").write_to_file("latte.mp4")
    remix = client.videos.remix(video_id=video.id,
                                prompt="Same shot, but switch to an 85mm lens")

  story: [

{
  id: "v05", d: "d3", t: "Content Understanding for images and video", min: 65,
  hook: "Content Understanding (CU) appears in D3 and D5. In D3 it's about **visual characteristics**, **video segment analysis**, **objects and regions**, and **single-task vs pro-mode** pipelines.",
  pre: { q: "You need the same fields (damage type, severity, part) from 10,000 inspection photos. Free-form vision prompts or a CU analyzer?", a: "A **Content Understanding analyzer** based on the image analyzer with a field schema (classify/generate fields): consistent fields every time. Note: only **document** analyzers return per-field **confidence** and **grounding**, so for photos you validate allowed values and sample-review critical results." },
  story: [
    "Content Understanding is a **customs inspection desk** for media. You design the inspection form once (the **analyzer**): which base analyzer to start from (document, image, audio, video), which **fields** to fill, and how each field is filled: **extract** (copy a value that's visibly there), **classify** (pick from a fixed list) or **generate** (write a summary or inference). Every item that passes the desk gets the same form. **Document** analyzers can also return **confidence scores** and **grounding** (where the evidence was found) for each field when `estimateFieldSourceAndConfidence` is on; image, audio and video analyzers return the fields without them.",
    "For **images**, Litware's quality team built an analyzer from `prebuilt-image` with fields like `Defect` (classify: scratch, dent, crack, none), `Component` (classify: door, hinge, panel), `Severity` (classify: low, medium, high) and `Description` (generate). Image analyzers don't return confidence, so every *crack* or *high* result goes to an inspector and a weekly sample is spot-checked.",
    "For **video**, CU splits footage into **segments** (shots and scenes), picks **keyframes**, transcribes speech and can produce per-segment summaries and fields: chapters for training videos, or flagged moments in safety footage. The `prebuilt-videoSearch` analyzer returns retrieval-ready output for RAG. Face-related description features require additional approval and consent.",
    "The exam outline names two pipeline styles. **Single-task** (standard) analyzers handle one file with one analyzer, for any modality, with extract/classify/generate fields (confidence and grounding on documents only). **Pro mode** was **documents only**: it reasoned across **multiple documents** and **reference data** you supply (e.g. check an invoice against the contract), using classify/generate fields, without confidence or grounding. Reality check (Oct 2026): pro mode existed only in the 2025-05-01-preview API, which is retired; the GA API (2025-11-01) has no mode setting, and the successor is **agentic mode** (2026-06-01-preview), which reasons over evidence in a document but at first accepts one input file per request and doesn't support extract fields. Learn both: the exam may still ask about pro mode."
  ],
  breaks: "Customs forms are filled by trained officers. CU uses generative models underneath, so add validation (allowed values, ranges) and human review for low confidence, especially for safety decisions.",
  dia: [
    { type: "flow", cap: "How Content Understanding processes media", steps: [["Input", "document, image, audio, video"], ["Analyzer", "base analyzer + field schema + models + config"], ["Content extraction", "OCR, layout, transcription, segmentation"], ["Field extraction", "extract · classify · generate"], ["Output", "markdown + fields (+ confidence & grounding for documents)"]] },
    { type: "quad", cap: "Standard vs pro mode", x0: "single file", x1: "multiple files + reference data", y0: "documents only", y1: "all modalities", cells: [["Standard mode", "images, audio, video, documents · confidence + grounding on documents only"], ["(not applicable)", "pro mode doesn't cover non-document media"], ["Standard on documents", "fields from one document"], ["Pro mode (retired preview; now agentic mode)", "cross-document reasoning and validation · classify/generate only · no confidence/grounding"]] }
  ],
  keys: [
    "CU is a Foundry Tool that turns documents, images, audio and video into **markdown** (for RAG) and **structured fields** (for automation).",
    "Analyzer = **base analyzer** (e.g. `prebuilt-image`, `prebuilt-video`, `prebuilt-document`) + **field schema** + model configuration + settings. Prebuilt analyzers include read, layout, document, image, invoice, receipt, ID document, audio search, video search, call centre and document search.",
    "Field methods: **extract** (verbatim value; standard mode only), **classify** (enum), **generate** (summaries, inferences). Up to about 100 fields per analyzer.",
    "**Single-task (standard) pipelines**: one file, one analyzer, any modality, cost/latency-optimised. **Confidence (0–1) and grounding** come only from **document** analyzers with `estimateFieldSourceAndConfidence` enabled; image, audio and video analyzers return no confidence.",
    "**Pro mode** (exam-outline term): documents only; multi-document reasoning with reference data supplied when the analyzer is created; cross-document validation; classify/generate fields only; **no confidence or grounding**. It lived only in the retired 2025-05-01-preview API; the successor is **agentic mode** (2026-06-01-preview: one input file per request at first, no extract fields).",
    "Video analysis: segmentation (shots, scenes), keyframes, transcript, chapters, per-segment summaries and fields; `prebuilt-videoSearch` produces retrieval-ready output. Face description features need approval and consent.",
    "Identifying objects, components or regions: define classify/generate fields per component. Image analyzers return no confidence or grounding, so validate values against allowed lists and route critical results to review.",
    "Prerequisites: a Foundry resource in a supported region with default model deployments configured (e.g. GPT-4.1, GPT-4.1-mini, text-embedding-3-large).",
    "Confidence routing (document analyzers): ≥ 0.9 auto-accept, 0.7–0.9 review if the field is critical, < 0.7 manual."

{
  id: "x03", d: "d5", t: "Azure AI Search: ingest, enrich and index", min: 75,
  hook: "\"Ingest and index content\", \"implement enrichment by using custom or built-in skills\", and \"monitor data ingestion quality and search index health\". Azure AI Search's indexer pipeline is the backbone of enterprise RAG.",
  pre: { q: "A Blob container holds scanned PDFs. After indexing, searches can't find words that only appear in the scans. What's missing from the indexer pipeline?", a: "An **OCR skill** in a skillset (with image extraction enabled) to read text from images, typically merged back into the content with a **merge skill**, and an attached Foundry resource for billing." },
  story: [
    "Azure AI Search is a **library with an automated cataloguing team**. A **data source** says where the books are (Blob Storage, ADLS Gen2, Azure SQL, Cosmos DB, OneLake…). An **indexer** is the cataloguer: it **cracks** each document open (extracts text and images), runs an optional **skillset** of AI skills to enrich it, maps the results into fields, and writes them to the **index**, the catalogue that queries search. It runs on a schedule and picks up changes.",
    "Each skill reads from and writes to an **enrichment tree**, a growing JSON-like structure per document: `/document/content` is the extracted text, `/document/normalized_images/*` are images, and skills add nodes such as `/document/normalized_images/*/text` (OCR output) or `/document/merged_content`. Built-in skills cover OCR, image analysis, language detection, entity recognition, PII, translation, **text split** (chunking), **text merge**, the **shaper**, **Azure OpenAI embedding** (vectors), **document layout**, and GenAI prompt skills. When nothing fits, a **custom Web API skill** (usually an Azure Function) plugs in your own code using a simple `values` / `recordId` / `data` contract.",
    "Enrichments can also be saved to a **knowledge store**: object projections (JSON in Blob), table projections (Table storage) and file projections (images), handy for analytics or Power BI.",
    "Litware's index broke quietly one week: a new batch of PDFs was password-protected, so the indexer logged failures and the document count stopped growing. They now watch **indexer execution history** (success, failed and warning items), document counts, storage and query latency, and alert on failures."
  ],

{

  hook: "\"Configure semantic search, hybrid search, and vector search for grounding\", \"configure RAG ingestion flow, including OCR\", and \"connect retrieval pipelines directly to workflows and agent tools\". This module completes the RAG story end to end.",
  pre: { q: "What does the semantic ranker change: which documents are retrieved, or their order?", a: "Their **order** (and it adds captions and answers). It re-ranks the top results from a keyword or hybrid query using a language model; it doesn't find documents the first stage missed." },
  story: [
    "A search query is a **two-stage talent show**. Stage one finds candidates. **Keyword search** (BM25) uses the **simple** or **full Lucene** syntax (fuzzy `~`, proximity, boosting `^`, wildcards, regex) with **filters** (`$filter`), **facets** and **sorting**. **Vector search** finds nearest neighbours by meaning, with a `VectorizedQuery` (you pass the vector) or a `VectorizableTextQuery` (the index's vectorizer embeds the text). **Hybrid search** runs both and fuses the rankings with **Reciprocal Rank Fusion (RRF)**.",
    "Stage two is the judges: the **semantic ranker** re-scores the top results (about 50) with a language model and can return **captions** (key sentences) and **answers** (extracted spans). It needs a **semantic configuration** naming the title, content and keyword fields.",
    "Adventure Works built their **RAG ingestion pipeline** like the official lab: Content Understanding turns each document (including scans, via OCR and layout) into markdown; a script chunks by paragraph (about 2,000 characters), embeds each chunk with text-embedding-3-large (3,072 dimensions) and uploads to an index with a vector field; a manifest of file hashes means only changed files are reprocessed. A watch mode picks up new files automatically.",
    "Finally the pipeline connects to consumers: an **agent** gets the Azure AI Search tool (or a **Foundry IQ** knowledge base via MCP), a **workflow** has a retrieval step, and a plain app runs hybrid queries then prompts the model to answer only from the retrieved chunks with citations."
  ],
  breaks: "Talent-show judges only see who made the shortlist. If stage one misses the right document (bad chunking, wrong embedding model, vector-only search for codes), no re-ranker can bring it back.",
  dia: [
    { type: "flow", cap: "Query time: two stages", steps: [["Query", "text (+ filters)"], ["Stage 1", "keyword BM25 + vector kNN → RRF (hybrid)"], ["Stage 2", "semantic ranker on top ~50 → captions, answers"], ["Top k", "chunks + metadata"], ["Generate", "grounded answer with citations"]] },
    { type: "flow", cap: "RAG ingestion (lab pattern)", steps: [["Files", "PDF, scans, Office"], ["Content Understanding", "OCR + layout → markdown"], ["Chunk", "~2,000 chars by paragraph"], ["Embed", "text-embedding-3-large (3,072 dims)"], ["Upload", "index with vector field"], ["Change detection", "hash manifest / watch mode"]] }
  ],
  keys: [
    "Query parameters: `search` (text), `searchFields`, `select`, `$filter` (OData; string values are case-sensitive), `$orderby` (sortable fields), `facet`, `top`/`skip`, `searchMode` (any/all), `count`. `queryType=full` enables Lucene syntax: fuzzy `~`, proximity, boosting `^`, wildcards, regex.",
    "Scoring: BM25 relevance; **scoring profiles** boost fields or freshness.",
    "**Vector search**: `VectorizedQuery(vector=..., k_nearest_neighbors=..., fields=\"content_vector\")`, or `VectorizableTextQuery(text=...)` when the index has a **vectorizer**. Algorithms: HNSW (approximate, fast) or exhaustive KNN (exact, slower).",
    "**Hybrid**: pass `search_text` **and** `vector_queries` in the same request; results are fused with **RRF**. Usually the best default for grounding.",
    "**Semantic ranker**: `query_type=\"semantic\"` + `semantic_configuration_name`; re-ranks top results, adds captions and answers. It improves order, not recall.",
    "Embedding consistency: same model and dimensions for documents and queries (e.g. text-embedding-3-large = 3,072 dimensions).",
    "RAG ingestion with OCR: extract (CU or DI layout) → markdown → chunk (with sensible boundaries/overlap) → embed → index; track changes (hashes) so you only reprocess what changed.",
    "Connect retrieval to consumers: Azure AI Search tool on an agent, Foundry IQ knowledge bases (MCP), workflows with a retrieval step, or your own code; always pass citations back to users.",
    "Measure relevance with labelled queries (precision@k, recall, nDCG) and retrieval/groundedness evaluators; tune chunking, fields, weights and the semantic configuration."
  ],

HUB.interview = [
{ c: "Architecture and design", q: "Walk me through how you'd design a customer-support agent on Microsoft Foundry.", a: "I'd start from requirements: channels, data sources, actions, risk and SLAs. A prompt agent in Foundry Agent Service with clear instructions; knowledge through a Foundry IQ knowledge base (or Azure AI Search tool) with citations; actions through OpenAPI or MCP tools with managed identity and approvals for anything high-impact; a guardrail with Prompt Shields for indirect attacks.\n\nOperationally: tracing to Application Insights, continuous evaluation for groundedness and task adherence, quotas sized with headroom and backoff, and a CI/CD pipeline with an evaluation gate. I'd publish as an agent application with its own identity and least-privilege roles.", f: ["How would you handle a request the agent can't answer?", "What would you monitor in the first week?"] },
{ c: "Architecture and design", q: "When would you choose RAG, fine-tuning, or just prompt engineering?", a: "Prompting first: it's cheap and fast. RAG when the model needs private, changing or citable knowledge. Fine-tuning when behaviour (format, tone, tool use) stays inconsistent despite good prompts, or to shorten prompts or distil to a smaller model. They combine: prompt + RAG is the most common pattern, and fine-tuned models still use RAG for facts.", f: ["How do you prove fine-tuning helped?"] },
{ c: "Architecture and design", q: "How do you choose a model for a new workload?", a: "Classify the task: fixed NLP/speech/extraction tasks often suit a Foundry Tool; generation suits an LLM; multi-step logic a reasoning model; edge/offline a small model. Shortlist with the leaderboard (quality, safety, cost, latency), then evaluate finalists on our own data. For mixed traffic, consider the model router or a cascade.", f: ["What safety benchmarks do you look at?"] },
{ c: "Building agents", q: "Explain how function calling works and how you'd make it safe.", a: "The model returns a function_call item with arguments; my code validates and executes the function and returns function_call_output with the call_id; the model writes the final answer. Safety: strict JSON schemas, server-side validation and authorisation of arguments, least-privilege credentials, approvals for high-impact actions, and logging every call.", f: ["What if the model invents an argument value?"] },
{ c: "Building agents", q: "MCP or A2A: what's the difference and when do you use each?", a: "MCP connects an agent to tools and data: the calling agent controls each tool call, and servers can be shared across apps. A2A connects agents to agents: you delegate a whole task to an opaque agent with its own reasoning and tools, discovered through its agent card. Shared tool servers → MCP; cross-team or vendor agents → A2A.", f: ["How do you secure a third-party MCP server?"] },
{ c: "Building agents", q: "Which multi-agent orchestration patterns do you know, and how do you choose?", a: "Sequential for fixed pipelines, concurrent for independent parallel work, group chat for maker-checker iteration, handoff for dynamic transfer of control, magentic for open-ended planning. I choose the simplest that meets the need, because each agent hop adds latency, cost and failure points, and I add loop limits and termination conditions.", f: ["Give an example where multi-agent was a mistake."] },
{ c: "Safety and governance", q: "How do you protect an agent from prompt injection?", a: "Defence in depth: Prompt Shields for user and indirect attacks (documents, tool responses, text in images); delimiting untrusted data and instructions to treat it as data; least-privilege tools and identities; approvals for risky actions; output validation; and red-teaming with the AI Red Teaming Agent to measure attack success rate.", f: ["What's an indirect attack? Give an example."] },
{ c: "Safety and governance", q: "What happens when a content filter blocks a request, and how should the app respond?", a: "A blocked prompt returns HTTP 400 with code content_filter; a blocked output returns HTTP 200 with finish_reason content_filter (incomplete in the Responses API) and may be cut off mid-stream. The app should show a helpful message, avoid retrying the same input, log the event, and for outputs handle the partial text gracefully.", f: ["How would you tune thresholds for a children's app?"] },
{ c: "Safety and governance", q: "How would you secure a Foundry deployment for a regulated client?", a: "Entra ID only (disable key auth), managed identities with least-privilege roles (Foundry User, Agent Consumer), per-agent identities after publishing, private endpoints with public access disabled, standard agent setup with our own Cosmos DB/Storage/Search in the VNet, Key Vault for secrets, CMK if required, Data Zone deployments for residency, and auditing via tracing and approval logs.", f: ["What changes when an agent is published?"] },
{ c: "Operations", q: "Users report the agent got slower. How do you troubleshoot?", a: "Check traces first: which span grew (model call, a tool, retrieval)? Then metrics: 429s and retries, token counts (bigger context?), deployment latency. If a tool is slow, look at that service (e.g. search query latency or indexer issues). Fix the cause: trim context, cache, tune the tool, adjust quota or model.", f: ["How do you know whether quality also dropped?"] },
{ c: "Operations", q: "How do you evaluate an agent before and after release?", a: "Before: a representative dataset (real or synthetic) scored with groundedness, relevance, task adherence, intent resolution, tool call accuracy and safety evaluators, plus red-teaming; slice low scores for error analysis. In CI: the ai-agent-evals action comparing versions. After: continuous evaluation on sampled traffic, scheduled evaluations for drift, alerts on score drops.", f: ["How do you avoid LLM-judge bias?"] },
{ c: "Operations", q: "How do you handle throttling (429) in production?", a: "Set realistic max output tokens, implement exponential backoff with jitter honouring retry-after, smooth bursts with queues or concurrency limits, spread load across deployments or regions, request more quota, use Batch for bulk work and PTU for steady high volume. Monitor remaining-tokens headers and 429 rates.", f: ["When is PTU worth the cost?"] },
{ c: "Multimodal and data", q: "Design an intake pipeline for scanned forms, photos and voice notes.", a: "Content Understanding analyzers: document analyzers for forms (fields with confidence and grounding, markdown for RAG), an image analyzer with classify fields for photos (no confidence, so validate and sample), audio transcription for voice notes; cross-document validation with retrieval + model reasoning (pro mode in exam terms; agentic mode today). Route by confidence to human review, redact PII, treat text in images as untrusted, and index markdown in Azure AI Search for retrieval.", f: ["Why markdown rather than plain OCR text?"] },

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {

  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;

function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}

  SYNC.busy[part] = true;

  catch (e) {
    const c = e && e.code;

    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }

  }
}
function applyRemote(part, data) {

  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }

}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }
      else if (U[part]) flush(part);

  }

  return changed;
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("loading");
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }
  });
}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }
  if (score < 1) {
    const m = S.mis[it.id] || { n: 0 };
    m.n += 1; m.at = today(); m.g = String(given || "").slice(0, 160); m.fx = null; S.mis[it.id] = m;
    const keys = Object.keys(S.mis); if (keys.length > 400) { keys.sort((a, b) => (S.mis[a].at < S.mis[b].at ? -1 : 1)).slice(0, keys.length - 400).forEach(k => delete S.mis[k]); }
  } else if (S.mis[it.id] && !S.mis[it.id].fx) { S.mis[it.id].fx = today(); }
  touch("main");
}
function domainAccuracy(did) { const ds = S.dstat[did]; return ds && ds[1] ? ds[0] / ds[1] : null; }
function readiness() {
  const list = MOCKS.slice().sort((a, b) => (a.at < b.at ? -1 : 1));
  if (!list.length) return { cls: "info", label: "Readiness: no mock yet", verdict: "na", text: "Take a timed mock to get a readiness estimate." };
  const last = list[list.length - 1], prev = list.length > 1 ? list[list.length - 2] : null;
  const doms = Object.values(last.byDomain || {}).map(x => x.pct);
  const minDom = doms.length ? Math.min(...doms) : 0;
  if (prev && last.weighted >= 85 && prev.weighted >= 85 && minDom >= 70 && last.cwPct <= 10) return { cls: "ok", label: "Readiness: ready", verdict: "ok", text: `Ready: your last two mocks are ${prev.weighted}% and ${last.weighted}% (weighted), no domain is under 70%, and confident-wrong answers are ${last.cwPct}%. Confirm with the official practice assessment, then book.` };
  if (last.weighted >= 75) return { cls: "mid", label: "Readiness: almost", verdict: "mid", text: `Almost: last mock ${last.weighted}% weighted, weakest domain ${minDom}%, confident-wrong ${last.cwPct}%. ${prev ? "" : "One mock isn't enough evidence: take the second mock after fixing your weak topics. "}Ready means 85%+ on two consecutive mocks, every domain at 70%+, and confident-wrong at 10% or less.` };
  return { cls: "no", label: "Readiness: not yet", verdict: "no", text: `Not yet: last mock ${last.weighted}% weighted (weakest domain ${minDom}%). Work through the weakest modules (story, key points, quiz), redo your mistakes, then retake.` };
}

/* ===== items: Microsoft-style question types =====

   drop code/hot-area blanks {q,code:"..{{0}}..",blanks:[{o:[..],a:int}],e} partial credit

function prepItem(it) {

  if (v.t === "drop") v.dorder = it.blanks.map(b => (it.fix ? b.o.map((_, j) => j) : shuffle(b.o.map((_, j) => j))));
  if (v.t === "yn") v.sorder = it.fix ? it.s.map((_, i) => i) : shuffle(it.s.map((_, i) => i));
  return v;
}
function rightText(it, i) { return i < it.pairs.length ? it.pairs[i][1] : (it.extra || [])[i - it.pairs.length]; }
function isAnswered(v, r) {
  if (r == null) return false;
  switch (v.t) {
    case "mc": return typeof r === "number";
    case "ms": return r.length > 0;
    case "yn": case "drop": case "match": return r.some(x => x != null);
    case "ord": return true;
  }
  return false;
}

    case "ms": { const C = new Set(it.a); let g = 0, b = 0; r.forEach(x => (C.has(x) ? g++ : b++)); return Math.max(0, (g - b) / C.size); }
    case "yn": return it.s.reduce((a, s, i) => a + (r[i] === s[1] ? 1 : 0), 0) / it.s.length;
    case "ord": return r.every((x, i) => x === i) ? 1 : 0;
    case "drop": return it.blanks.reduce((a, b, i) => a + (r[i] === b.a ? 1 : 0), 0) / it.blanks.length;
    case "match": return it.pairs.reduce((a, p, i) => a + (r[i] === i ? 1 : 0), 0) / it.pairs.length;
  }
  return 0;
}
function givenText(it, r) {
  if (r == null) return "(no answer)";
  try {
    switch (it.t) {
      case "mc": return LET[r] + ". " + it.o[r];
      case "ms": return r.map(x => it.o[x]).join(" | ");
      case "yn": return r.map(x => (x == null ? "-" : x ? "Y" : "N")).join("");
      case "ord": return r.map(x => it.items[x]).join(" > ");
      case "drop": return r.map((x, i) => (x == null ? "-" : it.blanks[i].o[x])).join(" | ");
      case "match": return r.map((x, i) => it.pairs[i][0] + "=" + (x == null ? "-" : rightText(it, x))).join("; ");
    }
  } catch (e) { }
  return "";
}
function correctText(it) {
  switch (it.t) {
    case "mc": return it.o[it.a];
    case "ms": return it.a.map(x => it.o[x]).join(" | ");
    case "yn": return it.s.map(s => s[0] + ": " + (s[1] ? "Yes" : "No")).join("; ");
    case "ord": return it.items.join(" > ");
    case "drop": return it.blanks.map(b => b.o[b.a]).join(" | ");
    case "match": return it.pairs.map(p => p[0] + " = " + p[1]).join("; ");

}
function typeHint(it) {

    case "yn": return "For each statement, select Yes if it is true. Otherwise, select No.";
    case "ord": return "Arrange the actions in the correct order (use the arrows).";

/* interactive rendering (used by quizzes before checking, and by mocks/cases throughout) */

  } else if (v.t === "ord") {

/* learn-mode quiz block: instant feedback, records mistakes + domain stats */

function focusOrder() {
  if (!S.diag) return [];
  return DOM.map(d => { const p = S.diag.by[d.id] != null ? S.diag.by[d.id] : 50; return { d: d.id, p, score: dWeight(d.id) * (100 - p) }; }).sort((a, b) => b.score - a.score);
}
function startDiag() {
  const items = (H.diag || []).map(prepItem); if (!items.length) return;
  DIAGRUN = { vs: items, R: items.map(() => null), C: items.map(() => null) };
  const host = $("#diagHost");
  const paint = () => {
    host.innerHTML = `<div class="panel" style="margin-top:16px"><div class="row between"><h3>Diagnostic · ${items.length} questions</h3><span class="muted small">No feedback until you submit. Rate your confidence for each.</span></div>
     ${items.map((v, i) => `<div class="q" data-k="${i}">${itemHTML(v, DIAGRUN.R[i], i + 1, { meta: dchip(v.it.d) })}<div class="row small" style="margin-top:8px"><span class="muted">Confidence:</span><div class="conf">${["low", "med", "high"].map(c => `<button type="button" data-c="${c}" aria-pressed="${DIAGRUN.C[i] === c}">${c}</button>`).join("")}</div></div></div>`).join("")}
     <button type="button" class="btn primary" id="diagSubmit">Submit diagnostic</button></div>`;
    items.forEach((v, i) => {
      const el = $(`.q[data-k="${i}"]`, host);
      bindItem(el, v, () => DIAGRUN.R[i], (nr, noPaint) => { DIAGRUN.R[i] = nr; if (!noPaint) paint(); });
      $$(".conf button", el).forEach(b => b.addEventListener("click", () => { DIAGRUN.C[i] = b.dataset.c; paint(); }));
    });

  };
  paint();
  host.scrollIntoView({ behavior: "smooth", block: "start" });
}
function submitDiag() {
  const host = $("#diagHost"), D = DIAGRUN; if (!D) return;
  const by = {}, cnt = {};
  D.vs.forEach((v, i) => { const d = v.it.d, sc = gradeItem(v.it, D.R[i]); by[d] = (by[d] || 0) + sc; cnt[d] = (cnt[d] || 0) + 1; recordAnswer(v.it, sc, givenText(v.it, D.R[i])); });
  const res = {}; Object.keys(by).forEach(d => { res[d] = pct(by[d], cnt[d]); });
  const cw = D.vs.filter((v, i) => D.C[i] === "high" && gradeItem(v.it, D.R[i]) < 1).length;
  S.diag = { at: today(), by: res, cw }; touch("main");
  DIAGRUN = null;
  RENDER.start();
  $("#diagHost").innerHTML = `<div class="panel" style="margin-top:16px"><h3>Diagnostic results</h3><div class="dbars">${DOM.map(d => `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${res[d.id] || 0}%;background:var(--${d.cls})"></i></div><b>${res[d.id] != null ? res[d.id] + "%" : "–"}</b></div>`).join("")}</div>
   <p class="small" style="margin-top:10px">Confident but wrong: <b>${cw}</b>. Those are the ideas to unlearn first. Everything you missed is now in Practice → Redo my mistakes.</p>
   <details class="d"><summary>Review the diagnostic answers</summary><div>${D.vs.map((v, i) => `<div class="q">${reviewHTML(v, D.R[i], i + 1, { meta: dchip(v.it.d) })}</div>`).join("")}</div></details></div>`;
  bindExplain($("#diagHost"));
}

/* ---------- ROADMAP ---------- */
function blockInfo(b) {
  if (b.k === "mod") { const m = MID[b.ref]; return { label: m.t, min: m.min, done: !!S.done[m.id], kind: "Module", sub: (DMAP[m.d] || {}).short }; }
  if (b.k === "lab") { const l = (H.labs || []).find(x => x.id === b.ref); return { label: "Lab: " + (l ? l.t : b.ref), min: l ? l.min : 60, done: !!S.labs[b.ref], kind: "Lab" }; }
  if (b.k === "mock") { const mk = (H.mocks || []).find(x => x.id === b.ref); return { label: `Mock ${b.ref} (timed) + review`, min: (mk ? mk.min : 100) + 40, done: MOCKS.some(x => x.set === b.ref), kind: "Mock" }; }
  if (b.k === "case") { const c = CASE[b.ref]; return { label: "Case study: " + (c ? c.title : b.ref), min: c ? c.min : 30, done: !!S.cases[b.ref], kind: "Case" }; }
  return { label: b.label, min: b.min || 30, done: !!S.plan[b.id], kind: b.kind || "Task", sub: b.sub };
}
function planBlocks() { const out = []; (H.plan || []).forEach(ph => ph.blocks.forEach(b => out.push(Object.assign({ phase: ph.t }, b, blockInfo(b))))); return out; }
function nextBlock() { return planBlocks().find(b => !b.done) || null; }
function openBlock(b) {
  if (!b) return;
  if (b.k === "mod") openModule(b.ref);
  else if (b.k === "lab") { show("labs"); setTimeout(() => { const el = document.getElementById("lab-" + b.ref); if (el) { el.open = true; el.scrollIntoView({ block: "start" }); } }, 30); }
  else if (b.k === "mock") show("mock");
  else if (b.k === "case") { show("cases"); openCase(b.ref); }
  else if (b.go) { if (MID[b.go]) openModule(b.go); else show(b.go); }
  else show("plan");
}

  const totalMin = blocks.reduce((a, b) => a + b.min, 0), doneMin = blocks.filter(b => b.done).reduce((a, b) => a + b.min, 0);
  const start = S.pace.start || today();
  const end = addDays(start, weeks.length * 7 - 1);
  let h = `<div class="eyebrow">Backward-designed plan · time follows weight × gap</div><h2 class="h-view">Your ${weeks.length}-week roadmap</h2>
  <p class="lede">${inl(H.planIntro || "")}</p>
  <div class="toolbar"><label class="inline" for="paceSel">Hours per week <select id="paceSel">${[4, 6, 8, 10, 12, 15, 20, 30].map(x => `<option value="${x}" ${x === hpw ? "selected" : ""}>${x} h</option>`).join("")}</select></label>
   <label class="inline" for="startDate">Start date <input type="date" id="startDate" value="${esc(start)}"></label>
   <span class="muted small">Total ≈ ${Math.round(totalMin / 60)} h · done ≈ ${Math.round(doneMin / 60)} h · finish ≈ <b>${esc(fmtDate(end, { day: "numeric", month: "short", year: "numeric" }))}</b></span></div>
  <div class="panel" style="margin-bottom:14px"><div class="eyebrow">Progress by domain (modules done)</div><div class="dbars">${DOM.map(d => { const ms = M.filter(m => m.d === d.id), dn = ms.filter(m => S.done[m.id]).length; return `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${pct(dn, ms.length)}%;background:var(--${d.cls})"></i></div><b>${dn}/${ms.length}</b></div>`; }).join("")}</div></div>
  <div class="weeks">`;
  weeks.forEach((w, i) => {

     ${w.items.map((b, j) => { const id = `blk-${i}-${j}`; const auto = b.k === "mod" || b.k === "mock" || b.k === "case" || b.k === "lab"; return `<div class="blk"><input type="checkbox" id="${id}" ${b.done ? "checked" : ""} ${b.k === "mock" ? "disabled" : ""} data-bk="${esc(b.k)}" data-ref="${esc(b.ref || b.id)}"><label class="lbl" for="${id}"><span class="kind">${esc(b.kind)}${b.sub ? " · " + esc(b.sub) : ""}</span><br>${inl(b.label)}${auto || b.go ? "" : ""}</label><button type="button" class="btn small ghost" data-open="${i}-${j}" aria-label="Open ${esc(b.label)}">Open</button><span class="t">${b.min}m</span></div>`; }).join("")}</div>`;
  });
  h += `</div>`;
  if (H.blueprint) {
    h += `<h3 style="margin:26px 0 6px;font-size:1.2rem">Skills checklist (official outline)</h3><p class="muted small" style="margin-bottom:10px">Rate yourself on every skill Microsoft lists. “Not yet” and “Shaky” skills link to the module that teaches them. Outline as of ${esc(H.blueprintDate || "")}.</p><div class="grid2">`;
    H.blueprint.forEach(dom => {
      const d = DMAP[dom.d];

           <span class="seg" role="group" aria-label="Self-rating">${["Not yet", "Shaky", "Solid"].map((lab, x) => `<button type="button" class="r${x}" data-sk="${esc(key)}" data-sv="${x}" aria-pressed="${val === x}">${lab}</button>`).join("")}</span></div>`;
        });
      });
      h += `</div>`;

  }
  v.innerHTML = h;

  $("#startDate").addEventListener("change", e => { if (e.target.value) { S.pace.start = e.target.value; touch("main"); RENDER.plan(); } });
  $$("[data-open]", v).forEach(b => b.addEventListener("click", () => { const [i, j] = b.dataset.open.split("-").map(Number); openBlock(weeks[i].items[j]); }));
  $$(".blk input", v).forEach(cb => cb.addEventListener("change", () => {
    const k = cb.dataset.bk, ref = cb.dataset.ref;
    if (k === "mod") S.done[ref] = cb.checked || undefined; else if (k === "lab") S.labs[ref] = cb.checked ? today() : undefined; else if (k === "case") S.cases[ref] = cb.checked ? (S.cases[ref] || { at: today(), pct: null }) : undefined; else S.plan[ref] = cb.checked || undefined;
    touch("main"); header();
  }));
  $$("[data-mod]", v).forEach(b => b.addEventListener("click", () => openModule(b.dataset.mod)));
  $$("[data-sk]", v).forEach(b => b.addEventListener("click", () => { const k = b.dataset.sk, x = +b.dataset.sv; S.skills[k] = S.skills[k] === x ? undefined : x; touch("main"); $$(`[data-sk="${CSS.escape(k)}"]`, v).forEach(o => o.setAttribute("aria-pressed", String(S.skills[k] === +o.dataset.sv))); }));
};

   <div class="q" id="mq1">${itemHTML(vv, X.R[X.i], X.i + 1, { meta: "" })}<div class="row small" style="margin-top:10px"><span class="muted">Confidence:</span><div class="conf">${["low", "med", "high"].map(cc => `<button type="button" data-c="${cc}" aria-pressed="${X.C[X.i] === cc}">${cc}</button>`).join("")}</div></div></div>

   <div class="muted small" style="margin-top:8px">${X.F.filter(Boolean).length} flagged</div><button type="button" class="btn" id="qSub2" style="margin-top:10px;width:100%">Submit exam</button><div id="subWarn" class="muted small" style="margin-top:6px"></div></div></aside></div>`;
  const el = $("#mq1");
  bindItem(el, vv, () => X.R[X.i], (nr, noPaint) => { X.R[X.i] = nr; saveRun(); if (!noPaint) renderMockQ(); else { const nb = $(`.navgrid button[data-k="${X.i}"]`); if (nb) nb.classList.toggle("ans", isAnswered(vv, nr)); } });

function submitMock() {
  const X = MOCKRUN; if (!X) return; clearInterval(TIMER);
  const res = X.vs.map((vv, k) => ({ id: vv.it.id, d: vv.it.d, tp: vv.it.tp || "", sc: gradeItem(vv.it, X.R[k]), conf: X.C[k] || "", flag: X.F[k], ans: isAnswered(vv, X.R[k]) }));
  const byDomain = {}; DOM.forEach(d => { const rs = res.filter(r => r.d === d.id); if (rs.length) byDomain[d.id] = { pct: pct(rs.reduce((a, r) => a + r.sc, 0), rs.length), n: rs.length }; });
  const raw = pct(res.reduce((a, r) => a + r.sc, 0), res.length);
  const wsum = Object.keys(byDomain).reduce((a, d) => a + dWeight(d), 0);
  const weighted = Math.round(Object.keys(byDomain).reduce((a, d) => a + byDomain[d].pct * dWeight(d), 0) / (wsum || 1));
  const cw = res.filter(r => r.conf === "high" && r.sc < 1).length;
  const rec = { set: X.set, at: new Date().toISOString(), pct: raw, weighted, byDomain, cw, cwPct: pct(cw, res.length), n: res.length, answered: res.filter(r => r.ans).length, dur: Math.round((Math.min(Date.now(), X.end) - X.start) / 60000), items: res.map(r => [r.id, Math.round(r.sc * 100) / 100, r.conf ? r.conf[0] : "", r.flag ? 1 : 0]) };
  MOCKS.push(rec); if (MOCKS.length > 40) MOCKS = MOCKS.slice(-40);
  X.vs.forEach((vv, k) => recordAnswer(vv.it, res[k].sc, givenText(vv.it, X.R[k])));
  touch("mocks"); header();
  const topics = {}; res.forEach(r => { if (!r.tp) return; const t = topics[r.tp] || (topics[r.tp] = { c: 0, n: 0 }); t.n++; t.c += r.sc; });
  const r = readiness();
  const v = $("#v-mock");
  v.innerHTML = `<div class="eyebrow">Mock ${esc(X.set)} · results</div>
  <div class="grid2" style="margin-top:10px"><div class="panel"><div class="score">${weighted}%</div><div class="muted">weighted by the official domain weights · raw ${raw}% · ${rec.answered}/${rec.n} answered · ${rec.dur} min</div>
   <div class="dbars">${DOM.map(d => byDomain[d.id] ? `<div class="dbar"><span>${esc(d.short)} · ${esc(d.name)}</span><div class="tr"><i style="width:${byDomain[d.id].pct}%;background:${byDomain[d.id].pct >= 70 ? "var(--good)" : "var(--bad)"}"></i></div><b>${byDomain[d.id].pct}%</b></div>` : "").join("")}</div>
   <div class="verdict ${r.verdict}">${esc(r.text)}</div><p class="small muted" style="margin:.6em 0 0">Confident-but-wrong: <b>${cw}</b> (${rec.cwPct}%). These are misconceptions, not gaps: re-read those modules' traps.</p></div>
   <div class="panel"><h3>By topic (weakest first)</h3><div class="dbars">${Object.entries(topics).sort((a, b) => a[1].c / a[1].n - b[1].c / b[1].n).slice(0, 14).map(([t, o]) => { const p = pct(o.c, o.n); return `<div class="dbar"><span>${esc(t)}</span><div class="tr"><i style="width:${p}%;background:${p >= 70 ? "var(--good)" : "var(--bad)"}"></i></div><b>${Math.round(o.c * 10) / 10}/${o.n}</b></div>`; }).join("")}</div></div></div>
  <div class="panel" style="margin-top:14px"><div class="row between"><h3>Get a remediation plan</h3><div class="row"><button type="button" class="btn primary" id="rCopy">Copy results for Claude</button><button type="button" class="btn" id="rBack">Back to mocks</button></div></div><p class="small muted" style="margin:.4em 0 0">${SYNC.db ? "Your results are also saved to your account, so you can just tell me in chat that you finished a mock." : "Paste the copied results in our chat for a readiness report and a targeted plan."}</p></div>
  <h3 style="margin:22px 0 10px;font-size:1.15rem">Review every question</h3>
  ${X.vs.map((vv, k) => `<div class="q">${reviewHTML(vv, X.R[k], k + 1, { meta: dchip(vv.it.d, vv.it.tp) + `<span class="chip">confidence: ${esc(X.C[k] || "unset")}${X.F[k] ? " · flagged" : ""}</span>` + (vv.it.cs ? `<span class="chip">case: ${esc(CASE[vv.it.cs].title)}</span>` : "") })}</div>`).join("")}`;
  bindExplain(v);
  const payloadTxt = JSON.stringify({ exam: H.code, mock: X.set, date: rec.at, weighted_pct: weighted, raw_pct: raw, by_domain: byDomain, confident_wrong: cw, minutes: rec.dur, by_topic: topics, items: rec.items.map(x => ({ id: x[0], score: x[1], conf: x[2], flagged: !!x[3], topic: ITEMS[x[0]].tp || "", domain: ITEMS[x[0]].d })) });
  $("#rCopy").addEventListener("click", e => copyText(`Here are my ${H.code} Mock ${X.set} results from the Study Hub. Score them, update my readiness, and give me a remediation plan:\n` + payloadTxt, e.currentTarget));
  $("#rBack").addEventListener("click", () => RENDER.mock());
  MOCKRUN = null; saveRun(); window.scrollTo(0, 0);
}

/* ---------- FLASHCARDS (Leitner boxes, spaced) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function allCards() { const out = []; M.forEach(m => (m.qa || []).forEach((q, i) => out.push({ id: m.id + ".c" + (i + 1), d: m.d, t: m.t, q: q[0], a: q[1] }))); (H.cards || []).forEach((c, i) => out.push({ id: "x." + (i + 1), d: c.d, t: c.t || "Extra", q: c.q, a: c.a })); return out; }
let FC = { list: [], i: 0, flip: false, filter: "due" };
function buildFC() {
  const all = allCards(), tn = dayNum(today()), f = FC.filter;
  let list = all.filter(c => f === "due" ? (CARDS[c.id] ? CARDS[c.id][1] <= tn : true) : f === "all" ? true : f.startsWith("m:") ? c.id.startsWith(f.slice(2) + ".") : c.d === f);
  if (f === "due") { const seen = list.filter(c => CARDS[c.id]), fresh = list.filter(c => !CARDS[c.id]); list = shuffle(seen).concat(fresh.slice(0, 20)); } else list = shuffle(list);
  FC.list = list; FC.i = 0; FC.flip = false;
}
RENDER.cards = function () {
  if (!FC.list.length || FC.i >= FC.list.length) buildFC();
  const v = $("#v-cards"), all = allCards(), tn = dayNum(today());
  const due = all.filter(c => CARDS[c.id] && CARDS[c.id][1] <= tn).length, unseen = all.filter(c => !CARDS[c.id]).length;
  const boxes = [0, 0, 0, 0, 0, 0]; all.forEach(c => { boxes[CARDS[c.id] ? CARDS[c.id][0] : 0]++; });
  const c = FC.list[FC.i];
  v.innerHTML = `<div class="fc"><div class="eyebrow">Spaced retrieval</div><h2 class="h-view">Flashcards</h2>
  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">From certified to hireable</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.code} skills. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};
