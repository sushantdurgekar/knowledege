ord plus vectors, reranked and filtered by the user's permissions inside the index, so nothing they can't read reaches the model. If it needs to act, I'd start with the simplest workflow and put a policy layer outside the model: allowed tools, approvals for irreversible actions and for writes after untrusted input, and budgets. And every change runs against an evaluation set before it ships, with quality, cost and latency monitored afterwards."},"qa":[["Prefill and decode?","Prefill processes the whole prompt in parallel and sets time to first token; decode generates one token per step and sets time per output token."],["What does continuous batching do?","It schedules per decode step, so finished requests leave and new ones join the batch between steps."],["Why does the KV cache limit concurrency?","Every token of every active request keeps a key and a value per layer in accelerator memory."],["What is reciprocal rank fusion?","Combining rankings by summing 1 ÷ (k + rank) for each document; the original paper used k = 60."],["What is the lethal trifecta?","An agent with private data, exposure to untrusted content and a way to send data out."],["Why filter retrieval by permission before ranking?","Filtering afterwards returns fewer results, and documents the user can't read must never reach the prompt."]],"quiz":[{"q":"What does this print?","snip":{"t":"KV cache per token, in KiB, for an illustrative model","tabs":[{"lang":"python","src":"layers, kv_heads, head_dim, bytes_per_value = 32, 8, 128, 2\nprint(2 * layers * kv_heads * head_dim * bytes_per_value // 1024)\n"},{"lang":"javascript","src":"const layers = 32, kvHeads = 8, headDim = 128, bytesPerValue = 2;\nconsole.log(2 * layers * kvHeads * headDim * bytesPerValue / 1024);\n"}]},"o":["128","64","256","32"],"a":0,"e":"A key and a value per layer per KV head: 2 × 32 × 8 × 128 × 2 = 131,072 bytes, 128 KiB per token. A 4,000-token conversation holds 500 MiB while it's active."},{"q":"What does this print?","snip":{"t":"Reciprocal rank fusion: one top rank, or agreement?","tabs":[{"lang":"python","src":"k = 60\na = 1 / (k + 1) + 1 / (k + 3)                # first in one list, third in the other\nb = 1 / (k + 2) + 1 / (k + 2)                # second in both\nprint(\"a\" if a > b else \"b\")\n"},{"lang":"javascript","src":"const k = 60;\nconst a = 1 / (k + 1) + 1 / (k + 3);         // first in one list, third in the other\nconst b = 1 / (k + 2) + 1 / (k + 2);         // second in both\nconsole.log(a > b ? \"a\" : \"b\");\n"}]},"o":["a","b","they tie","an error"],"a":0,"e":"1/61 + 1/63 ≈ 0.03227 and 2/62 ≈ 0.03226: almost a tie. With k = 60, RRF barely rewards a single top rank; it mostly rewards appearing near the top of several lists."},{"q":"Users complain that answers take long to start, though once text appears it flows quickly. Which phase should you look at first?","o":["Queueing and prefill, which set the time to first token","Decode, which sets the time per output token","The tokenizer's vocabulary size","The client's rendering speed"],"a":0,"e":"The first token waits for queueing and for the whole prompt to be processed. Long prompts, cold caches and overloaded queues raise it; prompt caching and shorter prompts lower it."},{"q":"An agent reads customers' emails, can look up their accounts, and can send emails. What's the most important design change?","o":["After it reads untrusted email content, require a person to approve any email it sends","Add a line to the system prompt telling it to ignore instructions inside emails","Switch to a larger model, which follows instructions better","Log every email it sends, and review the logs monthly"],"a":0,"e":"Private data, untrusted content and a way to send data out make the lethal trifecta. Prompts can be overridden by injected text, and logs only show the damage afterwards; the approval breaks the chain."},{"q":"Which lower the cost per request of an LLM feature? (choose 3)","t":"ms","o":["Continuous batching on the serving side","Prompt caching for a long, fixed instruction prefix","Routing easy requests to a smaller model","Raising the maximum output length","Serving with a batch size of one"],"a":[0,1,2],"e":"Longer outputs cost more tokens, and a batch size of one wastes the accelerator. Batching, caching and routing each cut cost without changing what users ask for."},{"q":"Judge each statement.","t":"yn","s":[["Permission filtering belongs inside retrieval, before ranking, using the user's identity.",true],["A system prompt telling the model to ignore injected instructions reliably prevents prompt injection.",false],["Continuous batching lets new requests join a running batch between decode steps.",true],["Once a cascade's threshold is tuned, it never needs revisiting.",false]],"e":"Filters after ranking lose results and expose text the user can't read. Injection defences must sit outside the model. Traffic drifts, so thresholds are monitored and retuned."},{"q":"Put a RAG query's path in order.","t":"ord","items":["Identify the user and what they may read","Retrieve candidates with keyword and vector search, filtered by permission","Fuse and rerank the candidates","Build the prompt from the top passages, with their sources","Generate the answer, citing the sources","Log the query, passages and answer for evaluation"],"e":"Identity comes first so that filtering happens inside retrieval; logging last feeds the evaluation set that keeps the system honest."},{"q":"Complete the Python reciprocal rank fusion.","t":"drop","lang":"python","code":"def fuse(rankings, k=60):                              # reciprocal rank fusion; rankings list ids, best first\n    scores = {}\n    for ranking in rankings:\n        for rank, doc in enumerate(ranking, start=1):\n            scores[doc] = scores.get(doc, 0) + 1 / ({{0}})\n    return sorted(scores, key=lambda doc: ({{1}}, doc))\n","blanks":[{"o":["k + rank","rank","k * rank","k - rank"],"a":0},{"o":["-scores[doc]","scores[doc]","doc","-len(scores)"],"a":0}],"e":"Each list adds 1 ÷ (k + rank) for every document it contains, and the fused list sorts by the total, highest first, with ties broken by id."}],"probs":[["Paper · Kwon et al.: Efficient memory management for LLM serving with PagedAttention","https://arxiv.org/abs/2309.06180","","work out the KV cache per token and the possible concurrency for a model you use"],["Reading · Anthropic: Building effective agents","https://www.anthropic.com/engineering/building-effective-agents","","classify an AI feature you know as a workflow or an agent, and name the simplest pattern that would do"],["Reference · OWASP Top 10 for LLM Applications 2025","https://genai.owasp.org/llm-top-10/","","check an AI feature against prompt injection (LLM01) and excessive agency (LLM06)"],["Reading · Simon Willison: The lethal trifecta","https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","","list an agent's tools and mark which of the three legs each one provides"]],"src":[["Kwon et al. (SOSP 2023): Efficient Memory Management for Large Language Model Serving with PagedAttention","https://arxiv.org/abs/2309.06180"],["Yu et al. (OSDI 2022): Orca, a distributed serving system for transformer-based generative models","https://www.usenix.org/conference/osdi22/presentation/yu"],["Cormack, Clarke and Büttcher (SIGIR 2009): Reciprocal Rank Fusion","https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf"],["Anthropic (2024): Building effective agents","https://www.anthropic.com/engineering/building-effective-agents"],["OWASP Top 10 for LLM Applications 2025","https://genai.owasp.org/llm-top-10/"],["Simon Willison (2025): The lethal trifecta for AI agents","https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"],["Model Context Protocol: introduction","https://modelcontextprotocol.io/introduction"]]}],"plan":[{"t":"Deciding well","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a sd-l4/ folder with python/ and js/; a decisions/ folder for ADRs; a cloud provider's pricing calculator open in a tab; one real system you know well, to review","min":45,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"lab","ref":"lab-decisions"},{"k":"mod","ref":"m02"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Running it, and changing it","blocks":[{"k":"mod","ref":"m03"},{"k":"lab","ref":"lab-capacity"},{"k":"lab","ref":"lab-serving"},{"k":"mod","ref":"m04"},{"k":"lab","ref":"lab-migration"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"People and AI platforms","blocks":[{"k":"mod","ref":"m05"},{"k":"mod","ref":"m06"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L4","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-reviews","label":"Architecture reviews: run two reviews of other people's designs with this hub's routine, and write each one up as findings plus ADRs","min":480,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the module practice problems and exercises, logged with what you learned from each","min":480,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L4: your review checklist, the decisions you'd now make differently, and the capstone's review feedback; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Luigi's festival weekend","org":"Luigi's Pizza, with 600 shops, an order platform built over eight years, and 14 engineering teams","min":30,"blurb":"Capacity for a known peak, a cloud bill that grew faster than orders, an order database that needs replacing, and teams that can't ship without each other.","sections":[["Overview","Luigi's order platform peaks every Friday at 3,000 orders a minute, and the town festival in six weeks is forecast at three times that. The cloud bill grew 45% this year while orders grew 18%. The order database, one large PostgreSQL primary, is at its biggest instance size, and the board wants to know the plan."],["Current design",["The order API runs on 60 instances across three zones; the last load test, run with 200 virtual users that wait for each reply, passed at 2,000 orders a minute.","One PostgreSQL primary with a synchronous standby holds orders, menus and loyalty points; every service reads and writes it directly.","Teams are organised by layer: web, mobile, API, database and operations. A typical feature needs four of them.","All instances are on-demand; development and test environments run around the clock; nobody owns about 30% of the bill, because resources carry no team tags."]],["Problems",["Last Friday's p99 was 4 seconds for ten minutes, but the load test had reported 120 ms.","Engineers want to move orders to a distributed database in one weekend before the festival.","Features take seven weeks from idea to production, most of it waiting for other teams.","The CFO wants the bill cut by 20% without risking the festival."]]],"items":[{"d":"d2","q":"Why did the load test report 120 ms when real Fridays reach a 4-second p99?","o":["Its virtual users wait for each reply, so they send less when the system slows, and it ran below the real peak: coordinated omission plus the wrong load","The test servers were faster than production","Percentiles can't be compared between tests and production","Users' phones add the extra latency"],"a":0,"e":"A closed-model test at 2,000 orders a minute neither reaches Friday's peak nor measures stalls properly. The festival test needs an open model at the forecast arrival rate and above, with production-like data, against the whole path including the database."},{"d":"d2","q":"What should the team do about the database before the festival?","o":["Keep the current database for the festival, add read replicas and caching for menus, and plan an incremental migration of orders afterwards with dual writes, backfill and verification","Migrate everything to the distributed database in one weekend","Shard the PostgreSQL database by hand next week","Do nothing: the database has coped so far"],"a":0,"e":"A big-bang migration six weeks before the year's biggest peak is a one-way door at the worst time. Relieve the hot spots now, then migrate orders in reversible steps when the risk is lower."},{"d":"d3","t":"ms","q":"Which TWO changes would most shorten the seven-week lead time?","o":["Re-form teams around business streams (ordering, menus, loyalty) that own their slice from the apps to the data","Give operations work to a platform team offering self-service environments and deployment","Add a weekly coordination meeting for all 14 teams","Require more detailed hand-off documents between layers"],"a":[0,1],"e":"Most of the seven weeks is waiting at hand-offs between layer teams. Stream-aligned teams remove the hand-offs, and a self-service platform removes the operations queue. Meetings and documents make the hand-offs better, not fewer."},{"d":"d2","q":"Which plan cuts the bill by 20% with the least risk to the festival?","o":["Tag every resource to a team, switch off non-production outside working hours, rightsize from p95 utilisation, and commit to the steady baseline, leaving the festival capacity on demand","Move everything to spot instances","Commit to three years of capacity at the festival peak","Remove the standby database"],"a":0,"e":"Allocation shows who spends what; schedules and rightsizing remove waste; commitments discount the steady baseline. The festival's extra capacity stays on demand, and the standby protects the business."}]},{"id":"cs2","title":"An AI support assistant goes company-wide","org":"PayLane, a payment platform with 2,000 employees and 40,000 merchants","min":30,"blurb":"LLM serving costs and latency, permission-aware retrieval over internal documents, and an agent that wants to issue refunds.","sections":[["Overview","PayLane's support assistant answers merchants' questions and drafts replies for support staff. It was a success in one team and is being rolled out to everyone, and product managers want it to issue refunds directly."],["Current design",["Every request goes to the largest model; the prompt is a 6,000-token block of policies followed by the conversation and retrieved passages.","Retrieval uses vector search only, over all internal documents, with permissions checked by asking the model not to quote restricted material.","The pilot ran on one dedicated GPU server that reserves the maximum context for each request.","There is no evaluation set; changes to the prompt are checked by reading a few answers."]],["Problems",["Answers take six seconds to start during busy hours, and the GPU bill per conversation is four times the budget.","The assistant quoted an internal fraud-rules document to a merchant.","Searches for exact error codes such as E4012 often return unrelated passages.","Product wants refunds of up to €500 issued automatically, based on the merchant's email."]]],"items":[{"d":"d3","q":"What most directly cuts the six-second wait for the first token?","o":["Cache the 6,000-token policy prefix and stop reserving the maximum context, so more requests fit in a continuous batch","Make the model write shorter answers","Add a second load balancer","Lower the temperature"],"a":0,"e":"Time to first token is queueing plus prefill. A cached prefix avoids prefilling 6,000 tokens on every call, and paged KV allocation lets more requests run at once, so they queue less."},{"d":"d3","q":"How should the fraud-rules leak be fixed?","o":["Index each document with its access list and filter by the caller's identity inside retrieval, before ranking","Strengthen the instruction not to quote restricted documents","Remove the fraud-rules document from the index temporarily","Add a disclaimer to every answer"],"a":0,"e":"Text the user can't read must never reach the prompt. Removing one document fixes one leak; permission-aware retrieval fixes the class."},{"d":"d3","q":"Why do searches for exact error codes fail, and what's the fix?","o":["Embeddings capture meaning, not exact tokens like E4012; add keyword search and fuse the two rankings, then rerank","The vector index is too small","Error codes should be removed from documents","The model should guess the right passage"],"a":0,"e":"Keyword search excels at exact terms, vector search at paraphrases. Hybrid retrieval with reciprocal rank fusion and a reranker gets both, measured by recall on a labelled query set."},{"d":"d3","t":"ms","q":"Which TWO conditions should apply before the assistant issues refunds by itself?","o":["Refunds go through a policy layer outside the model with an allow-list, limits and per-merchant checks, and a person approves any refund requested in untrusted content such as an email","An evaluation set and a shadow-mode period show the refund decisions match what support staff would do","The system prompt says refunds are only for genuine cases","The model is switched to a larger one"],"a":[0,1],"e":"The merchant's email is untrusted content that can carry injected instructions, so the platform, not the prompt, must enforce limits and approvals. Evidence from evaluation and shadow mode decides when automation is earned."}]}],"diag":[{"d":"d1","q":"Two senior engineers have argued for a week about PostgreSQL versus DynamoDB for a new service. What would make the decision faster and better?","o":["Agree weighted decision drivers, score the options, check which weight changes would flip the result, and record it as an ADR","Let the most senior engineer decide","Build both and decide in six months","Pick whichever the team used last time"],"a":0,"e":"Agreeing the drivers first turns a debate about technologies into one about priorities; the sensitivity check shows whether the disagreement matters, and the ADR records the reasoning for whoever comes next."},{"d":"d1","q":"Which of these decisions deserves the slowest, most careful process?","o":["The primary database for a new payments ledger","The name of a feature flag","The size of the CI runners","The wording of a log message"],"a":0,"e":"A ledger's database is a one-way door: data, code and operations all build on it. The others are two-way doors, cheap to change, so decide them quickly and move on."},{"d":"d1","q":"An accepted ADR no longer fits because the system has grown. What should happen to it?","o":["Write a new ADR that supersedes it, and mark the old one superseded","Edit the old ADR to describe the new decision","Delete it so nobody is confused","Leave it, and tell people in a meeting"],"a":0,"e":"ADRs are append-only: the old record explains why the system looked the way it did, and the new one explains what changed and why."},{"d":"d1","q":"A well-architected review of a workload finds twelve high-risk issues. What is the review's main output?","o":["An improvement plan: the risks prioritised, with owners and dates, and a follow-up review","A pass or fail score","A report filed for the auditors","A list of AWS services to adopt"],"a":0,"e":"The review is a conversation that surfaces risk; its value is the plan that reduces it, checked again at the next milestone."},{"d":"d1","q":"A minute of downtime costs a small shop $300 and a payment network $5,000. What follows for their designs?","o":["They should buy different amounts of reliability, comparing each design's infrastructure cost with its expected downtime cost","Both need active-active multi-region","Both should run in one zone to save money","Availability is a technical choice, unrelated to the business"],"a":0,"e":"The right availability target comes from the cost of downtime. A design that's too expensive for the shop can be the cheapest option for the payment network."},{"d":"d2","q":"A single-server queue has a mean response time of 40 ms at 50% utilisation. Roughly what happens at 90%?","o":["About 200 ms: five times worse","About 72 ms: in proportion to the load","About 45 ms: almost no change","It can't be estimated without a load test"],"a":0,"e":"For an M/M/1 queue the mean time is S ÷ (1 − ρ): 40 ms at 50% means S = 20 ms, so 90% gives 200 ms. Latency rises steeply near full utilisation, which is why services keep headroom."},{"d":"d2","q":"A load test with 50 virtual users, each waiting for its reply before sending again, reports a p99 of 15 ms. Users see multi-second stalls. What's wrong?","o":["Coordinated omission: the test stops sending during stalls, so they're barely measured; use a fixed arrival rate","The p99 is right and users exaggerate","There are too few virtual users","Percentiles can't capture stalls; use the average"],"a":0,"e":"A closed-model tester slows down exactly when the system does. An open model sends on a schedule, so stalls create a backlog that shows up in the percentiles."},{"d":"d2","q":"Your API runs in three zones and must survive losing one. The peak needs 20 servers. How many do you run at peak?","o":["30, so that any two zones hold 20","20","21","60"],"a":0,"e":"Ten servers per zone means losing one zone still leaves twenty. Surviving a zone loss costs 50% more capacity with three zones, and less with more zones."},{"d":"d2","q":"In an expand-and-contract migration, which step can't be undone by redeploying the previous release?","o":["Dropping the old column","Adding the new columns","Releasing code that writes both columns","Backfilling the new columns"],"a":0,"e":"Every other step leaves the old shape in place, so older code still works. Once the old column is gone, a rollback to code that needs it fails."},{"d":"d2","q":"A backfill copies rows into a new store while dual writes are on. What stops it overwriting newer data?","o":["Writing each row only if it's missing or older, by version","Running the backfill at night","Pausing all writes for the backfill","Copying faster"],"a":0,"e":"A live update can land between the backfill's read and its write. A conditional write never goes backwards, and it makes the backfill safe to stop and resume."},{"d":"d3","q":"Every feature in your company needs the frontend, backend and data teams. What does Conway's law suggest?","o":["The architecture mirrors the layer teams; move towards stream-aligned teams that own a slice end to end, and move the boundaries with them","Add a coordination team","Hire more people into each team","Write more detailed hand-off documents"],"a":0,"e":"Systems copy communication structures, so layer teams produce features that cross every layer. Reshaping teams around streams of change, the inverse Conway maneuver, removes the hand-offs."},{"d":"d3","q":"A team spends three months coaching other teams in observability practices, then moves on to the next topic. Which Team Topologies type is it?","o":["An enabling team","A platform team","A complicated-subsystem team","A stream-aligned team"],"a":0,"e":"Enabling teams help others adopt skills for a limited time, facilitating rather than doing the work themselves."},{"d":"d3","q":"What usually limits how many requests one LLM server can process at once?","o":["Accelerator memory for the KV cache","The number of CPU cores","Network bandwidth to the client","The size of the tokenizer's vocabulary"],"a":0,"e":"Every token of every active request keeps a key and a value per layer. Paged allocation, grouped-query attention and shorter contexts all raise how many fit."},{"d":"d3","q":"An internal assistant sometimes quotes documents the user isn't allowed to read. Where does the fix belong?","o":["In retrieval: filter by the user's permissions before ranking, so those documents never reach the prompt","In the system prompt: tell the model not to reveal restricted documents","In the user interface: hide answers that mention restricted titles","In training: fine-tune the model to refuse"],"a":0,"e":"A model can't be relied on to keep secrets that are already in its context. Permission-aware retrieval stops the leak at the source."},{"d":"d3","q":"An agent reads web pages, can read the user's files, and can send emails. What's the key safeguard?","o":["After it reads untrusted content, require a person to approve anything it sends","A system prompt telling it to ignore instructions in web pages","A larger model that follows instructions better","Logging every email for a monthly review"],"a":0,"e":"Private data, untrusted content and a way to send data out make the lethal trifecta. An approval enforced outside the model breaks the chain; prompts and logs don't."}],"labs":[{"id":"lab-decisions","t":"A decision log that checks itself: ADRs, trade-offs and sensitivity points","min":75,"mods":["m01"],"goal":"Keep architecture decisions the way good teams do, as numbered markdown files in the repository, and write the tool that checks them. It parses each ADR's status, dates, sections and decision matrix, finds the problems a reviewer would (gaps in the numbering, broken supersedes links, overdue reviews, missing sections, decisions the matrix doesn't support), and for each matrix finds the smallest change to one weight that would let a rival option overtake the decision.","pre":["Python 3.12+ and Node.js 22.13+, standard libraries only","Read module 1"],"steps":["Write six ADRs as markdown into a temporary folder: a title line, headers (Status, Date, Review, Supersedes), and sections (Context, Drivers, Options, Decision, Consequences).","Parse each file into its number, title, headers and sections; parse the drivers (name: weight) and the options (name: driver score, …).","Check the log: every number from 1 to the highest exists, a superseded ADR points to one that exists and names it back, accepted ADRs aren't past their review date, and the required sections are there.","For each matrix, compute the weighted totals, check that the decision is the winner, and search changes of ±1, ±2 and ±3 to one weight at a time for the smallest one that lets a rival score higher.","Print the index, the trade-off findings and the problems, and clean up the folder."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import os, shutil, tempfile\n\nADRS = {}                                       # TODO: six ADR files as markdown strings, with a few deliberate problems\n\ndef parse(text): ...                            # TODO: number, title, headers and sections\ndef matrix(adr): ...                            # TODO: drivers {name: weight}, options [(name, {driver: score})]\ndef winner(drivers, options): ...               # TODO: the highest weighted total, ties to the first listed\ndef flip(drivers, options): ...                 # TODO: the smallest one-weight change that lets a rival overtake\ndef check(folder): ...                          # TODO: the log checks, then the trade-off checks\n"},{"lang":"javascript","src":"const fs = require(\"node:fs\"), os = require(\"node:os\"), path = require(\"node:path\");\n\nconst ADRS = {};                                // TODO: six ADR files as markdown strings, with a few deliberate problems\nfunction parse(text) { /* TODO: number, title, headers and sections */ }\nfunction matrix(adr) { /* TODO: drivers {name: weight}, options [[name, {driver: score}]] */ }\nfunction winner(drivers, options) { /* TODO: the highest weighted total, ties to the first listed */ }\nfunction flip(drivers, options) { /* TODO: the smallest one-weight change that lets a rival overtake */ }\nfunction check(folder) { /* TODO: the log checks, then the trade-off checks */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"An architecture decision log kept as files: parse the ADRs, check the log, and test each decision's trade-offs.\"\"\"\nimport os\nimport shutil\nimport tempfile\n\nTODAY = \"2026-10-12\"\nREQUIRED = [\"Context\", \"Decision\", \"Consequences\"]\nADRS = {\n    \"0001-order-database.md\": \"\"\"# ADR-001: Use PostgreSQL for the order service\nStatus: superseded by ADR-004\nDate: 2024-03-02\n\n## Context\nOrders need transactions across order lines and payments.\n## Decision\nPostgreSQL\n## Consequences\nOne primary per region; vertical scaling until we shard.\n\"\"\",\n    \"0002-order-events.md\": \"\"\"# ADR-002: Publish order events through an outbox\nStatus: accepted\nDate: 2024-05-10\nReview: 2026-03-01\n\n## Context\nEvents were lost when the service crashed between the commit and the publish.\n## Drivers\n- reliability: 5\n- effort: 2\n## Options\n- Outbox and relay: reliability 5, effort 3\n- Publish after commit: reliability 2, effort 5\n- Two-phase commit: reliability 5, effort 1\n## Decision\nOutbox and relay\n## Consequences\nConsumers must be idempotent; events can arrive twice.\n\"\"\",\n    \"0003-product-pages.md\": \"\"\"# ADR-003: Cache product pages at the CDN\nStatus: proposed\nDate: 2026-09-20\n\n## Context\nProduct pages are 70% of traffic and change a few times a day.\n## Decision\nCache for 5 minutes and purge on change\n\"\"\",\n    \"0004-order-database-v2.md\": \"\"\"# ADR-004: Move orders to DynamoDB\nStatus: accepted\nDate: 2026-02-14\nSupersedes: ADR-001\nReview: 2027-02-14\n\n## Context\nOrders grew ten times; the primary is at its largest size.\n## Drivers\n- consistency: 3\n- operations effort: 4\n- cost at scale: 3\n## Options\n- PostgreSQL: consistency 5, operations effort 3, cost at scale 4\n- DynamoDB: consistency 3, operations effort 5, cost at scale 4\n- Sharded PostgreSQL: consistency 4, operations effort 1, cost at scale 3\n## Decision\nDynamoDB\n## Consequences\nAccess patterns must be designed up front; transactions are limited to small sets of items.\n\"\"\",\n    \"0005-kafka-clusters.md\": \"\"\"# ADR-005: Run one Kafka cluster per region\nStatus: accepted\nDate: 2026-04-01\nReview: 2027-04-01\n\n## Context\nTeams in three regions publish events; cross-region traffic is expensive.\n## Drivers\n- latency: 3\n- cost: 4\n- operations effort: 3\n## Options\n- One global cluster: latency 2, cost 4, operations effort 5\n- One cluster per region: latency 5, cost 3, operations effort 2\n## Decision\nOne cluster per region\n## Consequences\nCross-region consumers read from replicated topics.\n\"\"\",\n    \"0007-feature-flags.md\": \"\"\"# ADR-007: Buy a feature-flag service\nStatus: superseded by ADR-009\nDate: 2026-06-30\n\n## Context\nReleases are blocked behind deploys.\n## Decision\nBuy rather than build\n## Consequences\nA new vendor dependency on the request path; flags are evaluated locally from a cached copy.\n\"\"\",\n}\n\ndef parse(text):\n    lines = text.splitlines()\n    number, title = lines[0][2:].split(\": \", 1)\n    adr = {\"number\": int(number[4:]), \"title\": title, \"headers\": {}, \"sections\": {}}\n    section = None\n    for line in lines[1:]:\n        if line.startswith(\"## \"):\n            section = line[3:]\n            adr[\"sections\"][section] = []\n        elif section:\n            if line.strip():\n                adr[\"sections\"][section].append(line)\n        elif \": \" in line:\n            key, value = line.split(\": \", 1)\n            adr[\"headers\"][key] = value\n    return adr\n\ndef matrix(adr):                                   # drivers {name: weight} and options [(name, {driver: score})]\n    drivers = {}\n    for line in adr[\"sections\"].get(\"Drivers\", []):\n        name, weight = line[2:].split(\": \")\n        drivers[name] = int(weight)\n    options = []\n    for line in adr[\"sections\"].get(\"Options\", []):\n        name, scores = line[2:].split(\": \", 1)\n        options.append((name, {s.rsplit(\" \", 1)[0]: int(s.rsplit(\" \", 1)[1]) for s in scores.split(\", \")}))\n    return drivers, options\n\ndef totals(drivers, options):\n    return [(name, sum(w * scores[d] for d, w in drivers.items())) for name, scores in options]\n\ndef winner(drivers, options):                      # the highest weighted total; ties go to the option listed first\n    scored = totals(drivers, options)\n    best = max(t for _, t in scored)\n    return next((name, t) for name, t in scored if t == best)\n\ndef flip(drivers, options):                        # the smallest change to one weight that lets a rival overtake\n    first, _ = winner(drivers, options)\n    for size in (1, 2, 3):\n        for driver in drivers:\n            for delta in (size, -size):\n                changed = dict(drivers, **{driver: drivers[driver] + delta})\n                if changed[driver] < 0:\n                    continue\n                scored = dict(totals(changed, options))\n                rival = winner(changed, options)[0]\n                if scored[rival] > scored[first]:\n                    return driver, delta, rival\n    return None\n\ndef check(folder):\n    adrs = []\n    for name in sorted(os.listdir(folder)):\n        with open(os.path.join(folder, name)) as f:\n            adrs.append(parse(f.read()))\n    by_number = {a[\"number\"]: a for a in adrs}\n    problems, tradeoffs = [], []\n    for n in range(1, max(by_number) + 1):\n        if n not in by_number:\n            problems.append(f\"ADR-{n:03d}: missing from the log (numbers are never reused)\")\n    for a in adrs:\n        tag, status = f\"ADR-{a['number']:03d}\", a[\"headers\"].get(\"Status\", \"\")\n        for section in REQUIRED:\n            if section not in a[\"sections\"]:\n                problems.append(f\"{tag}: no {section} section\")\n        if status.startswith(\"superseded by ADR-\"):\n            newer = by_number.get(int(status[-3:]))\n            if newer is None:\n                problems.append(f\"{tag}: superseded by {status[-7:]}, which doesn't exist\")\n            elif newer[\"headers\"].get(\"Supersedes\") != tag:\n                problems.append(f\"{tag}: {status[-7:]} doesn't say it supersedes {tag}\")\n        if status == \"accepted\" and a[\"headers\"].get(\"Review\", \"9999\") < TODAY:\n            problems.append(f\"{tag}: review was due on {a['headers']['Review']}\")\n        drivers, options = matrix(a)\n        if not options:\n            continue\n        best, top = winner(drivers, options)\n        chosen = a[\"sections\"][\"Decision\"][0]\n        if chosen != best:\n            problems.append(f\"{tag}: decided {chosen}, but the matrix favours {best}; record why\")\n            continue\n        runner = max((t, n) for n, t in totals(drivers, options) if n != best)\n        f = flip(drivers, options)\n        if f:\n            change = f\"rises by {f[1]}\" if f[1] > 0 else f\"falls by {-f[1]}\"\n            tradeoffs.append(f\"{tag}: {best} wins ({top} against {runner[1]}'s {runner[0]}), \"\n                             f\"but {f[2]} overtakes it if {f[0]}'s weight {change}\")\n        else:\n            tradeoffs.append(f\"{tag}: {best} wins ({top} against {runner[1]}'s {runner[0]}); \"\n                             \"no single weight change of up to 3 alters that\")\n    return adrs, problems, tradeoffs\n\nfolder = tempfile.mkdtemp(prefix=\"adr-\")\ntry:\n    for name, text in ADRS.items():\n        with open(os.path.join(folder, name), \"w\") as f:\n            f.write(text)\n    adrs, problems, tradeoffs = check(folder)\n    for a in adrs:\n        print(f\"ADR-{a['number']:03d} {a['title']}: {a['headers']['Status']}\")\n    print(\"trade-offs:\")\n    for line in tradeoffs:\n        print(\"  \" + line)\n    print(f\"{len(problems)} problems:\")\n    for line in problems:\n        print(\"  \" + line)\nfinally:\n    shutil.rmtree(folder)\n\nassert len(adrs) == 6 and sum(\"missing from the log\" in p for p in problems) == 1\nassert flip({\"a\": 1}, [(\"x\", {\"a\": 2}), (\"y\", {\"a\": 1})]) is None   # one driver: weights can't flip the order\nprint(\"decisions lab OK\")\n","out":"ADR-001 Use PostgreSQL for the order service: superseded by ADR-004\nADR-002 Publish order events through an outbox: accepted\nADR-003 Cache product pages at the CDN: proposed\nADR-004 Move orders to DynamoDB: accepted\nADR-005 Run one Kafka cluster per region: accepted\nADR-007 Buy a feature-flag service: superseded by ADR-009\ntrade-offs:\n  ADR-002: Outbox and relay wins (31 against Two-phase commit's 27); no single weight change of up to 3 alters that\n  ADR-004: DynamoDB wins (41 against PostgreSQL's 39), but PostgreSQL overtakes it if consistency's weight rises by 2\n5 problems:\n  ADR-006: missing from the log (numbers are never reused)\n  ADR-002: review was due on 2026-03-01\n  ADR-003: no Consequences section\n  ADR-005: decided One cluster per region, but the matrix favours One global cluster; record why\n  ADR-007: superseded by ADR-009, which doesn't exist\ndecisions lab OK\n"},{"lang":"javascript","src":"// An architecture decision log kept as files: parse the ADRs, check the log, and test each decision's trade-offs.\nconst fs = require(\"node:fs\");\nconst os = require(\"node:os\");\nconst path = require(\"node:path\");\n\nconst TODAY = \"2026-10-12\";\nconst REQUIRED = [\"Context\", \"Decision\", \"Consequences\"];\nconst ADRS = {\n  \"0001-order-database.md\": `# ADR-001: Use PostgreSQL for the order service\nStatus: superseded by ADR-004\nDate: 2024-03-02\n\n## Context\nOrders need transactions across order lines and payments.\n## Decision\nPostgreSQL\n## Consequences\nOne primary per region; vertical scaling until we shard.\n`,\n  \"0002-order-events.md\": `# ADR-002: Publish order events through an outbox\nStatus: accepted\nDate: 2024-05-10\nReview: 2026-03-01\n\n## Context\nEvents were lost when the service crashed between the commit and the publish.\n## Drivers\n- reliability: 5\n- effort: 2\n## Options\n- Outbox and relay: reliability 5, effort 3\n- Publish after commit: reliability 2, effort 5\n- Two-phase commit: reliability 5, effort 1\n## Decision\nOutbox and relay\n## Consequences\nConsumers must be idempotent; events can arrive twice.\n`,\n  \"0003-product-pages.md\": `# ADR-003: Cache product pages at the CDN\nStatus: proposed\nDate: 2026-09-20\n\n## Context\nProduct pages are 70% of traffic and change a few times a day.\n## Decision\nCache for 5 minutes and purge on change\n`,\n  \"0004-order-database-v2.md\": `# ADR-004: Move orders to DynamoDB\nStatus: accepted\nDate: 2026-02-14\nSupersedes: ADR-001\nReview: 2027-02-14\n\n## Context\nOrders grew ten times; the primary is at its largest size.\n## Drivers\n- consistency: 3\n- operations effort: 4\n- cost at scale: 3\n## Options\n- PostgreSQL: consistency 5, operations effort 3, cost at scale 4\n- DynamoDB: consistency 3, operations effort 5, cost at scale 4\n- Sharded PostgreSQL: consistency 4, operations effort 1, cost at scale 3\n## Decision\nDynamoDB\n## Consequences\nAccess patterns must be designed up front; transactions are limited to small sets of items.\n`,\n  \"0005-kafka-clusters.md\": `# ADR-005: Run one Kafka cluster per region\nStatus: accepted\nDate: 2026-04-01\nReview: 2027-04-01\n\n## Context\nTeams in three regions publish events; cross-region traffic is expensive.\n## Drivers\n- latency: 3\n- cost: 4\n- operations effort: 3\n## Options\n- One global cluster: latency 2, cost 4, operations effort 5\n- One cluster per region: latency 5, cost 3, operations effort 2\n## Decision\nOne cluster per region\n## Consequences\nCross-region consumers read from replicated topics.\n`,\n  \"0007-feature-flags.md\": `# ADR-007: Buy a feature-flag service\nStatus: superseded by ADR-009\nDate: 2026-06-30\n\n## Context\nReleases are blocked behind deploys.\n## Decision\nBuy rather than build\n## Consequences\nA new vendor dependency on the request path; flags are evaluated locally from a cached copy.\n`,\n};\n\nfunction parse(text) {\n  const lines = text.split(\"\\n\");\n  const [number, title] = splitOnce(lines[0].slice(2), \": \");\n  const adr = { number: Number(number.slice(4)), title, headers: {}, sections: {} };\n  let section = null;\n  for (const line of lines.slice(1)) {\n    if (line.startsWith(\"## \")) {\n      section = line.slice(3);\n      adr.sections[section] = [];\n    } else if (section) {\n      if (line.trim()) adr.sections[section].push(line);\n    } else if (line.includes(\": \")) {\n      const [key, value] = splitOnce(line, \": \");\n      adr.headers[key] = value;\n    }\n  }\n  return adr;\n}\n\nfunction splitOnce(text, separator) {\n  const i = text.indexOf(separator);\n  return [text.slice(0, i), text.slice(i + separator.length)];\n}\n\nfunction matrix(adr) {                                 // drivers {name: weight} and options [[name, {driver: score}]]\n  const drivers = {};\n  for (const line of adr.sections.Drivers ?? []) {\n    const [name, weight] = splitOnce(line.slice(2), \": \");\n    drivers[name] = Number(weight);\n  }\n  const options = [];\n  for (const line of adr.sections.Options ?? []) {\n    const [name, scores] = splitOnce(line.slice(2), \": \");\n    const parsed = {};\n    for (const s of scores.split(\", \")) {\n      const i = s.lastIndexOf(\" \");\n      parsed[s.slice(0, i)] = Number(s.slice(i + 1));\n    }\n    options.push([name, parsed]);\n  }\n  return [drivers, options];\n}\n\nfunction totals(drivers, options) {\n  return options.map(([name, scores]) => [name, Object.entries(drivers).reduce((sum, [d, w]) => sum + w * scores[d], 0)]);\n}\n\nfunction winner(drivers, options) {                    // the highest weighted total; ties go to the option listed first\n  const scored = totals(drivers, options);\n  const best = Math.max(...scored.map(([, t]) => t));\n  return scored.find(([, t]) => t === best);\n}\n\nfunction flip(drivers, options) {                      // the smallest change to one weight that lets a rival overtake\n  const [first] = winner(drivers, options);\n  for (const size of [1, 2, 3]) {\n    for (const driver of Object.keys(drivers)) {\n      for (const delta of [size, -size]) {\n        const changed = { ...drivers, [driver]: drivers[driver] + delta };\n        if (changed[driver] < 0) continue;\n        const scored = Object.fromEntries(totals(changed, options));\n        const [rival] = winner(changed, options);\n        if (scored[rival] > scored[first]) return [driver, delta, rival];\n      }\n    }\n  }\n  return null;\n}\n\nconst tagOf = n => `ADR-${String(n).padStart(3, \"0\")}`;\n\nfunction check(folder) {\n  const adrs = fs.readdirSync(folder).sort().map(name => parse(fs.readFileSync(path.join(folder, name), \"utf8\")));\n  const byNumber = new Map(adrs.map(a => [a.number, a]));\n  const problems = [], tradeoffs = [];\n  for (let n = 1; n <= Math.max(...byNumber.keys()); n++) {\n    if (!byNumber.has(n)) problems.push(`${tagOf(n)}: missing from the log (numbers are never reused)`);\n  }\n  for (const a of adrs) {\n    const tag = tagOf(a.number), status = a.headers.Status ?? \"\";\n    for (const section of REQUIRED) if (!(section in a.sections)) problems.push(`${tag}: no ${section} section`);\n    if (status.startsWith(\"superseded by ADR-\")) {\n      const newer = byNumber.get(Number(status.slice(-3)));\n      if (!newer) problems.push(`${tag}: superseded by ${status.slice(-7)}, which doesn't exist`);\n      else if (newer.headers.Supersedes !== tag) problems.push(`${tag}: ${status.slice(-7)} doesn't say it supersedes ${tag}`);\n    }\n    if (status === \"accepted\" && (a.headers.Review ?? \"9999\") < TODAY) problems.push(`${tag}: review was due on ${a.headers.Review}`);\n    const [drivers, options] = matrix(a);\n    if (!options.length) continue;\n    const [best, top] = winner(drivers, options);\n    const chosen = a.sections.Decision[0];\n    if (chosen !== best) {\n      problems.push(`${tag}: decided ${chosen}, but the matrix favours ${best}; record why`);\n      continue;\n    }\n    let runner = null;\n    for (const [n, t] of totals(drivers, options)) {\n      if (n !== best && (runner === null || t > runner[0] || (t === runner[0] && n > runner[1]))) runner = [t, n];\n    }\n    const f = flip(drivers, options);\n    if (f) {\n      const change = f[1] > 0 ? `rises by ${f[1]}` : `falls by ${-f[1]}`;\n      tradeoffs.push(`${tag}: ${best} wins (${top} against ${runner[1]}'s ${runner[0]}), but ${f[2]} overtakes it if ${f[0]}'s weight ${change}`);\n    } else {\n      tradeoffs.push(`${tag}: ${best} wins (${top} against ${runner[1]}'s ${runner[0]}); no single weight change of up to 3 alters that`);\n    }\n  }\n  return [adrs, problems, tradeoffs];\n}\n\nconst folder = fs.mkdtempSync(path.join(os.tmpdir(), \"adr-\"));\nlet adrs, problems, tradeoffs;\ntry {\n  for (const [name, text] of Object.entries(ADRS)) fs.writeFileSync(path.join(folder, name), text);\n  [adrs, problems, tradeoffs] = check(folder);\n  for (const a of adrs) console.log(`${tagOf(a.number)} ${a.title}: ${a.headers.Status}`);\n  console.log(\"trade-offs:\");\n  for (const line of tradeoffs) console.log(\"  \" + line);\n  console.log(`${problems.length} problems:`);\n  for (const line of problems) console.log(\"  \" + line);\n} finally {\n  fs.rmSync(folder, { recursive: true });\n}\n\nif (adrs.length !== 6 || problems.filter(p => p.includes(\"missing from the log\")).length !== 1) throw new Error(\"log checks\");\nif (flip({ a: 1 }, [[\"x\", { a: 2 }], [\"y\", { a: 1 }]]) !== null) throw new Error(\"flip\");   // one driver: weights can't flip the order\nconsole.log(\"decisions lab OK\");\n","out":"ADR-001 Use PostgreSQL for the order service: superseded by ADR-004\nADR-002 Publish order events through an outbox: accepted\nADR-003 Cache product pages at the CDN: proposed\nADR-004 Move orders to DynamoDB: accepted\nADR-005 Run one Kafka cluster per region: accepted\nADR-007 Buy a feature-flag service: superseded by ADR-009\ntrade-offs:\n  ADR-002: Outbox and relay wins (31 against Two-phase commit's 27); no single weight change of up to 3 alters that\n  ADR-004: DynamoDB wins (41 against PostgreSQL's 39), but PostgreSQL overtakes it if consistency's weight rises by 2\n5 problems:\n  ADR-006: missing from the log (numbers are never reused)\n  ADR-002: review was due on 2026-03-01\n  ADR-003: no Consequences section\n  ADR-005: decided One cluster per region, but the matrix favours One global cluster; record why\n  ADR-007: superseded by ADR-009, which doesn't exist\ndecisions lab OK\n"}]},"breakit":["Change ADR-004's decision to PostgreSQL and watch the finding move from the trade-offs to the problems.","Add ADR-009 superseding ADR-007, and check that the problem disappears only when ADR-009 says Supersedes: ADR-007.","Let flip count a tie as a flip, and explain why the result then depends on the order the options are listed in."]},{"id":"lab-capacity","t":"Measure a queue, check the model, then size and price the fleet","min":90,"mods":["m03"],"goal":"Build a small queueing simulator with random arrivals and service times, check it against Erlang's C formula, then use it the way a capacity planner would: find the smallest fleet whose p99 latency meets the target at next year's peak, add the servers needed to survive losing a zone, turn a forecast week into hourly server counts, and choose the commitment level that minimises the bill.","pre":["Python 3.12+ and Node.js 22.13+, standard libraries only","Read module 3"],"steps":["Generate exponential random numbers without logarithms, using von Neumann's method (it needs only comparisons), so Python and JavaScript produce identical streams; check the mean is close to 1.","Simulate c servers sharing one first-come, first-served queue: each arrival goes to the server that frees up first. Record the waits and the response times.","Compare the simulated mean wait at 12 servers and 450 requests a second with Erlang C, and note the p99.","Increase the fleet from just above full utilisation until the p99 response at 900 requests a second is within 100 ms, then make it zone-safe for three zones.","Size each hour of a forecast week at the utilisation that met the target, and find the commitment level with the lowest weekly cost."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"def mulberry32(seed): ...                       # copy the seeded generator from module 2\ndef exponential(rand): ...                      # TODO: von Neumann's method, using only comparisons\n\nSERVICE_MS, TARGET_P99_MS = 20, 100\n\ndef simulate(servers, per_second, count=20_000, seed=1): ...   # TODO: (mean wait, p99 response) in ms\ndef erlang_c_wait(servers, per_second): ...     # TODO: the formula's mean wait, in ms\n"},{"lang":"javascript","src":"function mulberry32(seed) { /* copy the seeded generator from module 2 */ }\nfunction exponential(rand) { /* TODO: von Neumann's method, using only comparisons */ }\n\nconst SERVICE_MS = 20, TARGET_P99_MS = 100;\nfunction simulate(servers, perSecond, count = 20000, seed = 1) { /* TODO: [mean wait, p99 response] in ms */ }\nfunction erlangCWait(servers, perSecond) { /* TODO: the formula's mean wait, in ms */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"Measure a queue, check it against the model, then size and price a fleet for next year's peak.\"\"\"\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef exponential(rand):                              # von Neumann's method: exact, and needs no logarithms\n    k = 0\n    while True:\n        first = low = rand()\n        n = 1\n        while True:\n            u = rand()\n            if u >= low:\n                break\n            low, n = u, n + 1\n        if n % 2 == 1:\n            return k + first\n        k += 1\n\nSERVICE_MS = 20                                     # mean service time; each server handles 50 requests a second\nTARGET_P99_MS = 100\n\ndef simulate(servers, per_second, count=20_000, seed=1):   # one shared first-come, first-served queue\n    rand = mulberry32(seed)\n    free_at = [0.0] * servers\n    t, waited, responses = 0.0, 0.0, []\n    for _ in range(count):\n        t += exponential(rand) * 1000 / per_second  # random (Poisson) arrivals\n        i = free_at.index(min(free_at))             # the server that frees up first\n        start = max(t, free_at[i])\n        free_at[i] = start + exponential(rand) * SERVICE_MS\n        waited += start - t                         # a plain running total, as in the JavaScript version\n        responses.append(free_at[i] - t)\n    responses.sort()\n    return waited / count, responses[(count * 99 + 99) // 100 - 1]\n\ndef erlang_c_wait(servers, per_second):             # the M/M/c formula for the mean wait, in ms\n    a = per_second * SERVICE_MS / 1000              # offered load, in servers' worth\n    term = total = 1.0\n    for k in range(1, servers):\n        term *= a / k\n        total += term\n    waiting = term * a / servers * servers / (servers - a)\n    return waiting / (total + waiting) * SERVICE_MS / (servers - a)\n\ndef tenths(x):\n    t = int(x * 10 + 0.5)\n    return f\"{t // 10}.{t % 10}\"\n\nwait, p99 = simulate(12, 450)\nprint(f\"model check, 12 servers at 450 req/s (75% busy): simulated mean wait {tenths(wait)} ms, \"\n      f\"Erlang C {tenths(erlang_c_wait(12, 450))} ms; simulated p99 response {tenths(p99)} ms\")\n\nPEAK = 900                                          # next year's forecast peak, requests a second\nservers = PEAK * SERVICE_MS // 1000 + 1             # start just above full utilisation\nwhile simulate(servers, PEAK)[1] > TARGET_P99_MS:\n    servers += 1\nbusy = PEAK * SERVICE_MS * 100 // (servers * 1000)\nzone_safe = -(-servers // 2) * 3                    # three zones; any two must carry the peak alone\nprint(f\"p99 within {TARGET_P99_MS} ms at {PEAK} req/s needs {servers} servers ({busy}% busy); \"\n      f\"to survive losing one of three zones: {zone_safe}\")\n\ndef hourly_rate(hour):                              # the forecast week: a weekday curve and quieter weekends\n    day, h = divmod(hour, 24)\n    base = 900 if 9 <= h < 18 else 500 if 7 <= h < 22 else 150\n    return base if day < 5 else base * 6 // 10\n\ndef needed(per_second):                             # zone-safe servers at the busy share that met the p99 target\n    n = -(-per_second * SERVICE_MS * 100 // (busy * 1000))\n    return -(-n // 2) * 3\n\nweek = [needed(hourly_rate(h)) for h in range(168)]\nON_DEMAND, COMMITTED = 40, 24                       # cents per server-hour, illustrative\ncost = lambda k: k * 168 * COMMITTED + sum(max(0, d - k) for d in week) * ON_DEMAND\nbest = min(range(max(week) + 1), key=cost)\ndollars = lambda c: f\"${c // 100:,}.{c % 100:02d}\"\nprint(f\"weekly fleet: {min(week)} to {max(week)} servers; all on demand {dollars(cost(0))}, \"\n      f\"committing to {best} servers {dollars(cost(best))} ({(cost(0) - cost(best)) * 100 // cost(0)}% less)\")\n\nrand = mulberry32(42)\ntotal = 0.0\nfor _ in range(100_000):\n    total += exponential(rand)\nassert 0.98 < total / 100_000 < 1.02                 # von Neumann's method really has mean 1\nassert abs(simulate(12, 450)[0] - erlang_c_wait(12, 450)) < 1.5\nassert simulate(servers - 1, PEAK)[1] > TARGET_P99_MS >= simulate(servers, PEAK)[1]\nprint(\"capacity lab OK\")\n","out":"model check, 12 servers at 450 req/s (75% busy): simulated mean wait 2.0 ms, Erlang C 1.8 ms; simulated p99 response 96.3 ms\np99 within 100 ms at 900 req/s needs 21 servers (85% busy); to survive losing one of three zones: 33\nweekly fleet: 6 to 33 servers; all on demand $1,170.00, committing to 12 servers $998.64 (14% less)\ncapacity lab OK\n"},{"lang":"javascript","src":"// Measure a queue, check it against the model, then size and price a fleet for next year's peak.\n\nfunction mulberry32(seed) {                            // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction exponential(rand) {                           // von Neumann's method: exact, and needs no logarithms\n  let k = 0;\n  for (;;) {\n    const first = rand();\n    let low = first, n = 1;\n    for (;;) {\n      const u = rand();\n      if (u >= low) break;\n      low = u;\n      n++;\n    }\n    if (n % 2 === 1) return k + first;\n    k++;\n  }\n}\n\nconst SERVICE_MS = 20;                                 // mean service time; each server handles 50 requests a second\nconst TARGET_P99_MS = 100;\n\nfunction simulate(servers, perSecond, count = 20000, seed = 1) {   // one shared first-come, first-served queue\n  const rand = mulberry32(seed);\n  const freeAt = new Array(servers).fill(0);\n  let t = 0, waited = 0;\n  const responses = [];\n  for (let r = 0; r < count; r++) {\n    t += exponential(rand) * 1000 / perSecond;         // random (Poisson) arrivals\n    const i = freeAt.indexOf(Math.min(...freeAt));     // the server that frees up first\n    const start = Math.max(t, freeAt[i]);\n    freeAt[i] = start + exponential(rand) * SERVICE_MS;\n    waited += start - t;\n    responses.push(freeAt[i] - t);\n  }\n  responses.sort((a, b) => a - b);\n  return [waited / count, responses[Math.floor((count * 99 + 99) / 100) - 1]];\n}\n\nfunction erlangCWait(servers, perSecond) {             // the M/M/c formula for the mean wait, in ms\n  const a = perSecond * SERVICE_MS / 1000;             // offered load, in servers' worth\n  let term = 1, total = 1;\n  for (let k = 1; k < servers; k++) {\n    term *= a / k;\n    total += term;\n  }\n  const waiting = term * a / servers * servers / (servers - a);\n  return waiting / (total + waiting) * SERVICE_MS / (servers - a);\n}\n\nconst tenths = x => { const t = Math.floor(x * 10 + 0.5); return `${Math.floor(t / 10)}.${t % 10}`; };\n\nconst [wait, p99] = simulate(12, 450);\nconsole.log(`model check, 12 servers at 450 req/s (75% busy): simulated mean wait ${tenths(wait)} ms, ` +\n            `Erlang C ${tenths(erlangCWait(12, 450))} ms; simulated p99 response ${tenths(p99)} ms`);\n\nconst PEAK = 900;                                      // next year's forecast peak, requests a second\nlet servers = Math.floor(PEAK * SERVICE_MS / 1000) + 1;   // start just above full utilisation\nwhile (simulate(servers, PEAK)[1] > TARGET_P99_MS) servers++;\nconst busy = Math.floor(PEAK * SERVICE_MS * 100 / (servers * 1000));\nconst zoneSafe = Math.ceil(servers / 2) * 3;           // three zones; any two must carry the peak alone\nconsole.log(`p99 within ${TARGET_P99_MS} ms at ${PEAK} req/s needs ${servers} servers (${busy}% busy); ` +\n            `to survive losing one of three zones: ${zoneSafe}`);\n\nfunction hourlyRate(hour) {                            // the forecast week: a weekday curve and quieter weekends\n  const day = Math.floor(hour / 24), h = hour % 24;\n  const base = 9 <= h && h < 18 ? 900 : 7 <= h && h < 22 ? 500 : 150;\n  return day < 5 ? base : Math.floor(base * 6 / 10);\n}\n\nfunction needed(perSecond) {                           // zone-safe servers at the busy share that met the p99 target\n  const n = Math.ceil(perSecond * SERVICE_MS * 100 / (busy * 1000));\n  return Math.ceil(n / 2) * 3;\n}\n\nconst week = Array.from({ length: 168 }, (_, h) => needed(hourlyRate(h)));\nconst ON_DEMAND = 40, COMMITTED = 24;                  // cents per server-hour, illustrative\nconst cost = k => k * 168 * COMMITTED + week.reduce((sum, d) => sum + Math.max(0, d - k), 0) * ON_DEMAND;\nlet best = 0;\nfor (let k = 1; k <= Math.max(...week); k++) if (cost(k) < cost(best)) best = k;\nconst dollars = c => `$${Math.floor(c / 100).toLocaleString(\"en-US\")}.${String(c % 100).padStart(2, \"0\")}`;\nconsole.log(`weekly fleet: ${Math.min(...week)} to ${Math.max(...week)} servers; all on demand ${dollars(cost(0))}, ` +\n            `committing to ${best} servers ${dollars(cost(best))} (${Math.floor((cost(0) - cost(best)) * 100 / cost(0))}% less)`);\n\nconst rand = mulberry32(42);\nlet sum = 0;\nfor (let i = 0; i < 100000; i++) sum += exponential(rand);\nif (!(sum / 100000 > 0.98 && sum / 100000 < 1.02)) throw new Error(\"von Neumann's method should have mean 1\");\nif (Math.abs(simulate(12, 450)[0] - erlangCWait(12, 450)) >= 1.5) throw new Error(\"simulation and formula disagree\");\nif (!(simulate(servers - 1, PEAK)[1] > TARGET_P99_MS && TARGET_P99_MS >= simulate(servers, PEAK)[1])) throw new Error(\"not the smallest fleet\");\nconsole.log(\"capacity lab OK\");\n","out":"model check, 12 servers at 450 req/s (75% busy): simulated mean wait 2.0 ms, Erlang C 1.8 ms; simulated p99 response 96.3 ms\np99 within 100 ms at 900 req/s needs 21 servers (85% busy); to survive losing one of three zones: 33\nweekly fleet: 6 to 33 servers; all on demand $1,170.00, committing to 12 servers $998.64 (14% less)\ncapacity lab OK\n"}]},"breakit":["Make the service times constant instead of exponential and watch the waits and the p99 fall: variability, not just utilisation, drives queueing.","Give each server its own queue, assigning arrivals at random, and compare the p99 with the shared queue at the same fleet size.","Tighten the target to 95 ms, then to 93 ms (cap the search loop first), and explain the result: the p99 of the service time alone is about 92 ms, so beyond a point more servers can't help, and only a faster service or a looser target will."]},{"id":"lab-migration","t":"An online migration between two databases, with crashes, half-done writes and verification","min":90,"mods":["m04"],"goal":"Move 2,000 customer records from an old SQLite store to a new one with a different shape (name split into first and last), while the application keeps updating them. Dual write every update, backfill in batches with conditional writes and a checkpoint, crash the backfill and resume it, let some dual writes die halfway, then find and repair every difference with range checksums, run a parallel read check, and only then contract.","pre":["Python 3.12+ (sqlite3) and Node.js 22.13+ (node:sqlite)","Read module 4"],"steps":["Create the old store with 2,000 customers and a version column, and the new store with the new shape: the expand step.","Write the application's update as a dual write: update the old store, then upsert the new one only if the version is newer. Make one in a hundred die between the two writes.","Write a backfill that reads a batch, lets live traffic run, writes the batch conditionally, and saves a checkpoint; crash it after batch 4, before the checkpoint, and resume it.","Keep dual writes going after the backfill, then compare the stores range by range with checksums, and repair each differing record from the old store.","Read 500 random records from both stores and count mismatches; switch reads, then drop the old table: the contract step."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import sqlite3\n\ndef mulberry32(seed): ...                       # copy the seeded generator from module 4\n\nUPSERT = \"...\"                                  # TODO: insert, or update only WHERE excluded.version > customers.version\n\ndef live_update(): ...                          # TODO: old store first, then the new one; sometimes die in between\ndef backfill(crash_after=None): ...             # TODO: batches from the checkpoint, conditional writes, then save it\ndef verify_and_repair(): ...                    # TODO: checksums per range, then record by record where they differ\n"},{"lang":"javascript","src":"const { DatabaseSync } = require(\"node:sqlite\");\n\nfunction mulberry32(seed) { /* copy the seeded generator from module 4 */ }\nconst UPSERT_SQL = \"...\";                       // TODO: insert, or update only WHERE excluded.version > customers.version\nfunction liveUpdate() { /* TODO: old store first, then the new one; sometimes die in between */ }\nfunction backfill(crashAfter = null) { /* TODO: batches from the checkpoint, conditional writes, then save it */ }\nfunction verifyAndRepair() { /* TODO: checksums per range, then record by record where they differ */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"An online migration between two databases: expand, dual writes, a resumable backfill, verification, switch, contract.\"\"\"\nimport sqlite3\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nFIRST = [\"Ada\", \"Alan\", \"Grace\", \"Edsger\", \"Barbara\", \"Donald\", \"Frances\", \"Ken\"]\nLAST = [\"Lovelace\", \"Turing\", \"Hopper\", \"Dijkstra\", \"Liskov\", \"Knuth\", \"Allen\", \"Thompson\"]\nN, BATCH, RANGE = 2_000, 200, 100\nrand = mulberry32(2026)\n\nold = sqlite3.connect(\":memory:\", isolation_level=None)   # the old store: the source of truth until the switch\nold.execute(\"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT, version INTEGER)\")\nold.execute(\"BEGIN\")\nfor i in range(1, N + 1):\n    old.execute(\"INSERT INTO customers VALUES (?, ?, ?, 1)\",\n                (i, f\"{FIRST[i % 8]} {LAST[i * 3 % 8]}\", f\"c{i}@example.com\"))\nold.execute(\"COMMIT\")\n\nnew = sqlite3.connect(\":memory:\", isolation_level=None)   # expand: the new store with the new shape\nnew.execute(\"CREATE TABLE customers (id INTEGER PRIMARY KEY, first_name TEXT, last_name TEXT, email TEXT, version INTEGER)\")\nUPSERT = \"\"\"INSERT INTO customers VALUES (?, ?, ?, ?, ?) ON CONFLICT(id) DO UPDATE SET\n            first_name = excluded.first_name, last_name = excluded.last_name, email = excluded.email,\n            version = excluded.version WHERE excluded.version > customers.version\"\"\"\n\ndef to_new(row):                                    # (id, name, email, version) -> the new shape\n    first, last = row[1].split(\" \", 1)\n    return row[0], first, last, row[2], row[3]\n\nstats = {\"updates\": 0, \"half_done\": 0}\n\ndef live_update():                                  # the application, dual writing: old store first, then the new one\n    i = 1 + int(rand() * N)\n    name = f\"{FIRST[int(rand() * 8)]} {LAST[int(rand() * 8)]}\"\n    old.execute(\"UPDATE customers SET name = ?, version = version + 1 WHERE id = ?\", (name, i))\n    row = old.execute(\"SELECT id, name, email, version FROM customers WHERE id = ?\", (i,)).fetchone()\n    stats[\"updates\"] += 1\n    if rand() < 0.01:                               # the process dies between the two writes\n        stats[\"half_done\"] += 1\n        return\n    new.execute(UPSERT, to_new(row))\n\ndef backfill(crash_after=None):                     # resumable: the checkpoint is the last id copied\n    checkpoint = new.execute(\"SELECT COALESCE(MAX(value), 0) FROM progress\").fetchone()[0]\n    batches = 0\n    while True:\n        rows = old.execute(\"SELECT id, name, email, version FROM customers WHERE id > ? ORDER BY id LIMIT ?\",\n                           (checkpoint, BATCH)).fetchall()\n        if not rows:\n            return batches\n        for _ in range(30):                         # live traffic keeps going while the batch is in flight\n            live_update()\n        new.execute(\"BEGIN\")\n        for row in rows:\n            new.execute(UPSERT, to_new(row))        # conditional: never overwrite a newer dual-written version\n        new.execute(\"COMMIT\")\n        batches += 1\n        if crash_after == batches:\n            return None                             # crashed before saving the checkpoint\n        checkpoint = rows[-1][0]\n        new.execute(\"INSERT INTO progress VALUES (?)\", (checkpoint,))\n\ndef fnv(text):\n    h = 2166136261\n    for byte in text.encode():\n        h = ((h ^ byte) * 16777619) & 0xFFFFFFFF\n    return h\n\ndef mix(h):                                         # MurmurHash3's finaliser, so small edits can't cancel out in a sum\n    h ^= h >> 16\n    h = (h * 0x85EBCA6B) & 0xFFFFFFFF\n    h ^= h >> 13\n    h = (h * 0xC2B2AE35) & 0xFFFFFFFF\n    return h ^ (h >> 16)\n\ndef snapshot(start, end):                           # each store's rows for ids start..end - 1, in one canonical form\n    a = {r[0]: \"|\".join(map(str, to_new(r))) for r in old.execute(\n        \"SELECT id, name, email, version FROM customers WHERE id >= ? AND id < ?\", (start, end))}\n    b = {r[0]: \"|\".join(map(str, r)) for r in new.execute(\n        \"SELECT id, first_name, last_name, email, version FROM customers WHERE id >= ? AND id < ?\", (start, end))}\n    return a, b\n\ndef verify_and_repair():\n    differing = repaired = 0\n    for start in range(1, N + 1, RANGE):\n        a, b = snapshot(start, start + RANGE)\n        if sum(mix(fnv(x)) for x in a.values()) % 2**32 == sum(mix(fnv(x)) for x in b.values()) % 2**32:\n            continue                                # one number per range, not RANGE rows\n        differing += 1\n        for i in sorted(set(a) | set(b)):\n            if a.get(i) != b.get(i):\n                row = old.execute(\"SELECT id, name, email, version FROM customers WHERE id = ?\", (i,)).fetchone()\n                new.execute(UPSERT, to_new(row))    # the old store is still the source of truth\n                repaired += 1\n    return differing, repaired\n\nnew.execute(\"CREATE TABLE progress (value INTEGER)\")\nfirst_run = backfill(crash_after=4)\nresumed = backfill()\ncopied = new.execute(\"SELECT COUNT(*) FROM customers\").fetchone()[0]\nprint(f\"backfill: crashed after 4 batches, resumed from the checkpoint and ran {resumed} more, \"\n      f\"redoing batch 4 safely; {copied:,} rows copied\")\nfor _ in range(300):                                # dual writes continue until reads and writes have switched\n    live_update()\nprint(f\"live traffic during and after the backfill: {stats['updates']} dual writes, {stats['half_done']} died halfway\")\ndiffering, repaired = verify_and_repair()\nprint(f\"verify: {differing} of {N // RANGE} ranges differed; {repaired} records repaired from the old store\")\nagain = verify_and_repair()\nprint(f\"verify again: {again[0]} ranges differ\")\n\nreads = mismatches = 0\nfor _ in range(500):                                # parallel run: read both, serve the old answer, count differences\n    i = 1 + int(rand() * N)\n    a = to_new(old.execute(\"SELECT id, name, email, version FROM customers WHERE id = ?\", (i,)).fetchone())\n    b = new.execute(\"SELECT id, first_name, last_name, email, version FROM customers WHERE id = ?\", (i,)).fetchone()\n    reads, mismatches = reads + 1, mismatches + (a != tuple(b))\nprint(f\"parallel reads: {reads} compared, {mismatches} mismatches: switch reads to the new store\")\nold.execute(\"DROP TABLE customers\")                 # contract, once nothing reads or writes the old table\nprint(\"contract: dual writes off, old table dropped\")\n\nassert first_run is None and resumed == 7 and copied == N\nassert 0 < repaired <= stats[\"half_done\"] and again == (0, 0) and mismatches == 0\nprint(\"migration lab OK\")\n","out":"backfill: crashed after 4 batches, resumed from the checkpoint and ran 7 more, redoing batch 4 safely; 2,000 rows copied\nlive traffic during and after the backfill: 630 dual writes, 7 died halfway\nverify: 5 of 20 ranges differed; 5 records repaired from the old store\nverify again: 0 ranges differ\nparallel reads: 500 compared, 0 mismatches: switch reads to the new store\ncontract: dual writes off, old table dropped\nmigration lab OK\n"},{"lang":"javascript","src":"// An online migration between two databases: expand, dual writes, a resumable backfill, verification, switch, contract.\nconst { DatabaseSync } = require(\"node:sqlite\");\n\nfunction mulberry32(seed) {                            // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst FIRST = [\"Ada\", \"Alan\", \"Grace\", \"Edsger\", \"Barbara\", \"Donald\", \"Frances\", \"Ken\"];\nconst LAST = [\"Lovelace\", \"Turing\", \"Hopper\", \"Dijkstra\", \"Liskov\", \"Knuth\", \"Allen\", \"Thompson\"];\nconst N = 2000, BATCH = 200, RANGE = 100;\nconst rand = mulberry32(2026);\n\nconst old = new DatabaseSync(\":memory:\");              // the old store: the source of truth until the switch\nold.exec(\"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT, email TEXT, version INTEGER)\");\nold.exec(\"BEGIN\");\nconst insertOld = old.prepare(\"INSERT INTO customers VALUES (?, ?, ?, 1)\");\nfor (let i = 1; i <= N; i++) insertOld.run(i, `${FIRST[i % 8]} ${LAST[(i * 3) % 8]}`, `c${i}@example.com`);\nold.exec(\"COMMIT\");\n\nconst fresh = new DatabaseSync(\":memory:\");            // expand: the new store with the new shape\nfresh.exec(\"CREATE TABLE customers (id INTEGER PRIMARY KEY, first_name TEXT, last_name TEXT, email TEXT, version INTEGER)\");\nconst upsert = fresh.prepare(`INSERT INTO customers VALUES (?, ?, ?, ?, ?) ON CONFLICT(id) DO UPDATE SET\n            first_name = excluded.first_name, last_name = excluded.last_name, email = excluded.email,\n            version = excluded.version WHERE excluded.version > customers.version`);\nconst readOld = old.prepare(\"SELECT id, name, email, version FROM customers WHERE id = ?\");\nconst readNew = fresh.prepare(\"SELECT id, first_name, last_name, email, version FROM customers WHERE id = ?\");\n\nfunction toNew(row) {                                  // {id, name, email, version} -> the new shape, as an array\n  const space = row.name.indexOf(\" \");\n  return [row.id, row.name.slice(0, space), row.name.slice(space + 1), row.email, row.version];\n}\nconst asArray = r => [r.id, r.first_name, r.last_name, r.email, r.version];\n\nconst stats = { updates: 0, halfDone: 0 };\n\nfunction liveUpdate() {                                // the application, dual writing: old store first, then the new one\n  const i = 1 + Math.floor(rand() * N);\n  const name = `${FIRST[Math.floor(rand() * 8)]} ${LAST[Math.floor(rand() * 8)]}`;\n  old.prepare(\"UPDATE customers SET name = ?, version = version + 1 WHERE id = ?\").run(name, i);\n  const row = readOld.get(i);\n  stats.updates++;\n  if (rand() < 0.01) {                                 // the process dies between the two writes\n    stats.halfDone++;\n    return;\n  }\n  upsert.run(...toNew(row));\n}\n\nfunction backfill(crashAfter = null) {                 // resumable: the checkpoint is the last id copied\n  let checkpoint = fresh.prepare(\"SELECT COALESCE(MAX(value), 0) AS v FROM progress\").get().v;\n  let batches = 0;\n  const page = old.prepare(\"SELECT id, name, email, version FROM customers WHERE id > ? ORDER BY id LIMIT ?\");\n  for (;;) {\n    const rows = page.all(checkpoint, BATCH);\n    if (!rows.length) return batches;\n    for (let u = 0; u < 30; u++) liveUpdate();         // live traffic keeps going while the batch is in flight\n    fresh.exec(\"BEGIN\");\n    for (const row of rows) upsert.run(...toNew(row)); // conditional: never overwrite a newer dual-written version\n    fresh.exec(\"COMMIT\");\n    batches++;\n    if (crashAfter === batches) return null;           // crashed before saving the checkpoint\n    checkpoint = rows[rows.length - 1].id;\n    fresh.prepare(\"INSERT INTO progress VALUES (?)\").run(checkpoint);\n  }\n}\n\nfunction fnv(text) {\n  let h = 2166136261;\n  for (const byte of Buffer.from(text)) h = Math.imul(h ^ byte, 16777619) >>> 0;\n  return h;\n}\n\nfunction mix(h) {                                      // MurmurHash3's finaliser, so small edits can't cancel out in a sum\n  h ^= h >>> 16;\n  h = Math.imul(h, 0x85ebca6b);\n  h ^= h >>> 13;\n  h = Math.imul(h, 0xc2b2ae35);\n  return (h ^ (h >>> 16)) >>> 0;\n}\n\nfunction snapshot(start, end) {                        // each store's rows for ids start..end - 1, in one canonical form\n  const a = new Map(old.prepare(\"SELECT id, name, email, version FROM customers WHERE id >= ? AND id < ?\")\n    .all(start, end).map(r => [r.id, toNew(r).join(\"|\")]));\n  const b = new Map(fresh.prepare(\"SELECT id, first_name, last_name, email, version FROM customers WHERE id >= ? AND id < ?\")\n    .all(start, end).map(r => [r.id, asArray(r).join(\"|\")]));\n  return [a, b];\n}\n\nconst checksum = map => [...map.values()].reduce((sum, text) => sum + mix(fnv(text)), 0) % 2 ** 32;\n\nfunction verifyAndRepair() {\n  let differing = 0, repaired = 0;\n  for (let start = 1; start <= N; start += RANGE) {\n    const [a, b] = snapshot(start, start + RANGE);\n    if (checksum(a) === checksum(b)) continue;         // one number per range, not RANGE rows\n    differing++;\n    const ids = [...new Set([...a.keys(), ...b.keys()])].sort((x, y) => x - y);\n    for (const i of ids) {\n      if (a.get(i) !== b.get(i)) {\n        upsert.run(...toNew(readOld.get(i)));          // the old store is still the source of truth\n        repaired++;\n      }\n    }\n  }\n  return [differing, repaired];\n}\n\nfresh.exec(\"CREATE TABLE progress (value INTEGER)\");\nconst firstRun = backfill(4);\nconst resumed = backfill();\nconst copied = fresh.prepare(\"SELECT COUNT(*) AS n FROM customers\").get().n;\nconsole.log(`backfill: crashed after 4 batches, resumed from the checkpoint and ran ${resumed} more, ` +\n            `redoing batch 4 safely; ${copied.toLocaleString(\"en-US\")} rows copied`);\nfor (let u = 0; u < 300; u++) liveUpdate();            // dual writes continue until reads and writes have switched\nconsole.log(`live traffic during and after the backfill: ${stats.updates} dual writes, ${stats.halfDone} died halfway`);\nconst [differing, repaired] = verifyAndRepair();\nconsole.log(`verify: ${differing} of ${N / RANGE} ranges differed; ${repaired} records repaired from the old store`);\nconst again = verifyAndRepair();\nconsole.log(`verify again: ${again[0]} ranges differ`);\n\nlet reads = 0, mismatches = 0;\nfor (let r = 0; r < 500; r++) {                        // parallel run: read both, serve the old answer, count differences\n  const i = 1 + Math.floor(rand() * N);\n  const a = toNew(readOld.get(i)), b = asArray(readNew.get(i));\n  reads++;\n  if (a.join(\"|\") !== b.join(\"|\")) mismatches++;\n}\nconsole.log(`parallel reads: ${reads} compared, ${mismatches} mismatches: switch reads to the new store`);\nold.exec(\"DROP TABLE customers\");                      // contract, once nothing reads or writes the old table\nconsole.log(\"contract: dual writes off, old table dropped\");\n\nif (firstRun !== null || resumed !== 7 || copied !== N) throw new Error(\"backfill\");\nif (!(repaired > 0 && repaired <= stats.halfDone) || again[0] !== 0 || again[1] !== 0 || mismatches !== 0) throw new Error(\"verification\");\nconsole.log(\"migration lab OK\");\n","out":"backfill: crashed after 4 batches, resumed from the checkpoint and ran 7 more, redoing batch 4 safely; 2,000 rows copied\nlive traffic during and after the backfill: 630 dual writes, 7 died halfway\nverify: 5 of 20 ranges differed; 5 records repaired from the old store\nverify again: 0 ranges differ\nparallel reads: 500 compared, 0 mismatches: switch reads to the new store\ncontract: dual writes off, old table dropped\nmigration lab OK\n"}]},"breakit":["Make the backfill's write unconditional and count the records it rolls back to older versions.","Remove the checkpoint and restart the backfill from the beginning after the crash: what does it cost, and is the result still right?","Drop the old table before the second verification and explain what you can no longer repair."]},{"id":"lab-serving","t":"An LLM serving simulator: continuous batching, a paged KV cache and prefix caching","min":90,"mods":["m06","m03"],"goal":"Simulate an LLM server step by step: requests arrive at random, wait in a queue, and join a continuous batch when there's KV cache memory for them; each decode step costs a fixed time plus a little per sequence and per prefilled token; memory is allocated in 16-token blocks as requests grow, and when it runs out the newest request is preempted and recomputed later. Measure time to first token and time per token at the 95th percentile, then find the highest load that meets both targets, with and without a cached shared system prompt.","pre":["Python 3.12+ and Node.js 22.13+, standard libraries only","Read module 6, and module 3 for queueing"],"steps":["Generate 400 requests with random arrivals (von Neumann's exponential), a 512-token shared system prompt plus 50 to 500 tokens of their own, and 50 to 400 output tokens.","Each step: admit queued requests while the batch has room and the KV pool has blocks for their prompt plus one, then advance the clock by the step's cost.","Give every active request one more token; record its first token time; allocate a new block when it crosses a 16-token boundary, preempting the newest request if the pool is empty.","With prefix caching, the shared prompt's blocks are loaded once and shared, so requests prefill and store only their own tokens.","Report p95 time to first token, p95 time per token, throughput and preemptions; raise the load in steps of two requests a second until a target is missed."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"def mulberry32(seed): ...                       # copy the seeded generator from module 6\ndef exponential(rand): ...
