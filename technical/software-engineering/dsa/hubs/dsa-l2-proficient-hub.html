ing","https://en.wikipedia.org/wiki/Backtracking"],["Jeff Erickson, Algorithms (free textbook): backtracking chapter","https://jeffe.cs.illinois.edu/teaching/algorithms/"],["USACO Guide: Complete search with recursion","https://usaco.guide/bronze/complete-rec"],["Python docs: itertools (combinations, permutations, product)","https://docs.python.org/3/library/itertools.html"]]},{"id":"m09","d":"d3","t":"Dynamic programming: one dimension","min":110,"hook":"Dynamic programming turns exponential brute force into short, fast loops whenever the same smaller question gets asked again and again. It's the most feared interview topic, and also the most formulaic once you learn to name the state.","pre":{"q":"To count the ways to climb 5 stairs taking 1 or 2 steps at a time, what smaller questions do you need answered first?","a":"The ways to reach stair 4 and stair 3: every route to stair 5 ends with a 1-step from 4 or a 2-step from 3. So ways(5) = ways(4) + ways(3), and those break down the same way."},"kid":{"t":"Sticky notes on the treehouse stairs","x":"Ben wants to know how many ways he can hop up the 10 stairs to the treehouse, taking one or two stairs at a time. He notices that every way to stair 10 comes from stair 9 or stair 8. So he works from the bottom up and sticks a note on each stair with its number of ways: stair 1 has 1 way, stair 2 has 2, stair 3 has 1 + 2 = 3, and so on. Each new note just adds the two notes below it. He never has to count the same stair twice.","map":[["“How many ways to reach stair 10?”","The state: dp[i] = the number of ways to reach step i"],["Every way to stair 10 comes from stair 9 or stair 8","The recurrence: dp[i] = dp[i − 1] + dp[i − 2]"],["The notes on stairs 1 and 2, written first","Base cases: dp[1] = 1, dp[2] = 2"],["Sticky notes, so no stair is counted twice","Memoisation or a table: each subproblem is solved once"]],"brk":"Ben's notes can hold any number, but JavaScript's numbers stop being exact after stair 77 (the count passes 2⁵³), so big counts need BigInt; Python's ints have no such limit. And real DP problems often need more than one number per stair, such as whether the last hop was a 2-step."},"keys":["**Use DP when** a problem has optimal substructure (the answer is built from answers to smaller versions) and overlapping subproblems (the same smaller versions come up again and again).","**Four steps**: (1) define the state in words, such as “dp[i] = the best answer for the first i items”; (2) write the recurrence; (3) set the base cases; (4) choose the order (top-down memo or bottom-up table) and where the final answer sits.","**Top-down (memoisation)**: write the recursion and cache the results (`@functools.cache` / a `Map`). Closest to the brute force; deep recursion can be a problem for large n.","**Bottom-up (tabulation)**: fill a table from the base cases upwards in a loop. No recursion limit, and easy to shrink.","**Space optimisation**: when dp[i] only reads the last one or two values, keep two variables instead of the whole array: O(1) space.","**Classic 1D shapes**: count the ways (stairs, decode ways), minimum cost (coin change), take-or-skip (house robber: `dp[i] = max(dp[i − 1], dp[i − 2] + nums[i])`), best-ending-here (Kadane's maximum subarray), and yes/no splits (word break: can the first i characters be split?).","**Mark impossible states**: coin change starts every amount above 0 at infinity (“can't make it yet”) and returns −1 if the target is still infinity at the end.","**Complexity** = number of states × work per state: coin change is O(amount × coins); house robber is O(n)."],"dia":[{"type":"cells","cap":"Climbing stairs: dp[i] = dp[i − 1] + dp[i − 2]","rows":[{"label":"dp","vals":[1,1,2,3,5,8,13],"hl":[4,5],"ok":[6]}],"note":"dp[0] = 1 (one way to stand still) and dp[1] = 1. Each cell adds the two before it: dp[6] = 5 + 8 = 13."},{"type":"cells","cap":"House robber: rob a house, or skip it","rows":[{"label":"value","vals":[2,7,9,3,1]},{"label":"best","vals":[2,7,11,11,12],"ok":[4]}],"note":"best[i] = max(skip house i: best[i − 1], rob it: best[i − 2] + value[i]). The best total is 12 = 2 + 9 + 1."}],"cmp":[{"cap":"Top-down or bottom-up?","head":["","Top-down (memoised recursion)","Bottom-up (table)"],"rows":[["How you write it","The natural recursion plus a cache","A loop that fills dp in order"],["States computed","Only the ones actually needed","All of them"],["Recursion limit","Python stops near 1,000 deep; Node.js overflows after several thousand frames","None"],["Shrinking the memory","Hard","Easy: keep only what the recurrence reads"],["Good first draft?","Yes: closest to the brute force","Yes, once the fill order is clear"]]}],"code":[{"t":"Climbing stairs: brute force, memoised, two variables","tabs":[{"lang":"python","src":"from functools import cache\n\ndef climb_brute(n):                     # O(2^n): recomputes the same stairs\n    if n <= 1:\n        return 1\n    return climb_brute(n - 1) + climb_brute(n - 2)\n\n@cache\ndef climb_memo(n):                      # O(n): each stair solved once\n    if n <= 1:\n        return 1\n    return climb_memo(n - 1) + climb_memo(n - 2)\n\ndef climb_table(n):                     # O(n) time, O(1) space\n    prev2, prev1 = 1, 1                 # dp[0], dp[1]\n    for _ in range(2, n + 1):\n        prev2, prev1 = prev1, prev1 + prev2\n    return prev1\n\nprint(climb_brute(20), climb_memo(20), climb_table(20), climb_table(70))\n","out":"10946 10946 10946 308061521170129","notes":[[6,"Each call makes two more, so the number of calls grows exponentially (about 1.6× per extra stair): about 22,000 calls for n = 20."],[17,"dp[i] only needs the previous two values, so two variables replace the whole table."]]},{"lang":"javascript","src":"function climbBrute(n) {                // O(2^n): recomputes the same stairs\n  if (n <= 1) return 1;\n  return climbBrute(n - 1) + climbBrute(n - 2);\n}\n\nconst memo = new Map();\nfunction climbMemo(n) {                 // O(n): each stair solved once\n  if (n <= 1) return 1;\n  if (!memo.has(n)) memo.set(n, climbMemo(n - 1) + climbMemo(n - 2));\n  return memo.get(n);\n}\n\nfunction climbTable(n) {                // O(n) time, O(1) space\n  let prev2 = 1, prev1 = 1;             // dp[0], dp[1]\n  for (let i = 2; i <= n; i++) [prev2, prev1] = [prev1, prev1 + prev2];\n  return prev1;\n}\n\nconsole.log(climbBrute(20), climbMemo(20), climbTable(20), climbTable(70));\n","out":"10946 10946 10946 308061521170129","notes":[[9,"Check the cache first; compute and store only on a miss."],[15,"dp[i] only needs the previous two values, so two variables replace the whole table."]]}]},{"t":"Take-or-skip (house robber) and best-ending-here (Kadane)","tabs":[{"lang":"python","src":"def rob(nums):                          # dp[i] = max(dp[i - 1], dp[i - 2] + nums[i])\n    prev2, prev1 = 0, 0                 # best totals two houses back and one house back\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1\n\ndef max_subarray(nums):                 # Kadane: the best sum of a run ending here\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x, cur + x)           # extend the run, or start fresh at x\n        best = max(best, cur)\n    return best\n\nprint(rob([2, 7, 9, 3, 1]), rob([1, 2, 3, 1]), rob([]), rob([5]))\nprint(max_subarray([-2, 1, -3, 4, -1, 2, 1, -5, 4]), max_subarray([-3, -1, -2]))\n","out":"12 4 0 5\n6 -1\n","notes":[[4,"Skip this house (keep prev1) or rob it (prev2 + x, because the neighbour must be skipped)."],[10,"A run ending at x either extends the best run ending at the previous element or starts over at x."]]},{"lang":"javascript","src":"function rob(nums) {                    // dp[i] = max(dp[i - 1], dp[i - 2] + nums[i])\n  let prev2 = 0, prev1 = 0;             // best totals two houses back and one house back\n  for (const x of nums) [prev2, prev1] = [prev1, Math.max(prev1, prev2 + x)];\n  return prev1;\n}\n\nfunction maxSubarray(nums) {            // Kadane: the best sum of a run ending here\n  let best = nums[0], cur = nums[0];\n  for (const x of nums.slice(1)) {\n    cur = Math.max(x, cur + x);         // extend the run, or start fresh at x\n    best = Math.max(best, cur);\n  }\n  return best;\n}\n\nconsole.log(rob([2, 7, 9, 3, 1]), rob([1, 2, 3, 1]), rob([]), rob([5]));\nconsole.log(maxSubarray([-2, 1, -3, 4, -1, 2, 1, -5, 4]), maxSubarray([-3, -1, -2]));\n","out":"12 4 0 5\n6 -1\n","notes":[[3,"Skip this house (keep prev1) or rob it (prev2 + x, because the neighbour must be skipped)."]]}]}],"ex":{"q":"Given coin values and an amount, what is the fewest number of coins that make the amount exactly? Return −1 if it can't be made (LeetCode 322, Coin Change).","steps":["State: dp[a] = the fewest coins that make amount a (infinity if it can't be made).","Recurrence: dp[a] = 1 + min(dp[a − c]) over coins c ≤ a, because the last coin used is some c.","Base case: dp[0] = 0. Fill a = 1, 2, …, amount in order, so dp[a − c] is always ready.","The answer is dp[amount], or −1 if it's still infinity. O(amount × number of coins) time, O(amount) space."],"code":{"t":"Coin change, bottom-up","tabs":[{"lang":"python","src":"def coin_change(coins, amount):\n    INF = float(\"inf\")\n    dp = [0] + [INF] * amount               # dp[a]: fewest coins for amount a\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n                dp[a] = dp[a - c] + 1        # use coin c last\n    return dp[amount] if dp[amount] != INF else -1\n\nprint(coin_change([1, 2, 5], 11), coin_change([2], 3), coin_change([1], 0),\n      coin_change([186, 419, 83, 408], 6249))\n","out":"3 -1 0 20"},{"lang":"javascript","src":"function coinChange(coins, amount) {\n  const dp = [0, ...new Array(amount).fill(Infinity)];   // dp[a]: fewest coins for amount a\n  for (let a = 1; a <= amount; a++)\n    for (const c of coins)\n      if (c <= a && dp[a - c] + 1 < dp[a]) dp[a] = dp[a - c] + 1;   // use coin c last\n  return dp[amount] === Infinity ? -1 : dp[amount];\n}\n\nconsole.log(coinChange([1, 2, 5], 11), coinChange([2], 3), coinChange([1], 0),\n            coinChange([186, 419, 83, 408], 6249));\n","out":"3 -1 0 20"}]},"a":"3 (5 + 5 + 1), −1 (odd amounts can't be made from 2s), 0 (no coins for amount 0) and 20. The infinity marker is what lets “impossible” survive the min() without being mistaken for a real count."},"fade":{"q":"How many binary strings of length n have no two 1s next to each other?","steps":["Track two counts: valid strings that end in 0 and valid strings that end in 1.",{"ask":"A valid string of length i that ends in 1: what must come just before the 1?","a":"A 0. So end1[i] = end0[i − 1]."},{"ask":"And a valid string that ends in 0?","a":"Any valid string can take a 0 on the end: end0[i] = end0[i − 1] + end1[i − 1]."},{"ask":"Base case and answer?","a":"For length 1: end0 = 1 and end1 = 1. The answer is end0 + end1 at length n (a Fibonacci number)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def count_no_adjacent_ones(n):\n    end0, end1 = 1, 1                       # length 1: \"0\" and \"1\"\n    for _ in range(2, n + 1):\n        ...                                 # TODO: update both counts from the previous ones\n    return end0 + end1\n\nprint(count_no_adjacent_ones(3))            # expect 5: 000 001 010 100 101\n"},{"lang":"javascript","src":"function countNoAdjacentOnes(n) {\n  let end0 = 1, end1 = 1;                   // length 1: \"0\" and \"1\"\n  for (let i = 2; i <= n; i++) {\n    // TODO: update both counts from the previous ones\n  }\n  return end0 + end1;\n}\n\nconsole.log(countNoAdjacentOnes(3));        // expect 5: 000 001 010 100 101\n"}]},"solution":{"t":"Solution: two running counts","tabs":[{"lang":"python","src":"def count_no_adjacent_ones(n):\n    end0, end1 = 1, 1                       # length 1: \"0\" and \"1\"\n    for _ in range(2, n + 1):\n        end0, end1 = end0 + end1, end0      # a 1 may only follow a 0\n    return end0 + end1\n\nprint(*(count_no_adjacent_ones(n) for n in range(1, 9)))\n","out":"2 3 5 8 13 21 34 55"},{"lang":"javascript","src":"function countNoAdjacentOnes(n) {\n  let end0 = 1, end1 = 1;                   // length 1: \"0\" and \"1\"\n  for (let i = 2; i <= n; i++) [end0, end1] = [end0 + end1, end0];   // a 1 may only follow a 0\n  return end0 + end1;\n}\n\nconsole.log(...Array.from({ length: 8 }, (_, i) => countNoAdjacentOnes(i + 1)));\n","out":"2 3 5 8 13 21 34 55"}]}},"traps":[["“DP is just recursion.”","It's recursion *plus* reuse: without a cache or a table, overlapping subproblems make it exponential. Name the state and make sure each one is computed once."],["“The base case doesn't matter much.”","Most DP bugs are base cases: for coin change dp[0] is 0 coins; for stairs it's 1 way (stand still). Check the recurrence by hand on the two smallest inputs."],["“Start a minimum-DP table at 0.”","Then every amount looks free. Start at infinity (or amount + 1) for “impossible” and turn it into −1 at the end."],["“Kadane's algorithm resets the sum to 0 whenever it goes negative.”","Only if you record the best sum *before* resetting and start the best at −∞. Clamping first (`cur = max(0, cur + x)`) or starting the best at 0 reports 0 for all-negative input like [−3, −1, −2], whose answer is −1. The safe form is `cur = max(x, cur + x)`, starting from the first element."],["“`@cache` works on a function that takes a list.”","Lists aren't hashable, so `functools.cache` raises TypeError. Cache on indexes or tuples and keep the list outside the cached function."],["“Top-down is always fine in Python.”","The recursion goes as deep as the chain of states: 10,000 stairs passes the default limit of about 1,000. Switch to the bottom-up loop."]],"disc":[["How do you find the DP state for a new problem?","Ask what you'd need to know about a prefix (or a smaller amount) to finish the problem from there. Write it as a sentence: “dp[i] is the best X using the first i items”. If the next step needs more information (did I rob the last house?), add it to the state."],["When is a greedy choice enough, and when do you need DP?","Greedy works when a locally best choice can never hurt later, as with coins 1, 5, 10 and 25. With coins 1, 3 and 4 and amount 6, greedy picks 4 + 1 + 1 (3 coins) but DP finds 3 + 3 (2 coins)."]],"teach":{"prompt":"Explain to a junior colleague how you turn a slow recursive solution into a dynamic-programming one, using climbing stairs.","rubric":["Spot the overlapping subproblems: ways(n) recomputes ways(n − 2) many times","Define the state: dp[i] = the ways to reach step i","Recurrence dp[i] = dp[i − 1] + dp[i − 2], with base cases","Memoise (top-down) or fill a table (bottom-up): O(n)","Shrink the space to two variables"],"model":"Start from the brute-force recursion: the ways to reach step n are the ways to reach n − 1 plus the ways to reach n − 2. It's exponential because ways(n − 2) is computed again inside ways(n − 1), and so on all the way down. The fix is to solve each subproblem once. Name the state, dp[i] = the number of ways to reach step i, keep the recurrence dp[i] = dp[i − 1] + dp[i − 2], and set the base cases dp[0] = dp[1] = 1. Then either cache the recursive function (top-down) or fill the table from the bottom up in a loop; both are O(n). Because each step only reads the previous two values, two variables are enough: O(1) space."},"qa":[["Two signs that a problem needs DP?","Optimal substructure and overlapping subproblems."],["The four steps of a DP solution?","Define the state, write the recurrence, set the base cases, choose the order (and where the answer is)."],["House robber recurrence?","dp[i] = max(dp[i − 1], dp[i − 2] + nums[i])."],["Coin change: how do you mark amounts that can't be made?","Start them at infinity; if dp[amount] is still infinity at the end, return −1."],["Kadane's update?","cur = max(x, cur + x); best = max(best, cur)."],["DP time complexity in one formula?","Number of states × work per state."]],"quiz":[{"q":"What does this print?","snip":{"t":"Fill the table","tabs":[{"lang":"python","src":"dp = [0] * 7\ndp[0], dp[1] = 1, 1\nfor i in range(2, 7):\n    dp[i] = dp[i - 1] + dp[i - 2]\nprint(dp[6])\n"},{"lang":"javascript","src":"const dp = new Array(7).fill(0);\ndp[0] = 1;\ndp[1] = 1;\nfor (let i = 2; i < 7; i++) dp[i] = dp[i - 1] + dp[i - 2];\nconsole.log(dp[6]);\n"}]},"o":["13","8","21","6"],"a":0,"e":"1, 1, 2, 3, 5, 8, 13: dp[6] is 13."},{"q":"What does this print?","snip":{"t":"Coins 1, 3 and 4 for amount 6","tabs":[{"lang":"python","src":"coins, amount = [1, 3, 4], 6\nINF = float(\"inf\")\ndp = [0] + [INF] * amount\nfor a in range(1, amount + 1):\n    for c in coins:\n        if c <= a:\n            dp[a] = min(dp[a], dp[a - c] + 1)\nprint(dp[amount])\n"},{"lang":"javascript","src":"const coins = [1, 3, 4], amount = 6;\nconst dp = [0, ...new Array(amount).fill(Infinity)];\nfor (let a = 1; a <= amount; a++)\n  for (const c of coins) if (c <= a) dp[a] = Math.min(dp[a], dp[a - c] + 1);\nconsole.log(dp[amount]);\n"}]},"o":["2","3","6","1"],"a":0,"e":"3 + 3 uses 2 coins. A greedy “biggest coin first” would take 4 + 1 + 1, which is 3 coins."},{"q":"Greedy (always take the biggest coin that fits) with coins [1, 3, 4] and amount 6: how many coins, and is it optimal?","o":["3 coins (4 + 1 + 1), not optimal: DP finds 2 (3 + 3)","2 coins, optimal","3 coins, optimal","It can't make 6"],"a":0,"e":"Taking 4 first leaves 2, which needs two 1s. Greedy only works for special coin systems."},{"q":"Which are good DP candidates? (choose 3)","t":"ms","o":["The number of ways to decode a digit string","The fewest coins that make an amount","Whether a string can be split into dictionary words","Listing every permutation of a string","The smallest value in an array"],"a":[0,1,2],"e":"The first three build answers from overlapping smaller prefixes or amounts. Listing permutations is backtracking; the minimum is a single scan."},{"q":"Judge each statement.","t":"yn","s":[["Memoisation stores the answers to subproblems so each is computed once.",true],["Kadane's algorithm with `cur = max(0, cur + x)` works when every number is negative.",false],["A bottom-up table avoids recursion depth limits.",true],["DP always needs O(n²) time.",false]],"e":"The reset-to-0 version would report 0 for all-negative input. Time is states × work per state, often O(n)."},{"q":"Put the steps of designing a DP solution in order.","t":"ord","items":["Define the state in words: what does dp[i] mean?","Write the recurrence in terms of smaller states","Fill the table (or the memo) from the base cases up","Read the answer from the right entry, such as dp[n]"],"e":"State first: if you can't say what dp[i] means, the recurrence can't be right. You can only fill the table once you know the recurrence, and the answer is there once it's filled."},{"q":"Complete the JavaScript house robber.","t":"drop","lang":"javascript","code":"function rob(nums) {\n  let prev2 = 0, prev1 = 0;\n  for (const x of nums) {\n    const cur = Math.{{0}}(prev1, prev2 + {{1}});\n    prev2 = {{2}};\n    prev1 = cur;\n  }\n  return prev1;\n}\n","blanks":[{"o":["max","min","abs","round"],"a":0},{"o":["x","prev1","0","cur"],"a":0},{"o":["prev1","prev2","cur","x"],"a":0}],"e":"Take the larger of skipping (prev1) or robbing (prev2 + x), then shift the window: prev2 becomes the old prev1."},{"q":"Match each problem to its recurrence.","t":"match","pairs":[["Ways to climb stairs with 1 or 2 steps","dp[i] = dp[i − 1] + dp[i − 2]"],["Rob houses without robbing two neighbours","dp[i] = max(dp[i − 1], dp[i − 2] + nums[i])"],["The fewest coins for an amount","dp[a] = 1 + the min of dp[a − c] over coins c"],["The largest sum of a contiguous subarray","cur = max(x, cur + x)"]],"extra":["dp[i] = 2 × dp[i − 1]"],"e":"Each shape (count, take-or-skip, minimum cost, best-ending-here) has its own recurrence."}],"probs":[["LC 746 · Min Cost Climbing Stairs","https://leetcode.com/problems/min-cost-climbing-stairs/","Easy","dp[i] = cost[i] + min(dp[i − 1], dp[i − 2])"],["LC 198 · House Robber","https://leetcode.com/problems/house-robber/","Medium","derive the take-or-skip recurrence yourself"],["LC 213 · House Robber II","https://leetcode.com/problems/house-robber-ii/","Medium","run house robber twice: without the first house, then without the last"],["LC 322 · Coin Change","https://leetcode.com/problems/coin-change/","Medium","the worked example from memory; then top-down"],["LC 139 · Word Break","https://leetcode.com/problems/word-break/","Medium","dp[i]: can the first i characters be split?"],["LC 91 · Decode Ways","https://leetcode.com/problems/decode-ways/","Medium","one-digit and two-digit decodes"],["LC 152 · Maximum Product Subarray","https://leetcode.com/problems/maximum-product-subarray/","Medium","track both the largest and smallest product ending here"],["LC 53 · Maximum Subarray","https://leetcode.com/problems/maximum-subarray/","Medium","Kadane's algorithm"],["LC 279 · Perfect Squares","https://leetcode.com/problems/perfect-squares/","Medium","dp[n] = 1 + min of dp[n − square]"]],"src":[["MIT 6.006 Introduction to Algorithms (Spring 2020): dynamic programming lectures","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["Jeff Erickson, Algorithms (free textbook): dynamic programming chapter","https://jeffe.cs.illinois.edu/teaching/algorithms/"],["USACO Guide: Introduction to dynamic programming","https://usaco.guide/gold/intro-dp"],["Python docs: functools.cache","https://docs.python.org/3/library/functools.html#functools.cache"]]},{"id":"m10","d":"d3","t":"Dynamic programming: grids, knapsack, LCS and LIS","min":120,"hook":"Most medium DP problems use two indexes: a grid position, two string prefixes, or “items considered × capacity left”. Learn the main shapes (grid paths, 0/1 knapsack, longest common subsequence and edit distance, plus the one-index longest increasing subsequence) and you can read most DP problems at a glance.","pre":{"q":"How similar are “kitten” and “sitting”? What smaller questions about their prefixes would help you decide?","a":"The same question for shorter prefixes: if you know the answer for every pair of prefixes (“kitte” vs “sittin”, and so on), the full answer follows from the last characters. Two strings give a 2D table indexed by the two prefix lengths."},"kid":{"t":"Routes on the treasure map","x":"On the treasure map, the streets form a grid, and the car may only drive right or down. How many routes reach the treasure in the bottom-right corner? Tara writes a number at every crossing: the top row and the left column each get 1, because there's only one straight way there. Every other crossing gets the number above it plus the number to its left, because the car must arrive from one of those two. When she reaches the treasure, its number counts every route, and she never traced a single route by hand.","map":[["A crossing on the street grid","A state: dp[r][c]"],["Arriving from above or from the left","The recurrence: dp[r][c] = dp[r − 1][c] + dp[r][c − 1]"],["The top row and left column are all 1s","The base cases"],["Filling crossings row by row","The fill order: each cell's inputs are already done"]],"brk":"Real streets let you turn back; this grid only counts routes that never go up or left. And DP tables can hold anything (the cheapest route, the longest match), not just counts."},"keys":["**A 2D state** usually means “the answer for the first i of one thing and the first j of another” or “the answer at grid cell (i, j)”. Fill the table in an order where every cell's inputs are ready.","**Grid paths**: dp[r][c] = dp[r − 1][c] + dp[r][c − 1] to count routes, or cost[r][c] + min(above, left) for the cheapest. One row of memory is enough.","**0/1 knapsack**: dp[i][w] = the best value using the first i items with capacity w = max(skip: dp[i − 1][w], take: dp[i − 1][w − weight] + value). With a 1D array, loop w **downwards** so each item is used at most once.","**Unbounded knapsack and coin change II**: loop w **upwards**, because an item may be reused. When counting combinations, put the coins in the outer loop so each combination is counted once.","**LCS** (longest common subsequence): if a[i − 1] == b[j − 1], dp[i][j] = dp[i − 1][j − 1] + 1; otherwise max(dp[i − 1][j], dp[i][j − 1]). O(n·m).","**Edit distance**: the same table shape. Delete, insert and replace read dp[i − 1][j], dp[i][j − 1] and dp[i − 1][j − 1], each + 1; a match costs nothing.","**LIS** (longest increasing subsequence): dp[i] = 1 + max(dp[j]) over j < i with nums[j] < nums[i] (just 1 if there's no such j) is O(n²). Keeping the smallest tail for each length and binary-searching it gives O(n log n).","**Rebuild the answer** by walking back through the table from the final cell, following the choice that produced each value."],"dia":[{"type":"cells","cap":"Unique paths in a 3 × 4 grid","rows":[{"label":"row 0","vals":[1,1,1,1]},{"label":"row 1","vals":[1,2,3,4]},{"label":"row 2","vals":[1,3,6,10],"ok":[3]}],"note":"Each cell = the cell above + the cell to the left. A 3 × 4 grid has 10 routes."},{"type":"cells","cap":"The LCS table for “abcde” (rows) and “ace” (columns: empty, a, c, e)","rows":[{"label":"empty","vals":[0,0,0,0]},{"label":"a","vals":[0,1,1,1],"hl":[1]},{"label":"b","vals":[0,1,1,1]},{"label":"c","vals":[0,1,2,2],"hl":[2]},{"label":"d","vals":[0,1,2,2]},{"label":"e","vals":[0,1,2,3],"ok":[3]}],"note":"A match (highlighted, and the green answer cell for e/e) takes the diagonal + 1; a mismatch takes the larger of up and left. LCS(“abcde”, “ace”) = 3."}],"cmp":[{"cap":"Four 2D DP shapes","head":["Problem","State","Recurrence","Time"],"rows":[["Unique grid paths","dp[r][c] = routes to (r, c)","dp[r − 1][c] + dp[r][c − 1]","O(rows × cols)"],["0/1 knapsack","dp[i][w] = best value, first i items, capacity w","max(dp[i − 1][w], dp[i − 1][w − wt] + val)","O(n × capacity)"],["LCS","dp[i][j] = LCS of a[:i] and b[:j]","match: dp[i − 1][j − 1] + 1; else max(up, left)","O(n × m)"],["Edit distance","dp[i][j] = edits to turn a[:i] into b[:j]","match: the diagonal; else 1 + min(three neighbours)","O(n × m)"]]}],"code":[{"t":"Grid paths with one row of memory","tabs":[{"lang":"python","src":"def unique_paths(rows, cols):\n    dp = [1] * cols                         # the first row: one way to each cell\n    for _ in range(1, rows):\n        for c in range(1, cols):\n            dp[c] += dp[c - 1]              # from above (old dp[c]) + from the left\n    return dp[-1]\n\ndef min_path_sum(grid):\n    rows, cols = len(grid), len(grid[0])\n    dp = [float(\"inf\")] * cols\n    dp[0] = 0\n    for r in range(rows):\n        dp[0] += grid[r][0]                 # the first column: only from above\n        for c in range(1, cols):\n            dp[c] = grid[r][c] + min(dp[c], dp[c - 1])\n    return dp[-1]\n\nprint(unique_paths(3, 4), unique_paths(3, 7), min_path_sum([[1, 3, 1], [1, 5, 1], [4, 2, 1]]))\n","out":"10 28 7","notes":[[5,"Before the update, dp[c] still holds the row above; dp[c − 1] already holds this row. One array does the job of two."],[15,"The cheapest way in is from the cheaper of the two neighbours."]]},{"lang":"javascript","src":"function uniquePaths(rows, cols) {\n  const dp = new Array(cols).fill(1);       // the first row: one way to each cell\n  for (let r = 1; r < rows; r++)\n    for (let c = 1; c < cols; c++) dp[c] += dp[c - 1];   // from above (old dp[c]) + from the left\n  return dp[cols - 1];\n}\n\nfunction minPathSum(grid) {\n  const rows = grid.length, cols = grid[0].length;\n  const dp = new Array(cols).fill(Infinity);\n  dp[0] = 0;\n  for (let r = 0; r < rows; r++) {\n    dp[0] += grid[r][0];                    // the first column: only from above\n    for (let c = 1; c < cols; c++) dp[c] = grid[r][c] + Math.min(dp[c], dp[c - 1]);\n  }\n  return dp[cols - 1];\n}\n\nconsole.log(uniquePaths(3, 4), uniquePaths(3, 7), minPathSum([[1, 3, 1], [1, 5, 1], [4, 2, 1]]));\n","out":"10 28 7","notes":[[4,"Before the update, dp[c] still holds the row above; dp[c − 1] already holds this row."]]}]},{"t":"0/1 knapsack: the full table, then one row looped downwards","tabs":[{"lang":"python","src":"def knapsack_2d(weights, values, cap):\n    n = len(weights)\n    dp = [[0] * (cap + 1) for _ in range(n + 1)]   # dp[i][w]: first i items, capacity w\n    for i in range(1, n + 1):\n        wt, val = weights[i - 1], values[i - 1]\n        for w in range(cap + 1):\n            dp[i][w] = dp[i - 1][w]                 # skip item i\n            if wt <= w:\n                dp[i][w] = max(dp[i][w], dp[i - 1][w - wt] + val)   # or take it\n    return dp[n][cap]\n\ndef knapsack_1d(weights, values, cap):\n    dp = [0] * (cap + 1)\n    for wt, val in zip(weights, values):\n        for w in range(cap, wt - 1, -1):            # downwards: each item at most once\n            dp[w] = max(dp[w], dp[w - wt] + val)\n    return dp[cap]\n\nw, v = [1, 3, 4, 5], [1, 4, 5, 7]\nprint(knapsack_2d(w, v, 7), knapsack_1d(w, v, 7))\n","out":"9 9","notes":[[9,"Taking item i reads row i − 1, so the item can't be counted twice."],[15,"Going downwards, dp[w − wt] still holds the value from before this item was considered."]]},{"lang":"javascript","src":"function knapsack2d(weights, values, cap) {\n  const n = weights.length;\n  const dp = Array.from({ length: n + 1 }, () => new Array(cap + 1).fill(0));   // dp[i][w]\n  for (let i = 1; i <= n; i++) {\n    const wt = weights[i - 1], val = values[i - 1];\n    for (let w = 0; w <= cap; w++) {\n      dp[i][w] = dp[i - 1][w];                       // skip item i\n      if (wt <= w) dp[i][w] = Math.max(dp[i][w], dp[i - 1][w - wt] + val);   // or take it\n    }\n  }\n  return dp[n][cap];\n}\n\nfunction knapsack1d(weights, values, cap) {\n  const dp = new Array(cap + 1).fill(0);\n  weights.forEach((wt, i) => {\n    for (let w = cap; w >= wt; w--) dp[w] = Math.max(dp[w], dp[w - wt] + values[i]);   // downwards\n  });\n  return dp[cap];\n}\n\nconst w = [1, 3, 4, 5], v = [1, 4, 5, 7];\nconsole.log(knapsack2d(w, v, 7), knapsack1d(w, v, 7));\n","out":"9 9","notes":[[17,"Going downwards, dp[w − wt] still holds the value from before this item was considered."]]}]},{"t":"LCS (2D table) and LIS (tails + binary search)","tabs":[{"lang":"python","src":"from bisect import bisect_left\n\ndef lcs(a, b):\n    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]\n    for i in range(1, len(a) + 1):\n        for j in range(1, len(b) + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1          # use the matching character\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])   # drop one character\n    return dp[-1][-1]\n\ndef lis(nums):                                   # O(n log n)\n    tails = []                                   # tails[k]: smallest tail of an increasing subsequence of length k + 1\n    for x in nums:\n        i = bisect_left(tails, x)\n        if i == len(tails):\n            tails.append(x)                      # x extends the longest subsequence so far\n        else:\n            tails[i] = x                         # a smaller tail for length i + 1\n    return len(tails)\n\nprint(lcs(\"abcde\", \"ace\"), lcs(\"abc\", \"def\"), lis([10, 9, 2, 5, 3, 7, 101, 18]), lis([7, 7, 7]))\n","out":"3 0 4 1","notes":[[7,"dp[i][j] describes a[:i] and b[:j], so the characters to compare are a[i − 1] and b[j − 1]."],[16,"`bisect_left` keeps the subsequence strictly increasing: an equal number replaces a tail instead of extending."]]},{"lang":"javascript","src":"function lcs(a, b) {\n  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));\n  for (let i = 1; i <= a.length; i++)\n    for (let j = 1; j <= b.length; j++)\n      dp[i][j] = a[i - 1] === b[j - 1]\n        ? dp[i - 1][j - 1] + 1                   // use the matching character\n        : Math.max(dp[i - 1][j], dp[i][j - 1]);  // drop one character\n  return dp[a.length][b.length];\n}\n\nfunction lis(nums) {                             // O(n log n)\n  const tails = [];                              // tails[k]: smallest tail of an increasing subsequence of length k + 1\n  for (const x of nums) {\n    let lo = 0, hi = tails.length;               // lower bound: the first tail >= x\n    while (lo < hi) {\n      const mid = (lo + hi) >> 1;\n      if (tails[mid] < x) lo = mid + 1;\n      else hi = mid;\n    }\n    tails[lo] = x;                               // extends (lo === length) or improves a tail\n  }\n  return tails.length;\n}\n\nconsole.log(lcs(\"abcde\", \"ace\"), lcs(\"abc\", \"def\"), lis([10, 9, 2, 5, 3, 7, 101, 18]), lis([7, 7, 7]));\n","out":"3 0 4 1","notes":[[5,"dp[i][j] describes a[:i] and b[:j], so the characters to compare are a[i − 1] and b[j − 1]."]]}]}],"ex":{"q":"Edit distance: the fewest single-character inserts, deletes or replacements that turn string a into string b (LeetCode 72).","steps":["State: dp[i][j] = the fewest edits to turn the first i characters of a into the first j characters of b.","Base cases: dp[i][0] = i (delete everything) and dp[0][j] = j (insert everything).","If a[i − 1] == b[j − 1], no edit is needed: dp[i][j] = dp[i − 1][j − 1]. Otherwise 1 + min(dp[i − 1][j] (delete), dp[i][j − 1] (insert), dp[i − 1][j − 1] (replace)).","Fill row by row: O(n · m) time and space (O(m) space with two rows)."],"code":{"t":"Edit distance","tabs":[{"lang":"python","src":"def edit_distance(a, b):\n    n, m = len(a), len(b)\n    dp = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1):\n        dp[i][0] = i                        # delete all i characters\n    for j in range(m + 1):\n        dp[0][j] = j                        # insert all j characters\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1]     # a match is free\n            else:\n                dp[i][j] = 1 + min(dp[i - 1][j],      # delete a[i - 1]\n                                   dp[i][j - 1],      # insert b[j - 1]\n                                   dp[i - 1][j - 1])  # replace\n    return dp[n][m]\n\nprint(edit_distance(\"kitten\", \"sitting\"), edit_distance(\"horse\", \"ros\"),\n      edit_distance(\"intention\", \"execution\"), edit_distance(\"\", \"abc\"))\n","out":"3 3 5 3"},{"lang":"javascript","src":"function editDistance(a, b) {\n  const n = a.length, m = b.length;\n  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));\n  for (let i = 0; i <= n; i++) dp[i][0] = i;   // delete all i characters\n  for (let j = 0; j <= m; j++) dp[0][j] = j;   // insert all j characters\n  for (let i = 1; i <= n; i++)\n    for (let j = 1; j <= m; j++)\n      dp[i][j] = a[i - 1] === b[j - 1]\n        ? dp[i - 1][j - 1]                      // a match is free\n        : 1 + Math.min(dp[i - 1][j],            // delete a[i - 1]\n                       dp[i][j - 1],            // insert b[j - 1]\n                       dp[i - 1][j - 1]);       // replace\n  return dp[n][m];\n}\n\nconsole.log(editDistance(\"kitten\", \"sitting\"), editDistance(\"horse\", \"ros\"),\n            editDistance(\"intention\", \"execution\"), editDistance(\"\", \"abc\"));\n","out":"3 3 5 3"}]},"a":"3, 3, 5 and 3. kitten → sitting: replace k with s, replace e with i, insert g. Walking back through the table from dp[n][m] recovers exactly which edits were made."},"fade":{"q":"Find the length of the longest common *substring* (contiguous) of two strings: “abcdxyz” and “xyzabcd” share “abcd”, length 4.","steps":["Like LCS, use a table over prefixes, but now dp[i][j] means “the length of the longest common substring that ends exactly at a[i − 1] and b[j − 1]”.",{"ask":"What is dp[i][j] when a[i − 1] == b[j − 1]?","a":"dp[i − 1][j − 1] + 1: the match extends the substring that ended one step earlier."},{"ask":"And when the characters differ?","a":"0. A substring must be contiguous, so the run is broken (LCS would take max(up, left) instead)."},{"ask":"Where is the answer?","a":"The largest value anywhere in the table, not necessarily the last cell."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def longest_common_substring(a, b):\n    best = 0\n    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]\n    for i in range(1, len(a) + 1):\n        for j in range(1, len(b) + 1):\n            ...                             # TODO: extend the diagonal on a match; track best\n    return best\n\nprint(longest_common_substring(\"abcdxyz\", \"xyzabcd\"))   # expect 4\n"},{"lang":"javascript","src":"function longestCommonSubstring(a, b) {\n  let best = 0;\n  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));\n  for (let i = 1; i <= a.length; i++)\n    for (let j = 1; j <= b.length; j++) {\n      // TODO: extend the diagonal on a match; track best\n    }\n  return best;\n}\n\nconsole.log(longestCommonSubstring(\"abcdxyz\", \"xyzabcd\"));   // expect 4\n"}]},"solution":{"t":"Solution: extend the diagonal, reset on a mismatch","tabs":[{"lang":"python","src":"def longest_common_substring(a, b):\n    best = 0\n    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]\n    for i in range(1, len(a) + 1):\n        for j in range(1, len(b) + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1   # the run grows\n                best = max(best, dp[i][j])\n            # on a mismatch dp[i][j] stays 0: the run is broken\n    return best\n\nprint(longest_common_substring(\"abcdxyz\", \"xyzabcd\"), longest_common_substring(\"zxabcdezy\", \"yzabcdezx\"),\n      longest_common_substring(\"abc\", \"def\"))\n","out":"4 6 0"},{"lang":"javascript","src":"function longestCommonSubstring(a, b) {\n  let best = 0;\n  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));\n  for (let i = 1; i <= a.length; i++)\n    for (let j = 1; j <= b.length; j++)\n      if (a[i - 1] === b[j - 1]) {\n        dp[i][j] = dp[i - 1][j - 1] + 1;      // the run grows\n        best = Math.max(best, dp[i][j]);\n      }                                       // on a mismatch dp[i][j] stays 0\n  return best;\n}\n\nconsole.log(longestCommonSubstring(\"abcdxyz\", \"xyzabcd\"), longestCommonSubstring(\"zxabcdezy\", \"yzabcdezx\"),\n            longestCommonSubstring(\"abc\", \"def\"));\n","out":"4 6 0"}]}},"traps":[["“The loop direction in a 1D knapsack doesn't matter.”","Looping capacity upwards lets an item be added again in the same pass (that's the unbounded knapsack). For 0/1 knapsack, loop capacity downwards."],["“Coin change II: loop amounts on the outside and coins inside.”","That counts orderings (1 + 2 and 2 + 1 separately). Put the coins in the outer loop to count combinations."],["“LCS and longest common substring share a recurrence.”","On a mismatch, LCS takes max(up, left). A substring must be contiguous, so it resets to 0, and the answer is the largest cell in the table."],["“Off-by-one doesn't matter with a padded table.”","With an (n + 1) × (m + 1) table, dp[i][j] describes a[:i] and b[:j], so compare a[i − 1] with b[j − 1]. Mixing the two conventions is the most common 2D DP bug."],["“The tails array in the fast LIS is the subsequence itself.”","Its length is right, but its contents can mix different subsequences. To rebuild the subsequence you need parent pointers."],["“`[[0] * m] * n` makes a DP table.”","It makes n references to one row (the aliasing bug from L1), so every update leaks into every row. Build each row separately."]],"disc":[["Why does the tails trick make LIS O(n log n)?","tails stays sorted, so each new number finds its place by binary search in O(log n) and does O(1) other work. Swapping a tail for a smaller value keeps every option open for longer subsequences later."],["How do you find which items a knapsack solution took?","Keep the full 2D table and walk back from dp[n][cap]: if dp[i][w] differs from dp[i − 1][w], item i was taken, so subtract its weight; then move up to row i − 1."]],"teach":{"prompt":"Explain to a junior colleague how the LCS table works for “abcde” and “ace”.","rubric":["dp[i][j] = the LCS length of the first i characters of a and the first j of b","Row 0 and column 0 are 0 (an empty prefix)","Match: the diagonal + 1; mismatch: the larger of up and left","The answer is dp[n][m]; O(n·m) time","Mentions rebuilding the subsequence by walking back, or shrinking the memory"],"model":"Make a table with a row for each prefix of “abcde” (including the empty prefix) and a column for each prefix of “ace”. dp[i][j] is the length of the longest common subsequence of those two prefixes, so the first row and column are 0. Fill it row by row: if the last characters of the two prefixes match, the best is one more than the cell diagonally up and to the left; if they don't, drop one of the two characters and take the better of the cell above and the cell to the left. The bottom-right cell holds the answer, 3 for “ace”. It's O(n·m) time and space, and walking back from that cell, taking the diagonal on matches, rebuilds the subsequence itself."},"qa":[["Unique paths recurrence?","dp[r][c] = dp[r − 1][c] + dp[r][c − 1], with the first row and column all 1."],["0/1 knapsack recurrence?","dp[i][w] = max(dp[i − 1][w], dp[i − 1][w − weight] + value)."],["Which way does a 1D 0/1 knapsack loop over capacity, and why?","Downwards, so each item counts at most once per pass."],["LCS recurrence?","Match: dp[i − 1][j − 1] + 1. Otherwise max(dp[i − 1][j], dp[i][j − 1])."],["Edit distance moves in the table?","Delete dp[i − 1][j], insert dp[i][j − 1], replace dp[i − 1][j − 1], each + 1; a match is free."],["LIS in O(n log n)?","Keep tails[k], the smallest tail of an increasing subsequence of length k + 1, and binary-search each number's place."]],"quiz":[{"q":"What does this print?","snip":{"t":"Fill the grid","tabs":[{"lang":"python","src":"rows, cols = 3, 3\ndp = [[1] * cols for _ in range(rows)]\nfor r in range(1, rows):\n    for c in range(1, cols):\n        dp[r][c] = dp[r - 1][c] + dp[r][c - 1]\nprint(dp[2][2])\n"},{"lang":"javascript","src":"const rows = 3, cols = 3;\nconst dp = Array.from({ length: rows }, () => new Array(cols).fill(1));\nfor (let r = 1; r < rows; r++)\n  for (let c = 1; c < cols; c++) dp[r][c] = dp[r - 1][c] + dp[r][c - 1];\nconsole.log(dp[2][2]);\n"}]},"o":["6","9","4","3"],"a":0,"e":"Rows 1 1 1 / 1 2 3 / 1 3 6: a 3 × 3 grid has 6 right-or-down routes."},{"q":"What does this print?","snip":{"t":"Which way does the loop run?","tabs":[{"lang":"python","src":"weights, values, cap = [2], [3], 6\ndp = [0] * (cap + 1)\nfor wt, val in zip(weights, values):\n    for w in range(wt, cap + 1):          # upwards!\n        dp[w] = max(dp[w], dp[w - wt] + val)\nprint(dp[cap])\n"},{"lang":"javascript","src":"const weights = [2], values = [3], cap = 6;\nconst dp = new Array(cap + 1).fill(0);\nweights.forEach((wt, i) => {\n  for (let w = wt; w <= cap; w++) dp[w] = Math.max(dp[w], dp[w - wt] + values[i]);   // upwards!\n});\nconsole.log(dp[cap]);\n"}]},"o":["9","3","6","0"],"a":0,"e":"Looping upwards reuses the one item: dp[2] = 3, dp[4] = 6, dp[6] = 9. As a 0/1 knapsack the answer should be 3."},{"q":"In the LCS table, what is dp[i][j] when a[i − 1] != b[j − 1]?","o":["max(dp[i − 1][j], dp[i][j − 1])","dp[i − 1][j − 1] + 1","0","dp[i − 1][j − 1]"],"a":0,"e":"Drop the last character of one string or the other and keep the better result. 0 would be the rule for the longest common *substring*."},{"q":"Which problems use a 2D table indexed by two string prefixes? (choose 3)","t":"ms","o":["Longest common subsequence","Edit distance","Interleaving string","Climbing stairs","House robber"],"a":[0,1,2],"e":"Each compares prefixes of two strings. Climbing stairs and house robber are 1D."},{"q":"Judge each statement.","t":"yn","s":[["For 0/1 knapsack with a 1D array, loop the capacity downwards.",true],["The tails array in the fast LIS is always a valid longest increasing subsequence.",false],["Unique paths in an m × n grid can be computed with O(n) memory.",true],["Longest common substring takes max(up, left) on a mismatch, like LCS.",false]],"e":"Downwards prevents reuse. tails can mix subsequences. One row of memory is enough for grid paths. A substring resets to 0 on a mismatch."},{"q":"Put the steps of filling the edit distance table in order.","t":"ord","items":["Create an (n + 1) × (m + 1) table","Fill row 0 with 0..m and column 0 with 0..n","Fill the other cells row by row: the diagonal on a match, otherwise 1 + the minimum of the three neighbours","Return the bottom-right cell"],"e":"Base cases first, then cells whose three neighbours are all filled already."},{"q":"Complete the Python 0/1 knapsack (one row).","t":"drop","lang":"python","code":"def knapsack(weights, values, cap):\n    dp = [0] * (cap + 1)\n    for wt, val in zip(weights, values):\n        for w in range({{0}}):\n            dp[w] = {{1}}(dp[w], dp[w - wt] + {{2}})\n    return dp[cap]\n","blanks":[{"o":["cap, wt - 1, -1","wt, cap + 1","cap + 1","0, cap"],"a":0},{"o":["max","min","sum","abs"],"a":0},{"o":["val","wt","w","1"],"a":0}],"e":"Loop capacity from cap down to wt so each item is used once, and keep the larger of skipping or taking (dp[w − wt] + val)."},{"q":"Match each problem to its DP shape.","t":"match","pairs":[["Count right-or-down routes through a grid","dp[r][c] = dp[r − 1][c] + dp[r][c − 1]"],["The best value in a bag with a weight limit, each item once","0/1 knapsack, capacity looped downwards"],["The fewest edits to turn one word into another","The edit distance table"],["The longest increasing subsequence (gaps allowed)","LIS with binary search on tails"]],"extra":["A monotonic stack"],"e":"Grid sum, knapsack, prefix-pair table, and tails + binary search."}],"probs":[["LC 62 · Unique Paths","https://leetcode.com/problems/unique-paths/","Medium","the grid recurrence"],["LC 64 · Minimum Path Sum","https://leetcode.com/problems/minimum-path-sum/","Medium","cost + min(above, left)"],["LC 1143 · Longest Common Subsequence","https://leetcode.com/problems/longest-common-subsequence/","Medium","the LCS table"],["LC 72 · Edit Distance","https://leetcode.com/problems/edit-distance/","Medium","the worked example, from memory"],["LC 516 · Longest Palindromic Subsequence","https://leetcode.com/problems/longest-palindromic-subsequence/","Medium","the LCS of the string and its reverse"],["LC 300 · Longest Increasing Subsequence","https://leetcode.com/problems/longest-increasing-subsequence/","Medium","O(n²) first, then tails + binary search"],["LC 416 · Partition Equal Subset Sum","https://leetcode.com/problems/partition-equal-subset-sum/","Medium","0/1 knapsack (subset sum) on half the total"],["LC 518 · Coin Change II","https://leetcode.com/problems/coin-change-ii/","Medium","coins in the outer loop to count combinations"],["LC 494 · Target Sum","https://leetcode.com/problems/target-sum/","Medium","turn the ± signs into a subset-sum count"],["LC 97 · Interleaving String","https://leetcode.com/problems/interleaving-string/","Medium","dp[i][j]: can a[:i] and b[:j] form c[:i + j]?"],["LC 221 · Maximal Square","https://leetcode.com/problems/maximal-square/","Medium","dp = 1 + min of three neighbours"],["LC 115 · Distinct Subsequences","https://leetcode.com/problems/distinct-subsequences/","Hard","count instead of max: a match adds dp[i − 1][j − 1]"]],"src":[["MIT 6.006 Introduction to Algorithms (Spring 2020): dynamic programming lectures","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["cp-algorithms: Longest increasing subsequence","https://cp-algorithms.com/dynamic_programming/longest_increasing_subsequence.html"],["USACO Guide: Knapsack DP","https://usaco.guide/gold/knapsack"],["Wikipedia: Levenshtein distance","https://en.wikipedia.org/wiki/Levenshtein_distance"]]},{"id":"m11","d":"d4","t":"Greedy algorithms and intervals","min":100,"hook":"Some problems reward taking the best-looking option right now and never looking back: scheduling meetings, merging calendars, jumping through an array. Greedy code is short and fast, but it's only correct when you can argue that the local choice is safe.","pre":{"q":"You can attend one talk at a time. To fit in as many talks as possible, which talk should you pick first?","a":"The one that ends earliest. It leaves the most time for everything else, and any schedule that starts with a different talk can swap it for this one without losing a talk (an exchange argument)."},"kid":{"t":"Planning the road-trip stops","x":"On the trip there are lots of fun stops, each open for a set time, and the family can only be at one stop at a time. Ben wants to visit as many stops as possible. Tara's rule: pick the stop that finishes earliest; then, of the stops that start after it ends, again pick the one that finishes earliest, and so on. It sounds too simple, but it works: finishing early never makes the rest of the day worse. Ben's idea, visiting the shortest stops first, sounds clever, but it sometimes picks a short stop that clashes with two others.","map":[["Stops open at set times","Intervals [start, end]"],["Pick the stop that finishes earliest","The greedy choice: sort by end time"],["Then the next stop that starts after it ends","Skip overlapping intervals"],["Finishing early never makes the rest worse","The exchange argument that proves the choice is safe"],["Ben's “shortest first” rule going wrong","Greedy needs proof: plausible rules can be wrong"]],"brk":"A real family might prefer one long, wonderful stop to three short ones. Once stops have different values, the earliest-finish rule is no longer best, and you need DP (weighted interval scheduling)."},"keys":["**Greedy** = make the locally best choice and never undo it. It's correct only when the choice is provably safe, usually by an **exchange argument**: any optimal solution can be changed to include the greedy choice without getting worse.","**Interval scheduling** (the most non-overlapping intervals): sort by end time; keep an interval if it starts at or after the last kept end. The fewest removals = n − kept.","**Merge intervals**: sort by start; if the next interval starts before (or at) the current end, extend the end, otherwise start a new merged interval. O(n log n).","**Meeting rooms (the maximum overlap)**: sort the start times and end times separately and sweep, or keep a min-heap of end times. The most meetings running at once is the number of rooms.","**Jump game**: track the farthest index reachable so far; if the current index is beyond it, you're stuck. O(n).","**Gas station**: if total gas ≥ total cost, a start exists; whenever the running tank drops below zero, the start must be after this point.","**Sorting is the usual first step, and the sort key is the trick**: by end (scheduling), by start (merging), by a difference or ratio (assignment problems).","**When greedy fails, use DP**: coin systems like {1, 3, 4}, weighted intervals, 0/1 knapsack."],"dia":[{"type":"layers","cap":"Interval scheduling, sorted by end time","rows":[["[1, 3]","keep: it ends first"],["[2, 5]","skip: starts before 3"],["[4, 7]","keep: starts after 3"],["[6, 9]","skip: starts before 7"],["[8, 10]","keep: starts after 7, so 3 intervals in total"]]},{"type":"tree","cap":"Is a greedy rule safe here?","root":{"q":"Can you show the local choice never hurts (an exchange argument)?","c":[["yes","Use greedy: usually a sort plus one pass"],["not sure",{"q":"Is there a small counterexample?","c":[["found one","Use DP or a search instead"],["none, after trying hard","Try to write the exchange argument"]]}]]}}],"cmp":[{"cap":"Interval problems and their sort keys","head":["Problem","Sort by","Rule","Time"],"rows":[["The most non-overlapping intervals","End time","Keep if start ≥ the last kept end","O(n log n)"],["Merge overlapping intervals","Start time","Overlap → extend the end; otherwise start a new one","O(n log n)"],["Rooms needed for meetings","Starts and ends separately","Sweep: +1 at a start, −1 at an end","O(n log n)"],["Insert into sorted intervals","Already sorted","Copy before, merge the overlaps, copy after","O(n)"],["Fewest arrows to burst balloons","End time","Shoot at an end; skip the balloons it hits","O(n log n)"]]}],"code":[{"t":"Two sort keys: merge (by start) and keep the most (by end)","tabs":[{"lang":"python","src":"def merge(intervals):\n    out = []\n    for start, end in sorted(intervals):            # by start\n        if out and start <= out[-1][1]:             # overlaps the last merged interval\n            out[-1][1] = max(out[-1][1], end)\n        else:\n            out.append([start, end])\n    return out\n\ndef max_non_overlapping(intervals):\n    kept, last_end = 0, float(\"-inf\")\n    for start, end in sorted(intervals, key=lambda iv: iv[1]):   # by end\n        if start >= last_end:                       # fits after the last kept one\n            kept += 1\n            last_end = end\n    return kept\n\nprint(*(f\"[{s},{e}]\" for s, e in merge([[1, 3], [2, 6], [8, 10], [15, 18], [17, 20]])))\nprint(max_non_overlapping([[1, 3], [2, 5], [4, 7], [6, 9], [8, 10]]), max_non_overlapping([[1, 2], [1, 2], [1, 2]]))\n","out":"[1,6] [8,10] [15,20]\n3 1\n","notes":[[3,"Sorted by start, an interval can only overlap the most recent merged one."],[12,"Sorted by end: the interval that frees the timeline soonest always comes first."]]},{"lang":"javascript","src":"function merge(intervals) {\n  const out = [];\n  for (const [start, end] of intervals.toSorted((a, b) => a[0] - b[0])) {   // by start\n    if (out.length && start <= out.at(-1)[1]) out.at(-1)[1] = Math.max(out.at(-1)[1], end);   // overlap\n    else out.push([start, end]);\n  }\n  return out;\n}\n\nfunction maxNonOverlapping(intervals) {\n  let kept = 0, lastEnd = -Infinity;\n  for (const [start, end] of intervals.toSorted((a, b) => a[1] - b[1])) {   // by end\n    if (start >= lastEnd) {                         // fits after the last kept one\n      kept++;\n      lastEnd = end;\n    }\n  }\n  return kept;\n}\n\nconsole.log(...merge([[1, 3], [2, 6], [8, 10], [15, 18], [17, 20]]).map(([s, e]) => `[${s},${e}]`));\nconsole.log(maxNonOverlapping([[1, 3], [2, 5], [4, 7], [6, 9], [8, 10]]), maxNonOverlapping([[1, 2], [1, 2], [1, 2]]));\n","out":"[1,6] [8,10] [15,20]\n3 1\n","notes":[[3,"Sort a copy by start; `toSorted` leaves the caller's array alone."],[12,"Sorted by end: the interval that frees the timeline soonest always comes first."]]}]},{"t":"Meeting rooms: sweep the starts and ends","tabs":[{"lang":"python","src":"def rooms_needed(meetings):\n    starts = sorted(s for s, _ in meetings)\n    ends = sorted(e for _, e in meetings)\n    rooms = best = j = 0\n    for s in starts:\n        while j < len(ends) and ends[j] <= s:       # a meeting has ended: its room is free\n            rooms -= 1\n            j += 1\n        rooms += 1                                  # this meeting takes a room\n        best = max(best, rooms)\n    return best\n\nprint(rooms_needed([[0, 30], [5, 10], [15, 20]]), rooms_needed([[7, 10], [2, 4]]), rooms_needed([[1, 5], [5, 8]]))\n","out":"2 1 1","notes":[[6,"`<=`: a meeting ending at 5 frees its room for one starting at 5. Use `<` if touching meetings need two rooms."]]},{"lang":"javascript","src":"function roomsNeeded(meetings) {\n  const starts = meetings.map(m => m[0]).sort((a, b) => a - b);\n  const ends = meetings.map(m => m[1]).sort((a, b) => a - b);\n  let rooms = 0, best = 0, j = 0;\n  for (const s of starts) {\n    while (j < ends.length && ends[j] <= s) {       // a meeting has ended: its room is free\n      rooms--;\n      j++;\n    }\n    rooms++;                                        // this meeting takes a room\n    best = Math.max(best, rooms);\n  }\n  return best;\n}\n\nconsole.log(roomsNeeded([[0, 30], [5, 10], [15, 20]]), roomsNeeded([[7, 10], [2, 4]]), roomsNeeded([[1, 5], [5, 8]]));\n","out":"2 1 1","notes":[[6,"`<=`: a meeting ending at 5 frees its room for one starting at 5."]]}]},{"t":"Jump game: the farthest reachable index","tabs":[{"lang":"python","src":"def can_jump(nums):\n    farthest = 0\n    for i, step in enumerate(nums):\n        if i > farthest:                            # we can't even reach index i\n            return False\n        farthest = max(farthest, i + step)\n    return True\n\nprint(*(\"yes\" if can_jump(a) else \"no\" for a in ([2, 3, 1, 1, 4], [3, 2, 1, 0, 4], [0])))\n","out":"yes no yes","notes":[[4,"Every index up to `farthest` is reachable, so the first index beyond it can never be reached."]]},{"lang":"javascript","src":"function canJump(nums) {\n  let farthest = 0;\n  for (let i = 0; i < nums.length; i++) {\n    if (i > farthest) return false;                 // we can't even reach index i\n    farthest = Math.max(farthest, i + nums[i]);\n  }\n  return true;\n}\n\nconsole.log(...[[2, 3, 1, 1, 4], [3, 2, 1, 0, 4], [0]].map(a => (canJump(a) ? \"yes\" : \"no\")));\n","out":"yes no yes","notes":[[4,"Every index up to `farthest` is reachable, so the first index beyond it can never be reached."]]}]}],"ex":{"q":"2n people must fly to city A or city B; `costs[i] = [a, b]`. Send exactly n people to each city at the lowest total cost (LeetCode 1029, Two City Scheduling).","steps":["Imagine sending everyone to B, then switching exactly n people to A. Switching person i changes the total by aᵢ − bᵢ.","To make the total as small as possible, switch the n people with the most negative aᵢ − bᵢ: sort by that difference.","Exchange argument: if a plan sent someone with a bigger difference to A instead of someone with a smaller one, swapping the two couldn't increase the cost.","O(n log n) for the sort, then one pass."],"code":{"t":"Sort by the difference","tabs":[{"lang":"python","src":"def two_city_cost(costs):\n    costs = sorted(costs, key=lambda c: c[0] - c[1])   # biggest saving for city A first\n    n = len(costs) // 2\n    return sum(a for a, _ in costs[:n]) + sum(b for _, b in costs[n:])\n\nprint(two_city_cost([[10, 20], [30, 200], [400, 50], [30, 20]]),\n      two_city_cost([[259, 770], [448, 54], [926, 667], [184, 139], [840, 118], [577, 469]]))\n","out":"110 1859"},{"lang":"javascript","src":"function twoCityCost(costs) {\n  const sorted = costs.toSorted((x, y) => (x[0] - x[1]) - (y[0] - y[1]));   // biggest saving for A first\n  const n = sorted.length / 2;\n  return sorted.reduce((sum, [a, b], i) => sum + (i < n ? a : b), 0);\n}\n\nconsole.log(twoCityCost([[10, 20], [30, 200], [400, 50], [30, 20]]),\n            twoCityCost([[259, 770], [448, 54], [926, 667], [184, 139], [840, 118], [577, 469]]));\n","out":"110 1859"}]},"a":"110 and 1859. In the first example, the two people with the most negative a − b (−170 and −10) fly to A, and the other two fly to B: 10 + 30 + 50 + 20 = 110."},"fade":{"q":"Lemonade costs $5. Customers pay with $5, $10 or $20 bills, in order, and you start with no change. Can you give every customer the right change?","steps":["Keep counts of your $5 and $10 bills; you never hand out a $20.",{"ask":"A customer pays with $10. What must you have?","a":"One $5 to give back. Then keep the $10."},{"ask":"A customer pays with $20. Which change do you prefer, and why?","a":"$10 + $5 if you can, otherwise three $5s. $5 bills are more useful later, so spend the $10 first: that's the greedy choice."},{"ask":"Time and space?","a":"O(n) time and O(1) space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def lemonade_change(bills):\n    fives = tens = 0\n    for b in bills:\n        if b == 5:\n            fives += 1\n        elif b == 10:\n            if fives == 0:\n                return False\n            fives -= 1\n            tens += 1\n        else:\n            ...                         # TODO: prefer a 10 + 5, otherwise three 5s, otherwise fail\n    return True\n"},{"lang":"javascript","src":"function lemonadeChange(bills) {\n  let fives = 0, tens = 0;\n  for (const b of bills) {\n    if (b === 5) fives++;\n    else if (b === 10) {\n      if (fives === 0) return false;\n      fives--;\n      tens++;\n    } else {\n      // TODO: prefer a 10 + 5, otherwise three 5s, otherwise fail\n    }\n  }\n  return true;\n}\n"}]},"solution":{"t":"Solution: spend the $10 first","tabs":[{"lang":"python","src":"def lemonade_change(bills):\n    fives = tens = 0\n    for b in bills:\n        if b == 5:\n            fives += 1\n        elif b == 10:\n            if fives == 0:\n                return False\n            fives -= 1\n            tens += 1\n        elif tens and fives:            # $20: a 10 + 5 keeps more $5s for later\n            tens -= 1\n            fives -= 1\n        elif fives >= 3:\n            fives -= 3\n        else:\n            return False\n    return True\n\nprint(*(\"yes\" if lemonade_change(b) else \"no\" for b in ([5, 5, 5, 10, 20], [5, 5, 10, 10, 20], [5, 10, 5, 20])))\n","out":"yes no yes"},{"lang":"javascript","src":"function lemonadeChange(bills) {\n  let fives = 0, tens = 0;\n  for (const b of bills) {\n    if (b === 5) fives++;\n    else if (b === 10) {\n      if (fives === 0) return false;\n      fives--;\n      tens++;\n    } else if (tens && fives) {         // $20: a 10 + 5 keeps more $5s for later\n      tens--;\n      fives--;\n    } else if (fives >= 3) fives -= 3;\n    else return false;\n  }\n  return true;\n}\n\nconsole.log(...[[5, 5, 5, 10, 20], [5, 5, 10, 10, 20], [5, 10, 5, 20]].map(b => (lemonadeChange(b) ? \"yes\" : \"no\")));\n","out":"yes no yes"}]}},"traps":[["“If a greedy rule works on the examples, it's correct.”","Plausible rules fail on tiny counterexamples: “shortest interval first” and “biggest coin first” both break. Look for a counterexample, or write the exchange argument, before you trust it."],["“Interval scheduling sorts by start time.”","Sorting by start keeps a long early meeting that blocks many others. Sort by end time; it's *merging* intervals that sorts by start."],["“Touching intervals [1, 3] and [3, 5] always overlap.”","It depends on the problem: for meeting rooms, a meeting ending at 3 frees the room for one starting at 3; when merging, LeetCode treats them as overlapping. Read the statement and choose < or ≤ on purpose."],["“Sorting the input in place is harmless.”","It changes the caller's data. Sort a copy (`sorted()` / `toSorted()`) unless changing the input is allowed."],["“Greedy algorithms are O(n).”","Interval greedies are dominated by the sort, O(n log n); only the pass after it is O(n). Some greedies need no sort at all: the jump game and the gas station are O(n)."],["“Weighted intervals work the same way.”","Once intervals carry values, earliest-end greedy can be beaten; that version needs DP with binary search."]],"disc":[["What's an exchange argument, in plain words?","Take any best solution that doesn't make the greedy choice, swap one of its choices for the greedy one, and show the result is still valid and no worse. Repeat, and any best solution turns into the greedy one, so greedy is best too."],["How do you choose between greedy and DP when you're unsure?","Try to break the greedy rule with tiny inputs (2–4 items). A counterexample means DP. If you can't find one, try to state why the local choice is always safe; if you can't, DP is the safer bet in an interview, and you can mention greedy as a possible speed-up."]],"teach":{"prompt":"Explain to a junior colleague how to schedule the most non-overlapping meetings, and why the greedy choice is correct.","rubric":["Sort by end time","Keep a meeting if it starts at or after the last kept meeting's end","Exchange argument: the earliest-ending meeting can replace the first meeting of any best schedule","O(n log n) for the sort","Mentions a wrong rule (shortest first or earliest start)"],"model":"Sort the meetings by end time, then walk through them, keeping a meeting whenever it starts at or after the end of the last one kept. Why does it work? Take any best schedule. Its first meeting ends no earlier than the meeting that ends earliest overall, so you can swap that first meeting for the earliest-ending one without clashing with anything: the schedule stays valid and just as long. Repeating the argument for the rest shows the greedy schedule is as long as any other. Sorting costs O(n log n) and the pass is O(n). Tempting rules like “shortest meeting first” or “earliest start first” fail on small examples."},"qa":[["When is a greedy algorithm correct?","When you can show the local choice is always safe, usually with an exchange argument."],["The most non-overlapping intervals: sort key and rule?","Sort by end; keep an interval if it starts at or after the last kept end."],["Merge intervals: sort key and rule?","Sort by start; extend the last merged interval if the next one overlaps, otherwise start a new one."],["How do you count the rooms needed for meetings?","Sweep the sorted starts and ends (or keep a min-heap of end times); the most meetings at once is the answer."],["Jump game in O(n)?","Track the farthest reachable index; reaching an index beyond it means false."],["A greedy counterexample for coins?","Coins {1, 3, 4} and amount 6: greedy gives 4 + 1 + 1, but 3 + 3 is better."]],"quiz":[{"q":"What does this print?","snip":{"t":"Merge them","tabs":[{"lang":"python","src":"intervals = [[1, 4], [4, 5], [6, 8], [7, 9], [10, 11]]\nout = []\nfor s, e in sorted(intervals):\n    if out and s <= out[-1][1]:\n        out[-1][1] = max(out[-1][1], e)\n    else:\n        out.append([s, e])\nprint(len(out), out[0][1], out[1][1])\n"},{"lang":"javascript","src":"const intervals = [[1, 4], [4, 5], [6, 8], [7, 9], [10, 11]];\nconst out = [];\nfor (const [s, e] of intervals.toSorted((a, b) => a[0] - b[0])) {\n  if (out.length && s <= out.at(-1)[1]) out.at(-1)[1] = Math.max(out.at(-1)[1], e);\n  else out.push([s, e]);\n}\nconsole.log(out.length, out[0][1], out[1][1]);\n"}]},"o":["3 5 9","4 4 9","3 4 8","5 4 5"],"a":0,"e":"[1, 4] and [4, 5] touch, so with ≤ they merge into [1, 5]; [6, 8] and [7, 9] become [6, 9]; [10, 11] stays. Three intervals."},{"q":"What does this print?","snip":{"t":"Earliest end first","tabs":[{"lang":"python","src":"talks = [[1, 10], [2, 3], [3, 4], [4, 5], [11, 12]]\nkept, last_end = 0, 0\nfor s, e in sorted(talks, key=lambda t: t[1]):\n    if s >= last_end:\n        kept += 1\n        last_end = e\nprint(kept)\n"},{"lang":"javascript","src":"const talks = [[1, 10], [2, 3], [3, 4], [4, 5], [11, 12]];\nlet kept = 0, lastEnd = 0;\nfor (const [s, e] of talks.toSorted((a, b) => a[1] - b[1])) {\n  if (s >= lastEnd) {\n    kept++;\n    lastEnd = e;\n  }\n}\nconsole.log(kept);\n"}]},"o":["4","2","3","5"],"a":0,"e":"By end time: [2, 3], [3, 4], [4, 5] and [11, 12] fit; [1, 10] clashes. Sorting by start would have kept [1, 10] and only 2 talks."},{"q":"Which rule maximises the number of non-overlapping meetings?","o":["Earliest end time first","Earliest start time first","Shortest meeting first","Whichever meeting overlaps the fewest others"],"a":0,"e":"Earliest end is the provably safe choice. Earliest start and shortest first fail on just 3 intervals; fewest overlaps first fails too, but only on larger, trickier inputs."},{"q":"Which of these can a greedy rule solve correctly? (choose 3)","t":"ms","o":["The most non-overlapping intervals","Merging overlapping intervals","Whether you can reach the last index (jump game)","The fewest coins with coins {1, 3, 4}","0/1 knapsack"],"a":[0,1,2],"e":"The last two need DP: greedy fails on {1, 3, 4} for amount 6, and on knapsacks where the best value-per-weight item doesn't fit well."},{"q":"Judge each statement.","t":"yn","s":[["Greedy algorithms never go back to change an earlier choice.",true],["Sorting by start time maximises the number of non-overlapping intervals.",false],["Most interval greedy algorithms are O(n log n) because of the sort.",true],["Weighted interval scheduling can always be solved by the earliest-end greedy rule alone (sort by end, keep whatever fits).",false]],"e":"Greedy commits and moves on. Sort by end, not start. The sort dominates. Weights need DP (which also sorts by end, then binary-searches for the last compatible interval)."},{"q":"Put the merge-intervals algorithm in order.","t":"ord","items":["Sort the intervals by start time","Put the first interval in the output","For each next interval: if it overlaps the last output interval, extend that interval's end","Otherwise, append it as a new interval"],"e":"Sorting by start is what makes it enough to compare with the last output interval."},{"q":"Complete the JavaScript jump game.","t":"drop","lang":"javascript","code":"function canJump(nums) {\n  let farthest = 0;\n  for (let i = 0; i < nums.length; i++) {\n    if (i {{0}} farthest) return false;\n    farthest = Math.{{1}}(farthest, i + {{2}});\n  }\n  return true;\n}\n","blanks":[{"o":[">",">=","<","==="],"a":0},{"o":["max","min","abs","floor"],"a":0},{"o":["nums[i]","i","1","farthest"],"a":0}],"e":"You're stuck only when i is *beyond* farthest; otherwise extend farthest to the furthest jump from here, i + nums[i]."},{"q":"Match each problem to its greedy rule.","t":"match","pairs":[["The most non-overlapping meetings","Sort by end; keep if it starts at or after the last end"],["Combine overlapping calendar blocks","Sort by start; extend while overlapping"],["Rooms needed for all meetings","Sweep the starts and ends; track the most at once"],["Can you reach the last index?","Track the farthest reachable index"]],"extra":["Binary search on the answer"],"e":"The sort key (or the running quantity) is the whole trick in each case."}],"probs":[["LC 455 · Assign Cookies","https://leetcode.com/problems/assign-cookies/","Easy","sort both; give each child the smallest cookie that fits"],["LC 55 · Jump Game","https://leetcode.com/problems/jump-game/","Medium","the farthest reachable index"],["LC 45 · Jump Game II","https://leetcode.com/problems/jump-game-ii/","Medium","count a jump each time you pass the current jump's reach"],["LC 134 · Gas Station","https://leetcode.com/problems/gas-station/","Medium","restart after any point where the tank goes negative"],["LC 846 · Hand of Straights","https://leetcode.com/problems/hand-of-straights/","Medium","sort; build runs from the smallest card with a counter"],["LC 763 · Partition Labels","https://leetcode.com/problems/partition-labels/","Medium","last position of each letter; cut when you reach the furthest"],["LC 56 · Merge Intervals","https://leetcode.com/problems/merge-intervals/","Medium","the merge code, from memory"],["LC 57 · Insert Interval","https://leetcode.com/problems/insert-interval/","Medium","copy before, merge the overlaps, copy after"],["LC 435 · Non-overlapping Intervals","https://leetcode.com/problems/non-overlapping-intervals/","Medium","n − the most non-overlapping intervals"],["LC 452 · Minimum Number of Arrows to Burst Balloons","https://leetcode.com/problems/minimum-number-of-arrows-to-burst-balloons/","Medium","sort by end; one arrow per group"],["LC 2402 · Meeting Rooms III","https://leetcode.com/problems/meeting-rooms-iii/","Hard","two heaps: free rooms, and busy rooms by end time"]],"src":[["Jeff Erickson, Algorithms (free textbook): greedy algorithms chapter","https://jeffe.cs.illinois.edu/teaching/algorithms/"],["Wikipedia: Interval scheduling","https://en.wikipedia.org/wiki/Interval_scheduling"],["USACO Guide: Greedy algorithms with sorting","https://usaco.guide/silver/greedy-sorting"]]},{"id":"m12","d":"d4","t":"Bit manipulation","min":90,"hook":"Bits turn up in interview puzzles (find the odd one out, count the 1s, add without +) and in real code: permission flags, bitsets, hashing, subnet masks. Python and JavaScript disagree about how wide an integer is, so the same expression can print different answers in the two languages. Knowing why is half of this topic.","pre":{"q":"Every number in a list appears twice except one. How could you find that one in O(n) time and O(1) extra space, without sorting or a hash set?","a":"XOR everything together. x ^ x = 0, x ^ 0 = x, and XOR doesn't care about order, so all the pairs cancel and only the single number is left."},"kid":{"t":"Odd socks and light switches","x":"Ben is matching socks after laundry day. He drops each sock on the bed, and if its twin is already there, he takes both away. When the basket is empty, one lonely sock is left: the one without a twin. The order the socks came out never mattered. Then Tara shows him the eight light switches on her toy castle. She writes 1 for on and 0 for off, left to right, so one row of digits describes all eight lights. Flipping one switch changes just that light and leaves the rest alone.","map":[["A sock and its twin leave together","x ^ x = 0: equal values cancel under XOR"],["The order the socks came out never mattered","XOR is commutative and associative"],["The lonely sock left on the bed","The XOR of the whole list is the single number"],["1 for on, 0 for off, for eight switches","One integer's bits used as eight flags"],["Flipping one switch","x ^ (1 << i) toggles bit i and leaves the other bits alone"]],"brk":"The bed always holds real socks, but a running XOR usually isn't any of the numbers: 1 ^ 2 = 3. XOR works bit by bit, so each bit position is really its own little sock pile."},"keys":["**The operators**: AND `&` (1 if both bits are 1), OR `|` (1 if either is), XOR `^` (1 if they differ), NOT `~` (flip every bit), and the shifts `<<` and `>>`. `x << k` multiplies by 2ᵏ; `x >> k` is floor division by 2ᵏ (in JavaScript, only while the values fit in 32 bits).","**One bit at a time** (bit i counts from 0 at the right): test `(x >> i) & 1`, set `x | (1 << i)`, clear `x & ~(1 << i)`, toggle `x ^ (1 << i)`.","**Two famous tricks**: `x & (x - 1)` clears the lowest set bit, so `x > 0` and `(x & (x - 1)) == 0` means x is a power of two; `x & -x` keeps only the lowest set bit.","**XOR facts**: x ^ x = 0, x ^ 0 = x, and the order doesn't matter, so XOR-ing a list cancels every pair. That finds the single number and the missing number in O(1) space.","**Counting set bits**: Kernighan's loop `x &= x - 1` takes one step per set bit. Python 3.10+ also has `x.bit_count()`; JavaScript has no built-in popcount for Numbers.","**Integer width differs**: Python ints never overflow, so `~x` is always −x − 1 and a negative number behaves as if it had infinitely many leading 1s. JavaScript's bitwise operators convert Numbers to **32-bit signed** integers: `1 << 31` is −2147483648, and `>>>` is an unsigned right shift. Mask with `& 0xFFFFFFFF` in Python to see 32 bits; use BigInt in JavaScript for wider values.","**Masks as subsets**: with n items, each number from 0 to 2ⁿ − 1 picks a subset (bit i set = item i is in). Loop over the masks to try every subset in O(n · 2ⁿ); bitmask DP builds on this in Level 3.","**DP over bits**: `bits[i] = bits[i >> 1] + (i & 1)` counts the set bits of every number from 0 to n in O(n)."],"dia":[{"type":"cells","cap":"x & (x − 1) clears the lowest set bit","idx":false,"rows":[{"label":"bit","vals":[7,6,5,4,3,2,1,0],"dim":[0,1,2,3,4,5,6,7]},{"label":"x = 44","vals":[0,0,1,0,1,1,0,0],"hl":[5]},{"label":"x − 1 = 43","vals":[0,0,1,0,1,0,1,1],"hl":[5,6,7]},{"label":"AND = 40","vals":[0,0,1,0,1,0,0,0],"ok":[2,4]}],"note":"Subtracting 1 flips the lowest 1 and every 0 below it (highlighted). AND keeps only the bits that are 1 in both, so the bits above survive and the lowest 1 is gone."},{"type":"cells","cap":"XOR of [4, 1, 2, 1, 2], one column at a time","idx":false,"rows":[{"label":"bit","vals":[2,1,0],"dim":[0,1,2]},{"label":"4","vals":[1,0,0]},{"label":"1","vals":[0,0,1]},{"label":"2","vals":[0,1,0]},{"label":"1","vals":[0,0,1]},{"label":"2","vals":[0,1,0]},{"label":"XOR = 4","vals":[1,0,0],"ok":[0]}],"note":"A column's XOR is 1 when the column holds an odd number of 1s. Each pair puts two 1s (or none) in a column, so only the single value's bits survive. If the others appear three times, count each column mod 3 instead."}],"cmp":[{"cap":"Bit recipes (bit i counts from 0 at the right)","head":["Goal","Expression","Example with x = 11 (0b1011)"],"rows":[["Test bit i","`(x >> i) & 1`","i = 2 → 0"],["Set bit i","`x | (1 << i)`","i = 2 → 15 (0b1111)"],["Clear bit i","`x & ~(1 << i)`","i = 1 → 9 (0b1001)"],["Toggle bit i","`x ^ (1 << i)`","i = 0 → 10 (0b1010)"],["Clear the lowest set bit","`x & (x - 1)`","10 (0b1010)"],["Keep only the lowest set bit","`x & -x`","1"],["Power of two?","`x > 0 and (x & (x - 1)) == 0` (JS: `&&`, `===`)","no"]]},{"cap":"The same expression in Python and JavaScript","head":["Expression","Python","JavaScript","Why"],"rows":[["`1 << 31`","2147483648","−2147483648","JavaScript's bitwise results are 32-bit signed; bit 31 is the sign"],["`1 << 32`","4294967296","1","JavaScript takes the shift count mod 32"],["`~5`","−6","−6","`~x` is −x − 1 in both (in JavaScript, for 32-bit values)"],["`-7 >> 1`","−4","−4","`>>` is an arithmetic shift: floor division by 2"],["`2**32 | 0`","4294967296","0","JavaScript keeps only the low 32 bits"],["`-1 >>> 0`","No `>>>`; write `-1 & 0xFFFFFFFF`","4294967295","The same 32 bits read as unsigned"],["`5 & 3`, `5 | 3`, `5 ^ 3`","1, 7, 6","1, 7, 6","Small non-negative values always agree"]]}],"code":[{"t":"One-bit recipes, the two famous tricks, and counting 1s","tabs":[{"lang":"python","src":"def bit(x, i):       return (x >> i) & 1\ndef set_bit(x, i):   return x | (1 << i)\ndef clear_bit(x, i): return x & ~(1 << i)\ndef toggle(x, i):    return x ^ (1 << i)\n\ndef is_power_of_two(x):\n    return x > 0 and (x & (x - 1)) == 0       # brackets around x & (x - 1): optional in Python only\n\ndef count_ones(x):                            # Kernighan: one step per set bit (x >= 0)\n    count = 0\n    while x:\n        x &= x - 1                            # clears the lowest set bit\n        count += 1\n    return count\n\nx = 0b1011                                    # 11\nprint(bit(x, 2), set_bit(x, 2), clear_bit(x, 1), toggle(x, 0), x & -x)\nprint(*(\"yes\" if is_power_of_two(n) else \"no\" for n in (1, 6, 64, 0)))\nprint(count_ones(11), count_ones(255), count_ones(0))\n","out":"0 15 9 10 1\nyes no yes no\n3 8 0\n","notes":[[7,"`x > 0` rules out 0, which would otherwise pass (0 & −1 is 0)."],[9,"On a negative Python int this never ends: it has infinitely many 1s. Mask with `& 0xFFFFFFFF` first. Python 3.10+ also has `x.bit_count()`, which counts the 1s of abs(x); for the 32-bit pattern use `(x & 0xFFFFFFFF).bit_count()`."],[12,"x − 1 flips the lowest 1 and the 0s below it, so AND removes exactly that bit."],[17,"`x & -x` keeps only the lowest set bit: 11 & −11 = 1."]]},{"lang":"javascript","src":"const bit = (x, i) => (x >> i) & 1;\nconst setBit = (x, i) => x | (1 << i);\nconst clearBit = (x, i) => x & ~(1 << i);\nconst toggle = (x, i) => x ^ (1 << i);\n\nfunction isPowerOfTwo(x) {\n  return x > 0 && (x & (x - 1)) === 0;      // brackets around x & (x - 1): required in JS\n}\n\nfunction countOnes(x) {                     // Kernighan: one step per set bit\n  let count = 0;\n  while (x !== 0) {\n    x &= x - 1;                             // clears the lowest set bit\n    count++;\n  }\n  return count;\n}\n\nconst x = 0b1011;                           // 11\nconsole.log(bit(x, 2), setBit(x, 2), clearBit(x, 1), toggle(x, 0), x & -x);\nconsole.log(...[1, 6, 64, 0].map(n => (isPowerOfTwo(n) ? \"yes\" : \"no\")));\nconsole.log(countOnes(11), countOnes(255), countOnes(0));\n","out":"0 15 9 10 1\nyes no yes no\n3 8 0\n","notes":[[7,"Without the brackets around `x & (x - 1)`, this means `x & ((x - 1) === 0)`, because `===` binds tighter than `&` in JavaScript."],[10,"Also ends for negative numbers: the operators work on 32 bits, so there are at most 32 set bits."],[13,"x − 1 flips the lowest 1 and the 0s below it, so AND removes exactly that bit."],[20,"`x & -x` keeps only the lowest set bit: 11 & −11 = 1."]]}]},{"t":"XOR cancels pairs: the single number and t
