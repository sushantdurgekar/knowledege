<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AB-620 Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#0a7356; --accent-ink:#ffffff; --accent-soft:#d8f0e7;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#4fd1a5; --accent-ink:#0c1117; --accent-soft:#10302a;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#4fd1a5; --accent-ink:#0c1117; --accent-soft:#10302a;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}

  hook: "Every AB-620 question assumes you know where things live in Copilot Studio: instructions, knowledge, tools, topics, agents, settings, channels. The interface also changed during 2026, so this module maps the **exam's names** to the **newest screens** before you build anything.",
  pre: { q: "An agent has a topic called *Check order status* and also a connector tool called *Get order*. A user types *where's my parcel?*. With generative orchestration on, how does the agent decide what to run?", a: "The orchestrator reads the **descriptions** (and names) of topics, tools, knowledge and agents, builds a plan, and picks what fits, possibly both. With classic orchestration, only **trigger phrases** on topics would match, and tools run only when a topic calls them." },
  story: [
    "Meet **Asha**, an IT developer at Contoso Retail. Her manager wants a *Customer Support Rep Assistant* that answers policy questions, looks up orders in Dataverse, files returns, and asks a supervisor before any refund over $100. Asha has Power Apps experience but has never built an agent.",
    "She opens Copilot Studio and finds that every agent lives in a **Power Platform environment** (with a Dataverse database), just like her apps. Before creating the agent she sets up a **solution** with her own publisher and marks it as the **preferred solution**, so everything she builds lands in a package she can move to test and production later.",
    "The agent's *brain* is the **orchestrator**. With **generative orchestration**, it reads the descriptions of everything Asha adds (knowledge sources, tools, topics, other agents) and decides at run time what to call, in what order, and what to ask the user when an input is missing. **Instructions** tell it who it is, what it may do, and when to escalate.",
    "Asha adds **knowledge** (the returns-policy PDF and the SharePoint site), **tools** (a Dataverse connector action and two agent flows), and a few **topics** for the conversations that must happen exactly the same way every time, such as the refund disclaimer. She tests in the test pane (*Preview* in the newest UI), watches the **activity map** to see which tool ran, and publishes to **Teams and Microsoft 365 Copilot**.",

  keys: [
    "Agents live in a **Power Platform environment** with **Dataverse**. Use a developer or sandbox environment for building, and a **solution** (custom publisher + prefix) set as the **preferred solution** so new components land in it.",
    "**Generative orchestration** (Settings > Generative AI): the orchestrator selects topics, tools, knowledge and agents by their **descriptions**, handles several intents in one message, asks for missing inputs and writes the answer. **Classic**: topics fire on trigger phrases and tools only run when a topic calls them.",

{
  id: "p01", d: "d1", t: "Plan an agent solution: integration, reuse, audiences", min: 75,
  hook: "Planning questions are worth a third of the exam, and they're almost all *choose the right pattern* questions. The trick is to spot the one constraint in the scenario that rules out every other option.",
  pre: { q: "A system has a documented REST API and you need to call it from one agent and also from a Power Apps app and two Power Automate flows. Custom connector or REST API tool?", a: "A **custom connector**: it's a Power Platform asset reused by apps, flows and agents. A REST API tool lives only in Copilot Studio." },
  story: [
    "Contoso's architect, **Daniel**, keeps a whiteboard with three columns for every agent request: **do something**, **answer questions**, **hand off reasoning**. \"Every requirement lands in one of these,\" he tells Asha. *Do something* means tools. *Answer questions* means knowledge. *Hand off reasoning* means another agent.",
    "For tools he climbs a ladder and stops at the first rung that works. First: a **prebuilt connector** (1,000+ exist, governed by DLP). If none fits but the API has an OpenAPI description, a **custom connector**, which every app and flow in Power Platform can reuse. If only this agent needs it, a **REST API tool** inside Copilot Studio. A single one-off call inside one topic: the **Send HTTP request** node. Several steps, branches or an approval: an **agent flow**. A tool server shared by many agents and clients: **MCP**. No API at all, only a screen: **computer use**.",
    "For knowledge, he asks where the content lives and who may see it. SharePoint and OneDrive keep permissions per user. **Copilot connectors** bring ServiceNow or Confluence content into Microsoft Graph. **Real-time Power Platform connectors** query live systems at question time. **Azure AI Search** serves large or custom indexes the data team already runs.",
    "Then reuse. The *returns lookup* will be needed by three agents, so it becomes an agent flow in a shared solution, not three copies of a topic. Common topics and knowledge go into a **component collection**. A fulfilment specialist that the warehouse team owns becomes a **connected agent** others can call.",
    "Last, the audience. The internal assistant runs in Teams with Microsoft sign-in and SharePoint knowledge. The public returns bot on the website has no sign-in, can't use tools that act as the user, discloses that it's an AI, and hands complex cases to a live agent. *Same company, two very different designs.*"

  keys: [
    "Classify each requirement: **tools** (do), **knowledge** (answer), **agents** (delegate reasoning). Plan each separately.",
    "Tool ladder: prebuilt connector → custom connector (reuse across Power Platform) → REST API tool (Copilot Studio only; OpenAPI v2, v3 auto-converted) → Send HTTP request node (one-off, not shareable) → agent flow (multi-step, approvals) → MCP (shared server, auto-discovered tools) → computer use (no API).",
    "Knowledge choices follow **where data lives** and **who may see it**: SharePoint/OneDrive (user permissions), Dataverse, uploaded files, public websites, Copilot connectors (indexed into Graph, admin-configured), real-time Power Platform connectors (live query, user auth), Azure AI Search (existing vector index).",
    "Enterprise integration questions often hinge on **identity** (end user vs shared account), **DLP** (connector groups), **licensing** (premium connectors), **latency** (100-second flow limit) and **network** (on-premises data gateway, VNet).",
    "Reusable components: custom connectors, agent flows, **component collections** (topics, knowledge, tools, entities shared across agents and moved with solutions), prompts, MCP servers, connected agents, skills.",

  code: [{ t: "Instruction skeleton that encodes the plan", lang: "text", src: `# Role
You are the Contoso Customer Support Rep Assistant for store staff.

# Scope
Answer questions about returns, refunds, orders and products only.
Politely decline anything else and suggest the IT service desk.

# Tools and knowledge
- Use /Get order details for any order-status question. Never guess.
- Use /Create return request only after the customer confirms the item and reason.
- Use the Returns Policy knowledge for policy questions and cite it.

# Escalation
Refunds over $100 go through /Request refund approval. Tell the user a supervisor will decide.

# Security
Never reveal customer data unless the staff member gives the order number.`, notes: [[1, "Role and audience first: the orchestrator uses this to set tone and limits."], [4, "Scope plus a polite refusal path reduces off-topic answers."], [9, "In Copilot Studio, typing `/` in instructions inserts a reference to a tool, topic or variable."], [10, "Encode confirmation rules for actions that change data."], [13, "Escalation rules belong in instructions *and* in the flow (approval) so they're enforced, not just suggested."]] }],
  portal: [{ t: "Create a component collection for reuse", path: "Copilot Studio > Agents > (agent) > Settings > Component collections (or Library)", steps: ["Create a new component collection and name it for its purpose, e.g. *Contoso common*.", "Add topics, knowledge, tools or entities to it.", "Add the collection to other agents in the same environment.", "Include it in your solution so it moves with ALM."] }],
  ex: { q: "Fabrikam's HR agent must (1) answer leave-policy questions from SharePoint, (2) create leave requests in an HR system that has an OpenAPI-described API already used by a Power Apps app, (3) route requests over 10 days to a manager for approval. Pick a pattern for each.", steps: ["(1) is *answer questions*: SharePoint knowledge keeps each user's permissions.", "(2) is *do something* in an API that apps already use: reuse means a custom connector (one may already exist for the app).", "(3) needs a decision by a person before the write: a multi-step agent flow with an approval, which calls the connector."], a: "**SharePoint knowledge** for policies; a **custom connector** for the HR API (shared with the app); an **agent flow** with a condition (>10 days) and an approval that then calls the connector. The agent calls the flow as a tool." },
  fade: { q: "A logistics company wants its website bot (anonymous visitors) to show delivery status from a tracking API.", steps: ["Visitors aren't signed in, so end-user credentials are impossible.", { ask: "Which credential model must the tool use?", a: "**Maker-provided** credentials (a service account or API key held in the connection), scoped to read-only tracking." }, { ask: "What extra protection limits abuse?", a: "Ask for both tracking number and postcode before calling, return only status fields, apply content moderation, and monitor usage. Writes should require sign-in." }] },
  traps: [
    ["Choosing a REST API tool when the scenario says the API must also be used by Power Apps or Power Automate.", "Reuse across Power Platform → **custom connector**."],
    ["Using the Send HTTP request node for a call several agents need.", "The node is per topic and not shareable. Use a connector or agent flow."],
    ["Splitting into many agents from day one.", "Start with one agent. Split for routing accuracy, ownership, security or reuse."],
    ["Planning tools that act as the user on a public anonymous website.", "No sign-in, no user identity. Use maker-provided credentials with least privilege, or require sign-in."],
    ["Putting a business rule only in instructions (\"always get approval\").", "Instructions guide; flows and approvals enforce. High-impact rules must be enforced in the flow."]
  ],
  disc: [
    ["Your security team prefers MCP for everything. When would you push back?", "MCP needs generative orchestration, can't be called from topics, and its tool descriptions are controlled server-side. For a single deterministic action inside a scripted topic, a connector or agent flow is simpler and easier to govern with DLP. MCP shines when many agents and clients share one tool catalogue."],
    ["How do you decide between knowledge and a tool for the same data (e.g., product catalogue in Dataverse)?", "Knowledge suits free-text questions over descriptions and documents (search + summarise with citations). A tool suits exact lookups and filters (price of SKU 123, stock in store 4). Many agents use both: knowledge for *tell me about*, tool for *give me the exact value*."]
  ],
  teach: { prompt: "Explain how you'd choose between a prebuilt connector, custom connector, REST API tool, HTTP node, agent flow, MCP and computer use.", rubric: ["Prebuilt connector first", "Custom connector for reuse across Power Platform", "REST API tool for Copilot Studio-only use", "HTTP node for a one-off call in a topic", "Agent flow for multi-step/approvals", "MCP for shared tool servers (generative orchestration)", "Computer use only when there's no API"], model: "I start with a prebuilt connector. If there isn't one and the API has an OpenAPI description, I build a custom connector when apps or flows also need it, or a REST API tool when only this agent does. A single call inside one topic can be a Send HTTP request node. Multi-step work with branches or approvals becomes an agent flow. When many agents and clients share tools, I use an MCP server, which needs generative orchestration. Computer use is the last resort for systems with no API." },
  qa: [["Three purposes of integrations?", "Do something (tools), answer questions (knowledge), hand off reasoning (agents)."], ["Reuse an API across apps, flows and agents?", "**Custom connector**."], ["API only for this agent, with an OpenAPI file?", "**REST API tool**."], ["Multi-step with approval?", "**Agent flow**."], ["No API at all?", "**Computer use**."], ["Share topics and knowledge across agents?", "**Component collection**."], ["Anonymous users and user-credential tools?", "Not possible: use maker-provided credentials or require sign-in."]],
  quiz: [
    { q: "An inventory API (OpenAPI 3.0) must be called by a Copilot Studio agent, a canvas app and a scheduled cloud flow. What should you build?", o: ["A REST API tool in Copilot Studio", "A custom connector", "A Send HTTP request node in a topic", "An MCP server"], a: 1, e: "A custom connector is the Power Platform asset that apps, flows and agents all reuse. Convert the 3.0 definition to OpenAPI 2.0 first (custom connectors import 2.0), or build it from blank. A REST API tool accepts 3.0 but isn't available to Power Apps or Power Automate.", tp: "Integration patterns" },
    { t: "match", q: "Match each requirement to the integration pattern.", pairs: [["One GET call to a weather API inside a single topic", "Send HTTP request node"], ["Create a record, wait for a manager's approval, then email the requester", "Agent flow"], ["A legacy desktop app with no API must be updated", "Computer use"], ["Twelve agents and two IDEs must share one catalogue of tools", "MCP server"]], extra: ["Copilot connector"], e: "One-off call → HTTP node; multi-step + approval → agent flow; no API → computer use; shared tool catalogue → MCP. Copilot connectors are knowledge, not tools.", tp: "Integration patterns" },
    { t: "yn", q: "A public website agent has **no authentication**. Evaluate each statement.", s: [["Tools configured with end-user credentials can run for anonymous visitors.", false], ["A connector using maker-provided credentials can run, with the maker's connection's permissions.", true], ["The agent should disclose that users are talking to an AI.", true]], e: "No sign-in means no user identity, so only maker-provided credentials work; scope them tightly. Disclosure is a responsible-AI expectation for external agents.", tp: "Audiences" },
    { q: "Three agents need the same set of topics (store hours, holiday schedule) and the same FAQ knowledge source. What minimises maintenance?", o: ["Copy the topics into each agent", "A component collection added to the three agents", "Three connected agents that each hold a copy", "Put the FAQ in each agent's instructions"], a: 1, e: "Component collections share topics, knowledge, tools and entities across agents and move with solutions.", tp: "Reuse" },
    { t: "ms", q: "Which TWO are good reasons to split a single agent into multiple agents?", o: ["Routing accuracy drops because the agent has dozens of tools", "Another team must own and release part of the capability on its own schedule", "The agent has more than five topics", "Users ask questions in two languages", "You want a different icon per feature"], a: [0, 1], e: "Too many tools hurts routing; separate ownership/lifecycle is a classic reason for a connected agent.", tp: "Multi-agent planning" },
    { q: "An HR agent's leave policy lives in SharePoint, and some pages are restricted to managers. Employees must only get answers from pages they can open. Which knowledge configuration meets this?", o: ["Upload the pages as files to the agent", "Add the SharePoint site as knowledge with users signed in", "Paste the policy into the instructions", "Use a public website knowledge source"], a: 1, e: "SharePoint knowledge searches with the signed-in user's permissions. Uploaded files and instructions ignore SharePoint permissions.", tp: "Knowledge" },
    { t: "ord", q: "Put Daniel's planning steps for a new agent request in order.", items: ["Classify requirements (do / answer / delegate) and identify audience and identity (internal or external, sign-in)", "Pick integration patterns for each requirement", "Plan reusable components and solution structure", "Plan channels, testing and release"], e: "Understand requirements and audience first, because identity constrains patterns; then reuse and packaging; then channels and release.", tp: "Planning" }

{
  id: "p02", d: "d1", t: "Identity, security and governance", min: 85,
  hook: "Identity is the hidden key to many AB-620 answers: *whose* permissions does a tool use, which channels work with which sign-in option, and what can an admin block? Get this wrong and a correct-looking design leaks data.",
  pre: { q: "A Teams agent uses a SharePoint connector tool. Should it read documents with the user's own permissions or with one shared account? What decides it?", a: "Usually the **user's own** permissions (end-user credentials), so people only see what they're allowed to. A **shared** (maker-provided) account fits when everyone should see the same data or users have no access to the system. The requirement wording decides." },
  story: [
    "Contoso's security lead, **Mei**, reviews Asha's agent with three questions on a sticky note: *Who is the user? Whose keys does each tool use? What can admins switch off?*",
    "**Who is the user?** The agent's authentication setting answers it. *No authentication* means anyone with the link can chat and the agent knows nothing about them. *Authenticate with Microsoft* signs people in with Microsoft Entra ID automatically in Teams and Microsoft 365 Copilot. *Authenticate manually* lets Asha register her own Entra ID app (or another OAuth 2.0 provider) for websites, mobile apps, single sign-on and access tokens she can pass to APIs.",
    "**Whose keys?** Each connector tool has a credential choice. **End-user credentials** (default) make every user sign in to the connection, so the HR connector shows each person only their own records. **Maker-provided credentials** use Asha's connection for everyone, convenient but powerful, so Mei insists on a narrowly scoped service account and admin approval.",
    "**What can admins switch off?** Plenty. **Data loss prevention (DLP)** policies put connectors into *Business*, *Non-business* or *Blocked* groups, and Copilot Studio features appear as connectors too: public website knowledge, specific channels, HTTP requests, Application Insights, unauthenticated chat. Managed Environments add sharing limits and solution checks. **Purview** audits activity and sensitivity labels follow SharePoint content into answers.",
    "By the end of the review, the agent signs users in with Microsoft, reads HR data with end-user credentials, writes returns through a scoped service account, and lives in a production environment whose DLP policy blocks everything it doesn't need."
  ],
  breaks: "Three questions are a start, not a threat model. Real reviews also cover prompt injection through documents, data residency, transcript retention, who may edit the agent, and how autonomous triggers (which run as the maker) are scoped.",
  dia: [
    { type: "tree", cap: "Choosing the agent's authentication option", root: { q: "Who uses the agent, and where?", c: [["Employees in Teams / Microsoft 365 Copilot", "Authenticate with Microsoft (Entra ID, automatic)"], ["Signed-in users on a website or mobile app, SSO, or tokens for your APIs", "Authenticate manually (Entra ID V2 or generic OAuth 2.0)"], ["Anonymous public visitors", "No authentication (no user-credential tools)"]] } },
    { type: "quad", cap: "Connector credentials: whose permissions?", x0: "Users see the same data", x1: "Users see their own data", y0: "Writes data", y1: "Read only", cells: [["Maker-provided, read-only", "Shared catalogue or FAQ lookups; scoped service account"], ["End-user credentials", "Each user reads only what they can open (SharePoint, Outlook, HR)"], ["Maker-provided, writes", "Service account writes for everyone: approvals, auditing, least privilege"], ["End-user credentials, writes", "Actions as the user (send my email, update my record); clear consent"]] }
  ],
  keys: [
    "Agent authentication options: **No authentication** (anyone with the link; no user identity), **Authenticate with Microsoft** (Entra ID, automatic in Teams, Microsoft 365 Copilot and other Microsoft surfaces; no access token available to you), **Authenticate manually** (Microsoft Entra ID V2 with federated credentials, certificates or client secrets; Entra ID; or Generic OAuth 2)."
    , "Manual authentication: app registration, client ID and credential, **scopes**, optional **token exchange URL** for SSO, and *Require users to sign in*. Gives you `System.User.AccessToken` to call your APIs.",
    "Authentication changes take effect only after you **publish**.",
    "Connector tool credentials: **end-user** (default; each user's own permissions; needs signed-in users) vs **maker-provided** (the maker's connection for everyone; admins can restrict this).",
    "Teams with manual Entra authentication: configure SSO (token exchange URL + Teams app manifest) so users aren't asked to sign in to the agent with a validation code. Connectors still can't use SSO under manual auth (users authenticate to each connector); *Authenticate with Microsoft* gives Teams SSO automatically. (Microsoft's pages currently disagree on whether manual auth is allowed in Teams at all; check before you build.)",
    "**DLP** policies group connectors as Business, Non-business or Blocked; one agent can't mix Business and Non-business connectors. Copilot Studio capabilities (channels, knowledge sources such as public websites, HTTP requests, Application Insights, chat without Entra authentication) are governed as connectors too. Enforcement is in real time.",
    "**Endpoint filtering** in DLP can allow or deny specific URLs for HTTP requests and connectors.",
    "Environment strategy: separate dev / test / prod; **Managed Environments** add sharing limits, solution checker enforcement, usage insights; security roles control who can build and who can view transcripts.",
    "Sharing an agent: **Editor** (co-author) vs **Viewer**; end users through security groups or the Teams/Microsoft 365 availability settings.",
    "Data protection: transcripts in Dataverse (retention configurable), **Microsoft Purview** audit and sensitivity labels, customer-managed keys at environment level, data stays in the environment's geography.",
    "Agent runtime protection: built-in defences against user and cross-prompt injection attacks (UPIA/XPIA); optional external threat detection that can review tool calls before they run."
  ],
  cmp: [
    { cap: "Agent authentication options", head: ["Option", "Channels", "User identity available?", "Typical use"], rows: [
      ["No authentication", "Website, demo site, most channels", "No", "Public FAQ bot"],
      ["Authenticate with Microsoft", "Teams, Microsoft 365 Copilot, other Microsoft surfaces", "Yes (name, ID), no access token", "Internal employee agent"],
      ["Authenticate manually", "All, incl. custom website and mobile app", "Yes, plus `System.User.AccessToken`", "SSO, calling your own APIs, customer identity providers"]] },
    { cap: "Who governs what", head: ["Control", "Where", "Example"], rows: [
      ["DLP policy", "Power Platform admin center", "Block public website knowledge in prod"],
      ["Managed Environments", "Power Platform admin center", "Limit sharing to security groups"],
      ["Maker credential control", "Admin settings", "Disallow maker-provided credentials"],
      ["Purview audit, sensitivity labels", "Microsoft Purview", "Audit agent edits and conversations"],
      ["Conditional Access", "Microsoft Entra", "Require compliant devices to sign in"]] }
  ],
  code: [{ t: "Using the signed-in user in a topic (Power Fx)", lang: "powerfx", src: `// Condition node: only continue for signed-in users
System.User.IsLoggedIn = true

// Message node text can insert the user's name
"Hi " & System.User.DisplayName & ", let's check your order."

// HTTP request header (manual authentication only)
"Bearer " & System.User.AccessToken`, notes: [[2, "Use in a Condition node before steps that need identity; send others to the Sign in topic."], [5, "`DisplayName`, `Email` and `Id` come from the sign-in."], [8, "`AccessToken` exists only with **Authenticate manually**; *Authenticate with Microsoft* doesn't expose it."]] }],
  portal: [
    { t: "Set authentication", path: "Copilot Studio > (agent) > Settings > Security > Authentication (new UI: Settings > Safety & access)", steps: ["Pick No authentication, Authenticate with Microsoft, or Authenticate manually.", "Manual: choose the service provider (Entra ID V2 with federated credentials / certificates / client secrets, or Generic OAuth 2), then client ID, credential and scopes.", "Optional: token exchange URL for SSO; *Require users to sign in*.", "Save, then **publish** so the change takes effect."] },
    { t: "Set a connector tool's credentials", path: "(agent) > Tools > (tool) > Details > Additional details > Credentials to use", steps: ["**End user credentials** (default) or **Maker-provided credentials**.", "For maker-provided, create the connection with a dedicated, least-privilege account.", "Test with a non-admin account to see what real users get."] }
  ],
  ex: { q: "An internal Teams agent must let employees see **their own** payslips through an HR connector, and must also post anonymised daily stats to a shared Teams channel. Configure identity.", steps: ["Agent sign-in: employees in Teams → Authenticate with Microsoft.", "Payslips: each user's own data → end-user credentials on the HR connector tool.", "Daily stats post: same for everyone, scheduled → an event trigger or flow with a service connection (maker-provided), scoped to that channel only."], a: "**Authenticate with Microsoft**; HR tool with **end-user credentials**; stats posting with a **dedicated maker-provided/service connection** limited to that channel. Add DLP so only the needed connectors are allowed." },
  fade: { q: "A customer portal (custom website) already signs users in with your company's Entra ID tenant. The agent must call your orders API as the user.", steps: ["Website + need for a token for your API → not Authenticate with Microsoft.", { ask: "Which authentication option and provider?", a: "**Authenticate manually** with **Microsoft Entra ID V2** (app registration, scopes for the orders API)." }, { ask: "How does the agent pass identity to the API?", a: "Send `System.User.AccessToken` in the `Authorization: Bearer` header (HTTP node) or use a connector/REST tool configured for OAuth with the user's sign-in." }] },
  traps: [
    ["Expecting `System.User.AccessToken` with *Authenticate with Microsoft*.", "It's only available with **manual** authentication."],
    ["Using maker-provided credentials for personal data (\"so users don't have to sign in\").", "Everyone would see what the maker can see. Use end-user credentials for per-user data."],
    ["Changing authentication and testing in Teams immediately.", "Auth changes need a **publish**, and users may need a new conversation."],
    ["Mixing a Business connector and a Non-business connector in one agent.", "DLP forbids it; the agent is blocked."],
    ["Forgetting autonomous triggers run as the maker.", "Scope the maker's connections, or use a dedicated service account."]
  ],
  disc: [
    ["Why might an organisation block maker-provided credentials entirely?", "Because a maker's broad permissions would be lent to every user, and audit logs show the maker instead of the real user. Blocking it forces end-user credentials or dedicated, approved service accounts."],
    ["What would you put in a production DLP policy for a customer-facing agent?", "Allow only the connectors it uses (Business group), block public website knowledge if answers must come from curated sources, restrict HTTP to known endpoints with endpoint filtering, block unneeded channels, and keep Application Insights allowed for monitoring."]
  ],
  teach: { prompt: "Explain the three agent authentication options and the two connector credential modes, and how you'd pick them.", rubric: ["No auth = anonymous, no user tools", "Authenticate with Microsoft = Entra in Teams/M365, no token", "Manual = Entra ID V2/OAuth for websites, SSO, tokens", "End-user credentials = each user's permissions", "Maker-provided = shared identity, least privilege", "Changes need publish"], model: "Agent sign-in is either none (anonymous, so no tools that act as the user), Authenticate with Microsoft (automatic Entra sign-in in Teams and Microsoft 365 Copilot, but no access token for you), or manual authentication with Entra ID V2 or another OAuth provider, which works on any channel and gives a token for your APIs. Separately, each connector tool uses either the end user's own credentials, so people only see their own data, or the maker's shared connection, which must be tightly scoped. Publish after changing authentication." },
  qa: [["Default connector credential mode?", "**End-user credentials**."], ["Option for a custom website with SSO to your API?", "**Authenticate manually** (Entra ID V2)."], ["Where is `User.AccessToken` available?", "Manual authentication only."], ["DLP connector groups?", "Business, Non-business, Blocked."], ["What's needed after changing auth?", "**Publish**."], ["Whose identity do event triggers use?", "The maker's connection."], ["What adds sharing limits and solution checks?", "**Managed Environments**."]],
  quiz: [
    { q: "An internal agent in Teams must read each employee's own Outlook calendar. Which configuration is correct?", o: ["No authentication + maker-provided credentials", "Authenticate with Microsoft + end-user credentials on the Outlook connector", "Authenticate manually + maker-provided credentials", "No authentication + end-user credentials"], a: 1, e: "Employees in Teams → Microsoft sign-in; per-user data → end-user credentials.", tp: "Identity" },
    { t: "yn", q: "Evaluate each statement about agent authentication.", s: [["With Authenticate with Microsoft, you can send `System.User.AccessToken` to your own API.", false], ["Manual authentication can use a generic OAuth 2.0 identity provider.", true], ["Authentication changes apply to channels only after you publish.", true]], e: "The access token needs manual auth; manual supports Entra ID and Generic OAuth 2; publish to apply.", tp: "Identity" },
    { q: "A maker added a SQL connector (Non-business group) to an agent that already uses Dataverse (Business group). What happens?", o: ["It works, with a warning", "The agent is blocked by the DLP policy", "Only the SQL connector is disabled at night", "Users are asked to approve the mix"], a: 1, e: "DLP doesn't allow Business and Non-business connectors together in one agent.", tp: "DLP" },
    { t: "ms", q: "A bank's production agent must not answer from arbitrary internet pages and may only call two approved APIs over HTTP. Which TWO admin controls achieve this?", o: ["A DLP policy that blocks the public websites knowledge source", "DLP endpoint filtering that allows only the two API URLs for HTTP", "Lowering content moderation", "Turning off generative orchestration", "Adding more trigger phrases"], a: [0, 1], e: "Copilot Studio capabilities are governed as connectors in DLP; endpoint filtering restricts HTTP destinations.", tp: "Governance" },
    { t: "match", q: "Match each scenario to the authentication choice.", pairs: [["Public FAQ on the company website", "No authentication"], ["Employee helpdesk in Teams", "Authenticate with Microsoft"], ["Customer app that calls the orders API with each customer's token", "Authenticate manually"]], extra: ["Maker-provided credentials"], e: "Anonymous → none; Teams employees → Microsoft; tokens for your API on a custom channel → manual. Maker-provided credentials is a connector setting, not an agent sign-in option.", tp: "Identity" },
    { q: "A Copilot Studio agent with an event trigger (\"When a new row is added\") creates follow-up tasks. Whose permissions do the trigger's actions use?", o: ["The user who added the row", "The maker's (author's) connection", "A system account that bypasses security", "The agent's end users in turn"], a: 1, e: "Event triggers authenticate with the agent author's credentials, so scope those connections.", tp: "Identity" },
    { t: "ord", q: "Put the steps to enable SSO for an Entra-protected agent in Teams 1:1 chats in order.", items: ["Register an app in Microsoft Entra ID with the scopes the agent needs", "In the agent, choose Authenticate manually and enter client ID, credential and scopes", "Set the token exchange URL for SSO", "Add the SSO settings to the Teams channel, then publish", "Test in Teams with a non-admin user"], e: "App registration first; configure the agent; SSO token exchange; publish/manifest; then test as a real user.", tp: "SSO" }
  ],
  src: [["Configure user authentication", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/configuration-end-user-authentication"], ["Configure data loss prevention policies for agents", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-data-loss-prevention"], ["Security and governance in Copilot Studio", "https://learn.microsoft.com/en-us/microsoft-copilot-studio/security-and-governance"]]

{
  id: "p03", d: "d1", t: "Responsible AI strategy for agents", min: 60,
  hook: "The exam expects a *strategy*, not slogans: which Copilot Studio settings, review steps and human controls make an agent fair, safe, transparent and accountable. Each principle maps to something you can switch on or design.",
  pre: { q: "Your external agent's generative answer is blocked by content moderation. What does the user see, and where would you change it?", a: "Copilot Studio raises an error (content filtered) and the **On Error** system topic runs, so by default the user gets a generic message. Customise the message (moderation settings or the On Error topic) and consider whether the moderation level fits." },
  story: [
    "Contoso's legal counsel, **Ifeoma**, joins the project when Asha's agent is about to go public. \"Tell me how this thing behaves when it's wrong, when someone abuses it, and when it doesn't know,\" she says.",
    "Asha walks her through **Microsoft's six principles** with a concrete control for each. *Reliability and safety*: grounding in approved knowledge, content moderation, evaluation before release. *Privacy and security*: sign-in, end-user credentials, DLP, transcript retention. *Fairness*: test sets with varied names and phrasing. *Inclusiveness*: accessible adaptive cards and plain language. *Transparency*: an opening message that says it's an AI, citations on answers. *Accountability*: named owners, Purview audit, and humans approving refunds.",
    "Ifeoma tries to break it. She asks it to ignore its instructions; the built-in jailbreak protection stops her. She uploads a document with hidden instructions; cross-prompt injection protection flags it. She asks for medical advice; the instructions decline politely and point to a doctor.",
    "Her last request is the most useful: \"When it isn't sure, I want a person.\" Asha adds an escalation path: low-confidence or sensitive cases hand off to a live agent with the conversation history, and every refund above $100 waits for a supervisor's approval in the flow."
  ],
  breaks: "Settings reduce risk; they don't remove it. Moderation can block legitimate content (false positives) and miss subtle harms; that's why RAI also means monitoring, user feedback, and regular re-evaluation after every model or knowledge change.",
  dia: [
    { type: "hub", cap: "Six principles → Copilot Studio controls", core: "Responsible AI", spokes: [["Reliability & safety", "grounded knowledge, content moderation, evaluation, fallbacks"], ["Privacy & security", "authentication, end-user credentials, DLP, retention, Purview"], ["Fairness", "diverse test sets, review results by group"], ["Inclusiveness", "plain language, accessible cards, languages"], ["Transparency", "AI disclosure, citations, explain limits"], ["Accountability", "owners, approvals (HITL), audit, incident process"]] },
    { type: "flow", cap: "Responsible AI lifecycle for an agent", steps: [["Map", "harms, misuse, affected users"], ["Measure", "evaluation test sets, red-teaming"], ["Mitigate", "moderation, instructions, grounding, approvals"], ["Operate", "monitor, feedback, incidents, re-evaluate on change"]], loop: "Repeat after model, knowledge or tool changes" }
  ],
  keys: [
    "Microsoft's principles: **fairness, reliability and safety, privacy and security, inclusiveness, transparency, accountability**.",
    "**Content moderation** level is set for the agent (generative AI / moderation settings) and can be customised per **generative answers** node. Stricter levels block more; looser levels allow more answers but more risk.",
    "When moderation blocks a response, a *content filtered* error is raised and the **On Error** system topic handles it; customise the user-facing message.",
    "Built-in protection against **jailbreaks (UPIA)** and **cross-prompt injection (XPIA)** from documents and tool outputs; optional external runtime threat detection for tool calls.",
    "**Grounding**: limit answers to approved knowledge; decide whether the agent may use **general knowledge** and **web search**; ask for citations.",
    "**Transparency**: disclose AI in the greeting (Conversation Start topic), show citations, say what the agent can't do.",
    "**Human oversight**: escalation/handoff (Escalate topic, Omnichannel/contact centre), approvals in agent flows for high-impact actions.",
    "**Privacy**: collect only needed data, end-user credentials, DLP, transcript retention settings, sensitivity labels honoured from SharePoint.",
    "**Fairness & inclusiveness**: test sets with varied names, dialects and phrasing; accessible adaptive cards (alt text, clear labels); multilingual support.",
    "**Accountability**: owners and approvers, Purview audit, version control via solutions, an incident process and re-evaluation after changes."
  ],
  cmp: [{ cap: "Risk → control", head: ["Risk", "Control in Copilot Studio", "Enforced or advisory?"], rows: [
    ["Harmful or offensive output", "Content moderation level, On Error message", "Enforced"],
    ["Prompt injection in a document", "Built-in XPIA protection; least-privilege tools", "Enforced (plus design)"],
    ["Ungrounded answers", "Knowledge-only answers, general knowledge off, citations", "Configuration"],
    ["Wrong refund issued", "Approval step in the agent flow", "Enforced"],
    ["Off-topic advice (medical, legal)", "Instructions with refusal and referral", "Advisory (test it)"],
    ["Users unaware it's an AI", "Disclosure in Conversation Start", "Design"]] }],
  code: [{ t: "On Error topic: friendlier message for filtered content (Power Fx condition)", lang: "powerfx", src: `// Condition branch 1
System.Error.Code = "ContentFiltered"

// Message for branch 1
"I can't help with that request. If you think this is a mistake, type 'agent' to reach a person."

{
  id: "p04", d: "d1", t: "Channels and deployment", min: 60,
  hook: "Publishing is easy; publishing *correctly* is tested: which channels need which sign-in, why Teams cards look different from the test pane, what happens when you republish, and how an org-wide Teams rollout gets approved.",
  pre: { q: "You publish an update, but a colleague in Teams still sees the old behaviour. Why?", a: "Their existing conversation keeps the old session. A new conversation (after inactivity, or typing *start over*) picks up the latest published version, which can take a short while to reach all channels." },
  story: [
    "Asha's agent is ready. She clicks **Publish**, and one button pushes the latest version to **every** channel the agent is connected to. Nothing changes for users until she publishes, so she can keep editing safely in between.",
    "For staff she adds the **Teams and Microsoft 365 Copilot** channel (one combined channel in the newest UI). She can share a link, let colleagues she shared it with find it in Teams, or **submit it for admin approval** so it appears for everyone in the organisation, and the Teams admin approves it in the Teams admin center.",
    "For customers, the marketing team wants the agent on the public site. The **demo website** is only for quick tests. The real site gets the **custom website** embed code, an iframe, and because the agent shouldn't be embeddable by anyone, Asha turns on **web channel security** so the site exchanges a secret for a short-lived **Direct Line token** on its server.",
    "The mobile team uses **Direct Line** too, from their app. The contact centre connects the agent to **Dynamics 365 Contact Center/Omnichannel** so it can hand conversations to a live agent with full context. Someone asks about Slack; that goes through **Azure Bot Service** channels.",
    "On launch day, a manager complains that a card looks broken in Teams. It used a feature from Adaptive Card schema 1.6, which the test pane renders but Teams (1.5) doesn't. Asha learns to test **in the real channel**."
  ],
  breaks: "\"Publish once, everywhere\" is true for content, but each channel has its own capabilities and settings outside the agent: Teams app availability, website embedding and security keys, Azure Bot Service registrations, contact-centre routing. Those don't travel in a solution and must be configured per environment.",
  dia: [
    { type: "hub", cap: "Channels from one published agent", core: "Published agent", spokes: [["Teams + Microsoft 365 Copilot", "employees; Microsoft sign-in; admin approval for org-wide"], ["Custom website", "iframe or Web Chat; web channel security + tokens"], ["Demo website", "testing only"], ["SharePoint", "agent on a site"], ["Mobile / custom app", "Direct Line"], ["Contact centre", "Omnichannel handoff with context"], ["Social and messaging", "WhatsApp, Facebook; Slack, Telegram, SMS via Azure Bot Service"]] },
    { type: "seq", cap: "Secured web channel: token exchange", actors: ["Browser", "Your web server", "Direct Line", "Agent"], msgs: [["Browser", "Your web server", "Page load: request a token"], ["Your web server", "Direct Line", "Exchange secret for token (server side)"], ["Direct Line", "Your web server", "Short-lived token", true], ["Your web server", "Browser", "Token", true], ["Browser", "Agent", "Chat using the token"]] }
  ],
  keys: [
    "**Publish** sends the latest version to all connected channels; edits are invisible to users until then. Users may need a new conversation to see changes.",
    "Teams + Microsoft 365 Copilot: availability options include a share link, showing it to people you shared it with, or **submitting for admin approval** to show it to the whole organisation (approved in the Teams admin center).",
    "Custom website: embed code (iframe) or Bot Framework Web Chat; turn on **web channel security** (require secured access) and exchange the secret for a **token** on your server; never put the secret in page script.",
    "Demo website is for testing and stakeholder demos, not production.",
    "Mobile and custom apps use **Direct Line** (token endpoint from the agent's channel settings).",
    "Contact-centre handoff: Dynamics 365 Contact Center / Omnichannel for Customer Service receives the conversation and context through the **Escalate** (transfer) path.",
    "Other channels through **Azure Bot Service**: Slack, Telegram, Twilio SMS, LINE, email and others.",
    "Channel capabilities differ: **Teams supports Adaptive Card schema 1.5**, while the test pane renders 1.6; some channels lack quick replies or markdown. Test in the target channel.",
    "Sign-in option limits channels: *Authenticate with Microsoft* suits Microsoft surfaces; custom websites/mobile with sign-in need **manual authentication**.",
    "Channel configuration, sharing and web security keys are **not** solution-aware: redo them in each environment after deployment."
  ],
  cmp: [{ cap: "Channel decision table", head: ["Need", "Channel", "Watch out"], rows: [
    ["Employees in Teams and Copilot", "Teams + Microsoft 365 Copilot", "Org-wide needs admin approval; cards max 1.5"],
    ["Public website", "Custom website", "Web channel security + tokens; moderation; no user-credential tools"],
    ["Quick demo for stakeholders", "Demo website", "Not for production"],
    ["Your own mobile app", "Direct Line (mobile app channel)", "Token exchange on your back end"],
    ["Human agents take over", "Omnichannel / Contact Center", "Configure Escalate topic and context variables"],
    ["Slack or SMS", "Azure Bot Service channels", "Extra Azure resource configuration"]] }],
  code: [{ t: "Get a Direct Line token on your server (never in the browser)", lang: "http", src: `POST https://directline.botframework.com/v3/directline/tokens/generate
Authorization: Bearer <WEB_CHANNEL_SECRET_FROM_KEY_VAULT>

HTTP/1.1 200 OK
{
  "conversationId": "abc123",
  "token": "eyJhbGciOi...",
  "expires_in": 3600
}`, notes: [[1, "Your back end calls Direct Line with the channel secret from web channel security settings."], [2, "Keep the secret in Key Vault or server configuration, never in the page."], [7, "The browser only ever sees this short-lived token."]] }],
  portal: [{ t: "Publish to Teams and Microsoft 365 Copilot", path: "(agent) > Publish, then Channels > Teams and Microsoft 365 Copilot", steps: ["Publish the agent.", "Open the channel, add it, and edit details (icon, short and long description).", "Availability options: copy a link, show to teammates and shared users, or submit for admin approval to show to everyone.", "Teams admin approves in the Teams admin center; users then find it under apps built for the org.", "Republish after changes; users start a new conversation to see them."] }],
  ex: { q: "A retailer wants the same agent on its public website (anonymous), in Teams for store staff, and with handoff to live agents for complaints. Plan the deployment.", steps: ["One agent can't have two sign-in modes; anonymous web and signed-in staff have different needs.", "Staff features (tools acting as the user) shouldn't be exposed to anonymous visitors.", "Complaints need the Escalate path into the contact-centre platform."], a: "Two agents (or a staff agent plus a public agent sharing a component collection): the public one with **no authentication**, custom website channel with **web channel security**, strict moderation and **Omnichannel handoff**; the staff one with **Authenticate with Microsoft** in **Teams + Microsoft 365 Copilot**, submitted for admin approval." },
  fade: { q: "Marketing pasted the iframe embed code into the public site. Security says anyone can now embed the agent elsewhere.", steps: ["The embed code works without a token unless security is required.", { ask: "What setting do you turn on?", a: "**Web channel security**: require secured access (secret/token)." }, { ask: "What must the website team change?", a: "Add a server-side endpoint that exchanges the secret for a Direct Line token and passes only the token to Web Chat." }] },
  traps: [
    ["Judging card rendering from the test pane.", "The test pane renders schema 1.6; Teams uses 1.5. Test in Teams."],
    ["Using the demo website for customers.", "It's for testing. Use the custom website channel."],

  disc: [
    ["Why might you publish two agents instead of one for internal and external users?", "They need different sign-in, tools, knowledge and moderation. Sharing a component collection or connected agent keeps common logic in one place while each agent keeps the right security boundary."],
    ["How would you roll out an agent to 20,000 employees safely?", "Pilot with a security group (shared users), monitor analytics and feedback, fix issues, then submit for admin approval to show to everyone; communicate how to give feedback and reach a human."]
  ],
  teach: { prompt: "Explain how publishing works across channels and what you must check for Teams and for a public website.", rubric: ["One publish updates all channels; new conversation to see changes", "Teams: availability options and admin approval for org-wide", "Teams cards max schema 1.5", "Website: custom website + web channel security + server-side token", "Channel settings aren't solution-aware"], model: "Publishing pushes the latest version to every connected channel, and users see it in a new conversation. For Teams and Microsoft 365 Copilot, I choose availability: a link, shared users, or admin approval for the whole organisation, and I test cards in Teams because it supports schema 1.5. For a public website I use the custom website channel, require secured access, and exchange the secret for a Direct Line token on the server. Channel settings don't travel in solutions, so I redo them in each environment." },
  qa: [["What does one publish update?", "All connected channels."], ["Max adaptive card schema in Teams?", "**1.5**."], ["Org-wide Teams availability needs?", "Admin approval in the Teams admin center."], ["Secure a website embed?", "Web channel security + server-side Direct Line token."], ["Mobile app channel uses?", "**Direct Line**."], ["Slack, Telegram, SMS?", "Through Azure Bot Service channels."]],
  quiz: [
    { q: "After publishing a fix, a tester in Teams still sees the old answer. What should they do FIRST?", o: ["Republish the agent five times", "Start a new conversation (for example type \"start over\")", "Delete and re-add the Teams channel", "Clear the browser cache of Copilot Studio"], a: 1, e: "Existing sessions keep the old version; a new conversation loads the latest publish.", tp: "Publishing" },
    { t: "ms", q: "Which TWO actions are required to make an internal agent appear for everyone in the organisation in Teams?", o: ["Publish the agent", "Submit it for admin approval from the Teams and Microsoft 365 Copilot channel", "Switch the agent to no authentication", "Add it to a component collection", "Enable the demo website"], a: [0, 1], e: "Publish, then submit for admin approval so it shows to everyone once approved.", tp: "Teams" },
    { t: "yn", q: "Evaluate each statement about the website channel.", s: [["The demo website is suitable for production customers.", false], ["With web channel security on, your server should exchange the secret for a token.", true], ["Web channel security settings are exported with the solution.", false]], e: "Demo site is for testing; tokens are minted server-side; channel security isn't solution-aware.", tp: "Web channel" },
    { q: "A card with `Action.Execute` and schema 1.6 works in the test pane but fails in Teams. What's the BEST fix?", o: ["Raise the card version to 1.7", "Design to schema 1.5 and use supported actions such as Action.Submit", "Move the card to a child agent", "Use the demo website instead of Teams"], a: 1, e: "Teams supports up to 1.5; design to the lowest version among target channels.", tp: "Channel capabilities" },
    { t: "match", q: "Match each requirement to the channel.", pairs: [["Customers chat inside your company's iOS app", "Direct Line (mobile app)"], ["Complaints transfer to human agents with context", "Omnichannel / Contact Center"], ["Agent available inside a SharePoint intranet page", "SharePoint"], ["Team members in Slack", "Azure Bot Service channel"]], extra: ["Demo website"], e: "Custom apps use Direct Line; live handoff uses Omnichannel; SharePoint channel for intranet; Slack via Azure Bot Service.", tp: "Channels" },
    { t: "ord", q: "Order the rollout of a Teams agent to the organisation.", items: ["Add the Teams and Microsoft 365 Copilot channel, set app details and publish", "Pilot with shared users and fix issues", "Submit for admin approval", "Admin approves; agent appears for everyone"], e: "Set up the channel and publish (at least once before sharing), pilot, then request and receive approval.", tp: "Teams" }
