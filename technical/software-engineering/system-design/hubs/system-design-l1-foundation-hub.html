a n: (f\"small-{n}\", 1, 300)\ndesigns = ((\"all up\", [big(1), big(2), small(1), small(2), small(3)]),\n           (\"big-1 down\", [big(2), small(1), small(2), small(3)]),\n           (\"big-3 added, big-1 down\", [big(2), big(3), small(1), small(2), small(3)]))\nfor label, pool in designs:\n    print(f\"{label}:\", *(f\"{name} {rps}/s {pct}%\" for name, rps, pct in shares(2_000, pool)))\n","out":"all up: big-1 666/s 74% big-2 666/s 74% small-1 222/s 74% small-2 222/s 74% small-3 222/s 74%\nbig-1 down: big-2 1000/s 111% small-1 333/s 111% small-2 333/s 111% small-3 333/s 111%\nbig-3 added, big-1 down: big-2 666/s 74% big-3 666/s 74% small-1 222/s 74% small-2 222/s 74% small-3 222/s 74%\n"},{"lang":"javascript","src":"function shares(peak, pool) {\n  // pool: [name, weight, capacity] per server; weighted round robin splits the peak by weight\n  const total = pool.reduce((sum, [, w]) => sum + w, 0);\n  return pool.map(([name, w, cap]) => [name, Math.floor((peak * w) / total), Math.floor((peak * w * 100) / (total * cap))]);\n}\n\nconst big = n => [`big-${n}`, 3, 900];\nconst small = n => [`small-${n}`, 1, 300];\nconst designs = [[\"all up\", [big(1), big(2), small(1), small(2), small(3)]],\n  [\"big-1 down\", [big(2), small(1), small(2), small(3)]],\n  [\"big-3 added, big-1 down\", [big(2), big(3), small(1), small(2), small(3)]]];\nfor (const [label, pool] of designs) {\n  console.log(`${label}:`, ...shares(2000, pool).map(([name, rps, pct]) => `${name} ${rps}/s ${pct}%`));\n}\n","out":"all up: big-1 666/s 74% big-2 666/s 74% small-1 222/s 74% small-2 222/s 74% small-3 222/s 74%\nbig-1 down: big-2 1000/s 111% small-1 333/s 111% small-2 333/s 111% small-3 333/s 111%\nbig-3 added, big-1 down: big-2 666/s 74% big-3 666/s 74% small-1 222/s 74% small-2 222/s 74% small-3 222/s 74%\n"}]},"a":"With everything up, every server runs at about 74% of its capacity. When big-1 fails, each remaining server is pushed to about 111%, because 1,800 requests per second of capacity can't carry a 2,000 peak. Adding a third big server brings the pool back to 74% even with one big server down."},"fade":{"q":"Plain weighted round robin with weights a = 5, b = 1, c = 1 sends a, a, a, a, a, then b and c: right on average, but in bursts. Finish `next_server()` for smooth weighted round robin (the algorithm NGINX uses): on every pick, add each server's weight to its current value, pick the server with the largest current value (the first one on a tie), and subtract the total of all weights from the winner.","steps":["Each server keeps a current value, starting at 0; the total of the weights is fixed.",{"ask":"What does every server earn on each pick?","a":"Its weight is added to its current value, so a heavy server climbs faster and is picked more often."},{"ask":"Why subtract the total from the winner?","a":"It pays back exactly what all servers earned together on that pick, so the sum of the current values stays 0. The winner drops below the others and waits its turn, which interleaves the picks: over each run of `total` picks every server is picked exactly `weight` times."},{"ask":"What does a pick cost?","a":"O(n) time for n servers and O(n) memory for the current values: fine for the tens of servers behind one load balancer."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class SmoothWeightedRR:\n    def __init__(self, weights):              # weights: [(name, weight), ...] in a fixed order\n        self.names = [n for n, _ in weights]\n        self.weights = [w for _, w in weights]\n        self.current = [0] * len(weights)\n        self.total = sum(self.weights)\n\n    def next_server(self):\n        ...                                   # TODO: everyone earns their weight; the largest wins and pays the total\n"},{"lang":"javascript","src":"class SmoothWeightedRR {\n  constructor(weights) {                      // weights: [[name, weight], ...] in a fixed order\n    this.names = weights.map(([n]) => n);\n    this.weights = weights.map(([, w]) => w);\n    this.current = new Array(weights.length).fill(0);\n    this.total = this.weights.reduce((x, y) => x + y, 0);\n  }\n  nextServer() {\n    // TODO: everyone earns their weight; the largest wins and pays the total\n  }\n}\n"}]},"solution":{"t":"Solution: earn the weight, the leader pays the total","tabs":[{"lang":"python","src":"class SmoothWeightedRR:\n    def __init__(self, weights):              # weights: [(name, weight), ...] in a fixed order\n        self.names = [n for n, _ in weights]\n        self.weights = [w for _, w in weights]\n        self.current = [0] * len(weights)\n        self.total = sum(self.weights)\n\n    def next_server(self):\n        for i, w in enumerate(self.weights):\n            self.current[i] += w              # everyone earns their weight\n        best = max(range(len(self.current)), key=lambda i: self.current[i])   # the first of the largest\n        self.current[best] -= self.total      # the winner pays back the total\n        return self.names[best]\n\nweights = [(\"a\", 5), (\"b\", 1), (\"c\", 1)]\nrr = SmoothWeightedRR(weights)\nprint(\"smooth:\", *(rr.next_server() for _ in range(7)))\nprint(\"plain: \", *(name for name, w in weights for _ in range(w)))\n","out":"smooth: a a b a c a a\nplain:  a a a a a b c\n"},{"lang":"javascript","src":"class SmoothWeightedRR {\n  constructor(weights) {                      // weights: [[name, weight], ...] in a fixed order\n    this.names = weights.map(([n]) => n);\n    this.weights = weights.map(([, w]) => w);\n    this.current = new Array(weights.length).fill(0);\n    this.total = this.weights.reduce((x, y) => x + y, 0);\n  }\n  nextServer() {\n    this.weights.forEach((w, i) => { this.current[i] += w; });   // everyone earns their weight\n    let best = 0;\n    for (let i = 1; i < this.current.length; i++) if (this.current[i] > this.current[best]) best = i;   // the first of the largest\n    this.current[best] -= this.total;         // the winner pays back the total\n    return this.names[best];\n  }\n}\n\nconst weights = [[\"a\", 5], [\"b\", 1], [\"c\", 1]];\nconst rr = new SmoothWeightedRR(weights);\nconsole.log(\"smooth:\", ...Array.from({ length: 7 }, () => rr.nextServer()));\nconsole.log(\"plain: \", ...weights.flatMap(([name, w]) => Array(w).fill(name)));\n","out":"smooth: a a b a c a a\nplain:  a a a a a b c\n"}]}},"traps":[["“Round robin spreads the load evenly.”","It spreads the number of requests evenly. If requests differ in cost or servers differ in size, the load doesn't: one server can end up with every slow request. Least connections or weights fix that."],["“A health check that returns 200 proves the server works.”","It proves the health check works. A shallow check can pass while the server fails real requests, so check what real requests need, and watch real error rates too (passive checks)."],["“Health checks should test every dependency.”","If every server's check fails when one shared dependency, such as the database, has a blip, the load balancer removes every server at once and a partial outage becomes a total one. Check what taking this one server out would actually fix."],["“Mark a server down on its first failed check.”","Then one dropped packet flaps it out and back in. Use thresholds: several failures in a row to go down, several passes in a row to come back."],["“The load balancer can't fail.”","It's a server too. Run a redundant pair or a managed load balancer spread across zones, or it's the single point of failure in front of all your redundancy."],["“Hashing users to servers is free stickiness.”","With hash mod N, adding or removing one server sends most users to a different server, emptying their caches at once. Consistent hashing (L2) moves only about 1/N of them."]],"disc":[["Layer 4 or layer 7 load balancing for a web app with an API and static files?","Usually layer 7: it can terminate TLS once, route /api to the app servers and /static to a file service or CDN, add headers, and retry safe requests on another server. Layer 4 is simpler and faster per connection and works for any protocol, so it's common in front of databases, for traffic that isn't HTTP, or as a first tier in front of a fleet of layer 7 proxies."],["How do you deploy a new version behind a load balancer without dropping requests?","Roll through the servers one or a few at a time: mark a server as draining so it gets no new requests, wait for its requests in flight to finish, stop it, deploy, start it, and send it traffic only once it passes its health checks. Keep enough capacity that the pool carries the peak with those servers out, and watch the error rate as you go so you can stop and roll back."]],"teach":{"prompt":"Explain to a junior colleague how a load balancer decides where each request goes, and how it notices that a server has failed.","rubric":["Round robin is fair only when servers and requests are alike","Weights for different server sizes; least connections for uneven request times","Health checks with down and up thresholds","A check proves useful work but doesn't fail every server over one shared dependency","The load balancer itself must be redundant; drain servers before removing them"],"model":"The load balancer gives clients one address and picks a server from the pool for each request. Round robin takes them in turn, which is fair when every server is the same size and every request costs about the same. If the servers differ, weights give the bigger ones a bigger share; if request times vary, least connections sends each request to the server with the fewest in flight, so a server stuck on slow requests stops being picked. To notice failures it probes every server every few seconds, takes one out after several failed checks in a row and brings it back after several passes, so one blip doesn't make it flap. The check should prove the server can do useful work, without failing every server at once when a shared database has a hiccup. And the load balancer itself runs as a redundant pair or a managed service across zones, and servers are drained before they're removed."},"qa":[["What does round robin do?","Sends each new request to the next server in turn."],["When is least connections better than round robin?","When request times vary: a server busy with slow requests collects connections and stops being picked."],["Layer 4 or layer 7?","Layer 4 forwards TCP or UDP connections without reading them; layer 7 understands HTTP and can route by path, host or header."],["Why does a health check need thresholds?","So one failed or slow probe doesn't flap a server out of the pool and back in."],["What does hash mod N do when N changes?","It moves most keys to a different server: about 80% when going from 4 servers to 5."],["What is connection draining?","Sending a server no new requests while its requests in flight finish, before it's removed."]],"quiz":[{"q":"What does this print?","snip":{"t":"Least connections, four picks","tabs":[{"lang":"python","src":"active = [2, 0, 1]                          # requests in flight on servers 0, 1, 2\npicks = []\nfor _ in range(4):\n    s = active.index(min(active))           # fewest in flight; ties go to the lowest index\n    active[s] += 1\n    picks.append(s)\nprint(*picks, *active)\n"},{"lang":"javascript","src":"const active = [2, 0, 1];                   // requests in flight on servers 0, 1, 2\nconst picks = [];\nfor (let k = 0; k < 4; k++) {\n  const s = active.indexOf(Math.min(...active));   // fewest in flight; ties go to the lowest index\n  active[s]++;\n  picks.push(s);\n}\nconsole.log(...picks, ...active);\n"}]},"o":["1 1 2 0 3 2 2","1 2 0 1 3 2 2","1 1 2 2 2 2 3","0 1 2 0 3 2 2"],"a":0,"e":"Server 1 starts empty, so it takes the first request; it then ties with server 2 at 1, and the lower index wins again. Next server 2 is the only one at 1, and finally all three are at 2, so server 0 wins the tie. The counts end at 3, 2, 2."},{"q":"What does this print? (`health_states` / `healthStates` is this module's helper: down after `fall` failures in a row, up after `rise` passes.)","snip":{"t":"Thresholds 3 and 2","tabs":[{"lang":"python","src":"print(health_states(\"+--+---+++\", fall=3, rise=2))\n"},{"lang":"javascript","src":"console.log(healthStates(\"+--+---+++\", 3, 2));\n"}]},"o":["UUUUUUDDUU","UDDUDDDUUU","UUUUUUDDDU","UUUUUUDUUU"],"a":0,"e":"The first two failures are reset by the pass at position 4. The next three failures in a row take the server down at position 7. It needs two passes to come back, so it's still down at position 8 and up at 9."},{"q":"Requests to your API take anything from 5 ms to 5 s, and all the servers are the same size. Which algorithm keeps the load most even?","o":["Least connections: a server busy with slow requests collects connections and stops being picked","Round robin: every server gets the same number of requests","Hashing the client's IP address: each client always goes to the same server","Weighted round robin with equal weights"],"a":0,"e":"Round robin, and weighted round robin with equal weights (which is the same thing), count requests rather than load, so slow requests can pile up on one server. Hashing pins clients to servers whatever their load."},{"q":"Which are good practices for health checks? (choose 2)","t":"ms","o":["Mark a server down only after several failed checks in a row","Check what this server needs to do useful work, without failing every server when one shared dependency has a blip","Make the health check run the whole checkout flow, including the payment provider","Check once an hour to save load","Return 200 from /health as soon as the process starts, before it has loaded its configuration"],"a":[0,1],"e":"Thresholds stop flapping, and checks should prove useful work without coupling every server to a shared dependency. A full checkout check fails every server when the payment provider has a blip, hourly checks leave dead servers in the pool for an hour, and passing before the configuration is loaded sends traffic to a server that can't serve it."},{"q":"Judge each statement.","t":"yn","s":[["A layer 7 load balancer can send /api and /images to different pools of servers.",true],["A layer 4 load balancer reads HTTP headers to choose a server.",false],["Going from 4 to 5 servers with hash mod N moves about 80% of the keys.",true],["The load balancer itself never needs redundancy.",false]],"e":"Layer 7 understands HTTP, so it can route by path. Layer 4 sees only addresses and ports. A key stays put under mod N only when its hash leaves the same remainder for 4 and 5, about 1 key in 5. And a single load balancer is a single point of failure."},{"q":"Put the steps of taking a server out for maintenance in order.","t":"ord","items":["Mark the server as draining, so the load balancer sends it no new requests","Wait for its requests in flight to finish, or for a drain timeout","Stop the server and do the maintenance","Start it and let it pass its health checks before it gets traffic again"],"e":"Draining comes first so no new work arrives, the work in flight must finish before the server stops, and the server must be running again before it can pass a health check."},{"q":"Complete the Python function for weighted least connections (fewest requests in flight per unit of weight; the lowest index on a tie), using whole numbers only.","t":"drop","lang":"python","code":"def weighted_least_conn(active, weights):\n    best = 0\n    for s in range(1, len(active)):\n        if active[s] * {{0}} < active[best] * {{1}}:\n            best = s\n    return best\n","blanks":[{"o":["weights[best]","weights[s]","active[best]","1"],"a":0},{"o":["weights[s]","weights[best]","active[s]","1"],"a":0}],"e":"Comparing active[s] ÷ weights[s] with active[best] ÷ weights[best] is the same as cross-multiplying: active[s] × weights[best] < active[best] × weights[s], with no division and no rounding."},{"q":"Match each algorithm to how it picks a server.","t":"match","pairs":[["Hands requests to the servers in turn","Round robin"],["Gives bigger servers a bigger share","Weighted round robin"],["Sends each request to the server with the fewest in flight","Least connections"],["Sends the same key to the same server","Hash-based routing"]],"extra":["Health check"],"e":"A health check decides which servers are in the pool; the algorithms decide which of those gets each request."}],"probs":[["Exercise · How NGINX balances load","https://nginx.org/en/docs/http/load_balancing.html","","find round robin, least_conn and ip_hash, and the weight and max_fails settings; map each one to this module"],["Exercise · Health check settings in a managed load balancer","https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html","","find the interval and the healthy and unhealthy thresholds, and work out how long a dead server keeps getting requests with the defaults"],["Exercise · Least request and the power of two choices","https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/load_balancers","","read how Envoy's least request picks between random choices, then add it as a policy to this module's simulate"],["Reading · Load balancing in a data centre at scale","https://sre.google/sre-book/load-balancing-datacenter/","","compare simple round robin, least-loaded round robin and weighted round robin, and what went wrong with each"]],"src":[["NGINX: Using nginx as HTTP load balancer","https://nginx.org/en/docs/http/load_balancing.html"],["Google SRE book: Load balancing in the datacenter","https://sre.google/sre-book/load-balancing-datacenter/"],["Envoy: Supported load balancers","https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/upstream/load_balancing/load_balancers"],["AWS: Health checks for Application Load Balancer target groups","https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html"]]},{"id":"m05","d":"d3","t":"Caching: hit ratios, expiry and eviction","min":100,"hook":"A cache keeps a copy of data somewhere faster and closer, so most reads never reach the slow, expensive store: at a 90% hit ratio the database sees a tenth of the reads. But every cache raises the questions interviewers love: what happens on a miss, when does a copy go stale, what goes when the cache is full, and what happens when a popular entry expires?","pre":{"q":"Your database answers a read in 10 ms and your cache in 1 ms. With a 90% hit ratio, what's the average read time, and how many reads a second reach the database at 5,000 reads a second? What if the hit ratio drops to 80%?","a":"Every read checks the cache, and the 10% that miss also pay the database: 1 + 0.1 × 10 = 2 ms on average, with 500 reads a second reaching the database. At 80% it's 3 ms and 1,000 database reads a second: a ten-point drop in hit ratio doubles the database load."},"kid":{"t":"The jars on Luigi's counter","x":"Luigi keeps the toppings he uses most in small jars on the counter, and everything else in the big freezer in the basement. Grabbing a jar takes a second; a trip downstairs takes a minute. The counter only fits five jars, so when he needs a sixth, he takes back the jar he hasn't touched for the longest time. Fresh basil only lasts a day, so each morning he throws out yesterday's and fetches new. One busy evening the olive jar runs empty, and all four cooks run down to the basement at once. Ben suggests that next time only one cook goes, and the others wait for him.","map":[["Jars on the counter, the freezer in the basement","A small, fast cache in front of a big, slow database"],["Grabbing a jar or a trip downstairs","A cache hit or a cache miss"],["Taking back the jar untouched for the longest","LRU eviction: when full, drop the least recently used entry"],["Basil that only lasts a day","A time to live (TTL): entries expire and are fetched again"],["All four cooks running downstairs at once","A cache stampede when a popular entry expires; one fetch with the others waiting fixes it"]],"brk":"Luigi can see when the basil has gone bad, but a cache can't tell that its copy is stale: it serves the old value until the TTL runs out or someone invalidates it. Choosing a TTL is choosing how stale you can afford to be."},"keys":["**Why cache**: keep a copy of data that's read often in something faster (memory, or a server closer to the user). Each hit skips the slow path, so the database does less work and users wait less. Caching pays when reads repeat and a slightly old answer is acceptable.","**Hit ratio and effective latency**: hit ratio = hits ÷ lookups. Average read time = cache time + (1 − hit ratio) × database time, since every read checks the cache and the misses also go to the database. Database load = (1 − hit ratio) × reads, so going from 90% to 95% halves it.","**Cache-aside (lazy loading)**: the app checks the cache and, on a miss, reads the database and stores the result. Only data that's asked for gets cached, and a cache failure just means slower reads. The first read of each item is always a miss.","**Writes: invalidate, write-through, write-back**: with cache-aside, a write goes to the database and then deletes the cached copy, so the next read fetches fresh data. Write-through updates the cache and the database together (fresh reads, slower writes). Write-back writes to the cache now and the database later (fast writes, but they're lost if the cache fails first).","**TTL**: every entry expires after a time to live, which bounds how stale it can get and clears out entries nobody reads. Short TTLs mean fresher data but more misses; long TTLs mean more hits but older data. Choose per kind of data: seconds for stock levels, hours for a product description.","**Eviction**: a full cache must drop something. LRU (least recently used) drops the entry untouched for the longest and suits most workloads; LFU (least frequently used) keeps long-term favourites; FIFO and random are simpler. LRU takes O(1) time per operation with a hash map and a doubly linked list.","**Stampedes and hot keys**: when a popular entry expires, many requests miss at once and all hit the database (a cache stampede). Fixes: let one request refresh the entry while the others wait or get the old value, add a little random jitter to TTLs so entries don't expire together, and refresh hot entries before they expire.","**Where caches live**: in the browser, at a CDN (module 6), in each app server's memory (fastest, but every server has its own copy), or in a shared cache such as Redis or Memcached (one copy for all servers, one network hop away). Large systems use several layers."],"dia":[{"type":"seq","cap":"A cache-aside read: miss, load, then hit","actors":["App","Cache","Database"],"msgs":[["App","Cache","GET product:42"],["Cache","App","miss",true],["App","Database","SELECT ... WHERE id = 42"],["Database","App","the row",true],["App","Cache","SET product:42, expires in 60 s"],["App","Cache","GET product:42 (the next request)"],["Cache","App","hit",true]],"note":"Only the first read pays for the database. Every later read within the TTL is a hit, until the entry expires or a write deletes it."},{"type":"cells","cap":"LRU with room for 3, accessing A B C A B D A (least recent on the left)","idx":false,"rows":[{"label":"A · miss","vals":["A"],"hl":[0]},{"label":"B · miss","vals":["A","B"],"hl":[1]},{"label":"C · miss","vals":["A","B","C"],"hl":[2]},{"label":"A · hit","vals":["B","C","A"],"ok":[2]},{"label":"B · hit","vals":["C","A","B"],"ok":[2]},{"label":"D · miss","vals":["A","B","D"],"hl":[2]},{"label":"A · hit","vals":["B","D","A"],"ok":[2]}],"note":"A hit moves the key to the most recent end. When D arrives the cache is full, so C, untouched for the longest, is evicted: 4 misses and 3 hits."},{"type":"layers","cap":"Where caches live, from nearest the user (rules of thumb)","rows":[["Browser cache","no request at all"],["CDN edge","tens of milliseconds: a server near the user (module 6)"],["App server memory","well under a millisecond, but one copy per server"],["Shared cache (Redis, Memcached)","about half a millisecond to a millisecond: one hop inside the data centre"],["Database","milliseconds or more, and the hardest part to scale"]],"note":"Each layer catches what it can and passes the rest down. The further down a read goes, the more it costs."}],"cmp":[{"cap":"What happens on a write","head":["","Cache-aside + invalidate","Write-through","Write-back"],"rows":[["On a write","Write the database, then delete the cached copy","Write the cache and the database together","Write the cache now, the database later"],["The next read","Misses and loads the new value","Fresh straight away","Fresh, from the cache"],["If the cache fails","Reads get slower; nothing is lost","Reads get slower; nothing is lost","Writes not yet flushed are lost"],["Good for","Most read-heavy apps","Data that's read soon after it's written","Very write-heavy data where losing a little is acceptable"]]},{"cap":"Eviction policies","head":["Policy","Evicts","Good at","Weak at"],"rows":[["LRU","The least recently used entry","Most workloads, where recent means likely again","One big scan can flush every hot entry"],["LFU","The least frequently used entry","Stable favourites","Slow to adapt when popularity shifts"],["FIFO","The oldest inserted entry","Simple and cheap","Evicts hot entries just because they're old"],["TTL only","Whatever has expired","Bounding staleness","Doesn't limit memory on its own"]]}],"code":[{"t":"A fake clock, a database that counts its reads, and the seeded random generator","tabs":[{"lang":"python","src":"class Clock:                                    # a fake clock, so the examples are exact and instant\n    def __init__(self):\n        self.now = 0\n    def advance(self, seconds):\n        self.now += seconds\n\nclass SlowDatabase:                             # stands in for the real store; counts every read\n    def __init__(self, rows):\n        self.rows, self.reads = dict(rows), 0\n    def get(self, key):\n        self.reads += 1\n        return self.rows.get(key)\n\ndef mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"class Clock {                                   // a fake clock, so the examples are exact and instant\n  constructor() { this.now = 0; }\n  advance(seconds) { this.now += seconds; }\n}\n\nclass SlowDatabase {                            // stands in for the real store; counts every read\n  constructor(rows) { this.rows = new Map(Object.entries(rows)); this.reads = 0; }\n  get(key) { this.reads++; return this.rows.has(key) ? this.rows.get(key) : null; }\n}\n\nfunction mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Hit ratio decides latency and database load","tabs":[{"lang":"python","src":"def avg_read_ms(hit_pct, cache_ms=1, db_ms=10):\n    return cache_ms + (100 - hit_pct) * db_ms / 100   # every read checks the cache; misses also pay the database\n\nfor pct in (0, 50, 80, 90, 95, 99):\n    print(f\"hit {pct}%: {avg_read_ms(pct):.2f} ms on average, {5_000 * (100 - pct) // 100} database reads/s\")\n","out":"hit 0%: 11.00 ms on average, 5000 database reads/s\nhit 50%: 6.00 ms on average, 2500 database reads/s\nhit 80%: 3.00 ms on average, 1000 database reads/s\nhit 90%: 2.00 ms on average, 500 database reads/s\nhit 95%: 1.50 ms on average, 250 database reads/s\nhit 99%: 1.10 ms on average, 50 database reads/s\n","notes":[[2,"A miss costs more than no cache at all (11 ms against 10): the cache only pays when the hit ratio is decent."],[5,"Every five points of hit ratio near the top halve or more the database's reads: 500 at 90%, 250 at 95%, 50 at 99%."]]},{"lang":"javascript","src":"const avgReadMs = (hitPct, cacheMs = 1, dbMs = 10) => cacheMs + ((100 - hitPct) * dbMs) / 100;   // every read checks the cache; misses also pay the database\n\nfor (const pct of [0, 50, 80, 90, 95, 99]) {\n  console.log(`hit ${pct}%: ${avgReadMs(pct).toFixed(2)} ms on average, ${Math.floor((5000 * (100 - pct)) / 100)} database reads/s`);\n}\n","out":"hit 0%: 11.00 ms on average, 5000 database reads/s\nhit 50%: 6.00 ms on average, 2500 database reads/s\nhit 80%: 3.00 ms on average, 1000 database reads/s\nhit 90%: 2.00 ms on average, 500 database reads/s\nhit 95%: 1.50 ms on average, 250 database reads/s\nhit 99%: 1.10 ms on average, 50 database reads/s\n","notes":[[1,"A miss costs more than no cache at all (11 ms against 10): the cache only pays when the hit ratio is decent."],[4,"Every five points of hit ratio near the top halve or more the database's reads: 500 at 90%, 250 at 95%, 50 at 99%."]]}]},{"t":"Cache-aside with a TTL, and the stale read a missing invalidation causes","tabs":[{"lang":"python","src":"class CacheAside:\n    def __init__(self, db, clock, ttl):\n        self.db, self.clock, self.ttl = db, clock, ttl\n        self.entries = {}                     # key -> (value, expires_at)\n        self.hits = self.misses = 0\n\n    def get(self, key):\n        hit = self.entries.get(key)\n        if hit and hit[1] > self.clock.now:   # present and not expired\n            self.hits += 1\n            return hit[0]\n        self.misses += 1\n        value = self.db.get(key)              # miss: read the database\n        self.entries[key] = (value, self.clock.now + self.ttl)\n        return value\n\n    def invalidate(self, key):                # call after writing the database\n        self.entries.pop(key, None)\n\nclock = Clock()\ndb = SlowDatabase({\"menu\": \"v1\", \"price\": 9})\ncache = CacheAside(db, clock, ttl=60)\nfor _ in range(3):\n    cache.get(\"menu\")                         # one miss, then two hits\nclock.advance(61)\ncache.get(\"menu\")                             # expired: a miss again\nprint(\"hits\", cache.hits, \"misses\", cache.misses, \"database reads\", db.reads)\n\nbefore = cache.get(\"price\")\ndb.rows[\"price\"] = 10                         # someone updates the database...\nstale = cache.get(\"price\")                    # ...but the cache still holds the old copy\ncache.invalidate(\"price\")\nprint(\"price:\", before, stale, cache.get(\"price\"))\n","out":"hits 2 misses 2 database reads 2\nprice: 9 9 10\n","notes":[[9,"An entry counts only while its expiry time is still in the future."],[13,"Cache-aside: on a miss the app itself reads the database and stores the result with a fresh expiry."],[27,"Four reads of the menu cost two database reads: the first, and one after the TTL ran out."],[33,"Without the invalidation the cache would have served the old price of 9 until the TTL ran out."]]},{"lang":"javascript","src":"class CacheAside {\n  constructor(db, clock, ttl) {\n    this.db = db; this.clock = clock; this.ttl = ttl;\n    this.entries = new Map();                 // key -> [value, expiresAt]\n    this.hits = 0; this.misses = 0;\n  }\n  get(key) {\n    const hit = this.entries.get(key);\n    if (hit && hit[1] > this.clock.now) {     // present and not expired\n      this.hits++;\n      return hit[0];\n    }\n    this.misses++;\n    const value = this.db.get(key);           // miss: read the database\n    this.entries.set(key, [value, this.clock.now + this.ttl]);\n    return value;\n  }\n  invalidate(key) { this.entries.delete(key); }   // call after writing the database\n}\n\nconst clock = new Clock();\nconst db = new SlowDatabase({ menu: \"v1\", price: 9 });\nconst cache = new CacheAside(db, clock, 60);\nfor (let i = 0; i < 3; i++) cache.get(\"menu\");   // one miss, then two hits\nclock.advance(61);\ncache.get(\"menu\");                            // expired: a miss again\nconsole.log(\"hits\", cache.hits, \"misses\", cache.misses, \"database reads\", db.reads);\n\nconst before = cache.get(\"price\");\ndb.rows.set(\"price\", 10);                     // someone updates the database...\nconst stale = cache.get(\"price\");             // ...but the cache still holds the old copy\ncache.invalidate(\"price\");\nconsole.log(\"price:\", before, stale, cache.get(\"price\"));\n","out":"hits 2 misses 2 database reads 2\nprice: 9 9 10\n","notes":[[9,"An entry counts only while its expiry time is still in the future."],[14,"Cache-aside: on a miss the app itself reads the database and stores the result with a fresh expiry."],[27,"Four reads of the menu cost two database reads: the first, and one after the TTL ran out."],[33,"Without the invalidation the cache would have served the old price of 9 until the TTL ran out."]]}]},{"t":"LRU against FIFO on skewed traffic, and diminishing returns","tabs":[{"lang":"python","src":"from collections import OrderedDict\n\ndef hit_ratio(requests, capacity, policy):\n    cache, hits = OrderedDict(), 0\n    for key in requests:\n        if key in cache:\n            hits += 1\n            if policy == \"lru\":\n                cache.move_to_end(key)        # used just now: the most recent end\n        else:\n            cache[key] = True\n            if len(cache) > capacity:\n                cache.popitem(last=False)     # evict the oldest: least recently used (LRU) or first in (FIFO)\n    return hits * 100 // len(requests)\n\nrand = mulberry32(11)\nrequests = []\nfor _ in range(20_000):                       # 80% of requests go to 200 hot keys, the rest to 800 others\n    hot = rand() < 0.8\n    requests.append(int(rand() * 200) if hot else 200 + int(rand() * 800))\nfor capacity in (50, 100, 200, 400, 800):\n    print(f\"{capacity} entries: LRU {hit_ratio(requests, capacity, 'lru')}%, FIFO {hit_ratio(requests, capacity, 'fifo')}%\")\n","out":"50 entries: LRU 15%, FIFO 15%\n100 entries: LRU 30%, FIFO 29%\n200 entries: LRU 57%, FIFO 51%\n400 entries: LRU 82%, FIFO 73%\n800 entries: LRU 92%, FIFO 91%\n","notes":[[9,"The only difference between the two policies: LRU moves a key to the recent end on every hit."],[13,"Both evict from the old end; for LRU that's the least recently used key, for FIFO simply the oldest arrival."],[21,"Up to the 200 hot keys the hit ratio grows in step with the size; past them each doubling buys less (400 to 800 adds 10 points). LRU's lead over FIFO is biggest around the size of the hot set."]]},{"lang":"javascript","src":"function hitRatio(requests, capacity, policy) {\n  const cache = new Map();\n  let hits = 0;\n  for (const key of requests) {\n    if (cache.has(key)) {\n      hits++;\n      if (policy === \"lru\") { cache.delete(key); cache.set(key, true); }   // used just now: the most recent end\n    } else {\n      cache.set(key, true);\n      if (cache.size > capacity) cache.delete(cache.keys().next().value);  // evict the oldest: least recently used (LRU) or first in (FIFO)\n    }\n  }\n  return Math.floor((hits * 100) / requests.length);\n}\n\nconst rand = mulberry32(11);\nconst requests = [];\nfor (let i = 0; i < 20000; i++) {             // 80% of requests go to 200 hot keys, the rest to 800 others\n  const hot = rand() < 0.8;\n  requests.push(hot ? Math.floor(rand() * 200) : 200 + Math.floor(rand() * 800));\n}\nfor (const capacity of [50, 100, 200, 400, 800]) {\n  console.log(`${capacity} entries: LRU ${hitRatio(requests, capacity, \"lru\")}%, FIFO ${hitRatio(requests, capacity, \"fifo\")}%`);\n}\n","out":"50 entries: LRU 15%, FIFO 15%\n100 entries: LRU 30%, FIFO 29%\n200 entries: LRU 57%, FIFO 51%\n400 entries: LRU 82%, FIFO 73%\n800 entries: LRU 92%, FIFO 91%\n","notes":[[7,"The only difference between the two policies: LRU moves a key to the recent end on every hit."],[10,"Both evict from the old end; for LRU that's the least recently used key, for FIFO simply the oldest arrival."],[22,"Up to the 200 hot keys the hit ratio grows in step with the size; past them each doubling buys less (400 to 800 adds 10 points). LRU's lead over FIFO is biggest around the size of the hot set."]]}]}],"ex":{"q":"(LeetCode 1797, Design Authentication Manager) Tokens expire `time_to_live` seconds after they're generated or renewed. `generate(token, now)` creates one, `renew(token, now)` extends only an unexpired token, and `count_unexpired_tokens(now)` counts the live ones. A token that expires at time t is gone before anything else happens at t, and times only increase. Run: TTL 5; renew aaa at 1; generate aaa at 2; count at 6; generate bbb at 7; renew aaa at 8; renew bbb at 10; count at 15.","steps":["Store each token's expiry time; a token is alive while its expiry is later than now, so one expiring at 7 is already gone at 7.","renew acts only on a live token: drop the expired ones first, then set now + TTL if the token is still there.","Counting by scanning every token costs O(n). But the TTL is fixed and time only moves forward, so tokens expire in the order their expiry times were set: a queue of (expiry, token) is already sorted, and expired tokens are always at its front.","A renewal leaves its old queue entry behind, so skip entries whose time no longer matches the token's current expiry (lazy deletion). Each entry leaves the queue once, so every call is O(1) amortised, with O(calls) memory for the queue (a real cache trims it)."],"code":{"t":"An expiry queue with lazy deletion","tabs":[{"lang":"python","src":"class AuthenticationManager:\n    def __init__(self, time_to_live):\n        self.ttl = time_to_live\n        self.expiry = {}                      # token -> when it expires\n        self.queue, self.head = [], 0         # (expires_at, token) in expiry order, since the TTL is fixed\n\n    def _expire(self, now):\n        while self.head < len(self.queue) and self.queue[self.head][0] <= now:\n            at, token = self.queue[self.head]\n            if self.expiry.get(token) == at:  # skip entries a renewal has replaced\n                del self.expiry[token]\n            self.head += 1\n\n    def generate(self, token_id, now):\n        self._expire(now)\n        self.expiry[token_id] = now + self.ttl\n        self.queue.append((now + self.ttl, token_id))\n\n    def renew(self, token_id, now):\n        self._expire(now)\n        if token_id in self.expiry:           # unexpired tokens only\n            self.expiry[token_id] = now + self.ttl\n            self.queue.append((now + self.ttl, token_id))\n\n    def count_unexpired_tokens(self, now):\n        self._expire(now)\n        return len(self.expiry)\n\nauth = AuthenticationManager(5)\nauth.renew(\"aaa\", 1)                          # no such token yet: ignored\nauth.generate(\"aaa\", 2)                       # expires at 7\nfirst = auth.count_unexpired_tokens(6)\nauth.generate(\"bbb\", 7)                       # aaa expires at 7, before anything else at 7\nauth.renew(\"aaa\", 8)                          # already expired: ignored\nauth.renew(\"bbb\", 10)                         # now expires at 15\nprint(first, auth.count_unexpired_tokens(15))\n","out":"1 0"},{"lang":"javascript","src":"class AuthenticationManager {\n  constructor(timeToLive) {\n    this.ttl = timeToLive;\n    this.expiry = new Map();                  // token -> when it expires\n    this.queue = []; this.head = 0;           // [expiresAt, token] in expiry order, since the TTL is fixed\n  }\n  expire(now) {\n    while (this.head < this.queue.length && this.queue[this.head][0] <= now) {\n      const [at, token] = this.queue[this.head];\n      if (this.expiry.get(token) === at) this.expiry.delete(token);   // skip entries a renewal has replaced\n      this.head++;\n    }\n  }\n  generate(tokenId, now) {\n    this.expire(now);\n    this.expiry.set(tokenId, now + this.ttl);\n    this.queue.push([now + this.ttl, tokenId]);\n  }\n  renew(tokenId, now) {\n    this.expire(now);\n    if (this.expiry.has(tokenId)) {           // unexpired tokens only\n      this.expiry.set(tokenId, now + this.ttl);\n      this.queue.push([now + this.ttl, tokenId]);\n    }\n  }\n  countUnexpiredTokens(now) {\n    this.expire(now);\n    return this.expiry.size;\n  }\n}\n\nconst auth = new AuthenticationManager(5);\nauth.renew(\"aaa\", 1);                         // no such token yet: ignored\nauth.generate(\"aaa\", 2);                      // expires at 7\nconst first = auth.countUnexpiredTokens(6);\nauth.generate(\"bbb\", 7);                      // aaa expires at 7, before anything else at 7\nauth.renew(\"aaa\", 8);                         // already expired: ignored\nauth.renew(\"bbb\", 10);                        // now expires at 15\nconsole.log(first, auth.countUnexpiredTokens(15));\n","out":"1 0"}]},"a":"It prints 1 0. At time 6 only aaa is alive (it expires at 7). aaa expires at 7, so renewing it at 8 does nothing; bbb, renewed at 10, expires at 15, so it's already gone when the count runs at 15."},"fade":{"q":"(LeetCode 146, LRU Cache) Finish `get` and `put` so that both run in O(1): `get(key)` returns the value or −1, `put(key, value)` inserts or updates, and when the cache goes over capacity, the least recently used key is evicted. The hash map and the doubly linked list with two sentinels are given.","steps":["The map finds a key's node in O(1); the list keeps the order of use, with the most recent just after `head` and the least recent just before `tail`.",{"ask":"What does get do besides returning the value?","a":"It moves the node to the front, because the key was just used. A missing key returns −1 and changes nothing."},{"ask":"What does put do, and when does it evict?","a":"It removes any old node for the key,   put(key, value) {\n    // TODO: replace any old node, push to the front, evict tail.prev if over capacity\n  }\n}\n"}]},"solution":{"t":"Solution: a hash map for lookup, a linked list for order","tabs":[{"lang":"python","src":"class Node:\n    def __init__(self, key=None, value=None):\n        self.key, self.value, self.prev, self.next = key, value, None, None\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.capacity, self.map = capacity, {}\n        self.head, self.tail = Node(), Node() # sentinels: head.next is the most recent, tail.prev the least\n        self.head.next, self.tail.prev = self.tail, self.head\n\n    def _unlink(self, node):\n        node.prev.next, node.next.prev = node.next, node.prev\n\n    def _push_front(self, node):\n        node.prev, node.next = self.head, self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        node = self.map.get(key)\n        if node is None:\n            return -1\n        self._unlink(node)\n        self._push_front(node)                # used just now: the most recent\n        return node.value\n\n    def put(self, key, value):\n        if key in self.map:\n            self._unlink(self.map[key])\n        node = Node(key, value)\n        self.map[key] = node\n        self._push_front(node)\n        if len(self.map) > self.capacity:\n            lru = self.tail.prev              # the least recently used\n            self._unlink(lru)\n            del self.map[lru.key]\n\ncache = LRUCache(2)\ncache.put(1, 1)\ncache.put(2, 2)\na = cache.get(1)                              # 1 is now the most recent\ncache.put(3, 3)                               # evicts 2\nb = cache.get(2)\ncache.put(4, 4)                               # evicts 1\nprint(a, b, cache.get(1), cache.get(3), cache.get(4))\n","out":"1 -1 -1 3 4"},{"lang":"javascript","src":"class LRUCache {\n  constructor(capacity) {\n    this.capacity = capacity; this.map = new Map();\n    this.head = { next: null }; this.tail = { prev: null };   // sentinels: head.next is the most recent, tail.prev the least\n    this.head.next = this.tail; this.tail.prev = this.head;\n  }\n  unlink(node) { node.prev.next = node.next; node.next.prev = node.prev; }\n  pushFront(node) {\n    node.prev = this.head; node.next = this.head.next;\n    this.head.next.prev = node;\n    this.head.next = node;\n  }\n  get(key) {\n    const node = this.map.get(key);\n    if (node === undefined) return -1;\n    this.unlink(node);\n    this.pushFront(node);                     // used just now: the most recent\n    return node.value;\n  }\n  put(key, value) {\n    if (this.map.has(key)) this.unlink(this.map.get(key));\n    const node = { key, value, prev: null, next: null };\n    this.map.set(key, node);\n    this.pushFront(node);\n    if (this.map.size > this.capacity) {\n      const lru = this.tail.prev;             // the least recently used\n      this.unlink(lru);\n      this.map.delete(lru.key);\n    }\n  }\n}\n\nconst cache = new LRUCache(2);\ncache.put(1, 1);\ncache.put(2, 2);\nconst a = cache.get(1);                       // 1 is now the most recent\ncache.put(3, 3);                              // evicts 2\nconst b = cache.get(2);\ncache.put(4, 4);                              // evicts 1\nconsole.log(a, b, cache.get(1), cache.get(3), cache.get(4));\n","out":"1 -1 -1 3 4"}]}},"traps":[["“A cache makes every read faster.”","Only hits are faster; a miss pays for the cache check and then the database. With a low hit ratio a cache adds latency and cost, so measure the hit ratio before celebrating."],["“A bigger cache is always worth it.”","Returns shrink: on skewed traffic the first entries catch most of the hits, and each doubling adds less. Size the cache to the hot set, then weigh any further gain against the memory it costs."],["“Update the cache first, then the database.”","If the database write then fails, the cache holds a value that was never saved, and two racing writers can leave the older value cached. The usual order is: write the database, then delete the cached copy, so the next read loads the new value."],["“TTLs keep the cache consistent.”","A TTL only bounds staleness: until it runs out, readers can see an old value. If stale data is unacceptable (a balance, stock at checkout), invalidate on every write or don't cache it."],["“LRU is always the best eviction policy.”","It suits most workloads, but one big scan, such as a nightly report that reads every row once, can flush every hot entry. LFU or scan-resistant policies keep long-term favourites."],["“A cache stampede is the database's fault.”","The cache causes it: many requests miss the same popular key at the same moment. Let one request refresh it while the others wait or use the old value, and add jitter to TTLs so keys don't expire together."]],"disc":[["Should each app server cache in its own memory, or should they share Redis?","A local cache is fastest (no network hop) and there's no extra system to run, but every server holds its own copy: more memory in total, a lower hit ratio per server, and copies that go stale at different times after a write. A shared cache gives one copy and one hit ratio, at the cost of a network round trip (about half a millisecond inside a data centre) and a system that must scale and stay up. Many systems use both: a tiny local cache with a short TTL for the hottest keys, in front of a shared one."],["How do you stop a cache serving stale data after a write?","Write the database first, then delete (rather than update) the cached key, so the next read loads the fresh value, and keep a TTL as a safety net in case a delete is lost. For data that must never be stale, read it from the database, or use write-through so the cache changes in the same step as the database. Even then, with several copies a short window of staleness is usually possible, so decide which data can live with it."]],"teach":{"prompt":"Explain to a junior colleague how cache-aside works, and how you'd choose the TTL and the eviction policy.","rubric":["Check the cache; on a miss read the database and store the result","The hit ratio drives both latency and database load","On a write, update the database and delete the cached copy","The TTL bounds staleness and is chosen per kind of data","LRU eviction when full, and protection against stampedes on hot keys"],"model":"With cache-aside the app asks the cache first; on a hit it's done, and on a miss it reads the database and stores the result in the cache for next time. The hit ratio decides everything: every read pays for the cache check, and only the misses reach the database, so going from 90% to 95% halves the database's reads. Writes go to the database first, and then the cached copy is deleted, so the next read loads the new value. The TTL is a promise about staleness: seconds for things like stock levels, hours for things that rarely change, and it also clears out entries nobody reads. When the cache is full, LRU drops whatever hasn't been used for the longest, which suits most traffic. And for very popular keys I'd make sure only one request rebuilds an expired entry, and add jitter to TTLs so they don't all expire together."},"qa":[["What is a cache hit ratio?","Hits ÷ lookups: the share of reads the cache answers."],["Average read time with a cache?","Cache time + (1 − hit ratio) × database time: every read checks the cache, and misses also go to the database."],["What is cache-aside?","The app checks the cache and, on a miss, reads the database and stores the result in the cache."],["What does a TTL do?","It expires an entry after a set time, which bounds how stale it can get."],["How does LRU eviction work?","When the cache is full, it drops the entry that hasn't been used for the longest."],["What is a cache stampede?","Many requests missing the same popular key at once, and all of them hitting the database."]],"quiz":[{"q":"What does this print?","snip":{"t":"Average read time and database load","tabs":[{"lang":"python","src":"reads, hit_pct, cache_ms, db_ms = 2_000, 95, 1, 20\nprint(f\"{cache_ms + (100 - hit_pct) * db_ms / 100:.1f}\", reads * (100 - hit_pct) // 100)\n"},{"lang":"javascript","src":"const reads = 2000, hitPct = 95, cacheMs = 1, dbMs = 20;\nconsole.log((cacheMs + ((100 - hitPct) * dbMs) / 100).toFixed(1), Math.floor((reads * (100 - hitPct)) / 100));\n"}]},"o":["2.0 100","1.0 100","2.0 1900","20.0 100"],"a":0,"e":"Every read pays 1 ms for the cache, and the 5% that miss also pay 20 ms: 1 + 0.05 × 20 = 2.0 ms. 5% of 2,000 reads is 100 a second reaching the database."},{"q":"What does this print?","snip":{"t":"LRU with room for 3","tabs":[{"lang":"python","src":"from collections import OrderedDict\ncache = OrderedDict()\nfor key in \"ABCBADB\":\n    if key in cache:\n        cache.move_to_end(key)\n    else:\n        cache[key] = True\n        if len(cache) > 3:\n            cache.popitem(last=False)\nprint(*cache)\n"},{"lang":"javascript","src":"const cache = new Map();\nfor (const key of \"ABCBADB\") {\n  if (cache.has(key)) { cache.delete(key); cache.set(key, true); }\n  else {\n    cache.set(key, true);\n    if (cache.size > 3) cache.delete(cache.keys().next().value);\n  }\n}\nconsole.log(...cache.keys());\n"}]},"o":["A D B","B A D","D A B","C B A"],"a":0,"e":"After A B C the hits on B and A leave the order C, B, A. D doesn't fit, so C, the least recently used, goes: B, A, D. The final hit on B moves it to the end: A D B."},{"q":"A product page is read 50,000 times a second, and its price changes a few times a day. A page showing a price a few seconds old is fine, but nobody may be charged a stale price. What's the best caching plan?","o":["Cache product pages with a short TTL and delete the entry when the price changes, but read the price from the database at checkout","Cache nothing, because prices change","Cache everything for 24 hours to get the best hit ratio","Cache only the checkout, where correctness matters most"],"a":0,"e":"The pages can be slightly stale, so cache them, with invalidation to keep the window short. The checkout must be exact, so it reads the source of truth. Caching nothing wastes 50,000 reads a second, a 24-hour TTL shows wrong prices for hours, and the checkout is exactly where a stale copy does harm."},{"q":"Which help against a cache stampede on a popular key? (choose 2)","t":"ms","o":["Let one request rebuild the entry while the others wait for it or use the old value","Add a little random jitter to TTLs so many keys don't expire at the same moment","Lower the popular key's TTL to one second","Clear the whole cache whenever the key expires","Send every miss to the database twice, to be safe"],"a":[0,1],"e":"One rebuild instead of thousands, and expiries spread out in time, stop the database being hit all at once. A one-second TTL makes the key expire, and stampede, far more often; clearing the whole cache turns one miss into millions; and doubling the misses doubles the load."},{"q":"Judge each statement.","t":"yn","s":[["With cache-aside, the first read of each key is a miss.",true],["Raising the hit ratio from 90% to 95% halves the reads that reach the database.",true],["A TTL guarantees that readers never see stale data.",false],["Write-back caching can lose recent writes if the cache fails before they reach the database.",true]],"e":"Cache-aside only stores what has been read. The misses fall from 10% to 5% of reads. A TTL only limits how long stale data can live. And write-back holds writes in the cache until it flushes them."},{"q":"Put the steps of changing a price with cache-aside in order.","t":"ord","items":["Check that the new price is valid","Write the new price to the database","Delete the product's entry from the cache","The next read misses and loads the new price into the cache"],"e":"Only a valid price is written; the cache entry is deleted after the database write, so a read in between can't reload the old value for good; and the next read can only load the new price once the old entry is gone."},{"q":"Complete the JavaScript LRU access function (a Map keeps keys in insertion order, oldest first).","t":"drop","lang":"javascript","code":"function lruAccess(cache, key, capacity) {\n  if (cache.has(key)) {\n    {{0}};\n    return \"hit\";\n  }\n  cache.set(key, true);\n  if (cache.size > capacity) cache.delete({{1}});\n  return \"miss\";\n}\n","blanks":[{"o":["cache.delete(key); cache.set(key, true)","cache.set(key, true)","cache.delete(key)","cache.clear()"],"a":0},{"o":["cache.keys().next().value","[...cache.keys()].at(-1)","key","[...cache.keys()][1]"],"a":0}],"e":"Setting an existing key doesn't move it in a Map, so a hit must delete and re-insert the key to make it the most recent. The least recently used key is then the first one in insertion order."},{"q":"Match each description to its name.","t":"match","pairs":[["Write the database, then delete the cached copy","Cache-aside invalidation"],["Update the cache and the database in the same step","Write-through"],["Write to the cache now and to the database later","Write-back"],["Drop the entry unused for the longest","LRU eviction"]],"extra":["TTL"],"e":"A TTL expires entries by age: it's neither a way to handle writes nor a rule for choosing what to drop from a full cache."}],"probs":[["LC 146 · LRU Cache","https://leetcode.com/problems/lru-cache/","Medium","the module's faded example: a hash map plus a doubly linked list, with sentinels at both ends"],["LC 1797 · Design Authentication Manager","https://leetcode.com/problems/design-authentication-manager/","Medium","the worked example: with a fixed TTL, expiry order is insertion order"],["LC 460 · LFU Cache","https://leetcode.com/problems/lfu-cache/","Hard","LFU Cache: one LRU list per use count, plus the current minimum count"],["Exercise · Choose eviction policies in Redis","https://redis.io/docs/latest/develop/reference/eviction/","","list the eviction policies, then pick one for a session store and one for a page cache, and say why"],["Reading · Leases against stampedes at scale","https://www.usenix.org/conference/nsdi13/technical-sessions/presentation/nishtala","","read how Facebook's memcache used leases to stop thundering herds and stale sets"]],"src":[["Redis: Key eviction","https://redis.io/docs/latest/develop/reference/eviction/"],["Scaling Memcache at Facebook (NSDI 2013)","https://www.usenix.org/conference/nsdi13/technical-sessions/presentation/nishtala"],["AWS whitepaper: Database caching strategies using Redis","https://docs.aws.amazon.com/whitepapers/latest/database-caching-strategies-using-redis/welcome.html"],["Python docs: functools.lru_cache","https://docs.python.org/3/library/functools.html#functools.lru_cache"]]},{"id":"m06","d":"d1","t":"CDNs and proxies: caching at the edge","min":90,"hook":"On a busy site most requests never reach the origin servers: a CDN answers them from copies held near the user. And between users and servers sit proxies that route, secure and cache traffic. Knowing what an edge may cache, for how long, and how it checks that a copy is still current cuts both the user's wait and the origin's load.","pre":{"q":"Your site serves a 200 KB image to users worldwide from one server in Frankfurt, and a user in Sydney waits about 300 ms for every round trip. What would a CDN change, and how would the CDN know when its copy is out of date?","a":"The CDN keeps a copy on an edge server near Sydney, so after the first request the image comes from a few milliseconds away, and Frankfurt sees only the occasional miss. The response's Cache-Control header says how long the copy is fresh; after that the edge revalidates it with the origin using its ETag, and gets a tiny 304 Not Modified if nothing has changed."},"kid":{"t":"Luigi's kiosks","x":"Luigi's is so popular that he opens little kiosks all over town, each with a fridge of ready slices. Tara now buys her slice at the kiosk round the corner instead of crossing town. Every tray has a card saying “sell until 6 pm, then check”. At 6 pm the kiosk phones Luigi: “Is the margherita still recipe number 7?” If it is, Luigi just says “Same as before!”, and the kiosk keeps selling without a new delivery. At the shop itself, Ben answers every call and passes it on: pizza orders to the pizza kitchen, dessert orders to the dessert kitchen. Callers never need the kitchens' own numbers.","map":[["Kiosks all over town with ready slices","CDN edge servers near users, holding cached copies"],["Buying round the corner instead of crossing town","Shorter round trips, and less load on the origin server"],["“Sell until 6 pm, then check”","Cache-Control: max-age, how long a copy stays fresh"],["“Still recipe number 7?” — “Same as before!”","Revalidation with an ETag, answered by 304 Not Modified"],["Ben passing each call to the right kitchen","A reverse proxy routing requests by path to backend services"]],"brk":"A real slice goes stale on its own; a cached file never changes by itself. It only becomes out of date when the origin publishes a new version, which is why the check is “still recipe 7?” and not “has it gone off?”."},"keys":["**What a CDN does**: a content delivery network runs edge servers in many cities. Users are sent to a nearby edge (by DNS or anycast routing), which answers from cached copies of the origin's responses. Users get shorter round trips, the origin gets far fewer requests, and the CDN's spare capacity soaks up spikes and some attacks.","**What a CDN can cache**: static files (images, scripts, styles, video segments) are the easy win. Whole pages and API responses can be cached too if they're the same for everyone, or vary only by a few headers. Personal or fast-changing responses usually go through to the origin.","**Cache-Control**: the origin's response headers say what may be cached and for how long. max-age=N lets any cache reuse the response for N seconds; s-maxage=N overrides it for shared caches such as CDNs; private allows only the user's browser to store it; no-cache allows storing but requires a check with the origin before each reuse; no-store forbids storing it at all.","**Revalidation: ETag and 304**: when a cached copy goes stale, the cache asks the origin with If-None-Match and the ETag it holds (or If-Modified-Since and a date). If nothing changed, the origin answers 304 Not Modified with no body, and the copy is fresh again: one round trip, but almost no bytes.","**Versioned file names**: put a hash of a static file's contents in its name (app.3f9a1c.js) and cache it for a year. A new release refers to new names, so no user ever sees a stale mix of old and new files, and nothing needs purging. Short TTLs and purges are for content whose URL can't change.","**Offload**: the CDN's hit ratio is the share of requests answered at the edge. At 95% the origin sees a twentieth of the requests. Short TTLs, personal pages and a long tail of rarely requested files all lower it, and a bad Cache-Control header can send the whole load back to the origin.","**Forward and reverse proxies**: a forward proxy acts for clients going out, such as a company proxy that filters and logs. A reverse proxy acts for servers: clients talk to it as if it were the server, and it routes each request to a backend, terminates TLS, compresses, caches and limits rates. Load balancers, API gateways and CDN edges are all reverse proxies.","**Routing in a reverse proxy**: rules map host names and path prefixes to backend pools, and the longest matching prefix wins (/api/orders is more specific than /api). One public address can front many services, which can then be moved or split without clients noticing."],"dia":[{"type":"seq","cap":"A hit at the edge, then a revalidation once the copy is stale","actors":["Browser","CDN edge (Sydney)","Origin (Frankfurt)"],"msgs":[["Browser","CDN edge (Sydney)","GET /logo.png"],["CDN edge (Sydney)","Browser","200 from the edge's copy, a few ms away",true],["Browser","CDN edge (Sydney)","GET /logo.png (after max-age has run out)"],["CDN edge (Sydney)","Origin (Frankfurt)","GET /logo.png, If-None-Match: \"v1\""],["Origin (Frankfurt)","CDN edge (Sydney)","304 Not Modified, no body",true],["CDN edge (Sydney)","Browser","200 from the refreshed copy",true]],"note":"Most requests end at the edge. A stale copy costs one long round trip to the origin, but a 304 carries no body, so the image isn't sent again."},{"type":"tree","cap":"Can the edge answer by itself?","root":{"q":"Is a copy in the edge cache?","c":[["No","Fetch it from the origin, and store it if Cache-Control allows"],["Yes",{"q":"Is it still fresh (younger than s-maxage, or max-age)?","c":[["Yes","Serve it from the edge: a hit"],["No","Revalidate with If-None-Match: a 304 keeps the copy, a 200 replaces it"]]}]]}},{"type":"tiers","cap":"A reverse proxy in front of several services","tiers":[["Clients",["Browser","Phone app"]],["Reverse proxy",["TLS","Routing by path","Rate limits","Compression"],"https://shop.example.com"],["Services",["/ → web","/api → api","/api/orders → orders","/static → files"],"longest prefix wins"]],"note":"Clients see one address. Behind it, each path prefix goes to its own pool, so a service can move or split without any client changing."}],"cmp":[{"cap":"Cache-Control directives you'll use most","head":["Directive","Meaning","Typical use"],"rows":[["max-age=N","Any cache may reuse it for N seconds","Versioned files: a year (31536000)"],["s-maxage=N","Shared caches such as CDNs use N instead of max-age","Pages: a minute in browsers, ten at the CDN"],["private","Only the user's browser may store it","Account pages, baskets"],["no-cache","May be stored, but must be revalidated before each reuse","Pages that must always be current"],["no-store","Must not be stored anywhere","Bank statements, one-time codes"],["immutable","Won't change while fresh, so don't revalidate on reload","Files with a hash in their name"]]},{"cap":"Forward or reverse proxy","head":["","Forward proxy","Reverse proxy"],"rows":[["Acts for","Clients","Servers"],["Set up by","The client side: a company network or a browser setting","The owner of the service"],["Typical jobs","Filtering, logging and caching outgoing traffic","Routing, TLS, load balancing, caching, rate limits"],["Examples","A company web proxy","NGINX, Envoy, a cloud load balancer, a CDN edge"]]}],"code":[{"t":"Reading Cache-Control, as a shared cache such as a CDN would","tabs":[{"lang":"python","src":"def parse_cache_control(header):\n    \"\"\"'public, max-age=600, s-maxage=3600' -> {'public': True, 'max-age': 600, 's-maxage': 3600}\"\"\"\n    out = {}\n    for part in header.split(\",\"):\n        name, _, value = part.strip().partition(\"=\")\n        if name:\n            out[name.lower()] = int(value) if value.isdigit() else True\n    return out\n\ndef shared_cache_ttl(header):\n    \"\"\"Seconds a shared cache may reuse the response without asking the origin (0 = always ask, or never store).\"\"\"\n    cc = parse_cache_control(header)\n    if \"no-store\" in cc or \"private\" in cc or \"no-cache\" in cc:\n        return 0\n    return cc.get(\"s-maxage\", cc.get(\"max-age\", 0))   # s-maxage overrides max-age for shared caches\n"},{"lang":"javascript","src":"function parseCacheControl(header) {\n  // \"public, max-age=600, s-maxage=3600\" -> { public: true, \"max-age\": 600, \"s-maxage\": 3600 }\n  const out = {};\n  for (const part of header.split(\",\")) {\n    const [name, value = \"\"] = part.trim().split(\"=\", 2);\n    if (name) out[name.toLowerCase()] = /^\\d+$/.test(value) ? Number(value) : true;\n  }\n  return out;\n}\n\nfunction sharedCacheTtl(header) {\n  // seconds a shared cache may reuse the response without asking the origin (0 = always ask, or never store)\n  const cc = parseCacheControl(header);\n  if (\"no-store\" in cc || \"private\" in cc || \"no-cache\" in cc) return 0;\n  return cc[\"s-maxage\"] ?? cc[\"max-age\"] ?? 0;          // s-maxage overrides max-age for shared caches\n}\n"}]},{"t":"What a CDN may do with each response","tabs":[{"lang":"python","src":"headers = [\n    \"public, max-age=31536000, immutable\",    # app.3f9a1c.js: versioned, so cache it for a year\n    \"public, max-age=60, s-maxage=600\",       # a product page: browsers 1 minute, the CDN 10\n    \"private, max-age=300\",                   # the user's own basket: their browser only\n    \"no-store\",                               # a bank statement: never stored\n    \"no-cache\",                               # stored, but checked with the origin every time\n]\nfor h in headers:\n    print(f\"{shared_cache_ttl(h):>8} s  <-  {h}\")\n","out":"31536000 s  <-  public, max-age=31536000, immutable\n     600 s  <-  public, max-age=60, s-maxage=600\n       0 s  <-  private, max-age=300\n       0 s  <-  no-store\n       0 s  <-  no-cache\n","notes":[[2,"A file whose name changes with its contents can be cached for a year (31,536,000 seconds): a new version gets a new URL."],[3,"s-maxage gives the CDN its own, longer lifetime, while browsers check back after a minute."],[4,"private keeps a personal response out of shared caches; only this user's browser may store it."],[6,"no-cache doesn't mean “don't store”: it means “check with the origin before every reuse”. no-store is the one that forbids storing."]]},{"lang":"javascript","src":"const headers = [\n  \"public, max-age=31536000, immutable\",      // app.3f9a1c.js: versioned, so cache it for a year\n  \"public, max-age=60, s-maxage=600\",         // a product page: browsers 1 minute, the CDN 10\n  \"private, max-age=300\",                     // the user's own basket: their browser only\n  \"no-store\",                                 // a bank statement: never stored\n  \"no-cache\",                                 // stored, but checked with the origin every time\n];\nfor (const h of headers) console.log(`${String(sharedCacheTtl(h)).padStart(8)} s  <-  ${h}`);\n","out":"31536000 s  <-  public, max-age=31536000, immutable\n     600 s  <-  public, max-age=60, s-maxage=600\n       0 s  <-  private, max-age=300\n       0 s  <-  no-store\n       0 s  <-  no-cache\n","notes":[[2,"A file whose name changes with its contents can be cached for a year (31,536,000 seconds): a new version gets a new URL."],[3,"s-maxage gives the CDN its own, longer lifetime, while browsers check back after a minute."],[4,"private keeps a personal response out of shared caches; only this user's browser may store it."],[6,"no-cache doesn't mean “don't store”: it means “check with the origin before every reuse”. no-store is the one that forbids storing."]]}]},{"t":"An edge cache with revalidation, and the stale window after a change","tabs":[{"lang":"python","src":"class Edge:\n    \"\"\"A CDN edge: serves fresh copies, and revalidates stale ones with the origin.\"\"\"\n    def __init__(self, origin):\n        self.origin, self.store = origin, {}  # url -> (body, etag, fresh_until)\n        self.hits = self.revalidated = self.fetched = 0\n\n    def get(self, url, now):\n        copy = self.store.get(url)\n        if copy and now < copy[2]:\n            self.hits += 1                    # fresh: no trip to the origin\n            return copy[0]\n        status, body, etag, ttl = self.origin(url, copy[1] if copy else None)\n        if status == 304:\n            self.revalidated += 1             # unchanged: keep the body, renew the freshness\n            body = copy[0]\n        else:\n            self.fetched += 1                 # a full response\n        self.store[url] = (body, etag, now + ttl)\n        return body\n\nversions = {\"/logo.png\": 1}                   # the origin's current version of each file\n\ndef origin(url, if_none_match):               # answers like an HTTP server with ETags\n    etag = f'\"v{versions[url]}\"'\n    if if_none_match == etag:\n        return 304, None, etag, 60            # Not Modified: no body\n    return 200, f\"logo v{versions[url]}\", etag, 60\n\nedge, old_after_change = Edge(origin), 0\nfor now in range(600):                        # one request a second for ten minutes\n    if now == 330:\n        versions[\"/logo.png\"] = 2             # a new logo is published\n    if edge.get(\"/logo.png\", now) == \"logo v1\" and now >= 330:\n        old_after_change += 1\nprint(edge.hits, \"hits,\", edge.revalidated, \"revalidated (304),\", edge.fetched, \"full fetches (200)\")\nprint(\"requests served the old logo after the change:\", old_after_change)\n","out":"590 hits, 8 revalidated (304), 2 full fetches (200)\nrequests served the old logo after the change: 30\n","notes":[[9,"Fresh means younger than the TTL: the edge answers alone, and the origin never hears about it."],[12,"A stale copy is checked with the origin, sending the ETag it holds."],[14,"304: the copy is still right, so the edge keeps its body and only renews the freshness."],[36,"From 330 s until the copy's next check at 360 s the edge serves the old logo: a TTL is a promise about staleness."]]},{"lang":"javascript","src":"class Edge {\n  // a CDN edge: serves fresh copies, and revalidates stale ones with the origin\n  constructor(origin) {\n    this.origin = origin; this.store = new Map();   // url -> [body, etag, freshUntil]\n    this.hits = 0; this.revalidated = 0; this.fetched = 0;\n  }\n  get(url, now) {\n    const copy = this.store.get(url);\n    if (copy && now < copy[2]) { this.hits++; return copy[0]; }   // fresh: no trip to the origin\n    let [status, body, etag, ttl] = this.origin(url, copy ? copy[1] : null);\n    if (status === 304) {\n      this.revalidated++;                     // unchanged: keep the body, renew the freshness\n      body = copy[0];\n    } else this.fetched++;                    // a full response\n    this.store.set(url, [body, etag, now + ttl]);\n    return body;\n  }\n}\n\nconst versions = { \"/logo.png\": 1 };          // the origin's current version of each file\n\nfunction origin(url, ifNoneMatch) {           // answers like an HTTP server with ETags\n  const etag = `\"v${versions[url]}\"`;\n  if (ifNoneMatch === etag) return [304, null, etag, 60];   // Not Modified: no body\n  return [200, `logo v${versions[url]}`, etag, 60];\n}\n\nconst edge = new Edge(origin);\nlet oldAfterChange = 0;\nfor (let now = 0; now < 600; now++) {         // one request a second for ten minutes\n  if (now === 330) versions[\"/logo.png\"] = 2; // a new logo is published\n  if (edge.get(\"/logo.png\", now) === \"logo v1\" && now >= 330) oldAfterChange++;\n}\nconsole.log(edge.hits, \"hits,\", edge.revalidated, \"revalidated (304),\", edge.fetched, \"full fetches (200)\");\nconsole.log(\"requests served the old logo after the change:\", oldAfterChange);\n","out":"590 hits, 8 revalidated (304), 2 full fetches (200)\nrequests served the old logo after the change: 30\n","notes":[[9,"Fresh means younger than the TTL: the edge answers alone, and the origin never hears about it."],[10,"A stale copy is checked with the origin, sending the ETag it holds."],[12,"304: the copy is still right, so the edge keeps its body and only renews the freshness."],[35,"From 330 s until the copy's next check at 360 s the edge serves the old logo: a TTL is a promise about staleness."]]}]},{"t":"A reverse proxy's routing table: the longest prefix wins","tabs":[{"lang":"python","src":"ROUTES = {\"/\": \"web\", \"/api\": \"api\", \"/api/orders\": \"orders\", \"/static\": \"files\"}\n\ndef route(path):\n    best = \"\"\n    for prefix in ROUTES:\n        matches = path == prefix or path.startswith(prefix.rstrip(\"/\") + \"/\")   # whole path segments only\n        if matches and len(prefix) > len(best):\n            best = prefix\n    return ROUTES[best] if best else None\n\nfor path in (\"/menu\", \"/api\", \"/api/menu\", \"/api/orders/42\", \"/apis\", \"/static/app.3f9a1c.js\"):\n    print(path, \"->\", route(path))\n","out":"/menu -> web\n/api -> api\n/api/menu -> api\n/api/orders/42 -> orders\n/apis -> web\n/static/app.3f9a1c.js -> files\n","notes":[[6,"Match whole path segments: /api must not capture /apis."],[7,"Several prefixes can match; the longest is the most specific, so it wins."],[12,"/apis isn't under /api, so it falls back to the catch-all /."]]},{"lang":"javascript","src":"const ROUTES = { \"/\": \"web\", \"/api\": \"api\", \"/api/orders\": \"orders\", \"/static\": \"files\" };\n\nfunction route(path) {\n  let best = \"\";\n  for (const prefix of Object.keys(ROUTES)) {\n    const matches = path === prefix || path.startsWith(prefix.replace(/\\/+$/, \"\") + \"/\");   // whole path segments only\n    if (matches && prefix.length > best.length) best = prefix;\n  }\n  return best ? ROUTES[best] : null;\n}\n\nfor (const path of [\"/menu\", \"/api\", \"/api/menu\", \"/api/orders/42\", \"/apis\", \"/static/app.3f9a1c.js\"]) {\n  console.log(path, \"->\", route(path));\n}\n","out":"/menu -> web\n/api -> api\n/api/menu -> api\n/api/orders/42 -> orders\n/apis -> web\n/static/app.3f9a1c.js -> files\n","notes":[[6,"Match whole path segments: /api must not capture /apis."],[7,"Several prefixes can match; the longest is the most specific, so it wins."],[12,"/apis isn't under /api, so it falls back to the catch-all /."]]}]}],"ex":{"q":"A news site serves 20,000 requests a second at its peak: 70% for static files (versioned, with a 99% edge hit ratio), 25% for article pages (cached for 60 seconds, 90% hit ratio) and 5% for personal API calls, which can't be cached. How many requests a second reach the origin? And what happens if a bad deploy sends article pages with max-age=0?","steps":["Split the traffic by how cacheable it is: 14,000 static, 5,000 article and 1,000 personal requests a second.","Only misses reach the origin: 1% of 14,000 = 140, 10% of 5,000 = 500, and all 1,000 personal calls.","That's 1,640 requests a second, about 8% of the traffic: the CDN absorbs over 90%, so the origin is sized for about 1,640, plus headroom for a bad day at the CDN.","With max-age=0 on articles, all 5,000 article requests a second go to the origin: 6,140 in total, nearly four times as much. Cache headers are part of capacity planning, so test them like code. The arithmetic is O(classes)."],"code":{"t":"How much reaches the origin","tabs":[{"lang":"python","src":"def origin_rps(total_rps, classes):\n    \"\"\"classes: (name, share %, edge hit ratio %); requests per second that reach the origin, per class.\"\"\"\n    return {name: total_rps * share * (100 - hit) // 10_000 for name, share, hit in classes}\n\nnormal = [(\"static files\", 70, 99), (\"article pages\", 25, 90), (\"personal API\", 5, 0)]\nbroken = [normal[0], (\"article pages\", 25, 0), normal[2]]   # max-age=0 shipped by mistake\nfor label, classes in ((\"normal\", normal), (\"articles uncached\", broken)):\n    per_class = origin_rps(20_000, classes)\n    total = sum(per_class.values())\n    print(f\"{label}: {total} req/s reach the origin ({total * 100 // 20_000}% of traffic):\", *per_class.values())\n","out":"normal: 1640 req/s reach the origin (8% of traffic): 140 500 1000\narticles uncached: 6140 req/s reach the origin (30% of traffic): 140 5000 1000\n"},{"lang":"javascript","src":"function originRps(totalRps, classes) {\n  // classes: [name, share %, edge hit ratio %]; requests per second that reach the origin, per class\n  return Object.fromEntries(classes.map(([name, share, hit]) => [name, Math.floor((totalRps * share * (100 - hit)) / 10000)]));\n}\n\nconst normal = [[\"static files\", 70, 99], [\"article pages\", 25, 90], [\"personal API\", 5, 0]];\nconst broken = [normal[0], [\"article pages\", 25, 0], normal[2]];   // max-age=0 shipped by mistake\nfor (const [label, classes] of [[\"normal\", normal], [\"articles uncached\", broken]]) {\n  const perClass = originRps(20000, classes);\n  const total = Object.values(perClass).reduce((a, b) => a + b, 0);\n  console.log(`${label}: ${total} req/s reach the origin (${Math.floor((total * 100) / 20000)}% of traffic):`, ...Object.values(perClass));\n}\n","out":"normal: 1640 req/s reach the origin (8% of traffic): 140 500 1000\narticles uncached: 6140 req/s reach the origin (30% of traffic): 140 5000 1000\n"}]},"a":"Normally 1,640 requests a second (about 8% of the traffic) reach the origin: 140 for static files, 500 for articles and 1,000 personal API calls. With the article caching lost it jumps to 6,140 (about 30%), nearly four times the load the origin was sized for."},"fade":{"q":"Make the origin answer conditional requests. Finish `handle(headers, body)`: compute the ETag of the body, and if the request's If-None-Match header lists that ETag (or is *), answer 304 with no body; otherwise answer 200 with the body, its ETag and a Cache-Control header.","steps":["The origin needs a validator that changes whenever the content does: here, a short hash of the body as the ETag.",{"ask":"When may the origin answer 304?","a":"When If-None-Match contains the current ETag (it can be a comma-separated list) or is *: the client's copy is still right, so the origin sends 304 Not Modified with the ETag and no body."},{"ask":"What does the CDN or browser do with a 304?","a":"It keeps the body it already has, updates the stored headers, and treats the copy as fresh again for another max-age."},{"ask":"What does revalidation save, and what doesn't it?","a":"It saves the bytes of the body and often the work of building it, but not the round trip: the request still crosses the network. Hashing the body costs O(size) on the origin, so busy origins store each ETag rather than recompute it."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"import hashlib\n\ndef etag_of(body):                            # a validator: a short hash of the exact content\n    return '\"' + hashlib.sha256(body.encode()).hexdigest()[:16] + '\"'\n\ndef handle(headers, body):\n    \"\"\"Answer a GET for `body`, honouring If-None-Match. Returns (status, response headers, body sent).\"\"\"\n    ...                                       # TODO: 3
