ing-db\", 50], [\"orders-api\", 15]]],\n  [\"search\", 20, [[\"web-search\", 60], [\"search-api\", 100], [\"search-index\", 50]]],\n];\nconst rand = mulberry32(7);\nconst CHANGES = [];                                    // 200 changes, each the list of modules it touched\nfor (let c = 0; c < 200; c++) {\n  let r = Math.floor(rand() * 100), modules;\n  for (const [, share, mods] of STREAMS) {\n    modules = mods;\n    if (r < share) break;\n    r -= share;\n  }\n  CHANGES.push(modules.filter(([, chance]) => Math.floor(rand() * 100) < chance).map(([m]) => m));\n}\n\nconst BY_LAYER = { \"web-orders\": \"Frontend\", \"web-billing\": \"Frontend\", \"web-search\": \"Frontend\", \"design-system\": \"Frontend\",\n                   \"orders-api\": \"Backend\", \"billing-api\": \"Backend\", \"search-api\": \"Backend\",\n                   \"orders-db\": \"Data\", \"billing-db\": \"Data\", \"search-index\": \"Data\" };\nconst BY_STREAM = { \"web-orders\": \"Orders\", \"orders-api\": \"Orders\", \"orders-db\": \"Orders\",\n                    \"web-billing\": \"Billing\", \"billing-api\": \"Billing\", \"billing-db\": \"Billing\",\n                    \"web-search\": \"Search\", \"search-api\": \"Search\", \"search-index\": \"Search\", \"design-system\": \"Platform\" };\n\nfunction analyse(owner) {\n  let crossing = 0;\n  const pairs = new Map();\n  for (const modules of CHANGES) {\n    const teams = [...new Set(modules.map(m => owner[m]))].sort();\n    if (teams.length > 1) {\n      crossing++;\n      for (let i = 0; i < teams.length; i++) {\n        for (let j = i + 1; j < teams.length; j++) {\n          const pair = `${teams[i]} + ${teams[j]}`;\n          pairs.set(pair, (pairs.get(pair) ?? 0) + 1);\n        }\n      }\n    }\n  }\n  const top = [...pairs].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 2);\n  return [crossing, top];\n}\n\nfor (const [label, owner] of [[\"teams by layer\", BY_LAYER], [\"teams by stream\", BY_STREAM]]) {\n  const [crossing, top] = analyse(owner);\n  console.log(`${label}: ${crossing} of ${CHANGES.length} changes need more than one team (${Math.floor(crossing * 100 / CHANGES.length)}%)`);\n  console.log(\"  most often changed together: \" + top.map(([pair, n]) => `${pair} (${n})`).join(\", \"));\n}\n","out":"teams by layer: 163 of 200 changes need more than one team (81%)\n  most often changed together: Backend + Frontend (122), Backend + Data (95)\nteams by stream: 17 of 200 changes need more than one team (8%)\n  most often changed together: Billing + Orders (9), Orders + Platform (8)\n","notes":[[1,"Changes follow the business: most orders work touches the orders pages, API and data together."],[18,"Today's teams are organised by layer, the way the code was first split."],[29,"A change that touches modules owned by two teams needs both teams: a conversation, a hand-off or a wait."],[44,"The same changes, owned by stream-aligned teams, rarely cross a boundary; the pairs that remain show where team APIs are needed."]]}]},{"t":"The arithmetic behind small teams and few dependencies","tabs":[{"lang":"python","src":"for people in (3, 5, 9, 15, 50):\n    print(f\"a team of {people}: {people * (people - 1) // 2:,} pairs of people who may need to talk\")\n\nON_TIME = 90                                           # % of the time each team delivers its part when planned\nfor teams in (1, 2, 4, 8):\n    chance = ON_TIME ** teams * 100 // 100 ** teams    # every team must be on time, so the chances multiply\n    print(f\"a feature that needs {teams} team{'s' if teams > 1 else ''}: on time {chance}% of the time\")\n\nWORK, WAIT = 10, 4                                     # days of work in a feature; days waiting in each team's queue\nfor teams in (1, 4):\n    print(f\"built by {teams} team{'s' if teams > 1 else ''}: {teams - 1} hand-offs, about {WORK + (teams - 1) * WAIT} days from start to finish\")\n","out":"a team of 3: 3 pairs of people who may need to talk\na team of 5: 10 pairs of people who may need to talk\na team of 9: 36 pairs of people who may need to talk\na team of 15: 105 pairs of people who may need to talk\na team of 50: 1,225 pairs of people who may need to talk\na feature that needs 1 team: on time 90% of the time\na feature that needs 2 teams: on time 81% of the time\na feature that needs 4 teams: on time 65% of the time\na feature that needs 8 teams: on time 43% of the time\nbuilt by 1 team: 0 hand-offs, about 10 days from start to finish\nbuilt by 4 teams: 3 hand-offs, about 22 days from start to finish\n","notes":[[1,"Pairs grow with the square of team size: one reason long-lived teams of five to nine work well."],[6,"Every team must deliver its part, so the chances multiply: eight 90% teams are on time less than half the time."],[9,"Illustrative numbers: work in a queue waits, and every hand-off adds a wait."]]},{"lang":"javascript","src":"for (const people of [3, 5, 9, 15, 50]) {\n  console.log(`a team of ${people}: ${(people * (people - 1) / 2).toLocaleString(\"en-US\")} pairs of people who may need to talk`);\n}\n\nconst ON_TIME = 90;                                    // % of the time each team delivers its part when planned\nfor (const teams of [1, 2, 4, 8]) {\n  const chance = Math.floor(ON_TIME ** teams * 100 / 100 ** teams);   // every team must be on time, so the chances multiply\n  console.log(`a feature that needs ${teams} team${teams > 1 ? \"s\" : \"\"}: on time ${chance}% of the time`);\n}\n\nconst WORK = 10, WAIT = 4;                             // days of work in a feature; days waiting in each team's queue\nfor (const teams of [1, 4]) {\n  console.log(`built by ${teams} team${teams > 1 ? \"s\" : \"\"}: ${teams - 1} hand-offs, about ${WORK + (teams - 1) * WAIT} days from start to finish`);\n}\n","out":"a team of 3: 3 pairs of people who may need to talk\na team of 5: 10 pairs of people who may need to talk\na team of 9: 36 pairs of people who may need to talk\na team of 15: 105 pairs of people who may need to talk\na team of 50: 1,225 pairs of people who may need to talk\na feature that needs 1 team: on time 90% of the time\na feature that needs 2 teams: on time 81% of the time\na feature that needs 4 teams: on time 65% of the time\na feature that needs 8 teams: on time 43% of the time\nbuilt by 1 team: 0 hand-offs, about 10 days from start to finish\nbuilt by 4 teams: 3 hand-offs, about 22 days from start to finish\n","notes":[[1,"Pairs grow with the square of team size: one reason long-lived teams of five to nine work well."],[7,"Every team must deliver its part, so the chances multiply: eight 90% teams are on time less than half the time."],[11,"Illustrative numbers: work in a queue waits, and every hand-off adds a wait."]]}]},{"t":"Does the platform team pay for itself? Adoption decides","tabs":[{"lang":"python","src":"TEAMS, TOIL = 40, 15                                   # stream-aligned teams; hours of infrastructure toil per team per week\nPLATFORM, WEEK = 5, 40                                 # platform engineers; hours a week each\nBEST_SHARE = 60                                        # % of toil the finished platform removes for a team that uses it\n\ndef two_years(first_release, start_share, teams_a_month):\n    adopted = net = 0\n    payback = None\n    for month in range(1, 25):\n        share = 0\n        if month > first_release:\n            adopted = min(TEAMS, adopted + teams_a_month)          # teams join once it solves a problem they have\n            share = min(BEST_SHARE, start_share + 5 * (month - first_release - 1))\n        net += adopted * TOIL * share // 100 * 4 - PLATFORM * WEEK * 4   # hours saved minus hours spent, per month\n        if payback is None and month > first_release and net >= 0:\n            payback = month\n    return payback, net\n\nfor label, first, start, rate in ((\"build for six months, then launch\", 6, 60, 3),\n                                  (\"ship a thin version in month two, then improve it\", 2, 30, 3),\n                                  (\"ship it, but nobody adopts it\", 2, 30, 0)):\n    payback, net = two_years(first, start, rate)\n    when = f\"pays back in month {payback}\" if payback else \"doesn't pay back within two years\"\n    print(f\"{label}: {when}, net {net:+,} hours after 24 months\")\nmonthly_cost = PLATFORM * WEEK * 4\nper_team = TOIL * BEST_SHARE // 100 * 4\nprint(f\"just to cover its own cost, {-(-monthly_cost // per_team)} of {TEAMS} teams must use the finished platform\")\n","out":"build for six months, then launch: doesn't pay back within two years, net -2,172 hours after 24 months\nship a thin version in month two, then improve it: pays back in month 20, net +3,076 hours after 24 months\nship it, but nobody adopts it: doesn't pay back within two years, net -19,200 hours after 24 months\njust to cover its own cost, 23 of 40 teams must use the finished platform\n","notes":[[1,"Illustrative numbers: measure the real toil (environments, pipelines, on-call plumbing) before you build anything."],[11,"Value starts only when teams adopt it, so the release date and the adoption rate matter more than the feature list."],[19,"The thinnest viable platform removes less toil at first, but starts earning adoption four months earlier."],[26,"A platform nobody uses is pure cost: treat adoption as the product's main measure."]]},{"lang":"javascript","src":"const TEAMS = 40, TOIL = 15;                           // stream-aligned teams; hours of infrastructure toil per team per week\nconst PLATFORM = 5, WEEK = 40;                         // platform engineers; hours a week each\nconst BEST_SHARE = 60;                                 // % of toil the finished platform removes for a team that uses it\n\nfunction twoYears(firstRelease, startShare, teamsAMonth) {\n  let adopted = 0, net = 0, payback = null;\n  for (let month = 1; month <= 24; month++) {\n    let share = 0;\n    if (month > firstRelease) {\n      adopted = Math.min(TEAMS, adopted + teamsAMonth);           // teams join once it solves a problem they have\n      share = Math.min(BEST_SHARE, startShare + 5 * (month - firstRelease - 1));\n    }\n    net += Math.floor(adopted * TOIL * share / 100) * 4 - PLATFORM * WEEK * 4;   // hours saved minus hours spent, per month\n    if (payback === null && month > firstRelease && net >= 0) payback = month;\n  }\n  return [payback, net];\n}\n\nconst signed = n => (n >= 0 ? \"+\" : \"-\") + Math.abs(n).toLocaleString(\"en-US\");\nfor (const [label, first, start, rate] of [[\"build for six months, then launch\", 6, 60, 3],\n                                           [\"ship a thin version in month two, then improve it\", 2, 30, 3],\n                                           [\"ship it, but nobody adopts it\", 2, 30, 0]]) {\n  const [payback, net] = twoYears(first, start, rate);\n  const when = payback ? `pays back in month ${payback}` : \"doesn't pay back within two years\";\n  console.log(`${label}: ${when}, net ${signed(net)} hours after 24 months`);\n}\nconst monthlyCost = PLATFORM * WEEK * 4;\nconst perTeam = Math.floor(TOIL * BEST_SHARE / 100) * 4;\nconsole.log(`just to cover its own cost, ${Math.ceil(monthlyCost / perTeam)} of ${TEAMS} teams must use the finished platform`);\n","out":"build for six months, then launch: doesn't pay back within two years, net -2,172 hours after 24 months\nship a thin version in month two, then improve it: pays back in month 20, net +3,076 hours after 24 months\nship it, but nobody adopts it: doesn't pay back within two years, net -19,200 hours after 24 months\njust to cover its own cost, 23 of 40 teams must use the finished platform\n","notes":[[1,"Illustrative numbers: measure the real toil (environments, pipelines, on-call plumbing) before you build anything."],[10,"Value starts only when teams adopt it, so the release date and the adoption rate matter more than the feature list."],[21,"The thinnest viable platform removes less toil at first, but starts earning adoption four months earlier."],[29,"A platform nobody uses is pure cost: treat adoption as the product's main measure."]]}]}],"ex":{"q":"Seven services, each with a complexity score, and a year of co-change counts between them. Today three teams own them by layer. Find the way to give the services to three teams that minimises the co-changes crossing team boundaries, without any team owning more than 10 points of complexity.","steps":["Score a design by the co-changes that cross team boundaries: each is a conversation, a hand-off or a wait.","Cap each team's cognitive load: the total complexity it owns must stay at or below what one team can understand.","Try every assignment (3⁷ = 2,187 here; real tools use heuristics) and keep the one with the fewest crossings within the cap.","Compare it with today's teams, and name each new team's type."],"code":{"t":"The inverse Conway maneuver, as a small search","tabs":[{"lang":"python","src":"SERVICES = [\"web-orders\", \"web-billing\", \"orders-api\", \"billing-api\", \"orders-db\", \"billing-db\", \"payments-gateway\"]\nLOAD = [3, 2, 4, 4, 2, 2, 5]                           # complexity points: how much each service takes to understand\nCO_CHANGES = {(\"web-orders\", \"orders-api\"): 40, (\"orders-api\", \"orders-db\"): 25, (\"web-billing\", \"billing-api\"): 30,\n              (\"billing-api\", \"billing-db\"): 20, (\"billing-api\", \"payments-gateway\"): 15,\n              (\"orders-api\", \"billing-api\"): 10, (\"web-orders\", \"web-billing\"): 5}   # changes that touched both, last year\nCAP, TEAMS = 10, 3                                     # the most complexity one team can own well; teams available\n\ndef crossings(team_of):                                # co-changes that need two teams to coordinate\n    return sum(n for (a, b), n in CO_CHANGES.items() if team_of[a] != team_of[b])\n\ndef loads(team_of):\n    return [sum(LOAD[i] for i, s in enumerate(SERVICES) if team_of[s] == t) for t in range(TEAMS)]\n\ndef groups(team_of):\n    found = [[s for s in SERVICES if team_of[s] == t] for t in range(TEAMS)]\n    return sorted((g for g in found if g), key=lambda g: SERVICES.index(g[0]))\n\nby_layer = {\"web-orders\": 0, \"web-billing\": 0, \"orders-api\": 1, \"billing-api\": 1, \"payments-gateway\": 1,\n            \"orders-db\": 2, \"billing-db\": 2}\ntotal = sum(CO_CHANGES.values())\nprint(f\"teams by layer: {crossings(by_layer)} of {total} co-changes cross teams, loads {', '.join(map(str, loads(by_layer)))} (cap {CAP})\")\n\nbest = None\nfor code in range(TEAMS ** len(SERVICES)):             # every way to give 7 services to 3 teams: 2,187\n    team_of = {s: code // TEAMS ** i % TEAMS for i, s in enumerate(SERVICES)}\n    if max(loads(team_of)) <= CAP and (best is None or crossings(team_of) < crossings(best)):\n        best = team_of\nprint(f\"best within the cap: {crossings(best)} cross teams\")\nfor group in groups(best):\n    print(f\"  a team owning {', '.join(group)} (load {sum(LOAD[SERVICES.index(s)] for s in group)})\")\n","out":"teams by layer: 115 of 145 co-changes cross teams, loads 5, 13, 4 (cap 10)\nbest within the cap: 30 cross teams\n  a team owning web-orders, orders-api, orders-db (load 9)\n  a team owning web-billing, billing-api, billing-db (load 8)\n  a team owning payments-gateway (load 5)\n"},{"lang":"javascript","src":"const SERVICES = [\"web-orders\", \"web-billing\", \"orders-api\", \"billing-api\", \"orders-db\", \"billing-db\", \"payments-gateway\"];\nconst LOAD = [3, 2, 4, 4, 2, 2, 5];                    // complexity points: how much each service takes to understand\nconst CO_CHANGES = [[\"web-orders\", \"orders-api\", 40], [\"orders-api\", \"orders-db\", 25], [\"web-billing\", \"billing-api\", 30],\n                    [\"billing-api\", \"billing-db\", 20], [\"billing-api\", \"payments-gateway\", 15],\n                    [\"orders-api\", \"billing-api\", 10], [\"web-orders\", \"web-billing\", 5]];   // changes that touched both, last year\nconst CAP = 10, TEAMS = 3;                             // the most complexity one team can own well; teams available\n\nfunction crossings(teamOf) {                           // co-changes that need two teams to coordinate\n  return CO_CHANGES.reduce((sum, [a, b, n]) => sum + (teamOf[a] !== teamOf[b] ? n : 0), 0);\n}\n\nfunction loads(teamOf) {\n  return Array.from({ length: TEAMS }, (_, t) => SERVICES.reduce((sum, s, i) => sum + (teamOf[s] === t ? LOAD[i] : 0), 0));\n}\n\nfunction groups(teamOf) {\n  const found = Array.from({ length: TEAMS }, (_, t) => SERVICES.filter(s => teamOf[s] === t));\n  return found.filter(g => g.length).sort((g, h) => SERVICES.indexOf(g[0]) - SERVICES.indexOf(h[0]));\n}\n\nconst byLayer = { \"web-orders\": 0, \"web-billing\": 0, \"orders-api\": 1, \"billing-api\": 1, \"payments-gateway\": 1,\n                  \"orders-db\": 2, \"billing-db\": 2 };\nconst total = CO_CHANGES.reduce((sum, [, , n]) => sum + n, 0);\nconsole.log(`teams by layer: ${crossings(byLayer)} of ${total} co-changes cross teams, loads ${loads(byLayer).join(\", \")} (cap ${CAP})`);\n\nlet best = null;\nfor (let code = 0; code < TEAMS ** SERVICES.length; code++) {   // every way to give 7 services to 3 teams: 2,187\n  const teamOf = Object.fromEntries(SERVICES.map((s, i) => [s, Math.floor(code / TEAMS ** i) % TEAMS]));\n  if (Math.max(...loads(teamOf)) <= CAP && (best === null || crossings(teamOf) < crossings(best))) best = teamOf;\n}\nconsole.log(`best within the cap: ${crossings(best)} cross teams`);\nfor (const group of groups(best)) {\n  console.log(`  a team owning ${group.join(\", \")} (load ${group.reduce((sum, s) => sum + LOAD[SERVICES.indexOf(s)], 0)})`);\n}\n","out":"teams by layer: 115 of 145 co-changes cross teams, loads 5, 13, 4 (cap 10)\nbest within the cap: 30 cross teams\n  a team owning web-orders, orders-api, orders-db (load 9)\n  a team owning web-billing, billing-api, billing-db (load 8)\n  a team owning payments-gateway (load 5)\n"}]},"a":"Organised by layer, 115 of the 145 co-changes cross a team boundary, and the backend team carries 13 points, beyond what one team can own well. The best design within the cap has only 30 crossings: two stream-aligned teams own orders and billing end to end, and the payments gateway, too complex to fit inside the billing team's load, becomes a complicated-subsystem team that offers it as a service. The crossings that remain become explicit interactions: billing's calls into orders and payments are X-as-a-Service with documented APIs. Choosing the boundaries first and shaping the teams to fit is the inverse Conway maneuver in miniature."},"fade":{"q":"Finish `undeclared(calls, owner, declared)`: from service calls seen in traces, return every call between two different teams that have no declared interaction in either direction, as sorted (caller's team, callee's team, caller, callee) tuples.","steps":["Look up both services' owning teams; calls inside one team are fine.",{"ask":"Why does an undeclared dependency matter?","a":"It's coordination nobody planned for. The called team doesn't know it has a consumer, can break it without warning, and the work never shows up in either team's planning. Declare it, with a team API and an interaction mode, or remove it."},{"ask":"Should every pair of teams have a declared interaction?","a":"No: most pairs should have none at all. A team that needs many interactions is a sign its boundaries are wrong, or that a platform should offer the shared parts as a service."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"OWNER = {\"checkout\": \"Orders\", \"orders-api\": \"Orders\", \"billing-api\": \"Billing\", \"invoices\": \"Billing\",\n         \"payments-gateway\": \"Payments\", \"search-api\": \"Search\", \"deploy-pipeline\": \"Platform\", \"metrics\": \"Platform\"}\nDECLARED = {(\"Orders\", \"Billing\"): \"X-as-a-Service\", (\"Billing\", \"Payments\"): \"X-as-a-Service\",\n            (\"Orders\", \"Platform\"): \"X-as-a-Service\", (\"Billing\", \"Platform\"): \"X-as-a-Service\",\n            (\"Search\", \"Platform\"): \"X-as-a-Service\", (\"Orders\", \"Search\"): \"collaboration\"}\nCALLS = [(\"checkout\", \"orders-api\"), (\"checkout\", \"billing-api\"), (\"orders-api\", \"search-api\"),\n         (\"search-api\", \"orders-api\"), (\"invoices\", \"payments-gateway\"), (\"orders-api\", \"payments-gateway\"),\n         (\"checkout\", \"metrics\"), (\"payments-gateway\", \"metrics\"), (\"invoices\", \"search-api\")]   # seen in traces\n\ndef undeclared(calls, owner, declared):\n    found = []\n    ...                                                # TODO: cross-team calls whose two teams have no declared interaction\n    return sorted(found)\n"},{"lang":"javascript","src":"const OWNER = { \"checkout\": \"Orders\", \"orders-api\": \"Orders\", \"billing-api\": \"Billing\", \"invoices\": \"Billing\",\n                \"payments-gateway\": \"Payments\", \"search-api\": \"Search\", \"deploy-pipeline\": \"Platform\", \"metrics\": \"Platform\" };\nconst DECLARED = new Map([[\"Orders|Billing\", \"X-as-a-Service\"], [\"Billing|Payments\", \"X-as-a-Service\"],\n                          [\"Orders|Platform\", \"X-as-a-Service\"], [\"Billing|Platform\", \"X-as-a-Service\"],\n                          [\"Search|Platform\", \"X-as-a-Service\"], [\"Orders|Search\", \"collaboration\"]]);\nconst CALLS = [[\"checkout\", \"orders-api\"], [\"checkout\", \"billing-api\"], [\"orders-api\", \"search-api\"],\n               [\"search-api\", \"orders-api\"], [\"invoices\", \"payments-gateway\"], [\"orders-api\", \"payments-gateway\"],\n               [\"checkout\", \"metrics\"], [\"payments-gateway\", \"metrics\"], [\"invoices\", \"search-api\"]];   // seen in traces\nconst byFields = (x, y) => { const p = x.join(\"\\u0000\"), q = y.join(\"\\u0000\"); return p < q ? -1 : p > q ? 1 : 0; };\n\nfunction undeclared(calls, owner, declared) {\n  const found = [];\n  // TODO: cross-team calls whose two teams have no declared interaction (\"A|B\" or \"B|A\")\n  return found.sort(byFields);\n}\n"}]},"solution":{"t":"Solution: cross-team calls with no agreed interaction either way","tabs":[{"lang":"python","src":"OWNER = {\"checkout\": \"Orders\", \"orders-api\": \"Orders\", \"billing-api\": \"Billing\", \"invoices\": \"Billing\",\n         \"payments-gateway\": \"Payments\", \"search-api\": \"Search\", \"deploy-pipeline\": \"Platform\", \"metrics\": \"Platform\"}\nDECLARED = {(\"Orders\", \"Billing\"): \"X-as-a-Service\", (\"Billing\", \"Payments\"): \"X-as-a-Service\",\n            (\"Orders\", \"Platform\"): \"X-as-a-Service\", (\"Billing\", \"Platform\"): \"X-as-a-Service\",\n            (\"Search\", \"Platform\"): \"X-as-a-Service\", (\"Orders\", \"Search\"): \"collaboration\"}\nCALLS = [(\"checkout\", \"orders-api\"), (\"checkout\", \"billing-api\"), (\"orders-api\", \"search-api\"),\n         (\"search-api\", \"orders-api\"), (\"invoices\", \"payments-gateway\"), (\"orders-api\", \"payments-gateway\"),\n         (\"checkout\", \"metrics\"), (\"payments-gateway\", \"metrics\"), (\"invoices\", \"search-api\")]   # seen in traces\n\ndef undeclared(calls, owner, declared):\n    found = []\n    for caller, callee in calls:\n        a, b = owner[caller], owner[callee]\n        if a != b and (a, b) not in declared and (b, a) not in declared:\n            found.append((a, b, caller, callee))       # a dependency nobody planned for\n    return sorted(found)\n\nfor a, b, caller, callee in undeclared(CALLS, OWNER, DECLARED):\n    print(f\"{a} depends on {b} without an agreed interaction: {caller} calls {callee}\")\n","out":"Billing depends on Search without an agreed interaction: invoices calls search-api\nOrders depends on Payments without an agreed interaction: orders-api calls payments-gateway\nPayments depends on Platform without an agreed interaction: payments-gateway calls metrics\n"},{"lang":"javascript","src":"const OWNER = { \"checkout\": \"Orders\", \"orders-api\": \"Orders\", \"billing-api\": \"Billing\", \"invoices\": \"Billing\",\n                \"payments-gateway\": \"Payments\", \"search-api\": \"Search\", \"deploy-pipeline\": \"Platform\", \"metrics\": \"Platform\" };\nconst DECLARED = new Map([[\"Orders|Billing\", \"X-as-a-Service\"], [\"Billing|Payments\", \"X-as-a-Service\"],\n                          [\"Orders|Platform\", \"X-as-a-Service\"], [\"Billing|Platform\", \"X-as-a-Service\"],\n                          [\"Search|Platform\", \"X-as-a-Service\"], [\"Orders|Search\", \"collaboration\"]]);\nconst CALLS = [[\"checkout\", \"orders-api\"], [\"checkout\", \"billing-api\"], [\"orders-api\", \"search-api\"],\n               [\"search-api\", \"orders-api\"], [\"invoices\", \"payments-gateway\"], [\"orders-api\", \"payments-gateway\"],\n               [\"checkout\", \"metrics\"], [\"payments-gateway\", \"metrics\"], [\"invoices\", \"search-api\"]];   // seen in traces\nconst byFields = (x, y) => { const p = x.join(\"\\u0000\"), q = y.join(\"\\u0000\"); return p < q ? -1 : p > q ? 1 : 0; };\n\nfunction undeclared(calls, owner, declared) {\n  const found = [];\n  for (const [caller, callee] of calls) {\n    const a = owner[caller], b = owner[callee];\n    if (a !== b && !declared.has(`${a}|${b}`) && !declared.has(`${b}|${a}`)) found.push([a, b, caller, callee]);   // a dependency nobody planned for\n  }\n  return found.sort(byFields);\n}\n\nfor (const [a, b, caller, callee] of undeclared(CALLS, OWNER, DECLARED)) {\n  console.log(`${a} depends on ${b} without an agreed interaction: ${caller} calls ${callee}`);\n}\n","out":"Billing depends on Search without an agreed interaction: invoices calls search-api\nOrders depends on Payments without an agreed interaction: orders-api calls payments-gateway\nPayments depends on Platform without an agreed interaction: payments-gateway calls metrics\n"}]}},"traps":[["“Architecture and organisation design are separate decisions.”","Conway's law says they converge whether you plan it or not. Decide service boundaries and team boundaries together."],["“Bigger teams get more done.”","Communication paths grow with the square of team size, and so does the time spent coordinating. Split by stream into small, long-lived teams."],["“Component teams are efficient: each is expert in its layer.”","Each feature then queues at every layer's team. Stream-aligned teams own a slice end to end; keep specialists for the genuinely hard parts."],["“The platform team is the infrastructure team, renamed.”","A platform is an internal product: research users' needs, self-service APIs and docs, a roadmap, and adoption earned, not mandated."],["“Collaboration between teams is always good.”","Collaboration is expensive and meant for discovery, for a limited time. Long-running collaboration usually means a boundary is in the wrong place."],["“Microservices will fix our coordination problems.”","Services whose boundaries don't match team ownership create a distributed monolith: the same coordination, now over the network."]],"disc":[["Every feature in your company needs changes from four teams (frontend, backend, data and operations), and lead time is six weeks. What would you change?","First measure where the time goes: working versus waiting, and the share of changes that need more than one team. Then map the value streams and move towards stream-aligned teams that own a business area end to end, with the architecture's boundaries moved to match, one stream at a time. Turn operations work into a platform team offering self-service deployment and observability, use an enabling team to spread skills the new teams lack, and keep a complicated-subsystem team only where the specialism is real. Track lead time and cross-team changes to see whether it's working, and expect a transition period."],["You're asked to set up a platform team. How do you make sure it speeds teams up rather than becoming a bottleneck?","Run it as a product: interview the stream-aligned teams about their biggest sources of toil, and start with the thinnest viable platform that removes the top one, even if that's documentation and templates. Offer self-service interfaces with golden paths rather than ticket queues, keep the parts optional and composable, and collaborate closely with early adopters for a limited time. Measure adoption, the time for a new service to reach production, and developer satisfaction, and treat a growing ticket queue as a sign the product is missing something."]],"teach":{"prompt":"Explain to a junior colleague what Conway's law means for how we design systems and teams.","rubric":["Conway's law: systems copy the communication structure of the teams that build them","Layer teams make every feature cross boundaries; stream-aligned teams own a flow end to end","The inverse Conway maneuver: shape teams to get the architecture you want, changing code and teams together","Team Topologies' team types and interaction modes, and cognitive load as a limit","Measuring cross-team changes, waiting time and platform adoption"],"model":"Conway's law says a system ends up mirroring how the teams that build it communicate. If we organise teams by layer, with frontend, backend and data teams, almost every feature crosses three team boundaries and waits in three queues. So we design teams and architecture together: most teams should be stream-aligned, each owning a part of the business end to end, supported by a platform team that offers self-service tools, enabling teams that coach for a while, and specialists only for genuinely hard subsystems. Interactions between teams should be explicit, mostly X-as-a-Service, with collaboration kept short. Each team's responsibilities must fit its cognitive load. Deliberately reshaping teams to get the architecture we want is the inverse Conway maneuver, and it works when code boundaries move along with the teams. We check it by measuring how often changes need several teams and how long work waits between them."},"qa":[["State Conway's law.","Organisations that design systems produce designs that copy their own communication structures."],["What is the inverse Conway maneuver?","Shaping team structure on purpose so that the architecture you want is the one the organisation naturally produces."],["Team Topologies' four team types?","Stream-aligned, enabling, complicated-subsystem and platform."],["Team Topologies' three interaction modes?","Collaboration, X-as-a-Service and facilitating."],["Why limit a team's cognitive load?","A team can only own well what it can understand; overload slows delivery and lowers quality."],["What is the thinnest viable platform?","The smallest platform, sometimes just documentation and templates, that makes stream-aligned teams faster."]],"quiz":[{"q":"What does this print?","snip":{"t":"Communication paths in a team","tabs":[{"lang":"python","src":"print(*(n * (n - 1) // 2 for n in (4, 8)))\n"},{"lang":"javascript","src":"console.log(...[4, 8].map(n => n * (n - 1) / 2));\n"}]},"o":["6 28","4 8","8 16","12 56"],"a":0,"e":"n(n − 1) ÷ 2 pairs: doubling a team from 4 to 8 people takes it from 6 to 28 possible conversations."},{"q":"What does this print?","snip":{"t":"Three teams, each on time 90% of the time","tabs":[{"lang":"python","src":"chance = 90 ** 3 * 100 // 100 ** 3\nprint(chance)\n"},{"lang":"javascript","src":"const chance = Math.floor(90 ** 3 * 100 / 100 ** 3);\nconsole.log(chance);\n"}]},"o":["72","90","70","81"],"a":0,"e":"0.9³ = 0.729, so a feature that needs all three teams on time ships on time about 72% of the time. Dependencies multiply risk."},{"q":"Which statement best captures Conway's law?","o":["Organisations design systems that copy their own communication structures","Adding people to a late project makes it later","Work expands to fill the time available","Systems should be split into services of equal size"],"a":0,"e":"Conway, 1968. The others are Brooks's law, Parkinson's law, and not a law at all."},{"q":"A team spends a few months helping other teams adopt contract testing, then moves on to the next practice. Which Team Topologies team type is it?","o":["Enabling team","Platform team","Complicated-subsystem team","Stream-aligned team"],"a":0,"e":"Enabling teams coach others in new skills and practices, facilitating for a limited time, and don't take over the work."},{"q":"Which are Team Topologies interaction modes? (choose 3)","t":"ms","o":["Collaboration","X-as-a-Service","Facilitating","Hand-off","Shared ownership"],"a":[0,1,2],"e":"Hand-offs and shared ownership are what the model tries to remove: they hide coordination costs."},{"q":"Judge each statement.","t":"yn","s":[["The inverse Conway maneuver changes team structure to encourage the architecture you want.",true],["A platform team should make its platform mandatory, so adoption is guaranteed.",false],["Collaboration between two teams is meant to be permanent.",false],["A team's cognitive load is a reason to keep its responsibilities small enough to own fully.",true]],"e":"Platforms earn adoption by being useful (thinnest viable platform, self-service); collaboration is for discovery over a defined period; overloaded teams slow down."},{"q":"Put an inverse Conway reorganisation in order.","t":"ord","items":["Map today's teams, services and how changes flow between them","Find where changes cross team boundaries most often","Draw the target boundaries around streams of business change","Form teams around those boundaries, within each team's cognitive load","Declare the interactions between teams, mostly as services","Measure lead time and cross-team changes, and adjust"],"e":"Evidence first, target boundaries second, teams third, then explicit interactions and measurement, because the first design is never perfect."},{"q":"Complete the Python function for the number of pairs of people in a team.","t":"drop","lang":"python","code":"def conversations(people):                            # pairs of people in a team who may need to talk\n    return people * ({{0}}) // {{1}}\n","blanks":[{"o":["people - 1","people + 1","people","2"],"a":0},{"o":["2","1","people","4"],"a":0}],"e":"Each of n people can talk to n − 1 others, and each pair is counted twice: n(n − 1) ÷ 2."}],"probs":[["Reading · Martin Fowler: Conway's Law","https://martinfowler.com/bliki/ConwaysLaw.html","","find one place in a system you know where the code's structure mirrors a team boundary, for better or worse"],["Reference · Team Topologies: key concepts","https://teamtopologies.com/key-concepts","","label each team you work with by type, and each of its interactions by mode"],["Reading · CNCF: Platforms white paper","https://tag-app-delivery.cncf.io/whitepapers/platforms/","","score your internal platform against its attributes, and pick the one that would help most"],["Reading · Melvin Conway: How Do Committees Invent? (1968)","https://www.melconway.com/Home/Committees_Paper.html","","read the original argument, and note what Conway says happens as organisations grow"]],"src":[["Melvin E. Conway (1968): How Do Committees Invent?","https://www.melconway.com/Home/Committees_Paper.html"],["Martin Fowler (2022): Conway's Law","https://martinfowler.com/bliki/ConwaysLaw.html"],["Team Topologies: key concepts","https://teamtopologies.com/key-concepts"],["CNCF TAG App Delivery: Platforms white paper","https://tag-app-delivery.cncf.io/whitepapers/platforms/"]]},{"id":"m06","d":"d3","t":"AI systems design: LLM serving, RAG at scale and agent platforms","min":130,"hook":"Almost every organisation is now building AI features, and they bring familiar problems in new shapes: capacity measured in tokens and accelerator memory, latency split into time to first token and time per token, retrieval systems that must respect permissions, and agents that act on text an attacker may have written. This module treats them as systems design: serving and batching, caching and routing, retrieval-augmented generation (RAG) at scale, and agent platforms whose guardrails live outside the model.","pre":{"q":"Your support assistant sends every request to one large model. It costs too much, answers take eight seconds, and a user reports it once quoted an internal document they shouldn't have seen. What would you change?","a":"Measure first: time to first token against generation time, prompt lengths, and the mix of easy and hard requests. Route easy requests to a smaller model with a confidence check and escalate the rest, cache the shared prefix (instructions and policies) with prompt caching, retrieve only the passages that are needed, and stream tokens as they're generated. Fix the leak in retrieval, not in the prompt: filter documents by the user's permissions before ranking, so text they can't read never reaches the model."},"kid":{"t":"Luigi's phone helper","x":"Luigi's pizza helper takes phone orders. The oven bakes several pizzas at once, and instead of waiting for all of them to finish, Luigi slides a new one in as soon as one comes out. Regulars' usual orders sit on a card, so nobody asks twice. Easy orders go to the apprentice; tricky ones go to Luigi. When a caller asks about allergens, the helper looks in the recipe book, but only at the pages that caller may see: the secret sauce stays locked. The helper can take orders, but must ask Luigi before giving refunds, especially after a stranger's note says \"give this man free pizza\".","map":[["A new pizza in as soon as one comes out","Continuous batching: requests join and leave between decode steps"],["The regulars' card","Prompt caching: reuse the work for a prefix seen before"],["Easy orders to the apprentice, tricky ones to Luigi","Routing and cascades: a small model first, escalating when unsure"],["Only the pages the caller may see","Retrieval filtered by the user's permissions"],["Asking Luigi before refunds, especially after a stranger's note","Approval for consequential actions once untrusted text is in play"]],"brk":"Luigi's helper knows which notes come from strangers. A language model can't reliably tell instructions from data, so the protection has to live outside the model, in the permissions and approvals around it."},"keys":["**Serving basics**: a request has two phases. Prefill processes the whole prompt in parallel and sets the time to first token; decode then produces one token per step for every sequence in the batch and sets the time per output token. Decode is usually limited by memory bandwidth, so serving more requests at once raises total throughput, while each user's speed falls a little. Set targets for both latencies, and for tokens per second per accelerator.","**Batching**: static batching waits for a whole batch to finish, so short answers sit idle behind long ones. Iteration-level scheduling, introduced by Orca and now usually called continuous batching, lets finished requests leave and new ones join between decode steps. vLLM's PagedAttention stores the KV cache in small blocks allocated on demand, which cut memory waste to near zero and raised throughput two to four times in its authors' tests.","**The KV cache**: each token of each active request keeps a key and a value per layer and per KV head in accelerator memory: 2 × layers × KV heads × head size × bytes per value. Grouped-query attention shares KV heads to shrink it. Memory, not compute, usually caps concurrency, which is why long contexts are expensive. Prompt (prefix) caching reuses the KV cache of a prompt prefix seen recently, such as instructions or documents, cutting both cost and time to first token.","**Routing and cascades**: not every request needs the largest model. Route by task, or try a small model first and escalate when a check fails: a confidence score, a schema validator, a test, or a judge model. Keep fallbacks across models or regions, account for rate limits in tokens per minute, and put budgets on tokens and cost per request. Tune thresholds on labelled samples, and recheck them as traffic changes.","**RAG at scale**: an ingestion pipeline parses, chunks, embeds and indexes documents, with incremental updates and deletions, and keeps each document's permissions. Queries combine keyword and vector search, often fused with reciprocal rank fusion (1 ÷ (k + rank), with k = 60 in the original paper), then rerank and filter by the user's permissions inside retrieval, so unauthorised text never reaches the prompt. Evaluate retrieval (did the right passages come back?) separately from generation (is the answer grounded in them?).","**Workflows and agents**: Anthropic's guidance separates workflows, where code orchestrates the model along predefined paths (prompt chaining, routing, parallelisation, orchestrator-workers, evaluator-optimiser), from agents, where the model directs its own steps and tool use. Start with the simplest design that works, and add agency only when it measurably helps. Invest in tool design, the agent-computer interface, and standard connections such as the Model Context Protocol (MCP).","**Agent safety**: OWASP's Top 10 for LLM applications starts with prompt injection, and includes excessive agency and unbounded consumption. The defences are architectural: allow-listed tools with least-privilege, per-user credentials; human approval for irreversible or high-value actions; budgets on steps, tokens and money; sandboxes; and traces of every step. Simon Willison's lethal trifecta (private data, untrusted content and a way to send data out) names the combination to break: after an agent reads untrusted content, consequential actions need a person.","**Evaluation and operations**: build an evaluation set for each task and run it on every prompt or model change, like regression tests; monitor quality samples, user feedback, cost per task and latency percentiles in production; ship changes in shadow mode or to a small slice first; and version prompts, models and indexes so a bad change can be rolled back."],"dia":[{"type":"flow","cap":"One request through an LLM serving stack","steps":[["Gateway","authentication, rate limits in tokens per minute, budgets"],["Router","choose a model by task and difficulty"],["Prefix cache","reuse the KV cache of a prompt prefix seen before"],["Scheduler","continuous batching on the accelerators"],["Stream","tokens go back to the client as they're generated"]],"note":"Time to first token is queueing plus prefill; the rest of the wait is decode steps, one token at a time."},{"type":"flow","cap":"RAG at scale","steps":[["Ingest","connectors, parsing and chunking, keeping each document's permissions"],["Index","keyword and vector indexes, updated incrementally"],["Retrieve","hybrid search, filtered by the user's permissions"],["Rerank","a stronger model picks the best passages"],["Generate","an answer with citations, logged for evaluation"]],"note":"A missing passage and a wrong answer from the right passages are different bugs: measure retrieval and generation separately."},{"type":"tiers","cap":"An agent platform: the policy layer decides, not the prompt","tiers":[["Agent",["model, instructions, conversation state"]],["Policy layer",["allow-listed tools","approval for irreversible actions, and for writes after untrusted input","budgets: steps, tokens, money"],"every proposed tool call"],["Tools",["read and write tools, often as MCP servers","scoped, per-user credentials"],"allowed calls only"],["Observability",["a trace of every step","evaluations and audits"],"everything"]],"note":"Instructions in the prompt can be overridden by injected text; permissions enforced by the platform can't."}],"cmp":[{"cap":"Serving levers and what they cost","head":["Lever","Helps","Costs"],"rows":[["Bigger batches","Throughput and cost per token","Each user's decode steps get slower"],["Continuous batching","Throughput, and less waiting behind long answers","A more complex scheduler"],["Prompt (prefix) caching","Time to first token and input cost, for repeated prefixes","Helps only exact prefix repeats; cache lifetimes are short"],["Smaller or quantised models","Cost and speed","Quality, which must be measured per task"],["Shorter prompts through retrieval","Cost and latency","Retrieval misses become answer misses"]]},{"cap":"Workflow or agent? (after Anthropic's guidance)","head":["","Workflow","Agent"],"rows":[["Who decides the steps","Your code","The model, as it goes"],["Best for","Well-defined tasks with known steps","Open-ended problems with unpredictable steps"],["Cost and latency","Predictable","Higher, and variable"],["Main risk","Rigid when the task varies","Errors that compound; needs guardrails and budgets"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Static and continuous batching on the same 64 requests","tabs":[{"lang":"python","src":"STEP_MS, PER_SEQUENCE_MS, MAX_BATCH = 20, 1, 16        # one decode step: 20 ms, plus 1 ms per sequence in the batch\nrand = mulberry32(5)\nLENGTHS = [20 + int(rand() * 380) for _ in range(64)]  # output tokens of 64 queued requests\n\ndef static_batching():\n    t, finished = 0, []\n    for start in range(0, len(LENGTHS), MAX_BATCH):\n        batch = LENGTHS[start:start + MAX_BATCH]\n        for step in range(1, max(batch) + 1):          # the whole batch runs until its longest request is done\n            t += STEP_MS + PER_SEQUENCE_MS * len(batch)\n            finished += [t] * batch.count(step)\n    return t, finished\n\ndef continuous_batching():\n    t, finished, queue, active = 0, [], list(LENGTHS), []\n    while queue or active:\n        while queue and len(active) < MAX_BATCH:\n            active.append(queue.pop(0))                # a free slot is refilled before the next step\n        t += STEP_MS + PER_SEQUENCE_MS * len(active)\n        active = [n - 1 for n in active]\n        finished += [t] * active.count(0)\n        active = [n for n in active if n > 0]\n    return t, finished\n\ndef secs(ms):                                           # milliseconds as seconds with one decimal, rounded half up\n    tenths = (ms + 50) // 100\n    return f\"{tenths // 10}.{tenths % 10}\"\n\ntokens = sum(LENGTHS)\nfor label, run in ((\"static batching\", static_batching), (\"continuous batching\", continuous_batching)):\n    total, finished = run()\n    mean = sum(finished) // len(finished)\n    print(f\"{label}: {tokens:,} tokens in {secs(total)} s, {tokens * 1000 // total:,} tokens/s, \"\n          f\"a request waits {secs(mean)} s on average\")\n","out":"static batching: 13,579 tokens in 55.9 s, 242 tokens/s, a request waits 28.1 s on average\ncontinuous batching: 13,579 tokens in 35.1 s, 387 tokens/s, a request waits 18.2 s on average\n","notes":[[1,"An illustrative cost model: each decode step has a fixed cost plus a little per sequence, because decode is limited by memory bandwidth."],[9,"Static batching: short answers finish early but their slots stay occupied until the longest one is done."],[18,"Continuous batching: a finished request's slot is refilled before the next step, as in Orca and vLLM."],[33,"Same requests, same hardware: about 60% more tokens a second, and requests wait less."]]},{"lang":"javascript","src":"const STEP_MS = 20, PER_SEQUENCE_MS = 1, MAX_BATCH = 16;   // one decode step: 20 ms, plus 1 ms per sequence in the batch\nconst rand = mulberry32(5);\nconst LENGTHS = Array.from({ length: 64 }, () => 20 + Math.floor(rand() * 380));   // output tokens of 64 queued requests\n\nfunction staticBatching() {\n  let t = 0;\n  const finished = [];\n  for (let start = 0; start < LENGTHS.length; start += MAX_BATCH) {\n    const batch = LENGTHS.slice(start, start + MAX_BATCH);\n    for (let step = 1; step <= Math.max(...batch); step++) {   // the whole batch runs until its longest request is done\n      t += STEP_MS + PER_SEQUENCE_MS * batch.length;\n      for (const n of batch) if (n === step) finished.push(t);\n    }\n  }\n  return [t, finished];\n}\n\nfunction continuousBatching() {\n  let t = 0, active = [];\n  const finished = [], queue = [...LENGTHS];\n  while (queue.length || active.length) {\n    while (queue.length && active.length < MAX_BATCH) active.push(queue.shift());   // a free slot is refilled before the next step\n    t += STEP_MS + PER_SEQUENCE_MS * active.length;\n    active = active.map(n => n - 1);\n    for (const n of active) if (n === 0) finished.push(t);\n    active = active.filter(n => n > 0);\n  }\n  return [t, finished];\n}\n\nfunction secs(ms) {                                    // milliseconds as seconds with one decimal, rounded half up\n  const tenths = Math.floor((ms + 50) / 100);\n  return `${Math.floor(tenths / 10)}.${tenths % 10}`;\n}\n\nconst tokens = LENGTHS.reduce((a, b) => a + b, 0);\nfor (const [label, run] of [[\"static batching\", staticBatching], [\"continuous batching\", continuousBatching]]) {\n  const [total, finished] = run();\n  const mean = Math.floor(finished.reduce((a, b) => a + b, 0) / finished.length);\n  console.log(`${label}: ${tokens.toLocaleString(\"en-US\")} tokens in ${secs(total)} s, ` +\n              `${Math.floor(tokens * 1000 / total).toLocaleString(\"en-US\")} tokens/s, a request waits ${secs(mean)} s on average`);\n}\n","out":"static batching: 13,579 tokens in 55.9 s, 242 tokens/s, a request waits 28.1 s on average\ncontinuous batching: 13,579 tokens in 35.1 s, 387 tokens/s, a request waits 18.2 s on average\n","notes":[[1,"An illustrative cost model: each decode step has a fixed cost plus a little per sequence, because decode is limited by memory bandwidth."],[10,"Static batching: short answers finish early but their slots stay occupied until the longest one is done."],[22,"Continuous batching: a finished request's slot is refilled before the next step, as in Orca and vLLM."],[40,"Same requests, same hardware: about 60% more tokens a second, and requests wait less."]]}]},{"t":"KV cache memory: why paged allocation fits far more requests","tabs":[{"lang":"python","src":"GiB = 2**30\nLAYERS, KV_HEADS, HEAD_DIM, BYTES = 32, 8, 128, 2      # an illustrative 8-billion-parameter model, 16-bit values\nper_token = 2 * LAYERS * KV_HEADS * HEAD_DIM * BYTES   # one key and one value vector per layer and KV head\nfree = 80 * GiB - 16 * GiB - 4 * GiB                   # an 80 GiB accelerator, minus weights, minus working memory\nprint(f\"KV cache: {per_token // 1024} KiB per token; {free // GiB} GiB holds {free // per_token:,} tokens\")\nprint(f\"with a key and value for each of 32 heads (no grouped-query attention): {free // (per_token * 4):,} tokens\")\n\nMAX_CONTEXT, BLOCK = 32_768, 16\nrand = mulberry32(9)\nlengths = [500 + int(rand() * 3_500) for _ in range(1_000)]   # prompt plus output tokens of real requests\nprint(f\"reserving the full {MAX_CONTEXT:,}-token context for each request: {free // (MAX_CONTEXT * per_token)} at once\")\nused = fitted = 0\nfor n in lengths:                                      # paged: 16-token blocks, allocated as the request grows\n    need = -(-n // BLOCK) * BLOCK * per_token\n    if used + need > free:\n        break\n    used, fitted = used + need, fitted + 1\nwaste = sum(-(-n // BLOCK) * BLOCK - n for n in lengths[:fitted]) * 1000 // sum(lengths[:fitted])\nprint(f\"allocating 16-token blocks as needed: {fitted} at once, with {waste // 10}.{waste % 10}% of the memory unused\")\n","out":"KV cache: 128 KiB per token; 60 GiB holds 491,520 tokens\nwith a key and value for each of 32 heads (no grouped-query attention): 122,880 tokens\nreserving the full 32,768-token context for each request: 15 at once\nallocating 16-token blocks as needed: 207 at once, with 0.3% of the memory unused\n","notes":[[3,"A key and a value per layer per KV head: 128 KiB for every token of every active request."],[6,"Grouped-query attention shares 8 KV heads among 32 query heads, shrinking the cache four times."],[11,"Reserving the maximum context for every request wastes most of the memory: only 15 fit."],[14,"Paged allocation, as in vLLM's PagedAttention: memory grows with each request's real length, in small blocks."]]},{"lang":"javascript","src":"const GiB = 2 ** 30;\nconst LAYERS = 32, KV_HEADS = 8, HEAD_DIM = 128, BYTES = 2;   // an illustrative 8-billion-parameter model, 16-bit values\nconst perToken = 2 * LAYERS * KV_HEADS * HEAD_DIM * BYTES;    // one key and one value vector per layer and KV head\nconst free = 80 * GiB - 16 * GiB - 4 * GiB;            // an 80 GiB accelerator, minus weights, minus working memory\nconst fmt = n => n.toLocaleString(\"en-US\");\nconsole.log(`KV cache: ${perToken / 1024} KiB per token; ${free / GiB} GiB holds ${fmt(Math.floor(free / perToken))} tokens`);\nconsole.log(`with a key and value for each of 32 heads (no grouped-query attention): ${fmt(Math.floor(free / (perToken * 4)))} tokens`);\n\nconst MAX_CONTEXT = 32768, BLOCK = 16;\nconst rand = mulberry32(9);\nconst lengths = Array.from({ length: 1000 }, () => 500 + Math.floor(rand() * 3500));   // prompt plus output tokens of real requests\nconsole.log(`reserving the full ${fmt(MAX_CONTEXT)}-token context for each request: ${Math.floor(free / (MAX_CONTEXT * perToken))} at once`);\nlet used = 0, fitted = 0;\nfor (const n of lengths) {                             // paged: 16-token blocks, allocated as the request grows\n  const need = Math.ceil(n / BLOCK) * BLOCK * perToken;\n  if (used + need > free) break;\n  used += need;\n  fitted++;\n}\nconst kept = lengths.slice(0, fitted);\nconst waste = Math.floor(kept.reduce((s, n) => s + Math.ceil(n / BLOCK) * BLOCK - n, 0) * 1000 / kept.reduce((s, n) => s + n, 0));\nconsole.log(`allocating 16-token blocks as needed: ${fitted} at once, with ${Math.floor(waste / 10)}.${waste % 10}% of the memory unused`);\n","out":"KV cache: 128 KiB per token; 60 GiB holds 491,520 tokens\nwith a key and value for each of 32 heads (no grouped-query attention): 122,880 tokens\nreserving the full 32,768-token context for each request: 15 at once\nallocating 16-token blocks as needed: 207 at once, with 0.3% of the memory unused\n","notes":[[3,"A key and a value per layer per KV head: 128 KiB for every token of every active request."],[7,"Grouped-query attention shares 8 KV heads among 32 query heads, shrinking the cache four times."],[12,"Reserving the maximum context for every request wastes most of the memory: only 15 fit."],[15,"Paged allocation, as in vLLM's PagedAttention: memory grows with each request's real length, in small blocks."]]}]},{"t":"Hybrid retrieval with reciprocal rank fusion, and where the permission filter goes","tabs":[{"lang":"python","src":"import math\n\nDOCS = [                                               # (title, groups who may read it, toy embedding)\n    (\"How to reset your password\", {\"staff\"}, (0.5, 0.85, 0.1)),\n    (\"SSO login troubleshooting\", {\"staff\"}, (0.9, 0.2, 0.1)),\n    (\"Password policy for admins\", {\"admins\"}, (0.1, 0.6, 0.8)),\n    (\"Reset a lost MFA device\", {\"staff\"}, (0.7, 0.3, 0.2)),\n    (\"SSO password reset tool for IT\", {\"it\"}, (0.8, 0.55, 0.1)),\n    (\"Expense policy\", {\"staff\"}, (0.0, 0.0, 1.0)),\n    (\"Locked out of your account\", {\"staff\"}, (0.8, 0.5, 0.1)),\n    (\"Admin password rotation runbook\", {\"admins\"}, (0.2, 0.7, 0.6)),\n]\nQUERY, QUERY_VECTOR = \"reset password sso\", (0.8, 0.6, 0.0)\n\ndef keyword_score(title):                              # query words found in the title: a stand-in for BM25\n    words = title.lower().split()\n    return sum(1 for w in QUERY.split() if w in words)\n\ndef dot(a, b):                                         # a plain running total, as in the JavaScript version\n    total = 0.0\n    for x, y in zip(a, b):\n        total += x * y\n    return total\n\ndef cosine(a, b):\n    return dot(a, b) / (math.sqrt(dot(a, a)) * math.sqrt(dot(b, b)))\n\ndef ranking(ids, score):                               # best first; ties broken by id\n    return sorted(ids, key=lambda i: (-score(i), i))\n\ndef fuse(rankings, k=60):                              # reciprocal rank fusion\n    scores = {}\n    for r in rankings:\n        for rank, i in enumerate(r, start=1):\n            scores[i] = scores.get(i, 0) + 1 / (k + rank)\n    return sorted(scores, key=lambda i: (-scores[i], i))\n\ndef search(ids, top=3):\n    by_words = [i for i in ranking(ids, lambda i: keyword_score(DOCS[i][0])) if keyword_score(DOCS[i][0]) > 0]\n    by_meaning = ranking(ids, lambda i: cosine(DOCS[i][2], QUERY_VECTOR))\n    return by_words[:top], by_meaning[:top], fuse([by_words, by_meaning])[:top]\n\ntitles = lambda ids: \"; \".join(DOCS[i][0] for i in ids)\nwords, meaning, hybrid = search(range(len(DOCS)))\nprint(f\"keywords only: {titles(words)}\")\nprint(f\"embeddings only: {titles(meaning)}\")\nprint(f\"hybrid, reciprocal rank fusion: {titles(hybrid)}\")\nstaff = [i for i in range(len(DOCS)) if \"staff\" in DOCS[i][1]]\nprint(f\"for staff, filtering the top 3 afterwards: {titles([i for i in hybrid if i in staff])}\")\nprint(f\"for staff, filtering before ranking: {titles(search(staff)[2])}\")\n","out":"keywords only: SSO password reset tool for IT; How to reset your password; SSO login troubleshooting\nembeddings only: SSO password reset tool for IT; Locked out of your account; Reset a lost MFA device\nhybrid, reciprocal rank fusion: SSO password reset tool for IT; How to reset your password; SSO login troubleshooting\nfor staff, filtering the top 3 afterwards: How to reset your password; SSO login troubleshooting\nfor staff, filtering before ranking: How to reset your password; Reset a lost MFA device; SSO login troubleshooting\n","notes":[[15,"A stand-in for BM25: exact words such as product names and error codes are what keyword search is good at."],[31,"Reciprocal rank fusion needs only ranks, not comparable scores, so keyword and vector results combine cleanly."],[49,"Filtering after ranking returns fewer results, and the unauthorised document was already in hand."],[50,"Filter inside retrieval, with the user's identity, so documents they can't read never reach the prompt."]]},{"lang":"javascript","src":"const DOCS = [                                         // [title, groups who may read it, toy embedding]\n  [\"How to reset your password\", [\"staff\"], [0.5, 0.85, 0.1]],\n  [\"SSO login troubleshooting\", [\"staff\"], [0.9, 0.2, 0.1]],\n  [\"Password policy for admins\", [\"admins\"], [0.1, 0.6, 0.8]],\n  [\"Reset a lost MFA device\", [\"staff\"], [0.7, 0.3, 0.2]],\n  [\"SSO password reset tool for IT\", [\"it\"], [0.8, 0.55, 0.1]],\n  [\"Expense policy\", [\"staff\"], [0.0, 0.0, 1.0]],\n  [\"Locked out of your account\", [\"staff\"], [0.8, 0.5, 0.1]],\n  [\"Admin password rotation runbook\", [\"admins\"], [0.2, 0.7, 0.6]],\n];\nconst QUERY = \"reset password sso\", QUERY_VECTOR = [0.8, 0.6, 0.0];\n\nfunction keywordScore(title) {                         // query words found in the title: a stand-in for BM25\n  const words = title.toLowerCase().split(\" \");\n  return QUERY.split(\" \").filter(w => words.includes(w)).length;\n}\n\nconst dot = (a, b) => a.reduce((total, x, i) => total + x * b[i], 0);\n\nfunction cosine(a, b) {\n  return dot(a, b) / (Math.sqrt(dot(a, a)) * Math.sqrt(dot(b, b)));\n}\n\nconst ranking = (ids, score) => [...ids].sort((a, b) => score(b) - score(a) || a - b);   // best first; ties broken by id\n\nfunction fuse(rankings, k = 60) {                      // reciprocal rank fusion\n  const scores = new Map();\n  for (const r of rankings) r.forEach((i, index) => scores.set(i, (scores.get(i) ?? 0) + 1 / (k + index + 1)));\n  return [...scores.keys()].sort((a, b) => scores.get(b) - scores.get(a) || a - b);\n}\n\nfunction search(ids, top = 3) {\n  const byWords = ranking(ids, i => keywordScore(DOCS[i][0])).filter(i => keywordScore(DOCS[i][0]) > 0);\n  const byMeaning = ranking(ids, i => cosine(DOCS[i][2], QUERY_VECTOR));\n  return [byWords.slice(0, top), byMeaning.slice(0, top), fuse([byWords, byMeaning]).slice(0, top)];\n}\n\nconst titles = ids => ids.map(i => DOCS[i][0]).join(\"; \");\nconst everyone = DOCS.map((_, i) => i);\nconst [words, meaning, hybrid] = search(everyone);\nconsole.log(`keywords only: ${titles(words)}`);\nconsole.log(`embeddings only: ${titles(meaning)}`);\nconsole.log(`hybrid, reciprocal rank fusion: ${titles(hybrid)}`);\nconst staff = everyone.filter(i => DOCS[i][1].includes(\"staff\"));\nconsole.log(`for staff, filtering the top 3 afterwards: ${titles(hybrid.filter(i => staff.includes(i)))}`);\nconsole.log(`for staff, filtering before ranking: ${titles(search(staff)[2])}`);\n","out":"keywords only: SSO password reset tool for IT; How to reset your password; SSO login troubleshooting\nembeddings only: SSO password reset tool for IT; Locked out of your account; Reset a lost MFA device\nhybrid, reciprocal rank fusion: SSO password reset tool for IT; How to reset your password; SSO login troubleshooting\nfor staff, filtering the top 3 afterwards: How to reset your password; SSO login troubleshooting\nfor staff, filtering before ranking: How to reset your password; Reset a lost MFA device; SSO login troubleshooting\n","notes":[[13,"A stand-in for BM25: exact words such as product names and error codes are what keyword search is good at."],[26,"Reciprocal rank fusion needs only ranks, not comparable scores, so keyword and vector results combine cleanly."],[45,"Filtering after ranking returns fewer results, and the unauthorised document was already in hand."],[46,"Filter inside retrieval, with the user's identity, so documents they can't read never reach the prompt."]]}]}],"ex":{"q":"A large model gets 95% of your requests right at 15 cost units each; a small model gets 65% right at 1 unit, and reports a confidence score. On a labelled sample of 2,000 requests, find the cheapest cascade (accept the small model's answer when its confidence clears a threshold, otherwise escalate to the large model) that gets at least 92% right.","steps":["Label a representative sample: for each request, whether each model's answer is right, and the small model's confidence.","For a threshold, accept the small model's answer when its confidence reaches it; otherwise pay for the large model too.","Sweep the threshold, and measure accuracy and average cost at each value.","Pick the cheapest threshold that meets the target, then monitor it in production: the traffic mix drifts."],"code":{"t":"Tuning a model cascade on a labelled sample","tabs":[{"lang":"python","src":"SMALL_COST, LARGE_COST = 1, 15                         # illustrative cost units per request\nrand = mulberry32(21)\nREQUESTS = []                                          # a labelled sample: (difficulty, small model's confidence), per mille\nfor _ in range(2_000):\n    difficulty = int(rand() * 1000)\n    noise = int(rand() * 300) - 150\n    REQUESTS.append((difficulty, max(0, min(1000, 1000 - difficulty + noise))))\n\ndef small_right(difficulty):\n    return difficulty < 650                            # the small model gets the easier 65% right\n\ndef large_right(difficulty):\n    return difficulty < 950                            # the large model gets 95% right\n\ndef cascade(threshold):                                # accept the small model's answer when it's confident enough\n    right = cost = 0\n    for difficulty, confidence in REQUESTS:\n        cost += SMALL_COST\n        if confidence >= threshold:\n            right += small_right(difficulty)\n        else:\n            cost += LARGE_COST                         # escalate, and pay for both calls\n            right += large_right(difficulty)\n    return right * 1000 // len(REQUESTS), cost * 100 // len(REQUESTS)\n\ndef show(per_mille, hundredths):\n    return f\"{per_mille // 10}.{per_mille % 10}% right, {hundredths // 100}.{hundredths % 100:02d} a request\"\n\nn = len(REQUESTS)\nprint(f\"large model only: {show(sum(large_right(d) for d, _ in REQUESTS) * 1000 // n, LARGE_COST * 100)}\")\nprint(f\"small model only: {show(sum(small_right(d) for d, _ in REQUESTS) * 1000 // n, SMALL_COST * 100)}\")\nbest = None\nfor threshold in range(0, 1001, 50):                   # sweep the confidence threshold in steps of 5%\n    accuracy, cost = cascade(threshold)\n    if threshold % 200 == 0:\n        print(f\"cascade, small model trusted at {threshold // 10}% confidence or more: {show(accuracy, cost)}\")\n    if accuracy >= 920 and (best is None or cost < best[2]):\n        best = (threshold, accuracy, cost)\nsaving = (LARGE_COST * 100 - best[2]) * 100 // (LARGE_COST * 100)\nprint(f\"cheapest cascade with at least 92% right: trust at {best[0] // 10}%, {show(best[1], best[2])}, {saving}% cheaper than the large model alone\")\n","out":"large model only: 95.0% right, 15.00 a request\nsmall model only: 64.9% right, 1.00 a request\ncascade, small model trusted at 0% confidence or more: 64.9% right, 1.00 a request\ncascade, small model trusted at 20% confidence or more: 80.0% right, 4.01 a request\ncascade, small model trusted at 40% confidence or more: 92.9% right, 7.15 a request\ncascade, small model trusted at 60% confidence or more: 95.0% right, 10.44 a request\ncascade, small model trusted at 80% confidence or more: 95.0% right, 13.22 a request\ncascade, small model trusted at 100% confidence or more: 95.0% right, 15.53 a request\ncheapest cascade with at least 92% right: trust at 40%, 92.9% right, 7.15 a request, 52% cheaper than the large model alone\n"},{"lang":"javascript","src":"const SMALL_COST = 1, LARGE_COST = 15;                 // illustrative cost units per request\nconst rand = mulberry32(21);\nconst REQUESTS = [];                                   // a labelled sample: [difficulty, small model's confidence], per mille\nfor (let r = 0; r < 2000; r++) {\n  const difficulty = Math.floor(rand() * 1000);\n  const noise = Math.floor(rand() * 300) - 150;\n  REQUESTS.push([difficulty, Math.max(0, Math.min(1000, 1000 - difficulty + noise))]);\n}\n\nconst smallRight = difficulty => difficulty < 650;     // the small model gets the easier 65% right\nconst largeRight = difficulty => difficulty < 950;     // the large model gets 95% right\n\nfunction cascade(threshold) {                          // accept the small model's answer when it's confident enough\n  let right = 0, cost = 0;\n  for (const [difficulty, confidence] of REQUESTS) {\n    cost += SMALL_COST;\n    if (confidence >= threshold) {\n      right += smallRight(difficulty) ? 1 : 0;\n    } else {\n      cost += LARGE_COST;                              // escalate, and pay for both calls\n      right += largeRight(difficulty) ? 1 : 0;\n    }\n  }\n  return [Math.floor(right * 1000 / REQUESTS.length), Math.floor(cost * 100 / REQUESTS.length)];\n}\n\nconst show = (perMille, hundredths) =>\n  `${Math.floor(perMille / 10)}.${perMille % 10}% right, ${Math.floor(hundredths / 100)}.${String(hundredths % 100).padStart(2, \"0\")} a request`;\n\nconst n = REQUESTS.length;\nconsole.log(`large model only: ${show(Math.floor(REQUESTS.filter(([d]) => largeRight(d)).length * 1000 / n), LARGE_COST * 100)}`);\nconsole.log(`small model only: ${show(Math.floor(REQUESTS.filter(([d]) => smallRight(d)).length * 1000 / n), SMALL_COST * 100)}`);\nlet best = null;\nfor (let threshold = 0; threshold <= 1000; threshold += 50) {   // sweep the confidence threshold in steps of 5%\n  const [accuracy, cost] = cascade(threshold);\n  if (threshold % 200 === 0) {\n    console.log(`cascade, small model trusted at ${Math.floor(threshold / 10)}% confidence or more: ${show(accuracy, cost)}`);\n  }\n  if (accuracy >= 920 && (best === null || cost < best[2])) best = [threshold, accuracy, cost];\n}\nconst saving = Math.floor((LARGE_COST * 100 - best[2]) * 100 / (LARGE_COST * 100));\nconsole.log(`cheapest cascade with at least 92% right: trust at ${Math.floor(best[0] / 10)}%, ${show(best[1], best[2])}, ${saving}% cheaper than the large model alone`);\n","out":"large model only: 95.0% right, 15.00 a request\nsmall model only: 64.9% right, 1.00 a request\ncascade, small model trusted at 0% confidence or more: 64.9% right, 1.00 a request\ncascade, small model trusted at 20% confidence or more: 80.0% right, 4.01 a request\ncascade, small model trusted at 40% confidence or more: 92.9% right, 7.15 a request\ncascade, small model trusted at 60% confidence or more: 95.0% right, 10.44 a request\ncascade, small model trusted at 80% confidence or more: 95.0% right, 13.22 a request\ncascade, small model trusted at 100% confidence or more: 95.0% right, 15.53 a request\ncheapest cascade with at least 92% right: trust at 40%, 92.9% right, 7.15 a request, 52% cheaper than the large model alone\n"}]},"a":"Trusting the small model at 40% confidence or more gets 92.9% right for 7.15 units a request, 52% cheaper than sending everything to the large model, which costs 15.00 for 95.0%. Raising the threshold buys back accuracy at a steep price, and trusting the small model more falls below the target. The numbers are illustrative; the method isn't: a labelled sample, a sweep, a target, and monitoring afterwards. In practice the confidence signal might be a validator (the JSON parses, the tests pass), a judge model, or the model's own scores, and it's only as good as its correlation with being right."},"fade":{"q":"Finish `decide(tool, step, tainted)` for an agent platform's policy layer. Check, in order: a tool that isn't on the allow-list is denied; a call beyond the step budget is denied; an irreversible tool always needs a person; a write needs a person once untrusted content is in the context; everything else is allowed. Return the decision and a reason.","steps":["Deny first: unknown tools and exhausted budgets end the run whatever else is true.",{"ask":"Why does reading a web page change what a later email needs?","a":"Text on the page can carry instructions the model may follow: prompt injection. With private data in context and a way to send data out, that's the lethal trifecta, so after untrusted input any consequential action goes to a person."},{"ask":"Why enforce this in code rather than in the prompt?","a":"Instructions in the prompt can be overridden by injected text. The policy layer runs outside the model, sees every proposed call, and can't be talked out of its rules."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"TOOLS = {\"search_docs\": \"read\", \"read_ticket\": \"read\", \"fetch_url\": \"untrusted\", \"issue_refund\": \"write\",\n         \"send_email\": \"write\", \"delete_account\": \"irreversible\"}   # the allow-list, with each tool's risk\nMAX_STEPS = 7\nWHY_ALLOWED = {\"read\": \"read-only\", \"untrusted\": \"read-only, but what it returns is untrusted\",\n               \"write\": \"a write, and nothing untrusted has been read\"}\n\ndef decide(tool, step, tainted):                       # returns (decision, reason); step counts from 1\n    ...                                                # TODO: allow, ask a human, or deny, in this order of checks:\n    return \"deny\", \"not written yet\"                   # unknown tool, step budget, irreversible, write after untrusted input\n"},{"lang":"javascript","src":"const TOOLS = { search_docs: \"read\", read_ticket: \"read\", fetch_url: \"untrusted\", issue_refund: \"write\",\n                send_email: \"write\", delete_account: \"irreversible\" };   // the allow-list, with each tool's risk\nconst MAX_STEPS = 7;\nconst WHY_ALLOWED = { read: \"read-only\", untrusted: \"read-only, but what it returns is untrusted\",\n                      write: \"a write, and nothing untrusted has been read\" };\n\nfunction decide(tool, step, tainted) {                 // returns [decision, reason]; step counts from 1\n  // TODO: allow, ask a human, or deny, in this order of checks:\n  // unknown tool, step budget, irreversible, write after untrusted input\n  return [\"deny\", \"not written yet\"];\n}\n"}]},"solution":{"t":"Solution: deny, then ask, then allow","tabs":[{"lang":"python","src":"TOOLS = {\"search_docs\": \"read\", \"read_ticket\": \"read\", \"fetch_url\": \"untrusted\", \"issue_refund\": \"write\",\n         \"send_email\": \"write\", \"delete_account\": \"irreversible\"}   # the allow-list, with each tool's risk\nMAX_STEPS = 7\nWHY_ALLOWED = {\"read\": \"read-only\", \"untrusted\": \"read-only, but what it returns is untrusted\",\n               \"write\": \"a write, and nothing untrusted has been read\"}\n\ndef decide(tool, step, tainted):                       # returns (decision, reason); step counts from 1\n    if tool not in TOOLS:\n        return \"deny\", \"not on the allow-list\"\n    if step > MAX_STEPS:\n        return \"deny\", \"step budget used up\"\n    risk = TOOLS[tool]\n    if risk == \"irreversible\":\n        return \"ask\", \"can't be undone: a person approves\"\n    if risk == \"write\" and tainted:\n        return \"ask\", \"untrusted content is in the context\"\n    return \"allow\", WHY_ALLOWED[risk]\n\ntainted = False\nplan = [\"search_docs\", \"read_ticket\", \"issue_refund\", \"fetch_url\", \"send_email\", \"delete_account\", \"run_shell\", \"search_docs\"]\nfor step, tool in enumerate(plan, start=1):\n    decision, reason = decide(tool, step, tainted)\n    print(f\"{step}. {tool}: {decision} ({reason})\")\n    if decision == \"allow\" and TOOLS[tool] == \"untrusted\":\n        tainted = True                                 # a web page may carry instructions; from now on, writes need a person\n","out":"1. search_docs: allow (read-only)\n2. read_ticket: allow (read-only)\n3. issue_refund: allow (a write, and nothing untrusted has been read)\n4. fetch_url: allow (read-only, but what it returns is untrusted)\n5. send_email: ask (untrusted content is in the context)\n6. delete_account: ask (can't be undone: a person approves)\n7. run_shell: deny (not on the allow-list)\n8. search_docs: deny (step budget used up)\n"},{"lang":"javascript","src":"const TOOLS = { search_docs: \"read\", read_ticket: \"read\", fetch_url: \"untrusted\", issue_refund: \"write\",\n                send_email: \"write\", delete_account: \"irreversible\" };   // the allow-list, with each tool's risk\nconst MAX_STEPS = 7;\nconst WHY_ALLOWED = { read: \"read-only\", untrusted: \"read-only, but what it returns is untrusted\",\n                      write: \"a write, and nothing untrusted has been read\" };\n\nfunction decide(tool, step, tainted) {                 // returns [decision, reason]; step counts from 1\n  if (!(tool in TOOLS)) return [\"deny\", \"not on the allow-list\"];\n  if (step > MAX_STEPS) return [\"deny\", \"step budget used up\"];\n  const risk = TOOLS[tool];\n  if (risk === \"irreversible\") return [\"ask\", \"can't be undone: a person approves\"];\n  if (risk === \"write\" && tainted) return [\"ask\", \"untrusted content is in the context\"];\n  return [\"allow\", WHY_ALLOWED[risk]];\n}\n\nlet tainted = false;\nconst plan = [\"search_docs\", \"read_ticket\", \"issue_refund\", \"fetch_url\", \"send_email\", \"delete_account\", \"run_shell\", \"search_docs\"];\nplan.forEach((tool, index) => {\n  const [decision, reason] = decide(tool, index + 1, tainted);\n  console.log(`${index + 1}. ${tool}: ${decision} (${reason})`);\n  if (decision === \"allow\" && TOOLS[tool] === \"untrusted\") tainted = true;   // a web page may carry instructions; from now on, writes need a person\n});\n","out":"1. search_docs: allow (read-only)\n2. read_ticket: allow (read-only)\n3. issue_refund: allow (a write, and nothing untrusted has been read)\n4. fetch_url: allow (read-only, but what it returns is untrusted)\n5. send_email: ask (untrusted content is in the context)\n6. delete_account: ask (can't be undone: a person approves)\n7. run_shell: deny (not on the allow-list)\n8. search_docs: deny (step budget used up)\n"}]}},"traps":[["“Use the biggest model for everything; quality comes first.”","Most requests don't need it. Route by task or difficulty, measure each model's accuracy per task, and pay for the large model only where it changes the answer."],["“Batch size one gives the best latency, so serve that way.”","It wastes the accelerator and queues everyone else. Continuous batching gives high throughput with modest per-user cost; tune the batch to your latency targets."],["“The context window is our memory: put everything in.”","Every token costs money and time on every call, and memory per request. Retrieve what's needed, summarise history, and cache stable prefixes."],["“Vector search is all we need.”","Exact terms such as error codes, names and product numbers are found better by keyword search. Use hybrid retrieval and reranking, and measure recall."],["“The system prompt tells the model to ignore injected instructions.”","Models can't reliably separate instructions from data. Enforce permissions, approvals and budgets outside the model."],["“The demo works, so ship it.”","Without an evaluation set you can't tell whether the next prompt or model change made things worse. Test every change, then monitor quality, cost and latency in production."]],"disc":[["Design an assistant that answers employees' questions from two million documents with per-document permissions.","Ingestion: connectors per source, parsing and chunking, embeddings, with each chunk carrying its document's access list, and incremental updates so edits and deletions arrive within an agreed time. Retrieval: hybrid keyword and vector search filtered by the user's identity inside the index, then reranking, so unauthorised text never reaches the model; the answer cites its sources. Operations: an evaluation set for retrieval recall and answer groundedness, prompt caching for the fixed instructions, a smaller model for simple questions, per-user rate limits, and monitoring of cost, latency and feedback."],["Your company wants agents that act in production systems, such as issuing refunds or changing accounts. Which platform capabilities would you insist on first?","A policy layer outside the model: allow-listed tools with narrow scopes and per-user credentials, human approval for irreversible or high-value actions and for any write after untrusted input, and budgets on steps, tokens and money. Idempotent tools with dry-run modes, sandboxes for testing, and a full trace and audit log of every step. Then an evaluation suite, a shadow-mode rollout before acting for real, rate limits, a kill switch, and an incident process for when it does something wrong."]],"teach":{"prompt":"Explain to a junior colleague how you'd make an LLM feature fast, affordable and safe.","rubric":["Prefill and decode, time to first token and time per token; continuous batching and the KV cache","Cost levers: routing or cascades, prompt caching, shorter prompts through retrieval","RAG: hybrid retrieval, reranking, permission filtering inside retrieval, evaluation","Agents: the simplest workflow first, a policy layer with allow-lists, approvals and budgets","Evaluation sets on every change, and monitoring in production"],"model":"For speed I'd look at the two phases: prefill, which sets the time to first token, and decode, which produces one token per step. Serving with continuous batching keeps the accelerators busy, and the KV cache, not compute, usually limits how many requests run at once. For cost, I'd route simple requests to a smaller model, escalating when a check fails, cache the stable prompt prefix, and keep prompts short by retrieving only the passages needed. Retrieval would be hybrid, keyw
