be used."],["“Any block size works for Mo's algorithm.”","The left end moves up to B per query and the right end up to n per block, about q × B + n² / B steps. B ≈ n / √q balances them at O(n √q); too small or too large a block can be many times slower."],["“Square-root decomposition is just a slow segment tree.”","It is slower per query, O(√n) against O(log n), but it handles summaries that don't merge, such as sorted blocks for “how many values ≤ x”, with very little code."],["“A skip list is only fast for lucky inputs.”","Its speed comes from its own coin flips, not from the input, so no input order makes it slow. The O(log n) is expected over the coin flips, for every input."]],"disc":[["When would you choose square-root decomposition over a segment tree?","When a block's summary is easy to keep but two summaries don't merge neatly: sorted blocks for “how many ≤ x”, a frequency table per block, or a bulk operation that's simple to hold lazily for a whole block. It's also quick to write correctly under time pressure. When the operation does merge (sum, min, gcd), a segment tree's O(log n) wins."],["Where are skip lists used in real systems?","Redis keeps each sorted set in a skip list paired with a hash table, and LevelDB and RocksDB buffer recent writes in a skip-list memtable before flushing them to disk. Skip lists need no rebalancing, give ordered scans for free and suit concurrent versions, which is why they appear where a balanced tree would be harder to maintain."]],"teach":{"prompt":"Explain to a junior colleague when you'd use a sparse table, square-root blocks, Mo's algorithm or a skip list, and what each costs.","rubric":["Sparse table: static data, idempotent operations, O(n log n) build, O(1) query","Square-root blocks: about √n blocks of about √n, O(√n) per operation, flexible summaries","Mo's algorithm: offline, sort by block of l then r, O(n √q) pointer moves","Skip list: random levels, expected O(log n), no rebalancing","Choose by static or not, online or offline, mergeable or not"],"model":"If the array never changes and the operation is idempotent, like min, max or gcd, I'd build a sparse table: it stores every power-of-two block in O(n log n) and answers any range with two overlapping blocks in O(1). If there are updates and the operation merges neatly, a Fenwick or segment tree is the default. When the per-block summary is easy but merging is awkward, like counting values ≤ x, I'd cut the array into √n blocks of √n and pay O(√n) per operation, which is very little code. When all queries are known in advance and I can add or remove one element cheaply, like counting distinct values, Mo's algorithm sorts the queries by the block of l and then by r and slides one window across them, about O(n √q) steps in all. And when I need a sorted set I build myself, a skip list gives expected O(log n) search, insert and delete using random levels instead of rotations."},"qa":[["How fast is a sparse table?","O(n log n) to build, then O(1) per query for idempotent operations such as min, max and gcd."],["Why must a sparse table's operation be idempotent?","The two blocks of a query overlap, so an element counted twice must not change the answer."],["Which block size does Mo's algorithm use?","About n / √q (√n when q ≈ n), with queries sorted by block of l, then by r."],["What does Mo's algorithm need?","Every query in advance, and O(1) add and remove of one element."],["How does a skip list stay fast without rebalancing?","Each node joins each next level with probability 1/2, giving about log₂ n levels and expected O(log n) steps."],["What does square-root decomposition cost per operation?","O(√n) with blocks of about √n, times log n if each block is binary searched."]],"quiz":[{"q":"What does this print? (`SparseTable` is this module's helper; `t` holds one list per level.)","snip":{"t":"A small sparse table","tabs":[{"lang":"python","src":"st = SparseTable([4, 6, 1, 5, 3], min)\nprint(st.query(0, 4), st.query(1, 3), st.query(3, 4), len(st.t))\n"},{"lang":"javascript","src":"const st = new SparseTable([4, 6, 1, 5, 3], Math.min);\nconsole.log(st.query(0, 4), st.query(1, 3), st.query(3, 4), st.t.length);\n"}]},"o":["1 1 3 3","1 1 3 2","1 5 3 3","4 1 3 3"],"a":0,"e":"The minimum of everything is 1, of 6 1 5 it is 1, and of 5 3 it is 3. With n = 5 there are levels for lengths 1, 2 and 4: 8 doesn't fit, so 3 levels."},{"q":"What does this print?","snip":{"t":"Mo's order with block size 3","tabs":[{"lang":"python","src":"B = 3\nqs = [(0, 8), (1, 2), (4, 5), (3, 9), (7, 7)]\nkey = lambda i: (qs[i][0] // B, qs[i][1] if qs[i][0] // B % 2 == 0 else -qs[i][1])\nprint(*sorted(range(len(qs)), key=key))\n"},{"lang":"javascript","src":"const B = 3, qs = [[0, 8], [1, 2], [4, 5], [3, 9], [7, 7]];\nconst block = i => Math.floor(qs[i][0] / B);\nconst order = [...qs.keys()].sort((i, j) => block(i) - block(j) || (block(i) % 2 === 0 ? qs[i][1] - qs[j][1] : qs[j][1] - qs[i][1]));\nconsole.log(...order);\n"}]},"o":["1 0 3 2 4","0 1 2 3 4","1 0 2 3 4","1 0 3 4 2"],"a":0,"e":"Block 0 (l = 0, 1) is sorted by rising r: queries 1 (r = 2) then 0 (r = 8). Block 1 (l = 3, 4) is odd, so r falls: 3 (r = 9) then 2 (r = 5). Query 4 is alone in block 2."},{"q":"Why can a sparse table answer a range minimum with two overlapping blocks but not a range sum?","o":["min is idempotent: an element counted twice doesn't change a minimum, but it changes a sum","Sums need more than O(n log n) memory","For minimum queries the two blocks never overlap","Sums can be negative"],"a":0,"e":"The overlap is the point: min(x, x) = x, while x + x ≠ x. Memory is the same for both, the blocks often overlap, and the sign of the numbers doesn't matter."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["Mo's algorithm needs every query before it answers any of them","A skip list's search, insert and delete take O(log n) expected time","A sparse table handles point updates in O(log n)","Square-root decomposition answers every query in O(log n)","Mo's algorithm only works for range sums"],"a":[0,1],"e":"Mo's sorts the queries, so it's offline, and a skip list's levels give expected O(log n). A sparse table update touches O(n) entries, square-root blocks cost O(√n), and Mo's handles any answer with cheap add and remove, such as distinct counts."},{"q":"Judge each statement.","t":"yn","s":[["With blocks of about √n, a range query touches O(√n) whole blocks and O(√n) loose elements.",true],["In Mo's algorithm, adding or removing one element must be cheap, ideally O(1).",true],["A sparse table query is O(log n) because it combines log n blocks.",false],["A skip list stays balanced with rotations, like a red-black tree.",false]],"e":"There are about √n blocks and at most two partial ones. Mo's moves the window O(n √q) steps, so each step must be cheap. A sparse table combines just two blocks in O(1), and a skip list uses random levels, never rotations."},{"q":"Put the steps of Mo's algorithm in order.","t":"ord","items":["Read every query and remember its position","Sort the queries by the block of l, then by r","Move the window's ends one step at a time to each query's range, updating the answer","Write each answer back to its query's original position"],"e":"Sorting needs all the queries, the window walks them in the sorted order, and only then can the answers go back in the original order."},{"q":"Complete the Python range-minimum query on a sparse table `t`.","t":"drop","lang":"python","code":"def range_min(t, l, r):                       # t[j][i] = min of a[i .. i + 2^j - 1]\n    j = {{0}}\n    return min(t[j][l], {{1}})\n","blanks":[{"o":["(r - l + 1).bit_length() - 1","(r - l).bit_length()","(r - l + 1).bit_length()","r - l"],"a":0},{"o":["t[j][r - (1 << j) + 1]","t[j][r]","t[j][r - (1 << j)]","t[j][l + 1]"],"a":0}],"e":"j is the largest power of two that fits in the range's length, and the second block is the one of that length that ends exactly at r."},{"q":"Match each task to the structure that suits it best.","t":"match","pairs":[["Many range-minimum queries on an array that never changes","A sparse table: O(1) per query"],["Distinct values in many ranges, all known in advance","Mo's algorithm"],["Count values ≤ x in a range, with point updates","Square-root blocks with sorted copies"],["A sorted set with expected O(log n) operations and no rotations","A skip list"]],"extra":["A hash map of prefix sums"],"e":"Static minimums are what sparse tables do best, offline add/remove answers suit Mo's, “≤ x” counting needs sorted blocks, and random levels replace rotations in a skip list. Prefix sums in a hash map answer subarray-sum questions, not these."}],"probs":[["CSES 1647 · Static Range Minimum Queries","https://cses.fi/problemset/task/1647","","a sparse table with min: O(1) per query"],["CSES 1649 · Dynamic Range Minimum Queries","https://cses.fi/problemset/task/1649","","updates rule out a sparse table: try √n blocks with a minimum per block, then compare with a segment tree"],["CSES 1144 · Salary Queries","https://cses.fi/problemset/task/1144","","counts in a value range with updates: sorted √n blocks (code block 2), or compress the values for a Fenwick tree"],["CSES 1734 · Distinct Values Queries","https://cses.fi/problemset/task/1734","","Mo's algorithm after compressing the values (code block 3); an offline Fenwick tree by last occurrence is faster"],["LC 1157 · Online Majority Element In Subarray","https://leetcode.com/problems/online-majority-element-in-subarray/","Hard","the worked example: Boyer–Moore summaries in a segment tree, checked with position lists"],["LC 1206 · Design Skiplist","https://leetcode.com/problems/design-skiplist/","Hard","the faded example: random levels and an update array of the last smaller node per level"]],"src":[["cp-algorithms: Sparse table","https://cp-algorithms.com/data_structures/sparse-table.html"],["cp-algorithms: Sqrt decomposition, with Mo's algorithm","https://cp-algorithms.com/data_structures/sqrt_decomposition.html"],["Wikipedia: Skip list","https://en.wikipedia.org/wiki/Skip_list"],["Redis documentation: Sorted sets (implemented with a skip list and a hash table)","https://redis.io/docs/latest/develop/data-types/sorted-sets/"],["CSES Problem Set (range queries section)","https://cses.fi/problemset/"]]},{"id":"m07","d":"d3","t":"Computational geometry with exact arithmetic","min":120,"hook":"Maps, games, robots, chip layouts and delivery zones all ask geometric questions: which side of this road is the point, do two paths cross, what's the area of this plot, which posts form the outer fence? One tool, the cross product, answers nearly all of them, and with integer coordinates it answers them exactly. Floating point is where most geometry bugs come from.","pre":{"q":"You walk from A to B and then on to C. Without measuring any angle, how can you tell whether you turned left or right at B?","a":"Compute the cross product (B − A) × (C − B) = (Bx − Ax)(Cy − By) − (By − Ay)(Cx − Bx). Positive means a left (anticlockwise) turn, negative a right turn, and zero means A, B and C lie on one line. It needs only multiplication and subtraction, so with integer coordinates the answer is exact."},"kid":{"t":"Tara's string fence","x":"Tara hammers pegs into a board and wants one loop of string around them all. She starts at the leftmost peg and works along the bottom, asking at each peg: “Do I turn left here?” Whenever the string would bend inwards with a right turn, she unhooks the last peg, because a peg that dents the fence inwards can't be on the outside. Then she does the top the same way. Ben works out the board's area by adding up thin triangles from one corner, some counted as plus and some as minus.","map":[["Pegs on the board","Points with integer coordinates"],["“Do I turn left here?”","The sign of the cross product of the last two steps"],["Unhooking a peg that dents the fence inwards","The monotone chain pops points that make a right (clockwise) turn"],["Doing the bottom, then the top","Building the lower hull and the upper hull separately"],["Adding thin triangles, some plus, some minus","The shoelace formula: the sum of signed cross products, halved"]],"brk":"Tara sees by eye which pegs are outside, but code decides every turn by the cross product's sign, including the awkward pegs exactly in line (cross product 0), where you must choose whether points on an edge count. And her board is small: with coordinates up to 10⁹ a cross product reaches about 8 × 10¹⁸, far past what a JavaScript Number holds exactly, so JavaScript needs BigInt."},"keys":["**The cross product**: cross(o, a, b) = (aₓ − oₓ)(b_y − o_y) − (a_y − o_y)(bₓ − oₓ). Positive: o → a → b turns left (anticlockwise); negative: right; zero: the three points are in line. It's also twice the signed area of the triangle o, a, b.","**Stay exact**: with integer coordinates every test here needs only +, − and ×, so compare the signs of integers and never divide. Floating point can flip a nearly-zero sign. Python's integers never overflow; JavaScript Numbers are exact only up to 2⁵³, so cross products of coordinates beyond about 3 × 10⁷ need BigInt, as the helper uses.","**Segment intersection**: segments p1p2 and p3p4 cross properly when p1 and p2 lie strictly on opposite sides of line p3p4 and p3 and p4 strictly on opposite sides of line p1p2. Otherwise they meet only if an endpoint is in line with the other segment (orientation 0) and lies within it.","**Polygon area (shoelace)**: twice the signed area is Σ cross(0, pᵢ, pᵢ₊₁) around the polygon, positive when the vertices run anticlockwise. Pick's theorem links area to lattice points: A = I + B/2 − 1, where B, the lattice points on the boundary, is Σ gcd(|Δx|, |Δy|) over the edges.","**Point in polygon**: first check whether p lies on an edge (orientation 0 and within it). Otherwise cast a ray to the right and count the edges it crosses, counting an edge only when its ends are on different sides of the ray's line (a half-open rule, so a vertex on the ray counts once): odd means inside. O(n) per point.","**Convex hull (Andrew's monotone chain)**: sort the points by (x, y); build the lower hull left to right, popping the last point while it fails to make a left turn; build the upper hull right to left the same way; join them. O(n log n) time for the sort, O(n) for the chains and O(n) space. Pop on ≤ 0 to keep corners only, or on < 0 to keep points lying on the edges too.","**When floating point is unavoidable**: distances, angles, circle intersections and optimisation problems (LeetCode 1515) have irrational answers. Then compare with a tolerance (|a − b| < ε), and keep exact integer tests wherever the inputs allow.","**The usual traps**: duplicate points, all points on one line, a polygon listed clockwise instead of anticlockwise, and points exactly on an edge. Test each of them on purpose."],"dia":[{"type":"cells","cap":"The shoelace formula on the notched polygon of code block 3","rows":[{"label":"edge","vals":["A→B","B→C","C→D","D→E","E→A"]},{"label":"from","vals":["(0,0)","(6,0)","(6,4)","(3,2)","(0,4)"]},{"label":"cross","vals":[0,24,0,12,0],"hl":[1,3]}],"note":"Each edge adds cross(0, pᵢ, pᵢ₊₁) = xᵢ·yᵢ₊₁ − yᵢ·xᵢ₊₁. The total, 36, is twice the area: the 6 × 4 rectangle (24) minus the notch triangle (6) is 18. A clockwise listing would give −36."},{"type":"graph","cap":"The fence around LeetCode 587's first example","w":360,"h":220,"nodes":[["a",10,44,"1,1"],["b",36,56,"2,0"],["c",88,32,"4,2"],["d",62,20,"3,3"],["e",36,8,"2,4"],["f",36,32,"2,2"]],"edges":[["a","b"],["b","c"],["c","d"],["d","e"],["e","a"]],"hl":["a","b","c","d","e"],"note":"Five trees are on the fence and (2, 2) is inside. Going round anticlockwise from (1, 1) every turn is a left turn or straight on: (3, 3) lies exactly on the edge from (4, 2) to (2, 4), so the cross product there is 0, and LeetCode counts it as on the fence."}],"cmp":[{"cap":"Geometry questions with integer coordinates","head":["Question","Exact test","Cost"],"rows":[["Which side of line AB is P?","The sign of cross(A, B, P)","O(1)"],["Do segments AB and CD meet?","Four orientations, plus on-segment checks when one is 0","O(1)"],["Twice the area of a polygon","Σ cross(0, pᵢ, pᵢ₊₁), the shoelace formula","O(n)"],["Is P inside a simple polygon?","An on-edge check, then ray casting","O(n)"],["Lattice points inside a polygon","Pick's theorem: A = I + B/2 − 1, with B = Σ gcd(|Δx|, |Δy|)","O(n log C)"],["The convex hull","Andrew's monotone chain","O(n log n)"]]},{"cap":"Which number type?","head":["Type","Exact up to","Use it for"],"rows":[["Python int","Any size","Every test here, with nothing extra"],["JavaScript Number","2⁵³ ≈ 9 × 10¹⁵, so coordinates up to about 3 × 10⁷","Small coordinates only"],["JavaScript BigInt","Any size","Cross products of coordinates up to 10⁹ and beyond"],["float / Number for real values","About 15–16 significant digits, rounded","Distances, angles and other irrational results, compared with a tolerance"]]}],"code":[{"t":"The exact predicates used by every example below","tabs":[{"lang":"python","src":"def cross(o, a, b):                             # (a - o) x (b - o): > 0 left turn, < 0 right turn, 0 in line\n    return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])\n\ndef orient(o, a, b):                            # the sign of the cross product: 1, -1 or 0\n    c = cross(o, a, b)\n    return (c > 0) - (c < 0)\n\ndef on_segment(a, b, p):                        # p is in line with a and b: is it between them?\n    return min(a[0], b[0]) <= p[0] <= max(a[0], b[0]) and min(a[1], b[1]) <= p[1] <= max(a[1], b[1])\n"},{"lang":"javascript","src":"function cross(o, a, b) {                       // (a - o) x (b - o) as an exact BigInt: > 0 left, < 0 right, 0 in line\n  const ox = BigInt(o[0]), oy = BigInt(o[1]);\n  return (BigInt(a[0]) - ox) * (BigInt(b[1]) - oy) - (BigInt(a[1]) - oy) * (BigInt(b[0]) - ox);\n}\n\nfunction orient(o, a, b) {                      // the sign of the cross product: 1, -1 or 0\n  const c = cross(o, a, b);\n  return c > 0n ? 1 : c < 0n ? -1 : 0;\n}\n\nfunction onSegment(a, b, p) {                   // p is in line with a and b: is it between them?\n  return Math.min(a[0], b[0]) <= p[0] && p[0] <= Math.max(a[0], b[0]) && Math.min(a[1], b[1]) <= p[1] && p[1] <= Math.max(a[1], b[1]);\n}\n"}]},{"t":"Turns, and why JavaScript needs BigInt for big coordinates","tabs":[{"lang":"python","src":"print(orient((0, 0), (4, 0), (4, 3)), orient((0, 0), (4, 0), (4, -3)), orient((0, 0), (2, 2), (5, 5)))\n\na, b = (999_999_999, 999_999_998), (999_999_998, 999_999_997)\nas_float = float(a[0]) * float(b[1]) - float(a[1]) * float(b[0])   # what a JavaScript Number computes\nprint(int(as_float), cross((0, 0), a, b))\nprint(orient((0, 0), a, b))\n","out":"1 -1 0\n0 -1\n-1\n","notes":[[1,"(4, 3) is to the left of the line from (0, 0) to (4, 0), (4, −3) to the right, and (5, 5) is on the line through (2, 2)."],[4,"Each product is about 10¹⁸, where doubles are 128 apart, so both round to the same value and the difference comes out as 0."],[6,"The exact answer is −1: a right turn that floating point calls a straight line."]]},{"lang":"javascript","src":"console.log(orient([0, 0], [4, 0], [4, 3]), orient([0, 0], [4, 0], [4, -3]), orient([0, 0], [2, 2], [5, 5]));\n\nconst a = [999999999, 999999998], b = [999999998, 999999997];\nconst asNumber = a[0] * b[1] - a[1] * b[0];     // plain Numbers: rounded above 2^53\nconsole.log(asNumber, String(cross([0, 0], a, b)));\nconsole.log(orient([0, 0], a, b));\n","out":"1 -1 0\n0 -1\n-1\n","notes":[[1,"(4, 3) is to the left of the line from (0, 0) to (4, 0), (4, −3) to the right, and (5, 5) is on the line through (2, 2)."],[4,"Each product is about 10¹⁸, where doubles are 128 apart, so both round to the same value and the difference comes out as 0."],[6,"The exact answer is −1: a right turn that floating point calls a straight line."]]}]},{"t":"Segment intersection, including touching and overlapping","tabs":[{"lang":"python","src":"def intersect(p1, p2, p3, p4):                # do segments p1p2 and p3p4 share at least one point?\n    d1, d2 = orient(p3, p4, p1), orient(p3, p4, p2)\n    d3, d4 = orient(p1, p2, p3), orient(p1, p2, p4)\n    if d1 * d2 < 0 and d3 * d4 < 0:\n        return True                           # each segment straddles the other's line\n    return ((d1 == 0 and on_segment(p3, p4, p1)) or (d2 == 0 and on_segment(p3, p4, p2)) or\n            (d3 == 0 and on_segment(p1, p2, p3)) or (d4 == 0 and on_segment(p1, p2, p4)))\n\ntests = [((0, 0), (4, 4), (0, 4), (4, 0)), ((0, 0), (2, 2), (3, 3), (5, 5)), ((0, 0), (3, 3), (3, 3), (5, 1)),\n         ((0, 0), (4, 0), (1, 1), (3, 2)), ((0, 0), (4, 0), (2, 0), (6, 0))]\nprint(*(\"yes\" if intersect(*t) else \"no\" for t in tests))\n","out":"yes no yes no yes","notes":[[4,"Opposite signs for both pairs of endpoints: a proper crossing, with the meeting point strictly inside both segments."],[6,"An orientation of 0 means an endpoint is on the other segment's line; the bounding-box check says whether it is on the segment itself."],[10,"The second pair is in one line but doesn't overlap; the third pair touches at (3, 3); the last pair overlaps on [2, 4]."]]},{"lang":"javascript","src":"function intersect(p1, p2, p3, p4) {          // do segments p1p2 and p3p4 share at least one point?\n  const d1 = orient(p3, p4, p1), d2 = orient(p3, p4, p2);\n  const d3 = orient(p1, p2, p3), d4 = orient(p1, p2, p4);\n  if (d1 * d2 < 0 && d3 * d4 < 0) return true;   // each segment straddles the other's line\n  return (d1 === 0 && onSegment(p3, p4, p1)) || (d2 === 0 && onSegment(p3, p4, p2)) ||\n    (d3 === 0 && onSegment(p1, p2, p3)) || (d4 === 0 && onSegment(p1, p2, p4));\n}\n\nconst tests = [[[0, 0], [4, 4], [0, 4], [4, 0]], [[0, 0], [2, 2], [3, 3], [5, 5]], [[0, 0], [3, 3], [3, 3], [5, 1]],\n  [[0, 0], [4, 0], [1, 1], [3, 2]], [[0, 0], [4, 0], [2, 0], [6, 0]]];\nconsole.log(...tests.map(t => (intersect(...t) ? \"yes\" : \"no\")));\n","out":"yes no yes no yes","notes":[[4,"Opposite signs for both pairs of endpoints: a proper crossing, with the meeting point strictly inside both segments."],[5,"An orientation of 0 means an endpoint is on the other segment's line; the bounding-box check says whether it is on the segment itself."],[10,"The second pair is in one line but doesn't overlap; the third pair touches at (3, 3); the last pair overlaps on [2, 4]."]]}]},{"t":"Polygon area (shoelace) and point in polygon (ray casting)","tabs":[{"lang":"python","src":"def area2(poly):                              # twice the signed area: > 0 when listed anticlockwise\n    return sum(cross((0, 0), poly[i], poly[(i + 1) % len(poly)]) for i in range(len(poly)))\n\ndef locate(poly, p):                          # \"INSIDE\", \"OUTSIDE\" or \"BOUNDARY\"\n    inside = False\n    for i in range(len(poly)):\n        a, b = poly[i], poly[(i + 1) % len(poly)]\n        o = orient(a, b, p)\n        if o == 0 and on_segment(a, b, p):\n            return \"BOUNDARY\"\n        if (a[1] > p[1]) != (b[1] > p[1]) and (o > 0) == (b[1] > a[1]):\n            inside = not inside               # this edge crosses the ray going right from p\n    return \"INSIDE\" if inside else \"OUTSIDE\"\n\npoly = [(0, 0), (6, 0), (6, 4), (3, 2), (0, 4)]   # a rectangle with a notch cut from the top\nprint(area2(poly))\nprint(*(locate(poly, p) for p in [(3, 1), (3, 3), (6, 2), (3, 2), (7, 1), (1, 3)]))\n","out":"36\nINSIDE OUTSIDE BOUNDARY BOUNDARY OUTSIDE INSIDE\n","notes":[[2,"Each term is twice the signed area of the triangle from the origin to one edge; the parts outside the polygon cancel out."],[11,"The half-open test counts an edge only when exactly one end is above p, so a vertex on the ray is counted once and flat edges never."],[16,"36 is twice the area: the 6 × 4 rectangle minus the notch triangle is 24 − 6 = 18."],[17,"(3, 3) sits inside the notch, so it's outside the polygon; (3, 2) is the notch's tip, a vertex, so it's on the boundary."]]},{"lang":"javascript","src":"function area2(poly) {                        // twice the signed area: > 0 when listed anticlockwise\n  return poly.reduce((s, p, i) => s + cross([0, 0], p, poly[(i + 1) % poly.length]), 0n);\n}\n\nfunction locate(poly, p) {                    // \"INSIDE\", \"OUTSIDE\" or \"BOUNDARY\"\n  let inside = false;\n  for (let i = 0; i < poly.length; i++) {\n    const a = poly[i], b = poly[(i + 1) % poly.length], o = orient(a, b, p);\n    if (o === 0 && onSegment(a, b, p)) return \"BOUNDARY\";\n    if ((a[1] > p[1]) !== (b[1] > p[1]) && (o > 0) === (b[1] > a[1])) inside = !inside;   // crosses the ray to the right\n  }\n  return inside ? \"INSIDE\" : \"OUTSIDE\";\n}\n\nconst poly = [[0, 0], [6, 0], [6, 4], [3, 2], [0, 4]];   // a rectangle with a notch cut from the top\nconsole.log(String(area2(poly)));\nconsole.log(...[[3, 1], [3, 3], [6, 2], [3, 2], [7, 1], [1, 3]].map(p => locate(poly, p)));\n","out":"36\nINSIDE OUTSIDE BOUNDARY BOUNDARY OUTSIDE INSIDE\n","notes":[[2,"Each term is twice the signed area of the triangle from the origin to one edge; the parts outside the polygon cancel out."],[10,"The half-open test counts an edge only when exactly one end is above p, so a vertex on the ray is counted once and flat edges never."],[16,"36 is twice the area: the 6 × 4 rectangle minus the notch triangle is 24 − 6 = 18."],[17,"(3, 3) sits inside the notch, so it's outside the polygon; (3, 2) is the notch's tip, a vertex, so it's on the boundary."]]}]}],"ex":{"q":"Trees stand at integer points in a garden. Fence them in with the shortest rope that encloses every tree, and list every tree that lies on the fence, including trees exactly on a straight stretch of it. (LeetCode 587, Erect the Fence)","steps":["The shortest enclosing rope is the convex hull. Sort the trees by x, then y: the lower hull runs left to right, the upper hull right to left, and together they form the fence.","Along a chain, a right turn (cross < 0) means the middle tree bends the fence inwards, so pop it. A cross product of 0 means a tree on a straight stretch, and this problem wants those, so pop only on < 0.","The two chains share their end points, and when all the trees are in one line both chains contain every tree, so combine them with a set.","O(n log n) for the sort plus O(n) for the chains (each tree is pushed and popped at most once per chain), and O(n) space."],"code":{"t":"A monotone chain that keeps collinear trees","tabs":[{"lang":"python","src":"def outer_trees(trees):                       # every tree on the fence, straight stretches included\n    pts = sorted(set(map(tuple, trees)))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        out = []\n        for p in seq:\n            while len(out) >= 2 and cross(out[-2], out[-1], p) < 0:   # pop right turns only\n                out.pop()\n            out.append(p)\n        return out\n    return sorted(set(chain(pts) + chain(pts[::-1])))   # both chains hold the ends; a set drops repeats\n\nprint(*(f\"{x},{y}\" for x, y in outer_trees([[1, 1], [2, 2], [2, 0], [2, 4], [3, 3], [4, 2]])))\nprint(*(f\"{x},{y}\" for x, y in outer_trees([[1, 2], [2, 2], [4, 2]])))\n","out":"1,1 2,0 2,4 3,3 4,2\n1,2 2,2 4,2\n"},{"lang":"javascript","src":"function outerTrees(trees) {                  // every tree on the fence, straight stretches included\n  const key = p => p[0] * 1000 + p[1];\n  const pts = [...new Map(trees.map(p => [key(p), p])).values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]);\n  if (pts.length <= 2) return pts;\n  const chain = seq => {\n    const out = [];\n    for (const p of seq) {\n      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) < 0n) out.pop();   // pop right turns only\n      out.push(p);\n    }\n    return out;\n  };\n  const both = [...chain(pts), ...chain([...pts].reverse())];   // both chains hold the ends; a Map drops repeats\n  return [...new Map(both.map(p => [key(p), p])).values()].sort((a, b) => a[0] - b[0] || a[1] - b[1]);\n}\n\nconsole.log(...outerTrees([[1, 1], [2, 2], [2, 0], [2, 4], [3, 3], [4, 2]]).map(([x, y]) => `${x},${y}`));\nconsole.log(...outerTrees([[1, 2], [2, 2], [4, 2]]).map(([x, y]) => `${x},${y}`));\n","out":"1,1 2,0 2,4 3,3 4,2\n1,2 2,2 4,2\n"}]},"a":"Five trees for the first garden: (2, 2) is inside, and (3, 3) is on the straight stretch from (4, 2) to (2, 4). In the second garden all three trees are in one line, so the fence is that line and every tree is on it."},"fade":{"q":"A circle (radius, xCenter, yCenter) and an axis-aligned rectangle (x1, y1) to (x2, y2) are given with integer values. Do they share any point? (LeetCode 1401, Circle and Rectangle Overlapping)","steps":["They overlap exactly when the rectangle's point nearest the circle's centre lies within the radius.",{"ask":"How do you find the rectangle's point nearest the centre?","a":"Clamp each coordinate on its own: nx = min(max(xCenter, x1), x2), and the same for y. If the centre is inside the rectangle, the nearest point is the centre itself."},{"ask":"Why compare squared distances?","a":"dx² + dy² ≤ r² needs no square root, so with integers the comparison is exact; a square root would bring floating point in for no reason."},{"ask":"Time and space?","a":"O(1) time and O(1) space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def check_overlap(radius, xc, yc, x1, y1, x2, y2):\n    ...                                       # TODO: the rectangle's point nearest (xc, yc), then compare\n"},{"lang":"javascript","src":"function checkOverlap(radius, xc, yc, x1, y1, x2, y2) {\n  // TODO: the rectangle's point nearest (xc, yc), then compare\n}\n"}]},"solution":{"t":"Solution: clamp, then compare squared distances","tabs":[{"lang":"python","src":"def check_overlap(radius, xc, yc, x1, y1, x2, y2):\n    nx = min(max(xc, x1), x2)                 # the rectangle's nearest point: clamp each axis\n    ny = min(max(yc, y1), y2)\n    return (nx - xc) ** 2 + (ny - yc) ** 2 <= radius ** 2   # no square root, so it stays exact\n\ncases = [(1, 0, 0, 1, -1, 3, 1), (1, 1, 1, 1, -3, 2, -1), (1, 0, 0, -1, 0, 0, 1)]\nprint(*(\"yes\" if check_overlap(*c) else \"no\" for c in cases))\n","out":"yes no yes"},{"lang":"javascript","src":"function checkOverlap(radius, xc, yc, x1, y1, x2, y2) {\n  const nx = Math.min(Math.max(xc, x1), x2);    // the rectangle's nearest point: clamp each axis\n  const ny = Math.min(Math.max(yc, y1), y2);\n  return (nx - xc) ** 2 + (ny - yc) ** 2 <= radius ** 2;   // no square root, so it stays exact\n}\n\nconst cases = [[1, 0, 0, 1, -1, 3, 1], [1, 1, 1, 1, -3, 2, -1], [1, 0, 0, -1, 0, 0, 1]];\nconsole.log(...cases.map(c => (checkOverlap(...c) ? \"yes\" : \"no\")));\n","out":"yes no yes"}]}},"traps":[["“Floating point is fine for geometry.”","Rounding can flip the sign of a nearly-zero cross product, calling three points in line a turn or the reverse (code block 1). With integer coordinates, keep everything in integers and compare signs."],["“A JavaScript Number holds any cross product of 10⁹ coordinates.”","Differences reach 2 × 10⁹ and products 4 × 10¹⁸, far past 2⁵³ ≈ 9 × 10¹⁵. Use BigInt, as the helper does, or Python's exact integers."],["“Two segments intersect exactly when their orientations differ.”","That's only a proper crossing. Touching at an endpoint, an endpoint on the other segment, and overlapping in one line all give an orientation of 0 and need the on-segment check."],["“The shoelace formula gives the area.”","It gives twice the signed area: halve it and take the absolute value. The sign is useful in itself: positive means the vertices run anticlockwise."],["“A convex hull never includes points in line.”","It depends on the question. Pop on ≤ 0 to keep corners only; pop on < 0 to keep points on the edges, as LeetCode 587 wants, and check the case where every point is on one line."],["“Ray casting just counts every edge the ray touches.”","A ray through a vertex would count it twice and a horizontal edge would confuse the count. Count an edge only when its ends lie on different sides of the ray's line (a half-open rule), and check the boundary first."]],"disc":[["Why does the sign of the cross product tell left from right?","(a − o) × (b − o) = |a − o| · |b − o| · sin θ, where θ is the angle turning from the first vector to the second. sin θ is positive for an anticlockwise turn, negative for a clockwise one and zero when the points are in line. The same value is twice the signed area of the triangle o, a, b, which is why the shoelace formula is a sum of cross products."],["Where does exact geometry matter in real systems?","Mapping and GIS tools (is this address inside a delivery zone?), CAD and chip layout, game collision checks and robot path planning run these tests millions of times. Libraries such as CGAL, and Jonathan Shewchuk's robust predicates, exist because floating-point orientation tests fail on nearly-collinear inputs; with integer coordinates, exact integer arithmetic avoids the problem altogether."]],"teach":{"prompt":"Explain to a junior colleague how the cross product answers “left or right?”, and how it gives segment intersection, polygon area and the convex hull.","rubric":["The sign of cross(o, a, b): left, right or in line","Integers keep it exact; JavaScript needs BigInt past 2⁵³","Segments: four orientations, plus on-segment checks when one is 0","Shoelace: half the sum of cross products, with the sign giving the direction","Monotone chain: sort, build the lower and upper hulls, pop right turns, O(n log n)"],"model":"For three points o, a and b, the cross product (a − o) × (b − o) is positive when o → a → b turns left, negative when it turns right and zero when they're in line, and it needs only multiplication and subtraction, so with integer coordinates it's exact. In JavaScript I'd compute it with BigInt, because coordinates near 10⁹ give products near 10¹⁸, past 2⁵³. Two segments cross properly when each one's endpoints are on opposite sides of the other's line; if an orientation is zero, I also check whether that endpoint lies within the other segment. Twice a polygon's signed area is the sum of the cross products of consecutive vertices, the shoelace formula. And for the convex hull I sort the points, build the lower hull left to right and the upper hull right to left, popping the last point whenever it doesn't make a left turn: O(n log n) for the sort."},"qa":[["What does the sign of cross(o, a, b) mean?","Positive: a left (anticlockwise) turn; negative: a right turn; zero: the points are in line."],["How do you get a polygon's area from its vertices?","The shoelace formula: half the absolute value of the sum of cross products of consecutive vertices."],["When do two segments intersect?","When each straddles the other's line, or an endpoint is in line with the other segment and lies within it."],["How fast is Andrew's monotone chain?","O(n log n) for the sort; the chains themselves take O(n)."],["Why use BigInt for geometry in JavaScript?","Cross products of coordinates up to 10⁹ reach about 8 × 10¹⁸, past 2⁵³."],["How do you test whether a point is inside a polygon?","Check the edges for the boundary, then cast a ray and count crossings: odd means inside."]],"quiz":[{"q":"What does this print? (`cross` and `orient` are this module's helpers; in JavaScript `cross` returns a BigInt.)","snip":{"t":"Three cross products","tabs":[{"lang":"python","src":"print(cross((1, 1), (4, 2), (2, 5)), cross((0, 0), (3, 3), (6, 6)), orient((0, 0), (0, 5), (-2, 1)))\n"},{"lang":"javascript","src":"console.log(String(cross([1, 1], [4, 2], [2, 5])), String(cross([0, 0], [3, 3], [6, 6])), orient([0, 0], [0, 5], [-2, 1]));\n"}]},"o":["11 0 1","-11 0 1","11 0 -1","13 0 1"],"a":0,"e":"(3)(4) − (1)(1) = 11. (3, 3) and (6, 6) are on one line through the origin, so 0. For the last, (0)(1) − (5)(−2) = 10 > 0: going up the y-axis, (−2, 1) is on the left."},{"q":"What does this print?","snip":{"t":"Signed areas","tabs":[{"lang":"python","src":"area2 = lambda poly: sum(cross((0, 0), poly[i], poly[(i + 1) % len(poly)]) for i in range(len(poly)))\nprint(area2([(0, 0), (4, 0), (0, 3)]), area2([(0, 0), (0, 2), (2, 2), (2, 0)]))\n"},{"lang":"javascript","src":"const area2 = poly => poly.reduce((s, p, i) => s + cross([0, 0], p, poly[(i + 1) % poly.length]), 0n);\nconsole.log(String(area2([[0, 0], [4, 0], [0, 3]])), String(area2([[0, 0], [0, 2], [2, 2], [2, 0]])));\n"}]},"o":["12 -8","6 4","12 8","6 -4"],"a":0,"e":"The triangle has area 6 and is listed anticlockwise, so twice its signed area is 12. The 2 × 2 square is listed clockwise (up, right, down), so it gives −8, minus twice its area."},{"q":"In the monotone chain, why is a point popped when the last two edges make a right turn?","o":["A point at a right turn of the lower chain lies inside the hull, so it can't be a corner of the fence","Right turns make the chain longer than needed but don't change the hull","It removes duplicate points","It keeps the points sorted by angle"],"a":0,"e":"Walking the lower hull left to right, the fence must keep turning left. A right turn means the middle point is above the segment joining its neighbours, so it's inside. Duplicates are removed before, and the chain is sorted by x, not by angle."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["With integer coordinates, the orientation test needs only multiplication and subtraction, so it is exact","Andrew's monotone chain builds a convex hull in O(n log n)","Comparing slopes with floating-point division is a safe collinearity test","The shoelace formula works only for convex polygons","JavaScript Numbers hold cross products of coordinates up to 10⁹ exactly"],"a":[0,1],"e":"Integer products and differences are exact, and the hull costs one sort plus linear chains. Division brings rounding (and vertical lines break slopes), the shoelace formula works for any simple polygon, and those products reach 4 × 10¹⁸, past 2⁵³."},{"q":"Judge each statement.","t":"yn","s":[["cross(o, a, b) > 0 means o → a → b turns anticlockwise (left).",true],["The shoelace sum is positive when the vertices are listed clockwise.",false],["Two segments that touch only at an endpoint count as intersecting.",true],["A ray-casting test must handle points on an edge separately.",true]],"e":"Positive cross means a left turn. The shoelace sum is positive for anticlockwise order and negative for clockwise. Touching at an endpoint shares a point, so it counts. And a point on an edge gives an orientation of 0, which the crossing count can't classify, so it is checked first."},{"q":"Put the steps of Andrew's monotone chain in order.","t":"ord","items":["Sort the points by x, then by y","Build the lower hull left to right, popping while the last turn isn't a left turn","Build the upper hull right to left in the same way","Join the two chains, dropping each one's last point (it starts the other chain)"],"e":"Both chains walk the sorted order, the upper one backwards, and the join needs both chains finished."},{"q":"Complete the Python convex hull that keeps corners only, in anticlockwise order (`cross` is this module's helper).","t":"drop","lang":"python","code":"def hull(points):\n    pts = sorted(set(points))\n    if len(pts) <= 2:\n        return pts\n    def chain(seq):\n        out = []\n        for p in seq:\n            while len(out) >= 2 and {{0}}:\n                out.pop()\n            out.append(p)\n        return out\n    lower, upper = chain(pts), chain({{1}})\n    return lower[:-1] + upper[:-1]\n","blanks":[{"o":["cross(out[-2], out[-1], p) <= 0","cross(out[-2], out[-1], p) >= 0","cross(out[-2], out[-1], p) < 0","cross(out[-1], out[-2], p) <= 0"],"a":0},{"o":["pts[::-1]","pts","sorted(pts, key=lambda p: p[1])","pts[1:]"],"a":0}],"e":"Popping on ≤ 0 removes right turns and points in line, leaving corners only, and the upper hull walks the same sorted points backwards. Popping on < 0 would keep points on the edges, and skipping the reversal would rebuild the lower hull."},{"q":"Match each question to its test.","t":"match","pairs":[["Which side of line AB is point P?","The sign of cross(A, B, P)"],["Do two segments cross?","Four orientation tests, plus on-segment checks for zeros"],["What is a polygon's area?","Half the sum of cross products of consecutive vertices"],["What is the smallest convex fence around all the points?","Andrew's monotone chain, O(n log n)"]],"extra":["Dijkstra's algorithm on a grid"],"e":"Side, crossing, area and hull are all built from the cross product. Dijkstra finds shortest paths in graphs, not fences."}],"probs":[["LC 1037 · Valid Boomerang","https://leetcode.com/problems/valid-boomerang/","Easy","three points are a boomerang exactly when their cross product isn't 0"],["LC 812 · Largest Triangle Area","https://leetcode.com/problems/largest-triangle-area/","Easy","the largest |cross| / 2 over all triples; O(n³) is fine for n ≤ 50"],["LC 1401 · Circle and Rectangle Overlapping","https://leetcode.com/problems/circle-and-rectangle-overlapping/","Medium","the faded example: clamp the centre into the rectangle and compare squared distances"],["LC 587 · Erect the Fence","https://leetcode.com/problems/erect-the-fence/","Hard","the worked example: a monotone chain that keeps trees on straight stretches"],["LC 1515 · Best Position for a Service Centre","https://leetcode.com/problems/best-position-for-a-service-centre/","Hard","the geometric median has no exact formula: shrink a search step around the best point (or iterate Weiszfeld's method), with floating point and a tolerance"],["CSES 2189 · Point Location Test","https://cses.fi/problemset/task/2189","","LEFT, RIGHT or TOUCH from the sign of one cross product"],["CSES 2190 · Line Segment Intersection","https://cses.fi/problemset/task/2190","","code block 2, with coordinates up to 10⁹: BigInt in JavaScript"],["CSES 2191 · Polygon Area","https://cses.fi/problemset/task/2191","","print twice the area: the absolute shoelace sum"],["CSES 2192 · Point in Polygon","https://cses.fi/problemset/task/2192","","code block 3: the boundary check first, then ray casting"],["CSES 2193 · Polygon Lattice Points","https://cses.fi/problemset/task/2193","","Pick's theorem: B = Σ gcd(|Δx|, |Δy|), then I = A − B/2 + 1, working with 2A to stay in integers"],["CSES 2195 · Convex Hull","https://cses.fi/problemset/task/2195","","a monotone chain that keeps points on the hull's edges"]],"src":[["cp-algorithms: Oriented area of a triangle","https://cp-algorithms.com/geometry/oriented-triangle-area.html"],["cp-algorithms: Check if two segments intersect","https://cp-algorithms.com/geometry/check-segments-intersection.html"],["cp-algorithms: Area of a simple polygon","https://cp-algorithms.com/geometry/area-of-simple-polygon.html"],["cp-algorithms: Convex hull construction","https://cp-algorithms.com/geometry/convex-hull.html"],["Antti Laaksonen, Competitive Programmer's Handbook (free PDF), chapter 29: geometry","https://cses.fi/book/book.pdf"]]},{"id":"m08","d":"d3","t":"Matrix exponentiation, counting and probability","min":115,"hook":"“How many ways…?” and “what's the chance…?” questions fill interviews and contests, and they often ask about n = 10¹⁸, far too many steps to simulate. A DP that moves between a fixed set of states each step is a matrix, and repeated squaring jumps n steps in O(log n). Add a few counting rules and linearity of expectation, and a whole family of problems reduces to a small table and a power.","pre":{"q":"The Fibonacci rule is f(n) = f(n − 1) + f(n − 2). Can you get from the pair (f(n − 1), f(n − 2)) to the pair (f(n), f(n − 1)) by multiplying by one fixed 2 × 2 table of numbers?","a":"Yes: [[1, 1], [1, 0]] times (f(n − 1), f(n − 2)) gives (f(n − 1) + f(n − 2), f(n − 1)) = (f(n), f(n − 1)). So n steps are that matrix to the n-th power, and squaring it repeatedly reaches f(10¹⁸) in about 60 squarings."},"kid":{"t":"Ben's doubling machine","x":"Ben has a toy machine that turns today's pair of numbers into tomorrow's pair, always by the same rule. To jump far ahead, he builds a second machine that does two days at once by running the first one twice, then a four-day machine from two two-day machines, then eight, sixteen and so on. To jump 13 days he chains the 8-day, 4-day and 1-day machines. Tara points out that the rule must be the same every day, or the machines couldn't be reused.","map":[["Today's pair of numbers","The state vector, such as (f(n), f(n − 1))"],["The machine that does one day","The transition matrix C"],["A two-day machine made of two one-day machines","C² = C × C: squaring"],["Chaining the 8-, 4- and 1-day machines for 13 days","C¹³ = C⁸ · C⁴ · C¹, from the binary digits of 13"],["The rule must be the same every day","Only linear recurrences with fixed coefficients become a fixed matrix"]],"brk":"Ben's machines handle small numbers, but these values grow exponentially, so code works modulo 10⁹ + 7, and a product of two residues reaches about 10¹⁸: past 2⁵³, so JavaScript needs BigInt. And each matrix product costs O(d³) for d states, so the trick only pays when there are few states and n is huge."},"keys":["**Linear recurrences as matrices**: if f(n) = c₁f(n − 1) + … + c_d f(n − d) with fixed coefficients, keep the last d values in a vector. One step is a fixed d × d matrix C (the companion matrix), so n steps are Cⁿ applied to the starting vector.","**Repeated squaring**: as with numbers in L3, Cⁿ needs about log₂ n squarings and at most as many extra products, chosen by the 1 bits of n. Each product of d × d matrices is O(d³), so the total is O(d³ log n) time and O(d²) space: about 60 squarings of a 2 × 2 matrix for F(10¹⁸).","**Counting walks**: with A[u][v] the number of edges u → v, entry (s, t) of Aᵏ is the number of walks from s to t with exactly k edges. Swap (+, ×) for (min, +) and the same power gives the cheapest walk with exactly k edges (CSES 1724).","**A DP over a few states is a matrix**: when every step moves between the same small set of states (the digit a knight stands on, the last vowel written, absences and lates so far), the transitions form a matrix, and n steps of the DP become one matrix power when n is huge.","**Counting tools**: stars and bars puts n identical items into m boxes in C(n + m − 1, m − 1) ways; inclusion–exclusion counts what avoids every bad property, such as derangements, D(n) = (n − 1)(D(n − 1) + D(n − 2)); Catalan numbers C(2m, m) / (m + 1) count balanced bracket strings of length 2m.","**Probability DP**: a state's probability is the sum, over the states that lead to it, of their probability times the step's probability. When each state draws on a sliding range of earlier states (LeetCode 837), keep a running window sum: O(n) instead of O(n × window).","**Expected values**: linearity of expectation, E[X + Y] = E[X] + E[Y], holds even when X and Y depend on each other, so an expected count is the sum of the individual events' probabilities. Expected steps follow their own DP: E[state] = 1 + Σ p · E[next state].","**Staying exact**: answers modulo 10⁹ + 7 need BigInt products in JavaScript; a probability p / q “modulo M” is p · q^(M − 2) mod M for a prime M (Fermat); floating-point probabilities are printed to the required decimals and never compared with ==."],"dia":[{"type":"cells","cap":"Repeated squaring of the Fibonacci matrix M = [[1, 1], [1, 0]]","rows":[{"label":"M¹","vals":[1,1,1,0]},{"label":"M²","vals":[2,1,1,1]},{"label":"M⁴","vals":[5,3,3,2]},{"label":"M⁸","vals":[34,21,21,13]},{"label":"M¹³","vals":[377,233,233,144],"hl":[1]}],"idx":false,"note":"Each row lists a matrix's four entries (top-left, top-right, bottom-left, bottom-right), and squaring doubles the power: M⁸ = (M⁴)². Since 13 = 8 + 4 + 1, M¹³ = M⁸ · M⁴ · M¹, and its top-right entry is F(13) = 233: three squarings and two extra products instead of twelve multiplications."},{"type":"graph","cap":"Counting walks from 0 to 3 with the adjacency matrix (code block 2)","directed":true,"w":400,"h":200,"nodes":[["0",8,30],["1",40,6],["2",40,54],["3",92,30]],"edges":[["0","1"],["0","2"],["1","3"],["2","3"],["3","0"],["1","2"]],"hl":["0","3"],"note":"Walks from 0 to 3: none with 1 edge, two with 2 (0 → 1 → 3 and 0 → 2 → 3), one with 3 (0 → 1 → 2 → 3), none with 4, and four each with 5 and 6 edges. Those are the top-right entries of A¹ to A⁶; A^(10⁹) takes about 30 squarings."}],"cmp":[{"cap":"From a DP to a matrix power","head":["Problem","State","Matrix","Cost for huge n"],"rows":[["Fibonacci numbers (CSES 1722)","(F(n), F(n − 1))","2 × 2","O(log n)"],["Throwing Dice (CSES 1096)","The last 6 counts","6 × 6","O(6³ log n)"],["Knight Dialer (LeetCode 935)","The digit the knight is on","10 × 10","O(10³ log n)"],["Walks with exactly k edges (CSES 1723)","The vertex you're on","V × V adjacency","O(V³ log k)"],["Cheapest walk with exactly k edges (CSES 1724)","The vertex you're on","V × V with (min, +)","O(V³ log k)"]]},{"cap":"Which counting tool?","head":["Question","Tool","Formula"],"rows":[["n identical items into m boxes","Stars and bars","C(n + m − 1, m − 1)"],["Arrangements where nothing stays in its place","Inclusion–exclusion (derangements)","D(n) = (n − 1)(D(n − 1) + D(n − 2))"],["Balanced bracket strings of length 2m","Catalan numbers","C(2m, m) / (m + 1)"],["The expected number of events that happen","Linearity of expectation","Σ P(event i)"],["A probability p / q modulo a prime M","Fermat's inverse","p · q^(M − 2) mod M"]]}],"code":[{"t":"Matrix multiplication and power modulo 10⁹ + 7, used by every example below (BigInt in JavaScript)","tabs":[{"lang":"python","src":"MOD = 10**9 + 7\n\ndef mat_mul(A, B):                              # (A x B) mod MOD\n    C = [[0] * len(B[0]) for _ in range(len(A))]\n    for i, row in enumerate(A):\n        for k, a in enumerate(row):\n            if a:\n                Bk, Ci = B[k], C[i]\n                for j in range(len(Bk)):\n                    Ci[j] = (Ci[j] + a * Bk[j]) % MOD\n    return C\n\ndef mat_pow(M, e):                              # M^e mod MOD by repeated squaring: O(d^3 log e)\n    R = [[int(i == j) for j in range(len(M))] for i in range(len(M))]\n    while e:\n        if e & 1:\n            R = mat_mul(R, M)\n        M = mat_mul(M, M)\n        e >>= 1\n    return R\n"},{"lang":"javascript","src":"const MOD = 1000000007n;\n\nfunction matMul(A, B) {                         // (A x B) mod MOD; entries are BigInt\n  const C = Array.from({ length: A.length }, () => new Array(B[0].length).fill(0n));\n  for (let i = 0; i < A.length; i++) {\n    for (let k = 0; k < B.length; k++) {\n      const a = A[i][k];\n      if (a === 0n) continue;\n      for (let j = 0; j < B[k].length; j++) C[i][j] = (C[i][j] + a * B[k][j]) % MOD;\n    }\n  }\n  return C;\n}\n\nfunction matPow(M, e) {                         // M^e mod MOD by repeated squaring; e is a BigInt\n  let R = M.map((row, i) => row.map((_, j) => (i === j ? 1n : 0n)));\n  for (; e > 0n; e >>= 1n) {\n    if (e & 1n) R = matMul(R, M);\n    M = matMul(M, M);\n  }\n  return R;\n}\n"}]},{"t":"Fibonacci by matrix power, up to n = 10¹⁸","tabs":[{"lang":"python","src":"def fib(n):                                   # [[1, 1], [1, 0]]^n = [[F(n + 1), F(n)], [F(n), F(n - 1)]]\n    return mat_pow([[1, 1], [1, 0]], n)[0][1]\n\nprint(fib(10), fib(50), fib(10**18))\n","out":"55 586268941 209783453","notes":[[1,"Multiplying (F(n − 1), F(n − 2)) by this matrix gives (F(n), F(n − 1)), so its powers carry the whole sequence."],[4,"F(50) = 12,586,269,025, and 586,268,941 is its remainder modulo 10⁹ + 7. n = 10¹⁸ takes 60 squarings."]]},{"lang":"javascript","src":"const fib = n => matPow([[1n, 1n], [1n, 0n]], BigInt(n))[0][1];   // [[F(n + 1), F(n)], [F(n), F(n - 1)]]\n\nconsole.log(String(fib(10)), String(fib(50)), String(fib(10n ** 18n)));\n","out":"55 586268941 209783453","notes":[[1,"Multiplying (F(n − 1), F(n − 2)) by this matrix gives (F(n), F(n − 1)), so its powers carry the whole sequence."],[3,"F(50) = 12,586,269,025, and 586,268,941 is its remainder modulo 10⁹ + 7. n = 10¹⁸ takes 60 squarings."]]}]},{"t":"Walks with exactly k edges: powers of the adjacency matrix","tabs":[{"lang":"python","src":"def count_walks(n, edges, k):                 # walks of exactly k edges from 0 to n - 1 (CSES 1723)\n    A = [[0] * n for _ in range(n)]\n    for u, v in edges:\n        A[u][v] += 1                          # parallel edges count separately\n    return mat_pow(A, k)[0][n - 1]\n\nedges = [(0, 1), (0, 2), (1, 3), (2, 3), (3, 0), (1, 2)]\nprint(*(count_walks(4, edges, k) for k in range(1, 7)), count_walks(4, edges, 10**9))\n","out":"0 2 1 0 4 4 456615956","notes":[[4,"A[u][v] counts the edges from u to v, so one row times one column sums the ways through every middle vertex."],[5,"Entry [0][n − 1] of A^k counts the walks of exactly k edges from 0 to n − 1, revisits allowed."],[8,"k = 10⁹ costs about 30 squarings of a 4 × 4 matrix, not 10⁹ steps of the DP."]]},{"lang":"javascript","src":"function countWalks(n, edges, k) {            // walks of exactly k edges from 0 to n - 1 (CSES 1723)\n  const A = Array.from({ length: n }, () => new Array(n).fill(0n));\n  for (const [u, v] of edges) A[u][v] += 1n;  // parallel edges count separately\n  return matPow(A, BigInt(k))[0][n - 1];\n}\n\nconst edges = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 0], [1, 2]];\nconsole.log(...[1, 2, 3, 4, 5, 6].map(k => String(countWalks(4, edges, k))), String(countWalks(4, edges, 10 ** 9)));\n","out":"0 2 1 0 4 4 456615956","notes":[[3,"A[u][v] counts the edges from u to v, so one row times one column sums the ways through every middle vertex."],[4,"Entry [0][n − 1] of A^k counts the walks of exactly k edges from 0 to n − 1, revisits allowed."],[8,"k = 10⁹ costs about 30 squarings of a 4 × 4 matrix, not 10⁹ steps of the DP."]]}]},{"t":"A probability DP with a sliding window: New 21 Game","tabs":[{"lang":"python","src":"def new21_game(n, k, max_pts):                # P(final score <= n): draw 1..max_pts at random while the score is < k\n    if k == 0 or n >= k - 1 + max_pts:\n        return 1.0                            # every possible final score is <= n\n    dp = [0.0] * (n + 1)\n    dp[0], window, ans = 1.0, 1.0, 0.0        # window: the total probability of the last max_pts drawing scores\n    for s in range(1, n + 1):\n        dp[s] = window / max_pts              # reach s from any of them with one draw\n        if s < k:\n            window += dp[s]                   # s still draws, so it feeds later scores\n        else:\n            ans += dp[s]                      # the game stops at s\n        if 0 <= s - max_pts < k:\n            window -= dp[s - max_pts]         # that score is now too far back to reach s + 1\n    return ans\n\nprint(*(f\"{new21_game(*c):.5f}\" for c in [(10, 1, 10), (6, 1, 10), (21, 17, 10)]))\n","out":"1.00000 0.60000 0.73278","notes":[[3,"The highest possible final score is k − 1 + max_pts, so if that's still ≤ n, the answer is certainly 1."],[7,"Each of the last max_pts drawing scores reaches s with probability 1/max_pts: one division instead of a loop."],[12,"Adding the newest score and dropping the oldest keeps the window right in O(1), so the whole DP is O(n)."]]},{"lang":"javascript","src":"function new21Game(n, k, maxPts) {            // P(final score <= n): draw 1..maxPts at random while the score is < k\n  if (k === 0 || n >= k - 1 + maxPts) return 1;   // every possible final score is <= n\n  const dp = new Array(n + 1).fill(0);\n  dp[0] = 1;\n  let window = 1, ans = 0;                    // window: the total probability of the last maxPts drawing scores\n  for (let s = 1; s <= n; s++) {\n    dp[s] = window / maxPts;                  // reach s from any of them with one draw\n    if (s < k) window += dp[s];               // s still draws, so it feeds later scores\n    else ans += dp[s];                        // the game stops at s\n    if (s - maxPts >= 0 && s - maxPts < k) window -= dp[s - maxPts];   // too far back to reach s + 1\n  }\n  return ans;\n}\n\nconsole.log(...[[10, 1, 10], [6, 1, 10], [21, 17, 10]].map(c => new21Game(...c).toFixed(5)));\n","out":"1.00000 0.60000 0.73278","notes":[[2,"The highest possible final score is k − 1 + maxPts, so if that's still ≤ n, the answer is certainly 1."],[7,"Each of the last maxPts drawing scores reaches s with probability 1/maxPts: one division instead of a loop."],[10,"Adding the newest score and dropping the oldest keeps the window right in O(1), so the whole DP is O(n)."]]}]}],"ex":{"q":"A chess knight stands on a phone keypad (1–9 in three rows, 0 below 8) and dials a digit every time it lands. How many distinct numbers of length n can it dial, modulo 10⁹ + 7? (LeetCode 935, Knight Dialer)","steps":["The state is the digit the knight is on. From each digit it can move only to fixed digits: 1 → 6 or 8, 4 → 0, 3 or 9, 5 → nowhere, and so on.","Write those moves as a 10 × 10 matrix T with T[d][e] = 1 when the knight can jump from d to e. Then numbers of length n are walks with n − 1 moves.","The count is the sum of every entry of T^(n − 1): any start digit, any end digit. A plain DP over n steps also works for LeetCode's n ≤ 5000; the matrix power handles n = 10¹⁸.","O(10³ log n) time with the matrix, or O(10 n) with the DP; O(10²) space."],"code":{"t":"The knight's moves as a matrix","tabs":[{"lang":"python","src":"MOVES = {0: [4, 6], 1: [6, 8], 2: [7, 9], 3: [4, 8], 4: [0, 3, 9], 5: [], 6: [0, 1, 7], 7: [2, 6], 8: [1, 3], 9: [2, 4]}\n\ndef knight_dialer(n):                         # numbers of length n that the knight can dial\n    T = [[0] * 10 for _ in range(10)]\n    for d, nxt in MOVES.items():\n        for e in nxt:\n            T[d][e] = 1                       # one knight move from d to e\n    P = mat_pow(T, n - 1)\n    return sum(map(sum, P)) % MOD             # every start digit, every end digit\n\nprint(knight_dialer(1), knight_dialer(2), knight_dialer(3131))\n","out":"10 20 136006598"},{"lang":"javascript","src":"const MOVES = [[4, 6], [6, 8], [7, 9], [4, 8], [0, 3, 9], [], [0, 1, 7], [2, 6], [1, 3], [2, 4]];\n\nfunction knightDialer(n) {                    // numbers of length n that the knight can dial\n  const T = Array.from({ length: 10 }, () => new Array(10).fill(0n));\n  MOVES.forEach((nxt, d) => { for (const e of nxt) T[d][e] = 1n; });   // one knight move from d to e\n  const P = matPow(T, BigInt(n - 1));\n  return P.flat().reduce((a, b) => a + b, 0n) % MOD;   // every start digit, every end digit\n}\n\nconsole.log(String(knightDialer(1)), String(knightDialer(2)), String(knightDialer(3131)));\n","out":"10 20 136006598"}]},"a":"10, 20 and 136006598. With one digit the knight dials any of the 10 keys; with two, the 20 knight moves on the keypad (5 has none); and 3131 digits give LeetCode's third example, after about 12 squarings of the matrix."},"fade":{"q":"Count the ways to tile a 2 × n board with 2 × 1 dominoes (either way round) and L-shaped trominoes (any rotation), modulo 10⁹ + 7, for n up to 10¹⁵. (LeetCode 790, Domino and Tromino Tiling, asks up to n = 1000.)","steps":["Small boards give f(0) = 1, f(1) = 1, f(2) = 2 and f(3) = 5, and the cases of how the left end is covered lead to f(n) = 2f(n − 1) + f(n − 3).",{"ask":"Which vector and matrix turn this into a matrix power?","a":"The vector (f(n), f(n − 1), f(n − 2)) comes from (f(n − 1), f(n − 2), f(n − 3)) through C = [[2, 0, 1], [1, 0, 0], [0, 1, 0]]: the first row is the recurrence, the others shift the values down."},{"ask":"How do you get f(n) from C?","a":"Start from (f(2), f(1), f(0)) = (2, 1, 1) and apply C^(n − 2): f(n) is the first row of C^(n − 2) times (2, 1, 1)."},{"ask":"Time and space?","a":"O(3³ log n) time and O(1) space, about 50 squarings for n = 10¹⁵; the plain DP is O(n)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def num_tilings(n):                           # 2 x n board, dominoes and L-trominoes, mod 10^9 + 7\n    if n <= 2:\n        return [1, 1, 2][n]\n    C = [[2, 0, 1], [1, 0, 0], [0, 1, 0]]     # (f(n), f(n-1), f(n-2)) from (f(n-1), f(n-2), f(n-3))\n    ...                                       # TODO: apply C^(n - 2) to (f(2), f(1), f(0))\n"},{"lang":"javascript","src":"function numTilings(n) {                      // 2 x n board, dominoes and L-trominoes, mod 10^9 + 7\n  if (n <= 2) return [1n, 1n, 2n][n];\n  const C = [[2n, 0n, 1n], [1n, 0n, 0n], [0n, 1n, 0n]];   // (f(n), f(n-1), f(n-2)) from (f(n-1), f(n-2), f(n-3))\n  // TODO: apply C^(n - 2) to (f(2), f(1), f(0))\n}\n"}]},"solution":{"t":"Solution: the companion matrix of f(n) = 2f(n − 1) + f(n − 3)","tabs":[{"lang":"python","src":"def num_tilings(n):                           # 2 x n board, dominoes and L-trominoes, mod 10^9 + 7\n    if n <= 2:\n        return [1, 1, 2][n]\n    C = [[2, 0, 1], [1, 0, 0], [0, 1, 0]]     # (f(n), f(n-1), f(n-2)) from (f(n-1), f(n-2), f(n-3))\n    P = mat_pow(C, n - 2)\n    return (P[0][0] * 2 + P[0][1] * 1 + P[0][2] * 1) % MOD   # the first row times (f(2), f(1), f(0))\n\nprint(num_tilings(3), num_tilings(1), num_tilings(30), num_tilings(10**15))\n","out":"5 1 312342182 658481614"},{"lang":"javascript","src":"function numTilings(n) {                      // 2 x n board, dominoes and L-trominoes, mod 10^9 + 7\n  if (n <= 2) return [1n, 1n, 2n][n];\n  const C = [[2n, 0n, 1n], [1n, 0n, 0n], [0n, 1n, 0n]];   // (f(n), f(n-1), f(n-2)) from (f(n-1), f(n-2), f(n-3))\n  const P = matPow(C, BigInt(n) - 2n);\n  return (P[0][0] * 2n + P[0][1] + P[0][2]) % MOD;   // the first row times (f(2), f(1), f(0))\n}\n\nconsole.log(String(numTilings(3)), String(numTilings(1)), String(numTilings(30)), String(numTilings(10n ** 15n)));\n","out":"5 1 312342182 658481614"}]}},"traps":[["“Matrix power works for any recurrence.”","Only for linear ones with fixed coefficients, such as f(n) = 2f(n − 1) + f(n − 3). f(n) = f(n − 1)², or a coefficient that depends on n, doesn't fit one fixed matrix."],["“JavaScript Numbers are fine for products modulo 10⁹ + 7.”","Two residues multiply to about 10¹⁸, past 2⁵³, so the low digits are lost before the % runs. Use BigInt, as the helper does, or split each multiplication into smaller parts."],["“An answer for n = 10¹⁸ needs 10¹⁸ steps.”","Repeated squaring needs only about log₂ n ≈ 60 squarings and at most 60 extra products: O(d³ log n) for d states."],["“Expected values need independent events.”","Linearity of expectation holds for any random variables: E[X + Y] = E[X] + E[Y]. That's why an expected count is just the sum of each event's probability, dependent or not."],["“Each probability state must sum all max_pts predecessors.”","When the predecessors form a sliding range, keep a running window sum: add the newest state, subtract the one leaving. O(n × max_pts) becomes O(n)."],["“Floating-point probabilities can be compared with ==.”","They're rounded. Print the required decimals or compare with a tolerance, and when a problem wants p · q⁻¹ mod M, work in modular arithmetic instead."]],"disc":[["Why does a matrix power compute a linear recurrence?","Collect the last d values into a vector. One step of the recurrence is a fixed linear map from one vector to the next, which is a d × d matrix C, so n steps are Cⁿ. Matrix multiplication is associative, so Cⁿ can be built by repeated squaring in O(log n) products of O(d³) each."],["Where do these techniques appear outside contests?","Markov chains (PageRank is the long-run result of repeatedly applying a transition matrix), reliability and queueing models, game odds, path counting in networks, and population or finance models defined by linear recurrences. Linearity of expectation is also a classic interview tool: a random permutation has, on average, exactly one fixed point, whatever its length."]],"teach":{"prompt":"Explain to a junior colleague how matrix exponentiation computes a linear recurrence for huge n, and how a probability DP with a sliding window works.","rubric":["The last d values form a vector, and one step is a fixed d × d matrix","Repeated squaring gives Cⁿ in O(d³ log n)","Aᵏ counts walks with exactly k edges","Probability DP: each state from earlier states, with a running window sum","Exactness: modular arithmetic with BigInt in JavaScript; floats with a tolerance"],"model":"If a sequence follows a fixed linear rule, like f(n) = 2f(n − 1) + f(n − 3), I keep the last few values in a vector, and one step of the rule becomes multiplication by a fixed small matrix. Doing n steps is that matrix to the n-th power, and repeated squaring computes it with about log₂ n multiplications, so even n = 10¹⁸ takes around 60 squarings, at O(d³) each for d values. The same idea counts walks: entry (s, t) of the adjacency matrix to the k-th power is the number of walks of exactly k edges. For probabilities, I write a DP where each state's chance is the sum of the chances of the states that lead to it, times the step's chance; if every state draws on a sliding range of earlier ones, I keep a running window sum so each step is O(1). In JavaScript the modular products need BigInt, and I never compare floating-point probabilities with ==."},"qa":[["What does entry (s, t) of Aᵏ count, for an adjacency matrix A?","The walks from s to t with exactly k edges."],["How fast is a d-term linear recurrence at n with a matrix power?","O(d³ log n)."],["What does linearity of expectation say?","E[X + Y] = E[X] + E[Y] for any random variables, dependent or not."],["How many ways can n identical items go into m boxes?","C(n + m − 1, m − 1): stars and bars."],["How is a probability p / q stored modulo a prime M?","p · q^(M − 2) mod M, using Fermat's little theorem for the inverse of q."],["Why does JavaScript need BigInt for matrix powers modulo 10⁹ + 7?","A product of two residues reaches about 10¹⁸, past 2⁵³."]],"quiz":[{"q":"What does this print? (`mat_pow` / `matPow` is this module's helper.)","snip":{"t":"A small matrix power","tabs":[{"lang":"python","src":"P = mat_pow([[1, 1], [1, 0]], 5)\nprint(*P[0], *P[1])\n"},{"lang":"javascript","src":"const P = matPow([[1n, 1n], [1n, 0n]], 5n);\nconsole.log(...P.flat().map(String));\n"}]},"o":["8 5 5 3","5 3 3 2","13 8 8 5","8 5 3 2"],"a":0,"e":"The n-th power of [[1, 1], [1, 0]] is [[F(n + 1), F(n)], [F(n), F(n − 1)]], so the 5th power is [[8, 5], [5, 3]]. The 4th power would be 5 3 3 2, and the 6th 13 8 8 5."},{"q":"What does this print?","snip":{"t":"Walks in a triangle","tabs":[{"lang":"python","src":"A = [[0, 1, 1], [1, 0, 1], [1, 1, 0]]       # a triangle: every pair of vertices joined\nA2, A3 = mat_pow(A, 2), mat_pow(A, 3)\nprint(A2[0][0], A3[0][0], A3[0][1])\n"},{"lang":"javascript","src":"const A = [[0n, 1n, 1n], [1n, 0n, 1n], [1n, 1n, 0n]];   // a triangle: every pair of vertices joined\nconst A2 = matPow(A, 2n), A3 = matPow(A, 3n);\nconsole.log(String(A2[0][0]), String(A3[0][0]), String(A3[0][1]));\n"}]},"o":["2 2 3","2 3 2","1 2 3","2 0 3"],"a":0,"e":"Walks of 2 edges from 0 back to 0 go out and back: 0 → 1 → 0 and 0 → 2 → 0. Of 3 edges, 0 → 1 → 2 → 0 and 0 → 2 → 1 → 0. From 0 to 1 in 3 edges: 0 → 1 → 0 → 1, 0 → 2 → 0 → 1 and 0 → 1 → 2 → 1."},{"q":"For an adjacency matrix A, what does entry (s, t) of Aᵏ count?","o":["The walks from s to t that use exactly k edges","The shortest paths from s to t of length k","The simple paths from s to t with at most k edges","The edges between s and t"],"a":0,"e":"Each matrix product sums over a middle vertex, so k products count every sequence of k edges from s to t, revisits included. Shortest paths need (min, +), “at most k” needs a sum of powers, and A itself counts edges."},{"q":"Which statements are true? (choose 2)","t":"ms","o":["A linear recurrence of order d can be evaluated at huge n with a d × d matrix power in O(d³ log n)","Linearity of expectation holds even when the variables depend on each other","Matrix power works for any recurrence, including f(n) = f(n − 1)²","In JavaScript, products of two values below 10⁹ + 7 are exact as Numbers","A probability p / q is stored modulo M as p · q mod M"],"a":[0,1],"e":"Repeated squaring of the companion matrix gives O(d³ log n), and E[X + Y] = E[X] + E[Y] needs no independence. Squaring isn't linear, those products reach about 10¹⁸, and dividing by q means multiplying by its inverse, q^(M − 2), not by q."},{"q":"Judge each statement.","t":"yn","s":[["There are C(n + m − 1, m − 1) ways to put n identical apples into m baskets.",true],["The expected number of fair coin flips until the first head is 2.",true],["Multiplying two k × k matrices the usual way takes O(k²) time.",false],["In New 21 Game, the probabilities of the last max_pts drawing scores can be kept as a running window sum.",true]],"e":"Stars and bars: arrange n stars and m − 1 bars. The waiting time for a probability-½ event has mean 1/½ = 2. The usual product computes k² entries of k terms each, O(k³). And the window sum is what makes New 21 Game O(n)."},{"q":"Put the steps of evaluating a linear recurrence with a matrix power in order.","t":"ord","items":["Write the state as a vector of the last d values","Build the d × d matrix that maps one vector to the next","Raise the matrix to the needed power by repeated squaring","Multiply the result by the starting vector and read off f(n)"],"e":"The matrix needs the vector's layout, the power needs the matrix, and the answer needs both the power and the starting values."},{"q":"Complete the Python matrix power (`mat_mul` is this module's helper).","t":"drop","lang":"python","code":"def power(M, e):\n    R = [[int(i == j) for j in range(len(M))] for i in range(len(M))]\n    while e:\n        if {{0}}:\n            R = mat_mul(R, M)\n        M = {{1}}\n        e >>= 1\n    return R\n","blanks":[{"o":["e & 1","e % 2 == 0","e > 1","R == M"],"a":0},{"o":["mat_mul(M, M)","mat_mul(R, M)","mat_mul(M, R)","M"],"a":0}],"e":"Multiply the result in when the lowest bit of e is 1, then square M so it stands for the next bit. Squaring R instead, or never squaring, gives the wrong powers."},{"q":"Match each problem to its tool.","t":"match","pairs":[["The n-th Fibonacci number for n = 10¹⁸, mod 10⁹ + 7","A 2 × 2 matrix power"],["Walks of exactly k edges from s to t","Entry (s, t) of the adjacency matrix to the k-th power"],["Ways to give n identical apples to m children","Stars and bars: C(n + m − 1, m − 1)"],["The chance that a card game ends with a score ≤ n","A probability DP with a sliding window sum"]],"extra":["Dijkstra's algorithm"],"e":"A huge n with a fixed linear rule is a matrix power, walk counts are adjacency powers, identical items in boxes are stars and bars, and the card game is a probability DP. Dijkstra finds one cheapest path, not counts or chances."}],"probs":[["LC 1137 · N-th Tribonacci Number","https://leetcode.com/problems/n-th-tribonacci-number/","Easy","a 3 × 3 matrix power, or three rolling variables for n ≤ 37"],["LC 790 · Domino and Tromino Tiling","https://leetcode.com/problems/domino-and-tromino-tiling/","Medium","the faded example: f(n) = 2f(n − 1) + f(n − 3)"],["LC 935 · Knight Dialer","https://leetcode.com/problems/knight-dialer/","Medium","the worked example: a 10 × 10 knight-move matrix"],["LC 837 · New 21 Game","https://leetcode.com/problems/new-21-game/","Medium","a probability DP with a running window sum (code block 3)"],["LC 688 · Knight Probability in Chessboard","https://leetcode.com/problems/knight-probability-in-chessboard/","Medium","a probability DP over (moves left, square): each move sends 1/8 to every landing square, on the board or off it"],["LC 808 · Soup Servings","https://leetcode.com/problems/soup-servings/","Medium","memoise over the amounts left in units of 25 ml; for large n the answer is within 10⁻⁵ of 1, so a cut-off keeps the memo small"],["LC 1220 · Count Vowels Permutation","https://leetcode.com/problems/count-vowels-permutation/","Hard","a 5 × 5 matrix of which vowel may follow which; a DP in O(5n) also passes"],["LC 552 · Student Attendance Record II","https://leetcode.com/problems/student-attendance-record-ii/","Hard","states (absences so far, current run of lates): 6 states, a DP in O(n) or a 6 × 6 matrix power"],["CSES 1722 · Fibonacci Numbers","https://cses.fi/problemset/task/1722","","code block 1, for n up to 10¹⁸"],["CSES 1096 · Throwing Dice","https://cses.fi/problemset/task/1096","","f(n) = f(n − 1) + … + f(n − 6): a 6 × 6 matrix power for n up to 10¹⁸"],["CSES 1723 · Graph Paths I","https://cses.fi/problemset/task/1723","","code block 2: one power of the adjacency matrix"],["CSES 1724 · Graph Paths II","https://cses.fi/problemset/task/1724","","the same power with (min, +) in place of (+, ×): the cheapest walk with exactly k edges"],["CSES 1716 · Distributing Apples","https://cses.fi/problemset/task/1716","","stars and bars, with factorials and inverses modulo 10⁹ + 7 (L3)"],["CSES 1725 · Dice Probability","https://cses.fi/problemset/task/1725","","a probability DP over (dice thrown, sum), printed to six decimals"]],"src":[["cp-algorithms: Binary exponentiation (including matrices and linear recurrences)","https://cp-algorithms.com/algebra/binary-exp.html"],["cp-algorithms: Fibonacci numbers","https://cp-algorithms.com/algebra/fibonacci-numbers.html"],["cp-algorithms: Number of paths of fixed length","https://cp-algorithms.com/graph/fixed_length_paths.html"],["cp-algorithms: Stars and bars","https://cp-algorithms.com/combinatorics/stars_and_bars.html"],["Antti Laaksonen, Competitive Programmer's Handbook (free PDF), chapters 22–24: combinatorics, matrices and probability","https://cses.fi/book/book.pdf"]]},{"id":"m09","d":"d4","t":"DP optimisations: convex hull trick, divide and conquer, SOS","min":120,"hook":"Many hard DP problems have an obvious O(n²) or O(n³) solution and a time limit that needs O(n log n). The fix is rarely a new idea about the problem; it's spotting a shape in the transition: a minimum of straight lines, a best split point that only moves right, or a sum over subsets. Recognising those shapes is what separates a working solution from an accepted one.","pre":{"q":"dp[i] = min over j < i of (dp[j] + s[i] × f[j]). For a fixed j, how does dp[j] + s[i] × f[j] change as s[i] grows? What picture does that give you for all the j at once?","a":"For a fixed j it's a straight line in s[i], with slope f[j] and height dp[j] at s[i] = 0. So all the candidates are lines, and dp[i] is the lowest line at the point s[i]: the lower envelope of a set of lines. Keeping that envelope up to date is the convex hull trick."},"kid":{"t":"Tara's cheapest taxi","x":"Each taxi company in Tara's town charges a starting fee plus a price per mile. For a short trip the company with the lowest starting fee wins; for a long trip, the cheapest per mile. Ben draws every company's price as a straight line on squared paper and colours the lowest line at each distance. Some companies are never the cheapest at any distance, so he crosses them out. Now, for any trip, he just finds the coloured line above that distance.","map":[["A company's fee plus price per mile","A line m_j · x + c_j for one earlier state j"],["The trip's distance","The query point x_i for state i"],["The lowest line at each distance","The lower envelope: min over j, which is dp[i]"],["Crossing out companies that are never cheapest","Removing lines that are never on the envelope"],["Reading the coloured line above a distance","Answering a query in O(1) amortised (sorted) or O(log n)"]],"brk":"Ben can eyeball where lines cross, but code compares crossing points exactly, by cross-multiplying, because rounding can misorder nearly-parallel lines. And his companies arrive all at once, while in a DP each new line appears only after its own state is solved, so the order of slopes and queries decides which structure to use."},"keys":["**Find the bottleneck first**: dp[i] = min over j < i of (dp[j] + cost(j, i)) is O(n²) as written. Each optimisation below needs a specific shape in cost(j, i), so expand the cost and look for it before reaching for one.","**Convex hull trick**: if the candidate for j is linear in a quantity x_i of i, m_j · x_i + c_j, then dp[i] is the lowest of a set of lines at x_i. With slopes added in sorted order and queries sorted too, a deque keeps the lower envelope and every line is added and removed once: O(n) amortised.","**Exact envelope tests**: a middle line is useless when its outer neighbours cross before it can take over, which is the comparison (c₃ − c₁)(m₁ − m₂) ≤ (c₂ − c₁)(m₁ − m₃), with no division. Products of DP values and slopes can pass 2⁵³, so JavaScript uses BigInt.","**Li Chao tree**: a segment tree over the x range in which each node keeps the line that's lowest at the node's midpoint, and a new line pushes the loser into the one half where it can still win. Lines in any order and queries anywhere: O(log C) each for a range of size C.","**Divide and conquer optimisation**: for a layered DP dp_k[i] = min over j < i of dp_(k−1)[j] + C(j, i), if the best j never moves left as i grows, compute the middle i's best j by a scan, then solve the left half with j up to it and the right half with j from it. O(n log n) per layer instead of O(n²); the monotone best j holds when C satisfies the quadrangle inequality, as squared sums of positive numbers do.","**Knuth's optimisation**: for interval DPs dp[l][r] = min over m of dp[l][m] + dp[m + 1][r] + w(l, r) whose best split points nest, opt[l][r − 1] ≤ opt[l][r] ≤ opt[l + 1][r], scanning only between those bounds totals O(n²) instead of O(n³) (CSES 2088).","**SOS DP (sum over subsets)**: f[mask] = Σ a[sub] over every sub ⊆ mask. Add one bit at a time: for each bit b, every mask containing b adds f[mask without b]. O(2^b · b) instead of the O(3^b) of enumerating every submask of every mask; superset sums run the same loop the other way.","**Submask enumeration**: sub = mask, then sub = (sub − 1) & mask until 0 visits every submask of one mask in decreasing order. Over all masks of b bits that's 3^b steps in total, fine for b ≤ about 15, or for a few masks with few bits (LeetCode 1178)."],"dia":[{"type":"cells","cap":"Three lines and their lower envelope at x = 0 to 6","rows":[{"label":"3x","vals":[0,3,6,9,12,15,18],"hl":[0,1,2]},{"label":"x + 5","vals":[5,6,7,8,9,10,11],"hl":[3]},{"label":"15 − 2x","vals":[15,13,11,9,7,5,3],"hl":[4,5,6]},{"label":"min","vals":[0,3,6,8,7,5,3],"ok":[0,1,2,3,4,5,6]}],"note":"The envelope follows 3x up to x = 2.5, then x + 5 until x = 10/3, then 15 − 2x. The slopes fall from line to line, so as the query x moves right, a front line that has been overtaken is dropped for good."},{"type":"cells","cap":"SOS DP on 3 bits: one pass per bit turns a into subset sums","rows":[{"label":"a","vals":[1,2,0,3,1,0,2,1]},{"label":"bit 0","vals":[1,3,0,3,1,1,2,3],"hl":[1,3,5,7]},{"label":"bit 1","vals":[1,3,1,6,1,1,3,4],"hl":[2,3,6,7]},{"label":"bit 2","vals":[1,3,1,6,2,4,4,10],"hl":[4,5,6,7]}],"note":"Columns are masks 0 to 7. Each pass adds, to every mask that has bit b, the value of the same mask without b. At the end f[5] = a[0] + a[1] + a[4] + a[5] = 4, and f[7] = 10 is the total: 3 passes of 8 instead of 27 (mask, submask) pairs."}],"cmp":[{"cap":"Which DP optimisation?","head":["Shape of the transition","Technique","Cost"],"rows":[["min over j of m_j · x_i + c_j, slopes and queries sorted","Convex hull trick with a deque","O(n) amortised"],["The same, in any order","Li Chao tree (or a hull with binary search)","O(n log C)"],["Layered: dp_k[i] = min over j of dp_(k−1)[j] + C(j, i), best j monotone","Divide and conquer","O(k n log n)"],["Interval: dp[l][r] over split points that nest","Knuth's optimisation","O(n²)"],["min over a sliding window of j","Monotonic deque (L3)","O(n)"],["f[mask] = Σ over submasks","SOS DP","O(2^b · b)"]]}],"code":[{"t":"The monotone convex hull trick used by the first example and the quiz (BigInt in JavaScript)","tabs":[{"lang":"python","src":"from collections import deque\n\ndef bad(l1, l2, l3):                            # slopes m1 > m2 > m3: is l2 never strictly the lo
