hat happens to ordering during a consumer group rebalance.","The stream job's counts match a batch recount of the orders table after replays and restarts.","Someone else can start everything from the README and repeat each experiment, and the write-up says what you'd change for ten times the traffic and for a second region."],"steps":["Write the design doc first: requirements, estimates, events and their keys, the saga state machine and the SLOs; get it reviewed.","Build one service end to end with its database, outbox, relay and Kafka, then the other two, then the saga.","Add idempotent consumers, the dead-letter topic and the stream job; add metrics and traces with trace ids carried in event headers.","Write docker-compose.yml and a load generator, and measure the happy path: throughput, saga latency and consumer lag.","Run each failure experiment, write up the results, fix what broke, and have someone review the report."],"stretch":["Replace the relay with Debezium change data capture reading each database's write-ahead log.","Add a second region for the order service with a home region per customer, and test a region evacuation.","Replace the orchestrator with choreography and compare the two in the report: coupling, visibility and failure handling.","Add exactly-once processing to the stream job with Kafka transactions, and show the counts survive a crash in the middle of a commit."]}],"interview":[{"c":"Transactions and events","q":"How do you keep data consistent across microservices without distributed transactions?","a":"With sagas: the business transaction becomes a sequence of local transactions, each with a compensating action, coordinated by an orchestrator or by services reacting to each other's events. Each step commits its state change and the event it causes together through an outbox, and consumers are idempotent because delivery is at least once. Two-phase commit works inside one database cluster, but across services it blocks when the coordinator fails and couples their availability, so I keep it for cases where atomicity is non-negotiable and the participants are few and reliable.","f":["What does the saga do if a compensation fails?","Orchestration or choreography: which would you pick for orders, and why?"]},{"c":"Transactions and events","q":"What is the outbox pattern, and why not just publish to Kafka after committing?","a":"Publishing after the commit is a dual write: if the process dies between the two, the database has the change and the event is lost, or the reverse if you publish first. The outbox writes the event into a table in the same local transaction as the change; a relay, or change data capture reading the database's log, publishes the rows and marks them sent. Publishing can repeat after a crash, so consumers dedupe by event id, typically with an inbox table written in the same transaction as their own change.","f":["How would you keep the outbox table from growing forever?","What ordering guarantees does the relay give?"]},{"c":"Transactions and events","q":"When is event sourcing a good idea, and what does it cost?","a":"It fits domains where history matters: ledgers, orders, anything with audits or 'what did we know when'. Storing the events gives a full audit trail, lets you rebuild state, and lets new read models be built by replaying. The costs are real: reads need projections (CQRS), which are eventually consistent; events are a permanent API, so schema evolution needs upcasting or versioning; deleting personal data needs crypto-shredding or careful redaction; and long streams need snapshots.","f":["How do you handle a bug that wrote wrong events?","How do you rebuild a projection without downtime?"]},{"c":"Streams","q":"Explain watermarks and exactly-once processing in a stream processor.","a":"Events carry event time but arrive late and out of order, so the processor tracks a watermark, an estimate that no older events are still coming, usually the newest event time minus an allowed lateness. A window's result is emitted when the watermark passes its end; later events are dropped, sent aside or used to update results. Exactly-once comes from checkpointing every operator's state together with the input offsets, restoring them after a crash and replaying, with sinks that are idempotent upserts or transactions committed with each checkpoint.","f":["What happens to watermarks when one partition goes idle?","Why can't a stream processor make an email exactly-once?"]},{"c":"Consensus","q":"Walk me through how Raft elects a leader and commits an entry.","a":"Followers expect heartbeats; one whose randomized timeout runs out becomes a candidate for a new term, votes for itself and asks the others. Each server votes once per term, only for candidates whose log is at least as up to date as its own, so the winner holds every committed entry. The leader appends client commands to its log and replicates them with AppendEntries, which carry the previous entry's index and term so followers can detect gaps. Once an entry from the current term is on a majority, it's committed and applied everywhere in order.","f":["Why must a leader not commit an earlier term's entry by counting replicas?","What does PreVote fix?"]},{"c":"Consensus","q":"How would you implement a distributed lock safely?","a":"First I ask what the lock protects. If it only avoids duplicate work, a lease in Redis is fine, because an occasional double run is harmless. If correctness depends on it, I use a consensus-backed service such as etcd or ZooKeeper and fencing tokens: every grant comes with an increasing number, every write carries it, and the protected resource rejects tokens lower than the highest it has seen. That handles a holder that pauses past its lease, which no lease length or pre-write check can prevent.","f":["What if the protected resource can't check tokens?","How does etcd provide the token?"]},{"c":"Consensus","q":"Why can't we order events across machines by their timestamps, and what do we use instead?","a":"Clocks drift and NTP can step them backwards, so two machines' timestamps don't reliably say which event came first, and last-write-wins on them silently drops writes. For a total order we use a consensus log; for causality, Lamport clocks give an order consistent with cause and effect, and vector clocks also detect concurrent updates. Hybrid logical clocks combine a physical timestamp with a counter, so they stay close to wall time but respect causality; Spanner instead bounds clock uncertainty with TrueTime and waits it out.","f":["When would you choose vector clocks over hybrid clocks?","How does commit-wait work in Spanner?"]},{"c":"Storage","q":"B-tree or LSM tree: how do you choose a storage engine for a workload?","a":"I look at the read and write mix and the access patterns. B-trees update sorted pages in place, giving predictable point reads and excellent range scans, at the cost of random writes and page splits, so they suit read-heavy, update-heavy OLTP. LSM trees append to a log, flush sorted SSTables and compact them in the background, so writes are sequential and cheap; reads may check several files, helped by Bloom filters, and compaction costs I/O and causes latency spikes. Heavy ingestion of events, metrics or messages favours LSM. Then I benchmark with the real workload.","f":["What's write amplification, and how does compaction strategy change it?","Why do random UUID keys hurt B-tree inserts?"]},{"c":"Search and geo","q":"How does a search engine answer a query quickly, and how does it rank results?","a":"At indexing time each document is analyzed into terms and the engine keeps an inverted index: for each term, the sorted list of documents containing it. A query is analyzed the same way; the engine intersects or unions the posting lists, rarest term first and skipping through long lists, and scores only the matches, typically with BM25, which rewards rare terms, saturates repeated mentions and normalises by length. The index is sharded, each shard returns its top results to a coordinator, and production systems blend in other signals or rerank with a model.","f":["Why is a search index only near real time?","How would you add typo tolerance?"]},{"c":"Search and geo","q":"Design 'restaurants near me' for 10 million restaurants.","a":"Restaurants rarely move, so I index them by geohash, S2 or H3 cells and store cell to restaurant ids in a search engine or key-value store, sharded by region. A query picks a cell size at least as big as the radius, reads the cell and its neighbours, filters by exact distance and the must-match criteria, and ranks by text relevance, distance decay, rating and opening hours. Busy cells are cached, and where restaurants crowd together a quadtree, or a finer resolution, keeps cells small.","f":["What changes for moving objects such as drivers?","How do you handle the antimeridian and poles?"]},{"c":"Multi-region","q":"Active-passive or active-active: how do you choose for a multi-region service?","a":"I start from each system's RPO and RTO. Active-passive is simpler: one region writes, another holds replicas and standby capacity; failover means confirming the failure from a third location, fencing the old primary, promoting and moving traffic, which takes minutes, and asynchronous replication loses the lag. Active-active serves writes everywhere, with low latency and no promotion, but concurrent writes conflict, so I give each user or tenant a home region, use CRDTs where data can merge, or pay for a globally consistent database. Either way the survivors need headroom for a failed region's load.","f":["How much headroom do four regions need?","How do you test that failover works?"]},{"c":"Security","q":"How do you handle authentication and authorization across many services?","a":"Users sign in with an OpenID Connect provider and get short-lived access tokens; each service verifies the token's algorithm, signature, expiry, audience and issuer itself. Authorization happens in the service that owns the data, on every request, for the specific object, with roles, attributes or relationships, and denial by default. Service-to-service calls use mTLS with workload identities and least privilege, so nothing is trusted for being inside the network. Secrets come from a manager at run time, and decisions are logged.","f":["How do you revoke a JWT before it expires?","Where would you use relationship-based access control?"]},{"c":"Security","q":"How should data be encrypted at rest, and how do you rotate keys?","a":"With envelope encryption: data is encrypted with data keys, often one per tenant or object, and the data keys are encrypted by a master key that never leaves a KMS or HSM, which checks and logs every unwrap. Rotating the master key means re-wrapping the small data keys rather than re-encrypting the data, and rotating a data key re-encrypts only what it covers. Per-tenant keys also allow crypto-shredding: destroying the key makes every copy of that tenant's data unreadable, backups included.","f":["What does at-rest encryption not protect against?","How do you limit KMS calls on a hot path?"]},{"c":"Designs","q":"Design a payment system. What matters most?","a":"Correctness. Every request carries an idempotency key, so a retry after a timeout replays the first result instead of charging again; a payment is a state machine (created, authorized, captured, refunded) with sagas for refunds; money moves through an append-only double-entry ledger, so balances are derived and auditable; and daily reconciliation against the provider's and bank's records settles anything left unknown. Card data stays with a PCI-compliant provider behind tokens, the ledger replicates with zero RPO, and every external call has a timeout.","f":["What do you do with a payment whose outcome is unknown?","How do you make the idempotency check safe under concurrency?"]},{"c":"Designs","q":"Design a video streaming platform.","a":"Bandwidth dominates. Uploads go to object storage; a transcoding pipeline encodes a ladder of resolutions and bitrates, cut into segments of a few seconds with HLS or DASH manifests; CDNs serve the segments, with popular titles pushed to the edge ahead of demand; and the player's adaptive bitrate logic picks each segment's quality from throughput and buffer level. Metadata, search, recommendations and DRM are separate services, and playback telemetry feeds quality monitoring and encoding decisions.","f":["How would you handle a live event with millions of viewers?","How do you choose the encoding ladder?"]},{"c":"Designs","q":"Design a collaborative document editor.","a":"Every keystroke applies locally at once and goes to the server over a WebSocket. Concurrent edits are merged with operational transformation, where the server orders operations and each client transforms incoming ones against its own pending edits, or with a CRDT, where every character has a unique ordered id so edits merge in any order, even offline. Documents are stored as snapshots plus an operation log; presence and cursors are separate, lightweight streams; and permissions are checked per document on every operation.","f":["OT or CRDT for an offline-first app?","How do you keep the operation log from growing forever?"]},{"c":"Designs","q":"Design a distributed key-value store like Dynamo.","a":"Consistent hashing with virtual nodes places each key on N replicas and moves few keys when nodes join or leave. Writes and reads use tunable quorums, W + R > N for reading your own writes; sloppy quorums and hinted handoff keep writes available while a replica is down; vector clocks or last-writer-wins resolve conflicting versions; Merkle trees let replicas find and repair differences cheaply; and gossip spreads membership and failure suspicion. Each node stores data in an LSM engine.","f":["What does a sloppy quorum give up?","How would you add strongly consistent operations?"]}],"cheat":[{"t":"Transactions, events and streams","items":["2PC: prepare, then commit; blocks if the coordinator dies after prepare · keep it inside one cluster","Saga: local transactions plus compensations, in reverse on failure · orchestration (one coordinator) or choreography (events)","Outbox: change and event in one transaction, relayed at least once · inbox: dedupe by event id, in the consumer's transaction","Event sourcing: events are the truth; projections (CQRS) are rebuildable views · snapshots for long streams · upcast old events","Kafka: order per partition, so key by entity · one consumer per partition per group · rebalances redeliver","Streams: event time, windows (tumbling, sliding, session), watermark = newest − allowed lateness · exactly-once = checkpoint state + offsets, idempotent or transactional sinks"]},{"t":"Consensus, clocks and storage engines","items":["Majority of 2f+1 survives f failures · Raft: terms, randomized timeouts, one vote per term, up-to-date rule, commit current-term entries on a majority","Locks: lease + fencing token checked by the resource · efficiency locks can be best-effort","Clocks: Lamport (causal order), vector (detects concurrency), HLC (near wall time, causal) · never trust cross-machine timestamps","B-tree: pages in place, great reads and ranges · LSM: WAL + memtable + SSTables + compaction, great writes, Bloom filters for reads","WAL: fsync before ack · group commit shares fsyncs · amplification: write, read, space (pick two)"]},{"t":"Search, geo, regions and security","items":["Inverted index: term → sorted postings · same analyzer at index and query time · BM25: IDF × saturating TF, length-normalised","Search clusters: shards + replicas, scatter-gather top k, refresh ≈ 1 s · the index is a derived copy","Geohash: base-32 interleaved bits, search cell + 8 neighbours, cells ≥ radius · quadtrees adapt to density · H3/S2 cell ids","RPO = data lost (async: the lag) · RTO = time down · active-passive: confirm, fence, promote, move · active-active: home regions or CRDTs","Headroom: n regions run at most (n − 1)/n · residency covers backups, logs and analytics","AuthN: OIDC, short-lived JWTs; verify alg, signature, exp, aud, iss · AuthZ per object, deny by default · mTLS between services · envelope encryption in a KMS"]},{"t":"Classic designs","items":["Video: transcode ladder → segments + manifest → CDN → ABR (throughput and buffer)","Ride-hailing: in-memory geo index per city, TTL, conditional driver assignment, trip state machine","Docs: local apply, OT (server orders) or CRDT (unique ids), snapshots + op log","Payments: idempotency keys, double-entry ledger, state machine, reconciliation, tokenized cards","Crawler: per-host queues + delays, robots.txt, URL and content dedup, recrawl by change rate","KV store: consistent hashing + vnodes, N/W/R quorums, hinted handoff, Merkle trees, gossip"]},{"t":"Review checklist for an L3 design","items":["What dominates: bandwidth, correctness, latency, convergence or availability?","Where can a crash split two writes apart, and what makes each step idempotent?","What happens in a partition: who stops, who carries on, and what's fenced?","What are the RPO and RTO, and has the failover been rehearsed?","Who may do what to which object, and where is that checked?"]}],"glossary":[["Adaptive bitrate (ABR)","Player logic that picks each video segment's quality from measured throughput and buffer level."],["AppendEntries","The Raft message a leader uses to replicate log entries and to send heartbeats."],["BM25","A ranking function that scores documents by inverse document frequency and saturating, length-normalised term frequency."],["Bloom filter","A compact bit array that answers 'definitely not present' or 'maybe present'."],["Checkpoint","A consistent snapshot of a stream job's state and input offsets, used to recover after a crash."],["Compaction","Merging an LSM tree's SSTables, dropping overwritten values and expired tombstones."],["Compensating action","A step that semantically undoes an earlier saga step, such as a refund for a charge."],["Consistent hashing","Placing keys and nodes on a hash ring so that adding a node moves only a small share of keys."],["CQRS","Command and query responsibility segregation: writes go to one model, reads to projections built from it."],["CRDT","A conflict-free replicated data type, whose replicas can be updated independently and always merge to the same state."],["Crypto-shredding","Deleting data by destroying the key that encrypted it, which makes every copy unreadable."],["Double-entry ledger","An append-only record in which every transaction debits one account and credits another by the same amount."],["Envelope encryption","Encrypting data with data keys that are themselves encrypted by a master key held in a KMS."],["Event sourcing","Storing every change as an immutable event, and deriving current state by replaying them."],["Fencing token","An increasing number issued with each lock grant, so a resource can reject requests from an older holder."],["Geohash","A string naming a latitude-longitude cell, built from interleaved bits; longer strings name smaller cells."],["Hinted handoff","A replica temporarily storing writes meant for an unavailable node, and handing them over when it returns."],["Hybrid logical clock (HLC)","A timestamp of physical time plus a counter, close to wall time but consistent with causality."],["Idempotency key","A client-chosen key that lets a server recognise a retried request and replay the first result."],["Inbox","A table of processed message ids that a consumer checks in the same transaction as its work, to skip duplicates."],["Inverted index","A map from each term to the sorted list of documents that contain it."],["Lamport clock","A counter attached to events and messages that orders them consistently with cause and effect."],["LSM tree","A storage engine that buffers writes in memory, flushes sorted immutable files and merges them in the background."],["Memtable","An LSM tree's in-memory sorted buffer of recent writes."],["Merkle tree","A tree of hashes over key ranges that lets two replicas find their differences by comparing a few hashes."],["mTLS","Mutual TLS: both ends of a connection present certificates, so each authenticates the other."],["Operational transformation (OT)","Adjusting each edit against concurrent edits it didn't know about, so every copy converges."],["Outbox","A table where a service writes events in the same transaction as its state change, for a relay to publish."],["Projection","A read model built by consuming events, such as an order page or a search index."],["Raft","A consensus algorithm in which an elected leader replicates a log that a majority of servers must store."],["RPO","Recovery point objective: the most recent data a failure is allowed to lose."],["RTO","Recovery time objective: how long a service may be down after a failure."],["Saga","A business transaction split into local transactions, each with a compensating action."],["Split brain","Two nodes or regions both acting as primary and accepting writes at once."],["SSTable","A sorted, immutable file of key-value pairs written by an LSM tree."],["Tombstone","A marker that records a deletion until compaction removes the deleted value and the marker."],["Vector clock","One counter per node attached to events, which reveals whether two events are causally ordered or concurrent."],["Watermark","A stream processor's estimate that no events older than a given time are still coming."],["Write-ahead log (WAL)","An append-only log of changes, flushed before a write is acknowledged and replayed after a crash."],["Zero trust","Granting no trust for network location: every request is authenticated and authorized."]],"sourceGroups":[{"t":"Books and papers","items":[["Designing Data-Intensive Applications, 2nd edition (2026)","https://martin.kleppmann.com/2026/03/24/designing-data-intensive-applications-2e.html","A5 R5 D5 · paid, the core book for L3"],["Ongaro and Ousterhout: In Search of an Understandable Consensus Algorithm (Raft)","https://raft.github.io/raft.pdf","A5 R4 D5 · free"],["Dynamo: Amazon's highly available key-value store (SOSP 2007)","https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","A5 R2 D5 · free"],["Akidau et al.: The Dataflow Model (VLDB 2015)","https://www.vldb.org/pvldb/vol8/p1792-Akidau.pdf","A5 R3 D5 · free"],["Zanzibar: Google's Consistent, Global Authorization System","https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/","A5 R4 D5 · free"],["NIST SP 800-207: Zero Trust Architecture","https://csrc.nist.gov/pubs/sp/800/207/final","A5 R4 D4 · free"]]},{"t":"Official documentation","items":[["Apache Kafka documentation: Design","https://kafka.apache.org/43/design/design/","A5 R5 D5 · free"],["Apache Flink docs: Stateful stream processing","https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/stateful-stream-processing/","A5 R5 D5 · free"],["RocksDB wiki: Leveled compaction","https://github.com/facebook/rocksdb/wiki/Leveled-Compaction","A5 R5 D5 · free"],["Elasticsearch docs: Similarity settings","https://www.elastic.co/docs/reference/elasticsearch/index-settings/similarity","A5 R5 D4 · free"],["AWS whitepaper: Disaster recovery options in the cloud","https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html","A5 R5 D4 · free"],["RFC 8725: JSON Web Token Best Current Practices","https://www.rfc-editor.org/rfc/rfc8725","A5 R4 D4 · free"]]},{"t":"Engineering write-ups","items":[["Martin Kleppmann: How to do distributed locking","https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html","A5 R3 D5 · free"],["Jay Kreps: Questioning the Lambda Architecture","https://www.oreilly.com/radar/questioning-the-lambda-architecture/","A5 R3 D4 · free"],["Google SRE book: Managing critical state","https://sre.google/sre-book/managing-critical-state/","A5 R3 D5 · free"],["Stripe API reference: Idempotent requests","https://docs.stripe.com/api/idempotent_requests","A5 R5 D4 · free"]]},{"t":"Practice and certification","items":[["OWASP API Security Top 10 (2023)","https://api-security.owasp.org/editions/2023/en/0x11-t10/","A5 R4 D4 · free"],["The Raft site and RaftScope visualization","https://raft.github.io/","A5 R4 D4 · free"]]}],"aiCtx":"The learner is at System Design level L3 Specialist: distributed transactions (two-phase commit, sagas, outbox and inbox patterns, idempotent consumers), event-driven architecture (event sourcing, CQRS, schema evolution, Kafka partitions and consumer groups), stream and batch processing (Lambda and Kappa architectures, windowing with event time and watermarks, exactly-once processing), consensus and coordination (Raft, leader election, distributed locks with fencing tokens, Lamport, vector and hybrid logical clocks), storage engines (B-trees, LSM trees, write-ahead logs and their trade-offs), search and geo (inverted indexes, ranking, geohashes and quadtrees), multi-region design and disaster recovery (active-active and active-passive, RTO and RPO, failover, data residency), security architecture (authentication and authorization at scale, zero trust, secrets, encryption) and classic large designs (video streaming, ride hailing, collaborative documents, payments, a web crawler, a distributed key-value store). They have finished System Design L1 and L2 and code in Python 3.12+ and JavaScript (Node.js 22). Use concrete numbers and small simulations, name the trade-off behind every choice, and say when a number is a rule of thumb. Never invent product limits or prices; if unsure, say so.","storyWorld":"Pizza Town and the family road trip","kidMapHead":"In a real system","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the simulation before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps in order.","**Code drop-downs**: complete Python or JavaScript. Each was checked so only one combination works.","**Matching**: map techniques to the problems they solve."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to pick the right technique for a scenario. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is a product with real numbers. Read the scenario tabs, then choose the design and justify it.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Papers, RFCs, official documentation and well-known free references, all checked on 12 Oct 2026.","sourcesTab":"Resources","freshStyle":"in the style of a product-design interview (a short scenario with numbers, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Networking and latency, scaling, availability, load balancing, caching, CDNs, storage, APIs, estimation","x":"done first"},{"k":"L2 Proficient","t":"Design common products (feed, chat, rate limiter) with sound trade-offs","x":"done"},{"k":"L3 Specialist","t":"Distributed, data-intensive systems: payments, streaming, search, geo","x":"this hub","cur":true},{"k":"L4 Expert","t":"Architecture leadership: reviews, capacity and cost, organisation-level design","x":"later"}],"ladderTitle":"Your system design ladder","ladderNote":"Each level is its own hub","deck":"system-design-l3","examinerRole":"senior engineer running a product-design interview","aiCheck":"Written by Claude for this hub. Check surprising claims against the linked papers, RFCs and official documentation, and run the code yourself."};

(function () {

const M = H.modules;

const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LET = "ABCDEFGHIJKL";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

function inl(s) {

}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(iso, opts) { try { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return iso; } }
function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }

async function copyText(txt, btn) {

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));
(H.mocks || []).forEach(mk => (mk.items || []).forEach((q, i) => regItem(q, "mock" + mk.id + "." + (i + 1), { src: "Mock " + mk.id })));
(H.diag || []).forEach((q, i) => regItem(q, "diag." + (i + 1), { src: "Diagnostic" }));

let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {

    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }
    else setSync("error");
  } finally {
    SYNC.busy[part] = false;
    if (SYNC.again[part]) { SYNC.again[part] = false; flush(part); }
  }
}
function applyRemote(part, data) {
  if (!data || typeof data !== "object") return false;
  if ((data.upd || 0) <= (U[part] || 0)) return false;
  if (part === "main" && data.S) { S = Object.assign(defState(), data.S); }
  else if (part === "mocks" && Array.isArray(data.list)) { MOCKS = data.list; }
  else if (part === "cards" && data.map) { CARDS = data.map; }
  else return false;
  U[part] = data.upd; return true;
}
async function pullRemote() {
  if (!SYNC.db) return false;
  let changed = false;
  for (const part of ["main", "mocks", "cards"]) {
    try {
      const snap = await SYNC.db.doc(SYNC.base + "/" + part).get();
      if (snap.exists) { if (applyRemote(part, snap.data())) changed = true; else if ((U[part] || 0) > ((snap.data() || {}).upd || 0)) flush(part); }
      else if (U[part]) flush(part);
    } catch (e) { setSync("error"); return changed; }
  }
  saveLocal();
  return changed;
}
async function initSync() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("loading");
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
  if (!db) { setSync("local"); return; }
  let owner = false, uid = null;
  try { owner = user ? await user.isOwner() : false; uid = user ? await user.id() : null; } catch (e) { }
  const base = owner ? "progress" : (uid ? "data/users/" + uid : null);
  if (!base) { setSync("local"); return; }
  SYNC.db = db; SYNC.base = base;
  const changed = await pullRemote();
  if (SYNC.db && SYNC.state !== "error") setSync("cloud");
  if (changed) rerenderAll();
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && SYNC.db && !MOCKRUN) { if (await pullRemote()) rerenderAll(); }
  });
}

/* ---------- derived stats ---------- */
function doneCount() { return M.filter(m => S.done[m.id]).length; }
function dWeight(did) { const d = DMAP[did]; return d ? (d.w[0] + d.w[1]) / 2 : 0; }
function recordAnswer(it, score, given) {
  const d = it.d; if (d) { const ds = S.dstat[d] || [0, 0]; ds[0] += score; ds[1] += 1; S.dstat[d] = [Math.round(ds[0] * 100) / 100, ds[1]]; }

   ${l.starter ? codeBox(l.starter) : ""}
   ${list("Prove it worked", l.verify)}${list("Break it (then fix it)", l.breakit)}
   ${l.solution ? `<details class="d"><summary>Reference solution</summary><div>${codeBox(l.solution)}</div></details>` : ""}
   ${l.teardown ? codeBox({ t: "Teardown", lang: l.teardownLang || "bash", src: l.teardown }) : ""}
   ${l.link ? `<p style="margin:0"><a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.linkText || "Open the official lab instructions")}</a></p>` : ""}</div></details>`).join("")}`;
  $$("[data-lab]", v).forEach(cb => { cb.addEventListener("click", e => e.stopPropagation()); cb.addEventListener("change", () => { S.labs[cb.dataset.lab] = cb.checked ? today() : undefined; touch("main"); }); });
  applyLang(v);
};

/* ---------- FLASHCARDS (Leitner boxes, spaced) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function allCards() { const out = []; M.forEach(m => (m.qa || []).forEach((q, i) => out.push({ id: m.id + ".c" + (i + 1), d: m.d, t: m.t, q: q[0], a: q[1] }))); (H.cards || []).forEach((c, i) => out.push({ id: "x." + (i + 1), d: c.d, t: c.t || "Extra", q: c.q, a: c.a })); return out; }
let FC = { list: [], i: 0, flip: false, filter: "due" };
function buildFC() {
  const all = allCards(), tn = dayNum(today()), f = FC.filter;
  let list = all.filter(c => f === "due" ? (CARDS[c.id] ? CARDS[c.id][1] <= tn : true) : f === "all" ? true : f.startsWith("m:") ? c.id.startsWith(f.slice(2) + ".") : c.d === f);
  if (f === "due") { const seen = list.filter(c => CARDS[c.id]), fresh = list.filter(c => !CARDS[c.id]); list = shuffle(seen).concat(fresh.slice(0, 20)); } else list = shuffle(list);
  FC.list = list; FC.i = 0; FC.flip = false;
}
RENDER.cards = function () {
  if (!FC.list.length || FC.i >= FC.list.length) buildFC();
  const v = $("#v-cards"), all = allCards(), tn = dayNum(today());
  const due = all.filter(c => CARDS[c.id] && CARDS[c.id][1] <= tn).length, unseen = all.filter(c => !CARDS[c.id]).length;
  const boxes = [0, 0, 0, 0, 0, 0]; all.forEach(c => { boxes[CARDS[c.id] ? CARDS[c.id][0] : 0]++; });
  const c = FC.list[FC.i];
  v.innerHTML = `<div class="fc"><div class="eyebrow">Spaced retrieval</div><h2 class="h-view">Flashcards</h2>
  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn small" id="fCopy">Copy card progress for Claude</button></div><p class="small muted" style="text-align:center;margin:.4em 0 0">Paste it in our chat to sync these cards with the deck in your vault.</p></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  $("#fCopy").addEventListener("click", e => { const tn2 = dayNum(today()); const prog = Object.keys(CARDS).map(id => ({ id, box: CARDS[id][0], due_in_days: CARDS[id][1] - tn2 })); copyText(`My ${H.code} flashcard progress from the Study Hub (deck ${H.deck || H.id}). Please update the vault deck to match:\n` + JSON.stringify(prog), e.currentTarget); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
