t dist[t] == INF\n    zo = [(u, v, w % 2) for u, v, w in edges]                # the same graph with 0/1 weights\n    assert zero_one_bfs(n, zo, s) == dijkstra(n, zo, s)[0]\n    pot = [random.randint(0, 9) for _ in range(n)]            # w + pot[u] - pot[v]: negative edges,\n    neg = [(u, v, w + pot[u] - pot[v]) for u, v, w in edges]  # but every cycle keeps its total\n    fw = floyd_warshall(n, neg)\n    assert all(fw[i] == bellman_ford(n, neg, i) for i in range(n))\n    a, b = random.randrange(n), random.randrange(n)           # plant a cycle a -> b -> a of weight -1\n    bad = neg + [(s, a, 5), (a, b, 3), (b, a, -4)]\n    assert bellman_ford(n, bad, s) is None and floyd_warshall(n, bad)[a][a] < 0\nassert bellman_ford(4, [(0, 1, 1), (2, 3, 1), (3, 2, -3)], 0) == [0, 1, INF, INF]   # unreachable cycle\n\nroads = [(0, 1, 4), (0, 2, 1), (2, 1, 2), (1, 3, 1), (2, 3, 5), (3, 4, 3)]\ndist, parent = dijkstra(5, roads, 0)\nzo = zero_one_bfs(5, [(u, v, w % 2) for u, v, w in roads], 0)\nfw = floyd_warshall(5, roads + [(4, 1, -4)])\ncycle = bellman_ford(5, roads + [(4, 1, -5)], 0) is None\nprint(\"dist\", *dist, \"| path\", *path_to(dist, parent, 4), \"| 0-1 BFS\", *zo,\n      \"| d[4][3] =\", fw[4][3], \"| negative cycle:\", \"yes\" if cycle else \"no\")\n","out":"dist 0 3 1 4 7 | path 0 2 1 3 4 | 0-1 BFS 0 0 1 1 2 | d[4][3] = -3 | negative cycle: yes"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass MinHeap {                                // a binary heap of [key, value] pairs\n  constructor() { this.a = []; }\n  get size() { return this.a.length; }\n  push(item) {\n    const a = this.a;\n    a.push(item);\n    let i = a.length - 1;\n    while (i > 0 && a[(i - 1) >> 1][0] > a[i][0]) {\n      const p = (i - 1) >> 1;\n      [a[i], a[p]] = [a[p], a[i]];\n      i = p;\n    }\n  }\n  pop() {\n    const a = this.a, top = a[0], last = a.pop();\n    if (a.length) {\n      a[0] = last;\n      for (let i = 0; ;) {\n        let m = i;\n        for (const c of [2 * i + 1, 2 * i + 2]) if (c < a.length && a[c][0] < a[m][0]) m = c;\n        if (m === i) break;\n        [a[i], a[m]] = [a[m], a[i]];\n        i = m;\n      }\n    }\n    return top;\n  }\n}\n\nfunction adjacency(n, edges) {                 // directed [u, v, w] edges -> adjacency lists\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v, w] of edges) adj[u].push([v, w]);\n  return adj;\n}\n\nfunction dijkstra(n, edges, src) {             // O((V + E) log V) time, O(V + E) space\n  const adj = adjacency(n, edges);\n  const dist = new Array(n).fill(Infinity), parent = new Array(n).fill(-1);\n  dist[src] = 0;\n  const heap = new MinHeap();\n  heap.push([0, src]);\n  while (heap.size) {\n    const [d, u] = heap.pop();\n    if (d > dist[u]) continue;                 // stale entry: u was already reached more cheaply\n    for (const [v, w] of adj[u]) {\n      if (d + w < dist[v]) {\n        dist[v] = d + w;\n        parent[v] = u;\n        heap.push([d + w, v]);                 // lazy deletion: the old entry stays behind\n      }\n    }\n  }\n  return [dist, parent];\n}\n\nfunction pathTo(dist, parent, t) {             // the vertices from the source to t\n  if (dist[t] === Infinity) return [];\n  const path = [];\n  for (; t !== -1; t = parent[t]) path.push(t);\n  return path.reverse();\n}\n\nfunction zeroOneBfs(n, edges, src) {           // weights 0 or 1 only: O(V + E)\n  const adj = adjacency(n, edges);\n  const dist = new Array(n).fill(Infinity);\n  dist[src] = 0;\n  const front = [], back = [src];              // deque = front (a stack) + back (read from head)\n  let head = 0;\n  while (front.length || head < back.length) {\n    const u = front.length ? front.pop() : back[head++];\n    for (const [v, w] of adj[u]) {\n      if (dist[u] + w < dist[v]) {\n        dist[v] = dist[u] + w;\n        if (w === 0) front.push(v);            // same distance as u: to the front\n        else back.push(v);                     // one more: to the back\n      }\n    }\n  }\n  return dist;\n}\n\nfunction bellmanFord(n, edges, src) {          // O(V * E); null if a negative cycle is reachable\n  const dist = new Array(n).fill(Infinity);\n  dist[src] = 0;\n  for (let round = 1; round < n; round++) {\n    let changed = false;\n    for (const [u, v, w] of edges) {\n      if (dist[u] + w < dist[v]) {\n        dist[v] = dist[u] + w;\n        changed = true;\n      }\n    }\n    if (!changed) break;\n  }\n  for (const [u, v, w] of edges) if (dist[u] + w < dist[v]) return null;   // still improving: a cycle\n  return dist;\n}\n\nfunction floydWarshall(n, edges) {             // all pairs: O(V^3) time, O(V^2) space\n  const d = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : Infinity)));\n  for (const [u, v, w] of edges) d[u][v] = Math.min(d[u][v], w);\n  for (let k = 0; k < n; k++)                  // k outermost: allow 0..k as stops\n    for (let i = 0; i < n; i++) {\n      if (d[i][k] === Infinity) continue;\n      for (let j = 0; j < n; j++) if (d[i][k] + d[k][j] < d[i][j]) d[i][j] = d[i][k] + d[k][j];\n    }\n  return d;\n}\n\nconst pathCost = (edges, p) => p.slice(1).reduce((sum, v, i) =>   // cheapest edge for each step\n  sum + Math.min(...edges.filter(([a, b]) => a === p[i] && b === v).map(e => e[2])), 0);\n\nconst rnd = k => Math.floor(Math.random() * k);\nfor (let trial = 0; trial < 300; trial++) {\n  const n = 1 + rnd(7);\n  const edges = Array.from({ length: rnd(16) }, () => [rnd(n), rnd(n), rnd(10)]);\n  const s = rnd(n);\n  const [dist, parent] = dijkstra(n, edges, s);\n  assert.deepStrictEqual(dist, bellmanFord(n, edges, s));\n  for (let t = 0; t < n; t++) {\n    const p = pathTo(dist, parent, t);\n    if (p.length) assert.ok(p[0] === s && p.at(-1) === t && pathCost(edges, p) === dist[t]);\n    else assert.strictEqual(dist[t], Infinity);\n  }\n  const zo = edges.map(([u, v, w]) => [u, v, w % 2]);                // the same graph with 0/1 weights\n  assert.deepStrictEqual(zeroOneBfs(n, zo, s), dijkstra(n, zo, s)[0]);\n  const pot = Array.from({ length: n }, () => rnd(10));              // w + pot[u] - pot[v]: negative edges,\n  const neg = edges.map(([u, v, w]) => [u, v, w + pot[u] - pot[v]]);  // but every cycle keeps its total\n  const fw = floydWarshall(n, neg);\n  for (let i = 0; i < n; i++) assert.deepStrictEqual(fw[i], bellmanFord(n, neg, i));\n  const a = rnd(n), b = rnd(n);                                       // plant a cycle a -> b -> a of weight -1\n  const bad = [...neg, [s, a, 5], [a, b, 3], [b, a, -4]];\n  assert.ok(bellmanFord(n, bad, s) === null && floydWarshall(n, bad)[a][a] < 0);\n}\nassert.deepStrictEqual(bellmanFord(4, [[0, 1, 1], [2, 3, 1], [3, 2, -3]], 0), [0, 1, Infinity, Infinity]);\n\nconst roads = [[0, 1, 4], [0, 2, 1], [2, 1, 2], [1, 3, 1], [2, 3, 5], [3, 4, 3]];\nconst [dist, parent] = dijkstra(5, roads, 0);\nconst zo = zeroOneBfs(5, roads.map(([u, v, w]) => [u, v, w % 2]), 0);\nconst fw = floydWarshall(5, [...roads, [4, 1, -4]]);\nconst cycle = bellmanFord(5, [...roads, [4, 1, -5]], 0) === null;\nconsole.log(\"dist\", ...dist, \"| path\", ...pathTo(dist, parent, 4), \"| 0-1 BFS\", ...zo,\n  \"| d[4][3] =\", fw[4][3], \"| negative cycle:\", cycle ? \"yes\" : \"no\");\n","out":"dist 0 3 1 4 7 | path 0 2 1 3 4 | 0-1 BFS 0 0 1 1 2 | d[4][3] = -3 | negative cycle: yes"}]},"breakit":["Give Dijkstra negative edges but no negative cycle: 0→1 (2), 0→2 (3), 2→1 (−2), 1→3 (1). Your lazy version still matches Bellman–Ford, because it re-processes any vertex whose distance drops (and so loses its O((V + E) log V) bound). Now add a `done` flag that skips a vertex popped before, as textbook Dijkstra does: vertex 3 comes out as 3 instead of 2.","Move Floyd–Warshall's k loop inside the i and j loops. The check against Bellman–Ford now fails on every run, because each d[i][j] is settled in one pass over k, before d[i][k] and d[k][j] hold their shortest values, so paths with two or more stops can be missed."]},{"id":"lab-lowlink","t":"Bridges, cut vertices and an Euler path","min":90,"mods":["m03"],"goal":"Find every bridge and cut vertex of an undirected graph with one low-link DFS, written with an explicit stack so it survives a 100,000-vertex path in Python. Then build a directed Euler path with Hierholzer's algorithm, and check both against brute force on random small graphs.","pre":["Python 3.12+ and Node.js 22+","Module 03"],"steps":["`bridges_and_cuts(n, edges)` returns the bridges as sorted (smaller, larger) pairs and the cut vertices in order, like module 03's version. Store the graph as adjacency lists of (neighbour, edge id); each vertex gets a discovery time `tin` and a low-link value `low`: the smallest `tin` its DFS subtree can reach with one back edge.","Make the DFS iterative: a stack of (vertex, id of the edge it was reached by), plus `nxt[u]`, the next adjacency index to try. Skip only the edge you arrived by (by its id), so a repeated edge counts as a second route.","When vertex u is finished, pop it and update its parent p: `low[p] = min(low[p], low[u])`. The edge p–u is a bridge when `low[u] > tin[p]`, and p is a cut vertex when `low[u] >= tin[p]`, except a DFS root, which is a cut vertex only when it has two or more DFS children.","`euler_path(n, edges)` for a directed graph: check the degrees (every vertex balanced, except at most one start with one extra out-edge and one end with one extra in-edge), then walk unused edges with a stack, adding a vertex to the path whenever it's stuck. Reverse the path at the end, and return an empty one if any edge was never used.","Test 400 random graphs (up to 8 vertices, with self-loops and repeated edges) against brute force: remove each edge or vertex and count the components. For Euler paths, compare with a brute force that tries every order of the edges, and check that the path uses each edge exactly once."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\n\ndef bridges_and_cuts(n, edges):                 # undirected; O(V + E) time and space, no recursion\n    adj = [[] for _ in range(n)]\n    for i, (u, v) in enumerate(edges):\n        adj[u].append((v, i))\n        adj[v].append((u, i))\n    tin, low, nxt = [-1] * n, [0] * n, [0] * n  # nxt[u]: the next adjacency index to try\n    bridges, cut, timer = [], set(), 0\n    for root in range(n):\n        if tin[root] != -1:\n            continue\n        tin[root] = low[root] = timer\n        timer += 1\n        stack, root_kids = [(root, -1)], 0      # (vertex, id of the edge it was reached by)\n        while stack:\n            u, came_by = stack[-1]\n            if nxt[u] < len(adj[u]):\n                v, eid = adj[u][nxt[u]]\n                nxt[u] += 1\n                if eid == came_by:              # skip only that edge, so a parallel edge counts\n                    continue\n                if tin[v] == -1:                # tree edge: go down\n                    tin[v] = low[v] = timer\n                    timer += 1\n                    stack.append((v, eid))\n                    if u == root:\n                        root_kids += 1\n                else:                           # back edge (or a self-loop)\n                    low[u] = min(low[u], tin[v])\n            else:                               # u is finished: report to its parent\n                stack.pop()\n                if stack:\n                    p = stack[-1][0]\n                    low[p] = min(low[p], low[u])\n                    if low[u] > tin[p]:\n                        bridges.append((min(p, u), max(p, u)))\n                    if low[u] >= tin[p] and p != root:\n                        cut.add(p)\n        if root_kids > 1:                       # the root is a cut vertex only with 2+ children\n            cut.add(root)\n    return sorted(bridges), sorted(cut)         # bridges as (smaller, larger) pairs, cut vertices\n\ndef euler_path(n, edges):                       # directed; Hierholzer, O(V + E); [] if none\n    out, diff = [[] for _ in range(n)], [0] * n # diff: out-degree minus in-degree\n    for u, v in edges:\n        out[u].append(v)\n        diff[u] += 1\n        diff[v] -= 1\n    starts = [v for v in range(n) if diff[v] == 1]\n    if not edges or any(abs(d) > 1 for d in diff) or len(starts) > 1:\n        return []\n    start = starts[0] if starts else edges[0][0]\n    nxt, stack, path = [0] * n, [start], []\n    while stack:\n        u = stack[-1]\n        if nxt[u] < len(out[u]):\n            stack.append(out[u][nxt[u]])        # walk on along an unused edge\n            nxt[u] += 1\n        else:\n            path.append(stack.pop())            # stuck: u joins the path (built backwards)\n    path.reverse()\n    return path if len(path) == len(edges) + 1 else []   # edges left over: not connected\n\ndef components(n, edges, skip=-1):              # brute force: count components without vertex skip\n    adj = [[] for _ in range(n)]\n    for u, v in edges:\n        if skip not in (u, v):\n            adj[u].append(v)\n            adj[v].append(u)\n    seen, count = {skip}, 0\n    for s in range(n):\n        if s not in seen:\n            count += 1\n            seen.add(s)\n            stack = [s]\n            while stack:\n                for v in adj[stack.pop()]:\n                    if v not in seen:\n                        seen.add(v)\n                        stack.append(v)\n    return count\n\ndef has_euler_path(edges):                      # brute force: try every order of the edges\n    used = [False] * len(edges)\n    def walk(at, left):\n        if left == 0:\n            return True\n        for i, (u, v) in enumerate(edges):\n            if not used[i] and (at is None or at == u):\n                used[i] = True\n                found = walk(v, left - 1)\n                used[i] = False\n                if found:\n                    return True\n        return False\n    return bool(edges) and walk(None, len(edges))\n\nfor _ in range(400):\n    n = random.randint(1, 8)\n    edges = [(random.randrange(n), random.randrange(n)) for _ in range(random.randint(0, 10))]\n    c = components(n, edges)\n    bridges, cut = bridges_and_cuts(n, edges)\n    assert bridges == sorted((min(u, v), max(u, v)) for i, (u, v) in enumerate(edges)\n                             if components(n, edges[:i] + edges[i + 1:]) > c)\n    assert cut == [v for v in range(n) if components(n, edges, skip=v) > c]\nfor _ in range(400):\n    n = random.randint(1, 5)\n    if random.random() < 0.5:                   # the steps of a random walk always have an Euler path\n        walk = [random.randrange(n) for _ in range(random.randint(2, 8))]\n        edges = list(zip(walk, walk[1:]))\n        random.shuffle(edges)\n    else:\n        edges = [(random.randrange(n), random.randrange(n)) for _ in range(random.randint(0, 7))]\n    p = euler_path(n, edges)\n    assert bool(p) == has_euler_path(edges)\n    if p:                                       # follows the edges and uses each one exactly once\n        assert sorted(zip(p, p[1:])) == sorted(edges)\n\nn = 100_000                                     # a path this long would break a recursive DFS\nbridges, cut = bridges_and_cuts(n, [(i, i + 1) for i in range(n - 1)])\nassert len(bridges) == n - 1 and len(cut) == n - 2\ng = [(0, 1), (1, 2), (2, 0), (2, 3), (3, 4), (4, 5), (5, 3), (5, 6)]\nbr, cv = bridges_and_cuts(7, g)\ntrip = euler_path(5, [(3, 4), (0, 3), (1, 2), (2, 0), (0, 1)])\nprint(\"bridges\", *(f\"{a}-{b}\" for a, b in br), \"| cut vertices\", *cv,\n      f\"| path of {n}: {len(bridges)} bridges, {len(cut)} cut vertices | Euler\", *trip)\n","out":"bridges 2-3 5-6 | cut vertices 2 3 5 | path of 100000: 99999 bridges, 99998 cut vertices | Euler 0 1 2 0 3 4"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nconst byPair = (a, b) => a[0] - b[0] || a[1] - b[1];\n\nfunction bridgesAndCuts(n, edges) {             // undirected; O(V + E) time and space, no recursion\n  const adj = Array.from({ length: n }, () => []);\n  edges.forEach(([u, v], i) => { adj[u].push([v, i]); adj[v].push([u, i]); });\n  const tin = new Array(n).fill(-1), low = new Array(n).fill(0), nxt = new Array(n).fill(0);\n  const bridges = [], cut = new Set();\n  let timer = 0;\n  for (let root = 0; root < n; root++) {\n    if (tin[root] !== -1) continue;\n    tin[root] = low[root] = timer++;\n    const stack = [[root, -1]];                 // [vertex, id of the edge it was reached by]\n    let rootKids = 0;\n    while (stack.length) {\n      const [u, cameBy] = stack.at(-1);\n      if (nxt[u] < adj[u].length) {\n        const [v, eid] = adj[u][nxt[u]++];\n        if (eid === cameBy) continue;           // skip only that edge, so a parallel edge counts\n        if (tin[v] === -1) {                    // tree edge: go down\n          tin[v] = low[v] = timer++;\n          stack.push([v, eid]);\n          if (u === root) rootKids++;\n        } else low[u] = Math.min(low[u], tin[v]);   // back edge (or a self-loop)\n      } else {                                  // u is finished: report to its parent\n        stack.pop();\n        if (stack.length) {\n          const p = stack.at(-1)[0];\n          low[p] = Math.min(low[p], low[u]);\n          if (low[u] > tin[p]) bridges.push([Math.min(p, u), Math.max(p, u)]);\n          if (low[u] >= tin[p] && p !== root) cut.add(p);\n        }\n      }\n    }\n    if (rootKids > 1) cut.add(root);            // the root is a cut vertex only with 2+ children\n  }\n  return [bridges.sort(byPair), [...cut].sort((a, b) => a - b)];   // [smaller, larger] pairs, vertices\n}\n\nfunction eulerPath(n, edges) {                  // directed; Hierholzer, O(V + E); [] if none\n  const out = Array.from({ length: n }, () => []), diff = new Array(n).fill(0);\n  for (const [u, v] of edges) {\n    out[u].push(v);\n    diff[u]++;                                  // diff: out-degree minus in-degree\n    diff[v]--;\n  }\n  const starts = diff.flatMap((d, v) => (d === 1 ? [v] : []));\n  if (!edges.length || diff.some(d => Math.abs(d) > 1) || starts.length > 1) return [];\n  const nxt = new Array(n).fill(0), stack = [starts.length ? starts[0] : edges[0][0]], path = [];\n  while (stack.length) {\n    const u = stack.at(-1);\n    if (nxt[u] < out[u].length) stack.push(out[u][nxt[u]++]);   // walk on along an unused edge\n    else path.push(stack.pop());                // stuck: u joins the path (built backwards)\n  }\n  path.reverse();\n  return path.length === edges.length + 1 ? path : [];   // edges left over: not connected\n}\n\nfunction components(n, edges, skip = -1) {      // brute force: count components without vertex skip\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) if (u !== skip && v !== skip) { adj[u].push(v); adj[v].push(u); }\n  const seen = new Set([skip]);\n  let count = 0;\n  for (let s = 0; s < n; s++) {\n    if (seen.has(s)) continue;\n    count++;\n    seen.add(s);\n    const stack = [s];\n    while (stack.length) {\n      for (const v of adj[stack.pop()]) if (!seen.has(v)) { seen.add(v); stack.push(v); }\n    }\n  }\n  return count;\n}\n\nfunction hasEulerPath(edges) {                  // brute force: try every order of the edges\n  const used = new Array(edges.length).fill(false);\n  const walk = (at, left) => {\n    if (left === 0) return true;\n    for (let i = 0; i < edges.length; i++) {\n      if (used[i] || (at !== null && at !== edges[i][0])) continue;\n      used[i] = true;\n      const found = walk(edges[i][1], left - 1);\n      used[i] = false;\n      if (found) return true;\n    }\n    return false;\n  };\n  return edges.length > 0 && walk(null, edges.length);\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nconst key = pairs => pairs.map(([u, v]) => `${u}>${v}`).sort().join(\" \");\nfor (let t = 0; t < 400; t++) {\n  const n = 1 + rnd(8);\n  const edges = Array.from({ length: rnd(11) }, () => [rnd(n), rnd(n)]);\n  const c = components(n, edges);\n  const [bridges, cut] = bridgesAndCuts(n, edges);\n  const want = edges.filter((_, i) => components(n, edges.toSpliced(i, 1)) > c);\n  assert.deepStrictEqual(bridges, want.map(([u, v]) => [Math.min(u, v), Math.max(u, v)]).sort(byPair));\n  assert.deepStrictEqual(cut, [...Array(n).keys()].filter(v => components(n, edges, v) > c));\n}\nfor (let t = 0; t < 400; t++) {\n  const n = 1 + rnd(5);\n  let edges;\n  if (Math.random() < 0.5) {                    // the steps of a random walk always have an Euler path\n    const walk = Array.from({ length: 2 + rnd(7) }, () => rnd(n));\n    edges = walk.slice(1).map((v, i) => [walk[i], v]).sort(() => Math.random() - 0.5);\n  } else edges = Array.from({ length: rnd(8) }, () => [rnd(n), rnd(n)]);\n  const p = eulerPath(n, edges);\n  assert.strictEqual(p.length > 0, hasEulerPath(edges));\n  if (p.length) assert.strictEqual(key(p.slice(1).map((v, i) => [p[i], v])), key(edges));   // uses each edge once\n}\n\nconst n = 100_000;                              // a path this long would break a recursive DFS\nconst [bridges, cut] = bridgesAndCuts(n, Array.from({ length: n - 1 }, (_, i) => [i, i + 1]));\nassert.ok(bridges.length === n - 1 && cut.length === n - 2);\nconst g = [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4], [4, 5], [5, 3], [5, 6]];\nconst [br, cv] = bridgesAndCuts(7, g);\nconst trip = eulerPath(5, [[3, 4], [0, 3], [1, 2], [2, 0], [0, 1]]);\nconsole.log(\"bridges\", ...br.map(([a, b]) => `${a}-${b}`), \"| cut vertices\", ...cv,\n  `| path of ${n}: ${bridges.length} bridges, ${cut.length} cut vertices | Euler`, ...trip);\n","out":"bridges 2-3 5-6 | cut vertices 2 3 5 | path of 100000: 99999 bridges, 99998 cut vertices | Euler 0 1 2 0 3 4"}]},"breakit":["Skip every edge back to the parent vertex instead of only the edge you arrived by. The brute-force check soon fails, and `bridges_and_cuts(2, [(0, 1), (0, 1)])` now reports the double edge 0–1 as a bridge.","Write the same DFS recursively and run it on the 100,000-vertex path: Python raises RecursionError (its default limit is 1,000 frames) and Node.js throws RangeError: Maximum call stack size exceeded."]},{"id":"lab-dp-masks","t":"Interval DP and bitmask DP against brute force","min":90,"mods":["m04","m05"],"goal":"Solve Burst Balloons (LeetCode 312) with interval DP, and the travelling salesman problem with Held–Karp's bitmask DP, rebuilding the tour itself. Check both against brute force that tries every order, for up to 7 balloons or cities.","pre":["Python 3.12+ and Node.js 22+","Modules 04 and 05"],"steps":["`max_coins(nums)`: pad the balloons with a 1 at each end. Let `dp[i][j]` be the most coins from bursting every balloon strictly between i and j, and try each k as the balloon burst *last* in that range: its neighbours are then a[i] and a[j], so the two sides don't affect each other.","Fill the table by increasing length j − i, so every shorter interval inside (i, j) is ready when you need it, and return the value for the whole padded range.","`held_karp(dist)` returns the cost and the tour (module 05's `tsp` returns only the cost). `dp[mask][v]` is the cheapest route that starts at city 0, visits exactly the cities in mask and ends at v. Only odd masks contain city 0. Each step adds one city u that isn't in the mask yet, improving `dp[mask | 1 << u][u]` with `dp[mask][v] + dist[v][u]`.","Close the tour with the smallest `dp[full][v] + dist[v][0]`, then rebuild it from a `parent` table, clearing each city's bit as you walk back to city 0.","Test 200 random cases: up to 7 balloons worth 0–9 (zeros included), and 2–7 cities with random one-way costs. Compare with a brute force over every bursting order and every permutation of the cities, and check that the tour visits each city once and costs what was claimed."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom itertools import permutations\n\ndef max_coins(nums):                            # interval DP: O(n^3) time, O(n^2) space\n    a = [1] + nums + [1]                        # a 1 at each end: the walls never burst\n    n = len(a)\n    dp = [[0] * n for _ in range(n)]            # dp[i][j]: best coins from the balloons strictly between i and j\n    for length in range(2, n):                  # shorter intervals first\n        for i in range(n - length):\n            j = i + length\n            dp[i][j] = max(dp[i][k] + a[i] * a[k] * a[j] + dp[k][j]   # k is the LAST balloon burst in (i, j),\n                           for k in range(i + 1, j))                  # so its neighbours are a[i] and a[j]\n    return dp[0][n - 1]\n\ndef held_karp(dist):                            # n >= 2 cities; O(2^n * n^2) time, O(2^n * n) space\n    n, INF = len(dist), float(\"inf\")\n    full = (1 << n) - 1\n    dp = [[INF] * n for _ in range(1 << n)]     # dp[mask][v]: cheapest route from 0 through mask, ending at v\n    parent = [[-1] * n for _ in range(1 << n)]\n    dp[1][0] = 0\n    for mask in range(1, 1 << n, 2):            # odd masks only: city 0 is always visited\n        for v in range(n):\n            if dp[mask][v] == INF:\n                continue\n            for u in range(n):\n                if mask >> u & 1:               # every city at most once\n                    continue\n                nxt, cost = mask | 1 << u, dp[mask][v] + dist[v][u]\n                if cost < dp[nxt][u]:\n                    dp[nxt][u], parent[nxt][u] = cost, v\n    best, last = min((dp[full][v] + dist[v][0], v) for v in range(1, n))\n    tour, mask, v = [], full, last              # walk the parents back to city 0\n    while v != -1:\n        tour.append(v)\n        mask, v = mask ^ 1 << v, parent[mask][v]\n    return best, tour[::-1] + [0]\n\ndef brute_coins(nums):                          # try every order of bursting: O(n! * n)\n    if not nums:\n        return 0\n    return max((nums[i - 1] if i > 0 else 1) * nums[i] * (nums[i + 1] if i + 1 < len(nums) else 1)\n               + brute_coins(nums[:i] + nums[i + 1:]) for i in range(len(nums)))\n\ndef brute_tsp(dist):                            # try every order of cities 1..n-1: O(n!)\n    n = len(dist)\n    return min(sum(dist[a][b] for a, b in zip((0,) + p, p + (0,))) for p in permutations(range(1, n)))\n\nfor _ in range(200):\n    nums = [random.randint(0, 9) for _ in range(random.randint(0, 7))]\n    assert max_coins(nums) == brute_coins(nums), nums\n    n = random.randint(2, 7)                    # random one-way costs: no triangle inequality\n    dist = [[0 if i == j else random.randint(1, 20) for j in range(n)] for i in range(n)]\n    cost, tour = held_karp(dist)\n    assert cost == brute_tsp(dist), dist\n    assert tour[0] == tour[-1] == 0 and sorted(tour[:-1]) == list(range(n))\n    assert sum(dist[a][b] for a, b in zip(tour, tour[1:])) == cost\n\ncost, tour = held_karp([[0, 2, 9, 10], [1, 0, 6, 4], [15, 7, 0, 8], [6, 3, 12, 0]])\nprint(\"burst 3 1 5 8 ->\", max_coins([3, 1, 5, 8]), \"| tour\", *tour, \"costs\", cost)\n","out":"burst 3 1 5 8 -> 167 | tour 0 2 3 1 0 costs 21"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nfunction maxCoins(nums) {                       // interval DP: O(n^3) time, O(n^2) space\n  const a = [1, ...nums, 1], n = a.length;      // a 1 at each end: the walls never burst\n  const dp = Array.from({ length: n }, () => new Array(n).fill(0));   // dp[i][j]: balloons strictly between i and j\n  for (let len = 2; len < n; len++)             // shorter intervals first\n    for (let i = 0; i + len < n; i++) {\n      const j = i + len;\n      for (let k = i + 1; k < j; k++)           // k is the LAST balloon burst in (i, j),\n        dp[i][j] = Math.max(dp[i][j], dp[i][k] + a[i] * a[k] * a[j] + dp[k][j]);   // so a[i] and a[j] are its neighbours\n    }\n  return dp[0][n - 1];\n}\n\nfunction heldKarp(dist) {                       // n >= 2 cities; O(2^n * n^2) time, O(2^n * n) space\n  const n = dist.length, full = (1 << n) - 1;\n  const dp = Array.from({ length: 1 << n }, () => new Array(n).fill(Infinity));   // dp[mask][v]: from 0 through mask, ending at v\n  const parent = Array.from({ length: 1 << n }, () => new Array(n).fill(-1));\n  dp[1][0] = 0;\n  for (let mask = 1; mask <= full; mask += 2)   // odd masks only: city 0 is always visited\n    for (let v = 0; v < n; v++) {\n      if (dp[mask][v] === Infinity) continue;\n      for (let u = 0; u < n; u++) {\n        if ((mask >> u) & 1) continue;          // every city at most once\n        const next = mask | (1 << u), cost = dp[mask][v] + dist[v][u];\n        if (cost < dp[next][u]) {\n          dp[next][u] = cost;\n          parent[next][u] = v;\n        }\n      }\n    }\n  let best = Infinity, last = -1;\n  for (let v = 1; v < n; v++) {\n    if (dp[full][v] + dist[v][0] < best) {\n      best = dp[full][v] + dist[v][0];\n      last = v;\n    }\n  }\n  const tour = [];                              // walk the parents back to city 0\n  for (let mask = full, v = last; v !== -1; ) {\n    tour.push(v);\n    const p = parent[mask][v];\n    mask ^= 1 << v;\n    v = p;\n  }\n  return [best, [...tour.reverse(), 0]];\n}\n\nfunction* permutations(items) {                 // every order of items\n  if (items.length <= 1) {\n    yield items;\n    return;\n  }\n  for (let i = 0; i < items.length; i++)\n    for (const rest of permutations(items.toSpliced(i, 1))) yield [items[i], ...rest];\n}\n\nfunction bruteCoins(nums) {                     // try every order of bursting: O(n! * n)\n  let best = 0;\n  for (let i = 0; i < nums.length; i++) {\n    const coins = (nums[i - 1] ?? 1) * nums[i] * (nums[i + 1] ?? 1);\n    best = Math.max(best, coins + bruteCoins(nums.toSpliced(i, 1)));\n  }\n  return best;\n}\n\nfunction bruteTsp(dist) {                       // try every order of cities 1..n-1: O(n!)\n  let best = Infinity;\n  for (const p of permutations([...dist.keys()].slice(1))) {\n    const route = [0, ...p, 0];\n    best = Math.min(best, route.slice(1).reduce((sum, v, i) => sum + dist[route[i]][v], 0));\n  }\n  return best;\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nfor (let t = 0; t < 200; t++) {\n  const nums = Array.from({ length: rnd(8) }, () => rnd(10));\n  assert.strictEqual(maxCoins(nums), bruteCoins(nums), String(nums));\n  const n = 2 + rnd(6);                         // random one-way costs: no triangle inequality\n  const dist = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i === j ? 0 : 1 + rnd(20))));\n  const [cost, tour] = heldKarp(dist);\n  assert.strictEqual(cost, bruteTsp(dist));\n  assert.ok(tour[0] === 0 && tour.at(-1) === 0);\n  assert.deepStrictEqual(tour.slice(0, -1).toSorted((x, y) => x - y), [...dist.keys()]);\n  assert.strictEqual(tour.slice(1).reduce((sum, v, i) => sum + dist[tour[i]][v], 0), cost);\n}\n\nconst [cost, tour] = heldKarp([[0, 2, 9, 10], [1, 0, 6, 4], [15, 7, 0, 8], [6, 3, 12, 0]]);\nconsole.log(\"burst 3 1 5 8 ->\", maxCoins([3, 1, 5, 8]), \"| tour\", ...tour, \"costs\", cost);\n","out":"burst 3 1 5 8 -> 167 | tour 0 2 3 1 0 costs 21"}]},"breakit":["Fill the interval table row by row with i going up (and j from i + 2) instead of by length: [3, 1, 5, 8] now gives 63 instead of 167, because dp[k][j] for k > i isn't filled yet. Then run i down from the end (j still going up) and the tests pass again: any order works as long as every shorter interval inside (i, j) comes first.","Delete the check that skips cities already in the mask. The cost check against brute force fails within the 200 random tests, with a cost that is too low: random one-way costs often break the triangle inequality, so a route that passes through a city twice can beat every real tour."]},{"id":"lab-rerooting","t":"Every root at once: rerooting","min":75,"mods":["m06"],"goal":"Compute the sum of distances from every node of a tree (LeetCode 834, Sum of Distances in Tree) in O(n) with two iterative passes: one for subtree sizes and the root's answer, one that moves the root across each edge. Check it against a BFS from every node, then run it on a 100,000-node random tree and a 100,000-node path.","pre":["Python 3.12+ and Node.js 22+","Module 06"],"steps":["Build adjacency lists, then a BFS order from root 0 with each node's parent. That order replaces recursion: walked backwards it visits children before parents, and walked forwards, parents before children.","Pass 1 (backwards): `size[v]` counts the nodes in v's subtree, and `down[v]`, the sum of distances from v to the nodes below it, gains `down[c] + size[c]` from each child c, because every node under c is one step further from v. The root's answer is `down[0]`.","Pass 2 (forwards): moving the root from p to its child v brings the size[v] nodes under v one step closer and pushes the other n − size[v] one step away, so `ans[v] = ans[p] - size[v] + (n - size[v])`.","Brute force: a BFS from every node, O(n²). Compare on 300 random trees of up to 30 nodes, with shuffled labels so node 0 isn't always where the tree started.","Run on two 100,000-node trees: a pseudo-random one from a tiny generator that builds the same tree in both languages, and a path, where every answer must match the formula i(i + 1)/2 + (n − 1 − i)(n − i)/2. Print the totals and the best meeting node as a checksum (never timings)."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom collections import deque\n\ndef sum_of_distances(n, edges):                 # rerooting: O(n) time and space, no recursion\n    adj = [[] for _ in range(n)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n    parent, order = [-1] * n, [0]               # BFS order from root 0: parents before children\n    for u in order:                             # the list grows while we walk it\n        for v in adj[u]:\n            if v != parent[u]:\n                parent[v] = u\n                order.append(v)\n    size, down = [1] * n, [0] * n               # down[v]: sum of distances from v into its subtree\n    for v in reversed(order[1:]):               # pass 1, children before parents\n        p = parent[v]\n        size[p] += size[v]\n        down[p] += down[v] + size[v]            # each node under v is one step further from p\n    ans = [0] * n\n    ans[0] = down[0]\n    for v in order[1:]:                         # pass 2, parents before children: move the root p -> v\n        ans[v] = ans[parent[v]] - size[v] + (n - size[v])   # size[v] nodes get closer, the rest further\n    return ans\n\ndef brute_sums(n, edges):                       # BFS from every node: O(n^2)\n    adj = [[] for _ in range(n)]\n    for u, v in edges:\n        adj[u].append(v)\n        adj[v].append(u)\n    out = []\n    for s in range(n):\n        dist = [-1] * n\n        dist[s] = 0\n        queue = deque([s])\n        while queue:\n            u = queue.popleft()\n            for v in adj[u]:\n                if dist[v] == -1:\n                    dist[v] = dist[u] + 1\n                    queue.append(v)\n        out.append(sum(dist))\n    return out\n\ndef random_tree(n):                             # node i joins a random earlier node; labels shuffled\n    label = random.sample(range(n), n)\n    return [(label[i], label[random.randrange(i)]) for i in range(1, n)]\n\ndef lcg_tree(n, seed=1):                        # the same \"random\" tree in both languages\n    x, edges = seed, []\n    for i in range(1, n):\n        x = x * 48271 % 2147483647              # x * 48271 < 2^53, so JavaScript gets it exactly too\n        edges.append((i, x % i))\n    return edges\n\nfor _ in range(300):\n    n = random.randint(1, 30)\n    edges = random_tree(n)\n    assert sum_of_distances(n, edges) == brute_sums(n, edges), edges\n\nn = 100_000\ntree = sum_of_distances(n, lcg_tree(n))\npath = sum_of_distances(n, [(i, i + 1) for i in range(n - 1)])\nassert all(path[i] == i * (i + 1) // 2 + (n - 1 - i) * (n - i) // 2 for i in range(n))   # the formula for a path\nsample = sum_of_distances(6, [(0, 1), (0, 2), (2, 3), (2, 4), (2, 5)])\nprint(\"sample\", *sample, f\"| random tree: total {sum(tree)}, best node {tree.index(min(tree))}\",\n      f\"| path: total {sum(path)}, best node {path.index(min(path))}\")\n","out":"sample 8 12 6 10 10 10 | random tree: total 200310852268, best node 1 | path: total 333333333300000, best node 49999"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nfunction sumOfDistances(n, edges) {             // rerooting: O(n) time and space, no recursion\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    adj[u].push(v);\n    adj[v].push(u);\n  }\n  const parent = new Array(n).fill(-1), order = [0];   // BFS order from root 0: parents before children\n  for (let i = 0; i < order.length; i++) {\n    const u = order[i];\n    for (const v of adj[u]) {\n      if (v !== parent[u]) {\n        parent[v] = u;\n        order.push(v);\n      }\n    }\n  }\n  const size = new Array(n).fill(1), down = new Array(n).fill(0);   // down[v]: distances from v into its subtree\n  for (let i = n - 1; i > 0; i--) {             // pass 1, children before parents\n    const v = order[i], p = parent[v];\n    size[p] += size[v];\n    down[p] += down[v] + size[v];               // each node under v is one step further from p\n  }\n  const ans = new Array(n).fill(0);\n  ans[0] = down[0];\n  for (let i = 1; i < n; i++) {                 // pass 2, parents before children: move the root p -> v\n    const v = order[i];\n    ans[v] = ans[parent[v]] - size[v] + (n - size[v]);   // size[v] nodes get closer, the rest further\n  }\n  return ans;\n}\n\nfunction bruteSums(n, edges) {                  // BFS from every node: O(n^2)\n  const adj = Array.from({ length: n }, () => []);\n  for (const [u, v] of edges) {\n    adj[u].push(v);\n    adj[v].push(u);\n  }\n  return [...adj.keys()].map(s => {\n    const dist = new Array(n).fill(-1), queue = [s];\n    dist[s] = 0;\n    for (let head = 0; head < queue.length; head++) {\n      const u = queue[head];\n      for (const v of adj[u]) {\n        if (dist[v] === -1) {\n          dist[v] = dist[u] + 1;\n          queue.push(v);\n        }\n      }\n    }\n    return dist.reduce((a, b) => a + b, 0);\n  });\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nfunction randomTree(n) {                        // node i joins a random earlier node; labels shuffled\n  const label = [...Array(n).keys()].sort(() => Math.random() - 0.5);\n  return Array.from({ length: Math.max(n - 1, 0) }, (_, k) => [label[k + 1], label[rnd(k + 1)]]);\n}\n\nfunction lcgTree(n, seed = 1) {                 // the same \"random\" tree in both languages\n  const edges = [];\n  for (let i = 1, x = seed; i < n; i++) {\n    x = (x * 48271) % 2147483647;               // x * 48271 < 2^53, so the product is exact\n    edges.push([i, x % i]);\n  }\n  return edges;\n}\n\nfor (let t = 0; t < 300; t++) {\n  const n = 1 + rnd(30);\n  const edges = randomTree(n);\n  assert.deepStrictEqual(sumOfDistances(n, edges), bruteSums(n, edges), JSON.stringify(edges));\n}\n\nconst n = 100_000;\nconst tree = sumOfDistances(n, lcgTree(n));\nconst path = sumOfDistances(n, Array.from({ length: n - 1 }, (_, i) => [i, i + 1]));\npath.forEach((s, i) => assert.strictEqual(s, (i * (i + 1)) / 2 + ((n - 1 - i) * (n - i)) / 2));   // the formula for a path\nconst sum = a => a.reduce((x, y) => x + y, 0);\nconst best = a => a.reduce((b, x, i) => (x < a[b] ? i : b), 0);   // the first node with the smallest total\nconst sample = sumOfDistances(6, [[0, 1], [0, 2], [2, 3], [2, 4], [2, 5]]);\nconsole.log(\"sample\", ...sample, `| random tree: total ${sum(tree)}, best node ${best(tree)}`,\n  `| path: total ${sum(path)}, best node ${best(path)}`);\n","out":"sample 8 12 6 10 10 10 | random tree: total 200310852268, best node 1 | path: total 333333333300000, best node 49999"}]},"breakit":["Run pass 1 forwards instead of backwards. Each node then adds a child's size before that child has counted its own children, so the path 0–1–2 gives 1 0 1 instead of 3 2 3, and the random tests fail.","Write pass 1 as a recursive DFS. It still gets the 100,000-node random tree right, because that tree is only 26 levels deep, but on the 100,000-node path Python raises RecursionError and Node.js throws RangeError: Maximum call stack size exceeded. Random trees alone would never have caught it."]},{"id":"lab-range","t":"Range-query structures against brute force","min":90,"mods":["m07","m08","m09"],"goal":"Build the two range-query structures that hard array problems lean on: a Fenwick tree (point add, prefix and range sums, and a binary-lifting search for the first index whose prefix sum reaches a target) and a segment tree with lazy propagation (range add, range sum, range max). Check both against a plain array on random sequences of operations.","pre":["Python 3.12+ and Node.js 22+","Modules 07, 08 and 09"],"steps":["Fenwick tree: n + 1 slots, where slot i holds the sum of the `i & -i` values ending at i. Unlike module 08's class, take 0-indexed positions and add 1 inside, so the tests can compare with a plain list. `add` climbs with `i += i & -i`, `prefix(i)` (a[0] + … + a[i]) descends with `i -= i & -i`, and `range_sum(l, r)` is `prefix(r) - prefix(l - 1)`.","`lower_bound(target)`: binary lifting from the largest power of two down, stepping right whenever that block still leaves the running sum below the target. It's O(log n), and it needs every value to be non-negative, so that the prefix sums never go down.","Lazy segment tree: arrays of size 4n for each node's sum and max, plus a `tag` for an add the node still owes its children. An update that covers a node's whole range changes that node and its tag, and stops there.","Before going below a node (in `add` and in `query`), push its tag down to both children; after updating the children in `add`, pull their sums and maxima back up.","Test 200 random arrays of up to 40 values, with 30 random steps each: a point add plus prefix, range and lower-bound queries on the Fenwick tree, then a range add and a (sum, max) query on the segment tree, all checked against a plain array."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom itertools import accumulate\n\nclass Fenwick:                                  # point add and prefix sums: O(log n) each, n + 1 slots\n    def __init__(self, n):\n        self.n, self.t = n, [0] * (n + 1)       # 1-indexed inside: t[i] holds the sum of (i - (i & -i), i]\n\n    def add(self, i, delta):                    # a[i] += delta\n        i += 1\n        while i <= self.n:\n            self.t[i] += delta\n            i += i & -i                         # the next node whose range covers i\n\n    def prefix(self, i):                        # a[0] + ... + a[i]; prefix(-1) is 0\n        i += 1\n        total = 0\n        while i > 0:\n            total += self.t[i]\n            i -= i & -i                         # drop the lowest set bit\n        return total\n\n    def range_sum(self, l, r):                  # a[l] + ... + a[r]\n        return self.prefix(r) - self.prefix(l - 1)\n\n    def lower_bound(self, target):              # smallest i with prefix(i) >= target, else n; needs a[i] >= 0\n        pos, rem, step = 0, target, 1 << self.n.bit_length()\n        while step:\n            if pos + step <= self.n and self.t[pos + step] < rem:\n                pos += step                     # the first pos values still fall short of the target\n                rem -= self.t[pos]\n            step >>= 1\n        return pos\n\nclass LazySegTree:                              # range add, range sum, range max: O(log n) each\n    def __init__(self, values):\n        self.n = len(values)\n        self.sum, self.max = [0] * (4 * self.n), [0] * (4 * self.n)\n        self.tag = [0] * (4 * self.n)           # an add still owed to every element below the node\n        self._build(1, 0, self.n - 1, values)\n\n    def _build(self, node, lo, hi, values):\n        if lo == hi:\n            self.sum[node] = self.max[node] = values[lo]\n            return\n        mid = (lo + hi) // 2\n        self._build(2 * node, lo, mid, values)\n        self._build(2 * node + 1, mid + 1, hi, values)\n        self._pull(node)\n\n    def _apply(self, node, lo, hi, delta):      # add delta to every element of the node's range\n        self.sum[node] += delta * (hi - lo + 1)\n        self.max[node] += delta\n        self.tag[node] += delta\n\n    def _push(self, node, lo, mid, hi):         # hand the pending add down to both children\n        if self.tag[node]:\n            self._apply(2 * node, lo, mid, self.tag[node])\n            self._apply(2 * node + 1, mid + 1, hi, self.tag[node])\n            self.tag[node] = 0\n\n    def _pull(self, node):\n        self.sum[node] = self.sum[2 * node] + self.sum[2 * node + 1]\n        self.max[node] = max(self.max[2 * node], self.max[2 * node + 1])\n\n    def add(self, l, r, delta, node=1, lo=0, hi=None):   # a[l..r] += delta\n        hi = self.n - 1 if hi is None else hi\n        if r < lo or hi < l:\n            return\n        if l <= lo and hi <= r:                 # fully covered: tag the node and stop\n            self._apply(node, lo, hi, delta)\n            return\n        mid = (lo + hi) // 2\n        self._push(node, lo, mid, hi)\n        self.add(l, r, delta, 2 * node, lo, mid)\n        self.add(l, r, delta, 2 * node + 1, mid + 1, hi)\n        self._pull(node)\n\n    def query(self, l, r, node=1, lo=0, hi=None):        # (sum, max) of a[l..r]\n        hi = self.n - 1 if hi is None else hi\n        if r < lo or hi < l:\n            return 0, float(\"-inf\")\n        if l <= lo and hi <= r:\n            return self.sum[node], self.max[node]\n        mid = (lo + hi) // 2\n        self._push(node, lo, mid, hi)\n        s1, m1 = self.query(l, r, 2 * node, lo, mid)\n        s2, m2 = self.query(l, r, 2 * node + 1, mid + 1, hi)\n        return s1 + s2, max(m1, m2)\n\nfor _ in range(200):\n    n = random.randint(1, 40)\n    a = [random.randint(0, 9) for _ in range(n)]       # Fenwick values stay >= 0\n    b = [random.randint(-9, 9) for _ in range(n)]      # segment-tree values can be negative\n    fw, st = Fenwick(n), LazySegTree(b)\n    for i, x in enumerate(a):\n        fw.add(i, x)\n    for _ in range(30):                                # a random sequence of updates and queries\n        i = random.randrange(n)\n        l, r = sorted(random.choices(range(n), k=2))\n        delta = random.randint(-a[i], 9)\n        fw.add(i, delta)\n        a[i] += delta\n        pre = list(accumulate(a))\n        target = random.randint(0, pre[-1] + 2)\n        assert fw.prefix(r) == pre[r] and fw.range_sum(l, r) == sum(a[l:r + 1])\n        assert fw.lower_bound(target) == next((k for k in range(n) if pre[k] >= target), n)\n        d = random.randint(-9, 9)\n        st.add(l, r, d)\n        b[l:r + 1] = [x + d for x in b[l:r + 1]]\n        ql, qr = sorted(random.choices(range(n), k=2))\n        assert st.query(ql, qr) == (sum(b[ql:qr + 1]), max(b[ql:qr + 1]))\n\nvalues = [3, 1, 4, 1, 5, 9, 2, 6]\nfw, st = Fenwick(len(values)), LazySegTree(values)\nfor i, x in enumerate(values):\n    fw.add(i, x)\nassert fw.lower_bound(0) == 0 and fw.lower_bound(sum(values) + 1) == len(values)   # n means \"never\"\nst.add(2, 4, 10)                                # now 3 1 14 11 15 9 2 6\nprint(f\"prefix(3) = {fw.prefix(3)} | sum 2..5 = {fw.range_sum(2, 5)} | first prefix >= 10 at {fw.lower_bound(10)}\"\n      f\" | after +10 on 2..4: sum {st.query(0, 7)[0]}, max 0..3 = {st.query(0, 3)[1]}\")\n","out":"prefix(3) = 9 | sum 2..5 = 19 | first prefix >= 10 at 4 | after +10 on 2..4: sum 61, max 0..3 = 14"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nclass Fenwick {                                 // point add and prefix sums: O(log n) each, n + 1 slots\n  constructor(n) {\n    this.n = n;\n    this.t = new Array(n + 1).fill(0);          // 1-indexed inside: t[i] holds the sum of (i - (i & -i), i]\n  }\n  add(i, delta) {                               // a[i] += delta\n    for (i++; i <= this.n; i += i & -i) this.t[i] += delta;   // the next node whose range covers i\n  }\n  prefix(i) {                                   // a[0] + ... + a[i]; prefix(-1) is 0\n    let total = 0;\n    for (i++; i > 0; i -= i & -i) total += this.t[i];         // drop the lowest set bit\n    return total;\n  }\n  rangeSum(l, r) {                              // a[l] + ... + a[r]\n    return this.prefix(r) - this.prefix(l - 1);\n  }\n  lowerBound(target) {                          // smallest i with prefix(i) >= target, else n; needs a[i] >= 0\n    let pos = 0, rem = target, step = 1;\n    while (step <= this.n) step *= 2;\n    for (; step > 0; step >>= 1) {\n      if (pos + step <= this.n && this.t[pos + step] < rem) {\n        pos += step;                            // the first pos values still fall short of the target\n        rem -= this.t[pos];\n      }\n    }\n    return pos;\n  }\n}\n\nclass LazySegTree {                             // range add, range sum, range max: O(log n) each\n  constructor(values) {\n    this.n = values.length;\n    this.sum = new Array(4 * this.n).fill(0);\n    this.max = new Array(4 * this.n).fill(0);\n    this.tag = new Array(4 * this.n).fill(0);   // an add still owed to every element below the node\n    this.build(1, 0, this.n - 1, values);\n  }\n  build(node, lo, hi, values) {\n    if (lo === hi) {\n      this.sum[node] = this.max[node] = values[lo];\n      return;\n    }\n    const mid = (lo + hi) >> 1;\n    this.build(2 * node, lo, mid, values);\n    this.build(2 * node + 1, mid + 1, hi, values);\n    this.pull(node);\n  }\n  apply(node, lo, hi, delta) {                  // add delta to every element of the node's range\n    this.sum[node] += delta * (hi - lo + 1);\n    this.max[node] += delta;\n    this.tag[node] += delta;\n  }\n  push(node, lo, mid, hi) {                     // hand the pending add down to both children\n    if (this.tag[node]) {\n      this.apply(2 * node, lo, mid, this.tag[node]);\n      this.apply(2 * node + 1, mid + 1, hi, this.tag[node]);\n      this.tag[node] = 0;\n    }\n  }\n  pull(node) {\n    this.sum[node] = this.sum[2 * node] + this.sum[2 * node + 1];\n    this.max[node] = Math.max(this.max[2 * node], this.max[2 * node + 1]);\n  }\n  add(l, r, delta, node = 1, lo = 0, hi = this.n - 1) {   // a[l..r] += delta\n    if (r < lo || hi < l) return;\n    if (l <= lo && hi <= r) {                   // fully covered: tag the node and stop\n      this.apply(node, lo, hi, delta);\n      return;\n    }\n    const mid = (lo + hi) >> 1;\n    this.push(node, lo, mid, hi);\n    this.add(l, r, delta, 2 * node, lo, mid);\n    this.add(l, r, delta, 2 * node + 1, mid + 1, hi);\n    this.pull(node);\n  }\n  query(l, r, node = 1, lo = 0, hi = this.n - 1) {        // [sum, max] of a[l..r]\n    if (r < lo || hi < l) return [0, -Infinity];\n    if (l <= lo && hi <= r) return [this.sum[node], this.max[node]];\n    const mid = (lo + hi) >> 1;\n    this.push(node, lo, mid, hi);\n    const [s1, m1] = this.query(l, r, 2 * node, lo, mid);\n    const [s2, m2] = this.query(l, r, 2 * node + 1, mid + 1, hi);\n    return [s1 + s2, Math.max(m1, m2)];\n  }\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nconst pair = n => [rnd(n), rnd(n)].sort((x, y) => x - y);\nconst total = xs => xs.reduce((x, y) => x + y, 0);\nfor (let t = 0; t < 200; t++) {\n  const n = 1 + rnd(40);\n  const a = Array.from({ length: n }, () => rnd(10));       // Fenwick values stay >= 0\n  const b = Array.from({ length: n }, () => rnd(19) - 9);   // segment-tree values can be negative\n  const fw = new Fenwick(n), st = new LazySegTree(b);\n  a.forEach((x, i) => fw.add(i, x));\n  for (let step = 0; step < 30; step++) {                   // a random sequence of updates and queries\n    const i = rnd(n), [l, r] = pair(n);\n    const delta = rnd(a[i] + 10) - a[i];\n    fw.add(i, delta);\n    a[i] += delta;\n    const pre = a.map((_, k) => total(a.slice(0, k + 1)));\n    const target = rnd(pre.at(-1) + 3);\n    assert.ok(fw.prefix(r) === pre[r] && fw.rangeSum(l, r) === total(a.slice(l, r + 1)));\n    const want = pre.findIndex(s => s >= target);\n    assert.strictEqual(fw.lowerBound(target), want === -1 ? n : want);\n    const d = rnd(19) - 9;\n    st.add(l, r, d);\n    for (let k = l; k <= r; k++) b[k] += d;\n    const [ql, qr] = pair(n), part = b.slice(ql, qr + 1);\n    assert.deepStrictEqual(st.query(ql, qr), [total(part), Math.max(...part)]);\n  }\n}\n\nconst values = [3, 1, 4, 1, 5, 9, 2, 6];\nconst fw = new Fenwick(values.length), st = new LazySegTree(values);\nvalues.forEach((x, i) => fw.add(i, x));\nassert.ok(fw.lowerBound(0) === 0 && fw.lowerBound(total(values) + 1) === values.length);   // n means \"never\"\nst.add(2, 4, 10);                               // now 3 1 14 11 15 9 2 6\nconsole.log(`prefix(3) = ${fw.prefix(3)} | sum 2..5 = ${fw.rangeSum(2, 5)} | first prefix >= 10 at ${fw.lowerBound(10)}` +\n  ` | after +10 on 2..4: sum ${st.query(0, 7)[0]}, max 0..3 = ${st.query(0, 3)[1]}`);\n","out":"prefix(3) = 9 | sum 2..5 = 19 | first prefix >= 10 at 4 | after +10 on 2..4: sum 61, max 0..3 = 14"}]},"breakit":["Delete the push in `query` (keep the one in `add`). After `add(0, 3, 5)` on [0, 0, 0, 0], `query(0, 1)` returns (0, 0) instead of (10, 5), because the add still sits in the root's tag, and the random checks fail on every run.","Put a negative value in the Fenwick tree: for [5, −3, 4], `lower_bound(4)` returns 2, but the first prefix sum to reach 4 is at index 0. Binary lifting assumes the prefix sums never go down; with negative values, descend a segment tree that stores each node's largest prefix sum instead."]},{"id":"lab-strings-math","t":"String search and modular arithmetic","min":75,"mods":["m10","m11"],"goal":"Write the linear-time string tools (the prefix function with KMP search, and the Z-function) and a Rabin–Karp rolling hash that confirms every candidate. Then build the modular toolkit: fast power, the inverse from Fermat's little theorem, and nCr mod 1,000,000,007 from factorial tables. Test the searches against brute force and the arithmetic against exact big integers.","pre":["Python 3.12+ and Node.js 22+","Modules 10 and 11"],"steps":["`prefix_function(s)`: for each i, start from k = π[i − 1] and fall back with k = π[k − 1] while s[i] ≠ s[k], then extend by one on a match. `kmp_find_all` runs the same loop over the text, reports a match whenever k reaches len(pat), and falls back to π[k − 1] so that overlapping matches are found too.","`z_function(s)`, with z[0] left at 0 as in module 10: keep [l, r), the match that reaches furthest right so far; inside it, start z[i] at min(r − i, z[i − l]) instead of 0. `z_find_all`: on the string pat + text, pat occurs at text position j exactly when z[m + j] ≥ m. No “#” separator is needed, because z[m + j] ≥ m already says that the m characters starting there equal pat.","`hash_find_all`: hash the pattern and the first window with base 131 modulo 1,000,000,007, then slide by removing the leaving character (times base^(m − 1)) and adding the new one. Compare the actual characters whenever the two hashes agree, so a collision can't fake a match.","`mod_pow` by repeated squaring, `mod_inv(a)` as a^(p − 2) for the prime p, and `make_ncr(limit)`: factorials up to limit, one inverse for the last, then 1/(i − 1)! = i × 1/i! walking down. In JavaScript, multiply residues through BigInt (`mulMod`), because two numbers near 10⁹ multiply to about 10¹⁸, far past 2⁵³.","Test 500 random texts and patterns over the alphabets a, ab and abc (empty patterns and patterns longer than the text included) against a brute-force search, and the prefix and Z functions against their definitions. Test the modular functions on random inputs against exact arithmetic: Python ints and `math.comb`, or BigInt."],"solution":{"t":"Reference solution with tests","tabs":[{"lang":"python","src":"import random\nfrom math import comb\n\nMOD = 1_000_000_007\n\ndef prefix_function(s):                         # pi[i]: the longest proper prefix of s[:i + 1] that is also its suffix\n    pi = [0] * len(s)\n    for i in range(1, len(s)):\n        k = pi[i - 1]\n        while k and s[i] != s[k]:\n            k = pi[k - 1]                       # fall back to the next shorter border\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\ndef kmp_find_all(text, pat):                    # every start index of pat in text: O(n + m)\n    if not pat:\n        return list(range(len(text) + 1))\n    pi, out, k = prefix_function(pat), [], 0\n    for i, ch in enumerate(text):\n        while k and ch != pat[k]:\n            k = pi[k - 1]\n        if ch == pat[k]:\n            k += 1\n        if k == len(pat):                       # a match ends at i\n            out.append(i - k + 1)\n            k = pi[k - 1]\n    return out\n\ndef z_function(s):                              # z[i]: the longest common prefix of s and s[i:]; z[0] stays 0\n    n = len(s)\n    z = [0] * n\n    l = r = 0                                   # s[l:r] is the match that reaches furthest right so far\n    for i in range(1, n):\n        if i < r:\n            z[i] = min(r - i, z[i - l])         # reuse what is known inside that match\n        while i + z[i] < n and s[z[i]] == s[i + z[i]]:\n            z[i] += 1\n        if i + z[i] > r:\n            l, r = i, i + z[i]\n    return z\n\ndef z_find_all(text, pat):                      # a match where z of pat + text reaches len(pat)\n    if not pat:\n        return list(range(len(text) + 1))\n    z, m = z_function(pat + text), len(pat)\n    return [i - m for i in range(m, m + len(text)) if z[i] >= m]\n\ndef mod_pow(a, e, m=MOD):                       # a^e mod m by repeated squaring: O(log e)\n    result, a = 1 % m, a % m\n    while e > 0:\n        if e & 1:\n            result = result * a % m\n        a = a * a % m                           # square the base, halve the exponent\n        e >>= 1\n    return result\n\ndef mod_inv(a, m=MOD):                          # m prime and a % m != 0: Fermat, a^(m - 2)\n    return mod_pow(a, m - 2, m)\n\ndef make_ncr(limit, m=MOD):                     # limit < m; O(limit) tables, then O(1) per query\n    fact = [1] * (limit + 1)\n    for i in range(1, limit + 1):\n        fact[i] = fact[i - 1] * i % m\n    inv_fact = [1] * (limit + 1)\n    inv_fact[limit] = mod_inv(fact[limit], m)   # one inverse, then walk down: 1/(i-1)! = i/i!\n    for i in range(limit, 0, -1):\n        inv_fact[i - 1] = inv_fact[i] * i % m\n    def ncr(n, r):\n        return 0 if r < 0 or r > n else fact[n] * inv_fact[r] % m * inv_fact[n - r] % m\n    return ncr\n\ndef hash_find_all(text, pat, base=131, mod=MOD):   # Rabin–Karp: O(n + m) expected\n    n, m = len(text), len(pat)\n    if m == 0:\n        return list(range(n + 1))\n    if m > n:\n        return []\n    hp = hw = 0\n    for i in range(m):\n        hp = (hp * base + ord(pat[i])) % mod\n        hw = (hw * base + ord(text[i])) % mod\n    top, out = mod_pow(base, m - 1, mod), []    # top: the weight of the character leaving the window\n    for i in range(n - m + 1):\n        if hw == hp and text[i:i + m] == pat:   # confirm, so a collision can't fake a match\n            out.append(i)\n        if i + m < n:                           # slide: drop text[i], then add text[i + m]\n            hw = (hw - ord(text[i]) * top % mod + mod) % mod\n            hw = (hw * base + ord(text[i + m])) % mod\n    return out\n\ndef brute_find_all(text, pat):                  # try every start: O(n * m)\n    return [i for i in range(len(text) - len(pat) + 1) if text[i:i + len(pat)] == pat]\n\ndef brute_pi(s):                                # straight from the definition\n    return [max(k for k in range(i + 1) if s[:k] == s[i + 1 - k:i + 1]) for i in range(len(s))]\n\ndef brute_z(s):                                 # straight from the definition (z[0] stays 0)\n    return [0 if i == 0 else max(k for k in range(len(s) - i + 1) if s[i:i + k] == s[:k]) for i in range(len(s))]\n\nfor _ in range(500):\n    abc = random.choice([\"a\", \"ab\", \"abc\"])\n    text = \"\".join(random.choices(abc, k=random.randint(0, 30)))\n    pat = \"\".join(random.choices(abc, k=random.randint(0, 4)))\n    want = brute_find_all(text, pat)\n    assert kmp_find_all(text, pat) == z_find_all(text, pat) == hash_find_all(text, pat) == want\n    assert hash_find_all(text, pat, mod=3) == want            # a tiny modulus: collisions, still right\n    assert prefix_function(text) == brute_pi(text) and z_function(text) == brute_z(text)\nncr = make_ncr(1000)\nfor _ in range(300):\n    a, e = random.randrange(MOD), random.randint(0, 60)\n    assert mod_pow(a, e) == a ** e % MOD                      # exact big-integer arithmetic\n    if a:\n        assert a * mod_inv(a) % MOD == 1 and mod_inv(a) == pow(a, -1, MOD)\n    n = random.randint(0, 1000)\n    r = random.randint(-2, n + 2)\n    assert ncr(n, r) == (comb(n, r) % MOD if 0 <= r <= n else 0)\n\ntext, pat, big = \"abababcabab\", \"abab\", make_ncr(100_000)\nprint(\"matches\", *kmp_find_all(text, pat), \"| pi\", *prefix_function(pat), f\"| mod p: 1/2 = {mod_inv(2)},\",\n      f\"3^(10^9) = {mod_pow(3, 10 ** 9)}, C(100000, 50000) = {big(100_000, 50_000)}\")\n","out":"matches 0 2 7 | pi 0 0 1 2 | mod p: 1/2 = 500000004, 3^(10^9) = 235939645, C(100000, 50000) = 149033233"},{"lang":"javascript","src":"const assert = require(\"node:assert\");\n\nconst MOD = 1_000_000_007;\n\nfunction prefixFunction(s) {                    // pi[i]: the longest proper prefix of s[0..i] that is also its suffix\n  const pi = new Array(s.length).fill(0);\n  for (let i = 1; i < s.length; i++) {\n    let k = pi[i - 1];\n    while (k && s[i] !== s[k]) k = pi[k - 1];   // fall back to the next shorter border\n    if (s[i] === s[k]) k++;\n    pi[i] = k;\n  }\n  return pi;\n}\n\nfunction kmpFindAll(text, pat) {                // every start index of pat in text: O(n + m)\n  if (!pat.length) return [...Array(text.length + 1).keys()];\n  const pi = prefixFunction(pat), out = [];\n  let k = 0;\n  for (let i = 0; i < text.length; i++) {\n    while (k && text[i] !== pat[k]) k = pi[k - 1];\n    if (text[i] === pat[k]) k++;\n    if (k === pat.length) {                     // a match ends at i\n      out.push(i - k + 1);\n      k = pi[k - 1];\n    }\n  }\n  return out;\n}\n\nfunction zFunction(s) {                         // z[i]: the longest common prefix of s and s.slice(i); z[0] stays 0\n  const n = s.length, z = new Array(n).fill(0);\n  for (let i = 1, l = 0, r = 0; i < n; i++) {   // s[l..r) is the match that reaches furthest right so far\n    if (i < r) z[i] = Math.min(r - i, z[i - l]);   // reuse what is known inside that match\n    while (i + z[i] < n && s[z[i]] === s[i + z[i]]) z[i]++;\n    if (i + z[i] > r) [l, r] = [i, i + z[i]];\n  }\n  return z;\n}\n\nfunction zFindAll(text, pat) {                  // a match where z of pat + text reaches pat.length\n  if (!pat.length) return [...Array(text.length + 1).keys()];\n  const z = zFunction(pat + text), m = pat.length, out = [];\n  for (let i = m; i < m + text.length; i++) if (z[i] >= m) out.push(i - m);\n  return out;\n}\n\nconst mulMod = (a, b, m = MOD) => Number((BigInt(a) * BigInt(b)) % BigInt(m));   // a * b can pass 2^53\n\nfunction modPow(a, e, m = MOD) {                // a^e mod m by repeated squaring: O(log e)\n  let result = 1 % m;\n  a %= m;\n  while (e > 0) {\n    if (e % 2 === 1) result = mulMod(result, a, m);\n    a = mulMod(a, a, m);                        // square the base, halve the exponent\n    e = Math.floor(e / 2);\n  }\n  return result;\n}\n\nconst modInv = (a, m = MOD) => modPow(a, m - 2, m);   // m prime and a % m != 0: Fermat, a^(m - 2)\n\nfunction makeNcr(limit, m = MOD) {              // limit < m; O(limit) tables, then O(1) per query\n  const fact = [1];\n  for (let i = 1; i <= limit; i++) fact.push(mulMod(fact[i - 1], i, m));\n  const invFact = new Array(limit + 1).fill(1);\n  invFact[limit] = modInv(fact[limit], m);      // one inverse, then walk down: 1/(i-1)! = i/i!\n  for (let i = limit; i > 0; i--) invFact[i - 1] = mulMod(invFact[i], i, m);\n  return (n, r) => (r < 0 || r > n ? 0 : mulMod(mulMod(fact[n], invFact[r], m), invFact[n - r], m));\n}\n\nfunction hashFindAll(text, pat, base = 131, mod = MOD) {   // Rabin–Karp: O(n + m) expected\n  const n = text.length, m = pat.length;\n  if (m === 0) return [...Array(n + 1).keys()];\n  if (m > n) return [];\n  let hp = 0, hw = 0;                           // every product below stays under 2^53: no BigInt needed\n  for (let i = 0; i < m; i++) {\n    hp = (hp * base + pat.charCodeAt(i)) % mod;\n    hw = (hw * base + text.charCodeAt(i)) % mod;\n  }\n  const top = modPow(base, m - 1, mod), out = [];   // top: the weight of the character leaving the window\n  for (let i = 0; i + m <= n; i++) {\n    if (hw === hp && text.startsWith(pat, i)) out.push(i);   // confirm, so a collision can't fake a match\n    if (i + m < n) {                            // slide: drop text[i], then add text[i + m]\n      hw = (hw - ((text.charCodeAt(i) * top) % mod) + mod) % mod;\n      hw = (hw * base + text.charCodeAt(i + m)) % mod;\n    }\n  }\n  return out;\n}\n\nconst bruteFindAll = (text, pat) =>             // try every start: O(n * m)\n  [...Array(Math.max(text.length - pat.length + 1, 0)).keys()].filter(i => text.slice(i, i + pat.length) === pat);\nconst longest = (top, ok) => { let k = top; while (!ok(k)) k--; return k; };   // the largest k <= top with ok(k)\nconst brutePi = s => [...s].map((_, i) => longest(i, k => s.slice(0, k) === s.slice(i + 1 - k, i + 1)));\nconst bruteZ = s => [...s].map((_, i) => (i === 0 ? 0 : longest(s.length - i, k => s.slice(i, i + k) === s.slice(0, k))));\nfunction exactComb(n, r) {                      // exact binomial in BigInt: C(n, i) = C(n, i - 1) * (n - i + 1) / i\n  let c = 1n;\n  for (let i = 1n; i <= BigInt(r); i++) c = (c * (BigInt(n) - i + 1n)) / i;\n  return c;\n}\n\nconst rnd = k => Math.floor(Math.random() * k);\nfor (let t = 0; t < 500; t++) {\n  const abc = [\"a\", \"ab\", \"abc\"][rnd(3)];\n  const word = len => Array.from({ length: len }, () => abc[rnd(abc.length)]).join(\"\");\n  const text = word(rnd(31)), pat = word(rnd(5)), want = bruteFindAll(text, pat);\n  for (const found of [kmpFindAll(text, pat), zFindAll(text, pat), hashFindAll(text, pat)]) assert.deepStrictEqual(found, want);\n  assert.deepStrictEqual(hashFindAll(text, pat, 131, 3), want);   // a tiny modulus: collisions, still right\n  assert.deepStrictEqual(prefixFunction(text), brutePi(text));       // straight from the definitions\n  assert.deepStrictEqual(zFunction(text), bruteZ(text));\n}\nconst ncr = makeNcr(1000), P = BigInt(MOD);\nfor (let t = 0; t < 300; t++) {\n  const a = rnd(MOD), e = rnd(61);\n  assert.strictEqual(modPow(a, e), Number(BigInt(a) ** BigInt(e) % P));   // exact BigInt arithmetic\n  if (a) assert.strictEqual((BigInt(a) * BigInt(modInv(a))) % P, 1n);\n  const n = rnd(1001), r = rnd(n + 5) - 2;\n  assert.strictEqual(ncr(n, r), r < 0 || r > n ? 0 : Number(exactComb(n, r) % P));\n}\n\nconst text = \"abababcabab\", pat = \"abab\", big = makeNcr(100_000);\nconsole.log(\"matches\", ...kmpFindAll(text, pat), \"| pi\", ...prefixFunction(pat), `| mod p: 1/2 = ${modInv(2)},`,\n  `3^(10^9) = ${modPow(3, 10 ** 9)}, C(100000, 50000) = ${big(100_000, 50_000)}`);\n","out":"matches 0 2 7 | pi 0 0 1 2 | mod p: 1/2 = 500000004, 3^(10^9) = 235939645, C(100000, 50000) = 149033233"}]},"breakit":["Delete the character check in `hash_find_all`, keeping only the hash comparison. The full-modulus checks still pass (two different strings of up to 4 letters from a, b and c can't collide modulo 1,000,000,007 with base 131), but the mod-3 check fails at once: `hash_find_all(\"abcab\", \"ab\", mod=3)` returns 0 1 2 3 instead of 0 3.","In JavaScript, replace `mulMod` with a plain `(a * b) % m`. The BigInt checks fail on the first random test, and `modInv(2)` returns 550424600 instead of 500000004: each product near 10¹⁸ is rounded to the nearest double before % runs."]},{"id":"capstone","capstone":true,"t":"Algorithm library + the 89-problem log","min":900,"mods":["m01","m02","m03","m04","m05","m06","m07","m08","m09","m10","m11","m12"],"goal":"Turn your six labs into one tested algorithm library in **both** Python and JavaScript, with the same API in each, a Big-O table and a page of L3 templates you can type from memory. Alongside it, solve and log the 89 module problems, and review six virtual contests and four timed mock interviews. This is your L3 evidence.","deliver":["A repo with `python/` and `js/` folders: the six labs as one library (shortest paths, low-link and Euler paths, interval and bitmask DP, rerooting, Fenwick and lazy segment trees, string search and modular arithmetic), with the same API names in both languages (snake_case and camelCase).","Tests (pytest and `node:test`) that check every routine against a brute force on random inputs, plus the hard cases: a 100,000-vertex path, a reachable and an unreachable negative cycle, an empty pattern, and products past 2⁵³.","A README with a Big-O table (time and space for every routine, with the variables named) and TEMPLATES.md for the L3 templates: Dijkstra, 0-1 BFS, Bellman–Ford, Floyd–Warshall, low-link, Hierholzer, interval DP, bitmask DP, rerooting, Fenwick tree, lazy segment tree, prefix function, Z-function and fast power, each under 20 lines per language (the lazy segment tree may take 40).","A problem log for the 89 module problems (problem, technique, the idea that unlocked it, time, space, what tripped you up), six virtual-contest reviews and four mock-interview reviews."],"rubric":["All tests pass in both languages, including the random brute-force checks and the 100,000-node inputs.","Every routine in the README has its time and space complexity, with amortised and expected costs marked as such.","You can type each template from a blank file in under 5 minutes (the lazy segment tree in under 10).","The problem log names a technique and the key idea for each of the 89 problems, and every contest and mock review says what to fix next.","The code reads cleanly: matching names in both languages, no recursion that could pass 1,000 levels, nothing copy-pasted."],"steps":["Create the repo and move in your six lab solutions, one file per topic, with the same API names in both languages.","Turn each lab's checks into pytest and `node:test` files: brute force on random inputs, the edge cases (empty, one element, disconnected, unreachable) and the 100,000-node inputs.","Write the README's Big-O table and TEMPLATES.md, then retype each template from a blank file once a week until it comes out right first time.","Work through the 89 module problems topic by topic, and log each one the same day with the technique that unlocked it.","From module 04 on, do a 90-minute virtual contest every two weeks and upsolve the first problem you couldn't finish; once a month, do a 60-minute mock interview (the Interview tab, or the tutor in Examiner mode). Write a five-line review after each."],"stretch":["Benchmark your lazy-deletion Dijkstra against a version with an indexed heap and decrease-key, on large sparse and dense random graphs, and explain the result.","Add a merge-sort tree (count the values ≤ x in a range in O(log² n)) or a persistent segment tree (query any earlier version of the array after O(log n) new nodes per update).","Preview L4: build a suffix array by prefix doubling in O(n log² n) with Kasai's LCP array, and use it to count the distinct substrings of a string."]}],"interview":[{"c":"Shortest paths","q":"Explain Dijkstra's algorithm and why it fails with negative edges.","a":"Dijkstra keeps tentative distances and a min-heap of (distance, vertex). It repeatedly pops the closest unfinished vertex, which is now final, and relaxes its edges, pushing any improved distance. With a binary heap and lazy deletion (skip popped entries whose distance is out of date) it takes O((V + E) log V) time and O(V + E) space. It relies on one fact: once the closest vertex is popped, no later path to it can be shorter. That holds only when weights are non-negative; a negative edge found later could lower a distance that's already final. With negative edges I use Bellman–Ford instead.","f":["How would you return the path itself?","When is 0-1 BFS better?"]},{"c":"Shortest paths","q":"When would you use Bellman–Ford or Floyd–Warshall instead of Dijkstra?","a":"Bellman–Ford handles negative edges and detects negative cycles: relax every edge V − 1 times, and if a V-th round still improves something, a negative cycle is reachable. It's O(V · E). Running only k rounds, each reading a copy of the previous round's distances, also solves “at most k edges” problems like Cheapest Flights Within K Stops. Floyd–Warshall gives all-pairs distances in O(V³) time and O(V²) space with three nested loops, the intermediate vertex outermost. It suits a few hundred vertices when I need every pair, or a transitive closure."},{"c":"Shortest paths","q":"How do you adapt Dijkstra to minimise the largest single step instead of the total?","a":"I change how a path's cost combines: extending a path costs max(current cost, edge weight) instead of current + weight. Dijkstra still works, because the cost never decreases as a path grows. Path With Minimum Effort and Swim in Rising Water are this “bottleneck” version. Alternatives are binary search on the answer with a BFS check, or union-find adding edges in increasing order until the two ends connect."},{"c":"Graph structure","q":"What's the cut property, and how do Kruskal's and Prim's algorithms use it?","a":"For any split of the vertices into two groups, a lightest edge crossing the split belongs to some minimum spanning tree. Kruskal sorts all the edges and adds each one that joins two different components, checked with union-find: O(E log E). Prim grows one tree from a start vertex, always adding the cheapest edge leaving it, using a min-heap: O(E log V), or a simple O(V²) array version for dense graphs. Both are greedy algorithms, and the cut property is what proves them correct."},{"c":"Graph structure","q":"How do you find bridges, and why does the iterative version matter in Python?","a":"One DFS records each vertex's discovery time tin and its low-link value: the smallest tin its subtree can reach with one back edge. A tree edge u → v is a bridge when low[v] > tin[u], because nothing below v can get back to u or above without it. To handle repeated edges between the same two vertices, I skip only the edge I arrived by (by its id), not every edge to the parent. It's O(V + E). A recursive DFS on a 10⁵-vertex path passes Python's 1,000-frame limit, so I keep an explicit stack of (vertex, next-edge index)."},{"c":"Advanced DP","q":"How do you recognise an interval DP, and in what order do you fill it?","a":"The answer for a range i..j comes from splitting it at some k, or from peeling off its ends: palindromes, burst balloons, merging stones, triangulating a polygon. The state is dp[i][j], and the transition tries every split in between, so it's usually O(n³) time and O(n²) space. The table must be filled by increasing length, because each interval depends only on shorter intervals inside it. For burst balloons, the trick is to choose the *last* balloon to burst in the range, which makes the two sides independent."},{"c":"Advanced DP","q":"When is bitmask DP the right tool?","a":"When the state must remember which items of a small set are used, with n up to about 20: assignments, the travelling salesman problem, covering problems. The state is a mask, often with an extra index such as the last city, so Held–Karp TSP is O(2ⁿ · n²) time and O(2ⁿ · n) space instead of O(n!). Enumerating every submask of every mask costs 3ⁿ. With 2²⁰ masks I keep the tables in flat lists in Python and typed arrays in JavaScript."},{"c":"Advanced DP","q":"Explain rerooting with an example.","a":"Some tree problems ask for an answer with every node as the root, like the sum of distances from each node. Running a DFS from every node is O(n²). Instead, I compute the answer for root 0 with one DFS that also stores subtree sizes, then move the root across each edge: when the root moves from u to its child v, the size[v] nodes under v get one step closer and the other n − size[v] get one step further, so ans[v] = ans[u] − size[v] + (n − size[v]). That's two passes, O(n) in total, and in Python I do both iteratively with a precomputed DFS order."},{"c":"Advanced DP","q":"What is digit DP?","a":"A way to count the numbers up to N with some digit property: no two consecutive 1s in binary, how many 1 digits, only allowed digits. I walk N's digits from the most significant, with a state like (position, tight, extra information), where tight means the prefix so far equals N's prefix, so the next digit can't exceed N's digit at that position. Memoising the states makes the cost about digits × states × 10, tiny compared with looping to N."},{"c":"Range queries","q":"Fenwick tree or segment tree: how do you choose?","a":"A Fenwick tree does point updates and prefix queries for sums (or anything you can subtract) in O(log n) with about ten lines of code and n + 1 array slots. A segment tree is more general: any associative operation (min, max, gcd, sum), range updates through lazy propagation, and searching for the first position that meets a condition, all in O(log n), at the cost of more code and up to 4n nodes. Sums with point updates: Fenwick. Range min or max with updates, or range assignment: segment tree."},{"c":"Range queries","q":"How does lazy propagation work?","a":"When an update covers a node's whole range, I apply it to that node's stored value and leave a pending tag, like “add 5”, instead of updating every node below. Whenever a later operation needs to go below that node, it first pushes the tag down to the two children. Each update or query then touches O(log n) nodes, so range add with range sum or range max costs O(log n) per operation."},{"c":"Range queries","q":"How would you count, for each element, how many smaller elements come after it?","a":"I go through the array from the right, keeping a Fenwick tree over the values seen so far. For each element, the number of smaller values already seen is a prefix sum up to its value minus one; then I add the element. Values can be large or negative, so I first compress them to ranks 1..m by sorting the distinct values. That's O(n log n) time and O(n) space. A merge sort that counts how many right-half elements move past each left element works too."},{"c":"Strings & maths","q":"Explain the KMP prefix function and one use beyond searching.","a":"π[i] is the length of the longest proper prefix of s[0..i] that is also a suffix of it. It's computed in O(n) by reusing earlier values: on a mismatch I fall back to π[k − 1] instead of starting over. Searching for p in t is the prefix function of p + “#” + t, where every position whose value equals len(p) ends a match: O(n + m) in total. Beyond searching, n − π[n − 1] gives the shortest period of a string, which answers Repeated Substring Pattern, and the prefix function of s + “#” + reverse(s) gives the longest palindromic prefix, which solves Shortest Palindrome."},{"c":"Strings & maths","q":"How do you compute a^b mod m and a modular inverse, and what changes in JavaScript?","a":"Fast exponentiation squares the base and halves the exponent, so it needs O(log b) multiplications. When m is prime, Fermat's little theorem gives the inverse as a^(m − 2) mod m; otherwise I use the extended Euclidean algorithm. Python has both built in: pow(a, b, m) and pow(a, -1, m). In JavaScript, a product of two numbers near 10⁹ is about 10¹⁸, beyond 2⁵³, so it silently loses p
