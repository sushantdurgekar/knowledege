per day of effort, and checks that must always hold become automated guardrails: policies that block or flag violations such as unencrypted storage, public buckets or missing owner tags, with time-limited exemptions for risks the business has accepted."],"dia":[{"type":"hub","cap":"The six pillars of the AWS Well-Architected Framework","core":"Your workload","spokes":[["Operational excellence","operations as code, small reversible changes, learn from failure"],["Security","identity, traceability, defence in depth, data protection"],["Reliability","automatic recovery, tested recovery, horizontal scale"],["Performance efficiency","measured choices, managed services, experiments"],["Cost optimization","pay for use, measure efficiency, attribute spending"],["Sustainability","high utilisation, scale with demand, efficient hardware"]]},{"type":"flow","cap":"A well-architected review","steps":[["Scope","one workload, its business goals and its owners"],["Answer","each pillar's questions, together with the team"],["Risks","high- and medium-risk issues from the gaps"],["Plan","fixes ordered by risk removed per day of effort"],["Repeat","at each milestone, with guardrails in between"]],"loop":"next milestone","note":"The review's output is an improvement plan with owners and dates; a review that only produces a score has failed."},{"type":"layers","cap":"Turning findings into guardrails","rows":[["Preventive","policies that block a change: no public buckets, encryption on, approved regions only"],["Detective","rules that flag drift after the fact: a missing owner tag, a single-zone database"],["Exemptions","accepted risks with an owner and an expiry date"],["Review","the next well-architected review checks what the guardrails can't"]],"note":"Automate the checks that must always hold, so humans can spend reviews on judgment."}],"cmp":[{"cap":"AWS and Azure well-architected frameworks","head":["","AWS Well-Architected","Azure Well-Architected"],"rows":[["Pillars","Six: operational excellence, security, reliability, performance efficiency, cost optimization, sustainability","Five: reliability, security, cost optimization, operational excellence, performance efficiency"],["Sustainability","A pillar since 2021","Separate guidance, not a pillar"],["Review tooling","The Well-Architected Tool, with lenses, risks and milestones","The Well-Architected assessment, plus Azure Advisor recommendations"],["Trade-offs","Discussed within each pillar","A published trade-offs page for each pillar"]]},{"cap":"Reliability against cost: how much availability to buy","head":["Design","Typical availability","Downtime a month","Relative cost"],"rows":[["One zone","99.5%","about 3.6 hours","1×"],["Three zones in a region","99.95%","about 22 minutes","about 1.8×"],["Two regions, active-passive","99.99%","about 4 minutes","about 2.6×"],["Two regions, active-active","99.995%","about 2 minutes","about 3.5×"]]}],"code":[{"t":"The seeded random generator used by the fleet simulation","tabs":[{"lang":"python","src":"def mulberry32(seed):\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"A review as data: risks per pillar","tabs":[{"lang":"python","src":"REVIEW = [                                             # (pillar, question, best practices, the ones the team has)\n    (\"reliability\", \"How do you back up data?\", [\"automated backups\", \"tested restores\", \"cross-region copies\"], [\"automated backups\"]),\n    (\"reliability\", \"How do you withstand component failures?\", [\"multiple zones\", \"health checks\", \"automatic recovery\"], [\"multiple zones\", \"health checks\"]),\n    (\"security\", \"How do you manage identities?\", [\"single sign-on\", \"no long-lived keys\", \"least privilege\"], [\"single sign-on\", \"no long-lived keys\", \"least privilege\"]),\n    (\"security\", \"How do you protect data at rest?\", [\"encryption\", \"key rotation\"], []),\n    (\"cost optimization\", \"How do you watch spending?\", [\"cost allocation tags\", \"budgets and alerts\"], [\"budgets and alerts\"]),\n    (\"operational excellence\", \"How do you deploy changes?\", [\"infrastructure as code\", \"small reversible changes\", \"automatic rollback\"], [\"infrastructure as code\"]),\n    (\"performance efficiency\", \"How do you choose compute?\", [\"load-tested sizes\", \"right-sizing reviews\"], [\"load-tested sizes\", \"right-sizing reviews\"]),\n    (\"sustainability\", \"How do you match resources to demand?\", [\"scale to zero when idle\", \"managed services\"], [\"managed services\"]),\n]\n\ndef risk(practices, present):\n    missing = [p for p in practices if p not in present]\n    if len(missing) * 2 >= len(practices):\n        return \"high\", missing                         # half or more of the best practices are missing\n    return (\"medium\" if missing else \"none\"), missing\n\nsummary = {}\nfor pillar, question, practices, present in REVIEW:\n    level, missing = risk(practices, present)\n    summary.setdefault(pillar, {\"high\": 0, \"medium\": 0, \"none\": 0})[level] += 1\n    if level == \"high\":\n        print(f\"high risk ({pillar}): {question} missing {', '.join(missing)}\")\nfor pillar, counts in summary.items():\n    print(f\"{pillar}: {counts['high']} high, {counts['medium']} medium, {counts['none']} without risk\")\n","out":"high risk (reliability): How do you back up data? missing tested restores, cross-region copies\nhigh risk (security): How do you protect data at rest? missing encryption, key rotation\nhigh risk (cost optimization): How do you watch spending? missing cost allocation tags\nhigh risk (operational excellence): How do you deploy changes? missing small reversible changes, automatic rollback\nhigh risk (sustainability): How do you match resources to demand? missing scale to zero when idle\nreliability: 1 high, 1 medium, 0 without risk\nsecurity: 1 high, 0 medium, 1 without risk\ncost optimization: 1 high, 0 medium, 0 without risk\noperational excellence: 1 high, 0 medium, 0 without risk\nperformance efficiency: 0 high, 0 medium, 1 without risk\nsustainability: 1 high, 0 medium, 0 without risk\n","notes":[[1,"Each row is one question: the pillar, the best practices it looks for, and what the team actually has."],[14,"A toy rule: half or more of the practices missing makes a high risk. The real tool derives risks from the answers to each question."],[23,"The summary shows where the risk concentrates; the improvement plan starts with the high-risk issues."]]},{"lang":"javascript","src":"const REVIEW = [                                       // [pillar, question, best practices, the ones the team has]\n  [\"reliability\", \"How do you back up data?\", [\"automated backups\", \"tested restores\", \"cross-region copies\"], [\"automated backups\"]],\n  [\"reliability\", \"How do you withstand component failures?\", [\"multiple zones\", \"health checks\", \"automatic recovery\"], [\"multiple zones\", \"health checks\"]],\n  [\"security\", \"How do you manage identities?\", [\"single sign-on\", \"no long-lived keys\", \"least privilege\"], [\"single sign-on\", \"no long-lived keys\", \"least privilege\"]],\n  [\"security\", \"How do you protect data at rest?\", [\"encryption\", \"key rotation\"], []],\n  [\"cost optimization\", \"How do you watch spending?\", [\"cost allocation tags\", \"budgets and alerts\"], [\"budgets and alerts\"]],\n  [\"operational excellence\", \"How do you deploy changes?\", [\"infrastructure as code\", \"small reversible changes\", \"automatic rollback\"], [\"infrastructure as code\"]],\n  [\"performance efficiency\", \"How do you choose compute?\", [\"load-tested sizes\", \"right-sizing reviews\"], [\"load-tested sizes\", \"right-sizing reviews\"]],\n  [\"sustainability\", \"How do you match resources to demand?\", [\"scale to zero when idle\", \"managed services\"], [\"managed services\"]],\n];\n\nfunction risk(practices, present) {\n  const missing = practices.filter(p => !present.includes(p));\n  if (missing.length * 2 >= practices.length) return [\"high\", missing];   // half or more of the best practices are missing\n  return [missing.length ? \"medium\" : \"none\", missing];\n}\n\nconst summary = new Map();\nfor (const [pillar, question, practices, present] of REVIEW) {\n  const [level, missing] = risk(practices, present);\n  if (!summary.has(pillar)) summary.set(pillar, { high: 0, medium: 0, none: 0 });\n  summary.get(pillar)[level]++;\n  if (level === \"high\") console.log(`high risk (${pillar}): ${question} missing ${missing.join(\", \")}`);\n}\nfor (const [pillar, counts] of summary) console.log(`${pillar}: ${counts.high} high, ${counts.medium} medium, ${counts.none} without risk`);\n","out":"high risk (reliability): How do you back up data? missing tested restores, cross-region copies\nhigh risk (security): How do you protect data at rest? missing encryption, key rotation\nhigh risk (cost optimization): How do you watch spending? missing cost allocation tags\nhigh risk (operational excellence): How do you deploy changes? missing small reversible changes, automatic rollback\nhigh risk (sustainability): How do you match resources to demand? missing scale to zero when idle\nreliability: 1 high, 1 medium, 0 without risk\nsecurity: 1 high, 0 medium, 1 without risk\ncost optimization: 1 high, 0 medium, 0 without risk\noperational excellence: 1 high, 0 medium, 0 without risk\nperformance efficiency: 0 high, 0 medium, 1 without risk\nsustainability: 1 high, 0 medium, 0 without risk\n","notes":[[1,"Each row is one question: the pillar, the best practices it looks for, and what the team actually has."],[14,"A toy rule: half or more of the practices missing makes a high risk. The real tool derives risks from the answers to each question."],[25,"The summary shows where the risk concentrates; the improvement plan starts with the high-risk issues."]]}]},{"t":"How much reliability to buy: infrastructure plus the cost of downtime","tabs":[{"lang":"python","src":"OPTIONS = [                                            # (design, availability in thousandths of a percent, monthly infrastructure $)\n    (\"one zone\", 99_500, 10_000),\n    (\"three zones\", 99_950, 18_000),\n    (\"two regions, active-passive\", 99_990, 26_000),\n    (\"two regions, active-active\", 99_995, 35_000),\n]\nMINUTES = 30 * 24 * 60                                 # in a 30-day month\n\ndef monthly(loss_per_minute):\n    rows = []\n    for design, a, infra in OPTIONS:\n        lost = (100_000 - a) * MINUTES                 # expected minutes of downtime, times 100,000\n        rows.append((design, (lost + 5_000) // 10_000, infra + (lost * loss_per_minute + 50_000) // 100_000))\n    return rows                                        # (design, tenths of a minute down, total $ a month)\n\nfor business, loss in ((\"a shop losing $300 a minute when down\", 300), (\"a payment network losing $5,000 a minute\", 5_000)):\n    rows = monthly(loss)\n    cheapest = min(rows, key=lambda r: r[2])[0]\n    print(f\"{business}:\")\n    for design, tenths, total in rows:\n        mark = \"  <- cheapest overall\" if design == cheapest else \"\"\n        print(f\"  {design}: {tenths // 10}.{tenths % 10} min down, ${total:,} a month{mark}\")\n","out":"a shop losing $300 a minute when down:\n  one zone: 216.0 min down, $74,800 a month\n  three zones: 21.6 min down, $24,480 a month  <- cheapest overall\n  two regions, active-passive: 4.3 min down, $27,296 a month\n  two regions, active-active: 2.2 min down, $35,648 a month\na payment network losing $5,000 a minute:\n  one zone: 216.0 min down, $1,090,000 a month\n  three zones: 21.6 min down, $126,000 a month\n  two regions, active-passive: 4.3 min down, $47,600 a month\n  two regions, active-active: 2.2 min down, $45,800 a month  <- cheapest overall\n","notes":[[1,"Illustrative availabilities and costs: real numbers come from your provider's documentation and your own incident history."],[12,"Expected downtime: the unavailable fraction of a month's 43,200 minutes, in integers to keep the arithmetic exact."],[13,"Total cost = infrastructure + downtime × what a minute of downtime costs."],[22,"The shop's cheapest option is three zones; the payment network's is two active regions. The right amount of reliability depends on the business."]]},{"lang":"javascript","src":"const OPTIONS = [                                      // [design, availability in thousandths of a percent, monthly infrastructure $]\n  [\"one zone\", 99500, 10000],\n  [\"three zones\", 99950, 18000],\n  [\"two regions, active-passive\", 99990, 26000],\n  [\"two regions, active-active\", 99995, 35000],\n];\nconst MINUTES = 30 * 24 * 60;                          // in a 30-day month\n\nfunction monthly(lossPerMinute) {\n  return OPTIONS.map(([design, a, infra]) => {\n    const lost = (100000 - a) * MINUTES;               // expected minutes of downtime, times 100,000\n    return [design, Math.floor((lost + 5000) / 10000), infra + Math.floor((lost * lossPerMinute + 50000) / 100000)];\n  });                                                  // [design, tenths of a minute down, total $ a month]\n}\n\nfor (const [business, loss] of [[\"a shop losing $300 a minute when down\", 300], [\"a payment network losing $5,000 a minute\", 5000]]) {\n  const rows = monthly(loss);\n  const cheapest = rows.reduce((a, b) => (b[2] < a[2] ? b : a))[0];\n  console.log(`${business}:`);\n  for (const [design, tenths, total] of rows) {\n    const mark = design === cheapest ? \"  <- cheapest overall\" : \"\";\n    console.log(`  ${design}: ${Math.floor(tenths / 10)}.${tenths % 10} min down, $${total.toLocaleString(\"en-US\")} a month${mark}`);\n  }\n}\n","out":"a shop losing $300 a minute when down:\n  one zone: 216.0 min down, $74,800 a month\n  three zones: 21.6 min down, $24,480 a month  <- cheapest overall\n  two regions, active-passive: 4.3 min down, $27,296 a month\n  two regions, active-active: 2.2 min down, $35,648 a month\na payment network losing $5,000 a minute:\n  one zone: 216.0 min down, $1,090,000 a month\n  three zones: 21.6 min down, $126,000 a month\n  two regions, active-passive: 4.3 min down, $47,600 a month\n  two regions, active-active: 2.2 min down, $45,800 a month  <- cheapest overall\n","notes":[[1,"Illustrative availabilities and costs: real numbers come from your provider's documentation and your own incident history."],[11,"Expected downtime: the unavailable fraction of a month's 43,200 minutes, in integers to keep the arithmetic exact."],[12,"Total cost = infrastructure + downtime × what a minute of downtime costs."],[22,"The shop's cheapest option is three zones; the payment network's is two active regions. The right amount of reliability depends on the business."]]}]},{"t":"Right-sizing a fleet: cost and sustainability together","tabs":[{"lang":"python","src":"rand = mulberry32(3)\nSIZES = [(\"large\", 8, 40), (\"xlarge\", 16, 80), (\"2xlarge\", 32, 160)]   # (name, vCPUs, cents an hour; illustrative prices)\nfleet = []\nfor i in range(12):\n    size = int(rand() * 3)\n    typical = 5 + int(rand() * 60)                     # each server's usual CPU percentage\n    samples = [max(1, min(100, typical + int((rand() - 0.5) * 30))) for _ in range(720)]   # a month, hourly\n    fleet.append((f\"web-{i:02d}\", size, samples))\nfleet.append((\"db-01\", 1, [70 + h % 24 for h in range(720)]))   # a database that runs hot every evening\n\ndef p95(values):\n    ordered = sorted(values)\n    return ordered[(len(ordered) * 95 + 99) // 100 - 1]   # nearest-rank 95th percentile\n\nsaved = added = saved_vcpu_hours = 0\nfor name, size, samples in fleet:\n    busy = p95(samples)\n    if busy < 40 and size > 0:\n        new = size - 1                                 # half the vCPUs: about twice the CPU percentage, still below 80\n    elif busy > 80 and size < len(SIZES) - 1:\n        new = size + 1                                 # too hot at the peak: one size up\n    else:\n        continue\n    change = (SIZES[size][2] - SIZES[new][2]) * 730\n    saved, added = (saved + change, added) if change > 0 else (saved, added - change)\n    saved_vcpu_hours += (SIZES[size][1] - SIZES[new][1]) * 730\n    print(f\"{name}: p95 CPU {busy}% on {SIZES[size][0]} -> {SIZES[new][0]}\")\ntotal_cents = sum(SIZES[size][2] * 730 for _, size, _ in fleet)\nusd = lambda cents: f\"${cents // 100:,}\"\nprint(f\"downsizing saves {usd(saved)} a month, upsizing costs {usd(added)}: net {usd(saved - added)} of {usd(total_cents)} \"\n      f\"({(saved - added) * 100 // total_cents}%), and {saved_vcpu_hours:,} fewer vCPU-hours\")\n","out":"web-00: p95 CPU 20% on 2xlarge -> xlarge\nweb-01: p95 CPU 18% on xlarge -> large\nweb-05: p95 CPU 20% on 2xlarge -> xlarge\nweb-06: p95 CPU 25% on 2xlarge -> xlarge\nweb-08: p95 CPU 21% on 2xlarge -> xlarge\ndb-01: p95 CPU 92% on xlarge -> 2xlarge\ndownsizing saves $2,628 a month, upsizing costs $584: net $2,044 of $9,928 (20%), and 40,880 fewer vCPU-hours\n","notes":[[9,"A database that runs hot every evening: right-sizing goes both ways."],[13,"The 95th percentile, not the average: a server must cope with its busy hours."],[18,"Below 40% at the 95th percentile, half the vCPUs still leaves headroom below 80%."],[30,"About a fifth of the bill and of the vCPU-hours go: idle capacity costs money and energy alike."]]},{"lang":"javascript","src":"const rand = mulberry32(3);\nconst SIZES = [[\"large\", 8, 40], [\"xlarge\", 16, 80], [\"2xlarge\", 32, 160]];   // [name, vCPUs, cents an hour; illustrative prices]\nconst fleet = [];\nfor (let i = 0; i < 12; i++) {\n  const size = Math.floor(rand() * 3);\n  const typical = 5 + Math.floor(rand() * 60);          // each server's usual CPU percentage\n  const samples = Array.from({ length: 720 }, () => Math.max(1, Math.min(100, typical + Math.trunc((rand() - 0.5) * 30))));   // a month, hourly\n  fleet.push([`web-${String(i).padStart(2, \"0\")}`, size, samples]);\n}\nfleet.push([\"db-01\", 1, Array.from({ length: 720 }, (_, h) => 70 + (h % 24))]);   // a database that runs hot every evening\n\nfunction p95(values) {\n  const ordered = [...values].sort((a, b) => a - b);\n  return ordered[Math.floor((ordered.length * 95 + 99) / 100) - 1];   // nearest-rank 95th percentile\n}\n\nlet saved = 0, added = 0, savedVcpuHours = 0;\nfor (const [name, size, samples] of fleet) {\n  const busy = p95(samples);\n  let next;\n  if (busy < 40 && size > 0) next = size - 1;          // half the vCPUs: about twice the CPU percentage, still below 80\n  else if (busy > 80 && size < SIZES.length - 1) next = size + 1;   // too hot at the peak: one size up\n  else continue;\n  const change = (SIZES[size][2] - SIZES[next][2]) * 730;\n  if (change > 0) saved += change; else added -= change;\n  savedVcpuHours += (SIZES[size][1] - SIZES[next][1]) * 730;\n  console.log(`${name}: p95 CPU ${busy}% on ${SIZES[size][0]} -> ${SIZES[next][0]}`);\n}\nconst totalCents = fleet.reduce((sum, [, size]) => sum + SIZES[size][2] * 730, 0);\nconst usd = cents => `$${Math.floor(cents / 100).toLocaleString(\"en-US\")}`;\nconsole.log(`downsizing saves ${usd(saved)} a month, upsizing costs ${usd(added)}: net ${usd(saved - added)} of ${usd(totalCents)} ` +\n            `(${Math.floor((saved - added) * 100 / totalCents)}%), and ${savedVcpuHours.toLocaleString(\"en-US\")} fewer vCPU-hours`);\n","out":"web-00: p95 CPU 20% on 2xlarge -> xlarge\nweb-01: p95 CPU 18% on xlarge -> large\nweb-05: p95 CPU 20% on 2xlarge -> xlarge\nweb-06: p95 CPU 25% on 2xlarge -> xlarge\nweb-08: p95 CPU 21% on 2xlarge -> xlarge\ndb-01: p95 CPU 92% on xlarge -> 2xlarge\ndownsizing saves $2,628 a month, upsizing costs $584: net $2,044 of $9,928 (20%), and 40,880 fewer vCPU-hours\n","notes":[[10,"A database that runs hot every evening: right-sizing goes both ways."],[14,"The 95th percentile, not the average: a server must cope with its busy hours."],[21,"Below 40% at the 95th percentile, half the vCPUs still leaves headroom below 80%."],[31,"About a fifth of the bill and of the vCPU-hours go: idle capacity costs money and energy alike."]]}]}],"ex":{"q":"A review found eight issues across five pillars, each with a likelihood and an impact from 1 to 5, an effort in days, and some prerequisites (key rotation needs encryption first). With one engineer working through them in order, compare two plans: the scariest issue first, and the most risk removed per day of effort first. Measure the exposure (each issue's risk × the day it's fixed) and when the high risks are gone.","steps":["Score each issue: risk = likelihood × impact. Anything at 15 or more counts as a high risk.","At each step only issues whose prerequisites are fixed are ready. One plan takes the highest risk; the other takes the highest risk per day of effort (weighted shortest job first).","Exposure adds up risk × the day each issue is closed: the area under the open-risk curve. Lower is better.","Compare both measures: total exposure, and the day the last high risk closes. They can disagree, and that disagreement is a decision for the risk owner."],"code":{"t":"Two ways to order the improvement plan","tabs":[{"lang":"python","src":"FINDINGS = [                                           # (id, what to fix, pillar, likelihood 1-5, impact 1-5, days, depends on)\n    (\"F1\", \"encrypt data at rest\", \"security\", 4, 5, 3, []),\n    (\"F2\", \"test restores monthly\", \"reliability\", 3, 5, 5, []),\n    (\"F3\", \"copy backups to a second region\", \"reliability\", 2, 5, 8, [\"F2\"]),\n    (\"F4\", \"automatic rollback on failed deploys\", \"operational excellence\", 4, 3, 4, []),\n    (\"F5\", \"cost allocation tags\", \"cost optimization\", 5, 2, 2, []),\n    (\"F6\", \"canary releases\", \"operational excellence\", 3, 4, 6, [\"F4\"]),\n    (\"F7\", \"rotate encryption keys\", \"security\", 3, 4, 2, [\"F1\"]),\n    (\"F8\", \"scale idle environments to zero\", \"sustainability\", 2, 2, 3, []),\n]\n\ndef plan(findings, key):\n    done, order, day = set(), [], 0\n    pending = list(findings)\n    while pending:\n        ready = [f for f in pending if all(d in done for d in f[6])]   # only findings whose prerequisites are fixed\n        f = max(ready, key=key)\n        pending.remove(f)\n        day += f[5]\n        done.add(f[0])\n        order.append((f, day))\n    return order\n\nrisk = lambda f: f[3] * f[4]                           # likelihood × impact\nby_value_per_day = lambda f: (risk(f) * 1000 // f[5], -int(f[0][1:]))   # risk removed per day of work\nby_risk = lambda f: (risk(f), -int(f[0][1:]))          # the scariest first, whatever it costs\nexposure = lambda order: sum(risk(f) * day for f, day in order)   # risk × days it stays open: lower is better\n\norder = plan(FINDINGS, by_value_per_day)\nfor f, day in order:\n    print(f\"day {day:>2}: {f[0]} {f[1]} ({f[2]}, risk {risk(f)}, {f[5]} days)\")\nfor label, key in ((\"value per day first\", by_value_per_day), (\"scariest first\", by_risk)):\n    o = plan(FINDINGS, key)\n    high = max(day for f, day in o if risk(f) >= 15)\n    print(f\"{label}: high risks (15 or more) all fixed by day {high}, exposure {exposure(o)} risk-days\")\n","out":"day  3: F1 encrypt data at rest (security, risk 20, 3 days)\nday  5: F7 rotate encryption keys (security, risk 12, 2 days)\nday  7: F5 cost allocation tags (cost optimization, risk 10, 2 days)\nday 12: F2 test restores monthly (reliability, risk 15, 5 days)\nday 16: F4 automatic rollback on failed deploys (operational excellence, risk 12, 4 days)\nday 22: F6 canary releases (operational excellence, risk 12, 6 days)\nday 25: F8 scale idle environments to zero (sustainability, risk 4, 3 days)\nday 33: F3 copy backups to a second region (reliability, risk 10, 8 days)\nvalue per day first: high risks (15 or more) all fixed by day 12, exposure 1256 risk-days\nscariest first: high risks (15 or more) all fixed by day 8, exposure 1492 risk-days\n"},{"lang":"javascript","src":"const FINDINGS = [                                     // [id, what to fix, pillar, likelihood 1-5, impact 1-5, days, depends on]\n  [\"F1\", \"encrypt data at rest\", \"security\", 4, 5, 3, []],\n  [\"F2\", \"test restores monthly\", \"reliability\", 3, 5, 5, []],\n  [\"F3\", \"copy backups to a second region\", \"reliability\", 2, 5, 8, [\"F2\"]],\n  [\"F4\", \"automatic rollback on failed deploys\", \"operational excellence\", 4, 3, 4, []],\n  [\"F5\", \"cost allocation tags\", \"cost optimization\", 5, 2, 2, []],\n  [\"F6\", \"canary releases\", \"operational excellence\", 3, 4, 6, [\"F4\"]],\n  [\"F7\", \"rotate encryption keys\", \"security\", 3, 4, 2, [\"F1\"]],\n  [\"F8\", \"scale idle environments to zero\", \"sustainability\", 2, 2, 3, []],\n];\n\nfunction plan(findings, key) {\n  const done = new Set(), order = [];\n  let day = 0, pending = [...findings];\n  while (pending.length) {\n    const ready = pending.filter(f => f[6].every(d => done.has(d)));   // only findings whose prerequisites are fixed\n    const f = ready.reduce((a, b) => {\n      const [ka, kb] = [key(a), key(b)];\n      return kb[0] > ka[0] || (kb[0] === ka[0] && kb[1] > ka[1]) ? b : a;\n    });\n    pending = pending.filter(x => x !== f);\n    day += f[5];\n    done.add(f[0]);\n    order.push([f, day]);\n  }\n  return order;\n}\n\nconst risk = f => f[3] * f[4];                         // likelihood × impact\nconst byValuePerDay = f => [Math.floor(risk(f) * 1000 / f[5]), -Number(f[0].slice(1))];   // risk removed per day of work\nconst byRisk = f => [risk(f), -Number(f[0].slice(1))];   // the scariest first, whatever it costs\nconst exposure = order => order.reduce((sum, [f, day]) => sum + risk(f) * day, 0);   // risk × days it stays open: lower is better\n\nfor (const [f, day] of plan(FINDINGS, byValuePerDay)) {\n  console.log(`day ${String(day).padStart(2)}: ${f[0]} ${f[1]} (${f[2]}, risk ${risk(f)}, ${f[5]} days)`);\n}\nfor (const [label, key] of [[\"value per day first\", byValuePerDay], [\"scariest first\", byRisk]]) {\n  const o = plan(FINDINGS, key);\n  const high = Math.max(...o.filter(([f]) => risk(f) >= 15).map(([, day]) => day));\n  console.log(`${label}: high risks (15 or more) all fixed by day ${high}, exposure ${exposure(o)} risk-days`);\n}\n","out":"day  3: F1 encrypt data at rest (security, risk 20, 3 days)\nday  5: F7 rotate encryption keys (security, risk 12, 2 days)\nday  7: F5 cost allocation tags (cost optimization, risk 10, 2 days)\nday 12: F2 test restores monthly (reliability, risk 15, 5 days)\nday 16: F4 automatic rollback on failed deploys (operational excellence, risk 12, 4 days)\nday 22: F6 canary releases (operational excellence, risk 12, 6 days)\nday 25: F8 scale idle environments to zero (sustainability, risk 4, 3 days)\nday 33: F3 copy backups to a second region (reliability, risk 10, 8 days)\nvalue per day first: high risks (15 or more) all fixed by day 12, exposure 1256 risk-days\nscariest first: high risks (15 or more) all fixed by day 8, exposure 1492 risk-days\n"}]},"a":"Ordering by risk removed per day cuts the total exposure from 1,492 to 1,256 risk-days, because cheap fixes such as key rotation and cost tags go early and stop accumulating risk. But it closes the last high risk on day 12 instead of day 8: taking the scariest first gets the restore tests done sooner. Neither plan is simply right. A common policy is to fix high risks with severe impact first, then order the rest by risk per day, and to record that policy, and any accepted risks, in the review's improvement plan."},"fade":{"q":"Finish `violations(resources, rules, today)`: check every resource against every guardrail rule and return the failures, sorted, as (pillar, resource id, rule). A failure doesn't count if the resource has an exemption for that rule that hasn't expired.","steps":["Loop over resources and rules; a rule's check returns true when the resource complies.",{"ask":"When should an exemption hide a failure?","a":"Only when one exists for that exact rule and its expiry date is today or later. An expired exemption is an accepted risk nobody re-accepted, so the failure must come back."},{"ask":"Why give exemptions an expiry date at all?","a":"Accepted risks get forgotten. An expiry forces someone to look again: fix it, or consciously accept it for another period, with an owner."},{"ask":"What does it cost?","a":"O(resources × rules) checks, plus sorting the failures. Cloud policy engines run the same loop continuously, or block a change before it's made."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"RULES = [                                              # (rule, pillar, check that must pass)\n    (\"encrypted\", \"security\", lambda r: r.get(\"encrypted\", False)),\n    (\"not-public\", \"security\", lambda r: not r.get(\"public\", False)),\n    (\"owner-tag\", \"cost optimization\", lambda r: \"owner\" in r.get(\"tags\", {})),\n    (\"multi-zone\", \"reliability\", lambda r: r[\"type\"] != \"database\" or r.get(\"zones\", 1) >= 2),\n]\n\ndef violations(resources, rules, today):\n    found = []\n    ...                                                # TODO: each failed rule, unless an unexpired exemption covers it\n    return sorted(found)\n"},{"lang":"javascript","src":"const RULES = [                                        // [rule, pillar, check that must pass]\n  [\"encrypted\", \"security\", r => r.encrypted ?? false],\n  [\"not-public\", \"security\", r => !(r.public ?? false)],\n  [\"owner-tag\", \"cost optimization\", r => \"owner\" in (r.tags ?? {})],\n  [\"multi-zone\", \"reliability\", r => r.type !== \"database\" || (r.zones ?? 1) >= 2],\n];\n\nfunction violations(resources, rules, today) {\n  const found = [];\n  // TODO: each failed rule, unless an unexpired exemption covers it\n  return found.sort((a, b) => (a.join(\"\\u0000\") < b.join(\"\\u0000\") ? -1 : 1));\n}\n"}]},"solution":{"t":"Solution: every rule for every resource, honouring only unexpired exemptions","tabs":[{"lang":"python","src":"RULES = [                                              # (rule, pillar, check that must pass)\n    (\"encrypted\", \"security\", lambda r: r.get(\"encrypted\", False)),\n    (\"not-public\", \"security\", lambda r: not r.get(\"public\", False)),\n    (\"owner-tag\", \"cost optimization\", lambda r: \"owner\" in r.get(\"tags\", {})),\n    (\"multi-zone\", \"reliability\", lambda r: r[\"type\"] != \"database\" or r.get(\"zones\", 1) >= 2),\n]\n\ndef violations(resources, rules, today):\n    found = []\n    for r in resources:\n        for rule, pillar, check in rules:\n            if check(r):\n                continue\n            until = r.get(\"exemptions\", {}).get(rule)  # an approved exception, valid until an ISO date\n            if until is not None and until >= today:\n                continue\n            found.append((pillar, r[\"id\"], rule))\n    return sorted(found)\n\nresources = [\n    {\"id\": \"orders-db\", \"type\": \"database\", \"encrypted\": True, \"zones\": 3, \"tags\": {\"owner\": \"orders\"}},\n    {\"id\": \"reports-db\", \"type\": \"database\", \"encrypted\": True, \"zones\": 1, \"tags\": {\"owner\": \"data\"},\n     \"exemptions\": {\"multi-zone\": \"2026-12-31\"}},     # a reporting copy: an accepted risk, until the year's end\n    {\"id\": \"legacy-db\", \"type\": \"database\", \"encrypted\": False, \"zones\": 1, \"tags\": {},\n     \"exemptions\": {\"encrypted\": \"2026-06-30\"}},       # this exemption has expired\n    {\"id\": \"assets-bucket\", \"type\": \"bucket\", \"encrypted\": True, \"public\": True, \"tags\": {\"owner\": \"web\"}},\n]\nfor pillar, rid, rule in violations(resources, RULES, today=\"2026-10-12\"):\n    print(f\"{pillar}: {rid} fails {rule}\")\n","out":"cost optimization: legacy-db fails owner-tag\nreliability: legacy-db fails multi-zone\nsecurity: assets-bucket fails not-public\nsecurity: legacy-db fails encrypted\n"},{"lang":"javascript","src":"const RULES = [                                        // [rule, pillar, check that must pass]\n  [\"encrypted\", \"security\", r => r.encrypted ?? false],\n  [\"not-public\", \"security\", r => !(r.public ?? false)],\n  [\"owner-tag\", \"cost optimization\", r => \"owner\" in (r.tags ?? {})],\n  [\"multi-zone\", \"reliability\", r => r.type !== \"database\" || (r.zones ?? 1) >= 2],\n];\n\nfunction violations(resources, rules, today) {\n  const found = [];\n  for (const r of resources) {\n    for (const [rule, pillar, check] of rules) {\n      if (check(r)) continue;\n      const until = (r.exemptions ?? {})[rule];      // an approved exception, valid until an ISO date\n      if (until !== undefined && until >= today) continue;\n      found.push([pillar, r.id, rule]);\n    }\n  }\n  return found.sort((a, b) => (a.join(\"\\u0000\") < b.join(\"\\u0000\") ? -1 : 1));\n}\n\nconst resources = [\n  { id: \"orders-db\", type: \"database\", encrypted: true, zones: 3, tags: { owner: \"orders\" } },\n  { id: \"reports-db\", type: \"database\", encrypted: true, zones: 1, tags: { owner: \"data\" },\n    exemptions: { \"multi-zone\": \"2026-12-31\" } },      // a reporting copy: an accepted risk, until the year's end\n  { id: \"legacy-db\", type: \"database\", encrypted: false, zones: 1, tags: {},\n    exemptions: { encrypted: \"2026-06-30\" } },         // this exemption has expired\n  { id: \"assets-bucket\", type: \"bucket\", encrypted: true, public: true, tags: { owner: \"web\" } },\n];\nfor (const [pillar, rid, rule] of violations(resources, RULES, \"2026-10-12\")) console.log(`${pillar}: ${rid} fails ${rule}`);\n","out":"cost optimization: legacy-db fails owner-tag\nreliability: legacy-db fails multi-zone\nsecurity: assets-bucket fails not-public\nsecurity: legacy-db fails encrypted\n"}]}},"traps":[["“We passed the well-architected review.”","There's nothing to pass. The review's output is a list of risks and a plan to reduce them; a workload with no open risks usually means the questions weren't answered honestly."],["“Maximise every pillar.”","The pillars pull against each other: more reliability and performance cost money and energy. Agree targets per workload, such as an availability goal priced from the cost of downtime, and stop there."],["“Do the review once, at launch.”","Workloads drift: new features, new dependencies, new traffic. Review at milestones and after major incidents, and automate the checks that must always hold."],["“Size servers by their average CPU.”","Averages hide the busy hours. Size from a high percentile, keep headroom for spikes and failover, and right-size in both directions."],["“Sustainability is a separate project.”","Most of it is the same work as cost optimisation: higher utilisation, scaling with demand, removing idle resources and efficient hardware. Track it with the same data."],["“A permanent exemption is fine for that one database.”","Accepted risks need an owner and an expiry date; otherwise they become invisible. Re-accept them consciously, or fix them."]],"disc":[["Your organisation runs 300 workloads. How would you roll out well-architected reviews without creating a bottleneck?","Rank workloads by business criticality and review the top tier first, with each team answering its own questions and an experienced facilitator in the room. Turn the most common findings into shared guardrails and platform defaults (encryption on, tagging enforced, multi-zone templates) so whole classes of risk disappear without reviews. Track open high-risk issues per team as a metric, and re-review at milestones rather than on a fixed calendar."],["The CFO asks you to cut the cloud bill by 20% without hurting reliability. Where do you start?","Measure first: attribute every cost to a team and workload with tags, then go after the big items: idle and oversized resources (right-sizing from p95 utilisation), environments running nights and weekends, storage that should move to cheaper tiers, and commitment discounts for steady load. Leave the reliability architecture alone unless the review shows over-provisioning against the agreed targets. Report savings per workload, and set budgets with alerts so the cuts stick."]],"teach":{"prompt":"Explain to a junior colleague what a well-architected review is and how you'd act on its results.","rubric":["The pillars (AWS six, Azure five) and what each one covers","The review: questions per pillar, high- and medium-risk issues, an improvement plan, milestones","Trade-offs between pillars, decided with the business and with numbers","Prioritising fixes by risk and effort","Guardrails and exemptions with expiry dates"],"model":"A well-architected review takes one workload and walks its team through a structured set of questions for each pillar: operational excellence, security, reliability, performance efficiency, cost optimization and, on AWS, sustainability. Where the answers miss best practices, the review records high- and medium-risk issues. The output is an improvement plan: I'd score each issue by likelihood and impact, order the fixes by risk removed per day of effort while fixing any severe high risk first, and assign owners and dates. The pillars trade off against each other, so targets come from the business, such as pricing a minute of downtime to choose how much reliability to buy. Checks that must always hold become automated guardrails, with time-limited exemptions for accepted risks, and the review is repeated at milestones."},"qa":[["Name AWS's six well-architected pillars.","Operational excellence, security, reliability, performance efficiency, cost optimization and sustainability."],["Which pillar does Azure's framework not have?","Sustainability, which Azure covers in separate guidance."],["What is an HRI?","A high-risk issue: a gap the review found that could significantly hurt the business."],["What is a lens in the Well-Architected Tool?","A set of questions and best practices for a particular kind of workload or industry."],["How do you decide how much reliability to buy?","Compare the infrastructure cost of each design with the expected cost of its downtime."],["Why should exemptions expire?","So accepted risks are looked at again instead of being forgotten."]],"quiz":[{"q":"What does this print?","snip":{"t":"Downtime allowed by 99.9% over a 30-day month","tabs":[{"lang":"python","src":"print((1000 - 999) * 30 * 24 * 60 / 1000)\n"},{"lang":"javascript","src":"console.log((1000 - 999) * 30 * 24 * 60 / 1000);\n"}]},"o":["43.2","4.32","432","8.76"],"a":0,"e":"0.1% of 43,200 minutes is 43.2 minutes. Each extra nine divides it by ten: 4.3 minutes at 99.99%."},{"q":"What does this print?","snip":{"t":"Expected monthly cost of two designs","tabs":[{"lang":"python","src":"loss = 300                                   # dollars per minute of downtime\ndesigns = {\"one zone\": (216, 10_000), \"three zones\": (22, 18_000)}   # (minutes down, infrastructure $)\nprint(*(f\"{name} {infra + down * loss}\" for name, (down, infra) in designs.items()))\n"},{"lang":"javascript","src":"const loss = 300;                            // dollars per minute of downtime\nconst designs = { \"one zone\": [216, 10000], \"three zones\": [22, 18000] };   // [minutes down, infrastructure $]\nconsole.log(...Object.entries(designs).map(([name, [down, infra]]) => `${name} ${infra + down * loss}`));\n"}]},"o":["one zone 74800 three zones 24600","one zone 10000 three zones 18000","one zone 64800 three zones 6600","one zone 74800 three zones 18000"],"a":0,"e":"One zone: 10,000 + 216 × 300 = 74,800. Three zones: 18,000 + 22 × 300 = 24,600. The cheaper infrastructure is the more expensive choice."},{"q":"Which pillar is in the AWS Well-Architected Framework but not in Azure's list of pillars?","o":["Sustainability","Reliability","Operational excellence","Cost optimization"],"a":0,"e":"AWS added sustainability as a sixth pillar in 2021. Azure's framework has five pillars and covers sustainability in separate guidance."},{"q":"A review finds that backups exist but restores have never been tested. Which pillar does this high-risk issue belong to, and what's the first fix?","o":["Reliability: schedule and automate regular test restores, and measure how long they take","Security: encrypt the backups","Cost optimization: delete old backups","Performance efficiency: use faster disks"],"a":0,"e":"'Test recovery procedures' is a reliability design principle: an untested backup is a hope, not a recovery plan, and the restore time sets the real RTO."},{"q":"Which are AWS reliability design principles? (choose 3)","t":"ms","o":["Automatically recover from failure","Test recovery procedures","Stop guessing capacity","Prefer one large server to several small ones","Apply changes by hand for more control"],"a":[0,1,2],"e":"The other two run against the framework: it recommends scaling horizontally and managing change through automation."},{"q":"Judge each statement.","t":"yn","s":[["A well-architected review is a pass-or-fail audit.",false],["More replicas usually improve reliability and increase cost.",true],["Right-sizing should look at a high percentile of utilisation, not the average.",true],["Azure's framework publishes trade-offs between its pillars.",true]],"e":"The review produces risks and a plan rather than a grade. Reliability and cost pull against each other, and Azure documents such trade-offs for each pillar. Busy hours, not averages, decide sizes."},{"q":"Put a well-architected review in order.","t":"ord","items":["Choose the workload, its business goals and the people who know it","Answer each pillar's questions together","Record the high- and medium-risk issues","Prioritise them into an improvement plan with owners and dates","Repeat the review at the next milestone"],"e":"The plan, not the score, is the deliverable, and repeating the review shows whether the risks actually went down."},{"q":"Complete the Python function behind the toy review's risk levels.","t":"drop","lang":"python","code":"def risk_level(practices, present):\n    missing = len([p for p in practices if p not in present])\n    if missing * 2 >= {{0}}:\n        return \"high\"                          # half or more of the best practices are missing\n    return \"medium\" if missing > {{1}} else \"none\"\n","blanks":[{"o":["len(practices)","len(present)","missing","2"],"a":0},{"o":["0","1","len(practices)","missing"],"a":0}],"e":"Half or more missing is a high risk, any missing practice at all is a medium risk, and none missing means no risk, for this toy rule."}],"probs":[["Reference · AWS Well-Architected Framework: the pillars","https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html","","answer the reliability pillar's questions for a system you know, and list its high-risk issues"],["Reference · Azure Well-Architected Framework: the pillars","https://learn.microsoft.com/en-us/azure/well-architected/pillars","","compare Azure's five pillars with AWS's six, and say where sustainability went"],["Reading · Azure: Reliability trade-offs","https://learn.microsoft.com/en-us/azure/well-architected/reliability/tradeoffs","","pick two trade-offs from the page and find an example of each in your own systems"],["Reference · AWS Well-Architected Tool: lenses","https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html","","choose the lens that best fits your main workload, and list three questions it adds"]],"src":[["AWS Well-Architected Framework: The pillars of the framework","https://docs.aws.amazon.com/wellarchitected/latest/framework/the-pillars-of-the-framework.html"],["AWS Reliability Pillar: Design principles","https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"],["AWS Well-Architected Tool user guide: workloads, high and medium risks","https://docs.aws.amazon.com/wellarchitected/latest/userguide/workloads.html"],["AWS Well-Architected Tool user guide: lenses","https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses.html"],["Microsoft Azure Well-Architected Framework: pillars","https://learn.microsoft.com/en-us/azure/well-architected/pillars"],["Microsoft Azure Well-Architected Framework: Reliability trade-offs","https://learn.microsoft.com/en-us/azure/well-architected/reliability/tradeoffs"]]},{"id":"m03","d":"d2","t":"Capacity and cost: planning, queueing, load testing and FinOps","min":125,"hook":"Systems rarely fail because nobody could build them. They fail on the busiest day of the year, or they succeed and the bill grows faster than the business. Capacity planning forecasts demand further ahead than it takes to get capacity; queueing theory explains why latency explodes as servers approach full utilisation; load tests turn servers into service capacity; and FinOps puts the cost of every decision in front of the engineers who make it.","pre":{"q":"Your API's peak is 6,000 requests a second on 30 servers spread over three zones. Traffic grows 4% a month, December runs 50% above a normal month, and a load test showed one server meets the latency target up to 450 requests a second. It's October. Are you ready for December?","a":"December's peak is about 6,000 × 1.04² × 1.5 ≈ 9,730 requests a second, which needs 22 servers. But to survive losing a zone, the other two zones must carry the whole peak: 11 servers in each zone, 33 in total. You're three short, and if capacity takes two months to arrive (a quota, hardware or a commitment), the order has to go in now. Check the database and the other shared parts too: the servers may not be the first thing to run out."},"kid":{"t":"Friday night at the pizza oven","x":"Luigi's oven bakes a pizza every five minutes. On quiet nights it's busy half the time and nobody waits long; on Fridays it's busy nine minutes in ten and the line goes out of the door, far longer than the extra customers explain. A second oven helps most when both share one line. Before the festival, Luigi counts last year's crowd, adds this year's growth, and orders another oven two months ahead, because ovens take time to arrive. He holds a practice night where friends arrive every few minutes, ready or not. And the family buys a monthly gas plan for the gas they always use, paying full price only on festival nights.","map":[["An oven busy nine minutes in ten, and a line out of the door","Queueing: waiting time grows like 1 ÷ (1 − utilisation)"],["Two ovens sharing one line","Pooling: one queue feeding several servers waits less than separate queues"],["Last year's festival plus growth, ordered two months ahead","Demand forecasting: organic growth, seasonal peaks and the lead time"],["Friends arriving on time, ready or not","An open-model load test: a fixed arrival rate, like real users"],["A gas plan for the usual, full price for festival nights","Commitments for the steady baseline, on-demand for the peaks"]],"brk":"In the story an oven is just an oven. In real systems the first thing to run out is often not the obvious one: a database's connections, a lock, an account quota or a partner's rate limit. Only a load test of the whole path finds it."},"keys":["**Capacity planning**: Google's SRE book names three mandatory steps: an organic demand forecast that reaches beyond the lead time for getting capacity, the inorganic demand from launches, campaigns and seasons, and regular load tests that turn raw capacity (servers, disks) into service capacity (requests a second within the latency target). Plan for the peak hour, not the average, and add headroom for failures: with three zones, losing one means the other two must carry the whole peak.","**Little's law**: L = λW. The average number of requests in a system equals the arrival rate times the average time each spends there, whatever the distributions. At 200 requests a second and 50 ms each, 10 are in flight. Use it to size thread and connection pools, and to sanity-check a load test's numbers.","**Utilisation and queueing**: for one server with random arrivals (an M/M/1 queue), the mean time in the system is the service time ÷ (1 − utilisation): double at 50% busy, ten times at 90%, and the tail grows the same way. That's why latency-sensitive services run well below 100% at peak, often around 50–70% (a rule of thumb; your latency target sets the real number). One queue feeding several servers waits far less than separate queues at the same utilisation.","**Scalability has limits**: throughput doesn't grow in step with nodes. Neil Gunther's Universal Scalability Law, X(N) = γN ÷ (1 + α(N − 1) + βN(N − 1)), adds contention (α: queueing for shared resources) and coherency (β: the cost of keeping nodes in step). With β above zero, throughput peaks at N = √((1 − α) ÷ β) and then falls. Fit it to a few load-test points to see how far adding nodes can take you.","**Load testing**: run several kinds: smoke (the script works), average-load, stress (above normal), soak (many hours, for leaks and slow growth), spike (sudden surges) and breakpoint (keep increasing until something breaks). Use production-like data and request mixes, test the whole path including databases and third parties (or realistic stand-ins), and find the first bottleneck: fix it, then test again to find the next.","**Open and closed models**: a closed-model load tester sends a new request only after the previous reply arrives, so when the system slows it quietly sends less, and the slow periods are barely measured. This is coordinated omission. Real users arrive whether or not the system is slow, so latency targets need an open model: a fixed arrival rate (k6's arrival-rate executors), with each latency measured from when the request should have been sent.","**Paying for capacity**: know your unit costs (per order, per request, per customer) and how they change at ten times the scale. Buy in layers: commitments (savings plans, reservations, committed-use discounts) for the steady baseline, on-demand for the daily peaks, and spot or preemptible capacity for work that can be interrupted (AWS gives a two-minute warning). A commitment pays off for capacity that's needed in a larger share of hours than its price ÷ the on-demand price.","**FinOps**: the FinOps Foundation's practice for managing cloud spending. Its principles: teams collaborate and take ownership of their usage, business value drives technology decisions, cost data is accessible, timely and accurate, a central team enables the practice, and the cloud's variable cost model is used to advantage. It runs in three repeating phases: Inform (allocate costs to teams with tags and accounts, show unit costs), Optimize (rightsizing, scheduling, commitments, storage tiers) and Operate (budgets, anomaly alerts, policies). Showback reports each team's costs; chargeback bills them."],"dia":[{"type":"flow","cap":"The capacity planning loop","steps":[["Measure","today's peak, and each server's capacity from a load test"],["Forecast","organic growth beyond the lead time, plus launches and seasons"],["Add headroom","a utilisation target, and the loss of a zone"],["Provision","order before the lead time runs out"],["Compare","actual demand against the forecast"]],"loop":"every month, and after every surprise","note":"A forecast is never exactly right; the loop is how you find out early enough to act."},{"type":"hub","cap":"Where capacity runs out first","core":"One request's path","spokes":[["Compute","CPU, memory and threads on each server"],["Connections","database connection pools, file descriptors, NAT ports"],["Shared state","locks, a hot partition, a single primary database"],["Quotas and limits","account quotas, partners' rate limits, licences"],["Network","bandwidth, load balancer capacity, data transfer costs"]]},{"type":"flow","cap":"The FinOps lifecycle","steps":[["Inform","allocate every cost to a team, show unit costs, forecast"],["Optimize","rightsize, schedule, commit to the baseline, tier storage"],["Operate","budgets, anomaly alerts, policies, regular reviews with each team"]],"loop":"continuously","note":"Engineers make most spending decisions, so FinOps puts timely cost data in front of them."}],"cmp":[{"cap":"Six kinds of load test (Grafana k6's names)","head":["Test","The question it answers","Shape"],"rows":[["Smoke","Does the script work, and does the system cope with a trickle?","a few users for a minute or two"],["Average-load","Do we meet our targets on a normal day?","ramp up to normal traffic and hold it"],["Stress","What happens above normal, at the peaks we expect?","ramp above normal and hold it"],["Soak","Does it stay healthy for hours?","normal traffic for many hours: leaks, growing queues, full disks"],["Spike","Can it absorb a sudden surge?","jump to many times normal in seconds, then drop"],["Breakpoint","Where is the limit, and how does it fail?","keep increasing until something breaks"]]},{"cap":"Ways to pay for compute","head":["","On-demand","Commitment","Spot or preemptible"],"rows":[["Price","full price, by the second or hour","discounted, paid whether used or not","the deepest discount"],["Risk","none: stop paying when you stop","paying for idle capacity if demand falls","reclaimed at short notice (two minutes on AWS)"],["Use it for","daily peaks and the unknown","the steady baseline","batch jobs, CI, workers that can retry"]]}],"code":[{"t":"Why latency explodes near full utilisation, and how a shared queue helps","tabs":[{"lang":"python","src":"SERVICE_MS = 20                                        # each request needs 20 ms of one server's time\nLN_100 = 4.605170185988092                             # ln(100): an exponential's 99th percentile is its mean × ln(100)\n\ndef erlang_c(c, a):                                    # chance a request has to wait: c servers, offered load a\n    term = total = 1.0                                 # a^k / k!, starting at k = 0\n    for k in range(1, c):\n        term *= a / k\n        total += term\n    waiting = term * a / c * c / (c - a)               # a^c / c! × c / (c - a)\n    return waiting / (total + waiting)\n\ndef mean_ms(c, busy):                                  # mean time in the system: c servers sharing one queue\n    a = busy * c\n    return SERVICE_MS + erlang_c(c, a) * SERVICE_MS / (c - a)\n\ndef tenths(ms):\n    t = int(ms * 10 + 0.5)\n    return f\"{t // 10}.{t % 10}\"\n\nfor pct in (50, 70, 80, 90, 95):\n    one, four = mean_ms(1, pct / 100), mean_ms(4, pct / 100)\n    print(f\"{pct}% busy: one server {tenths(one)} ms (p99 about {tenths(one * LN_100)} ms), four sharing a queue {tenths(four)} ms\")\n\nrate = 4 * 1000 // SERVICE_MS * 90 // 100              # four servers at 90%: 180 requests a second\nin_system = rate * mean_ms(4, 0.9) / 1000              # Little's law: L = arrival rate × time in the system\nprint(f\"Little's law at {rate} requests a second: {tenths(in_system)} requests in the system on average\")\n","out":"50% busy: one server 40.0 ms (p99 about 184.2 ms), four sharing a queue 21.7 ms\n70% busy: one server 66.7 ms (p99 about 307.0 ms), four sharing a queue 27.1 ms\n80% busy: one server 100.0 ms (p99 about 460.5 ms), four sharing a queue 34.9 ms\n90% busy: one server 200.0 ms (p99 about 921.0 ms), four sharing a queue 59.4 ms\n95% busy: one server 400.0 ms (p99 about 1842.1 ms), four sharing a queue 109.1 ms\nLittle's law at 180 requests a second: 10.7 requests in the system on average\n","notes":[[4,"Erlang's C formula: the chance that an arriving request finds every server busy. With one server it's simply the utilisation."],[14,"Mean time = service time + waiting time, and the wait grows as c − a, the spare capacity, shrinks towards nothing."],[22,"One server: 2× the service time at 50% busy, 10× at 90%, 20× at 95%. Four servers sharing one queue at the same utilisation wait far less."],[25,"Little's law: requests in the system = arrival rate × time in the system. Size thread and connection pools from it, with headroom."]]},{"lang":"javascript","src":"const SERVICE_MS = 20;                                 // each request needs 20 ms of one server's time\nconst LN_100 = 4.605170185988092;                      // ln(100): an exponential's 99th percentile is its mean × ln(100)\n\nfunction erlangC(c, a) {                               // chance a request has to wait: c servers, offered load a\n  let term = 1, total = 1;                             // a^k / k!, starting at k = 0\n  for (let k = 1; k < c; k++) {\n    term *= a / k;\n    total += term;\n  }\n  const waiting = term * a / c * c / (c - a);          // a^c / c! × c / (c - a)\n  return waiting / (total + waiting);\n}\n\nfunction meanMs(c, busy) {                             // mean time in the system: c servers sharing one queue\n  const a = busy * c;\n  return SERVICE_MS + erlangC(c, a) * SERVICE_MS / (c - a);\n}\n\nconst tenths = ms => { const t = Math.floor(ms * 10 + 0.5); return `${Math.floor(t / 10)}.${t % 10}`; };\n\nfor (const pct of [50, 70, 80, 90, 95]) {\n  const one = meanMs(1, pct / 100), four = meanMs(4, pct / 100);\n  console.log(`${pct}% busy: one server ${tenths(one)} ms (p99 about ${tenths(one * LN_100)} ms), four sharing a queue ${tenths(four)} ms`);\n}\n\nconst rate = Math.floor(Math.floor(4 * 1000 / SERVICE_MS) * 90 / 100);   // four servers at 90%: 180 requests a second\nconst inSystem = rate * meanMs(4, 0.9) / 1000;         // Little's law: L = arrival rate × time in the system\nconsole.log(`Little's law at ${rate} requests a second: ${tenths(inSystem)} requests in the system on average`);\n","out":"50% busy: one server 40.0 ms (p99 about 184.2 ms), four sharing a queue 21.7 ms\n70% busy: one server 66.7 ms (p99 about 307.0 ms), four sharing a queue 27.1 ms\n80% busy: one server 100.0 ms (p99 about 460.5 ms), four sharing a queue 34.9 ms\n90% busy: one server 200.0 ms (p99 about 921.0 ms), four sharing a queue 59.4 ms\n95% busy: one server 400.0 ms (p99 about 1842.1 ms), four sharing a queue 109.1 ms\nLittle's law at 180 requests a second: 10.7 requests in the system on average\n","notes":[[4,"Erlang's C formula: the chance that an arriving request finds every server busy. With one server it's simply the utilisation."],[16,"Mean time = service time + waiting time, and the wait grows as c − a, the spare capacity, shrinks towards nothing."],[23,"One server: 2× the service time at 50% busy, 10× at 90%, 20× at 95%. Four servers sharing one queue at the same utilisation wait far less."],[27,"Little's law: requests in the system = arrival rate × time in the system. Size thread and connection pools from it, with headroom."]]}]},{"t":"A capacity plan: growth, seasons, a lost zone and the lead time","tabs":[{"lang":"python","src":"PER_SERVER = 450                                       # requests a second one server handles within the p99 target (load test)\nZONES = 3\nGROWTH = 104                                           # +4% a month, compounding\nSEASON = {\"Nov\": 130, \"Dec\": 150}                      # Black Friday and December, as % of a normal month's peak\nLEAD = 2                                               # months from order to capacity: quota, hardware or a commitment\nMONTHS = [\"Oct\", \"Nov\", \"Dec\", \"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\"]\n\ndef servers_needed(peak):\n    n = -(-peak // PER_SERVER)                         # ceiling division\n    return -(-n // (ZONES - 1)) * ZONES                # enough in each zone to carry the peak with one zone lost\n\nfleet, base = 30, 6_000                                # 10 servers per zone; today's normal peak in requests a second\npeak_fleet = again = None\nfor i, month in enumerate(MONTHS):\n    year = 2026 if i < 3 else 2027\n    peak = base * SEASON.get(month, 100) // 100\n    need = servers_needed(peak)\n    line = f\"{month} {year}: peak {peak:,} req/s, needs {need} servers\"\n    if need > fleet:\n        when = f\"{MONTHS[i - LEAD]} {2026 if i - LEAD < 3 else 2027}\" if i >= LEAD else \"now (already late)\"\n        line += f\": {need - fleet} short, order by {when}\"\n        fleet = need\n    if month in SEASON:\n        peak_fleet = fleet\n    elif peak_fleet and need >= peak_fleet and again is None:\n        again = f\"{month} {year}\"\n    print(line)\n    base = base * GROWTH // 100\nprint(f\"December's {peak_fleet} servers are all needed again in {again}: this year's seasonal peak is next year's normal\")\n","out":"Oct 2026: peak 6,000 req/s, needs 21 servers\nNov 2026: peak 8,112 req/s, needs 30 servers\nDec 2026: peak 9,733 req/s, needs 33 servers: 3 short, order by Oct 2026\nJan 2027: peak 6,748 req/s, needs 24 servers\nFeb 2027: peak 7,017 req/s, needs 24 servers\nMar 2027: peak 7,297 req/s, needs 27 servers\nApr 2027: peak 7,588 req/s, needs 27 servers\nMay 2027: peak 7,891 req/s, needs 27 servers\nJun 2027: peak 8,206 req/s, needs 30 servers\nJul 2027: peak 8,534 req/s, needs 30 servers\nAug 2027: peak 8,875 req/s, needs 30 servers\nSep 2027: peak 9,230 req/s, needs 33 servers\nDecember's 33 servers are all needed again in Sep 2027: this year's seasonal peak is next year's normal\n","notes":[[1,"Service capacity comes from a load test: requests a second within the latency target, not a guess from CPU."],[10,"Surviving the loss of one zone in three means each zone carries half the peak: 50% more servers than the bare minimum."],[20,"Lead time: if capacity takes two months to arrive, December's shortfall must be ordered in October, which is now."],[29,"Growth puts seasonal capacity to work later: by next September, the normal peak needs December's fleet."]]},{"lang":"javascript","src":"const PER_SERVER = 450;                                // requests a second one server handles within the p99 target (load test)\nconst ZONES = 3;\nconst GROWTH = 104;                                    // +4% a month, compounding\nconst SEASON = { Nov: 130, Dec: 150 };                 // Black Friday and December, as % of a normal month's peak\nconst LEAD = 2;                                        // months from order to capacity: quota, hardware or a commitment\nconst MONTHS = [\"Oct\", \"Nov\", \"Dec\", \"Jan\", \"Feb\", \"Mar\", \"Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\"];\n\nfunction serversNeeded(peak) {\n  const n = Math.ceil(peak / PER_SERVER);\n  return Math.ceil(n / (ZONES - 1)) * ZONES;           // enough in each zone to carry the peak with one zone lost\n}\n\nlet fleet = 30, base = 6000;                           // 10 servers per zone; today's normal peak in requests a second\nlet peakFleet = null, again = null;\nMONTHS.forEach((month, i) => {\n  const year = i < 3 ? 2026 : 2027;\n  const peak = Math.floor(base * (SEASON[month] ?? 100) / 100);\n  const need = serversNeeded(peak);\n  let line = `${month} ${year}: peak ${peak.toLocaleString(\"en-US\")} req/s, needs ${need} servers`;\n  if (need > fleet) {\n    const when = i >= LEAD ? `${MONTHS[i - LEAD]} ${i - LEAD < 3 ? 2026 : 2027}` : \"now (already late)\";\n    line += `: ${need - fleet} short, order by ${when}`;\n    fleet = need;\n  }\n  if (month in SEASON) peakFleet = fleet;\n  else if (peakFleet && need >= peakFleet && again === null) again = `${month} ${year}`;\n  console.log(line);\n  base = Math.floor(base * GROWTH / 100);\n});\nconsole.log(`December's ${peakFleet} servers are all needed again in ${again}: this year's seasonal peak is next year's normal`);\n","out":"Oct 2026: peak 6,000 req/s, needs 21 servers\nNov 2026: peak 8,112 req/s, needs 30 servers\nDec 2026: peak 9,733 req/s, needs 33 servers: 3 short, order by Oct 2026\nJan 2027: peak 6,748 req/s, needs 24 servers\nFeb 2027: peak 7,017 req/s, needs 24 servers\nMar 2027: peak 7,297 req/s, needs 27 servers\nApr 2027: peak 7,588 req/s, needs 27 servers\nMay 2027: peak 7,891 req/s, needs 27 servers\nJun 2027: peak 8,206 req/s, needs 30 servers\nJul 2027: peak 8,534 req/s, needs 30 servers\nAug 2027: peak 8,875 req/s, needs 30 servers\nSep 2027: peak 9,230 req/s, needs 33 servers\nDecember's 33 servers are all needed again in Sep 2027: this year's seasonal peak is next year's normal\n","notes":[[1,"Service capacity comes from a load test: requests a second within the latency target, not a guess from CPU."],[10,"Surviving the loss of one zone in three means each zone carries half the peak: 50% more servers than the bare minimum."],[21,"Lead time: if capacity takes two months to arrive, December's shortfall must be ordered in October, which is now."],[30,"Growth puts seasonal capacity to work later: by next September, the normal peak needs December's fleet."]]}]},{"t":"Commit to the baseline, rent the peaks","tabs":[{"lang":"python","src":"ON_DEMAND, COMMITTED = 40, 24                          # cents per server-hour (illustrative); a commitment is paid every hour\n\ndef demand(hour):                                      # servers needed in each hour of a week, Monday 00:00 first\n    day, h = divmod(hour, 24)\n    if day >= 5:\n        return 12 if 8 <= h < 22 else 8                # the weekend\n    if 12 <= h < 14:\n        return 26                                      # the weekday lunchtime peak\n    return 22 if 9 <= h < 18 else 14 if 7 <= h < 22 else 8\n\nWEEK = [demand(h) for h in range(168)]\n\ndef weekly_cost(committed):\n    on_demand_hours = sum(max(0, d - committed) for d in WEEK)\n    return committed * len(WEEK) * COMMITTED + on_demand_hours * ON_DEMAND\n\ndef dollars(cents):\n    return f\"${cents // 100:,}.{cents % 100:02d}\"\n\naverage = (sum(WEEK) + len(WEEK) // 2) // len(WEEK)\nfor label, k in ((\"all on demand\", 0), (\"commit to the night-time floor\", min(WEEK)),\n                 (\"commit to the average\", average), (\"commit to the peak\", max(WEEK))):\n    print(f\"{label} ({k} servers): {dollars(weekly_cost(k))} a week\")\nbest = min(range(max(WEEK) + 1), key=weekly_cost)\nsaving = ((weekly_cost(0) - weekly_cost(best)) * 100 + weekly_cost(0) // 2) // weekly_cost(0)\nprint(f\"best: commit to {best} servers, {dollars(weekly_cost(best))} a week, {saving}% less than all on demand\")\nshare = lambda k: (sum(d >= k for d in WEEK) * 100 + 84) // 168    # % of hours that need at least k servers\nprint(f\"the rule: commit while a server is needed in more than {COMMITTED * 100 // ON_DEMAND}% of hours: \"\n      f\"server {best} is needed in {share(best)}%, server {best + 1} in {share(best + 1)}%\")\n","out":"all on demand (0 servers): $922.40 a week\ncommit to the night-time floor (8 servers): $707.36 a week\ncommit to the average (14 servers): $724.48 a week\ncommit to the peak (26 servers): $1,048.32 a week\nbest: commit to 12 servers, $703.84 a week, 24% less than all on demand\nthe rule: commit while a server is needed in more than 60% of hours: server 12 is needed in 61%, server 13 in 45%\n","notes":[[1,"Illustrative prices: a commitment is cheaper per hour, but it's paid every hour, used or not."],[15,"The committed servers cost the same every hour; anything above them is bought on demand."],[24,"Try every commitment level: the best is neither the night-time floor, nor the average, nor the peak."],[28,"Each extra committed server costs 24¢ every hour and saves 40¢ in each hour it's needed, so it pays off when it's needed in more than 60% of hours."]]},{"lang":"javascript","src":"const ON_DEMAND = 40, COMMITTED = 24;                  // cents per server-hour (illustrative); a commitment is paid every hour\n\nfunction demand(hour) {                                // servers needed in each hour of a week, Monday 00:00 first\n  const day = Math.floor(hour / 24), h = hour % 24;\n  if (day >= 5) return 8 <= h && h < 22 ? 12 : 8;      // the weekend\n  if (12 <= h && h < 14) return 26;                    // the weekday lunchtime peak\n  return 9 <= h && h < 18 ? 22 : 7 <= h && h < 22 ? 14 : 8;\n}\n\nconst WEEK = Array.from({ length: 168 }, (_, h) => demand(h));\n\nfunction weeklyCost(committed) {\n  const onDemandHours = WEEK.reduce((sum, d) => sum + Math.max(0, d - committed), 0);\n  return committed * WEEK.length * COMMITTED + onDemandHours * ON_DEMAND;\n}\n\nconst dollars = cents => `$${Math.floor(cents / 100).toLocaleString(\"en-US\")}.${String(cents % 100).padStart(2, \"0\")}`;\n\nconst total = WEEK.reduce((a, b) => a + b, 0);\nconst average = Math.floor((total + Math.floor(WEEK.length / 2)) / WEEK.length);\nfor (const [label, k] of [[\"all on demand\", 0], [\"commit to the night-time floor\", Math.min(...WEEK)],\n                          [\"commit to the average\", average], [\"commit to the peak\", Math.max(...WEEK)]]) {\n  console.log(`${label} (${k} servers): ${dollars(weeklyCost(k))} a week`);\n}\nlet best = 0;\nfor (let k = 1; k <= Math.max(...WEEK); k++) if (weeklyCost(k) < weeklyCost(best)) best = k;\nconst saving = Math.floor(((weeklyCost(0) - weeklyCost(best)) * 100 + Math.floor(weeklyCost(0) / 2)) / weeklyCost(0));\nconsole.log(`best: commit to ${best} servers, ${dollars(weeklyCost(best))} a week, ${saving}% less than all on demand`);\nconst share = k => Math.floor((WEEK.filter(d => d >= k).length * 100 + 84) / 168);   // % of hours that need at least k servers\nconsole.log(`the rule: commit while a server is needed in more than ${Math.floor(COMMITTED * 100 / ON_DEMAND)}% of hours: ` +\n            `server ${best} is needed in ${share(best)}%, server ${best + 1} in ${share(best + 1)}%`);\n","out":"all on demand (0 servers): $922.40 a week\ncommit to the night-time floor (8 servers): $707.36 a week\ncommit to the average (14 servers): $724.48 a week\ncommit to the peak (26 servers): $1,048.32 a week\nbest: commit to 12 servers, $703.84 a week, 24% less than all on demand\nthe rule: commit while a server is needed in more than 60% of hours: server 12 is needed in 61%, server 13 in 45%\n","notes":[[1,"Illustrative prices: a commitment is cheaper per hour, but it's paid every hour, used or not."],[14,"The committed servers cost the same every hour; anything above them is bought on demand."],[25,"Try every commitment level: the best is neither the night-time floor, nor the average, nor the peak."],[30,"Each extra committed server costs 24¢ every hour and saves 40¢ in each hour it's needed, so it pays off when it's needed in more than 60% of hours."]]}]}],"ex":{"q":"A test server takes 5 ms per request and freezes for 2 seconds once during a 60-second test, as a long garbage-collection pause or a failover would. Compare what two load testers report: a closed model with 10 virtual users who each wait for their reply and then think for 95 ms, and an open model that sends 100 requests a second on a fixed schedule.","steps":["Model the server as one first-come, first-served queue: each request starts when it arrives or when the server is free, whichever is later, and nothing runs during the freeze.","Closed model: each user sends a request, waits for the reply, thinks, and sends the next. During the freeze, each user has one request stuck and sends nothing else.","Open model: a request leaves every 10 ms whatever happened to the earlier ones, and each latency is measured from its scheduled send time. During the freeze, 200 requests pile up.","Compare the number of requests and the percentiles (nearest rank). The difference is coordinated omission: the closed model stops measuring exactly when the system is struggling."],"code":{"t":"The same freeze, measured two ways","tabs":[{"lang":"python","src":"SERVICE, FREEZE, RESUME, END = 5, 10_000, 12_000, 60_000   # ms: each request takes 5 ms; the server freezes for 2 s\n\ndef serve(arrival, free_at):                           # one server, first come first served; returns the finish time\n    start = max(arrival, free_at)\n    if FREEZE <= start < RESUME:\n        start = RESUME                                 # nothing runs during the freeze\n    finish = start + SERVICE\n    if start < FREEZE < finish:\n        finish += RESUME - FREEZE                      # caught mid-request\n    return finish\n\ndef open_model(every_ms):                              # requests leave on schedule, whatever the replies are doing\n    latencies, free_at = [], 0\n    for sent in range(0, END, every_ms):\n        free_at = serve(sent, free_at)\n        latencies.append(free_at - sent)               # measured from the moment it was meant to be sent\n    return latencies\n\ndef closed_model(users, think_ms):                     # each virtual user waits for its reply, thinks, then sends again\n    latencies, free_at = [], 0\n    next_send = [u * 10 for u in range(users)]         # staggered starts\n    while min(next_send) < END:\n        sent = min(next_send)                          # requests reach the server in the order they're sent\n        user = next_send.index(sent)\n        free_at = serve(sent, free_at)\n        latencies.append(free_at - sent)\n        next_send[user] = free_at + think_ms           # no new request from this user until the reply is back\n    return latencies\n\ndef pct(values, per_mille):                            # nearest-rank percentile\n    ordered = sorted(values)\n    return ordered[(len(ordered) * per_mille + 999) // 1000 - 1]\n\nfor label, lat in ((\"closed model, 10 users\", closed_model(10, 95)), (\"open model, 100 a second\", open_model(10))):\n    print(f\"{label}: {len(lat):,} requests, p50 {pct(lat, 500)} ms, p99 {pct(lat, 990):,} ms, \"\n          f\"p99.9 {pct(lat, 999):,} ms, {sum(l >= 1000 for l in lat)} took a second or more\")\n","out":"closed model, 10 users: 5,800 requests, p50 5 ms, p99 5 ms, p99.9 1,980 ms, 10 took a second or more\nopen model, 100 a second: 6,000 requests, p50 5 ms, p99 1,705 ms, p99.9 1,975 ms, 202 took a second or more\n"},{"lang":"javascript","src":"const SERVICE = 5, FREEZE = 10000, RESUME = 12000, END = 60000;   // ms: each request takes 5 ms; the server freezes for 2 s\n\nfunction serve(arrival, freeAt) {                      // one server, first come first served; returns the finish time\n  let start = Math.max(arrival, freeAt);\n  if (FREEZE <= start && start < RESUME) start = RESUME;   // nothing runs during the freeze\n  let finish = start + SERVICE;\n  if (start < FREEZE && FREEZE < finish) finish += RESUME - FREEZE;   // caught mid-request\n  return finish;\n}\n\nfunction openModel(everyMs) {                          // requests leave on schedule, whatever the replies are doing\n  const latencies = [];\n  let freeAt = 0;\n  for (let sent = 0; sent < END; sent += everyMs) {\n    freeAt = serve(sent, freeAt);\n    latencies.push(freeAt - sent);                     // measured from the moment it was meant to be sent\n  }\n  return latencies;\n}\n\nfunction closedModel(users, thinkMs) {                 // each virtual user waits for its reply, thinks, then sends again\n  const latencies = [];\n  let freeAt = 0;\n  const nextSend = Array.from({ length: users }, (_, u) => u * 10);   // staggered starts\n  while (Math.min(...nextSend) < END) {\n    const sent = Math.min(...nextSend);                // requests reach the server in the order they're sent\n    const user = nextSend.indexOf(sent);\n    freeAt = serve(sent, freeAt);\n    latencies.push(freeAt - sent);\n    nextSend[user] = freeAt + thinkMs;                 // no new request from this user until the reply is back\n  }\n  return latencies;\n}\n\nfunction pct(values, perMille) {                       // nearest-rank percentile\n  const ordered = [...values].sort((a, b) => a - b);\n  return ordered[Math.floor((ordered.length * perMille + 999) / 1000) - 1];\n}\n\nconst fmt = n => n.toLocaleString(\"en-US\");\nfor (const [label, lat] of [[\"closed model, 10 users\", closedModel(10, 95)], [\"open model, 100 a second\", openModel(10)]]) {\n  console.log(`${label}: ${fmt(lat.length)} requests, p50 ${pct(lat, 500)} ms, p99 ${fmt(pct(lat, 990))} ms, ` +\n              `p99.9 ${fmt(pct(lat, 999))} ms, ${lat.filter(l => l >= 1000).length} took a second or more`);\n}\n","out":"closed model, 10 users: 5,800 requests, p50 5 ms, p99 5 ms, p99.9 1,980 ms, 10 took a second or more\nopen model, 100 a second: 6,000 requests, p50 5 ms, p99 1,705 ms, p99.9 1,975 ms, 202 took a second or more\n"}]},"a":"The closed model reports a p99 of 5 ms: its ten users stopped sending during the freeze, so only 10 of its 5,800 requests saw it, and the test looks perfect. The open model keeps sending, as real users do: 200 requests arrived during the freeze and 202 took a second or more, so its p99 is 1,705 ms. Same server, same freeze. Use open-model (arrival-rate) load tests for latency targets, measure from the intended send time, and check your tool by pausing the system in the middle of a test."},"fade":{"q":"Finish `nodes_for(target)`: using the Universal Scalability Law fitted from load tests, return the fewest nodes whose throughput reaches the target, or None if the curve turns down before it gets there. β is always above zero, so the curve always has a peak.","steps":["Start at one node, and add nodes while the throughput is below the target.",{"ask":"Why does the throughput fall after the peak?","a":"The coherency term grows with N × (N − 1): every node has to keep in step with every other, so past the peak each new node adds more coordination than work."},{"ask":"The target is beyond the peak. What now?","a":"Change the system, not the node count: share less between nodes (partition the data so the coherency term falls), cut contention (fewer locks, shorter critical sections) or make each node faster. Then load-test again and refit the curve."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"MODEL = (1_000, 0.03, 0.0005)                          # fitted from load tests: one node's req/s, contention, coherency\n\ndef throughput(n, model=MODEL):                        # the Universal Scalability Law: requests a second with n nodes\n    gamma, alpha, beta = model\n    return gamma * n / (1 + alpha * (n - 1) + beta * n * (n - 1))\n\ndef nodes_for(target, model=MODEL):\n    n = 1\n    ...                                                # TODO: add nodes until the target is met; None once the curve turns down\n    return None\n"},{"lang":"javascript","src":"const MODEL = [1000, 0.03, 0.0005];                    // fitted from load tests: one node's req/s, contention, coherency\n\nfunction throughput(n, model = MODEL) {                // the Universal Scalability Law: requests a second with n nodes\n  const [gamma, alpha, beta] = model;\n  return gamma * n / (1 + alpha * (n - 1) + beta * n * (n - 1));\n}\n\nfunction nodesFor(target, model = MODEL) {\n  let n = 1;\n  // TODO: add nodes until the target is met; null once the curve turns down\n  return null;\n}\n"}]},"solution":{"t":"Solution: add nodes while the curve still rises","tabs":[{"lang":"python","src":"MODEL = (1_000, 0.03, 0.0005)                          # fitted from load tests: one node's req/s, contention, coherency\n\ndef throughput(n, model=MODEL):                        # the Universal Scalability Law: requests a second with n nodes\n    gamma, alpha, beta = model\n    return gamma * n / (1 + alpha * (n - 1) + beta * n * (n - 1))\n\ndef nodes_for(target, model=MODEL):\n    n = 1\n    while throughput(n, model) < target:\n        if throughput(n + 1, model) <= throughput(n, model):\n            return None                                # past the peak: another node adds more coordination than work\n        n += 1\n    return n\n\nprint(\"nodes → req/s: \" + \", \".join(f\"{n} → {int(throughput(n)):,}\" for n in (1, 2, 4, 8, 16, 32, 64)))\nbest = max(range(1, 201), key=throug
