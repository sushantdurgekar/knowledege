    ["How do you detect drift when you have no labelled production data?", "Use reference-free evaluators (groundedness, relevance, coherence, task adherence) on sampled traffic, compare to a baseline period, and rerun a fixed labelled dataset on a schedule."]
  ],
  teach: { prompt: "Explain to an operations engineer how to know whether a Foundry agent is healthy in production.", rubric: ["Metrics: errors, 429s, latency, tokens", "Tracing with OpenTelemetry into Application Insights (spans)", "Continuous evaluation on sampled traffic + scheduled evals for drift", "Safety signals (filter blocks)", "Index/ingestion health for retrieval", "Alerts on thresholds"], model: "Three layers. Metrics in Azure Monitor tell you errors, throttling, latency and tokens. Tracing (OpenTelemetry into Application Insights) shows each run's spans, so you can see whether the model, a tool or retrieval is slow. Continuous evaluation scores sampled traffic for groundedness, relevance and task adherence, and scheduled evaluations catch drift. Add safety signals and search index health, and put alerts on the key thresholds." },
  qa: [["Standard used for Foundry tracing?", "OpenTelemetry (GenAI semantic conventions)."], ["Where do traces go?", "Application Insights connected to the project."], ["Evaluating sampled live traffic is called…", "Continuous evaluation."], ["Detecting drift on a fixed dataset?", "Scheduled evaluations."], ["Index health signals?", "Indexer execution history, failed docs, document count, skill warnings."], ["Env setting for prompt capture?", "`AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED`."]],

    { t: "yn", q: "Evaluate each statement.", s: [["Continuous evaluation scores every production request by default.", false], ["Application Insights stores Foundry agent traces when connected to the project.", true], ["A drop in groundedness can be caused by indexer failures.", true]], e: "Continuous evaluation samples traffic. Traces go to App Insights. Missing documents reduce grounding.", tp: "Monitoring" },

{
  id: "p08", d: "d1", t: "CI/CD and infrastructure for Foundry projects", min: 60,
  hook: "\"Integrate Foundry projects with CI/CD pipelines\" and \"Design Azure infrastructure\" are newer skills. Expect questions on infrastructure as code, keyless pipeline sign-in (OIDC) and evaluation gates before an agent version is promoted.",
  pre: { q: "Why should a pipeline that deploys an agent use OIDC federated credentials rather than a stored client secret?", a: "No long-lived secret exists to leak or rotate. GitHub (or Azure DevOps) gets a short-lived token by federating with Microsoft Entra ID at run time." },
  story: [
    "Contoso's first agent was built by clicking in the portal. It worked, until someone changed its instructions on a Friday and nobody could say what changed or roll it back. Their second agent was treated like software.",
    "Everything lives in Git: **infrastructure as code** (Bicep or Terraform, or an `azd` template) for the Foundry resource, projects, model deployments, connections and role assignments; the **agent definition** (model, instructions, tools) as YAML or code; and **evaluation datasets**.",
    "On every pull request, GitHub Actions signs in to Azure with **OIDC** (no secrets), deploys to a dev project, creates a new **agent version** and runs evaluations with the `microsoft/ai-agent-evals` action, comparing against the current production version. If quality or safety scores drop, the build fails. Merging to main deploys to test, and production waits for an approval in a protected GitHub environment.",
    "Agent versions are **immutable**: a change creates a new version, and publishing an update routes traffic to it while the endpoint URL stays the same. Rolling back means pointing back to the previous version."
  ],
  breaks: "Normal software tests are deterministic. Evaluations of LLM output are statistical: you compare score distributions and confidence intervals against a baseline, not exact strings.",
  dia: [
    { type: "flow", cap: "A Foundry agent pipeline", steps: [["Pull request", "IaC + agent YAML + prompts + datasets"], ["Sign in", "OIDC → Entra ID (no secret)"], ["Deploy to dev", "Bicep/azd; create agent version"], ["Evaluate", "ai-agent-evals vs baseline"], ["Gate", "fail on quality/safety regression"], ["Promote", "test → prod (approval)"]], loop: "Rollback = re-point to the previous agent version" },
    { type: "layers", cap: "What goes in the repository", rows: [["infra/", "Bicep or Terraform: Foundry resource, projects, deployments, connections, RBAC, App Insights"], ["agents/", "agent definitions (YAML), instructions, tool configs"], ["evals/", "datasets (JSONL), evaluator config, thresholds"], ["src/", "app code, hosted-agent containers"], [".github/workflows/", "pipelines with OIDC login and gates"]] }
  ],
  keys: [
    "Use **infrastructure as code** (Bicep, Terraform or an **azd** template with `azure.yaml`) for resources, projects, deployments, connections and role assignments, parameterised per environment.",
    "Use separate projects (or resources) per environment (dev, test, prod) and promote the same definitions through them.",
    "Pipelines sign in keylessly with **OIDC federated credentials**: `azure/login@v3` plus `permissions: id-token: write` in GitHub Actions.",
    "Give the pipeline identity least privilege: Foundry User to create agent versions; Foundry Project Manager if it publishes agents.",
    "Treat agent definitions and prompts as code; create a new **agent version** per change (versions are immutable).",
    "**Evaluation gate**: the GitHub Action `microsoft/ai-agent-evals` (an Azure DevOps extension also exists) runs evaluators over a dataset for one or more agent versions and reports scores with confidence intervals against a baseline in the job summary.",
    "Protect production with environment approvals (required reviewers) and keep a fast rollback path to the previous version.",
    "Hosted agents: build the container, push to Azure Container Registry, deploy with `azd` or the SDK; each deployment creates an immutable version.",
    "Keep secrets out of pipelines: Key Vault references and managed identities at runtime."
  ],
  cmp: [{ cap: "Pipeline sign-in options", head: ["Option", "Secret stored?", "Verdict"], rows: [["OIDC federated credential (workload identity federation)", "No", "Recommended"], ["Service principal with client secret", "Yes", "Works; rotate and protect"], ["Personal account credentials", "Yes", "Never for automation"]] }],
  code: [{ t: "GitHub Actions: keyless login and an evaluation gate", lang: "yaml", src: `permissions:
  id-token: write          # allow OIDC token request
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: \${{ vars.AZURE_CLIENT_ID }}
          tenant-id: \${{ vars.AZURE_TENANT_ID }}
          subscription-id: \${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: \${{ vars.PROJECT_ENDPOINT }}
          deployment-name: \${{ vars.JUDGE_DEPLOYMENT }}
          agent-ids: "support-agent:7,support-agent:8"
          data-path: evals/support-dataset.json`, notes: [[2, "Required for the job to request an OIDC token."], [10, "`azure/login` exchanges the GitHub token for an Entra token: no client secret."], [12, "IDs are configuration, not secrets."], [16, "The evaluation action runs evaluators and compares agent versions."], [19, "Compare the current version (7) with the candidate (8)."]] }],
  portal: [{ t: "Create the federated credential for GitHub", path: "Microsoft Entra admin center > App registrations (or managed identity) > Federated credentials > Add", steps: ["Scenario: GitHub Actions deploying Azure resources.", "Enter organisation, repository and entity (branch, environment or pull request).", "Grant the identity roles on the target resource group/project (least privilege)."] }],
  ex: { q: "A team wants every change to their agent's instructions to be reviewed, evaluated and reversible.", steps: ["Store instructions and agent definition in Git → review via pull requests.", "Pipeline creates a new agent version in dev and runs `ai-agent-evals` against the production version.", "Block the merge if scores regress; promote with approval; roll back by re-pointing to the previous version."], a: "**Agents-as-code in Git + OIDC pipeline + evaluation gate + protected environments + immutable versions** for rollback." },
  fade: { q: "Your GitHub workflow fails at `azure/login` with an error about requesting an ID token.", steps: ["The workflow uses OIDC, not a client secret.", { ask: "What's missing in the workflow?", a: "`permissions: id-token: write` (at workflow or job level)." }, { ask: "What must exist in Entra ID?", a: "A **federated credential** on the app registration/managed identity matching the repo and branch/environment." }] },
  traps: [
    ["Storing a client secret in GitHub secrets when OIDC is available.", "The exam prefers keyless federation."],
    ["Editing production agents directly in the portal.", "Changes should flow through version control, evaluation and approval."],
    ["Comparing LLM outputs with exact-match assertions only.", "Use evaluators and statistical comparison against a baseline."],
    ["Giving the pipeline Owner on the subscription.", "Scope roles to the resource group/project with the minimum needed."]
  ],
  disc: [
    ["What should an evaluation gate check before promoting an agent?", "Quality (task adherence, intent resolution, groundedness, relevance), safety (content safety, indirect attack resistance), and tool-call accuracy, compared with the current version. Fail on statistically significant regressions, not small noise."],
    ["Why use azd for hosted agents?", "It bundles infrastructure (Bicep), container build and deployment in one repeatable command (`azd up`), driven by `azure.yaml`, which suits CI/CD."]
  ],
  teach: { prompt: "Explain how you'd set up CI/CD for a Foundry agent so changes are safe and reversible.", rubric: ["IaC for resources/projects/deployments/RBAC", "Agent definitions and prompts in Git", "OIDC keyless pipeline sign-in", "Evaluation gate vs baseline (ai-agent-evals)", "Environments with approvals; immutable versions for rollback"], model: "Keep infrastructure (Bicep or azd), agent definitions and evaluation datasets in Git. The pipeline signs in with OIDC, deploys to a dev project, creates a new agent version and runs the ai-agent-evals action against the current version. Regressions fail the build. Promotion to test and production goes through protected environments with approvals, and because versions are immutable, rollback is re-pointing to the previous version." },
  qa: [["Workflow permission for OIDC?", "`id-token: write`."], ["GitHub login action?", "`azure/login@v3`."], ["Agent evaluation action?", "`microsoft/ai-agent-evals`."], ["Are agent versions mutable?", "No: every change creates a new version."], ["Tool for IaC + deploy of hosted agents?", "Azure Developer CLI (azd) with `azure.yaml` and Bicep."], ["Where to gate production?", "Protected environment with required reviewers."]],
  quiz: [
    { q: "A pipeline must deploy Foundry resources without storing any secret in GitHub. What should you configure?", o: ["A service principal client secret in GitHub secrets", "OIDC workload identity federation with azure/login", "A personal access token", "Storage account keys"], a: 1, e: "OIDC federation gives short-lived tokens with no stored secret.", tp: "Pipeline auth" },
    { t: "ord", q: "Order the stages of a safe agent release.", items: ["Open a pull request with the changed agent definition", "Deploy to a dev project and create a new agent version", "Run the evaluation action against the production version", "Promote to production after approval"], e: "Change → build → evaluate → approve and promote.", tp: "Pipeline" },
    { t: "yn", q: "Evaluate each statement.", s: [["Agent versions can be edited in place after creation.", false], ["`permissions: id-token: write` is needed for OIDC login in GitHub Actions.", true], ["Evaluation results should be compared against a baseline version.", true]], e: "Versions are immutable; OIDC needs the id-token permission; gates compare to a baseline.", tp: "CI/CD" },
    { q: "Which tool deploys a hosted agent's container and infrastructure from a single template?", o: ["Azure Developer CLI (azd)", "Power Automate", "Azure Data Factory", "Microsoft Purview"], a: 0, e: "azd uses azure.yaml and Bicep to provision and deploy in one step.", tp: "Hosted agents" },
    { t: "drop", q: "Complete the GitHub workflow.", code: `permissions:
  id-token: {{0}}
...
      - uses: {{1}}
        with:
          client-id: \${{ vars.AZURE_CLIENT_ID }}`, blanks: [{ o: ["write", "read", "none"], a: 0 }, { o: ["azure/login@v3", "actions/cache@v4", "azure/cli-secret@v1"], a: 0 }], e: "OIDC needs `id-token: write`, and `azure/login@v2` performs the federated sign-in.", tp: "Pipeline auth" },
    { q: "An evaluation gate shows the new agent version's task adherence fell from 4.4 to 3.6 with non-overlapping confidence intervals. What should the pipeline do?", o: ["Promote anyway; LLM scores are noisy", "Fail the gate and keep the current version", "Delete the evaluation dataset", "Increase temperature and retry"], a: 1, e: "A significant regression should block promotion.", tp: "Evaluation gate" }
  ],
  src: [["Learning path: Develop AI agents on Azure", "https://learn.microsoft.com/en-us/training/paths/develop-ai-agents-azure/"], ["Azure Developer CLI overview", "https://learn.microsoft.com/en-us/azure/developer/azure-developer-cli/overview"], ["Use GitHub Actions to connect to Azure (OIDC)", "https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect"]]
}
);

{
  id: "g01", d: "d2", t: "Connect an app: SDKs, endpoints and the Responses API", min: 70,
  hook: "Code questions start here: which client, which endpoint, which method, which property holds the answer. Get `responses.create`, `previous_response_id` and `output_text` into muscle memory.",
  pre: { q: "Two calls to `client.responses.create(...)`. The second should remember the first. What do you pass?", a: "`previous_response_id=first.id`. The Responses API stores state on the service, so you don't resend the whole history (unless you set `store=False`)." },
  story: [
    "Imagine ordering at a café. With the **Chat Completions** counter, the barista has no memory: each time you must repeat your whole order history (\"earlier I asked for oat milk, then…\"). That's the `messages` list your app keeps and resends every turn.",
    "The **Responses** counter keeps a ticket for you. Each answer has an **id**; next time you say *same ticket, add a croissant* (`previous_response_id`) and the service brings back the context. It's newer, works with tools and reasoning models, and is Microsoft's recommended API in Foundry, including for non-OpenAI models such as Phi or DeepSeek through the OpenAI-compatible v1 endpoint.",
    "To get to the counter you need an address and an ID card. The **project endpoint** (`…services.ai.azure.com/api/projects/<project>`) is for the **Foundry SDK** (`azure-ai-projects`): its `AIProjectClient` manages agents, connections, datasets, indexes, evaluations and tracing, and can hand you an OpenAI-compatible client with `get_openai_client()`. The **OpenAI SDK** (`openai`) can also talk straight to the v1 endpoint (`…openai.azure.com/openai/v1`) for portable, simple inference.",
    "Wingtip's developer used both: the Foundry SDK in the backend for agents and evaluations, and the plain OpenAI client in a small summarisation function that might move clouds one day."
  ],
  breaks: "A café ticket lasts the day. Stored responses have retention limits, and with `store=False` (zero retention) there's no ticket at all, so you must send the conversation items yourself.",
  dia: [
    { type: "flow", cap: "From app to answer", steps: [["Config", "PROJECT_ENDPOINT, deployment name"], ["Credential", "DefaultAzureCredential (Entra ID)"], ["AIProjectClient", "agents, connections, evals, tracing"], ["get_openai_client()", "OpenAI-compatible client"], ["responses.create", "model=deployment, input=…"], ["Result", "output_text, id, usage, status"]] },
    { type: "seq", cap: "Multi-turn with the Responses API", actors: ["App", "Responses API"], msgs: [["App", "Responses API", "create(input=\"Plan a 3-day trip\")"], ["Responses API", "App", "resp1 (id=resp_1)", true], ["App", "Responses API", "create(input=\"Make it cheaper\", previous_response_id=resp_1)"], ["Responses API", "App", "resp2 uses stored context", true]] }
  ],
  keys: [
    "Install: `pip install azure-ai-projects azure-identity openai`.",
    "`AIProjectClient(endpoint=<project endpoint>, credential=DefaultAzureCredential())` for Foundry features; `project.get_openai_client()` for inference with the same identity.",
    "**Responses API** (recommended): `client.responses.create(model=<deployment>, input=..., instructions=..., temperature=..., max_output_tokens=..., previous_response_id=..., stream=True/False, store=True/False)`.",
    "Read results: `response.output_text` (all text), `response.output` (typed items: messages, tool calls, reasoning), `response.id`, `response.status` (`completed`, `incomplete`…), `response.usage` (input/output tokens).",
    "Multi-turn: chain with `previous_response_id`, or keep your own list and append `response.output` items. `responses.retrieve(id)` fetches a stored response.",

    "`AzureOpenAI(azure_endpoint, api_version, azure_ad_token_provider)` is used when you need a specific dated API version.",
    "Everything in the context window costs tokens: instructions, history, tool definitions, tool outputs and retrieved documents.",
    "Foundry SDK also covers **connections** (credentials/endpoints to other resources such as AI Search), datasets, indexes, evaluations and telemetry: the \"connectors\" that integrate generative workflows into apps."
  ],
  cmp: [{ cap: "Responses vs Chat Completions", head: ["", "Responses API", "Chat Completions"], rows: [["State", "Stored on the service (`previous_response_id`)", "Stateless; you resend `messages`"], ["Input", "`input` (string or items) + `instructions`", "`messages` with roles"], ["Answer text", "`response.output_text`", "`choices[0].message.content`"], ["Tools", "Built-in tools (code interpreter, web/file search, MCP) + functions", "Function calling"], ["Best for", "New apps, agents, reasoning models", "Legacy code, simple stateless calls"]] },
    { cap: "Which SDK?", head: ["Need", "Use"], rows: [["Agents, tool approval, evaluations, tracing, connections", "Foundry SDK (`azure-ai-projects`)"], ["Portable inference code", "OpenAI SDK on the v1 endpoint"], ["Language/Speech/Translator features", "Foundry Tools SDKs (resource endpoint)"]] }],
  code: [{ t: "A stateful conversation with streaming", lang: "python", src: `project = AIProjectClient(endpoint=os.environ["PROJECT_ENDPOINT"],
                          credential=DefaultAzureCredential())
client = project.get_openai_client()

first = client.responses.create(
    model="chat-prod",

stream = client.responses.create(

    previous_response_id=first.id,          # remember turn 1

    stream=True)
for event in stream:
    if event.type == "response.output_text.delta":

answer = r.choices[0].message.content
messages.append({"role": "assistant", "content": answer})      # app keeps history
messages.append({"role": "user", "content": "Make it cheaper."})
r2 = client.chat.completions.create(model="chat-prod", messages=messages)`, notes: [[4, "The answer lives in `choices[0].message.content`."], [5, "Stateless: you append the assistant turn yourself and resend everything."]] }],

  fade: { q: "You need the number of tokens a response used, to charge departments.", steps: ["The call is `r = client.responses.create(...)`.", { ask: "Which property holds token counts?", a: "`r.usage` (e.g. `r.usage.input_tokens`, `r.usage.output_tokens`)." }, { ask: "With Chat Completions, where is it?", a: "Also `r.usage` (`prompt_tokens`, `completion_tokens`)." }] },
  traps: [
    ["Reading `response.choices[0]...` from a Responses API call.", "That's Chat Completions. Responses uses `output_text` / `output`."],

  ],
  teach: { prompt: "Explain to a new developer how to call a Foundry model from Python for a two-turn conversation.", rubric: ["AIProjectClient with project endpoint + DefaultAzureCredential", "get_openai_client()", "responses.create with model=deployment name", "Read output_text", "Second turn uses previous_response_id"], model: "Create an `AIProjectClient` with the project endpoint and `DefaultAzureCredential`, then call `get_openai_client()`. Call `responses.create` with `model` set to your deployment name and read `output_text`. For the second turn, call it again with `previous_response_id` set to the first response's id, so the service supplies the earlier context." },
  qa: [["Recommended inference API in Foundry?", "The Responses API."], ["How to chain turns?", "`previous_response_id`."], ["Text of a response?", "`response.output_text`."], ["Chat Completions answer?", "`choices[0].message.content`."], ["Streaming text event type?", "`response.output_text.delta`."], ["Get an OpenAI client from a project?", "`project.get_openai_client()`."], ["Zero-retention flag?", "`store=False`."]],

{
  id: "g02", d: "d2", t: "Tune generation: prompts, parameters, reasoning and structured output", min: 75,
  hook: "\"Tune generation behavior\" is an explicit D2 skill and also feeds D4 (domain summarisation and extraction). Questions give you a symptom (inconsistent, rambling, wrong format) and ask which knob to turn.",
  pre: { q: "An extraction prompt sometimes returns valid JSON and sometimes prose. Is lowering temperature enough to guarantee JSON?", a: "No. Lower temperature makes output more consistent but guarantees nothing. **Structured outputs** with a JSON schema (`strict: true`) guarantee that the response matches the schema." },
  story: [
    "Prompting is **briefing a talented contractor** who has never met you. Vague briefs get vague work. A good **system message** says who they are, what outcome you want, the boundaries, the output format, and what to do when unsure (\"say you don't know\").",
    "Then come the techniques. **Few-shot** examples show the pattern you want. **Delimiters** (`---`, Markdown headings, XML-style tags) separate instructions from data so the model doesn't confuse a pasted email with your rules. **Chain-of-thought** (\"think step by step\") helps non-reasoning models with multi-step problems; reasoning models already think internally. Models also have **recency bias**: repeat the key instruction at the end of long prompts.",
    "**Parameters** are the contractor's style dials. **Temperature** controls randomness (about 0.2 for factual extraction, about 0.7 for creative writing); **top_p** limits sampling to the most likely tokens. Adjust one, not both. **max_output_tokens** caps length and cost.",
    "**Reasoning models** are a different kind of contractor: you set **reasoning effort** instead of temperature. Their hidden reasoning tokens count toward `max_output_tokens` and are billed as output, so a tight limit can end a response `incomplete` before any visible answer appears.",
    "For machine-readable results, Adventure Works stopped asking nicely for JSON and switched on **structured outputs**: a JSON schema with `strict: true`, so every response matches the schema exactly."
  ],
  breaks: "A contractor remembers last week's brief. A model only knows what's in the current context: instructions don't persist unless you send them (or the agent definition stores them).",
  dia: [
    { type: "layers", cap: "Anatomy of a strong system message", rows: [["Role & outcome", "\"You are a claims assistant that drafts replies for agents.\""], ["Boundaries", "what to refuse, what's out of scope, no legal advice"], ["Grounding rule", "\"Use only the provided policy text; cite section numbers.\""], ["Format", "template, length, JSON schema or Markdown"], ["When unsure", "\"If the answer isn't in the context, say so and suggest escalation.\""]] },
    { type: "tree", cap: "Symptom → knob", root: { q: "What's wrong with the output?", c: [["Inconsistent between runs", "Lower temperature (or top_p), add examples"], ["Wrong format", "Structured outputs (json_schema, strict)"], ["Too long / costly", "max_output_tokens + explicit length rule"], ["Ignores a key rule", "Move it to the system message + repeat at the end"], ["Weak multi-step logic", "Reasoning model (raise effort) or step-by-step prompting"], ["Makes up facts", "Ground with RAG + \"only use context\" + citations"]] } }
  ],
  keys: [
    "System message checklist: **role + outcome, boundaries, grounding rule, output format, what to do when unsure**.",
    "Techniques: persona, zero/one/few-shot examples, delimiters, output templates, step-by-step reasoning (for non-reasoning models), task decomposition, repeating key instructions at the end (recency bias).",
    "`temperature`: low (≈0–0.3) for factual, consistent output; higher (≈0.7+) for creativity. `top_p`: nucleus sampling. **Change one, not both.**",

    "parameters": {"type": "object",

  id: "g04", d: "d2", t: "Ground or tune? RAG, retrieval choices and fine-tuning", min: 80,
  hook: "*Prompt engineering vs RAG vs fine-tuning* is one of the most predictable question types. So is *which retrieval method* (keyword, vector, hybrid, semantic ranker) and *which index* (file search, Azure AI Search, Foundry IQ).",
  pre: { q: "Your HR assistant must answer from policies that change monthly. Would you fine-tune the model on the policies or use RAG?", a: "**RAG.** Fine-tuning bakes knowledge into weights (expensive to refresh, no citations). RAG retrieves the current policy text at question time and can cite it." },
  story: [
    "Three ways to make a model better at your job, like preparing a new hire. **Prompt engineering** is a good briefing: cheap and instant. **RAG** (retrieval-augmented generation) is giving them the **company handbook to look things up** during each conversation: answers stay current and can cite the page. **Fine-tuning** is **sending them on a training course**: it changes habits (style, format, tone, tool use) permanently, but it's slow, costly and doesn't teach facts that change next month.",
    "RAG has two halves. At **index time** you extract text from documents, split it into **chunks**, turn each chunk into an **embedding** (a vector of numbers capturing meaning) and store them in an index. At **query time** you embed the question with the **same model**, retrieve the best chunks, add them to the prompt and ask the model to answer *only from this context, with citations*.",
    "Retrieval style matters. **Keyword** search (BM25) nails exact terms such as product codes. **Vector** search finds meaning (\"laptop won't turn on\" ≈ \"device fails to boot\"). **Hybrid** runs both and merges them with Reciprocal Rank Fusion, which is usually the best default. The **semantic ranker** then re-scores the top results with a language model to push the most relevant to the top.",
    "Where to store it? **File search** gives one app or agent a quick vector store of uploaded files. **Azure AI Search** is the enterprise engine: indexers, skills, filters, security trimming and hybrid plus semantic ranking. **Foundry IQ** puts managed knowledge bases over Azure AI Search so many agents share curated knowledge with citations."
  ],
  breaks: "A new hire can tell when the handbook is wrong. A model will happily answer from a bad chunk. RAG quality is mostly retrieval quality: chunking, embeddings, hybrid search and freshness.",

    { type: "tree", cap: "Prompting, RAG or fine-tuning?", root: { q: "Is the problem missing or changing knowledge?", c: [["Yes", "RAG (add citations, keep the index fresh)"], ["No", { q: "Does the model ignore format, style or tone despite good prompts and examples?", c: [["Yes", "Fine-tune (SFT; DPO for preferences; RFT for reasoning)"], ["No", "Prompt engineering is enough (iterate, add examples)"]] }]] } }

{
  id: "g05", d: "d2", t: "Evaluate models and apps", min: 75,
  hook: "\"Evaluate models and apps, including detecting fabrications, relevance, quality, and safety\" plus \"apply responsible AI instrumentation, including evaluators\". You must know which evaluator measures what, and which need ground truth.",
  pre: { q: "You have no reference answers, only questions, retrieved context and the app's responses. Can you still measure whether answers are made up?", a: "Yes. **Groundedness** is an AI-assisted evaluator that checks whether the response is supported by the given context. It needs no ground-truth answer. Metrics like F1 or BLEU do need ground truth." },
  story: [
    "Evaluating an LLM app is like **grading essays in a big school**. Teachers can read a sample by hand (**manual evaluation**: playground side-by-side comparisons, structured 1–5 ratings, user studies). For thousands of essays you need **automated** graders.",
    "Some graders compare against an answer key: **F1** (word overlap), **BLEU** (n-gram precision, from translation), **ROUGE** (recall-oriented, from summarisation), **METEOR** (also credits synonyms and word stems) and **GLEU** (sentence-level BLEU). Others use a strong model as the judge, the **AI-assisted** evaluators: **groundedness** (is it supported by the context? This is how you catch fabrications), **relevance**, **coherence**, **fluency**, retrieval quality and response completeness.",
    "For agents there are dedicated evaluators: **intent resolution** (did it understand the request?), **task adherence** (did it follow instructions and constraints?), **tool call accuracy** (right tools, right arguments?) and **task completion**. For safety, **risk and safety evaluators** score hate/unfairness, sexual, violence, self-harm, protected material, indirect attacks, code vulnerabilities and ungrounded attributes, reported as a **defect rate**: the share of responses above the severity threshold.",
    "Adventure Works ran an evaluation on 300 real questions. Groundedness averaged 4.5, but filtering the low scores showed one cluster: questions about returns. The retrieval was pulling an outdated policy. That's **error analysis**: slice the low scores, find the pattern, fix the cause (here the index, not the prompt), then re-evaluate."
  ],
  breaks: "An exam grader is consistent. LLM judges can be biased (favouring longer answers, their own style, or answer position), so calibrate them against human labels and use a different, strong model as the judge.",

  keys: [
    "Manual evaluation (playground side-by-side, 1–5 ratings for relevance, accuracy, safety…) comes first; automated evaluation scales it.",

    "Agent evaluators: **intent resolution, task adherence, tool call accuracy, task completion**.",

  teach: { prompt: "Explain to a project manager how you'd evaluate a RAG chatbot before launch.", rubric: ["Build a representative dataset (real or synthetic)", "Groundedness for fabrications + relevance/completeness", "Retrieval quality", "Safety evaluators / red teaming → defect rate", "Error analysis on low scores, fix, re-run"], model: "Collect a few hundred realistic questions (or generate synthetic ones). Run the bot and score groundedness to catch made-up answers, relevance and completeness for usefulness, retrieval quality for the search step, and safety evaluators plus red-teaming for harmful output. Then slice the low scores to find patterns, fix the cause (prompt, retrieval, model), and re-run until we meet our thresholds." },

{
  id: "g06", d: "d2", t: "Reflection loops, multi-model flows and hybrid rules", min: 60,
  hook: "Two D2 skills sound academic but appear as practical scenarios: *model reflection, chain-of-thought evaluations and self-critique loops*, and *orchestrating multiple models, flows, or hybrid LLM and rules engines*.",
  pre: { q: "A model drafts loan explanations. Would asking it to check its own draft against the policy, then revise, always improve quality? What's the catch?", a: "Often it helps, mostly on the first revision. The catch is **cost and latency** (each cycle is another call) and diminishing returns. Cap the loop (1–3 cycles) and stop when a check passes." },
  story: [
    "Good writers **draft, critique, revise**. A **reflection loop** does the same: generate an answer, ask a model (the same or a different one) to critique it against explicit criteria (\"Is every number supported by the source? Is anything missing?\"), then revise. Stop when the critique passes or after a fixed number of cycles, because the first revision gives most of the gain.",
    "A **chain-of-thought evaluation** grades the *reasoning*, not just the final answer: did the steps follow the rules, use the right figures, avoid leaps? Reasoning models can return a reasoning summary you can log and evaluate; for others you can ask for a structured rationale.",
    "Multi-model flows split work by strength and cost. A **cascade** sends a request to a small model first and escalates to a larger or reasoning model only when confidence is low or a validator fails. A **specialist pipeline** uses an extraction model, then a reasoning model, then a writer. The **model router** automates per-prompt model choice.",
    "Some decisions shouldn't be left to a model at all. Litware's claims flow uses a **hybrid**: the LLM extracts facts from the claim letter into JSON, a deterministic **rules engine** (or plain code, or a workflow condition in Power Fx) checks policy limits, and the LLM writes the customer-facing explanation. Rules are cheap, auditable and exact; the LLM handles language."
  ],
  breaks: "Human writers notice when they're going in circles. A model critiquing itself can confidently approve its own mistake. Use explicit checklists, external validators (code, schemas, rules) or a different model as the critic.",
  dia: [
    { type: "flow", cap: "Bounded reflection loop", steps: [["Generate", "draft answer"], ["Critique", "checklist: grounded? complete? policy?"], ["Pass?", "yes → return"], ["Revise", "fix listed issues"]], loop: "Max 1–3 cycles; stop early when the critique passes" },
    { type: "flow", cap: "Hybrid LLM + rules", steps: [["LLM extract", "claim letter → JSON fields"], ["Validate", "schema + required fields"], ["Rules engine", "limits, eligibility, thresholds (deterministic)"], ["LLM explain", "customer-friendly letter citing the rule"], ["Human review", "if rules flag an exception"]] }
  ],
  keys: [
    "**Reflection / self-critique**: generate → critique against explicit criteria → revise; cap the cycles (often 1–3) and stop when checks pass; most of the gain comes from the first revision; each cycle adds tokens and latency.",
    "Patterns: plan-then-act (structured plan first), act-then-reflect (critique after), and external validation (schema checks, unit tests for code, rules, a separate critic model).",
    "**Chain-of-thought evaluation**: assess the reasoning steps (correct rules, correct figures, no unsupported leaps) with an LLM judge or rubric; reasoning models can return reasoning summaries for logging.",
    "**Cascade** (small model first, escalate on low confidence or failed validation) cuts cost; **specialist pipelines** assign models by task; the **model router** picks per prompt automatically.",
    "**Hybrid LLM + rules**: use deterministic code/rules for calculations, eligibility, thresholds and compliance checks; use the LLM for understanding and generating language. Rules make decisions explainable and auditable.",
    "In Foundry workflows, If/Else conditions written in **Power Fx** can act as the rules layer between agent steps (e.g. route when `confidence > 0.6`).",
    "Validate model outputs with structured outputs + schema validation before rules consume them.",
    "Measure loops: compare quality scores with and without reflection, and track extra tokens and latency to justify them."
  ],
  cmp: [{ cap: "Pick the pattern", head: ["Scenario", "Pattern"], rows: [["High-volume tickets, a few hard ones", "Cascade: small model → escalate"], ["Report must be checked against a policy before sending", "Reflection loop with a policy checklist (max 2 cycles)"], ["Discount must never exceed 15%", "Rules engine enforces the limit; LLM writes the message"], ["Mixed easy/hard prompts, no custom logic", "Model router"], ["Code generation", "Generate → run tests (external validator) → fix"]] }],
  code: [{ t: "A bounded self-critique loop", lang: "python", src: `CHECKS = "List any claim not supported by SOURCE, any missing required section, any policy breach. Reply PASS if none."

draft = ask(f"Write the summary.\\nSOURCE:\\n{source}")
for cycle in range(2):                                  # hard cap
    critique = ask(f"{CHECKS}\\nSOURCE:\\n{source}\\nDRAFT:\\n{draft}", model="critic-model")
    if critique.strip().startswith("PASS"):
        break
    draft = ask(f"Revise the draft to fix these issues:\\n{critique}\\nSOURCE:\\n{source}\\nDRAFT:\\n{draft}")`, notes: [[1, "Explicit criteria make the critique useful and checkable."], [4, "Cap cycles: cost and latency grow with each one."], [5, "A different (often stronger) model as critic reduces self-approval bias."], [6, "Stop early when the critique passes."]] },
    { t: "Hybrid: the LLM extracts, code decides", lang: "python", src: `claim = client.responses.parse(model="mini", input=letter, text_format=Claim).output_parsed

if claim.amount > policy.max_payout or claim.days_since_incident > 30:   # deterministic rules
    decision = "refer_to_human"
else:
    decision = "approve"

letter = client.responses.create(model="chat-prod",
    input=f"Explain decision '{decision}' for this claim politely: {claim.model_dump_json()}").output_text`, notes: [[1, "Structured extraction gives typed fields for the rules."], [3, "Eligibility is code: exact, cheap, auditable."], [8, "The LLM only writes the explanation."]] }],
  ex: { q: "A code assistant's generated SQL is sometimes invalid. Adding \"double-check your SQL\" to the prompt didn't help.", steps: ["Self-checking by the same model is weak for syntax.", "An external validator is exact: run the query in a sandbox or parse it.", "Feed the error message back for one or two repair cycles."], a: "Use an **external validator loop**: execute or parse the SQL, return errors to the model for repair, cap at 2 cycles, then escalate." },
  fade: { q: "A support flow uses GPT-4.1 for every ticket; 80% are simple FAQs.", steps: ["Cost is driven by the large model on easy tickets.", { ask: "Which pattern reduces cost while keeping quality on hard tickets?", a: "A **cascade**: a small model first, escalating to the large model when confidence is low or validation fails (or the model router)." }, { ask: "How do you prove quality held?", a: "Evaluate both setups on the same dataset (relevance, groundedness, resolution) and compare cost per ticket." }] },
  traps: [
    ["Letting a reflection loop run until the model is satisfied.", "Always cap cycles; set a stopping test."],
    ["Using an LLM to enforce numeric limits.", "Deterministic rules or code enforce limits exactly."],
    ["Assuming self-critique by the same model catches its own errors reliably.", "Use explicit checklists, external validators or a different critic model."],
    ["Escalating every request to the biggest model \"to be safe\".", "Cascades and routers keep quality on hard cases at a fraction of the cost."]
  ],
  disc: [
    ["When is a reflection loop not worth it?", "Latency-sensitive chat, simple tasks, or when an exact validator (schema, tests, rules) can check the output more cheaply than another model call."],
    ["Why are hybrid LLM + rules designs popular in regulated industries?", "Rules give deterministic, explainable, auditable decisions, while the LLM handles messy language. Regulators can inspect the rules; the LLM never decides eligibility on its own."]
  ],
  teach: { prompt: "Explain a self-critique loop and a hybrid LLM + rules design, and when you'd use each.", rubric: ["Generate → critique against criteria → revise", "Cap cycles; stop on pass; cost/latency trade-off", "External validators or different critic model", "Hybrid: LLM for language, rules/code for decisions", "Use rules for compliance/limits; reflection for quality of text"], model: "A self-critique loop drafts an answer, checks it against explicit criteria (often with a different model or an external validator) and revises, usually for at most one to three cycles because gains shrink and cost grows. A hybrid design lets the LLM extract and explain while deterministic rules or code make the actual decisions, which is exact and auditable. Use reflection to improve text quality; use rules wherever limits, eligibility or compliance must be guaranteed." },
  qa: [["Reflection loop steps?", "Generate → critique → revise (capped)."], ["Where's most of the gain?", "The first revision cycle."], ["Cascade pattern?", "Small model first; escalate on low confidence/failed checks."], ["Who enforces a 15% discount cap?", "Rules/code, not the LLM."], ["Power Fx in Foundry workflows?", "Expressions for conditions/variables (e.g. If/Else on confidence)."], ["Chain-of-thought evaluation checks…", "The reasoning steps, not just the final answer."]],
  quiz: [
    { q: "A pricing assistant must never offer more than a 15% discount. What's the MOST reliable design?", o: ["State the rule in the system message", "Ask the model to double-check the discount", "Enforce the limit in code/rules after the model proposes a discount", "Use a reasoning model with high effort"], a: 2, e: "Deterministic rules enforce hard limits; prompts and self-checks can fail.", tp: "Hybrid rules" },

{
  id: "a01", d: "d2", t: "Agent anatomy in Foundry Agent Service", min: 70,
  hook: "Agents are the centre of AI-103 (D2 is 30–35%). Start with the anatomy: what an agent is made of, the three agent types, how to build one in the portal or VS Code, and what changes when you publish it.",
  pre: { q: "What's the difference between a chat app that calls a model and an agent?", a: "An agent combines a model with **instructions and tools** and can **decide to take actions** (search, run code, call APIs) in a loop to reach a goal, with conversation state managed for it. A plain chat call just generates text from its input." },
  story: [
    "Think of an agent as a **new team member**. The **model** is their brain. The **instructions** are their job description: role, goal, boundaries, tone, when to escalate. The **tools** are the systems they're allowed to use: file search over the policy library, code interpreter for spreadsheets, an API to create tickets. **Conversations** are their notebook for each customer, so they remember what was said.",
    "**Foundry Agent Service** is the HR department and the office building in one: it hosts the agent, runs the model, executes built-in tools automatically, stores conversation state, applies guardrails and records traces. You don't manage servers. A working agent takes a few dozen lines of code, or none in the portal.",
    "There are three kinds of team member. **Prompt agents** are declarative (model + instructions + tools) and the most common. **Workflow agents** coordinate several agents and steps in a defined flow. **Hosted agents** run your own containerised code (Agent Framework, LangGraph and others) with Foundry providing identity, endpoints and scaling.",
    "Contoso's IT helpdesk agent was built in the portal first (quick to try), then exported to YAML and code in VS Code with the **Foundry Toolkit** extension so it could live in Git. When it was ready, they **published** it. In the original (now legacy) model that created an **agent application** with a stable endpoint and gave the agent its own identity. Since July 2026 a new agent already has its own Entra agent identity and a stable endpoint when it's created, and *publishing* means distributing it to Teams and Microsoft 365."
  ],
  breaks: "A team member brings judgment and accountability. An agent follows instructions probabilistically and can be manipulated through its inputs, so its tools, identity and approvals must limit what it can do (see the governance module).",

    { type: "layers", cap: "Three agent types", rows: [["Prompt agent", "declarative: model + instructions + tools; no hosting; most common"], ["Workflow agent", "orchestrates agents and logic as a defined flow (visual or YAML)"], ["Hosted agent", "your container (Agent Framework, LangGraph, custom); Foundry provides identity, endpoints, scaling"]] }

{
  id: "a02", d: "d2", t: "Build agents in code (Agent Service SDK)", min: 80,
  hook: "Expect drop-down questions on this exact code: `create_version`, `PromptAgentDefinition`, `conversations.create`, `responses.create` with `agent_reference`, and the function-call loop. Learn the two clients and which one does what.",
  pre: { q: "In the new Agent Service SDK, do you run an agent with the project client or with the OpenAI client?", a: "**Both have roles.** `AIProjectClient` (admin plane) creates and manages agent versions. The **OpenAI client** from `get_openai_client()` (runtime plane) creates conversations and responses that reference the agent by name." },
  story: [
    "The SDK has two desks. The **admin desk** (`AIProjectClient`) is where you register an agent: `agents.create_version(agent_name=..., definition=PromptAgentDefinition(model, instructions, tools))`. Each call creates a new immutable **version** of a named agent. You usually do this at deployment time, not per user request.",
    "The **service desk** (`project.get_openai_client()`) handles conversations. You create a **conversation**, add the user's message as an **item**, and ask for a **response** that references the agent: `extra_body={\"agent_reference\": {\"name\": ..., \"type\": \"agent_reference\"}}`. The service runs the loop: the model may call built-in tools (file search, code interpreter) automatically.",
    "Your own **function tools** are different: the response contains `function_call` items, your code runs the function, and you send back `function_call_output` items with the matching `call_id`. Then you request another response. The model never runs your code.",
    "If you've seen older samples with **threads, messages and runs** (`AgentsClient`, `runs.create_and_process`), that's the classic v1 API. v2 maps thread → **conversation**, run → **response**, message → **item**, and there's no run-status polling: errors raise exceptions."
  ],
  breaks: "The two desks share the same building (endpoint and credential), but calling responses on the admin client is an error. Keep the roles straight.",
  dia: [
    { type: "seq", cap: "One agent turn with a function tool", actors: ["Your code", "Project client", "OpenAI client", "Agent Service"], msgs: [["Your code", "Project client", "agents.create_version(PromptAgentDefinition)"], ["Your code", "OpenAI client", "conversations.create()"], ["Your code", "OpenAI client", "conversations.items.create(user message)"], ["OpenAI client", "Agent Service", "responses.create(agent_reference)"], ["Agent Service", "Your code", "output: function_call(call_id, args)", true], ["Your code", "OpenAI client", "responses.create(input=[function_call_output])"], ["Agent Service", "Your code", "final message", true]] }
  ],
  keys: [
    "Package `azure-ai-projects` (2.x) + `openai` + `azure-identity`. Classes: `AIProjectClient`, `PromptAgentDefinition`, `FunctionTool`, `MCPTool`, plus tool classes for file search, code interpreter, AI Search, OpenAPI and others.",
    "`project.agents.create_version(agent_name=\"x\", definition=PromptAgentDefinition(model=deployment, instructions=..., tools=[...]))` → agent with `name` and `version`. Also `agents.get(agent_name=...)`, `agents.delete_version(agent_name=..., agent_version=...)`.",
    "Runtime: `oc = project.get_openai_client()`; `conv = oc.conversations.create()`; `oc.conversations.items.create(conversation_id=conv.id, items=[{\"type\": \"message\", \"role\": \"user\", \"content\": q}])`.",

    "Built-in tools (file search, code interpreter, web search, AI Search) execute on the service; **function tools execute in your app**.",
    "Conversations give durable, service-side memory per user session; use one conversation per session and store its id.",
    "v1 → v2 mapping: assistant → agent (name + version), thread → conversation, message → item, run → response, `requires_action` → iterate output items, `last_error` → exceptions. Connected agents (v1) were removed in v2; use workflows or A2A.",
    "Clean up test agents (`delete_version`) and conversations to avoid clutter and stored data."

  cmp: [{ cap: "Which client does what?", head: ["Task", "Client", "Method"], rows: [["Create/update an agent", "AIProjectClient", "`agents.create_version`"], ["Start a session", "OpenAI client", "`conversations.create`"], ["Add the user's message", "OpenAI client", "`conversations.items.create`"], ["Run the agent", "OpenAI client", "`responses.create(... agent_reference ...)`"], ["Remove a version", "AIProjectClient", "`agents.delete_version`"]] }],
  code: [{ t: "A complete agent with a local function tool", lang: "python", src: `import json
from azure.identity import DefaultAzureCredential
from azure.ai.projects import AIProjectClient
from azure.ai.projects.models import PromptAgentDefinition, FunctionTool
from openai.types.responses.response_input_param import FunctionCallOutput

submit = FunctionTool(name="submit_claim", description="Submit an expense claim.",
    parameters={"type": "object", "properties": {"amount": {"type": "number"},
                "reason": {"type": "string"}}, "required": ["amount", "reason"],
                "additionalProperties": False}, strict=True)

with (DefaultAzureCredential() as cred,
      AIProjectClient(endpoint=endpoint, credential=cred) as project,
      project.get_openai_client() as oc):
    agent = project.agents.create_version(agent_name="expense-agent",
        definition=PromptAgentDefinition(model=deployment,
            instructions="Help staff submit expense claims. Confirm before submitting.",
            tools=[submit]))
    conv = oc.conversations.create()
    oc.conversations.items.create(conversation_id=conv.id,
        items=[{"type": "message", "role": "user", "content": "Claim 42.50 for a taxi"}])
    ref = {"agent_reference": {"name": agent.name, "type": "agent_reference"}}
    r = oc.responses.create(conversation=conv.id, extra_body=ref, input=[])
    outs = [FunctionCallOutput(type="function_call_output", call_id=i.call_id,
                               output=submit_claim(**json.loads(i.arguments)))
            for i in r.output if i.type == "function_call"]
    if outs:
        r = oc.responses.create(conversation=conv.id, extra_body=ref, input=outs)
    print(r.output_text)`, notes: [[7, "A strict JSON schema keeps arguments well formed."], [15, "Admin plane: create (or version) the agent once."], [19, "Runtime plane: a conversation per user session."], [22, "The agent is referenced by name through `extra_body`."], [23, "`input=[]`: the user message is already in the conversation."], [24, "Your code executes the function for each `function_call` item."], [28, "Send the outputs back; the agent writes the final reply."]] }],

  ex: { q: "A developer creates a new agent version on every user request, and the project soon contains thousands of versions.", steps: ["`create_version` is an admin operation that registers a definition.", "Runtime requests should reference an existing agent by name.", "Create versions at deployment time; use `agent_reference` per request."], a: "Create the agent (version) once during deployment and, for each request, use `conversations` and `responses.create` with `agent_reference` to that agent's name." },

    ["How should an app store conversation state for many users?", "One conversation per user session, keeping the conversation id in the app's session store; the service keeps the items. For long-term personalisation, add a memory store."]

  teach: { prompt: "Describe, step by step, how your Python code runs one turn of a Foundry agent that has a custom function.", rubric: ["create_version with PromptAgentDefinition (once)", "conversations.create + items.create (user message)", "responses.create with agent_reference", "Run function_call items locally → FunctionCallOutput with call_id", "Second responses.create → output_text"], model: "Once, at deployment, the project client creates an agent version with a PromptAgentDefinition (model, instructions, tools). Per turn, the OpenAI client adds the user's message to a conversation and calls `responses.create` with an `agent_reference` to the agent. If the output contains `function_call` items, my code runs each function and sends `function_call_output` items with matching call ids in a second `responses.create`. Then I read `output_text`." },
  qa: [["Create an agent version?", "`project.agents.create_version(...)`."], ["Definition class for prompt agents?", "`PromptAgentDefinition`."], ["How is the agent referenced at runtime?", "`extra_body={\"agent_reference\": {\"name\": ..., \"type\": \"agent_reference\"}}`."], ["v1 thread is now…", "A conversation."], ["v1 run is now…", "A response."], ["Who runs FunctionTool code?", "Your app."]],

  hook: "\"Integrate agent tools, including APIs, knowledge stores, search, content understanding, and custom functions\" and \"choose memory, tool, and knowledge integration services\". Questions describe a need and ask for the tool type and its authentication.",
  pre: { q: "You have a REST API described by an OpenAPI 3.0 spec. What's the quickest way to let an agent call it without writing function code?", a: "Add an **OpenAPI tool** with the spec (anonymous, API-key connection or managed-identity auth). The service calls the API directly; no function loop in your app." },
  story: [
    "An agent's tools are its **toolbox**, and Foundry's catalog sorts them into two drawers.",
    "**Knowledge tools** fetch information: **file search** (your uploaded files in a vector store), **web search / Grounding with Bing** (live public web, with citations), **Azure AI Search** (an existing enterprise index), **SharePoint** (documents with the user's permissions), **Fabric data agent** (questions over Fabric data), and **Foundry IQ** knowledge bases.",
    "**Action tools** do things: **code interpreter** (sandboxed Python), **function calling** (your code), **OpenAPI** (call a REST API from its spec), **Azure Functions** (serverless code, e.g. queue-triggered), **MCP** (any Model Context Protocol server), **A2A** (another agent), **browser automation** and **computer use** (operate web pages or desktops), and **image generation**. Logic Apps workflows can be exposed as tools too, which is handy for low-code connectors to Outlook, SAP or ServiceNow.",
    "Northwind's operations agent needed Content Understanding to read delivery notes. They wrapped the analyzer call in a small function (it could also be an OpenAPI or MCP tool) so the agent could pass a document URL and get clean fields back. The **Toolbox** feature let them bundle a set of approved tools behind one versioned MCP endpoint that several agents reuse."
  ],
  breaks: "A real toolbox doesn't slow you down when it's full. Every extra tool definition adds tokens and decision complexity, which makes agents slower and more error-prone. Give each agent only what it needs.",
  dia: [
    { type: "hub", cap: "Agent tool catalog", core: "Agent tools", spokes: [["File search", "uploaded docs in a vector store"], ["Web / Bing grounding", "live public info, citations"], ["Azure AI Search", "existing enterprise index"], ["SharePoint / Fabric", "M365 docs (user perms) / Fabric data"], ["Foundry IQ", "managed knowledge bases (MCP)"], ["Code interpreter", "sandboxed Python"], ["Function calling", "your code, run by your app"], ["OpenAPI", "REST API from a 3.0/3.1 spec"], ["Azure Functions / Logic Apps", "serverless code / low-code workflows"], ["MCP / A2A", "remote tool servers / other agents"], ["Browser automation, computer use, image generation", "act on UIs, create images"]] },
    { type: "tree", cap: "Pick a tool type", root: { q: "Does the agent need information or an action?", c: [["Information", { q: "Where does it live?", c: [["Uploaded files", "File search"], ["Existing search index", "Azure AI Search tool"], ["Many sources, shared by agents", "Foundry IQ"], ["Public web, current", "Web search / Bing grounding"], ["SharePoint", "SharePoint tool"]] }], ["Action", { q: "How is the action exposed?", c: [["REST API with OpenAPI spec", "OpenAPI tool"], ["MCP server", "MCP tool"], ["Your own Python logic", "Function tool"], ["Another agent", "A2A"], ["Only a UI, no API", "Browser automation / computer use"]] }]] } }

  keys: [
    "**Knowledge** tools: file search, web search/Grounding with Bing, Azure AI Search, SharePoint, Fabric data agent, Foundry IQ. **Action** tools: code interpreter, function calling, OpenAPI, Azure Functions, MCP, A2A, browser automation, computer use, image generation.",
    "**OpenAPI tool**: provide an OpenAPI 3.0/3.1 spec; auth **anonymous**, **API key** (stored in a project connection) or **managed identity**; the service calls the API (no app-side loop).",
    "**Function calling**: the model returns arguments and your app executes, which is best when logic must run in your environment.",

    "Web grounding returns citations; show them to users. File search suits documents provided for that agent; Azure AI Search suits existing enterprise indexes with filters and security.",
    "Content Understanding can be integrated as a tool (function, OpenAPI or MCP wrapper) to give agents structured data from documents, images, audio or video.",

    "Some tools are generally available and some are in preview (e.g. browser automation, computer use, image generation, SharePoint, Fabric, A2A at the time of writing); check status before relying on them in production.",

  ],
  cmp: [{ cap: "OpenAPI vs function vs MCP", head: ["", "OpenAPI tool", "Function tool", "MCP tool"], rows: [["Who executes?", "Agent Service calls the API", "Your app", "The MCP server (via the service)"], ["Definition", "OpenAPI spec", "JSON schema in code", "Discovered from the server"], ["Auth", "Anonymous, API key connection, managed identity", "Whatever your code uses", "Key, Entra ID, OAuth (per user)"], ["Best for", "Existing REST APIs", "Logic inside your app", "Shared tools reused by many agents/apps"]] }],

from azure.ai.projects.models import (OpenApiTool, OpenApiFunctionDefinition,

agent = project.agents.create_version(agent_name="travel-agent",

  teach: { prompt: "Explain how you'd decide which tool type an agent needs for a given capability.", rubric: ["Separate knowledge tools from action tools", "Knowledge: file search vs AI Search vs Foundry IQ vs web", "Actions: OpenAPI (spec), function (own code), MCP (shared server), A2A (agent), computer use (no API)", "Auth: managed identity / connections, never keys in specs", "Keep the toolset minimal"], model: "First ask whether the agent needs information or an action. For information, choose by where it lives: uploaded files → file search, an existing index → Azure AI Search, shared curated knowledge → Foundry IQ, live public data → web search. For actions, choose by how the system is exposed: an OpenAPI spec → OpenAPI tool, my own code → function tool, a shared MCP server → MCP, another agent → A2A, only a UI → computer use. Use managed identity or connections for auth and give the agent only the tools it needs." },
  qa: [["REST API with a spec?", "OpenAPI tool."], ["OpenAPI tool auth options?", "Anonymous, API key (connection), managed identity."], ["Operate a UI with no API?", "Computer use / browser automation."], ["Existing enterprise index?", "Azure AI Search tool."], ["Bundle tools behind one MCP endpoint?", "Toolbox."], ["Live public info with citations?", "Web search / Grounding with Bing."]],

{
  id: "a04", d: "d2", t: "MCP tools and approval loops", min: 75,
  hook: "The Model Context Protocol appears in AI-103, AB-620 and AI-500. For AI-103 you need the architecture (host, client, server), local vs remote servers, the `MCPTool` settings and the approval loop in code.",
  pre: { q: "An agent uses a remote MCP tool with `require_approval=\"always\"`. What does your app receive before the tool runs?", a: "An output item of type `mcp_approval_request` (with the tool name and arguments). Your app replies with an `mcp_approval_response` (`approve: true/false`) referencing the request id; only then does the call happen." },
  story: [
    "Before USB, every device needed its own cable. **MCP** is the USB port for AI tools: one standard way for an AI application to discover and call tools, read resources and use prompt templates from any compatible server.",
    "Three roles. The **host** is the AI application (your app or Foundry Agent Service). Inside it, an MCP **client** keeps a connection to each **server**. The server exposes **tools** (actions), **resources** (data) and **prompts** (templates). The client can ask *what tools do you have?* (`list_tools`) at runtime, so when the server adds a tool, every agent using it gets it without a redeploy. That's **dynamic discovery**: integrate once, update centrally.",
    "Servers run in two ways. **Local** servers talk over **stdio** (standard input/output) on the same machine, which suits developer tools. **Remote** servers use **streamable HTTP** over the network, which suits shared enterprise tools. In Foundry, a remote server becomes an `MCPTool` on the agent (label, URL, allowed tools, approval setting, auth headers through a project connection). Microsoft Learn, Azure Language, Azure Speech and Foundry IQ all offer MCP endpoints.",
    "Approval is on by default. The first time Fabrikam's agent wanted to call `create_ticket` on their ITSM MCP server, the response contained an approval request instead of a result. Their app showed it to the user, sent back the approval, and the agent continued. They later set read-only search tools to `require_approval=\"never\"` and kept approvals for anything that writes."
  ],
  breaks: "USB devices are dumb peripherals. MCP servers can be third-party code that returns text the model will read, so a malicious server can inject instructions. Trust, approve and monitor servers like any supply-chain dependency.",
  dia: [
    { type: "nest", cap: "MCP architecture", levels: [["Host (AI app / Foundry Agent Service)", "decides when to use tools"], ["MCP client (one per server connection)", "list_tools, call_tool"], ["MCP server", "tools · resources · prompts — local (stdio) or remote (streamable HTTP)"]] },
    { type: "seq", cap: "Approval loop for a remote MCP tool", actors: ["App", "Agent Service", "MCP server"], msgs: [["App", "Agent Service", "responses.create(user request)"], ["Agent Service", "App", "mcp_approval_request(id, tool, args)", true], ["App", "Agent Service", "mcp_approval_response(approval_request_id, approve=True)"], ["Agent Service", "MCP server", "call tool"], ["MCP server", "Agent Service", "result", true], ["Agent Service", "App", "final answer", true]] }
  ],
  keys: [
    "MCP roles: **host** (AI app), **client** (connection manager inside the host), **server** (exposes **tools**, **resources**, **prompts**).",
    "Transports: **stdio** for local servers; **streamable HTTP** for remote servers.",
    "Dynamic discovery: `session.list_tools()`; invoke with `session.call_tool(name, arguments)`. Server code with the Python SDK: `FastMCP(name=...)`, `@mcp.tool()` decorated functions, `mcp.run()`.",
    "Local MCP with Agent Service: your app is the MCP client. Wrap discovered tools as `FunctionTool`s, and on `function_call` run `call_tool` and return `result.content[0].text` as the output.",
    "Remote MCP in Agent Service: `MCPTool(server_label=..., server_url=..., require_approval=\"always\"|\"never\", allowed_tools=[...])`; auth headers through a project connection (key, Entra ID or OAuth with per-user consent).",
    "`require_approval` defaults to **\"always\"**. Loop: for each `mcp_approval_request` item, send `{\"type\": \"mcp_approval_response\", \"approval_request_id\": item.id, \"approve\": True}` with `previous_response_id` until none remain.",
    "Use `allowed_tools` to expose only the operations the agent needs.",
    "MCP endpoints in the Microsoft ecosystem: Microsoft Learn docs (`https://learn.microsoft.com/api/mcp`), Azure Language, Azure Speech, Foundry IQ knowledge bases, Toolbox bundles, Work IQ.",
    "MCP vs OpenAPI vs function: MCP for shared, centrally updated tools across many agents/apps; OpenAPI for a single REST API with a spec; function for logic inside your app."
  ],
  cmp: [{ cap: "Local vs remote MCP servers", head: ["", "Local", "Remote"], rows: [["Transport", "stdio", "Streamable HTTP"], ["Runs", "Same machine as the client", "Hosted service (Functions, Container Apps, App Service…)"], ["Typical use", "Dev tools, desktop apps", "Shared enterprise tools, SaaS"], ["With Agent Service", "Your app acts as client; wrap as function tools", "Add as `MCPTool` on the agent"]] }],
  code: [{ t: "A tiny MCP server (Python SDK)", lang: "python", src: `from mcp.server.fastmcp import FastMCP

mcp = FastMCP(name="inventory")

@mcp.tool()
def get_stock(sku: str) -> int:
    """Return units in stock for a SKU."""
    return lookup(sku)

if __name__ == "__main__":
    mcp.run()          # stdio by default; HTTP transports for remote use`, notes: [[3, "FastMCP builds the server from decorated functions."], [5, "Type hints and the docstring become the tool's schema and description."], [11, "`run()` serves over stdio unless configured for HTTP."]] },
    { t: "Remote MCP tool with an approval loop", lang: "python", src: `from azure.ai.projects.models import MCPTool

learn = MCPTool(server_label="mslearn", server_url="https://learn.microsoft.com/api/mcp",
                require_approval="always")
agent = project.agents.create_version(agent_name="docs-agent",
    definition=PromptAgentDefinition(model=deployment, instructions="Answer from Microsoft Learn.", tools=[learn]))

ref = {"agent_reference": {"name": agent.name, "type": "agent_reference"}}
r = oc.responses.create(input="How do I enable private endpoints for Foundry?", extra_body=ref)
while True:
    approvals = [{"type": "mcp_approval_response", "approval_request_id": i.id, "approve": True}
                 for i in r.output if i.type == "mcp_approval_request"]
    if not approvals:
        break
    r = oc.responses.create(input=approvals, previous_response_id=r.id, extra_body=ref)
print(r.output_text)`, notes: [[4, "Approval on every call (also the default)."], [10, "Loop until no approval requests remain."], [11, "Each request id needs a matching response; in a real app the user decides `approve`."], [15, "Chain with `previous_response_id` so the agent continues the same run."]] }],
  portal: [{ t: "Connect an MCP server to an agent", path: "Foundry portal > Build > Agents > (agent) > Tools > Add > Custom > Model Context Protocol", steps: ["Enter a name (server label) and the remote server URL.", "Choose authentication (none, key header via connection, Entra ID, OAuth).", "Choose approval behaviour; optionally restrict tools.", "Test: the playground shows approval prompts before calls."] }],
  ex: { q: "A company runs an internal MCP server with 25 tools, including `delete_customer`. A support agent should only read customer data and create notes, and humans must approve note creation.", steps: ["Restrict exposure with `allowed_tools=[\"get_customer\", \"create_note\"]`.", "Read tool can run freely; note creation needs approval.", "Use two MCPTool entries (same server, different settings) or approve per call in app logic."], a: "Use **`allowed_tools`** to expose only `get_customer` and `create_note`, with `require_approval=\"never\"` for the read tool and `\"always\"` for `create_note` (e.g. two tool entries). `delete_customer` is never visible." },
  fade: { q: "Your agent's response contains an item of type `mcp_approval_request` with id `mcpr_42`.", steps: ["The user clicks Approve in your UI.", { ask: "What item do you send back?", a: "`{\"type\": \"mcp_approval_response\", \"approval_request_id\": \"mcpr_42\", \"approve\": True}`." }, { ask: "How does the agent continue the same run?", a: "Send it as `input` with `previous_response_id` set to the response that contained the request." }] },
  traps: [
    ["Assuming MCP tools run without approval by default.", "Default is `require_approval=\"always\"`."],
    ["Confusing MCP transports.", "stdio = local; streamable HTTP = remote."],
    ["Thinking agents must be redeployed when a server adds a tool.", "Clients discover tools dynamically (`list_tools`)."],
    ["Treating third-party MCP servers as trusted.", "Their outputs can carry injected instructions: approve, restrict and monitor."],
    ["Putting auth secrets in `server_url` query strings.", "Use a project connection for headers or Entra/OAuth."]
  ],
  disc: [
    ["Why might an organisation host its own MCP servers instead of giving each agent OpenAPI tools?", "Central control: one place to update tools, enforce auth and logging, version tools and reuse them across many agents and apps (including other platforms such as Copilot Studio)."],
    ["When is `require_approval=\"never\"` acceptable?", "For trusted, read-only, low-risk tools where approvals would only add friction, with monitoring in place."]
  ],
  teach: { prompt: "Explain MCP and how a Foundry agent uses a remote MCP server safely.", rubric: ["Host/client/server; tools, resources, prompts", "stdio local vs streamable HTTP remote", "Dynamic discovery (list_tools)", "MCPTool with server_label, server_url, allowed_tools, require_approval", "Approval loop: mcp_approval_request → mcp_approval_response"], model: "MCP standardises how AI apps discover and call tools. The host app runs an MCP client that connects to servers exposing tools, resources and prompts: locally over stdio or remotely over streamable HTTP. Clients discover tools at runtime, so servers can evolve centrally. In Foundry you add an `MCPTool` with a label and URL, restrict it with `allowed_tools`, and keep `require_approval` on for risky tools: the response then includes `mcp_approval_request` items, and your app answers each with an `mcp_approval_response` before the call runs." },
  qa: [["MCP roles?", "Host, client, server."], ["What servers expose?", "Tools, resources, prompts."], ["Local transport?", "stdio."], ["Remote transport?", "Streamable HTTP."], ["Default require_approval?", "\"always\"."], ["Approval reply item type?", "`mcp_approval_response`."], ["Microsoft Learn MCP URL?", "https://learn.microsoft.com/api/mcp"]],

    { t: "yn", q: "Evaluate each statement about MCP.", s: [["Remote MCP servers typically use streamable HTTP.", true], ["Clients must be redeployed to see new server tools.", false], ["MCP servers can expose prompts as well as tools.", true]], e: "Discovery is dynamic; servers expose tools, resources and prompts.", tp: "MCP basics" },
    { q: "An agent should see only two of an MCP server's 30 tools. Which parameter?", o: ["`server_label`", "`allowed_tools`", "`require_approval`", "`tool_choice`"], a: 1, e: "`allowed_tools` restricts what's exposed to the agent.", tp: "MCPTool" },
    { t: "match", q: "Match each MCP term to its meaning.", pairs: [["Host", "The AI application that uses tools"], ["Client", "Maintains the connection to one server"], ["Server", "Exposes tools, resources and prompts"], ["stdio", "Transport for local servers"]], extra: ["Vector store"], e: "Know the roles and transports.", tp: "MCP architecture" },

{
  id: "a05", d: "d2", t: "Knowledge and memory for agents: Foundry IQ", min: 75,
  hook: "Agents need two kinds of remembering: **knowledge** (what the organisation knows) and **memory** (what this user said and prefers). The outline asks you to choose and connect both.",
  pre: { q: "Three needs: (1) company policies for all agents, (2) a PDF a user uploads for one chat, (3) remembering that a user prefers metric units. Which service fits each?", a: "(1) **Foundry IQ** knowledge base; (2) **file search** (vector store); (3) **long-term memory** (memory store)." },
  story: [
    "Picture a company **library** and a personal **notebook**. **Foundry IQ** is the library: a managed knowledge layer on Azure AI Search where you create **knowledge bases** per business domain, each with **knowledge sources** such as an Azure AI Search index, Blob Storage files, SharePoint, OneLake or the web. Foundry IQ handles chunking, embedding and indexing, and at question time does **agentic retrieval**: it plans the query, picks strategies, ranks results and returns citations. Many agents can share one knowledge base.",
    "Agents connect to a knowledge base through **MCP**: the knowledge base exposes an MCP endpoint (`{search endpoint}/knowledgebases/<name>/mcp`) that you add as an `MCPTool`. The project's identity needs **Search Index Data Reader** (or key auth).",
    "SharePoint has two flavours. **Remote** SharePoint queries live with the user's permissions and needs no index maintenance. **Indexed** SharePoint copies content into an index on a schedule: faster, with richer search, but only as fresh as the last refresh.",
    "The notebook is **memory** (preview). **Short-term** memory is the current conversation. **Long-term** memory lives in a **memory store** that extracts facts from conversations (user profile, chat summaries, procedural how-tos), consolidates them (merging duplicates, resolving conflicts) and retrieves them later. Contoso's travel agent attached the **memory search tool**, scoped per user, so next month it still knows Maya prefers aisle seats."
  ],
  breaks: "A library is curated and a notebook is personal, but both can be poisoned. A malicious document or a user's crafted message can plant false \"facts\". Validate sources, use guardrails, and let users see and delete their memories.",
  dia: [
    { type: "flow", cap: "Foundry IQ knowledge base", steps: [["Sources", "AI Search index, Blob, SharePoint (remote/indexed), OneLake, web"], ["Automatic ingestion", "discover → chunk + embed → index → refresh"], ["Agentic retrieval", "query planning, strategy, ranking, citations"], ["MCP endpoint", "…/knowledgebases/<kb>/mcp"], ["Agents", "many agents share one KB"]] },
    { type: "tree", cap: "Where should this information live?", root: { q: "Whose information is it?", c: [["The organisation's curated knowledge", "Foundry IQ knowledge base (or Azure AI Search tool)"], ["A file the user brought to this chat", "File search vector store"], ["Facts about this user over time", "Long-term memory store"], ["Only this conversation", "Conversation (short-term) state"]] } }
  ],
  keys: [
    "**Foundry IQ** = managed knowledge layer on **Azure AI Search**: knowledge bases (per domain) with knowledge sources (AI Search index, Blob, SharePoint remote or indexed, OneLake, web/Bing).",
    "Automatic pipeline: discover → chunk + embed → index → monitor/re-index. Retrieval intelligence: query analysis and planning, strategy selection, ranking, citations.",
    "Connect agents via MCP: `MCPTool(server_label=\"kb\", server_url=f\"{search_endpoint}/knowledgebases/<kb>/mcp\")`; project identity needs **Search Index Data Reader** (RBAC) or key auth.",

{

  story: [

    "To reach people where they work, you publish to **Microsoft Teams and Microsoft 365 Copilot**. Foundry creates an **Azure Bot Service** resource, an Entra app registration and an M365 app package. You supply the metadata: name, descriptions, 32×32 and 192×192 icons, privacy and terms URLs (never secrets).",

    "Some teams need more: custom single sign-on, middleware, multi-environment pipelines. They use the **Microsoft 365 Agents Toolkit** in VS Code to build a *custom engine agent* that fronts the Foundry agent. And to give agents access to work data (mail, meetings, files, chats), **Work IQ** offers a CLI and MCP server over Microsoft Graph, permission-trimmed, which requires Microsoft 365 Copilot licences and admin consent."

  teach: { prompt: "Explain how to get a Foundry agent into Teams for a pilot and then for the whole company.", rubric: ["Stable endpoint + own identity (new model: at creation; legacy: agent application at publish)", "Publish to Teams/M365 creates Bot Service + app registration + package (needs Bot Service Contributor)", "Just you (Shared) scope for the pilot (no approval)", "People in your organization (Tenant) scope needs admin approval in M365 admin center", "Grant tool permissions to the agent identity"], model: "Make sure the tested version is the one the agent's endpoint serves (new agents have a stable endpoint and their own identity from creation; in the legacy model, publishing created an agent application). Then choose Publish to Teams and Microsoft 365 Copilot. Foundry creates a Bot Service resource, so you need Azure Bot Service Contributor, plus an app registration and the app package from the metadata and icons you provide. For the pilot use the Just you scope, which needs no admin approval, and share the link; for everyone, use People in your organization and have an admin approve it in the Microsoft 365 admin center. Make sure the agent's identity has roles for its tools." },
