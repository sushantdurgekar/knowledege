. If a region fails, only its users move, and only to a region their data may enter."}],"cmp":[{"cap":"Active-passive or active-active","head":["","Active-passive","Active-active"],"rows":[["Writes","One region at a time","Every region"],["Latency for distant users","A cross-region round trip for writes","Local"],["Failover","Detect, confirm, fence, promote, move traffic: minutes","Move traffic away: seconds to minutes"],["Conflicts","None","Avoided with home regions, or merged (CRDTs)"],["Cost","Standby capacity that's mostly idle","Every region sized to absorb a failed one"]]},{"cap":"Replicating across regions","head":["","Asynchronous","Synchronous or quorum"],"rows":[["Write latency","Local","Plus a cross-region round trip"],["Data lost if a region fails","The replication lag: usually seconds","None"],["If the other region is down","Writes carry on","Writes wait or fail, unless a quorum remains"],["Examples","Cross-region read replicas, Aurora Global Database","Spanner, CockroachDB multi-region"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"RPO under asynchronous replication: what a bulk import does to it","tabs":[{"lang":"python","src":"rand = mulberry32(17)\nSTEP_MS, IN_FLIGHT_MS = 10, 40                         # simulate in 10 ms steps; writes spend 40 ms on the wire\n\ndef replica_backlog(rates):\n    backlog, out = 0, []\n    for rate in rates:                                 # writes a second on the primary, for each step\n        backlog += rate * STEP_MS // 1000              # committed on the primary during this step\n        backlog -= min(backlog, 1000 * STEP_MS // 1000)   # the replica applies at most 1,000 writes a second\n        out.append(backlog)\n    return out\n\ndef failure_losses(rates, trials=2000):\n    backlog = replica_backlog(rates)\n    losses = []\n    for _ in range(trials):\n        step = int(rand() * len(rates))                # the primary region fails at a random moment\n        losses.append(backlog[step] + rates[step] * IN_FLIGHT_MS // 1000)   # committed, but not yet on the replica\n    return sorted(losses), max(backlog)\n\nnormal = [200] * 60_000                                # ten minutes at 200 writes a second\nfor label, rates in ((\"import in 1 minute, full speed\", normal[:18_000] + [2_000] * 6_000 + normal[24_000:]),\n                     (\"import in 3 minutes, throttled\", normal[:18_000] + [800] * 18_000 + normal[36_000:])):\n    losses, worst_backlog = failure_losses(rates)\n    print(f\"{label}: median loss {losses[len(losses) // 2]} writes, 90th percentile {losses[len(losses) * 9 // 10]}, \"\n          f\"worst {losses[-1]}; replica up to {worst_backlog // 1000} s behind\")\n","out":"import in 1 minute, full speed: median loss 8 writes, 90th percentile 28072, worst 59792; replica up to 60 s behind\nimport in 3 minutes, throttled: median loss 8 writes, 90th percentile 32, worst 32; replica up to 0 s behind\n","notes":[[8,"The link and the replica have a fixed throughput; anything faster than it piles up as a backlog."],[17,"A failure loses what the replica hadn't applied: the backlog plus the writes on the wire. That is the RPO, and it moves with the load."],[24,"Most failures lose a handful of writes, but one in ten lands during or just after the import and loses tens of thousands. Throttling bulk work on replica lag keeps the RPO small."]]},{"lang":"javascript","src":"const rand = mulberry32(17);\nconst STEP_MS = 10, IN_FLIGHT_MS = 40;                 // simulate in 10 ms steps; writes spend 40 ms on the wire\n\nfunction replicaBacklog(rates) {\n  let backlog = 0;\n  const out = [];\n  for (const rate of rates) {                          // writes a second on the primary, for each step\n    backlog += Math.floor(rate * STEP_MS / 1000);      // committed on the primary during this step\n    backlog -= Math.min(backlog, Math.floor(1000 * STEP_MS / 1000));   // the replica applies at most 1,000 writes a second\n    out.push(backlog);\n  }\n  return out;\n}\n\nfunction failureLosses(rates, trials = 2000) {\n  const backlog = replicaBacklog(rates);\n  const losses = [];\n  for (let i = 0; i < trials; i++) {\n    const step = Math.floor(rand() * rates.length);    // the primary region fails at a random moment\n    losses.push(backlog[step] + Math.floor(rates[step] * IN_FLIGHT_MS / 1000));   // committed, but not yet on the replica\n  }\n  return [losses.sort((a, b) => a - b), backlog.reduce((m, x) => Math.max(m, x), 0)];\n}\n\nconst normal = new Array(60000).fill(200);             // ten minutes at 200 writes a second\nfor (const [label, rates] of [[\"import in 1 minute, full speed\", [...normal.slice(0, 18000), ...new Array(6000).fill(2000), ...normal.slice(24000)]],\n                              [\"import in 3 minutes, throttled\", [...normal.slice(0, 18000), ...new Array(18000).fill(800), ...normal.slice(36000)]]]) {\n  const [losses, worstBacklog] = failureLosses(rates);\n  console.log(`${label}: median loss ${losses[Math.floor(losses.length / 2)]} writes, 90th percentile ${losses[Math.floor(losses.length * 9 / 10)]}, ` +\n              `worst ${losses.at(-1)}; replica up to ${Math.floor(worstBacklog / 1000)} s behind`);\n}\n","out":"import in 1 minute, full speed: median loss 8 writes, 90th percentile 28072, worst 59792; replica up to 60 s behind\nimport in 3 minutes, throttled: median loss 8 writes, 90th percentile 32, worst 32; replica up to 0 s behind\n","notes":[[9,"The link and the replica have a fixed throughput; anything faster than it piles up as a backlog."],[20,"A failure loses what the replica hadn't applied: the backlog plus the writes on the wire. That is the RPO, and it moves with the load."],[29,"Most failures lose a handful of writes, but one in ten lands during or just after the import and loses tens of thousands. Throttling bulk work on replica lag keeps the RPO small."]]}]},{"t":"Headroom: can the other regions absorb one region's loss?","tabs":[{"lang":"python","src":"TARGET = 85                                            # keep every region under 85% busy, even after losing one\nprint(\"equal regions, the most each may run at:\", \" | \".join(f\"{n} regions {TARGET * (n - 1) // n}%\" for n in (2, 3, 4, 5)))\n\nload = {\"us-east\": 3000, \"us-west\": 1800, \"eu-west\": 2400, \"ap-south\": 1200}         # requests a second today\ncapacity = {\"us-east\": 5000, \"us-west\": 3000, \"eu-west\": 4000, \"ap-south\": 2500}\nnearest = {\"us-east\": \"us-west\", \"us-west\": \"us-east\", \"eu-west\": \"us-east\", \"ap-south\": \"eu-west\"}\n\ndef busiest_after(failed, policy):\n    new = {r: l for r, l in load.items() if r != failed}\n    if policy == \"nearest\":\n        new[nearest[failed]] += load[failed]           # latency-based routing sends everyone to the closest region\n    else:\n        spare = {r: capacity[r] * TARGET // 100 - new[r] for r in new}   # room left under the target\n        for r in new:\n            new[r] += load[failed] * spare[r] // sum(spare.values())     # share the load by spare capacity\n    region = max(new, key=lambda r: new[r] * 100 // capacity[r])\n    return region, new[region] * 100 // capacity[region]\n\nfor failed in load:\n    (r1, u1), (r2, u2) = busiest_after(failed, \"nearest\"), busiest_after(failed, \"by spare capacity\")\n    print(f\"{failed} fails: all to the nearest -> {r1} at {u1}%{' OVERLOADED' if u1 > 100 else ''} | by spare capacity -> busiest {r2} at {u2}%\")\n","out":"equal regions, the most each may run at: 2 regions 42% | 3 regions 56% | 4 regions 63% | 5 regions 68%\nus-east fails: all to the nearest -> us-west at 160% OVERLOADED | by spare capacity -> busiest ap-south at 89%\nus-west fails: all to the nearest -> us-east at 96% | by spare capacity -> busiest us-east at 74%\neu-west fails: all to the nearest -> us-east at 108% OVERLOADED | by spare capacity -> busiest us-east at 80%\nap-south fails: all to the nearest -> eu-west at 90% | by spare capacity -> busiest us-east at 70%\n","notes":[[2,"With n equal regions, the survivors carry n ÷ (n − 1) times their load, so each may only run at (n − 1)/n of the target."],[11,"Latency-based routing sends a failed region's users to the closest region, which can double its load."],[15,"Weighting the shift by spare capacity spreads it; global load balancers can do this with capacity-aware routing."],[21,"Even spread by spare capacity, losing us-east pushes ap-south past the 85% target: the biggest region's failure sets the headroom everyone needs."]]},{"lang":"javascript","src":"const TARGET = 85;                                     // keep every region under 85% busy, even after losing one\nconsole.log(\"equal regions, the most each may run at:\", [2, 3, 4, 5].map(n => `${n} regions ${Math.floor(TARGET * (n - 1) / n)}%`).join(\" | \"));\n\nconst load = { \"us-east\": 3000, \"us-west\": 1800, \"eu-west\": 2400, \"ap-south\": 1200 };   // requests a second today\nconst capacity = { \"us-east\": 5000, \"us-west\": 3000, \"eu-west\": 4000, \"ap-south\": 2500 };\nconst nearest = { \"us-east\": \"us-west\", \"us-west\": \"us-east\", \"eu-west\": \"us-east\", \"ap-south\": \"eu-west\" };\n\nfunction busiestAfter(failed, policy) {\n  const next = Object.fromEntries(Object.entries(load).filter(([r]) => r !== failed));\n  if (policy === \"nearest\") {\n    next[nearest[failed]] += load[failed];             // latency-based routing sends everyone to the closest region\n  } else {\n    const spare = Object.fromEntries(Object.keys(next).map(r => [r, Math.floor(capacity[r] * TARGET / 100) - next[r]]));   // room left under the target\n    const total = Object.values(spare).reduce((a, b) => a + b, 0);\n    for (const r of Object.keys(next)) next[r] += Math.floor(load[failed] * spare[r] / total);   // share the load by spare capacity\n  }\n  const util = r => Math.floor(next[r] * 100 / capacity[r]);\n  const region = Object.keys(next).reduce((best, r) => (util(r) > util(best) ? r : best));\n  return [region, util(region)];\n}\n\nfor (const failed of Object.keys(load)) {\n  const [r1, u1] = busiestAfter(failed, \"nearest\"), [r2, u2] = busiestAfter(failed, \"by spare capacity\");\n  console.log(`${failed} fails: all to the nearest -> ${r1} at ${u1}%${u1 > 100 ? \" OVERLOADED\" : \"\"} | by spare capacity -> busiest ${r2} at ${u2}%`);\n}\n","out":"equal regions, the most each may run at: 2 regions 42% | 3 regions 56% | 4 regions 63% | 5 regions 68%\nus-east fails: all to the nearest -> us-west at 160% OVERLOADED | by spare capacity -> busiest ap-south at 89%\nus-west fails: all to the nearest -> us-east at 96% | by spare capacity -> busiest us-east at 74%\neu-west fails: all to the nearest -> us-east at 108% OVERLOADED | by spare capacity -> busiest us-east at 80%\nap-south fails: all to the nearest -> eu-west at 90% | by spare capacity -> busiest us-east at 70%\n","notes":[[2,"With n equal regions, the survivors carry n ÷ (n − 1) times their load, so each may only run at (n − 1)/n of the target."],[11,"Latency-based routing sends a failed region's users to the closest region, which can double its load."],[15,"Weighting the shift by spare capacity spreads it; global load balancers can do this with capacity-aware routing."],[24,"Even spread by spare capacity, losing us-east pushes ap-south past the 85% target: the biggest region's failure sets the headroom everyone needs."]]}]},{"t":"Active-active conflicts: a likes counter in two regions","tabs":[{"lang":"python","src":"rand = mulberry32(5)\nevents = sorted((int(rand() * 10_000), \"eu\" if rand() < 0.6 else \"us\") for _ in range(1000))   # (ms, region) of each like\nDELAY = 150                                            # replication between the regions takes 150 ms\n\ndef last_writer_wins():\n    state = {\"eu\": (0, -1), \"us\": (0, -1)}             # region -> (count, timestamp of the write it came from)\n    inbox = []                                         # replication messages: (arrival ms, to, count, timestamp)\n    for n, (t, region) in enumerate(events):\n        for _, to, count, stamp in [m for m in inbox if m[0] <= t]:   # deliver what has arrived, oldest first\n            if stamp > state[to][1]:\n                state[to] = (count, stamp)             # the newer write wins; the older value is replaced\n        inbox = [m for m in inbox if m[0] > t]\n        count, stamp = state[region][0] + 1, t * 10_000 + n   # read the local copy and add one\n        state[region] = (count, stamp)\n        inbox.append((t + DELAY, \"us\" if region == \"eu\" else \"eu\", count, stamp))\n    for _, to, count, stamp in inbox:                  # let replication finish\n        if stamp > state[to][1]:\n            state[to] = (count, stamp)\n    return state[\"eu\"][0], state[\"us\"][0]\n\neu_likes = sum(1 for _, region in events if region == \"eu\")\nprint(f\"{len(events)} likes in 10 s: {eu_likes} in eu, {len(events) - eu_likes} in us\")\neu, us = last_writer_wins()\nprint(f\"last writer wins in both regions: eu shows {eu}, us shows {us}; {len(events) - eu} likes lost\")\nprint(f\"one home region (eu) for the counter: {len(events)} counted, but every us like waits an extra round trip to eu\")\n","out":"1000 likes in 10 s: 616 in eu, 384 in us\nlast writer wins in both regions: eu shows 417, us shows 417; 583 likes lost\none home region (eu) for the counter: 1000 counted, but every us like waits an extra round trip to eu\n","notes":[[11,"A replicated value with a newer timestamp simply replaces the local one, along with any increments made here in the meantime."],[13,"Each region reads its own copy and adds one: concurrent likes in the other region aren't in that copy yet."],[24,"The regions agree, on a number that's far too low: last-writer-wins converges by throwing updates away."],[25,"A home region avoids the conflict at the cost of latency for the other side; the fade builds a counter that needs neither."]]},{"lang":"javascript","src":"const rand = mulberry32(5);\nconst events = Array.from({ length: 1000 }, () => [Math.floor(rand() * 10000), rand() < 0.6 ? \"eu\" : \"us\"])\n  .sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0));   // [ms, region] of each like\nconst DELAY = 150;                                     // replication between the regions takes 150 ms\n\nfunction lastWriterWins() {\n  const state = { eu: [0, -1], us: [0, -1] };          // region -> [count, timestamp of the write it came from]\n  let inbox = [];                                      // replication messages: [arrival ms, to, count, timestamp]\n  events.forEach(([t, region], n) => {\n    for (const [, to, count, stamp] of inbox.filter(m => m[0] <= t)) {   // deliver what has arrived, oldest first\n      if (stamp > state[to][1]) state[to] = [count, stamp];   // the newer write wins; the older value is replaced\n    }\n    inbox = inbox.filter(m => m[0] > t);\n    const count = state[region][0] + 1, stamp = t * 10000 + n;   // read the local copy and add one\n    state[region] = [count, stamp];\n    inbox.push([t + DELAY, region === \"eu\" ? \"us\" : \"eu\", count, stamp]);\n  });\n  for (const [, to, count, stamp] of inbox) {          // let replication finish\n    if (stamp > state[to][1]) state[to] = [count, stamp];\n  }\n  return [state.eu[0], state.us[0]];\n}\n\nconst euLikes = events.filter(([, region]) => region === \"eu\").length;\nconsole.log(`${events.length} likes in 10 s: ${euLikes} in eu, ${events.length - euLikes} in us`);\nconst [eu, us] = lastWriterWins();\nconsole.log(`last writer wins in both regions: eu shows ${eu}, us shows ${us}; ${events.length - eu} likes lost`);\nconsole.log(`one home region (eu) for the counter: ${events.length} counted, but every us like waits an extra round trip to eu`);\n","out":"1000 likes in 10 s: 616 in eu, 384 in us\nlast writer wins in both regions: eu shows 417, us shows 417; 583 likes lost\none home region (eu) for the counter: 1000 counted, but every us like waits an extra round trip to eu\n","notes":[[11,"A replicated value with a newer timestamp simply replaces the local one, along with any increments made here in the meantime."],[14,"Each region reads its own copy and adds one: concurrent likes in the other region aren't in that copy yet."],[27,"The regions agree, on a number that's far too low: last-writer-wins converges by throwing updates away."],[28,"A home region avoids the conflict at the cost of latency for the other side; the fade builds a counter that needs neither."]]}]}],"ex":{"q":"A primary database in region A replicates to a standby in region B. Write the rule that decides when B takes over, and test it on 300 incidents of three kinds: region A going down, the link between A and B failing while A is healthy, and A being cut off from everything except its local clients. Count how often a dead A is replaced, how often B takes over needlessly, and how often both regions accept writes at once.","steps":["The obvious rule, promote B after some seconds without a heartbeat from A, can't tell a dead region from a broken link. When only the link is down, A keeps serving its clients while B starts serving too: split brain.","Add a witness in a third region: B promotes only if the witness has lost A too. A broken A–B link leaves the witness in touch with A, so nothing happens.","Make A fence itself: if A hears from neither B nor the witness for 20 seconds, it stops taking writes, which is before B can be promoted at 30. When contact returns after a failover, A sees the newer epoch and rejoins as a replica instead of resuming.","Then count, rather than argue: simulate each rule against the same incidents and compare replaced regions, needless failovers and split brains."],"code":{"t":"Three failover rules against the same 300 incidents","tabs":[{"lang":"python","src":"rand = mulberry32(23)\nKINDS = [\"region A down\", \"A-B link down\", \"A cut off\"]\n\ndef run(policy, kind, length, wait=30):\n    silent_b = silent_w = silent_a = 0                 # seconds since B, the witness and A last heard from each other\n    promoted_at, demoted, split = None, False, 0\n    for t in range(length + 120):                      # the incident, then two minutes after it ends\n        cut = t < length\n        a_alive = not (cut and kind == \"region A down\")\n        b_hears_a = not cut                            # every incident cuts B off from A\n        w_hears_a = not cut or kind == \"A-B link down\" # only a broken A-B link leaves the witness in touch with A\n        silent_b = 0 if b_hears_a else silent_b + 1\n        silent_w = 0 if w_hears_a else silent_w + 1\n        silent_a = 0 if a_alive and (b_hears_a or w_hears_a) else silent_a + 1\n        if promoted_at is None and silent_b >= wait and (policy == \"timeout\" or silent_w >= wait):\n            promoted_at = t                            # B becomes the primary\n        if policy == \"witness\" and promoted_at is not None and a_alive and (b_hears_a or w_hears_a):\n            demoted = True                             # A learns of the new primary and steps down\n        a_writes = a_alive and not demoted and (policy == \"timeout\" or silent_a < 20)   # with a witness, A stops alone after 20 s\n        split += a_writes and promoted_at is not None  # both regions accepting writes: split brain\n    return promoted_at, split\n\nincidents = []\nfor _ in range(300):\n    kind = KINDS[int(rand() * 3)]\n    incidents.append((kind, 5 + int(rand() * 115) if kind == \"A cut off\" else 60 + int(rand() * 540)))\n\nfor policy, wait in ((\"timeout\", 10), (\"timeout\", 30), (\"witness\", 30)):\n    results = [(kind, *run(policy, kind, length, wait)) for kind, length in incidents]\n    dead = [p for kind, p, _ in results if kind == \"region A down\"]\n    needless = sum(1 for kind, p, _ in results if kind == \"A-B link down\" and p is not None)\n    split = sum(1 for _, _, s in results if s > 0)\n    label = f\"B takes over after {wait} s of silence\" if policy == \"timeout\" else f\"B and the witness both silent {wait} s\"\n    print(f\"{label}: dead A replaced {sum(p is not None for p in dead)}/{len(dead)}, \"\n          f\"failovers over a broken A-B link {needless}, split brain in {split} incidents\")\n","out":"B takes over after 10 s of silence: dead A replaced 103/103, failovers over a broken A-B link 97, split brain in 292 incidents\nB takes over after 30 s of silence: dead A replaced 103/103, failovers over a broken A-B link 97, split brain in 271 incidents\nB and the witness both silent 30 s: dead A replaced 103/103, failovers over a broken A-B link 0, split brain in 0 incidents\n"},{"lang":"javascript","src":"const rand = mulberry32(23);\nconst KINDS = [\"region A down\", \"A-B link down\", \"A cut off\"];\n\nfunction run(policy, kind, length, wait = 30) {\n  let silentB = 0, silentW = 0, silentA = 0;           // seconds since B, the witness and A last heard from each other\n  let promotedAt = null, demoted = false, split = 0;\n  for (let t = 0; t < length + 120; t++) {             // the incident, then two minutes after it ends\n    const cut = t < length;\n    const aAlive = !(cut && kind === \"region A down\");\n    const bHearsA = !cut;                              // every incident cuts B off from A\n    const wHearsA = !cut || kind === \"A-B link down\";  // only a broken A-B link leaves the witness in touch with A\n    silentB = bHearsA ? 0 : silentB + 1;\n    silentW = wHearsA ? 0 : silentW + 1;\n    silentA = aAlive && (bHearsA || wHearsA) ? 0 : silentA + 1;\n    if (promotedAt === null && silentB >= wait && (policy === \"timeout\" || silentW >= wait)) {\n      promotedAt = t;                                  // B becomes the primary\n    }\n    if (policy === \"witness\" && promotedAt !== null && aAlive && (bHearsA || wHearsA)) {\n      demoted = true;                                  // A learns of the new primary and steps down\n    }\n    const aWrites = aAlive && !demoted && (policy === \"timeout\" || silentA < 20);   // with a witness, A stops alone after 20 s\n    if (aWrites && promotedAt !== null) split++;       // both regions accepting writes: split brain\n  }\n  return [promotedAt, split];\n}\n\nconst incidents = [];\nfor (let i = 0; i < 300; i++) {\n  const kind = KINDS[Math.floor(rand() * 3)];\n  incidents.push([kind, kind === \"A cut off\" ? 5 + Math.floor(rand() * 115) : 60 + Math.floor(rand() * 540)]);\n}\n\nfor (const [policy, wait] of [[\"timeout\", 10], [\"timeout\", 30], [\"witness\", 30]]) {\n  const results = incidents.map(([kind, length]) => [kind, ...run(policy, kind, length, wait)]);\n  const dead = results.filter(([kind]) => kind === \"region A down\").map(([, p]) => p);\n  const needless = results.filter(([kind, p]) => kind === \"A-B link down\" && p !== null).length;\n  const split = results.filter(([, , s]) => s > 0).length;\n  const label = policy === \"timeout\" ? `B takes over after ${wait} s of silence` : `B and the witness both silent ${wait} s`;\n  console.log(`${label}: dead A replaced ${dead.filter(p => p !== null).length}/${dead.length}, ` +\n              `failovers over a broken A-B link ${needless}, split brain in ${split} incidents`);\n}\n","out":"B takes over after 10 s of silence: dead A replaced 103/103, failovers over a broken A-B link 97, split brain in 292 incidents\nB takes over after 30 s of silence: dead A replaced 103/103, failovers over a broken A-B link 97, split brain in 271 incidents\nB and the witness both silent 30 s: dead A replaced 103/103, failovers over a broken A-B link 0, split brain in 0 incidents\n"}]},"a":"All three rules replace a dead region every time. The timeout rules also fail over in all 97 broken-link incidents, and they cause split brain in almost every incident where they act: when A is healthy but cut off from B, and when a dead A comes back and resumes as primary. Waiting 30 seconds instead of 10 only spares the short blips. The witness rule never fails over on a broken link and never has two primaries, because A stops taking writes after 20 seconds alone, before B can take over at 30, and the epoch demotes A when it returns. The price is about 10 seconds with no primary when A is cut off, and a third region to run the witness."},"fade":{"q":"Finish the PN-counter, a CRDT counter that every region can update locally: `merge(other)` must combine another replica's state, and `value()` must return the total. Merges may arrive in any order and more than once.","steps":["Each replica keeps two maps with one entry per region: increments and decrements. A region only ever raises its own entries.",{"ask":"Why merge with max rather than adding the other replica's counts?","a":"Merges can repeat or arrive out of order. Max is idempotent, commutative and associative, so merging the same state twice changes nothing; adding would count the same likes again."},{"ask":"Why two maps instead of one count that goes up and down?","a":"Max only works for values that only grow: a decremented count would look like an old state and be ignored. Keeping decrements in their own growing map, and subtracting, keeps both mergeable."},{"ask":"What does it cost?","a":"Space and merge time proportional to the number of regions, which is fine for a handful of regions; designs with many writers compress or garbage-collect the per-writer entries."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"class PNCounter:\n    def __init__(self, region, regions):\n        self.region = region\n        self.inc = {r: 0 for r in regions}             # increments made in each region\n        self.dec = {r: 0 for r in regions}             # decrements made in each region\n\n    def add(self, n):\n        if n >= 0:\n            self.inc[self.region] += n                 # a region only ever raises its own entries\n        else:\n            self.dec[self.region] -= n\n\n    def merge(self, other):\n        ...                                            # TODO: combine other's state so repeats change nothing\n\n    def value(self):\n        ...                                            # TODO: the counter's total\n"},{"lang":"javascript","src":"class PNCounter {\n  constructor(region, regions) {\n    this.region = region;\n    this.inc = Object.fromEntries(regions.map(r => [r, 0]));   // increments made in each region\n    this.dec = Object.fromEntries(regions.map(r => [r, 0]));   // decrements made in each region\n  }\n\n  add(n) {\n    if (n >= 0) this.inc[this.region] += n;            // a region only ever raises its own entries\n    else this.dec[this.region] -= n;\n  }\n\n  merge(other) {\n    // TODO: combine other's state so repeats change nothing\n  }\n\n  value() {\n    // TODO: the counter's total\n  }\n}\n"}]},"solution":{"t":"Solution: element-wise max to merge, increments minus decrements for the value","tabs":[{"lang":"python","src":"class PNCounter:\n    def __init__(self, region, regions):\n        self.region = region\n        self.inc = {r: 0 for r in regions}             # increments made in each region\n        self.dec = {r: 0 for r in regions}             # decrements made in each region\n\n    def add(self, n):\n        if n >= 0:\n            self.inc[self.region] += n                 # a region only ever raises its own entries\n        else:\n            self.dec[self.region] -= n\n\n    def merge(self, other):\n        for r in self.inc:\n            self.inc[r] = max(self.inc[r], other.inc[r])   # max: merging the same state twice changes nothing\n            self.dec[r] = max(self.dec[r], other.dec[r])\n\n    def value(self):\n        return sum(self.inc.values()) - sum(self.dec.values())\n\neu, us = PNCounter(\"eu\", [\"eu\", \"us\"]), PNCounter(\"us\", [\"eu\", \"us\"])\neu.add(5)\nus.add(3)\nus.add(-1)\nprint(\"before replication: eu\", eu.value(), \"| us\", us.value())\neu.merge(us)\nus.merge(eu)\neu.merge(us)                                           # a repeated merge, as a retry would cause\nprint(\"after: eu\", eu.value(), \"| us\", us.value())\n","out":"before replication: eu 5 | us 2\nafter: eu 7 | us 7\n"},{"lang":"javascript","src":"class PNCounter {\n  constructor(region, regions) {\n    this.region = region;\n    this.inc = Object.fromEntries(regions.map(r => [r, 0]));   // increments made in each region\n    this.dec = Object.fromEntries(regions.map(r => [r, 0]));   // decrements made in each region\n  }\n\n  add(n) {\n    if (n >= 0) this.inc[this.region] += n;            // a region only ever raises its own entries\n    else this.dec[this.region] -= n;\n  }\n\n  merge(other) {\n    for (const r of Object.keys(this.inc)) {\n      this.inc[r] = Math.max(this.inc[r], other.inc[r]);   // max: merging the same state twice changes nothing\n      this.dec[r] = Math.max(this.dec[r], other.dec[r]);\n    }\n  }\n\n  value() {\n    const sum = m => Object.values(m).reduce((a, b) => a + b, 0);\n    return sum(this.inc) - sum(this.dec);\n  }\n}\n\nconst eu = new PNCounter(\"eu\", [\"eu\", \"us\"]), us = new PNCounter(\"us\", [\"eu\", \"us\"]);\neu.add(5);\nus.add(3);\nus.add(-1);\nconsole.log(\"before replication: eu\", eu.value(), \"| us\", us.value());\neu.merge(us);\nus.merge(eu);\neu.merge(us);                                          // a repeated merge, as a retry would cause\nconsole.log(\"after: eu\", eu.value(), \"| us\", us.value());\n","out":"before replication: eu 5 | us 2\nafter: eu 7 | us 7\n"}]}},"traps":[["“We replicate to another region, so we have disaster recovery.”","Replication copies mistakes too: a bad migration or a mass delete reaches the replica within seconds. Keep point-in-time backups, ideally immutable and in a separate account, and test restoring them."],["“Fail over automatically as soon as heartbeats stop.”","From one region, a dead peer and a broken link look the same. Confirm from a third location, fence the old primary, and wait long enough to ride out short network blips."],["“The standby region will scale up when we need it.”","In a regional outage everyone fails over at once, and capacity or quotas can run out. Keep enough capacity running or reserved, and count scaling time in the RTO."],["“Active-active just means running the same stack twice.”","Concurrent writes to the same data in two regions conflict. Give each record a home region, use CRDTs where data can merge, or pay for a globally consistent database."],["“Our DR plan is written down, so it works.”","Untested plans fail on hidden dependencies such as DNS, identity providers, secrets and deployment pipelines. Rehearse with game days and real region evacuations."],["“Data residency is solved by putting the main database in the right region.”","Backups, logs, analytics copies, caches and support tools hold personal data too. Map every copy, keep each within the allowed regions, and fail over only within them."]],"disc":[["A SaaS company serves the EU and the US from one US region. Large EU customers now require their data to stay in the EU. How would you change the architecture?","Give each tenant a home region and deploy a full stack in an EU region: application, database, caches, backups and logs. Route requests by tenant through a thin global layer that holds only non-personal routing data, replicate shared reference data everywhere, and migrate existing EU tenants with a backfill and a cut-over. Make support tooling and analytics respect the same boundary, and fail EU tenants over to another EU region, never to the US."],["Your active-passive database takes 40 minutes to fail over. How would you bring that down to 5?","Break the 40 minutes into detection, decision, promotion and moving traffic. Detect with health checks from several locations; replace paging and debate with pre-approved automation and a witness; keep a warm standby already sized for full load; switch traffic with low DNS TTLs or a global load balancer, and make clients reconnect quickly. Then rehearse every quarter, so each step is known to work."]],"teach":{"prompt":"Explain to a junior colleague how to choose between active-passive and active-active for a multi-region service, and how to fail over safely.","rubric":["RPO and RTO as business targets, set per system","Asynchronous versus synchronous replication, and what each means for data loss and latency","Active-passive failover steps, and active-active conflicts: home regions or CRDTs","Split brain: confirm from a third location and fence the old primary","Capacity headroom, rehearsals and data residency"],"model":"I start from the RPO and RTO each system needs, because they set the cost. With asynchronous replication, a failover loses whatever the replica hadn't applied, so I watch replication lag and throttle bulk work on it; synchronous or quorum replication loses nothing but adds a cross-region round trip to every write. Active-passive keeps one writing region and a standby: failing over means detecting the failure, confirming it from a third location, fencing the old primary, promoting the replica and moving traffic. Active-active serves writes everywhere, which is faster for users and needs no promotion, but concurrent writes conflict, so I give each user or tenant a home region or use CRDTs where data can merge. Either way the surviving regions need headroom for the extra load, the plan has to be rehearsed, and data that must stay in a jurisdiction, backups and logs included, never fails over outside it."},"qa":[["What does RPO measure?","How much recent data a failure can lose."],["What does RTO measure?","How long the service can be down."],["What sets the RPO with asynchronous replication?","The replication lag at the moment of failure."],["Why use a witness in a third location?","To tell a dead region from a broken link before promoting, so failover can't cause split brain."],["How do home regions avoid active-active conflicts?","Each record is written only in its home region."],["With four equal regions, how busy can each be and still absorb one failure?","At most 75% of capacity, and less to keep a safety margin."]],"quiz":[{"q":"What does this print?","snip":{"t":"An incident's RPO and RTO","tabs":[{"lang":"python","src":"lag_s, detect_s, decide_s, promote_s, dns_ttl_s = 2, 30, 300, 60, 60\nprint(\"RPO\", lag_s, \"s | RTO\", detect_s + decide_s + promote_s + dns_ttl_s, \"s\")\n"},{"lang":"javascript","src":"const lagS = 2, detectS = 30, decideS = 300, promoteS = 60, dnsTtlS = 60;\nconsole.log(\"RPO\", lagS, \"s | RTO\", detectS + decideS + promoteS + dnsTtlS, \"s\");\n"}]},"o":["RPO 2 s | RTO 450 s","RPO 450 s | RTO 2 s","RPO 0 s | RTO 390 s","RPO 2 s | RTO 390 s"],"a":0,"e":"The data lost is what hadn't replicated: 2 seconds' worth. The downtime adds every step until clients reach the new primary, and the human decision is the biggest of them."},{"q":"What does this print?","snip":{"t":"Headroom for losing one of n equal regions","tabs":[{"lang":"python","src":"print(*(f\"{n}:{100 * (n - 1) // n}%\" for n in (2, 3, 4)))\n"},{"lang":"javascript","src":"console.log(...[2, 3, 4].map(n => `${n}:${Math.floor(100 * (n - 1) / n)}%`));\n"}]},"o":["2:50% 3:66% 4:75%","2:50% 3:33% 4:25%","2:100% 3:100% 4:100%","2:75% 3:66% 4:50%"],"a":0,"e":"When one of n equal regions fails, the others carry n ÷ (n − 1) times their load, so each can run at most (n − 1)/n of capacity. More regions waste less on idle headroom."},{"q":"Payments need an RPO of zero but can tolerate a 15-minute RTO. Which design fits best?","o":["Synchronous or quorum replication across zones or nearby regions, with a rehearsed, mostly automated failover","Nightly backups copied to another region","Asynchronous replication with an alert when lag passes 5 minutes","Active-active with last-writer-wins"],"a":0,"e":"Only synchronous or quorum replication guarantees that acknowledged writes survive a region's loss; the generous RTO leaves room for a careful, fenced failover."},{"q":"Users in the EU and the US edit the same shared shopping list in an active-active app. What avoids lost edits without sending every write across the ocean?","o":["Model the list as a CRDT, such as an observed-remove set, that merges concurrent edits","Last-writer-wins on the whole list","Synchronize the clocks more precisely","Replicate faster"],"a":0,"e":"Last-writer-wins keeps one side's version and drops the other's edits, and faster replication only narrows the window. A CRDT merges both, so each region can write locally."},{"q":"Which belong in a regional failover runbook? (choose 3)","t":"ms","o":["Fence the old primary so it can't keep accepting writes","Confirm the failure from a third location before promoting","Check that the surviving regions have the capacity and quotas for the extra load","Delete the old primary's data straight away","Raise DNS TTLs to an hour before failing over"],"a":[0,1,2],"e":"Fencing and confirmation prevent split brain, and capacity checks stop the failover from causing a second outage. Deleting data destroys what you may need to reconcile, and long TTLs slow the switch."},{"q":"Judge each statement.","t":"yn","s":[["RPO measures how long a service is down.",false],["With asynchronous replication, the data lost in a failover is roughly the replication lag at that moment.",true],["GDPR forbids personal data from ever leaving the EU.",false],["A region that returns after a failover must not resume as primary on its own.",true]],"e":"RPO is data lost and RTO is time down. GDPR restricts transfers, requiring an adequacy decision or safeguards, rather than banning them outright. A returning primary must rejoin as a replica, or there are two primaries."},{"q":"Put a safe regional failover in order.","t":"ord","items":["Detect that the primary region has stopped responding","Confirm it from a witness in a third location","Fence the old primary","Promote the replica in the standby region","Move traffic to the new primary"],"e":"Confirming and fencing come before promotion, so there's never a moment with two primaries; moving traffic last means clients only reach a primary that is ready."},{"q":"Complete the Python routing function that keeps each user's data in regions it may enter.","t":"drop","lang":"python","code":"def route(user, request_region, regions_up):\n    home = user[\"home\"]\n    if home in regions_up:\n        return {{0}}                             # the user's data lives here\n    allowed = [r for r in user[\"allowed\"] if r in regions_up]\n    return allowed[0] if allowed else {{1}}      # never fall back to a region the data may not enter\n","blanks":[{"o":["home","request_region","regions_up[0]","None"],"a":0},{"o":["None","home","request_region","regions_up[0]"],"a":0}],"e":"Requests go to the home region whatever region they arrive in; if it's down, only an allowed region will do, and if none is up, refusing the request is better than breaking the residency rule."}],"probs":[["Reading · AWS: Disaster recovery options in the cloud","https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html","","place backup and restore, pilot light, warm standby and multi-site on a chart of RPO against RTO, and estimate each one's cost for a service you know"],["Reading · Azure Well-Architected: Disaster recovery strategies","https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery","","write RPO and RTO targets for three systems of different criticality, and justify each"],["Reading · Google SRE book: Managing critical state","https://sre.google/sre-book/managing-critical-state/","","summarise the split-brain case study, and say which of this module's rules would have prevented it"],["Reference · About CRDTs","https://crdt.tech/","","pick one CRDT besides counters, such as an observed-remove set, and explain how its merge works"]],"src":[["AWS whitepaper: Disaster recovery options in the cloud","https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"],["Microsoft Azure Well-Architected Framework: Architecture strategies for disaster recovery","https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery"],["Google SRE book: Managing Critical State","https://sre.google/sre-book/managing-critical-state/"],["About CRDTs (crdt.tech)","https://crdt.tech/"],["European Commission: International dimension of data protection","https://commission.europa.eu/law/law-topic/data-protection/international-dimension-data-protection_en"]]},{"id":"m08","d":"d3","t":"Security architecture: identity, authorization, zero trust, secrets and encryption","min":110,"hook":"At scale, security is architecture rather than a checklist: who is calling (authentication), what they may do (authorization), how services trust each other, where secrets and keys live, and how data is protected in transit and at rest. Most breaches exploit design gaps rather than broken cryptography: long-lived credentials, a permission checked in one place but not another, secrets in code, and flat networks where one compromised machine can reach everything.","pre":{"q":"You split a monolith into 20 services behind an API gateway. The gateway validates each user's token and forwards the request. Can the services behind it simply trust every request that reaches them?","a":"No. Anything inside the network, such as a compromised service, a misrouted request or a server-side request forgery bug, could call them directly with forged headers. Each service should authenticate its caller (mTLS with workload identities), check the user's token or a signed internal one itself, and authorize each action on the specific object. Trust comes from verified identity, not network location: that's zero trust."},"kid":{"t":"Luigi's badges and key cabinet","x":"Luigi's staff wear badges with photos, checked at every door, not just the front gate, because a stranger who sneaks in shouldn't wander freely. A badge shows who you are; a separate list at each door says what you may do there: cooks may enter the kitchen, but only the manager opens the safe. Badges expire each week and are reissued, so a lost one soon stops working. Keys hang in a locked cabinet that logs who took what, never on hooks by the door. And the recipe book is written in a code only staff can read, so a stolen copy is useless.","map":[["Badges checked at every door","Zero trust: authenticate and authorize every request, not just at the perimeter"],["Who you are, then what you may do","Authentication, then authorization on each object (RBAC, ABAC, relationships)"],["Badges that expire weekly","Short-lived tokens and certificates, renewed automatically"],["The locked, logged key cabinet","A secrets manager or KMS, with access policies and audit logs"],["The recipe book in code","Encryption at rest, with the keys kept apart from the data"]],"brk":"Luigi's badges carry photos. A bearer token doesn't: anyone holding it can use it until it expires. So tokens must be short-lived, sent only over TLS, and where possible bound to the client that received them."},"keys":["**Authentication at scale**: users sign in with an identity provider using OpenID Connect, built on OAuth 2.0, and the app receives an ID token and an access token. Access tokens are often JWTs: signed claims (subject, issuer, audience, scopes, expiry) that any service can verify with the issuer's key, without a database call. Because they can't easily be revoked, keep them short-lived (minutes) and renew them with a refresh token that can be revoked.","**Checking a token**: verify the signature with an algorithm the service chooses (never the token's header), then the expiry with a little leeway for clock skew, the audience (meant for this API) and the issuer. Signed isn't encrypted: anyone holding a JWT can read it, so keep claims minimal and free of secrets.","**Authorization models**: RBAC grants permissions to roles; ABAC evaluates attributes of the user, the resource and the context; relationship-based access control (Google's Zanzibar, OpenFGA, SpiceDB) answers 'can this user view this document?' from a graph of relations, which suits sharing and folders. Whatever the model, the service that owns the object checks it on every request: broken object-level authorization is the top risk in OWASP's API Security Top 10.","**Policy as code**: write policies once (OPA's Rego, AWS's Cedar) and evaluate them inside or next to each service with cached data, so a central outage doesn't block every request. Default to deny, let an explicit deny override any allow, and log every decision for audit.","**Zero trust**: no implicit trust from network location. Every request carries a verified identity: users through tokens, services through workload identities (SPIFFE IDs in short-lived mTLS certificates, often issued by a service mesh), devices through posture checks. Grant least privilege, segment networks, and assume a breach will happen, so one compromised component can reach as little as possible.","**Between services**: mTLS authenticates both ends and encrypts the traffic, and the caller's identity drives authorization ('only checkout may call payments.charge'). Pass the end user's identity on with a token exchange or a signed internal token, so downstream services can authorize on the user's behalf instead of trusting forwarded headers.","**Secrets**: never in code, container images or committed environment files. Keep them in a secrets manager (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault), fetch them at run time with the workload's identity, prefer short-lived dynamic credentials such as per-lease database users, rotate automatically, audit every access, and scan repositories for leaks.","**Encryption**: TLS 1.3 everywhere, inside the network too. At rest, envelope encryption: data is encrypted with data keys, and data keys are encrypted (wrapped) by a master key that never leaves a KMS or HSM. Rotating the master key re-wraps small keys instead of re-encrypting all the data, and destroying a tenant's data key makes every copy of their data unreadable, backups included (crypto-shredding)."],"dia":[{"type":"seq","cap":"Signing in with OpenID Connect, then calling an API","actors":["Browser","App","Identity provider","API"],"msgs":[["Browser","Identity provider","sign in, redirected by the app (authorization code flow with PKCE)"],["Identity provider","App","authorization code, exchanged for an ID token and an access token",true],["App","API","request with the access token"],["API","API","verify signature, expiry, audience, issuer; may this user act on this object?"],["API","App","200, or 401 (who are you?) or 403 (not allowed)",true]],"note":"The API checks the token with the provider's public keys, cached, so there's no call to the provider per request; the object-level permission check still happens in the API."},{"type":"tiers","cap":"Zero trust between services","tiers":[["Edge",["WAF and rate limits","API gateway: validates user tokens"]],["Services",["checkout","payments","orders"],"mTLS with workload identities"],["Policy",["each service authorizes each call on each object (OPA, Cedar, or a relationship service)"],"every request"],["Data and secrets",["databases encrypted at rest, keys in a KMS","credentials fetched at run time from a secrets manager"],"per-service, least privilege"]],"note":"Being inside the network grants nothing: every hop proves who is calling and is checked against policy, so one compromised service reaches as little as possible."},{"type":"flow","cap":"Envelope encryption","steps":[["Get a data key","the KMS returns it in plain form and wrapped under the master key"],["Encrypt the data","with the plain data key, then forget it"],["Store both","the ciphertext beside the wrapped data key"],["Decrypt later","the KMS unwraps the key (access-checked and logged), then decrypt locally"]],"note":"The master key never leaves the KMS or HSM. Rotating it means re-wrapping data keys, not re-encrypting data."}],"cmp":[{"cap":"Three ways to decide what a user may do","head":["","Role-based (RBAC)","Attribute-based (ABAC)","Relationship-based (ReBAC)"],"rows":[["Decides from","The user's roles","Attributes of user, resource and context","Relations in a graph: owner, member, parent folder"],["Example","Editors may publish","Doctors may read records from their own ward, while on shift","Viewers of a folder may view its documents"],["Good for","Coarse, stable permissions","Fine-grained, context-dependent rules","Sharing and hierarchies, as in documents and drives"],["Tools","Built into most platforms","OPA (Rego), Cedar","Zanzibar-style: OpenFGA, SpiceDB"]]},{"cap":"Server-side sessions or self-contained tokens","head":["","Server-side session","Self-contained JWT"],"rows":[["Checking it","Look the session id up in a store","Verify the signature with a key"],["Revoking it","Delete the session: immediate","Wait for expiry, or check a deny list"],["Across many services","Every service needs the session store","Any service can verify it alone"],["Best for","A browser app with one backend","APIs and many services, with short lifetimes"]]}],"code":[{"t":"Helpers used by the examples: a seeded generator, base64url and HS256 signing","tabs":[{"lang":"python","src":"import base64\nimport hashlib\nimport hmac\nimport json\n\ndef mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\ndef b64url(data):                               # base64url without padding, as JWTs use it\n    return base64.urlsafe_b64encode(data).rstrip(b\"=\").decode()\n\ndef unb64url(text):\n    return base64.urlsafe_b64decode(text + \"=\" * (-len(text) % 4))\n\ndef sign_hs256(claims, key, header=None):       # a JWT: header.payload.signature, signed with HMAC-SHA256\n    head = b64url(json.dumps(header or {\"alg\": \"HS256\", \"typ\": \"JWT\"}, separators=(\",\", \":\")).encode())\n    body = b64url(json.dumps(claims, separators=(\",\", \":\")).encode())\n    signature = hmac.new(key, f\"{head}.{body}\".encode(), hashlib.sha256).digest()\n    return f\"{head}.{body}.{b64url(signature)}\"\n"},{"lang":"javascript","src":"const crypto = require(\"node:crypto\");\n\nfunction mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst b64url = data => Buffer.from(data).toString(\"base64url\");   // base64url without padding, as JWTs use it\nconst unb64url = text => Buffer.from(text, \"base64url\");\n\nfunction signHs256(claims, key, header = null) {   // a JWT: header.payload.signature, signed with HMAC-SHA256\n  const head = b64url(JSON.stringify(header ?? { alg: \"HS256\", typ: \"JWT\" }));\n  const body = b64url(JSON.stringify(claims));\n  const signature = crypto.createHmac(\"sha256\", key).update(`${head}.${body}`).digest();\n  return `${head}.${body}.${b64url(signature)}`;\n}\n"}]},{"t":"Inside a JWT: readable by anyone, unforgeable without the key","tabs":[{"lang":"python","src":"KEY = b\"32-bytes-of-secret-from-a-vault!\"\nclaims = {\"sub\": \"user-42\", \"iss\": \"https://id.example.com\", \"aud\": \"orders-api\", \"exp\": 1760000600, \"scope\": \"orders:read\"}\ntoken = sign_hs256(claims, KEY)\nhead, body, signature = token.split(\".\")\nprint(f\"token: {token[:40]}... ({len(token)} characters, sent with every request)\")\nprint(\"anyone holding it can read the payload:\", unb64url(body).decode())\n\ndef signature_ok(token, key):\n    head, body, signature = token.split(\".\")\n    expected = hmac.new(key, f\"{head}.{body}\".encode(), hashlib.sha256).digest()\n    return hmac.compare_digest(b64url(expected), signature)   # constant time: no hints from timing\n\nshow = lambda ok: \"yes\" if ok else \"no\"\nforged_body = b64url(json.dumps({**claims, \"scope\": \"orders:write\"}, separators=(\",\", \":\")).encode())\nforged = f\"{head}.{forged_body}.{signature}\"\nprint(\"genuine token, signature valid:\", show(signature_ok(token, KEY)))\nprint(\"scope changed to orders:write, old signature kept:\", show(signature_ok(forged, KEY)))\nprint(\"re-signed by an attacker with a guessed key:\", show(signature_ok(sign_hs256({**claims, \"scope\": \"orders:write\"}, b\"password123\"), KEY)))\n","out":"token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ... (223 characters, sent with every request)\nanyone holding it can read the payload: {\"sub\":\"user-42\",\"iss\":\"https://id.example.com\",\"aud\":\"orders-api\",\"exp\":1760000600,\"scope\":\"orders:read\"}\ngenuine token, signature valid: yes\nscope changed to orders:write, old signature kept: no\nre-signed by an attacker with a guessed key: no\n","notes":[[6,"The payload is only base64url-encoded, not encrypted: never put secrets or personal data in it."],[11,"Compare signatures in constant time, so response timing can't reveal how much of a forged signature was right."],[17,"Changing one claim invalidates the signature, and making a new one needs the key."],[18,"So the key is everything: keep it in a secrets manager, or sign with RS256 or ES256 so services hold only the public key."]]},{"lang":"javascript","src":"const KEY = Buffer.from(\"32-bytes-of-secret-from-a-vault!\");\nconst claims = { sub: \"user-42\", iss: \"https://id.example.com\", aud: \"orders-api\", exp: 1760000600, scope: \"orders:read\" };\nconst token = signHs256(claims, KEY);\nconst [head, body, signature] = token.split(\".\");\nconsole.log(`token: ${token.slice(0, 40)}... (${token.length} characters, sent with every request)`);\nconsole.log(\"anyone holding it can read the payload:\", unb64url(body).toString());\n\nfunction signatureOk(token, key) {\n  const [head, body, signature] = token.split(\".\");\n  const expected = Buffer.from(b64url(crypto.createHmac(\"sha256\", key).update(`${head}.${body}`).digest()));\n  const given = Buffer.from(signature);\n  return given.length === expected.length && crypto.timingSafeEqual(given, expected);   // constant time: no hints from timing\n}\n\nconst show = ok => (ok ? \"yes\" : \"no\");\nconst forgedBody = b64url(JSON.stringify({ ...claims, scope: \"orders:write\" }));\nconst forged = `${head}.${forgedBody}.${signature}`;\nconsole.log(\"genuine token, signature valid:\", show(signatureOk(token, KEY)));\nconsole.log(\"scope changed to orders:write, old signature kept:\", show(signatureOk(forged, KEY)));\nconsole.log(\"re-signed by an attacker with a guessed key:\", show(signatureOk(signHs256({ ...claims, scope: \"orders:write\" }, Buffer.from(\"password123\")), KEY)));\n","out":"token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ... (223 characters, sent with every request)\nanyone holding it can read the payload: {\"sub\":\"user-42\",\"iss\":\"https://id.example.com\",\"aud\":\"orders-api\",\"exp\":1760000600,\"scope\":\"orders:read\"}\ngenuine token, signature valid: yes\nscope changed to orders:write, old signature kept: no\nre-signed by an attacker with a guessed key: no\n","notes":[[6,"The payload is only base64url-encoded, not encrypted: never put secrets or personal data in it."],[12,"Compare signatures in constant time, so response timing can't reveal how much of a forged signature was right."],[19,"Changing one claim invalidates the signature, and making a new one needs the key."],[20,"So the key is everything: keep it in a secrets manager, or sign with RS256 or ES256 so services hold only the public key."]]}]},{"t":"Relationship-based authorization, Zanzibar style, against roles","tabs":[{"lang":"python","src":"tuples = {                                       # (object, relation) -> subjects: users, or \"object#relation\" groups\n    (\"doc:roadmap\", \"owner\"): [\"ana\"],\n    (\"doc:roadmap\", \"parent\"): [\"folder:plans\"],\n    (\"folder:plans\", \"viewer\"): [\"group:eng#member\"],\n    (\"group:eng\", \"member\"): [\"ben\", \"dev\"],\n    (\"doc:salaries\", \"owner\"): [\"cara\"],\n    (\"doc:salaries\", \"parent\"): [\"folder:hr\"],\n    (\"folder:hr\", \"viewer\"): [\"group:hr#member\"],\n    (\"group:hr\", \"member\"): [\"cara\", \"dan\"],\n}\nIMPLIED = {\"viewer\": [\"editor\"], \"editor\": [\"owner\"]}   # every owner is an editor, every editor a viewer\n\ndef check(user, relation, obj, lookups):\n    lookups[0] += 1\n    for subject in tuples.get((obj, relation), []):\n        if subject == user:\n            return True\n        if \"#\" in subject and check(user, subject.split(\"#\")[1], subject.split(\"#\")[0], lookups):\n            return True                          # a member of a group that holds the relation\n    if any(check(user, stronger, obj, lookups) for stronger in IMPLIED.get(relation, [])):\n        return True\n    if relation == \"viewer\":                     # whoever can view a folder can view what's in it\n        return any(check(user, \"viewer\", parent, lookups) for parent in tuples.get((obj, \"parent\"), []))\n    return False\n\nfor user, relation, obj in ((\"ben\", \"viewer\", \"doc:roadmap\"), (\"ben\", \"editor\", \"doc:roadmap\"),\n                            (\"ana\", \"viewer\", \"doc:roadmap\"), (\"dan\", \"viewer\", \"doc:salaries\"), (\"ben\", \"viewer\", \"doc:salaries\")):\n    lookups = [0]\n    print(f\"{user} {relation} {obj}: {'allowed' if check(user, relation, obj, lookups) else 'denied'} ({lookups[0]} lookups)\")\n\nroles = {\"ben\": [\"engineer\"], \"dan\": [\"hr\"]}\ngrants = {\"engineer\": {\"view:doc\"}, \"hr\": {\"view:doc\"}}   # role-based: permissions per type of object, not per object\nprint(\"roles only: ben view doc:salaries:\", \"allowed\" if any(\"view:doc\" in grants[r] for r in roles[\"ben\"]) else \"denied\")\n","out":"ben viewer doc:roadmap: allowed (5 lookups)\nben editor doc:roadmap: denied (2 lookups)\nana viewer doc:roadmap: allowed (3 lookups)\ndan viewer doc:salaries: allowed (5 lookups)\nben viewer doc:salaries: denied (7 lookups)\nroles only: ben view doc:salaries: allowed\n","notes":[[11,"Relations imply each other: owners can edit, and editors can view."],[18,"A subject such as group:eng#member means 'every member of group:eng', so access can be granted to groups."],[23,"Viewing a folder means viewing everything inside it; Zanzibar, OpenFGA and SpiceDB declare rules like this in a schema."],[29,"Each check asks about one user, one relation and one object: exactly the object-level question that vulnerable APIs forget to ask."],[33,"A role grants view:doc on every document; it can't say 'this folder, shared with that group', so ben could read the salaries."]]},{"lang":"javascript","src":"const tuples = new Map([                         // \"object relation\" -> subjects: users, or \"object#relation\" groups\n  [\"doc:roadmap owner\", [\"ana\"]],\n  [\"doc:roadmap parent\", [\"folder:plans\"]],\n  [\"folder:plans viewer\", [\"group:eng#member\"]],\n  [\"group:eng member\", [\"ben\", \"dev\"]],\n  [\"doc:salaries owner\", [\"cara\"]],\n  [\"doc:salaries parent\", [\"folder:hr\"]],\n  [\"folder:hr viewer\", [\"group:hr#member\"]],\n  [\"group:hr member\", [\"cara\", \"dan\"]],\n]);\nconst IMPLIED = { viewer: [\"editor\"], editor: [\"owner\"] };   // every owner is an editor, every editor a viewer\n\nfunction check(user, relation, obj, lookups) {\n  lookups.count++;\n  for (const subject of tuples.get(`${obj} ${relation}`) ?? []) {\n    if (subject === user) return true;\n    if (subject.includes(\"#\") && check(user, subject.split(\"#\")[1], subject.split(\"#\")[0], lookups)) return true;   // a member of a group that holds the relation\n  }\n  if ((IMPLIED[relation] ?? []).some(stronger => check(user, stronger, obj, lookups))) return true;\n  if (relation === \"viewer\") {                   // whoever can view a folder can view what's in it\n    return (tuples.get(`${obj} parent`) ?? []).some(parent => check(user, \"viewer\", parent, lookups));\n  }\n  return false;\n}\n\nfor (const [user, relation, obj] of [[\"ben\", \"viewer\", \"doc:roadmap\"], [\"ben\", \"editor\", \"doc:roadmap\"],\n                                     [\"ana\", \"viewer\", \"doc:roadmap\"], [\"dan\", \"viewer\", \"doc:salaries\"], [\"ben\", \"viewer\", \"doc:salaries\"]]) {\n  const lookups = { count: 0 };\n  console.log(`${user} ${relation} ${obj}: ${check(user, relation, obj, lookups) ? \"allowed\" : \"denied\"} (${lookups.count} lookups)`);\n}\n\nconst roles = { ben: [\"engineer\"], dan: [\"hr\"] };\nconst grants = { engineer: new Set([\"view:doc\"]), hr: new Set([\"view:doc\"]) };   // role-based: permissions per type of object, not per object\nconsole.log(\"roles only: ben view doc:salaries:\", roles.ben.some(r => grants[r].has(\"view:doc\")) ? \"allowed\" : \"denied\");\n","out":"ben viewer doc:roadmap: allowed (5 lookups)\nben editor doc:roadmap: denied (2 lookups)\nana viewer doc:roadmap: allowed (3 lookups)\ndan viewer doc:salaries: allowed (5 lookups)\nben viewer doc:salaries: denied (7 lookups)\nroles only: ben view doc:salaries: allowed\n","notes":[[11,"Relations imply each other: owners can edit, and editors can view."],[17,"A subject such as group:eng#member means 'every member of group:eng', so access can be granted to groups."],[21,"Viewing a folder means viewing everything inside it; Zanzibar, OpenFGA and SpiceDB declare rules like this in a schema."],[29,"Each check asks about one user, one relation and one object: exactly the object-level question that vulnerable APIs forget to ask."],[34,"A role grants view:doc on every document; it can't say 'this folder, shared with that group', so ben could read the salaries."]]}]},{"t":"Envelope encryption, key rotation and crypto-shredding","tabs":[{"lang":"python","src":"import os\nfrom cryptography.exceptions import InvalidTag\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM   # pip install cryptography\n\ndef seal(key, plaintext, aad):                     # AES-256-GCM: nonce + ciphertext + 16-byte tag\n    nonce = os.urandom(12)\n    return nonce + AESGCM(key).encrypt(nonce, plaintext, aad)\n\ndef unseal(key, blob, aad):\n    return AESGCM(key).decrypt(blob[:12], blob[12:], aad)   # raises InvalidTag if anything was changed\n\nclass KMS:                                         # stands in for a cloud KMS or an HSM: master keys never leave it\n    def __init__(self):\n        self.masters, self.current, self.calls = {\"v1\": AESGCM.generate_key(bit_length=256)}, \"v1\", 0\n\n    def wrap(self, data_key):\n        self.calls += 1\n        return self.current, seal(self.masters[self.current], data_key, b\"data key\")\n\n    def unwrap(self, version, wrapped):\n        self.calls += 1\n        return unseal(self.masters[version], wrapped, b\"data key\")\n\n    def rotate(self):\n        self.current = f\"v{len(self.masters) + 1}\"\n        self.masters[self.current] = AESGCM.generate_key(bit_length=256)\n\nkms, wrapped_keys, rows = KMS(), {}, []\nfor tenant in (\"alpha\", \"beta\", \"gamma\"):\n    data_key = AESGCM.generate_key(bit_length=256)         # one data key per tenant\n    wrapped_keys[tenant] = kms.wrap(data_key)              # only the wrapped copy is stored\n    for i in range(1000):\n        aad = f\"{tenant}/{i}\".encode()                     # binds each ciphertext to its tenant and row\n        rows.append((tenant, i, seal(data_key, f\"order {i} for {tenant}\".encode(), aad)))\nprint(f\"{len(rows)} rows encrypted for 3 tenants with {kms.calls} KMS calls\")\n\ndef read(tenant, i, blob):\n    data_key = kms.unwrap(*wrapped_keys[tenant])\n    return unseal(data_key, blob, f\"{tenant}/{i}\".encode()).decode()\n\ntenant, i, blob = rows[7]\ntampered = blob[:20] + bytes([blob[20] ^ 1]) + blob[21:]\nfor label, attempt in ((\"one bit flipped\", lambda: read(tenant, i, tampered)),\n                       (\"alpha's row presented as beta's\", lambda: read(\"beta\", i, blob))):\n    try:\n        attempt()\n        print(f\"{label}: accepted\")\n    except InvalidTag:\n        print(f\"{label}: rejected\")\n\nkms.rotate()\nfor t, (version, wrapped) in wrapped_keys.items():\n    wrapped_keys[t] = kms.wrap(kms.unwrap(version, wrapped))   # re-wrap 32-byte keys, not 3,000 rows\nprint(\"master key rotated: 3 data keys re-wrapped, 0 rows re-encrypted; all rows readable:\",\n      \"yes\" if all(read(t, n, b) == f\"order {n} for {t}\" for t, n, b in rows) else \"no\")\n\ndel wrapped_keys[\"beta\"]                                   # crypto-shredding: destroy beta's only key\nreadable = sum(1 for t, n, b in rows if t in wrapped_keys and read(t, n, b))\nprint(f\"beta's key destroyed: {readable} rows still readable, beta's 1000 gone, backups included\")\n","out":"3000 rows encrypted for 3 tenants with 3 KMS calls\none bit flipped: rejected\nalpha's row presented as beta's: rejected\nmaster key rotated: 3 data keys re-wrapped, 0 rows re-encrypted; all rows readable: yes\nbeta's key destroyed: 2000 rows still readable, beta's 1000 gone, backups included\n","notes":[[10,"GCM authenticates as well as encrypts: any change to the ciphertext or its associated data makes decryption fail."],[18,"Only wrapped data keys leave the KMS; the master key never does, and every unwrap is access-checked and logged."],[33,"Associated data ties each ciphertext to its tenant and row, so a row can't be copied into another tenant's record."],[38,"Real services cache unwrapped data keys briefly instead of calling the KMS on every read."],[53,"Rotating the master key re-wraps a few 32-byte keys instead of re-encrypting every row."],[57,"Destroying a tenant's only key deletes their data everywhere it was copied, backups included: crypto-shredding."]]},{"lang":"javascript","src":"function seal(key, plaintext, aad) {               // AES-256-GCM: nonce + ciphertext + 16-byte tag\n  const nonce = crypto.randomBytes(12);\n  const cipher = crypto.createCipheriv(\"aes-256-gcm\", key, nonce);\n  cipher.setAAD(aad);\n  return Buffer.concat([nonce, cipher.update(plaintext), cipher.final(), cipher.getAuthTag()]);\n}\n\nfunction unseal(key, blob, aad) {\n  const decipher = crypto.createDecipheriv(\"aes-256-gcm\", key, blob.subarray(0, 12));\n  decipher.setAAD(aad);\n  decipher.setAuthTag(blob.subarray(blob.length - 16));\n  return Buffer.concat([decipher.update(blob.subarray(12, blob.length - 16)), decipher.final()]);   // throws if anything was changed\n}\n\nclass KMS {                                        // stands in for a cloud KMS or an HSM: master keys never leave it\n  constructor() { this.masters = { v1: crypto.randomBytes(32) }; this.current = \"v1\"; this.calls = 0; }\n\n  wrap(dataKey) {\n    this.calls++;\n    return [this.current, seal(this.masters[this.current], dataKey, Buffer.from(\"data key\"))];\n  }\n\n  unwrap(version, wrapped) {\n    this.calls++;\n    return unseal(this.masters[version], wrapped, Buffer.from(\"data key\"));\n  }\n\n  rotate() {\n    this.current = `v${Object.keys(this.masters).length + 1}`;\n    this.masters[this.current] = crypto.randomBytes(32);\n  }\n}\n\nconst kms = new KMS(), wrappedKeys = new Map(), rows = [];\nfor (const tenant of [\"alpha\", \"beta\", \"gamma\"]) {\n  const dataKey = crypto.randomBytes(32);              // one data key per tenant\n  wrappedKeys.set(tenant, kms.wrap(dataKey));          // only the wrapped copy is stored\n  for (let i = 0; i < 1000; i++) {\n    const aad = Buffer.from(`${tenant}/${i}`);         // binds each ciphertext to its tenant and row\n    rows.push([tenant, i, seal(dataKey, Buffer.from(`order ${i} for ${tenant}`), aad)]);\n  }\n}\nconsole.log(`${rows.length} rows encrypted for 3 tenants with ${kms.calls} KMS calls`);\n\nfunction read(tenant, i, blob) {\n  const dataKey = kms.unwrap(...wrappedKeys.get(tenant));\n  return unseal(dataKey, blob, Buffer.from(`${tenant}/${i}`)).toString();\n}\n\nconst [tenant, i, blob] = rows[7];\nconst tampered = Buffer.from(blob);\ntampered[20] ^= 1;\nfor (const [label, attempt] of [[\"one bit flipped\", () => read(tenant, i, tampered)],\n                                [\"alpha's row presented as beta's\", () => read(\"beta\", i, blob)]]) {\n  try {\n    attempt();\n    console.log(`${label}: accepted`);\n  } catch {\n    console.log(`${label}: rejected`);\n  }\n}\n\nkms.rotate();\nfor (const [t, [version, wrapped]] of wrappedKeys) wrappedKeys.set(t, kms.wrap(kms.unwrap(version, wrapped)));   // re-wrap 32-byte keys, not 3,000 rows\nconsole.log(\"master key rotated: 3 data keys re-wrapped, 0 rows re-encrypted; all rows readable:\",\n  rows.every(([t, n, b]) => read(t, n, b) === `order ${n} for ${t}`) ? \"yes\" : \"no\");\n\nwrappedKeys.delete(\"beta\");                            // crypto-shredding: destroy beta's only key\nconst readable = rows.filter(([t, n, b]) => wrappedKeys.has(t) && read(t, n, b)).length;\nconsole.log(`beta's key destroyed: ${readable} rows still readable, beta's 1000 gone, backups included`);\n","out":"3000 rows encrypted for 3 tenants with 3 KMS calls\none bit flipped: rejected\nalpha's row presented as beta's: rejected\nmaster key rotated: 3 data keys re-wrapped, 0 rows re-encrypted; all rows readable: yes\nbeta's key destroyed: 2000 rows still readable, beta's 1000 gone, backups included\n","notes":[[12,"GCM authenticates as well as encrypts: any change to the ciphertext or its associated data makes decryption fail."],[20,"Only wrapped data keys leave the KMS; the master key never does, and every unwrap is access-checked and logged."],[39,"Associated data ties each ciphertext to its tenant and row, so a row can't be copied into another tenant's record."],[46,"Real services cache unwrapped data keys briefly instead of calling the KMS on every read."],[64,"Rotating the master key re-wraps a few 32-byte keys instead of re-encrypting every row."],[68,"Destroying a tenant's only key deletes their data everywhere it was copied, backups included: crypto-shredding."]]}]}],"ex":{"q":"An attacker steals a bearer access token at a random moment. Half the time the theft is spotted by anomaly detection within 10 minutes; otherwise a person notices within a day. Compare four designs: 8-hour server-side sessions, JWTs lasting 60 minutes, JWTs lasting 5 minutes, and 60-minute JWTs checked against a deny list. How long can the attacker use the token on average, and what does each design cost?","steps":["A server-side session dies the moment it's deleted, but only after someone notices the theft. A self-contained JWT can't be deleted: it works until it expires, whatever anyone notices.","So two clocks race: the token's remaining lifetime, and the time to detect and revoke. Sessions and deny lists take whichever ends first; plain JWTs only get the lifetime.","Simulate 10,000 thefts at random points in each token's life, with the two-speed detection, and average the usable time.","Then add the costs: a store lookup per request for sessions, a cached deny-list lookup for the hybrid, and refreshes to the identity provider, which grow as lifetimes shrink."],"code":{"t":"How long a stolen token stays useful","tabs":[{"lang":"python","src":"rand = mulberry32(42)\nthefts = []\nfor _ in range(10_000):\n    position = rand()                                  # how far through the token's life the theft happens\n    if rand() < 0.5:\n        detected = 60 + int(rand() * 540)              # anomaly detection: 1 to 10 minutes, in seconds\n    else:\n        detected = 3600 + int(rand() * 82_800)         # noticed by a person: 1 to 24 hours\n    thefts.append((position, detected))\n\ndef usable_seconds(design, lifetime_s, position, detected):\n    remaining = int(lifetime_s * (1 - position))       # what's left of the stolen token's life\n    if design == \"session\":\n        return min(remaining, detected)                # the server deletes the session once the theft is noticed\n    if design == \"jwt + deny list\":\n        return min(remaining, detected + 30)           # the token id is denied everywhere within 30 s\n    return remaining                                   # a plain JWT stays valid until it expires\n\ndesigns = ((\"server-side session, 8 h\", \"session\", 8 * 3600, \"1 store lookup\", 0),\n           (\"JWT, 60 min\", \"jwt\", 3600, \"none\", 1),\n           (\"JWT, 5 min\", \"jwt\", 300, \"none\", 12),\n           (\"JWT, 60 min + deny list\", \"jwt + deny list\", 3600, \"1 cached lookup\", 1))\nfor label, design, lifetime, lookups, refreshes in designs:\n    total = sum(usable_seconds(design, lifetime, p, d) for p, d in thefts)\n    tenths = total * 10 // len(thefts) // 60           # average minutes, to one decimal\n    print(f\"{label}: a stolen token works for {tenths // 10}.{tenths % 10} min on average; \"\n          f\"per request: {lookups}; refreshes per user-hour: {refreshes}\")\n","out":"server-side session, 8 h: a stolen token works for 113.9 min on average; per request: 1 store lookup; refreshes per user-hour: 0\nJWT, 60 min: a stolen token works for 29.8 min on average; per request: none; refreshes per user-hour: 1\nJWT, 5 min: a stolen token works for 2.4 min on average; per request: none; refreshes per user-hour: 12\nJWT, 60 min + deny list: a stolen token works for 17.8 min on average; per request: 1 cached lookup; refreshes per user-hour: 1\n"},{"lang":"javascript","src":"const rand = mulberry32(42);\nconst thefts = [];\nfor (let i = 0; i < 10000; i++) {\n  const position = rand();                             // how far through the token's life the theft happens\n  const detected = rand() < 0.5\n    ? 60 + Math.floor(rand() * 540)                    // anomaly detection: 1 to 10 minutes, in seconds\n    : 3600 + Math.floor(rand() * 82800);               // noticed by a person: 1 to 24 hours\n  thefts.push([position, detected]);\n}\n\nfunction usableSeconds(design, lifetimeS, position, detected) {\n  const remaining = Math.floor(lifetimeS * (1 - position));   // what's left of the stolen token's life\n  if (design === \"session\") return Math.min(remaining, detected);   // the server deletes the session once the theft is noticed\n  if (design === \"jwt + deny list\") return Math.min(remaining, detected + 30);   // the token id is denied everywhere within 30 s\n  return remaining;                                    // a plain JWT stays valid until it expires\n}\n\nconst designs = [[\"server-side session, 8 h\", \"session\", 8 * 3600, \"1 store lookup\", 0],\n                 [\"JWT, 60 min\", \"jwt\", 3600, \"none\", 1],\n                 [\"JWT, 5 min\", \"jwt\", 300, \"none\", 12],\n                 [\"JWT, 60 min + deny list\", \"jwt + deny list\", 3600, \"1 cached lookup\", 1]];\nfor (const [label, design, lifetime, lookups, refreshes] of designs) {\n  const total = thefts.reduce((sum, [p, d]) => sum + usableSeconds(design, lifetime, p, d), 0);\n  const tenths = Math.floor(Math.floor(total * 10 / thefts.length) / 60);   // average minutes, to one decimal\n  console.log(`${label}: a stolen token works for ${Math.floor(tenths / 10)}.${tenths % 10} min on average; ` +\n              `per request: ${lookups}; refreshes per user-hour: ${refreshes}`);\n}\n","out":"server-side session, 8 h: a stolen token works for 113.9 min on average; per request: 1 store lookup; refreshes per user-hour: 0\nJWT, 60 min: a stolen token works for 29.8 min on average; per request: none; refreshes per user-hour: 1\nJWT, 5 min: a stolen token works for 2.4 min on average; per request: none; refreshes per user-hour: 12\nJWT, 60 min + deny list: a stolen token works for 17.8 min on average; per request: 1 cached lookup; refreshes per user-hour: 1\n"}]},"a":"Revocation only helps once someone notices. Eight-hour sessions can be killed instantly, yet a stolen one works for almost two hours on average, because half the thefts go unnoticed for hours. A 5-minute JWT caps every theft at 5 minutes without any lookups, at the price of 12 refreshes per user-hour to the identity provider. The deny list helps only for the half of thefts that detection catches quickly. That's why the common design is short-lived access tokens, refresh tokens that rotate on each use and can be revoked, and a deny list only for high-risk actions."},"fade":{"q":"Finish `verify(token, key, audience, issuer, now)`: the signature check is done; add the checks that real token bugs come from. Reject any algorithm except HS256, tokens past their expiry (allowing `leeway` seconds of clock skew), tokens meant for another audience, and tokens from another issuer.","steps":["A valid signature proves the token was made by someone holding the key and hasn't been changed. It says nothing about whether it's still current, or meant for this API.",{"ask":"Why check the algorithm before the signature?","a":"The header is written by whoever made the token. If the verifier trusts it, an attacker can send alg none with no signature at all, or switch algorithms to confuse key handling. The verifier decides the algorithm."},{"ask":"Which claims must be checked, and why each?","a":"exp, so a stolen token stops working; aud, so a token issued for another service can't be replayed here; iss, so only your identity provider's tokens count. A small leeway absorbs clock differences between machines."},{"ask":"What does it cost?","a":"One HMAC and two JSON parses per request: microseconds, with no network call. Asymmetric algorithms (RS256, ES256) take a little longer to verify, but services then need only the public key."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def verify(token, key, audience, issuer, now, leeway=60):\n    parts = token.split(\".\")\n    if len(parts) != 3:\n        return \"malformed\"\n    head, body, signature = parts\n    header = json.loads(unb64url(head))\n    ...                                                # TODO: reject any algorithm except HS256\n    expected = b64url(hmac.new(key, f\"{head}.{body}\".encode(), hashlib.sha256).digest())\n    if not hmac.compare_digest(expected, signature):\n        return \"bad signature\"\n    claims = json.loads(unb64url(body))\n    ...                                                # TODO: expiry (with leeway), audience, issuer\n    return \"ok\"\n"},{"lang":"javascript","src":"function verify(token, key, audience, issuer, now, leeway = 60) {\n  const parts = token.split(\".\");\n  if (parts.length !== 3) return \"malformed\";\n  const [head, body, signature] = parts;\n  const header = JSON.parse(unb64url(head).toString());\n  // TODO: reject any algorithm except HS256\n  const expected = Buffer.from(b64url(crypto.createHmac(\"sha256\", key).update(`${head}.${body}`).digest()));\n  const given = Buffer.from(signature);\n  if (given.length !== expected.length || !crypto.timingSafeEqual(given, expected)) return \"bad signature\";\n  const claims = JSON.parse(unb64url(body).toString());\n  // TODO: expiry (with leeway), audience, issuer\n  return \"ok\";\n}\n"}]},"solution
