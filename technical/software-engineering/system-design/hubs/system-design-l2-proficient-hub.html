ink; pastes expire","1 million new pastes a day; reads under 100 ms; 99.9% available; a saved paste is never lost"],["Drives","The API and the data model","Caching, replication, partitioning, queues, regions"],["Often forgotten","Deletion, expiry, abuse limits","Durability, cost, privacy and compliance"]]},{"cap":"Questions for the first five minutes","head":["Topic","Question"],"rows":[["Users","Who uses it, and how many each day?"],["Features","Which features are in, and which are out?"],["Scale","How many reads and writes a day? How big is each item? How long is it kept?"],["Latency","What must feel instant, and what can take seconds?"],["Consistency","May a reader see slightly old data? For how long?"],["Availability","What happens if it's down for a minute? For an hour?"]]},{"cap":"Four classic designs, and where this hub covers them","head":["Design","The crux","Core pieces","Covered in"],"rows":[["Rate limiter","One limit shared by many servers, checked in about a millisecond","Token buckets in Redis, updated by an atomic script; 429 with Retry-After","Module 6"],["News feed","Fan-out: writing to millions of feeds, or reading from hundreds of accounts","Fan-out on write for most accounts, on read for celebrities; a feed cache","This module"],["Chat","Ordered, never-lost delivery to every device","WebSocket gateways, sequence numbers per conversation, store first, catch up on reconnect","Module 8"],["Notification service","Reliable delivery through slow providers, without duplicates or spam","A queue per channel, workers with retries and a dead-letter queue, idempotency keys, per-user limits","Modules 5 and 6"]]}],"code":[{"t":"Estimates that drive choices (the thresholds are rules of thumb, not measurements)","tabs":[{"lang":"python","src":"SECONDS_PER_DAY = 86_400\n\ndef human_bytes(n):\n    units, i = [\"B\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\"], 0\n    while n >= 1000 and i < len(units) - 1:\n        n /= 1000\n        i += 1\n    return f\"{int(n * 10 + 0.5) / 10:.1f} {units[i]}\"\n\ndef decide(dau, reads_per_user, writes_per_user, item_bytes, keep_days, peak=3, copies=3):\n    \"\"\"Peak reads/s, peak writes/s, database bytes, and the choices those numbers suggest.\"\"\"\n    reads = dau * reads_per_user * peak // SECONDS_PER_DAY\n    writes = dau * writes_per_user * peak // SECONDS_PER_DAY\n    db_bytes = dau * writes_per_user * item_bytes * keep_days * copies\n    choices = []\n    if item_bytes >= 10_000:\n        choices.append(\"object storage for the bodies\")\n        db_bytes = db_bytes * 200 // item_bytes  # only about 200 bytes of metadata per item stay in the database\n    if reads > 1_000:\n        choices.append(\"cache\")\n    if reads > 5_000:\n        choices.append(\"read replicas\")         # assumption: one database node serves ~5,000 simple reads/s\n    if writes > 1_000 or db_bytes > 2 * 10**12:\n        choices.append(\"partitioning\")          # assumption: ~1,000 writes/s or ~2 TB is comfortable on one node\n    return reads, writes, db_bytes, choices or [\"one database node\"]\n"},{"lang":"javascript","src":"const SECONDS_PER_DAY = 86400;\n\nfunction humanBytes(n) {\n  const units = [\"B\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\"];\n  let i = 0;\n  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }\n  return `${(Math.floor(n * 10 + 0.5) / 10).toFixed(1)} ${units[i]}`;\n}\n\nfunction decide(dau, readsPerUser, writesPerUser, itemBytes, keepDays, peak = 3, copies = 3) {\n  // peak reads/s, peak writes/s, database bytes, and the choices those numbers suggest\n  const reads = Math.floor((dau * readsPerUser * peak) / SECONDS_PER_DAY);\n  const writes = Math.floor((dau * writesPerUser * peak) / SECONDS_PER_DAY);\n  let dbBytes = dau * writesPerUser * itemBytes * keepDays * copies;\n  const choices = [];\n  if (itemBytes >= 10000) {\n    choices.push(\"object storage for the bodies\");\n    dbBytes = Math.floor((dbBytes * 200) / itemBytes);   // only about 200 bytes of metadata per item stay in the database\n  }\n  if (reads > 1000) choices.push(\"cache\");\n  if (reads > 5000) choices.push(\"read replicas\");       // assumption: one database node serves ~5,000 simple reads/s\n  if (writes > 1000 || dbBytes > 2e12) choices.push(\"partitioning\");   // assumption: ~1,000 writes/s or ~2 TB is comfortable on one node\n  return [reads, writes, dbBytes, choices.length ? choices : [\"one database node\"]];\n}\n"}]},{"t":"Numbers that drive choices","tabs":[{"lang":"python","src":"specs = {                                     # (daily users, reads and writes per user per day, bytes per item, days kept)\n    \"pastebin\": (2_000_000, 5, 1, 10_000, 365),\n    \"chat\": (50_000_000, 200, 40, 200, 365),\n    \"team wiki\": (20_000, 30, 2, 5_000, 1_825),\n}\nfor name, spec in specs.items():\n    reads, writes, db_bytes, choices = decide(*spec)\n    print(f\"{name}: reads/s {reads:,} | writes/s {writes:,} | database {human_bytes(db_bytes)} -> {', '.join(choices)}\")\n","out":"pastebin: reads/s 347 | writes/s 69 | database 438.0 GB -> object storage for the bodies\nchat: reads/s 347,222 | writes/s 69,444 | database 438.0 TB -> cache, read replicas, partitioning\nteam wiki: reads/s 20 | writes/s 1 | database 1.1 TB -> one database node\n","notes":[[2,"Big bodies move to object storage, so only small metadata rows stay in the database."],[3,"Hundreds of thousands of reads and tens of thousands of writes a second: this one needs every tool."],[4,"Twenty reads a second and about a terabyte: one database node (with a standby) is the right answer, and saying so is a strength."]]},{"lang":"javascript","src":"const specs = {                               // [daily users, reads and writes per user per day, bytes per item, days kept]\n  pastebin: [2000000, 5, 1, 10000, 365],\n  chat: [50000000, 200, 40, 200, 365],\n  \"team wiki\": [20000, 30, 2, 5000, 1825],\n};\nfor (const [name, spec] of Object.entries(specs)) {\n  const [reads, writes, dbBytes, choices] = decide(...spec);\n  console.log(`${name}: reads/s ${reads.toLocaleString(\"en-US\")} | writes/s ${writes.toLocaleString(\"en-US\")} | database ${humanBytes(dbBytes)} -> ${choices.join(\", \")}`);\n}\n","out":"pastebin: reads/s 347 | writes/s 69 | database 438.0 GB -> object storage for the bodies\nchat: reads/s 347,222 | writes/s 69,444 | database 438.0 TB -> cache, read replicas, partitioning\nteam wiki: reads/s 20 | writes/s 1 | database 1.1 TB -> one database node\n","notes":[[2,"Big bodies move to object storage, so only small metadata rows stay in the database."],[3,"Hundreds of thousands of reads and tens of thousands of writes a second: this one needs every tool."],[4,"Twenty reads a second and about a terabyte: one database node (with a standby) is the right answer, and saying so is a strength."]]}]},{"t":"From the API to the data model: does every query have a key or an index?","tabs":[{"lang":"python","src":"tables = {                                    # table -> (primary key, secondary indexes)\n    \"pastes\": (\"paste_id\", [\"user_id\"]),\n    \"users\": (\"user_id\", [\"email\"]),\n}\nqueries = [                                   # (what the API needs, table, the column it looks up by)\n    (\"GET /pastes/{id}\", \"pastes\", \"paste_id\"),\n    (\"GET /users/{id}/pastes\", \"pastes\", \"user_id\"),\n    (\"POST /login\", \"users\", \"email\"),\n    (\"expiry sweeper\", \"pastes\", \"expires_at\"),\n]\nfor api, table, column in queries:\n    pk, indexes = tables[table]\n    how = \"primary key\" if column == pk else \"index\" if column in indexes else \"FULL SCAN: add an index\"\n    print(f\"{api:<24}{table}.{column}: {how}\")\n","out":"GET /pastes/{id}        pastes.paste_id: primary key\nGET /users/{id}/pastes  pastes.user_id: index\nPOST /login             users.email: index\nexpiry sweeper          pastes.expires_at: FULL SCAN: add an index\n","notes":[[5,"List the access patterns from the API and the background jobs, not from the tables."],[9,"Background jobs have access patterns too: the sweeper needs an index on expires_at or it reads every paste."]]},{"lang":"javascript","src":"const tables = {                              // table -> [primary key, secondary indexes]\n  pastes: [\"paste_id\", [\"user_id\"]],\n  users: [\"user_id\", [\"email\"]],\n};\nconst queries = [                             // [what the API needs, table, the column it looks up by]\n  [\"GET /pastes/{id}\", \"pastes\", \"paste_id\"],\n  [\"GET /users/{id}/pastes\", \"pastes\", \"user_id\"],\n  [\"POST /login\", \"users\", \"email\"],\n  [\"expiry sweeper\", \"pastes\", \"expires_at\"],\n];\nfor (const [api, table, column] of queries) {\n  const [pk, indexes] = tables[table];\n  const how = column === pk ? \"primary key\" : indexes.includes(column) ? \"index\" : \"FULL SCAN: add an index\";\n  console.log(`${api.padEnd(24)}${table}.${column}: ${how}`);\n}\n","out":"GET /pastes/{id}        pastes.paste_id: primary key\nGET /users/{id}/pastes  pastes.user_id: index\nPOST /login             users.email: index\nexpiry sweeper          pastes.expires_at: FULL SCAN: add an index\n","notes":[[5,"List the access patterns from the API and the background jobs, not from the tables."],[9,"Background jobs have access patterns too: the sweeper needs an index on expires_at or it reads every paste."]]}]},{"t":"Walking requests through the design: what's on the critical path?","tabs":[{"lang":"python","src":"HOP_MS = {\"lb\": 1, \"app\": 4, \"cache\": 1, \"db read\": 5, \"db write\": 10, \"queue\": 2, \"email\": 300}   # rules of thumb\n\npaths = {\n    \"read, cache hit\": [\"lb\", \"app\", \"cache\"],\n    \"read, cache miss\": [\"lb\", \"app\", \"cache\", \"db read\"],\n    \"sign-up, email sent inline\": [\"lb\", \"app\", \"db write\", \"email\"],\n    \"sign-up, email queued\": [\"lb\", \"app\", \"db write\", \"queue\"],\n}\nfor name, hops in paths.items():\n    print(f\"{name}: {sum(HOP_MS[h] for h in hops)} ms\")\n","out":"read, cache hit: 6 ms\nread, cache miss: 11 ms\nsign-up, email sent inline: 315 ms\nsign-up, email queued: 17 ms\n","notes":[[1,"Rough per-hop costs: assumptions to state, then replace with measurements."],[6,"Sending the email inside the request makes every sign-up wait for a slow outside service; queuing it (module 5) takes it off the critical path."]]},{"lang":"javascript","src":"const HOP_MS = { lb: 1, app: 4, cache: 1, \"db read\": 5, \"db write\": 10, queue: 2, email: 300 };   // rules of thumb\n\nconst paths = {\n  \"read, cache hit\": [\"lb\", \"app\", \"cache\"],\n  \"read, cache miss\": [\"lb\", \"app\", \"cache\", \"db read\"],\n  \"sign-up, email sent inline\": [\"lb\", \"app\", \"db write\", \"email\"],\n  \"sign-up, email queued\": [\"lb\", \"app\", \"db write\", \"queue\"],\n};\nfor (const [name, hops] of Object.entries(paths)) console.log(`${name}: ${hops.reduce((t, h) => t + HOP_MS[h], 0)} ms`);\n","out":"read, cache hit: 6 ms\nread, cache miss: 11 ms\nsign-up, email sent inline: 315 ms\nsign-up, email queued: 17 ms\n","notes":[[1,"Rough per-hop costs: assumptions to state, then replace with measurements."],[6,"Sending the email inside the request makes every sign-up wait for a slow outside service; queuing it (module 5) takes it off the critical path."]]}]},{"t":"A news feed three ways: fan-out on write, on read, and the hybrid","tabs":[{"lang":"python","src":"class FeedService:\n    \"\"\"Home feeds built by pushing posts to followers (fan-out on write), pulling at read time, or both.\"\"\"\n    def __init__(self, follows, strategy, celebrity_min=3):\n        self.follows, self.strategy, self.celebrity_min = follows, strategy, celebrity_min\n        self.followers = {}\n        for user, accounts in follows.items():\n            for account in accounts:\n                self.followers.setdefault(account, []).append(user)\n        self.posts, self.feeds = {}, {}           # author -> their posts; user -> their precomputed feed\n        self.writes = self.reads = 0\n\n    def pushed(self, author):\n        if self.strategy == \"hybrid\":\n            return len(self.followers.get(author, [])) < self.celebrity_min   # celebrities are pulled instead\n        return self.strategy == \"write\"\n\n    def post(self, author, t, text):\n        self.posts.setdefault(author, []).append((t, text))\n        self.writes += 1\n        if self.pushed(author):\n            for follower in self.followers.get(author, []):\n                self.feeds.setdefault(follower, []).append((t, text))   # one write per follower\n                self.writes += 1\n\n    def home(self, user, k=3):\n        items = list(self.feeds.get(user, []))\n        self.reads += 1\n        for account in self.follows.get(user, []):\n            if not self.pushed(account):\n                items += self.posts.get(account, [])   # pulled and merged at read time\n                self.reads += 1\n        return [text for _, text in sorted(items, reverse=True)[:k]]\n\nfollows = {\"ana\": [\"kim\", \"bob\"], \"bob\": [\"kim\", \"ana\"], \"cy\": [\"kim\", \"ana\"], \"dev\": [\"kim\"]}   # kim is the celebrity\nfor strategy in (\"write\", \"read\", \"hybrid\"):\n    feeds = FeedService(follows, strategy)\n    for t, (author, text) in enumerate([(\"kim\", \"new album\"), (\"ana\", \"hello\"), (\"bob\", \"lunch?\"), (\"kim\", \"tour dates\")], 1):\n        feeds.post(author, t, f\"{author}: {text}\")\n    homes = {user: feeds.home(user) for user in follows}\n    print(f\"fan-out on {strategy}: {feeds.writes} writes, {feeds.reads} reads | ana sees\", \" / \".join(homes[\"ana\"]))\n","out":"fan-out on write: 15 writes, 4 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\nfan-out on read: 4 writes, 11 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\nfan-out on hybrid: 7 writes, 8 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\n","notes":[[14,"The hybrid pushes ordinary accounts' posts but pulls celebrities' at read time, the approach Twitter described for its home timelines."],[22,"Fan-out on write costs one write per follower: home reads become a single lookup, but one post by an account with 50 million followers means 50 million writes."],[30,"Fan-out on read writes each post once, but every home view merges the posts of everyone the user follows, which is expensive for the many reads."],[40,"The same feed three ways, at different costs. Feeds are read far more often than posts are written, so most systems push, and pull only for the accounts that would make pushing explode."]]},{"lang":"javascript","src":"class FeedService {\n  // home feeds built by pushing posts to followers (fan-out on write), pulling at read time, or both\n  constructor(follows, strategy, celebrityMin = 3) {\n    this.follows = follows; this.strategy = strategy; this.celebrityMin = celebrityMin;\n    this.followers = new Map();\n    for (const [user, accounts] of Object.entries(follows)) {\n      for (const account of accounts) {\n        if (!this.followers.has(account)) this.followers.set(account, []);\n        this.followers.get(account).push(user);\n      }\n    }\n    this.posts = new Map(); this.feeds = new Map();   // author -> their posts; user -> their precomputed feed\n    this.writes = 0; this.reads = 0;\n  }\n  pushed(author) {\n    if (this.strategy === \"hybrid\") return (this.followers.get(author) ?? []).length < this.celebrityMin;   // celebrities are pulled instead\n    return this.strategy === \"write\";\n  }\n  post(author, t, text) {\n    if (!this.posts.has(author)) this.posts.set(author, []);\n    this.posts.get(author).push([t, text]);\n    this.writes++;\n    if (this.pushed(author)) {\n      for (const follower of this.followers.get(author) ?? []) {\n        if (!this.feeds.has(follower)) this.feeds.set(follower, []);\n        this.feeds.get(follower).push([t, text]);   // one write per follower\n        this.writes++;\n      }\n    }\n  }\n  home(user, k = 3) {\n    let items = [...(this.feeds.get(user) ?? [])];\n    this.reads++;\n    for (const account of this.follows[user] ?? []) {\n      if (!this.pushed(account)) {\n        items = items.concat(this.posts.get(account) ?? []);   // pulled and merged at read time\n        this.reads++;\n      }\n    }\n    return items.sort((a, b) => b[0] - a[0]).slice(0, k).map(([, text]) => text);\n  }\n}\n\nconst follows = { ana: [\"kim\", \"bob\"], bob: [\"kim\", \"ana\"], cy: [\"kim\", \"ana\"], dev: [\"kim\"] };   // kim is the celebrity\nfor (const strategy of [\"write\", \"read\", \"hybrid\"]) {\n  const feeds = new FeedService(follows, strategy);\n  [[\"kim\", \"new album\"], [\"ana\", \"hello\"], [\"bob\", \"lunch?\"], [\"kim\", \"tour dates\"]].forEach(([author, text], i) => feeds.post(author, i + 1, `${author}: ${text}`));\n  const homes = Object.fromEntries(Object.keys(follows).map(user => [user, feeds.home(user)]));\n  console.log(`fan-out on ${strategy}: ${feeds.writes} writes, ${feeds.reads} reads | ana sees`, homes.ana.join(\" / \"));\n}\n","out":"fan-out on write: 15 writes, 4 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\nfan-out on read: 4 writes, 11 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\nfan-out on hybrid: 7 writes, 8 reads | ana sees kim: tour dates / bob: lunch? / kim: new album\n","notes":[[16,"The hybrid pushes ordinary accounts' posts but pulls celebrities' at read time, the approach Twitter described for its home timelines."],[26,"Fan-out on write costs one write per follower: home reads become a single lookup, but one post by an account with 50 million followers means 50 million writes."],[36,"Fan-out on read writes each post once, but every home view merges the posts of everyone the user follows, which is expensive for the many reads."],[49,"The same feed three ways, at different costs. Feeds are read far more often than posts are written, so most systems push, and pull only for the accounts that would make pushing explode."]]}]}],"ex":{"q":"Should a pastebin keep paste bodies in the database or in object storage? Weigh four criteria (cost 3, simplicity 2, read latency 2, room to grow 3), score each option from 1 to 5, and then find how much simplicity would have to matter for the database option to win.","steps":["Scores: bodies in the database are simple (5) and quick to read (4) but cost more per gigabyte (2) and grow badly (2); object storage is cheap (5) and grows without limit (5), with an extra call per read (3) and one more system to run (3).","Weighted totals: database 3 × 2 + 2 × 5 + 2 × 4 + 3 × 2 = 30; object storage 3 × 5 + 2 × 3 + 2 × 3 + 3 × 5 = 42. Object storage wins clearly.","Sensitivity: raise simplicity's weight until the database option wins. The totals are 20 + 5s and 36 + 3s, so the database wins only once s > 8, more than four times today's weight.","Only an unlikely change flips the result, so the choice is robust. The sums take O(criteria × options) time; the real work is scoring honestly and saying the result in one sentence."],"code":{"t":"A weighted decision, and what would flip it","tabs":[{"lang":"python","src":"def weighted_total(weights, scores):\n    return sum(weights[c] * scores[c] for c in weights)\n\nweights = {\"cost\": 3, \"simplicity\": 2, \"read latency\": 2, \"room to grow\": 3}\noptions = {\n    \"bodies in the database\": {\"cost\": 2, \"simplicity\": 5, \"read latency\": 4, \"room to grow\": 2},\n    \"bodies in object storage\": {\"cost\": 5, \"simplicity\": 3, \"read latency\": 3, \"room to grow\": 5},\n}\nfor name, scores in options.items():\n    print(name, weighted_total(weights, scores))\n\nw = dict(weights)                             # how much would simplicity have to matter?\nwhile weighted_total(w, options[\"bodies in the database\"]) <= weighted_total(w, options[\"bodies in object storage\"]):\n    w[\"simplicity\"] += 1\nprint(\"the database option wins once simplicity weighs\", w[\"simplicity\"])\n","out":"bodies in the database 30\nbodies in object storage 42\nthe database option wins once simplicity weighs 9\n"},{"lang":"javascript","src":"const weightedTotal = (weights, scores) => Object.keys(weights).reduce((t, c) => t + weights[c] * scores[c], 0);\n\nconst weights = { cost: 3, simplicity: 2, \"read latency\": 2, \"room to grow\": 3 };\nconst options = {\n  \"bodies in the database\": { cost: 2, simplicity: 5, \"read latency\": 4, \"room to grow\": 2 },\n  \"bodies in object storage\": { cost: 5, simplicity: 3, \"read latency\": 3, \"room to grow\": 5 },\n};\nfor (const [name, scores] of Object.entries(options)) console.log(name, weightedTotal(weights, scores));\n\nconst w = { ...weights };                     // how much would simplicity have to matter?\nwhile (weightedTotal(w, options[\"bodies in the database\"]) <= weightedTotal(w, options[\"bodies in object storage\"])) w.simplicity++;\nconsole.log(\"the database option wins once simplicity weighs\", w.simplicity);\n","out":"bodies in the database 30\nbodies in object storage 42\nthe database option wins once simplicity weighs 9\n"}]},"a":"Object storage scores 42 against the database's 30, and the database option would only win if simplicity weighed 9, more than four times its current weight. The choice is robust: keep the bodies in object storage and the metadata in the database."},"fade":{"q":"Write a tiny design review. A design lists its components with their number of copies, the calls between them with their timeouts (None or null for none), and the components a request can't succeed without. Finish `review(design)` so it returns the single points of failure (critical components with fewer than 2 copies, sorted) and the calls without a timeout.","steps":["A component is a single point of failure if requests fail without it and it has only one copy.",{"ask":"Why isn't the single cache node a single point of failure here?","a":"With cache-aside, reads fall back to the database when the cache is down: slower, but still working. It's on the path but not critical, as long as the database can take the extra load for a while."},{"ask":"Why flag calls without a timeout?","a":"A dependency that hangs ties up a worker for every request until the server runs out of workers (Little's law, L1 module 2). A timeout turns a hang into a fast error that can be retried or handled."},{"ask":"What does the review cost?","a":"O(components + calls) time and memory. The hard part is describing the design honestly, not running the check."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def review(design):\n    \"\"\"Returns (sorted single points of failure, list of \"a -> b\" calls without a timeout).\"\"\"\n    ...                                       # TODO: critical components with < 2 copies; calls whose timeout is None\n"},{"lang":"javascript","src":"function review(design) {\n  // returns [sorted single points of failure, list of \"a -> b\" calls without a timeout]\n  // TODO: critical components with < 2 copies; calls whose timeout is null\n}\n"}]},"solution":{"t":"Solution: two simple scans","tabs":[{"lang":"python","src":"def review(design):\n    \"\"\"Returns (sorted single points of failure, list of \"a -> b\" calls without a timeout).\"\"\"\n    copies = design[\"components\"]\n    spofs = sorted(name for name in design[\"critical\"] if copies[name] < 2)\n    no_timeout = [f\"{a} -> {b}\" for a, b, timeout in design[\"calls\"] if timeout is None]\n    return spofs, no_timeout\n\ndesign = {\n    \"components\": {\"lb\": 2, \"api\": 3, \"cache\": 1, \"db\": 1, \"payments\": 2},   # name -> copies\n    \"calls\": [(\"lb\", \"api\", 2_000), (\"api\", \"cache\", 50), (\"api\", \"db\", None), (\"api\", \"payments\", None)],\n    \"critical\": {\"lb\", \"api\", \"db\", \"payments\"},                              # requests fail without these\n}\nspofs, no_timeout = review(design)\nprint(\"single points of failure:\", *spofs)\nprint(\"calls without a timeout:\", \", \".join(no_timeout))\n","out":"single points of failure: db\ncalls without a timeout: api -> db, api -> payments\n"},{"lang":"javascript","src":"function review(design) {\n  // returns [sorted single points of failure, list of \"a -> b\" calls without a timeout]\n  const copies = design.components;\n  const spofs = [...design.critical].filter(name => copies[name] < 2).sort();\n  const noTimeout = design.calls.filter(([, , timeout]) => timeout === null).map(([a, b]) => `${a} -> ${b}`);\n  return [spofs, noTimeout];\n}\n\nconst design = {\n  components: { lb: 2, api: 3, cache: 1, db: 1, payments: 2 },   // name -> copies\n  calls: [[\"lb\", \"api\", 2000], [\"api\", \"cache\", 50], [\"api\", \"db\", null], [\"api\", \"payments\", null]],\n  critical: new Set([\"lb\", \"api\", \"db\", \"payments\"]),             // requests fail without these\n};\nconst [spofs, noTimeout] = review(design);\nconsole.log(\"single points of failure:\", ...spofs);\nconsole.log(\"calls without a timeout:\", noTimeout.join(\", \"));\n","out":"single points of failure: db\ncalls without a timeout: api -> db, api -> payments\n"}]}},"traps":[["“Start drawing boxes straight away.”","Without requirements and numbers the design has nothing to be right about. Spend the first minutes on scope, non-functional needs and estimates; they decide whether you need a cache, partitioning or a queue."],["“Non-functional requirements are optional extras.”","Latency, availability, consistency and durability targets shape a design more than its features do: “messages are never lost” and “a feed may be a minute stale” lead to very different systems."],["“Design for a billion users from day one.”","Design for the stated scale with room to grow, and say what you'd change at 10× and 100×. Complexity that the numbers don't justify costs money and time, and interviewers notice."],["“A single cache node is a single point of failure.”","Only if requests fail without it. With cache-aside, a cache outage makes reads slower, not impossible, provided the database can take the extra load for a while."],["“There's one right answer.”","There are several defensible designs. What's judged is whether each choice follows from the requirements and whether you can say what it costs."],["“Deep dives should cover everything.”","Time is short: pick the one or two parts that are hardest or riskiest for this product, such as fan-out for a feed or ordering for chat, and go deep there."]],"disc":[["How do you run the 45 minutes of a design interview?","About 5 minutes on requirements and scope, 5 on estimates, 5 on the API and data model, 10 to 15 on the high-level design with one request walked through it, 10 to 15 on one or two deep dives, and the last few minutes on failures, monitoring and trade-offs. Say the plan out loud at the start, and check in with the interviewer at each step, because they often want to steer the deep dives."],["How would you build home feeds for a social network where a few accounts have 50 million followers?","Push most posts into followers' precomputed feeds (fan-out on write, done asynchronously by queue workers), because feeds are read far more often than posts are written. For accounts above a follower threshold, don't push: merge their recent posts in at read time, from a cache. Keep only a few hundred items per feed in memory, rebuild a feed from the posts store when it's missing, and skip pushing to followers who haven't been active for weeks."],["How do you decide between two designs when both could work?","List what matters for this product, weigh it, and score each option honestly; then ask what would flip the decision. If only an unlikely change would flip it, the choice is robust. Then say it in one sentence: “Bodies go in object storage because cost and growth matter most here; if pastes were tiny and few, keeping them in the database would be simpler.”"]],"teach":{"prompt":"Explain to a junior colleague the steps you'd follow to answer “design a pastebin”.","rubric":["Clarify functional and non-functional requirements, and what's out of scope","Estimate, and let the numbers decide (cache, object storage, partitioning)","API first, then a data model with a key or index for every access pattern","A high-level design with a request walked through, then a deep dive","Single points of failure, timeouts, monitoring, and trade-offs said out loud"],"model":"I'd start by agreeing the scope: anyone can create a paste and read it by link, pastes expire, and accounts and editing are out. Then the non-functional side: say 2 million new pastes a day, five reads each, bodies up to about 10 KB, kept for a year, reads under 100 ms, and no saved paste ever lost. A quick estimate gives a few hundred reads a second at the peak and tens of terabytes of bodies over a year, so the bodies go to object storage and the database keeps small metadata rows. The API is POST /pastes and GET /pastes/{id}, and the data model needs the paste id as the key plus an index on the expiry time for the clean-up job. I'd draw the path through a load balancer, stateless API servers, a cache for hot pastes, the database and object storage, and walk a read through it. My deep dive would be expiry and abuse limits. I'd finish with single points of failure, timeouts, the four golden signals, and why I chose each part."},"qa":[["Functional or non-functional requirements?","What the system does, against how well it does it: scale, latency, availability, consistency, durability, cost."],["Why estimate before designing?","The numbers decide whether you need a cache, replicas, partitioning, a CDN or a queue."],["Where does the data model come from?","From the access patterns in the API and background jobs: every query needs a key or an index."],["What is a single point of failure?","A component that requests can't succeed without and that has only one copy."],["The four golden signals?","Latency, traffic, errors and saturation."],["How do you state a trade-off?","What you chose, what it cost, and what would make you choose differently."]],"quiz":[{"q":"What does this print? (`decide` is this module's helper: peak reads/s, peak writes/s, database bytes and choices.)","snip":{"t":"A spec through decide","tabs":[{"lang":"python","src":"reads, writes, db_bytes, choices = decide(1_000_000, 50, 2, 1_000, 365)\nprint(reads, writes, *choices, sep=\" | \")\n"},{"lang":"javascript","src":"const [reads, writes, dbBytes, choices] = decide(1000000, 50, 2, 1000, 365);\nconsole.log([reads, writes, ...choices].join(\" | \"));\n"}]},"o":["1736 | 69 | cache | partitioning","1736 | 69 | cache","578 | 23 | one database node","1736 | 69 | cache | read replicas | partitioning"],"a":0,"e":"Peak reads are 1,000,000 × 50 × 3 ÷ 86,400 ≈ 1,736 a second, enough for a cache but not replicas; writes are about 69 a second; and storage is 1,000,000 × 2 × 1 KB × 365 × 3 copies ≈ 2.2 TB, just over the 2 TB assumption, so partitioning (or a bigger node, or shorter retention)."},{"q":"What does this print?","snip":{"t":"Two options, two criteria","tabs":[{"lang":"python","src":"w = {\"latency\": 3, \"cost\": 1}\na, b = {\"latency\": 5, \"cost\": 1}, {\"latency\": 2, \"cost\": 5}\ntotal = lambda s: sum(w[k] * s[k] for k in w)\nprint(total(a), total(b), \"a\" if total(a) > total(b) else \"b\")\n"},{"lang":"javascript","src":"const w = { latency: 3, cost: 1 };\nconst a = { latency: 5, cost: 1 }, b = { latency: 2, cost: 5 };\nconst total = s => Object.keys(w).reduce((t, k) => t + w[k] * s[k], 0);\nconsole.log(total(a), total(b), total(a) > total(b) ? \"a\" : \"b\");\n"}]},"o":["16 11 a","6 7 b","16 11 b","11 16 b"],"a":0,"e":"a scores 3 × 5 + 1 × 1 = 16 and b scores 3 × 2 + 1 × 5 = 11. With latency weighted three times as heavily as cost, a wins."},{"q":"An interviewer says “design a photo-sharing app”. What should you do first?","o":["Agree the scope and the non-functional requirements (users, scale, latency, consistency), then estimate","Draw the load balancer, servers and database straight away","Pick a database product and explain why it's the best","Start with the deep dive into the image pipeline"],"a":0,"e":"Everything later depends on the requirements and numbers. Boxes, products and deep dives chosen before them have nothing to be right about."},{"q":"Which are non-functional requirements? (choose 2)","t":"ms","o":["99.9% of feed loads finish in under 300 ms","A message is never lost once the server has acknowledged it","Users can follow other users","Users can upload a profile photo","Each post shows a like button"],"a":[0,1],"e":"Latency and durability targets describe how well the system works. Following, uploading and liking are features: functional requirements."},{"q":"Judge each statement.","t":"yn","s":[["With cache-aside, a single cache node isn't necessarily a single point of failure.",true],["Every query the API needs should be served by a primary key or an index.",true],["A design for the stated scale should also say what would change at 10× the traffic.",true],["Deep dives should give every component equal time.",false]],"e":"Reads fall back to the database when a cache-aside cache fails. Queries without a key or index scan everything. Saying what changes at 10× shows the design can grow. And deep dives go where the risk is."},{"q":"Put these design steps in order.","t":"ord","items":["Clarify the requirements and the scale","Estimate traffic and storage","Draw the high-level design that those numbers call for","Deep-dive into the riskiest component"],"e":"The estimates need the scale from the requirements, the design needs the estimates, and you can only pick the riskiest component once the design exists."},{"q":"Complete the Python function that lists single points of failure.","t":"drop","lang":"python","code":"def single_points(components, critical):\n    return sorted(n for n in {{0}} if components[n] {{1}})\n","blanks":[{"o":["critical","components","sorted(components)","components.values()"],"a":0},{"o":["< 2","> 1","== 2",">= 1"],"a":0}],"e":"Only components that requests can't succeed without count, and only those with a single copy, so loop over the critical set and keep copies < 2."},{"q":"Match each item to the step of the routine it belongs to.","t":"match","pairs":[["About 3,000 reads a second at the peak","Estimate"],["POST /pastes returns an id","API"],["pastes(paste_id, user_id, expires_at) with an index on expires_at","Data model"],["Reads finish in under 200 ms at the 99th percentile","Non-functional requirement"]],"extra":["Deep dive"],"e":"A deep dive is a stage of the interview, not an artefact like these four."}],"probs":[["Exercise · Design a pastebin end to end","https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/pastebin/README.md","","do it yourself with this module's routine first, then compare with the primer's write-up and list what you'd change"],["Exercise · Write a one-page design doc","https://www.industrialempathy.com/posts/design-docs-at-google/","","read how design docs are structured at Google, then write one for the pastebin with goals and non-goals"],["Exercise · Choose what to monitor","https://sre.google/sre-book/monitoring-distributed-systems/","","read the four golden signals and list the graphs and alerts you'd set up for the pastebin"],["Exercise · Design a home timeline","https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md","","design it with this module's routine and the fan-out code, then compare with the primer's solution"]],"src":[["Google SRE book: Monitoring distributed systems","https://sre.google/sre-book/monitoring-distributed-systems/"],["Malte Ubl: Design docs at Google","https://www.industrialempathy.com/posts/design-docs-at-google/"],["System Design Primer","https://github.com/donnemartin/system-design-primer"],["System Design Primer: Design the Twitter timeline and search","https://github.com/donnemartin/system-design-primer/blob/master/solutions/system_design/twitter/README.md"],["Google SRE book: Service level objectives","https://sre.google/sre-book/service-level-objectives/"]]}],"plan":[{"t":"Data across machines","blocks":[{"id":"t-diag","label":"Take the diagnostic (Start tab)","min":20,"kind":"Task","go":"start"},{"id":"t-setup","label":"Set up: a sd-l2/ folder with python/ and js/; pytest and node --test; a doc for design sketches","min":30,"kind":"Setup"},{"k":"mod","ref":"m01"},{"k":"mod","ref":"m02"},{"k":"lab","ref":"lab-quorum"},{"k":"mod","ref":"m03"},{"id":"t-rev1","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Caches, queues and protection","blocks":[{"k":"mod","ref":"m04"},{"k":"mod","ref":"m05"},{"k":"mod","ref":"m06"},{"k":"lab","ref":"lab-queue"},{"k":"lab","ref":"lab-limiter"},{"id":"t-rev2","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Services in production","blocks":[{"k":"mod","ref":"m07"},{"k":"mod","ref":"m08"},{"k":"mod","ref":"m09"},{"k":"lab","ref":"lab-observe"},{"id":"t-rev3","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Putting it together","blocks":[{"k":"mod","ref":"m10"},{"id":"t-rev4","label":"Review: Practice → Weak spots (20 questions) + due flashcards","min":40,"kind":"Review","go":"practice"}]},{"t":"Prove L2","blocks":[{"k":"case","ref":"cs1"},{"k":"case","ref":"cs2"},{"k":"lab","ref":"capstone"},{"id":"t-designs","label":"Design practice: three full designs written up (a ride-hailing dispatcher, a ticket-booking service, a collaborative to-do app), each with requirements, estimates, a diagram and deep dives","min":360,"kind":"Milestone"},{"id":"t-milestone","label":"Milestone: the module practice problems and exercises, logged with what you learned from each","min":600,"kind":"Milestone"},{"id":"t-writeup","label":"Write up L2: your design routine, the trade-offs you now reach for, and a review of your capstone; save it to the vault","min":60,"kind":"Milestone"}]}],"cases":[{"id":"cs1","title":"Luigi's goes national","org":"Luigi's Pizza, now taking orders for 600 shops in 40 cities","min":30,"blurb":"Replicas, partitions, caches and queues at national scale: fix vanishing orders, a hot promotion, stale prices and repeated texts.","sections":[["Overview","Luigi's app now serves 3 million people a day across 40 cities. Orders live in PostgreSQL, partitioned by city, each partition with one primary and two asynchronous read replicas. Menus are cached in Redis, and order events go to a queue that a worker reads to send texts and emails."],["Current design",["Every read, including a customer's own order history, goes to a read replica.","The biggest city's orders have one partition of their own; smaller cities share partitions.","Menus are cached for 10 minutes; a price change updates the database, then deletes the cache key.","The notification worker sends a text, then acknowledges the message; it keeps no record of what it has sent."]],["Problems",["Customers who have just ordered sometimes see an empty order history.","A national half-price promotion sent most orders to the biggest city's partition, which fell over.","After price changes, some customers saw the old price for up to 10 minutes.","During a slow spell at the text provider, customers got the same 'your order is ready' text three or four times."]]],"items":[{"d":"d1","q":"What's the best fix for the empty order history right after ordering?","o":["Read a customer's own orders from the primary for a short time after they place one","Make every replica synchronous","Cache order histories for 10 minutes","Add a third replica"],"a":0,"e":"Read-your-writes from the primary hides replication lag from the one person who would notice it, while the replicas keep carrying everyone else's reads. Synchronous replicas slow every write, and a cache or another replica makes staleness worse, not better."},{"d":"d1","q":"The promotion overloaded one city's partition. Which change spreads the load best?","o":["Partition orders by a hash of the order id (or the city plus a hashed suffix), not by city alone","Give that city a bigger server and keep partitioning by city","Partition by the customer's surname","Move orders into Redis"],"a":0,"e":"Partitioning by city puts a city's whole burst on one machine. Hashing the order id spreads any burst evenly; queries by city then need a secondary index or a fan-out, which is the price."},{"d":"d2","q":"After a price change, some customers saw the old price for up to 10 minutes. What's the likely cause?","o":["A slow reader stored the old price after the delete: the stale-set race. Version the entries, or delete again a moment later","The TTL was too short","Redis evicted the key","The database had no index on prices"],"a":0,"e":"The delete happened, but a request that had read the old row earlier put it back, and it stayed until the TTL ran out. Versioned entries reject the older value; a second delete shortly after shrinks the window."},{"d":"d2","t":"ms","q":"Which TWO stop the repeated 'your order is ready' texts?","o":["Record each notification's idempotency key with the send, and skip keys already sent","After a timed-out send, check whether the provider actually sent it before retrying","Acknowledge each message before sending it","Add more worker instances","Make the queue FIFO"],"a":[0,1],"e":"Recording the key makes redeliveries harmless, and checking the provider's status before retrying a timed-out send avoids repeating a text that did go out. Acknowledging first loses texts when the worker crashes, and more workers or FIFO order don't touch duplicates."},{"d":"d3","q":"Which SLI would best show the notification problem to the on-call team?","o":["The share of order events whose notification is delivered once, within 60 seconds","The CPU use of the worker machines","The number of messages in the queue at midnight","The average latency of the orders API"],"a":0,"e":"It measures what customers experience, a single prompt text, as a ratio of good events. CPU and a midnight queue depth are causes or snapshots, and the orders API's latency is a different service."}]},{"id":"cs2","title":"The live quiz show","org":"QuizNight, a live trivia app","min":30,"blurb":"Half a million players and a question every 30 seconds: real-time delivery, a hot leaderboard, cheaters, and a deploy that drops everyone.","sections":[["Overview","Every evening at 9 pm, up to 500,000 players join a live quiz. The host releases a question every 30 seconds, players have 10 seconds to answer, and a leaderboard updates after each question."],["Current design",["Phones ask GET /current-question every second.","Answers are posted to an API that updates a scores table in one PostgreSQL database.","After each question, the leaderboard runs ORDER BY score DESC LIMIT 100 over all players.","There's no rate limiting, and a deploy restarts every server at once."]],["Problems",["At 9 pm the API gets 500,000 requests a second, almost all returning the same question.","Players far from the data centre see questions late and run out of time.","The leaderboard query takes 8 seconds.","A script submits thousands of answers a second for one account.","A deploy during the show disconnected every player."]]],"items":[{"d":"d3","q":"What should replace polling for delivering the questions?","o":["A push channel (SSE or WebSockets) through a fleet of gateway servers, publishing each question once to every gateway","Polling every 5 seconds instead of every second","Long polling that waits on the database for 30 seconds","Email"],"a":0,"e":"Each question is the same for everyone, so publish it once to every gateway and let each push it to its own connections. Slower polling only trades load for delay, and holding database queries open doesn't scale."},{"d":"d2","q":"How should the leaderboard be kept?","o":["A Redis sorted set: ZINCRBY on each correct answer, ZREVRANGE for the top 100","The same SQL query, run more often","The SQL result cached for an hour","A full table scan per player"],"a":0,"e":"A sorted set keeps players ordered as scores change, in O(log n) per update, so the top 100 is always ready. Running or caching the slow query doesn't make it fresh and fast."},{"d":"d2","q":"How do you stop one account from flooding the answers?","o":["A per-account token bucket at the edge, and accepting only the first answer per player per question","A CAPTCHA before every question","Blocking the whole data centre's IP range","A longer request timeout"],"a":0,"e":"The rate limit rejects the flood cheaply, and one-answer-per-question makes the extra submissions worthless anyway. A CAPTCHA per question ruins the game, and IP blocks hit innocent players."},{"d":"d3","t":"yn","q":"Judge each statement about the deploy that disconnected everyone.","s":[["Restarting every server at once disconnects every player, and they all reconnect together.",true],["Draining servers one at a time, with jitter on reconnects, spreads the load.",true],["WebSocket connections move to a new server by themselves, without the client reconnecting.",false]],"e":"A restart closes every connection on that server. Rolling restarts with gentle draining, and jittered reconnects, keep the reconnect wave small; clients must always be ready to reconnect and catch up."},{"d":"d4","q":"500,000 players answer within the same 10-second window. Roughly what answer rate must the system absorb?","o":["About 50,000 answers a second, more in the first seconds","About 5,000 a second","About 500,000 a second","About 1,700 a second"],"a":0,"e":"500,000 ÷ 10 seconds = 50,000 a second on average, and answers bunch up early. Buffer them in a queue or a partitioned store, and update scores asynchronously."}]}],"diag":[{"d":"d1","q":"A user changes their profile photo and reloads at once, but sees the old photo. Which guarantee was missing?","o":["Read-your-writes","Monotonic reads","Durability","Partition tolerance"],"a":0,"e":"Read-your-writes promises that a user sees their own updates. Monotonic reads only stop time from going backwards between reads, and durability is about not losing the write."},{"d":"d1","q":"With N = 3 replicas, which settings guarantee that a read overlaps the latest acknowledged write?","o":["W = 2, R = 2","W = 1, R = 1","W = 1, R = 2","W = 2, R = 1"],"a":0,"e":"Only W + R > N forces the read set and the write set to share a replica: 2 + 2 = 4 > 3. The other pairs add up to 3 or less, so a read can miss the latest write."},{"d":"d1","q":"During a network partition, a database keeps accepting reads and writes on both sides. What does it give up?","o":["Consistency: the two sides can diverge","Durability","Partition tolerance","Low latency"],"a":0,"e":"CAP: when the network splits, a system either refuses some requests (keeping consistency) or answers them on both sides (staying available) and accepts that the sides disagree until they reconcile."},{"d":"d1","q":"Keys are placed with hash(key) mod N. Roughly what share of keys move when you go from 4 servers to 5?","o":["About 80%","About 20%","None","About 50%"],"a":0,"e":"A key stays only if hash mod 4 equals hash mod 5, which happens for about 1 in 5 keys, so about 80% move. Consistent hashing moves only about a fifth: the new server's share."},{"d":"d2","q":"Which cache write strategy can lose recent writes if the cache node crashes?","o":["Write-back","Write-through","Write-around","Cache-aside with deletes"],"a":0,"e":"Write-back acknowledges writes once they're in the cache and flushes them later, so anything not yet flushed is lost with the node. The others write the database first or at the same time."},{"d":"d2","q":"A consumer charges a card, then crashes before acknowledging the message, and the broker delivers it again. What prevents a second charge?","o":["Recording the message id in the same transaction as the charge, and skipping ids already seen","Acknowledging before charging","A longer visibility timeout","A FIFO queue"],"a":0,"e":"Redelivery is how at-least-once brokers avoid losing messages, so the consumer must be idempotent. Acknowledging first loses messages instead, and a longer timeout or FIFO order doesn't stop the repeat."},{"d":"d2","q":"How do you keep each order's events in order while still using many consumers?","o":["Partition by order id, with each partition read by one consumer at a time","One queue with many competing consumers","Random partitioning","Retry failed events at the back of the queue"],"a":0,"e":"Order holds within a partition, so keying by order id keeps each order's events together. Competing consumers, random placement and retrying at the back all reorder."},{"d":"d2","q":"Why add jitter to exponential backoff?","o":["So clients that failed together don't retry together","To make each retry faster","To make non-idempotent requests safe to retry","To keep a circuit breaker closed"],"a":0,"e":"Without jitter, clients that failed at the same moment wait the same times and return in synchronized waves. Jitter spreads them out."},{"d":"d3","q":"When are microservices most clearly worth their cost?","o":["When several teams need to deploy independently, and parts need to scale or fail separately","For a new product built by one small team","As soon as the codebase passes 10,000 lines","When you need transactions across services"],"a":0,"e":"Microservices buy team independence and isolation at the price of network calls, distributed data and operations. One small team rarely gains enough to pay for that, and cross-service transactions get harder, not easier."},{"d":"d3","q":"A live score page only needs updates from the server to the browser. What's the simplest good fit?","o":["Server-Sent Events","WebSockets","Polling every 100 ms","Long polling with a 1-second timeout"],"a":0,"e":"SSE is one-way streaming over plain HTTP, with reconnection and Last-Event-ID built in. WebSockets would work but add two-way machinery nobody needs, and fast polling wastes requests."},{"d":"d3","q":"Average latency is 120 ms, under the 300 ms target, yet users say the app is slow. What should you look at?","o":["Percentiles such as p95 and p99","The median alone","CPU utilisation","The number of log lines"],"a":0,"e":"Averages hide the tail: a few slow requests barely move the mean but hurt the users who get them, and pages that make several calls hit them often."},{"d":"d3","q":"A 99.9% availability SLO over 30 days allows roughly how much complete downtime?","o":["About 43 minutes","About 4 minutes","About 7 hours","About a day"],"a":0,"e":"30 days is 43,200 minutes, and 0.1% of that is 43.2 minutes: that's the error budget."},{"d":"d4","q":"You're asked to design a system in an interview. What comes first?","o":["Clarify the requirements and the scale","Draw the high-level design","Pick a database","Start a deep dive"],"a":0,"e":"The requirements and the numbers decide everything after them; boxes drawn before them have nothing to be right about."},{"d":"d4","q":"In a news feed, why pull celebrities' posts at read time instead of pushing them into followers' feeds?","o":["Pushing one post to millions of followers means millions of writes, and a long delay","Celebrities post more often than other users","Pulling is always cheaper than pushing","Followers' feeds can't store celebrity posts"],"a":0,"e":"Fan-out on write costs one write per follower. That's fine for ordinary accounts, whose posts are read far more than written, but explodes for accounts with millions of followers, so those are merged in at read time."},{"d":"d4","q":"Three API servers share one rate limit kept in Redis. What must be true of the check?","o":["Refilling, checking and spending happen as one atomic step, for example a Lua script","Each server keeps its own counter","The limit is checked after the request is processed","GET and SET are sent as separate commands"],"a":0,"e":"With separate GET and SET calls, two servers can read the same count and both spend the same token. Redis runs one script at a time, so a script makes the check atomic."},{"d":"d4","q":"50 million users each send 40 messages a day. Roughly what's the average message rate?","o":["About 23,000 a second","About 2,300 a second","About 230,000 a second","About 600 a second"],"a":0,"e":"2 billion messages ÷ 86,400 seconds ≈ 23,000 a second on average; the peak is likely two to three times that."}],"labs":[{"id":"lab-quorum","t":"Quorums and read repair: a three-replica simulation","min":60,"mods":["m01","m02"],"goal":"Simulate a leaderless store with three replicas: writes wait for W acknowledgements while the other replicas get the update a little later, and reads ask R replicas and keep the newest version. Measure stale reads for several (W, R) pairs, show that W + R > N never reads stale data, then add read repair and measure again.","pre":["Python 3.12+ and Node.js 22+","Read modules 1 and 2"],"steps":["Keep each replica's version of one key, and a list of pending copies (due step, replica, version) for writes still on the way.","Every fifth step is a write: W random replicas apply it at once and the others get it 1 to 10 steps later. The other steps are reads of R random replicas, keeping the highest version they hold.","Count a read as stale when its version is below the last acknowledged write, and run (1, 1), (1, 2), (2, 2), (3, 1) and (1, 3) with the same seeded random generator.","Add read repair: after each read, write the newest version back to the replicas you asked that were behind. Compare (1, 2) with and without it.","Explain in two sentences why W + R > N never reads stale here, and what a real system still has to handle: replicas that fail, sloppy quorums and concurrent writes."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"def mulberry32(seed):                               # copy the seeded generator from module 1\n    ...\n\nN = 3\n\ndef shuffled(items, rand):\n    ...                                             # TODO: a Fisher-Yates shuffle using rand()\n\ndef run(w, r, read_repair=False, ops=2000, seed=42):\n    rand = mulberry32(seed)\n    replicas, pending = [0] * N, []                 # versions; (due step, replica, version) still on the way\n    latest = stale = repairs = 0\n    for step in range(ops):\n        ...                                         # TODO: deliver due copies; write on every fifth step, else read\n    return stale, repairs\n"},{"lang":"javascript","src":"function mulberry32(seed) { /* copy the seeded generator from module 1 */ }\n\nconst N = 3;\n\nfunction shuffled(items, rand) { /* TODO: a Fisher-Yates shuffle using rand() */ }\n\nfunction run(w, r, readRepair = false, ops = 2000, seed = 42) {\n  const rand = mulberry32(seed);\n  const replicas = new Array(N).fill(0);\n  let pending = [];                                 // [due step, replica, version] still on the way\n  let latest = 0, stale = 0, repairs = 0;\n  for (let step = 0; step < ops; step++) {\n    // TODO: deliver due copies; write on every fifth step, else read\n  }\n  return [stale, repairs];\n}\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"Leaderless replication with quorums: N = 3 replicas, writes wait for W acknowledgements, reads ask R replicas.\"\"\"\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nN = 3\n\ndef shuffled(items, rand):\n    items = list(items)\n    for i in range(len(items) - 1, 0, -1):          # Fisher-Yates, driven by the seeded generator\n        j = int(rand() * (i + 1))\n        items[i], items[j] = items[j], items[i]\n    return items\n\ndef run(w, r, read_repair=False, ops=2000, seed=42):\n    \"\"\"Write one key every fifth step and read it on the others; return (stale reads, repairs made).\"\"\"\n    rand = mulberry32(seed)\n    replicas = [0] * N                              # each replica's version of the key (the version is the value)\n    pending = []                                    # (due step, replica, version): copies of writes still on the way\n    latest = stale = repairs = 0\n    for step in range(ops):\n        for item in [p for p in pending if p[0] <= step]:\n            pending.remove(item)                    # a late copy arrives; an older one never overwrites a newer one\n            _, i, version = item\n            replicas[i] = max(replicas[i], version)\n        if step % 5 == 0:                           # a write: one step in five; the rest are reads\n            latest += 1\n            order = shuffled(range(N), rand)\n            for i in order[:w]:\n                replicas[i] = latest                # W replicas apply it before the client gets its acknowledgement\n            for i in order[w:]:\n                pending.append((step + 1 + int(rand() * 10), i, latest))   # the others get it 1 to 10 steps later\n        else:                                       # a read\n            asked = shuffled(range(N), rand)[:r]\n            newest = max(replicas[i] for i in asked)\n            if newest < latest:\n                stale += 1                          # the read missed the last acknowledged write\n            if read_repair:\n                for i in asked:\n                    if replicas[i] < newest:\n                        replicas[i] = newest        # write the newest version back to replicas that were behind\n                        repairs += 1\n    return stale, repairs\n\nresults = {}\nfor w, r, repair in ((1, 1, False), (1, 2, False), (1, 2, True), (2, 2, False), (3, 1, False), (1, 3, False)):\n    stale, repairs = run(w, r, repair)\n    results[(w, r, repair)] = stale\n    label = f\"W={w} R={r}\" + (\" + read repair\" if repair else \"\")\n    print(f\"{label}: {stale} stale reads out of 1600\" + (f\", {repairs} repairs\" if repair else \"\"))\nassert all(results[(w, r, False)] == 0 for w, r in ((2, 2), (3, 1), (1, 3)))   # W + R > N: every read overlaps the last write\nassert results[(1, 1, False)] > results[(1, 2, False)] > 0\nassert results[(1, 2, True)] <= results[(1, 2, False)]   # repairs only ever move replicas forward\nprint(\"quorum lab OK\")\n","out":"W=1 R=1: 790 stale reads out of 1600\nW=1 R=2: 312 stale reads out of 1600\nW=1 R=2 + read repair: 143 stale reads out of 1600, 631 repairs\nW=2 R=2: 0 stale reads out of 1600\nW=3 R=1: 0 stale reads out of 1600\nW=1 R=3: 0 stale reads out of 1600\nquorum lab OK\n"},{"lang":"javascript","src":"// Leaderless replication with quorums: N = 3 replicas, writes wait for W acknowledgements, reads ask R replicas.\n\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst N = 3;\n\nfunction shuffled(items, rand) {\n  items = [...items];\n  for (let i = items.length - 1; i > 0; i--) {      // Fisher-Yates, driven by the seeded generator\n    const j = Math.floor(rand() * (i + 1));\n    [items[i], items[j]] = [items[j], items[i]];\n  }\n  return items;\n}\n\nfunction run(w, r, readRepair = false, ops = 2000, seed = 42) {\n  // write one key every fifth step and read it on the others; return [stale reads, repairs made]\n  const rand = mulberry32(seed);\n  const replicas = new Array(N).fill(0);            // each replica's version of the key (the version is the value)\n  let pending = [];                                 // [due step, replica, version]: copies of writes still on the way\n  let latest = 0, stale = 0, repairs = 0;\n  const ids = [...Array(N).keys()];\n  for (let step = 0; step < ops; step++) {\n    for (const [due, i, version] of pending.filter(p => p[0] <= step)) {\n      replicas[i] = Math.max(replicas[i], version); // a late copy arrives; an older one never overwrites a newer one\n    }\n    pending = pending.filter(p => p[0] > step);\n    if (step % 5 === 0) {                           // a write: one step in five; the rest are reads\n      latest++;\n      const order = shuffled(ids, rand);\n      for (const i of order.slice(0, w)) replicas[i] = latest;   // W replicas apply it before the client gets its acknowledgement\n      for (const i of order.slice(w)) pending.push([step + 1 + Math.floor(rand() * 10), i, latest]);   // the others get it 1 to 10 steps later\n    } else {                                        // a read\n      const asked = shuffled(ids, rand).slice(0, r);\n      const newest = Math.max(...asked.map(i => replicas[i]));\n      if (newest < latest) stale++;                 // the read missed the last acknowledged write\n      if (readRepair) {\n        for (const i of asked) {\n          if (replicas[i] < newest) { replicas[i] = newest; repairs++; }   // write the newest version back to replicas that were behind\n        }\n      }\n    }\n  }\n  return [stale, repairs];\n}\n\nconst results = new Map();\nfor (const [w, r, repair] of [[1, 1, false], [1, 2, false], [1, 2, true], [2, 2, false], [3, 1, false], [1, 3, false]]) {\n  const [stale, repairs] = run(w, r, repair);\n  results.set(`${w},${r},${repair}`, stale);\n  const label = `W=${w} R=${r}` + (repair ? \" + read repair\" : \"\");\n  console.log(`${label}: ${stale} stale reads out of 1600` + (repair ? `, ${repairs} repairs` : \"\"));\n}\nconst get = (w, r, repair) => results.get(`${w},${r},${repair}`);\nif (![[2, 2], [3, 1], [1, 3]].every(([w, r]) => get(w, r, false) === 0)) throw new Error(\"W + R > N must never be stale\");\nif (!(get(1, 1, false) > get(1, 2, false) && get(1, 2, false) > 0)) throw new Error(\"weak quorums\");\nif (get(1, 2, true) > get(1, 2, false)) throw new Error(\"read repair\");\nconsole.log(\"quorum lab OK\");\n","out":"W=1 R=1: 790 stale reads out of 1600\nW=1 R=2: 312 stale reads out of 1600\nW=1 R=2 + read repair: 143 stale reads out of 1600, 631 repairs\nW=2 R=2: 0 stale reads out of 1600\nW=3 R=1: 0 stale reads out of 1600\nW=1 R=3: 0 stale reads out of 1600\nquorum lab OK\n"}]},"breakit":["Make one replica lose its pending copies for good, and see which (W, R) pairs still hold.","Stretch the delay to 1 to 50 steps and watch (1, 2) get worse.","Let two clients write at the same step with the same version number, and find the conflict a counter can't settle (module 2's concurrent writes)."]},{"id":"lab-queue","t":"A durable work queue on SQLite: retries, dead letters and an idempotent consumer","min":75,"mods":["m05","m06"],"goal":"Build a work queue on SQLite that survives restarts: a receive that hides a job for a visibility timeout, an acknowledgement, retries with exponential backoff, and a dead-letter state after three failures. Then write a consumer that charges every order exactly once, even though the worker crashes between charging and acknowledging.","pre":["Python 3.12+ (sqlite3) and Node.js 22.13+ (node:sqlite)","Read modules 5 and 6"],"steps":["Create a jobs table (id, key, body, attempts, visible_at, status, error) with an index on (status, visible_at, id). Call the file workqueue.py: a file named queue.py would hide Python's own queue module.","receive(now): in one transaction, take the oldest ready job whose visible_at has passed, set visible_at to now + 30 and add one to its attempts.","ack(id) marks it done; fail(id, attempts, error, now) delays it by 2^attempts seconds, or marks it dead with the error after 3 attempts.","charge(key, body): in one transaction, skip the key if it's already in a charges table, otherwise insert it; raise an error for a bad card.","Queue 20 orders (number 13 has a bad card), then run a worker on a fake clock that crashes after charging one time in five, using the seeded generator. Count deliveries, crashes and skipped duplicates."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import sqlite3\n\nclass Queue:\n    def __init__(self, db, timeout=30, max_attempts=3):\n        self.db, self.timeout, self.max_attempts = db, timeout, max_attempts\n        ...                                         # TODO: CREATE TABLE jobs and its index\n\n    def send(self, key, body): ...\n    def receive(self, now): ...                     # TODO: claim the oldest visible job in one transaction\n    def ack(self, job_id): ...\n    def fail(self, job_id, attempts, error, now): ...   # TODO: back off, or mark dead\n\ndef charge(db, key, body):\n    ...                                             # TODO: the charge and its dedupe record, in one transaction\n"},{"lang":"javascript","src":"const { DatabaseSync } = require(\"node:sqlite\");\n\nclass Queue {\n  constructor(db, timeout = 30, maxAttempts = 3) {\n    this.db = db; this.timeout = timeout; this.maxAttempts = maxAttempts;\n    // TODO: CREATE TABLE jobs and its index\n  }\n  send(key, body) { /* TODO */ }\n  receive(now) { /* TODO: claim the oldest visible job in one transaction */ }\n  ack(jobId) { /* TODO */ }\n  fail(jobId, attempts, error, now) { /* TODO: back off, or mark dead */ }\n}\n\nfunction charge(db, key, body) { /* TODO: the charge and its dedupe record, in one transaction */ }\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"A durable work queue in SQLite: visibility timeouts, retries with backoff, a dead-letter state, an idempotent consumer.\"\"\"\nimport sqlite3\n\ndef mulberry32(seed):                               # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n\nclass Queue:\n    def __init__(self, db, timeout=30, max_attempts=3):\n        self.db, self.timeout, self.max_attempts = db, timeout, max_attempts\n        db.executescript(\"\"\"\n            CREATE TABLE jobs (id INTEGER PRIMARY KEY, key TEXT NOT NULL, body TEXT NOT NULL,\n                               attempts INTEGER NOT NULL DEFAULT 0, visible_at INTEGER NOT NULL DEFAULT 0,\n                               status TEXT NOT NULL DEFAULT 'ready', error TEXT);\n            CREATE INDEX jobs_ready ON jobs (status, visible_at, id);\n        \"\"\")\n\n    def send(self, key, body):\n        with self.db:\n            self.db.execute(\"INSERT INTO jobs (key, body) VALUES (?, ?)\", (key, body))\n\n    def receive(self, now):\n        \"\"\"Claim the oldest visible job: hide it for `timeout` seconds and count the attempt.\"\"\"\n        with self.db:\n            row = self.db.execute(\"SELECT id, key, body, attempts FROM jobs WHERE status = 'ready' AND visible_at <= ? \"\n                                  \"ORDER BY id LIMIT 1\", (now,)).fetchone()\n            if row is None:\n                return None\n            self.db.execute(\"UPDATE jobs SET visible_at = ?, attempts = attempts + 1 WHERE id = ?\",\n                            (now + self.timeout, row[0]))\n            return row[0], row[1], row[2], row[3] + 1\n\n    def ack(self, job_id):\n        with self.db:\n            self.db.execute(\"UPDATE jobs SET status = 'done' WHERE id = ?\", (job_id,))\n\n    def fail(self, job_id, attempts, error, now):\n        \"\"\"A handled failure: retry after an exponential backoff, or park the job as dead after max_attempts.\"\"\"\n        with self.db:\n            if attempts >= self.max_attempts:\n                self.db.execute(\"UPDATE jobs SET status = 'dead', error = ? WHERE id = ?\", (error, job_id))\n            else:\n                self.db.execute(\"UPDATE jobs SET visible_at = ? WHERE id = ?\", (now + 2 ** attempts, job_id))\n\n    def waiting(self):\n        return self.db.execute(\"SELECT COUNT(*) FROM jobs WHERE status = 'ready'\").fetchone()[0]\n\ndef charge(db, key, body):\n    \"\"\"The effect and its dedupe record commit together, so a redelivered job can't charge twice.\"\"\"\n    if body.startswith(\"card=bad\"):\n        raise ValueError(\"card declined: invalid number\")\n    with db:\n        if db.execute(\"SELECT 1 FROM charges WHERE key = ?\", (key,)).fetchone():\n            return False                            # already charged: this is a duplicate delivery\n        db.execute(\"INSERT INTO charges (key, body) VALUES (?, ?)\", (key, body))\n        return True\n\ndb = sqlite3.connect(\":memory:\")\ndb.execute(\"CREATE TABLE charges (key TEXT PRIMARY KEY, body TEXT NOT NULL)\")\nqueue = Queue(db)\nfor n in range(1, 21):\n    queue.send(f\"order-{n}\", \"card=bad\" if n == 13 else f\"card=ok amount={n * 5}\")\n\nrand, now = mulberry32(7), 0\ndeliveries = crashes = duplicates = 0\nwhile queue.waiting():\n    job = queue.receive(now)\n    if job is None:\n        now += 1                                    # nothing visible yet: wait a second\n        continue\n    job_id, key, body, attempts = job\n    deliveries += 1\n    try:\n        if not charge(db, key, body):\n            duplicates += 1\n    except ValueError as err:\n        queue.fail(job_id, attempts, str(err), now)\n        continue\n    if rand() < 0.2:\n        crashes += 1                                # the worker dies after charging, before the ack: the job reappears\n        continue\n    queue.ack(job_id)\n\ncharged = db.execute(\"SELECT COUNT(*) FROM charges\").fetchone()[0]\ndead = db.execute(\"SELECT key, error, attempts FROM jobs WHERE status = 'dead'\").fetchall()\nprint(f\"orders: 20 | charged: {charged} | deliveries: {deliveries} | crashes before the ack: {crashes} | \"\n      f\"duplicates skipped: {duplicates}\")\nprint(\"dead letters:\", *(f\"{key} after {attempts} attempts ({error})\" for key, error, attempts in dead))\nassert charged == 19 and duplicates == crashes and [d[0] for d in dead] == [\"order-13\"]\nprint(\"queue lab OK\")\n","out":"orders: 20 | charged: 19 | deliveries: 29 | crashes before the ack: 7 | duplicates skipped: 7\ndead letters: order-13 after 3 attempts (card declined: invalid number)\nqueue lab OK\n"},{"lang":"javascript","src":"// A durable work queue in SQLite: visibility timeouts, retries with backoff, a dead-letter state, an idempotent consumer.\nconst { DatabaseSync } = require(\"node:sqlite\");     // Node.js 22.13 or later\n\nfunction mulberry32(seed) {                         // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nfunction transaction(db, fn) {                      // commit if fn returns, roll back if it throws\n  db.exec(\"BEGIN\");\n  try {\n    const result = fn();\n    db.exec(\"COMMIT\");\n    return result;\n  } catch (err) {\n    db.exec(\"ROLLBACK\");\n    throw err;\n  }\n}\n\nclass Queue {\n  constructor(db, timeout = 30, maxAttempts = 3) {\n    this.db = db; this.timeout = timeout; this.maxAttempts = maxAttempts;\n    db.exec(`\n      CREATE TABLE jobs (id INTEGER PRIMARY KEY, key TEXT NOT NULL, body TEXT NOT NULL,\n                         attempts INTEGER NOT NULL DEFAULT 0, visible_at INTEGER NOT NULL DEFAULT 0,\n                         status TEXT NOT NULL DEFAULT 'ready', error TEXT);\n      CREATE INDEX jobs_ready ON jobs (status, visible_at, id);\n    `);\n  }\n  send(key, body) {\n    this.db.prepare(\"INSERT INTO jobs (key, body) VALUES (?, ?)\").run(key, body);\n  }\n  receive(now) {\n    // claim the oldest visible job: hide it for `timeout` seconds and count the attempt\n    return transaction(this.db, () => {\n      const row = this.db.prepare(\"SELECT id, key, body, attempts FROM jobs WHERE status = 'ready' AND visible_at <= ? \" +\n                                  \"ORDER BY id LIMIT 1\").get(now);\n      if (row === undefined) return null;\n      this.db.prepare(\"UPDATE jobs SET visible_at = ?, attempts = attempts + 1 WHERE id = ?\").run(now + this.timeout, row.id);\n      return [row.id, row.key, row.body, row.attempts + 1];\n    });\n  }\n  ack(jobId) {\n    this.db.prepare(\"UPDATE jobs SET status = 'done' WHERE id = ?\").run(jobId);\n  }\n  fail(jobId, attempts, error, now) {\n    // a handled failure: retry after an exponential backoff, or park the job as dead after maxAttempts\n    if (attempts >= this.maxAttempts) this.db.prepare(\"UPDATE jobs SET status = 'dead', error = ? WHERE id = ?\").run(error, jobId);\n    else this.db.prepare(\"UPDATE jobs SET visible_at = ? WHERE id = ?\").run(now + 2 ** attempts, jobId);\n  }\n  waiting() {\n    return this.db.prepare(\"SELECT COUNT(*) AS n FROM jobs WHERE status = 'ready'\").get().n;\n  }\n}\n\nfunction charge(db, key, body) {\n  // the effect and its dedupe record commit together, so a redelivered job can't charge twice\n  if (body.startsWith(\"card=bad\")) throw new Error(\"card declined: invalid number\");\n  return transaction(db, () => {\n    if (db.prepare(\"SELECT 1 AS found FROM charges WHERE key = ?\").get(key)) return false;   // already charged: a duplicate delivery\n    db.prepare(\"INSERT INTO charges (key, body) VALUES (?, ?)\").run(key, body);\n    return true;\n  });\n}\n\nconst db = new DatabaseSync(\":memory:\");\ndb.exec(\"CREATE TABLE charges (key TEXT PRIMARY KEY, body TEXT NOT NULL)\");\nconst queue = new Queue(db);\nfor (let n = 1; n <= 20; n++) queue.send(`order-${n}`, n === 13 ? \"card=bad\" : `card=ok amount=${n * 5}`);\n\nconst rand = mulberry32(7);\nlet now = 0, deliveries = 0, crashes = 0, duplicates = 0;\nwhile (queue.waiting()) {\n  const job = queue.receive(now);\n  if (job === null) { now++; continue; }            // nothing visible yet: wait a second\n  const [jobId, key, body, attempts] = job;\n  deliveries++;\n  try {\n    if (!charge(db, key, body)) duplicates++;\n  } catch (err) {\n    queue.fail(jobId, attempts, err.message, now);\n    continue;\n  }\n  if (rand() < 0.2) { crashes++; continue; }        // the worker dies after charging, before the ack: the job reappears\n  queue.ack(jobId);\n}\n\nconst charged = db.prepare(\"SELECT COUNT(*) AS n FROM charges\").get().n;\nconst dead = db.prepare(\"SELECT key, error, attempts FROM jobs WHERE status = 'dead'\").all();\nconsole.log(`orders: 20 | charged: ${charged} | deliveries: ${deliveries} | crashes before the ack: ${crashes} | ` +\n            `duplicates skipped: ${duplicates}`);\nconsole.log(\"dead letters:\", ...dead.map(d => `${d.key} after ${d.attempts} attempts (${d.error})`));\nif (charged !== 19 || duplicates !== crashes || dead.map(d => d.key).join() !== \"order-13\") throw new Error(\"queue checks\");\nconsole.log(\"queue lab OK\");\n","out":"orders: 20 | charged: 19 | deliveries: 29 | crashes before the ack: 7 | duplicates skipped: 7\ndead letters: order-13 after 3 attempts (card declined: invalid number)\nqueue lab OK\n"}]},"breakit":["Move the dedupe check out of the charge's transaction and crash between the two: count the double charges.","Make the visibility timeout shorter than the work takes, and watch two workers process the same job.","Retry the bad card forever with no dead-letter state, and see what happens to the jobs behind it with one worker."]},{"id":"lab-limiter","t":"One rate limit across three API servers","min":75,"mods":["m06"],"goal":"Run a tiny store service, standing in for Redis, and three API servers over real HTTP. Each API server checks a per-client token bucket in the store. Show that an atomic take holds the limit exactly under concurrent load, and that reading the count and writing it back lets far too many requests through.","pre":["Python 3.12+ and Node.js 22+ (for the built-in fetch)","Read module 6"],"steps":["Write the store: POST /take refills, checks and spends a token in one locked step (in Node, one synchronous function); POST /get and POST /set read and write a value.","Write an API server with GET /hello (one call to /take) and GET /hello-racy (GET the count, wait 20 ms, SET it minus one), answering 200, or 429 with a Retry-After header.","Start the store and three API servers on free ports, then fire 30 concurrent requests for one client key, spread over the three servers.","With a capacity of 10 and almost no refill during the test, count the 200s and 429s for each endpoint.","Write down why the racy version lets too much through, and what Redis offers instead: a Lua script, or INCR with EXPIRE for a fixed window."],"starter":{"t":"Starter","tabs":[{"lang":"python","src":"import json, threading, time, urllib.error, urllib.request\nfrom concurrent.futures import ThreadPoolExecutor\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nCAPACITY, PER_SEC = 10, 0.01\n\nclass Store:\n    def __init__(self):\n        self.data, self.lock = {}, threading.Lock()\n\n    def take(self, key, capacity, per_sec, now):\n        ...                                         # TODO: refill, check and spend under the lock\n\nclass StoreHandler(BaseHTTPRequestHandler):\n    def do_POST(self): ...                          # TODO: /take, /get and /set with JSON bodies\n\ndef make_api(store_port):\n    class ApiHandler(BaseHTTPRequestHandler):\n        def do_GET(self): ...                       # TODO: /hello (atomic) and /hello-racy (GET, sleep, SET)\n    return ApiHandler\n\n# TODO: start the store and three API servers on port 0, fire 30 requests at each endpoint, count the answers\n"},{"lang":"javascript","src":"const http = require(\"node:http\");\n\nconst CAPACITY = 10, PER_SEC = 0.01;\nconst data = new Map();\n\nfunction take(key, capacity, perSec, now) { /* TODO: refill, check and spend in one synchronous step */ }\n\nconst storeServer = http.createServer(async (req, res) => { /* TODO: /take, /get and /set with JSON bodies */ });\nfunction makeApi(storePort) {\n  return http.createServer(async (req, res) => { /* TODO: /hello (atomic) and /hello-racy (GET, sleep, SET) */ });\n}\n\n// TODO: listen on port 0, fire 30 requests at each endpoint with Promise.all, count the answers, then process.exit(0)\n"}]},"solution":{"t":"Reference solution","tabs":[{"lang":"python","src":"\"\"\"One rate limit shared by three API servers: a tiny store service (standing in for Redis) and three API servers.\"\"\"\nimport json, sys, threading, time, urllib.error, urllib.request\nfrom concurrent.futures import ThreadPoolExecutor\nfrom http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\n\nCAPACITY, PER_SEC = 10, 0.01                        # 10 requests, then one more every 100 seconds\n\nclass Store:\n    \"\"\"The Redis stand-in: plain GET and SET, plus an atomic token-bucket take (what a Lua script does in Redis).\"\"\"\n    def __init__(self):\n        self.data, self.lock = {}, threading.Lock()\n\n    def take(self, key, capacity, per_sec, now):\n        with self.lock:                             # refill, check and spend as one step: nobody runs in between\n            tokens, last = self.data.get(key, (capacity, now))\n            tokens = min(capacity, tokens + (now - last) * per_sec)\n            if tokens >= 1:\n                self.data[key] = (tokens - 1, now)\n                return True, 0\n            self.data[key] = (tokens, now)\n            return False, int((1 - tokens) / per_sec) + 1   # whole seconds until the next token\n\nstore = Store()\n\ndef send_json(handl
