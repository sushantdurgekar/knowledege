<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Design L3 Specialist Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}

.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1.5px solid var(--line)}

.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;font-size:.86rem}

.opt.sel{border-color:var(--accent);background:var(--accent-soft)}

.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.yn{display:grid;gap:6px}

.ord .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

.ord .mv{display:flex;gap:4px}
.ord .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700}
.match{display:grid;gap:6px}
.match .pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.match .pr.right{border-color:var(--good);background:var(--good-soft)} .match .pr.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match select{width:100%;min-width:0}
pre.dropcode{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:var(--r);overflow-x:auto;line-height:2;margin:0 0 6px;font-size:.82rem;white-space:pre}
pre.dropcode select{font-family:var(--f-mono);font-size:.78rem;padding:1px 4px;border-radius:5px;background:#1d2a38;color:#e7eef6;border:1px solid #3d5168}
pre.dropcode select.right{border-color:#4fc98d;box-shadow:0 0 0 1px #4fc98d}
pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}
.expl{margin-top:9px;font-size:.93rem;border-top:1px solid var(--line);padding-top:9px}
.expl .v{font-weight:700}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Practice / mock / cases */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}

.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}

.scenario{font-size:.93rem}

details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}

/* Flashcards */
.fc{max-width:660px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}

oss modules. The examples are small, deterministic simulations, run against tests on 12 Oct 2026 (Python 3.13, Node.js 22.22). The labs use only the standard libraries; the capstone uses Docker Compose with Kafka."},{"k":"info","t":"Numbers are rules of thumb","x":"Latencies, throughputs and failure rates in this hub are typical orders of magnitude for teaching, not measurements of any product. Real designs start from measured numbers, and every estimate states its assumptions."}],"howto":["Take the **diagnostic** first (15 minutes). It ranks the four topic areas by *weight × gap*.","Open **Roadmap**, set your hours per week and start date, and tick blocks off as you go.","In each module: guess the pre-question, read the **🍎 story**, then the key ideas, diagram and code. Do the worked example, then finish the faded one yourself.","Run every simulation and change one thing at a time: a crash point, a network partition, a clock skew, a compaction setting. Predict the result before you run it.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","For every design, write the requirements and estimates first, then draw the boxes, then name what you traded away.","Finish with the capstone: write the design doc first, then build the smallest version that tests it."],"tactics":["**Requirements**: functional (what it does) and non-functional (scale, latency, availability, consistency). Agree the scope out loud.","**Estimates**: requests per second at the peak, reads against writes, storage, bandwidth (L1 module 9).","**API and data model**: the main endpoints, and the tables or keys that serve them.","**High-level design**: boxes and arrows for the main paths, then walk a request through it.","**Deep dives**: the hardest part (a hot key, fan-out, ordering, failure) gets the most time.","**Failure modes**: walk through a duplicate message, a crash between two writes, a region outage and a clock jump. Say what keeps the data correct in each.","**Trade-offs**: what you chose, what it cost, what you'd monitor, and what would make you choose differently."],"tacticsTitle":"Design routine (use it on every question)","labsIntro":"Four builds feed the capstone. Write each one yourself in Python **and** JavaScript, run the tests, then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"The labs need only Python 3.12+ and Node.js 22.13+, using their standard libraries. The capstone adds Docker Compose with Kafka. No cloud account and no cost."},"labsTab":"Build","interviewIntro":"At L3 the interviewer probes the hard parts: what happens when a message is duplicated, a region fails or a clock drifts, and how your design proves money and data stay correct. Answer each question out loud in about three minutes, then compare with the model answer.","interviewEyebrow":"From practice to interview","interviewSkills":"distributed transactions, event-driven and streaming systems, consensus and storage engines, search and geo, multi-region resilience, security architecture, large-scale system design","interviewTopics":"System Design L3 (distributed transactions, event-driven architecture, stream processing, consensus, storage engines, search and geo, multi-region and DR, security architecture, classic large designs)","roles":["Senior software engineer","Staff or principal engineer","Solutions or platform architect"],"domains":[{"id":"d1","short":"A","name":"Transactions, events and streams","w":[35,35]},{"id":"d2","short":"B","name":"Consensus and storage engines","w":[20,20]},{"id":"d3","short":"C","name":"Search, regions and security","w":[30,30]},{"id":"d4","short":"D","name":"Classic large designs","w":[15,15]}],"groups":[{"id":"g1","t":"Data in motion","mods":["m01","m02","m03"]},{"id":"g2","t":"What the platforms stand on","mods":["m04","m05"]},{"id":"g3","t":"Specialist systems","mods":["m06","m07","m08"]},{"id":"g4","t":"Putting it together","mods":["m09"]}],"modules":[{"id":"m01","d":"d1","t":"Distributed transactions: two-phase commit, sagas, outbox and inbox","min":120,"hook":"An order touches three services: stock reserves the item, payments takes the money, shipping books a courier. Either all of it should happen or none of it. A database transaction can't stretch across services, so you choose: two-phase commit, which is atomic but blocks when its coordinator fails, or a saga, a chain of local transactions with compensations that undo earlier steps. The outbox and inbox patterns make each step's messages reliable and each consumer idempotent.","pre":{"q":"The payment went through, but reserving stock then failed because the item had sold out. The money has left the customer's card. What should the system do, and why can't it simply roll back?","a":"The payment was committed in another service's database, so there's no transaction left to roll back. The saga runs a compensating action instead: refund the payment (a new transaction that undoes it in business terms) and mark the order cancelled. Compensations must be idempotent and must eventually succeed, so they're retried until they do."},"kid":{"t":"Luigi plans a party","x":"Luigi is planning a party: the bouncy castle, the cake and the magician must all come, or none of them. One way: he phones all three and asks, \"Can you keep Saturday free?\" Only when all three say yes does he ring back to say \"It's on!\" But one year Luigi lost his voice after they'd all said yes, and they kept Saturday free for days, waiting. Now he books them one at a time, and if the magician can't come, he cancels the cake, then the castle, instead of pretending they were never booked. He writes every call he must make in a notebook first, and the castle company ticks off the calls it has already answered.","map":[["Asking all three to keep Saturday free, then saying \"It's on!\"","Two-phase commit: prepare and vote, then commit everywhere"],["Everyone waiting after Luigi lost his voice","Blocking: participants that voted yes wait for the coordinator, holding their locks"],["Booking one at a time, and cancelling instead of un-booking","A saga: local transactions with compensations, run in reverse on failure"],["Writing every call in the notebook first","The outbox: messages saved in the same transaction as the change"],["Ticking off calls already answered","The inbox: a consumer records message ids so a repeat has no effect"]],"brk":"Luigi's helpers can tell he's lost his voice. Services can't tell a crashed coordinator from a slow one, and while a saga runs, everyone else can see the half-finished booking."},"keys":["**Why it's hard**: a database transaction can't span several services' databases. Between steps any service can fail, and a lost reply leaves you unsure whether a step committed. Every design here answers two questions: how do all the steps end up done or undone, and what does everyone else see in between?","**Two-phase commit (2PC)**: a coordinator asks every participant to prepare; each writes its changes durably, keeps them locked and votes yes (promising to obey the decision) or no. If all vote yes, the coordinator logs COMMIT and tells everyone; otherwise ABORT. It's atomic, but participants hold locks across two round trips, and if the coordinator fails after the yes votes they're stuck in doubt until it recovers.","**Where 2PC lives**: inside database systems (distributed SQL databases run it with replicated, consensus-backed coordinators so the coordinator can't simply disappear) and across a few XA-capable resources. Across microservices it's rare: it couples their availability and needs every participant to support prepare.","**Sagas**: a sequence of local transactions T1…Tn, each with a compensating transaction. If Tk fails, the saga runs the compensations for the earlier steps in reverse. Every step commits at once, so there's no blocking, but there's no isolation either: other transactions can see the intermediate states.","**Compensations**: a semantic undo (refund, release the reservation, cancel the booking), not a rollback. They must be idempotent and retried until they succeed. Steps that can't be undone go after the ones that might fail: compensatable steps first, then one pivot step, then steps that are retried until they succeed.","**Orchestration or choreography**: an orchestrator, a durable state machine, tells each service what to do and records progress, so a long flow can be followed, changed and resumed after a crash. In choreography, services react to each other's events: no central component, but the flow is implicit and easy to tangle.","**Living without isolation**: mark records as pending (a semantic lock) so other operations wait or refuse; prefer commutative updates (add and subtract rather than overwrite); re-read a value before acting on it; and show users the pending state honestly, such as \"payment processing\".","**Outbox and inbox**: each step writes its outgoing messages to an outbox table in the same local transaction, and a relay publishes them at least once (L2 module 5). Each consumer records the ids of the messages it has handled in an inbox table, in the same transaction as the effect, and ignores repeats. Together they give an exactly-once effect per step."],"dia":[{"type":"seq","cap":"Two-phase commit, and the window where it blocks","actors":["Coordinator","Orders","Payments","Stock"],"msgs":[["Coordinator","Orders","prepare"],["Coordinator","Payments","prepare"],["Coordinator","Stock","prepare"],["Stock","Coordinator","yes, locked and ready",true],["Coordinator","Orders","commit (after logging it)"],["Coordinator","Payments","commit"],["Coordinator","Stock","commit"]],"note":"Once a participant has voted yes, it may neither commit nor abort on its own. If the coordinator crashes before telling it, it holds its locks and waits."},{"type":"flow","cap":"A saga that fails at the third step","steps":[["T1 reserve stock","a local transaction in the stock service"],["T2 charge card","a local transaction in payments"],["T3 book courier","fails: no courier available"],["C2 refund card","a compensation, retried until it succeeds"],["C1 release stock","the last compensation; the order is cancelled"]],"note":"Compensations run newest first. Between T1 and C1, other transactions can see stock reserved for an order that will never ship."},{"type":"tiers","cap":"Outbox and inbox between two services","tiers":[["Orders service",["One local transaction: the order row and an outbox row"]],["Relay",["Publishes unsent outbox rows","Marks them sent; a crash means a repeat"],"reads the outbox"],["Message broker",["At-least-once delivery"],"publish"],["Stock service",["One local transaction: skip ids already in the inbox, else apply and record the id"],"deliver"]],"note":"The outbox stops a message from being lost or invented; the inbox stops a repeated message from being applied twice."}],"cmp":[{"cap":"Two-phase commit or a saga","head":["","Two-phase commit","Saga"],"rows":[["Atomicity","All or nothing, enforced by the protocol","All or nothing in the end, through compensations"],["Isolation","Yes: locks are held until the decision","No: others see intermediate states"],["If the coordinator fails","Participants block, holding locks, until it recovers","The orchestrator resumes from its durable log"],["Latency","Two round trips with locks held across them","Each step commits locally at once"],["Typical use","Inside one database system, or a few XA resources","Business workflows across services"]]},{"cap":"Orchestration or choreography","head":["","Orchestration","Choreography"],"rows":[["Who drives the flow","A central orchestrator: a durable state machine","Each service reacts to the others' events"],["Seeing the whole flow","In one place","Spread across services and their subscriptions"],["Coupling","Services take commands from the orchestrator","Services depend on each other's events"],["Good for","Long or branching flows that change","Short flows with two or three steps"]]}],"code":[{"t":"The seeded random generator used by the simulations","tabs":[{"lang":"python","src":"def mulberry32(seed):                           # a tiny seeded random generator, same as the JavaScript one\n    state = seed & 0xFFFFFFFF\n    def rand():\n        nonlocal state\n        state = (state + 0x6D2B79F5) & 0xFFFFFFFF\n        t = ((state ^ (state >> 15)) * (state | 1)) & 0xFFFFFFFF\n        t = (t ^ (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF))) & 0xFFFFFFFF\n        return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296\n    return rand\n"},{"lang":"javascript","src":"function mulberry32(seed) {                     // a tiny seeded random generator, same as the Python one\n  return function () {\n    seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n"}]},{"t":"Two-phase commit, and what a coordinator crash leaves behind","tabs":[{"lang":"python","src":"class Participant:\n    def __init__(self, name, vote_yes=True):\n        self.name, self.vote_yes, self.state = name, vote_yes, \"idle\"\n\n    def prepare(self):\n        if not self.vote_yes:\n            self.state = \"aborted\"             # can't do it: vote no and drop the work\n            return False\n        self.state = \"prepared\"                # changes written durably and locked; promises to obey the decision\n        return True\n\n    def finish(self, decision):\n        self.state = \"committed\" if decision == \"commit\" else \"aborted\"\n\ndef two_phase_commit(participants, log, crash=None):\n    votes = [p.prepare() for p in participants]    # phase 1: prepare and vote\n    decision = \"commit\" if all(votes) else \"abort\"\n    if crash == \"before deciding\":\n        return\n    log.append(decision)                       # the decision is durable before anyone hears it\n    for i, p in enumerate(participants):       # phase 2: tell everyone\n        if crash == \"mid-broadcast\" and i == 1:\n            return\n        p.finish(decision)\n\ndef recover(participants, log):\n    decision = log[-1] if log else \"abort\"     # nothing logged: nobody can have committed, so abort\n    for p in participants:\n        if p.state == \"prepared\":\n            p.finish(decision)\n\ndef show(label, participants):\n    held = sum(1 for p in participants if p.state == \"prepared\")\n    print(f\"{label}: {', '.join(f'{p.name} {p.state}' for p in participants)} | holding locks: {held}\")\n\nfor label, stock_votes_yes, crash in ((\"all vote yes\", True, None), (\"stock votes no\", False, None),\n                                      (\"crash before deciding\", True, \"before deciding\"),\n                                      (\"crash mid-broadcast\", True, \"mid-broadcast\")):\n    ps = [Participant(\"orders\"), Participant(\"payments\"), Participant(\"stock\", stock_votes_yes)]\n    log = []\n    two_phase_commit(ps, log, crash)\n    show(label, ps)\n    if crash:\n        recover(ps, log)\n        show(f\"  after recovery ({log[-1] if log else 'no decision logged'})\", ps)\n","out":"all vote yes: orders committed, payments committed, stock committed | holding locks: 0\nstock votes no: orders aborted, payments aborted, stock aborted | holding locks: 0\ncrash before deciding: orders prepared, payments prepared, stock prepared | holding locks: 3\n  after recovery (no decision logged): orders aborted, payments aborted, stock aborted | holding locks: 0\ncrash mid-broadcast: orders committed, payments prepared, stock prepared | holding locks: 2\n  after recovery (commit): orders committed, payments committed, stock committed | holding locks: 0\n","notes":[[9,"A yes vote is a promise: the changes are durable and locked, and the participant may no longer decide on its own."],[20,"The coordinator writes its decision to its own durable log first, so it can repeat it after a crash."],[27,"With no decision logged, nobody can have committed, so recovery may safely abort."],[42,"Crash between the votes and the decision, and every participant sits prepared, holding locks, until the coordinator returns."]]},{"lang":"javascript","src":"class Participant {\n  constructor(name, voteYes = true) { this.name = name; this.voteYes = voteYes; this.state = \"idle\"; }\n  prepare() {\n    if (!this.voteYes) { this.state = \"aborted\"; return false; }   // can't do it: vote no and drop the work\n    this.state = \"prepared\";                   // changes written durably and locked; promises to obey the decision\n    return true;\n  }\n  finish(decision) { this.state = decision === \"commit\" ? \"committed\" : \"aborted\"; }\n}\n\nfunction twoPhaseCommit(participants, log, crash = null) {\n  const votes = participants.map(p => p.prepare());   // phase 1: prepare and vote\n  const decision = votes.every(Boolean) ? \"commit\" : \"abort\";\n  if (crash === \"before deciding\") return;\n  log.push(decision);                          // the decision is durable before anyone hears it\n  for (let i = 0; i < participants.length; i++) {   // phase 2: tell everyone\n    if (crash === \"mid-broadcast\" && i === 1) return;\n    participants[i].finish(decision);\n  }\n}\n\nfunction recover(participants, log) {\n  const decision = log.length ? log.at(-1) : \"abort\";   // nothing logged: nobody can have committed, so abort\n  for (const p of participants) if (p.state === \"prepared\") p.finish(decision);\n}\n\nfunction show(label, participants) {\n  const held = participants.filter(p => p.state === \"prepared\").length;\n  console.log(`${label}: ${participants.map(p => `${p.name} ${p.state}`).join(\", \")} | holding locks: ${held}`);\n}\n\nfor (const [label, stockVotesYes, crash] of [[\"all vote yes\", true, null], [\"stock votes no\", false, null],\n                                             [\"crash before deciding\", true, \"before deciding\"],\n                                             [\"crash mid-broadcast\", true, \"mid-broadcast\"]]) {\n  const ps = [new Participant(\"orders\"), new Participant(\"payments\"), new Participant(\"stock\", stockVotesYes)];\n  const log = [];\n  twoPhaseCommit(ps, log, crash);\n  show(label, ps);\n  if (crash) {\n    recover(ps, log);\n    show(`  after recovery (${log.length ? log.at(-1) : \"no decision logged\"})`, ps);\n  }\n}\n","out":"all vote yes: orders committed, payments committed, stock committed | holding locks: 0\nstock votes no: orders aborted, payments aborted, stock aborted | holding locks: 0\ncrash before deciding: orders prepared, payments prepared, stock prepared | holding locks: 3\n  after recovery (no decision logged): orders aborted, payments aborted, stock aborted | holding locks: 0\ncrash mid-broadcast: orders committed, payments prepared, stock prepared | holding locks: 2\n  after recovery (commit): orders committed, payments committed, stock committed | holding locks: 0\n","notes":[[5,"A yes vote is a promise: the changes are durable and locked, and the participant may no longer decide on its own."],[15,"The coordinator writes its decision to its own durable log first, so it can repeat it after a crash."],[23,"With no decision logged, nobody can have committed, so recovery may safely abort."],[38,"Crash between the votes and the decision, and every participant sits prepared, holding locks, until the coordinator returns."]]}]},{"t":"An orchestrated saga: compensations in reverse","tabs":[{"lang":"python","src":"STEPS = [(\"reserve stock\", \"release stock\"), (\"charge card\", \"refund card\"), (\"book courier\", \"cancel courier\")]\n\ndef run_saga(fail_at=None):\n    done, log = [], []\n    for action, compensation in STEPS:\n        if action == fail_at:\n            log.append(f\"{action} FAILED\")\n            for _, undo in reversed(done):     # undo what succeeded, newest first\n                log.append(undo)\n            return \"cancelled\", log\n        log.append(action)                     # each step is a local transaction that commits at once\n        done.append((action, compensation))\n    return \"confirmed\", log\n\nfor fail_at in (None, \"charge card\", \"book courier\"):\n    status, log = run_saga(fail_at)\n    print(f\"{fail_at or 'no failure'}: {' -> '.join(log)} => order {status}\")\n","out":"no failure: reserve stock -> charge card -> book courier => order confirmed\ncharge card: reserve stock -> charge card FAILED -> release stock => order cancelled\nbook courier: reserve stock -> charge card -> book courier FAILED -> refund card -> release stock => order cancelled\n","notes":[[1,"Every step comes with its compensation: a business-level undo, not a database rollback."],[8,"On failure, the steps that already committed are undone newest first, which matters when later steps depend on earlier ones."],[11,"Each step commits on its own, so other transactions can see the half-done order: sagas have no isolation."]]},{"lang":"javascript","src":"const STEPS = [[\"reserve stock\", \"release stock\"], [\"charge card\", \"refund card\"], [\"book courier\", \"cancel courier\"]];\n\nfunction runSaga(failAt = null) {\n  const done = [], log = [];\n  for (const [action, compensation] of STEPS) {\n    if (action === failAt) {\n      log.push(`${action} FAILED`);\n      for (const [, undo] of [...done].reverse()) log.push(undo);   // undo what succeeded, newest first\n      return [\"cancelled\", log];\n    }\n    log.push(action);                          // each step is a local transaction that commits at once\n    done.push([action, compensation]);\n  }\n  return [\"confirmed\", log];\n}\n\nfor (const failAt of [null, \"charge card\", \"book courier\"]) {\n  const [status, log] = runSaga(failAt);\n  console.log(`${failAt ?? \"no failure\"}: ${log.join(\" -> \")} => order ${status}`);\n}\n","out":"no failure: reserve stock -> charge card -> book courier => order confirmed\ncharge card: reserve stock -> charge card FAILED -> release stock => order cancelled\nbook courier: reserve stock -> charge card -> book courier FAILED -> refund card -> release stock => order cancelled\n","notes":[[1,"Every step comes with its compensation: a business-level undo, not a database rollback."],[8,"On failure, the steps that already committed are undone newest first, which matters when later steps depend on earlier ones."],[11,"Each step commits on its own, so other transactions can see the half-done order: sagas have no isolation."]]}]},{"t":"Outbox and inbox in SQLite: every message applied exactly once","tabs":[{"lang":"python","src":"import sqlite3\n\norders_db, stock_db = sqlite3.connect(\":memory:\"), sqlite3.connect(\":memory:\")\norders_db.executescript(\"\"\"\n    CREATE TABLE orders (id INTEGER PRIMARY KEY, item TEXT, qty INTEGER);\n    CREATE TABLE outbox (id INTEGER PRIMARY KEY, payload TEXT, sent INTEGER DEFAULT 0);\n\"\"\")\nstock_db.executescript(\"\"\"\n    CREATE TABLE stock (item TEXT PRIMARY KEY, reserved INTEGER);\n    CREATE TABLE inbox (message_id INTEGER PRIMARY KEY);\n    INSERT INTO stock VALUES ('pizza', 0);\n\"\"\")\n\ndef place_order(item, qty):\n    with orders_db:                            # one local transaction: the order and its message\n        order_id = orders_db.execute(\"INSERT INTO orders (item, qty) VALUES (?, ?)\", (item, qty)).lastrowid\n        orders_db.execute(\"INSERT INTO outbox (payload) VALUES (?)\", (f\"{order_id}:{item}:{qty}\",))\n\ndef handle(message_id, payload):\n    with stock_db:                             # the inbox row and the effect commit together\n        if stock_db.execute(\"INSERT OR IGNORE INTO inbox VALUES (?)\", (message_id,)).rowcount == 0:\n            return \"duplicate\"                 # seen before: skip the effect\n        _, item, qty = payload.split(\":\")\n        stock_db.execute(\"UPDATE stock SET reserved = reserved + ? WHERE item = ?\", (int(qty), item))\n        return \"applied\"\n\nfor _ in range(20):\n    place_order(\"pizza\", 1)\nrand, outcomes = mulberry32(8), {\"applied\": 0, \"duplicate\": 0}\nwhile True:                                    # the relay: at-least-once delivery\n    row = orders_db.execute(\"SELECT id, payload FROM outbox WHERE sent = 0 ORDER BY id LIMIT 1\").fetchone()\n    if row is None:\n        break\n    outcomes[handle(*row)] += 1\n    if rand() < 0.3:\n        continue                               # crashed before marking it sent: it will be delivered again\n    with orders_db:\n        orders_db.execute(\"UPDATE outbox SET sent = 1 WHERE id = ?\", (row[0],))\nreserved = stock_db.execute(\"SELECT reserved FROM stock\").fetchone()[0]\nprint(f\"orders: 20 | deliveries: {sum(outcomes.values())} | applied: {outcomes['applied']} | \"\n      f\"duplicates ignored: {outcomes['duplicate']} | pizzas reserved: {reserved}\")\n","out":"orders: 20 | deliveries: 30 | applied: 20 | duplicates ignored: 10 | pizzas reserved: 20\n","notes":[[15,"The order and its outgoing message commit together, so neither can exist without the other."],[21,"INSERT OR IGNORE changes no rows for an id that's already there: that's the duplicate check, inside the same transaction as the effect."],[36,"A crash between delivering and marking the row sent makes the relay deliver it again: at-least-once."],[40,"More deliveries than orders, yet exactly 20 pizzas reserved: the outbox and the inbox together give an exactly-once effect."]]},{"lang":"javascript","src":"const { DatabaseSync } = require(\"node:sqlite\");\n\nconst ordersDb = new DatabaseSync(\":memory:\"), stockDb = new DatabaseSync(\":memory:\");\nordersDb.exec(`\n  CREATE TABLE orders (id INTEGER PRIMARY KEY, item TEXT, qty INTEGER);\n  CREATE TABLE outbox (id INTEGER PRIMARY KEY, payload TEXT, sent INTEGER DEFAULT 0);\n`);\nstockDb.exec(`\n  CREATE TABLE stock (item TEXT PRIMARY KEY, reserved INTEGER);\n  CREATE TABLE inbox (message_id INTEGER PRIMARY KEY);\n  INSERT INTO stock VALUES ('pizza', 0);\n`);\n\nfunction inTransaction(db, fn) {               // commit if fn returns, roll back if it throws\n  db.exec(\"BEGIN\");\n  try { const result = fn(); db.exec(\"COMMIT\"); return result; } catch (err) { db.exec(\"ROLLBACK\"); throw err; }\n}\n\nfunction placeOrder(item, qty) {\n  inTransaction(ordersDb, () => {              // one local transaction: the order and its message\n    const orderId = ordersDb.prepare(\"INSERT INTO orders (item, qty) VALUES (?, ?)\").run(item, qty).lastInsertRowid;\n    ordersDb.prepare(\"INSERT INTO outbox (payload) VALUES (?)\").run(`${orderId}:${item}:${qty}`);\n  });\n}\n\nfunction handle(messageId, payload) {\n  return inTransaction(stockDb, () => {        // the inbox row and the effect commit together\n    if (stockDb.prepare(\"INSERT OR IGNORE INTO inbox VALUES (?)\").run(messageId).changes === 0) return \"duplicate\";   // seen before: skip the effect\n    const [, item, qty] = payload.split(\":\");\n    stockDb.prepare(\"UPDATE stock SET reserved = reserved + ? WHERE item = ?\").run(Number(qty), item);\n    return \"applied\";\n  });\n}\n\nfor (let i = 0; i < 20; i++) placeOrder(\"pizza\", 1);\nconst rand = mulberry32(8), outcomes = { applied: 0, duplicate: 0 };\nwhile (true) {                                 // the relay: at-least-once delivery\n  const row = ordersDb.prepare(\"SELECT id, payload FROM outbox WHERE sent = 0 ORDER BY id LIMIT 1\").get();\n  if (row === undefined) break;\n  outcomes[handle(row.id, row.payload)]++;\n  if (rand() < 0.3) continue;                  // crashed before marking it sent: it will be delivered again\n  ordersDb.prepare(\"UPDATE outbox SET sent = 1 WHERE id = ?\").run(row.id);\n}\nconst reserved = stockDb.prepare(\"SELECT reserved FROM stock\").get().reserved;\nconsole.log(`orders: 20 | deliveries: ${outcomes.applied + outcomes.duplicate} | applied: ${outcomes.applied} | ` +\n            `duplicates ignored: ${outcomes.duplicate} | pizzas reserved: ${reserved}`);\n","out":"orders: 20 | deliveries: 30 | applied: 20 | duplicates ignored: 10 | pizzas reserved: 20\n","notes":[[20,"The order and its outgoing message commit together, so neither can exist without the other."],[27,"INSERT OR IGNORE changes no rows for an id that's already there: that's the duplicate check, inside the same transaction as the effect."],[41,"A crash between delivering and marking the row sent makes the relay deliver it again: at-least-once."],[45,"More deliveries than orders, yet exactly 20 pizzas reserved: the outbox and the inbox together give an exactly-once effect."]]}]}],"ex":{"q":"A travel site books a hotel, a hire car and a flight for one trip. Holds on the hotel and car can be released for free, but once a flight is ticketed it can't be undone. Confirmation emails and loyalty points must happen eventually. Order the saga's steps and show what happens when each kind of step fails.","steps":["Classify each step: compensatable (hotel hold, car hold: they can be undone), the pivot (ticketing the flight: once it succeeds the saga must finish), and retriable (email, points: they can't fail for good, so they're retried until they succeed).","Order them: every compensatable step before the pivot, every retriable step after it. A failure before or at the pivot compensates the earlier holds; after the pivot there's no going back, only forward with retries.","Make every step idempotent with a key per saga and step, because the orchestrator may repeat a step after a crash, and persist the saga's progress after every step so it can resume.","Cost: one local transaction per step plus one per compensation, O(steps); the price of no isolation is that users and other services can see the holds, so show them as pending."],"code":{"t":"Checking the step order, then running the saga with failures","tabs":[{"lang":"python","src":"def check(steps):\n    \"\"\"Compensatable steps first, then at most one pivot, then only retriable steps.\"\"\"\n    rank = {\"compensatable\": 0, \"pivot\": 1, \"retriable\": 2}\n    ranks = [rank[kind] for _, kind, _ in steps]\n    return ranks == sorted(ranks) and ranks.count(1) <= 1\n\ndef run(steps, failures):\n    \"\"\"failures: step name -> how many attempts fail before one succeeds (a big number means it never does).\"\"\"\n    log, undo = [], []\n    for name, kind, compensation in steps:\n        attempts = 1\n        while attempts <= failures.get(name, 0):\n            if kind != \"retriable\":            # a hold or the pivot failed: compensate and stop\n                return \"cancelled\", log + [f\"{name} failed\"] + undo[::-1]\n            attempts += 1                      # retriable: try again (with backoff in real life)\n        log.append(name if attempts == 1 else f\"{name} (try {attempts})\")\n        if compensation:\n            undo.append(compensation)\n    return \"booked\", log\n\nTRIP = [(\"hold hotel\", \"compensatable\", \"release hotel\"), (\"hold car\", \"compensatable\", \"release car\"),\n        (\"ticket flight\", \"pivot\", None), (\"email itinerary\", \"retriable\", None), (\"award points\", \"retriable\", None)]\nBAD = [TRIP[0], TRIP[2], TRIP[1]] + TRIP[3:]      # the flight is ticketed before the car hold\nprint(\"step order:\", \"valid\" if check(TRIP) else \"invalid\", \"| with the flight before the car:\", \"valid\" if check(BAD) else \"invalid\")\nfor label, failures in ((\"no failures\", {}), (\"ticketing fails\", {\"ticket flight\": 99}),\n                        (\"email fails twice\", {\"email itinerary\": 2})):\n    status, log = run(TRIP, failures)\n    print(f\"{label}: {' -> '.join(log)} => {status}\")\n","out":"step order: valid | with the flight before the car: invalid\nno failures: hold hotel -> hold car -> ticket flight -> email itinerary -> award points => booked\nticketing fails: hold hotel -> hold car -> ticket flight failed -> release car -> release hotel => cancelled\nemail fails twice: hold hotel -> hold car -> ticket flight -> email itinerary (try 3) -> award points => booked\n"},{"lang":"javascript","src":"function check(steps) {\n  // compensatable steps first, then at most one pivot, then only retriable steps\n  const rank = { compensatable: 0, pivot: 1, retriable: 2 };\n  const ranks = steps.map(([, kind]) => rank[kind]);\n  return ranks.every((r, i) => i === 0 || ranks[i - 1] <= r) && ranks.filter(r => r === 1).length <= 1;\n}\n\nfunction run(steps, failures) {\n  // failures: step name -> how many attempts fail before one succeeds (a big number means it never does)\n  const log = [], undo = [];\n  for (const [name, kind, compensation] of steps) {\n    let attempts = 1;\n    while (attempts <= (failures[name] ?? 0)) {\n      if (kind !== \"retriable\") return [\"cancelled\", [...log, `${name} failed`, ...[...undo].reverse()]];   // a hold or the pivot failed: compensate and stop\n      attempts++;                              // retriable: try again (with backoff in real life)\n    }\n    log.push(attempts === 1 ? name : `${name} (try ${attempts})`);\n    if (compensation) undo.push(compensation);\n  }\n  return [\"booked\", log];\n}\n\nconst TRIP = [[\"hold hotel\", \"compensatable\", \"release hotel\"], [\"hold car\", \"compensatable\", \"release car\"],\n              [\"ticket flight\", \"pivot\", null], [\"email itinerary\", \"retriable\", null], [\"award points\", \"retriable\", null]];\nconst BAD = [TRIP[0], TRIP[2], TRIP[1], ...TRIP.slice(3)];   // the flight is ticketed before the car hold\nconsole.log(\"step order:\", check(TRIP) ? \"valid\" : \"invalid\", \"| with the flight before the car:\", check(BAD) ? \"valid\" : \"invalid\");\nfor (const [label, failures] of [[\"no failures\", {}], [\"ticketing fails\", { \"ticket flight\": 99 }],\n                                 [\"email fails twice\", { \"email itinerary\": 2 }]]) {\n  const [status, log] = run(TRIP, failures);\n  console.log(`${label}: ${log.join(\" -> \")} => ${status}`);\n}\n","out":"step order: valid | with the flight before the car: invalid\nno failures: hold hotel -> hold car -> ticket flight -> email itinerary -> award points => booked\nticketing fails: hold hotel -> hold car -> ticket flight failed -> release car -> release hotel => cancelled\nemail fails twice: hold hotel -> hold car -> ticket flight -> email itinerary (try 3) -> award points => booked\n"}]},"a":"The trip's order is valid, while ticketing the flight before the car hold is rejected. When ticketing fails, the car and hotel holds are released, newest first, and the trip is cancelled; when the email fails twice after the flight is ticketed, the saga can only go forward, so it retries until the third try succeeds and the trip is booked."},"fade":{"q":"An orchestrator crashed in the middle of a saga. Its durable log holds entries like `did reserve stock`, `failed book courier` and `undid refund card`. Finish `resume(log)`: return the actions still to run. With no failure logged, continue forward from the first step not done; after a failure, run the compensations of the steps done that aren't yet undone, newest first.","steps":["Collect the steps done (in order), the compensations already run, and whether any step failed.",{"ask":"Why might `resume` repeat an action that actually happened?","a":"The orchestrator can crash after a step committed but before it logged `did …`. Resuming then runs the step again, which is why every step and compensation must be idempotent, keyed by saga and step."},{"ask":"Why compensate newest first?","a":"Later steps often depend on earlier ones: refund the card before releasing the stock, so nothing is shipped against a released reservation, and the state unwinds through valid states."},{"ask":"What does it cost, and where does the log live?","a":"O(log length) to rebuild the state. The log must be durable and written before each action is acknowledged, in the orchestrator's own database, or kept by a workflow engine (Temporal, AWS Step Functions and similar keep this history for you)."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"STEPS = [(\"reserve stock\", \"release stock\"), (\"charge card\", \"refund card\"), (\"book courier\", \"cancel courier\")]\n\ndef resume(log):\n    ...                                        # TODO: forward from the first step not done, or compensate newest first\n"},{"lang":"javascript","src":"const STEPS = [[\"reserve stock\", \"release stock\"], [\"charge card\", \"refund card\"], [\"book courier\", \"cancel courier\"]];\n\nfunction resume(log) {\n  // TODO: forward from the first step not done, or compensate newest first\n}\n"}]},"solution":{"t":"Solution: rebuild the state from the log, then decide the direction","tabs":[{"lang":"python","src":"STEPS = [(\"reserve stock\", \"release stock\"), (\"charge card\", \"refund card\"), (\"book courier\", \"cancel courier\")]\n\ndef resume(log):\n    done = [e[len(\"did \"):] for e in log if e.startswith(\"did \")]\n    undone = {e[len(\"undid \"):] for e in log if e.startswith(\"undid \")}\n    if any(e.startswith(\"failed \") for e in log):\n        compensation = dict(STEPS)\n        return [compensation[a] for a in reversed(done) if compensation[a] not in undone]   # unwind, newest first\n    return [a for a, _ in STEPS][len(done):]   # carry on forward\n\nfor label, log in ((\"crashed after charging\", [\"did reserve stock\", \"did charge card\"]),\n                   (\"crashed while compensating\", [\"did reserve stock\", \"did charge card\", \"failed book courier\", \"undid refund card\"]),\n                   (\"crashed before starting\", [])):\n    print(f\"{label}: next {', '.join(resume(log)) or 'nothing'}\")\n","out":"crashed after charging: next book courier\ncrashed while compensating: next release stock\ncrashed before starting: next reserve stock, charge card, book courier\n"},{"lang":"javascript","src":"const STEPS = [[\"reserve stock\", \"release stock\"], [\"charge card\", \"refund card\"], [\"book courier\", \"cancel courier\"]];\n\nfunction resume(log) {\n  const done = log.filter(e => e.startsWith(\"did \")).map(e => e.slice(\"did \".length));\n  const undone = new Set(log.filter(e => e.startsWith(\"undid \")).map(e => e.slice(\"undid \".length)));\n  if (log.some(e => e.startsWith(\"failed \"))) {\n    const compensation = new Map(STEPS);\n    return [...done].reverse().map(a => compensation.get(a)).filter(c => !undone.has(c));   // unwind, newest first\n  }\n  return STEPS.map(([a]) => a).slice(done.length);   // carry on forward\n}\n\nfor (const [label, log] of [[\"crashed after charging\", [\"did reserve stock\", \"did charge card\"]],\n                            [\"crashed while compensating\", [\"did reserve stock\", \"did charge card\", \"failed book courier\", \"undid refund card\"]],\n                            [\"crashed before starting\", []]]) {\n  console.log(`${label}: next ${resume(log).join(\", \") || \"nothing\"}`);\n}\n","out":"crashed after charging: next book courier\ncrashed while compensating: next release stock\ncrashed before starting: next reserve stock, charge card, book courier\n"}]}},"traps":[["“Use two-phase commit across our microservices.”","Every service must support prepare, all of them must be up for any order to commit, and a coordinator failure leaves them holding locks. Across services, sagas with idempotent steps are the usual answer; keep 2PC inside database systems that make the coordinator highly available."],["“A compensation is a rollback.”","The original step committed and others may have seen it. A compensation is a new business action (a refund, a release, a cancellation) that must be idempotent and retried until it succeeds, and it may leave traces, such as a refund line on a statement."],["“A saga is isolated like a transaction.”","Each step commits at once, so other transactions see intermediate states: stock reserved for an order that will be cancelled. Use pending states, commutative updates and re-reads, and show users the pending status."],["“Put the irreversible step first, to get it over with.”","Then a later failure leaves nothing you can undo. Put compensatable steps first, then the pivot, then steps that can only be retried."],["“Choreography is always more decoupled, so always use it.”","For long flows the logic hides in a web of subscriptions, cycles creep in, and nobody can say where an order is. An orchestrator keeps the flow visible and resumable; choreography suits two or three steps."],["“The broker deduplicates, so consumers don't need an inbox.”","Broker deduplication covers narrow cases and windows. A consumer that records processed ids in the same transaction as its effect is safe against every kind of repeat, including relay replays from the outbox."]],"disc":[["When would you still choose two-phase commit?","When the participants are resources inside one system you control and the coordinator is made highly available: a distributed SQL database, for example, commits multi-shard transactions with a 2PC-style protocol whose state is replicated by consensus, so a coordinator crash doesn't block for long. For a few XA-capable resources in one data centre it can also work. Across independently deployed services, sagas are usually better."],["Design the saga for placing a food order: payment, restaurant acceptance and courier assignment.","Steps: authorise the card (compensation: void the authorisation), ask the restaurant to accept (compensation: cancel the order with the restaurant), assign a courier (retriable, since another courier can be tried), then capture the payment as the pivot once the food is collected. An orchestrator persists the state after each step, every call carries an idempotency key, and the customer sees \"waiting for the restaurant\" rather than a false confirmation."]],"teach":{"prompt":"Explain to a junior colleague the difference between two-phase commit and a saga, and how the outbox and inbox patterns make a saga's messages safe.","rubric":["2PC: prepare and vote, then commit; atomic but blocking if the coordinator fails","Saga: local transactions with compensations in reverse; no isolation","Compensations are idempotent business undos, retried until they succeed","Step order: compensatable, then the pivot, then retriable; orchestration versus choreography","Outbox for reliable publishing, inbox for idempotent consuming"],"model":"Two-phase commit asks every participant to prepare, which makes their changes durable and locked, and to vote; if everyone votes yes, the coordinator logs commit and tells them all. It's atomic, but participants hold locks across two round trips and are stuck if the coordinator dies after the votes, so it's mostly used inside database systems. A saga instead runs a local transaction in each service and, if a step fails, runs compensations for the earlier steps in reverse: a refund, a release, a cancellation. Compensations must be idempotent and retried until they succeed, and steps that can't be undone go after the ones that might fail. Sagas have no isolation, so we show pending states. Each step writes its messages to an outbox in the same transaction as its data, and a relay publishes them at least once; each consumer records message ids in an inbox in the same transaction as its effect, so a repeated message has no effect."},"qa":[["What does a yes vote mean in two-phase commit?","The participant's changes are durable and locked, and it will obey the coordinator's decision."],["Why does 2PC block?","Participants that voted yes can't decide alone, so they wait, holding locks, if the coordinator fails."],["What is a compensating transaction?","A business action that semantically undoes a committed saga step, such as a refund."],["Where does the pivot step go in a saga?","After every compensatable step and before every retriable one."],["Orchestration or choreography?","A central durable orchestrator drives the flow, or services react to each other's events."],["What does the inbox pattern store?","The ids of messages already handled, written in the same transaction as their effects."]],"quiz":[{"q":"What does this print?","snip":{"t":"Votes in two-phase commit","tabs":[{"lang":"python","src":"votes = {\"orders\": True, \"payments\": True, \"stock\": False}\ndecision = \"commit\" if all(votes.values()) else \"abort\"\nprint(decision, sum(votes.values()))\n"},{"lang":"javascript","src":"const votes = { orders: true, payments: true, stock: false };\nconst decision = Object.values(votes).every(Boolean) ? \"commit\" : \"abort\";\nconsole.log(decision, Object.values(votes).filter(Boolean).length);\n"}]},"o":["abort 2","commit 2","abort 3","commit 3"],"a":0,"e":"One no vote aborts the whole transaction, even though two participants voted yes and were ready to commit."},{"q":"What does this print?","snip":{"t":"Compensating after the third step fails","tabs":[{"lang":"python","src":"done = [\"reserve stock\", \"charge card\"]\nundo = {\"reserve stock\": \"release stock\", \"charge card\": \"refund card\"}\nprint(\" > \".join(undo[s] for s in reversed(done)))\n"},{"lang":"javascript","src":"const done = [\"reserve stock\", \"charge card\"];\nconst undo = { \"reserve stock\": \"release stock\", \"charge card\": \"refund card\" };\nconsole.log([...done].reverse().map(s => undo[s]).join(\" > \"));\n"}]},"o":["refund card > release stock","release stock > refund card","cancel courier > refund card > release stock","refund card"],"a":0,"e":"Only the steps that succeeded are compensated, newest first: the card is refunded, then the stock released. The failed courier booking needs no undo."},{"q":"In two-phase commit, a participant has voted yes, and then the coordinator goes silent. What may the participant do?","o":["Wait, holding its locks, until it learns the decision (from the coordinator, or from a participant that knows it)","Commit on its own","Abort on its own","Follow whatever most participants voted"],"a":0,"e":"The coordinator may have logged either decision. Committing alone could break an abort; aborting alone could break a commit that others already applied. It can learn the decision from a peer that knows it, but if every peer is also just prepared, it must wait."},{"q":"When does an orchestrated saga fit better than choreography?","o":["A long flow with many steps and branches that you need to follow, change and resume in one place","Two services that each react to one event","When no component should know the whole flow","When none of the steps can be compensated"],"a":0,"e":"An orchestrator keeps the flow explicit and its progress durable. Choreography suits short flows, and steps that can't be compensated need careful ordering whichever style you use."},{"q":"Which make compensations safe to rely on? (choose 2)","t":"ms","o":["They're idempotent, so running one twice is harmless","They're retried until they succeed","They roll back the other service's database directly","They run in the same database transaction as the original step","They're skipped when the original step looks as if it failed"],"a":[0,1],"e":"Orchestrators retry, so compensations repeat; they must be idempotent and must eventually succeed. The original step committed in another database, so there's no shared transaction to roll back, and a step that only looks failed may have committed."},{"q":"Judge each statement.","t":"yn","s":[["Two-phase commit can leave participants blocked if the coordinator fails after they vote yes.",true],["A saga gives the same isolation as a single database transaction.",false],["An inbox table lets a consumer ignore a message it has already processed.",true],["Steps that can't be undone should come before steps that might fail.",false]],"e":"Sagas expose intermediate states, so they need countermeasures such as pending states. And irreversible steps go after the steps that might fail, so a failure can still be compensated."},{"q":"Put two-phase commit in order.","t":"ord","items":["The coordinator asks every participant to prepare","Each participant writes its changes durably and votes","The coordinator logs its decision","The coordinator tells every participant the decision","Participants commit or abort and release their locks"],"e":"Logging the decision before telling anyone is what lets a recovering coordinator finish the job."},{"q":"Complete the Python inbox check: apply a message's effect only the first time its id is seen, in one transaction.","t":"drop","lang":"python","code":"def handle_once(db, message_id, apply):\n    with db:\n        cur = db.execute(\"INSERT OR {{0}} INTO inbox (message_id) VALUES (?)\", (message_id,))\n        if cur.rowcount == {{1}}:\n            return False\n        apply(db)\n        return True\n","blanks":[{"o":["IGNORE","REPLACE","ABORT","FAIL"],"a":0},{"o":["0","1","-1","None"],"a":0}],"e":"INSERT OR IGNORE inserts nothing for an id already present, so the cursor reports 0 changed rows and the effect is skipped; the inbox row and the effect commit together."}],"probs":[["Reading · Sagas (1987)","https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf","","read sections 1–3, then explain why a saga gives up isolation and what the paper suggests instead"],["Pattern · Saga","https://microservices.io/patterns/data/saga.html","","draw the order saga from this module as both an orchestration and a choreography, and compare them"],["Reference · Saga distributed transactions","https://learn.microsoft.com/en-us/azure/architecture/patterns/saga","","list the data anomalies it describes and match each to a countermeasure"],["Exercise · PREPARE TRANSACTION","https://www.postgresql.org/docs/current/sql-prepare-transaction.html","","prepare a transaction in one session, then try to update the same row from another and watch it wait"]],"src":[["Hector Garcia-Molina and Kenneth Salem: Sagas (SIGMOD 1987)","https://www.cs.cornell.edu/andru/cs711/2002fa/reading/sagas.pdf"],["microservices.io: Pattern: Saga","https://microservices.io/patterns/data/saga.html"],["Azure Architecture Center: Saga distributed transactions pattern","https://learn.microsoft.com/en-us/azure/architecture/patterns/saga"],["PostgreSQL docs: PREPARE TRANSACTION","https://www.postgresql.org/docs/current/sql-prepare-transaction.html"],["microservices.io: Pattern: Transactional outbox","https://microservices.io/patterns/data/transactional-outbox.html"]]},{"id":"m02","d":"d1","t":"Event-driven architecture: event sourcing, CQRS and evolving schemas","min":120,"hook":"Instead of storing only the current state, store what happened: OrderPlaced, PaymentTaken, OrderShipped. The log of events becomes the source of truth, and current state, search indexes and dashboards become views computed from it. That buys an audit trail, replays and new read models whenever you need them. The price is read models that lag, events that must stay readable for years, and Kafka partitions to size and rebalance.","pre":{"q":"An online shop stores only each order's current status. Finance asks how many orders were cancelled after payment last quarter, and how long each spent waiting for payment. Why is that hard to answer, and what would have made it easy?","a":"Each status change overwrote the last, so only the final status survives. If every change had been kept as an immutable event (placed, paid, cancelled, each with a time), the question would be a query over the event log, and a new report could be built at any time by replaying the log from the start."},"kid":{"t":"Luigi's diary instead of a whiteboard","x":"Luigi used to keep only the till total on a whiteboard, wiping it at every sale. Now he writes every sale and every refund in a diary, one line each, and never rubs anything out: a mistake gets a new line that corrects it. From the diary he can work out the total at any moment, and his helpers make their own summaries from it, such as tips per waiter or pizzas per hour, without disturbing his writing. When he began noting table numbers, the old lines had none, so the summaries say \"unknown table\" for those. On busy nights, each helper reads only some tables' pages.","map":[["A line for every sale and refund, never rubbed out","Event sourcing: an append-only log of immutable events is the source of truth"],["Working out the total at any moment","Current state is a fold over the events; replay gives the state at any point in time"],["Helpers' summaries made from the diary","CQRS projections: read models built from events, separate from the write side"],["Old lines without table numbers","Schema evolution: new fields need defaults so old events stay readable"],["Each helper reading only some tables' pages","Partitions and consumer groups: each partition is read by one member, in order"]],"brk":"Luigi's diary is one book on one counter. A real event log is spread over many machines and partitions, so events for different tables can be read in different orders, and summaries can lag behind the latest line."},"keys":["**Event sourcing**: store every state change as an immutable event in an append-only stream per entity (an aggregate): AccountOpened, MoneyDeposited, MoneyWithdrawn. Current state is a fold over the stream. Events are never edited; a mistake is corrected by a new event.","**What it buys, and what it costs**: a complete audit trail, the state at any past moment, replays to fix bugs or build new views, and a natural feed for other services. The costs: rebuilding state means replaying (so take snapshots every N events), read models are eventually consistent, events must stay readable forever, and erasing personal data from an immutable log needs care (for example, encrypt each person's data with their own key and delete the key).","**Commands and concurrency**: a command (withdraw €30) is checked against the current state and either rejected or turned into new events. Two writers can decide on the same old state, so appends carry the version the writer saw (an expected version); the store rejects a stale append, and the writer reloads and decides again.","**CQRS**: separate the write model, which validates commands and appends events, from read models (projections) shaped for each query: a status count in SQL, order history in a document store, text in a search index. Projections consume the events, track their position in the log, are idempotent, can lag, and can be rebuilt from offset zero.","**Designing events**: name business facts in the past tense, include what consumers need (ids, amounts, currency, time), and keep events small and stable. An event is a public contract: once other teams consume it, changing it is a migration.","**Schema evolution**: backward compatibility means new readers can read old events; forward compatibility means old readers can read new ones. Add optional fields with defaults; never reuse, rename or retype a field. A schema registry (Avro, Protobuf or JSON Schema) checks every change, and old events can be upcast to the new shape as they're read.","**Kafka partitions**: a topic's partitions are its unit of ordering and of parallelism. Records with the same key go to the same partition (a hash of the key, modulo the partition count), so they stay in order. Size the count from the target throughput divided by what one consumer handles, with headroom: adding partitions later remaps most keys and breaks per-key ordering across the change.","**Consumer groups in operation**: each partition is read by one member of a group. When members join or leave, partitions are reassigned; cooperative (incremental) rebalancing moves only what must move, instead of pausing everything. Consumer lag (latest offset minus committed offset) is the health metric to alert on, and log compaction keeps only the latest record per key for changelog topics."],"dia":[{"type":"tiers","cap":"Event sourcing with CQRS","tiers":[["Commands",["place order","pay","cancel"]],["Write model",["Load the aggr
