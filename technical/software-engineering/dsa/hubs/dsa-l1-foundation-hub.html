<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DSA L1 Foundation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell. Sticky header + scrollable tab bar; Start = dashboard grid; Learn = module rail + reading pane;
   exam views (practice, cases, mock) are focused single columns with a sticky side panel on desktop. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --surface-3:#dde3eb; --line:#d0d8e2;
  --fg:#121b26; --muted:#526072; --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16774b; --good-soft:#d9f1e4; --bad:#b1232b; --bad-soft:#fae1e2; --trap:#965200; --trap-soft:#fcedd5;
  --info:#1f5fa8; --info-soft:#dfeafa;
  --d1:#6a44c2; --d1-soft:#ebe4fa; --d2:#0d7585; --d2-soft:#d9f0f2; --d3:#a8521a; --d3-soft:#f8e6d8;
  --d4:#a72a62; --d4-soft:#f8e0eb; --d5:#3d6b22; --d5-soft:#e3efd9;
  --code-bg:#0e1621; --code-fg:#d9e4f1; --code-line:#5b6b7d;
  --tk-kw:#c7a8ff; --tk-str:#a3e39a; --tk-com:#7f8d9b; --tk-num:#ffbd7a; --tk-fn:#80cbff; --tk-key:#7fd6c2;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --surface-2:#1b2531; --surface-3:#22303e; --line:#2a3644;
  --fg:#e3eaf2; --muted:#93a2b2; --accent:#8fa4ff; --accent-ink:#0c1117; --accent-soft:#1c2748;
  --good:#4fc98d; --good-soft:#11301f; --bad:#ff7d86; --bad-soft:#3a1519; --trap:#f2b24c; --trap-soft:#33240c;
  --info:#7fb3f5; --info-soft:#152a44;
  --d1:#b89dff; --d1-soft:#271d40; --d2:#55cddd; --d2-soft:#0f2f34; --d3:#f2a46a; --d3-soft:#3a2312;
  --d4:#f58cba; --d4-soft:#3c1628; --d5:#9fd77c; --d5-soft:#1d3010;
  --code-bg:#0a0f14; --code-fg:#d6e2ef; --code-line:#4f5e6e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.56;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:var(--f-mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .code{font-family:var(--f-mono);font-size:.8rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.brand h1{font-size:1.2rem;letter-spacing:-.01em}
.brand .cert{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42ch}
.status{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.status .bar{width:110px;height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.status .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ok .dot{background:var(--good)}
.pill.mid{background:var(--trap-soft);color:var(--trap)} .pill.mid .dot{background:var(--trap)}
.pill.no{background:var(--bad-soft);color:var(--bad)} .pill.no .dot{background:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)} .pill.info .dot{background:var(--info)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:.9rem}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
main{padding-block:20px 72px}
.view[hidden]{display:none!important}

/* Generic */
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-view{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.015em;margin:.15em 0 .35em}
.lede{color:var(--muted);max-width:74ch}
.muted{color:var(--muted)} .small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.d1{background:var(--d1-soft);color:var(--d1)} .chip.d2{background:var(--d2-soft);color:var(--d2)} .chip.d3{background:var(--d3-soft);color:var(--d3)}
.chip.d4{background:var(--d4-soft);color:var(--d4)} .chip.d5{background:var(--d5-soft);color:var(--d5)}
.chip.ai{background:var(--info-soft);color:var(--info)}
.chip{max-width:100%}
.mods .chip,details.lab summary .chip,.mod-head .chip{white-space:normal;text-align:left}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.93rem;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn.ai{border-color:color-mix(in srgb,var(--info) 45%,var(--line));color:var(--info)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3{font-size:1.04rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.callout{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.callout.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.warn{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.callout b.t{display:block;margin-bottom:2px}
ul.keys{margin:0;padding-left:20px;max-width:80ch} ul.keys li{margin-bottom:6px}
ol.steps{margin:0;padding-left:22px;max-width:80ch} ol.steps li{margin-bottom:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.84rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:7px 10px}
textarea{width:100%;min-height:110px;line-height:1.5}
textarea.mono{font-family:var(--f-mono);font-size:.8rem;background:var(--surface-2)}
label.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
select{max-width:100%;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:14px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.fact b{display:block;font-family:var(--f-display);font-size:1.32rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fact span{font-size:.8rem;color:var(--muted)}
.weights{display:flex;min-height:36px;border-radius:8px;overflow:hidden;margin-block:8px;font-size:.8rem;font-weight:700}
.weights div{display:flex;align-items:center;padding:4px 8px;min-width:0;overflow:hidden;line-height:1.2}
.legend{display:grid;gap:4px;font-size:.86rem}
.legend span.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.meter{height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:9px}

/* Roadmap */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.week h3{font-size:1rem}
.week .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.blk input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.blk .lbl{min-width:0;flex:1}
.blk .lbl small{display:block;color:var(--muted);font-size:.78rem}
.blk .t{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.blk .kind{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.skill .s{font-size:.92rem}
.skill .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;font-size:.78rem;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].r0{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].r1{background:var(--trap-soft);color:var(--trap)}
.seg button[aria-pressed="true"].r2{background:var(--good-soft);color:var(--good)}

/* Learn */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 124px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.rail input{width:100%;margin-bottom:4px}
.rail .msel{display:none;width:100%}
.rail h4{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px}
.rail button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.9rem;line-height:1.3}
.rail button:hover{background:var(--surface-2)}
.rail button[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.rail .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);width:24px;flex:none}
.rail .dd{width:8px;height:8px;border-radius:50%;flex:none}
.rail .ok{margin-left:auto;color:var(--good);font-weight:700}
.mod-head{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mod-head h2{font-size:clamp(1.45rem,3vw,2.05rem);letter-spacing:-.015em}
.hook{font-size:1.04rem;border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;max-width:78ch}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);z-index:5;background:var(--bg);padding-block:6px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.toc button:hover{color:var(--fg);border-color:var(--accent)}
.sec{margin-top:24px;scroll-margin-top:170px}
.sec>h3{font-size:1.06rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec>h3 .tag{font-family:var(--f-body);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:76ch}
.story p:last-child{margin-bottom:0}
.breaks{font-size:.92rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.primer{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:80ch}
.primer .q{font-weight:700;margin-bottom:8px}
pre.code{background:var(--code-bg);color:var(--code-fg);padding:12px 0;border-radius:var(--r);overflow-x:auto;line-height:1.55;margin:0;font-size:.82rem}
pre.code .ln{display:block;padding-inline:14px 16px;white-space:pre}
pre.code .ln.hl{background:color-mix(in srgb,var(--accent) 22%,transparent)}
pre.code .no{display:inline-block;width:2.4em;color:var(--code-line);user-select:none;text-align:right;margin-right:12px}
.tk-kw{color:var(--tk-kw)} .tk-str{color:var(--tk-str)} .tk-com{color:var(--tk-com);font-style:italic} .tk-num{color:var(--tk-num)} .tk-fn{color:var(--tk-fn)} .tk-key{color:var(--tk-key)}
.codebox{display:grid;gap:8px}
.codebox .ttl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:.92rem}
.codebox .lang{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.notes{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:.9rem}
.notes li{display:grid;grid-template-columns:3.6em minmax(0,1fr);gap:8px}
.notes .ln-ref{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-weight:600;padding-top:2px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.path span.crumb{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.path span.sep{color:var(--muted)}
.portal{display:grid;gap:10px}
.portal .panel ol{margin:6px 0 0;padding-left:22px}
.traps{display:grid;gap:8px}
.trap{background:var(--trap-soft);border:1px solid color-mix(in srgb,var(--trap) 32%,transparent);border-radius:8px;padding:9px 12px;font-size:.94rem}
.trap b.lbl{color:var(--trap)}
.trap .why{display:block;color:var(--fg);margin-top:3px}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.d+details.d{margin-top:8px}
details.d summary{cursor:pointer;font-weight:700}
details.d>div{margin-top:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:84ch}
.fade-step{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.fade-step:first-of-type{border-top:0}
.fade-step .given{color:var(--fg)}
.fade-step .ans{background:var(--good-soft);border-radius:6px;padding:6px 10px}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.flip{min-height:112px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.flip .side{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.flip.on{background:var(--accent-soft)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:28px}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.rubric input{margin-top:5px;accent-color:var(--accent)}

/* Diagrams */
.dia{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow-x:auto}
.dia+.dia{margin-top:10px}
.dia .cap{font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700;letter-spacing:.02em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.flow .st{flex:1 1 140px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.flow .st b{display:block;font-family:var(--f-display);font-size:.93rem;margin-bottom:2px}
.flow .ar{align-self:center;color:var(--accent);font-weight:700;flex:none}
.flow-loop{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.hub{display:grid;gap:10px}
.hub .core{justify-self:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;font-family:var(--f-display);font-weight:700;text-align:center}
.hub .spokes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.hub .sp{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hub .sp b{display:block;font-family:var(--f-display)}
.nest{border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:.88rem;background:color-mix(in srgb,var(--accent) 4%,transparent)}
.nest>.lbl{font-family:var(--f-display);font-weight:700}
.nest>.sub{color:var(--muted);font-size:.84rem}
.layers{display:grid;gap:5px}
.layers .ly{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 10px;font-size:.86rem}
.layers .ly b{font-family:var(--f-display)}
.seq{display:grid;gap:0;min-width:520px;font-size:.8rem}
.seq .actors,.seq .msg{display:grid}
.seq .actors{margin-bottom:10px}
.seq .actor{text-align:center;font-weight:700;font-family:var(--f-display);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 4px;margin-inline:4px;font-size:.84rem}
.seq .msg{position:relative;min-height:34px;background-image:var(--lanes);}
.seq .arrow{position:relative;align-self:center;height:0;border-top:2px solid var(--accent);margin-inline:10%}
.seq .arrow.dash{border-top-style:dashed}
.seq .arrow::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.seq .arrow.r::after{right:-2px;border-left:8px solid var(--accent);border-right:0}
.seq .arrow.l::after{left:-2px;border-right:8px solid var(--accent);border-left:0}
.seq .arrow .t{position:absolute;left:0;right:0;bottom:3px;text-align:center;color:var(--fg);line-height:1.2;padding-inline:2px}
.seq .self{align-self:center;justify-self:center;border:1.5px dashed var(--accent);border-radius:6px;padding:2px 6px;background:var(--surface);color:var(--fg)}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1.5px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{position:relative;padding:4px 0 4px 10px;font-size:.88rem}
.tree li::before{content:"";position:absolute;left:-18px;top:16px;width:22px;border-top:1.5px solid var(--line)}
.tree>ul>li::before{display:none}
.tree .q{display:inline-block;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-weight:700}
.tree .br{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.tree .leaf{display:inline-block;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:2px 8px}
.quad{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;font-size:.86rem}
.quad .ax{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center;justify-self:center}
.quad .ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px}
.quad .cell b{display:block;font-family:var(--f-display)}

/* Questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:12px;min-width:0}
.q .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.q .stem{font-weight:700;margin-bottom:10px;white-space:pre-wrap}
.q .hint{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.yn{display:grid;gap:6px}
.yn .st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.yn .st.right{border-color:var(--good);background:var(--good-soft)} .yn .st.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord{display:grid;gap:6px;counter-reset:o}
.ord .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ord .it .pos{font-family:var(--f-mono);font-weight:600;color:var(--muted);width:1.6em}
.ord .it.right{border-color:var(--good);background:var(--good-soft)} .ord .it.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord .mv{display:flex;gap:4px}
.ord .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer;font-weight:700}
.match{display:grid;gap:6px}
.match .pr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.match .pr.right{border-color:var(--good);background:var(--good-soft)} .match .pr.wrong{border-color:var(--bad);background:var(--bad-soft)}
.match select{width:100%;min-width:0}
pre.dropcode{background:var(--code-bg);color:var(--code-fg);padding:12px 14px;border-radius:var(--r);overflow-x:auto;line-height:2;margin:0 0 6px;font-size:.82rem;white-space:pre}
pre.dropcode select{font-family:var(--f-mono);font-size:.78rem;padding:1px 4px;border-radius:5px;background:#1d2a38;color:#e7eef6;border:1px solid #3d5168}
pre.dropcode select.right{border-color:#4fc98d;box-shadow:0 0 0 1px #4fc98d}
pre.dropcode select.wrong{border-color:#ff7d86;box-shadow:0 0 0 1px #ff7d86}
.dropkey{font-size:.86rem;margin-top:6px}
.expl{margin-top:9px;font-size:.93rem;border-top:1px solid var(--line);padding-top:9px}
.expl .v{font-weight:700}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)} .expl .v.part{color:var(--trap)}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Practice / mock / cases */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mock-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.mock-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);display:grid;gap:12px}
.timer{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px}
.navgrid button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 0;font-family:var(--f-mono);font-size:.78rem;cursor:pointer;position:relative}
.navgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.cur{outline:2px solid var(--fg)}
.navgrid button.flag::after{content:"";position:absolute;top:2px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--trap)}
.navgrid button.cs{border-style:dashed}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:.82rem;cursor:pointer}
.conf button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.score{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.dbars{display:grid;gap:8px;margin-top:10px}
.dbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 58px;gap:8px;align-items:center;font-size:.86rem}
.dbar .tr{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.dbar .tr i{display:block;height:100%}
.dbar b{text-align:right;font-variant-numeric:tabular-nums}
.verdict{padding:12px 14px;border-radius:8px;font-weight:700;margin-top:12px}
.verdict.ok{background:var(--good-soft);color:var(--good)} .verdict.mid{background:var(--trap-soft);color:var(--trap)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.na{background:var(--surface-2);color:var(--muted)}
.case-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.case-doc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 108px);max-height:calc(100vh - 126px);overflow:auto}
.case-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.case-tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:4px 10px;font-size:.82rem;font-weight:700;cursor:pointer}
.case-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scenario{font-size:.93rem}
.scenario ul{padding-left:20px;margin:6px 0}
details.scen{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:10px}
details.scen summary{cursor:pointer;font-weight:700;color:var(--info)}

/* Flashcards */
.fc{max-width:660px;margin:0 auto}
.card{min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;cursor:pointer;text-align:center;width:100%}
.card .side{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card .txt{font-size:1.1rem}
.card.back{background:var(--accent-soft)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.boxes div{background:var(--surface-2);border-radius:7px;padding:6px;text-align:center;font-size:.76rem}
.boxes b{display:block;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}

/* Labs, interview, cheat */
details.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.lab+details.lab{margin-top:10px}
details.lab summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.lab summary::-webkit-details-marker{display:none}
details.lab summary h3{font-size:1.02rem}
details.lab .body{display:grid;gap:12px;margin-top:12px}
.cost{font-size:.88rem}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.cs-grid .panel h3{font-size:.98rem;margin-bottom:8px}
.cs-grid ul{margin:0;padding-left:18px;font-size:.9rem} .cs-grid li{margin-bottom:4px}
.gloss{display:grid;gap:0}
.gloss div{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.gloss b{font-family:var(--f-display)}

/* AI tutor */
.ai-only{display:none!important}
body.has-ai .ai-only{display:revert!important}
body.has-ai .no-ai{display:none!important}
.ai-box{border:1px solid color-mix(in srgb,var(--info) 35%,var(--line));background:var(--surface);border-radius:var(--r);padding:14px 16px}
.ai-out{margin-top:10px;font-size:.95rem;min-height:1em}
.ai-out:empty{display:none}
.ai-out p:last-child{margin-bottom:0}
.ai-out pre{background:var(--surface-2);padding:10px;border-radius:8px;overflow-x:auto}
.ai-note{font-size:.78rem;color:var(--muted)}
.chat{display:grid;gap:8px;margin-top:10px}
.bub{border-radius:10px;padding:9px 12px;max-width:92%;font-size:.94rem}
.bub.me{justify-self:end;background:var(--accent-soft)}
.bub.ai{justify-self:start;background:var(--surface-2)}
.bub p:last-child{margin-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

:root{--d6:#8a5a00;--d6-soft:#f6ead2;--d7:#2b6f99;--d7-soft:#dcebf5;--d8:#7a3f9e;--d8-soft:#efe1f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d6:#e6b85c;--d6-soft:#2e2410;--d7:#7cc0ec;--d7-soft:#10283a;--d8:#d4a2f2;--d8-soft:#2c1838}}

.ctabs .ttl{justify-content:space-between}

the code yourself in both languages. Change one thing and predict the output before you run it.","Take the module quiz. At 80% the topic counts as mastered and the module is marked done.","Solve the module's practice problems on LeetCode and tick them. Aim for 40 easy and 20 medium across the level.","Every few days: **Practice → Redo my mistakes** and the **Flashcards** due today."],"tactics":["**Restate** the problem and the constraints (n up to what? sorted? duplicates? negatives?).","**Example first**: work one small case by hand, then an edge case (empty, one item, all equal).","**Brute force out loud** with its Big-O, then ask: which repeated work can a hash map, two pointers, a stack or sorting remove?","**Match the pattern** to the constraint: n ≤ 10⁵ needs O(n log n) or better.","**Code it**, then **trace it** on your example before running it.","**State time and space** complexity at the end, and one trade-off."],"tacticsTitle":"Problem-solving routine (use it on every problem)","labsIntro":"Five small builds feed the capstone. Write each one yourself in Python **and** JavaScript, run the tests, then compare with the reference solution. The *break it* step is where the learning sticks.","labsTitle":"Build","labsEyebrow":"Hands-on · your own code","labsCallout":{"t":"Runs on your laptop","x":"These labs need only Python 3.12+ and Node.js 22+. No cloud account and no cost. Keep each lab in its own folder with its tests."},"labsTab":"Build","interviewIntro":"Coding interviews test these exact topics, but they also listen to *how* you reason. Answer each question out loud in about 90 seconds, then compare with the model answer. Mention complexity every time.","interviewEyebrow":"From practice to interview","interviewSkills":"data structures, algorithms and Big-O","interviewTopics":"DSA fundamentals (Big-O, arrays, hashing, two pointers, stacks, queues, linked lists, recursion, sorting, binary search)","roles":["Junior software engineer","Graduate developer","Data engineer (coding round)"],"domains":[{"id":"d1","short":"A","name":"Analysis: Big-O","w":[10,10]},{"id":"d2","short":"B","name":"Arrays, strings, hashing & pointers","w":[35,35]},{"id":"d3","short":"C","name":"Stacks, queues & linked lists","w":[25,25]},{"id":"d4","short":"D","name":"Recursion, sorting & binary search","w":[30,30]}],"groups":[{"id":"g1","t":"Analysis","mods":["m01"]},{"id":"g2","t":"Arrays, strings & hashing","mods":["m02","m03","m04"]},{"id":"g3","t":"Linear structures","mods":["m05","m06"]},{"id":"g4","t":"Recursion, sorting & searching","mods":["m07","m08"]}],"modules":[{"id":"m01","d":"d1","t":"Big-O: how work grows","min":75,"hook":"A solution that's instant on 10 items can take hours on 10 million. Big-O lets you predict that before you run anything, and every coding interview asks you to state it.","pre":{"q":"Doubling the input from 1,000 to 2,000 items makes function A take 2× longer and function B take 4× longer. Which one has a loop inside a loop?","a":"B. A loop inside a loop over the same input does n × n work, so doubling n multiplies the work by 4. A makes one pass (O(n)), so doubling n only doubles the time."},"kid":{"t":"Tara's toy box","x":"Tara keeps her toys in one big pile. To find her red car she checks toys one by one: with 10 toys that's quick, with 100 toys it takes ten times longer. Ben keeps his toys in an egg carton with a label on every slot, so he grabs the car in one go, however many toys he has. Then Mum asks them to check whether any two toys are the same. Tara compares every toy with every other toy: 10 toys means about 50 comparisons, 100 toys about 5,000! Big-O is the name for how fast the work grows when the pile grows.","map":[["Checking toys one by one in the pile","O(n): a linear scan"],["Grabbing from a labelled egg-carton slot","O(1): array index or hash lookup"],["Comparing every toy with every other toy","O(n²): a loop inside a loop over the same input"],["How fast the work grows as the pile grows","Big-O: the growth rate, not the exact time"]],"brk":"Computers do millions of steps a second, so small piles are fast either way: Big-O only matters as n gets large. It also hides constant factors, so for small n a simple O(n²) method can beat an O(n log n) one. That's why real sort routines switch to insertion sort for short runs."},"keys":["**Big-O describes growth**: how the number of steps grows as the input size n grows. Drop constants and smaller terms: 3n² + 5n + 7 is O(n²).","**The ladder, slowest-growing first**: O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ) < O(n!).","**Read the loops**: one pass is O(n); a loop inside a loop over the same input is O(n²); halving the problem each step is O(log n). Steps one after another **add**, nested steps **multiply**.","**One line can hide a loop**: `x in my_list`, `arr.includes(x)`, `index`, slicing, `sorted()` and `insert(0, x)` all cost O(n) or more.","**Worst, average, best**: interviews mean the worst case unless they say otherwise. Hash lookups are quoted as *average* O(1) because collisions can make one lookup O(n).","**Space complexity** counts the *extra* memory: a set of seen values is O(n); two index variables are O(1); a recursion n calls deep is O(n) stack space.","**Amortised O(1)**: `list.append` and `arr.push` are O(1) on average because the backing block grows by a multiple when it's full, so the rare O(n) copy is spread over many cheap appends.","**Let the constraints pick the target**: a judge runs roughly 10⁷–10⁸ simple steps a second (Python at the slow end). n ≤ 10⁵ → aim for O(n log n) or better; n ≤ a few thousand → O(n²) is fine; n ≤ 20 → O(2ⁿ) is fine."],"dia":[{"type":"layers","cap":"Rough step counts at n = 1,000,000","rows":[["O(1)","1 step · read a[i], look up a key in a hash map"],["O(log n)","about 20 steps · binary search"],["O(n)","1,000,000 steps · one pass"],["O(n log n)","about 20,000,000 steps · a good sort"],["O(n²)","10¹² steps · nested loops: about a day in Python"],["O(2ⁿ)","more steps than atoms in the universe · trying every subset"]]},{"type":"tree","cap":"Reading the Big-O off the code","root":{"q":"How does the loop variable change?","c":[["no loop, fixed steps","O(1)"],["halves or doubles","O(log n)"],["goes up by 1 to n",{"q":"Is there another loop over n inside it?","c":[["no","O(n)"],["yes","O(n²)"]]}]]}}],"cmp":[{"cap":"Costs you should know by heart","head":["Operation","Python","JavaScript","Big-O"],"rows":[["Read or write by index","`a[i]`","`a[i]`","O(1)"],["Add or remove at the end","`a.append(x)`, `a.pop()`","`a.push(x)`, `a.pop()`","O(1) amortised"],["Add or remove at the front","`a.insert(0, x)`, `a.pop(0)`","`a.unshift(x)`, `a.shift()`","O(n)"],["Search by value","`x in a`, `a.index(x)`","`a.includes(x)`, `a.indexOf(x)`","O(n)"],["Key in a set or map","`x in s`, `k in d`","`s.has(x)`, `m.has(k)`","O(1) average"],["Copy a slice","`a[i:j]`","`a.slice(i, j)`","O(j − i)"],["Sort","`a.sort()`, `sorted(a)`","`a.sort((x, y) => x - y)`","O(n log n)"]]}],"code":[{"t":"Count the steps: one loop, nested loops, halving","tabs":[{"lang":"python","src":"def linear_steps(n):\n    steps = 0\n    for _ in range(n):          # one pass\n        steps += 1\n    return steps\n\ndef quadratic_steps(n):\n    steps = 0\n    for _ in range(n):          # a loop ...\n        for _ in range(n):      # ... inside a loop\n            steps += 1\n    return steps\n\ndef halving_steps(n):\n    steps = 0\n    while n > 1:                # halve until one item is left\n        n //= 2\n        steps += 1\n    return steps\n\nfor n in (10, 100, 1000):\n    print(n, linear_steps(n), quadratic_steps(n), halving_steps(n))\n","out":"10 10 100 3\n100 100 10000 6\n1000 1000 1000000 9\n","notes":[[3,"One pass: n steps, so O(n). Ten times the input, ten times the steps."],[10,"A loop inside a loop over the same n: n × n steps, so O(n²). Ten times the input, a hundred times the steps."],[16,"Halving until one is left takes about log₂ n steps, so O(log n). Ten times the input adds only about 3 steps."]]},{"lang":"javascript","src":"function linearSteps(n) {\n  let steps = 0;\n  for (let i = 0; i < n; i++) steps++;          // one pass\n  return steps;\n}\n\nfunction quadraticSteps(n) {\n  let steps = 0;\n  for (let i = 0; i < n; i++)                   // a loop ...\n    for (let j = 0; j < n; j++) steps++;        // ... inside a loop\n  return steps;\n}\n\nfunction halvingSteps(n) {\n  let steps = 0;\n  while (n > 1) {                               // halve until one item is left\n    n = Math.floor(n / 2);\n    steps++;\n  }\n  return steps;\n}\n\nfor (const n of [10, 100, 1000])\n  console.log(n, linearSteps(n), quadraticSteps(n), halvingSteps(n));\n","out":"10 10 100 3\n100 100 10000 6\n1000 1000 1000000 9\n","notes":[[3,"One pass: n steps, so O(n)."],[10,"A loop inside a loop over the same n: n × n steps, so O(n²)."],[17,"`Math.floor(n / 2)` is integer halving, the same as Python's `n //= 2`: O(log n)."]]}]},{"t":"Why append is O(1) on average: count the copies","tabs":[{"lang":"python","src":"def copies_for(n):\n    capacity, size, copies = 1, 0, 0\n    for _ in range(n):\n        if size == capacity:       # full: move to a block twice as big\n            copies += size         # every item already stored is copied once\n            capacity *= 2\n        size += 1                  # the append itself is O(1)\n    return copies\n\nfor n in (8, 1000, 1_000_000):\n    c = copies_for(n)\n    print(n, c, f\"{c / n:.2f}\")\n","out":"8 7 0.88\n1000 1023 1.02\n1000000 1048575 1.05\n","notes":[[4,"Resizes happen at sizes 1, 2, 4, 8, … so they get rarer as the list grows."],[12,"Copies per append stay below 2 however big n gets: that's what *amortised O(1)* means."]]},{"lang":"javascript","src":"function copiesFor(n) {\n  let capacity = 1, size = 0, copies = 0;\n  for (let i = 0; i < n; i++) {\n    if (size === capacity) {       // full: move to a block twice as big\n      copies += size;              // every item already stored is copied once\n      capacity *= 2;\n    }\n    size++;                        // the append itself is O(1)\n  }\n  return copies;\n}\n\nfor (const n of [8, 1000, 1_000_000]) {\n  const c = copiesFor(n);\n  console.log(n, c, (c / n).toFixed(2));\n}\n","out":"8 7 0.88\n1000 1023 1.02\n1000000 1048575 1.05\n","notes":[[4,"Real engines grow by a different multiple (CPython about 1.125×, V8 about 1.5×), but any constant multiple gives amortised O(1)."]]}]}],"ex":{"q":"Count the pairs (i < j) whose values add up to 0. Work out the time and space complexity of the slow version, then of the fast one.","steps":["Slow version: the outer loop runs n times and the inner loop runs n − 1, n − 2, …, 0 times. That's n(n − 1)/2 checks; drop the ½ and the smaller term: **O(n²) time**.","It only keeps a counter and two indexes: **O(1) extra space**.","Fast version: one loop of n steps, and each dictionary or `Map` lookup and update is O(1) on average: **O(n) time**.","The map can hold up to n different values: **O(n) extra space**. We traded memory for time, the most common trade-off in DSA."],"code":{"t":"Slow and fast versions side by side","tabs":[{"lang":"python","src":"def count_zero_pairs_slow(nums):\n    count = 0\n    for i in range(len(nums)):              # n iterations\n        for j in range(i + 1, len(nums)):   # up to n - 1 each\n            if nums[i] + nums[j] == 0:\n                count += 1\n    return count                            # O(n^2) time, O(1) space\n\ndef count_zero_pairs_fast(nums):\n    seen = {}                               # value -> times seen so far\n    count = 0\n    for x in nums:                          # one pass\n        count += seen.get(-x, 0)            # pairs with every earlier -x\n        seen[x] = seen.get(x, 0) + 1\n    return count                            # O(n) time, O(n) space\n\nnums = [3, -3, 2, 0, -2, 3, 0]\nprint(count_zero_pairs_slow(nums), count_zero_pairs_fast(nums))\n","out":"4 4"},{"lang":"javascript","src":"function countZeroPairsSlow(nums) {\n  let count = 0;\n  for (let i = 0; i < nums.length; i++)          // n iterations\n    for (let j = i + 1; j < nums.length; j++)    // up to n - 1 each\n      if (nums[i] + nums[j] === 0) count++;\n  return count;                                  // O(n^2) time, O(1) space\n}\n\nfunction countZeroPairsFast(nums) {\n  const seen = new Map();                        // value -> times seen so far\n  let count = 0;\n  for (const x of nums) {                        // one pass\n    count += seen.get(-x) ?? 0;                  // pairs with every earlier -x\n    seen.set(x, (seen.get(x) ?? 0) + 1);\n  }\n  return count;                                  // O(n) time, O(n) space\n}\n\nconst nums = [3, -3, 2, 0, -2, 3, 0];\nconsole.log(countZeroPairsSlow(nums), countZeroPairsFast(nums));\n","out":"4 4"}]},"a":"Slow: O(n²) time, O(1) extra space. Fast: O(n) average time, O(n) extra space. For n = 100,000 that's about 5 × 10⁹ checks versus 100,000 map operations. (In JavaScript, `-0` and `0` are the same `Map` key, so the zeros pair up correctly.)"},"fade":{"q":"What is the time complexity of `mystery(n)`? Predict `mystery(1024)` before you run it.","steps":["The outer loop doubles `i` (1, 2, 4, 8, …), so it runs about log₂ n times.",{"ask":"How many inner steps happen in total for n = 1024? Add up 1 + 2 + 4 + … while i < n.","a":"1 + 2 + 4 + … + 512 = 1023."},{"ask":"So is it O(n log n) or O(n)? Why?","a":"O(n). The inner loop runs i times and i doubles, so the total is a geometric series that stays below 2n. “log n outer × n inner” over-counts, because the inner loop is only long near the end."}],"code":{"t":"Starter: predict, then run","tabs":[{"lang":"python","src":"def mystery(n):\n    steps = 0\n    i = 1\n    while i < n:            # i = 1, 2, 4, 8, ...\n        for _ in range(i):  # i steps each time\n            steps += 1\n        i *= 2\n    return steps\n\nprint(mystery(1024))        # your prediction: ?\n"},{"lang":"javascript","src":"function mystery(n) {\n  let steps = 0;\n  for (let i = 1; i < n; i *= 2)      // i = 1, 2, 4, 8, ...\n    for (let j = 0; j < i; j++)       // i steps each time\n      steps++;\n  return steps;\n}\n\nconsole.log(mystery(1024));           // your prediction: ?\n"}]},"solution":{"t":"Solution: total steps stay below 2n","tabs":[{"lang":"python","src":"def mystery(n):\n    steps = 0\n    i = 1\n    while i < n:\n        for _ in range(i):\n            steps += 1\n        i *= 2\n    return steps\n\nfor n in (1024, 1_000_000):\n    print(n, mystery(n), 2 * n)     # steps < 2n, so O(n)\n","out":"1024 1023 2048\n1000000 1048575 2000000\n"},{"lang":"javascript","src":"function mystery(n) {\n  let steps = 0;\n  for (let i = 1; i < n; i *= 2)\n    for (let j = 0; j < i; j++)\n      steps++;\n  return steps;\n}\n\nfor (const n of [1024, 1_000_000])\n  console.log(n, mystery(n), 2 * n);  // steps < 2n, so O(n)\n","out":"1024 1023 2048\n1000000 1048575 2000000\n"}]}},"traps":[["“Two loops means O(n²).”","Only when one is *inside* the other. Two loops one after the other cost O(n) + O(n) = O(n)."],["“O(2n) is slower than O(n).”","Constants are dropped: O(2n) is O(n). Big-O compares how work grows, not exact speed."],["“`x in my_list` is O(1) because it's one line.”","Membership on a list or array scans the elements: O(n). Only sets and maps give average O(1)."],["“An outer loop that doubles i, with an inner loop of i steps, is O(n log n).”","Add up the inner work: 1 + 2 + 4 + … stays under 2n, so the total is O(n). (A doubling loop *inside* a loop of n really is O(n log n): check which loop is which.)"],["“Space is only the variables I create.”","Recursion uses stack space: n nested calls is O(n) space even without a single list."],["“O(1) means fast.”","O(1) means the cost doesn't grow with n. A constant-time step can still be slow: one network call is O(1) and takes milliseconds."]],"disc":[["Your solution is O(n log n) and a colleague's is O(n). When could yours still be the better choice?","When n is small or capped (constants dominate), when yours is simpler and less error-prone, or when the O(n) one needs O(n) extra memory you can't spare. Big-O is one input to the decision, not the whole decision."],["Why do we say a hash map lookup is O(1) *on average* instead of just O(1)?","Collisions: if many keys land in the same bucket, a lookup has to check them all, up to O(n) in the worst case. Good hash functions and resizing keep the average constant."]],"teach":{"prompt":"Explain to a junior colleague how to find the Big-O of a function just by reading it, and why we drop constants.","rubric":["Big-O describes how work grows as n grows (worst case unless stated)","One pass is O(n), nested loops over the same input are O(n²), halving is O(log n)","Steps in sequence add, nested steps multiply; keep only the biggest term","Constants are dropped because they don't change the shape of the growth","Mentions space complexity, including recursion depth"],"model":"Big-O tells you how a function's work grows as the input n grows, usually in the worst case. Read the loops: one pass over the input is O(n), a loop inside another loop over the same input is O(n²), and anything that halves the problem each step is O(log n). Steps one after another add, nested steps multiply, and you keep only the fastest-growing term, so 3n² + 5n is O(n²). Constants are dropped because they depend on the machine and the language, not on the shape of the growth. Do the same for memory: extra lists, maps and recursion depth all count."},"qa":[["What does Big-O describe?","How the work (or memory) grows as the input size n grows, ignoring constants and smaller terms; usually the worst case."],["Order these from slowest-growing: O(n log n), O(1), O(n²), O(log n), O(n).","O(1) < O(log n) < O(n) < O(n log n) < O(n²)."],["Two loops one after the other over n items: what's the Big-O?","O(n). O(n) + O(n) = O(2n) = O(n). Only nested loops multiply."],["Why is list append / array push O(1) amortised?","The backing block grows by a multiple when full, so the rare O(n) copies average out to a constant per append."],["n ≤ 10⁵: which complexities are usually fast enough?","O(n log n) or better. O(n²) would be about 10¹⁰ steps."],["What does `x in my_list` (Python) or `arr.includes(x)` (JS) cost?","O(n): it scans the elements. Use a set for O(1) average membership."]],"quiz":[{"q":"What does this print?","snip":{"t":"Trace it","tabs":[{"lang":"python","src":"count = 0\nfor i in range(4):\n    for j in range(4):\n        count += 1\nprint(count)\n"},{"lang":"javascript","src":"let count = 0;\nfor (let i = 0; i < 4; i++)\n  for (let j = 0; j < 4; j++)\n    count++;\nconsole.log(count);\n"}]},"o":["16","8","4","12"],"a":0,"e":"A loop of 4 inside a loop of 4 runs 4 × 4 = 16 times. Nested loops multiply."},{"q":"What is the time complexity of `f`?","snip":{"t":"Two loops","tabs":[{"lang":"python","src":"def f(a):\n    total = 0\n    for x in a:\n        total += x\n    for x in a:\n        total -= x\n    return total\n"},{"lang":"javascript","src":"function f(a) {\n  let total = 0;\n  for (const x of a) total += x;\n  for (const x of a) total -= x;\n  return total;\n}\n"}]},"o":["O(n)","O(n²)","O(2n), which is slower than O(n)","O(log n)"],"a":0,"e":"The loops run one after the other: O(n) + O(n) = O(2n) = O(n). Constants are dropped."},{"q":"The constraints say n ≤ 100,000. Your first idea compares every pair of elements. What should you do?","o":["Look for an O(n log n) or O(n) idea: about 5 × 10⁹ pair checks is far too slow","Submit it: 100,000 is a small number for a computer","Rewrite it in JavaScript, which removes the problem","Add a cache inside the inner loop, which makes any nested loop O(n)"],"a":0,"e":"n²/2 ≈ 5 × 10⁹ checks. At roughly 10⁷–10⁸ simple steps a second that's about 1 to 8 minutes, far past a typical 1–2 second limit. Changing language changes the constant, not the growth."},{"q":"Which of these cost O(n) on a list or array of n items? (choose 3)","t":"ms","o":["`x in my_list` / `arr.includes(x)`","`my_list.pop(0)` / `arr.shift()`","`my_list.insert(0, x)` / `arr.unshift(x)`","`len(my_list)` / `arr.length`","`my_list[i]` / `arr[i]`"],"a":[0,1,2],"e":"Searching by value and adding or removing at the front touch every element. Reading the length and indexing are O(1): the length is stored, and the address of slot i is calculated."},{"q":"Judge each statement.","t":"yn","s":[["3n² + 100n + 7 is O(n²).",true],["An O(n log n) algorithm is faster than an O(n²) one for every input size.",false],["A recursive function that goes n calls deep uses O(n) stack space.",true],["Big-O tells you the running time in seconds.",false]],"e":"Keep the biggest term. Big-O hides constants, so small inputs can flip the ranking. Every pending call keeps a stack frame. Big-O describes growth, not seconds."},{"q":"Put these in order from slowest-growing to fastest-growing.","t":"ord","items":["O(1)","O(log n)","O(n)","O(n log n)","O(n²)","O(2ⁿ)"],"e":"Learn this ladder by heart: it's how you compare any two solutions."},{"q":"What does this print?","snip":{"t":"Halving","tabs":[{"lang":"python","src":"n, steps = 64, 0\nwhile n > 1:\n    n //= 2\n    steps += 1\nprint(steps)\n"},{"lang":"javascript","src":"let n = 64, steps = 0;\nwhile (n > 1) {\n  n = Math.floor(n / 2);\n  steps++;\n}\nconsole.log(steps);\n"}]},"o":["6","64","32","7"],"a":0,"e":"64 → 32 → 16 → 8 → 4 → 2 → 1 is 6 halvings, and log₂ 64 = 6. Halving loops are O(log n)."},{"q":"Match each code shape to its time complexity.","t":"match","pairs":[["Read one element by its index","O(1)"],["Cut the remaining range in half each step","O(log n)"],["One loop over the input","O(n)"],["Sort, then one pass","O(n log n)"],["A loop over the input inside another loop over the input","O(n²)"]],"extra":["O(2ⁿ)"],"e":"Halving gives log n, a single pass gives n, and the sort dominates the pass that follows it."}],"probs":[["LC 268 · Missing Number","https://leetcode.com/problems/missing-number/","Easy","sort O(n log n) → set O(n) → sum formula O(1) space"],["LC 136 · Single Number","https://leetcode.com/problems/single-number/","Easy","hash count O(n) space → XOR O(1) space"],["LC 169 · Majority Element","https://leetcode.com/problems/majority-element/","Easy","sort, then count, then the O(1)-space voting trick"],["LC 231 · Power of Two","https://leetcode.com/problems/power-of-two/","Easy","halving loop O(log n), then a constant-time bit trick"]],"src":[["Python wiki: TimeComplexity (list, deque, set, dict)","https://wiki.python.org/moin/TimeComplexity"],["MIT 6.006 Introduction to Algorithms (Spring 2020), lectures 1–2","https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/"],["MDN: Array (method reference)","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array"]]},{"id":"m02","d":"d2","t":"Arrays, strings and prefix sums","min":80,"hook":"Arrays are the most-used structure in every language and in most interview problems. Knowing what's cheap (reading `a[i]`) and what's secretly expensive (inserting at the front, building strings in a loop, slicing) is half of every solution.","pre":{"q":"How can a computer jump straight to `a[700000]` without looking at the 700,000 items before it?","a":"The items (or references to them) sit side by side in memory, all the same size, so the address of item i is start + i × size. That's one multiplication and one addition: O(1)."},"kid":{"t":"The egg carton","x":"Ben's eggs sit in a long carton with numbered cups, all the same size. To reach cup 7 he doesn't count: cup 7 is exactly seven cup-widths from the start, so his finger lands on it straight away. Adding an egg at the far end is easy too. But when Tara wants to squeeze a new egg into cup 0, every egg has to shuffle one cup along, and with a long carton that takes ages. When the carton is full, they fetch one twice as big and move every egg across, which is slow, but it doesn't happen often.","map":[["Numbered cups, all the same size","Contiguous memory: address = start + i × size"],["Finger lands on cup 7 straight away","Indexing `a[i]` is O(1)"],["Squeezing an egg into cup 0","Inserting at the front is O(n): everything shifts"],["Moving to a carton twice as big","Resizing a dynamic array: O(n) now and then, O(1) amortised"]],"brk":"Python lists and JavaScript arrays hold references to objects, not the objects themselves, so the cups are the same size even when the items aren't. Very sparse JavaScript arrays may even be stored like hash maps by the engine."},"keys":["**An array is one contiguous block**: items (or references to them) sit side by side, so `a[i]` is O(1). Python `list` and JavaScript `Array` are *dynamic* arrays that grow automatically.","**The middle and the front are expensive**: inserting or deleting at position i shifts everything after it, O(n − i). Appending and popping at the end are O(1) amortised.","**Strings are immutable** in Python and JavaScript: every change builds a new string. `+=` in a loop *can* cost O(n²); collect pieces and join once with `''.join(parts)` / `parts.join('')`.","**Prefix sums**: build `prefix[i + 1] = prefix[i] + a[i]` once in O(n) with `prefix[0] = 0`; then any range sum `a[l..r]` is `prefix[r + 1] − prefix[l]` in O(1).","**In place saves memory**: reverse with two indexes swapping inward; rotate right by k with three reversals. Both are O(n) time and O(1) extra space.","**Grids**: `grid[r][c]`, and a full scan costs O(rows × cols). Build every row separately: `[[0] * cols for _ in range(rows)]`, never `[[0] * cols] * rows`.","**Hidden copies**: slicing (`a[i:j]`, `a.slice(i, j)`), `a + b` and spreading (`[...a]`) all copy, costing O(k) time and memory."],"dia":[{"type":"cells","cap":"Inserting 7 at index 1 shifts everything after it","rows":[{"label":"before","vals":[3,8,1,9,4]},{"label":"after","vals":[3,7,8,1,9,4],"hl":[1],"marks":{"2":"→","3":"→","4":"→","5":"→"}}],"note":"Four items moved to make room for one. At the front, all n items move: O(n)."},{"type":"cells","cap":"Prefix sums: running totals with a 0 in front","rows":[{"label":"a","vals":[2,4,1,5,3]},{"label":"prefix","vals":[0,2,6,7,12,15],"hl":[1,4]}],"note":"sum of a[1..3] = prefix[4] − prefix[1] = 12 − 2 = 10, which is 4 + 1 + 5."}],"cmp":[{"cap":"Everyday array and string idioms","head":["Task","Python","JavaScript","Cost"],"rows":[["Length","`len(a)`","`a.length`","O(1)"],["Join pieces into one string","`''.join(parts)`","`parts.join('')`","O(total length)"],["Reversed copy","`a[::-1]`","`a.toReversed()` or `[...a].reverse()`","O(n)"],["Reverse in place","`a.reverse()`","`a.reverse()`","O(n) time, O(1) extra"],["Character code","`ord('a')` gives 97","`'a'.charCodeAt(0)` gives 97","O(1)"],["Split into characters","`list(s)`","`[...s]` (keeps simple emoji whole)","O(n)"],["Grid of zeros","`[[0] * cols for _ in range(rows)]`","`Array.from({ length: rows }, () => new Array(cols).fill(0))`","O(rows × cols)"]]}],"code":[{"t":"Prefix sums: any range sum in O(1)","tabs":[{"lang":"python","src":"def build_prefix(a):\n    prefix = [0] * (len(a) + 1)\n    for i, x in enumerate(a):\n        prefix[i + 1] = prefix[i] + x      # sum of a[0..i]\n    return prefix\n\ndef range_sum(prefix, l, r):               # sum of a[l..r], inclusive\n    return prefix[r + 1] - prefix[l]\n\na = [2, 4, 1, 5, 3]\np = build_prefix(a)\nprint(*p)\nprint(range_sum(p, 1, 3), range_sum(p, 0, 4), range_sum(p, 2, 2))\n","out":"0 2 6 7 12 15\n10 15 1\n","notes":[[2,"n + 1 slots with `prefix[0] = 0`, so ranges starting at 0 need no special case."],[8,"O(1) per query after the O(n) build."]]},{"lang":"javascript","src":"function buildPrefix(a) {\n  const prefix = new Array(a.length + 1).fill(0);\n  for (let i = 0; i < a.length; i++)\n    prefix[i + 1] = prefix[i] + a[i];      // sum of a[0..i]\n  return prefix;\n}\n\nconst rangeSum = (prefix, l, r) => prefix[r + 1] - prefix[l];   // a[l..r], inclusive\n\nconst a = [2, 4, 1, 5, 3];\nconst p = buildPrefix(a);\nconsole.log(p.join(\" \"));\nconsole.log(rangeSum(p, 1, 3), rangeSum(p, 0, 4), rangeSum(p, 2, 2));\n","out":"0 2 6 7 12 15\n10 15 1\n","notes":[[2,"n + 1 slots with `prefix[0] = 0`, so ranges starting at 0 need no special case."],[8,"O(1) per query after the O(n) build."]]}]},{"t":"Rotate right by k in place: three reversals","tabs":[{"lang":"python","src":"def reverse(a, lo, hi):                    # reverse a[lo..hi] in place\n    while lo < hi:\n        a[lo], a[hi] = a[hi], a[lo]\n        lo += 1\n        hi -= 1\n\ndef rotate_right(a, k):                    # O(n) time, O(1) extra space\n    n = len(a)\n    if n == 0:\n        return\n    k %= n                                 # rotating by n changes nothing\n    reverse(a, 0, n - 1)                   # 7 6 5 4 3 2 1\n    reverse(a, 0, k - 1)                   # 5 6 7 | 4 3 2 1\n    reverse(a, k, n - 1)                   # 5 6 7 | 1 2 3 4\n\na = [1, 2, 3, 4, 5, 6, 7]\nrotate_right(a, 3)\nprint(*a)\n","out":"5 6 7 1 2 3 4","notes":[[12,"Reversing everything puts the last k items at the front, but backwards."],[13,"Fix the order of the first k items, then of the rest."]]},{"lang":"javascript","src":"function reverse(a, lo, hi) {             // reverse a[lo..hi] in place\n  while (lo < hi) {\n    [a[lo], a[hi]] = [a[hi], a[lo]];\n    lo++;\n    hi--;\n  }\n}\n\nfunction rotateRight(a, k) {              // O(n) time, O(1) extra space\n  const n = a.length;\n  if (n === 0) return;\n  k %= n;                                 // rotating by n changes nothing\n  reverse(a, 0, n - 1);                   // 7 6 5 4 3 2 1\n  reverse(a, 0, k - 1);                   // 5 6 7 | 4 3 2 1\n  reverse(a, k, n - 1);                   // 5 6 7 | 1 2 3 4\n}\n\nconst a = [1, 2, 3, 4, 5, 6, 7];\nrotateRight(a, 3);\nconsole.log(a.join(\" \"));\n","out":"5 6 7 1 2 3 4","notes":[[3,"Destructuring swap: swaps two slots without a temporary variable you have to name."],[13,"Reversing everything puts the last k items at the front, but backwards."]]}]},{"t":"The shared-row bug (and the fix)","tabs":[{"lang":"python","src":"rows, cols = 3, 4\nbad = [[0] * cols] * rows                  # 3 references to ONE row\ngood = [[0] * cols for _ in range(rows)]   # 3 separate rows\nbad[0][0] = 1\ngood[0][0] = 1\nprint(sum(r[0] for r in bad), sum(r[0] for r in good))\n","out":"3 1","notes":[[2,"`* rows` copies the reference, not the row: every row is the same list."],[6,"Writing one cell of `bad` changed the whole first column."]]},{"lang":"javascript","src":"const rows = 3, cols = 4;\nconst bad = new Array(rows).fill(new Array(cols).fill(0));        // ONE row, shared 3 times\nconst good = Array.from({ length: rows }, () => new Array(cols).fill(0));\nbad[0][0] = 1;\ngood[0][0] = 1;\nconsole.log(bad.reduce((s, r) => s + r[0], 0), good.reduce((s, r) => s + r[0], 0));\n","out":"3 1","notes":[[2,"`fill` puts the same array object in every slot."],[3,"`Array.from` calls the function once per row, so each row is new."]]}]}],"ex":{"q":"Find the leftmost index where the sum of everything to its left equals the sum of everything to its right (LeetCode 724, Find Pivot Index). Return −1 if there isn't one.","steps":["Brute force: for each index, add up the left side and the right side. That's O(n) per index, O(n²) in total.","Spot the repeated work: as i moves right, the left sum only grows by one item. Keep a running `left` instead of recomputing it.","The right side is everything else: `right = total − left − a[i]`. Compute `total` once.","One pass for the total and one for the scan, with two numbers of memory: O(n) time, O(1) extra space. It's the prefix-sum idea without storing the array."],"code":{"t":"Pivot index with a running left sum","tabs":[{"lang":"python","src":"def pivot_index(nums):\n    total = sum(nums)\n    left = 0\n    for i, x in enumerate(nums):\n        if left == total - left - x:       # right side = total - left - x\n            return i\n        left += x                          # x joins the left side\n    return -1\n\nprint(pivot_index([1, 7, 3, 6, 5, 6]), pivot_index([1, 2, 3]), pivot_index([2, 1, -1]))\n","out":"3 -1 0"},{"lang":"javascript","src":"function pivotIndex(nums) {\n  const total = nums.reduce((s, x) => s + x, 0);\n  let left = 0;\n  for (let i = 0; i < nums.length; i++) {\n    if (left === total - left - nums[i]) return i;   // right side = total - left - x\n    left += nums[i];                                 // x joins the left side\n  }\n  return -1;\n}\n\nconsole.log(pivotIndex([1, 7, 3, 6, 5, 6]), pivotIndex([1, 2, 3]), pivotIndex([2, 1, -1]));\n","out":"3 -1 0"}]},"a":"3 for [1, 7, 3, 6, 5, 6]: the left side 1 + 7 + 3 = 11 equals the right side 5 + 6 = 11. O(n) time and O(1) extra space."},"fade":{"q":"Given daily prices, return the best profit from buying on one day and selling on a later day (0 if no profit is possible). Finish the update line.","steps":["Brute force tries every buy day with every later sell day: O(n²).",{"ask":"If you sell today, which earlier day should you have bought on?","a":"The cheapest day so far, so keep a running minimum `lowest`."},{"ask":"What is the time and space complexity of one pass that tracks `lowest` and `best`?","a":"O(n) time and O(1) extra space."}],"code":{"t":"Starter","tabs":[{"lang":"python","src":"def max_profit(prices):\n    best = 0\n    lowest = float(\"inf\")          # cheapest price seen so far\n    for p in prices:\n        lowest = min(lowest, p)\n        best = ...                 # TODO: what if you sell today?\n    return best\n\nprint(max_profit([7, 1, 5, 3, 6, 4]))   # expect 5\n"},{"lang":"javascript","src":"function maxProfit(prices) {\n  let best = 0;\n  let lowest = Infinity;         // cheapest price seen so far\n  for (const p of prices) {\n    lowest = Math.min(lowest, p);\n    best = /* TODO: what if you sell today? */ 0;\n  }\n  return best;\n}\n\nconsole.log(maxProfit([7, 1, 5, 3, 6, 4]));   // expect 5\n"}]},"solution":{"t":"Solution","tabs":[{"lang":"python","src":"def max_profit(prices):\n    best = 0\n    lowest = float(\"inf\")\n    for p in prices:\n        lowest = min(lowest, p)          # buy day comes first\n        best = max(best, p - lowest)     # sell today?\n    return best\n\nprint(max_profit([7, 1, 5, 3, 6, 4]), max_profit([7, 6, 4, 3, 1]))\n","out":"5 0"},{"lang":"javascript","src":"function maxProfit(prices) {\n  let best = 0;\n  let lowest = Infinity;\n  for (const p of prices) {\n    lowest = Math.min(lowest, p);        // buy day comes first\n    best = Math.max(best, p - lowest);   // sell today?\n  }\n  return best;\n}\n\nconsole.log(maxProfit([7, 1, 5, 3, 6, 4]), maxProfit([7, 6, 4, 3, 1]));\n","out":"5 0"}]}},"traps":[["“`insert(0, x)` / `unshift(x)` is as cheap as `append` / `push`.”","Adding at the front shifts every element: O(n). In a loop that's O(n²). Append and reverse once at the end, or use a deque (module 05)."],["“Building a string with `+=` in a loop is fine.”","Strings are immutable, so each `+=` may copy everything built so far: O(n²) in the worst case. Engines sometimes optimise it, but the reliable pattern is collect, then `join` once."],["“`[[0] * cols] * rows` makes a grid.”","It makes `rows` references to the **same** row, so changing one cell changes a whole column. JavaScript's twin is `new Array(rows).fill(new Array(cols).fill(0))`. Build each row separately."],["“Slicing is free.”","`a[i:j]`, `a.slice(i, j)`, `a + b` and `[...a]` copy: O(k) time and memory. Slicing inside a loop or a recursion can quietly turn O(n) into O(n²)."],["“A string's length is the number of characters people see.”","JavaScript counts UTF-16 units: `'😀'.length` is 2 and `s.split('')` cuts the emoji in half, while `[...s]` keeps it whole. In Python, `len('😀')` is 1. Both count code points, so emoji built from several code points (skin tones, flags) still count as more than one."],["“The prefix array is the same length as the input.”","Give it n + 1 slots with `prefix[0] = 0`, so `sum(a[l..r]) = prefix[r + 1] − prefix[l]` also works when l = 0."]],"disc":[["When would you build a prefix-sum array instead of summing each range when asked?","When there are many range queries on data that doesn't change: O(n) once, then O(1) per query, instead of O(length) per query. If the data changes often you'd have to rebuild it; L3 covers Fenwick and segment trees for that case."],["Python lists and JavaScript arrays can hold mixed types. Does that break the O(1) indexing argument?","No. They store references of the same size, so slot i is still at start + i × size. The objects themselves live elsewhere in memory."]],"teach":{"prompt":"Explain to a junior colleague why `a[i]` is O(1) but inserting at the front of an array is O(n), and when a prefix-sum array helps.","rubric":["Items (or references) sit side by side, so slot i's address is calculated directly","Inserting or deleting at the front shifts every other item: O(n)","Appending is O(1) amortised because the array grows by a multiple","Prefix sums: O(n) setup, then any range sum in O(1) as prefix[r + 1] − prefix[l]","Names a cost: O(n) extra memory and a rebuild if the data changes"],"model":"An array keeps its items, or references to them, side by side in one block, so the computer finds slot i by arithmetic, start + i × size, without looking at anything else: O(1). Putting something at the front means every existing item must move one place along, which costs O(n). Appending is cheap because the array grows by a multiple when it's full, so the rare copies average out. A prefix-sum array stores running totals with prefix[0] = 0; after O(n) setup, the sum of a[l..r] is prefix[r + 1] − prefix[l] in O(1). It costs O(n) extra memory and must be rebuilt when the data changes."},"qa":[["Why is `a[i]` O(1)?","Items (or references) are stored contiguously, so the address of slot i is start + i × size: one calculation, no scanning."],["What does inserting at index 0 of an n-item array cost?","O(n): every item shifts one place right."],["Range sum of a[l..r] from a prefix array with n + 1 slots?","prefix[r + 1] − prefix[l], where prefix[0] = 0 and prefix[i + 1] = prefix[i] + a[i]."],["Safe way to build a long string in a loop (Python and JavaScript)?","Collect pieces in a list or array, then join once: `''.join(parts)` / `parts.join('')`."],["Rotate an array right by k in O(n) time and O(1) extra space?","k %= n; reverse the whole array, then the first k items, then the rest."],["Why is `[[0] * 3] * 3` a bug in Python?","All three rows are the same list, so changing one cell changes the whole column. Use `[[0] * 3 for _ in range(3)]`."]],"quiz":[{"q":"What does this print?","snip":{"t":"Trace it","tabs":[{"lang":"python","src":"a = [2, 4, 1, 5, 3]\nprefix = [0]\nfor x in a:\n    prefix.append(prefix[-1] + x)\nprint(prefix[4] - prefix[1])\n"},{"lang":"javascript","src":"const a = [2, 4, 1, 5, 3];\nconst prefix = [0];\nfor (const x of a) prefix.push(prefix[prefix.length - 1] + x);\nconsole.log(prefix[4] - prefix[1]);\n"}]},"o":["10","12","9","15"],"a":0,"e":"prefix is 0 2 6 7 12 15, and prefix[4] − prefix[1] = 12 − 2 = 10: the sum of a[1..3] = 4 + 1 + 5."},{"q":"What does this print?","snip":{"t":"Trace it","tabs":[{"lang":"python","src":"grid = [[0] * 3] * 2\ngrid[0][1] = 5\nprint(grid[1][1])\n"},{"lang":"javascript","src":"const grid = new Array(2).fill(new Array(3).fill(0));\ngrid[0][1] = 5;\nconsole.log(grid[1][1]);\n"}]},"o":["5","0","It raises an error","3"],"a":0,"e":"Both rows are the same object, so writing grid[0][1] also changes grid[1][1]."},{"q":"Which of these are O(1), or O(1) amortised, on a Python list or JavaScript array? (choose 3)","t":"ms","o":["`a[i] = x`","`a.append(x)` / `a.push(x)`","`a.pop()` from the end","`a.pop(0)` / `a.shift()`","`a[::-1]` / `a.toReversed()`"],"a":[0,1,2],"e":"Removing from the front shifts everything (O(n)), and a reversed copy touches all n items."},{"q":"You must answer 100,000 queries of the form “sum of a[l..r]?” on 100,000 numbers that never change. What's the best approach?","o":["Build a prefix-sum array once in O(n), then answer each query in O(1)","Sum each range with a loop: it's simpler and just as fast","Sort the array first, then add up the range","Put the values in a hash set"],"a":0,"e":"Loops could cost up to 10¹⁰ steps in total. The prefix array costs O(n) once, then O(1) per query. Sorting would scramble the positions the queries refer to."},{"q":"Judge each statement.","t":"yn","s":[["Strings are immutable in both Python and JavaScript.",true],["`a.slice(1)` in JavaScript is O(1) because it doesn't change `a`.",false],["Rotating with three reversals needs only O(1) extra space.",true],["In JavaScript, `'😀'.length` is 1.",false]],"e":"Immutable strings mean every edit makes a new string. Slices copy, so they're O(k). The reversal trick swaps in place. The emoji is two UTF-16 units, so its length is 2."},{"q":"Complete the Python rotate-right-by-k function (three reversals).","t":"drop","lang":"python","code":"def rotate_right(a, k):\n    n = len(a)\n    if n == 0:\n        return\n    k {{0}} n\n    reverse(a, 0, n - 1)\n    reverse(a, 0, {{1}})\n    reverse(a, {{2}}, n - 1)\n","blanks":[{"o":["%=","//=","+=","-="],"a":0},{"o":["k - 1","k","n - k","n - 1"],"a":0},{"o":["k","k - 1","0","n - k"],"a":0}],"e":"`k %= n` handles k ≥ n. After reversing everything, the first k slots hold the moved items backwards, so reverse a[0..k − 1], then a[k..n − 1]."},{"q":"What is the time complexity of `build` for n words of bounded length?","snip":{"t":"Copying in a loop","tabs":[{"lang":"python","src":"def build(words):\n    out = []\n    for w in words:\n        out = out + [w.upper()]\n    return out\n"},{"lang":"javascript","src":"function build(words) {\n  let out = [];\n  for (const w of words) out = [...out, w.toUpperCase()];\n  return out;\n}\n"}]},"o":["O(n²): each step copies everything built so far","O(n): there is only one loop","O(n log n)","O(1)"],"a":0,"e":"`out + [x]` and `[...out, x]` build a new list every time: 1 + 2 + … + n copies = O(n²). `append` / `push` makes it O(n)."},{"q":"Match each task to the best tool.","t":"match","pairs":[["Many range-sum queries on data that never changes","A prefix-sum array"],["Rotate in place with O(1) extra space","Three reversals"],["Build one long string from many pieces","Collect pieces, then join once"],["Reverse in place","Two indexes swapping inward"]],"extra":["Sort the array first"],"e":"Each tool removes repeated work or extra memory: precompute once, swap in place, copy once."}],"probs":[["LC 88 · Merge Sorted Array","https://leetcode.com/problems/merge-sorted-array/","Easy","fill from the back so nothing shifts"],["LC 303 · Range Sum Query - Immutable","https://leetcode.com/problems/range-sum-query-immutable/","Easy","prefix sums, exactly as above"],["LC 14 · Longest Common Prefix","https://leetcode.com/problems/longest-common-prefix/","Easy","compare column by column"],["LC 118 · Pascal's Triangle","https://leetcode.com/problems/pascals-triangle/","Easy","2D lists: build each row from the one above"],["LC 1752 · Check if Array Is Sorted and Rotated","https://leetcode.com/problems/check-if-array-is-sorted-and-rotated/","Easy","count the drops, including last → first; a rotated sorted array has at most one"],["LC 238 · Product of Array Except Self","https://leetcode.com/problems/product-of-array-except-self/","Medium","prefix and suffix products, no division"],["LC 48 · Rotate Image","https://leetcode.com/problems/rotate-image/","Medium","in place: transpose, then reverse each row"],["LC 54 · Spiral Matrix","https://leetcode.com/problems/spiral-matrix/","Medium","walk four boundaries inward"]],"src":[["Python tutorial: More on lists","https://docs.python.org/3/tutorial/datastructures.html#more-on-lists"],["MDN: Array","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array"],["MDN: String length (UTF-16 code units)","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/length"],["USACO Guide: Prefix sums","https://usaco.guide/silver/prefix-sums"],["Python wiki: TimeComplexity","https://wiki.python.org/moin/TimeComplexity"]]},{"id":"m03","d":"d2","t":"Hash maps and sets","min":85,"hook":"Hash maps turn “search the whole list” into “jump straight to it”. They're behind the fastest answer to more interview problems than any other structure: duplicates, counting, Two Sum, anagrams and caching.","pre":{"q":"A dictionary holds a million keys. Roughly how many keys does `'zebra' in d` have to look at?","a":"Usually one or a handful, not a million. The key is hashed to a number that says which bucket to look in, so lookups take O(1) on average."},"kid":{"t":"The cloakroom hooks","x":"At Ben's party, every coat goes to the cloakroom. The helper doesn't pile them up; she looks at the first letter of the guest's name and hangs the coat on that letter's hook: Ben's on B, Tara's on T. When Tara leaves, the helper goes straight to hook T, with no searching. When two guests share a letter, both coats go on the same hook, and the helper checks the name tags on that hook. If the hooks get crowded, she adds more hooks and rehangs every coat.","map":[["Turning a name into a hook letter","The hash function: key → bucket number"],["Going straight to hook T","Average O(1) lookup, insert and delete"],["Two coats on one hook, told apart by name tags","A collision, resolved by comparing the stored keys"],["Adding hooks and rehanging every coat","Resizing: an O(n) rehash now and then, O(1) amortised"]],"brk":"A real hash function mixes every character into a big number so keys spread evenly; “first letter” would crowd hook S. And the hooks can't hand you the coats in name order: hash maps keep no sorted order."},"keys":["**Hash map = key → value with average O(1)** insert, lookup and delete. Python: `dict` and `set`. JavaScript: `Map` and `Set` (plain objects work for string keys but have pitfalls).","**How it works**: hash(key) → a big number → a bucket (`hash % capacity`). Equal keys must give equal hashes. Collisions are resolved by comparing the stored keys in a chain, or by probing other slots (open addressing, which CPython uses).","**Resizing keeps buckets short**: when the table gets too full it grows and re-inserts every key. That O(n) step is rare, so operations stay O(1) amortised.","**Worst case is O(n)** when many keys collide. Say “O(1) on average” in interviews.","**Keys must be stable**: Python keys must be hashable (`str`, `int`, `tuple`), so use `tuple(sorted(word))` rather than a list. A JavaScript `Map` compares object keys by identity, so build a string key such as `'1,2'` for pairs.","**Four patterns cover most problems**: seen-before (set), counting (`Counter` / `Map` of counts), complement lookup (Two Sum: is `target − x` stored?), and grouping by a signature (anagrams share their sorted letters).","**Insertion order, not sorted order**: dicts and Maps remember the order keys were added. Need the smallest key or sorted keys? Sort them (O(k log k)) or use a heap or tree (L2)."],"dia":[{"type":"cells","cap":"Eight buckets (made-up hash values): ‘ben’ and ‘bo’ collide in bucket 3","rows":[{"label":"bucket","vals":["","tara","","ben · bo","","","sam",""],"hl":[3]}],"note":"Looking up ‘bo’ goes straight to bucket 3, then compares the stored keys there. Short buckets keep it O(1) on average."},{"type":"flow","cap":"Two Sum in one pass","steps":[["Read x","the next number"],["need = target − x","the partner we want"],["Is need stored?","yes → return both indexes"],["Store x → i","for later numbers"]],"loop":"repeat for every number: one pass, O(n) average time"}],"cmp":[{"cap":"The same hash tools in both languages","head":["Need","Python","JavaScript"],"rows":[["Set of seen values","`seen = set()`, `seen.add(x)`, `x in seen`","`const seen = new Set()`, `seen.add(x)`, `seen.has(x)`"],["Key → value","`d = {}`, `d[k] = v`, `d.get(k
