recision; I do the multiplication in BigInt (or split it into halves) and convert back."},{"c":"Problem-solving technique","q":"How do you approach a hard problem you haven't seen before?","a":"I read the constraints first, because they hint at the intended complexity: n ≤ 20 suggests bitmasks, n ≤ 500 an O(n³) DP, n ≤ 10⁵ with updates a tree structure. Then I look for the L2 pattern underneath: a graph with weights, a DP whose state needs one more piece of information, a range query. I write a brute force for small inputs, both to understand the problem and to test my real solution against it on random cases. In an interview I explain the reduction and the complexity before I start coding."},{"c":"Behavioural (STAR)","q":"Tell me about a time you made something much faster with a better algorithm.","a":"Use STAR. Situation: what was slow, how slow, and who noticed. Task: the target. Action: how you measured it, the complexity you found (an O(n²) scan, a shortest-path search repeated for every request), the algorithm or structure you replaced it with (a heap, a Fenwick tree, precomputation) and how you tested it against the old version. Result: the before and after numbers. If you're new, use a lab from this hub, like the shortest-path toolkit or the range-query lab."}],"cheat":[{"t":"Templates to know cold","items":["Dijkstra: heap of (dist, v); pop; skip if stale; relax: if d + w < dist[u], update and push","0-1 BFS: deque; a 0-edge goes to the front, a 1-edge to the back (JavaScript: a ring buffer, not `unshift`)","Bellman–Ford: V − 1 rounds over every edge; round V still improves → negative cycle; k rounds on a copy → at most k edges","Floyd–Warshall: `for k: for i: for j: d[i][j] = min(d[i][j], d[i][k] + d[k][j])`","Low-link: low[v] = min(tin[v], tin over back edges, low over children); bridge when low[v] > tin[u]","Fenwick: update with `i += i & -i`, query with `i -= i & -i` (1-indexed)","Prefix function: `k = pi[i - 1]`; while k > 0 and s[i] != s[k]: `k = pi[k - 1]`; if s[i] == s[k]: k += 1"]},{"t":"Python ↔ JavaScript","items":["heapq with tuples ↔ a MinHeap with a comparator such as `(a, b) => a[0] < b[0]`","deque.appendleft ↔ a ring buffer or two stacks (no built-in deque)","pow(a, b, m) and pow(a, -1, m) ↔ write modPow with BigInt","Unbounded ints ↔ exact only up to 2⁵³: BigInt for products near 10¹⁸","math.gcd, math.comb, math.isqrt ↔ write your own (BigInt for big combinations)","Deep recursion ↔ an explicit stack in both languages (Python stops near 1,000 frames)"]},{"t":"Technique triggers","items":["Non-negative weights → **Dijkstra** · negative weights → **Bellman–Ford** · all pairs, V ≤ 400 → **Floyd–Warshall**","Weights of 0 and 1 → **0-1 BFS** · “minimise the largest step” → **bottleneck Dijkstra**","Cut edges or cut vertices → **low-link** · use every edge once → **Euler path (Hierholzer)**","Range i..j split at k → **interval DP** · n ≤ 20 and “which ones are used” → **bitmask DP**","An answer for every root → **rerooting** · count the numbers up to N → **digit DP**","Range sums with point updates → **Fenwick** · range min/max or range updates → **segment tree**","Pattern search, periods, borders → **prefix function / Z** · many substring comparisons → **rolling hash**","Two players, perfect play → **win/lose states, minimax, Grundy numbers**"]},{"t":"Costs","items":["Dijkstra O((V + E) log V) · 0-1 BFS O(V + E) · Bellman–Ford O(V·E) · Floyd–Warshall O(V³)","Kruskal O(E log E) · Prim O(E log V), or O(V²) on dense graphs","Bridges, articulation points, Euler paths: O(V + E)","Interval DP O(n³) · Held–Karp TSP O(2ⁿ · n²) · all submasks O(3ⁿ)","Fenwick and segment tree O(log n) per operation · sparse table O(1) per query after O(n log n)","KMP and Z O(n + m) · sieve O(n log log n) · fast power O(log e)"]},{"t":"Edge cases to test every time","items":["Unreachable vertices (∞ or −1)","Negative edges and negative cycles","Repeated edges and self-loops","A 10⁵-node path (recursion depth)","An empty pattern, or a pattern longer than the text","Answers that need a modulus or BigInt","Ranges of length 1, and l > r"]}],"glossary":[["0-1 BFS","Shortest paths when every edge weighs 0 or 1, using a deque: 0-edges go to the front, 1-edges to the back."],["Articulation point","A vertex whose removal disconnects the graph (a cut vertex)."],["Bellman–Ford","Single-source shortest paths that allows negative edges: V − 1 rounds of relaxing every edge, O(V·E)."],["Bitmask DP","Dynamic programming whose state includes a set of chosen items, stored as the bits of an integer."],["Bridge","An edge whose removal disconnects the graph; it lies on no cycle."],["Coordinate compression","Replacing large or sparse values with their ranks 0..m − 1 so they can index an array."],["Digit DP","Counting the numbers up to N digit by digit, with a “tight” flag for prefixes equal to N's."],["Dijkstra's algorithm","Single-source shortest paths for non-negative weights, using a min-heap: O((V + E) log V)."],["Euler path","A walk that uses every edge exactly once; an Euler circuit also ends where it started."],["Fenwick tree","A binary indexed tree: prefix sums with point updates in O(log n), using i & −i."],["Floyd–Warshall","All-pairs shortest paths in O(V³), allowing the intermediate vertices one at a time."],["Grundy number","The mex of the Grundy numbers of the positions you can move to; 0 means a losing position."],["Hierholzer's algorithm","Builds an Euler path in O(E): walk until stuck, then splice in the detours."],["Interval DP","DP over ranges, dp[i][j], filled by increasing length."],["Lazy propagation","Storing a pending range update at a segment-tree node and pushing it down only when needed."],["Low-link value","The smallest discovery time reachable from a vertex's DFS subtree using one back edge."],["Mex","The minimum excluded value: the smallest non-negative integer not in a set."],["Minimax","Choosing the move that maximises your result, assuming the opponent then minimises it."],["Modular inverse","x with a·x ≡ 1 (mod m); it exists when gcd(a, m) = 1, and equals a^(m − 2) mod m for a prime m."],["Monotonic deque","A deque kept in increasing or decreasing order, giving a sliding-window max or min in O(1) amortised."],["Negative cycle","A cycle whose total weight is negative, so shortest paths through it have no lower bound."],["Prefix function","π[i]: the length of the longest proper prefix of s[0..i] that is also its suffix (used by KMP)."],["Relaxation","Improving dist[v] through an edge u → v: if dist[u] + w < dist[v], set dist[v] = dist[u] + w."],["Rerooting","Computing a tree answer for every possible root in O(n) by moving the root along edges."],["Rolling hash","A hash of a sliding window, updated in O(1) per step (Rabin–Karp)."],["Segment tree","A binary tree over array ranges that answers range queries and updates in O(log n)."],["Sieve of Eratosthenes","Crosses out the multiples of each prime to find every prime up to n in O(n log log n)."],["Z-function","z[i]: the length of the longest common prefix of s and the suffix of s starting at i."]],"sourceGroups":[{"t":"Practice","items":[["LeetCode problem set","https://leetcode.com/problemset/","A4 R5 D4 · the free tier is enough for L3"],["LeetCode contests (weekly contests, plus virtual entry to past ones)","https://leetcode.com/contest/","A4 R5 D4 · free"],["Codeforces (contests and problem archive)","https://codeforces.com/","A5 R5 D5 · free"],["CSES Problem Set","https://cses.fi/problemset/","A5 R4 D5 · free"]]},{"t":"Reference","items":[["cp-algorithms (Algorithms for Competitive Programming)","https://cp-algorithms.com/","A4 R4 D5 · free"],["Python docs: heapq","https://docs.python.org/3/library/heapq.html","A5 R5 D4 · free"],["Python docs: pow() with a modulus","https://docs.python.org/3/library/functions.html#pow","A5 R5 D3 · free"],["MDN: BigInt","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/BigInt","A5 R5 D4 · free"]]},{"t":"Courses and books","items":[["Antti Laaksonen, Competitive Programmer's Handbook (free PDF)","https://cses.fi/book/book.pdf","A5 R3 D5 · free"],["USACO Guide (the gold and platinum sections for L3)","https://usaco.guide/","A5 R4 D5 · free"],["Jeff Erickson, Algorithms (free textbook)","https://jeffe.cs.illinois.edu/teaching/algorithms/","A5 R3 D5 · free"],["MIT 6.046J Design and Analysis of Algorithms (Spring 2015, OCW)","https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/","A5 R2 D5 · free"]]}],"aiCtx":"The learner finished DSA levels L1 and L2 (Big-O, hashing, pointers, stacks, recursion, binary search, trees, heaps, tries, BFS/DFS, topological sort, union-find, backtracking, 1-D and 2-D DP, greedy, bits) and is now at level L3 Specialist: weighted shortest paths, MSTs, bridges and Euler paths, interval/bitmask/tree DP, prefix sums and monotonic queues, Fenwick and segment trees, string matching (KMP, Z, rolling hashes), number theory and combinatorial games. They code in both Python 3.12+ and JavaScript (Node.js 22). Use plain words and short examples, show code in Python and JavaScript when it helps, state the time and space complexity of every solution, point out integer-overflow differences (JavaScript numbers are exact only up to 2^53; use BigInt for big modular products), and never invent LeetCode problem numbers or titles. If you are unsure of a detail, say so.","storyWorld":"The toy room and the treasure-map road trip","kidMapHead":"In code","langs":["python","javascript"],"qtypes":["**Single and multiple answer**: multiple answers earn partial credit.","**What does this print?**: trace the code before you answer. Every one was run to check the key.","**Yes/No statement sets**: judge each statement on its own.","**Build list**: put steps in order.","**Code drop-downs**: complete Python or JavaScript. Each was checked so only one combination works.","**Matching**: map techniques to problems or code to Big-O."],"weightsLabel":"Topic areas · share of study time","keysTitle":"Key ideas","keysTag":"the grown-up version","codeTitle":"Code","codeTag":"Python and JavaScript side by side","trapsTitle":"Traps and misconceptions","practiceIntro":"Mixed questions train you to recognise which technique a hard problem needs. Every miss goes to your mistake list, and answering it right later marks it fixed.","casesIntro":"Each case is a small product with real requirements. Read the scenario tabs, then pick the algorithms and data structures and justify their complexity.","sourcesIntro":"Ratings: A = authority, R = recency, D = depth (1–5). Practice-problem links point to LeetCode titles from your audited list (checked 9 Oct 2026), and none of them needs a paid account.","sourcesTab":"Resources","freshStyle":"in the style of a hard coding interview or a contest editorial (a short scenario or code snippet, one best answer, plausible distractors)","ladder":[{"k":"L1 Foundation","t":"Big-O, arrays, hashing, pointers, stacks, lists, recursion, sorting, binary search","x":"done first"},{"k":"L2 Proficient","t":"Trees, heaps, tries, graphs, union-find, backtracking, DP, greedy, bits","x":"done"},{"k":"L3 Specialist","t":"Shortest paths, MSTs, advanced DP, range queries, strings, number theory, games","x":"this hub","cur":true},{"k":"L4 Expert","t":"SCCs, flows and matching, geometry, advanced techniques, teaching","x":"problem setting"}],"ladderTitle":"Your DSA ladder","ladderNote":"Each level is its own hub","deck":"dsa-l3","examinerRole":"technical interviewer for a senior software engineering role, or a competitive-programming coach","aiCheck":"Written by Claude for this hub. Check surprising claims against cp-algorithms, the official Python and MDN docs, and run the code yourself."};

<script>
(function () {
"use strict";
/* ===== core: data indexes, helpers, storage + account sync, tabs, header ===== */
const H = window.HUB;
const M = H.modules;
const MID = {};
M.forEach((m, i) => { MID[m.id] = m; m._i = i; });
const DOM = H.domains;
const DMAP = {};
DOM.forEach((d, i) => { DMAP[d.id] = d; d._i = i; d.cls = "d" + (i + 1); });
const GROUPS = H.groups || [{ id: "all", t: "Modules", mods: M.map(m => m.id) }];
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const LET = "ABCDEFGHIJKL";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
/* inline markup used in all content strings: `code`, **bold**, [text](https://url) */
function inl(s) {
  const parts = String(s == null ? "" : s).split("`");
  return parts.map((p, i) => {
    if (i % 2 === 1) return "<code>" + esc(p) + "</code>";
    let t = esc(p);
    t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    t = t.replace(/(^|[\s(“"'\/-])\*([^*\s](?:[^*]*[^*\s])?)\*(?=[\s).,;:!?”"'\/-]|$)/g, "$1<i>$2</i>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }).join("");
}
function paras(s) { return String(s || "").split(/\n\n+/).map(p => "<p>" + inl(p) + "</p>").join(""); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayNum(iso) { const p = (iso || today()).split("-").map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function fmtDate(iso, opts) { try { const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }); } catch (e) { return iso; } }
function addDays(iso, n) { const p = iso.split("-").map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function dchip(did, extra) { const d = DMAP[did]; if (!d) return ""; return `<span class="chip ${d.cls}" title="${esc(d.name)}">${esc(d.short || d.id.toUpperCase())}${extra ? " · " + esc(extra) : ""}</span>`; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1800); } }
  catch (e) {
    const host = (btn && btn.closest(".panel, .q, .ai-box")) || document.body;
    let ta = host.querySelector("textarea.copybox");
    if (!ta) { ta = document.createElement("textarea"); ta.className = "copybox mono"; ta.setAttribute("aria-label", "Text to copy"); host.appendChild(ta); }
    ta.value = txt; ta.hidden = false; ta.focus(); ta.select();
    if (btn) btn.textContent = "Select all and copy the text below";
  }
}

/* ---------- index every practice item ---------- */
const ITEMS = {};
function regItem(it, id, extra) { it.id = it.id || id; Object.assign(it, extra || {}); if (!it.t) it.t = Array.isArray(it.a) ? "ms" : (it.s ? "yn" : (it.items ? "ord" : (it.blanks ? "drop" : (it.pairs ? "match" : "mc")))); ITEMS[it.id] = it; }
M.forEach(m => (m.quiz || []).forEach((q, i) => regItem(q, m.id + ".q" + (i + 1), { d: q.d || m.d, mid: m.id, src: m.t })));
(H.bank || []).forEach((q, i) => regItem(q, "bank." + (i + 1), { src: q.src || "Practice bank" }));
(H.cases || []).forEach(c => (c.items || []).forEach((q, i) => regItem(q, c.id + "." + (i + 1), { cs: c.id, src: "Case: " + c.title })));
(H.mocks || []).forEach(mk => (mk.items || []).forEach((q, i) => regItem(q, "mock" + mk.id + "." + (i + 1), { src: "Mock " + mk.id })));
(H.diag || []).forEach((q, i) => regItem(q, "diag." + (i + 1), { src: "Diagnostic" }));
const CASE = {}; (H.cases || []).forEach(c => { CASE[c.id] = c; });

/* ---------- state ---------- */
const LKEY = "studyhub." + H.id + ".v2";
function defState() { return { v: 2, done: {}, plan: {}, quiz: {}, mis: {}, dstat: {}, labs: {}, teach: {}, skills: {}, diag: null, pace: { h: H.pace || 8, start: null }, cases: {}, probs: {}, last: null }; }
let S = defState();
let MOCKS = [];
let CARDS = {};
let U = { main: 0, mocks: 0, cards: 0 };
function loadLocal() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.S) { S = Object.assign(defState(), o.S); MOCKS = Array.isArray(o.MOCKS) ? o.MOCKS : []; CARDS = o.CARDS || {}; U = Object.assign(U, o.U || {}); }
  } catch (e) { /* storage unavailable: run in memory */ }
}
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ S, MOCKS, CARDS, U })); } catch (e) { } }
loadLocal();
if (!S.pace.start) S.pace.start = today();

/* account sync through the artifact db capability (owner: progress/*; other signed-in viewers: their private data/users/<id>/*) */
const SYNC = { db: null, base: null, state: "local", timers: {}, busy: {}, again: {} };
function setSync(st) {
  SYNC.state = st;
  const el = $("#syncPill"); if (!el) return;
  const map = { local: ["Saved in this browser", ""], cloud: ["Synced to your account", "ok"], error: ["Sync paused, saved in this browser", "mid"], loading: ["Connecting…", "info"] };
  const m = map[st] || map.local;
  el.className = "pill " + m[1]; el.innerHTML = `<span class="dot"></span>${m[0]}`;
}
function payload(part) {
  if (part === "main") return { hub: H.id, upd: U.main, S };
  if (part === "mocks") return { hub: H.id, upd: U.mocks, list: MOCKS.slice(-25) };
  return { hub: H.id, upd: U.cards, map: CARDS };
}
function touch(part) { U[part] = Date.now(); saveLocal(); if (SYNC.db) { clearTimeout(SYNC.timers[part]); SYNC.timers[part] = setTimeout(() => flush(part), 1200); } }
async function flush(part) {
  if (!SYNC.db) return;
  if (SYNC.busy[part]) { SYNC.again[part] = true; return; }
  SYNC.busy[part] = true;
  try { await SYNC.db.doc(SYNC.base + "/" + part).set(JSON.parse(JSON.stringify(payload(part)))); setSync("cloud"); }
  catch (e) {
    const c = e && e.code;
    if (c === "invalid_argument" || c === "not_granted" || c === "revoked" || c === "capability_disabled" || c === "capability_removed") { SYNC.db = null; setSync("local"); }
    else if (c === "quota_exceeded") { setSync("error"); toast("Account storage is full; progress stays in this browser."); }

  v.innerHTML = `<div class="eyebrow">${esc(H.labsEyebrow || "Hands-on · official lab repos")}</div><h2 class="h-view">${esc(H.labsTitle || "Labs")}</h2><p class="lede">${inl(H.labsIntro || "")}</p>
  ${callout ? `<div class="callout warn" style="margin-bottom:14px"><b class="t">${inl(callout.t)}</b>${inl(callout.x)}</div>` : ""}
  ${caps.map(c => `<div class="panel capstone" id="capstone" style="margin-bottom:16px"><div class="row between"><div class="eyebrow">Level capstone · about ${Math.round(c.min / 60)} h</div><label class="inline small"><input type="checkbox" data-lab="${esc(c.id)}" ${S.labs[c.id] ? "checked" : ""}> built and written up</label></div>
    <h3 style="margin:.3em 0 .4em;font-size:1.2rem">${inl(c.t)}</h3><p style="margin:0 0 10px">${inl(c.goal)}</p>
    <div class="grid2">${list("Deliverables", c.deliver)}${list("Rubric (what a reviewer checks)", c.rubric)}</div>
    ${steps("Build it in this order", c.steps)}${list("Stretch goals", c.stretch)}${c.link ? `<p style="margin:0"><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.linkText || "Reference")}</a></p>` : ""}</div>`).join("")}
  ${labs.map(l => `<details class="lab" id="lab-${esc(l.id)}"><summary><input type="checkbox" data-lab="${esc(l.id)}" ${S.labs[l.id] ? "checked" : ""} aria-label="Mark lab done"><h3>${inl(l.t)}</h3><span class="chip">≈ ${l.min} min</span>${(l.mods || []).map(id => MID[id] ? `<span class="chip ${DMAP[MID[id].d].cls}">${esc(MID[id].t)}</span>` : "").join("")}</summary>
   <div class="body"><p style="margin:0">${inl(l.goal)}</p>
   ${l.cost ? `<div class="cost callout ${l.costLevel === "high" ? "warn" : "info"}"><b class="t">Cost: ${esc(l.costLevel || "low")}</b>${inl(l.cost)}</div>` : ""}
   ${list("Before you start", l.pre)}${steps("What you'll do", l.steps)}
   ${l.starter ? codeBox(l.starter) : ""}
   ${list("Prove it worked", l.verify)}${list("Break it (then fix it)", l.breakit)}
   ${l.solution ? `<details class="d"><summary>Reference solution</summary><div>${codeBox(l.solution)}</div></details>` : ""}
   ${l.teardown ? codeBox({ t: "Teardown", lang: l.teardownLang || "bash", src: l.teardown }) : ""}
   ${l.link ? `<p style="margin:0"><a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.linkText || "Open the official lab instructions")}</a></p>` : ""}</div></details>`).join("")}`;
  $$("[data-lab]", v).forEach(cb => { cb.addEventListener("click", e => e.stopPropagation()); cb.addEventListener("change", () => { S.labs[cb.dataset.lab] = cb.checked ? today() : undefined; touch("main"); }); });
  applyLang(v);
};

/* ---------- FLASHCARDS (Leitner boxes, spaced) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];
function allCards() { const out = []; M.forEach(m => (m.qa || []).forEach((q, i) => out.push({ id: m.id + ".c" + (i + 1), d: m.d, t: m.t, q: q[0], a: q[1] }))); (H.cards || []).forEach((c, i) => out.push({ id: "x." + (i + 1), d: c.d, t: c.t || "Extra", q: c.q, a: c.a })); return out; }
let FC = { list: [], i: 0, flip: false, filter: "due" };
function buildFC() {
  const all = allCards(), tn = dayNum(today()), f = FC.filter;
  let list = all.filter(c => f === "due" ? (CARDS[c.id] ? CARDS[c.id][1] <= tn : true) : f === "all" ? true : f.startsWith("m:") ? c.id.startsWith(f.slice(2) + ".") : c.d === f);
  if (f === "due") { const seen = list.filter(c => CARDS[c.id]), fresh = list.filter(c => !CARDS[c.id]); list = shuffle(seen).concat(fresh.slice(0, 20)); } else list = shuffle(list);
  FC.list = list; FC.i = 0; FC.flip = false;
}
RENDER.cards = function () {
  if (!FC.list.length || FC.i >= FC.list.length) buildFC();
  const v = $("#v-cards"), all = allCards(), tn = dayNum(today());
  const due = all.filter(c => CARDS[c.id] && CARDS[c.id][1] <= tn).length, unseen = all.filter(c => !CARDS[c.id]).length;
  const boxes = [0, 0, 0, 0, 0, 0]; all.forEach(c => { boxes[CARDS[c.id] ? CARDS[c.id][0] : 0]++; });
  const c = FC.list[FC.i];
  v.innerHTML = `<div class="fc"><div class="eyebrow">Spaced retrieval</div><h2 class="h-view">Flashcards</h2>
  <p class="lede small">Say the answer out loud before flipping. “Again” brings a card back tomorrow; each “Good” pushes it further out (1 → 3 → 7 → 14 → 30 days).</p>
  <div class="toolbar"><label class="inline" for="fFilter">Deck <select id="fFilter"><option value="due">Due today + 20 new (${due} due, ${unseen} new)</option><option value="all">All ${all.length} cards</option>${DOM.map(d => `<option value="${d.id}">${esc(d.short)} · ${esc(d.name)}</option>`).join("")}${M.map(m => `<option value="m:${m.id}">${esc(m.t)}</option>`).join("")}</select></label><span class="muted small" style="margin-left:auto">${c ? `${FC.i + 1} / ${FC.list.length}` : ""}</span></div>
  ${c ? `<button type="button" class="card ${FC.flip ? "back" : ""}" id="fCard"><span class="side">${FC.flip ? "Answer" : "Question"} · ${esc(c.t)}</span><span class="txt">${inl(FC.flip ? c.a : c.q)}</span><span class="muted small">${FC.flip ? "How well did you recall it?" : "Tap to flip"}</span></button>
   <div class="row" style="justify-content:center;margin-top:12px">${FC.flip ? `<button type="button" class="btn" data-g="0">Again</button><button type="button" class="btn" data-g="1">Hard</button><button type="button" class="btn primary" data-g="2">Good</button><button type="button" class="btn" data-g="3">Easy</button>` : `<button type="button" class="btn primary" id="fFlip">Show answer</button>`}</div>` : `<div class="panel">Nothing due right now. Pick another deck, or come back tomorrow.</div>`}
  <div class="boxes" aria-label="Cards per box">${boxes.map((n, i) => `<div><b>${n}</b>${i === 0 ? "new" : "box " + i + " · " + BOX_DAYS[i] + "d"}</div>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button type="button" class="btn small" id="fCopy">Copy card progress for Claude</button></div><p class="small muted" style="text-align:center;margin:.4em 0 0">Paste it in our chat to sync these cards with the deck in your vault.</p></div>`;
  const sel = $("#fFilter"); sel.value = FC.filter; sel.addEventListener("change", () => { FC.filter = sel.value; buildFC(); RENDER.cards(); });
  $("#fCopy").addEventListener("click", e => { const tn2 = dayNum(today()); const prog = Object.keys(CARDS).map(id => ({ id, box: CARDS[id][0], due_in_days: CARDS[id][1] - tn2 })); copyText(`My ${H.code} flashcard progress from the Study Hub (deck ${H.deck || H.id}). Please update the vault deck to match:\n` + JSON.stringify(prog), e.currentTarget); });
  if (c) {
    const flip = () => { FC.flip = !FC.flip; RENDER.cards(); };
    $("#fCard").addEventListener("click", flip); if ($("#fFlip")) $("#fFlip").addEventListener("click", flip);
    $$("[data-g]", v).forEach(b => b.addEventListener("click", () => {
      const g = +b.dataset.g, cur = CARDS[c.id] ? CARDS[c.id][0] : 0;
      const nb = g === 0 ? 1 : g === 1 ? Math.max(1, cur) : g === 2 ? Math.min(5, cur + 1) : Math.min(5, cur + 2);
      CARDS[c.id] = [nb, dayNum(today()) + (g === 0 ? 1 : BOX_DAYS[nb])]; touch("cards");
      if (g === 0) FC.list.push(c);
      FC.i++; FC.flip = false; RENDER.cards();
    }));
  }
};

/* ---------- INTERVIEW ---------- */
const IV = { turns: [], q: null };
RENDER.interview = function () {
  const v = $("#v-interview"); const cats = [...new Set((H.interview || []).map(x => x.c))];
  v.innerHTML = `<div class="eyebrow">${esc(H.interviewEyebrow || "From certified to hireable")}</div><h2 class="h-view">Interview practice</h2><p class="lede">${inl(H.interviewIntro || "Answer out loud first, then open the model answer. Strong answers name the requirement, the design choice, the trade-off and how you'd verify it.")}</p>
  <div class="panel ai-only" style="margin-bottom:16px"><h3>Mock interview with Claude</h3><p class="small muted" style="margin:0 0 8px">Claude plays a hiring manager: one question at a time, follow-ups on your answers, feedback when you type “feedback”.</p>
   <div class="row"><label class="inline" for="ivRole">Role <select id="ivRole">${(H.roles || ["AI engineer"]).map(r => `<option>${esc(r)}</option>`).join("")}</select></label><button type="button" class="btn primary" id="ivStart">Start interview</button><button type="button" class="btn small" id="ivReset">Reset</button></div>
   <div class="chat" id="ivLog"></div><div class="row" style="margin-top:8px"><input type="text" id="ivIn" style="flex:1;min-width:0" placeholder="Type your answer…"><button type="button" class="btn" id="ivSend">Send</button></div></div>
  ${cats.map(cat => `<h3 style="margin:18px 0 8px">${esc(cat)}</h3>${(H.interview || []).filter(x => x.c === cat).map(x => `<details class="d"><summary>${inl(x.q)}</summary><div>${paras(x.a)}${x.f ? `<p class="small muted"><b>Likely follow-ups:</b> ${x.f.map(inl).join(" · ")}</p>` : ""}</div></details>`).join("")}`).join("")}`;
  const log = $("#ivLog");
  const paint = () => { log.innerHTML = IV.turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : mdBlock(t.content)}</div>`).join(""); };
  paint();
  const rules = () => `${AI_CTX()}\n\nYou are a friendly but rigorous hiring manager interviewing the candidate for a "${$("#ivRole").value}" role that requires ${H.interviewSkills || H.code + " skills"}. Ask ONE question at a time (mix scenario design, troubleshooting and behavioral STAR questions about ${H.interviewTopics || H.cert} topics). After each answer, ask one probing follow-up or move on. If the candidate types "feedback", give a short scorecard (strengths, gaps, a stronger sample answer). Keep each message under 120 words.`;
  const ask = async (msg) => {
    if (!AI) return; if (msg) IV.turns.push({ role: "user", content: msg }); paint();
    const bub = document.createElement("div"); bub.className = "bub ai"; log.appendChild(bub);
    let recent = IV.turns.slice(-14); while (recent.length && recent[0].role !== "user") recent = recent.slice(1);
    const turns = [{ role: "user", content: rules() + (recent.length ? "\n\nThe conversation so far follows." : "\n\nStart now with your first question.") }].concat(recent);
    const text = await aiStream(turns, bub, { cache: false });
    if (text) IV.turns.push({ role: "assistant", content: text }); else if (msg) IV.turns.pop();
    paint();
  };
  const st = $("#ivStart"); if (st) st.addEventListener("click", () => { IV.turns = []; ask(null); });
  const rs = $("#ivReset"); if (rs) rs.addEventListener("click", () => { IV.turns = []; paint(); });
  const send = () => { const i = $("#ivIn"); const t = i.value.trim(); if (!t) return; i.value = ""; ask(t); };
  const sb = $("#ivSend"); if (sb) sb.addEventListener("click", send);
  const ii = $("#ivIn"); if (ii) ii.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
};

/* ---------- CHEAT SHEET + GLOSSARY ---------- */
RENDER.cheat = function () {
  const v = $("#v-cheat");
  v.innerHTML = `<div class="eyebrow">Last-hour review</div><h2 class="h-view">Cheat sheet</h2>
  <div class="cs-grid">${(H.cheat || []).map(b => `<div class="panel"><h3>${inl(b.t)}</h3><ul>${b.items.map(i => `<li>${inl(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="row between" style="margin:24px 0 8px"><h3 style="font-size:1.2rem">Glossary</h3><label class="sr" for="gq">Filter glossary</label><input type="search" id="gq" placeholder="Filter terms"></div>
  <div class="panel"><div class="gloss" id="glist"></div></div>`;
  const paint = f => { $("#glist").innerHTML = (H.glossary || []).filter(g => !f || (g[0] + " " + g[1]).toLowerCase().includes(f)).map(g => `<div><b>${inl(g[0])}</b><span>${inl(g[1])}</span></div>`).join("") || `<p class="muted">No match.</p>`; };
  paint(""); $("#gq").addEventListener("input", e => paint(e.target.value.toLowerCase()));
};
RENDER.sources = function () {
  $("#v-sources").innerHTML = `<div class="eyebrow">Everything here was built from these</div><h2 class="h-view">Sources</h2><p class="lede">Accessed ${esc(H.accessed || "")}. ${inl(H.sourcesIntro || "Microsoft changes exams and services often: before booking, re-check the exam page and study guide for a newer “skills measured” date.")}</p>
  ${(H.sourceGroups || [{ t: "Sources", items: H.sources || [] }]).map(g => `<div class="panel" style="margin-bottom:12px"><h3>${esc(g.t)}</h3><ul class="keys">${g.items.map(s => `<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>${s[2] ? ` <span class="muted small">${inl(s[2])}</span>` : ""}</li>`).join("")}</ul></div>`).join("")}`;
};

/* ---------- init ---------- */
function boot() {
  buildShell(); header(); setSync("local");
  document.addEventListener("click", e => { const b = e.target.closest && e.target.closest(".ctab-btns button"); if (!b) return; setLangPref(b.dataset.lang); applyLang(); });
  const hash = (location.hash || "").slice(1);
  if (MID[hash]) openModule(hash);
  else if (RENDER[hash]) show(hash);
  else show(S.last && RENDER[S.last] && S.last !== "mock" ? S.last : "start");
  initSync();
  initAI().then(() => { if (AI && CURVIEW === "learn" && $("#chatLog")) bindTutor(MID[CURMOD]); });
}
boot();

})();
</script>
