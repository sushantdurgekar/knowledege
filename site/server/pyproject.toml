[project]
name = "study-hubs-server"
version = "0.1.0"
description = "Study Hubs website backend: hub serving, React shell and JSON API (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are not repeated here: requirements.in holds the exact direct pins and
# requirements.txt the full hash-locked set (see README.md). This file only carries
# metadata and tool configuration.

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".venv", "public"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "RET",      # return statements
    "PTH",      # pathlib
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; tmp paths are pytest's; fixed fake secrets and seeded
# random filler data are test inputs, not security decisions.
"tests/**" = ["S101", "S105", "S106", "S108", "S311"]
# The Postgres store splices only module constants (column lists) into SQL; every value
# is a bound parameter.
"app/store/postgres.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true
